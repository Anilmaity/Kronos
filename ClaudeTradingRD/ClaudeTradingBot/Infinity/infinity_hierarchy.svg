<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 770" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- background -->
  <rect x="0" y="0" width="1000" height="770" fill="#fafbfc"/>
  <rect x="0.5" y="0.5" width="999" height="769" fill="none" stroke="#e2e8f0"/>

  <!-- title -->
  <text x="500" y="44" text-anchor="middle" font-size="30" font-weight="700" fill="#1e293b">The Hierarchy of Infinities</text>
  <text x="500" y="72" text-anchor="middle" font-size="15" fill="#64748b">Each level is strictly larger than the one below — and the ladder never ends</text>

  <!-- vertical "increasing cardinality" arrow on far left -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <line x1="58" y1="630" x2="58" y2="118" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="34" y="380" text-anchor="middle" font-size="13" fill="#94a3b8" transform="rotate(-90 34 380)">increasing cardinality  | · |</text>

  <!-- ===================== CENTRAL LADDER ===================== -->
  <!-- box geometry: x=110 width=470 -->

  <!-- L1: large cardinals -->
  <rect x="110" y="100" width="470" height="56" rx="8" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
  <text x="345" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#b3261e">Large cardinals  —  inaccessible · measurable · …</text>
  <text x="345" y="144" text-anchor="middle" font-size="12.5" fill="#7f1d1d">their existence is not provable in ZFC</text>

  <!-- connector -->
  <line x1="345" y1="156" x2="345" y2="172" stroke="#cbd5e1" stroke-width="2"/>

  <!-- L2: tower continues -->
  <rect x="110" y="172" width="470" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="345" y="193" text-anchor="middle" font-size="16" font-weight="600" fill="#475569">⋮   the tower continues forever</text>
  <text x="345" y="211" text-anchor="middle" font-size="12.5" fill="#64748b">Cantor's theorem: the power set P(S) is always strictly bigger than S</text>

  <line x1="345" y1="222" x2="345" y2="238" stroke="#cbd5e1" stroke-width="2"/>

  <!-- L3: 2^c -->
  <rect x="110" y="238" width="470" height="52" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="345" y="261" text-anchor="middle" font-size="17" font-weight="700" fill="#3730a3">2 ^ 𝔠   =   | P(ℝ) |</text>
  <text x="345" y="280" text-anchor="middle" font-size="12.5" fill="#4338ca">all subsets of the real numbers</text>

  <line x1="345" y1="290" x2="345" y2="306" stroke="#cbd5e1" stroke-width="2"/>

  <!-- L4: continuum c -->
  <rect x="110" y="306" width="470" height="62" rx="8" fill="#e0e7ff" stroke="#3730a3" stroke-width="2"/>
  <text x="345" y="330" text-anchor="middle" font-size="19" font-weight="700" fill="#312e81">𝔠   =   2 ^ ℵ₀    —   the continuum</text>
  <text x="345" y="352" text-anchor="middle" font-size="13.5" fill="#3730a3">| ℝ |  =  | ℂ |  =  | P(ℕ) |       ·       UNCOUNTABLE</text>

  <!-- CH gap band -->
  <rect x="110" y="382" width="470" height="74" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.8" stroke-dasharray="7 4"/>
  <text x="345" y="404" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">?   Continuum Hypothesis   ?</text>
  <text x="345" y="424" text-anchor="middle" font-size="13" fill="#92400e">Is there any size strictly between ℵ₀ and 𝔠 ?</text>
  <text x="345" y="444" text-anchor="middle" font-size="12.5" fill="#92400e">UNDECIDABLE in ZFC — Gödel (1938) ⊕ Cohen (1963).   GCH ⇒ 𝔠 = ℵ₁</text>

  <!-- L6: aleph-null -->
  <rect x="110" y="470" width="470" height="62" rx="8" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
  <text x="345" y="494" text-anchor="middle" font-size="19" font-weight="700" fill="#166534">ℵ₀    —    countable infinity</text>
  <text x="345" y="516" text-anchor="middle" font-size="13.5" fill="#15803d">| ℕ | = | ℤ | = | ℚ |    ·    smallest infinite cardinal    ·    ordinal ω</text>

  <line x1="345" y1="532" x2="345" y2="548" stroke="#cbd5e1" stroke-width="2"/>

  <!-- L7: finite -->
  <rect x="110" y="548" width="470" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="345" y="578" text-anchor="middle" font-size="16" font-weight="600" fill="#475569">Finite numbers:   0, 1, 2, 3, … , n</text>

  <!-- ===================== RIGHT INFO PANEL ===================== -->
  <!-- x=632 width=336 -->

  <!-- Card A: cardinals vs ordinals -->
  <rect x="632" y="100" width="336" height="138" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="650" y="124" font-size="15" font-weight="700" fill="#1e293b">Cardinals vs. Ordinals</text>
  <line x1="650" y1="132" x2="950" y2="132" stroke="#e2e8f0"/>
  <text x="650" y="153" font-size="12.5" fill="#334155"><tspan font-weight="600">Cardinal</tspan> = how many (size):  ℵ₀, ℵ₁, ℵ₂, …</text>
  <text x="650" y="174" font-size="12.5" fill="#334155"><tspan font-weight="600">Ordinal</tspan> = order type:  ω, ω+1, ω·2, ω², …</text>
  <text x="650" y="200" font-size="12" fill="#64748b">ω, ω+1 and ω·2 are different ordinals</text>
  <text x="650" y="217" font-size="12" fill="#64748b">but all have the same cardinality, ℵ₀.</text>

  <!-- Card B: two ladders -->
  <rect x="632" y="252" width="336" height="138" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="650" y="276" font-size="15" font-weight="700" fill="#1e293b">Two ways up the ladder</text>
  <line x1="650" y1="284" x2="950" y2="284" stroke="#e2e8f0"/>
  <text x="650" y="305" font-size="12.5" fill="#334155"><tspan font-weight="600">Alephs</tspan> (cardinals in order):</text>
  <text x="664" y="324" font-size="13" fill="#166534">ℵ₀ &lt; ℵ₁ &lt; ℵ₂ &lt; ℵ₃ &lt; …</text>
  <text x="650" y="347" font-size="12.5" fill="#334155"><tspan font-weight="600">Beth</tspan> (repeated power sets):</text>
  <text x="664" y="366" font-size="13" fill="#3730a3">ℵ₀, 2^ℵ₀, 2^(2^ℵ₀), …</text>
  <text x="650" y="385" font-size="11.5" fill="#b45309">CH asks: does ℵ₁ = 2^ℵ₀ ?</text>

  <!-- Card C: countable vs uncountable -->
  <rect x="632" y="404" width="336" height="128" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="650" y="428" font-size="15" font-weight="700" fill="#1e293b">Countable vs. Uncountable</text>
  <line x1="650" y1="436" x2="950" y2="436" stroke="#e2e8f0"/>
  <text x="650" y="457" font-size="12.5" fill="#166534"><tspan font-weight="600">Countable (ℵ₀):</tspan> can be listed</text>
  <text x="664" y="475" font-size="12" fill="#64748b">ℕ, ℤ, ℚ, even / odd, squares, primes</text>
  <text x="650" y="498" font-size="12.5" fill="#3730a3"><tspan font-weight="600">Uncountable (≥ 𝔠):</tspan> cannot be listed</text>
  <text x="664" y="516" font-size="12" fill="#64748b">ℝ, ℂ  —  proven by Cantor's diagonal argument</text>

  <!-- footer -->
  <text x="500" y="724" text-anchor="middle" font-size="11.5" fill="#94a3b8">Symbols:  ℵ₀ aleph-null (countable infinity)  ·  𝔠 the continuum = 2^ℵ₀  ·  P(S) power set of S  ·  ZFC = standard axioms of set theory</text>
  <text x="500" y="744" text-anchor="middle" font-size="11.5" fill="#cbd5e1">Companion to “Infinity: The Mathematical Concept”</text>
</svg>
