id: dxy-yields-smt-pair
name: Read DXY Against The Bond / Yield Chart For SMT
definition: Rauf pairs the dollar index with the bond / yield market for SMT purposes, on
  the stated relationship that yields and DXY move together - if yields go higher, DXY goes
  higher. He says SMT is the easiest way to see real accumulation happening in the market,
  and uses the DXY/bonds pair to corroborate a bullish dollar draw before deriving the rest
  of his book from it. Separately he says that for indices he always watches three averages
  to show SMT.
category: liquidity
status: underspecified
aliases:
- bonds and dollar go hand in hand
preconditions:
- A DXY chart and a bond / yield chart on the same period.
detection_rules:
- Chart DXY alongside the bond / yield market.
- Treat rising yields as corroborating a rising dollar.
- Look for divergence between them at the same swing to read accumulation.
- For indices, use three correlated averages rather than a pair.
measurable:
- rolling correlation of DXY and the yield proxy
- forward return after a DXY/yield divergence at a swing
sources:
- video_id: qFtfD09Vv3E
  title: Live with Day Trading Rauf - Preparing for a New Week
  quote: the bonds chart and dxy go hand in hand
- video_id: qFtfD09Vv3E
  title: Live with Day Trading Rauf - Preparing for a New Week
  quote: smts are the easiest way to see real accumulation that's happening in the market
ambiguities:
- He never says whether he charts bond PRICE or YIELD, which inverts the divergence reading.
- No swing-selection rule for where the divergence must be measured.
- The claim 'if yields go higher, DXY goes higher' is stated as a constant, not a conditional
  relationship.
