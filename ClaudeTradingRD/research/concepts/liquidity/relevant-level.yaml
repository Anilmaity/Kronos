id: relevant-level
name: Relevant Level (key level / drawn liquidity)
variants:
  name:
  - Relevant Level
  definition:
  - 'This unit supplies the level-selection half of the concept and the reaction test at it.
    The candidate set is the relevant swing highs and lows inside the three-higher-timeframe-candle
    window, preferentially those that are also a higher-timeframe extreme. When price reaches
    one, he does not assume a turn: he classifies the phases of price at the level - retracement,
    reversal, or consolidation - and that classification decides whether the level produced
    a manipulation (tradeable reversal) or a breakout (continuation through). The reaction
    he wants at a relevant level is a candle 2 or candle 3 closure, with the wick or the EQ
    of that candle used as the level the candle 3 must respect.'
  - 'The gate that decides whether a counter-trend or counter-range trade exists at all. A
    level is relevant only if it is a drawn objective that price has actually reached; the
    existence of a line, a session extreme or a local swing does not make it relevant. Across
    these streams the rule appears in three places: no TGIF / weekly-range trade without a
    relevant level hit, no reversal without a relevant swing being run, and no interest in
    an asset while it sits mid-range with no relevant level in reach.

    '
definition: 'The higher-timeframe destination that price must actually reach before a return
  into the range is expected. In the TGIF video it is the gating condition of the whole setup:
  if the key level has not been hit, it does not make sense to look back into the range, because
  a continuation into that level should be expected instead. Two decay rules are given. First,
  a level that price has already traded through stops being relevant. Second, reaching a level
  is not sufficient - you must read the phases of price around it and see whether price actually
  reversed off it (a V-shape reversal) rather than merely retracing or consolidating and continuing
  through.

  '
category: liquidity
status: contested
aliases:
