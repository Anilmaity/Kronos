ambiguities:
- '''Key level'', ''relevant level'', ''higher time frame objective'' and ''the drawn liquidity''
  are used interchangeably across the series with no single definition.'
- No selection or ranking rule is given when several candidate levels exist ahead of price;
  in one example two swing highs are both marked simply because they have 'decent separation'.
- '''Hit'' is not defined as touch versus close through versus wick into - one TGIF example
  counts merely reaching into a fair value gap, another counts taking out a high.'
- The V-shape reversal test that distinguishes a real turn from a retracement is entirely
  visual and is not reduced to any candle or structure condition.
- The Thursday Counter video adds an average-daily-range feasibility check on a target, but
  gives no ADR calculation.
- Status is underspecified because the hit test and the reversal test are both stated qualitatively
  only.
- The phase classification at the level is itself visual - no rule is given for how many candles
  of lingering turn a reversal into a consolidation in this video.
- '''The wick OR the EQ'' is offered as an either/or with no precedence rule for which to
  use.'
- SMT is named once as what would license a reversal at a non-relevant level, but no SMT procedure
  is given here.
- No mechanical definition or ranking is given; relevance is decided by eye against what he
  had drawn.
- '''Key level'', ''relevant level'' and ''drawn liquidity'' are used interchangeably across
  the four streams.'
- Whether a wick into the level counts as 'hit' is not addressed.
