preconditions:
- A directional expansion is in progress with an identifiable destination ahead of it.
- Relevant swings have been marked and the look-back window applied.
- Price has traded into one of them.
- Objectives were drawn in advance of the move (previous day/week highs and lows, imbalances,
  failure swings).
detection_rules:
- 'Identify candidate levels on the daily chart ahead of price: prior swing highs or lows,
  equal highs or equal lows, fair value gaps, failure swings.'
- Discard any candidate that price has already traded through - it is no longer relevant.
- Treat the level as hit only when price reaches it.
- 'After the level is hit, classify the reaction: a V-shape reversal means the level produced
  the turn; a small retracement followed by continuation means it did not.'
- Only a level that both was hit and produced a reversal supports looking for a move back
  into the range.
- Candidate levels := relevant swing highs and lows inside the three-HTF-candle window.
- Prefer candidates that are also a higher-timeframe high or low.
- 'On the tag, classify the phase at the level: retracement, reversal, or consolidation.'
- Reversal at the level -> manipulation; trade to the other side of the range or to the failure
  swings.
- Retracement or consolidation at the level -> breakout / continuation through it.
- Require a candle 2 or candle 3 closure at the level as the actual trigger.
- Use the wick, or the EQ, of that candle as the level the candle 3 must respect.
- Without an SMT, do not anticipate a reversal at a level that is not relevant.
- Before framing a counter-range trade, confirm the drawn objective was reached. If it was
  not, the setup does not exist regardless of the structural pattern.
- 'Levels he explicitly counts: previous day high/low, weekly objectives, higher timeframe
  imbalances, failure swings, the 20-30% band of the weekly range.'
- 'Levels he explicitly does NOT mark or count: session highs and lows (London high is named
  as having no relevance), kill-zone boundaries.'
- A level in the middle of a range is not relevant - his interest is at the edges.
invalidation:
- Price takes the level and continues through it after only a small retracement - treat the
  move as a continuation, not a reversal, and trade toward the next higher-timeframe objective.
- The level was already traded through on an earlier leg.
- Price consolidates or only retraces at the level and continues through - the reversal reading
  is dead.
- The objective was never reached during the expansion - expect continuation into it instead
  of a counter move.
- The objective has already been traded through, so it no longer draws price.
measurable:
- how often a weekly expansion actually reaches its nearest untouched daily level before Friday
- conditional probability of a Friday return into the range given the level was hit versus
  not hit
- 'reaction classification frequencies at hit levels: V-shape reversal versus retracement-and-continue'
- reversal vs breakout rate at relevant levels, split by phase classification
- frequency with which a c2/c3 closure prints at a tagged relevant level
- how often a structurally valid TGIF / counter-range setup without a relevant-level hit would
  have lost
- count of days with no relevant level in reach (the stand-aside rate)
