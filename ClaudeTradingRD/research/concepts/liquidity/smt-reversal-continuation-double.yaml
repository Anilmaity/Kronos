id: smt-reversal-continuation-double
name: Reversal SMT, Continuation SMT, Double SMT
definition: SMT is a divergence between correlated markets - they should move together, so
  a difference in structure at a level is the signal. Within the fractal model SMT is classified
  by WHERE in the candle sequence it forms. A REVERSAL SMT is a divergence between candle
  1 and candle 2 (it forms at the reversal). A CONTINUATION SMT is a divergence between candle
  2 and candle 3 (this asset fails to take the extreme that the correlated one takes, during
  the continuation). A DOUBLE SMT is both present in the same sequence. All three are confluence
  only - they are looked for after a model exists, never before.
variants:
  definition:
  - 'Two Shorts, both cut from -ocfPuD_oqE (How To Use SMT Divergence), restate the reversal
    SMT. (1) AIexWKldGU4: reversing off the previous day''s high, the candle has a small wick
    (which supports expansion) and a change in the state of delivery, and gold has a reversal
    SMT with gold-euro and gold-pound. If SMT is used on candle 2, or inside the reversal
    candle before it closes, that candle must support expansion lower. In the example price
    expands to the EQ, fails it and takes the previous lows. (2) hWwyr-rTFW4: a candle 2 closure
    with a CISD, plus a reversal SMT of NQ against YM between candle 2 and candle 1, is "extra
    confirmation" for expansion lower in candle 3. The bullish reading of the same candle
    2 is rejected because price has not closed through the series of down-close candles.

    '
  - His own three-way naming for SMT by where in the sequence it forms. An SMT formed with
    the reversal is a reversal SMT. A further SMT forming afterwards, inside the continuation,
    is a continuation SMT. Both present is what he calls a double SMT. He presents this as
    his deliberately simple version and acknowledges more advanced treatments exist. Mechanically
    the reversal SMT displays on the CISD while the continuation one forms live.
category: liquidity
status: contested
aliases:
- reversal SMT
- continuation SMT
- double SMT
- two-stage SMT
preconditions:
- 'A valid model: C2 or C3 closure with the aligned lower-timeframe CISD.'
- A named correlated market (ES/NQ/YM; gold vs gold-euro / gold-pound; USDCAD vs DXY; AUDUSD
  vs NZDUSD).
- A correlated asset is being tracked alongside the traded one.
detection_rules:
- Compare the same swing on this asset and the correlated one; a difference in structure (one
  makes the higher high / lower low, the other does not) is an SMT.
- 'Reversal SMT: the divergence sits between candle 1''s extreme and candle 2''s extreme.'
- 'Continuation SMT: the divergence sits between candle 2''s extreme and candle 3''s extreme.'
- 'Double SMT: both are present.'
- 'Order of operations is fixed: find the model first, then look for SMT. Never the reverse.'
- If trading the candle 2 reversal itself, the candle must independently support expansion
  (small wick) before the SMT is allowed to count.
- SMT alone never licenses a trade - intraday confirmation that the wick has formed is still
  required.
- Reversal SMT = the divergence sits between candle 1's extreme and candle 2's extreme.
- Count it only when the reversal candle itself supports expansion (small wick) and has a
  CISD.
- SMT adds confirmation; it does not create the direction.
- SMT coinciding with the reversal (the candle 2 / CISD) = reversal SMT.
- A second SMT after the reversal, inside the continuation = continuation SMT.
- Both present = double SMT.
- The reversal SMT is marked on the CISD; the continuation SMT prints live as it forms.
invalidation:
- The setup is invalidated intraday (wrong extreme first) - the SMT does not save it.
- The correlated assets make matching highs or lows - no divergence.
measurable:
- hit rate of models with reversal SMT vs continuation SMT vs double SMT vs none
- how often SMT is present at all given a valid model
- frequency of double SMT vs single
- expansion following double-SMT sequences vs single-SMT sequences
