ambiguities:
- This is the EARLIER of two recordings of this topic; the updated playlist version (the_foundation_01)
  is the reference reading. The two agree in substance - this one is simply more elementary
  and adds no smart-money-pairing claim.
- '''Most obvious'' highs and lows is the whole selection rule and is never bounded - no swing-strength,
  separation or lookback criterion is given.'
- Whether a wick through the level counts as taken, or a close beyond is needed, is not addressed.
- The claim that stops rest at these prices is asserted from trader psychology, never evidenced.
- No rule for choosing among several untaken pools (nearest? largest? highest timeframe?).
  Examples use the visually obvious one.
- Whether a wick through the level counts as 'taken', or a close beyond is needed, is not
  stated in this video; other videos in the unit distinguish 'reach' from 'close outside'
  for bias purposes.
- The claim that stops rest at these levels is asserted from trader psychology, never evidenced.
