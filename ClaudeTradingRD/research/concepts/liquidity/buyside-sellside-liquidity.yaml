id: buyside-sellside-liquidity
name: Buyside & Sellside Liquidity
definition: 'EARLIER RECORDING of the channel''s liquidity lesson (the old Education - ICT
  playlist; the topic was later re-recorded). The definition given is the barest in the corpus:
  liquidity is simply where people''s stops are sitting, and those sit at the most obvious
  highs and lows. Stops of shorts rest above an obvious high (buyside), stops of longs rest
  below an obvious low (sellside). The lesson adds a sequencing rule the later material keeps:
  a pool being taken is not the trade, it is the cue to start looking for the trade. It also
  adds a granularity rule - you do not have to run the whole range of stops; inside a range,
  stops sit at the internal obvious highs and lows too, because a trader entering mid-range
  will not place a stop at the far end of the range.'
variants:
  definition:
  - 'Resting stop orders located beyond swing points. Traders who go long inside a move place
    protective stops beneath the swing low, so sell stops accumulate there — this is sellside
    liquidity. Traders who go short place stops above the swing high, so buy stops accumulate
    there — this is buyside liquidity. The channel''s stated premise is that smart money pairs
    its orders against these pools, which is why swing extremes are magnets rather than walls.

    '
category: liquidity
status: contested
aliases:
- where people stops are sitting
- obvious highs and lows
