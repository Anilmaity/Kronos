execution:
  bias: Price is expected to draw toward untaken pools; a pool that is taken and then rejected
    (close back inside) flips bias to the opposite pool.
  entry: Not an entry in itself — the sweep of a pool is a precondition for order block /
    breaker / CISD entries.
  stop: n/a
  targets:
  - the opposite untaken pool
