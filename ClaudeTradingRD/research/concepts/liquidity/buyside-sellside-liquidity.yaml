- liquidity pool
preconditions:
- An obvious swing high or swing low is visible on the working timeframe.
- A confirmed swing high (for buyside) or swing low (for sellside) exists.
detection_rules:
- buyside_liquidity := price of an obvious swing high (stops of shorts rest above it).
- sellside_liquidity := price of an obvious swing low (stops of longs rest below it).
- Inside a range, also mark the internal obvious highs and lows - a trader who entered mid-range
  stops there, not at the range extreme.
- A pool is 'taken' when price trades through it; once taken, stop treating it as a target.
- Only after the pool is taken do you look for the entry setup (drop to the execution timeframe).
- Untaken relatively equal highs / lows carry forward as targets for later.
- buyside_liquidity_level := price of a confirmed swing high (or the cluster price of relatively
  equal highs).
- sellside_liquidity_level := price of a confirmed swing low (or the cluster price of relatively
  equal lows).
- The pool is 'taken'/'swept' when price trades through the level; the speaker then reassigns
  attention to the next untaken swing in that direction.
- 'Additionally always mark, as standing pools: previous week high/low, previous day high/low,
  and session (Asia/London) highs and lows.'
invalidation:
- Once the level is traded through it stops being a target and attention moves to the next
  untaken pool.
- Once price trades through the level, that pool no longer exists as a target.
measurable:
- frequency with which an obvious high/low is traded through within N bars of being marked
- hit rate of the 'once taken, look for the setup' sequencing versus entering before the sweep
- hit rate of an untaken swing pool being traded through within N bars
- frequency of sweep-then-close-back-inside vs sweep-and-continue
