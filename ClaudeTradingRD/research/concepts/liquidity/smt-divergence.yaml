id: smt-divergence
name: SMT Divergence
variants:
  name:
  - SMT Divergence (as confluence only)
  - SMT (one correlated asset takes the level, the other does not)
  definition:
  - 'A divergence between correlated assets at a shared level: one asset takes the level and
    the other does not. In these streams SMT is used strictly as a confirmation of an already-formed
    higher-timeframe bias and as an input to the relative-strength ranking. It is explicitly
    not a trade trigger, and a failed SMT against the standing bias is treated as irrelevant
    rather than as a signal.

    '
  - 'Two refinements stated live. (1) A STRUCTURAL SMT - correlated assets diverging at a
    range low or high, e.g. silver running out a range low while gold does not - is a different
    thing from the SMT inside the model''s swing point, and may be read before the model''s
    candle closes. His videos'' rule to look for SMT only after a C2/C3 closure applies to
    the swing-point type, and exists to stop people shorting a bare SMT. (2) SMT is confirmed
    by a change in the state of delivery. Worked example: gold forms a C2 reversal with silver
    taking the range low and gold not, so gold (closer to the highs, strongest) is the long
    toward the range high; he would not have bought gold until silver ran the low (around
    15:00 the previous day). Counter-trend framing off a set of highs needs the correlated
    asset to sweep a high first - without that SMT he will not short against the highs.'
  - 'SHORTS EVIDENCE giving the plainest definition in the corpus. Correlated assets normally
    print SIMILAR STRUCTURE - one puts in a low, the other puts in a low; one puts in a higher
    low, the other puts in a higher low. An SMT is the moment one asset DIVERGES from the
    other: while one makes a low and then a higher low, the other makes a low and then a LOWER
    low. The bearish mirror is one making a high and a higher high while the other makes a
    high and a lower high.'
  - 'A disagreement between two correlated instruments at the same structural point: one makes
    a higher high (or lower low) while the other fails to. The speaker describes it as a crack
    in the correlation. In this unit it appears only as a confluence/filter, never as a standalone
    lesson — the dedicated SMT video listed for this study unit has no transcript available.

    '
  - 'Restated as the first and easiest input to relative strength: between correlated assets,
    a difference in structure at the same high or low (one takes it, the other does not).
    He adds that several SMTs on different timeframes can exist at once in the same leg.

    '
  - 'A timeframe-trust limit stated in his own voice: he does not trust a 3-minute SMT between
    gold and silver, and is not a fan of using a 1-minute SMT to frame a whole idea. On the
    gold invalidation day he used a small SMT off a swing (timeframe not marked on screen)
    as the reason for expecting the move lower, while a 1-minute silver SMT that was present
    was acknowledged but not relied on.

    '
  - 'A divergence between correlated instruments at the same level, used here both as the
    reason a trade exists and as the trigger inside it. The construction is simple and binary:
    at a shared reference level - the previous day low, or an intraday swing low - one asset
    trades through the level and the other does not. In the ES scalp, NQ takes the previous
    day low while ES and YM do not, which simultaneously marks NQ as the weakest asset and
    establishes that the level is being swept rather than broken. The same divergence is then
    used again on the 1-minute chart: NQ takes an intraday low, ES does not, and that divergence
    is what makes the subsequent close back over the opposing candle a valid entry rather
    than noise. SMT is also listed as one of the three inputs for ranking relative strength.

    '
  - 'This unit gives the mechanical version. SMT is defined as a divergence between the assets,
    and it is only marked when it occurs within the swing point being framed. The default
    correlation set is stated outright: for NQ he uses ES and YM. Custom pairs can be substituted,
    and an ''inverse'' option exists for negatively correlated pairs such as dollar against
    euro. The mark is event-driven and live: nothing prints until the correlated asset actually
    takes the level the traded asset failed to take.'
  category:
  - structure
definition: 'TWO DEDICATED PRIMARY-SOURCE LESSONS in this unit, and between them they reduce
  SMT to its minimal decidable test: pick ONE level that both correlated assets are trading
  at; one asset breaks it and the other does not - that is the divergence. Framed structurally:
  correlated assets normally print the same structure (lower low against lower low, lower
  high against lower high); an SMT is where one of them diverges, e.g. a higher low against
  a lower low. An SMT at the LOWS is bullish and an SMT at the HIGHS is bearish, in both cases
  signalling a possible reversal. He prefers the 15-minute for spotting them but uses the
  1-minute often, and he wants the divergence to occur at a liquidity grab or a point of interest
  rather than in open space.'
