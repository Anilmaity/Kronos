ambiguities:
- 'No comparison window is given: ''a certain high we are watching'' is chosen visually and
  no rule bounds how far apart in time the two assets'' reactions may be.'
- No tolerance is stated for an exactly equal high/low.
- The correlated set is never enumerated beyond ES, NQ and YM in these two videos.
- How far back an SMT can have printed and still count for the current decision candle is
  not bounded.
- He says a bearish SMT that failed 'is nothing' because he was bullish - so SMT is asymmetric
  relative to bias, but no rule states when a contrary SMT should change the bias.
- '''Structural SMT'' is a one-off label in this stream; its exact boundary versus the swing-point
  SMT is shown on chart, not defined.'
- Whether the compared swing points must be time-aligned candle-for-candle is not stated.
- This Short gives the definition only - it says nothing about SMT being confluence rather
  than a signal, which other units in the library insist on.
- The dedicated video 'SMT Divergence - ICT Concepts' (27S9gjgcSlI) is listed in this study
  unit but its transcript was NOT downloaded, so no definitional detail is available — this
  entry is deliberately thin.
- No rule for the comparison window (same bar? same session? same swing?).
- No list of which instrument pairs are considered correlated enough.
- No tolerance for 'higher/lower' — an exact-equal high is not addressed.
- No rule for conflicting SMTs across timeframes is given; the example only shows agreeing
  ones.
- No lowest trusted timeframe is stated; only 3m (with silver) and 1m are excluded.
- Elsewhere in the library he names gold-in-euro/pound rather than silver as gold's correlate;
  here he reads silver anyway.
- No tolerance is given - how far one asset must exceed the level, or how close the other
  may come without counting as having taken it, is unstated.
- The reference levels used are previous day low and an intraday swing low; whether SMT is
  valid at any level or only at specific ones is not addressed here.
- Waiting for the correlated asset's candle to close is stated for this trade and not generalised.
- The auto-captioner writes NQ as 'MQ' in the quoted line; the surrounding discussion makes
  the instrument unambiguous.
- '''Within the swing point'' is not bounded in bars or price.'
- The library entry for this id is contested across units; this unit adds mechanics, not a
  resolution of that dispute.
