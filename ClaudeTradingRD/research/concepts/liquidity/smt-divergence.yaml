preconditions:
- Two correlated assets are charted on the same time axis (ES/NQ/YM are the pairs used).
- Two or more correlated assets (ES/NQ/YM, or DXY vs a currency future) with a shared reference
  level.
- A higher-timeframe directional bias already established.
- Two correlated assets are charted on the same timeframe.
- 'Two correlated instruments (examples used: NASDAQ vs ES, YM vs NQ).'
- A shared reference swing point in time.
- Two or more correlated instruments (YM, ES, NQ) charted together.
- A shared reference level - previous day low/high, or an intraday swing.
- Two or three correlated assets displayed with a shared level.
detection_rules:
- Choose one shared level (a swing high or swing low) visible on both assets.
- SMT exists when one asset trades beyond that level and the correlated asset does not.
- Divergence at the lows = bullish SMT (possible upside reversal). At the highs = bearish
  SMT.
- Prefer the 15-minute for identification; the 1-minute is used but is noisier.
- Require the divergence to coincide with a liquidity grab or a point of interest that price
  is reaching for.
- The same test applies inside a fair value gap - see smt-in-fair-value-gap.
- At a shared level, one asset trades beyond it and the correlated asset does not.
- The asset that failed to take the level is the stronger one on that side.
- SMT printed prior to the decision candle counts; it does not have to print on the decision
  candle itself (yud7TpE2AMs).
- Establish that the two assets normally track each other structurally.
- 'Bullish SMT: asset A makes low then higher low; asset B makes low then LOWER low.'
- 'Bearish SMT: asset A makes high then higher high; asset B makes high then LOWER high.'
- The divergence itself is the SMT - no additional confirmation is defined in this Short.
- 'Bearish SMT (as demonstrated): at the same time window, instrument A prints a LOWER high
  while instrument B prints a HIGHER high.'
- 'Bullish SMT (implied by the mitigation-block use case): at the same low, one instrument
  sweeps the prior low while the other does not.'
- 'Use 1: as top-down confluence for a directional bias (NASDAQ lower high vs ES higher high,
  ahead of a move to previous month''s low).'
- 'Use 2: as the ONLY condition under which the speaker will trade a mitigation block — the
  correlated instrument swept (so it has a breaker) and the unswept instrument should therefore
  not reach that low.'
- Identify the shared level on both instruments.
- SMT exists when one instrument trades beyond the level and the correlated instrument does
  not.
- 'Bullish SMT at a low: the weaker asset takes the low, the stronger holds above it.'
- 'Bearish SMT at a high: the weaker asset fails to make the high the stronger one makes.'
- Require a reversal closure on the asset that took the level before acting.
- Where SMT governs timing, wait for the diverging asset's candle to close before entering.
- 'Default set for NQ: ES and YM. Custom pairs may be substituted.'
- For negatively correlated pairs, use the inverse setting.
- SMT is only marked when the divergence sits inside the swing point being framed.
- The mark prints at the moment the correlated asset takes the level (live), not retrospectively.
invalidation:
- The diverging asset subsequently takes the level the other one took; the divergence is gone.
- SMT taken in isolation, without a higher-timeframe bias, is treated as invalid reasoning
  rather than a failed pattern.
- SMT occurring away from a relevant level does not create a framework.
- Not stated.
- The asset that held the level subsequently trades through it - the divergence is resolved
  and gone.
- Both assets take the level - no divergence.
measurable:
- reversal rate after an SMT at a liquidity grab vs one in open space
- 15m vs 1m SMT counts and their hit rates
- Expectancy of SMT-confirmed setups vs SMT-absent setups, holding the bias constant.
- Frequency of SMT that 'fails' (both assets subsequently take the level).
- frequency of SMT prints per session per correlated pair
- hold rate of the divergent extreme
- hit rate of mitigation blocks with SMT vs without (the video's explicit claim)
- frequency of SMT at session/day extremes on correlated index pairs
- frequency of previous-day-extreme SMT per week across YM/ES/NQ
- follow-through after SMT with a reversal closure vs SMT without one
- R achieved entering the non-sweeping asset vs the sweeping asset
- frequency of SMT at swing points by correlation set
- outcome with SMT present vs absent at the same setup
