ambiguities:
- '''Relatively equal'' has no numeric tolerance anywhere in the unit — this is the blocking
  gap for detection.'
- Whether 'failure swing' and 'relatively equal high' are the same thing is never stated;
  they are used interchangeably in the mitigation-block video.
- No rule for how many swings make a cluster, or a maximum bar distance between them.
- This is the earlier recording of the liquidity lesson; the tolerance that makes two highs
  'relatively equal' is not given here either, so the corpus-wide gap is unchanged.
- No rule for choosing between two untaken clusters when both are open.
- '''Later'' is not bounded - no expiry is given for a cluster carried forward.'
- 'The stance is not consistent across the unit: asked in G1IIdQ3RAkY whether equal lows make
  an SMT ''sus'', he answers that it still swept it and he does not really care that much,
  whereas in m8xcjkOuBHU equal highs are the stated reason for refusing the trade. The reconciling
  factor he offers is distance — it matters if you are trading right there.'
- '''Relatively equal'' has no tolerance in ticks or percentage; the judgement is visual.'
- Two highs versus three is not distinguished — he says 'three equal highs' but treats two
  equal lows the same way.
- How far away is far enough for them to stop mattering ('not even close to it') is not quantified.
