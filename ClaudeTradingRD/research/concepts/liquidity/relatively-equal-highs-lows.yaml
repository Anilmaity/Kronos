id: relatively-equal-highs-lows
name: Relatively Equal Highs / Lows
definition: 'Two or more swing points at approximately the same price, treated as a single,
  heavier liquidity pool. The speaker forms them in two ways: when a new low fails to trade
  below the previous low, the two lows become ''relatively equal'' and are treated together;
  and when several highs cluster at the same price. He also calls repeated highs that fail
  to make a new extreme ''failure swings'', and states these are precisely what he targets.

  '
variants:
  definition:
  - 'EARLIER RECORDING. Relatively equal highs and lows are clusters of swing points at approximately
    the same price. The claim made here is purely about what they are FOR: once formed and
    left untaken, they become targets for later. The worked example marks two such clusters,
    observes that neither has been hit, runs one of them, and then carries the other forward
    as the target for a subsequent short.'
  - 'In the m8xcjkOuBHU session equal highs become the reason a whole afternoon is stood down.
    ES prints three equal highs; he calls them "sus", says an SMT there is not enough, and
    states repeatedly that he will not trade away from three equal highs or from those failure
    swings — the expectation is that such a level gets run again rather than holding, so it
    cannot be used as the level to trade away from. The positive form he gives is that ES
    should go back and take them out, which in turn means the strongest asset is not reversing.
    Once price has already reversed and is in a continuation well away from them, he says
    he no longer cares about them.

    '
category: liquidity
status: contested
aliases:
- equal highs
- equal lows
- relatively equal highs
- failure swings
- relative equal highs
- relative equal lows
- three equal highs
- sus
preconditions:
- At least two swing points of the same type exist within a small price distance.
- Two or more swing points sit at approximately the same price.
- Two or more highs (or lows) at effectively the same price on the working timeframe.
detection_rules:
- Given consecutive swing lows L1, L2 with |L1 - L2| <= TOL, treat min(L1,L2) as a single
  sellside pool. Mirror for highs.
- 'Alternative formation stated: a new swing low that does NOT trade below the previous swing
  low creates the equal-lows pair.'
- A cluster of 3+ highs at similar price is 'relatively equal highs'.
- TOL is NOT specified by the source — must be chosen externally (points / pips / ATR fraction).
- Mark clusters of highs (or lows) at approximately the same price as one pool.
- If the cluster has not been traded through, carry it forward as a target for later.
- After taking one cluster, the remaining untaken cluster on the opposite side becomes the
  next objective.
- Mark relatively equal highs/lows as liquidity to be run, not as a level to trade away from.
- Do not take a reversal whose invalidation sits behind equal highs, even with an SMT present.
- Expect the equal level to be swept again; treat that sweep as the more likely path.
- Once price has reversed and is in a continuation away from them, they stop being a constraint.
invalidation:
- The pool is consumed when price trades through the cluster.
- The cluster is traded through - it is no longer a target.
- The equal level is taken out and price closes decisively away from it — the liquidity is
  gone.
measurable:
- hit rate of an equal-lows cluster being traded through within N bars vs a single swing low
- sensitivity of detected cluster count to the tolerance parameter
- share of untaken equal-high/low clusters that are reached within N days of formation
- time-to-target distribution for clusters carried forward
- frequency with which equal highs/lows are swept within N bars
- outcome of reversals taken away from equal levels versus away from a single swing
