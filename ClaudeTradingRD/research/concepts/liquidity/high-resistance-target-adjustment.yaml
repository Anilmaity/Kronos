id: high-resistance-target-adjustment
name: Do Not Target A High-Resistance Extreme Directly
definition: 'The operational half of the low/high resistance lesson, and it is a concrete
  target-substitution rule. When the level you would otherwise target is HIGH RESISTANCE -
  price already swept it before reversing, and in his example took it, closed back inside,
  then opened and closed back inside again - do not use that extreme as the target. Substitute
  one of two nearer levels: the FAILURE SWING that formed just after it, or the CONSEQUENT
  ENCROACHMENT (50%) OF THE WICK left when price closed back into the range. His stated reason
  is that the high-resistance extreme is much harder to break through than the low-resistance
  liquidity on the other side, so he would rather save the time and exit at the nearer level.'
category: liquidity
status: specified
preconditions:
- The prospective target level has already been swept once and price closed back inside.
detection_rules:
- 'Classify the prospective target: swept before reversing = high resistance.'
- 'Substitute target A: the failure swing that formed immediately after that sweep.'
- 'Substitute target B: the consequent encroachment (50%) of the wick created when price closed
  back into the range.'
- Where equal lows/highs sit alongside the failure swing, take the cluster as the exit.
- Do not hold through the substitute level to reach the original high-resistance extreme.
measurable:
- reach rate of the failure-swing target vs the high-resistance extreme
- time in trade to each
sources:
- video_id: 2lIaRUtJqpU
  title: Low Resistance Liquidity Run - ICT Concepts
  quote: this is generally when I want to look for the failure swing above it
- video_id: 2lIaRUtJqpU
  title: Low Resistance Liquidity Run - ICT Concepts
  quote: using the CE of the wick after price closed back into this range
- video_id: 2lIaRUtJqpU
  title: Low Resistance Liquidity Run - ICT Concepts
  quote: high resistance liquidity does not have a failure swing
ambiguities:
- No rule chooses between the failure swing and the wick CE when both exist.
- The wick whose CE is taken is the one from the close-back-inside candle; whether a later,
  larger wick would replace it is not stated.
