id: smt-as-confirmation-not-signal
name: SMT As Confirmation, Not Signal
variants:
  name:
  - SMT As Confirmation, Not As A Signal
  definition:
  - 'SMT between correlated assets is a filter, never a trigger and never a source of bias.
    Bias comes from the higher timeframe narrative. Two rules bound it: SMT alone is not a
    trade and must be confirmed by a change in state of delivery, and the absence of SMT will
    not stop him from taking a setup that his higher timeframe framework supports. The named
    failure mode is people entering on the SMT itself and being run over as price continues.

    '
  - 'SMT divergence is used to confirm that a swing extreme has printed, not as a trade trigger
    in itself. Its value is that at the moment a wick is being printed the candle in development
    still looks like it is going the wrong way; the correlated market failing to make the
    matching extreme is what allows the extreme to be trusted. Two further restrictions are
    stated across the unit: SMT is meaningless without displacement in the direction of the
    expected order flow, and every reversal should be paired with an SMT rather than SMT being
    traded on its own.

    '
definition: 'THE TWO SMT VIDEOS IN THIS UNIT DISAGREE WITH EACH OTHER, and both readings are
  recorded. Reading A (q1NmxUTm4n4, the longer lesson): SMT is a confluence to an already
  existing model - when it forms he goes looking for a lower-timeframe entry model, and the
  SMT itself is never the trigger. Reading B (eHQ4nE-TQ2w): SMT can be traded DIRECTLY - enter
  on the diverging asset with the stop at the diverging low/high, because if that level is
  taken the divergence is invalidated. He presents B as one of two ways to trade an SMT, the
  second being the lower-timeframe structure-shift-plus-fair-value-gap entry, which he calls
  the safer of the two but notes it ''may not always present itself''.'
category: liquidity
status: contested
aliases:
- SMT divergence
- SMT confluence
- SMT is a confirmation tool not a synchronization tool
preconditions:
- Two or more correlated assets (YM/ES/NQ, gold vs a correlated metal, oil vs gasoline).
- A higher timeframe narrative already exists - SMT is checked after, not before.
- A correlated instrument is being watched alongside the traded one (NQ/ES/YM, gold/silver,
  CL/HO/RB, EU/GU).
- Price is at a same-or-higher timeframe PD array or key level.
detection_rules:
- 'Reading A: on SMT, do not enter. Drop to a lower timeframe and take the entry from an existing
  model (deviation/box setup, structure break plus fair value gap, order block).'
- 'Reading B, direct entry: enter on the asset that is diverging, stop beyond the diverging
  low (bullish SMT) or high (bearish SMT).'
- 'Reading B, confirmed entry: after spotting the SMT, wait on the 1-to-5-minute chart for
  a market structure shift and a return to the fair value gap it leaves.'
- The confirmed entry is described as safer but as not always available.
- One asset makes a new high/low while the correlated asset fails to - that is the SMT.
- Do not enter on the divergence. Wait for a CISD / order block formation before acting.
- 'SMT that appears in the wrong place is a warning, not a signal: when a correlated asset
  has already run the equivalent high and the traded asset has not, he reads it as the traded
  asset likely running to that high instead.'
- SMT can be used to validate a series of opposing candles as an order block (the oil/gasoline
  TGIF case).
- Traded instrument makes a new extreme (sweeps a prior high or low); the correlated instrument
  fails to make the matching extreme.
- Treat this as confirmation that the wick of the candle in development is printed.
- Require displacement in the expected direction after the divergence before acting on it.
invalidation:
- No confirming CISD after the divergence.
- The divergence resolves by the lagging asset catching up rather than by a reversal.
- No displacement follows the divergence.
- Both instruments make the matching extreme (no divergence).
measurable:
- win rate and R of the direct SMT entry vs the confirmed LTF entry on the same divergences
- win rate of SMT-plus-CISD entries vs SMT-only entries
- how often SMT resolves by catch-up rather than reversal
- outcome of setups with vs without SMT present, holding the framework constant
- hit rate of a swing extreme holding when confirmed by SMT vs unconfirmed
- how often SMT without displacement precedes continuation instead of reversal
