ambiguities:
- The two videos are both in this older playlist and are not reconciled by the speaker.
- The later canon sides with Reading A (SMT as confirmation), so Reading B is the earlier
  and apparently superseded position - but it is the only place the corpus gives SMT its own
  invalidation level, which makes it independently useful.
- No rule says when the direct entry is permitted and when the confirmed entry is required.
- The two statements - 'we need CISD to confirm SMT' and 'SMT is not going to stop me taking
  a setup' - are only compatible if SMT is strictly a filter; he does not say this explicitly.
- He says SMT is fractal (usable on daily or 5-minute) but gives no rule for which timeframe's
  SMT matters for a given setup.
- He does not use contract-vs-contract SMT (MNQ vs NQ) and does not study whether SMT behaves
  differently around news.
- Which correlated instrument is canonical for a given market is shown only by example.
- '''Displacement'' is not quantified in any of the three talks.'
- DexterLab's phrase 'no synchronization tool' is ASR-garbled; the intended contrast appears
  to be confirmation vs timing.
