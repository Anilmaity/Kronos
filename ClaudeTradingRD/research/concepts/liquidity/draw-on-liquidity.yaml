id: draw-on-liquidity
name: Draw On Liquidity (DOL)
variants:
  name:
  - Draw On Liquidity (previous day high / low as objective)
  - Draw On Liquidity
  definition:
  - 'The channel''s default and, in his words, easiest draw: unless price is going to stay
    in a consolidation where it fails to take either side of the range, it is going to reach
    for previous day high, previous day low, or both. The daily-chart question he asks himself
    is therefore binary - is price more likely to reach previous day high or previous day
    low - and answering it yields both a bias and a target, after which he drops to a lower
    timeframe to frame an entry. He credits the MMXM Trader for the teaching.'
  - 'The standing objective price is expected to reach, taken in practice from the daily chart:
    previous day high and previous day low first, then relevant separated daily swing highs
    and lows, then equal highs/lows. Its main operational use in these streams is as a gate
    on late-day trading: if the day has already expanded, the only reason to still take a
    setup is that an objective remains open, and such a trade is taken with lowered expectations.

    '
  - 'The specific price level price is currently expected to travel to. It is always an identified
    liquidity pool or PD array — previous day/week/month high or low, a session extreme, a
    swing point, relatively equal highs/lows, or a fair value gap — never a vague direction.
    In this corpus the draw is what a bias resolves to, and a bias is held "until we reach
    our draw on liquidity".

    '
definition: 'EARLIER RECORDING (old ''Education - ICT'' playlist; later re-recorded as FXJBFbZQbck,
  which reduces the whole thing to previous day high / previous day low). This earlier version
  is a broader SEARCH LIST rather than a binary. He looks for external liquidity (old highs
  and lows, equal highs and lows), then internal liquidity (fair value gaps, order blocks,
  and occasionally volume imbalances or gaps in price), and then adds two behavioural reads
  on top: where price FAILS TO DISPLACE over a low or high, and where price IS displacing
  to - following the displacement is ''generally right''. The draw is established each morning
  and then used as the target that keeps him in a lower-timeframe position when the noise
  argues against it.'
category: liquidity
status: contested
