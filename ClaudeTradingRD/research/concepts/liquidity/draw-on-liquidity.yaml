preconditions:
- The execution timeframe is fixed first - the draw timeframes are chosen relative to it.
- Previous day high and low are marked; price is not inside a consolidation that fails to
  take either side.
- A daily chart with marked previous day high/low and separated swing levels.
- At least one untaken liquidity level or unfilled fair value gap exists in the direction
  under consideration.
detection_rules:
- 'Choose the draw timeframes relative to the entry timeframe: entering on 5-minute and lower
  -> daily, 4-hour and 1-hour supply the draw.'
- Entering on the 1-hour -> look up to the weekly and monthly instead.
- 'External candidates: old highs, old lows, equal highs, equal lows.'
- 'Internal candidates: fair value gaps, order blocks, occasionally volume imbalances / gaps
  in price.'
- 'Behavioural read 1: failure to displace over a low or high argues for the opposite side
  as the draw.'
- 'Behavioural read 2: follow the displacement - the side price is displacing toward is generally
  the draw.'
- Once the draw is set, use it to hold through lower-timeframe noise rather than to time the
  entry.
- Mark previous day high and previous day low.
- Ask which is more likely to be reached; that answer is the draw and the target.
- If price is trending up, anticipate previous day high being taken; if trending down, previous
  day low.
- Stay out of consolidations - the rule is stated as conditional on price not remaining range-bound.
- When actually watching price, extensions beyond previous day high and below previous day
  low are also used as targets, not just the levels themselves.
- If the target is already taken (e.g. the Asia session took previous day high), the day is
  not traded in the later session.
- Mark previous day high and previous day low; these are the easiest and default objectives.
- Mark relevant separated daily swing highs/lows and equal highs/lows as secondary objectives.
- Filter every objective against the eyeballed average daily range.
- If the day already expanded and no objective remains open, do not trade.
- If an objective remains open, the setup may be taken on a lower timeframe with reduced expectations.
- Candidate draws := {untaken previous day/week/month high & low, untaken session highs &
  lows, untaken swing points, relatively equal highs/lows, unfilled fair value gaps}.
- 'Selection heuristics stated: prefer the previous-period level on the current timeframe
  first; when those are consumed, look left to swing points; trend biases which side.'
- 'The draw alternates by construction under the internal/external rotation: after external
  is taken, the draw becomes the internal FVG, and vice versa.'
- 'Confluence rule stated repeatedly: prefer a draw that coincides with a standard-deviation
  projection level of the manipulation leg.'
invalidation:
- Price displaces through the level that was the draw - the next PD array becomes the draw.
- Price remaining in a consolidation that takes neither side of the range.
- The draw already having been reached earlier in the day.
- The objective is reached - subsequent setups toward it are invalid (see continuation-failure-short-term-target).
- The draw is consumed when price trades to it; a new draw must then be selected.
- A failure to displace at an intermediate level flips the draw to the opposite side.
measurable:
- hit rate of the nominated draw being reached the same day
- relative accuracy of the failure-to-displace read vs the follow-the-displacement read
- how often the draw sequence chains (one PD array reached, next one nominated)
- share of days that take previous day high, previous day low, both, or neither
- how often the draw is already taken before the New York session opens
- accuracy of the trend-based choice (see trend-by-previous-day-extremes)
- Rate at which previous day high/low is reached, by day type.
- Expectancy of late-day setups toward a still-open objective vs the same setups earlier.
- hit rate of the selected draw being reached before the opposite candidate level
- median time (bars/sessions) from selection to reaching the draw
