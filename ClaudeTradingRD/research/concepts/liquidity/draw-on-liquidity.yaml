ambiguities:
- 'EVOLUTION, NOT CONTRADICTION: the later FXJBFbZQbck collapses the draw to a binary between
  previous day high and previous day low; this earlier recording keeps an open list of PD
  arrays with no ranking. Both readings preserved; the later one is canon for the simplified
  form.'
- No precedence rule among the candidate levels - 'the next PD array that draws my eyes'.
- '''Displacing'' / ''fails to displace'' are used without a threshold.'
- '''The occasional volume imbalance'' is admitted as a discretionary extra.'
- '''Consolidation'' is the single exception to the whole rule and is never defined or bounded
  here.'
- Where both previous day high and low are taken in the same day, no rule orders them.
- '''Extensions beyond'' previous day high/low are used as targets with no projection method
  given.'
- Having a bias on nearly every day is explicitly not the same as having a trade - he says
  an entry is not always available.
- '''Lowered expectations'' for the late setup is not quantified in target or size.'
- Which of several open objectives takes precedence is chosen by eye plus the range filter.
- He flags the case where BOTH previous day high and low are taken before New York as an unsolved
  question he intends to make a video about.
- Selection among multiple candidate draws is discretionary; no ranking rule is given beyond
  timeframe order and trend.
- No time limit on how long a draw stays valid.
- The same level is used both as a draw and as a reversal point; nothing in the videos decides
  in advance which role it will play — only the reaction (displacement vs rejection) tells
  you, after the fact.
