ambiguities:
- Neither speaker gives a timeframe floor below which SMT should be ignored - Finessee_Fx
  warns about 1m and 5m but never rules them out formally.
- Ben says he checks SMT 'in zones' without defining how large a zone or how long the window
  is.
- Neither states what to do when the SMT and the setup disagree.
- A third guest in this unit (Trader T) simply cannot run SMT in his backtesting software
  because it will not display DXY alongside the pair, so his SMT rules are untested in his
  own sample.
- 'Contested: the two primary sources give opposite guidance on intra-range SMT and neither
  acknowledges the other.'
- No rule in any source for choosing the reference instrument.
- Neither speaker defines how far apart the two instruments' extremes must be for divergence
  to count.
- Sniper's 1-minute SMT usage sits inside AP's explicitly excluded category.
