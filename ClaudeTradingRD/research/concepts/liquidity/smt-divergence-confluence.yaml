id: smt-divergence-confluence
name: SMT Divergence As Confluence
definition: 'Both guests in this unit demote SMT from a signal to a confirmation, and both
  give the same reason. Finessee_Fx warns explicitly against the habit of hunting SMT on the
  1-minute and 5-minute all day - he says that is exactly what he did when Michael (ICT) first
  taught him divergences and it got him burned - and demonstrates SMT instead on a WEEKLY
  candle, where EURUSD filled its weekly fair value gap and tagged its weekly order block
  while the Dollar Index never traded below its own low, never hit its block and never filled
  its gap. Ben says he definitely uses SMT but that it is explicitly not a leading indication
  for him - it is a secondary confluence, checked in zones, using SPY against NASDAQ and DXY
  against the majors.

  '
variants:
  definition:
  - 'Correlated-instrument divergence (NQ versus ES, NQ versus YM) used as a supporting signal.
    The two speakers who use it in this unit disagree fundamentally on WHERE it counts: one
    uses it at every scale including inside ranges and on 1-minute charts, the other discards
    intra-range SMT entirely and only counts divergence at structural extremes.

    '
category: liquidity
status: contested
aliases:
- divergence
- SMT on the higher timeframe
- smart money divergence
- SMT
preconditions:
- 'A correlated reference instrument is chosen: Finessee_Fx uses the Dollar Index against
  EURUSD; Ben uses SPY against NASDAQ and DXY against AUDUSD / EURUSD / GBPUSD.'
- A zone / PD array is already in play - Ben checks SMT only in zones, not continuously.
- Two correlated instruments are charted side by side (NQ/ES or NQ/YM in the examples).
detection_rules:
- 'Compare the two instruments at the same PD array: one makes the higher high (or lower low)
  and reaches / fills its array while the other fails to.'
- 'Finessee_Fx''s worked form: the primary filled its weekly fair value gap and hit its weekly
  order block; the reference never traded below its low, never hit the block and never filled
  the gap - the reference is therefore failing to make the lower low, which shows the aggression.'
- 'Do NOT trade the divergence on its own - it is confirmation for a setup that already exists
  (Ben: secondary confluence, not leading).'
- 'Finessee_Fx''s negative rule: hunting divergences on the 1-minute and 5-minute all day
  is the failure mode, not the method.'
- 'Sniper''s reading: when price runs into a higher-timeframe internal or external range level,
  check whether the correlated instrument failed to make the matching high or low. Divergence
  there is an ''extra confluence booster'' for the timeframe-aligned entry. He applies this
  at daily and weekly levels and again inside 1-minute up-close candles.'
- 'AP''s reading: intra-range SMT is ignored (''you can scalp it'' but it is not the true
  focus). SMT matters only at extremes - specifically, did one index take or mitigate a weak
  high or a swing while the other failed to.'
- AM Trades uses SMT as one component of the pre-entry signature on a news candle, without
  a stated placement rule.
invalidation:
- The lagging instrument catches up and reaches its own array - the divergence is gone.
- The divergence resolves - both instruments make the matching extreme.
measurable:
- expectancy of the same entries with and without an SMT confirmation, split by the timeframe
  the SMT is read on
- false-positive rate of 1-minute and 5-minute SMT versus weekly SMT (Finessee_Fx's warning,
  made testable)
- hit rate of the base entry with versus without SMT present, split by whether the SMT formed
  intra-range or at a structural extreme - this directly tests the disagreement
- frequency of intra-range SMT versus extreme SMT per session
