ambiguities:
- Whether 'double inside day' means two consecutive inside days or simply an inside day that
  has taken neither side is ambiguous from the caption ('previous days high, previous day's
  high').
- Which EQ (previous day, or the current range) is meant is not stated.
- He states elsewhere in the same stream that he has a mechanical procedure for trading an
  inside day but deliberately will not publish it, so the actual inside-day entry model is
  missing from the corpus by design.
- What does count as invalidation of the bias on an inside day is never given — only that
  the EQ close is not it.
- Whether the EQ used is the previous day's body EQ or full-range EQ is not stated here.
