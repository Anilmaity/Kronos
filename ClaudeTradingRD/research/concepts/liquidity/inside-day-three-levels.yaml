id: inside-day-three-levels
name: Inside Day — Only Three Points Of Interest
definition: 'Adds the double inside day case: when neither side of the previous day''s range
  has been taken (he calls the session a double inside day) the day is consolidation by definition,
  and his stated expectation is that price sits around the EQ and the opening price.'
variants:
  definition:
  - 'Restated for an index inside day: the only reference points are previous day high, previous
    day low and the EQ; a reaction around the EQ gives potential for a move lower.'
  - 'When the current daily candle is an inside day (its range contained by the previous day''s),
    he reduces the chart to exactly three levels and refuses to use anything else: previous
    day high, previous day EQ, and — only if the EQ fails — previous day low. He states the
    cut-off plainly: "I only have three points of interest. That''s all I''m looking for."
    In the session shown, price traded below previous day EQ intraday and he did not treat
    that as an invalidation of the bullish bias, reading it instead as a sweep of the liquidity
    resting around the EQ of the range, and stayed bullish to previous day high.

    '
category: liquidity
status: contested
aliases:
- double inside day
- previous day high, previous day low, EQ
- previous day high, previous day EQ, previous day low
- stuck inside day
preconditions:
- Current day has taken neither previous-day high nor previous-day low; previous day was itself
  inside.
- The current daily candle is inside the previous daily candle's range.
detection_rules:
- 'Double inside day: two consecutive daily ranges each contained by the prior one.'
- On such a day expect price to oscillate around the range EQ and the daily opening price.
- On an inside day mark only PDH, PDL and the EQ.
- On an inside day, mark only previous day high, previous day EQ and previous day low.
- Do not add intraday fair value gaps or other arrays as points of interest on such a day.
- 'Work from the EQ first: a reaction there projects toward previous day high (bullish case).'
- Only if previous day EQ fails does previous day low come into play.
- A close through previous day EQ is not automatically a bias invalidation — read it as a
  sweep of the liquidity around the EQ.
invalidation:
- Either previous-day extreme is taken.
- Explicit invalidation of the bias is not the EQ close; he says only to focus on invalidation
  of bias, which is left undefined for this case.
measurable:
- mean distance of intraday closes from daily open and range EQ on double inside days vs other
  days
- reaction rate at previous day EQ on inside days
- share of inside days that reach previous day high or low
- outcome of flipping bias on an EQ close versus holding
