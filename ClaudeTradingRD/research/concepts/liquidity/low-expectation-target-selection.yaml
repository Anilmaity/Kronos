ambiguities:
- '''Lower expectations'' is judged from the daily range already covered plus the quality
  of the open; no threshold is given.'
- How many previous highs / lows a swing must have swept to count as 'harder to get to' is
  not quantified.
- The rule is stated for the case where a protected swing exists; no alternative is given
  when one does not.
- The caption renders 'failure swings' as 'failure strings'; read as failure swings from context.
