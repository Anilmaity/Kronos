id: low-expectation-target-selection
name: 'Low-Expectation Day: Target The Failure Swing Right Of The Protected Swing'
definition: 'A target-selection rule given live while choosing between two lows. Liquidity
  is not all equally reachable: a high or low that itself swept out a run of previous highs
  or lows is harder for price to reach, because the sweep already consumed what was resting
  there. On a day where his expectation is low - the average daily range is largely spent,
  the open gave him nothing - he does not target that swept extreme. Instead, where a protected
  swing exists, he takes the failure swing sitting to the right of it as the target. He restates
  the choice in the end-of-stream review as the lesson of the day.

  '
variants:
  definition:
  - On a consolidation day his stated idea is to find the weakest asset and expect it to run
    into its failure swings; he expected YM (the weakest) to continue its small reversal into
    those targets.
  - 'Live instance: the first, mechanical target for the 15-minute expansion is the swing
    high that made the swing low being traded away from; once hit he calls it the short-term
    target for that 15-minute expansion.'
category: liquidity
status: contested
aliases:
- lower expectations
- harder to get to
preconditions:
- 'A low-expectation day: most of the average daily range is already covered, or the session
  open did not deliver the anticipated reaction.'
- A protected swing exists in the direction of trade.
- Range / consolidation day; relative strength ranking of NQ/ES/YM.
detection_rules:
- Identify candidate target levels below (or above) price.
- Mark any candidate that itself swept a series of previous lows (or highs) as hard to reach
  and deprioritise it.
- Where a protected swing exists, take the failure swing immediately to the right of it as
  the target instead.
- Apply only on low-expectation days; on a full-range day the deeper swept level remains a
  valid objective.
- Pick the weakest correlated asset; its targets are the failure swings.
- Identify the swing low traded away from and the swing high that formed it; that high is
  the first target.
invalidation:
- Price trades through the failure swing and continues, in which case the deeper level becomes
  reachable again.
- n/a
measurable:
- hit rate of swept-extreme targets vs failure-swing targets, conditioned on remaining daily
  range
- average distance and time-to-target for each class
- hit rate of failure-swing targets on the weakest index on inside days
