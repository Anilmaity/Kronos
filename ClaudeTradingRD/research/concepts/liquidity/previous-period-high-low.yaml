ambiguities:
- '''Already taken out'' has no lookback bound - how far back to keep marking extremes is
  not stated.'
- No rule chooses between this previous-candle-extreme target set and the standard-deviation
  projections, which are also called targets and generally sit elsewhere.
- '''Too much daily range'' is judged by eye - no ADR figure is used in this unit.'
- The distinction that carries all the weight — 'reach' vs 'close outside' — is used consistently
  in examples but the speaker also says 'displace', without defining it.
- No threshold defines 'consolidation' (the no-bias case); on an inside bar he simply marks
  both levels and waits.
- Session/timezone definition of the daily candle is not stated here (the killzone video implies
  a New York-time day with a midnight true-day-open).
- The outside-day case (both sides taken) is not given a decision rule.
