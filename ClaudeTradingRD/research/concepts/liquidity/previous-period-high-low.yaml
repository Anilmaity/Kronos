id: previous-period-high-low
name: Previous Day / Week / Month High & Low
definition: 'The targeting rule of the fractal model, and it is deliberately simple: whatever
  timeframe you are entering on, take the targets from the HIGHER timeframe you are referencing,
  and they are that higher timeframe''s previous candles'' highs (bullish) or lows (bearish).
  Candle 1''s extreme is the first target, then progressively older unswept extremes. Extremes
  that have ALREADY been taken out are not marked. Equal highs/lows are singled out as good
  targets. Because the model is fractal, a lower-timeframe entry can carry a runner to the
  higher-timeframe version of the same target - this is the stated route to high R. The indicator''s
  ''formation liquidity'' line is this rule automated: the previous candle''s extreme in the
  bias direction that has not yet been taken.'
variants:
  definition:
  - 'The high and low of the previous completed daily, weekly or monthly candle, extended
    horizontally over the current period. They serve exactly two functions in this corpus:
    as a draw on liquidity (the target price is expected to reach) and as a level off which
    a reversal is framed (price reaches the level, fails to displace/close beyond it, and
    turns). These are the levels the speaker says he always has marked.

    '
category: liquidity
status: contested
aliases:
- previous candle extremes
- formation liquidity
- targets
- previous day high
- previous day low
- previous week high/low
- previous month high/low
- PDH/PDL
preconditions:
- A valid swing point / model on the reference timeframe.
- The previous period's candle has closed.
detection_rules:
- Identify the candle you are trading away from (candle 2).
- Look LEFT on the reference higher timeframe and mark the previous candles' highs (bullish)
  or lows (bearish), starting with candle 1's.
- Skip any extreme that has already been taken out.
- Prefer equal highs / equal lows.
- Escalate one timeframe up for the runner target (e.g. daily entry -> weekly swing extreme).
- 'SMT rule: a target counts as satisfied when the correlated asset takes it out.'
- 'Feasibility check: do not expect all targets in one day - ''that''s too much daily range''.'
- PDH := high of the previous daily candle; PDL := low of the previous daily candle. Same
  construction for week and month.
- 'Draw case: if the current period is not consolidating inside the previous range, expect
  price to trade to PDH, PDL, or both.'
- 'Reversal case: price trades beyond the level but the period closes back inside the previous
  range -> expect the opposite level to become the draw.'
- 'Continuation case: the period closes beyond the level -> expect the next period''s same-side
  level to become the draw.'
- Trend supplies the default choice of side when both are untaken (uptrend -> previous high).
invalidation:
- A close outside the previous range in the direction of the level converts the reversal read
  into a continuation read.
measurable:
- hit rate of the first previous-candle extreme vs the second and third
- R achieved by taking partial at the short-term target and holding a runner (worked examples
  reached 1:11 and 1:16)
- frequency with which a day takes PDH, PDL, both, or neither
- hit rate of the reversal read (reach-without-close-outside -> opposite level reached next
  period)
- same statistics on weekly and monthly candles
