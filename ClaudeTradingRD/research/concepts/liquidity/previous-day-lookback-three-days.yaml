id: previous-day-lookback-three-days
name: Three-Day Lookback For Previous Day Highs And Lows
definition: 'The explicit answer to how far back previous-day highs and lows are marked: three
  days. From the current day he looks back three days and marks out those highs and lows,
  extending them forward. The extended levels are used both as targets and as confluence -
  his example shows price deviating below one of those older previous-day lows, returning
  into the range, and then retesting that same level before continuing higher (the box setup
  shape).'
category: liquidity
status: specified
aliases:
- three days back
- last 3 days
preconditions:
- A daily chart.
detection_rules:
- From the current day, look back exactly three days.
- Mark the high and the low of each of those days and extend them forward.
- Use the extended levels as targets and as confluence for reactions inside the current day.
invalidation:
- Not stated - levels are not said to expire other than by the three-day window rolling forward.
measurable:
- reaction rate at 1-day-old vs 2-day-old vs 3-day-old previous-day levels
- how often a deviation-and-retest of an older previous-day level precedes continuation
sources:
- video_id: FXJBFbZQbck
  title: The Easiest Draw On Liquidity (DOL) - Daily Bias - ICT
  quote: for me that is three days that I will look back into price action
ambiguities:
- He frames it as a personal setting ('for me that is three days'), not as a derived rule.
- Whether the three days are trading days or calendar days is not stated.
- No priority is given between the three days' levels when several are in play.
