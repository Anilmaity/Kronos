id: correlated-triads
name: Correlated Market Triads For SMT
definition: 'GxTradez views correlated markets in groups of three. He enumerates them: forex
  = DXY, EURUSD, GBPUSD; indices = NQ, ES, YM; gold = GC, XAU/EUR and XAU/GBP; oil = CL, RB,
  HO. RTY is paired with YM specifically (he states he does not use NQ or ES for it). He also
  notes that with the gold triad the data feed matters — the Forex.com feed opens at 18:00,
  matching the futures open.'
category: liquidity
status: specified
aliases:
- the triad
- correlated markets
detection_rules:
- Choose the triad matching the instrument being traded.
- Compare the same swing / gap / candle close across all three for SMT and PSP.
- For RTY, compare against YM only.
- For the gold triad, use a feed whose session opens at 18:00 so the candles align.
measurable:
- divergence frequency by triad
- which member most often leads the reversal
