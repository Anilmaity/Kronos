id: continuation-psp
name: Continuation PSP (a PSP that is not a reversal signal)
definition: GxTradez's correction of the most common PSP error. Once a true reversal has formed
  and a draw on liquidity is still open, a PSP printing in the direction OPPOSING that draw
  is a continuation signal, not a reversal signal. He states the rule flatly — any PSP opposing
  the draw on liquidity will not be used as a reversal — and says he was repeatedly stopped
  out trying to trade these as reversals when he first learned the concept.
category: liquidity
status: specified
aliases:
- continuation PSP
preconditions:
- A reversal has already been confirmed and the low/high of day is in.
- The higher-timeframe draw on liquidity is still open.
detection_rules:
- Confirm the reversal first (swing formation + SMT).
- Confirm the draw on liquidity is still unmet.
- A PSP now printing against the draw is classified as continuation.
- 'Its form: one asset retraces back into the range and closes creating a PSP; the other runs
  out that PSP candle''s high, creating the two-stage PSP, without creating a swing point
  at all.'
- Trade it as an entry WITH the draw, not against it.
invalidation:
- The draw on liquidity has already been hit — the continuation reading no longer applies.
measurable:
- outcome of PSPs classified as continuation vs reversal by draw-open status
sources:
- video_id: 3eVxTV_7L2U
  title: A Complete Trading Framework (Universal Models, SMT, Swing Points) | GXT
  quote: any PSP opposing our draw liquidity will not be used as reversal
- video_id: 3eVxTV_7L2U
  title: A Complete Trading Framework (Universal Models, SMT, Swing Points) | GXT
  quote: It is where between a correlated markets they close in opposite directions
ambiguities:
- '''Draw on liquidity still open'' is the whole classifier and depends on a prior, unquantified
  narrative judgement.'
- He also notes that when BOTH assets expand away from the original reversal, both are likely
  reaching for a draw — a narrative overlay with no mechanical test.
