ambiguities:
- Which timeframe's FVG counts as 'the' internal liquidity is not specified; one example uses
  a weekly FVG while working the 4H external swings.
- When several unfilled FVGs exist, no selection rule is given (nearest? largest? most recent?).
- '''Reaching'' internal liquidity is not defined as touching the near edge, the CE, or full
  fill — examples show all three.'
- Which timeframe's fair value gap is 'the' internal liquidity is chosen by the timeframe
  pairing, not by a rule; the examples mix 4H, hourly and daily gaps.
- '''Reaching'' the gap is not defined as touching the near edge, the consequent encroachment,
  or a full fill.'
- When several unfilled gaps exist there is no selection rule.
