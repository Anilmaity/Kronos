preconditions:
- A prior high or low has been marked.
- A subsequent price leg toward it has completed.
- Identified swing highs and lows with liquidity resting on them.
- A marked-up range with identifiable swing highs and lows on both sides of price.
- At least two prior highs (or lows) to compare.
- The daily chart has been assessed for whether it is set up to expand.
- An identified swing low or swing high on the working timeframe.
detection_rules:
- 'For a marked level L and the most recent price leg toward it: if the leg reversed WITHOUT
  trading through L, L is low resistance liquidity (a failure swing sits in front of it).'
- If the leg traded THROUGH L and then reversed, L is high resistance liquidity; the liquidity
  has moved out to the next untaken extreme.
- 'Daily scan for a low-resistance region: find runs of consecutive daily candles in which
  no previous day high was ever taken out (mirrored for lows). Every one of those previous
  day highs is unswept, so the whole band is low resistance liquidity.'
- Once price starts to break through such a band, expect it to continue through and expand
  in that direction.
- 'Targeting rule: prior to the session, mark the low-resistance side and set it as the draw.'
- Do not target the extreme of a high-resistance level directly - see high-resistance-target-adjustment.
- 'Asset-selection use: when two correlated assets are candidates, prefer the one that has
  low resistance liquidity in the trade''s direction.'
- 'Classify each swing: was its liquidity swept as price reversed (HIGH resistance), or did
  price fail to reach it, leaving a buildup (LOW resistance / failure swing)?'
- 'Target selection: use low resistance liquidity - the failure swings - as targets.'
- 'Stop placement: use high resistance liquidity - the sweeps - as the stop-loss location.'
- 'Manufacturing step in a consolidation: wait for a purge of the low to create high resistance
  liquidity, then take the bullish candle closure and expect expansion through the low resistance
  liquidity above.'
- 'Sequence read: expansion, consolidation, manipulation, expansion - the manipulation is
  the step that creates the high resistance side.'
- 'Precondition before targeting the failure swings: wait for price to shift bullish (the
  change in the state of delivery), do not front-run it.'
- 'Low resistance liquidity := a high with a lower high next to it (mirror: a low with a higher
  low next to it).'
- Target low resistance liquidity.
- Keep high resistance liquidity on the stop-loss side / on your side of the curve.
- A low that has just been swept, followed by a market structure shift away from it, is high
  resistance liquidity and is therefore stop territory, not target territory.
- After the structure shift, enter on the fair value gap or the order block created by it.
- 'A leg can chain: failing to make a new high after a low leaves more low resistance liquidity
  ahead, and the move finishes into it.'
- For each swing high/low in the intended path, ask whether it has already been swept.
- Never swept (a failure swing left behind by the move) -> low resistance liquidity.
- Swept before the reversal that created it -> high resistance liquidity; the resting liquidity
  has moved to the new extreme.
- Prefer paths whose intervening swings are failure swings.
- A high lower than the previous high = a failure swing = low resistance liquidity in that
  direction.
- When positioning short, require high resistance liquidity above (equal or higher highs,
  hard to run) and target low resistance liquidity below.
- Do not take a short entry at failure-swing highs; wait for a sweep of a genuine high first.
- Daily set up for expansion (within his model) = low resistance liquidity conditions; expect
  price to slice through levels.
- Extremely large range already printed with nothing further set up = high resistance / consolidation
  conditions.
- Immediately prior to very high impact news = high resistance conditions.
- Identify which side of the daily chart carries the failure swings - that is the low-resistance
  side and the side he expects to be run first.
- Do not take a trade whose path runs into high resistance liquidity within the daily profile;
  the USDJPY example is a long that would have had to trade up through highs already taken
  overnight.
- A swing low that has already been swept is high resistance liquidity (top-down video sense).
- 'Consequence: do not use that low itself as the level; mark 0.5 of its wick and use that
  as the support area.'
- A high-resistance low may still be traded from once price sweeps it AND closes back inside
  the range on the same candle.
invalidation:
- The level is swept; it ceases to be low resistance liquidity from that moment.
- Not stated as such; the classification changes when the untouched level is finally swept,
  which converts low resistance into high resistance.
- Price trades back through the high resistance side that was supposed to hold - the stop.
- The swing is swept, converting it from low resistance to high resistance.
- The low-resistance side is consumed - it stops being a target.
- The daily read changing (a new phase of price).
- Price closes below 0.5 of the wick of the high-resistance low.
measurable:
- expansion-through rate of low-resistance vs high-resistance targets
- count of consecutive days with no previous-day-high taken, and the subsequent expansion
  size
- hit rate of failure-swing targets vs already-swept-level targets
- stop-out rate for stops placed beyond swept extremes vs beyond unswept ones
- how often a consolidation purges one side before expanding through the other
- hit rate of low-resistance-liquidity targets versus high-resistance ones
- stop-out rate when the stop sits behind swept (high resistance) liquidity
- follow-through when targeting untouched failure swings vs already-swept swings
- share of daily objectives that sit behind low-resistance liquidity
- hit rate of low-resistance targets vs high-resistance targets on the same day
- how often a failure-swing high is later swept anyway
- range delivered on days classified low vs high resistance
- how often the failure-swing side is run first
- range compression on the day following a very large range day
- hold rate of already-swept lows vs never-swept lows
- how often 0.5 of the wick holds where the low itself does not
