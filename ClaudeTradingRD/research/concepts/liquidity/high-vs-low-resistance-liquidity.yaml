id: high-vs-low-resistance-liquidity
name: High Resistance vs Low Resistance Liquidity
variants:
  name:
  - High vs Low Resistance Liquidity
  definition:
  - 'A dedicated Short gives the cleanest structural definition in the corpus plus the operational
    assignment the library was missing. HIGH RESISTANCE liquidity: a swing high or low with
    liquidity resting on it that is then SWEPT as price reverses, leaving liquidity resting
    on the new high or low. LOW RESISTANCE liquidity: the same swing high or low with liquidity
    resting on it, except price FAILS to reach up and sweep it, so liquidity builds up there
    - these are the failure swings. The assignment: low resistance liquidity (the failure
    swings) is what you TARGET; high resistance liquidity (the sweeps) is where you put your
    STOP LOSS. A companion Short shows the manufacturing step - inside a consolidation he
    waits for a purge of the low specifically in order to CREATE high resistance liquidity
    to sit behind, and then expects expansion through the low resistance liquidity above.

    '
  - 'A dedicated Short answers the operational question the long-form corpus left open: how
    the two kinds of liquidity are used TOGETHER. He targets low resistance liquidity and
    keeps high resistance liquidity behind him - on his side of the curve, where the stop
    goes. Low resistance liquidity is identified structurally as a high with a lower high
    next to it (mirrored for lows); a level that has just been swept and traded away from
    is the high resistance side.'
  - 'A 32-second Short gives the mechanical definition the library previously lacked, in terms
    of swings rather than market conditions. Low resistance liquidity IS a failure swing:
    as price trades away from a level it generates new highs and lows, and the liquidity resting
    above and below those untouched swings is low resistance. High resistance liquidity is
    the opposite case - the swing was first swept and only then reversed, which wipes out
    the liquidity that was resting at that swing and relocates it to the new, further extreme.
    The distinction is therefore decidable from whether the swing in the path has already
    been run.

    '
  - 'EARLIER RECORDING, applied in a live trade rather than taught. A sequence of LOWER highs
    (a failure swing) constitutes LOW RESISTANCE liquidity - price can reach it easily. The
    directional rule he states is a pairing: when trading lower he wants HIGH resistance liquidity
    above (highs that are hard to reach, so the upside is protected) and LOW resistance liquidity
    below as the target. The consequence in the trade is that he refuses to short into the
    failure-swing highs and instead waits for an actual SWEEP before entering.'
  - 'Whether price will slice through levels or stall is decided on the daily chart, not intraday.
    When the daily setup calls for expansion, conditions are low resistance and he expects
    price to cut through everything in the way. Where a very large range has already printed,
    or ahead of very high impact news, conditions are high resistance and he expects consolidation
    instead. Within the daily profile he refuses to trade into high resistance liquidity -
    he wants the failure swings on the side he is heading toward.

    '
  - 'The top-down video uses the phrase as a property of a specific swing, not as a market-wide
    condition: a swing low that has already been swept is creating high resistance liquidity.
    The consequence he draws is operational - a high-resistance low is not expected to hold
    on its own, so instead of using the low he marks 0.5 of its wick as the area that should
    support price. This is a different sense of the phrase from the one recorded in the library
    from the live streams, where high vs low resistance describes conditions set by the daily
    setup and by news, deciding whether price will slice through levels or stall.'
definition: 'THE DEDICATED PRIMARY-SOURCE LESSON for this pair, and it gives a fully decidable
  definition that the library previously only had in circular / regime form. Low resistance
  liquidity is a high or a low that carries a FAILURE SWING - price approached it, turned
  before reaching it, and so the resting liquidity above/below it was never taken. High resistance
  liquidity is the opposite: price swept that level before reversing, so the stops there are
  already gone and what remains is the liquidity at the next extreme. The operational consequence
  is a target filter: before the session he marks the low-resistance side and uses it as the
  objective, because price is much more likely to expand through an area whose liquidity has
  not yet been taken.'
