ambiguities:
- '''A high or low with a failure swing'' is decidable only relative to a chosen lookback:
  which price leg counts as ''the leg toward it'' is not bounded in candles or time.'
- Whether a wick through the level (rather than a close) is enough to convert low resistance
  into high resistance is not stated.
- The consecutive-days scan is given as 'consecutive candles where no high is broken' with
  no minimum count.
- This unit's sense (a property of a specific swept/unswept level) is not the same as the
  sunday_sessions_live_q_a_03 / the_foundation_02 sense (a whole-day regime classification).
  Both are preserved; this is the dedicated lesson.
- This is the SWING-LEVEL sense of the terms. The library also carries a market-condition
  sense from the live streams (daily set up to expand = low resistance conditions). These
  Shorts use only the swing-level sense and never mention the conditions sense; the two are
  still unreconciled.
- '''Fails to reach up and sweep out that liquidity'' has no time bound - how long a level
  must stand unswept before it counts as low resistance is not stated.'
- No rule is given for choosing among several failure swings when more than one is available
  as a target.
- Whether the stop goes at the swept extreme or some distance beyond it is not stated.
- The corpus's auto-captions render 'reach' as 'wretch' elsewhere; here the word survives
  intact in the cited quote.
- The Short teaches from a schematic diagram, not a live chart, so no instrument, timeframe
  or session is attached to the rule.
- '"On my side of the curve" is used interchangeably with "for my stop loss"; the curve reference
  is not developed here.'
- How far the lower high must be below the high for the pair to count as low resistance liquidity
  is not given - it is read visually.
- This does not reconcile the corpus's other sense of the same phrase (a market-wide expansion
  versus consolidation condition read off the daily); the Short only teaches the structural
  sense.
- The Short defines the two terms as swing properties and never links them to the market-conditions
  reading (daily set up to expand, news) held elsewhere in the library.
- No timeframe is named for the swings being classified.
- How many swings deep the classification is carried is not stated.
- EARLIER RECORDING. High resistance liquidity is defined only by contrast; no positive test
  is given here.
- How many lower highs are needed to call a failure swing is not stated (two in the example).
- Auto-caption renders 'liquidity' cleanly here but 'sell side' as 'cells side' elsewhere
  in the same video.
- '''Set up to have an expansion within my model'' is circular here - the daily classification
  depends on his model rather than on a stated test.'
- '''Very high impact news'' is not enumerated.'
- '''Extremely large range'' has no threshold, though elsewhere he uses average expansion
  size (700-800 points on YM) as a reference.'
- Two different senses of the same phrase now exist in the corpus - a property of a swept
  swing (here) and a market-wide condition (live streams). Neither video reconciles them.
- The low-resistance mirror is not given in this unit.
- The dedicated 'High Resistance vs Low Resistance Liquidity' video is listed in the_foundation_01
  as having no transcript on disk, so the definitive statement is still missing from the corpus.
