ambiguities:
- 'The doctrine is unambiguous, but it coexists in this unit with the SMT-as-swing-point substitute
  rule, where SMT DOES supply a missing structural precondition. The two are not reconciled:
  SMT may replace a sweep, but may not replace the closure or the CISD.'
- He dislikes equal-high SMTs but does not define how much separation makes a divergence count.
- Framework is defined circularly as needing to have a model.
- PSP is named alongside SMT and given the same treatment, but is not defined in these streams.
- An SMT he marked by hand on stream would not have been marked mechanically by his own indicator
  - so the discretionary and mechanical definitions do not coincide.
- '''Way over it'' is the disqualifier for a stale SMT but no distance measure is given.'
- SMT is called a confluence here yet is simultaneously the thing without which he will not
  take the trade (see idea-vs-executable-setup); the two roles are not reconciled.
- Which correlated asset supplies the SMT for gold is answered only as 'they just need to
  be correlated' (silver is allowed).
