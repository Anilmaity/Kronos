id: smt-requires-framework
name: SMT Is a Confirmation, Not a Framework
definition: 'Doctrine, stated repeatedly and with an explicit worked counter-example: you
  do not find an SMT and then build a model around it - you find the model and then check
  for an SMT. The gate is concrete: a candle 2 or candle 3 closure PLUS the aligned lower-timeframe
  change in the state of delivery must exist first. In one example an SMT is visibly present
  on gold, and he refuses to use it because the hourly CISD has not yet closed through; once
  it does, the SMT is allowed to count.'
variants:
  definition:
  - 'A divergence between correlated assets (SMT) is only meaningful when an existing model
    already points in that direction and price has displaced to confirm it. An SMT observed
    in isolation, particularly one at a level where price is merely consolidating rather than
    reversing, is not a setup and is ignored. The stated failure mode is traders who see an
    SMT during a trend and short it repeatedly.

    '
  - Held to firmly under live pressure. Viewers repeatedly point at an SMT on the previous
    day's low as a reason to reverse; he refuses each time on the grounds that SMT and PSP
    are only looked at when a valid fractal model already exists. He states he does not care
    about them absent a model. Consistent with this, his indicator only marks SMTs at the
    specific places his model looks - a reversal SMT and a continuation SMT - and he declines
    to make it more sensitive, because marking arbitrary SMTs is not the point.
  - 'The clearest statement of it in the corpus, delivered as a correction of what he says
    everyone does. The wrong order is to find an SMT first and then build a framework around
    it. His order is the reverse: have the model first, then use SMT to confirm or as a confluence.
    He refuses on air to short on the basis that ES has not taken a high that NQ has, because
    that divergence is not supported by his model. Two further filters emerge from the same
    streams. An SMT where the correlated assets are already far beyond the level is technically
    an SMT but not one he wants - he would rather see the level taken out than expect a reaction
    from it. And where the two sides of a candle both present, only the side that also has
    a CISD is trusted.

    '
category: liquidity
status: contested
aliases:
- framework first, SMT second
- SMT means nothing without a framework
- SMT as confluence
- model first, SMT confirms
preconditions:
- None - this is an ordering rule.
- 'A directional model already exists: a daily bias plus a lower-timeframe fractal setup.'
- Price is at a relevant level, not mid-range.
- A model / framework already exists on the instrument.
- Two or more correlated assets.
detection_rules:
- 'Step 1: higher-timeframe closure (C2 or C3) at a point of interest.'
- 'Step 2: aligned lower-timeframe change in the state of delivery.'
- 'Step 3 only then: check the correlated market for SMT as confluence.'
- An SMT present before step 2 is ignored, however clean it looks.
- SMT is never a substitute for intraday confirmation that the wick has formed.
- One asset takes out its high or low while the correlated asset does not.
- Require an existing framework pointing the same way the divergence would imply.
- Require displacement away from the level (a V-shape) after the divergence before acting.
- If price consolidates at the level after the divergence, read continuation rather than reversal.
- Establish the fractal model first; only then look for SMT or PSP.
- An SMT with no model behind it produces no trade, however clean.
- 'Only two SMT locations are relevant: at a reversal and at a continuation within the model.'
- An SMT at a level that has not been reached is doubly irrelevant - the level must matter
  first.
- Establish the framework first; only then look for SMT.
- Never treat a bare divergence between correlated assets as a setup.
- Reject an SMT where the other assets have traded well beyond the shared level - prefer to
  see that level taken out instead of expecting a reaction.
- Where both a bullish and a bearish reading exist, trust only the side that also has a CISD.
- An SMT is what supplies the trustworthy invalidation level; without it he will not trade
  away from a high or low.
invalidation:
- No V-shape displacement after the divergence.
- The divergence occurs mid-trend with no framework, in which case it is discarded.
- The divergence resolves - the lagging asset takes the level too.
measurable:
- outcome of SMT-first entries vs model-first entries on the same data
- how many visible SMTs are discarded by the ordering rule
- hit rate of SMT-only entries versus SMT-plus-framework entries
- expectancy of SMT signals with a model present vs absent
- count of arbitrary SMTs filtered out by restricting to model locations
- expectancy of SMT-first entries vs model-first entries
- reaction rate of SMTs where the correlated asset is far beyond the level vs close to it
