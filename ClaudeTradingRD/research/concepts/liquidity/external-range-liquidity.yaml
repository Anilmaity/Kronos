ambiguities:
- Which swing bounds 'the range' is judged visually; no algorithm selects it among nested
  swings.
- The swing definition inherits the unresolved filtering problem noted under swing-point.
- No statement on whether external liquidity must be on the same timeframe as the internal
  FVG.
- Which swing bounds 'the range' is judged visually; nested swings are not filtered.
- No rule ties the timeframe of the external swing to the timeframe of the internal gap -
  one example pairs a 4H gap with a previous-week high.
