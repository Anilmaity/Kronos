ambiguities:
- The exact symbols are never spelled out; "gold euro gold pound" is read as XAU/EUR and XAU/GBP
  but the transcript does not say so.
- No preference or ranking between the two is given, and nothing is said about how to rank
  three gold instruments the way he ranks ES / NQ / YM.
- He does not say silver is wrong, only that gold-euro and gold-pound are what he uses; in
  another stream he looks at silver alongside gold without calling it a correlation pair.
- No statement on which gold pair is preferred by default.
- Which timeframe counts as 'higher' for the gold/silver comparison is not stated; nor whether
  gold-euro/pound is then reserved for intraday.
