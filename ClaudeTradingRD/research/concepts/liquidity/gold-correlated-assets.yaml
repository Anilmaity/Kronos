id: gold-correlated-assets
name: Correlated Assets For Gold (gold-euro and gold-pound)
definition: 'Which instruments he compares gold against when looking for SMT. Answering a
  viewer who asserted that silver is the correlation for gold, he names gold priced in euro
  and gold priced in pound instead. He charts gold itself as CME gold futures (typed on screen
  as GC1!) and says he uses futures only, so he does not look at other feeds. In a separate
  stream he notes gold''s correlation was behaving oddly that day and he therefore had no
  gold idea.

  '
variants:
  definition:
  - 'The relative-strength guide uses gold futures against gold-GBP and against gold-euro
    as the correlated pairs for XAU; in one bullish example gold-euro is identified as the
    stronger asset by separation and by taking the high first.

    '
  - Restates gold-euro and gold-pound for divergences but now also allows gold against silver,
    which he prefers on the higher timeframe; his indicator checks SMT automatically against
    the two instruments he configured. This conflicts with the existing entry's 'not silver'
    reading.
category: liquidity
status: contested
aliases:
- gold euro gold pound
preconditions:
- An SMT / relative-strength comparison is being made on gold.
detection_rules:
- Compare gold against gold-in-euro and gold-in-pound, not against silver.
- Chart gold as the CME gold future (GC1!) rather than a CFD or spot feed.
- If the correlation is behaving oddly on the day, stand aside rather than force the read.
- Compare gold futures with gold-GBP / gold-euro at the same swing for SMT, separation and
  closures.
- For higher-timeframe gold SMT, compare gold with silver; gold-euro/gold-pound remain usable
  for divergences.
invalidation:
- n/a - an instrument-selection rule.
measurable:
- frequency and predictive value of SMT between gold, gold-in-euro and gold-in-pound versus
  gold versus silver
