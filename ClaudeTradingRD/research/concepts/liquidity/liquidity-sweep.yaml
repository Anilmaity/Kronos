  - 5m
  fractal: true
execution:
  bias: Opposite the swept side, but only after confirmation.
  entry: Confirmation via CISD / order block formation after the sweep - never on the sweep
    itself.
  stop: Beyond the sweep extreme.
  targets:
  - the level on the correlated stronger asset
  - previous day high/low
