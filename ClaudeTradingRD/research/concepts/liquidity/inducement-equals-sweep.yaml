ambiguities:
- The auto-captioner renders 'highs to be ran' as 'highest vram'; the meaning is fixed by
  the mirrored bullish clause in the same sentence.
- '''Barely reaches into'' the PD array has no threshold.'
- He says inducement is 'very similar to' his displacement-vs-lack-of-displacement material
  without stating whether they are the same signal.
- He does not distinguish inducement from the continuation order block, though the described
  mechanics overlap.
- Short-term is not defined in candles or timeframe.
