id: inducement-equals-sweep
name: Inducement
variants:
  name:
  - Inducement Is the Same Thing as a Liquidity Sweep
  definition:
  - 'Asked to distinguish inducement from a liquidity sweep, he states they are effectively
    the same and that the vocabulary around them is unnecessary. Inducement is simply price
    running out a low before trading higher (or a high before trading lower). His preferred
    form of it is a sweep of a short-term high or low followed by a fair value gap.

    '
definition: 'A move that induces buyers or sellers into the market: breakout buyers buy above
  an old high while shorts have buy stops resting there, and that is where smart money sells
  for the move lower (mirrored below lows). He maps it directly onto accumulation-manipulation-distribution
  and states the operational rule plainly — with bearish order flow he wants HIGHS to be run
  to position short, with bullish order flow he wants LOWS to be run to position long. He
  prefers the inducement to occur INSIDE a PD array, and his favourite case is when price
  barely reaches into that PD array.'
category: liquidity
status: contested
aliases:
- inducement
- engineered liquidity
- liquidity sweep
preconditions:
- Order flow / trend direction is already established.
- Preferably a higher-timeframe PD array has been engaged.
- A prior reversal has occurred and price has begun trading away from a low or high.
detection_rules:
- 'Bullish order flow: mark a low sitting inside a PD array; wait for it to be run.'
- 'Bearish order flow: mark a high sitting inside a PD array; wait for it to be run.'
- The run is the manipulation; enter as the induced level breaks, targeting the opposite side.
- 'Preferred quality: price barely reaches into the PD array, or has not yet reached equilibrium/discount
  of the range.'
- In a trending market, every run of a prior low (uptrend) is a candidate entry — he counts
  three in one leg.
- Price returns and trades through a short-term low (or high) formed after the reversal.
- Price then continues in the original reversal direction.
- 'Preferred variant: the sweep is accompanied by a fair value gap in the continuation direction.'
invalidation:
- Closes beyond the induced level rather than a wick through it (he watches whether the closes
  respect the old lows).
- Price closes beyond the swept level and continues, making it an expansion rather than a
  sweep.
measurable:
- count of inducement sweeps per trending leg
- outcome when inside a PD array vs not
- frequency of a short-term-low sweep preceding continuation legs
