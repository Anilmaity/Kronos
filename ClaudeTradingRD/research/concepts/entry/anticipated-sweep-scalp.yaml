id: anticipated-sweep-scalp
name: Anticipated Sweep Scalp With A Tiny Stop
definition: When scalping, if he already anticipates a move (here a 1-minute candle expected
  to respect its EQ and expand) and then sees a sweep, he enters immediately ('slap it') with
  a very small stop for a large R multiple. The previous day's instance ran about 6R and then
  stopped him back out at break even.
category: entry
status: underspecified
aliases:
- slap it
preconditions:
- An anticipated directional read on the scalping timeframe.
detection_rules:
- Enter at market on the sweep in the anticipated direction; stop just beyond the sweep.
