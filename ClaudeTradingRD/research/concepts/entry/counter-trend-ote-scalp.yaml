id: counter-trend-ote-scalp
name: Counter-Trend OTE Scalp (target the opposing OTE)
definition: 'A self-contained scalping model taken on the 15-second chart, and he states explicitly
  that it does NOT need a higher-timeframe narrative - it helps, but is not required. The
  shape: after an aggressive move up off the open, wait for it to stall, then take a COUNTER-TREND
  scalp down into the OTE of that move in order to then target the original direction. The
  trigger for the counter-trend leg is itself a mini-model: an aggressive move down that breaks
  structure, a fair value gap left by it, and a return to that gap. Enter at the start of
  the gap, stop on the high just above, and exit when price reaches the discount / the 0.62
  of the leg. He states the temperament this model is built around: you are wrong quickly,
  you are not risking much, and you take partials rather than the full move.'
category: entry
status: specified
preconditions:
- An aggressive directional move has occurred and has stalled.
detection_rules:
- Identify where the aggressive move stalls; that extreme anchors the leg.
- Require an aggressive move against it that breaks structure and leaves a fair value gap.
- Enter on the return to the start of that fair value gap.
- Stop on the high (short) / low (long) immediately beyond the gap candle.
- Target the discount / OTE of the leg - the 0.62 is the level he uses to take profit.
- Take partials in the OTE region rather than holding for the full move.
- A large fair value gap sitting in the target direction is treated as the reason to expect
  price to travel that far.
measurable:
- win rate and average R of 15-second counter-trend scalps
- proportion reaching the 0.62 target
sources:
