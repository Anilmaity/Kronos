ambiguities:
- '''Looks like it stalls right there'' is the only stated way of locating the leg''s extreme.'
- No session or time filter is applied to these scalps in this video.
- The auto-captioner renders 'right' as 'write' in the temperament line.
- It directly contradicts the overtrading and one-trade-per-day discipline recorded elsewhere
  in the corpus; no reconciliation is offered.
