ambiguities:
- The full signal chart was shown on screen and offered as a link; the transcript names only
  some of the sequences, so this list is what was SPOKEN, not the complete published set.
- Stop placement is never stated for any signal; only targets and discretionary partialling.
- '''Rev Strat'' is used as a named magnitude (''take rev strat magnitude'') without being
  defined in the audio.'
- The claim that 1-2-2 IS the ICT AMD setup is the guest's mapping, asserted not demonstrated.
