id: strat-actionable-signals
name: TheSTRAT Actionable Signals (finite reversal and continuation set)
definition: 'Because there are only three candle types, the guest argues there is a FINITE
  and enumerable set of reversal and continuation sequences, so ''there''s no guesswork''.
  The reversals he names are 2-1-2 (a 2 one way, an inside bar, then a 2 the other way), 2-2
  (a 2 one way then a 2 straight back the other way), 3-2-2, 3-1-2 and 1-2-2. The continuations
  are 2-2 continuation and 2-1-2 continuation (the second 2 confirming the same direction)
  and 3-2. The magnitude (first target) of a reversal is the previous candle''s opposite extreme
  - for a bearish 2-2 reversal, the previous candle''s low; for a 3-2-2 that fails the high
  of the 3, the bottom of that 3. He states that 1-2-2 is what an ICT trader is actually trading
  when they trade accumulation-manipulation-distribution or the ''box setup'': the 1 is the
  accumulation, the first 2 is the move out, the second 2 is the reversal back.'
category: entry
status: specified
aliases:
- 2-2 reversal
- 2-1-2
- 3-2-2
- 3-1-2
- 1-2-2
- Rev Strat
preconditions:
- Candles labelled 1/2/3 per the STRAT taxonomy.
- Timeframe continuity checked (see timeframe-continuity).
detection_rules:
- 'Bearish 2-2 reversal: a 2-up candle followed by a 2-down candle. Target = the low of the
  candle preceding the 2-down.'
- 'Bullish 2-2 reversal: a 2-down followed by a 2-up. Target = the high of the candle preceding
  the 2-up.'
- '2-1-2 reversal: 2 in one direction, then a 1, then a 2 in the opposite direction.'
- '2-1-2 continuation: 2, then a 1, then a 2 in the SAME direction.'
- '3-2-2: an outside bar, then failure of the 3''s extreme, then a 2 back through it. Target
  = the opposite extreme of the 3.'
- '1-2-2: inside bar, directional 2, then a 2 back the other way - the guest equates this
  with the ICT AMD / box setup.'
- The first target is chosen so that taking it makes the recent bars a compound outside bar
  (a 3) on the next timeframe up.
invalidation:
- A 2 in the opposite direction after entry (a '2-2 against you') is the signal to lighten
  or exit.
measurable:
- hit rate of the previous-candle-extreme target per signal type
- relative frequency of 2-2 vs 2-1-2 vs 3-2-2 per timeframe
- how often a 2-2 against the position precedes failure to reach target
