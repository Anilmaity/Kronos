ambiguities:
- '''Aggressive'' is never quantified in either direction; it is the single decision the whole
  model turns on.'
- Bodies-by-default / wicks-on-the-daily is a stated habit with one explicit exception ('when
  the body level would be too far'), not a rule with a threshold.
- Whether the move back in must close inside the range or merely trade inside is not stated.
- 'EVOLUTION, NOT CONTRADICTION: this is the EARLIER recording. It attributes the model to
  ''Alex'' and omits the HTF-wick rationale that the later HFfChGFHD44 makes central; it adds
  the enter-early preference that the later one omits. Both readings retained.'
- '''Aggressive'' remains unquantified in both directions.'
- The enter-early rule is justified by the curve but no rule locates the curve's midpoint
  (see market-curve-side).
- Bodies vs wicks for the range is explicitly discretionary.
- The Box setup is referenced as having its own dedicated video ('if you are familiar with
  the Box setup video') which is NOT part of this unit — so the full rule set is unavailable
  here.
- Whether box_level is the highest body of the whole accumulation or only of the candles adjacent
  to the deviation is not stated.
- His phrasing that the box setup is a retest of the previous highs leaves the precise level
  ambiguous between the body cluster and the range high.
- No rule for when to prefer the plain versus the confirmed variant.
- '''Aggressive'' in both directions is the load-bearing word and is unquantified here as
  everywhere else; see `displacement` for the only two procedures the corpus offers.'
- Whether box and BPR are strictly the same object or merely often coincident is left as a
  rhetorical question.
