id: box-setup
name: Box Setup
definition: Resting liquidity — usually an old high or low, or a consolidation range — is
  taken by an aggressive move OUT of the range, which is then met by an aggressive move BACK
  INTO the range. The excursion is the 'deviation from the range'. The trade is the retest
  of that deviation. He states outright that this is the same thing as power of three / accumulation-manipulation-distribution,
  and that the aggressive-out-aggressive-in requirement exists because that is what forms
  the WICK on a higher timeframe.
variants:
  definition:
  - 'EARLIER RECORDING (old ''Education - ICT'' playlist; re-recorded later as HFfChGFHD44,
    the canonical reading). Same core - consolidation, aggressive move OUT of the range, aggressive
    move BACK IN, then trade the retest of the range edge - but three things differ from the
    later version. (1) He credits the model to a third party, ''Alex''s video on this'', which
    the later recording drops. (2) The stated rationale is power-of-three / AMD only; the
    later recording adds the deeper reason (this is what forms the higher-timeframe wick).
    (3) He adds a timing preference the later video does not carry: catch the retest EARLY,
    near the aggressive move, rather than waiting for the full retracement to the far edge,
    justified by which side of the curve price is on.'
  - 'An entry taken on the retest of the extreme BODY of an accumulation range after price
    has deviated outside that range and returned. For a short: mark the accumulation, mark
    the highest body within it, mark the deviation (manipulation) above it; the plain box
    entry is the retest of that highest-body level with the stop above the manipulation. For
    a long: the lowest body of the range. The speaker''s preferred, confirmed variant does
    not enter blind at the level — it waits for an order block or a change in state of delivery
    to form at the retest.

    '
  - 'Earlier corroboration, and it supplies the identity the later canon states separately:
    he narrates ''aggressive down, aggressive up'' and immediately asks whether that reminds
    you of the box or the BPR - so the box setup and the balanced price range are treated
    as the same geometry seen two ways. He demonstrates it on the 15-second and even the 5-second
    chart, which are lower than any timeframe used for this setup in the later material, and
    uses it as the trigger to FLIP a bias that the higher timeframe had wrong.'
category: entry
status: contested
aliases:
- deviation from the range
- aggressive out, aggressive back in
- the Box setup
preconditions:
- 'Resting liquidity: an old high/low, or a consolidation range.'
- A consolidation range, or an old high/low, with resting liquidity beyond it.
- An aggressive move out of it followed by an aggressive move back into it.
- An accumulation range where price cannot make new highs or lows.
- A deviation (manipulation) outside that range followed by a move back inside.
detection_rules:
- Mark the range. Default to the BODIES; on the daily timeframe he switches to the WICKS.
- Price must move aggressively out of the range (taking the liquidity).
- Price must then move aggressively BACK into the range — this is the load-bearing condition.
- 'Mark the deviation: the highest bodies (bearish) or lowest bodies (bullish) that were run.'
- Entry on the retest of that deviation level.
- 'Fallback when no range is identifiable: wait for displacement over highs, then look left
  at which highs were run and mark the highest body.'
- 'Exception: when the body level sits too far from the extreme, he uses the wick instead.'
- Mark the consolidation range; bodies by default, wicks by discretion when the bodies do
  not fit.
- Require an aggressive move OUT (often evidenced by a fair value gap) and an aggressive move
  BACK IN (also a fair value gap) - the pair is the important part, not the consolidation
  itself.
- Entry on the retest of the range edge / previous low or high that was deviated through.
- Stop beyond the manipulation extreme; target the other side of the range or a higher-timeframe
  point of interest.
- Prefer to enter EARLY in the retracement rather than waiting for the far edge of the zone.
- 'Fallback when the bodies never closed back through: use the fair value gaps / BPR left
  by the return leg as the level.'
- 'Higher-timeframe use: run the same reading on the 4-hour or 1-hour purely for BIAS, looking
  only at displacement and lack of displacement.'
- Mark the accumulation range.
- box_level (short) := the highest body (max of open/close) inside the accumulation. box_level
  (long) := the lowest body.
- Require a deviation beyond the range followed by a displacement back inside.
- 'Plain entry: limit at box_level on the retest, stop beyond the deviation extreme.'
- 'Confirmed entry: on the retest, additionally require an order block to form (a sweep, then
  a close through the opening price of the opposing candles) before entering; the stop may
  then be placed at the local sweep extreme instead.'
- Targets from projecting the manipulation leg.
- Aggressive move out of the range (taking the liquidity), immediately met by an aggressive
  move back into it.
- That pair of opposing aggressive legs is simultaneously the box setup and the BPR.
- Entry on the retest of the deviation; stop on the extreme of the excursion.
- The same shape appearing against your bias is treated as a reason to flip the bias, not
  to fade it.
invalidation:
- No aggressive move back into the range — he does not look for the reversal.
- Price fails to hold the deviation level on the retest.
- No aggressive return into the range.
- Price is on the wrong side of the curve for the intended direction.
- Price closing back beyond the deviation extreme.
measurable:
- hit rate of deviation retests reaching the opposite side of the range
- difference in outcome using bodies vs wicks to define the range
- fill rate and R of the early entry vs the far-edge entry on the same boxes
- how often price on the 'wrong side of the curve' runs through the level instead of reversing
- hit rate of the 4H/1H bias variant
- hit rate of plain box entries vs order-block-confirmed box entries
- how often box_level is retested at all after the deviation
- retest fill rate of the deviation on sub-minute timeframes
