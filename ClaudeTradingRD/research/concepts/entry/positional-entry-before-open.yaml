preconditions:
- A setup exists before the equity open.
- Pre-open, price has just taken out a short-term high.
- Protected swings / short-term lows are stacked below current price.
- A protected swing has already formed before 09:30.
- All timeframes green (daily, 4-hour, hourly supporting the same direction).
- A clear target exists (previous day high/low in the worked example).
- Framing is on a 30-minute or higher timeframe.
detection_rules:
- The setup must be valid on the 15-minute, not on a lower timeframe.
- A protected swing must already have formed before the open, and it must be one you can trust
  as the stop reference.
- If there is nothing to place the stop behind, do not take the pre-open entry - wait for
  the open.
- If the setup completed before the open, trade it pre-open rather than waiting for 09:30.
- If the pre-open move has taken out a high and no swing below is expected to hold, do not
  position long before the open.
- Expect a retracement into the open that runs the stacked protected swing(s) before any continuation.
- Wait for that run, a reaction, and a continuation after the open.
- 'Confirm the protected swing: price reached into the level, took the low, and closed back
  over into the fair value gaps.'
- The stop must give the fair value gap room - cover the gap and its 50% - because the open
  will move price.
- 'Bearish positional variant: sell at or above the daily open; stop above; invalidation at
  50% of the opposing candle range, because above that he expects the highs to be taken instead.'
- If 2R is not achievable with that stop, do not take the pre-open entry - wait for after
  the open.
- Pre-open entry only with bias + aligned daily profile + an invalidation expected to survive
  the 9:30 volatility.
- 'Pre-09:30 entries: execution/setup timeframe must be 15-minute or higher.'
- 'After 09:30: no minimum execution timeframe.'
invalidation:
- No trustworthy protected swing before the open.
- Price expands from the open without running the stacked swings.
- Price trading above 50% of the opposing candle range (bearish case).
- Price trading beyond the protected swing.
measurable:
- outcome of pre-open entries versus post-09:30 entries on the same framing
- how often a pre-open protected swing survives the open
- frequency with which stacked protected swings below a fresh pre-open high are run within
  the first 30 minutes after 9:30
- adverse excursion through the 09:30 open on pre-open entries
- 2R hit rate of pre-open vs post-open entries on the same setups
