id: ltf-inversion-entry-in-tspot
name: 1-Minute Inversion Entry Inside The T-Spot
definition: 'The entry refinement this video exists to teach. Once the higher-timeframe candle
  has swept and closed back inside, and the paired lower timeframe has closed through the
  series of opposing candles, the indicator marks the t-spot - the area in which the higher-timeframe
  wick is expected to form. Price is then allowed to trade into that t-spot and the trader
  drops one more timeframe (1-minute under an hourly/5-minute model, 15-minute under a daily/hourly
  model) and waits for an INVERSION: a fair value gap in the opposing direction that price
  then closes back through. The close through the inversion is the entry, the stop goes on
  the swing low/high that formed the wick, and the target is 2R or the higher-timeframe objective.'
variants:
  definition:
  - 'A 46-second Short states the full five-step recipe end to end: establish a higher-timeframe
    bias; require a candle closure in line with it (a candle 2 closure where price sweeps
    the previous candle and closes inside); confirm on the 5-minute with a change in the state
    of delivery; identify a point of interest inside the T-spot where the higher-timeframe
    wick of candle 3 is expected to form; then drop to the 1-minute, wait for an inversion
    to form there, take the entry and look for 2R. A companion Short adds the shortcut case:
    when the invalidation sits very close to the higher-timeframe opening price, the inversion
    can be entered at the open.

    '
category: entry
status: contested
aliases:
- 1 minute inversion
- refining entries within my fractal model
preconditions:
- A higher-timeframe sweep-and-closure-back-inside has occurred.
- The paired lower timeframe has closed through the series of opposing candles (alignment).
- Price has traded into the t-spot, ideally having swept a low or reached a relevant point
  of interest inside it.
detection_rules:
- Mark the t-spot after the higher-timeframe closure and the lower-timeframe alignment - not
  before.
- Wait for price to trade into the t-spot; the higher-timeframe wick should be forming there.
- On the execution timeframe locate an opposing fair value gap inside the t-spot.
- Require a CLOSE through that gap - the inversion. No close, no entry ('no close yet got
  to wait for this close').
- Enter on the close or on the retest; the retest is chosen when the close entry does not
  give 2R.
- Reject inversions that have not been preceded by a sweep of a low or a relevant point of
  interest inside the t-spot.
- Prefer the inversion that forms the wick itself over an earlier one inside the range.
- 'Step 1: higher-timeframe bias.'
- 'Step 2: a candle closure in line with that bias (sweep of the previous candle, close back
  inside).'
- 'Step 3: confirm on the 5-minute with a change in the state of delivery.'
- 'Step 4: locate a point of interest (fair value gap) inside the T-spot, where the candle
  3 wick is expected.'
- 'Step 5: on the 1-minute, wait for an inversion to form there, enter, target 2R.'
invalidation:
- Price returning below the low that formed the wick (bullish case) - the wick is no longer
  the extreme.
- Price consolidating inside the t-spot without running a high/low first - he waits for a
  protected extreme rather than entering.
- Never returning to the t-spot at all - a missed trade, explicitly accepted.
- The T-spot low (bullish case) is taken out.
- No inversion forms on the 1-minute inside the point of interest.
measurable:
- hit rate of 2R from a t-spot inversion entry
- how often price returns into the t-spot at all after alignment (the missed-trade rate)
- difference between close entries and retest entries on the same signals
- outcome of a time-based exit at the higher-timeframe close vs a fixed 2R
- hit rate of 2R on 1-minute inversion entries inside the T-spot
- how often an inversion actually forms once the T-spot is tagged
