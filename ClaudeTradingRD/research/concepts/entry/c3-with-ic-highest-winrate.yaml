id: c3-with-ic-highest-winrate
name: Candle 3 With an Intracandle CISD Is the Highest Win-Rate Part of the Model
definition: 'Asked how to raise a win rate inside his model, he names one specific subset:
  trade candle 3, entered with an intracandle CISD. He states this is the highest win-rate
  part of his strategy and that it also gives good risk-to-reward, and grounds the claim on
  years of trading the model himself. He pairs it with the framing that the way to improve
  a win rate is to lose less rather than to win more - go into the losses and find what they
  have in common, which he says is usually a wrong or absent bias, or entries taken too early
  (fixed by moving up one timeframe).'
category: entry
status: specified
preconditions:
- A completed candle 2 closure on the analysis timeframe.
detection_rules:
- Restrict entries to candle 3 of the fractal sequence.
- Enter via an intracandle CISD (see ic-cisd), not on the candle 2 itself and not on candle
  4.
- Diagnose a poor win rate by auditing losses for wrong/absent bias and for entries taken
  a timeframe too low.
measurable:
- win rate of C3-with-IC entries vs all other entries in the same model
- risk-to-reward distribution of that subset
sources:
- video_id: NESSCPMzWR0
  title: New York Open Live Q&A
  quote: That is the highest win rate part of my strategy
ambiguities:
- No number is attached to 'highest win rate' - the claim is comparative, not quantified,
  and is his own recollection rather than a published statistic.
- The transcript abbreviates the entry as 'IC' and 'ICCISD'; he confirms in the same stream
  that this is the intracandle CISD covered by a dedicated video.
