id: oversized-fvg-handling
name: Handling An Oversized Fair Value Gap
definition: A fair value gap that is very large relative to the execution timeframe is treated
  as a higher-timeframe order block or inefficiency rather than as an entry zone, because
  entering at its edge leaves an unusable stop. Four handlings are offered. Take the gap's
  50% mark as the point of interest, to halve its size. Look inside it for an actual structural
  setup - a breaker formed off a down-close candle with a fair value gap through it, which
  he says 'splits the difference' of the large gap. Redraw the gap using candle bodies rather
  than wicks, which reduces the price action that has to be waited through. Or simply stand
  aside while price is inside it, which he says is a legitimate system rule if the other handlings
  do not work for the trader. The governing instruction is to stop worrying about the size
  of the gap and wait for where the setup actually appears.
category: entry
status: underspecified
aliases:
- big fair value gap
- 50% of the gap
preconditions:
- A fair value gap judged large relative to the execution timeframe.
detection_rules:
- When a fair value gap is large relative to the execution timeframe, do not enter at its
  edge.
- 'Option A: use the gap''s 50% level as the point of interest.'
- 'Option B: wait for a structural setup inside it - a breaker off a down-close candle with
  a fair value gap through it.'
- 'Option C: redraw the gap using candle bodies instead of wicks.'
- 'Option D: stand aside entirely while price is inside it.'
invalidation:
- Price closes through the far side of the gap without producing any of the above.
measurable:
- reaction rate at the 50% of an oversized gap vs at its edge
- R improvement from waiting for an internal structural setup vs entering at the edge
sources:
- video_id: V8P6lNIisvc
  title: Q&A Live with Alex's Options - ICT + Strat
  quote: you totally can use like the 50% mark of it
ambiguities:
- '''Big'' is never quantified - no ATR multiple, point threshold or ratio to the execution
  timeframe''s candle size.'
- No rule selects among the four handlings; he says some days he takes one and some days he
  does not.
