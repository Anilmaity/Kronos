- gray box
- green box
preconditions:
- A valid model has printed (closure + CISD).
- A higher-timeframe wick or opposing candle with a defined range.
- A change in the state of delivery, or a higher-timeframe candle, whose half level can be
  measured.
- A CISD and a protected swing have printed on the higher-timeframe candle.
- A higher-timeframe sweep and closure back inside.
- The paired lower timeframe aligned in the same direction.
- A printed model on the higher-timeframe candle.
detection_rules:
- The T-spot is drawn by the indicator inside the higher-timeframe candle, on the side the
  wick is expected.
- Seek the point of interest for the entry INSIDE the T-spot; a point of interest beyond it
  is explicitly not wanted.
- Price must not close over (bearish) / under (bullish) the T-spot area.
- T-spots from two timeframes can be overlapped by running two copies of the indicator; the
  overlap is treated as confluence.
- Locate the T-spot on the candle following a confirmed candle 2 closure - it is where the
  next wick is expected.
- Look for entries only inside it.
- 'Limit branch: enter when price first trades into the fair value gap in the T-spot, stop
  below the low.'
- 'Confirmation branch: wait for a close over the series of opposing candles into the important
  level, stop on the new protected swing.'
- Repeat in candle 4 if candle 3 closed outside candle 2's range.
- Mark 0.5 of the higher-timeframe wick being formed.
- Mark 0.5 of the change in the state of delivery (or 0.5 of the daily opposing candle).
- Take the overlap of the two as the zone price must hold.
- Require the next candle's wick to form inside that zone and inside the relevant half of
  the higher-timeframe candle.
- Take the entry from a point of interest (fair value gap or order block) located inside the
  zone, not from the zone boundary itself.
- 'The T-spot and the wick location are treated as interchangeable statements of the same
  requirement: either the T-spot is respected or the wick forms inside it.'
- Opening beyond the T-spot is called less than ideal but is not an automatic veto - the setup
  is then carried forward and judged on what the candle does next (whether it makes the wick
  first).
- The T-spot is the zone in which the higher-timeframe candle's wick is expected to terminate.
- It is printed after (not before) the CISD and the protected swing.
- Require price to hold within it for the continuation to remain valid.
- In the Asia positional example the level used as the T-spot is the EQ of the candle being
  traded from.
- The t-spot is only marked AFTER the higher-timeframe closure and the lower-timeframe alignment
  (confirmation) have occurred.
- Look for a PD array or point of interest inside the t-spot; that is where the lower-timeframe
  entry is sought.
- If the higher-timeframe wick is absent, anticipate a retrace into the t-spot to form it.
- If the t-spot is large, do not take a positional entry - wait for price to reach back into
  it.
- Chart settings are locked to the model's two timeframes so the t-spot persists while dropping
  to lower timeframes.
- The box marks the zone in which the current higher-timeframe candle's wick should form.
- 'Bullish case: price must open, form its low inside the box, then trade away.'
- The entry object inside the box is a fair value gap / continuation, not the box boundary.
- Price trading beyond the box without holding it is the failure case (he shows one that chops
  through).
invalidation:
- A close beyond the T-spot area against the setup.
- Price trades beyond the low used for the stop.
- Price trades and holds beyond the T-spot - the shallow-wick condition for expansion has
  failed.
- Price trades through and holds beyond the T-spot — the wick is not forming where expected.
- Price trading beyond the far side of the t-spot / the wick extreme it defines.
- The wick does not form in the box and price does not respect it.
measurable:
- share of higher-timeframe wick extremes that actually land inside the T-spot
- forward outcome after a close beyond the T-spot
- share of next-candle wicks that terminate inside the T-spot
- limit-branch vs confirmation-branch fill rate and R outcome
- proportion of continuations whose wick terminates inside the T-spot
- expansion range following T-spot-respecting vs T-spot-violating candles
- frequency with which the two half levels fail to overlap at all
- share of higher-timeframe wicks terminating inside the T-spot
- expansion following T-spot-respecting versus T-spot-violating candles
- share of higher-timeframe wicks that terminate inside the marked t-spot
- return rate into the t-spot after alignment
- R:R distribution of positional entries by t-spot size
- share of higher-timeframe wicks terminating inside the painted box
- outcome of continuations that respect the box vs those that do not
