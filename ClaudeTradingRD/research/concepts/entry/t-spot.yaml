id: t-spot
name: The T-Spot (overlap of two half levels)
variants:
  name:
  - The T-Spot
  definition:
  - 'The Shorts state the T-spot''s function in one line: it is where all entries are looked
    for, because it is where the higher-timeframe wick is anticipated to form. Inside the
    T-spot the Short gives two alternative entries off the same zone - a limit entry when
    price first reaches down into the fair value gap with the stop below the low, or, if confirmation
    is preferred, waiting for price to close over the series of down-closed candles into the
    important level and entering there with the stop on the new protected low. Once candle
    3 closes outside candle 2''s range the same procedure repeats in candle 4.

    '
  - 'The narrow zone in which the next candle''s wick is expected to form, defined as the
    overlap of two 50% levels rather than as a single level. In the ES walkthrough it is the
    overlap of 0.5 of the higher-timeframe wick with 0.5 of the change in the state of delivery:
    he wants both respected, so the area where they overlap is where price must hold. In the
    CAD walkthrough the same idea is built from 0.5 of the daily opposing candle overlapped
    with the upper half of the daily candle - he wants the next candle''s wick to form inside
    that intersection. In both cases the T-spot is not itself the entry; a point of interest
    inside it (a fair value gap or an order block) is the entry, and the T-spot is the filter
    that decides which point of interest is the right one.

    '
  - 'Asked directly for the definition of the T-spot, he gives the purpose but refuses the
    derivation: it means where the wick should form — where the wick should go — and he says
    outright that he is not explaining where the name or the level is derived from (the name
    is a joke). In use across these streams it is printed by his indicator immediately after
    the CISD and the protected swing, it is the area the daily wick is expected to form in,
    and in the Asia example it is named interchangeably with the EQ of the candle being traded
    from.

    '
  - 'In this unit the t-spot is defined purely functionally: it is the area in which the higher-timeframe
    wick is expected to form, drawn by his indicator once the higher-timeframe sweep-and-closure
    and the lower-timeframe alignment are both present. Its operational uses are stated clearly
    - it is where a lower-timeframe point of interest is looked for, and it doubles as a diagnostic:
    if the t-spot has already formed the wick of the higher-timeframe candle, that is what
    he wants to see; if the higher-timeframe wick is missing, price can be anticipated to
    retrace into the t-spot to build one. A t-spot that prints large is a reason NOT to take
    a positional entry, because the stop below its lows makes the risk-to-reward unworkable.'
  - 'In this unit the T-spot is the box his indicator paints (grey in the index examples,
    green in the gold example) marking the area in which the wick of the daily candle should
    form before price trades away. He states the use explicitly - he wants price to open,
    make a low inside the area, and then trade higher, so the area is where the wick low must
    be held - and he shows what is inside it: a fair value gap, which is the object actually
    entered from. Asked directly how the indicator prints the T-spot he answers only that
    it is what he coded, so the derivation is withheld here.'
definition: 'The indicator-drawn box inside a higher-timeframe candle marking the area where
  that candle''s wick is expected to form - i.e. where a bearish day should make its high
  or a bullish day its low. Functionally it is the zone that must hold: price closing over
  the T-spot on a bearish setup is treated as the early warning that the continuation will
  fail. In one worked example the T-spot ''is just the equilibrium'', tying it to the candle
  EQ; a point of interest inside the T-spot is what the IC-CISD is sought at.'
category: entry
status: contested
aliases:
- T spot
- the gray box
- the green box
- T-spot
- the T spot
- overlapping those two
- our EQ, our T-spot
