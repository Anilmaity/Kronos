ambiguities:
- The derivation of the T-spot is never given in the free material - it is only ever described
  by its function. One example equates it with the equilibrium, another implies it is a band
  rather than a line.
- Whether the box is bounded by the candle EQ and something else (a half level of the wick?)
  is not stated in this unit.
- The Short never states how the T-spot's boundaries are constructed - it is shown as drawn
  by the indicator.
- No rule is given for choosing the limit branch over the confirmation branch.
- Sourced from an ASR (whisper-small) transcript, not YouTube captions; wording may be imprecise.
- In video Nlw-PZhoViQ the T-spot is named without being constructed on screen in the transcript,
  so this source corroborates how it is used but adds nothing to how it is built.
- 'The two videos construct the T-spot from different pairs of levels (wick + CISD in #2;
  opposing candle + daily candle in #3). Whether these are the same rule expressed differently
  or two variants is not stated.'
- No rule is given for what to do when the two half levels do not overlap.
- The name T-spot is used as though already known to the audience, so the canonical definition
  lives outside this unit.
- Whether the wick must terminate inside the zone or merely trade into it is not distinguished.
- The derivation is explicitly withheld — he says he is not explaining where the T-spot is
  derived from — so it cannot be computed from this unit.
- Naming it as the EQ in one example conflicts with the two-overlapping-half-levels construction
  recorded elsewhere in the corpus; both readings are used in this unit without reconciliation.
- Whether the wick must terminate inside it or merely trade into it is still not distinguished.
- The t-spot's construction is never given in this unit - it is produced by his paid indicator,
  so the level cannot be reproduced from this source alone.
- '''A bit large'' as the disqualifier for a positional entry is not quantified.'
- Whether the t-spot is derived from the higher-timeframe candle, the lower-timeframe one,
  or the overlap of both is not stated here.
- The derivation is explicitly withheld - asked how the indicator prints it, he says only
  that it is what he coded.
- The box appears grey in some examples and green in others with no stated difference in meaning.
- '''Respected'' is not defined as a wick touch, a body close or a full hold.'
