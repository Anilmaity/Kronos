ambiguities:
- No rule ranks two arrays sitting at the same price from different timeframes.
- He rejects one candidate order block in the worked example purely on appearance ('it doesn't
  look clean enough for me'), so the ladder's membership is partly discretionary.
- The matrix ordering is attributed to ICT and stated from memory, not derived.
- No rule says how much of the position comes off at each step.
