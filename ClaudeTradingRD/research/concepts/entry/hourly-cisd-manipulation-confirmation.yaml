ambiguities:
- Body close or wick close through the up-close candle is not specified.
- The transcript garbles 'higher timeframe PD array' as 'hard time for impede array' and 'change
  in state of delivery' as 'change in stated/sale/Theta delivery' throughout, so no phrasing
  here is verbatim-reliable.
- The breaker alternative is shown once and never given the same three-step formality.
- '''Aggressive and fast and convincing'' is a qualitative filter with no measure.'
- No maximum delay between the sweep and the confirming hourly close is given.
- Whether the close must be a body close is not stated (though 'close below this up closed
  candle' implies it).
