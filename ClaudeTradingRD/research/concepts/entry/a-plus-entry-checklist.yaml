id: a-plus-entry-checklist
name: A+ Entry Checklist
definition: 'EARLIER RECORDING (old ''Education - ICT'' playlist; re-recorded later as 0xygpCMwxbQ,
  the canonical reading). Here the checklist is framed explicitly as the ICT 2022 MENTORSHIP
  MODEL - a framing the later recording drops entirely. The steps are: (1) a liquidity grab;
  (2) a market structure shift WITH displacement; (3) a fair value gap or order block positioned
  above/below the 0.5 fib of the DISPLACEMENT RANGE - premium for shorts, discount for longs;
  (4) price returns into it; (5) solid risk-to-reward. The substantive addition over the later
  version is an explicit SUBSTITUTION for step 1: the liquidity grab does not have to be a
  run of highs or lows - trading into a higher-timeframe imbalance counts as the same thing,
  ''a higher time frame reasoning''.'
variants:
  definition:
  - 'The fixed, ordered gate he applies AFTER a daily bias or direction already exists: (1)
    a stop raid — a low (or high) was put in and then run; (2) a market structure shift or
    displacement — a previous high broken and aggressively moved over; (3) price returns into
    a DISCOUNT of the displacement range (the one place he grants flexibility); (4) some PD
    array in that area — his preference order is fair value gap or order block, and he also
    uses OTE and breaker block. Each of the four could be an entry model on its own; he blends
    one, two or three.'
category: entry
status: contested
aliases:
- my a plus setup
- the 2022 mentorship model
- my a plus ICT entry checklist
preconditions:
- A directional idea exists before the checklist is applied.
- A daily bias / direction has already been established — the checklist does not produce direction.
detection_rules:
- '1. A liquidity grab: equal highs/lows or an obvious swing is run.'
- '1b. SUBSTITUTE: price trading into a higher-timeframe fair value gap counts as the liquidity
  grab.'
- 2. A market structure shift with displacement - an aggressive break of the opposing short-term
  extreme.
- 3. Fib the displacement range low-to-high (longs) and require the entry PD array below the
  0.5; mirror for shorts.
- 4. A fair value gap or order block, ideally unmitigated, inside that half.
- 5. Entry there; stop above the fair value gap, or on the candle that created it - stated
  as user discretion.
- He explicitly dislikes stops placed all the way at the swing low - too much risk.
- 'Exits are a partial ladder: first partial at the nearest opposing liquidity, second at
  the next, third/final at the day''s extreme.'
- '1. Stop raid: a swing low (bullish case) is put in and then broken.'
- '2. Market structure shift / displacement: a previous high broken and aggressively closed
  over.'
- 3. Fib the displacement range; require price back into the discount half (below 0.5) for
  longs, premium half for shorts. An OTE narrows this further.
- '4. A PD array inside that discount: fair value gap, order block, OTE, or breaker block
  — blended is preferred.'
- Choose among the candidate entries by risk-to-reward balanced against fill probability,
  since moving the entry toward the stop raises R but lowers fill odds.
- 'Hard gate: without a lower-timeframe liquidity raid before the move, he is not interested
  — displacement alone does not qualify.'
invalidation:
- No liquidity grab and no higher-timeframe imbalance reached.
- The PD array sits on the wrong side of the 0.5 of the displacement range.
- The PD array sits in a premium of the range for a long (his stated reason for rejecting
  an otherwise valid FVG).
- No prior stop raid before the displacement.
measurable:
- hit rate when step 1 is a literal sweep vs when it is the HTF-imbalance substitute
- R difference between the tight (FVG) stop and the swing stop
- how often each of the three partials is reached
- fill rate vs realised R across the four entry refinements on the same setup
- outcome of setups missing the discount condition
