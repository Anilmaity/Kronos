ambiguities:
- 'EVOLUTION, NOT CONTRADICTION: this is the EARLIER recording. The later 0xygpCMwxbQ states
  a HARD gate - no lower-timeframe liquidity raid, no interest - whereas this earlier version
  explicitly SOFTENS the same step by allowing a higher-timeframe imbalance to substitute
  for the raid. The two readings pull in opposite directions on the same condition; both preserved,
  the later one is canon.'
- '''Solid risk to reward'' is never given a number in this recording (the later corpus uses
  2R).'
- Stop placement is explicitly left to user discretion.
- '''Aggressively'' / ''energetically'' describe displacement without a threshold.'
- '''A little bit of flexibility'' on the discount requirement is never bounded — the box-setup
  example is admitted with NO structure shift at all.'
- The choice among FVG / OB / OTE / breaker is explicitly 'what catches my eye the most' —
  not decidable.
- Partial-taking and break-even are shown but not specified as rules.
