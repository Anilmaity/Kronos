ambiguities:
- No rule bounds when the 15-second is too thin to trade beyond 'if the volume's not there'.
- Commission and slippage costs of the higher trade frequency are never netted against the
  payoff improvement.
- The claimed 80-90% accuracy at picking the higher-timeframe point of interest is unsourced
  and unmeasured.
- The exception allowing 15-second trading with no higher-timeframe reference is not bounded.
