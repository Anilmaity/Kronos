id: rr-gated-entry-refinement
name: Refine The Entry Downward Until Risk-To-Reward Works
definition: 'The dedicated earlier lesson, worked as an explicit arithmetic comparison on
  one setup. Fix the target (the previous day''s low in his example). Enter on the highest
  timeframe first and compute R: the 15-minute entry gives 1.79R. Step down to the 5-minute
  - here the refinement yields nothing, because the order block available gives the same level.
  Step down to the 1-minute and wait for a CONFIRMED setup (structure break plus fair value
  gap), which allows a much tighter stop and a materially higher R to the same target. He
  states the payoff in win-rate terms rather than profit terms: a higher risk-to-reward lets
  you run a lower win rate.'
variants:
  definition:
  - 'The rule that decides which timeframe supplies the entry. The target is fixed first -
    the nearest real objective, typically the intraday highs or lows - and the entry timeframe
    is then whatever is required to reach that target at acceptable risk-to-reward. In the
    ES walkthrough he tests the 5-minute continuation and rejects it because the stop is too
    far for the target, tests the 3-minute and rejects it for the same reason, and only then
    - "rarely, and in this case" - refines to the 1-minute, where the same wick / close-through
    / protected-low structure appears at a size that gives just over 4R. The crucial constraint
    is the one he states negatively: he will not extend the target to manufacture the ratio,
    because price may reverse at the nearer level anyway. If no refinement level produces
    acceptable risk-to-reward, the correct action is to keep waiting for further continuations
    rather than to force the trade.

    '
category: entry
status: contested
aliases:
- seek continuations until the risk-to-reward makes sense
- refining the entry
preconditions:
- A higher-timeframe point of interest has been tagged.
- The target is already fixed.
- A confirmed directional idea from the higher timeframe.
- A target chosen independently of the entry - the nearest genuine objective, not a distance.
detection_rules:
- Fix the target first; never move it to make the ratio work.
- Compute R at the current timeframe's entry and stop.
- If R is unsatisfying, step down one timeframe (15m -> 5m -> 1m) and look for a tighter structure
  to enter against.
- A step down may yield nothing - he shows the 5-minute producing the identical ratio - in
  which case step down again.
- On the lowest timeframe wait for a CONFIRMED setup (structure break plus fair value gap)
  rather than entering at the raw level.
- Where two stop levels are available, the wider one is 'safer' when the nearer level can
  be run.
- Fix the target first (intraday highs/lows or the higher-timeframe draw).
- Attempt the entry on the current timeframe; compute R from the required stop (the protected
  swing) to the fixed target.
- If R is insufficient (roughly 2R is treated as the working minimum), do not take it - step
  down one timeframe and look for the next continuation.
- 'Repeat: 5m, then 3m, then 1m. The 1-minute is described as rarely used.'
- Never extend the target to make the ratio acceptable.
- If no level works, keep waiting for further continuations rather than entering.
- 'A second trigger for dropping a timeframe, independent of R: if the current timeframe will
  not produce a swing formation (because the higher-timeframe wick is already forming), step
  down to one that will.'
invalidation:
- Price reaches the target before an acceptable entry appears - the trade is missed and is
  not chased.
measurable:
- R at 15m vs 5m vs 1m entries on the same setup and target
- break-even win rate implied by each
- distribution of refinement timeframe actually used per trade
- R achieved by refinement level
- frequency of missed trades where no refinement level qualified
