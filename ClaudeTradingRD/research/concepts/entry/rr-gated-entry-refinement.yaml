ambiguities:
- No minimum acceptable ratio is stated in this video; 1.79R is called 'not horrible'. The
  2R minimum recorded elsewhere in the corpus is absent here.
- No stopping rule for how far down to refine; 1-minute is the floor demonstrated, but 15-second
  is used in other videos of this unit.
- The win-rate claim is asserted, never computed.
- Sourced from an ASR (whisper-small) transcript, not YouTube captions; wording may be imprecise.
- 'Video Nlw-PZhoViQ contains a counter-case to the never-extend-the-target constraint: he
  acknowledges he cannot reach the R multiple against the nearest low, and takes the entry
  anyway because he is targeting the higher-timeframe objectives instead. The two videos are
  not reconciled. (The R figures in that passage are mistranscribed by the ASR and are read
  from context.)'
- The minimum acceptable ratio is never stated as a rule. 2R is repeatedly treated as sufficient
  in the narration and sub-2R setups are refused, so 2R is inferred, not taught.
- No stopping rule is given for how far down to refine; the 1-minute is described as rare
  but not as a floor.
- In video w-JekHg6Ldk the same logic appears as a refusal to use a distant protected low,
  without the explicit timeframe ladder.
