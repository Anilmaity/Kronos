  quote: failure to displace lower popped up there is our entry long
ambiguities:
- What qualifies as 'the next displacement leg' inherits the unquantified `displacement` problem.
- No cap on iterations, and no rule for abandoning the objective.
- Whether the old range is discarded or kept alongside the new one is not stated.
