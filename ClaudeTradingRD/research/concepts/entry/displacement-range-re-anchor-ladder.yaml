id: displacement-range-re-anchor-ladder
name: Re-anchor The Displacement Range After Every Missed Entry
definition: 'A repeatable recovery procedure for a missed entry, stated as a loop and demonstrated
  four times in a row on one chart. After displacement, draw the range from where the displacement
  STARTED to where it ENDED and look for a PD array in its discount (long case). If price
  does not reach your level, or you miss the fill, do not chase: wait for the next displacement
  leg, MOVE the range anchors to that new leg, and look again in the new discount. Each iteration
  also creates fresh internal liquidity, which he wants swept before the continuation - so
  each cycle is: new displacement leg -> re-anchor -> internal liquidity below -> sweep ->
  long. He states the stopping condition explicitly: keep doing this until you reach your
  objective.'
category: entry
status: specified
preconditions:
- A higher-timeframe objective is already fixed.
- A displacement leg has occurred.
detection_rules:
- Anchor the range at the start and end of the displacement leg.
- Look for a PD array (order block, fair value gap) in the discount (long) / premium (short).
- If the entry is missed or not reached, wait for the next displacement leg and re-anchor
  to it.
- Before each continuation, expect the internal liquidity created by the previous leg to be
  swept.
- Repeat until the higher-timeframe objective is reached; the objective, not the entry, ends
  the loop.
- 'Confirmation that a sweep is a sweep and not a reversal: no displacement below the structure
  after the low is taken.'
measurable:
- number of re-anchor iterations per objective
- R of the Nth iteration vs the first
sources:
- video_id: YmdC_LKT-Pk
  title: Lower Time Frame Entries Using HTF POI - ICT Concepts
  quote: draw out your OTE from where your displacement range started to where it ended
