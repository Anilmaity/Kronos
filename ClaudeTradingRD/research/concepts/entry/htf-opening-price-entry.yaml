ambiguities:
- '''Near the opening price'' is never bounded as a distance or fraction of the candle.'
- Which HTF candle governs (1H vs 4H vs daily) is left to the trader; he states repeatedly
  that the entry timeframe itself does not matter.
- '''Around'' and ''near'' are not bounded — no percentage of candle range or number of ticks
  is given.'
- Which timeframe's open governs when several are stacked is not stated, though the examples
  use the one being traded within.
- No tolerance band around the open is given at any timeframe.
- The yearly-open rule is given as his personal approach to long-term investing, explicitly
  'to each their own', and is not part of the trading model.
- Which higher-timeframe open governs when several conflict is not addressed.
- '''The middle of the candle'' and ''near the opening price'' are given as one option, but
  no boundary is drawn between acceptable and too-far.'
- Which higher-timeframe candle is meant is context-dependent - the example moved between
  the daily and the 4-hour.
