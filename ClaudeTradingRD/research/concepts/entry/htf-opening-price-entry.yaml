id: htf-opening-price-entry
name: Enter Around The Higher-Timeframe Opening Price
definition: 'Entries belong near the opening price of the higher-timeframe candle you intend
  to trade. The logic is explicit: to capture the body of an expansion candle you must be
  positioned before the body is built, which is only possible near the open. Entering before
  the candle''s counter-directional wick has formed puts you in drawdown by construction;
  entering after the candle has already produced its average range is a chase.

  '
variants:
  definition:
  - 'His stated one-line cure for chasing: enter around — or near, or beyond in the direction
    of the trade — the opening price of the higher-timeframe candle, never after that candle
    has already made its range. He gives it both as a filter question to ask before clicking
    ("Am I entering near the higher timeframe open?") and as a diagnosis of other traders''
    losses, which he says cluster at the far end of an expansion candle rather than at its
    open. The corollary is procedural: if the candle has already expanded, wait for the next
    candle open, because the continuation entry is precisely the trade that puts you back
    at an opening price.

    '
  - 'The positioning rule stated at both ends of the timeframe ladder in the same unit. Intraday:
    the entry belongs around the opening price, early in the candle - asked where he would
    buy a bullish gold day he says around the opening price and refuses to buy at the highs.
    For long-term positions he applies the identical logic to the yearly candle: buying below
    the yearly open is a better buy than above it, because it is just a candle, and buying
    inside the wick below the yearly open is where he wants to accumulate. He describes doing
    exactly that - dollar-cost averaging daily but adding size on dips into higher-timeframe
    gaps, with the stop and target framed off the same structure.

    '
  - 'The positional argument against chasing: you want to be entering in the middle of the
    candle or near its opening price, not after the candle has already made its range. He
    applies it to reject a silver setup sitting at the range highs with the daily range already
    covered, and says explicitly that this is what keeps him from chasing. The same principle
    appears as the mechanical form of his bullish day - working from the previous day''s EQ
    and wanting the wick to form in the upper part of it, with the previous month''s EQ nearby.'
