preconditions:
- A higher-timeframe candle has opened and a directional bias for it exists.
- A higher-timeframe candle whose open is identifiable on the chart.
- The opening price of the governing higher-timeframe candle is marked.
detection_rules:
- Wait until the counter-directional wick of the HTF candle has formed (a lower-timeframe
  reversal/CISD marks this).
- Enter while price is still near the HTF candle's opening price.
- Do not enter once the candle's realised range approaches or exceeds its typical range.
- Before entering, test whether the fill is near the open of the governing higher-timeframe
  candle.
- Reject entries located near the far extreme of an already-expanded candle.
- If the candle has already expanded, wait for the next candle open and take the continuation
  there.
- For a bullish entry, at or below the opening price is acceptable; the rejected case is entering
  after the range is made.
- Enter around the opening price of the governing higher-timeframe candle, early in that candle.
- Do not enter at the extreme already reached (the highs on a long, the lows on a short).
- 'Long-term: price below the yearly open is a better buy than price above it; buying the
  wick below the yearly open is the preferred accumulation zone.'
- Combine with a higher-timeframe gap for the stop-and-target framing.
- Locate the current higher-timeframe candle's opening price.
- Enter near that open or in the middle of the candle's range.
- Do not enter once the candle has already made its range or is at its extreme.
- Cross-check against the daily range already covered.
invalidation:
- Price is already beyond the previous swing/high-low that defined the objective - treated
  as a chase, skip.
- The wick has not formed yet - entry is premature.
- Not applicable — this is an entry-location filter.
- Price closes beyond the higher-timeframe open in the opposing direction.
measurable:
- MAE of entries taken near the HTF open vs mid-body.
- Realised R by entry distance from the HTF opening price.
- R by distance of fill from the higher-timeframe open
- share of losing trades entered in the last third of an expansion candle
- expectancy by distance of entry from the higher-timeframe open
- forward return of positions initiated below vs above the yearly open
- expectancy by entry location within the higher-timeframe candle range
