ambiguities:
- The transcript renders '0.5 fib' as '8.5 FIB'; it is read as 0.5 (the 50% level), consistent
  with the rest of the corpus and with the arithmetic of the quoted 3.5 -> 1.75 point stop
  reduction.
- For a multi-candle series it is not stated whether body_high/body_low span the whole series
  or the first candle only.
- '''Break'' and ''close beyond'' are used interchangeably in the propulsion-block test, so
  wick-through vs body-through is undecided.'
- Bodies are specified for the mean threshold while the order block level itself is the opening
  price — the two constructions are not reconciled for a single-candle block.
- For a multi-candle series it is not stated whether body_high/body_low span the whole series
  or only the first candle.
- No rule for when the mean threshold should be preferred, other than that entering off the
  opening price does not make sense for a large series.
