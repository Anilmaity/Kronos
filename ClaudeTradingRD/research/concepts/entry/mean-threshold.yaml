id: mean-threshold
name: Mean Threshold Of An Order Block
definition: 'The 0.5 fib level of an order block measured from body high to body low. It is
  used as an alternative entry to the opening price, and its stated benefit is stop-size reduction:
  in the worked example the opening-price entry required a stop at the block low for 3.5 points
  of risk, while the mean-threshold entry cut that to 1.75 points. It is also used as a behavioural
  test on propulsion blocks, where price must not break or close beyond it.'
variants:
  definition:
  - 'The 50% level of an order block measured from the body low to the body high of the candle
    or series that forms the block. It is used both as a behavioural test — price respecting
    the block should not close beyond its mean threshold — and, more often in practice, as
    an entry refinement when the order block is large and entering at the opening price would
    give unacceptable risk-to-reward.

    '
category: entry
status: contested
aliases:
- mean threshold
- main threshold (auto-caption)
- 0.5 fib of the body
- 50% of the order block
- '"main threshold" (auto-caption)'
preconditions:
- A validated order block or propulsion block.
- A validated order block (see order-block).
detection_rules:
- body_high := max(open, close) of the block; body_low := min(open, close).
- mean_threshold := the 0.5 fib between body_high and body_low.
- 'Entry alternative: enter at mean_threshold instead of the opening price to reduce stop
  distance.'
- 'Respect test (propulsion blocks): price must not break or close beyond the mean threshold.'
- body_high := max(open, close) across the candles of the order block series; body_low :=
  min(open, close).
- mean_threshold := (body_high + body_low) / 2.
- 'Respect test: no candle closes beyond the mean threshold while the block is being defended.'
- Use as entry when the opening-price entry yields less than the minimum acceptable R:R (examples
  target >= 2R).
invalidation:
- A break or close beyond the mean threshold against the intended direction.
- A close beyond the mean threshold against the intended direction.
measurable:
- fill rate of mean-threshold entries vs opening-price entries
- 'measured stop-size reduction across a sample (his example: 3.5 points -> 1.75 points)'
- fill rate of mean-threshold entries (how often price trades that deep)
- 'R:R uplift vs opening-price entries in the same sample (his examples: 1.3R -> 2.6R, 1.95R
  -> 2.6R)'
- hit rate conditional on the mean threshold having been closed through earlier
