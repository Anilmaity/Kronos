- daily-wick-as-balanced-price-range
- monday-range-marker
- unicorn-entry-model
timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
execution:
  bias: Daily bias direction.
  entry: M15/M5 balanced price range, then the order-block-turned-breaker.
  stop: Above the session high used for the sweep; the worked examples used 13 and 25 pips.
  targets:
  - previous session lows (Asia, Monday)
  - previous week lows
  - the daily draw
