preconditions:
- A confirmed candle 2 (or candle 3) closure with its own reversal CISD.
- The continuation candle has opened.
- A candle 2 closure exists and candle 3 is forming.
- A point of interest against the bias is defined (the lows to be run, bullish case).
- Candle 2 closure with a valid CISD on the previous candle.
- A new continuation (protected swing) formed before the new candle's open.
- A higher-timeframe candle is open and its wick is still forming.
- The extreme of that wick is at a point of interest — a high, a low, or a fair value gap.
- A higher-timeframe candle 3 (continuation) is in play after a candle 2 closure.
- A continuation candle forming inside a higher-timeframe candle.
- A higher-timeframe candle is in progress and has not yet completed its wick.
detection_rules:
- Inside the continuation candle, wait for price to reach a point of interest against the
  intended direction (a fair value gap, or a high/low swept) - ideally inside the T-spot.
- Identify the series of opposing candles into that point of interest.
- Require a close through that level - this is the intracandle CISD, and it forms a protected
  swing inside the higher-timeframe candle.
- Once formed, treat the higher-timeframe wick as complete and trade the body away from it.
- 'TIMING RULE: it is ideal for the IC-CISD to form EARLY in the candle so the candle has
  time and range to expand. If it forms late in the candle but is still valid, wait for the
  NEXT candle - it brings new range.'
- A point of interest too far into the candle (e.g. a gap high above the T-spot) is explicitly
  not wanted, because from there expansion is less likely.
- New continuations forming later inside the same candle are additional valid entries.
- A run of the opposite-side highs first does not invalidate a bullish bias unless it is a
  reversal off the previous day high.
- If the first candidate intracandle swing is consolidation-like, do not trust it - require
  another sweep.
- Accept the IC-CISD only after the sweep is followed by an aggressive move out.
- Treat that continuation as the formed daily wick and trade the body in the bias direction.
- Inside the higher-timeframe candle, wait for a reach into an important level against the
  intended direction (FVG, or sweep of a prior low/high).
- Require a close through the series of opposing candles into that level - this forms the
  intracandle protected swing.
- 'Entry: on the close-through, or anywhere after it as long as the stop is near that protected
  swing.'
- 'Timing filter (hourly model on indices): before 9:30 he prefers to read the 15-minute candle
  rather than the hourly for this formation.'
- If the wick is anticipated with high confidence, a discretionary entry anywhere in the zone
  with the stop on the extreme is allowed instead of waiting for the IC-CISD.
- Inside the new candle, wait for price to move into a point of interest against the bias.
- Require a close through the series of up-close (bearish case) candles into that point of
  interest = IC-CISD.
- Treat the resulting high as the protected intraday high = the daily wick high.
- Identify the short-term counter-trend inside the open higher-timeframe candle (the leg forming
  the wick).
- Find the series of consecutively opposing-close candles that produced the extreme.
- Require a close through that series, into or from the point of interest.
- Optionally require the relevant half of the higher-timeframe candle to be respected.
- The resulting swing becomes the protected swing and therefore the stop; entry may be taken
  anywhere that gives acceptable risk-to-reward.
- Wait for the higher-timeframe candle to open.
- Inside it, wait for a continuation / protected swing to form - this is what builds the candle's
  wick.
- Wait for that lower-timeframe continuation to close.
- Enter in the higher-timeframe candle's direction on that close.
- Place the stop on the wick the continuation formed.
- Used to determine where the wick of a continuation candle forms.
- A CISD prints on a lower timeframe inside the developing higher-timeframe candle.
- The CISD must occur off a point of interest; if no FVG or high/low exists, the CISD level
  itself is used.
invalidation:
- The protected swing formed by the IC-CISD is taken out.
- Price spends too long consolidating instead of producing the closure - the continuation
  can fail.
- A reversal off the previous day high (bullish case) - stated as the condition that would
  invalidate the bias.
- 'Entry not filled on the retest: no trade.'
- The protected wick high is traded through.
- The new extreme formed by the IC-CISD is taken out — the wick was not finished.
- Price trades back through the wick the continuation formed.
- Not derivable from this unit.
- Not stated in these transcripts.
measurable:
- distance from candle open to the IC-CISD, expressed as a fraction of the candle's duration,
  vs subsequent expansion (the early-vs-late claim is directly testable)
- share of continuation candles that produce an IC-CISD at all
- R distribution of IC-CISD entries vs positional entries at the open
- share of candle-3 IC-CISD setups where the first candidate swing was consolidation-like
  and a second sweep was required
- fill rate of retest entries priced for 2R
- R achieved by IC-CISD entries vs discretionary pre-CISD entries
- hit rate of IC-CISD-confirmed wicks (extreme not revisited before the candle closes)
- R achieved from IC-CISD entries versus waiting for the higher-timeframe close
- frequency of IC-CISD per higher-timeframe candle
- win rate of IC-CISD entries vs entries taken at the higher-timeframe candle open
- average stop distance (wick depth) as a fraction of the higher-timeframe candle range
- accuracy of a predicted continuation-candle wick extreme, once the mechanics are recovered
- Rate at which an intracandle CISD coincides with the final wick extreme of the HTF candle.
