ambiguities:
- The IC-CISD inherits the unresolved 'level of the series' question from the CISD definition.
- '''Early'' vs ''late'' in the candle is never given a fraction or a clock time.'
- How long 'too long consolidating' is, before the continuation is abandoned, is deferred
  to a separate video (Why Your Continuations Fail).
- '''Consolidation-like'' and ''aggressive move out'' are not defined mechanically.'
- Execution timeframe is not named in the Short.
- Whether 'previous day high' here is the candle 2 high or the prior day of the chart is not
  explicit.
- The pre-9:30 15-minute preference is said in passing inside one 5-minute/hourly example;
  whether it means the 15-minute replaces the hourly as the HTF candle or as the confirmation
  timeframe is not explicit.
- A first IC-CISD that fails off the open (gold example in cWDnzI3lpUk) is called 'a valid
  loss'; a later protected swing in the same candle is then taken - no limit on re-entries
  is given.
- 'TRANSCRIPT ARTIFACT: "candle to closure" = candle 2 closure.'
- Two protective highs are named (the pre-open continuation high and the IC-CISD wick high);
  which one the stop uses is not stated.
- The point of interest inside the candle is not identified.
- The 'respecting the upper half' step is offered as optional ('if you want to'), so it is
  not clear whether it is part of the rule or a preference.
- How many opposing-close candles constitute the 'series' is not bounded, here or anywhere
  in the corpus.
- Entry is deliberately left free ('you can enter really however you want if it makes sense
  in terms of risk-to-reward'), so the concept fixes the stop and the trigger but not the
  fill.
- Which lower timeframe the continuation is read on is not fixed here; the example was walked
  on a 3-minute chart inside an Asia-session move.
- He notes the live example was not ideal ('it doesn't actually' reach), so the acceptable
  geometry of the wick is not pinned down.
- The transcript spells it 'ICCD' / 'ICCISD' / 'IC'.
- The mechanics are never given. He says the video exists under a different title but does
  not name it.
- The auto-caption renders the term as 'ICSD' when spoken by the viewer and he does not spell
  it out; it is read as intracandle change in the state of delivery, matching the corpus elsewhere.
- Whether it is applied to every continuation candle or only to specific ones is not stated.
- No lower-timeframe is specified for detecting the intracandle CISD.
- No invalidation is given.
- He compares it loosely to a 'unicorn' formation but says it is cleaner; the difference is
  not defined.
- He states a dedicated public video exists under a different name, which is not identified
  in this transcript.
