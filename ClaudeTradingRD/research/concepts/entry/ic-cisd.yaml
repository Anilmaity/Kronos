id: ic-cisd
name: Intracandle CISD (IC-CISD)
definition: 'The channel''s own invention, stated as such: a change in the state of delivery
  applied INSIDE a continuation candle in order to MECHANICALLY DEFINE THE FORMATION OF A
  WICK. In candle 3 of a bullish sequence the candle opens with a short-term BEARISH trend
  while it forms its lower wick; when that intracandle trend shifts to bullish - the same
  point-of-interest-plus-closure test, producing a protected swing inside the candle - the
  wick is declared formed and the body can be traded. The whole concept exists to answer one
  question mechanically: has this candle finished making its wick? It applies to candle 4
  as well as candle 3.'
variants:
  definition:
  - 'Worked Short on a bullish candle 3 after a candle 2 closure. The point of interest is
    the run of the lows; price instead runs the highs first and moves aggressively against
    the bias. He does NOT invalidate the bias because the move is not a reversal off the previous
    day high, and waits for a new continuation. The first candidate level looks like a consolidation
    and is ''really hard to trust'', so he requires another sweep; after it, an aggressive
    move out forms the continuation inside candle 3, which he takes as the formed daily wick.
    Trade: long, stop on the low, target the daily high, 2R reached by a retest (limit) entry;
    it is not filled and that is accepted.'
  - 'Restated as the mechanical definition of ''let the wick form'': with a directional expectation
    for the higher-timeframe candle, the candle first shows a short-term counter move (forming
    the wick) and then a shift back - price reaches an important level (fair value gap, swept
    high/low) and closes through the series of candles that made the extreme inside that level.
    That creates a protected swing inside the candle, which is anticipated to be the candle''s
    wick and is used as the stop. He says he created the concept specifically to mechanise
    that logic, and that it is the go-to entry in the daily + hourly fractal model.

    '
  - 'Short walkthrough of letting the wick form with an intracandle CISD (bearish case, hourly
    inside an aligned daily candle). The prior candle is a candle 2 closure with a valid change
    in the state of delivery, and a new continuation has formed before the new candle opens,
    so that high should hold if price is to trade lower. Inside the new candle price moves
    choppily up into a point of interest, then closes through the series of up-close candles
    there - a valid intracandle CISD. The high it protects is treated as the daily wick high,
    which must remain intact for the move lower; the example then expands lower.

    '
  - 'The change in the state of delivery that happens *inside* a single higher-timeframe candle,
    used to confirm that that candle''s wick is finished. His reasoning is stated explicitly
    here for the first time in this unit: for price to make a wick it has to have a short-term
    trend in the opposite direction, so inside a candle whose wick is forming, price is trending
    against the candle''s intended direction; the IC-CISD is the moment that internal short-term
    trend flips. Mechanically it is the same CISD test applied intracandle — price closes
    over (or under) the series of opposing-close candles that made the extreme, with that
    extreme sitting at a point of interest, and optionally with the upper (or lower) half
    of the candle respected. He states it is his own invention rather than something inherited.

    '
  - 'Defined on stream as a CISD or continuation - a protected swing - that forms the wick
    of the higher-timeframe candle, taken in candle 3. It is described as his mechanical way
    of forcing the trader to let the wick form: the higher-timeframe candle opens, a continuation
    forms inside it and that continuation is what builds the wick; once that continuation
    closes, the trade is taken in the candle''s direction with the stop on that wick.'
  - 'Asked what ICSD is, he gives the only definition of it in this unit: a concept he created
    within his fractal model which determines the wick of a continuation candle. He adds that
    he has not made a video called that - he has made a video on the idea but does not use
    the name in it - and separately confirms that he coined the C2, C3 and IC-CISD terminology
    himself. No mechanics are given here, so the concept remains a name attached to a job
    (locating where a continuation candle''s wick will end) rather than a testable rule.

    '
  - 'A change in state of delivery occurring inside a higher-timeframe candle, described as
    the mechanism that forms that candle''s wick. Presented in Qv6Ux_Z8VrA as a concept he
    created and has mostly kept inside his mentorship. It requires a point of interest; if
    no fair value gap or high/low is available, the CISD level itself can be used as the level.

    '
category: entry
status: contested
aliases:
