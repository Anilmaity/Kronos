id: mmxm-second-leg-entry
name: Enter On The Second Leg, At The Failure Swing
definition: 'Asked directly whether he enters at the intermediate high/low or at the failed
  swing in a market maker model, AM Trades answers unambiguously: the failed swing, because
  that is the second leg of distribution (or accumulation in a buy model). The reasoning is
  structural. The first leg produces the retracement into the fair value gap, and that retracement
  is what creates the intermediate-term rebalance point; only the second leg produces the
  failed price swing that targets the completion of the model. He confirms separately that
  the fair value gap most people call the silver bullet forms after the intermediate-term
  swing point is created, that the stop sits near that intermediate-term high so it functions
  as a defended stop, and that the entry is the second retracement into a fair value gap.'
category: entry
status: specified
aliases:
- second leg of distribution
- defended stop
preconditions:
- A market maker model in progress with a smart money reversal already formed.
- An intermediate-term swing point created by a retracement into a fair value gap.
detection_rules:
- Leg 1 = the retracement into the fair value gap that creates the intermediate-term rebalance
  point. Do not enter here.
- Leg 2 = the leg that produces the failure swing; the fair value gap on this leg is the entry.
- The intermediate-term swing point must already exist before the entry gap counts.
- Place the stop just beyond that intermediate-term swing point - a defended stop.
- Target the completion of the model (the original consolidation / the opposing liquidity).
invalidation:
- The intermediate-term swing point the stop sits behind is violated.
measurable:
- hit rate and R of second-leg entries vs first-leg entries on the same models
- how often a second leg fails to produce a failure swing at all
sources:
- video_id: CrUfTskOveo
  title: Stream Q & A with AM Trades  - ICT concepts
  quote: i have a preference for that second leg
- video_id: CrUfTskOveo
