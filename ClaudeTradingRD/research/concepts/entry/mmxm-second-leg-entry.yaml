  quote: that second leg is going to give you that failed price swing
ambiguities:
- '''Failure swing'' is used throughout without being defined in this video.'
- No rule is given for what to do when the second leg does not produce a failure swing.
- No maximum number of legs is stated, so a third leg is neither permitted nor excluded.
