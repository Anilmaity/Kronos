ambiguities:
- The exact OTE band (0.62-0.79 in common ICT usage) is never spoken - only 'above equilibrium'
  and 'OTE' are said.
- Which high and which low anchor the fib when several candidates exist is not stated.
- Whether the wick or the body must be above equilibrium is not stated.
- The range whose 50% is measured is never specified (weekly, daily, or the current leg).
- 'Marked underspecified for this reason: without the range definition the rule is not decidable
  on a chart.'
