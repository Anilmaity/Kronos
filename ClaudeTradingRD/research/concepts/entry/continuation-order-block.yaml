id: continuation-order-block
name: Continuation Order Block (Continuation Entry)
definition: 'His preferred entry, taken AFTER the reversal is already confirmed rather than
  at it. He names exactly two qualifying trigger conditions and one waiver. The two: (a) price
  retraces into a FAIR VALUE GAP, or (b) price SWEEPS A LOW (or high); then in either case
  the close through the series of opposing candles that went into that level creates a new
  invalidation to position from. The waiver: with correlated assets showing SMT, an opposing
  candle is accepted without its own sweep or gap tag. He is explicit that if neither trigger
  occurs, mechanically there is no entry and the move is simply missed.'
variants:
  definition:
  - 'Four Shorts give the same four-step recipe for the continuation entry inside an expansion.
    Price retraces into an important level (generally a fair value gap), an opposing candle
    (down-close in the bullish case) prints into that level, price closes over that opposing
    candle, and the close creates a new protected swing which is the invalidation. The entry
    is taken at the retest of that block, the stop on the new protected swing, and the target
    is 2R or the liquidity the move is drawing toward. One Short adds the negative case: reaching
    the point of interest and printing a candle closure is not enough if no continuation forms.

    '
  - 'The Short gives the one-line definition the long-form videos leave implicit: a continuation
    order block is an order block that is NOT formed at the reversal but within a continuation.
    After a trend change is signalled (a sweep of the low plus a change in the state of delivery
    / bullish order block), taking the entry right there is trading a reversal; the alternative
    he prefers is to wait, let price expand away and leave a fair value gap, let price reach
    back into that gap and close over the down-close candle that went into it, which forms
    a protected low, and enter on that newly formed order block with the stop on the new low
    and a 2R target.'
  - 'The entry object he uses in place of a reversal entry. After a reversal and a change
    in state of delivery, price either retraces into a fair value gap and closes back over
    it, or sweeps a lower-timeframe low (for longs) and closes back over it; that closure
    creates the continuation order block and the protected swing that anchors the stop. He
    states that at its basic level this is simply waiting for a higher low or a lower high
    and trading away from it.

    '
  - 'SHORTS EVIDENCE for the ideal-continuation shape and one extra gate. After an expansion
    leg, the move lower is classified by the NEXT candle: a reach into the fair value gap
    / point of interest plus a V-shaped recovery closing over the down-close candles makes
    it a retracement, and that closure PROTECTS the low. The extra gate given here concerns
    highs that get taken on the way: when price takes out a high, a CLOSURE THROUGH that high
    is required, not merely a wick through it.'
  - 'Stated in the top-down video as a personal preference over the first available entry:
    after the initial change in the state of delivery he prefers continuation entries, so
    instead of entering on the first closure he waits for price to trade back into a point
    of interest - typically a sweep of a low - and then to close over the down-close candles
    that formed that low. That closure creates the new order block (or propulsion block),
    and the low behind it is now protected and becomes the stop.'
category: entry
status: contested
aliases:
- continuation entry
- propulsion block
- protected swing entry
- higher low or lower high
- continuation entries
- a new order block
preconditions:
- A confirmed reversal (candle 2/3 closure plus change in the state of delivery) with an invalidation
  already established.
- 'A trend change has already been signalled: price took out the low and had a change in the
  state of delivery / formed an opposing order block.'
- A reversal has occurred and been confirmed by a change in state of delivery.
- A higher-timeframe directional bias points the same way.
- An expansion leg in the direction of bias has printed.
- A point of interest (fair value gap) exists within the pullback.
- A change in the state of delivery has already established the direction on this timeframe.
detection_rules:
- Wait for price to either retrace into a fair value gap, or sweep a low/high.
- Identify the series of opposing candles that went into that level.
- Require a close through that series -> a new protected swing / order block.
- Enter on that close, or on a retest of the level when the displacement was aggressive and
  the market entry would not give the required R.
- 'SMT waiver: without a sweep or gap tag, an opposing candle still counts if the correlated
  asset diverged.'
- If neither trigger forms, take no trade -- 'mechanically speaking there is nothing here
  for me'.
- Repeat the process for each subsequent continuation, tracking the trend upward/downward
  through successive protected swings.
- Require an established direction (expansion, or a confirmed candle 2 plus CISD).
- Wait for price to retrace into an important level, generally a fair value gap.
- Identify the opposing candle(s) that traded into that level.
- Require a close over the series of opposing candles - this creates the new protected swing.
- Enter on the retest of that block; stop on the new protected swing; target 2R or the drawn
  liquidity.
- A closure into the point of interest that does not produce a continuation is not an entry
  - wait for the next one.
- Do not enter at the reversal order block itself - that is trading a reversal.
- Wait for price to expand away from the reversal and create a fair value gap.
- Require price to reach back into that fair value gap.
- Require a close over the down-close candle that traded into the gap (bullish case).
- That closure forms a protected low; the closed-over candle(s) are the continuation order
  block.
- Enter on the continuation order block, stop on the invalidation (the new low), target 2R.
- Price retraces into a fair value gap in the direction of the trend, OR sweeps a lower-timeframe
  swing against the trend.
- Price then closes back over (or under) that level.
- The extreme of that retracement becomes a protected swing and the invalidation.
- Wait for price to reach into the fair value gap / point of interest.
- Require a V-shaped recovery closing over the series of down-close candles (bullish case).
- That closure protects the low - anticipate continuation of the trend.
- When price takes out a high on the way, require a CLOSURE through that high, not just a
  wick.
- If the recovery is slow instead, the structure is a consolidation, not a retracement.
- Wait for price to trade back into a point of interest - in the worked case a sweep of a
  previous low.
- Require a close over the series of down-close candles that formed that low (mirrored for
  shorts).
- That closure validates a new order block; the low behind it is protected and becomes the
  stop.
- Enter at the market price on the closure; the stated minimum objective is 2R.
- He states a preference for this over the first entry at the original CISD.
invalidation:
- The new protected swing is taken out.
- The short-term target has already been taken before entry -- he then prefers to wait for
  a new phase of price.
- No close over the opposing candles occurs at the level.
- Price trades through the new low - the protected swing the entry was built on.
- Price fails to close back through the level and instead consolidates there.
- The protected swing is taken out.
- The protected low is traded through.
- Price trades back below the newly protected low.
measurable:
- continuation entries available per confirmed reversal
- hit rate of first vs later continuations
- share of confirmed reversals that offer NO mechanical continuation
- hit rate of 2R on continuation order-block entries
- frequency of the reach-but-no-continuation case
- hit rate of the 2R target on continuation order blocks
- expectancy of the continuation entry versus the reversal entry on the same signal
- hit rate and average R of continuation entries taken after a CISD
- how often the protected swing is violated before the target
- hold rate of the protected low after a V-shaped closure over the opposing series
- difference in continuation rate between wick-through and close-through of an intervening
  high
- R and hit rate of first-CISD entries vs continuation entries on the same move
- how often a continuation order block forms at all after a valid CISD
