ambiguities:
- He states a preference for the first continuation over later ones ('I feel like I'm chasing')
  without a rule for how many are acceptable.
- Whether a fair value gap must be fully tagged or merely touched is left as 'that's fine
  if it digs a little bit deeper'.
- Volume imbalances are mentioned once as an additional acceptable important level, with no
  definition.
- '''Important level'' is enumerated only as ''generally a fair value gap'' - no ranking of
  level types is given.'
- Whether the entry is a limit at the block or a market order on the retest differs between
  the Shorts and is never reconciled.
- '''Low risk buy'' is used as a label for the block without a definition.'
- The Short is taught on a schematic with no timeframe or instrument named, so the timeframes
  listed here are carried from the rest of the corpus, not from this clip.
- It says the reversal entry "is" available ("I can, but that is trading a reversal") without
  saying when he would take it - the preference is asserted, not conditioned.
- No requirement is stated that the fair value gap be on the same timeframe as the order block.
- He sometimes enters at the level without waiting for a retest and sometimes waits for the
  closure; the choice is described as depending on confidence.
- Which lower-timeframe low counts as sweepable is not defined.
- '''Closure through that high'' does not say on which timeframe the close is measured.'
- No depth requirement is given for the reach into the fair value gap.
- 'No maximum wait: if no continuation forms, whether the original entry should have been
  taken is not addressed.'
- The point of interest for the continuation is a sweep of a low in this example; whether
  a fair value gap retrace is equally acceptable is stated elsewhere in the corpus but not
  here.
- When the resulting block is a plain order block and when it is a propulsion block is never
  distinguished.
