  fractal: true
execution:
  bias: Unchanged - the gap does not set bias.
  entry: The order block validated inside the gap, not the gap itself.
  stop: Beyond the validated order block; for pre-open entries, covering the gap plus its
    50%.
  targets:
  - 2R
