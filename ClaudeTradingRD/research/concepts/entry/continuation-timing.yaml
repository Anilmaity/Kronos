id: continuation-timing
name: Continuations Must Form Early in a New Higher-Timeframe Candle
definition: 'Both videos in this unit converge on the same timing doctrine and one of them
  states it as the single takeaway: frame entries while the higher-timeframe wick is forming,
  which means early in a new higher-timeframe candle. The reasoning is given twice. From the
  wick side: a shallow opposing run matters not only because it uses little range but because
  it uses little TIME, leaving the rest of the period to expand - so an extreme printed late
  in a candle cannot be traded for expansion. From the continuation side: a candle that has
  already expanded is not the candle to enter on; he waits for the next one to open, form
  its wick, and then trades away from it. The worked rejection is an hourly candle with 40
  minutes left, where taking the high and then expanding would not fit. He extends the same
  argument to dismiss macros.'
variants:
  definition:
  - 'A Short devoted entirely to the failure mode supplies the candle count that the long-form
    treatment left deferred. At a point of interest with a V-shaped wick, a continuation is
    expected to close through the level quickly. In the rejected example price spends three
    candles struggling to close below the level and takes the low on the fourth; his verdict
    is that it took too long, that the structure is therefore a consolidation rather than
    a continuation, and that once the closure finally arrives it can no longer be traded as
    a continuation. The accepted counterpart closes through in a couple of candles. A third
    Short states the gating rule: he waits for the higher-timeframe closure before treating
    anything as a continuation.

    '
  - Timing rule for continuation entries inside a higher-timeframe candle. The intracandle
    CISD that marks the wick as formed is IDEAL when it happens early in the candle, because
    the candle then has both time and range left to expand. If it forms late in the candle
    - most of the candle's time and range already spent - the entry is still valid but should
    be taken on the NEXT candle, which brings new range. A continuation that spends too long
    consolidating instead of closing through can fail outright.
  - 'The stated reason continuation entries repeatedly stop traders out is timing: they enter
    near the end of a higher-timeframe candle, using an internal high or low that has no higher-timeframe
    significance, which the next candle then takes out. The continuation should instead be
    entered after the new higher-timeframe candle has opened and formed its wick, so the stop
    sits at a higher-timeframe extreme. A continuation should also form quickly; if price
    hangs around for roughly two or more candles without expanding, it is a consolidation
    and the prior extreme is likely to be run again.

    '
  - 'Restated repeatedly in this unit as the reason for declining entries that are otherwise
    structurally valid. The entry belongs around the opening price of the higher-timeframe
    candle, or above its wick, and early in that candle. Late in a candle - almost at its
    end, far from the open and far from the wick - the same setup is a chase and he will not
    take it, because the risk-to-reward is already destroyed. The corollary he gives for consolidations
    is the same rule from the other side: a range, if it is going to be left, is normally
    left at the new higher-timeframe candle, so he would rather trade the beginning of a new
    candle than the end of the current one. Where the current 4-hour candle does not support
    the direction, the practical consequence is to wait for the 10:00 a.m. open.

    '
  - 'This unit turns the timing rule into a coded constraint. Continuations are only printed
    for a limited extent of time after the model forms; a structure that otherwise qualifies
    but forms too late into the move is deliberately not marked, because the model is only
    concerned with a couple of candles. He gives the negative example of an instrument far
    past its last valid model, where he does not want a continuation printed at all. Continuations
    that fail are greyed rather than removed. A separate labelling rule: only continuations
    originating in a fair value gap are labelled.'
