ambiguities:
- '''Early into the candle'' is never given as a fraction of the period; the 40-minutes case
  is one example on an hourly, not a stated cut-off.'
- Which timeframe counts as 'the higher timeframe' shifts between examples (daily under hourly,
  hourly under 5-minute, 15-minute under 1-minute).
- The macro dismissal is asserted from the timing argument alone with no further support.
- The count is narrated over one example ('1 2 3 candles'), not stated as a threshold - three
  is described, not legislated.
- The timeframe on which the candles are counted is the execution timeframe shown, which is
  never named in the Short.
- No rule is given for the borderline case of exactly three candles that DO close through.
- '''Beginning of the candle'' and ''towards the end'' are never given as fractions of the
  period.'
- '''Too long consolidating'' is deferred to a separate video not in this unit.'
- Roughly two candles is stated as a soft threshold, not a rule.
- Early in the candle is not quantified.
- '''Early'' is not quantified as a fraction of the candle; the rejections are made visually.'
- '''Above the wick'' is stated without saying how far above, and sits alongside the 0.5-of-the-wick
  rule from other units without reconciliation.'
- Which higher-timeframe candle's open governs when several are in play (daily, 4-hour, 1-hour)
  is not stated.
- '''A certain extent of time'' is never given as a bar count - the only numeric anchor anywhere
  near it is that the model spans four higher-timeframe candles.'
- Whether the FVG-origin rule is only a labelling convention or also a quality filter is not
  stated.
