preconditions:
- A higher-timeframe candle is in progress and its remaining time is known.
- A higher-timeframe continuation candle is open and a point of interest has been engaged
  inside it.
- A reversal and CISD already exist in the trade direction.
- A higher-timeframe candle whose direction supports the intended trade.
- A valid model (closure plus CISD) has printed.
detection_rules:
- Frame entries in the window where the higher-timeframe wick is forming - i.e. early in a
  new higher-timeframe candle.
- If the current candle has already expanded, do not enter on it; wait for the next candle
  to open and form its wick.
- Reject a setup whose remaining candle time is insufficient for the expansion to complete
  - 40 minutes left in an hourly candle is the worked rejection.
- If price spends a long time forming the reversal inside a candle, wait for the new candle
  open rather than entering late.
- 'Session overlay: prefer the extreme to form early New York or before New York so New York
  can expand.'
- Mark the level the continuation must close through (the series of opposing candles into
  the point of interest).
- Count candles from the touch of the point of interest to the close through that level.
- A couple of candles ('it only takes a couple candles') = a continuation.
- Three candles failing to close through, with the level taken out on the fourth = reclassify
  as consolidation, not continuation.
- Once reclassified, the eventual closure is not tradeable as a continuation.
- Do not act before the higher-timeframe candle closure that the model requires.
- Measure where in the candle's duration the IC-CISD closure occurs.
- Early -> take the entry inside this candle.
- Late, but still valid -> wait for the next candle open and trade there (new range).
- Ideally the closure comes on the candle immediately after the point of interest is engaged;
  prolonged consolidation before it means the continuation may fail.
- 'The same logic gates positional entries: a protected swing formed before the open is the
  earliest possible case.'
- Wait for the new higher-timeframe candle to open.
- Allow that candle to form its wick (the retracement) early in its life.
- Enter the continuation with the stop beyond that higher-timeframe wick.
- If price spends roughly two or more candles building sideways structure instead of expanding,
  classify it as consolidation and stand aside.
- Enter around the opening price of the higher-timeframe candle, or just above / below its
  wick.
- Enter early in that candle; reject entries taken near its end.
- A move already extended away from the open is a chase - decline it regardless of the lower-timeframe
  structure.
- Expect a consolidation to resolve at the open of a new higher-timeframe candle rather than
  inside the current one.
- New 15-minute candles (09:45, 10:00) are the more likely points for a continuation to form.
- Only accept a continuation that forms within a limited window after the model - one forming
  late into the move is rejected even if the structure is there.
- The window is scoped to the couple of candles the model spans, not to the whole trend.
- A failed continuation is greyed, not erased.
- Continuations originating in a fair value gap are the labelled ones.
invalidation:
- The higher-timeframe candle closes - the window is over and the next open becomes the reference.
- The opposing extreme is taken out before the close through the level.
- Prolonged consolidation without the closure.
- The continuation forms late in the higher-timeframe candle.
- Sideways structure builds failure swings instead of expanding.
- The new higher-timeframe candle opens against the intended direction.
- The continuation forms after the model's window has passed.
measurable:
- expansion distance conditioned on elapsed fraction of the HTF candle at entry
- win rate of entries in the first vs the last third of the HTF candle
- distribution of candles-to-closure for continuations that worked vs failed
- hit rate of continuations closing within 2 candles vs 3+
- expansion after IC-CISD bucketed by fraction-of-candle elapsed
- failure rate of continuations by number of bars spent consolidating before the closure
- stop-out rate of continuations entered late in a HTF candle versus early in the next one
- expansion rate after consolidations exceeding two candles at the level
- expectancy by position of entry within the higher-timeframe candle (first quartile vs last)
- share of range exits from consolidation that occur within n minutes of a 4-hour open
- outcome of continuations by bar-distance from the model print
- share of continuations that originate in a fair value gap
