id: trend-entry-options
name: The Four Ways To Enter A Trend
definition: 'An explicitly enumerated menu of four entries used when price is trending toward
  an objective and will not retrace far enough for a normal OTE / fair value gap entry. In
  order as given: (1) an INDUCEMENT setup - stops are raided beyond a swing, price returns
  into the range, enter on the return toward the objective; (2) a MITIGATION BLOCK entry on
  the retest of the opposing candle''s extreme or opening price; (3) the CHEAT CODE entry,
  taking the open of the candle after the opposing candle closes; (4) drop to a 15- or 30-second
  chart and look for a lower-timeframe model or fair value gap setup INSIDE the mitigation
  block. A fifth is added mid-video as an afterthought - fair value gaps - but explicitly
  de-rated because the stops are too wide in a trend.'
category: entry
status: specified
aliases:
- four ways I look to enter trend
preconditions:
- A trend (aggressive move toward an objective) is in progress.
- The objective / draw is marked before looking for the entry.
detection_rules:
- 'Option 1 - inducement: a high (bearish) is raided and price closes back into the range;
  enter on that close, stop above the raided high.'
- 'Option 1 variant - turtle soup: if confident, enter above the high as it is being raided,
  with a fixed stop.'
- 'Option 2 - mitigation block: opposing candle''s extreme is broken; enter on the retest
  of its high (or opening price); stop just beyond.'
- 'Option 3 - cheat code: enter at the open of the candle following the opposing candle''s
  close; stop one point beyond that candle''s extreme.'
- Option 4 - drop to a 15s/30s chart inside the mitigation block and take a fair value gap
  / box setup there.
- Do NOT enter directly off a fair value gap on the working timeframe while trending - the
  stop is too wide.
invalidation:
- The trend stops reaching for the objective.
measurable:
- relative frequency of the four options over a trending sample
- R distribution per option on the same trend legs
- how much stop width is saved by dropping to 15s (he cites 4 points vs 16 points)
