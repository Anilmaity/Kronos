ambiguities:
- No rule ranks the four or says which to prefer when several are available - he presents
  them as alternatives.
- The turtle-soup variant is gated on 'if I'm confident in this entry', which is not a testable
  condition.
- The fifth option (fair value gaps) is introduced as something he 'didn't mention in the
  beginning', so the count of four is unstable.
