id: hourly-cisd-confirmation
name: Hourly Change In The State Of Delivery (confirming a daily wick)
definition: 'The single confirmation gate used in every video of this series. Once a daily
  candle is a candidate reversal (a candle 2 closure), you drop to the 1H chart, locate the
  extreme inside that daily candle, identify the consecutive series of candles that produced
  that extreme (down-close candles at a low, up-close candles at a high), and require price
  to close through that series. That close-through is the change in the state of delivery,
  and it is what confirms the daily wick — and by extension the weekly high or low — as formed
  and tradeable away from. Until the close-through occurs the daily candle 2 closure is explicitly
  not confirmed and no trade is taken.

  '
variants:
  definition:
  - 'The top-down video shows that this gate is not hourly-specific but is applied at every
    level of the stack. The operation is unchanged - locate the extreme, identify the series
    of opposing-close candles that made it, and require a close through that series - but
    in a single walkthrough he demands it on the hourly to confirm a daily wick AND again
    on the 5-minute to confirm the 5-minute low he is entering against; in the silver example
    the weekly candle''s own closure through the up-close candles that made the high is read
    as the same event, and then again on the 15-minute. He states its purpose in one line:
    it is what confirms the wick has formed.'
category: entry
status: contested
aliases:
- hourly change in the state of delivery
- hourly CISD
- the confirmation
- change in the state of delivery to form this Wick
preconditions:
- A daily candle 2 closure / candidate reversal day has closed or is forming.
- That daily candle contains a lower-timeframe extreme (the wick being confirmed).
- A higher-timeframe candle has traded into a point of interest and is a candidate reversal.
detection_rules:
- On the 1H chart, restrict attention to the price action inside the candidate daily candle.
- 'Bullish case: find the low. Identify the consecutive series of down-close candles that
  made that low.'
- Require a 1H close above the high of that series of down-close candles.
- 'Bearish case: find the high, identify the consecutive series of up-close candles that made
  it, and require a 1H close below the low of that series.'
- Only after that close-through is the daily wick considered confirmed and the following daily
  candle tradeable as a continuation.
- Locate the extreme inside the candidate candle, identify the consecutive series of opposing-close
  candles that made it, and require a close through that series.
- 'Bullish: close over the series of down-close candles that made the low. Bearish: close
  below the series of up-close candles that made the high.'
- The series may be a single candle - he says so explicitly on the weekly example.
- The closure is what confirms the higher-timeframe wick has formed, and only then is the
  candle tradeable away from.
- 'Applied fractally in a single walkthrough: on the hourly to confirm the daily, and again
  on the 5-minute at the entry; and on the 15-minute under the 4-hour in the silver example.'
invalidation:
- Price has not yet closed through the series of candles that made the extreme - not confirmed,
  wait.
- Price takes out the confirmed extreme after the close-through.
- Both a bullish and a bearish change in the state of delivery are present inside the same
  daily candle; the signal is treated as low quality and additional intraday confirmation
  is required.
- The closure through the series has not yet occurred - the wick is not confirmed and no entry
  is taken.
measurable:
- proportion of daily candle 2 closures at a weekly extreme that produce an hourly close-through
  within the same daily candle
- next-day continuation hit rate with the hourly CISD present vs absent
- elapsed hours from the daily extreme to the confirming hourly close-through
- share of higher-timeframe candidate reversals that receive the confirming closure
- difference in outcome between requiring the CISD at every level of the stack vs only at
  the structure timeframe
