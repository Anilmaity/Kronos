preconditions:
- A candle closure has been identified.
- The higher timeframes have been fixed relative to the execution timeframe.
- A point of reversal / protected swing has been established.
- A range has been created between that reversal and current price.
- A chart with prior highs, lows and fair value gaps marked.
- A structure timeframe has been read and a direction fixed.
- A C2 closure candidate exists.
- The trade has been classified as either a reversal or a continuation.
detection_rules:
- 'Accept as a point of interest: a fair value gap price reached into, a high taken out, or
  a low taken out.'
- 'Procedure: mark candle closures first, then test each for a point of interest; a closure
  without one is discarded.'
- The point of interest may come from a much higher timeframe (a monthly high is used in one
  example).
- 'Extension: opposing candles / a protected swing can act as the point of interest.'
- 'Fallback: 0.5 of the opposing candle when no fair value gap or sweepable extreme exists.'
- A fair value gap already traded through is no longer a valid point of interest.
- Mark which highs and lows have already been taken and which are still likely to be taken;
  untaken equal highs/lows act as magnets.
- Mark fair value gaps on the paired higher timeframes.
- Mark order blocks, and the price at which a higher-timeframe fair value gap would be fully
  filled.
- Mark the OTE of the operative range.
- Mark internal range liquidity inside the range.
- When price reaches any of the five, drop to the execution timeframe and look for the entry
  model - and only then.
- 'Target selection after a sweep: internal range liquidity first, then the external highs/lows.'
- 'Define the search range: from the point of reversal to the extreme price has since made.'
- '1st: is there a fair value gap in that range? If yes, that is the point of interest.'
- '2nd: if no fair value gap, is there a swing high (bearish) or swing low (bullish) to be
  taken out? If yes, that is the point of interest.'
- '3rd: only if NEITHER exists, use the CISD level, and additionally require 50% of the bodies
  of that opposing-candle series to hold.'
- If both a fair value gap and a swing point are present, require both to be tagged before
  trading away.
- A candidate opposing candle that never reaches a point of interest is rejected as a protected
  swing, however clean it looks.
- 'In a consolidation, repeat the process at the range edges: sweep, then confirm with a change
  in the state of delivery.'
- 'A POI is one of exactly three things: a fair value gap, a previous high, or a previous
  low.'
- Nothing else qualifies - no breakers, no rejection blocks, no named PD-array variants.
- A reversal may only be anticipated where price reaches a POI; without one, wait for a continuation
  to form and trade that instead.
- At all-time highs there is no POI to the left; use the eyeballed daily-range objective as
  the stand-in and trade the candles in front of you.
- On the entry timeframe, the point of interest is an opposing candle or an order block.
- Two objects at the same price (a swept high plus an opposing candle) counts as two points
  of interest overlapping and is preferred.
- 'Fallback when a leg contains no fair value gap or point of interest: use a sweep of the
  previous low as the point of interest.'
- Fair value gaps are used as points of interest throughout, including a retrace 'right into
  this fair value Gap' before the entry closure.
- Reversals elsewhere in the corpus require a point of interest.
- On the daily timeframe specifically, a candle 2 / candle 3 closure does not require one,
  provided higher-timeframe context supports the direction.
- 'Candidate points of interest for this model: gaps, highs and lows, CISD levels.'
- 'Not points of interest for this model: breaker blocks; higher-timeframe order blocks are
  used rarely.'
- 'Classify the setup: is the C2 attempting to reverse the higher-timeframe direction, or
  continue it?'
- 'If reversal: the C2 must occur at a point of interest, or the setup is rejected.'
- 'If continuation: the POI requirement is waived.'
- 'Acceptable POIs seen in use: fair value gap, previous day high/low, prior swing, 50% of
  an opposing candle.'
invalidation:
- The closure has no point of interest - not a valid setup.
- The level is consumed (fair value gap filled, high taken) without a model forming - move
  to the next POI.
- Price closes beyond 50% of the bodies of the level being used -- the level is no longer
  respected.
- Price trades through the POI without a reaction, after which it is no longer relevant.
- Price passes through the point of interest without the confirming closure.
- A reversal C2 with no POI - reject.
measurable:
- fraction of C2 closures that survive the POI gate
- outcome difference by POI type (fair value gap vs swept high/low)
- share of the five POI types that actually produce a lower-timeframe model
- how often internal range liquidity is reached before external liquidity after a sweep
- distribution of POI type used (FVG / swing / CISD level)
- hit rate by POI type
- how often both an FVG and a swing exist in the same range
- reaction rate at each of the three POI classes
- expectancy of reversals attempted with vs without a POI present
- reaction rate by point-of-interest type (opposing candle, order block, FVG, sweep)
- outcome of single vs overlapping points of interest
- win rate of daily closures with a POI vs without, given aligned monthly context
- Expectancy of reversal C2s with vs without a POI.
- Expectancy of continuation C2s with vs without a POI (tests whether the waiver costs anything).
