ambiguities:
- No ranking is given when several points of interest are available; the stated method is
  to wait and see which one a swing actually forms at.
- '''Ideally both'' (sweep AND fair value gap) is preferred but not required.'
- No relevance test is given for which highs/lows qualify beyond 'previous days and previous
  weeks are always relevant'.
- EARLIER RECORDING. No ranking among the five, and no rule for what to do when two conflict.
- '''Which Highs are likely to be taken'' is a judgement, not a test.'
- The counter-trend caveat ('we're in a bearish trend here so it's likely we couldn't displace
  over this High') is stated as context, not as a gate.
- The channel elsewhere is quoted as saying 'all I know are highs, lows, and fair value' --
  a two-member list. This lesson agrees on the first two and their primacy but adds a conditional
  third (the CISD level), so the live-stream claim is close but not exact.
- He allows the CISD retest to count even when price does not reach the level exactly, 'when
  I have the context' -- an undefined discretionary override.
- Where several fair value gaps are stacked, the selection rule is only 'we don't want a deep
  retracement', which does not always single one out.
- Which highs and lows qualify is not bounded here - separation, age and relevance are handled
  by other concepts, not by this answer.
- The auto-caption renders his enumeration as 'POIs to use your value gaps, highs, lows',
  dropping 'fair'; it is read as fair value gaps, highs and lows, consistent with his restatement
  later in the same stream.
- Whether an unmitigated fair value gap and a mitigated one both count is not addressed.
- This enumeration includes order blocks and opposing candles, which the live-stream enumeration
  in the library explicitly excludes ('gaps, highs and lows - that's it'). The two are not
  reconcilable as stated.
- No ranking rule when several points of interest are available at different prices.
- '''Overlapping'' is not given a tolerance.'
- This contradicts the stricter POI requirement recorded elsewhere in the corpus; the exemption
  is stated only for the daily timeframe and only when higher-timeframe context exists.
- '''The context of the monthly candle trending down'' is the substitute for the POI and is
  not itself given a test.'
- 'CONFLICT: his simplified public teaching (POI always required) versus his stated real rule
  (reversal only). Any concept drafted from the polished lessons should be reconciled with
  this.'
- The classification reversal-vs-continuation is itself judgemental and is the gate on the
  whole rule.
- The set of acceptable POIs is enumerated by example only.
