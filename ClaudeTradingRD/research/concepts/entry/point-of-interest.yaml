id: point-of-interest
name: Point Of Interest (POI)
variants:
  name:
  - Point Of Interest (POI) - required for reversals, optional for continuations
  definition:
  - 'EARLIER RECORDING. Here the POI is given as a CLOSED LIST OF FIVE trigger types whose
    only job is to tell you when to drop to the execution timeframe and start hunting an entry
    model: (1) highs and lows - equal highs/lows, session highs/lows, daily highs/lows; (2)
    fair value gaps; (3) order blocks, including the point at which a fair value gap FILLS;
    (4) the OTE of a range; (5) internal range liquidity of a range, which often coincides
    with the OTE. The explicit purpose is negative - to stop you watching the lower timeframe
    all day.'
  - 'A dedicated lesson states the list is CLOSED and gives exactly three members, in a strict
    priority order: (1) fair value gaps, (2) swing highs and lows, (3) the change-in-the-state-of-delivery
    level (an order block). The third is explicitly a last resort -- he says he ''rarely''
    uses it and only when neither a fair value gap nor a swing high/low exists in the range.
    The search domain is also fixed: measure from the POINT OF REVERSAL (the protected swing
    being traded away from) to the far edge of the range price has since created, and look
    only inside that. Where both a fair value gap and a swing point exist, he wants BOTH tagged
    before trading away, to avoid being stopped at the shallower one.'
  - 'Asked how to tell whether a level is a POI or a valid PD array, he gives a closed enumeration
    and refuses to extend it: points of interest are fair value gaps, highs and lows - "that''s
    it". He repeats it later in the same stream when a viewer uses an unfamiliar term: all
    he knows are highs, lows and fair value. Asked whether a trade must come out of a higher-timeframe
    fair value gap he says no - it must come out of a point of interest, which is normally
    a high or a fair value gap. The POI is what lets him anticipate a reversal; where none
    exists he can only anticipate a continuation after one has formed. A separate answer resolves
    the all-time-high case: with nothing to the left there is no POI at all, and he treats
    the eyeballed daily range as the stand-in objective rather than abandoning the day.

    '
  - The top-down video enumerates points of interest much more widely than the live streams
    do. On the entry timeframe he instructs the viewer to use the structure-timeframe point
    of interest and there look for opposing candles or order blocks; he counts a swept high
    sitting on an opposing candle as two points of interest overlapping and treats the overlap
    as better; and when a leg contains no fair value gap or point of interest at all, he falls
    back on a sweep of a previous low as the point of interest. That set - opposing candles,
    order blocks, sweeps - conflicts with the closed live-stream enumeration recorded in the
    library, which is fair value gaps, highs and lows and explicitly nothing else.
  - 'A live exception that cuts against the general requirement. Asked whether the daily candle
    must reach a point of interest before its closure can be used for a swing, he answers
    no: the daily is the one specific timeframe where he does not require a point of interest,
    provided he has the context of the higher timeframe (in the example, a monthly candle
    trending down). It is ideal but not required. He redraws the case to make the point -
    an aggressive daily closure with no fair value gap under it is still clean to him. Separately
    he narrows what counts as a point of interest at all: he does not use breakers, rarely
    uses higher-timeframe order blocks, uses CISD levels, and mostly prefers gaps and highs
    and lows.'
  - 'A prior level (fair value gap, previous swing high/low, opposing-candle midpoint) that
    a C2 closure is expected to occur at. The corpus contains two versions of the requirement:
    the simplified public rule that a C2 closure must be at a point of interest, and the nuanced
    rule he states in 00iZXPAdR5A - POI is required 100% for a reversal C2, and is NOT required
    for a continuation C2, because on a continuation the daily profile itself supplies the
    extra confirmation. He explicitly says he teaches the simplified version "for simplicity''s
    sake".

    '
definition: 'The location requirement without which no candle closure and no CISD is valid.
  Enumerated in this unit as: a fair value gap, a high being taken out, or a low being taken
  out - ''I use fair value gaps and highs and lows''. Its role is stated as framing: you find
  the candle closures first, then check whether each has a point of interest, and only those
  that do give you a bias. Two extensions are given: a series of opposing candles can serve
  as a point of interest (''more advanced''), and where neither a fair value gap nor a sweepable
  low exists, 0.5 of the opposing candle is used instead.'
category: entry
status: contested
