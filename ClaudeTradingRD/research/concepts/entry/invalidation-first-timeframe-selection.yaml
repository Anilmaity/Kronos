id: invalidation-first-timeframe-selection
name: Choose the Timeframe by Where the Stop Can Go
definition: 'The top-down video states the corollary of this rule explicitly while running
  a three-timeframe example: he does not need three timeframes, and he can execute on the
  hourly structure timeframe directly, provided he can manage his risk there. Dropping to
  the lower timeframe is presented as being done for one reason only - to enter into the same
  higher-timeframe objective with better risk-to-reward - and the choice between the two is
  called personal preference rather than a rule.'
variants:
  definition:
  - 'He reframes the question of entry timeframe as the wrong question. Instead of asking
    which timeframe to enter on, ask where the invalidation can be placed: the level that
    can legitimately serve as the stop determines which timeframe the entry belongs on.

    '
category: entry
status: contested
aliases:
- I don't need three time frames
- if I can manage my risk
- what timeframe should I enter on
- stop first
preconditions:
- A structure-timeframe setup already exists with an identifiable invalidation level.
- A directional idea exists and a candidate level has been identified.
detection_rules:
- 'The number of timeframes in the stack is not fixed: if risk can be managed on the structure
  timeframe, execute there.'
- The stated purpose of dropping a timeframe is to increase risk-to-reward toward the higher-timeframe
  targets, not to find a different signal.
- Targets stay on the higher timeframe regardless of which timeframe the entry is taken on.
- The choice between structure-timeframe execution and lower-timeframe refinement is stated
  as personal preference.
- Identify the nearest level that would genuinely invalidate the idea if traded through.
- Select the timeframe on which that level is a structural swing.
- Enter on that timeframe rather than on a preferred default timeframe.
invalidation:
- Risk cannot be managed on the current timeframe - drop one and re-check.
- No level exists that would invalidate the idea, in which case there is no trade.
measurable:
- R distribution of hourly-executed vs 5-minute-executed entries on the same setup
- stop-out rate by execution timeframe
- stop distance and realised R when timeframe is chosen by invalidation versus by habit
