ambiguities:
- '''If I can manage my risk'' is not turned into a test - no maximum stop distance in points,
  percent of ADR, or R terms.'
- The transcript reads 'I cannot go lower if I can manage my risk', which is an auto-caption
  rendering of 'I can not go lower...'; the meaning is that going lower is optional.
- No guidance on when the preference should flip.
- Genuine invalidation is defined only by example (protected swings, HTF wicks, SMT closure
  levels).
- '''Immediate rebalance'' is his tentative label (''what do they call it?''); no distance
  rule defines when a gap is ''too far'' for the stop.'
- No trade was taken, so the 3m-gap stop placement is shown only as framing.
