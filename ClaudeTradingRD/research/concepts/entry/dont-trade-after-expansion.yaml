preconditions:
- A higher-timeframe candle is currently in expansion.
- A completed expansion sequence.
- A continuation has formed.
- A completed or in-progress expansion leg is identifiable.
- A visible expansion leg has already occurred.
detection_rules:
- Locate where price sits within the CURRENT higher-timeframe candle, not just on the entry
  timeframe.
- If price is at the end of that candle's expansion, do not enter.
- Wait for the higher-timeframe candle to close and the next one to open.
- Let the new candle form its wick, then trade its body.
- Do not trade back into a range against a candle that is still expanding away from it.
- Count consecutive expansion candles on the reference timeframe. At three, stop seeking continuation.
- Two very large expansion candles can substitute for three ordinary ones.
- If the higher-timeframe objective has already been hit, stop regardless of the count.
- Beyond candle 4 in a C2/C3/C4 sequence, treat a new phase of price as likely.
- 'Instead of continuing, look for the next phase: consolidation (then wait for its manipulation),
  retracement (then wait for the protected swing), or a reversal off a relevant level.'
- Before entering, check whether a higher-timeframe objective has already been reached.
- If it has, do not look for a continuation in the same direction - a new phase of price is
  due.
- 'Count expansion candles: roughly three candles of expansion INTO a significant high or
  low is the stated disqualifier.'
- Read a continuation printing at an already-hit objective as a candidate opposing CISD rather
  than as an entry.
- Accept the missed move rather than chasing it.
- Seek entries inside the expansion leg, not after it has completed.
- If the instrument has already covered its typical daily range, stand aside for the session.
- If the targets of the expansion are already hit, do not seek a further continuation.
- Prefer an instrument that is trending over one that is consolidating, even if a pattern
  exists on the consolidating one.
- After an expansion, wait for a new swing point or a new higher-timeframe candle open before
  re-engaging.
- 'Classify the current phase: expansion, retracement, consolidation or reversal.'
- If the expansion has already occurred, do not enter in the same direction.
- The only acceptable post-expansion entry is a reversal following a sweep of a relevant level.
- Do not enter above previous day highs or below previous day lows once targets and range
  are done.
invalidation:
- Not applicable - this is an avoidance filter.
- Not applicable — this is a regime filter.
- A new sweep creates a fresh level to trade away from, restarting the sequence.
measurable:
- win rate bucketed by position within the higher-timeframe candle at entry time
- share of stop-outs occurring on entries taken in the final third of an HTF candle
- forward return of continuation entries taken after the 3rd expansion candle vs the 1st/2nd
- distribution of consecutive expansion-candle run lengths by timeframe
- win rate of continuations taken at vs away from an already-hit HTF objective
- frequency of an opposing CISD forming within N candles of an objective being hit
- R of entries inside the expansion leg versus after it
- share of post-expansion continuation attempts that reach target
- outcome difference between trending and consolidating instruments on the same signal
- expectancy of entries taken after the expansion leg versus before it
