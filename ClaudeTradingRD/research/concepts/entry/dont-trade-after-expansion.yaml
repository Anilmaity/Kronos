id: dont-trade-after-expansion
name: Trade the Expansion, Not After It
definition: 'SHORTS EVIDENCE, given as the diagnosis for a specific recurring complaint: ''why
  are you always getting caught in a consolidation?'' The answer is that the problem is not
  the lower timeframe at all - the trader is entering at the END of a higher-timeframe expansion
  candle, chasing a move that is already delivered. The remedy is stated as a three-step sequence:
  stop entering at the end of higher-timeframe candles, wait for the new one to open, let
  it form its wick, and only then trade it. The same logic is applied to a candle currently
  expanding against the intended direction - do not fight it; wait for it to close.'
variants:
  definition:
  - 'Stand-aside rule. After three days of expansion - or after expansion into an already-hit
    objective, or after two very large expansion days - do not seek another continuation in
    the same direction: a new phase of price is due. The same logic runs inside the candle
    sequence: candle 5 and candle 6 are where you get caught in a new phase. It is also expressed
    positively - after a large range expect a small range, so an entry taken immediately after
    an expansion is an entry into the phase transition.'
  - 'The third of three named reasons continuations fail, framed here as a FOMO trap: a higher-timeframe
    target has already been taken, the trader who missed the move sees a fresh continuation
    print, enters, and is stopped out. His account is that hitting a higher-timeframe target
    is precisely when a new phase of price can begin, and that such a continuation is often
    simultaneously setting up an opposing change in the state of delivery. The disqualifier
    is stated with a count in the closing example - one, two, three candles of expansion plus
    a significant high taken - after which he will not look for continuations at all. He states
    plainly that missing moves is acceptable.'
  - 'Given as the answer to "I''m having difficulty finding entry after expansion": the difficulty
    is the answer — you want to be trading the expansion, not after it. In these sessions
    the rule is applied to whole instruments and whole days, not just single entries. Overnight
    expansion that has already run means the New York open is a lower-probability window;
    a market that has already covered its typical daily range is dropped; oil is dismissed
    because "it already made the move"; gold is dismissed as consolidating with the instruction
    to trade something that is trending instead. He states the positive version as a chart
    test: price is trending here and consolidating there, so it is less ideal to be seeking
    trades in the consolidating stretch.

    '
  - 'After price has already expanded, the next phase can only be a consolidation, a retracement
    or a reversal, none of which he prefers to trade except the reversal case where a sweep
    occurs. The stated rule is to trade the expansion itself rather than to enter after it.
    Entering at the high of the day, above previous day highs, after the range and the targets
    are done, is defined as chasing.

    '
