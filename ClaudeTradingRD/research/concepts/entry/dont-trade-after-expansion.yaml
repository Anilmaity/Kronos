ambiguities:
- '''The end of'' the candle is not defined as a fraction of elapsed time or of range.'
- Which higher timeframe is the reference (4H? 1D?) is not stated in the Short.
- '''Three'' is hedged with ''generally'' and one example counts two very large days as enough
  - the count is soft.'
- '''Expansion day'' inherits the unquantified expansion definition, so the count itself is
  not mechanical yet.'
- '''Significant high'' is not defined here; it is presumably the relevant-swing test from
  the companion video, but he does not say so.'
- '''Three candles of expansion'' is stated on one example, and elsewhere in the corpus the
  same count appears as a cue rather than a rule.'
- Which timeframe supplies the 'higher timeframe objective' is left to the top-down read.
- How much expansion counts as 'already made the move' is decided by eye against the eyeballed
  daily range.
- The rule is applied both to a single leg and to a whole session without distinguishing them.
- No test is given for when a consolidation has lasted long enough to become tradeable again
  beyond 'wait for a new swing point'.
- What magnitude of move counts as the expansion having occurred is judged against the daily
  range budget, itself eyeballed.
