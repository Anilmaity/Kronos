id: opposing-run-entry
name: Opposing Run / Judas Swing At A Time Level
variants:
  name:
  - Opposing Run (New York Entry Trigger)
  definition:
  - 'The common execution trigger across all three directional daily profiles. Once a directional
    bias for the New York session exists, the trader does not enter at the session open but
    waits for price to make a run COUNTER to that bias - typically at 08:30 - because that
    counter run is what builds the order block to enter from. The entry is taken on the close
    back through the series of opposing candles; the stop sits beyond the opposing run''s
    extreme. If instead the 08:30 move goes WITH the expected direction, the speaker reads
    it as premature and expects a retracement back into the prior session''s range, entering
    there instead.

    '
  - 'EARLIER RECORDING that supplies the price anchor for the Judas swing rather than only
    the clock anchor. The daily profile is read as open-high-low-close on a sell day and open-low-high-close
    on a buy day; the leg to be captured is the Judas swing that forms the day''s opposite
    extreme, and he states where it normally sits: above the 08:30 and midnight open on a
    sell day, below them on a buy day. Execution is then to look for a lower-timeframe setup,
    and for PD arrays being reached into, inside that area.'
definition: At midnight, 08:30 and 09:30 New York he looks for an OPPOSING RUN — a move against
  the anticipated daily order flow — that is then closed back over (bullish case). That close
  validates the run's candles as an order block, and he then does not expect the low it created
  to be taken as price continues in the anticipated direction. He uses the terms 'Judas swing'
  and 'opposing run' interchangeably and pairs them with the same three time levels.
category: entry
status: contested
aliases:
- Judas swing
- opposing run
- the 8:30 manipulation
- opposing candles
- opposing move
- Judith swing
- manipulation leg
preconditions:
- A daily bias / anticipated daily order flow exists.
- Chart is on New York (EST) time.
- A directional bias for the New York session from one of the daily profiles.
- 'A reference level to enter from: London''s order block, London''s range edge, or a higher-timeframe
  PD array.'
- A daily directional read (buy day / sell day).
- The midnight and 08:30 opens are marked.
detection_rules:
- Watch midnight, 08:30 and 09:30 New York.
- 'Bullish bias: require a run LOWER at one of those times (the Judas swing).'
- Require price to close back over the candles that made that run.
- Those candles are now an order block; the low they created should not be taken.
- Distribution in the anticipated direction is then expected — 09:30 or 10:00 in his examples.
- At 08:30 (or 09:30), price runs counter to the anticipated daily direction.
- That run prints a series of candles closing in the counter direction (up-close candles when
  short-biased, down-close candles when long-biased).
- Price closes back through that series; those candles are the order block.
- Entry is placed on the order block (or on its mean threshold, or on a fair value gap paired
  with the close-through).
- If the 08:30 move instead goes WITH the anticipated direction, do not chase; expect a retracement
  into the previous session's range and enter from there.
- 'Sell day (OHLC shape): expect the Judas swing / day''s high above the midnight open and
  the 08:30 open.'
- 'Buy day (OLHC shape): expect the Judas swing / day''s low below the midnight open and the
  08:30 open.'
- Look for the lower-timeframe entry setup inside that area, and for PD arrays price is reaching
  into beyond the levels.
- The Judas swing is what has to be caught to capture the daily range - entering after it
  is missing the range.
invalidation:
- The low created by the opposing run is subsequently taken out.
- Price trades beyond the extreme of the opposing run (the stop level).
- Price never trading beyond the two opens on the required side - the day offers no entry
  location under this rule.
measurable:
- frequency of an opposing run at each of 00:00 / 08:30 / 09:30
- survival rate of the low created by the opposing run
- fill rate of order-block entries after an 08:30 opposing run
- hit rate of 2R from those entries
- how often the 08:30 move is counter to the eventual daily direction versus with it
- difference in outcome between entering at the order block edge and at its mean threshold
- share of days whose Judas-swing extreme forms beyond both opens
- range captured when entering at the Judas swing versus entering after it
