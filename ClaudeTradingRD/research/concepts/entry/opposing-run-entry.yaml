ambiguities:
- '''At'' a time level is not bounded — how many minutes after 08:30 or 09:30 an opposing
  run still counts is never stated.'
- Whether all three time levels must produce opposing runs, or any one suffices, is not stated;
  the examples use whichever printed.
- The Judas-swing framing and the premium/discount framing of midnight and 08:30 are used
  on the same levels without a precedence rule.
- '''A series of opposing candles'' is never given a minimum count.'
- '''Close back through'' is not specified as a body close or a wick through the series.'
- No stated minimum size for the opposing run, so a one-tick counter move technically qualifies.
- One worked example is explicitly never filled - he shows the miss and moves on - but there
  is no rule for how long a limit order stays valid.
- The 'wrong-direction 8:30' branch (expect a retracement instead) is demonstrated once and
  asserted once; it is not stated as a general rule.
- This is the earlier recording; it agrees with the updated material's clock anchors (midnight
  / 08:30) and adds the price anchor, but the later canon drops the midnight open from the
  toolkit.
- '''Normally'' is the only frequency claim - no share of days is given.'
- The 09:30 level, present in the later statements of this concept, is not part of this video.
- The auto-captioner renders 'Judas' as 'Judith' and 'Juda'.
