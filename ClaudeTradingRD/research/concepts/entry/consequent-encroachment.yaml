ambiguities:
- Whether the fib is anchored wick-to-wick on the outer candles or to the gap boundary prices
  themselves is not stated (they differ).
- '''Respect'' is a close-based test in some phrasings and a visual reaction in others.'
- CE is also referenced for a new day opening gap (power-of-three video) and a monthly FVG
  (liquidity levels video) without restating the construction.
- The contradiction is INTERNAL to a single video, so it cannot be resolved by preferring
  one source over another.
- '''Respecting the consequent encroachment'' is explicitly a flexible judgement, not a threshold.'
- Whether the 50% is measured on the gap boundary prices or on the outer candles' wicks is
  still not stated.
- Whether a wick through the CE without a close counts is not addressed.
