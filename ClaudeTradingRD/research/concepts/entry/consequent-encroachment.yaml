  entry: Limit at the CE when the near-edge entry gives insufficient R:R (his example rejects
    ~1R and moves the entry to the CE).
  stop: Beyond the swing extreme, not the gap edge.
  targets:
  - the opposite side of the range
  - fixed 2R+
