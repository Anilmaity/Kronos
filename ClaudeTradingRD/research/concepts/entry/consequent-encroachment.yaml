id: consequent-encroachment
name: Consequent Encroachment (CE)
definition: 'The 50% level of a fair value gap, marked by dragging a fib from the gap''s high
  to its low. It has two uses in this corpus: as a behavioural test (price respecting the
  CE implies continuation in the respecting direction, violating it anticipates the whole
  gap failing) and as an entry refinement (entering at the CE of an old gap instead of its
  near edge when the near-edge entry does not meet the minimum risk-to-reward).

  '
variants:
  definition:
  - '50% of a fair value gap, and the level on which the gap''s fate is judged. The canonical
    FVG video contains two incompatible statements about the same threshold, in the same video.
    Reading A (invalidation): the one thing he looks for when invalidating a fair value gap
    is a close - when price starts to close over the consequent encroachment OR outside the
    fair value gap, price is not respecting it and often will not reverse back. Reading B
    (hint only): in the inversion walkthrough the close below the consequent encroachment
    is called the FIRST CLUE, followed by a failure to displace back out, and he then waits
    for a close below the whole fair value gap before treating it as inverted. the_foundation_01
    recorded Reading B from the IFVG video as the library position (''explicitly NOT sufficient'').'
category: entry
status: contested
aliases:
- CE
- 50% of a fair value gap
- midpoint of the gap
- the 50 of the fair value Gap
preconditions:
- A defined fair value gap zone with a known high and low.
- A defined fair value gap with a known high and low.
detection_rules:
- ce := (gap_high + gap_low) / 2.
- 'Respect: price trades to the CE and reacts away without closing beyond it -> continuation
  expected.'
- 'Violation: price closes beyond the CE -> anticipate price working through the rest of the
  gap.'
- 'Partial signal explicitly stated: closing over the CE ''gives us a hint'' of an inversion
  but is NOT sufficient — a close beyond the full gap is required to declare an inversion.'
- 'Respect: price reaches the CE and reacts away; he prefers a candle to close back outside
  the gap but accepts respect of the CE alone, saying he is pretty flexible with that.'
- 'Reading A (invalidation threshold): a close over the CE or outside the gap means price
  is not respecting it - he calls that invalidating the fair value gap.'
- 'Reading B (inversion threshold): a close below the CE is the first clue; add a failure
  to displace back out; only a close below the whole fair value gap declares the inversion.'
- 'The probable reconciliation, not stated by him: the CE close kills the gap as a level to
  trade FROM, while the full-gap close is what licenses trading it as the opposite polarity.
  Recorded here as an inference, not as his words.'
invalidation:
- A close beyond the CE in the opposing direction.
- Under Reading A, a close beyond the CE; under Reading B, a close beyond the far edge of
  the gap.
measurable:
- fill rate of CE entries vs near-edge entries (how often CE is reached at all)
- hit rate conditional on CE respected vs violated
- R:R improvement from CE entries in the sample
- conditional reaction rate after a close beyond the CE but not beyond the gap - this single
  statistic decides between the two readings
- fill rate of CE entries vs near-edge entries
