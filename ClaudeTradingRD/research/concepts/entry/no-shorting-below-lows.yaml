id: no-shorting-below-lows
name: Do Not Short Below Lows (trade back into the range instead)
variants:
  name:
  - Do Not Short Below Lows (sell at the open or in the wick instead)
  definition:
  - 'A location filter he states as close to a personal absolute as anything in this unit:
    he is almost never interested in shorting below lows, because that is exactly where his
    losses come from — price runs the low and reverses. If a late short must be taken, the
    stated refinement is to short *before* price runs the low, and to take it in the middle-ranked
    asset rather than the one already extended. The same instinct is expressed positively
    elsewhere in the unit — he does not like picking lows either, preferring to let price
    open, start to trend, and then join it.

    '
  - 'Where he wants the entry to sit within the daily candle, stated as a location rule and
    then as a prohibition. Bearish: sell around the daily open or inside the wick of the daily
    candle, and in any case before the first target is reached. He does not want to be selling
    below the previous day low. His reason is the phases-of-price one: price expanding into
    a low sets up a new phase of price, so a short entered down there is entered exactly where
    the move is due to end. He applies it to himself on air twice - refusing a short at the
    low of the day after a big low was already taken, and refusing to long over highs on a
    bullish instrument for the mirrored reason ("not a fan of longing over the highs. That''s
    not how I trade").

    '
  - 'Once price is already beneath a swept low he will not initiate shorts there. Instead
    he waits for a swing point to form and trades back into the range that was left above.
    The range is measured from the last impulse leg, and what he wants inside it is the discount
    of that range plus an imbalance plus an overlapping order block; longs become valid once
    the change in state of delivery prints. The mirrored rule applies to longs above highs
    - he will not enter long above a range high away from the daily open.

    '
definition: 'Restated twice under live questioning as the reason for declining an otherwise
  valid-looking short. Once price is already trading below the lows that were the targets,
  and a decent part of the daily range has been spent, there is no drawn liquidity left below
  to trade toward, so it is not a place to be looking short. The same logic is given for gold
  making a new low late in the day: rather than sell below the lows he waits for a new day
  with a new candle and fresh expansion potential.'
category: entry
status: contested
aliases:
- short before it runs the low
- don't enter at the lowest lows
- selling around the daily open
- shorting below the lows
- no shorting under the low
- wait for a swing point
- chasing below lows
preconditions:
- The identified target lows have already been taken.
- Price is at or approaching a prior low in a move that is already extended.
- A directional daily bias and a marked previous day high / low.
- Price has swept a prior low and is now trading beneath it.
detection_rules:
- Check whether price is already below the drawn target lows.
- Check how much of the daily range has already been covered.
- If both, do not enter short - there is no remaining drawn liquidity to trade toward.
- Wait for a new session with a new candle rather than chasing.
- Do not initiate a short below a prior low.
- If a late short is taken at all, enter before the low is run, not after.
- Prefer the middle-ranked correlated asset for such an entry, not the one that has already
  travelled.
- Equivalently, do not pick lows for longs — wait for the open and for a trend to start.
- 'Bearish: enter around the daily open or inside the daily candle''s upper wick.'
- Do not sell below the previous day low; do not buy above the previous day high.
- Enter before the first target is reached, not after.
- Price expanded into a low (or high) is due a new phase of price - do not initiate in that
  direction there.
- If price is already at the extreme, the day is finished for that direction; wait for the
  next daily candle.
- Do not initiate shorts below the swept low.
- Wait for a swing point to form beneath, then frame a trade back into the range above.
- Choose the range from the last impulse leg (he acknowledges multiple candidate ranges and
  picks the last impulse).
- Inside that range, want the discount plus an imbalance plus an overlapping order block.
- Longs become valid once the change in state of delivery prints at that confluence.
- 'Mirror: do not enter long above a range high, away from the daily open - the window was
  near the daily open or mid-range before the high was taken.'
invalidation:
- Not applicable — this is a location filter.
- The daily candle's wick is exceeded.
- Price continuing lower without forming a swing point - no trade exists yet.
- The range objective above being reached before entry.
measurable:
- expectancy of shorts entered below the day's target lows vs above them
- R of shorts initiated below a prior low versus above it
- reversal rate immediately after a prior low is run
- expectancy by entry location relative to the daily open and the previous day extreme
- frequency of reversal within n bars of price taking a previous day extreme
- outcome of shorts initiated below a swept low vs waits for the swing point
- how often the last-impulse-leg range choice differs from alternative range choices
