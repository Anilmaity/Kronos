ambiguities:
- How far below the lows the rule starts to bite is not quantified; both examples were visually
  obvious.
- The mirror-image case (do not buy above the highs) is implied by the daily-range argument
  but is not stated in these streams.
- '''Below lows'' is not scoped to a timeframe — which low (session, previous day, swing)
  is the reference is left to context.'
- The 'almost ever' leaves an unstated exception; the only case shown is already holding a
  short from higher up.
- '''Around the daily open'' is not bounded - no tolerance in points or percentage of range
  is given.'
- The rule is stated for entries; nothing is said about whether an existing position should
  be exited when price reaches the extreme.
- '''Generally speaking'' is attached to the prohibition, so exceptions exist but are not
  enumerated.'
- '''Last impulse leg'' is chosen by eye; he shows two candidate ranges and picks one without
  a stated criterion.'
- Whether all three of discount, imbalance and overlapping order block are required or whether
  one suffices is not stated - he lists them together in one worked example.
