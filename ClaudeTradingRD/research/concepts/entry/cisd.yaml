ambiguities:
- The word 'displacement' appears in the PDF definition ('close and displacement below the
  opening price') but every chart narration reduces it to 'we close below the series of up
  close candles' — whether an FVG must be left inside the CISD leg is therefore unresolved
  even here.
- For a SERIES of opposing candles he says 'the opening price of this up close or series of
  up close candles' without stating whether that is the first candle's open or the extreme
  open of the series. The charts show the series' outermost open.
- The 'into an important level' clause is part of the PDF definition but is not re-tested
  in the chart examples, where he simply looks for the close through the opposing candles.
- The library previously held three mutually inconsistent readings of CISD. On this unit's
  evidence the opening-price-of-the-opposing-series reading is unambiguously his; the swing-break
  reading belongs to the market structure shift, which he defines separately in the same video.
- '''Closes over the series'' - whether the level is the OPEN of the first opposing candle,
  the highest of their opens, or their extremes is never stated. This is the source of the
  library''s three mutually inconsistent CISD readings and it is NOT resolved here.'
- 'The choice of WHICH series to use is discretionary in practice: one example explicitly
  picks a different candle ''because that is the swing high that created this swing low''.'
- Whether a wick through the level counts or a body close is required is not stated.
- '''The series of candles that reached into that level'' has no bound -- he ignores small
  candles and takes the whole leg when the structure is messy, which is discretionary.'
- Whether the close must be through the series' OPENING PRICE or merely 'over that level'
  varies between passes in the same video.
- The important-level precondition is waived once, when he expects the low to hold with no
  fair value gap present.
- The transcripts of this unit render 'reach' as 'wretch' repeatedly (auto-caption artifact);
  it is read as 'reach' everywhere.
- '''Close over'' is never specified as a body close vs any close - the examples are all body
  closes but the rule is not stated.'
- 'The untidy-leg fallback (''just use this whole move'') has no boundary rule: where the
  move starts is chosen visually.'
- No timeframe is mandated for the CISD itself; it is inherited from the timeframe pairing
  in use.
- In this unit CISD and 'market structure shift' are used interchangeably in one video (the
  Twitter model) and treated as alternatives in another.
- THE LIBRARY'S PRIMARY OPEN QUESTION IS NOT ANSWERED HERE. Neither Short states WHICH price
  of the opposing-candle series the close must clear - the first candle's open, the highest
  open, or the extreme. Both clips say only 'closure through the series'.
- 'The untidy-leg fallback still has no boundary rule: where ''this whole move'' starts is
  chosen visually, and ''clean'' is not defined.'
- Whether a body close or any close counts is not stated in either Short.
- The retest branch has no rule for how deep the retest must be, or how long to wait.
- 'TRANSCRIPT HYGIENE: the auto-captions render ''down close'' as ''down closed'' in one of
  these clips; both spellings appear in the corpus and mean the same thing.'
- THIS VIDEO DOES NOT ADJUDICATE THE LEVEL. The library holds two incompatible readings -
  close through the series' extreme, versus close through the OPEN of the first candle of
  the run - and this video says only 'close over the series of down close candles' throughout,
  never naming the price. The disagreement survives.
- 'It DOES adjudicate the series-length question, and against the library''s current majority:
  here a single candle is explicitly acceptable when the structure has only one, whereas a
  Sunday-session answer says he never selects one candle and always uses a series. Both are
  his; this is the dedicated model video.'
- '''Doesn''t form a swing'' is not defined here; the three-bar definition from the relevant-swings
  video is the only candidate test and he does not say it is the one meant.'
- Body close versus wick through is never stated.
- The auto-captions render 'down close' as 'downclo', 'downclosed', 'downcloed' and 'downlosed'
  in this transcript.
- Sourced from an ASR (whisper-small) transcript, not YouTube captions; wording may be imprecise.
- The conflict case (open supports the bias but the close is over 0.5 of the CISD) is resolved
  by requiring more lower-timeframe confirmation, not by a stated rule about which signal
  wins.
- In video Nlw-PZhoViQ the CISD levels are read off the on-screen indicator (he selects it
  and sets the bias) rather than constructed by hand, so the exact construction is not observable
  in the transcript.
- Whether the close-through must be a body close is never stated explicitly, though the speaker
  does once say to focus on the bodies.
- The series of same-direction candles is unbounded - no maximum count, and no rule for what
  terminates a series.
- In several passages the CISD is read directly off the speaker's on-screen indicator rather
  than constructed manually; the indicator's rule set is not given in these transcripts.
- The relationship between CISD and the opposing candle is shown by example but never stated
  as an identity.
- THE BLOCKING AMBIGUITY SURVIVES. 'The opening price in that series' still does not say WHICH
  open when the series has several candles - the first candle's open, the highest/lowest open,
  or the series extreme. This Short does at least establish that the level is an OPEN and
  not the swept extreme.
- '''Important level'' is not defined in this Short.'
- How far to the left the swept high may be is not bounded.
- Body close versus wick through the level is not stated ('closes below' implies body).
- Whether the closure must be a body close or may be any close is never stated explicitly.
- The level a CISD is measured against varies by context (opposing-candle 50%, wick 50%, gap
  edge, consolidation boundary) with no precedence rule.
- The length of the 'series of candles' is never bounded, so a detector must choose the run
  length itself.
- Body close versus wick close through the series is not stated explicitly in this unit.
- He runs an 'early CISD' indicator setting that draws the CISD before the candle 2 closure,
  which sits awkwardly with his own rule that no decision is made before the close.
- The far-away-CISD alternative entry is described as advanced material he has deliberately
  not published a video on.
- 'CONTESTED against mainstream ICT: ICT''s rule that the CISD need not close beyond the opening
  price is raised by a viewer and explicitly declined; he gives no positive replacement rule
  beyond ''a series''.'
- '''Series of candles'' has no stated minimum length.'
- '''Stop on the bodies'' - which bodies (the swing candle, the whole series) is not specified.'
- The threshold at which a closure is 'too far from the level' to enter on the break is not
  quantified.
- Body close vs wick through the opening price is never stated ('closed below' implies body).
- The definition of the 'series' is not given — whether the run must be strictly contiguous,
  and whether a single down-close candle inside it breaks the run.
- CISD is used interchangeably with 'shift structure' / 'market structure shift' in the internal-external
  video; whether they are the same test is not stated.
- The requirement for an important level is inherited from the order block video but is only
  implied here ('into a higher time frame PD array or important level').
- The minimum candle count for a 'series' is never given - he rejects one candle and accepts
  what he calls an actual structural point, but no n is stated.
- '''Insignificant'' is the word used to disqualify a candle; no size or range threshold is
  attached to it.'
- The auto-captioner renders CISD variously as 'CSD', 'CISD' and 'CIS'; all are the same term.
