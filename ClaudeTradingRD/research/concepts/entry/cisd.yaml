id: cisd
name: Change In The State Of Delivery (CISD)
variants:
  name:
  - Change In State Of Delivery (CISD)
  definition:
  - 'PRIMARY-SOURCE DEFINITION, stated more explicitly here than anywhere else in the corpus:
    a change in the state of delivery is a shift in trend, found by (1) locating the level
    that HIT A POINT OF INTEREST - price interacting with a fair value gap, a high, or a low
    - and (2) requiring price to CLOSE OVER THE SERIES OF CANDLES INTO that point of interest.
    Bullish: price takes out a low, then closes over the series of down-close candles that
    took out that low. Bearish: price reaches into a high, then closes through the series
    of up-close candles that made it. The point of interest is part of the definition, not
    an extra filter - which is what distinguishes this reading from a bare ''close through
    the opposing candles'' rule.'
  - 'The primary teaching gives one definition, twice, in the same two-part form: a change
    in the state of delivery is (a) price REACHING INTO AN IMPORTANT LEVEL -- sweeping out
    a low or reaching into a fair value gap -- and then (b) CLOSING THROUGH THE SERIES OF
    CANDLES that reached into that level. He also gives the ontology: it is ''the order block
    formation that forms when trend changes''. Its role is fixed: it is a confirmation of
    a swing point and nothing else -- it is looked for inside an already-printed candle 2
    or candle 3 closure on the timeframe above, and a CISD with no such closure is discarded
    outright.'
  - 'The procedure is stated step by step twice in this unit and is identical both times:
    find the low (or high), find the single candle or series of candles that MADE that low,
    mark the opening price of that series, and require price to close over it. Until that
    close happens there is no CISD and the swing is not trusted. Where the move into the low
    is untidy and there is no clean series of down-close candles, his stated fallback is to
    take the whole move as the reference instead. The same close that produces the CISD is
    what validates an order block at that swing.'
  - 'This unit adds two things to a heavily-sourced concept. First, independent corroboration
    of the UNTIDY-LEG FALLBACK, which the library currently flags as an open ambiguity: when
    the leg into the level does not present a clean series of down-close candles, he uses
    the WHOLE MOVE as the reference instead, and a later close over that reference confirms
    the CISD. He states this as his general practice, not as a one-off. Second, a compressed
    statement of why the CISD is the chosen trigger at all: in a single reversal sequence
    there are several valid entry patterns, and rather than mark them all he picks ONE and
    looks only for the closure through the series of down-close candles; the reversal is then
    taken as having occurred and the following continuations become the entries.

    '
  - 'In this unit the CISD is used throughout in its dominant corpus form: locate the extreme,
    locate the series of down-close (bullish case) or up-close (bearish case) candles that
    made it, and require price to close back through that level. Three things are added. First,
    and directly contradicting a Q&A statement recorded elsewhere in the library, he says
    he will use a SINGLE candle when the structure only contains one. Second, a selection
    rule for the series: a candle that does not itself form a swing is generally skipped,
    and the candle beyond it is used instead. Third, speed is promoted from a quality preference
    to a validity condition - a closure that arrives only after a slow grind is not a CISD
    at all but a sweep of a consolidation high. He also accepts an inversion as a substitute
    for the CISD when the candle range is extremely large. This video does NOT state which
    price the close must be measured against.'
  - 'The confirmation event that converts a candidate reversal into a tradeable one. Locate
    the extreme that the reversal turned on, identify the consecutive series of same-direction
    close candles that produced that extreme (down-close candles at a low, up-close candles
    at a high), and require price to close back through that series. That close-through is
    the change in the state of delivery. In these walkthroughs it is applied at every scale
    - on the hourly to confirm a daily candle 2, on the 5-minute and 1-minute to confirm an
    intraday reversal, and on the 15-minute inside a scalp - and it is what permits the next
    candle to be traded as a continuation. The same close-through simultaneously creates a
    protected swing at the extreme beneath it, and the series it closes through becomes the
    opposing candle / order block that can be retested for entry.

    '
  - 'SHORTS EVIDENCE, presented as ''my favorite reversal pattern'' with TWO named requirements
    and a level construction. The requirements are: (1) price must reach into an important
    level, and (2) price must sweep out a high (bearish case) to the LEFT of that level. Only
    when both are met does he find the series of up-close candles that swept the high into
    that level and MARK OUT THE OPENING PRICE IN THAT SERIES. A close below that level makes
    it the area of resistance for the continuation lower; the bullish case is the mirror using
    down-close candles.'
  - 'A closure through a defined level that confirms delivery has changed direction. In these
    streams CISD is used in three roles: to confirm that a swing high/low of the day is in,
    to confirm a continuation, and as the entry trigger itself. The entry is taken on the
    closure through the level - he explicitly does not wait for a retest of the resulting
    order block.

    '
  - 'Restated mechanically several times in this unit. The CISD is a closure through the series
    of consecutively opposing-close candles that produced the extreme — he draws the series
    out for a viewer on USD/CHF and says that if you are trading mechanically you simply wait
    for that closure, and if you are not trading mechanically you may instead ask whether
    a high or low has formed that you can trust. Asked whether the CISD has to form from a
    high or a low, he widens it: it can form from a point of interest, which he enumerates
    as a high, a low, or a fair value gap. He also gives the provenance — he took the CISD
    from AM Trades and made it mechanical by combining it with swing points, in contrast to
    ICT''s order-block selection which he calls unmechanical and impossible to code.

    '
  - 'The only entry confirmation he uses (alongside order block formation). A CISD is a close
    through a series of opposing candles that had been holding price, taken from a series
    and never from a single candle. It is what turns a swept level or an SMT into a tradeable
    event. He explicitly rejects the requirement that the close must be beyond the opening
    price of the opposing candles, saying he does what works for him rather than following
    that definition.

    '
  - 'The event that marks price switching from bullish to bearish delivery or vice versa,
    made operational as a close through the opening price of the last single-or-series of
    opposing-close candles that traded into an important level. Bearish CISD: price closes
    BELOW the opening price of the up-close candle (or of the FIRST candle of a series of
    up-close candles) that made the high into a higher timeframe PD array. Bullish CISD: price
    closes OVER the opening price of the down-close candle(s) that made the low. The same
    close simultaneously validates those candles as an order block, which is why this video
    is titled "CISD - Orderblock Formation".

    '
  - 'Live-Q&A refinement of what counts as the ''series of candles'' a CISD must close through.
    Two viewer setups are rejected on exactly this point. A single small opposing candle is
    not a series: he will not treat one tiny consolidation candle as the structure, and instead
    looks for the actual structural point that made the extreme. The procedure he restates
    is: locate the low (or high), locate the series of candles that produced it, and require
    a close over (or under) that level - if no such series can be pointed at, there is no
    CISD.'
  category:
  - structure
definition: 'THE adjudicating definition in the corpus, from the video whose entire subject
  is separating CISD from a market structure shift. CISD is displacement and a CLOSE BELOW
  (bullish case: above) THE OPENING PRICE of the up-close candle, or series of up-close candles,
  that ran into an important level — and that close is what validates those candles as an
  order block. It is explicitly NOT focused on the close beyond a swing high or swing low;
  that is the market structure shift. CISD and MSS can coincide on one candle, but CISD generally
  occurs EARLIER, which is its stated advantage and its stated risk.'
category: entry
