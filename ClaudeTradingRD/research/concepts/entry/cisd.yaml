preconditions:
- Price has traded into an important level (higher-timeframe PD array or resting liquidity).
- A single up-close candle, or a contiguous series of up-close candles, exists inside the
  move into that level (mirrored for the bullish case).
- Price has interacted with a point of interest (fair value gap, high, or low).
- A candle 2 or candle 3 closure on the timeframe above (otherwise the CISD is meaningless).
- 'An important level: a low/high to sweep, or a fair value gap to trade into.'
- A low or high has formed, ideally at an important level or after a stop raid.
- An extreme has formed that engaged a level (in the worked example, hourly internal-to- external
  liquidity being used to frame a 5-minute CISD).
- Price has reached a point of interest - a fair value gap, a swept low or high.
- A series (or, per this video, a single candle) of opposing-close candles made the extreme.
- A candidate reversal - typically a candle 2 closure - on the timeframe above.
- A visible extreme inside that candle with a series of same-direction close candles leading
  into it.
- Price has reached into an important level.
- Price has swept a high (bearish) or low (bullish) sitting to the LEFT of that level.
- A defined level exists to close through (prior swing, opposing candle midpoint, fair value
  gap edge, consolidation boundary).
- 'An extreme (high or low) formed at a point of interest: a high, a low, or a fair value
  gap.'
- A relevant level or swing has been swept, or the higher timeframe candle has given a framework
  to trade inside.
- A series of opposing candles is identifiable (not a single candle).
- Price has traded into an important level / higher timeframe PD array.
- 'Preferred (not required): a sweep of buyside or sellside liquidity, ideally visible on
  a lower timeframe.'
detection_rules:
- Identify the opposing candle or series of opposing candles that delivered price into the
  important level.
- Take the OPENING PRICE of that candle / that series.
- 'Bearish CISD: price displaces and closes below that opening price. Bullish CISD: price
  displaces and closes above it.'
- That close simultaneously validates the candles as an order block.
- Do NOT require the close to be beyond the swing high/low — that is the market structure
  shift test, which is a separate and generally later event.
- Locate the extreme that engaged the point of interest.
- Identify the series of opposing candles that produced that extreme (may be one candle).
- Mark the level of that series.
- Require a CLOSE through that level. Before that close there is no CISD.
- Bullish uses down-close candles into a swept low / fair value gap; bearish uses up-close
  candles into a swept high / fair value gap.
- 'Two applications: REVERSAL CISD confirms a swing point; INTRACANDLE CISD (see ic-cisd)
  confirms that a continuation candle''s wick has formed.'
- An inversion fair value gap may be used in place of the CISD to confirm a continuation.
- Find the extreme of the higher-timeframe closure candle on the lower timeframe.
- Confirm that extreme reached an important level (swept a low/high, or tagged a fair value
  gap).
- Identify the SERIES of same-direction candles that reached into that level (may be one candle).
- Require a close through that series. Before that close, the swing point is unconfirmed.
- If a new extreme forms first, re-anchor on the new series.
- 'Quality: a fast V-shape is wanted. A close-through that took roughly half the candle to
  arrive is read as consolidation, not a confirmed reversal.'
- The CISD LEVEL (the opening price of that series) doubles as a last-resort point of interest
  -- but only when no fair value gap and no swing high/low exist in the range.
- Locate the extreme (the low for a bullish CISD).
- Identify the single candle or consecutive series of down-close candles that made that low.
- Mark the OPENING PRICE of that single candle or series.
- Require a close over that opening price. No close, no CISD - explicitly 'we wait'.
- If price makes a new low before closing over, discard the candidate and re-derive from the
  new low.
- 'Fallback when the leg is untidy: if there is no clean series of down-close candles, use
  the whole move as the reference instead.'
- Mirror for a bearish CISD (series of up-close candles, close below their opening price).
- Identify the series of opposing (down-close, bullish case) candles that made the extreme.
- 'FALLBACK, corroborated here: if there is no clean series of down-close candles, use the
  whole move as the reference instead.'
- Require a close over that reference. The close is what confirms the CISD.
- 'Once confirmed, get on side - but check risk-to-reward first: if entering on the close
  with the stop on the low does not make sense on R, wait for a retest instead.'
- 'Selection discipline: of the several entry patterns available in a reversal sequence, mark
  only the CISD and ignore the rest.'
- After the CISD confirms the reversal, take the CONTINUATIONS that follow as the entries.
- Locate the extreme the reversal turned on.
- Locate the run of down-close candles that made the low (or up-close candles that made the
  high).
- Skip a candidate candle that does not itself form a swing; use the adjacent one that does.
- A single candle is acceptable as the run when the structure contains no more than one (stated
  explicitly in this video).
- Require price to close back through that level.
- 'Speed condition: the closure must arrive within roughly 1 to 3 candles of the reach into
  the level; a slow grind back is a consolidation, and the eventual closure is a sweep of
  the consolidation high rather than a CISD.'
- An inversion may substitute for the CISD when the candle range is extremely large.
- The CISD is only trusted when it is not simultaneously taking out a short-term high/low
  and not at an already-hit higher-timeframe objective (see the two continuation-failure entries).
- Find the reversal point (the low for a bullish case, the high for a bearish case).
- Identify the consecutive series of down-close candles that made the low (or up-close candles
  that made the high).
- 'Require a close through that series: above the series'' high for a bullish CISD, below
  the series'' low for a bearish CISD.'
- Read the confirmation on the candle bodies where the wicks are noisy; the speaker states
  this for the hourly confirmation of a daily candle 2.
- After the close-through, anticipate the next candle to trade in the CISD direction.
- '0.5 of the change in the state of delivery is marked as a level the higher-timeframe candle
  should close beyond: closing back over it (bearish case) is called a conflict, and it is
  weighed against the other evidence rather than being an automatic veto.'
- The change in the state of delivery is also what differentiates a retracement from a reversal
  - when a leg is ambiguous, wait for the opposing-direction CISD to print or fail to print,
  and read the leg from that.
- 'Requirement 1: price reaches into an important level.'
- 'Requirement 2: price sweeps an extreme to the left of that level. BOTH are required.'
- Identify the series of up-close candles (bearish case) that swept the high into the level.
- Mark the OPENING PRICE in that series - the level is an open, not the extreme.
- A close below that level makes it resistance; trade the continuation away from it.
- 'Bullish mirror: series of down-close candles, close over their opening price, level becomes
  support.'
- Price closes through the identified level in the intended direction.
- A bullish CISD is present when the closure is upward through the level; bearish when downward.
- Absence of a bearish CISD inside a developing daily candle is used as evidence the daily
  read is not bearish (aqnY1yZvfYs).
- Locate the series of consecutively opposing-close candles that made the extreme.
- Require a body close through that entire series.
- The extreme must sit at a point of interest — a high, a low, or a fair value gap.
- 'Mechanical mode: wait for the closure. Discretionary mode: substitute a high or low you
  are willing to trust.'
- Where the resulting CISD level is too far away for the target's risk-to-reward to work,
  enter instead off the candle 2 or candle 3 closure at the swing.
- Identify the series of opposing candles that formed the high (bearish case) or low (bullish
  case).
- A close through that series is the CISD.
- It may form intra-candle on the higher timeframe (he calls this an intra-candle change in
  the state of delivery) rather than at the higher timeframe candle's close.
- 'Structural variant he accepts: a very aggressive up-down (V) shape on the lower timeframe
  followed by a close below, with the retest of the same level, counts as a CISD even where
  the strict closure reading is marginal.'
- Identify the contiguous run of up-close candles (close > open) that produced the local high
  into the level.
- cisd_level := open of the FIRST candle of that run (stated explicitly twice).
- Bearish CISD fires on the first candle whose close < cisd_level.
- 'Bullish CISD is the mirror: run of down-close candles into the level, cisd_level := open
  of the first, fires on the first close > cisd_level.'
- On firing, the run is also validated as an order block at cisd_level.
- Multiple sequential CISDs can occur in one leg, each creating a further order block that
  'supports price lower'.
- Find the extreme (the low for a bullish CISD, the high for a bearish one).
- Find the series of candles that made that extreme - the structural point, not the nearest
  single candle.
- Require a close through that level.
- A single small consolidation candle does not qualify as the series; a close below it is
  not a CISD.
- If no series of candles can be identified at the extreme, the setup is not a CISD regardless
  of what price did.
invalidation:
- Price never closes beyond the opening price of the opposing series.
- The CISD occurs but price then continues against it — he warns explicitly that an earlier
  entry is 'not always a good thing' and can produce a loser the MSS would have filtered out.
- Price fails to close through the level and instead ranges - the sweep is untrusted.
- No close through occurs -- 'this is not a valid fractal model and I would not be looking
  for a continuation'.
- Price closes back beyond 50% of the bodies of that opposing-candle series.
- A new low forming before the close-over occurs (the candidate series is replaced).
- Price trading back through the swing after the CISD.
- No close through the reference - no CISD, wait.
- 'Stated caveat in the worked example: taking the retest without a strong directional narrative
  is something he wants to avoid; the CISD alone does not carry the trade.'
- Price fails to close through the level and falls back inside the prior range - the phase
  is consolidation, not retracement.
- The closure through arrives only after a failed attempt plus consolidation around the level.
- No close-through has occurred - the reversal is unconfirmed and no trade is taken.
- The extreme that the CISD protected is subsequently taken out.
- Price never closes beyond the opening price of the opposing series - no CISD.
- Price fails to produce the closure - the setup does not exist, regardless of how the shape
  looks.
- The closure occurs only after price has consolidated around the level; the closure may then
  be a liquidity sweep to run the other way (Qv6Ux_Z8VrA, 'why your continuations fail' graphic).
- The extreme that produced the CISD is taken out.
- Price returning through the CISD level and closing back beyond the opposing candle series.
- 'In the bullish case: price reacts at the fair value gap it created and then closes below
  it - the retracement-inside-a-reversal read is dead and it is continuation lower.'
- 'Failure to produce the close: he shows price failing to close below the level, so there
  is no CISD and no trade, until a new sweep occurs.'
- A subsequent CISD in the opposite direction reverses the state.
measurable:
- bars between the CISD close and the corresponding MSS close
- win rate of CISD-only entries vs MSS-confirmed entries on the same setups
- share of CISDs that never produce an MSS
- agreement rate between a POI-gated CISD detector and a bare opposing-candle-close detector
- hit rate of trades taken on the close vs on the retest
- CISDs per higher-timeframe candle
- share of HTF closures that receive a CISD
- outcome split by V-shape vs slow close-through
- how often a candidate series is invalidated by a new low before the close-over
- hit rate of close entries vs retest entries from the same CISD
- outcome difference between clean-series CISDs and whole-move fallback CISDs
- how often the untidy-leg fallback is needed versus a clean series being available
- outcome difference between entering on the close and waiting for the retest
- how often the whole-move reference produces a materially different trigger price than a
  best-guess clean series would
- candle count from level-tag to close-through, split by outcome
- outcome difference between single-candle and multi-candle series
- elapsed candles from the extreme to the confirming close-through
- hit rate of the following candle expanding in the CISD direction
- frequency of CISD at each scale (1H, 15m, 5m, 1m) per session
- hold rate of the swept extreme after a close through the series' opening price
- difference in outcome between the two-requirement cases and cases where only one is met
- Rate at which a closure through the level is followed by continuation vs immediate reversal.
- Difference in fill and expectancy between closure-entry and retest-entry.
- hit rate of CISD-confirmed extremes holding
- R difference between the mechanical closure entry and the swing entry when the CISD level
  is far
- count of CISDs per session by timeframe
- retest frequency after a CISD close (how often a limit at the level would have filled)
- hit rate of 2R from a CISD entry with stop on the bodies
- difference in outcome between close-through entries and retest entries
- count of CISD events per session and per timeframe
- hit rate of a fixed 2R trade taken on the first retest of cisd_level
- share of CISDs preceded by a liquidity sweep vs not, and the hit-rate difference
- difference in CISD count between a 1-candle-series detector and an n>=2 series detector
- expectancy of trades from single-candle 'series' vs multi-candle series
