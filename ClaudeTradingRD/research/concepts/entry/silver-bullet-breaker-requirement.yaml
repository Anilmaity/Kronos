id: silver-bullet-breaker-requirement
name: Silver Bullet Requires Trading Through A Breaker
definition: 'A purely structural redefinition of the Silver Bullet. In this account the Silver
  Bullet forms when and only when price trades through a breaker - the speaker states the
  rule twice and tells the viewer to write it down. No time window of any kind is attached.
  Its position within the dealing range then determines the probability of the next leg.

  '
category: entry
status: contested
aliases:
- the Silver Bullet
preconditions:
- A market maker model with a marked dealing range (smart money reversal to original consolidation).
- A breaker has been identified and projected forward.
detection_rules:
- The Silver Bullet forms only when price trades through a breaker.
- Locate the Silver Bullet within the dealing range. If it forms BELOW 50 percent of that
  range, the next leg is high probability and price should move fast to the draw on liquidity.
- When the Silver Bullet has formed below 50 percent, the next area of re-accumulation (around
  0.75 of the range) is the highest-probability entry, and mitigation blocks - not fair value
  gaps - are the reference for it.
- If price returns to 50 percent of the dealing range, the trade idea is invalid.
invalidation:
- Price trades back to 50 percent of the dealing range.
measurable:
- speed and extent of the leg following a Silver Bullet formed below versus above 50 percent
  of the dealing range
- invalidation rate - how often price returns to the 50 percent after the 0.75 re-accumulation
  entry
- direct comparison against a time-window Silver Bullet definition on the same data
sources:
- video_id: wB-fQiT_UDo
  title: DayTradingRauf | ICT MMXM Models
  quote: the Silver Bullet only forms when we trade through a breaker
ambiguities:
- Marked contested because this definition carries NO time component. The name is normally
  associated in ICT material with a fixed intraday window; the speaker neither mentions that
  usage nor acknowledges the conflict. Both readings should be treated as live until the corpus
  settles it.
- The dealing-range anchors ('from the area which created the smart money reversal to the
  original consolidation') are not pinned to exact price points.
- '''First distribution'', described as forming just above 0.25, is named but its trading
  use is never explained.'
- No stop rule is given for the 0.75 entry.
