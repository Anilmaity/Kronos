- 62 to 79
preconditions:
- A displacement leg that broke structure exists.
- A directional bias exists.
- A displacement leg with a defined start and end exists.
- A confirmed swing high and swing low (or a displacement range) to anchor the retracement.
- A confirmed swing high and swing low to anchor the retracement.
- A higher-timeframe bias in the trade's direction.
detection_rules:
- Fib the displacement leg (low that broke structure -> high reached; mirror for shorts).
- The OTE is the deep retracement zone of that leg; 0.62 / 0.625 are the levels he reads in
  the examples.
- Require the OTE to coincide with a PD array (order block or fair value gap) where possible.
- 'Best case: OTE of the displacement range AND discount of the dealing range AND a PD array,
  all at the same price.'
- Adding the OTE to a model is a risk-to-reward decision, not a signal - it tightens the entry.
- Anchor the fib from the start of the displacement range to its end.
- 0.5 = the premium/discount boundary; the OTE band is 0.62 to 0.79.
- Prefer a fair value gap, order block or other point of interest sitting inside the band.
- 'Nesting: after entering the band, a new displacement leg inside it defines a new, tighter
  OTE.'
- 'Inverse use: when positioned against the leg, the same 0.62-0.79 band is a profit target.'
- Anchor the retracement from the swing high to the swing low (bearish framing) or swing low
  to swing high (bullish).
- While the extreme is still extending, re-anchor each new extreme until a swing point is
  confirmed.
- ote_zone := the price band between the 0.62 and 0.79 retracement levels; ote_mid := 0.705.
- 'Entry preference: 0.705 ideally; 0.62 when he wants to be in the position.'
- 'Confluence: look left for a PD array inside the zone (fair value gap, order block, breaker,
  volume imbalance).'
- If an order block's opening price falls outside the zone, substitute its mean threshold
  (50% of the body) so the entry sits inside the OTE.
- 'Time filter used in the examples: ignore OTE taps that occur outside a killzone.'
- 'Nesting: once price leaves an OTE and forms a new swing, mark the new range and its OTE;
  lower timeframes contain their own OTEs inside a higher timeframe one.'
- ote := the 0.62 to 0.79 retracement of the leg, measured low-to-high or high-to-low.
- 'Fibonacci tool levels used on air in this unit: 0, 0.5, 0.62, 0.79, 1.'
- Prefer an OTE band that overlaps a fair value gap on the same or a lower timeframe.
- Anchor on the wicks (highs and lows) rather than the bodies; round-number bank levels are
  used as an alternative anchor.
- Require a higher-timeframe bias in the trade's direction before taking the OTE.
invalidation:
- Price never retraces to the OTE before continuing - the entry is simply missed.
- Not stated. Stops in the examples sit at the swing extreme (i.e. beyond the 1.0), not at
  a specific fib level.
- Price trades beyond the 1.0 anchor - the swing that defined the leg is gone.
measurable:
- fill rate of OTE-gated entries vs ungated ones, and the R difference
- how often the OTE coincides with an order block or fair value gap
- fill rate of 0.62 vs 0.79
- R improvement from the nested OTE over the first OTE
- fill rate of 0.62 vs 0.705 vs 0.79 taps
- hit rate of a fixed-target trade entered at 0.705, with and without a PD array in the zone
- R:R improvement over an equilibrium (0.5) entry — the video claims 3.43R vs 1.6R in one
  case
- effect of the killzone filter on hit rate
- hit rate of an OTE tap with vs without an overlapping fair value gap
- difference in fill and outcome between wick-anchored and body-anchored OTE
