id: optimal-trade-entry
name: Optimal Trade Entry (OTE)
variants:
  name:
  - OTE - The 62 To 79 Retracement (restated in this unit)
  definition:
  - 'Corroborating earliest statement. After a structure break, anchor a fib across the displacement
    range (low to high for a bullish leg) and expect the retracement into the 0.62 to 0.79
    band, with the 0.5 marking the premium/discount boundary. He states two extra uses not
    always carried in the later material: the same fib levels are used as TARGETS when he
    is positioned in the opposite direction, and OTEs NEST - once price is inside one OTE
    and forms a new leg, the new leg''s OTE sits inside the old one (''an optimal trade entry
    inside of an optimal trade entry''). Confluence with a fair value gap or other point of
    interest inside the band is stated as helpful, not required.'
  - 'A fibonacci retracement zone between the 0.62 and 0.79 levels of a swing-high-to-swing-low
    (or low-to-high) leg, with 0.705 as its midpoint and the speaker''s preferred entry price.
    The fib is configured with exactly the levels 0.5, 0.62, 0.705, 0.79 and 1, where 0.5
    doubles as the premium/discount divide. The zone is treated as an entry location, strengthened
    by any PD array that happens to sit inside it.

    '
  - 'Restated in the Trade For Opportunity stream with the numeric definition supplied by
    the guest - the retracement between 62 and 79 from the low to the high or vice versa -
    and the fibonacci level set confirmed on air by the host as 0, 0.5, 0.62, 0.79 and 1.
    The worked use is confluence: the guest anchors the retracement on the leg after a big
    sell move (the first leg having failed to retrace above 50%), finds the 0.62-0.79 band
    lining up with a five-minute fair value gap, and calls that a decent short if the higher-timeframe
    bias is short. In the Alex''s Options stream the same zone is anchored on the wicks -
    highs and lows rather than bodies - with round-number ''bank levels'' offered as an alternative
    anchor.'
definition: 'EARLIER RECORDINGS. Used throughout this unit as a RISK-TO-REWARD DEVICE bolted
  onto an existing model rather than as a standalone entry: the stated difference between
  his model 1 and model 3 is simply that model 3 requires the entry to sit in an OTE of the
  displacement leg, added ''to make sure you have solid risk reward''. It is drawn on the
  displacement range (low that broke structure to the reached high) and the levels he reads
  off it in the examples are 0.62 and 0.625. It is strongest when it coincides with a PD array
  - an order block or fair value gap - and with the discount of the wider dealing range.'
