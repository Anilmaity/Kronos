ambiguities:
- EARLIER RECORDINGS. The OTE band's boundaries are never stated as numbers; 0.62 and 0.625
  are read off charts, and 0.79 / 0.705 never appear in this unit.
- Auto-caption renders 'OTE' variously as 'OT', 'OTE', 'ot te' and 'Ode to'.
- No rule for when the OTE and the PD array do not coincide.
- 0.705 (the midpoint preference recorded from the_foundation_01) is NOT mentioned in this
  earlier recording; only 0.62 and 0.79 are named.
- No stated rule for choosing between 0.62 and 0.79 as the order price.
- No invalidation level for the OTE itself.
- Which swing pair to anchor is discretionary; 'the displacement range' is used in several
  examples without a formal definition.
- Wick-to-wick vs body-to-body anchoring is not stated.
- No invalidation level for the OTE itself (a close beyond 0.79? beyond 1.0?).
- Whether a tap of 0.62 alone counts as an OTE fill is not stated.
- The killzone filter is demonstrated but never stated as a rule.
- 0.705, which the corpus records elsewhere as the preferred entry price, is not mentioned
  anywhere in this unit.
- Wick-versus-body anchoring is stated only by Alex's Options and left as personal preference
  ('kind of experiment with that').
