id: ignore-news-wick-in-range-fib
name: Exclude The News Wick When Fibbing The Range
definition: 'A small, unusually mechanical adjustment stated once and applied in a live trade:
  when anchoring the premium/discount fib on a range whose extreme was produced by a scheduled
  news release, he anchors on the body / the pre-spike structure and DELIBERATELY EXCLUDES
  the news spike wick, on the stated grounds that the wick is manipulation rather than a real
  extreme. The practical effect is that the 0.5 sits lower (for a bearish case), so the premium
  zone in which he will short is reachable rather than being pushed out to an unreachable
  spike high.'
category: entry
status: specified
aliases:
- ignoring the wick because it's just CPI manipulation
preconditions:
- The range extreme was created by a scheduled high-impact release (CPI in the example).
- A premium/discount fib is about to be drawn on that range.
detection_rules:
- Identify whether the range extreme coincides with a scheduled release (8:30 in the example).
- If so, anchor the fib excluding the news spike wick; use the surrounding structure instead.
- Draw the fib from that adjusted high down to the reversal low.
- Look for the entry in the premium of the ADJUSTED range.
invalidation:
- Price trades back above the excluded wick - the exclusion was wrong.
measurable:
- difference in entry price and realised R between wick-anchored and body-anchored fibs on
  news days
- how often price returns above an excluded news wick
sources:
- video_id: 0R61Y6Pn74Q
  title: CPI Gold Trade Review | ICT Market Maker Sell Model [MMXM]
  quote: I'm ignoring the wick here because it's just CPI manipulation
ambiguities:
- Stated once, in one trade - not presented as a general rule.
- No rule says exactly where to re-anchor (body close? pre-spike high?); he does it visually.
- It applies to scheduled news wicks only; whether it extends to other large wicks is not
  said - and the corpus elsewhere treats large wicks as meaningful rather than as noise, so
  the two do not obviously reconcile.
