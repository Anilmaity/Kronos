id: poi-density-by-timeframe
name: The Point-Of-Interest Requirement Tightens As Candle Density Rises
definition: 'Why the point-of-interest requirement is stricter on the hourly than on the 4-hour,
  argued from candle count: there are six 4-hour candles in a day, so many 4-hour candles
  simply will not sit at a point of interest and one is not always available; there are roughly
  twenty-four hourly candles in a day, so on the hourly a point of interest is wanted as the
  filter that says which of them matters. His stated preference is a point of interest on
  both the daily and the 4-hour, while acknowledging it does not always happen that way. He
  also states the general gate: a model generally needs a point of interest to form.

  '
category: entry
status: specified
aliases:
- why point of interest matters more on the hourly
preconditions:
- A candidate model / candle 2 closure is being graded on a given timeframe.
detection_rules:
- Prefer a point of interest on both the daily and the 4-hour, but accept a 4-hour candle
  without one.
- Require a point of interest on the hourly, because hourly candles are ~24 per day and the
  POI is what filters them.
- Absent a point of interest anywhere, treat the model as not formed.
invalidation:
- No point of interest on the timeframe whose density demands one - do not take the model.
measurable:
- expectancy of hourly models with versus without a POI
- share of 4-hour candles that coincide with a marked POI (tests the density claim)
sources:
- video_id: c7nk7ypJHN4
  title: New York Open Live Q&A
  quote: The 4 hour there are six candles in the day
- video_id: c7nk7ypJHN4
