- video_id: c7nk7ypJHN4
  title: New York Open Live Q&A
  quote: I prefer there to be a point of interest on both
ambiguities:
- '"Prefer... but it doesn''t always happen that way" leaves no hard gate on the 4-hour.'
- The density argument implies a continuum across all timeframes but only 4-hour and hourly
  are given; nothing is said about 15-minute or 5-minute density.
- The reversal-versus-continuation split recorded elsewhere in the corpus (POI mandatory for
  reversals, waived for continuations) is not mentioned here, so it is unclear whether the
  density rule sits on top of it or replaces it.
- '"Six candles in the day" implies a 24-hour 4-hour grid but no session or timezone is named.'
