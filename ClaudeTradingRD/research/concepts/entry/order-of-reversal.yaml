ambiguities:
- 'ORDERING CONFLICT: this Short pairs steps four and five as ''the fair value gap or the
  breaker'' and does not separate them; the long-form entry in the library orders breaker
  as rung 4 and fair value gap as rung 5. No precedence is stated.'
- No rule says how long a step may take before the ladder is abandoned.
- The Short numbers three steps and then describes the breaker and fair value gap without
  numbering them, so whether they are rungs four and five or just consequences is left open
  here.
- No rule is given for choosing which rung to take; the clip simply narrates all of them.
- The clip is on an unnamed instrument and only London is named as the session.
- The ladder is presented as an ordering, not as a requirement that all five appear - in some
  reversals a rung will simply not print, and no rule covers that.
- '''Turtle soup'' is used here as a synonym for the sweep and is not otherwise defined in
  this video.'
- The trade-off between confirmation and price is stated qualitatively; no R:R comparison
  across rungs is given.
- The order is described for a bearish reversal; the bullish mirror is implied but not walked
  through.
