id: order-of-reversal
name: The Order Of A Reversal (confirmation ladder)
definition: 'SHORTS EVIDENCE, and the corpus''s most explicitly NUMBERED statement of the
  ladder: he calls them step one through step five out loud. Step 1 is the raid of stops /
  turtle soup, which carries almost no confirmation because the prevailing trend is still
  intact. Step 2 is a closure over the opposing fair value gap, forming an inversion. Step
  3 is the change in the state of delivery - the closure over the series of opposing-close
  candles that swept the extreme. Steps 4 and 5 are the fair value gap and the breaker, for
  a trader who wants still more confirmation. Once all five have printed, the trend is treated
  as shifted.'
variants:
  definition:
  - 'A Short walks the ladder live and numbers the rungs out loud: step one is the turtle
    soup (the sweep of the high out of a consolidation), step two is the inversion, step three
    is the change in the state of delivery / order block formation, and immediately after
    that a breaker block plus a fair value gap form and overlap. He then anticipates the move
    to the lows, with the retest into the overlapping fair value gap and breaker - bodies
    still respecting the CISD - producing a new propulsion block.'
  - 'An ordered ladder of PD arrays that appear as a reversal develops, used to grade how
    much confirmation an entry has. The sequence he names is: turtle soup (the sweep), an
    inversion, a change in the state of delivery or the formation of an order block, a breaker,
    and a fair value gap. Each successive item is later in time and carries more confirmation
    that the extreme is in - and, implicitly, a worse price. Entering at the turtle soup means
    having no protected high to trade against; entering after the inversion means the fair
    value gap has been disrespected; entering after the CISD gives a stop on the bodies or
    the swing highs; entering after the breaker and fair value gap means structure has clearly
    shifted.'
category: entry
status: contested
aliases:
- order of reversal
- how much confirmation you need
preconditions:
- Price has swept a prior extreme at a level where a reversal is plausible.
- Price is being read as a consolidation and reaches into London.
- A sweep of the consolidation high (or low) occurs.
- Price has reached a level where a reversal is plausible (previous day highs taken, in his
  example).
detection_rules:
- 'Step 1: the sweep of the previous low/high (turtle soup, raid of stops). Least confirmation.'
- 'Step 2: a close beyond the fair value gap that had supported the prior move - an inversion.'
- 'Step 3: a change in the state of delivery - a close over the opposing-close candles that
  swept the extreme.'
- 'Steps 4 and 5: the fair value gap and the breaker.'
- Steps 2 and 3 together are the stated minimum for 'more confirmation that a reversal has
  formed'.
- Each successive step is later in time and therefore a worse price - the choice of rung is
  the trader's confirmation appetite.
- 'Step one: the sweep of the consolidation high - a turtle soup.'
- 'Step two: an inversion forming after the sweep; this is already an entry.'
- 'Step three: the change in the state of delivery / order block formation.'
- 'Immediately after step three: a breaker block and a fair value gap form and overlap.'
- On the retest, require the bodies to still respect the change in the state of delivery.
- The retest into that overlap can itself form a new propulsion block.
- 'Rung 1 - turtle soup: a sweep above the highs (or below the lows). Least confirmation;
  no protected extreme yet.'
- 'Rung 2 - inversion: a close beyond the fair value gap that had supported the move.'
- 'Rung 3 - change in the state of delivery / order block formation: a close through the series
  of up-close candles that made the high.'
- 'Rung 4 - breaker block: the swing-high-to-swing-low structure now exists.'
- Rung 5 - fair value gap left by the displacement away.
- Choose ONE rung to trade and use it consistently - the choice is the trader's confirmation
  appetite.
- 'The same ladder is fractal: he shows it on a 30-minute chart and then again inside the
  paired 3-minute chart.'
invalidation:
- Price takes out the low the reversal was trading toward without the sequence completing
  - the Short ends with exactly that happening.
- At rung 1 specifically, he warns price will stop you out repeatedly unless it reverses immediately
  - the low-confirmation rung has no invalidation level.
measurable:
- hold rate of the swept extreme conditioned on how many rungs have printed
- average adverse excursion by entry rung
- expectancy by rung (turtle soup vs inversion vs CISD entry)
- how often the breaker and fair value gap overlap after step three
- win rate and average entry price by rung, on the same reversal sample
- stop-out frequency at rung 1 vs rung 3
- how often the later rungs never print after a rung-1 sweep
