ambiguities:
- Sourced from an ASR (whisper-small) transcript, not YouTube captions; wording may be imprecise.
- The consolidation manipulation rule (take the high, then run the lows) and the requirement
  that a particular high not be taken can point at the same price, and video Nlw-PZhoViQ resolves
  this by standing aside rather than by ranking the two conditions.
- The classification of the leg as a consolidation rather than a retracement is the precondition
  and is itself not rule-based in these videos.
- No minimum number of candles or minimum width defines a consolidation.
- How far past the range low the sweep may go before the idea is abandoned is not stated.
- In video IzOQmcgLyA0 the consolidation is identified on a 30-minute chart under an hourly/daily
  framework; no rule assigns which timeframe to inspect.
