id: oco-bracket-order
name: The OCO Bracket (his stated order type)
definition: 'The one order type he names as personally used. Having placed a limit order to
  get in, he brackets the position with a stop loss and a take profit as a one-cancels-the-other,
  so whichever fills cancels the other. The surrounding taxonomy he gives: buy/sell limit
  rests at a price and fills there; buy/sell stop rests beyond price and converts to a market
  order on touch; buy/sell market takes the bid or ask.'
category: entry
status: specified
aliases:
- OCO
- one cancels the other
- bracket order
preconditions:
- A position (or a resting limit entry) with a defined stop and target.
detection_rules:
- Entry may be a resting limit at the intended price.
- Attach stop loss and take profit as a single OCO pair.
- Whichever leg fills cancels the other automatically.
- Stop orders (buy stop / sell stop) fill at market on touch, not at the stop price.
invalidation:
- Not applicable - order mechanics.
measurable:
- fill rate of the resting limit entry versus a market entry at signal time
- slippage on the stop-loss leg when it converts to market
sources:
- video_id: dtsrR8dX2Ro
  title: Intro To Futures Trading & Prop Firms
  quote: one I specifically use is in one cancels the other or an Oco
- video_id: dtsrR8dX2Ro
  title: Intro To Futures Trading & Prop Firms
  quote: whichever one gets hit will cancel the other
ambiguities:
- This video describes his entry as 'placing a limit order to buy in'; elsewhere in the corpus
  he states he enters at market rather than with resting orders. This video is an instructional
  overview of order types for beginners, so it is recorded here without changing that other
  entry's reading.
- No rule is given for where the limit is placed relative to the setup level.
- Nothing is said about whether the OCO is submitted with the entry or after the fill.
