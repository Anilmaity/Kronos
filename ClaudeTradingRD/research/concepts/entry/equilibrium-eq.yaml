id: equilibrium-eq
name: Equilibrium / 50% Level (EQ, T spot)
variants:
  name:
  - Equilibrium / 50% Level (EQ)
  definition:
  - 'The 50% of a reference candle''s range, used in this unit for three distinct jobs. (1)
    CANDLE 4 FILTER: for a bullish continuation the candle 4 wick must form in the upper half
    of candle 3''s range (lower half for bearish), because expansions do not give deep retracements.
    (2) INVALIDATION: a close beyond the EQ of the previous candle on the aligned timeframe
    is one of only two conditions under which he will trade against his own bias. (3) TARGET:
    on a large-wick reversal candle the EQ of the previous candle is the target, in place
    of expansion targets. He is careful that (2) is probabilistic -- an EQ break makes expansion
    unlikely, it does not guarantee reversal.'
  - 'The dedicated teaching video for how he measures EQ, and it settles the measurement question
    the rest of the corpus leaves open. The tool is a plain Fibonacci with 0.5 (and 1) marked,
    usually reduced to just the 0.5. The candle is ALWAYS measured wick high to wick low;
    he states directly that he does not use the bodies for this, because bodies are what he
    uses for the change in the state of delivery and for order blocks. One exception is given
    and it is the exception the corpus needed: when a candle carries a very large wick, taking
    the EQ of the whole candle ''doesn''t really make sense'' and he switches to 0.5 of that
    wick instead. The switch is tied to a readable trigger - a close above 0.5 of the candle''s
    range is generally what makes him view the candle as a reversal, after which 0.5 of its
    wick is the level in use. He applies it on the previous completed candle to govern the
    current one, and says it is fractal but that he prefers daily / 4-hour / hourly because
    a 5-minute application becomes too much to look at.'
  - 'Two Shorts work the EQ as a BIAS INVALIDATOR rather than as an entry level, which is
    the sharpest statement of that branch in the corpus. Bullish setup after a V-shape reversal
    with a daily candle 2 closure: the next candle should open low and form a continuation
    higher; instead price does not respect the EQ and forms no bullish continuation out of
    the area. He states the consequence directly: disrespecting the EQ while never forming
    a bullish continuation sets up a BEARISH framework - bearish opposing candles, a close
    below the EQ, and therefore a likely reach for the previous day low and ultimately the
    candle 2 low. Notably the previous day HIGH was never taken - the EQ alone did the work.
    The companion Short shows the positive case fractally on the 4-hour: require 0.5 of the
    candle to be respected, and while 0.5 keeps being respected, expansion continues.'
  - 'The midpoint level that must hold for a continuation to remain valid. Within this unit
    three different measurements are used, apparently interchangeably: 50% of the whole higher-timeframe
    candle, 50% of the reversal candle''s wick, and 50% of the bodies of the opposing candle.
    It is used both as the zone a retracement may reach without invalidating the move, and
    as the reference for expecting a reaction.

    '
  - 'A viewer asks directly how the EQ is derived — off the candle size or off the candle
    body — and he gives the first mechanical answer to that question in the corpus: if the
    candle has a large body (an expansion candle) you measure the EQ from its high to its
    very low; if the candle has a larger wick you measure the wick instead. The same 50% logic
    is then applied at range scale in the live sessions: the midpoint of a range high to range
    low is called "the liquidity around the EQ" and used as the default target once a range
    edge has been swept, and the previous day''s EQ is used as one of the three standing levels
    on an inside day.

    '
  - 'SHORTS EVIDENCE using the EQ as a directional invalidation rather than an entry zone.
    After a monthly candle 2 closure that failed to produce a strong closure, the daily is
    watched for the reaction; when price instead closes BELOW the EQ, the bullish read is
    dropped and he looks for price to fail and reach for the lows instead. He is careful to
    state the limit of the rule: it is not all or nothing, and if price is bought back up
    it can still go higher - the phases of price must be watched. The whole invalidation is
    explicitly fractal, as the model is.'
definition: 'CONTESTED WITHIN THIS UNIT - three different 50% levels are all called ''the
  EQ'' and are used for different jobs: (a) the EQ of the PREVIOUS DAY''S RANGE, which a continuation
  day''s opposing move must respect - operationalised as no hourly closures beyond it; (b)
  the EQ of the CURRENT higher-timeframe candle, which the indicator draws and which candle
  4 must respect at 50% of candle 3''s range; and (c) 0.5 of a WICK (body-to-extreme), which
  is the half-wick-respect test. Additionally, a range''s equilibrium is used as a magnet:
  if price deviates from a consolidation range it is expected back to the middle of that range.'
category: entry
status: contested
