ambiguities:
- Three distinct levels share one name within a single unit; nothing in the material disambiguates
  them when 'the EQ' is used without qualification.
- The T-spot is equated with the equilibrium in one example, which would make (b) and the
  T-spot the same object - contradicted by the T-spot being drawn as a BOX, not a line.
- The previous-day-EQ test is stated for hourly closures under a daily/hourly pairing; no
  equivalent closure timeframe is given for other pairings.
- Range-based EQ and body-based EQ are both used in this unit ('the upper half of this from
  body to body') without a selection rule.
- Which candle is 'the previous candle' for the invalidation test depends on the aligned timeframe,
  which is not pinned down.
- He explicitly says an EQ break is not deterministic and offers a counter-example, but gives
  no filter to separate the cases.
- '''A very large Wick'' - the trigger for switching from whole-candle EQ to wick EQ - is
  not quantified. The switch condition is decidable only via the reversal reading (a close
  above 0.5 of the range), which is itself hedged with ''generally''.'
- He says he would 'allow it to trade slightly a bit higher' than the exact 0.5 of a wick,
  so the level is a zone whose width is not given.
- Wick touch versus body close through the EQ is not distinguished.
- CONTESTS the body-based reading recorded elsewhere in the library ('use 50% of the bodies
  of the opposing candle'). This dedicated video rules bodies out for EQ specifically and
  assigns them to the CISD and order blocks. The two statements cannot both be his general
  rule; this one is from the primary teaching.
- The auto-captions render 0.5 variously as '0.5', '05', '0 five' and '5 of that'.
- Which candle the EQ is measured on is shown but never said - in the bearish flip it appears
  to be the candle 2 / reversal candle, in the 4-hour case it is "this candle".
- Two conditions are joined ("disrespect the EQ AND never form a bullish continuation") with
  no statement of whether either alone suffices.
- '"Respecting" is not defined as a wick touch versus a body close, consistent with the rest
  of the corpus.'
- The 4-hour Short mixes 0.5 of a candle and 0.5 of a wick within the same walkthrough without
  marking the switch.
- 'CONTESTED: three different midpoint measurements are used within the same unit with no
  stated precedence or context rule. This must be resolved before any detector is written.'
- He also says he uses EQ 'as I teach it' and points to a dedicated video, which is not in
  this unit.
- '''Large candle body'' versus ''larger wick'' is a visual judgement; no ratio threshold
  is given for choosing which measurement applies.'
- Whether the wick measurement means 50% of the wick's own span or 50% of the wick measured
  from the body is not stated.
- The relationship between EQ and the T-spot is used loosely in these streams — at one point
  'our EQ, our T-spot' are named as the same thing, which conflicts with the two-overlapping-half-levels
  construction elsewhere in the corpus.
- Which range the EQ belongs to (the C2 candle, the monthly range, the swing) is not stated.
- '''We didn''t get a very strong closure'' is the trigger for needing the EQ test at all,
  and ''strong'' is not quantified anywhere in this Short.'
- No rule states how long price may sit below the EQ before the recovery branch is ruled out.
