preconditions:
- 'A defined range: a previous day, a candle, a wick, or a consolidation.'
- A reference candle whose range is being halved (usually candle 3, or the previous candle).
- A completed candle (or range) whose 0.5 can be marked.
- A candle 2 closure / reversal has set a directional expectation for the next candle.
- A reversal or opposing candle exists whose midpoint can be measured.
- A defined candle (or range) whose high and low are both formed.
- A higher-timeframe closure has set a directional expectation.
- The relevant range's 50% level has been marked.
detection_rules:
- 'Reading (a) previous day range EQ: mark 50% of the previous day''s high-low. On a continuation
  day the opposing move must hold it - specifically, no hourly closures beyond it. Price need
  not reach it.'
- 'Reading (b) current candle EQ: 50% of the higher-timeframe candle''s range; drawn by the
  indicator; candle 4 must respect 50% of candle 3''s range.'
- 'Reading (c) wick EQ: 50% of the wick measured body-to-extreme (see half-wick-respect).'
- 'Range magnet: if price deviates outside a consolidation, expect a return toward that range''s
  equilibrium.'
- Disrespecting the EQ is read as the swing point being likely to fail, which makes that swing
  the new draw on liquidity.
- Mark 0.5 of the reference candle's range.
- 'Continuation filter: the next candle''s counter-directional wick must stay in the upper
  half (bullish) / lower half (bearish).'
- 'Invalidation: a close beyond the EQ on the aligned lower timeframe, with no continuation
  formed in the original direction, flips the read.'
- 'Target: on a large-wick candle, use the EQ of the previous candle (plus the daily open
  and session extremes) instead of expansion targets.'
- 'Stop-placement reference: a low that sits below the EQ of the previous candle is a defensible
  stop location.'
- The EQ frequently overlaps the opposing-candle opening price; the overlap band is what he
  wants respected.
- Draw the Fibonacci from the candle's WICK HIGH to its WICK LOW; EQ := the 0.5 level.
- Do NOT use the bodies - bodies are reserved for the CISD and for order blocks.
- 'Default: EQ of the whole candle''s high-to-low range.'
- 'Exception: when the candle carries a very large wick, use 0.5 of THAT WICK instead of 0.5
  of the whole candle.'
- 'Switch trigger: price closing above 0.5 of a candle''s range is generally read as a reversal,
  after which 0.5 of that candle''s wick becomes the level in use.'
- Apply the previous completed candle's EQ to govern the current candle.
- Fractal across timeframes; he uses daily, 4-hour and hourly and declines the 5-minute.
- He allows price to trade slightly beyond the exact 0.5 of a wick rather than treating it
  as a hard line.
- Mark 0.5 of the reference candle.
- Bullish continuation requires that EQ to be respected and a bullish continuation to form
  out of the area.
- 'Failure branch: price does not respect the EQ AND no bullish continuation forms -> a bearish
  framework, targeting the previous day low and then the candle 2 low.'
- A close below the EQ makes the previous day low the likely draw.
- This can happen without the previous day HIGH ever being taken - the EQ disrespect alone
  flips the read.
- 'Positive case, fractal on the 4-hour: while 0.5 continues to be respected, expect expansion
  to continue.'
- 'Reading A (aqnY1yZvfYs, direct answer to a chat question): EQ is measured on the whole
  candle, not the body.'
- 'Reading B (yud7TpE2AMs, 00iZXPAdR5A): use 50% of the bodies of the opposing candle - in
  one worked case this coincided with a volume imbalance, which he then used as the level.'
- 'Reading C (Qv6Ux_Z8VrA, yud7TpE2AMs): use 0.5 of the reversal candle''s wick as the level
  that must be respected.'
- 'In all readings: price respecting the level supports continuation; trading decisively through
  it argues the setup has failed.'
- If the candle is an expansion candle (large body), EQ = 50% of the full high-to-low range.
- If the candle has the larger feature in its wick, EQ = 50% of the wick, not of the whole
  candle.
- At range scale, EQ = 50% of range high to range low; treat the liquidity resting around
  it as the default target after a range extreme is swept.
- Previous day EQ is one of the standing points of interest on an inside day.
- Mark the EQ of the range in play.
- A close BELOW the EQ (bullish case) invalidates the directional expectation.
- On invalidation, switch the objective to the lows.
- The invalidation is not absolute - if price is bought back up the original read can resume.
- The same test is applied at every scale (monthly closure -> daily reaction -> lower timeframe).
invalidation:
- A close beyond the relevant EQ against the read.
- Price closes beyond the EQ -- 'once price reaches beyond that EQ, it's not a small wick
  anymore mechanically'.
- Price closes through the EQ against the direction being held - the bias flips to the opposite
  extreme of the range.
- Price closes back through the EQ in the original direction and forms the continuation after
  all.
- Price closes through the chosen midpoint against the intended direction.
- Displacing through the EQ of a monthly candle is read as a signal the candle wants to close
  outside the prior range (Qv6Ux_Z8VrA, gold).
- Price closes decisively through the EQ in the direction opposite the expected reaction —
  though he states that a close below previous day EQ is not by itself a bias invalidation.
measurable:
- how often each of the three EQ readings holds, measured separately
- whether 'no hourly closure beyond the previous day EQ' actually predicts continuation days
- respect rate of the EQ of candle 3 by candle 4's wick
- forward return after an EQ close-through vs an EQ hold
- hold rate of previous-candle EQ split by whole-range EQ vs wick EQ
- distribution of overshoot beyond 0.5 on reactions that still worked
- hit rate of the previous-day-low target after an EQ close against the bias
- how often the EQ flips the read without the previous day extreme being taken
- Comparative hit rate of whole-candle 50%, wick 50% and body 50% as reaction levels on the
  same sample.
- reaction rate at candle EQ measured body-wise versus wick-wise
- hit rate of range-EQ as a target after a range extreme is swept
- frequency of previous-day-EQ respect on inside days
- share of EQ-close invalidations that go on to reach the opposite extreme
- false-invalidation rate (price recovers back through the EQ and continues)
