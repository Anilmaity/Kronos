id: level-to-trade-away-from
name: No Level to Trade Away From, No Trade
definition: 'Stated as a top-down principle with a decidable rejection test. Price should
  reverse at a RELEVANT point of interest; a candle closing back inside its previous range
  is not enough on its own. The rejection test given is positional: if reversing here would
  leave a low untaken to the left, it does not make sense to reverse and form a failure swing
  there - so he either misses the move if it does reverse, or waits for price to reverse off
  the key level. Only once price hits the key level does he drop to the lower timeframes to
  look for the reversal structure - shown as a change in the state of delivery and then a
  continuation forming off it.'
variants:
  definition:
  - 'A trade can only be framed if there is a relevant level that price has interacted with
    and that the trade can be positioned away from: a swept low for a long, a swept high for
    a short, or an equivalent point of interest such as a fair value gap that produced a swing
    point. If no relevant level has been hit during the session, the correct action is to
    place no trade, regardless of how strong the higher-timeframe bias is.

    '
  - 'Used three times in this unit to decline setups that look good on the chart. A viewer
    offers a clean hourly short on oil; he agrees the pattern looks great and refuses it,
    because oil failed to reach the relevant level above - the pattern supports nothing when
    there is no level behind it. The same reasoning appears as a long refusal: he has no low
    he would trust to trade away from, so he will not favour longs. And the reverse case is
    stated for targets: where there is no draw on liquidity, nothing to range for, you do
    not frame a continuation at all - you favour a retracement or a reversal instead.

    '
category: entry
status: contested
aliases:
- sit on hands
- nothing to frame
- point of interest requirement
- failed to reach a relevant level
- nothing to range for
preconditions:
- A top-down read is in progress with key levels marked.
- A directional bias exists.
- A candidate setup on the execution timeframe.
detection_rules:
- Require price to be AT a relevant point of interest before accepting a reversal.
- 'Rejection test: if reversing here would leave a low (or high) untaken to the left, do not
  accept it.'
- Accept missing the move rather than taking a reversal without a level.
- Only after price hits the key level, drop to the lower timeframes for the reversal structure.
- Reversal structure = a change in the state of delivery, then a continuation forming off
  it.
- 'For a long: a low must have been swept, giving a protected low to trade away from.'
- 'For a short: a high must have been swept, or the strongest asset must have reversed at
  its high.'
- If neither has occurred, no setup exists and no entry is taken.
- A level that price only reaches without sweeping (leaving equal highs or lows) does not
  qualify; it reads as consolidation.
- Identify the level the trade is being taken away from; if it does not exist, do not take
  the trade regardless of pattern quality.
- A level that price failed to reach is not a level to trade away from.
- A swing that is too old or too untrustworthy does not qualify as a level to trade away from.
- Identify the draw the trade is going toward; with no draw, do not frame a continuation -
  favour retracement or reversal.
- Unless price is already close to the draw, a continuation is not framed.
invalidation:
- Price reverses without reaching the key level - a missed move, by design, not a trade.
- Price consolidates at the level rather than displacing away, which removes the level as
  a trade-away point.
- Not applicable - a pre-trade gate.
measurable:
- share of reversals that occur at a marked key level versus away from one
- cost of the missed-move branch over a sample
- count of sessions with zero frameable setups under this rule
- outcome of trades framed without a swept level, if taken
- expectancy of setups taken with vs without an identified level behind them
- expectancy of continuations framed with no open draw
