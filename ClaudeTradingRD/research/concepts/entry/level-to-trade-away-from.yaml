ambiguities:
- '"Relevant point of interest" and "key level" are used interchangeably in the clip and neither
  is defined here.'
- The leave-a-low-to-the-left test assumes exactly one candidate low; no rule handles several.
- Which lower timeframe to drop to is not stated.
- What makes a level relevant is defined mainly by separation from neighbouring swings, which
  is judged visually.
- He allows exceptions where SMT substitutes for a sweep on one asset, without stating when
  that substitution is permitted.
- '''Relevant'' is carried over from the relevant-level concept and is not re-derived here.'
- '''Really close to the draw'' is the threshold for framing a continuation and is not quantified.'
- He caveats the oil refusal with 'that's just my opinion though', so it is stated as a personal
  filter.
