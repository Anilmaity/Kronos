  fractal: true
execution:
  bias: Direction of the distribution leg (opposite the manipulation wick).
  entry: Retracement into the breaker zone overlapping the time opening.
  stop: Not stated.
  targets:
  - 2 and 2.5 deviation
  - the opposing same-or-higher timeframe PD array
