id: opening-price-breaker
name: Breaker At The Candle's Own Opening Price
definition: 'A breaker is only considered "in development" once price closes back through
  the opening price of the candle currently in development (for example the midnight open
  for a daily PO3, or the 10:00 open for a 4H PO3). The breaker zone is constructed from the
  swing low - swing high - swing low that produced that close, and the most powerful breakers
  are those that overlap the time-opening price itself.

  '
category: entry
status: underspecified
aliases:
- breaker zone in the time opening
preconditions:
- The manipulation wick of the current PO3 has printed and been confirmed (SMT).
- The order block internal dynamic has already been broken.
detection_rules:
- Price closes back through the opening price of the candle in development.
- Mark the low-high-low (bullish case) that produced that close as the breaker zone.
- Prefer the breaker whose range overlaps the opening price.
invalidation:
- Price closes back beyond the breaker in the original direction.
measurable:
- hit rate of the first retracement into an opening-price-overlapping breaker
sources:
- video_id: wWIHS_dxbEY
  title: DexterLab | Putting All The ICT Pieces Together - Master PO3
ambiguities:
- No stop-loss placement is given anywhere in the talk.
- Whether the close through the opening price must be on the working timeframe or the execution
  timeframe is not stated.
- The exact swing points used to draw the breaker box are shown visually, not defined.
related:
