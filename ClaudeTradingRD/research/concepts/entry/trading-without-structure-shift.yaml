ambiguities:
- '''Aggressive'' is the load-bearing word in both branches and is never quantified - no candle-range,
  ATR or bar-count threshold is given.'
- '''Short-term high or low'' is not defined; no separation or age filter is stated.'
- BPR (balanced price range) and the box setup are named and drawn but not defined in this
  video - both are deferred to other videos.
- Which of BPR / fair value gap / box / OTE to use when several are available is not stated.
- The execution timeframe varies wildly across examples (1-minute, 15-second, 5-minute) with
  no selection rule beyond 'depending on the time frame I am trading'.
- He never defines what he is rejecting, so the boundary of the rejection is unclear.
- '''Proven wrong'' is pinned to the order block being violated elsewhere in the video, not
  in this answer.'
- He uses the phrase 'market structure quote unquote shift' once while walking through a bullish
  breaker, so the concept is used descriptively even though it is rejected as a trigger.
- It is not stated how a bias survives a large opposing move that never reaches the anchoring
  order block.
- This is a direct methodological opposite of the other guests in this unit, who all require
  a lower-timeframe break before entry; the disagreement is never put to him on air. Guest-versus-guest,
  not channel self-inconsistency.
