id: trading-without-structure-shift
name: Trading Without A Market Structure Shift / Break
definition: 'An entry method built to fire BEFORE a market structure shift or break, motivated
  by his having repeatedly missed moves waiting for one. Two things are required. First, a
  higher-timeframe point of interest - highs and lows, fair value gaps, order blocks, or whatever
  PD array the trader has selected. Second, and named as the most important, a run of a short-term
  high or low followed by an aggressive move back into the range. The run-and-return produces
  a balanced price range, a fair value gap, or a box setup, and that is the entry. A separate
  branch: a higher-timeframe point of interest that is run aggressively with NO higher-timeframe
  closure beyond the level gives an OTE / discount-or-premium entry. When both branches are
  present at once, the setup is at its best.'
variants:
  definition:
  - 'Asked directly what a market structure shift means to him and whether he waits for a
    low to rebalance a bullish fair value gap or for one to be broken, Finessee_Fx says he
    does not use market structure breaks at all and never considers them. His replacement
    is to trade the raw price action off the four arrays in his toolkit and to hold one bias
    until price proves him wrong - which for him means an order block being violated, not
    a swing being broken. He is careful to frame this as personal rather than universal.

    '
category: entry
status: contested
aliases:
- trading without a market structure shift
- entering prior to the structure shift
- I don't consider market structure breaks
- raw price action
preconditions:
- A higher-timeframe point of interest is identified and price has reached it.
- A short-term high or low exists that can be run.
- A higher-timeframe PD array has been identified and the direction of order flow around it
  read.
detection_rules:
- Require a higher-timeframe point of interest (high/low, fair value gap, order block, or
  the trader's chosen PD array).
- Require a short-term high or low to be run aggressively, followed by an aggressive move
  back into the range.
- The entry construction is then a balanced price range, a fair value gap, or a box setup
  formed by that run-and-return.
- 'Alternative branch: the higher-timeframe point of interest itself is run aggressively AND
  the higher timeframe fails to close beyond it - then use an OTE / discount or premium entry
  (0.62 is used in one example).'
- Do not look for longs before the low has actually been taken - 'we never took that low no
  reason to be looking long yet'.
- The method may be used purely as bias on the analysis timeframe rather than as an entry.
- No market structure break / shift is required at any point in the entry sequence.
- The entry trigger is arrival at one of his four arrays, taken with a limit or at market.
- 'Bias persistence: one directional bias is held until it is proven wrong.'
- The proof is array-based - the order block being violated means order flow no longer respects
  that direction and the bias flips - not swing-based.
invalidation:
- A higher-timeframe close or displacement beyond the level - that removes the come-back-into-the-range
  expectation.
- The order block (or breaker) that anchored the bias is violated.
measurable:
- hit rate of run-and-return entries taken before a structure shift vs after one
- how often the higher timeframe subsequently closes beyond the level (the invalidation rate)
- distribution of R outcomes for the BPR / box / OTE variants separately
- expectancy of array-only entries versus the same arrays gated by a lower-timeframe structure
  break
- how much earlier the array-only entry fills, and how much larger its adverse excursion is
- how many additional entries per month the no-MSS rule admits
