id: turtle-soup-sweep-entry
name: Turtle Soup Entry
variants:
  name:
  - Turtle Soup Conditions (and Why He Discourages It)
  definition:
  - 'The conditions he gives for a turtle soup: all timeframes aligned in one direction, plus
    the phases of price (for example a consolidation) so that a sweep is anticipated, then
    an entry taken at the sweep with a stop just beyond the sweep extreme. He says most people
    should avoid it because it is not easy, and separately calls out social-media traders
    who enter with a wide stop and then trail it down so the screenshot resembles a perfect
    turtle soup.

    '
definition: 'EARLIER RECORDING. Used here as the confident-trader variant of the inducement
  entry inside a trend: rather than waiting for price to close back into the range after raiding
  a high, he shorts INTO the raid - above the high being taken - with a FIXED stop loss, expecting
  the trend to resume. The alternative offered in the same breath is the conservative route:
  wait for the close back into the range and either enter there with the stop on the high,
  or drop a timeframe for a model.'
category: entry
status: contested
aliases:
- turtle soup
- sweep entry with tight stop
preconditions:
- A trend toward an objective is in progress.
- A swing high (bearish case) that price has failed to displace over is marked.
- All referenced timeframes point the same direction.
- A consolidation or similar phase makes a sweep of one side anticipated.
detection_rules:
- Price reaches up into a marked high inside a bearish trend (mirror for bullish).
- 'Confident variant: sell above that high with a fixed stop loss.'
- 'Conservative variant: wait for a close back into the range; enter on that close with the
  stop on the high.'
- 'Third variant: after the close back in, take a lower-timeframe setup instead.'
- Identify the level expected to be swept.
- Enter at the sweep.
- Place the stop immediately beyond the sweep extreme, not at a distant level.
invalidation:
- The fixed stop is hit / price displaces beyond the raided high.
- Price closes beyond the swept level and expands, making it a break rather than a sweep.
measurable:
- hit rate of the into-the-raid entry vs the wait-for-close-back-in entry on the same highs
- how far beyond the high price typically extends before reversing (to size the fixed stop)
- hit rate of sweep entries with tight stops versus continuation entries on the same setups
sources:
- video_id: NgFIza9qsGQ
  title: Finding Entries Into Trend - ICT Concepts
  quote: shorting above this high with a fixed stop loss expecting more downside
- video_id: egV_gABTQks
  title: (CPI) New York Open Live Q&A
ambiguities:
- The stop is described only as 'fixed' - no distance, no reference level.
- The gate is 'if I'm confident in this entry', which is not decidable from a chart.
- He does not say how far beyond the sweep the stop should sit, only that it must be tight.
- He recommends avoiding the setup without specifying who it is appropriate for.
