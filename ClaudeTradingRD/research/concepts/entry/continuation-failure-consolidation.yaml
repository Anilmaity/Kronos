id: continuation-failure-consolidation
name: 'Continuation Failure #1 - The Closure Is A Consolidation Sweep'
definition: 'SHORTS EVIDENCE for the reclassification rule and its pay-off. When a supposed
  retracement fails to close back over the level, it is no longer a retracement - it is a
  consolidation, and the correct response is to flip what the level means: instead of anticipating
  the low to hold, the low becomes the point of interest you wait for price to reach into.
  Every closure internal to that range is then ignored. He states the benefit plainly - reclassifying
  saves the loss. The breakout case is handled by the same rule: the breakout alone is never
  traded; a continuation must form after it, and if that continuation fails to reach a point
  of interest it is not valid.'
variants:
  definition:
  - 'The first of three named reasons continuations fail. When the recovery back into the
    range is slow rather than V-shaped, the structure is a consolidation, not a retracement.
    The eventual close over the level - the one the trader reads as validating the low - is
    in fact a manipulation of the consolidation range''s high, after which price trades to
    the other side of the range. The remedy is to reclassify: once the recovery is slow, stop
    treating the level as a continuation trigger, mark the range high and low, and take one
    of only two ways back in - wait for a manipulation of the range low and a V-shaped recovery
    off it, or trade the breakout but only if a NEW continuation forms after it. The universal
    first step after any suspect closure is to let one more candle print and see whether a
    new continuation forms or price comes back across the range.'
category: entry
status: contested
aliases:
- it's actually just sweeping out the high in the consolidation range
- reason number one
preconditions:
- A continuation was expected at a point of interest inside a trend.
detection_rules:
- 'Test the recovery: does price close back over the level? A slow, non-V-shaped return means
  no.'
- On failure, reclassify the structure from retracement to consolidation and mark the range
  high and low.
- Ignore all closures over levels INTERNAL to the range - they are not continuations.
- 'Flip the level''s role: the range low becomes the point of interest to wait for, not a
  level to defend.'
- Never trade the breakout by itself - require a NEW continuation to form after the breakout.
- A continuation that does not reach a point of interest is not valid, even if the closure
  is clean.
- In a consolidation the only two events of interest are a manipulation of the low or a breakout
  of the high.
- 'Measure the recovery speed into the level (see v-shape-reversal-speed: 1-3 candles).'
- If the recovery is slow or fails to regain the level, reclassify the structure as a consolidation
  and mark the range high and range low.
- 'Route A: wait for a manipulation of the range low (bullish case) and require a V-shaped
  recovery off it before entering.'
- 'Route B: trade the breakout of the range only if a new continuation forms after the breakout;
  the breakout alone is not tradeable.'
- Step one after any suspect closure is to wait one more candle and see whether a new continuation
  forms off the high or price returns across the range.
- If price returns across the range instead, the low being manipulated becomes the level to
  trade away from.
invalidation:
- A new continuation does form off the breakout - the range reading is superseded.
measurable:
- share of failed-recovery levels that are later swept to the opposite range extreme
- win rate of breakout entries with a post-breakout continuation versus without
- share of slow closures that are followed by a move to the opposite range extreme
- win rate of route A vs route B entries
