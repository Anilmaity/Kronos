ambiguities:
- No candle count is given in these Shorts for how long a failed recovery may take before
  reclassification is forced (the library's v-shape-reversal-speed entry supplies 1-3 candles
  from a different unit).
- '''Reach into a point of interest'' is required of the post-breakout continuation but the
  minimum depth of that reach is not stated.'
- The boundary between a slow retracement and a consolidation is the speed test, which is
  itself a preference ('1 2 maybe three') rather than a hard count.
- '''Wait one more candle'' is given as step one but he elsewhere says ''give it a couple
  candles''; the number of confirmation candles is not fixed.'
- No rule is given for choosing between route A and route B when both become available.
