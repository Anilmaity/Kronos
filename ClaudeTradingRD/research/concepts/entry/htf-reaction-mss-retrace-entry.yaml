ambiguities:
- Neither speaker quantifies the size of the structure break; $niper requires displacement
  with a fair value gap, Trader T requires only a break.
- $niper gives two candidate execution timeframes (15-minute or hourly) with no rule for choosing.
- Trader T's 'block' is not defined in this video - it is used interchangeably for an order
  block and a fair-value-gap zone.
- No time limit is placed on how long after the higher-timeframe level is tagged the shift
  may occur.
- Whether the closure above the swing high must be a body close is never stated; one example
  accepts a very minor swing high.
- No maximum time or candle count between the HTF level tag and the LTF confirmation.
- No rule for choosing between the FVG entry and the more-confirmed order-block entry - both
  are offered as two means of entry.
- The standard-deviation target method is referenced but not taught in this video.
