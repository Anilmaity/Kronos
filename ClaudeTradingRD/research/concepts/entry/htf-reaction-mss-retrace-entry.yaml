id: htf-reaction-mss-retrace-entry
name: HTF Level Reaction -> LTF Structure Shift -> Retracement Entry
definition: 'The same three-stage entry pattern stated independently by two guests in this
  unit - a higher-timeframe level is reached, a lower timeframe then shifts structure, and
  the entry is a retracement back into the array left by that shift. $niper states it as an
  explicit checklist (liquidity taken or a premium array tapped, then drop to the 15-minute
  or hourly, require a market structure break, then retrace into an OTE fair value gap or
  order block). Trader T states the same shape with fixed timeframes - an hourly sweep of
  a high or low, a break of structure on the 5-minute measured against the relative (fractal)
  low that existed PRIOR to the sweep, and a limit order back into the block.

  '
variants:
  definition:
  - 'The entry sequence built on top of internal/external range liquidity and timeframe alignment.
    Price reaches a higher-timeframe internal or external range level; on the paired lower
    timeframe a candle closes through a swing point in the anticipated direction; the entry
    is taken on the retracement into the fair value gap or breaker block created by that displacement;
    the stop rests at the extreme that tagged the higher-timeframe level.

    '
category: entry
status: contested
aliases:
- entry checklist
- one hour sweep with a five minute break of structure
- market maker buy model entry
- Sniper's entry model
preconditions:
- '$niper: liquidity has been taken (previous daily high, previous weekly high) or price has
  tapped a higher-timeframe premium fair value gap.'
- 'Trader T: an hourly swing high or low has been swept, and the pre-sweep relative high/low
  is marked.'
- '$niper: clear session lows / relatively equal lows / trendline liquidity must exist on
  the far side to be targeted.'
- A higher-timeframe internal or external range liquidity level has been reached.
- SMT divergence at that level is checked as an optional confluence booster.
- For indices, the 09:30 equities open has passed.
detection_rules:
- 'Only after the higher-timeframe level is reached do you drop timeframes ($niper: to the
  15-minute or the hourly; Trader T: to the 5-minute or 1-minute).'
- Require a market structure break on the lower timeframe. If price simply continues without
  breaking the opposing swing, there is no setup - it is a continuation of the current side
  of the curve.
- Trader T defines the structure reference as the relative / fractal low that existed prior
  to the sweep, not the low made by the sweep itself.
- Entry is a retracement into the array left by the shift - $niper prefers a fair value gap,
  then an order block; Trader T places a sell limit on the block.
- '$niper adds a location gate: the entry must be in premium for a short (see discount-requirement-before-entry).'
- $niper requires an identified liquidity objective to exist before the trade is taken.
- On the paired lower timeframe, wait for a candle to close above a swing high (bullish) or
  below a swing low (bearish).
- Mark the fair value gap left by that displacement, and/or the breaker block formed by the
  swing that was violated.
- Enter on the retracement into that fair value gap or breaker block; if both coincide, treat
  it as high probability.
- The same structure repeats one degree down - the LTF swing high just run is itself external
  range liquidity, so expect a retrace into the internal LTF gap before continuation.
invalidation:
- '$niper: the setup is invalidated if the protected high (long: low) formed at the shift
  is taken - shown in his 15-second example, where he was stopped out when the high he expected
  to hold was traded through.'
- 'Trader T: fixed stop beyond the block; he also abandons the trade before entry if price
  runs to the target before filling the limit.'
- Price trades through the extreme that tagged the higher-timeframe level (the stop).
measurable:
- hit rate of the retracement entry, split by whether the lower-timeframe break created a
  fair value gap or not
- difference in outcome between using the pre-sweep relative low and the sweep low as the
  structure reference
- how often price returns to the array at all after the break (fill rate of the limit)
- hit rate of the FVG-only entry versus the FVG-plus-breaker overlap entry
- realised R distribution using the stated stop and the opposing-pool target
- how often the retracement into the FVG occurs at all after the close through the swing
