  ltf:
  - 15m
  - 5m
  - 1m
  - 5s
  fractal: true
execution:
  bias: Set by the structure flip, not by the levels.
  entry: See gb-retracement-entry and gb-range-return-entry.
  stop: Beyond the anchor extreme, or beyond the local extreme of the wick being entered into.
  targets:
  - '0.41'
  - '0.295'
  - a new high or new low when the market is expanding cleanly
