  fractal: true
execution:
  bias: Set by which side of the EQ price holds.
  entry: At the PD array inside the correct half, on a CISD or an order block formation.
  stop: Beyond the protected swing inside that half.
  targets:
  - previous day high/low
  - the opposite extreme of the range
  - resting failure swings
