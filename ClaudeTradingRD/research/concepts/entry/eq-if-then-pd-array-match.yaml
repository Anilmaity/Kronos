ambiguities:
- He concedes the half sometimes contains no PD array at all ('this is where it's not always
  perfect'), and in that case allows price to trade further than usual on the basis of hourly
  structure - the allowance is not bounded.
- No precedence rule is given when several PD arrays sit in the correct half.
- '''Three days of expansion'' as the stop-condition is stated once by example, not as a rule.'
- Whether the if/then is written on the daily only, or on whichever timeframe is in use, is
  not stated; the examples are daily and 4-hour.
