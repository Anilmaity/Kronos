ambiguities:
- '''Down close candles from the first high to the first low'' does not say whether the zone
  is their combined open-to-close body span or the full high-to-low of those candles.'
- How the four points are identified (swing definition, lookback) is not stated in these Shorts.
- Whether a SINGLE down-close candle suffices, or a series is required, is not addressed.
- 'EVOLUTION, NOT CONTRADICTION: this is the earlier recording. The later rXMVPUZPw4A narrows
  the block to ''the lowest down close candle prior to the move that made the higher high'';
  this earlier video says the series between H1 and L1 without the lowest-candle qualifier.
  Both readings kept.'
- Whether the higher high / lower low must CLOSE beyond the prior extreme or may only wick
  beyond is not stated.
- '''Little wicks'' vs ''a large Wick and smaller body'' is a comparison, never a ratio.'
- The volume imbalance used as a second level in the first example is marked but not defined
  here.
- For the bearish case the PDF says the zone runs 'from this high to the low', but a later
  example marks 'those down close candles on the move down' - whether the anchor is the FIRST
  high or the higher high is stated both ways in the same video.
- Whether the zone spans all same-direction closes between the two points or only the contiguous
  run adjacent to the extreme is not stated.
- Wick vs body bounding is explicitly discretionary ('with these wicks kind of everywhere
  I will focus on the bodies').
- He closes by saying he prefers plain order blocks because they are simpler, so the breaker
  material is offered as an alternative, not as his own model.
- Swing confirmation lag (how many bars must pass before a swing point counts) is never given.
- '''Aggressive'' is never quantified by either speaker - no body size, range or displacement
  threshold.'
- Finessee_Fx says two consecutive candles in one example and three in another; whether more
  than two still qualifies is never addressed.
- Ben's stated favourite is a HIGH-timeframe breaker that price consolidates on, because the
  consolidation manufactures an internal liquidity run he can zoom into - but 'consolidation
  period' is not bounded.
- Neither speaker states how long a breaker stays valid.
- The auto-captioner renders 'order block' as 'water block' throughout the Finessee_Fx transcript.
- '''Lowest down close candle'' vs ''the series'' is used interchangeably in the examples;
  for a series he marks the whole block.'
- Whether the higher high must CLOSE above the swing high or only wick above is not stated
  — the diagrams show a wick sweep.
- The two stop placements are offered as a risk-to-reward choice, not a rule.
- The choice of breaker over order block is stated as personal preference, with no comparative
  evidence.
- Whether the breaker requires the liquidity sweep first (as in other corpus definitions)
  is not stated here.
- He says an MMXM is 'by definition mitigation - a mitigation of orders' and that a breaker
  is a form of the same thing, without reconciling breaker and mitigation block as separate
  objects.
- Whether the zone uses only the contiguous up-close candles immediately preceding H1, or
  every up-close candle between L1 and H1, is not stated.
- '''Displacement'' paired with the breaker is required in words but never quantified.'
- Swing confirmation lag is not restated here.
- Stop and entry selection are explicitly discretionary — the video shows one case where each
  choice wins and another where it loses.
- The video does not require an 'important level' for breakers the way the order block video
  does, though the top-down examples always have one.
- No displacement requirement is attached to the break below the candle.
- No rule is given for which candle to use when several down-close candles precede the run
  - single candle versus series is not addressed.
- Neither stop placement nor targets are given here; he defers to a post on his own page.
- The second source quote is included only to anchor the host's own vocabulary in this unit;
  the indicator video makes no breaker statement, and his indicator does not draw breakers
  at all.
- The exchange is partly a stream-delay misunderstanding, so how much of the disagreement
  is definitional versus a crossed-wires moment is not fully separable.
- Neither speaker states which candle body or wick bounds the level.
- The Short does not say whether the higher high must CLOSE above the prior high or merely
  trade above it.
- '"Between the low and the high" identifies the up-close candles positionally; which of them
  to use when several qualify is not stated.'
- No stop, entry price within the block, or target is given in this clip - only "look for
  a reaction there".
- The bearish mirror is not stated.
- The two definitions are not reconciled by either speaker; Ash names a candle, Rauf names
  a swing shape and projects candles forward.
- Neither states the timeframe on which the confirming body close must occur.
- Ash sources the concept to ICT core content month 5 'institutional swing points'; that source
  is described but not reproduced, so the original definition is not verifiable here.
- How long a projected breaker stays valid is unstated.
- He states plainly that he does not use breaker blocks much, so this is a definition he supplied
  on request rather than part of his model - treat it as low-weight.
- Only the bullish orientation is described; the bearish mirror is not stated.
