id: breaker-block
name: Breaker Block
variants:
  name:
  - Breaker Block (preferred over the order block, as a mitigation)
  - Breaker As A Four-Point Price Pattern (AM Trades' definition)
  definition:
  - 'EARLIER RECORDING (old ''Education - ICT'' playlist; the channel later re-recorded this
    as ''Breaker Block & FVG Entry Model'', rXMVPUZPw4A, which is the canonical reading).
    The structural definition is identical to the later one - bearish: a high, a low, a higher
    high relative to that high, then a lower low relative to that low; bullish mirrors. The
    block is the down-close candle OR SERIES of down-close candles between the first high
    and the first low. What this earlier recording adds and the later one drops is (a) an
    explicit rationale - the would-be support becomes resistance when price breaks through
    it - and (b) a marking procedure that switches level by the candle''s wick-to-body proportion
    (see wick-vs-body-marking-rule). It also states why a SERIES is used rather than a single
    candle: the series is one candle on the next timeframe up.'
  - 'A four-point swing sequence plus a candle-selection rule, stated here as a candlestick
    pattern. Bearish: high, low, higher high, lower low - the zone is the DOWN-close candles
    marked from that high to that low, and it is expected to resist price on a return. Bullish:
    low, high, lower low, higher high - the zone is the UP-close candles before the move that
    made the lower low, and it is expected to support price. When wicks are untidy he marks
    the zone off the BODIES. This lesson matches, word for word, the sequence the host used
    on air to correct a guest who had called a low-high-higher-high-lower-low structure a
    breaker.'
  - 'Two guests define the breaker compatibly. Finessee_Fx: a bearish breaker is the last
    bearish down-close candle immediately prior to a stop run higher - the run being two consecutive
    aggressive bullish candles that take out the old highs - after which price trades back
    below that candle; the bullish breaker is the mirror, the last bullish candle before a
    decline that takes out lows and fills an imbalance, confirmed when price then breaks back
    above the high. Ben adds the compressed definition - a breaker block is simply a flipped
    order block: the same candle that was a bullish order block becomes a bearish breaker
    once price has broken through it - and states the discriminator against a mitigation block:
    a breaker creates a NEW high (so it is not a failure swing), a mitigation block does not.

    '
  - 'A structural (not candle-level) pattern. Bearish breaker: price puts in a swing high,
    then a swing low, then sweeps stops above the swing high making a HIGHER HIGH, then displaces
    below the swing low making a LOWER LOW — ''a high, low, higher high, lower low''. The
    traded candle is the LOWEST DOWN-CLOSE candle prior to the move that made the higher high
    / raided the stops. The bullish case mirrors: low, high, lower low, higher high, and the
    last up-close candle before the move that made the lower low.'
  - 'Rauf names the breaker as his favourite entry technique and gives his reason: a breaker
    shows a real change in the state of delivery, and he quotes ICT that a change in state
    of delivery is where opportunities are born. His structural definition is low, high, lower
    low (bullish), with the significant candle being the one no bodies subsequently pass.
    Functionally he treats a breaker as another FORM OF MITIGATION - the place where anyone
    who was positioned the other way can square or offset their position. He prefers breakers
    to order blocks purely as personal preference but says he finds them much more meaningful,
    and notes that every ICT PD array can be reclaimed but breakers differ in that they carry
    this structure.'
  - 'A four-point swing sequence plus a candle-selection rule. A bullish breaker requires
    the confirmed sequence low -> high -> lower low -> higher high; the breaker zone is the
    single or series of UP-CLOSE candles located between the low and the high, marked as a
    rectangle INCLUDING the wicks. A bearish breaker requires high -> low -> higher high ->
    lower low, with the zone being the down-close candles. The defining feature versus a mitigation
    block is that a prior extreme is swept (the lower low / higher high in the middle of the
    sequence). The speaker states a breaker is "a form of mitigation".

    '
  - 'AM Trades gives a purely pattern-based definition on the 15-minute chart. The sequence
    is: price makes a high, a higher low, a higher high, then a lower low; then price retraces
    back into the breaker. The breaker itself is the down-close candle that sat immediately
    before the run on buy side, and it becomes a breaker only once price has broken below
    it. Down-close candles produce bearish breakers and the mirror holds for bullish breakers
    off up-close candles. He is explicit that it is ''really just a pattern in price'', and
    points to a simplified entry-model post on his own page rather than adding conditions
    on air.'
  - 'A naming dispute worked out live between host and guest over the same five-minute structure.
    The guest marks a low, high, higher high, lower low sequence and calls it a breaker, using
    it as the level to close through. The host refuses the label twice: he says that is not
    a breaker, it is an order block, and then restates the sequence he requires for a breaker
    - a low, high, lower low, higher high - before agreeing to work with the guest''s level
    anyway, calling it a level rather than a breaker. Both readings are preserved.'
  - A Short gives the bullish breaker as a strict four-point sequence and then walks it forward
    live on GBPUSD 5-minute. The sequence is LOW, HIGH, LOWER LOW, HIGHER HIGH. Once the higher
    high confirms it, the breaker itself is the series (or the single) UP-CLOSE candle between
    the low and the high; that marked area is what price should react to when it returns,
    and the expectation is continuation higher off it.
  - 'The opposing-close candle (or run of candles) at the swing that produced a liquidity
    raid, used as the entry level once price displaces back through it. Two formulations appear
    in this unit - Ash defines it by the candle, Rauf defines it by the three-point swing
    shape - and they describe the same structure from different angles.

    '
  - 'Given as a one-sentence answer to a chat question and immediately qualified with the
    statement that he does not really use them. The construction: a low, then a high, then
    a lower low, then a higher high; take the range from the first low to the high and extend
    it forward. That extended zone is the breaker block.

    '
  category:
  - structure
definition: 'SHORTS EVIDENCE, and the crispest four-point statement of the pattern in the
  corpus. A BEARISH breaker is the sequence high, low, higher high, LOWER LOW; the zone is
  then the DOWN-CLOSE candles taken from the FIRST high to the FIRST low, used as resistance.
  A BULLISH breaker is the mirror: low, high, lower low, HIGHER HIGH; the zone is the up-close
  candles between the first low and the first high, used as support. The pattern is not complete
  until the fourth point prints - a worked counter-example shows high, low, higher high with
  no lower low following, which he rules out as not a breaker. He states the gate directly:
  a breaker is a candlestick pattern showing a reversal and must be used with a higher-timeframe
  bias, not pattern-traded on its own.'
category: entry
status: contested
aliases:
- bearish breaker block
- bullish breaker block
- breaker
- bullish breaker
- bearish breaker
- flipped order block
- institutional swing point
preconditions:
- A higher-timeframe bias exists (stated as a hard requirement, not a preference).
- A swing high and a swing low are already in place on the working timeframe.
- A draw on liquidity / higher-timeframe point of interest has been identified.
- Four confirmed swing points in the required order.
- An old high or low exists to be run.
- 'Finessee_Fx: for a bullish breaker, an inefficiency below price that the decline can fill.'
- A swing high and a swing low exist in sequence.
- A swing structure with a low, a subsequent high, and a lower low (mirror for bearish).
- 'Preferred: displacement through the zone, ideally leaving a fair value gap (see unicorn-model).'
- A completed high / higher low / higher high / lower low sequence on the working timeframe.
- A four-point swing sequence on the execution timeframe.
- A swing low has formed.
- A liquidity raid has occurred - a swing high or swing low has been run.
- 'A four-point sequence exists: low, high, lower low, higher high (bullish orientation as
  described).'
detection_rules:
- 'Bearish breaker point sequence: high -> low -> higher high -> lower low.'
- 'Bullish breaker point sequence: low -> high -> lower low -> higher high.'
- If the fourth point never prints, there is no breaker - discard the structure.
- Bearish zone := the down-close candles spanning the FIRST high to the FIRST low.
- Bullish zone := the up-close candles spanning the first low to the first high.
- Wait for price to retest the zone and require continuation away from it.
- Do not take the pattern without a higher-timeframe bias.
- 'Bearish: mark H1, then L1. Require a higher high H2 > H1, then a lower low L2 < L1.'
- 'Bullish: mark L1, then H1. Require a lower low L2 < L1, then a higher high H2 > H1.'
- Block := the down-close candle(s) (bearish) or up-close candle(s) (bullish) located between
  H1 and L1.
- Use the whole consecutive SERIES, not a single candle, because the series is a single candle
  one timeframe up.
- Full-bodied candle with little wick -> mark the whole body; watch the closing price and
  the mean threshold (50% of the body).
- Large-wick / small-body candle -> mark close-to-extreme instead, and use the 0.5 level of
  that wick.
- Expect the reaction in that zone; bodies must not close beyond the marked level, wicks may
  dig in.
- 'Ideal case: price taps the mean threshold and closes back out of it.'
- 'Bullish: confirm the sequence low, high, lower low, higher high. The pattern does not exist
  until the higher high prints.'
- Bullish zone := the up-close candles before the move that produced the lower low.
- 'Bearish: confirm the sequence high, low, higher high, lower low.'
- Bearish zone := the down-close candles marked from that high to that low.
- Where wicks are scattered, mark the zone from the bodies rather than the extremes.
- 'Bearish breaker: find the last bearish (down-close) candle before the aggressive run that
  takes out highs; the run must actually take stops out. Confirmation is price closing back
  below that candle.'
- Finessee_Fx states the run as two consecutive aggressive candles; in a second example he
  says 'back to back to back', so the count is at least two.
- 'Bullish breaker: the last bullish candle before the decline that takes out a low AND fills
  the fair value gap below; confirmation is price breaking back above the swing high that
  follows.'
- 'Ben: a breaker is a flipped order block - the same candle, re-polarised once price has
  traded through it.'
- 'Ben''s discriminator: the move must create a new high (bullish case: new low) for it to
  be a breaker; a candle whose move does not recreate a new swing extreme is a mitigation
  block, not a breaker.'
- Finessee_Fx demarcates the zone wick-to-body and extends it forward; the level is expected
  to be respected repeatedly, not once.
- 'Ben''s invalidation test: no candle CLOSE beyond the defending edge of the breaker.'
- 'Bearish: identify swing high H1, then swing low L1.'
- Price sweeps above H1 (higher high), then displaces and closes below L1 (lower low).
- The breaker candle is the LOWEST down-close candle before the leg that made the higher high.
- 'Bullish mirrors exactly: low, high, lower low (sweep), higher high (displacement); the
  breaker is the last up-close candle before the leg that made the lower low.'
- Stop can sit either on the swept extreme or just beyond the breaker itself — he shows both
  (2.3R vs 5R on the same trade).
- 'Bullish breaker: mark the low, the following high, and the lower low.'
- The breaker candle is the one at that structure past which no bodies subsequently close.
- Treat the level as a mitigation zone where opposing positions are squared or offset.
- Entry is on the return into the breaker after price has moved away.
- A body close through the breaker's defining extreme disqualifies it.
- 'Bullish: confirmed swing lows/highs in sequence L1, H1, L2, H2 with L2 < L1 and H2 > H1.'
- Breaker zone (bullish) := the single or series of up-close candles between L1 and H1; rectangle
  from the lowest low to the highest high of those candles (wicks included).
- 'Bearish: H1, L1, H2, L2 with H2 > H1 and L2 < L1; zone := the down-close candles between
  H1 and L1.'
- The pattern does not exist until the fourth point prints (shown explicitly with a candidate
  that never made the lower low).
- 'Distinguish from an order block at the same location: the order block is marked at the
  OPENING PRICE only, the breaker as the full candle range.'
- 'Sequence required: high -> higher low -> higher high -> lower low.'
- 'The breaker is the down-close candle immediately preceding the leg that ran the buy side
  (mirror: the up-close candle before the leg that ran the sell side).'
- It is only a breaker once price has broken below it (above it, for a bullish breaker).
- Entry is the retracement back into that candle.
- 'Host''s reading: a bullish breaker is the sequence low, high, lower low, higher high -
  price closing through and forming the higher high is what makes it a breaker.'
- 'Guest''s reading: the sequence low, high, higher high, lower low, used as the level to
  trade the close through.'
- 'Host''s classification of the guest''s structure: an order block, not a breaker.'
- 'Bullish breaker sequence: a low, then a high, then a LOWER low, then a HIGHER high.'
- Only after the higher high is made is the breaker block formation confirmed.
- Mark the series (or single) up-close candle between the low and the high as the breaker
  block.
- On a return into that area, expect a reaction and continuation higher.
- 'Ash''s definition (bearish setup): the breaker is the lowest down-close candle before the
  leg up that took the liquidity. If there are consecutive same-direction closes, all of them
  are included in the block. Mirror for a bullish setup.'
- 'Rauf''s definition (bullish breaker): a low, then a high, then a LOWER low. The up-close
  candles at that structure are the breaker; project them forward in time.'
- The breaker becomes actionable only once price body-closes through it.
- 'Rauf''s additional requirement: the trade through the breaker must land in an area of fair
  value for the reversal to be trusted.'
- Mark the first low.
- Mark the subsequent high.
- Confirm a lower low forms after that high.
- Confirm a higher high forms after the lower low.
- Take the range from the FIRST low to the high and extend it forward as the block.
invalidation:
- Price closes through the zone in the opposing direction.
- Bodies close beyond the marked level (mean threshold / 0.5 of the wick).
- The higher high or the lower low never forms - the structure is not a breaker.
- The fourth swing point never forming.
- Price trading through the far side of the breaker zone after the retest.
- A candle closes beyond the defending side of the breaker zone (Ben).
- 'Finessee_Fx: the level is traded through and the order flow is no longer respected, at
  which point the bias flips.'
- No displacement through the opposing swing — the four-point sequence never completes.
- Bodies close through the breaker.
- Failure of the fourth swing point to form.
- Price trading through the far side of the breaker zone after the retest (his losing example
  is stopped beyond the zone).
- Price closes back above the breaker candle in the bearish case (below, in the bullish case).
- Not stated for either reading in this unit.
- Price trades through the marked area without reacting.
- Price closes back through the far side of the block.
- Not stated.
measurable:
- hold rate of the breaker zone on first retest
- frequency of the three-point structure that never completes the fourth point
- hit rate of the mean-threshold reaction, split by full-body vs large-wick marking
- frequency of the tap-and-close-out-of-mean-threshold ideal case
- how often bodies (vs wicks) violate the marked level before the move
- frequency of the four-point sequence per instrument and timeframe
- hit rate of a fixed 2R trade on first retest of the zone
- difference between wick-marked and body-marked zones on the same sample
- reaction rate of breakers that ran stops versus those that did not
- how often a breaker is respected more than once (Finessee_Fx shows the same daily breaker
  holding twice)
- outcome difference between breakers created with a new swing extreme and those without (Ben's
  discriminator)
- frequency of the four-point sequence per session
- fill rate of breaker retests before target
- reaction rate on first return into a breaker vs into an order block at the same structure
- frequency of the 4-point sequence per instrument/timeframe
- hit rate of a fixed 2R trade on first retest, split by presence/absence of an overlapping
  FVG (unicorn vs plain)
- R:R difference between the two stop placements over the same sample
- reaction rate at the breaker candle on the retracement, by timeframe
- difference in outcome between a single-candle breaker and a series
- outcome difference between levels drawn under the two sequence definitions
- reaction rate on first retest of a breaker marked by this sequence
- frequency of the full four-point sequence per session on the 5-minute
- hit rate of a return into a breaker producing continuation
- difference in outcome between the single-candle and merged-consecutive-candle definitions
- how often the body close through the breaker coincides with an FVG being left behind
- frequency of the four-point sequence per instrument
- reaction rate when price returns to the extended zone
