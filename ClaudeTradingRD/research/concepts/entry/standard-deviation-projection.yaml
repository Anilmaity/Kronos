ambiguities:
- 'Anchor ambiguity: the video says to project the manipulation leg but anchors ''from our
  high to our low'', which combined with the indicator drawing ''from the bodies'' gives at
  least two possible anchor conventions (wick-to-wick vs body-to-body).'
- '''-2 to -2.5'' is a band, and no rule is given for which edge to use for an order.'
- The relationship between these projections and the previous-candle-extreme targets (A4NasIa371c)
  is never stated - both are called targets and they do not generally coincide.
- He puts the fib settings on screen instead of speaking them, so the exact level list is
  not recoverable from the transcript.
- '''If it makes sense'' is the only gate on the post-4th-deviation retracement expectation.'
- The 2-to-2.5 band has no rule for which edge to use as the order price.
- Sign convention is inconsistent within the video (2/2.5 and 4 spoken as positives, projected
  downwards).
- The anchor is described twice in different words ('the leg that made the low before the
  high', 'the breaker formation as well'); which endpoint the projection is anchored FROM
  (the high or the low) is shown on charts but never stated in words.
- Sign convention flips between examples (-1/-2/-4 for downside, 4/4.5 for upside in hKCMqh0ZsY0);
  the magnitude is what matters.
- Substituting a failure swing for the manipulation leg is done 'in this case', with no rule
  for when.
- No rule orders the -2/-2.5 band against a competing structural target.
- Whether the anchor uses wicks or bodies is answered only for the high side ('the absolute
  High to the swing low'); the low side is not stated.
- The transcript renders his phrase as 'Judas wins for Aviation' (= Judas swing for deviation),
  so the exact wording of the anchor definition is corrupt.
- No rule chooses between the 2 and the 2.5 as the first target.
- 'PROVENANCE: the channel owner states in the same video that HE learned standard deviations
  from AM Trades - so a ttrades-voiced version of this concept elsewhere is downstream of
  this guest.'
- '"Very large" manipulation leg is the switch that demotes the target from -2/-2.5 to -1,
  and it is not quantified in the clip - it is described only as the projections landing "way
  beyond the logical liquidity targets", which is circular.'
- The first Short's transcript is truncated mid-sentence ("I will be using the negative one
  as a"), so the rest of that rule is lost.
- The two cases together imply a "take the nearer of projection and liquidity" rule, but neither
  Short states that generalisation - it is an inference and is recorded here as one.
- No rule is given for how close a projection and a liquidity level must be to count as aligned.
- The arithmetic is never stated in words. From the visuals the bands appear to be multiples
  of the manipulation leg measured from its origin, but whether a '2' means 2x the leg from
  the origin or from the reversal point is not confirmed anywhere in the available transcripts.
- 'The anchor is timeframe-dependent: one example requires dropping to a 30-second chart to
  find ''the low that made the new high'', so the projection is not uniquely determined on
  the trading timeframe.'
- Why the bands are called 'standard deviations' is never explained; no statistical quantity
  is computed.
- No rule decides between the 2-2.5 band and the 4-4.5 band as the primary target other than
  what liquidity sits there.
- The tool is attributed to an external source (Dexter lab's Twitter, linked in the description)
  rather than derived.
- '''Large manipulation leg'' is judged against the available range by eye -- the closest
  he comes to a threshold is one example where the leg is ''almost half'' of the distance
  to the target.'
- It is not stated whether the anchor uses wicks or bodies.
- The level set is offered as personal ('you can always add levels that you find work for
  you'), so it is a default rather than a rule.
- '''Large'' manipulation leg is judged by eye against the day''s expected range - no ratio
  is given in any of the three Shorts.'
- The switch point between the -1 branch and the -2/-2.5 branch is therefore not decidable
  as taught.
- The Fibonacci anchor direction ('anchor to the low, go to that swing high') is stated for
  one example only.
- WHICH deviations are used (-1, -2, -2.5, -4) is not stated in this Short.
- Whether the anchors are wicks or bodies is not stated.
- '''The high that made the low'' assumes an unambiguous origin candle; no tie-break rule
  is given.'
- The leg the projection is measured from is not named in this video.
- Whether 3 exists as a level between 2.5 and 4 is not said; only 2, 2.5 and 4 are spoken.
- He does not use them himself, so no rule ties a projection level to a target choice here.
