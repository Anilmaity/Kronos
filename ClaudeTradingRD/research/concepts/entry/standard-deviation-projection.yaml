id: standard-deviation-projection
name: Standard Deviation Projection Of The Manipulation Leg
variants:
  name:
  - Standard Deviation Projection Of The Manipulation Leg (AM Trades' construction)
  definition:
  - 'The dedicated earlier lesson, credited outright to AM Trades (''my friend am trades showed
    me''). The setup that produces the anchor is stated as a fixed sequence: price runs into
    a higher-timeframe PD array, a short-term high forms, price moves OVER that high and then
    back into the range shifting structure bearish. The leg that took those highs is the manipulation
    leg. Anchor the fib from that leg''s high to its low and project. Targets are the 2 to
    2.5 standard deviation band first, then the fourth, and he prefers a PD array or resting
    liquidity to coincide with the level before he uses it to take profit. One addition not
    carried in the later canon: after the fourth deviation is hit, look for a retracement
    back INTO the range - specifically when price has run through the original consolidation
    and then fails to keep displacing.'
  - 'Targets are produced by projecting the manipulation leg of an AMD sequence. The leg to
    project is defined precisely: the leg that made the low before the high (bearish case)
    — i.e. the swing that terminates the manipulation — measured from the manipulation high
    to that low and extended forward. The first objective is the -2 to -2.5 standard deviation
    band, treated as a retracement/reversal area, then the 4th standard deviation. -1 is also
    used when it coincides with a fair value gap.'
  - 'AM Trades projects standard deviations of the MANIPULATION leg to price the expected
    expansion. The anchor is not the whole swing: he takes the single swing move that drove
    INTO the higher-timeframe PD array that reversed price, from that leg''s absolute extreme
    to the swing point where the change in state of delivery occurred, and projects forward.
    For a weekly-scale projection he anchors on the hourly chart deliberately, because lower
    timeframes add wick noise he is trying to cancel out. The numbers he gives are explicit:
    the 2 and 2.5 deviations are a good first target, and the 4 and 4.5 deviations are ''max
    expansion'' - what should cap the weekly range. Intraday he repeats the same construction
    from the midnight open on a lower timeframe (marking the manipulation that precedes the
    distribution) and takes the level where the intraday and weekly projections overlap as
    the target.'
  - 'Three Shorts state the target-selection half of the tool as a pair of symmetric cases,
    which together amount to: take whichever comes FIRST, the projection or the liquidity.
    The anchor is always the manipulation leg, projected low to high in a bullish scenario.
    Case A - the manipulation leg is very large, so the projections land way beyond the logical
    liquidity targets: use the -1 or the liquidity as the target, because -2 to -2.5 does
    not make sense. Case B - the liquidity sits beyond the projections: take profit at the
    projection points and NOT the liquidity, because a retracement or reversal can occur before
    the liquidity target is reached. The third Short states the ideal: do not use projections
    as random targets, align them with the structure and liquidity on the chart, and the confluence
    (here, -2 and -2.5 landing on failure swings) is what makes the target trustworthy.'
  - 'A target-generation technique: measure the manipulation leg (the move that swept liquidity
    and reversed) and project multiples of it beyond the reversal point, marking the -2 to
    -2.5 and -4 to -4.5 bands as expected destinations for the distribution. It is used across
    the unit for both targets and for anticipating retracement/reversal zones, and its value
    is said to come from coinciding with pre-existing liquidity — the speaker consistently
    checks what rests at those bands before accepting them. Attributed in part to "Dexter
    lab".

    '
  - 'The fully mechanical target tool, and the most numerically specific concept in the unit.
    Set a Fibonacci tool to the levels 1, 0, -1, -2, -2.5, -4 and -4.5. Anchor it inside CANDLE
    2 at the reversal point: from the low (bullish) to the high that made that low -- the
    manipulation leg -- and project. Target selection is governed by the SIZE of that manipulation
    leg: a normal-sized leg targets -2 to -2.5, extending to -4/-4.5 on expansion; a large
    leg targets only -1, because the further deviations are more range than the period can
    plausibly cover. He states he uses projections as CONFLUENCE to existing liquidity targets,
    and alone only where no liquidity rests (e.g. at all-time highs).'
  - 'Three Shorts give the projection workflow and, between them, the size-conditional target
    rule. The anchor is always candle 2 at the reversal: after the change in the state of
    delivery, find the extreme and the swing that made it, mark that manipulation leg, and
    project it with a Fibonacci retracement (the indicator can draw the same levels automatically).
    Where the leg is small relative to the day, -2 to -2.5 is the working target and is checked
    for confluence with a previous day high/low or liquidity to the left, with -4 to -4.5
    as the extension if it trades through. Where the manipulation leg is LARGE relative to
    the available range, the further deviations are more than the period can deliver and -1
    becomes the target instead, kept inside the current daily range.

    '
  - 'SHORTS EVIDENCE giving the anchoring procedure as a two-step recipe. After the reversal
    point is found and a change in the state of delivery has printed, identify the MANIPULATION
    LEG by finding the low first and then finding the HIGH THAT MADE THE LOW. Those two points
    are the Fibonacci anchors, and the projections extended from them are the targets the
    bullish move is expected to reach. The bearish case is the mirror: anchor from the high
    to the low.'
  - In the indicator the projections are an optional overlay, off until enabled. Measured
    from the wicks by default, with a setting to measure from the bodies instead. The levels
    he names while pointing at them on screen are 2, 2.5 and 4. He keeps them off personally
    because they distort the scale of his other drawings.
definition: 'Targets and reaction areas produced by projecting the MANIPULATION LEG with a
  Fibonacci retracement tool. The manipulation leg is the swing that swept liquidity before
  the change in the state of delivery / structure shift - i.e. the leg that made the new high
  before the new low (bearish) or the new low before the new high (bullish). The tool is anchored
  across that leg and projected forward. Stated fib values: 1, 0, -1, -2, -2.5, -4. The -2
  to -2.5 band is where a retracement or reversal is expected; if price displaces and CLOSES
  through that band, -4 (max expansion) becomes the objective; after max expansion, mark discount/premium
  of the leg and expect a retrace to its equilibrium. Inside the indicator the projections
  are drawn from the BODIES of the CISD series rather than the wicks.'
category: entry
status: contested
