preconditions:
- A reversal / smart money reversal has occurred with an identifiable manipulation leg.
- Price has reached a higher-timeframe PD array.
- A short-term high (or low) has been taken and structure has shifted the other way.
- An accumulation-manipulation sequence has completed and distribution is anticipated.
- Price has run into a higher-timeframe PD array and reversed.
- A change in state of delivery has marked the origin of the reversal.
- A manipulation leg has been identified and the fib projected across it.
- A completed manipulation leg with an identifiable origin and extreme.
- A candle 2 closure with a confirmed change in the state of delivery.
- A reversal point has been identified.
- A change in the state of delivery has printed.
- A printed model with a measurable manipulation leg.
detection_rules:
- 'Identify the manipulation leg: the swing that swept liquidity immediately before the CISD.'
- Anchor the fib across that leg (high->low for a bearish projection, low->high for bullish).
- 'Fib settings: 1, 0, -1, -2, -2.5, -4.'
- Treat -2 to -2.5 as the area to expect a retracement or reversal.
- A displacement close through the -2/-2.5 band promotes -4 (max expansion) to the objective.
- After -4 is reached, mark premium/discount of the leg and expect a retrace to its EQ.
- 'Confluence: prefer levels where a projection coincides with a PD array (fair value gap,
  order block mean threshold, equal highs/lows) - resting liquidity just short of -2/-2.5
  is the ''low hanging fruit''.'
- 'Stacked confluence: where one projection''s -4 overlaps another''s -2/-2.5, treat as stronger.'
- The consequent encroachment (midpoint) of the -2/-2.5 band can also be marked.
- In the indicator the projections originate from the bodies of the CISD series; extra values
  can be added manually (e.g. 0.5).
- 'Identify the manipulation leg: the move that took the short-term high (or low) immediately
  before the structure shift back the other way.'
- Anchor the fib across that leg - high to low for a bearish projection, low to high for bullish.
- 'First target band: -2 to -2.5 standard deviations. Second target: the fourth deviation.'
- Only treat a projected level as a take-profit when a PD array or resting liquidity lines
  up with it; he calls that alignment the confluence he is looking for.
- The 1st and 2nd deviations are used as nearer targets on lower-timeframe instances.
- After the fourth deviation, expect a retracement back into the range where price has already
  run through the original consolidation and stops displacing.
- Identify the manipulation (the false move / fake breakout out of the accumulation).
- 'Bearish: find the low that made the manipulation high — the terminal swing of the manipulation
  leg — and measure from that high to that low.'
- Project that measured leg forward from the same anchor to generate -1, -2, -2.5 and -4 (and
  -4.5) levels.
- 'First target: the -2 to -2.5 band, expected to produce a retracement or reversal.'
- 'Second target: the 4th standard deviation, taken only if price respects an order block
  at the -2/-2.5 reaction.'
- When the manipulation leg does not make sense in context (e.g. a weekly profile), substitute
  a failure swing as the anchor.
- Identify the PD array that reversed price and the single swing leg that ran into it.
- Anchor from that leg's absolute extreme to the swing point at which state of delivery changed
  (market structure high to low, or low to high).
- Project 2 / 2.5 deviations - first target.
- Project 4 / 4.5 deviations - max expansion; this is what should cap the weekly range.
- Use the hourly (not lower) for weekly-scale projections so wicks do not distort the anchor.
- Repeat on a lower timeframe from the midnight open for the intraday manipulation, and prefer
  levels where the intraday and weekly projections overlap.
- 'Anchor: mark the manipulation leg, low to high in a bullish scenario.'
- 'Case A - the manipulation leg is very large and the projections land beyond the logical
  liquidity: use the -1, or the liquidity itself, as the target; -2 to -2.5 does not make
  sense.'
- 'Case B - the liquidity sits beyond the projections: take profit at the projection points,
  not the liquidity, because a retracement or reversal can come first.'
- 'Ideal case: the projection coincides with the liquidity (e.g. -2 / -2.5 landing on failure
  swings) - that confluence is what he wants.'
- Do not use projections as standalone random targets.
- 'Breaker context: the manipulation leg is the leg that created the lower low (bullish breaker)
  / higher high (bearish breaker); project it out to the subsequent extreme.'
- 'AMD context: project ''from this low to this high — the low that made the manipulation
  move'' (he drops to a 30-second chart in one example to identify the exact anchor).'
- Mark the 2 to 2.5 and 4 to 4.5 bands (negative sign used for downside targets).
- Accept a band as a target preferentially when existing liquidity (equal lows/highs, old
  highs/lows, a prior-session extreme, a fair value gap) coincides with it.
- Also used as a reversal/retracement zone when price arrives at the 2 to 2.5 band.
- 'Fibonacci levels: 1, 0, -1, -2, -2.5, -4, -4.5.'
- 'Locate the manipulation leg inside candle 2: the low, and the high that made that low (bullish);
  reversed for bearish.'
- Anchor at the low, drag to the high that made it, and project.
- Normal manipulation leg -> primary targets -2 to -2.5; on continued expansion, -4 to -4.5.
- Large manipulation leg (a large share of the available range) -> target -1 only.
- Prefer targets where a projection level coincides with resting liquidity (equal highs/lows,
  previous period extremes, failure swings).
- When the -2/-2.5 sits just BEYOND a liquidity pool, take profit at the liquidity pool instead
  of holding for the projection.
- Anchor in candle 2 at the reversal, after the change in the state of delivery has formed.
- Mark the manipulation leg from the extreme to the swing that made it.
- Project with a Fibonacci retracement (or the indicator's projections setting).
- 'Small leg: target -2 to -2.5, preferring confluence with a previous day extreme or liquidity
  to the left; -4 to -4.5 if it trades through.'
- 'Large leg relative to the available range: target -1 only, and keep the target inside the
  current daily range.'
- Find the reversal extreme (the low, in the bullish case).
- Find the high that MADE that low - the origin of the manipulation leg.
- Anchor a Fibonacci tool on those two points.
- Project targets from that anchor and treat them as the objectives for the move.
- 'Bearish mirror: anchor from the high to the low.'
- Projections are measured from the wicks by default.
- A setting switches the measurement to the bodies.
- The drawn levels are 2, 2.5 and 4.
invalidation:
- Price fails to respect the order block at the -2/-2.5 reaction — the 4th deviation is not
  sought.
- Price reverses before the 2 deviation, or the anchoring reversal fails.
- Price retraces or reverses before the chosen target - the reason Case B exists.
- Not stated.
- Price reverses before the first projection level -- he then re-projects from the new candle
  2.
- Price returns through the anchor extreme before reaching -1.
- Not applicable - a projection overlay.
measurable:
- hit rate of -1, -2/-2.5 and -4 by timeframe
- conditional probability of reaching -4 given a close through -2.5
- whether projection+PD-array confluence outperforms the raw projection
- hit rate of -2/-2.5 vs -4
- hit rate when a PD array coincides vs when it does not
- hit rate of the -2 to -2.5 band and the -4 band per instrument/timeframe
- how often the -2/-2.5 band coincides with an independent PD array
- hit rate of the 2 / 2.5 deviation on confirmed weekly profiles
- how often price exceeds the 4 / 4.5 deviation within the same week
- distribution of week-range vs the projected max expansion
- hit rate of -1 targets on large manipulation legs versus -2/-2.5 targets
- hit rate of projection targets when they sit short of liquidity versus beyond it
- hit rate of the 2-2.5 band and the 4-4.5 band once a manipulation leg is defined
- how often the bands coincide with pre-existing liquidity
- sensitivity of hit rate to the anchor choice (same-timeframe vs lower-timeframe anchor)
- hit rate of -1 / -2 / -2.5 / -4 by manipulation-leg size
- frequency with which a projection level coincides with resting liquidity
- profit given up by taking the pre-projection liquidity target instead
- hit rate of -1 vs -2/-2.5 conditional on manipulation-leg size relative to ADR
- frequency with which -2/-2.5 coincides with a previous day extreme
- hit rate of each projection level from the manipulation-leg anchor
- agreement rate between projection levels and nearby drawn liquidity
- hit rate of the 2, 2.5 and 4 levels per instrument
- difference in hit rate between wick-measured and body-measured projections
