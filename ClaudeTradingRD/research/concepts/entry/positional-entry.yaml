id: positional-entry
name: Positional Entry At An Invalidation On The Open
definition: 'An entry taken at the OPEN of a continuation candle, before its wick has formed,
  when a protected swing already exists from before that open. Its purpose is stated plainly:
  some candle 3s expand immediately from the open and never give an intracandle CISD, so waiting
  always costs those trades. The stop goes on that pre-existing protected swing. The distinctive
  rule is the SELECTION test: the protected swing used must sit BEYOND the equilibrium of
  the previous candle - a protected swing inside the area where the wick is expected to form
  is rejected as a stop, because the wick would take it out. He calls it an advanced concept
  and tells newer traders to skip it.'
variants:
  definition:
  - 'A Short supplies the crisp gate for entering at the higher-timeframe open rather than
    waiting for the wick to form: it is permitted when the invalidation sits very close to
    that opening price. The reasoning given is that if the low is already expected to hold
    BEFORE the new higher-timeframe candle opens - because an inversion is retesting a change
    in the state of delivery into a fair value gap and 0.5 of the level should be respected
    - then the trader can position on the open, with the stop on that low, expecting only
    a very shallow wick to form before price trades away.

    '
  - 'NASDAQ hourly example (9-5 model video): after a candle 2 closure with a V-shape, no
    intra-candle continuation formed, so waiting would have missed the move. The positional
    alternative: expect the EQ to hold and 50% of the change-in-state-of-delivery to hold,
    put the stop below both, usually around the body of the opposing candle, which gave about
    2R to the highs. He accepts that waiting for confirmation sometimes misses trades.

    '
  - 'Defined live as a protected swing existing prior to the open of the new higher-timeframe
    candle. Whether to take it is gated on confidence that the bias is right and that the
    low holds. On this day he declined a positional entry at the 10:00 open: the prior run
    had been deep and left failure swings, so he could not trust the low, and with low confidence
    he would first let the 4-hour candle form whatever wick it was going to form.'
  - 'Restated twice in this unit: when the protected swing forms before the new higher-timeframe
    candle opens, enter around that opening price with the stop on the protected swing (breakouts
    video, last example); in the London model a continuation formed with SMT ''prior to the
    open the new higher time frame candle'' can be taken as a positional entry, or one can
    wait for a new continuation.

    '
  - 'Asia framing of the positional entry: it is only taken with a higher-timeframe bias that
    explains why candle 3 should expand, after an ideal candle 2 closure with a change in
    the state of delivery, and when the protected swing sits near the open of the higher-timeframe
    candle. When the structure is not good enough, no positional entry - wait for a 4-hour
    closure instead.'
  - 'An entry taken not on a lower-timeframe trigger but purely on location: when price opens
    right next to a freshly formed invalidation - a protected swing created by a close over
    a fair value gap - a position can be taken there and carried into the overnight session,
    letting the following day resolve it. The stop sits on the protected low and the target
    is the higher-timeframe draw. In the CAD futures example the sequence is: daily ideal
    candle 2 closure, hourly protected swing, then a second and tighter protected swing, then
    price opens adjacent to that invalidation, and he enters when price is seen to respect
    it. The attraction is stated implicitly - the stop is small because the invalidation is
    close, so the position is already at 2R by the New York session without an intraday entry
    sequence.

    '
category: entry
status: contested
aliases:
- positioning for the expansion
- entering at the open of candle 3
- positional entry
- let this swing into the next day
- into the overnight
preconditions:
- 'A valid model: C2 or C3 closure plus the aligned lower-timeframe CISD.'
- A protected swing formed BEFORE the open of the continuation candle.
- A protected swing formed before the open of a new higher-timeframe candle (here the 10:00
  4-hour open).
- A confirmed higher-timeframe candle 2 closure with a defined draw.
- A recently formed protected swing on the hourly (price into a fair value gap, then a close
  over it).
- Price opening near that protected swing.
detection_rules:
- At the open of the continuation candle, check whether a protected swing already exists from
  before the open.
- 'Selection test: that protected swing must sit beyond the EQ of candle 2 / outside the T-spot
  area where the wick is expected. If it sits inside that area, reject it.'
- Enter at the open; stop on the selected protected swing.
- If risk-to-reward does not work, move the entry (e.g. to a fair value gap) rather than tightening
  the stop inside the wick zone.
- If the entry is missed, the IC-CISD and any later new continuation remain valid entries.
- Before the higher-timeframe candle opens, establish that the low is expected to hold (inversion
  retesting the CISD into a fair value gap, with 0.5 to be respected).
- Measure the distance from the opening price to that invalidation.
- Very close -> enter at the open, stop on the low.
- Expect only a very shallow wick below the entry.
- Use when confident in the move and the IC-CISD has not formed.
- Stop below both the candle EQ and 50% of the CISD, usually around the body of the opposing
  candle.
- Proceed only if that gives about 2R to the target.
- At the new higher-timeframe open, check for a protected swing formed before it.
- Take the positional entry only when confidence in the bias and in that low holding is high.
- If the run into the low was deep and left failure swings, treat the low as untrusted and
  do not position on the open; let the higher-timeframe wick form first.
- If the protected swing forms before the higher-timeframe open, enter around the opening
  price, stop at the protected swing.
- Require HTF bias + ideal C2 closure + CISD + protected swing near the HTF open.
- Reject positional entry on reversal setups or poor structure; fall back to a 4H closure
  + 15m model.
- Identify the most recent, tightest protected swing on the hourly.
- Require price to open near that level rather than extended away from it.
- Require price to respect the level (trade into it and hold) before entering.
- Place the stop on the protected swing and the target at the higher-timeframe draw.
- Hold through the overnight session; reassess at the New York session.
invalidation:
- The protected swing is taken out.
- The low used for the stop is taken out.
- The protected swing is taken out overnight.
measurable:
- share of continuation candles that expand from the open with no IC-CISD (the trades this
  recovers)
- R distribution of positional entries vs IC-CISD entries on the same setups
- stop-out rate of positional entries whose protected swing sat inside vs beyond the EQ
- distribution of open-to-invalidation distances on trades taken this way
- depth of the wick that forms after an at-open entry
- stop-out rate of positional entries whose protected swing followed a deep run with failure
  swings vs a clean sweep
- overnight stop-out rate of positional entries at a protected swing
- R at the New York session open for positions entered this way
- difference in R between positional entries and same-idea intraday entries
