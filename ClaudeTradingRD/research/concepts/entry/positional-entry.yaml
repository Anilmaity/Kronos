ambiguities:
- '''Beyond the EQ'' is stated for the ideal case, but one final example accepts a protected
  swing that ''doesn''t technically cover the EQ'' on the grounds that the area is large enough
  - so the test is a preference, not a hard rule.'
- No guidance on how recently before the open the protected swing must have formed.
- '''Very close to the opening price'' is the whole gate and is not bounded in points, ticks,
  ATR or a fraction of the expected range.'
- '''Very shallow wick'' is likewise unquantified.'
- Which higher-timeframe open is meant is shown on the chart but never named.
- Right near an invalidation is not quantified - no maximum distance from the level is given.
- The actual trigger is the speaker seeing price respect the level, which is not defined as
  a rule (no candle closure or structure requirement is stated).
- No condition is given for when a positional overnight entry is preferable to waiting for
  the session; it is demonstrated once, not taught as a rule.
- Overnight risk (gaps, news) is not discussed at all.
