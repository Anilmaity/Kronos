ambiguities:
- '''Wicks kind of everywhere'' is the stated trigger for switching to bodies; no test for
  messiness is given.'
- The choice between the two stop placements is offered without a rule.
- No bar-count limit between the sweep and the breaker forming.
- Which swing low qualifies as 'a low that can be swept' is not filtered - no separation or
  age requirement is given.
- The SMT substitution names no correlated asset in most examples and gives no divergence
  tolerance.
- The fair-value-gap variant (see intermediate-term-swing-formation) is admitted by the speaker
  not to be a real breaker at all.
- No maximum distance or bar count between the sweep and the higher high is stated.
