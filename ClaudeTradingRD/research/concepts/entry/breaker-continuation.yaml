id: breaker-continuation
name: Breaker Block In A Continuation (not at the reversal)
definition: 'The Shorts version of the breaker continuation, with the market-structure justification
  made explicit. The procedure is: find a swing low, wait for that swing low to be run out,
  let the breaker form, then look for the entry. What that is actually doing, in his own words,
  is taking a short-term low, a sweep of it, and then anticipating another short-term low
  - which is what forms an intermediate-term low. Where the wicks are messy he marks the breaker
  on the bodies. The stop goes either on the low or on the other side of the breaker, and
  the target is the other side of the range.

  '
variants:
  definition:
  - 'The application he actually teaches for breakers: not the reversal breaker everyone trades,
    but a breaker formed inside an already-established trend, used as a continuation entry.
    Once a reversal has produced a low-high-lower-low-higher-high sequence and the trend is
    bullish, you wait for a SWEEP of a low; that gives low, high, lower low, and the breaker
    is created the moment a higher high prints. The swept low is mandatory - ''yes it does
    unless it is paired with smt'' - and SMT against a correlated asset is the only stated
    substitute, in which case the low is treated as protected and the structure traded as
    a breaker without an actual sweep.'
category: entry
status: contested
aliases:
- breaker continuation
- breaker in a continuation
preconditions:
- A directional read already exists (a daily/HTF closure or a completed reversal with a CISD).
- A swing low (bullish case) or swing high (bearish case) exists that can be run.
detection_rules:
- Establish direction on the higher timeframe (range swept low, bullish structure, drawing
  to the range high).
- Find a swing low inside that structure and wait for it to be run out.
- Let the breaker form after the sweep, then look for the entry at the start of it.
- Where wicks are messy, define the breaker on the bodies.
- Stop on the low or on the far side of the breaker; target the other side of the range.
- Establish the trend direction first via the higher timeframe closure and a change in the
  state of delivery.
- Find a swing low (bullish continuation) and wait for it to be swept - this produces low,
  high, lower low.
- The breaker forms only when a higher high then prints.
- Mark the up-close candles of that structure as the breaker zone (bodies if the wicks are
  messy).
- 'Substitute rule: if no low is swept but an SMT against the correlated asset exists at that
  low, treat the low as protected and the structure as a breaker anyway.'
- Mirror everything for a bearish continuation (sweep a high, then a lower low completes it).
invalidation:
- Price trades through the far side of the breaker.
- The higher high (bullish) never printing after the sweep.
- Price trading back through the far side of the breaker zone.
measurable:
- how often the swept short-term low is followed by a higher short-term low (the intermediate-term
  low)
- R outcome of body-defined vs wick-defined breaker zones
- hit rate of 2R continuation entries after a swept-low breaker vs an SMT-substituted one
- how often a higher high follows the sweep within N bars
- frequency of breaker continuations per trending day
