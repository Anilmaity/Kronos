ambiguities:
- '''Respecting the consequent encroachment'' is explicitly left to judgement - he says he
  is pretty flexible with it, which is the opposite of a threshold.'
- Which of the three levels an order should actually be placed at is never stated; the three
  levels are described as things he looks for, not as entries.
- The discount refinement is applied to one example only and no range is specified for measuring
  the discount.
- Whether a wick to a level counts as 'reaching' it, or only a body, is not distinguished.
