ambiguities:
- '''Displacement'' carries no threshold here (as everywhere in the corpus), so the sequence
  is not decidable without an external displacement definition.'
- '''Short-term high'' is used without the advanced-market-structure definition given elsewhere
  in the corpus.'
- The fib is drawn 'from our displacement range' but the anchors (swing-to-swing, or the displacement
  candle's own range) are not stated, nor is the level that divides discount from premium.
- The name points at ICT's 2022 mentorship as the source; the model is named, not derived,
  in this video. Later channel material largely drops this naming.
- Stop placement and targets are not given.
