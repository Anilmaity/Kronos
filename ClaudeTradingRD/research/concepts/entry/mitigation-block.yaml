id: mitigation-block
name: Mitigation Block
definition: 'EARLIER RECORDING (old ''Education - ICT'' playlist). A candle-level, not swing-level,
  definition used purely as a trend-continuation entry. In a bearish trend: an UP-close (green)
  candle prints inside the move; when the LOW of that candle is broken, the candle becomes
  a mitigation block and its HIGH must not subsequently be invalidated. The entry is the retest
  of that high, or of the candle''s opening price; the stop sits just beyond the high. Bullish
  mirrors with a down-close candle whose high is broken. He also pairs it with a fair value
  gap - the CPI trade review enters on a fair value gap that overlaps a mitigation block.'
variants:
  definition:
  - 'An opposing-close candle projected forward in time and used as a re-accumulation (or
    re-distribution) entry inside an ongoing move. In a bullish market maker model these are
    the up-close candles sitting on the sell-side of the curve. Rauf adds the qualifying test
    - the up-close candle must itself have traded into fair value - plus a handling rule for
    consecutive candles and a volume tiebreak.

    '
  - 'A four-point swing sequence identical in shape to a breaker except that NO prior extreme
    is swept. Bullish: low -> high -> higher low -> higher high. Bearish: high -> low -> lower
    high -> lower low. The zone is the down-close candle (bearish) or up-close candle (bullish)
    at the failure swing, dragged forward. The speaker states plainly that he generally does
    NOT trade these, because the unswept failure swings they leave behind are themselves liquidity
    and are what he targets — so price tends to run through the block. He also uses "mitigation"
    more loosely to mean dragging any old order block across the curve for a retest.

    '
  - 'Ben supplies only the discriminator, and is explicit that he does not study or trade
    the pattern itself. A breaker''s move creates a NEW swing extreme - which is precisely
    why the candle is not a failure swing. A mitigation block''s move does not: the same candle
    type, but price fails to make the new high (or low) before returning. He points at two
    candidates on the chart that never recreate a new swing high and labels them mitigation
    blocks, then says he does not use them.

    '
  category:
  - structure
category: entry
status: contested
aliases:
- mitigation block entry
- up close candles on the sell side of the curve
- mitigation
- failure swing block
- mitigation block versus breaker
preconditions:
- An aggressive trend toward an objective is already established (see trend-as-aggressive-move-to-objective).
- The trend is judged too fast to retrace to an OTE, which is why this entry is used at all.
- A directional leg is in progress inside a market maker model.
- Fair value gaps on that leg have been marked.
- Four confirmed swing points in the mitigation order (no sweep of the prior extreme).
- 'For the endorsed variant: an SMT divergence at the corresponding low/high.'
- An opposing-close candle exists before a move that takes liquidity.
detection_rules:
- 'Bearish: find an up-close candle inside the down leg. Wait for a later candle to trade
  below that candle''s LOW.'
- Once its low is broken, the candle is a mitigation block and its HIGH is the invalidation
  level.
- 'Entry option A: limit at the block''s high on the retest.'
- 'Entry option B: limit at the block''s opening price.'
- Level choice follows wick-vs-body-marking-rule - very small body -> use the wicks; clustered
  candles -> use the opening price.
- 'Entry option C: drop to a 15- or 30-second chart and take a fair value gap / model inside
  the block.'
- Stop just beyond the block's high (bearish) or low (bullish).
- 'Bullish mirrors: down-close candle whose HIGH is broken; its LOW must not be invalidated.'
- Identify up-close candles (bullish case) that traded into a fair value gap.
- Where two or more consecutive up-close candles occur, merge them and treat the whole move
  as one block.
- Where two candidates compete, prefer the candle with the larger volume.
- Project the block forward in time and expect price to return into it and continue away.
- 'Sniper''s usage: up-close candles resting on the sell-side of the curve mark accumulation
  / re-accumulation, and PD arrays forming inside them (FVG, SMT) supply the entry.'
- 'Bullish: L1, H1, L2, H2 with L2 > L1 (higher low, i.e. NO sweep) and H2 > H1.'
- 'Bearish: H1, L1, H2, L2 with H2 < H1 (lower high, NO sweep) and L2 < L1.'
- Zone := the down-close candle immediately preceding the failure swing (bearish) or the up-close
  candle (bullish); wick-vs-body marking explicitly left to the user.
- 'Quality filter stated: higher probability when the zone overlaps a fair value gap.'
- 'Trade filter stated: only take it when the correlated instrument DID sweep (SMT), meaning
  the correlated chart has a breaker there.'
- 'Market-maker usage: after a smart money reversal, drag old order blocks from the prior
  side of the curve forward and require a PD array inside the block (FVG, volume imbalance)
  for the reaction.'
- 'Check whether the move originating from the candle created a new swing high (bullish case:
  new swing low).'
- New extreme created -> breaker. No new extreme -> mitigation block.
- Because the breaker's move makes a new extreme, it is by definition not a failure swing;
  the mitigation block's move is.
invalidation:
- Price closes beyond the block's protected extreme (the high in the bearish case).
- Not stated as a price condition for the block itself. Rauf gives only the model-level invalidation
  - a return to 50 percent of the dealing range kills the idea.
- Price closing through and beyond the block; the video shows one failing exactly this way.
- Not stated - he does not trade the pattern.
measurable:
- hit rate of the block-high retest vs the opening-price entry on the same blocks
- how often the protected extreme is invalidated after the low is broken
- R achieved by the LTF-model-inside-the-block variant vs the plain limit
- hit rate of a return into a projected mitigation block producing continuation
- whether the merged-consecutive-candle block outperforms the single-candle block
- how often the higher-volume candidate is the one respected
- hit rate of mitigation blocks WITHOUT an SMT vs WITH one — the video's core claim, directly
  testable
- how often the failure swings above/below a mitigation block are subsequently taken
- relative reaction rate of blocks that did versus did not create a new swing extreme - the
  direct test of whether his discriminator matters
