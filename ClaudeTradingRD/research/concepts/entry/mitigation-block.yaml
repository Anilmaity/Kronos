ambiguities:
- 'EVOLUTION / DIVERGENCE, NOT CONTRADICTION: the library already holds two readings of this
  id - a four-point swing sequence with no sweep, and a guest''s ''up-close candle that traded
  into fair value''. This EARLIER TTrades recording is a third, purely candle-level reading
  with a break-the-low trigger. All three are kept; none supersedes the others on the evidence
  here.'
- '''Aggressive trend'' is the gate for choosing this entry and is never quantified.'
- No rule chooses between the block-high entry and the opening-price entry beyond the wick/body
  test.
- Whether the break of the candle's low must be a close below or a wick below is not stated.
- '''Traded into fair value'' is not pinned down - it is used interchangeably with entering
  a fair value gap and with reaching 50 percent of a leg.'
- The volume tiebreak is eyeballed - no threshold or ratio is given.
- How far forward in time a projected block stays valid is not stated, in contrast with the
  ~60 days stated for old gaps.
- Sniper and Rauf use the term for the same candle type but Sniper gives no qualifying test
  at all.
- Wick vs body marking is explicitly left to the user.
- Whether a close through the block is required before the retest is entry-valid is stated
  only conditionally.
- SMT is the gating filter but is not defined in this video; the dedicated SMT video (27S9gjgcSlI)
  is missing from this unit.
- No stop-loss rule is given for the endorsed SMT variant.
- The term is used in two senses — a specific swing pattern, and generically 'dragging out
  old highs / old order blocks' — without a stated distinction.
- He states the distinction and then declines to use it, so no entry, stop or target rules
  exist for the mitigation block in this unit.
- '''New swing high'' is not qualified by how far beyond the prior high the move must go.'
- Other speakers in the corpus define the mitigation block by whether the candle traded into
  fair value rather than by swing formation; Ben's test is purely structural.
