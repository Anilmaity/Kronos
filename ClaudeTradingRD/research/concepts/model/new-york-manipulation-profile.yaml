ambiguities:
- '''Consolidating'' is never quantified. In one example London did make a high, and he simply
  substituted the current dealing range for the London range.'
- Which range gets manipulated (London's range, the current dealing range, or a prior-day
  range) varies between examples with no selection rule.
- 08:30 'or' 09:30 - no rule for which, and no stated cut-off after which the manipulation
  is considered not to have happened.
- The discount/premium entry preference is hedged as 'normally a discount', not stated as
  a rule.
- Standard deviation projections are used as confluence but their anchor points are not explained
  in this video.
- The timezone of 8:30 / 9:30 is not stated in the Short.
- No rule chooses between 8:30 and 9:30 in advance - both are offered as candidates.
- '''London doesn''t really do a whole lot'' is the trigger condition and is not quantified.'
- The Short does not give the session clock for London or New York; the hours must come from
  elsewhere.
- '"Failing to reach" a PD array has no tolerance - how close is still a failure is not said.'
- It is not stated whether the manipulated range is London's range specifically or the whole
  pre-New-York range; the clip says "this range here" and then "or London's range".
- No entry, stop or target is given in the clip - it is a profile description only.
