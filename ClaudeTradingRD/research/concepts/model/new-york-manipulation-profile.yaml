id: new-york-manipulation-profile
name: New York Manipulation
definition: 'A daily profile in which London produces nothing tradeable - it either consolidates
  outright or fails to reach a higher-timeframe PD array - leaving a London range with a defined
  high and low. The New York a.m. session then sweeps one side of that range (the manipulation),
  changes the state of delivery, and expands the other way for the rest of the day. The speaker
  frames it as a textbook Power of Three: London is accumulation, the New York sweep is manipulation,
  the expansion is distribution.

  '
variants:
  definition:
  - 'SHORTS EVIDENCE giving the timing question and its two candidate answers. With a daily
    bias to reach for the previous day high, London is watched first and does little but consolidate.
    The question then asked verbatim is when the manipulation is likely to occur, and only
    two times are offered: 8:30 or 9:30. The manipulation that does arrive at 8:30 runs HIGHER,
    and he reads that as pointing lower - the manipulation direction is the inverse of the
    intended direction. Execution then drops to the 5-minute: price takes a low, makes a new
    low it cannot displace below, and at the New York open closes over the down-close candle
    - that is the entry, stop on the low, targeting the previous day high.'
  - 'A Short gives the profile its missing one-line entry condition. The daily shape is open-high-low-close
    or open-low-high-close; what makes it the NEW YORK MANIPULATION profile rather than another
    is what London did: London either consolidates or FAILS TO REACH a higher-timeframe PD
    array / key level. New York then manipulates that range - London''s range - has a change
    in the state of delivery, and continues in the daily direction. The bullish and bearish
    cases are stated symmetrically.'
category: model
status: contested
aliases:
- NY manipulation profile
- New York manipulates London's range
preconditions:
- 'A directional daily bias, sourced in the examples from: repeated closes over previous day
  high, a daily fair value gap holding as support, or a close over the consequent encroachment
  of a wick.'
- London (02:00-05:00) consolidated or failed to reach a relevant higher-timeframe PD array,
  i.e. produced no significant high or low for New York to trade off.
- A range with a defined high and low exists (London's range, or the current dealing range
  if London's is unusable).
- A daily bias exists with the previous day high (or low) as the objective.
- London has not delivered the move.
- A daily directional read.
- The London session has completed.
detection_rules:
- London consolidates or fails to reach a higher-timeframe key level.
- At 08:30 or 09:30, price sweeps one side of that range.
- A move at 08:30 in one direction is read as manipulation and biases the trader to the opposite
  direction.
- Price then closes back through the opposing series of candles at the sweep extreme (change
  in the state of delivery); those candles form the order block.
- A first failed CISD attempt is expected to be followed by a new extreme; re-mark the opposing
  series there.
- If London only consolidates, expect the manipulation at 8:30 or 9:30.
- Read the manipulation direction as the INVERSE of the intended direction (a move up leads
  to a look lower).
- Wait for the failure to displace below the new extreme.
- Enter on the close over the opposing candle at the New York open.
- Stop on the low; target the previous day high.
- 'Precondition on London: London either consolidates OR fails to reach a higher-timeframe
  PD array / key level.'
- New York then manipulates that range (London's range).
- Require a change in the state of delivery out of the manipulation.
- Continuation follows in the daily direction, completing an open-low-high-close (bullish)
  or open-high-low-close (bearish) daily candle.
invalidation:
- Not stated explicitly. In the examples a failed close-through is treated as 'not yet', with
  re-marking on the new extreme, rather than as invalidation of the profile.
- London itself reaches the higher-timeframe PD array and reverses - that is a different profile.
measurable:
- frequency of days where London's range is swept between 08:30 and 09:30
- hit rate of previous day high/low as target after the CISD
- difference in fill rate and R between the opening-price entry and the discount/mean-threshold
  entry
- split of manipulation timing between 8:30 and 9:30 on days when London consolidates
- hit rate of the previous day high target from a New York open entry
- share of days on which London fails to reach a HTF PD array
- continuation rate after the New York manipulation plus CISD
