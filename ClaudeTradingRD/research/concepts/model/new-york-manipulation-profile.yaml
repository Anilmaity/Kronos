timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 15m
  - 5m
  fractal: true
execution:
  bias: Opposite the side of the range that New York swept.
  entry: Prefer an entry at a discount (for longs) or premium (for shorts) of the manipulated
    range rather than at the opening price - typically the mean threshold of the order block
    where it overlaps that half of the range. A fair value gap paired with the CISD is also
    given as a valid alternative entry.
  stop: Beyond the manipulation extreme (the swept low/high).
  targets:
  - previous day high/low
  - the opposite side of the range
  - standard deviation projections as confluence (2 to 2.5 landed on previous day high, 4
    to 4.5 on max expansion in one example)
