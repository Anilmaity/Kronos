id: mmxm-phase-sequence
name: MMXM Phase Sequence And The Silver Bullet
variants:
  name:
  - Building The Market Maker Model Narrative (AM Trades' procedure)
  definition:
  - 'A step-by-step procedure for constructing a market maker sell model on the 15-minute
    and executing inside it. Classification comes from the higher-timeframe array price is
    reaching: premium arrays produce sell models, discount arrays produce buy models. Points
    of interest are marked before price arrives - the 15-minute break of structure, a clear
    fair value gap, the day''s high, the London low - and then nothing is done until one is
    tagged: ''wait for the point of interest and then look left''. On arrival, the left-hand
    side must contain the original consolidation / accumulation, with equal lows left behind
    as the draw. A stab above the consolidation highs into the point of interest is the smart
    money reversal; it is a valid short, valid until the swing high is broken, but he calls
    it risky and notes it typically sits outside the kill zone. The lower-risk sequence is
    to wait for distribution: the first fair value gap forms, price trades back up to rebalance
    an intermediate-term high, and the fair value gap that forms at that intermediate-term
    swing point - ''what they call the silver bullet'' - is the entry, with the stop above
    it, partials at the nearest significant low, and the original consolidation as the completion
    target.'
  - 'The fixed phase sequence of a market maker buy model: original consolidation (the range
    high), distribution phase one, distribution phase two, the smart money reversal at the
    lowest low, a low-risk buy which only forms after a short-term breaker, accumulation phase
    one, and accumulation phase two. The second stage of accumulation (or of distribution
    in a sell model), when paired with SMT, is named the silver bullet and is claimed to be
    the highest probability trade available. There are almost always two stages of accumulation
    on the sell side of a buy model, and two on the buy side of a sell model.

    '
definition: '$niper''s market maker sell model read left to right - an original consolidation,
  a push up into a premium array (previous daily high, higher-timeframe fair value gap, or
  buy-side liquidity) which identifies the left half of the chart as the buy side of the curve,
  a smart money reversal where that liquidity is taken, a displacement lower that is the market
  structure break, a retracement into an OTE fair value gap sitting in premium, a break of
  structure below the low of that retracement, and then a SECOND distribution leg which he
  names the silver bullet and calls the highest-probability entry in the whole model. Mirrored
  for the buy model.

  '
category: model
status: contested
aliases:
- market maker sell model
- second distribution leg
- sell model
- buy model
- silver bullet
- original consolidation, distribution, smart money reversal, accumulation
- low risk buy
preconditions:
- An original consolidation is identified.
- The current half of the chart has been classified as buy side or sell side of the curve
  before anything else.
- A higher-timeframe premium or discount array has been identified.
- A named session window is in view (his example uses the 13:30 to 16:00 PM kill zone).
- An MMXM range has been identified and paired with a HTF key level.
- The curve has been split at the lowest low (buy model) or highest high (sell model).
detection_rules:
- Classify the curve side first - this is the first action taken on any MMXM chart.
- 'Require price to push from the original consolidation into a premium array: a previous
  daily high, a higher-timeframe fair value gap, or buy-side liquidity.'
- A smart money reversal is only counted once the liquidity has been taken AND the reaction
  after it has formed; taking a random high does not qualify.
- The first aggressive drop after the sweep is the market structure break / shift.
- Require a retracement into an optimal trade entry fair value gap (or order block) that sits
  above equilibrium of the fib drawn from the high to the low of the retracement leg.
- The break of the low left by that retracement is the break of structure and opens the second
  distribution leg.
- The second distribution leg is the silver bullet and is treated as the confirmation that
  the sell-side lows will be taken.
- Protected highs are marked at the shift and at the break of structure.
- 'Classify by the array reached: premium array -> sell model; discount array -> buy model.'
- Mark the meaningful points of interest first and wait; do no lower-timeframe analysis until
  one is tagged.
- On arrival, look left for the original consolidation and the liquidity (equal lows/highs)
  it left behind.
- The stab through the consolidation extreme into the point of interest is the smart money
  reversal - a valid but risky entry, valid until the swing extreme is broken.
- 'Preferred sequence: wait for distribution - first fair value gap, then a retracement that
  rebalances an intermediate-term high, then take the fair value gap at that intermediate-term
  swing point.'
- Stop above the intermediate-term high (a defended stop); take partials at the nearest significant
  low.
- 'Label in order: original consolidation -> distribution 1 -> distribution 2 -> smart money
  reversal -> low-risk buy -> accumulation 1 -> accumulation 2.'
- The low-risk buy is only valid after a short-term breaker has formed.
- Expect two stages of accumulation on the sell side of a buy model (two distributions on
  the buy side of a sell model).
- The second stage of accumulation/distribution paired with SMT is the silver bullet.
invalidation:
- Not stated as a price. He names protected highs at the shift and at the break of structure
  but gives no level whose violation kills the model.
- The high that the smart money reversal formed off is broken.
- Not stated.
measurable:
- hit rate and R of the second-distribution-leg entry versus the first (post-MSS) entry
- frequency of the full consolidation-to-second-leg sequence per month per instrument
- how often the sell-side objective is reached after the break of structure
- hit rate of the smart-money-reversal entry vs the second-leg entry on the same models
- drawdown from entry to target on the second-leg entry
- frequency of the model presenting per week
- frequency with which exactly two accumulation stages occur
- R and hit rate of the second-stage accumulation entry vs the first
