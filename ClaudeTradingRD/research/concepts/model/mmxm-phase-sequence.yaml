execution:
  bias: Toward the opposite side of the curve (short in the sell model).
  entry: First entry in the OTE fair value gap or order block after the market structure break;
    second entry on the second distribution leg.
  stop: Above the protected high; after the first partial the stop is pulled down to where
    the second entry sits.
  targets:
  - previous daily low
  - session lows
  - relatively equal lows
