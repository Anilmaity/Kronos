ambiguities:
- '''Agree'' is never mechanised - it is whether the dollar''s own PD-array read points the
  opposite way, judged by eye.'
- Neither speaker says on which timeframe the dollar read must agree, and no rule covers a
  dollar that is ranging rather than directional.
- Ben also keeps EURGBP on his layout purely 'as a reference' and never says what it is referenced
  for.
- Applying the dollar veto to NAS and SPY is asserted from the risk-on / risk-off framing
  rather than demonstrated.
- The macro chain (rate differentials to DXY direction) is stated as reasoning, not as a rule
  with a threshold or a data source.
- '''Clean'' is never defined for the dollar beyond ''not in the middle of this range'' and
  ''daily framework is not really there''.'
- He also says he does not use DXY for correlation with the indices, so the gate is forex-only;
  the two statements sit next to each other without reconciliation.
- No list of which crosses count as 'exotics' is given; the worked examples are GBP/JPY, USD/JPY
  and NZD/USD, which are not exotics in the usual sense.
- '''How bullish'' is judged by eye - no measure (ranking metric, slope, ADR) is given.'
- Which timeframe the foreign-currency indices are read on is not stated (the dollar is read
  monthly).
- No rule states how many pairs to carry forward - two survive here by example only.
- The transcript drops a negation - 'if you don't analyze the dollar first it makes it much
  easier to trade' - the intended sense (analyse it first and it becomes easier) is clear
  from the surrounding minutes but the sentence as captioned is inverted.
- The inverse correlation with NASDAQ is asserted as reliable with no conditioning or measurement.
- '''Your USD'' throughout the captions is EURUSD.'
- '''Strong bullish'' vs ''bullish'' is an icon on a slide, never a rule; the ranking of currency
  futures is eyeballed from daily candles.'
- He concedes there is often no single best pair and several are acceptable -- the procedure
  is better at excluding pairs than at selecting one.
