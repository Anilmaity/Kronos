id: dollar-gate-for-fx
name: The Dollar Gate For Forex
variants:
  name:
  - The Dollar Gate For Forex (and when to pair currencies against each other)
  - Analyse The Dollar First, Then Everything Priced In It
  definition:
  - 'His whole forex filter, stated when asked how he scans a watchlist. He looks at the dollar
    first; only if the dollar has a clean framework does he look at any dollar pair. If the
    dollar is consolidating - sitting in the middle of a range with no framework - dollar
    pairs are dropped entirely and he pairs currencies against each other instead, which is
    when he says exotics (his example: yen crosses such as GBP/JPY) may be framed. With a
    clean dollar the direction inverts onto the pairs: a bearish dollar means he is bullish
    the dollar pairs, and the pair chosen is the one whose own candle closure is most opposed
    to the dollar''s.

    '
  - 'SHORTS EVIDENCE giving the selection procedure as a worked ranking. The dollar is read
    first - here a bearish engulfing monthly candle whose lower half is respected, so a continuation
    lower. Given a bearish dollar, the requirement is to find a BULLISH FOREIGN CURRENCY,
    and the candidates are then ranked by how bullish they are: euro is bullish, pound is
    not as bullish as euro, yen is quite bullish, and CAD is avoided because it is also bearish.
    The two that survive - euro and yen - become the pairs to trade the next day (EUR/USD,
    USD/JPY).'
  - 'Rauf''s stated order of operations: analyse DXY before analysing EURUSD or gold, because
    everything priced in dollars is the mirror of it. He works DXY top-down (monthly, then
    weekly, then daily), because the monthly is where large funds are positioned, and derives
    the rest: dollar up means EURUSD down and NASDAQ down; dollar down means NASDAQ up. He
    applies the same read to gold - bullish dollar, so he expects gold lower into his marked
    levels.'
  - 'A decision procedure for choosing WHICH forex pair to trade, driven entirely by whether
    the dollar index is trending. If the dollar is trending, pair the dollar against the opposing
    extreme: dollar bullish -> find the weakest currency future; dollar bearish -> find the
    strongest. If the dollar is CONSOLIDATING, do not pair against the dollar at all -- find
    the strongest and the weakest non-dollar currency futures and trade that cross (''exotic
    pairing''). For futures-only traders the same read collapses to trading the single strongest
    or weakest currency future, or longing one and shorting another.'
definition: 'Both guests gate every trade on the Dollar Index, and Ben states it as an absolute
  veto: if the dollar does not agree with his position he is not interested in it, no matter
  how good the setup looks, and he would rather miss the move. He calls the dollar the barometer
  for everything he does and applies it to equities as well as majors - anything standardised
  against the dollar. His reasoning chain is macro and explicit: the DXY is a derivative of
  a basket of other currencies, so when other central banks raise rates and the differential
  narrows, those currencies strengthen and the dollar should come down, which gives equities
  and crypto room to push higher. Finessee_Fx runs the same gate in the opposite direction
  - the Dollar Index had been bullish all year, so foreign pairs were expected lower and he
  only looked for shorts on them.

  '
category: model
status: contested
aliases:
- dollar as barometer
- risk on risk off
- DXY confirmation
- if the dollar's clean
- frame exotics when dollar is consolidating
- DXY first
- dollar-first order of operations
- DXY gate
- exotic pairing
preconditions:
- The Dollar Index is charted alongside the instrument being traded.
- A dollar index chart (he uses DXY as 'the dollar').
- A directional read on the dollar exists (from a higher-timeframe candle).
- A dollar index chart with a clear draw on liquidity.
- A directional read on the dollar index / dollar futures.
- Currency futures charts for the majors available for ranking.
detection_rules:
- 'Form the analysis on the Dollar Index first: where is it in its own PD arrays, and which
  way is it delivering?'
- Take a long in a dollar-denominated instrument only when the dollar analysis is bearish,
  and a short only when it is bullish; the mirror for the dollar itself.
- 'Ben''s veto: if the dollar analysis disagrees with the instrument''s analysis, do not take
  the trade - wait.'
- Ben applies the gate to indices (SPY, NAS) and crypto as well as to the majors (AUDUSD,
  EURUSD, GBPUSD), because all are standardised against the dollar.
- 'Finessee_Fx''s application: with DXY bullish and heading for an unfilled monthly fair value
  gap, he stayed bullish dollar and bearish foreign pairs until those monthly levels were
  reached.'
- Ben's macro input is the interest-rate differential between the Fed and other central banks,
  not price alone.
- Read the dollar first. If it has a clean daily framework, proceed to dollar pairs; otherwise
  stop.
- Dollar bearish -> favour longs in the dollar pairs; dollar bullish -> favour shorts.
- If the dollar is consolidating (mid-range, no framework), do not frame dollar pairs at all.
- In that case pair currencies against each other - only frame exotics / crosses while the
  dollar is consolidating.
- Among candidates, pick the pair whose own daily candle 2 closure and continuation are cleanest,
  not the one that has already expanded.
- Read the dollar first and establish its direction from the higher-timeframe candle.
- Bearish dollar -> require a BULLISH foreign currency; bullish dollar -> require a bearish
  one.
- Rank the candidate currencies by how strongly they are trending against the dollar.
- Exclude any currency trending the SAME way as the dollar (here CAD, also bearish).
- Exclude the weaker of two same-direction candidates (here pound, less bullish than euro).
- Trade the surviving currencies against the dollar as the next day's pairs.
- 'Start on DXY monthly: identify the draw on liquidity (an unfilled fair value gap, an untaken
  high or low).'
- Confirm on the DXY weekly which side the week is likely to expand toward.
- 'Derive the dollar-denominated instruments by inversion: DXY up -> EURUSD down, NASDAQ down,
  gold down; DXY down -> the mirror.'
- Do not frame EURUSD or gold before the dollar read is done.
- 'Classify the dollar: strong bullish, bullish, consolidating, bearish, strong bearish.'
- 'Dollar bullish -> select the most bearish currency future and trade FOREIGNUSD (result:
  strong bearish trend).'
- 'Dollar bearish -> select the most bullish currency future and trade USDFOREIGN (result:
  strong bearish trend on that pair) or FOREIGNUSD long.'
- Dollar consolidating -> ignore the dollar; select one strongly bullish and one strongly
  bearish foreign currency future and trade the cross between them.
- Anticipate dollar consolidation after a large expansion or after a higher-timeframe key
  level is hit.
- If the dollar is consolidating or retracing, expect euro and pound to be doing the same
  in the opposite direction -- that is what makes them the bearish leg of a cross.
- 'Futures-only: trade the single most extreme currency future opposing the dollar, or long
  one and short another to synthesise the cross.'
invalidation:
- The dollar reaches the higher-timeframe array it was drawn to (Finessee_Fx explicitly held
  the view only until those monthly levels were hit).
- The dollar resolves out of its range, restoring dollar pairs and removing the reason to
  trade crosses.
- DXY has no clear monthly draw - do not derive the others from it.
- Both legs are trending the same way -- the resulting pair consolidates and is a no-trade.
- The strongest currency has just taken out a large target (he skips CHF on exactly that basis).
measurable:
- expectancy of setups taken with and without dollar agreement
- how often the dollar-agreement filter removes a winning trade (the cost of Ben's veto)
- correlation stability of DXY against each traded instrument over the test period
- expectancy of cross trades taken while the dollar is ranging vs trending
- how often the dollar index framework and the pair framework agree
- outcome spread between the top-ranked and second-ranked foreign currency
- share of days where the dollar read and the pair selection agree with the eventual move
- sign agreement between the DXY weekly expansion and EURUSD / NAS / gold over the same week
- hit rate of the derived directional call
- expansion range of the selected pair vs the rejected pairs on the same day
- frequency of dollar-consolidating days (when exotic pairing is required)
