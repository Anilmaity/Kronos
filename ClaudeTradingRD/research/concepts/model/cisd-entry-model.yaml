execution:
  bias: Opposite the swept side.
  entry: CISD level / order block / fair value gap, in the premium (for shorts) of the dealing
    range.
  stop: Beyond the manipulation extreme.
  targets:
  - -2 to -2.5 standard deviations
  - -4 to -4.5 standard deviations
  - prior-session or equal highs/lows at those deviations
  - minimum 2R
