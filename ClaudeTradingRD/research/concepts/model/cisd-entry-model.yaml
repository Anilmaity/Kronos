- video_id: MPeeE55rNOw
  title: ICT Killzones & Indicator Settings
ambiguities:
- The required aggressive move out of and back into the range is qualitative.
- The projection anchor points are demonstrated on charts but never stated verbally as a general
  rule.
- The premium/discount filter is stated for the short example only; whether the mirror (discount
  only for longs) is enforced is not said.
- No rule for how long after the CISD an entry remains valid.
- No session/time filter is stated in this video, although the examples cluster around the
  09:30 and New York opens.
