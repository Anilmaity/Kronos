id: framework-transfer
name: Framework Transfer
definition: 'Importing the fractal-model framework observed on one asset (e.g. NQ/ES) onto
  another asset that does not itself show that structure, and trading the second asset''s
  candles as though they were C2/C3/C4. Used in yud7TpE2AMs to justify treating a 07:00 expansion
  candle on YM as a C2 for a C3/C4 continuation even though it was not structurally C2 on
  YM.

  '
category: model
status: underspecified
aliases:
- transferring the framework
preconditions:
- Two or more correlated assets, one of which shows a clean C2/C3 framework.
detection_rules:
- Identify the asset with the clean framework.
- Map the corresponding candles on the target asset and treat them as C2/C3/C4.
- 'Still require a continuation on the target asset: do not enter on the initial expansion;
  wait for a retracement and a new continuation, which creates a new protected swing.'
invalidation:
- Not stated.
measurable:
- Expectancy of transferred-framework trades vs native-framework trades.
sources:
- video_id: yud7TpE2AMs
  title: New York Open Live Q&A
ambiguities:
- He states he 'also doesn't talk about this really anywhere' - only one worked example exists
  here.
- No condition is given for when transfer is legitimate versus when the asset should simply
  be skipped.
related:
- relative-strength-weakness
- fractal-model-c2
- protected-swing
timeframes:
  htf:
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  fractal: true
execution:
  bias: From the source asset's framework.
  entry: The continuation on the target asset.
  stop: Behind the new protected swing on the target asset.
  targets: The target asset's own objectives.
