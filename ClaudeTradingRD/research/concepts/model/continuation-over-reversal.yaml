ambiguities:
- He concedes continuation entry means a later, worse price in exchange for a higher win rate,
  but gives no numbers.
- The only stated countertrend exception is 'trading the invalidation of my bias', which he
  defers to a future video.
- No count is given for how many failed reversal attempts to tolerate before standing aside.
- The Short does not say whether the continuation entry uses the same stop reference as the
  reversal.
- QIGVXzsVER8 and zgRhc0gxFrs are duplicate uploads of the same Short.
- '''Far easier'' is asserted with no win-rate or expectancy figure attached.'
- The captions render '2R' as 'two hour' throughout this Short; the target is 2R.
- In wM1s7UivQ08 he describes weighing 'trade a reversal here or wait for structure to trade
  a continuation' as a live choice, implying the rule is a strong preference rather than an
  absolute.
- '''New continuation'' after a sweep is not defined beyond requiring new structure.'
- Sourced from an ASR (whisper-small) transcript, not YouTube captions; wording may be imprecise.
- No rule distinguishes a consolidation that should be expected to sweep one side from one
  that will simply break out; both are accepted after the fact.
- How long after the break a continuation remains valid is not stated.
- '''Very strong bias'' is the only gate for taking a reversal and is not quantified.'
- The library entry for this id is already contested across units; this unit supports the
  continuation-preferred reading with an explicit exception rather than an absolute ban.
