id: continuation-over-reversal
name: Continuation-Only Doctrine
variants:
  name:
  - Trade Continuations, Not Reversals
  definition:
  - 'SHORTS EVIDENCE presented as a side-by-side demonstration rather than an assertion. On
    the same downtrending price action he takes two reversal entries - each on a change in
    the state of delivery with a V-shaped reversal - and is stopped out on both. He then keeps
    the same bullish read but declines the retest entry and waits for a CONTINUATION instead:
    price retests into the fair value gap, closes over the series of down-close candles, and
    that produces a propulsion block / continuation order block, which is the entry he actually
    takes. The stated conclusion is that continuations are both better and EASIER to trade
    than reversals.'
  - 'The doctrine compressed into its shortest form: trading continuations is far easier than
    trading reversals. The Short then shows the mechanism that makes it so - the reversal
    (candle 2) is allowed to complete and be confirmed by a change in the state of delivery
    first, and only then is candle 3 traded, with the entry taken on the close of the intracandle
    protected swing and the stop on that protected low.

    '
  - 'A standing selection rule: he only looks to trade continuations, and does not trade the
    reversal itself. The reason given is that reversal entries get stopped out of the move
    they correctly predicted, and continuations are simply easier and cleaner. The practical
    consequences are that he does not trade reversal days, he does not use PSP (which he says
    is a reversal tool), and he lets the reversal print and takes the next day / next leg
    instead.

    '
  - 'Applied here to a case the other Chart Lessons do not cover: a consolidation that resolves
    by breaking out rather than by sweeping one side first. He accepts the break as legitimate
    - "that is fine, we can do that" - and then refuses to trade it, saying he will not trade
    inside the range and will not trade the breakout, but will wait for a continuation entry
    after it. The continuation is then framed with the same phase question he uses everywhere:
    having expanded out of the range, does price expand back in (reversal), retrace (continue),
    or consolidate. Only the retracement branch is traded, and only once the closure that
    confirms it prints. The doctrine is also visible in the negative through the whole walkthrough:
    several legs are narrated as having no way to get on side, and he simply lets them pass.

    '
  - 'Asked directly whether he is more of a reversal or a continuation trader he answers continuation,
    and states the single exception: he will trade a reversal when his bias is very strong,
    which the same session''s gold read did not satisfy. The design of the indicator encodes
    the same preference - the early candle-2 display is off by default because he does not
    want people learning the model to trade candle 2, which he calls more complex, and the
    advancement path he describes is to trade C3 and C4 first and learn to trade C2 only later.'
definition: 'The whole model is expressed as: never enter on the reversal itself, always enter
  on the continuation that follows it. In its simplest form this means waiting for a lower
  high in a bearish sequence and a higher low in a bullish sequence. Reversal patterns are
  used only to define where a continuation may begin. The stated reason is that a reversal
  entry with a stop at the extreme carries no confirmation that price will actually go.

  '
category: model
status: contested
aliases:
- always seeking a continuation
- I don't trade reversals
- continuation preference
- I'd rather be late than early
- I'm going to wait for a continuation entry
- not going to trade the breakout
- get on side
preconditions:
- A reversal (V-shape, C2 closure, or sweep-and-close) has already formed.
- A reversal has already formed and the new direction is established.
- A reversal has already printed and been confirmed, so a continuation is available.
- A move that has already resolved - a consolidation break, an expansion leg, or a confirmed
  reversal.
- A printed model with both a reversal candle and continuation candles.
detection_rules:
- 'Bearish: after the reversal, wait for a lower high to form, then enter the continuation.'
- 'Bullish: after the reversal, wait for a higher low to form, then enter the continuation.'
- The continuation must produce its own closure through a level; without the closure there
  is no setup.
- Do not enter on the reversal CISD itself, and do not enter on its retest.
- Wait for price to retest into the fair value gap left by the reversal.
- Require a close over the series of down-close candles (bullish case).
- That structure is the propulsion block / continuation order block - enter there.
- Being stopped out of reversal entries does not invalidate the directional read.
- Let candle 2 form and require its change in the state of delivery before considering any
  entry.
- Take the trade in candle 3 as a continuation, not in candle 2 as a reversal.
- Inside candle 3, require a sweep of a short-term low and a close over the series of down-close
  candles that swept it.
- Enter on that close, stop on the protected low, target 2R.
- Let the reversal form; take the continuation off it (Monday reversal -> Tuesday continuation
  is the canonical weekly case).
- Do not trade reversal days.
- When a range low is being swept, require a NEW continuation before shorting - entering short
  on the sweep itself is where people get run out.
- 'When unsure, wait: he states the preference as being late rather than early.'
- Do not chase after three days of expansion - that is where a new phase begins.
- Never enter inside a consolidation range and never enter on the break of it.
- 'After the break, classify the next leg: expansion back into the range (reversal), retracement
  (continue), or consolidation.'
- Take only the retracement branch, and only after the closure through the opposing candle
  confirms it.
- If a leg offers no protected swing, there is no way to get on side - let it pass rather
  than improvise an entry.
- The same continuation logic is repeated after every expansion leg, so a single directional
  day supplies several sequential continuation entries.
- Default to the continuation (C3, C4) rather than the reversal (C2).
- Take the reversal only when the bias is very strong.
- For a learner, trade C3 and C4 after a valid model prints; add C2 later.
invalidation:
- The continuation closure never prints - no trade is taken, even if the directional idea
  later proves correct.
- Price expands into the target before a continuation forms - the move is missed and should
  not be chased.
- The protected low created inside candle 3 is taken out.
- The reversal failing to confirm, leaving no continuation to trade.
- Expansion back into the range instead of a retracement - the break was a reversal, stand
  aside.
- The confirming closure does not print.
- Not applicable - a selection preference.
measurable:
- 'Win-rate delta: reversal entry vs continuation entry on the same signal set.'
- Proportion of correct directional ideas that never produce a tradeable continuation.
- win rate of reversal-CISD entries versus continuation entries on the same swings
- number of failed reversal attempts per eventual successful continuation
- win rate of C3 continuation entries vs C2 reversal entries
- share of taken trades that are continuations
- win rate of reversal-day entries vs continuation-day entries
- how often a swept range low produces an immediate continuation vs a stop-out
- expectancy of the breakout entry vs the first continuation entry after it, same instrument
- number of sequential continuation entries offered per trending day
- how often the post-break leg is a reversal rather than a retracement
- win rate and R of C2 entries vs C3/C4 entries on the same models
