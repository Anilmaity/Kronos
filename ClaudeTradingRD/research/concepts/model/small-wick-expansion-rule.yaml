id: small-wick-expansion-rule
name: Small Wick Supports Expansion; Large Wick Waits for Candle 3
variants:
  name:
  - Small Wick Supports Expansion
  - Small Wick Supports Expansion; the C2 He Will Trade Needs One
  definition:
  - 'SHORTS EVIDENCE for the corpus''s central unquantified filter. The most useful single
    line in this unit gives the measurement BASIS explicitly: on a directional candle the
    wick is smaller RELATIVE TO THE BODY. That is a body-relative comparison, stated for a
    candle of any timeframe, not a range-relative or time-relative one. A directional candle
    is otherwise described in time order: price went one direction for the most part of the
    period - open, first extreme, one-way run, second extreme, close. The rest of the unit
    applies the filter exactly as the long-form videos do: a small wick means the candle can
    be traded in its direction; a large wick means it does not support expansion and the trader
    waits.'
  - 'The single most load-bearing filter in the model, and - the key negative finding of this
    unit - it is STILL not quantified in the channel''s own primary teaching series. A candle
    that supports expansion has a small wick and a large body: it opens, forms its opposing
    wick EARLY, and then trends for the rest of the period. A candle that does not support
    expansion has a large wick or a large opposing run: it spends a long time making its opposing
    move and therefore cannot trend, and price tends to return toward its opening price or
    its current extreme. Operationally: small wick -> the reversal candle itself may be traded;
    large wick -> do not trade the reversal candle, wait for the following candle (candle
    3). The nearest thing to a mechanical test offered is indirect: a candle that trades through
    0.5 of the previous candle''s wick ''would form too large of a wick for an expansion candle''.'
  - 'The single filter that decides whether the current candle is tradeable or whether to
    wait for the next one. An EXPANSION candle has a small wick each side and a large body
    -- price trended one way for the period. A REVERSAL candle opens, makes a large opposing
    run to form its wick, then returns toward its opening price before closing. A small wick
    supports expansion because little of the period''s range has been spent; a large opposing
    run does not, because he is not willing to expect price to travel down, back up, and then
    far beyond within one period. Two consequences: (a) trade a small-wick candle 2 directly;
    (b) on a large-wick candle 2, do not trade it -- let it close and trade candle 3.'
  - 'The dedicated teaching video for the filter, and the closest the corpus comes to defining
    ''small''. An expansion candle has a small wick on both sides and a large body; a reversal
    candle has a large wick and a small body. Crucially the size test is TWO-DIMENSIONAL and
    both dimensions are relative to the candle itself: the opposing run must consume only
    a small amount of the candle''s RANGE and only a small amount of its TIME. The stated
    mechanism is that the extreme must form early into the candle so that the remainder of
    the time period is left for price to expand and close near its high or low. A large opposing
    run is described once, on a worked example, as using ''almost half the time and quite
    a bit of range''. No ratio, fraction or percentage is ever given for either axis.'
  - 'Asked whether a 15-minute or 30-minute CISD in London can be traded without the 4-hour
    closure, he gives the gate directly: the 4-hour candle still has to support expansion,
    and that means either a small wick or a reversal already formed. The same filter is applied
    repeatedly in these sessions in both directions — a daily sweep of previous day low with
    a small wick is read as supporting expansion higher, so the mechanical target becomes
    previous day high; a daily candle with a large wick is read as a reversal candle that
    is not expected to expand, so the target is only the opening print or previous day high
    rather than a trend move, and the trade is held to smaller expectations. On the lower
    timeframe the same word is used of the entry candle: a large wick or a "larger opposing
    run" means the reversal is not yet worth trading and he waits for the next candle open
    and a continuation instead.

    '
  - 'Two readings of the expansion filter appear in this unit and they pull in different directions.
    Asked whether an hourly candle that had run five or six candles still counted, he answers
    that expansion candles are objective and the whole test is "did price expand?" - if it
    did, it is an expansion candle. Elsewhere he applies the wick filter instead, refusing
    a gold continuation because the candle does not have a small enough wick to look for upside
    and calling it just a doji candle. So the corpus gives an outcome-based definition (price
    expanded) alongside a shape-based filter (small wick), and neither is quantified.

    '
  - 'A Short titled for the wick-size requirement asks the exact question the library needs
    - ''I need a small wick. What does that look like?'' - and answers it with a PROCEDURE
    rather than a ratio. The small wick is not measured; it is confirmed. Price sweeps the
    low of candle 1, displaces back into the range, and closes over the series of down-closed
    candles; that lower-timeframe change in the state of delivery is what licenses the claim
    that the higher-timeframe wick has finished forming and the low will hold. The entry is
    on that close, the stop on the low, the target 2R. No ratio, percentage or fraction of
    the candle is given anywhere in this unit.

    '
  - 'A candle-2 reversal is only tradeable inside its own candle if the opposing run that
    formed its wick was small. A large opposing run produces a large wick, meaning the candle
    has already consumed range, so expansion within that same candle should not be expected;
    the trader waits for the next candle (candle 3), and for the large-wick candle itself
    expects a move back toward its own open or the liquidity around it rather than expansion.

    '
  - 'Whether a higher timeframe candle can expand in a given direction is read from the size
    of its wick against that direction. A candle closing with a small wick supports expansion
    the way it closed; a candle closing with a large wick does not, and the mechanical expectation
    instead becomes a trade back to that candle''s opening price. He calls the large-wick
    case a weak close.

    '
  - 'Declining a viewer''s reversal idea he states the wick condition on the candle 2 itself:
    when he trades a candle 2, he needs a small wick, and he says he does not trade a reversal
    day with a large wick back to the open - the times he does are very specific. The same
    test is applied to the daily candle as the direction filter: a candle that opens, leaves
    a small wick and expands is what supports expansion in that direction, and it is what
    makes a day worth trading short or long. On the intraday side the corresponding test is
    sequencing - if 09:30 expands you want 09:45 to expand too; a 4-hour candle that closes
    without that shape is called out on air as "not as nice for a continuation".

    '
  - Restated in the Shorts in its compressed form, and - importantly - paired for the first
    time with an explicit size test. Expansion days have a small wick and a large body; a
    candle whose wick is LARGER than its body is classified as a reversal candle instead.
    This gives the long-standing "small wick" gate its first stated comparison operator.
  - 'The top-down video gives the cleanest single-sentence statement of the expansion filter
    in the corpus: if we are going to have an expansion candle, it will have small wicks and
    a larger body. He derives the practical consequence immediately - because the wick is
    small, the tradeable part is the body, so let the wick form and then trade from the extreme
    to the close. It is applied here as the reason for dropping from the weekly to the 4-hour
    when a bearish week is anticipated.'
  category:
  - structure
definition: 'Four Shorts restate the rule in its most compressed form and add three things
  the long-form treatments leave implicit. First, the confirmation package: a small wick is
  not read alone - in the worked example it is stated together with a change in the state
  of delivery and an SMT, and that package is what "supports expansion". Second, the target
  that follows from a small wick inside the fractal model is named: the EQ. Third, an edge
  case is handled - a candle that does NOT support expansion but also has NO wick at all is
  not tradeable as a wick; it is downgraded to drawn liquidity and the trader waits for a
  new candle open. A run of expansion days is characterised as a run of days that all carry
  relatively small wicks.

  '
category: model
status: contested
