preconditions:
- A higher-timeframe candle whose extreme is believed to have formed.
- In the worked example the extreme formed early in the candle, off a previous candle's high
  that was also a failure swing.
- A candle has closed, or is forming, at or from a key level.
- A candle has opened at or from a key level with a directional read.
- The candle in question has opened and has formed a wick against the intended direction.
- A higher-timeframe candle is open or has just closed and its opposing run can be measured.
- A directional bias exists, so the opposing side is defined.
- A higher-timeframe candle is open and its wick can be assessed.
- A completed or nearly-completed candle on the timeframe being graded.
- A higher-timeframe candle has swept the prior candle extreme and reversed.
- A completed higher timeframe candle whose direction is being assessed.
- A closed or closing candle whose direction is being assessed.
- A completed or forming candle on the timeframe carrying the bias.
- A higher-timeframe candle whose direction is already anticipated.
detection_rules:
- A small wick supports expansion in the direction away from the wick.
- 'Read the small wick as part of a package: small wick + change in the state of delivery
  + SMT is what he states as confirming the expansion.'
- Once the wick is confirmed formed, the EQ is the mechanical target for that expansion inside
  the fractal model.
- A run of expansion days is expected to keep printing relatively small wicks; a large wick
  breaks the run.
- 'Edge case: if a candle does not support expansion AND has no wick, do not treat it as a
  wick to trade away from - use it as drawn liquidity and wait for a new candle open.'
- 'Timing constraint stated in the same clip: with little time left in the candle it does
  not make sense for price to consolidate, sweep the high, and then expand - expect the sweep,
  then let the candle close and work from the new candle.'
- Measure the wick against the candle's OWN BODY - this unit states the comparison basis as
  'smaller relative to the body'.
- Directional candle := price moved one direction for the majority of the period; small wick,
  large body.
- Small wick -> the candle supports expansion and may be traded in its direction.
- Large wick -> the candle does not support expansion; wait for the next candle.
- The filter is applied to each timeframe in the stack independently.
- Small wick + large body + wick formed EARLY in the period -> supports expansion; the reversal
  candle may be traded.
- Large wick, or a long-lasting opposing run -> does not support expansion; wait for the next
  candle open and trade candle 3 instead.
- 'Indirect threshold (the only one given): if price trades/closes through 0.5 of the reference
  wick, the resulting wick would be too large for an expansion candle.'
- A candle with NO wick is treated as a level to trade away from rather than an expansion
  candle, and you wait for the new candle open.
- The filter is applied independently at every timeframe layer in the alignment stack.
- Small wick + large body in one direction = expansion candle; the move can continue.
- Large opposing wick + close near the open = reversal candle; expansion in this period is
  not expected.
- 'Small-wick candle 2: tradeable inside candle 2 once the lower timeframe gives a change
  in the state of delivery.'
- 'Large-wick candle 2: wait for the close, then trade candle 3 as the continuation.'
- 'The reason given is range budgeting: in candle 2 and candle 3 price travels roughly the
  same distance, but candle 2 spends half its time going up and half going down while candle
  3 is one-sided.'
- The same test is applied at every layer simultaneously -- daily wick, 4-hour wick and hourly
  wick all being small is what produces a trend.
- opposing_run := from the candle's opening price to the extreme against the intended direction
  (his own definition of the term).
- 'Grade the opposing run on two axes at once: fraction of the candle''s range consumed, and
  fraction of the candle''s time period consumed.'
- 'Expansion candle (small wick): the extreme forms early into the candle, uses little range,
  the body is large, and the candle closes near its high or low.'
- 'Reversal candle (large wick): the run uses most of the candle''s time period and most of
  its range; the body is small; the candle returns toward its opening price.'
- '''Almost half the time and quite a bit of range'' is the one worked description of a large
  opposing run.'
- 'A large-wick candle is not traded for expansion: wait for the next higher-timeframe candle
  open and require a small wick there (candle 3), then trade the expansion.'
- 'Time-remaining check: if too little of the candle''s period remains for the expansion to
  complete, do not take it - he rejects a setup with 40 minutes left in an hourly candle.'
- On a large-wick candle the targets change - see reversal-candle-target-adjustment.
- 'Small wick alone is not sufficient: it must be paired with a lower-timeframe change in
  the state of delivery before the wick counts as confirmed.'
- Before taking a lower-timeframe CISD, require the governing higher-timeframe candle to support
  expansion — either a small wick, or a reversal already formed inside it.
- Small wick on a daily sweep of the previous day extreme → expansion expected; target the
  opposite previous day extreme.
- Large wick → treat the candle as a reversal candle; expect a return toward the opening print
  / previous day extreme rather than a trend expansion, and reduce range expectations.
- A large opposing run on the entry timeframe disqualifies trading that reversal directly
  — wait for the next candle open and take the continuation.
- 'Reading A (outcome-based): if price expanded over the candle, it is an expansion candle
  - no wick condition attached.'
- 'Reading B (shape-based): the candle must have a small enough wick on the side you intend
  to trade away from; a doji-shaped candle is refused.'
- In both readings the classification gates whether the next candle can be traded as a continuation.
- Require the candle 2 sweep of candle 1's extreme followed by displacement back into the
  range.
- On the lower timeframe, require a close over the series of down-closed candles that made
  the low.
- Treat that close as confirmation that the higher-timeframe wick has formed (i.e. that it
  will stay small).
- Enter on the close, stop on the low, target 2R.
- Measure the wick (opposing run) of the reversal candle relative to that candle body and
  to recent candles.
- 'Small wick: expansion is expected within the same candle; look for entries inside it.'
- 'Large wick: do not expect expansion in this candle; expect a move back toward the candle
  open or nearby liquidity, and shift the setup to candle 3.'
- Measure the wick against the intended direction of travel. Small wick = supports expansion
  that way.
- Large wick against the intended direction = does not support expansion; mechanically expect
  a trade back to that candle's opening price.
- For a 4-hour candle to sweep an overhead high, it must close higher with a small wick. A
  large wick argues the high will not be swept.
- On a weak close, mark 0.5 of the wick; the lower half (bearish case) should support price
  lower.
- Do not treat a non-supporting higher timeframe candle as an absolute block - the session
  open can flip it, but the setup is 'harder' and less clean.
- A candle that opens, leaves a small wick on the open side, and expands away supports expansion
  in that direction.
- To trade a candle 2 reversal, require a small wick on that candle 2.
- Do not trade a large-wick reversal day back toward the open (he reserves this for very specific
  cases).
- 'Intraday sequencing: an expansion at 09:30 should be followed by expansion at 09:45; if
  not, the continuation is downgraded.'
- Expansion day / expansion candle := small wick and large body.
- 'Complement, stated in the paired Short: when the wick is larger than the body, the candle
  is a reversal candle, not an expansion candle.'
- On a candle that qualifies as expansion, a London reversal supports anticipating a New York
  continuation.
- An expansion candle has small wicks and a larger body.
- 'Consequence: the tradeable portion is the body; wait for the wick to complete before entering.'
- 'Applied top-down: anticipate the direction on the higher timeframe, then look inside it
  on the supporting timeframe for the wick to form.'
invalidation:
- A large opposing run forms instead of a small wick - switch to the target-adjustment branch
  (see large-wick-target-adjustment).
- Price manipulates the low and comes back into the range rather than failing to manipulate
  it - the expansion read is off.
- Not applicable - this is a classification filter.
- The wick grows beyond 'shallow' before the CISD confirms it -- switch from expansion targets
  to the reduced target set (see large-wick-target-adjustment).
- The candle extends its opposing run, converting a small wick into a large one before the
  close.
- The candle closes with a large wick - the expansion reading is dead and the next candle
  open becomes the reference.
- The higher-timeframe candle prints a large opposing wick after entry — expansion is no longer
  supported.
- Under reading B, an opposing wick large enough to disqualify the candle.
- The low is taken out after the confirming closure.
- Price trades beyond 50% of a large wick, putting the continuation idea in danger.
- Price closing back through 0.5 of the wick.
- The next higher timeframe candle opening and immediately delivering against the read.
- A large opposing wick prints, or the following candle fails to expand.
- The candle prints a wick larger than its body - treat it as a reversal candle and adjust
  targets.
- The candle develops a large wick against the anticipated direction - it is not an expansion
  candle.
measurable:
- expansion rate to EQ following a confirmed small-wick + CISD + SMT package
- how often a candle with no wick at all is later traded from as drawn liquidity, and its
  outcome
- distribution of wick size across consecutive expansion days
- forward expansion distance bucketed by wick-to-BODY ratio (as opposed to wick-to-range)
- win rate of entries inside candles with wick/body < 1 versus >= 1
- forward expansion distance bucketed by wick-to-range ratio - the direct way to recover the
  missing threshold
- win rate of reversal-candle entries bucketed by wick ratio
- how much of the period elapses before the wick extreme prints (the 'early' criterion)
- wick-to-body ratio distribution of candles that did vs did not expand
- 'range travelled in C2 vs C3 (his claim: roughly equal)'
- wick-to-range ratio distribution of candles he calls expansion vs reversal candles
- time-to-extreme as a fraction of the candle period, split by outcome
- close-in-extreme-third rate conditioned on wick-to-range ratio buckets
- range expansion following small-wick versus large-wick higher-timeframe candles
- win rate of lower-timeframe CISDs filtered by the 4-hour support test
- outcome of reversal-day trades that target only the opening print
- follow-through of candles classified as expansion under reading A but failing reading B
- wick-to-range ratio distribution of the candles he calls expansion candles
- realised wick-to-body ratio of candles that passed this confirmation, to derive the missing
  threshold
- hit rate of 2R on entries taken on the confirming close
- expansion rate (close in the extreme third) of small-wick vs large-wick reversal candles
- wick-to-range ratio distribution and its relationship to next-candle expansion
- hit rate of the return-to-opening-price expectation after a large-wick close
- hit rate of 0.5-of-wick holding on weak closes
- wick-to-range ratio distribution of candles that did vs did not expand
- expectancy of C2 entries split by wick-to-range ratio
- expansion continuation rate for wick<body candles versus wick>body candles
- share of days he would call expansion under the wick<body test
- distribution of wick-to-body ratio on candles he labels expansion vs the rest
- forward return of the body given a wick-to-body ratio threshold
