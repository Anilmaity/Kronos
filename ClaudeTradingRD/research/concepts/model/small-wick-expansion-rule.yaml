ambiguities:
- '''Small'' is still unquantified in every one of these four Shorts - see wick-size-test.'
- Whether the CISD and the SMT are REQUIRED alongside the small wick or merely accompanied
  it in this example is not stated. The clip lists them together; it does not say all three
  are necessary. Do not assume the long-form preconditions here.
- '''EQ'' is named as the target without saying EQ of what - the candle, the swing, or the
  daily range. The clip does not specify.'
- '''40 minutes left in the candle'' is the only time reference given for the too-late condition,
  and no general threshold is derived from it.'
- The no-wick edge case gives no rule for how long the candle stays usable as drawn liquidity.
- STILL NO THRESHOLD. 'Smaller relative to the body' fixes the denominator but supplies no
  ratio - wick/body < 1? < 0.5? < 0.33? Never said anywhere in this unit.
