ambiguities:
- No rule says when to stop zooming in - he goes to the 1-minute in one example and stops
  at the 5-minute in another, judged by whether the model looks clean.
- '''Partially mitigated'' sponsorship (his weekly gap was only partly filled) is accepted,
  but no fraction is given at which the sponsorship expires.'
- He acknowledges he could not personally have held the higher-timeframe version of his own
  example, so the R comparison is between a trade he took and one he would not have.
- Nothing prevents the lower-timeframe entry from being stopped out repeatedly while the sponsoring
  idea remains valid; re-entry rules are not given.
