id: internal-external-liquidity-model
name: Internal & External Liquidity Model
definition: 'A complete three-timeframe execution model built on the internal/external rotation.
  Step 1: a higher-timeframe level. Step 2: drop one timeframe and identify internal or external
  liquidity there — the rotation gives the draw. Step 3: on the lower timeframe require, in
  order, that you are in a kill zone, a stop raid, a market structure shift, and a fair value
  gap — then target 2R. He names his preferred ladder as daily / hourly / 5-minute because
  it aligns with the formation of the daily candle, and demonstrates the same model shifted
  up (monthly / daily / hourly and weekly / 4-hour / 15-minute) for people who cannot watch
  intraday.'
variants:
  definition:
  - 'TTrades'' fractal-model variant of the model (contrasts with the library''s kill zone
    / stop raid / MSS / FVG checklist version): HTF C2 closure at internal liquidity gives
    the draw to external; drop to an aligned LTF and wait for a valid fractal model (CISD,
    then a new protected swing formed by reaching into an FVG and closing through). Enter,
    stop on the swing high or on its bodies, take 2R as the LTF target or hold runners to
    the HTF external target. Ladders shown: daily/hourly/5m, daily/4H/15m, weekly/4H/15m,
    15m/1m.'
category: model
status: contested
aliases:
- the internal/external model
preconditions:
- A higher-timeframe level (fair value gap, previous period high/low) is identified.
detection_rules:
- 1. Mark the higher-timeframe level.
- 2. One timeframe down, establish the internal/external rotation and therefore the draw.
- '3. On the execution timeframe require: in a kill zone; a stop raid; a market structure
  shift; a fair value gap.'
- 4. Enter at the fair value gap (start of the gap, or its consequent encroachment, or a premium/discount
  of the displacement range).
- 5. Stop over the opposing candles; if that area is messy, step UP a timeframe to place the
  stop above a clean inversion or balanced area.
- '6. Fixed target: 2R. Runners are optional and he does not count them as the model.'
- 'HTF: C2 closure at an FVG -> draw = external swing.'
- 'Middle TF: confirm with CISD (SMT/PSP optional confluence) and a new swing at its own FVG.'
- 'LTF: new protected swing after CISD; enter (on the open of the new candle in the weekly
  example).'
- Stop on the protected high/low or on the bodies; target 2R or hold to the HTF external target.
invalidation:
- Expansion met with expansion — if the aggressive displacement is met with displacement back
  the other way, he expects continuation instead.
- Trading a retracement against the higher-timeframe bias — he waits for the retracement to
  complete and trades the expansion out of it.
measurable:
- hit rate of the fixed 2R target under the four lower-timeframe conditions
- difference between the tight (FVG-candle) and conservative (timeframe-up) stop
- 2R hit rate vs HTF-target hit rate for the same entries
