ambiguities:
- '''Kill zone'' is required by the model but never defined in this video — London and New
  York are the ones used.'
- The 2R target is fixed by fiat; he acknowledges runners would have paid more in two of the
  four examples but excludes them from the model.
- Whether the market structure shift here means the swing-break test or the CISD test is not
  disambiguated in this video; the narration says 'shift market structure' at points where
  the close is through a swing low.
- No kill-zone or time filter is stated in this version - differs from the library's mwmWNCTEYtY
  version that requires one.
