  title: Q&A Live with Alex's Options - ICT + Strat
  quote: You have to let it change as price tells you more and more information
ambiguities:
- No test distinguishes a legitimate intraday bias update from chasing.
- The threshold for a genuine trend change ('a high way up in here') is eyeballed and unstated.
- Sits against the channel's own daily-bias-first workflow; that is a guest-versus-host difference,
  not a channel inconsistency.
