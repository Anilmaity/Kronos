ambiguities:
- '"Monday, Tuesday, Wednesday all oppose the weekly range" conflicts in wording with the
  library rule that only Monday and Tuesday oppose the bias; read here as Wednesday''s high
  being part of the weekly wick, not as a third opposing close.'
- '"Expansion, retracement into a new expansion" labels the week but the phases are not mapped
  to days.'
- '"candle to closure" is a caption error for "candle 2 closure".'
- This example has Monday expanding WITH the eventual bias, contradicting the library rule
  that Monday and Tuesday both close against it; whether Wednesday's low is still the low
  of the week is not stated in the transcript.
- Two fair value gaps are offered ('here or here') for Wednesday's reaction with no rule to
  choose between them.
- '''Pretty strong closure'' (the Friday gate) remains unquantified.'
- '''Reversal looking candle'' versus ''candle 2 closure'' is acted on as a hard distinction
  but never defined.'
- '''Closes strong'' (the Friday gate) is unquantified.'
- Whether both Monday and Tuesday must oppose the bias, or one is sufficient, is not stated
  categorically; the diagrams show both, and one example collapses Monday and Tuesday into
  a single bank-holiday candle and is still accepted.
- In one example the speaker declines a Thursday entry as 'not super clean' on the lower timeframe
  and prefers to wait; the cleanliness criterion is visual only.
- An SMT off the low is cited as extra confluence at the extreme but no correlated instrument
  is named.
- One example only.
