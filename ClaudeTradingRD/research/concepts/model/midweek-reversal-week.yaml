timeframes:
  htf:
  - 1W
  - 1D
  ltf:
  - 1H
  fractal: true
execution:
  bias: Away from the Wednesday extreme, in the direction of the pre-existing bias.
  entry: 'Thursday, after the hourly change in the state of delivery inside Wednesday. Intraday
    sequencing for a bullish day: price opens, forms its low, then closes over the level.'
  stop: Beyond the confirmed Wednesday extreme / the protected swing carried into the continuation
    day.
  targets:
  - higher-timeframe objective
  - average daily range
  - failure swings above (bullish) or below (bearish)
  - previous daily high / low
