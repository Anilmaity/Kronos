id: midweek-reversal-week
name: Midweek Reversal (weekly profile)
definition: 'Short showing the deferred-confirmation path. Wednesday takes out a small high
  and prints only a "reversal looking candle", not a candle 2 closure. He declines Thursday
  as "not super clean" and lets Thursday''s daily candle close: the candle 3 closure plus
  a CISD confirms Wednesday formed the high of the week, and Friday is traded as the continuation
  lower. He describes the week as expansion, retracement, new expansion, and says Monday,
  Tuesday and Wednesday all oppose the weekly range.

  '
variants:
  definition:
  - 'SHORTS EVIDENCE with a different early-week shape from the library definition. Monday
    expands higher (in the eventual bias direction), Tuesday prints a reversal candle, and
    Wednesday is expected to trade back lower into a fair value gap and form a swing point
    from which to trade higher. Wednesday closes as a candle 2 closure reversed out of a point
    of interest; on the hourly there is a change in the state of delivery inside it, so Thursday
    may be traded bullish. Thursday expands and closes strong, which is read as licensing
    a Friday continuation.

    '
  - 'A week in which Wednesday forms the high or low of the week. Monday and Tuesday both
    trade against the intended bias, and in doing so build the wick of the weekly candle.
    Wednesday then prints a daily candle 2 closure / reversal candle, which must contain an
    hourly change in the state of delivery; that hourly close-through confirms the daily extreme,
    which in turn confirms the weekly wick being traded away from. Thursday and Friday are
    the expansion days - candle 3 and candle 4 of the fractal model - and the speaker will
    also trade Wednesday itself if he wants to trade candle 2. Expansion is run until the
    average daily range is covered or the higher-timeframe objective is met.

    '
  - 'Gold hourly example: Monday and Tuesday expand higher, Wednesday forms a reversal, so
    Thursday and Friday are expected to continue lower; a protected swing at the open of the
    new daily candle is used to position short for 2R.

    '
category: model
status: contested
aliases:
- midweek reversal
- Wednesday low of week
- Wednesday high of week
preconditions:
- A directional bias exists for the week.
- The weekly extreme did not form on Monday or Tuesday (that would be classic expansion).
detection_rules:
- If Wednesday has no candle 2 closure (only a reversal-looking candle), do not trade Thursday;
  wait for the Thursday daily close.
- Thursday candle 3 closure plus CISD confirms Wednesday as the weekly extreme; trade Friday's
  continuation.
- 'Allowed early-week shape: Monday expands in the bias direction, Tuesday forms an opposing
  reversal candle, Wednesday retraces into a fair value gap (point of interest).'
- Wednesday must close as a candle 2 closure out of that point of interest.
- Confirm with an hourly change in the state of delivery inside Wednesday before being bullish
  for Thursday.
- A strong Thursday close licenses a Friday continuation.
- Monday and Tuesday close against the anticipated bias (bullish bias -> both are down days),
  forming the weekly wick.
- Wednesday closes as a daily candle 2 closure / reversal candle.
- An hourly change in the state of delivery exists inside Wednesday's range.
- Thursday (candle 3) is then traded as a continuation.
- Friday (candle 4) is traded only if Thursday closed strong AND a higher-timeframe objective
  is still open.
- 'Fallback: if Wednesday''s closure is not clean, let Thursday close - Thursday''s candle
  3 closure plus the hourly CISD retroactively confirms Wednesday as the extreme, and only
  Friday is then traded.'
- Mon/Tue expansion, Wednesday reversal (daily C2/C3 with CISD) -> look for Thursday/Friday
  continuation in the reversal direction.
invalidation:
- Wednesday produces only a 'reversal looking candle' without a candle 2 closure - not tradeable
  on its own.
- The hourly close-through over the series of candles that made the extreme has not occurred
  - not confirmed, wait.
- Price trades back through the Wednesday extreme.
measurable:
- frequency of weeks whose extreme forms on Wednesday
- hit rate of Thursday continuing after a confirmed Wednesday candle 2 closure
- hit rate of the Friday second continuation, conditioned on a strong Thursday close and an
  open objective
- how often Wednesday's closure is 'unclean' and the setup defers to a Thursday confirmation
