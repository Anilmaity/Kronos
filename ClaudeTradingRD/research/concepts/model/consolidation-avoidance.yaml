id: consolidation-avoidance
name: Consolidation Avoidance
definition: 'Consolidation is treated as a state to be avoided rather than traded. Trading
  a consolidation means fading the breakout back across the range, which he declines in favour
  of expansion and continuation. A specific trap is named: after a consolidation forms, a
  sweep of the range low (or high) is often bought/sold straight back to the other side of
  the range rather than being a breakout.

  '
variants:
  definition:
  - 'Restated live under the name ''range deviation'': when price is consolidating he does
    not expect a breakout, he expects a deviation - price trades outside the range and comes
    back in. On a consolidation day the expectation after a target is hit is a return into
    the range, so the only way to profit is to catch a move and take profit repeatedly rather
    than hold; a trader long off the open who never took profit made nothing. He stays away
    because with no expansion expected there is no risk-to-reward to define.'
category: model
status: contested
aliases:
- don't trade consolidation
- ranging price action
- range deviation
- consolidation day
preconditions:
- A range with a definable high and low has formed.
- Price is inside a defined range (in the example a double inside day, neither previous-day
  extreme taken).
detection_rules:
- Range high and range low can both be marked and price has traded between them without displacing.
- After a sweep of one boundary, ask whether it is being bought/sold back into the range (fade)
  or breaking out; treat the fade as the default expectation.
- A range deviation = price trades outside a range and then closes back inside it.
- While consolidating, default expectation is deviation and return, not breakout.
- After a target at a range extreme is hit on a consolidation day, expect price back inside
  the range.
- Do not hold for expansion on a range day; take profit at each target or stay out.
invalidation:
- Price displaces out of the range and produces a continuation from a new swing.
- Price leaves the range and does not close back inside it (see consolidation-open-whipsaw).
measurable:
- Frequency with which a consolidation-boundary sweep returns to the opposite boundary vs
  breaks out.
- Realised expectancy of setups taken while the daily/4H state is classified as consolidation.
- share of range-boundary breaches that close back inside within N bars
- P&L of hold-to-close vs take-profit-at-range-extreme on inside days
