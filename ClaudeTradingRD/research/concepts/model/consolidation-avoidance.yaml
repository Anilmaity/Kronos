ambiguities:
- No quantitative definition of a range/consolidation is given (bar count, range vs ATR, etc.).
- He notes months of index consolidation as a reason he barely traded - so this is also a
  regime filter, but with no stated measurement.
- '''Range'' is undefined beyond the day''s example (morning open range / previous-day range);
  no width or duration bound.'
- He says range deviation, inducement and AMD are different words for the same thing, so the
  alias set is his, not a distinct concept.
