id: daily-bias-requirement
name: Is A Daily Bias Required Before Entry?
variants:
  name:
  - No Bias Is An Acceptable State - Fall Back To Structure
  definition:
  - 'Asked whether he sits out when his daily bias is uncertain, HolyAngelBruv answers that
    he does not - if the bias is uncertain he simply does not carry one into the session and
    focuses on structure instead: a market structure break with displacement, and setups of
    that kind. His stated justification is that if your bias is wrong you should still be
    fine as long as you are focusing on the model. This coexists with his insistence elsewhere
    in the same stream that you must have higher-timeframe narrative for the 2022-mentorship
    model and that skipping across too many timeframes is the actual cause of seeing valid
    setups in both directions.'
definition: 'A direct doctrinal conflict inside this unit over whether a directional daily
  bias is a precondition for taking a trade. Two speakers build bias first and treat it as
  the foundation of the model; one refuses to use one at all and enters purely from points
  of interest; a fourth replaces bias with a calendar-and-profile day-selection layer.

  '
category: model
status: contested
aliases:
- no daily bias
- bias-free model
- trade without a bias
- focus on the model not the bias
preconditions:
- A model is being designed or evaluated.
detection_rules:
- 'Bias-required position (Ash Trades): bias is taken from the daily via internal versus external
  liquidity, and the hourly areas of interest are then filtered to that direction only. Without
  it there are no areas of interest to search.'
- 'Bias-required position (Sniper): the internal/external read on monthly, weekly, daily and
  4H IS the bias, and the whole timeframe-alignment entry hangs off it.'
- 'Bias-free position (DTR): no daily bias is used. The stated reasons are that there are
  too many mutually inconsistent ways to build one, that he could never commit to a single
  method, and that nothing obliges a model to have one. Entries come from hourly swing points
  reaching a point of interest, in either direction.'
- 'Bias-replaced position (AM Trades): no daily directional bias is described. The selection
  layer is the economic calendar, the daily phase of price delivery and the weekly profile,
  which yield direction only after a manipulation is confirmed on the hourly.'
- If the daily bias is uncertain, do not force one.
- Trade market structure breaks with displacement instead.
- Anchor points of interest on the 15-minute and the hour; do not skip through many timeframes.
- Where a narrative IS available (curve side, weekly fair value gap), use it to exclude one
  direction.
invalidation:
- Not applicable - this is a design conflict, not a setup.
measurable:
- expectancy of the same point-of-interest entries with and without a daily-bias direction
  filter applied
- proportion of winning trades that were counter to the daily bias that would have been assigned
- how often two different published bias methods disagree on the same day - the empirical
  form of DTR's objection
- win rate of no-bias structure trades vs bias-aligned trades
- frequency of conflicting setups when timeframe hopping vs anchored on 15m/1H
