id: ttfm-swing-trading-model
name: TTrades Swing Trading Model (Weekly bias / Daily swing / Hourly entry)
definition: 'Presented as the model for traders with a full-time (9-5) job; he rejects scalping
  for busy traders and says to go to the higher timeframes. Weekly bias = will price reach
  for the previous week''s high or low, or a weekly candle 2 / candle 3 closure (a daily bias
  alone is accepted as a substitute). Then align a daily swing point (daily C2/C3 closure
  with an hourly change in the state of delivery) and execute the daily + hourly fractal model:
  let the daily wick form, enter on an hourly intra-candle CISD (go-to), a swing-point entry,
  or a positional entry. Because the model runs on hourly closures, chart checking is one
  minute at the top of each hour. Target 2R inside the daily range, or hold for the weekly
  range (even over weekends / multiple weeks when aligned).

  '
variants:
  definition:
  - 'His swing method as stated: use the daily chart, then enter on the daily or on the hourly
    aligned with it; he no longer uses standard deviations for targets. For a monthly-based
    swing he uses the monthly and daily model, refining to H4/H1 only for entries. He mostly
    swing-trades while dealing with health issues.'
  - 'Restated live: for a multi-day swing he takes the entry on the hourly chart after reading
    a daily reversal, because the move to the other side of the daily range is unlikely to
    complete in one day. His Friday short held into this low is the example.'
  - A named, complete swing strategy. Step one is always a weekly bias -- will the week reach
    for the previous week's high or the previous week's low -- derived from liquidity, highs/lows,
    fair value gaps and candle closures. Step two is a DAILY candle 2 or candle 3 closure
    to mark the swing point that forms the daily wick, checked for a change in the state of
    delivery. Step three is an hourly entry, held through the following days into the weekly
    draw. He states the whole thing is fractal and offers monthly / weekly / 4-hour as the
    higher-timeframe variant, plus a simplified weekly-direct-to-4-hour route.
  - 'He risks more on swing trades than on intraday setups, and recently favours higher-timeframe
    setups held for days because they suit a busy schedule (live example: NQ short from Friday
    close on the hourly, held through the next day).'
category: model
status: contested
aliases:
- the swing trading model
- weekly daily hourly
- monthly weekly 4H
preconditions:
- A weekly directional expectation (previous week's high or low as the draw).
detection_rules:
- 'Weekly bias: previous week''s high vs low as the draw, or a weekly C2/C3 closure; a daily-chart
  bias is an accepted shortcut.'
- 'Daily: C2 or C3 closure at a relevant level, confirmed by an hourly CISD.'
- 'Hourly: let the daily wick form; enter on an IC-CISD / new protected swing in line with
  the bias; stop on the protected swing.'
- 'Check cadence: inspect the chart only at the top of each hour (one minute per hourly close).'
- 'US-timezone traders: first try to position in the Asia session; if no setup, check again
  at the New York session.'
- 'Targets: 2R within the daily range, or hold for the weekly range.'
- Bias from the daily (or monthly+daily) model; entry on the daily or on an aligned hourly
  model; refine to H4/H1 only for entry.
- Daily candle reads as a reversal toward the other side of the range.
- Enter on the hourly; hold multiple days to the far side of the range.
- 'Weekly: form a bias using liquidity, highs/lows, fair value gaps and candle closures --
  concretely, a weekly candle 2 closure implies expansion in weekly candle 3.'
- 'Daily: require a candle 2 or candle 3 closure that forms the daily wick, plus a change
  in the state of delivery inside it. No daily swing point -> no trade.'
- 'Hourly: enter on a continuation (closure through the series of opposing candles); hold
  through the following days toward the weekly draw.'
- If price retraces beyond the upper half (bullish) of the reference range during the expansion,
  treat it as turning bearish rather than as a deeper entry.
- If the aligned timeframe is messy, move UP one timeframe (hourly -> 4-hour, 30m -> hourly)
  rather than forcing the pairing.
- 'Variant: weekly bias straight to a 4-hour fractal model, with no intermediate daily alignment.'
- Size swing trades larger than intraday trades.
invalidation:
- The daily swing point's protected swing is taken out.
- Price retraces to the fair value gap below the reference range -- at that point it 'might
  as well just take out this low'.
measurable:
- R of daily+hourly fractal model trades when evaluated only on hourly closes
- Asia-session vs New York-session entry hit rates
- weekly directional hit rate after a weekly C2 closure
- holding-period distribution of swing trades
- 'loss rate of second entries after a first winner (his own example: 1 win, 1 loss)'
