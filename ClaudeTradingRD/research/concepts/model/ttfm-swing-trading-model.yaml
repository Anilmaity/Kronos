ambiguities:
- The Asia-first preference is stated for 'US time zones' and qualified with 'this is really
  working on any session'.
- Holding over weekends is offered as optional with no risk rule.
- Examples span BTC, gold, GBPUSD, NASDAQ, DXY/EURUSD; all shown winners except one gold first-protected-swing
  loss.
- The weekly bias is built from four ingredients (liquidity, highs/lows, fair value gaps,
  closures) with no priority or tie-break among them.
- '''A bit messy'' is the trigger for moving up a timeframe and is purely visual.'
- Whether the weekly-to-4-hour shortcut carries the same expectancy as the three-step version
  is not addressed.
- No risk percentages are given.
