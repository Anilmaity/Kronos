ambiguities:
- The labelling is retrospective -- candle 2 is only known to be the swing point once candle
  3 exists, which is exactly why candle 3 closures are needed. This is implied but never said
  outright.
- He says 'candle zero or one 2 3 4' in one breath, so whether the count starts at 0 or 1
  is left open.
- Whether the four-candle window is a hard invalidation (a setup that takes five candles is
  dead) or only a display default is not stated.
