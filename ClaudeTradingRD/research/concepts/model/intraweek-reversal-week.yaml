ambiguities:
- '''RB'' is a caption error; the correlated instrument is unrecoverable from the transcript.'
- Whether the Thursday reversal is tradeable without SMT is not stated.
- '''Already expanded a fair bit'' is not quantified - no range or ADR fraction is given.'
- The Short does not say what happens if the new swing point forms on Thursday instead of
  Wednesday.
- '''Small'' candle 2 closure is not quantified; the distinction between a retracement-only
  C2 and a reversal C2 rests on size alone.'
- The caption '...previous day low to get taken out, which is a new fair value gap' is garbled;
  what the fair value gap refers to cannot be recovered.
- '''how really change in the state of delivery'' is a caption error, read here as ''hourly''.'
- Unlike the library's canonical shape (Monday and Tuesday both expand, Wednesday reverses),
  here Tuesday is the opposing day and Wednesday is the continuation; it is closer to a retracement-continuation
  than to an intraweek reversal of direction.
- What counts as 'expanding away from the weekly open' is not quantified - no ATR, range or
  percentage threshold is given, so the profile's entry condition is not decidable from a
  chart alone.
- Whether a candle 3 closure is fully equivalent to a candle 2 closure as the trigger, or
  only a fallback, is not made explicit.
- For the two-sided candle 2 case the remedy is 'more intraday confirmation' - the amount
  and the timeframe are unspecified.
- '''RB'', the correlated instrument supplying the SMT in the third example, is never expanded
  in the transcript and the chart is not visible; the instrument is deliberately left unidentified
  here rather than guessed.'
- Status is underspecified because the defining condition (Monday's expansion away from the
  weekly open) has no threshold, and the reversal day is explicitly allowed to float across
  weekdays.
