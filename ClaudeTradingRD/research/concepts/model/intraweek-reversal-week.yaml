id: intraweek-reversal-week
name: Intraweek Reversal (weekly profile)
definition: 'SHORTS EVIDENCE with a stand-aside rule attached. Monday expands (continuing
  the previous week''s Thursday reversal), Tuesday also expands, and Wednesday forms the intraweek
  reversal - which then sets up Thursday as a continuation day and, depending on how Thursday
  closes, Friday as another. The operative instruction is what to do with Tuesday: leave it
  alone because it has already expanded a fair bit, and wait for a NEW SWING POINT to form.
  That swing point is Wednesday, and it is what licenses the Thursday and Friday continuations.'
variants:
  definition:
  - 'A week in which the tradeable reversal does not form the high or low of the week. The
    canonical shape given is: Monday expands away from the weekly open - which is itself the
    directional information, telling you which way the weekly candle wants to go - Tuesday
    consolidates, Wednesday forms a reversal, and Thursday and Friday expand. The trigger
    is a daily candle 2 closure (or even a candle 3 closure) printed inside the week after
    price has already moved away from the weekly open, confirmed as always by an hourly change
    in the state of delivery inside that reversal candle. The speaker presents this as the
    profile for weeks that are not picture-perfect: the reversal day can shift to Thursday
    if Wednesday also consolidates, and the point is to wait for a new swing point on the
    daily and then trade away from it.

    '
category: model
status: contested
aliases:
- intraweek reversal
preconditions:
- Monday and Tuesday have both expanded in the same direction.
- Price has already expanded away from the weekly open, so the week's directional intent is
  established.
- The week does not match classic expansion, midweek reversal or Thursday counter.
detection_rules:
- Do not trade the second consecutive expansion day - it has already spent its range.
- Wait for a new swing point to form (typically Wednesday).
- Once that swing point exists, look for Thursday to continue in the reversed direction.
- Judge Friday on how Thursday closes - a continuation closure licenses a Friday continuation.
- Confirm the level with a close below the up-close candles and below the equal lows.
- Monday (or the early week) expands away from the weekly open; that expansion is read as
  the weekly candle's intended direction.
- A subsequent day inside the same week prints a candle 2 closure (or candle 3 closure) that
  reverses, without being the weekly high or low.
- An hourly change in the state of delivery exists inside that reversal candle.
- The following one or two days are traded as continuations in the established direction.
- The reversal day is not fixed to a weekday - if Wednesday consolidates instead, Thursday
  becomes the reversal and Friday the trade.
invalidation:
- The candidate reversal day is an open-high-low-close expansion candle rather than an open-low-high-close
  reversal candle (bullish case).
- The day is simultaneously a bullish and a bearish candle 2 closure and the required additional
  intraday confirmation fails - price does not respect the area.
- Price trades below the protected swing that the continuation was built from.
- On a monthly candle 2 context, 50% of that candle stops being respected.
measurable:
- frequency of the Wednesday-reversal profile per quarter
- hit rate of Thursday and Friday continuations after a Wednesday swing point
- frequency of weeks where the tradeable reversal is not the weekly extreme
- hit rate of the continuation day after a confirmed intraweek reversal
- comparative hit rate of open-low-high-close reversal candles versus open-high-low-close
  candles as candle 2 triggers
- how often the reversal day slips from Wednesday to Thursday
