execution:
  bias: The direction established by the expansion away from the weekly open.
  entry: After the hourly change in the state of delivery inside the reversal day; where the
    daily candle is two-sided, additionally wait intraday for price to open, make its low,
    and form a new continuation before entering.
  stop: Below the protected swing (bullish case) formed at the reversal.
  targets:
  - prior daily highs / lows
  - equal lows or equal highs
  - previous month's low or high
  - the next fair value gap in the direction of travel
