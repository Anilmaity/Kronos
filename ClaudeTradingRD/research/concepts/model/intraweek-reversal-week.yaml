id: intraweek-reversal-week
name: Intraweek Reversal (weekly profile)
definition: 'Short walk-through: Monday expands away, read as the weekly candle wanting to
  go higher, so a candle 4 continuation is traded and it forms but is small after a large
  range - then wait for a new phase. With a bullish bias a candle 2 closure appears, so the
  next day is expected to take the previous day low or reach a fair value gap. It takes the
  previous day low and closes above, and an SMT against a correlated asset (caption ''RB'')
  lets that be treated as a candle 2 closure / swing point. Sequence named: Monday expansion,
  Tuesday-Wednesday consolidation, Thursday treated as candle 2 / reversal, Friday looked
  to for continuation.'
variants:
  definition:
  - 'SHORTS EVIDENCE with a stand-aside rule attached. Monday expands (continuing the previous
    week''s Thursday reversal), Tuesday also expands, and Wednesday forms the intraweek reversal
    - which then sets up Thursday as a continuation day and, depending on how Thursday closes,
    Friday as another. The operative instruction is what to do with Tuesday: leave it alone
    because it has already expanded a fair bit, and wait for a NEW SWING POINT to form. That
    swing point is Wednesday, and it is what licenses the Thursday and Friday continuations.'
  - 'SHORTS EVIDENCE. The prior Friday leaves failure swings on the lows, so he lets Monday
    open rather than act. Monday expands away, which shows price wants to expand out of the
    area or form a reversal. Tuesday prints a SMALL candle 2 closure opposing Monday; that
    is read only as a retracement signal - expect a pullback or the previous day low to be
    taken - not as a reversal of the week. The next day (Wednesday) prints a candle 2 closure
    with an hourly change in the state of delivery and a new continuation; the low it formed
    must not be taken. Price continues higher; he looks for the following day to continue
    too, but warns it may consolidate - and in the example it moves up but comes back into
    the range.

    '
  - 'A week in which the tradeable reversal does not form the high or low of the week. The
    canonical shape given is: Monday expands away from the weekly open - which is itself the
    directional information, telling you which way the weekly candle wants to go - Tuesday
    consolidates, Wednesday forms a reversal, and Thursday and Friday expand. The trigger
    is a daily candle 2 closure (or even a candle 3 closure) printed inside the week after
    price has already moved away from the weekly open, confirmed as always by an hourly change
    in the state of delivery inside that reversal candle. The speaker presents this as the
    profile for weeks that are not picture-perfect: the reversal day can shift to Thursday
    if Wednesday also consolidates, and the point is to wait for a new swing point on the
    daily and then trade away from it.

    '
category: model
status: contested
aliases:
- intraweek reversal
preconditions:
- Monday has expanded away (bullish in the example).
- Monday and Tuesday have both expanded in the same direction.
- Price has already expanded away from the weekly open, so the week's directional intent is
  established.
- The week does not match classic expansion, midweek reversal or Thursday counter.
detection_rules:
- Read the Monday expansion as the weekly candle's direction.
- A small candle 4 after a large range ends that phase; wait for a new phase.
- A day that takes the previous day low and closes above it, with SMT, is treated as candle
  2 / reversal.
- Trade the following day (Friday after a Thursday reversal) as the continuation.
- Do not trade the second consecutive expansion day - it has already spent its range.
- Wait for a new swing point to form (typically Wednesday).
- Once that swing point exists, look for Thursday to continue in the reversed direction.
- Judge Friday on how Thursday closes - a continuation closure licenses a Friday continuation.
- Confirm the level with a close below the up-close candles and below the equal lows.
- 'Failure swings on the prior Friday''s lows: do not pre-empt; let Monday open.'
- A small candle 2 closure opposing the Monday expansion -> expect only a retracement / previous-day-low
  run, not a weekly reversal.
- After that retracement day, require a daily candle 2 closure plus an hourly change in the
  state of delivery and a new continuation before trading in the Monday direction.
- The low formed by that continuation must hold.
- 'The day after the first continuation is lower-quality: may consolidate back into the range.'
- Monday (or the early week) expands away from the weekly open; that expansion is read as
  the weekly candle's intended direction.
- A subsequent day inside the same week prints a candle 2 closure (or candle 3 closure) that
  reverses, without being the weekly high or low.
- An hourly change in the state of delivery exists inside that reversal candle.
- The following one or two days are traded as continuations in the established direction.
- The reversal day is not fixed to a weekday - if Wednesday consolidates instead, Thursday
  becomes the reversal and Friday the trade.
invalidation:
- Not stated in this Short.
- Price takes out the low the continuation was built from.
- The candidate reversal day is an open-high-low-close expansion candle rather than an open-low-high-close
  reversal candle (bullish case).
- The day is simultaneously a bullish and a bearish candle 2 closure and the required additional
  intraday confirmation fails - price does not respect the area.
- Price trades below the protected swing that the continuation was built from.
- On a monthly candle 2 context, 50% of that candle stops being respected.
measurable:
- Friday continuation hit rate after a Thursday PDL-sweep-and-close-above with SMT
- frequency of the Wednesday-reversal profile per quarter
- hit rate of Thursday and Friday continuations after a Wednesday swing point
- frequency of weeks where the tradeable reversal is not the weekly extreme
- hit rate of the continuation day after a confirmed intraweek reversal
- comparative hit rate of open-low-high-close reversal candles versus open-high-low-close
  candles as candle 2 triggers
- how often the reversal day slips from Wednesday to Thursday
