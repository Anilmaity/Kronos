id: secondary-consolidation-breakout
name: Big Consolidation, Break, Small Secondary Consolidation, Then The Run
definition: 'The signature the guest uses to anticipate a day that opens and runs without
  offering a retracement. A large initial consolidation forms; price breaks it with candle
  closes beyond the extreme; a noticeably smaller second consolidation forms; and the expansion
  follows out of that second consolidation. He connects it to a Wyckoff-style re-accumulation
  and to the ICT sequence of a first break of structure, then a second break of structure,
  then the second-leg entry after which price ''just drops off a cliff''. He is candid about
  the hit rate: catching an instant-off-the-open run is ''fifty-fifty'', he takes the breakout
  only when his bias is strong, and does so very rarely; sometimes there is a pullback into
  the second consolidation and sometimes there is not.'
category: model
status: specified
aliases:
- second leg entry
- breakout trade
preconditions:
- A large consolidation range with defined extremes.
detection_rules:
- Mark the initial consolidation range.
- Require a break of that range with candle closes beyond the extreme.
- Require a second, materially smaller consolidation after that break.
- The expansion out of the second consolidation is the trade; the second consolidation is
  the entry area.
invalidation:
- Price closes back inside the initial consolidation range.
measurable:
- follow-through distance after the second consolidation vs after the first break alone
- frequency with which a pullback into the second consolidation is offered
sources:
- video_id: V8P6lNIisvc
  title: Q&A Live with Alex's Options - ICT + Strat
  quote: big initial consolidation, breaks above and closing above those highs
ambiguities:
- '''Really small secondary consolidation'' is never sized relative to the first.'
- Whether a pullback into the second consolidation will be offered is explicitly unpredictable,
  so the entry mechanic is not fixed.
- The guest rates his own capture of this at fifty-fifty and says he very rarely takes it.
