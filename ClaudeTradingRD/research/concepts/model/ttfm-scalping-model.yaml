id: ttfm-scalping-model
name: TTrades Scalping Model (Hourly bias / 15-minute swing / 1-minute entry)
definition: 'A named, complete scalping strategy. The higher-timeframe anchor is still the
  daily, but the operative bias candle is the HOURLY: an hourly candle 2 or candle 3 closure
  lets him anticipate an hourly expansion candle. He then finds the 15-minute swing point
  that forms that hourly candle''s wick, requires a 15-minute candle 2 closure with a change
  in the state of delivery, and finally uses a 15-minute/1-minute fractal model to time the
  entry. The stated object of the whole exercise is to trade the BODY of the hourly candle.'
category: model
status: specified
aliases:
- the scalping model
- hourly 15m 1m
preconditions:
- A daily directional context (e.g. a daily bullish trend, or a consolidation whose side has
  been taken).
detection_rules:
- 'Hourly: a candle 2 or candle 3 closure, ideally with internal liquidity (a fair value gap)
  and external liquidity as the draw -> anticipate an expansion candle to follow.'
- '15-minute: locate the swing point that forms the hourly candle''s wick; require a candle
  2 closure there.'
- '1-minute (or 15m/1m fractal model): require the change in the state of delivery, then take
  a continuation entry -- let the wick form and trade the body.'
- 'A consolidation is treated as a continuation signature: after a consolidation he prefers
  a sweep of the low to go higher over a sweep of the high to go lower.'
- If the entry point of interest is never tagged before price leaves, the trade is skipped
  rather than chased below the lows.
invalidation:
- Price trades beyond the area the model requires be respected before the continuation forms.
- Short-term lows/highs are taken out before entry -- the setup is downgraded and only taken
  if the higher-timeframe target is still open.
measurable:
- trades per day generated by the hourly-C2 gate
- hit rate of 2R on 1m continuation entries inside a 15m C3
sources:
- video_id: eywpZT3z6GQ
  title: TTrades Scalping Model - Simple Day Trading Strategy
  quote: trading the body of the hourly candle using a 15-minute and 1 minute
ambiguities:
- He describes trading the hourly reversal candle itself as an 'advanced' variant and explicitly
  tells most viewers not to focus on it, without giving the extra conditions that would make
  it safe.
- How the daily context is required to interact with the hourly bias (veto? confluence only?)
  is not stated.
related:
- fractal-model-c3
- timeframe-pairing
- continuation-order-block
- consolidation-vs-retracement-test
timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 15m
  - 1m
  fractal: true
execution:
  bias: Hourly candle 2 / candle 3 closure aligned with the daily.
  entry: 1-minute continuation inside the 15-minute candle 3, or a positional entry at the
    open of the new hourly candle when a protected swing already exists before the open.
  stop: The protected swing / low.
  targets:
  - 2R
  - the other side of the consolidation
  - the hourly external liquidity
contributing_units:
- build_a_model_intro_to_ttrades_fractal_model_02
draft_count: 1
