id: ttfm-scalping-model
name: TTrades Scalping Model (Hourly bias / 15-minute swing / 1-minute entry)
definition: 'Reason to drop from his favourite 4H/15m pairing to the 15m/1m: on a reversal
  day he does not expect much expansion, so the 15-minute entry gives poor risk-to-reward.
  He used the 15m/1m fractal model at 10:00, ''let the wick form'' and traded the body, noting
  the 3-minute would not give a setup around the open without waiting for a closure already
  at target.'
variants:
  definition:
  - 'A named, complete scalping strategy. The higher-timeframe anchor is still the daily,
    but the operative bias candle is the HOURLY: an hourly candle 2 or candle 3 closure lets
    him anticipate an hourly expansion candle. He then finds the 15-minute swing point that
    forms that hourly candle''s wick, requires a 15-minute candle 2 closure with a change
    in the state of delivery, and finally uses a 15-minute/1-minute fractal model to time
    the entry. The stated object of the whole exercise is to trade the BODY of the hourly
    candle.'
category: model
status: contested
aliases:
- the scalping model
- hourly 15m 1m
preconditions:
- A daily directional context (e.g. a daily bullish trend, or a consolidation whose side has
  been taken).
detection_rules:
- If the day is a reversal day (low expansion expectation), do not use the 4H/15m entry; refine
  to the 15m/1m.
- If the 3-minute closure would only confirm at the target, refine to the 1-minute.
- 'Hourly: a candle 2 or candle 3 closure, ideally with internal liquidity (a fair value gap)
  and external liquidity as the draw -> anticipate an expansion candle to follow.'
- '15-minute: locate the swing point that forms the hourly candle''s wick; require a candle
  2 closure there.'
- '1-minute (or 15m/1m fractal model): require the change in the state of delivery, then take
  a continuation entry -- let the wick form and trade the body.'
- 'A consolidation is treated as a continuation signature: after a consolidation he prefers
  a sweep of the low to go higher over a sweep of the high to go lower.'
- If the entry point of interest is never tagged before price leaves, the trade is skipped
  rather than chased below the lows.
invalidation:
- Price trades beyond the area the model requires be respected before the continuation forms.
- Short-term lows/highs are taken out before entry -- the setup is downgraded and only taken
  if the higher-timeframe target is still open.
measurable:
- trades per day generated by the hourly-C2 gate
- hit rate of 2R on 1m continuation entries inside a 15m C3
