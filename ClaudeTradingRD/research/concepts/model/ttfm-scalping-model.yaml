  fractal: true
execution:
  bias: Hourly candle 2 / candle 3 closure aligned with the daily.
  entry: 1-minute continuation inside the 15-minute candle 3, or a positional entry at the
    open of the new hourly candle when a protected swing already exists before the open.
  stop: The protected swing / low.
  targets:
  - 2R
  - the other side of the consolidation
  - the hourly external liquidity
