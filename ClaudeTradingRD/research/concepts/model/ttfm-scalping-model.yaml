ambiguities:
- No R threshold is given for 'good risk-to-reward' here.
- He describes trading the hourly reversal candle itself as an 'advanced' variant and explicitly
  tells most viewers not to focus on it, without giving the extra conditions that would make
  it safe.
- How the daily context is required to interact with the hourly bias (veto? confluence only?)
  is not stated.
