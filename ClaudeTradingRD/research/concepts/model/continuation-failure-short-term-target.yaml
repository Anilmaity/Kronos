ambiguities:
- '''Scenario two'' implies a numbered list of scenarios that is not enumerated in these Shorts.'
- '''Short-term high'' is not bounded by a lookback in this unit.'
- '''How strong your bias is'' is offered as the dial controlling aggressiveness and is not
  quantified.'
- '''Short-term high'' is not bounded - he widens it from the adjacent candle to ''an actual
  high'' and to buy-side liquidity without a rule for which highs qualify.'
- How many candles to wait for the second continuation is given as 'another candle or two'
  and 'a couple candles' without a fixed count.
- He allows the aggressive trader to take the first closure anyway ('if you have enough trust'),
  so the rule is a preference layered on a discretionary scale.
- '''Additional confirmation'' is named but never enumerated.'
- The relevant objective (short-term swing vs previous day level) is chosen by eye in each
  example.
