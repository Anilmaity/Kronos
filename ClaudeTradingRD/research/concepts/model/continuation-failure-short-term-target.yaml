id: continuation-failure-short-term-target
name: Short-Term Target Already Taken (continuation invalidator)
definition: 'SHORTS EVIDENCE, restated three separate times in this unit and given a name
  - ''scenario two''. When the closure that forms the continuation ALSO takes out a short-term
  high (bullish) or low (bearish), or a range extreme, the setup is not taken as-is; he waits
  for ANOTHER continuation to form. He states the trade-off explicitly: how aggressive to
  be depends on how strong the bias is, and he personally prefers to wait and see whether
  price makes a swing or takes him out - in the worked example the wait saves the loss. A
  second, independent reason to wait is given: once the short-term high is taken, the protected
  swing is far enough away that the risk-to-reward is no longer good.'
variants:
  definition:
  - 'The second of three named reasons continuations fail, and the one he gives most airtime.
    A structurally clean continuation that fires at the same moment price is taking out a
    short-term high (or low) or a range extreme is not tradeable as-is: that is exactly where
    an opposing change in the state of delivery forms and where the higher-timeframe wick
    is made, so the stop is run. The scope is wider than the adjacent candle - he says he
    means an actual high, and especially buy-side or sell-side liquidity. The remedy is to
    demand a further continuation off that level before entering, and to accept the missed
    move when none comes. A secondary reason to wait is risk-to-reward: entering after the
    short-term high is taken puts the protected swing too far away.'
  - 'A mechanically valid continuation setup whose short-term target has already been reached
    is not tradeable as-is. In that situation additional confirmation is required, or the
    setup is ignored, because the completed objective is exactly where a new phase of price
    can begin. A second, related failure mode: a level that price failed to close through,
    then consolidated around, then finally closed through, is often a liquidity sweep to run
    the other way rather than a continuation.

    '
category: model
status: contested
aliases:
- taking out short-term highs
- reason number two
- why your continuations fail
- short-term targets taken
preconditions:
- A structurally valid continuation (closure through the opposing series at a point of interest)
  has formed.
- A mechanically valid continuation has formed.
- A structurally valid continuation setup exists (C2 closure / CISD in the direction of bias).
detection_rules:
- Check whether the continuation closure simultaneously takes out a short-term high/low or
  a range extreme.
- If yes, do not enter on that closure - wait for a further continuation off the level.
- 'Independent check: if the protected swing is now too far away for acceptable risk-to-reward,
  wait.'
- 'While waiting, watch for the binary: a new continuation (breakout confirmed) or a move
  back across the range (the closure was the manipulation).'
- If price comes back across the range, the level becomes the point of interest for the opposite
  direction.
- Check whether the closure that forms the continuation also takes out a short-term high (bullish
  case) or low, or a range extreme.
- '''Short-term high'' includes any actual prior high, not only the adjacent candle; buy-side
  and sell-side liquidity are the strongest cases.'
- If so, do not enter on that closure. Wait for a further continuation to form off the level.
- If a new continuation forms respecting the fair value gap or opposing candles, trade it.
- If instead price comes back across the range, the level becomes the new point of interest
  for the opposite direction.
- 'Secondary check: if the protected swing is now too far away for acceptable risk-to-reward,
  that alone is a reason to wait.'
- Identify the setup's nearest objective (opposite side of the range, previous day high/low).
- If that objective has already been taken before entry, mark the setup as requiring additional
  confirmation.
- If the closure through the level came only after a failed attempt plus consolidation around
  it, treat the closure as suspect.
invalidation:
- Price comes back across the range aggressively - the continuation reading is dead and the
  opposite side becomes the trade.
- Additional confirmation (a fresh continuation from a new swing) does print - the setup becomes
  tradeable again.
measurable:
- win rate of continuations that also took a short-term extreme versus those that did not
- share of such closures that resolve back across the range instead of continuing
- win rate of continuations that coincide with a short-term liquidity take vs those that do
  not
- share of such setups in which the second continuation does subsequently form
- Expectancy of continuation setups split by whether the nearest objective was already taken.
- Rate at which a post-consolidation closure through a level reverses within N bars.
