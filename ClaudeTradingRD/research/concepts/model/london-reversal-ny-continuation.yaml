ambiguities:
- The London session boundaries are never given in clock time in this unit.
- He says 'daily C3 / C4' without saying whether C4 is as good as C3 or a fallback.
- The 5-minute is allowed for the continuation but he prefers the 15-minute pre-open because
  the 5-minute chops.
- London's session boundaries are never defined in this transcript.
- '''2R would be there'' and ''previous day high'' are both quoted as targets on the same
  example; precedence is unstated.'
- He refers to a free blog article ('TTrades favourite fractal model') as the canonical write-up;
  not read here.
