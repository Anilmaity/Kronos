id: london-reversal-ny-continuation
name: 'A+ Setup: Daily C3 + London Reversal + New York Continuation'
definition: 'Asked nothing in particular, he volunteers it as his favourite setup and writes
  it out: daily candle 3 or candle 4, a London reversal, and a 15-minute continuation entry
  taken prior to the NYSE open. The whole of the following stream is a worked example of it
  plus a full review. The logic he gives for why the 09:30 open then drives price rather than
  manipulating it is the part that is new here: if London has already reversed, the day''s
  manipulation has happened inside the daily range, so the New York open has nothing left
  to manipulate and is expected to deliver volatility in the direction of the continuation.
  The expansion window that follows is 06:00 to 10:00 a.m., and he wants to be positioned
  inside it before the open rather than entering after the move.

  '
variants:
  definition:
  - 'His single highest-conviction setup, described as the one he would trade if restricted
    to one forever. Structure: the daily chart is in candle 3 (the day after a daily C2 closure);
    within that day, the London session forms the low (bullish) or high (bearish) of day -
    the reversal; New York then continues in the daily direction, entered on a 15-minute chart.
    The claimed edge is that it stacks a continuation inside a continuation: the intraday
    continuation of the London reversal is itself a continuation of the daily move.

    '
category: model
status: contested
aliases:
- my favorite entries
- London reversal New York continuation
- favourite fractal model
- A+ setup
preconditions:
- Daily candle is a candle 3 or candle 4 - a continuation day.
- London has produced a reversal, confirmed by a CISD and / or a 4-hour candle 2 closure.
- A daily C2 closure printed on the previous day, so today is daily C3.
- London has produced the reversal (the day's extreme against the daily direction).
detection_rules:
- Confirm the daily as a continuation day (C3 / C4) with a prior daily candle 2 closure whose
  hourly CISD and SMT are present.
- Confirm the London reversal on the session-appropriate timeframe (1-hour / 30-minute CISD,
  or a 4-hour candle 2 closure).
- Because the manipulation is already inside the daily range, expect 09:30 to drive price
  in the continuation direction, not to manipulate.
- Take the 15-minute continuation entry before the NYSE open; do not enter after the open
  drive, which destroys the risk-to-reward.
- Expansion is expected across the 06:00-10:00 window.
- 'In simple structural terms the sequence reads: a high, a lower high, a lower low (mirrored
  for bullish).'
- 'Confirm daily C3: yesterday swept the prior day''s extreme and closed back inside, in the
  direction of today''s bias.'
- 'Confirm a London reversal: price opens, makes its extreme during London, and turns.'
- Confirm a continuation closure on the 15-minute chart in the New York session.
- A protected swing must form, confirming the wick.
- Point of interest is NOT required here because this is a continuation (see point-of-interest).
invalidation:
- No invalidation level exists for the pre-open entry (no SMT / no trustworthy opposing candle),
  in which case the setup is an idea only.
- The London reversal extreme is taken back out.
- No daily C2 closure the prior day - the day is not C3.
- London does not produce the reversal / the day's extreme forms later.
- The 15-minute continuation closure does not print.
measurable:
- frequency of C3/C4 daily + London reversal co-occurrence
- expectancy of pre-09:30 entries vs post-09:30 entries on those days
- share of the day's range delivered between 09:30 and 10:00 on these days
- Frequency of days meeting all three conditions.
- Hit rate to previous day high/low and to 2R.
- Fraction of the day's range captured from the 15m entry.
