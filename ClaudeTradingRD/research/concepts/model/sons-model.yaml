ambiguities:
- He attributes the mechanical rules to ICT ('according to ICT we want to wait for that down
  close candle') and then states he personally does NOT wait for the 5-minute close, instead
  going straight to the lower timeframe for a box setup or displacement entry. Two incompatible
  entry triggers are taught in the same video.
- The 12-handle stop is NQ-specific and no equivalent is given for other instruments.
- '''First fair value gap'' is what the examples do, but he also takes second and third gaps
  when the first misses — no cap is stated.'
- In the higher-timeframe variant (AdmnWLjf8rY) he explicitly drops the close-back-in candle
  requirement for the 5-minute-entry ladder ('I'm going to do how I trade it and not waiting
  for this candle closed back in').
