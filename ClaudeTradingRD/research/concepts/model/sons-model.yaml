id: sons-model
name: Son's Model (draw, stop raid, lower-timeframe fair value gap)
definition: 'A three-component mechanical model: a draw on liquidity, a stop raid in the OPPOSITE
  direction of that draw, and a fair value gap entry two timeframes down. The base version:
  draw = an old high or low on the 1-hour, or the 15-minute if the hour has none; stop raid
  on the 5-minute (a swing high taken when the draw is below, a swing low taken when the draw
  is above) followed by a candle closing back into the range in the trade direction; then
  drop to the 30-second chart and enter the first fair value gap. On NQ the stop is 12 handles
  or less and the target is a fixed 1:1.'
category: model
status: specified
aliases:
- Cameron's model
- ICT Son's model
- 30 second setup
preconditions:
- A draw on liquidity exists on the 1-hour or 15-minute chart (old high, old low, or an imbalance).
detection_rules:
- '1. Identify the draw on liquidity: an old high or old low on the 1-hour; if none, use the
  15-minute.'
- 2. On the 5-minute, require a stop raid in the OPPOSITE direction of the draw (draw above
  -> a swing low is taken; draw below -> a swing high is taken).
- '3. Wait for the 5-minute candle to close back into the range: an up-close candle for a
  long, a down-close candle for a short.'
- 4. Drop to the 30-second chart and enter the first fair value gap in the direction of the
  draw.
- '5. Stop: 12 handles / points or less on NQ — smaller if the swing extreme is nearer (he
  used 10 when 12 would have overshot the high).'
- '6. Target: fixed 1:1.'
- 'Higher-timeframe ladder (same model, shifted): 4H or 1H draw -> 15-minute stop raid + candle
  close -> 1-minute FVG entry; daily or 4H draw -> 1-hour stop raid -> 5-minute entry model.'
invalidation:
- No 30-second fair value gap forms after the 5-minute close — no entry.
measurable:
- hit rate of the fixed 1:1 version vs the structural-target variant on the same signals
- how often the first 30-second FVG fills before the target
- frequency of entries missed by waiting for the 5-minute close
