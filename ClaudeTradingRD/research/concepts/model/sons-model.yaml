  entry: First 30-second fair value gap after the 5-minute close-back-in candle.
  stop: 12 points or less on NQ, above/below the raided extreme.
  targets:
  - Fixed 1:1 (the mechanical version)
  - 'Structural: a prior low / fair value gap / OTE — his personal variant, shown as 1.83R,
    2R+ and 4.22R on the same three setups'
