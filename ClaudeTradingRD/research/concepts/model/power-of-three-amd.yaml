ambiguities:
- '''Generally I like to see'' for the session sequence — it is an expectation, not a filter.'
- The accumulation range boundary (bodies vs wicks) follows the box-setup habit rather than
  a stated AMD rule.
- No rule for how long an accumulation must last to count.
- '''Wednesday morning'' is not given a clock time.'
- The transcript renders 'the low' as 'the slow'.
- He immediately shows a week that 'wasn't great' against the template, so the tendency is
  presented as a tendency, not a rule.
- How the directional expectation for the week is formed is assumed, not given here.
- '''Consolidate around here'' for the accumulation phase has no width or duration bound.'
- The opening-price anchor here is the MIDNIGHT open (see daily-open-eighteen-hundred), which
  the later canon replaces with 18:00.
- Whether the manipulation must close beyond the opening price or merely trade beyond it is
  not stated.
- '''Aggressive'' move out and back is never quantified — no candle count, range or ATR criterion.'
- No minimum duration or maximum width for the accumulation range.
- No time limit on how long a manipulation may last before it stops being a wick.
- The daily-candle mapping assumes a specific day boundary (midnight New York is used in the
  examples) but this is not stated as a rule.
- The dedicated OHLC/OLHC video (sIcsLFSNoXM) is missing from this unit.
- The large/small opposing-run branch is the whole decision and is never given a threshold.
- '''Early into the higher time frame candle'' is offered as when a shallow opposing run should
  appear, with no minute count.'
- Nothing quantifies 'close near the low' - the sketch is drawn freehand on the chart.
- The Tuesday order block that is supposed to cap the week is pointed at on screen, not defined.
- No rule is given for what to do if Monday, rather than Tuesday, makes the high.
- The forward plan given in the video was for the week of 22 August 2022 and its outcome is
  never reviewed.
