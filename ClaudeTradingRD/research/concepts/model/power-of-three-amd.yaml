id: power-of-three-amd
name: Power Of Three (Accumulation, Manipulation, Distribution)
variants:
  name:
  - Power Of Three On The Weekly Candle (manipulation low on Monday, Tuesday or Wednesday
    morning)
  definition:
  - 'TTrades walks the weekly power of three on screen. For a bullish week the sequence is:
    the weekly open, then a move DOWN which is the manipulation, then range expansion up (distribution),
    then a close near the highs. The timing claim is the operative part - the low of a bullish
    week should be put in on Monday, Tuesday or Wednesday MORNING, and he says Tuesday is
    usually a good idea. He then tells the audience to backtest it themselves by going back
    and looking at what every Tuesday did during a given move, and shows a week that fits
    and one that does not.'
  - 'Two earlier statements that anchor AMD to objects the later canon states less directly.
    (a) CANDLE-LEVEL AMD, anchored on the OPENING PRICE: the consolidation around the opening
    price is accumulation; the excursion beyond the opening price is manipulation; the move
    to the far extreme and the close is distribution. That makes the opening price - not an
    arbitrary consolidation box - the reference the three phases are measured against. (b)
    RANGE-LEVEL AMD via failure to displace: fail one side of the range and you should expect
    the other side to be sought; he equates that directly with the broadening formation and
    with power of three (consolidation, manipulation, then distribution).'
  - 'The three-phase anatomy of a higher timeframe candle. Accumulation is a range or consolidation,
    which by existing creates buy stops above its high and sell stops below its low. Manipulation
    is a false breakout outside that range, which stops out positions taken inside it and
    induces breakout traders the wrong way. Distribution is the expansion in the opposite
    direction. On the higher timeframe candle, the manipulation forms the wick and the distribution
    forms the body, producing an open-high-low-close or open-low-high-close shape. The speaker
    gates the whole model behind a prior requirement: there must be higher timeframe order
    flow or a draw on liquidity, or you are only trading patterns.

    '
  - 'He explicitly rejects the classic AMD diagram as ''not very mechanical'' and redefines
    it onto the candle numbering: candle 1 is ALWAYS accumulation; candle 2 is manipulation;
    candle 3 is distribution. The one branch is the wick size of candle 2. If candle 2 has
    a large opposing run it is manipulation only, and distribution happens in candle 3 (a
    separate higher-timeframe candle). If candle 2 has a small, shallow opposing run, then
    manipulation AND distribution both occur inside candle 2 -- the same higher-timeframe
    candle. The instruction he wants internalised is: let the wick form, then trade the body.'
  - 'TTrades draws the power of three on the WEEKLY candle and uses it as a forward plan for
    the coming week''s daily candles. He sketches the shape he wants - the weekly candle opens,
    puts in its high, then trades lower and closes near the low, i.e. an open-high-low-close
    week - and then maps it onto days: Monday is explicitly not cared about, Tuesday is expected
    to come up into a daily order block and form the high, and Wednesday, Thursday and Friday
    deliver the move down to a named price objective. $niper states the same expectation for
    the same week independently.

    '
definition: Accumulation is some sort of consolidation; manipulation is a fake breakout /
  the false move; distribution is the real move in the opposite direction of the manipulation.
  He states that the box setup IS this pattern, and applies the same sequence across sessions
  — his general expectation is Asia accumulates, London manipulates, New York distributes
  — and across the 4-hour and daily candle (open, manipulate below the opening price, distribute).
category: model
status: contested
aliases:
- AMD
- power of three
- accumulation manipulation distribution
- weekly power of three
- AMD on the week
- PO3
- 4-hour power of three
- OHLC / OLHC
- open high low close week
preconditions:
- A directional expectation for the week (e.g. reaching for liquidity above).
- A higher timeframe narrative / draw on liquidity exists.
- A range (accumulation) with a defined high and low.
- A daily (or higher) bias.
- A candle 1 whose extreme is the reference.
- 'A directional expectation for the week already exists (here: bearish, from the higher-timeframe
  read).'
- A price objective for the week has been named (in this example ~4150 on the index).
detection_rules:
- Mark the consolidation (accumulation). For the box setup he marks the bodies.
- Manipulation = the move outside the consolidation, in the direction OPPOSITE the intended
  trade.
- Confirm the manipulation by requiring aggressive displacement back into the range plus a
  structure break or CISD; without that aggressive return, expect continuation instead.
- Distribution = the move away from the manipulation, projected with standard deviations off
  the manipulation leg.
- 'Session form: Asia accumulation, London manipulation, New York distribution.'
- 'Candle form: bullish 4-hour/daily candle = open, low (manipulation below the opening price),
  high, close.'
- 'Bullish week: mark the weekly open; expect the manipulation leg lower first.'
- The weekly low should form on Monday, Tuesday or Wednesday morning - most often Tuesday.
- After that low holds, expect range expansion up and a close near the weekly highs.
- Mirror for a bearish week (high formed Monday-Wednesday morning, close near the lows).
- A week whose low forms Thursday or Friday does not fit the profile.
- 'Candle-level: mark the period''s opening price. Consolidation around it = accumulation.'
- The first sustained excursion beyond the opening price = manipulation.
- The move away from that excursion toward the far extreme = distribution.
- 'Range-level: a failure to displace out of one side of the range is the manipulation; expect
  the distribution to seek the opposite side.'
- The same shape read on two diverging lines is a broadening formation.
- '1. Accumulation: a consolidation range; record range_high and range_low.'
- '2. Manipulation: price trades outside range_high or range_low and then moves aggressively
  back INSIDE the range.'
- '3. Failure test stated explicitly: if price does NOT displace back into the range after
  leaving it, expect continuation in the breakout direction instead of a reversal.'
- '4. Distribution: expansion in the direction opposite the manipulation.'
- '5. On the daily candle: manipulation above the open forms the upper wick and predicts a
  bearish (open-high-low-close) day; manipulation below the open forms the lower wick and
  predicts a bullish (open-low-high-close) day.'
- 6. Targets for the distribution come from projecting the manipulation leg (2-2.5, 4-4.5).
- 'Session mapping observed: Asia accumulates, London manipulates, New York distributes.'
- Candle 1 = accumulation, always.
- Candle 2 with a LARGE opposing run below candle 1's low (bullish case) = manipulation only.
  Let it close; trade candle 3 as distribution.
- Candle 2 with a SMALL, shallow opposing run below candle 1's low = manipulation and distribution
  in the same candle. Tradeable inside candle 2.
- In either case the distribution candle is confirmed on the lower timeframe by a change in
  the state of delivery that creates a protected swing -- that is what says the wick has formed.
- Trade the body of the distribution candle; never try to catch the wick.
- 'Draw the desired weekly candle first: open, high, low, close - for a bearish week that
  is open, put in the high, expand lower, close near the low.'
- 'Map the sketch onto days: Monday is not required to do anything; the high is expected on
  Tuesday, ideally into a daily order block; Wednesday, Thursday and Friday deliver the expansion.'
- '$niper''s version of the same week: Monday or Tuesday sets the high of the week and Wednesday,
  Thursday, Friday drop.'
- The plan is stated as an expectation to be traded around, not a prediction to be forced.
invalidation:
- No aggressive displacement back into the range — the excursion was expansion, not manipulation.
- The manipulation low is violated after Wednesday morning - the week is not the bullish power-of-three.
- Failure to displace back into the range after the excursion (converts to continuation).
- The protected swing formed by the lower-timeframe CISD is taken out.
- Price opens and moves in the intended direction FIRST -- 'when price goes up first, that
  usually means it's going to come down' -- so the shallow-opposing-run case is off.
- Not stated. Neither speaker gives the price or day that would retire the weekly shape.
measurable:
- how often London takes an Asia extreme and New York expands the other way
- hit rate of the -2/-2.5 band measured from the London manipulation
- day-of-week distribution of the weekly low in up weeks (and the high in down weeks)
- proportion of up weeks closing in the top quartile of their range
- proportion of periods whose manipulation excursion resolves beyond the opening price
- size of the distribution leg relative to the manipulation leg
- share of daily candles classifiable as OHLC/OLHC with the wick formed in London
- hit rate of the distribution reaching the 2-2.5 band
- frequency of the failure case (no displacement back into the range)
- share of the daily range produced during the distribution phase
- split of C2 into manipulation-only vs manipulation+distribution, by timeframe
- expansion of C3 following a manipulation-only C2
- frequency of open-high-low-close weeks by instrument
- how often the weekly extreme actually lands on Monday or Tuesday when this shape is anticipated
