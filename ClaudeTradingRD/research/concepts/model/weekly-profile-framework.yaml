id: weekly-profile-framework
name: Weekly Profile (for Daily Bias)
variants:
  name:
  - Weekly Profile (built day by day)
  definition:
  - 'The weekly candle is treated as an open-high-low-close object that is built one day at
    a time and never predicted in advance. Monday carries no information because the daily
    and weekly candle are the same; from Tuesday onward each new daily close adds information,
    so the week gets easier to trade as it progresses. He refuses to draw a Monday-does-X
    / Tuesday-does-Y outlook because the first open invalidates the whole plan.

    '
  - 'This unit adds how the weekly open is derived and used. The weekly opening price is literally
    the Sunday open, marked out with nothing fancy around it. Reading the current week from
    it: if the week has no real established low and price trades higher, that is the expansion;
    if instead it reverses at that area, the weekly profile is to trade back toward the weekly
    open.'
  category:
  - time
definition: 'A method for deriving daily bias from the shape the current weekly candle is
  forming. You do not predict which weekday will make the high or low of the week; you let
  the weekly extreme form, confirm it with a daily candle 2 closure plus an hourly change
  in the state of delivery inside that candle, and then trade the following days as continuations
  away from that extreme. The weekday on which the confirmed extreme forms classifies the
  week into one of the named profiles (classic expansion, midweek reversal, consolidation
  reversal, intraweek reversal, Thursday counter), with TGIF as a Friday-only trade of the
  resulting weekly wick. The speaker states repeatedly that the profiles are logic, not templates
  to be matched, and that they are most useful precisely when the fractal model does not print
  a picture-perfect setup.

  '
category: model
status: contested
aliases:
- weekly profile
- weekly profile for daily bias
- weekly open high low close
- day-by-day bias
- weekly open
preconditions:
- A directional bias exists, generally taken from a weekly-timeframe reversal candle or an
  expectation of expansion in one direction.
- The current week is in progress; at least one daily candle has closed.
- A weekly open is marked - he marks the weekly open explicitly as the frame for the week's
  trades.
- The Sunday open is marked.
detection_rules:
- For each closed daily candle of the current week, ask whether the high (bearish bias) or
  low (bullish bias) of the week can be considered formed.
- A day qualifies as the weekly extreme only if it prints a candle 2 closure on the daily
  chart.
- Confirm that candle 2 closure by locating a change in the state of delivery on the 1H chart
  inside that daily candle; without it the extreme is not confirmed.
- If the current day does not qualify, let another daily candle print rather than declaring
  the extreme.
- 'Classify the week by the weekday of the confirmed extreme: Monday/Tuesday = classic expansion;
  Wednesday = midweek reversal; Thursday after a Mon-Wed consolidation = consolidation reversal;
  Thursday after an unanchored Mon-Wed expansion = Thursday counter; a confirmed reversal
  that is not the weekly extreme = intraweek reversal.'
- Trade the days after the confirmed extreme as continuations (candle 3, then candle 4 if
  candle 3 closes well).
- Skip Monday roughly 90-95% of the time; let Monday print.
- A Monday reversal makes Tuesday the continuation day - this is the highest-frequency pattern
  he names.
- Once the high or low of the week is in, the following expansion days are materially easier
  than the reversal day; do not try to pick the weekly extreme inside the week.
- If Monday made the weekly low and price expanded up all week, do not buy on Friday - Friday
  normally caps the weekly range.
- A weekly candle closing weak and inside the previous week's candle frames downside for early
  the following week.
- Only the hourly chart is used to work the weekly profile.
- Weekly open = the Sunday open of the weekly candle, marked as a single level.
- No established low in the week plus a trade higher = the expansion case.
- A reversal at that area = trade back toward the weekly open.
invalidation:
- The candidate extreme day closes as an opposing expansion candle rather than a reversal
  candle.
- The required hourly change in the state of delivery has not yet closed through; the extreme
  stays unconfirmed.
- Price trades beyond the confirmed extreme, removing the swing point being traded away from.
- Any pre-drawn multi-day plan is void the moment the week opens differently.
- Not stated in this unit.
measurable:
- distribution of the weekday on which the weekly high and weekly low actually form
- frequency of each of the five week classifications
- hit rate of candle 3 continuing in the anticipated direction, conditioned on the hourly
  CISD being present vs absent
- how often a daily candle 2 closure at the weekly extreme is NOT accompanied by an hourly
  CISD
- frequency of Monday-reversal / Tuesday-continuation weeks
- win rate of Monday trades vs Tuesday-onward trades
- how often Friday caps the weekly range after a Monday extreme
- share of weeks that return to the weekly open after an early reversal
