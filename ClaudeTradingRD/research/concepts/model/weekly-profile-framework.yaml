ambiguities:
- The bias that must exist before applying the framework is sourced outside this unit; no
  bias-formation procedure is given in any of the six videos.
- '''Closes well'' / ''closes strong'' gates whether candle 4 is taken, but is never quantified.'
- '''Average daily range'' is used as an expansion stop-point with no stated lookback or calculation.'
- The classification is presented as a set of named profiles rather than an explicit decision
  tree; the ordering used here (classic expansion checked first, then midweek reversal, then
  consolidation reversal) is stated only in the Consolidation Reversal video and is assumed
  to generalise.
- The speaker allows a profile to be read even when its own preconditions are partly violated
  ('use the logic'), which makes strict classification of borderline weeks undecidable from
  the videos alone.
- The 90-95% Monday-skip figure is stated casually and hedged ('like 90 95% of the time yeah').
- '''Weak close'' for the weekly candle is not quantified.'
- He mentions using the 6 p.m. open for the daily candle but then says he does not care about
  midnight price; the exact daily/weekly open convention is left loose.
- '''No real great established low'' is the switch between the two branches and is not quantified.'
- This is a live read of one week, not a statement of the full profile taxonomy taught elsewhere.
