ambiguities:
- The models are described against on-screen diagrams; the numbering is only fully recoverable
  from the two 'only difference' sentences.
- '''Aggressive'' (BPR model) and ''internal range liquidity'' are used as gates without thresholds.'
- No rule says which of the five to use on a given day - he says to pick what makes sense
  to you and stick to it.
- The kill-zone gate is asserted but no hours are given in this video; only 'I trade the New
  York open'.
