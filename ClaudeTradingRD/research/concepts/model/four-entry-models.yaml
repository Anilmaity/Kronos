id: four-entry-models
name: The Four Numbered Entry Models (plus BPR)
definition: 'A compact, fully enumerated lattice of lower-timeframe entry models that he says
  are the four posted on his Twitter, plus a fifth. The base (model 1) is the classic sequence:
  liquidity grab -> break of structure -> retracement into a fair value gap. Model 3 = model
  1 plus an OTE on the displacement leg, added purely to guarantee risk-to-reward. Models
  2 and 4 are models 1 and 3 with the extra requirement that INTERNAL RANGE LIQUIDITY is taken
  before the move - typically a fair value gap sitting immediately to the left of the entry.
  The fifth is the BPR model: an aggressive buy met with an aggressive sell (or the reverse),
  entered at the overlap of the two fair value gaps. He frames the whole thing as a kit: pick
  concepts, draw the diagram, label it, then stick to it.'
category: model
status: specified
aliases:
- the four models I have outlined on my Twitter
- model one
- model 3
preconditions:
- The execution timeframe is chosen first (he uses 1-minute and 15-second).
- The kill zone in which the model is hunted is chosen (he trades the New York open).
- A higher-timeframe point of interest exists - this video deliberately excludes that step.
detection_rules:
- 'Model 1: liquidity grab -> break of structure with displacement -> entry on the retracement
  into the resulting fair value gap.'
- 'Model 2: model 1 AND internal range liquidity taken before the expansion leg.'
- 'Model 3: model 1 AND the entry sits inside an OTE of the displacement leg (low-to-high
  for longs).'
- 'Model 4: model 3 AND internal range liquidity taken before the expansion leg.'
- 'Model 5 (BPR): an aggressive move one way met by an aggressive move the other; take the
  OVERLAP of the two fair value gaps as the entry; stop beyond the extreme (bodies may be
  used).'
- 'The permitted concept vocabulary for building any model is fixed: displacement / fair value
  gaps, order blocks, OTE, discount and premium, SMT, inducement, BPR.'
invalidation:
- The required component (grab, structure break, IRL, OTE placement, overlap) is absent.
measurable:
- hit rate of model 1 vs 2 vs 3 vs 4 on the same instrument and session
- how much the OTE requirement (models 3/4) improves realised R and how much fill rate it
  costs
- how often internal range liquidity is present before a qualifying expansion leg
