id: invalidation-trade
name: Invalidation Trade (trading the failure of a valid model)
definition: 'Restated live on gold. A daily candle 2 at a potential low of the month was the
  bullish idea; it needed an intraday confirmation and a continuation over the level. No continuation
  formed, so the idea is invalidated and the opposing previous day low becomes the target.
  He names the invalidation as forming in exactly two ways - a reversal off the previous day
  high (shown on NQ) or a failure of the EQ (a close below the EQ plus a bearish continuation,
  shown on gold, replayed three minutes at a time) - and states the target as always the previous
  day low. He frames the C2 closure, C3 closure and their invalidation as the "easiest bias"
  because a formed setup, unless it consolidates, either works or fails.

  '
variants:
  definition:
  - 'The trade taken when a model that was valid on one side fails at its own equilibrium.
    The precondition is a genuinely valid setup - a candle 2 closure, a change in state of
    delivery, SMT and expansion - which should produce a small wick and then expand. Instead
    price opens and closes beyond the EQ (midpoint) of that structure on the aligned timeframe
    and does not reclaim it. That failure is the signal: the trade is taken in the opposite
    direction toward the opposing liquidity, in the worked example the previous day low, and
    the path there typically includes a retracement into a fair value gap, or a consolidation
    whose high is swept and then used as resistance. He read the sequence off his own published
    invalidation graphic and then matched it to the live hourly chart on ES.

    '
  - This stream contradicts the library reading that a close through the EQ flips the bias.
    He took a loss on an NQ long because traders read a close over the daily EQ as bullish;
    he calls the EQ break a 'soft invalidation'. A closure through the EQ means the candle
    has gone too high to form a SMALL wick and expand; it now has a LARGE wick, so he keeps
    the bearish bias and only adjusts targets (daily open, liquidity around the open, intraday
    lows). The bias is only invalidated when the EQ break is paired with other things - structure
    and the daily profile. He repeats this four times in the stream.
  - 'SHORTS EVIDENCE on the daily. A V-shape reversal with a strong close into the highs is
    a bullish daily candle 2 closure. The expected path is: open, trade lower into a point
    of interest (a fair value gap), respect the EQ, trade higher. Instead price consolidates
    in the point of interest - which he reads as an early bad sign for the continuation -
    then makes a very aggressive closure below the EQ, disrespects the fair value gap and
    is not bought back up. That makes a continuation lower into the candle 2 low the anticipated
    move: a "failed candle two", because a bullish setup could not form, so it is simply a
    bearish setup.

    '
  - 'He will trade AGAINST his own daily bias in exactly two situations and no others: (1)
    an OPPOSING SETUP forms -- a candle 2 in the other direction, typically off the previous
    day high/low, confirmed on the lower timeframe; or (2) the EQ IS INVALIDATED -- price
    closes beyond the equilibrium of the previous candle on the aligned timeframe. Any other
    way the bias goes wrong (consolidation, drift) invalidates the idea but does NOT create
    a trade in the opposite direction. The precondition is absolute: there must have been
    a valid fractal model to fail in the first place -- the invalidation cannot be pattern-traded
    on its own.'
