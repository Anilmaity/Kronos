preconditions:
- A daily candle 2 (here at a potential low of the month) gave a directional idea.
- A valid bullish (or bearish) model exists on the aligned timeframe - C2 closure plus CISD,
  optionally with SMT and expansion.
- The EQ (midpoint) of that structure is marked.
- A daily bias with a daily profile supporting it.
- Price closes through the daily EQ against the bias.
- A valid fractal model (closure + CISD) existed and gave a bias.
- The traded day has opened.
detection_rules:
- 'Invalidation route 1: price reverses off the previous day high (bullish idea failing).'
- 'Invalidation route 2: price closes below the EQ AND forms a bearish continuation.'
- Once invalidated, either stand aside or trade toward the previous day low.
- Do not enter in the reversal candle; enter after price breaks down and forms the bearish
  continuation.
- If price instead sweeps a new high, the invalidation read is void - wait for a new C2.
- Establish that a valid model exists on one side and mark its EQ.
- 'Expansion test: if the model is going to work, price forms its low with a small wick and
  expands away.'
- 'Invalidation test: price closes beyond the EQ on the aligned timeframe and fails to reclaim
  it.'
- On invalidation, take the opposite direction with the opposing liquidity as target (previous
  day low / high).
- Expect a retracement first - a fair value gap, or a consolidation that is swept and then
  used as resistance - before the continuation.
- A close through the EQ alone does NOT switch bias.
- Reclassify the candle as large-wick and move targets back toward the daily open, liquidity
  around the open and intraday lows/highs.
- Switch bias only when the EQ break coincides with opposing structure AND an opposing daily
  profile.
- Consolidation inside the point of interest where the continuation should react is an early
  warning that the candle 2 continuation is failing.
- An aggressive close below the EQ, through the fair value gap, with no buy-back, confirms
  the failure.
- On a failed candle 2, target the candle 2's own low.
- 'Case 1 (opposing setup): price opens near the previous day extreme, sweeps it, and forms
  a change in the state of delivery in the opposite direction. Prefer it paired with SMT or
  a continuation.'
- 'Case 2 (EQ invalidation): price closes beyond the EQ of the previous higher-timeframe candle
  on the aligned lower timeframe, having failed to form any continuation in the original direction.'
- In both cases, still wait for a candle 2 / candle 3 closure and a continuation in the NEW
  direction before entering -- the invalidation itself is not the entry.
- 'Target selection: the EQ of the previous candle, then the previous day extreme; on a failed
  candle 2, the candle 2''s own low/high becomes the draw on liquidity.'
- 'Wick size decides the target: a small wick supports expansion to the current extreme, a
  large wick means targeting back to the opening price / EQ only.'
invalidation:
- Price sweeps out a new high above the failing swing - wait for a new candle 2.
- Price reclaims the EQ after closing beyond it - the failure is not confirmed.
- Opposing structure plus opposing daily profile alongside the EQ break.
- No prior valid model -> there is nothing to invalidate and no trade.
- Price is bought back up through the EQ -- the invalidation read is over; he stresses it
  is 'not an all or nothing thing'.
measurable:
- Share of daily C2/C3 setups that neither work nor fail (consolidate).
- Hit rate of previous day low after a close-below-EQ plus bearish continuation.
- hit rate of the opposing previous-day extreme after an EQ close-and-fail
- how often the retracement-to-FVG leg appears before the continuation
- after a close through the daily EQ against the bias, frequency the day still closes back
  toward / beyond the open in the original direction
- frequency of case 1 vs case 2 invalidations
- hit rate of the EQ and previous-day-extreme targets on invalidation trades
- proportion of failed biases that produce NO tradeable invalidation (consolidation)
