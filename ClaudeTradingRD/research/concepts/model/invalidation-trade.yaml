ambiguities:
- '''Handle two/three closure'' is a caption error for candle two/three closure.'
- He calls the entry 'not super ideal' because it sat low in the dealing range; no location
  threshold is given.
- Which timeframe's EQ was failed on gold is not stated on air (hourly chart was being viewed).
- '"The aligned time frame" is never defined - in the worked example the EQ was read on the
  hourly, but no rule maps a model to its aligned timeframe.'
- No time limit is given for "fails to reclaim it"; the example simply never reclaimed.
- The wording is read aloud off a graphic on his own site, so the transcript is a paraphrase
  of a slide the reader cannot see. The transcript's "directly from their website" is an auto-caption
  artifact for his own site.
- Whether an invalidation trade needs its own point of interest / CISD before entry is not
  stated.
- '''Paired with other things'' is only partly named (structure, daily profile); no full list.'
- Conflicts with library rules stating the bias flips on an EQ close - recorded as contested.
- The timeframe on which the EQ close is read is not named; the chart is daily but the intraday
  sequence implies a lower timeframe.
- Whether the EQ is of the candle 2 or of the previous day's range is not stated.
- No entry is described for the bearish trade; the clip only names the target (candle 2 low).
- The EQ referenced is 'the EQ of our previous candle' on the aligned timeframe, but which
  candle counts as 'previous' when several timeframes are in play is not spelled out.
- '''Closing below the EQ'' is required, but the closing timeframe is described only as ''the
  aligned time frame''.'
- He states an EQ break does not guarantee the target and gives a counter-example, without
  offering a filter to tell the two apart in advance.
