execution:
  bias: From the daily/weekly draw.
  entry: After 8:30, at the swept low / the 5-minute 0.62 retracement if missed.
  stop: At the swept low.
  targets:
  - First partial at the marked high
  - second and third partials at successive highs
  - hold to close
