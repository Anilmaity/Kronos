ambiguities:
- '''Obvious'' highs and lows is the selection criterion for step 4 and is not defined.'
- No timezone is stated for 8:30 or for the midnight open in this video.
- The 0.62 fallback level is used but not stated as a rule (he says '0.625' reading it off
  the fib).
- No rule says what to do when the calendar has no high-impact release.
