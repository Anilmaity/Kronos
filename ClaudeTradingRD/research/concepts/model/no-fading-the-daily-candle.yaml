ambiguities:
- The daily candle is still forming when the decision is made; no rule is given for how much
  of the day must have elapsed before its direction is trusted.
- No treatment of a doji / indecision daily candle, where there is no direction to align with.
- Stated as a personal preference ("you can do whatever you want", "it's just not my style"),
  not as an absolute rule.
- It is not reconciled with the invalidation trade, which is by construction taken against
  the model that was valid earlier in the same day.
- '''Supports expansion'' is judged from the wick size and open position but no numeric wick-to-body
  threshold is given in this unit (see small-wick-expansion-rule).'
- He allows that the fade 'can make sense' after a new 4-hour candle opens at 10:00 a.m.,
  so the rule is a strong preference rather than an absolute prohibition.
- How to treat an inside / indecision daily candle that supports neither direction is not
  addressed here.
