id: no-fading-the-daily-candle
name: Do Not Fade The Current Daily Candle
variants:
  name:
  - Do Not Fade The Daily Candle
  definition:
  - 'The single most repeated refusal in this unit, stated in three of the four streams and
    used to decline viewer trade ideas every time. Whatever the intraday structure says, he
    will only take trades in the direction the current daily candle supports. A daily candle
    that opens, leaves a small wick and expands lower supports shorts; the counter-trend long
    back into it is "fading the daily candle" and he will not take it. The consequence he
    states explicitly is not that the fade cannot work but that it is inherently harder: a
    reversal against the daily range gets stopped out more often, needs more confirmation,
    and justifies less aggressive entry sizing than a trade aligned with both the daily and
    the next timeframe down.

    '
  - 'Viewers asked repeatedly for gold shorts during a bullish gold/silver continuation. He
    answers that he does not fade breakouts or bullish moves, even intraday: trade the trend,
    wait for a swing low and trade it higher.'
  - 'Live lesson at the end of a chopped session: the daily profile was still bearish (open
    high first), so the bullish NQ retracement he had framed was fighting the daily candle.
    Fading the daily profile is allowed only with lower expectations - daily open, maybe intraday
    highs, not a trend day; when trades line up well the daily candle supports them.'
  - 'Restated: a long on a trending bearish day is ''fighting the daily candle'', the same
    point he made the previous stream; he applies it to the 10:00 open, which is ''bearish
    or nothing''.

    '
definition: 'A directional filter applied before any intraday framing: whatever the current
  daily candle is doing, do not look for trades against it. Asked repeatedly whether a long
  was possible into a bearish daily candle, he answers that he does not prefer to counter
  the daily range, that he likes to align with the daily chart, and that a counter-trend idea
  is fighting the daily trend even when the hourly and 4-hour agree with each other. The stated
  preference is for the daily, 4-hour and hourly all pointing at the same objective.

  '
category: model
status: contested
aliases:
- countering the daily range
- I don't fade the daily candle
- align with the daily candle
- trade candles in the direction of their daily timeframe
- don't fade breakouts
- just trade the trend
preconditions:
- The current daily candle has a readable direction.
- The current daily candle has an established direction (open plus a small wick on one side).
detection_rules:
- Read the direction of the current daily candle before framing anything intraday.
- Do not look for longs inside a bearish daily candle, or shorts inside a bullish one.
- Require the daily, 4-hour and hourly to align toward the same objective before taking the
  trade.
- If the 4-hour and hourly agree with each other but oppose the daily, classify the idea as
  counter-trend and treat it as much harder.
- 'Read the current daily candle: a small wick on the open side plus expansion away from it
  defines the supported direction.'
- Only take entries in that supported direction.
- Reject any setup whose direction opposes the daily candle, even when the lower timeframe
  model is present (SMT, CISD, continuation all valid).
- If the daily candle is bullish, do not short into it; wait for the next daily candle to
  close and re-read.
- 'A trade opposing the daily range is downgraded, not merely allowed: require more confirmation
  and be less aggressive on the entry.'
- In a bullish breakout/continuation, do not take intraday shorts; wait for a swing low and
  trade long.
- If the intended trade opposes the developing daily candle, cap targets at the daily open
  and intraday extremes; do not expect a trend day.
- On a trending daily candle, take no entries against it, including at the 10:00 open.
invalidation:
- The daily candle flips direction as it develops.
- The daily candle closes and a new one opens, resetting the supported direction.
measurable:
- expectancy of intraday trades aligned with the developing daily candle versus against it
- how often a developing daily candle's direction at the New York open matches its close
- expectancy of daily-aligned vs daily-opposing entries on the same signal set
- stop-out rate of counter-daily reversal entries
