id: excluded-tooling
name: Explicitly Excluded Tools and Concepts
definition: 'Across these streams he names, unprompted or in answer to viewers, the things
  that are deliberately not in the model: kill zones, macros, the midnight open, breaker blocks,
  higher-timeframe order blocks (rare), inversion fair value gaps, Silver Bullet, CRT (which
  he says is a copy of his fractal model), OTE, order flow / footprint / DOM / TPO, seasonal
  tendencies, fundamental analysis intraday, ''time distortion'', and Sunday/Asia standard-deviation
  weekly projections. He also does not trade CFDs or the Russell, and does not scalp. An implementation
  of this model should contain none of these.'
category: model
status: specified
detection_rules:
- No kill-zone windows; higher-timeframe candle opens are used instead.
- No macros - see macros-not-used and macros-are-htf-opens.
- No midnight open; the daily open is used because the daily candle is what is traded.
- No breaker blocks and no inversion fair value gaps.
- No OTE, no Silver Bullet, no CRT, no 'time distortion'.
- No order flow, footprint, depth of market or TPO.
- No seasonal tendencies and no intraday fundamentals.
- 'Instruments: futures only (indices, gold, silver, oil, dollar); no CFDs, no Russell.'
measurable:
- how many candidate signals a detector would generate that depend on an excluded tool
sources:
- video_id: m0wTBdUe7gs
  title: New York Open Live Q&A
  quote: I don't use kill zones
- video_id: xraklBJHW5k
  title: New York Open Live Q&A
  quote: shiny random things that don't matter
- video_id: yNgx9OAefuI
  title: New York Open Live Q&A
  quote: wouldn't look very OTE
ambiguities:
- '''I rarely use higher time frame OBS'' is a frequency statement, not an exclusion - opposing
  candles / order blocks remain part of the model elsewhere in the corpus.'
- He says he spent about six months on TPO and depth of market before abandoning them; no
  reason beyond preference is given.
- Gold is traded on a futures chart rather than a CFD chart specifically to get exact data,
  not because CFD price action is considered different.
