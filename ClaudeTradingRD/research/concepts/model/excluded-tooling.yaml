id: excluded-tooling
name: Excluded Tooling
variants:
  name:
  - Explicitly Excluded Tools and Concepts
  definition:
  - 'More exclusions answered in chat: he does not use the midnight open, only the daily open
    (his co-host says he does); he calls quarterly theory fake; he does not need Bookmap;
    and he does not analyse forex cross pairs because he does not trade forex or CFDs.'
  - 'Across these streams he names, unprompted or in answer to viewers, the things that are
    deliberately not in the model: kill zones, macros, the midnight open, breaker blocks,
    higher-timeframe order blocks (rare), inversion fair value gaps, Silver Bullet, CRT (which
    he says is a copy of his fractal model), OTE, order flow / footprint / DOM / TPO, seasonal
    tendencies, fundamental analysis intraday, ''time distortion'', and Sunday/Asia standard-deviation
    weekly projections. He also does not trade CFDs or the Russell, and does not scalp. An
    implementation of this model should contain none of these.'
definition: 'This stream adds to the ''not used'' list: quarterly theory, volume profile,
  break of structure / market structure shift / change of character (replaced solely by CISD,
  which he started using after market structure shift in 2022), and kill zones - rejected
  because the model is built on higher-timeframe candles, so an entry at 6:45 is not skipped
  just because it is outside a 7:00 kill zone.'
category: model
status: contested
detection_rules:
- No kill-zone gate; entry allowed whenever the higher-timeframe wick has formed.
- No BOS / MSS / CHoCH; trend change is read only by CISD.
- No quarterly theory, no volume profile.
- No midnight open; daily open only.
- No quarterly theory.
- No Bookmap / order-flow heatmap.
- No forex crosses or CFDs.
- No kill-zone windows; higher-timeframe candle opens are used instead.
- No macros - see macros-not-used and macros-are-htf-opens.
- No midnight open; the daily open is used because the daily candle is what is traded.
- No breaker blocks and no inversion fair value gaps.
- No OTE, no Silver Bullet, no CRT, no 'time distortion'.
- No order flow, footprint, depth of market or TPO.
- No seasonal tendencies and no intraday fundamentals.
- 'Instruments: futures only (indices, gold, silver, oil, dollar); no CFDs, no Russell.'
measurable:
- how many candidate signals a detector would generate that depend on an excluded tool
