id: next-day-model
name: Next Day Model (next candle model)
variants:
  name:
  - Next Day Model (and its equivalence to a STRAT 2-2 reversal)
  - Next Day Model
  definition:
  - 'Compressed to its decision table across four Shorts. Relative to the previous candle
    of the same timeframe, the current candle produces exactly one of three reads for the
    NEXT candle: closing OUTSIDE the previous range means anticipate a continuation; taking
    out one side but closing back INSIDE means anticipate a reversal (i.e. a move the other
    way); taking out BOTH the high and the low and closing back inside means anticipate a
    consolidation. The reversal read is the definition he gives for a reversal - price takes
    out its previous candle''s high or low and closes back into the range - and it licenses
    anticipating a continuation on the following candle in the new direction.'
  - 'TTrades states that a lot of the time he gets his daily bias from the next day model
    - looking for a daily candle to close respecting a PD array, then aligning that with the
    weekly profile. In the STRAT episode he maps the same object onto the guest''s vocabulary
    live: a candle that goes up, fails, and closes back into the previous range is what his
    next-day-bias video calls for, and it is the same thing as the guest''s 2-2 reversal;
    the trigger fires on the next candle and the objective is the other side of the range.
    He makes the general equivalence explicit at the end - taking a previous low and reversing
    is what ICT traders describe as taking sellside and reaching for buyside.'
  - 'A daily-candle-shape anticipation credited to MMXM Trader. When price sweeps a level
    or PD array and closes back inside the range (a failure to displace), the following daily
    candle is expected to form in a specific shape: after a failed low sweep, an open-low-high-close
    (bullish) candle; after a failed high sweep, an open-high-low-close (bearish) candle.
    The bias is then carried forward day after day until the draw on liquidity is reached.

    '
definition: 'Use the previous candle to anticipate the next. Two outcomes are defined. REVERSAL:
  price takes out the previous candle''s high or low and CLOSES BACK INSIDE that range — this
  makes him anticipate a continuation in the opposite direction on the following candle. CONTINUATION:
  price takes out the previous candle''s high or low and CLOSES OUTSIDE — he anticipates the
  move simply continuing on the following candle. He calls it the foundation of his bias and
  credits the next-candle framing to the mmxm trader; it is explicitly fractal and he demonstrates
  it on daily, hourly and 5-minute charts.'
category: model
status: contested
aliases:
- next candle model
- the next day model
- daily bias video
- OHLC / OLHC anticipation
preconditions:
- A completed previous candle with a defined high and low.
- A completed daily candle and a marked PD array / previous range.
- A prior day has swept a swing point, previous-period level, or PD array and closed back
  inside the range.
- A draw on liquidity has been identified.
detection_rules:
- 'Reversal: candle takes out the previous candle''s high (or low) AND closes back inside
  the previous candle''s range -> anticipate the opposite direction on the next candle.'
- 'Continuation: candle takes out the previous candle''s high (or low) AND closes outside
  it -> anticipate the same direction on the next candle.'
- A swing point may be substituted for the previous candle's extreme (failure to displace
  out of a swing point frames the same reversal).
- A candle that respects a PD array also frames the next candle in the direction away from
  that array.
- 'Inside bar: no information; wait for another candle or default to trend continuation.'
- 'Conflict case (previous candle says one thing, the swing point on the left says the other):
  wait for another candle.'
- 'Blend with phases of price: after ~3 expansion candles, expect a new phase rather than
  another continuation.'
- Close outside the previous candle's range -> anticipate a continuation on the following
  candle.
- Reach beyond the previous high (or low) but close back inside the range -> reversal; anticipate
  the following candle to continue in the reversed direction.
- Take out BOTH the previous high and the previous low and close back inside -> anticipate
  a consolidation.
- Successive closes below the previous day low sustain the "anticipate a continuation lower"
  read day after day.
- When a candle closes over the previous high but the setup is muddied (e.g. a swing high
  on the left was also taken), wait for another candle rather than acting.
- A candle that closes neither over the previous high nor below the previous low gives no
  read - wait.
- A daily candle takes out one side of the previous range and closes back inside it (respecting
  the PD array).
- The following candle is expected to trade toward the OPPOSITE side of that range.
- Align the resulting bias with the weekly profile before acting.
- The same object expressed in STRAT terms is a 2-2 reversal, and the magnitude is the previous
  candle's opposite extreme.
- 'Trigger (bullish): day D trades below a reference low (swing low, PDL, or a PD array) and
  closes back above it.'
- 'Expectation for day D+1: low of day forms early relative to the close, high forms later,
  close near the high (open-low-high-close).'
- 'Trigger (bearish): day D trades above a reference high and closes back below it -> expect
  open-high-low-close on D+1.'
- The bias persists across successive days until the identified draw on liquidity is reached.
invalidation:
- 'He states plainly that it fails: ''nothing always works 100% of the time''; a failed read
  is followed by re-reading the next close, not by doubling down.'
- The anticipated continuation candle instead closes back inside the previous range, which
  converts the read to a reversal.
- The next candle instead continues through the swept side.
- Day D+1 closing beyond the swept level in the direction of the sweep contradicts the model.
measurable:
- base rate of the reversal read (close back inside -> opposite direction next candle) by
  timeframe
- base rate of the continuation read (close outside -> same direction next candle)
- how much the phases-of-price filter improves either base rate
- frequency of each of the three classes per instrument per month
- next-candle directional hit rate conditional on each class
- hit rate of the opposite range extreme on the day after a fail-and-close-back-in
- agreement rate between next-day-model signals and STRAT 2-2 reversal labels
- hit rate of the anticipated candle shape (classified by where the day's extreme forms relative
  to open and close)
- average excursion of the anticipated direction on day D+1
- how many consecutive days the bias survives before the draw is reached
