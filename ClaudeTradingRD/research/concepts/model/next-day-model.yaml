ambiguities:
- '''Closes back into the range'' — whether the close must be inside the previous candle''s
  BODY or its full high-low range is never stated; the examples read as full range.'
- The conflict rule ('if I had to choose I would be bullish because of this strong closure')
  is judgement, not a rule.
- He runs the mechanical read and then overrides it with phases of price several times in
  the same example; the override has no trigger condition.
- Whether "takes out" means any trade through the level or a close beyond it differs between
  the three branches and is never stated as one rule.
- The consolidation branch gives no rule for which side is taken first.
- The Shorts do not say how many candles to wait when the read is ambiguous - only "wait for
  another candle".
- No confirmation requirement (hourly CISD, etc.) is attached in these clips, although the
  rest of the corpus requires one. Do not backfill it from those videos.
- Body close or wick close 'respecting' the PD array is not specified in this exchange.
- The claimed equivalence with the STRAT 2-2 reversal is asserted on one chart, not tested.
- '''Open-low-high-close'' is a shape description, not a threshold — no rule states how near
  the close must be to the high for the day to count as OLHC.'
- The model predicts a candle shape but not a time of day for the extreme; the killzone and
  power-of-three videos supply that separately (London manipulation).
- The dedicated 'Open High Low Close - Understanding Candlesticks' video (sIcsLFSNoXM) is
  missing from this unit, so the vocabulary is only defined in passing.
- No statement about what invalidates the carried-forward bias other than reaching the draw.
