id: seek-and-destroy-profile
name: Seek & Destroy (broadening daily profile)
variants:
  name:
  - Seek & Destroy (defined, and explicitly not traded)
  - Seek & Destroy
  definition:
  - 'The daily profile in which the broadening formation is the day''s shape: price takes
    one session''s high and low, fails to break out, and rotates to take the other side, expanding
    the range in both directions. His session mechanic is explicit: if London took Asia''s
    high AND low without displacing out of either, he anticipates New York using London''s
    high and low as points of interest and/or a broadening formation. He anticipates this
    profile mostly when the economic calendar is empty, or on a day spent waiting for the
    next day''s news.'
  - 'Asked how he uses Seek & Destroy as a weekly profile, AM Trades answers that it is one
    of ICT''s profiles but not one of his, and that he never uses it. His definition is a
    profile in which the external range is continuously swept in both directions; his stated
    reason for not trading it is that the order flow is not clear. He gives the mechanical
    signature on an hourly chart: price fails to displace over the buyside, falls back into
    the range, fails to displace under the sellside, comes back in, and ends up stuck in the
    middle of the range. The host adds that this is what he would call a broadening formation.'
  - 'The non-directional daily profile: the daily candle is an indecision candle (open and
    close at relatively the same point, no directional expansion) and the intraday chart shows
    repeated excursions outside a range that are immediately reclaimed. It is presented as
    a day to stand aside from rather than to trade. Two recognition conditions are given,
    both readable before the New York session: London took out BOTH sides of the Asia range
    without holding beyond either, or London already produced most of the daily range.

    '
definition: 'THE DEDICATED EARLIER LESSON. The definition given here is causal rather than
  descriptive: a seek and destroy profile is a LACK OF HIGHER-TIMEFRAME DIRECTION relative
  to the timeframe being watched, which leaves consolidation. The behavioural consequence
  is that every attempt to leave the range returns into it - buyside taken then back inside,
  sellside taken then back inside. It is explicitly fractal: seek-and-destroy profiles nest
  inside larger ones. His stated default is avoidance (''pretty choppy''), and the tradeable
  version is entirely built on DEVIATIONS: mark every point where price took buyside or sellside
  and came back in, and trade from those, with a fixed three-step target ladder (see seek-destroy-target-ladder).'
category: model
status: contested
aliases:
- seek and destroy
- broadening formation as a weekly profile
- failure to displace both sides
- seek and destroy profile
- indecision day
preconditions:
- The higher timeframe has no direction relative to the timeframe being traded.
- A day with no high-impact news, or a day waiting on tomorrow's release.
- A defined external range with a high and a low.
- The Asia range high and low are marked (the Asia session window itself is never given numerically
  in this unit).
- 'Context that raises the prior: the day before a high-impact release (CPI, FOMC, NFP), a
  lack of direction on the higher timeframe charts, or the day after a very large range day.'
detection_rules:
- Mark the reference range's buyside and sellside liquidity.
- Each time price takes one side and closes back inside, record a DEVIATION from the range;
  those deviations are the only trade locations.
- 'Daily anticipation trigger: London takes BOTH the Asian range high and the Asian range
  low. That creates a deviation on both sides, and New York a.m. is then expected either to
  consolidate or to target London''s own high and low.'
- Treat the profile as fractal - the same deviation/return behaviour repeats on lower timeframes
  inside the larger range.
- Default action is to stand aside; only trade the deviations if you choose to engage.
- Mark the Asia session high and low.
- If London takes BOTH and cannot displace out of either, flag the seek-and-destroy read.
- Mark London's high and low; those become New York's points of interest.
- Extend the broadening lines as each new extreme is made; expect the untaken side to be sought
  after each failed breakout.
- 'Higher-timeframe signature: the daily candle is an outside bar (both previous day high
  and low taken).'
- Price runs the external high and fails to displace above it, closing back inside.
- Price then runs the external low and fails to displace below it, closing back inside.
- Price settles in the middle of the range.
- When this signature is present, take no trades - the order flow is not readable.
- 'Recognition A: during London, price takes out the Asia low AND the Asia high, failing to
  displace or break out beyond either side, returning inside the range each time.'
- 'Recognition B: London expanded and created most of the daily range, leaving little expected
  range for New York.'
- 'Confirmation on the daily: the candle opens and closes at relatively the same point with
  no directional expansion (indecision candle).'
- 'Intraday signature: every deviation outside the reference range (Asia range, London range,
  daily open) is rebalanced back into it.'
invalidation:
- A very large displacement candle out of the range - he flags that price 'may start to leave
  this range' and the profile is ending.
- A session displaces cleanly out of one side and holds — trend day, not seek and destroy.
- A displacement that holds outside one side of the external range ends the profile.
- Displacement / a genuine breakout beyond one side of the range. The video does not define
  what separates a genuine breakout from another failed excursion, which is the profile's
  central weakness.
measurable:
- count of deviations per day
- rate at which a deviation returns to range equilibrium
- frequency of days where London takes both Asia extremes
- share of those days that print an outside daily bar
- conditional frequency on empty-calendar days vs news days
- frequency of double-sided failure to displace per month
- P&L of trades attempted during this signature
- conditional probability of an indecision daily candle given that London took both sides
  of the Asia range
- distribution of daily range on the day before CPI / FOMC / NFP versus baseline
- conditional probability of a small New York range given that London already produced most
  of the daily range
- how often price returns to range equilibrium after deviating outside the Asia range
