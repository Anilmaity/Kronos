ambiguities:
- 'EVOLUTION vs the Updated playlist: the later canon (Tjk9bXERZy0) anticipates this profile
  from an EMPTY ECONOMIC CALENDAR (''a lack of news events''). This earlier recording never
  mentions news at all and derives it from a lack of higher-timeframe direction. Both readings
  preserved.'
- '''Lack of higher timeframe direction'' has no test - no range-width, no candle count, no
  reference to previous-candle extremes.'
- The auto-captioner renders 'London session' as 'lemon session' at the one place he gives
  the Asia-range trigger.
- No deadline is given for when London must have taken both Asia extremes.
- Which range is the operative one when profiles nest is not stated.
- He offers to make a dedicated video on this profile, so the treatment here is deliberately
  partial.
- Session boundaries are set by an indicator ('_boxes') whose settings he says he adjusts
  and does not disclose.
- No rule says how to trade the profile beyond using the session extremes as points of interest.
- '''Fails to displace'' is not quantified - no close-through, size or candle-count threshold.'
- The guest calls it a profile ICT uses and he does not; the host maps the same shape onto
  'broadening formation'. These are two different vocabularies for one price signature, not
  a disagreement about the signature.
- '''Relatively the same point'' for the indecision candle is not quantified. The 80-point
  NQ example is illustrative, not a threshold.'
- '''Most of the daily range'' created in London is not quantified - no percentage is given.'
- No deadline is given for when the both-sides-of-Asia sweep must complete (by 05:00? by 08:30?).
- The Asia session window is never stated numerically anywhere in the unit, yet the Asia range
  is the load-bearing input for recognition A.
- The relationship between recognition A and B is not stated - they appear to be alternatives,
  but he does not say whether either alone is sufficient.
- No definition of the displacement that would invalidate the profile mid-session.
