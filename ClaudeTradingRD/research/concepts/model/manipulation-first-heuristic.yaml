id: manipulation-first-heuristic
name: Find The Manipulation First (Then Derive The Range)
definition: 'A practical inversion of the AMD workflow, offered because traders struggle to
  identify consolidations in real time. Instead of looking for a range, look for aggressive
  price action that leaves a range and comes straight back into it; that is the manipulation.
  Then look left and mark the range it manipulated out of — that is the accumulation. The
  distribution is then expected on the opposite side.

  '
category: model
status: underspecified
aliases:
- work backwards from the manipulation
- aggressive out and back
preconditions:
- Recent price action containing an excursion and a return.
detection_rules:
- Scan for a candle or short cluster that trades sharply beyond recent price and is followed
  by an equally sharp return through the same area.
- 'Anchor the range: the swing high and swing low of the price action immediately preceding
  that excursion.'
- 'Label: excursion = manipulation; anchored range = accumulation; expect distribution on
  the opposite side of the range.'
- 'Applied recursively: after a distribution, the next aggressive out-and-back defines the
  next accumulation, and nested AMDs may run in opposite directions (he shows one nested AMD
  that reverses back into the higher timeframe trend).'
invalidation:
- If the excursion is not followed by a return into the range, it is expansion, not manipulation.
measurable:
- count of qualifying out-and-back excursions per session under a chosen 'aggressive' definition
- share of them followed by distribution to the opposite side of the derived range
sources:
- video_id: TCFvsZeYvV8
  title: ICT Power Of 3 - AMD
  quote: if you struggle to find the consolidations focus instead on the manipulations
- video_id: CHIK5oBRKiw
  title: Change In State Of Delivery [CISD] - Orderblock Formation - ICT Concepts
ambiguities:
- '''Aggressive'' is the load-bearing term and is entirely undefined — no candle range, ATR
  multiple, velocity or bar-count criterion is given. Without it the heuristic cannot be coded.'
- How far left to look when anchoring the derived range is not stated.
- Nested AMDs may run counter to each other; no rule decides which one to trade beyond 'this
  one is going with the higher time frame trend'.
