ambiguities:
- '''Candlestick confirmation'' as an alternative to a CISD is not defined.'
- No target is stated for the Friday reversal leg in this Short.
- 'TRANSCRIPT ARTIFACT: ''candle 2'' is auto-captioned as ''candle to''.'
- Whether the 20-30% is measured from the weekly high or the weekly low is shown once but
  never stated as a rule.
- Whether SMT is required or merely helpful at the Friday origin is not settled - elsewhere
  he says SMT is confluence only.
- '''Weekly objective'' inherits the underspecification of relevant-level.'
- How far into the week the objective must be hit for the Thursday variant to apply is not
  stated.
- No target is given for the Friday continuation beyond "back into the range".
- '"Not everyone is picture perfect" licenses accepting degraded shapes but gives no floor
  on how degraded is still tradeable.'
- The 20-30% band is described as 'the area we want to see price go back up to', not as an
  order-placement rule; whether to enter at 0.2, at 0.3, or on a reaction anywhere inside
  the band is not stated.
- '''Key level'', ''relevant level'' and ''drawn liquidity'' are used interchangeably; instances
  are enumerated (prior swing highs/lows, equal highs/lows, fair value gaps, failure swings)
  but no ranking or selection rule is given when several exist.'
- The V-shape-reversal test for whether a level actually produced a turn is visual and unquantified.
- The 2R target belongs to one worked example and is not stated as a general TGIF rule.
- The New York boundary at which candle closures become acceptable in place of a CISD is not
  given as a clock time.
- Whether TGIF can occur in a midweek-reversal or consolidation-reversal week is not addressed;
  it is defined only on top of classic expansion.
- No instrument is named in any TGIF example.
