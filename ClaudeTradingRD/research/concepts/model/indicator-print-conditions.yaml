ambiguities:
- '''Aligned lower timeframe'' is defined by the pairing table, which is itself only partially
  stated (daily->hourly, 4H->15m, hourly->5m).'
- Whether the CISD must complete before the HTF candle closes or may form after is shown both
  ways.
- The lower timeframe used for confirmation is not named in the clip - only "a lower time
  frame".
- No time limit is given for the CISD to arrive after the closure.
- Whether the CISD close must be a body close is not stated.
- The indicator behaviour is cited as evidence of the rule, which makes the rule partly a
  statement about the tool rather than about price.
- Which lower timeframe is used for confirmation is not stated in these Shorts - only 'the
  lower timeframe'.
- No deadline is given for how long the confirmation may take to arrive.
- Candle 2 and candle 3 closure are treated as interchangeable admission triggers here; no
  preference between them is stated.
- The CISD definition the code uses is not spelled out in this video.
