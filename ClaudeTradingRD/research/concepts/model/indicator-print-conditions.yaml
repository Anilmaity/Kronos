id: indicator-print-conditions
name: What Counts As A Valid Model (closure plus CISD)
definition: 'A ''model'' exists only when a higher-timeframe candle closure (C2 or C3) at
  a point of interest is PAIRED with a change in the state of delivery on the aligned lower
  timeframe. Either alone is not a setup. This is stated as the print condition of the indicator
  and repeated as the gate before any lower-timeframe work: without the CISD you do not drop
  timeframes, you do not look for SMT, and you do not trade.'
variants:
  definition:
  - 'A Short shows the negative case, which is the cleanest way the rule has been stated:
    a run of all the highs to the left plus a nice V-shape reversal closing as a bearish candle
    2 closure is NOT yet a valid setup. Validity requires confirmation by a lower-timeframe
    change in the state of delivery at the identified level. Price fails to close below that
    level, and he states the consequence twice - it is not a valid bearish setup, and his
    indicator will not print one. What followed was a range: one side swept, then a move to
    the other side.'
  - 'The Shorts give the two-part validity test in its most compressed form: the fractal model
    requires BOTH the higher-timeframe candle closure AND the swing-point confirmation (the
    change in the state of delivery), and the indicator only prints when both are present.
    The stated payoff is negative rather than positive - waiting for the second part is what
    prevents the losses that come from acting on a closure alone. The confirming closure is
    looked for on a lower timeframe than the closure being confirmed.

    '
  - 'The mechanical admission test for his model, stated while explaining why the indicator
    sometimes stays blank on a chart where the viewer sees a setup. Two things must both be
    present: a candle 2 or candle 3 closure, and a change in the state of delivery. If either
    is missing nothing prints, and that absence is the answer - the setup is not qualified.
    By default nothing is drawn until the candle closes. The indicator emits no entry, stop
    or target and therefore, he says, has no win rate; a printed model is mechanically valid
    by construction but is not automatically a trade he wants.'
category: model
status: contested
aliases:
- valid fractal model
- the model prints
- not qualified as a fractal setup
- it's automatic
preconditions:
- A higher-timeframe candle has closed.
- A candle 2 closure has printed on the higher timeframe.
- A higher-timeframe / lower-timeframe fractal pair is selected.
detection_rules:
- Higher-timeframe C2 or C3 closure.
- The closure occurred at a point of interest (fair value gap, or a high/low swept).
- A change in the state of delivery exists on the aligned lower timeframe, inside that candle.
- 'Only then: look for SMT as confluence, drop to the execution timeframe, and seek an entry.'
- The model is then expressed as a T-spot (where the HTF wick should form) plus standard deviation
  projections plus formation liquidity targets.
- A candle 2 closure alone - even with a V-shape reversal that ran all the highs to the left
  - is not a valid setup.
- Identify the lower-timeframe level whose breach would be the change in the state of delivery.
- Require a close below (bearish) / above (bullish) that level.
- If that close does not happen, the setup is not valid and the indicator does not print it.
- 'Expect a range in that case: one side swept, then a trade to the other side.'
- 'Part 1: a valid higher-timeframe candle 2 / candle 3 closure.'
- 'Part 2: on a lower timeframe, locate the extreme and the series of candles that made it,
  and require a close through that series.'
- Both parts present -> the model is valid and the indicator plots it.
- Part 1 present, part 2 absent -> no trade; in the worked example the swing is then taken
  out.
- Require a candle 2 OR candle 3 closure on the higher-timeframe candle.
- Require a change in the state of delivery on the lower timeframe.
- Both must be present; if either is absent the setup does not qualify and nothing is marked.
- Confirmation is on the candle closure; nothing is drawn before it unless the early CISD
  setting is enabled.
- A qualifying print carries no direction to enter, no stop and no target - discretion decides
  whether it is taken.
invalidation:
- Price closes over the T-spot / the area the continuation must hold - the setup turns red
  on the indicator and is treated as an early warning.
- The lower-timeframe CISD level is never closed through.
- The lower-timeframe close through the series never occurs before the level is taken out.
- The required closure or the CISD is absent - the model is simply not there.
measurable:
- how many C2 closures fail the point-of-interest gate
- how many surviving C2s fail the CISD gate
- outcome difference between gated and ungated C2s
- share of HTF candle-2 closures that never get their LTF CISD
- outcome distribution of unconfirmed C2 closures (range versus continuation)
- loss rate of closure-only entries vs closure-plus-CISD entries
- how often the lower-timeframe confirmation fails to arrive after a valid HTF closure
- count of qualifying prints per instrument per month
- hit rate of qualifying prints that he would actually take vs skip
