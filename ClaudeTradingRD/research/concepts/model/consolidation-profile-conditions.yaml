id: consolidation-profile-conditions
name: Conditions That Predict A Consolidation Daily Profile
definition: 'Three conditions, any of which makes a consolidation daily profile the expectation
  for the next session: price has just traded into a higher-timeframe level (for example taken
  out a HTF old high or low); the previous daily candles are overextended, judged over the
  last three candles, especially where the last two were large relative to the average daily
  expansion; or price is trading at the equilibrium of a higher-timeframe dealing range, where
  premium turns into discount and price is in a neutral state.

  '
category: model
status: specified
aliases:
- when to expect a consolidation day
preconditions:
- A daily dealing range has been drawn from the last swing low to the last swing high (or
  the reverse).
detection_rules:
- Price has just traded into a higher-timeframe level -> expect consolidation.
- Three or more of the last daily candles closed in the same direction, or the last two expansions
  were large relative to average -> expect consolidation.
- Price is at the 0.5 of the daily dealing range -> expect consolidation.
invalidation:
- A daily close outside the dealing range in the direction of order flow.
measurable:
- probability of a consolidation-profile day conditioned on each of the three triggers
- average daily range on days at range EQ vs elsewhere
sources:
- video_id: JABOO4LYNjQ
  title: Jokerszn | Daily Orderflow - ICT Daily Bias
ambiguities:
- '''Overextension'' is measured against an unstated ''average daily expansion''.'
- The dealing range endpoints are selected visually (last swing low to last swing high); no
  rule qualifies which swings count.
