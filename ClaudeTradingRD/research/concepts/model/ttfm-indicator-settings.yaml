ambiguities:
- The actual C2/C3/C4 requirements encoded in the indicator are explicitly withheld and sold
  in the course/mentorship - so the indicator cannot be reproduced from the free material.
- The default projection values are shown on screen but never spoken; only the ability to
  add 0.5 manually is stated. The standard-deviation video gives 1, 0, -1, -2, -2.5, -4 as
  HIS fib settings, which is the best available proxy.
- The T-spot's derivation is not given here; it is described only as 'the area I look for
  higher timeframe wicks to be formed'.
- No timezone is stated for the kill-zone filter in this video.
