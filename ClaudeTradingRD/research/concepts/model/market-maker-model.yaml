ambiguities:
- EARLIER RECORDING and a single trade review - the model's phases are named in passing, never
  enumerated.
- How the 'original consolidation' is identified in general (beyond it coinciding with previous
  day low here) is not stated.
- No distribution-phase rules are given; the trade simply targets the consolidation.
- 'The model is used as vocabulary rather than taught: no video in this unit defines the curve''s
  phases, expected proportions, or how to know in advance which side you are on.'
- The distinction between a market maker model and simple AMD is not drawn.
- How far back on the curve zones may be dragged, and how many, is not specified.
