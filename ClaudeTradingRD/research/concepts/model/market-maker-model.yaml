id: market-maker-model
name: Market Maker Model (MMXM)
variants:
  name:
  - Market Maker Buy / Sell Model (The Curve)
  definition:
  - 'The large-scale container the other patterns sit inside: price works down one side of
    a curve (the sell side), turns at a smart money reversal, and works back up the other
    side (the buy side), with the whole structure nesting inside larger versions of itself.
    Its practical use in this unit is positional: order blocks and fair value gaps created
    on one side of the curve are dragged across and reused as reaccumulation (or redistribution)
    zones on the other side, and the internal↔external liquidity rotation is what carries
    price along each side.

    '
definition: 'EARLIER RECORDING, given as a worked sell-model trade rather than a taught structure.
  The elements he names in sequence: an ORIGINAL CONSOLIDATION which is also the previous
  day low and which becomes the target; a manipulation leg upward that sweeps previous day
  high and the day before it, driven by the 8:30 CPI release, into a daily PD array (an order
  block formed by a close below a series of up-close candles); a premium-of-the-range retracement
  in which the short is taken; and distribution back down to the original consolidation. The
  distinguishing claim is that the target of a market maker sell model is the original consolidation
  itself.'
category: model
status: contested
aliases:
- market maker sell model
- original consolidation
- market maker buy model
- buy side of the curve
- sell side of the curve
preconditions:
- A daily PD array above (order block / fair value gap) for the manipulation to reach into.
- A consolidation whose level coincides with previous day low.
- 'A higher timeframe level that can terminate the current leg (examples: weekly fair value
  gap, hourly fair value gap).'
detection_rules:
- Mark the original consolidation - in the example it is the previous day low - as the eventual
  target.
- Require a manipulation leg that sweeps previous day high (and the day prior) into a higher-timeframe
  PD array.
- Fib from the manipulation high to the reversal low, EXCLUDING the news wick, to locate the
  premium.
- Take the short in the premium of that range at a PD array (fair value gap overlapping a
  mitigation block).
- Target the original consolidation; the full draw beyond it is optional extra R.
- 'Sell side of the curve: the leg into the higher timeframe level, during which order blocks
  and fair value gaps form.'
- 'Smart money reversal: the turn (see smart-money-reversal).'
- 'Buy side of the curve: the leg away from the level, driven by internal->external liquidity
  rotation.'
- 'Reuse rule: extend the sell-side order blocks and fair value gaps forward; on the buy side
  treat them as reaccumulation support, requiring a PD array inside the zone for the reaction.'
- 'Nesting: a market maker buy model on a lower timeframe can sit inside a larger market maker
  buy model (demonstrated on GBPJPY weekly/4H/15m).'
invalidation:
- The confirmed intermediate-term high is traded through.
- Not stated.
measurable:
- how often the original consolidation is reached after a completed manipulation leg
- R available at the original consolidation vs at the full draw
- reaction rate at dragged-forward zones on the opposite side of the curve
- how often the nested lower-timeframe model completes within the higher timeframe one
