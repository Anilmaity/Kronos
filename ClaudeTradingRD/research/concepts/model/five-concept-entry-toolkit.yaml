id: five-concept-entry-toolkit
name: The Fixed Four-To-Five Concept Toolkit For Every Entry And Exit
definition: 'Finessee_Fx opens the session by typing out the complete list of things he will
  use, and then states that he never deviates from it and applies it on every timeframe: order
  blocks, breakers, fair value gaps, and old highs and lows. He treats fair value gap, liquidity
  void, buy-side imbalance and sell-side imbalance as one and the same thing under different
  names. The whole method is: identify these four arrays on the highest timeframe that shows
  them, then find the same four arrays on lower timeframes for entries and exits.

  '
category: model
status: specified
aliases:
- the four things
- order blocks breakers imbalances highs and lows
preconditions:
- None - the toolkit is applied unconditionally.
detection_rules:
- 'The permitted arrays are: order blocks, breakers, fair value gaps (= liquidity voids =
  buy-side / sell-side imbalances), and old highs and lows.'
- Nothing outside that list is used for an entry or an exit.
- Apply the same list unchanged on every timeframe - the higher the timeframe the more relevant
  the level.
- 'Entries come from one of the arrays; exits come from an opposing array (his example: enter
  on a bullish order block, exit at an old high).'
- Standard deviation / measured-move projections are explicitly NOT used ('I don't use projections').
invalidation:
- Not applicable - this is a scope rule.
measurable:
- 'coverage: what fraction of his worked examples are explained by only these four arrays'
- relative reaction rate of each of the four arrays by timeframe
sources:
- video_id: eK_6wgNpNh0
  title: Advanced ICT Directional Bias Teachings with Finessee_Fx
  quote: I'm using those four to five Concepts I never deviate from that
ambiguities:
- He says 'the four things or the five things' and types four categories; the fifth is never
  separately named.
- '''The higher the time frame the more relevant'' is asserted with no ranking rule for resolving
  conflicting arrays on different timeframes.'
- Market structure breaks are explicitly excluded from the toolkit (see trading-without-structure-shift),
  which leaves no stated trigger between arriving at an array and entering.
related:
- single-pd-array-mastery
- wick-to-body-order-block-zone
- breaker-block
- fair-value-gap
- trading-without-structure-shift
guest_sources:
- Advanced ICT Directional Bias Teachings with Finessee_Fx
- Finessee_Fx
timeframes:
  htf:
  - 1M
  - 1W
  - 1D
  ltf:
  - 4H
  - 1H
  - 15m
  - 1m
  fractal: true
execution:
  bias: From whichever direction of PD array is being respected on the higher timeframe.
  entry: At one of the four arrays.
  stop: Beyond the array used for entry.
  targets:
  - the opposing array - typically an old high or old low
