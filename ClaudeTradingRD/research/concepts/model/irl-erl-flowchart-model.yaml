ambiguities:
- THE KILL ZONE IS USED AS A HARD GATE AND ITS HOURS ARE NEVER GIVEN. Two of the three Shorts
  make it a requirement; one names London only as a label on the chart. No clock times appear.
- '''Drop one timeframe'' and ''the lower timeframe'' are relative - no concrete ladder is
  given here.'
- '''Just around a 2R trade'' is approximate; no rule states when a target other than 2R is
  used.'
- 'TRANSCRIPT ARTIFACT: the auto-captions render ''stop raid'' as ''stop rate'' and ''2R''
  as ''2our'' in kv9aH7fb2Hc; quotes are taken from passages free of those artifacts.'
- Which kill zone, and its clock, is never stated in this video - the term is used without
  hours.
- The 'strong bias / strong narrative' override that permits trading after external liquidity
  has been taken is explicitly discretionary and unquantified.
- The higher-timeframe bias step is delegated to his daily bias video; only two example forms
  are shown here.
- '''Just around a 2R trade'' is a target guideline, not a stated hard rule.'
