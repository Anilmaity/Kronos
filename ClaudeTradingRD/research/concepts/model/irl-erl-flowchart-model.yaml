id: irl-erl-flowchart-model
name: The Internal / External Range Liquidity Model (flowchart)
definition: 'SHORTS EVIDENCE - three separate Shorts state the same four-step flowchart, which
  makes this the most repeated procedure in the unit. Step 1: establish a higher-timeframe
  (daily) bias. Step 2: drop ONE timeframe to locate internal range liquidity (a fair value
  gap) and external range liquidity (the highs and lows). Step 3: depending on which is already
  taken, anticipate the rotation - external to internal, or internal to external. Step 4:
  drop to the lower timeframe, wait for a stop raid and a change in the state of delivery,
  and target roughly 2R. One Short adds the gate that the whole thing must occur within a
  kill zone; another asks the question the same way - whether the reach into internal liquidity
  happened during a kill zone.'
variants:
  definition:
  - 'A complete, self-contained trade model given as a flowchart. Step 1: form a higher-timeframe
    bias. Step 2: given that bias, pick the pair - either internal range liquidity (a fair
    value gap) as the reaction point and a high or low as the target, or a high/low as the
    reaction point and a fair value gap as the target. Step 3: once that criterion is met,
    drop to the lower timeframe and require a stop raid followed by a change in the state
    of delivery. Step 4: target approximately 2R. Step 5: the whole sequence must occur inside
    a kill zone. He describes the model as simple and fairly mechanical because only a few
    things have to be determined.'
category: model
status: contested
aliases:
- external and internal range liquidity model
- IRL ERL model
preconditions:
- A higher-timeframe (daily) directional bias exists.
- The reach into the liquidity must occur inside a kill zone.
- 'A higher-timeframe directional bias (in the examples: a weekly candle closing over the
  previous, or a daily sweep-and-close-back-inside).'
- Both an internal (fair value gap) and an external (swing high/low) reference identified
  on the working timeframe.
detection_rules:
- 'Step 1: set the higher-timeframe bias.'
- 'Step 2: drop one timeframe and mark internal range liquidity (fair value gap) and external
  range liquidity (swing high / swing low).'
- 'Step 3a: bullish with internal liquidity in play -> require a swing low to form, target
  the external high.'
- 'Step 3b: external liquidity already taken -> anticipate rotation back into internal liquidity.'
- 'Step 4: on the lower timeframe wait for a stop raid, then a change in the state of delivery.'
- Target approximately 2R.
- 'Gate: the whole sequence must occur within a kill zone.'
- Establish the higher-timeframe bias first.
- Identify the internal range liquidity (fair value gap) and the external range liquidity
  (swing high/low) that the bias implies price will travel between.
- Wait for price to reach the reaction point implied by the bias.
- On the lower timeframe require a stop raid (a sweep of a low/high).
- Then require a change in the state of delivery (see cisd).
- Enter and target roughly 2R, or hold runners toward the external liquidity.
- All of it must occur within a kill zone.
invalidation:
- Taking out the higher-timeframe level the bias depends on (in the example, sweeping the
  daily low that was supposed to hold invalidates the idea).
- External liquidity already taken without a strong narrative - he states he then avoids it,
  since the next draw could be internal or the other side of the range.
measurable:
- hit rate of the internal->external and external->internal rotations per bias direction
- 2R hit rate of entries taken after the stop raid plus CISD
- hit rate of the 2R target once all five flowchart conditions are met
- how often all five conditions co-occur inside a kill zone per week
- difference in outcome when the strong-narrative override is used vs not
