id: london-reversal-profile
name: London Reversal / New York Continuation
definition: 'A Short equates the profile with a candle shape and, unusually for this corpus,
  attaches HOURS to the session: a London reversal is basically a classic expansion candle,
  and the manipulation leg is put in "during London or 2 to 5". Bullish: open, drop during
  London (2 to 5) to create the wick of the daily candle, change the state of delivery or
  get a market structure shift, and New York continues off London''s reversal. Bearish: open,
  high during London 2 to 5, CISD / MSS, New York continuation - completing the open-high-low-close
  of the daily candle. A second Short works it live on the 15-minute and 30-minute, and a
  third pairs it with the expansion-day test (small wick, large body) as the reason a New
  York continuation can be anticipated at all.'
variants:
  definition:
  - 'A daily profile in which the extreme of the day is formed during the London window (02:00-05:00)
    by a run counter to the intended daily direction, that run reaches a relevant higher-timeframe
    PD array, a change in the state of delivery occurs there, and the New York a.m. session
    then expands in the new direction for the rest of the day. The London leg forms the wick
    of the daily candle; the completed daily candle is Open-Low-High-Close (bullish) or Open-High-Low-Close
    (bearish). The speaker calls this daily shape a classic expansion candle.

    '
category: model
status: contested
aliases:
- London reversal
- London reverses New York continuation
- classic expansion candle (daily)
preconditions:
- A daily directional read.
- The London window (2 to 5) is in play.
- A directional daily bias exists (e.g. previous day swept a level and closed back inside
  forming a reversal candle, or price is drawing to a marked HTF level).
- The London window 02:00-05:00 and the New York a.m. window 08:30-12:00 are marked.
detection_rules:
- London window is given as 2 to 5.
- 'Bullish: open, then drop during London to create the daily candle''s wick.'
- Require a change in the state of delivery or a market structure shift out of that London
  extreme.
- New York then continues off London's reversal, completing the daily open-low-high-close
  (mirror for bearish).
- 'Worked live: if the 15-minute series of opposing candles is messy, step up to the 30-minute
  to get a clear series for the CISD.'
- Approaching New York, look for an opposing run back into the order block to get on side
  for the continuation.
- On an expansion day (small wick, large body), a London reversal licenses anticipating a
  New York continuation.
- Between 02:00 and 05:00 price runs counter to the intended daily direction and makes what
  will become the day's extreme.
- That London run reaches a relevant higher-timeframe PD array (this is what separates it
  from a New York Reversal).
- Price closes back through the opposing series of candles at that extreme (change in the
  state of delivery / market structure shift / inversion — the speaker treats these as interchangeable).
- The candles that were closed through form an order block used as the New York entry reference.
- During New York a.m., price continues in the post-CISD direction.
invalidation:
- London does not form the reversal - the day becomes a New York reversal or New York manipulation
  profile instead.
- Not explicitly stated. In one worked example price failed to displace beyond the target
  high and returned into the range; the speaker kept the idea alive on the basis of the order
  block mean threshold and midnight open holding, rather than declaring the profile dead.
measurable:
- frequency of the daily extreme printing inside the 2-to-5 window
- continuation rate into New York after a London CISD
- frequency of days whose extreme forms in 02:00-05:00
- hit rate of the 2R target when entering on the 08:30 opposing run
- how often the day's low/high completes near 09:30 or 10:00 (he calls both out as level-completion
  times)
