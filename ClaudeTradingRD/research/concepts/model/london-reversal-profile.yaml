  fractal: false
execution:
  bias: The direction of the London change in the state of delivery (i.e. opposite the side
    London swept).
  entry: Not on the London CISD. Wait for New York to produce an opposing run into London's
    order block (typically at 08:30) and enter there. If instead 08:30 runs in the SAME direction
    as the anticipated expansion, expect a retracement back into London's range first and
    enter on that retracement.
  stop: Beyond the extreme of the New York opposing run.
  targets:
  - 2R (his default in every worked example)
  - internal liquidity above/below
  - equilibrium of the higher-timeframe range
