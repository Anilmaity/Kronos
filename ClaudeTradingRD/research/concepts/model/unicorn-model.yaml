ambiguities:
- '''Overlapping'' is not quantified — any overlap appears to qualify.'
- Which of the two stop placements to use is left to risk-to-reward.
- He teaches the model and credits it to others; whether it is part of his own routine is
  not stated.
- '''Displacement'' is given no size, body-ratio or candle-count threshold.'
- '''Aligned with the breaker'' is not defined - whether the FVG must overlap, be contained
  by, or merely sit in the same price band is not stated.'
- No maximum delay is given between the session open and the formation of the entry function.
- The daily bias rule is given only for the case where price is sitting AT a daily FVG; no
  rule covers price at neither an FVG nor a swing.
- DTR uses the same pattern name but supplies an additional candle-count filter that Ash does
  not state.
- No minimum overlap between the breaker zone and the FVG is specified.
- Whether the FVG must be created by the displacement leg specifically, or any same-direction
  FVG in the zone qualifies, is not stated.
- Entry selection between the two candidate prices is explicitly discretionary.
