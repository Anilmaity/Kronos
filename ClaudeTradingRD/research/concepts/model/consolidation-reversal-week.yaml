ambiguities:
- The Short does not state which external level of the Mon-Wed range Thursday swept; it only
  says Thursday formed a reversal / candle 2 closure.
- Here Wednesday is a bearish expansion candle, yet the period is still called a "consolidation
  through Wednesday" - no rule reconciles an expansion day inside the consolidation leg.
- No Friday entry, stop or target is given; only the expansion is shown.
- The clip says 'consolidation or a retracement' and never decides which; both are treated
  as the same continuation signal.
- The lower timeframe used for the close-over check is not named ('zooming in').
- Again price trades 'a little bit lower' than the invalidation low with an SMT and still
  works; how far a break is tolerated is unstated - same ambiguity as the existing entry.
- The weekdays of the large and small ranges are not stated, only that the continuation is
  looked for on Friday; whether this is the Monday-Wednesday consolidation of the library
  definition is inferred from the title only.
- Whether Wednesday's close or Thursday's open defines the consolidation boundary is not stated.
- No rule handles a Thursday that sweeps both sides.
- No bound is given on how much movement disqualifies Mon/Tue/Wed from being a 'consolidation';
  the examples span a tight range, a doji day and a retracement described as 'large range
  to small range'.
- 'The take-out requirement is stated two ways in the same video: ''Monday''s high'' in the
  explanatory section, but ''the consolidation low'' and ''the swing low'' in the first worked
  example. Whether Monday''s extreme specifically must be swept is unresolved.'
- '''T-spot'' is shown as the indicator-marked area where price should react on the continuation
  day, but is never defined or derived.'
- The preference for Friday over trading Thursday is stated as personal preference, not a
  rule, so both are permitted.
- One example shows price dipping below the invalidation low with an SMT before still expanding;
  how far below is tolerable is not stated.
