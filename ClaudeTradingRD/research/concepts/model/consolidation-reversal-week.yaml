execution:
  bias: Toward the opposite side of the consolidation range, away from the Thursday manipulation.
  entry: Friday (preferred), after the hourly change in the state of delivery inside Thursday.
    The Thursday reversal day itself is tradeable but is explicitly the less-preferred option.
  stop: Beyond the Thursday extreme; the ideal Thursday candle 2 closure also forms a protected
    swing, which supplies the invalidation.
  targets:
  - the other side of the consolidation range / range high
  - previous highs or lows outside the range
  - higher-timeframe key level
  - average daily range
