id: consolidation-reversal-week
name: Consolidation Reversal (weekly profile) - the Thursday external-range protocol
variants:
  name:
  - Consolidation Reversal (weekly profile)
  definition:
  - 'SHORTS EVIDENCE. After a large-range move the following candles are read as a consolidation
    or a retracement ("a large range to a small range"), which is taken as a continuation
    signal toward the other side of the range / the range high. On the lower timeframe he
    finds the series of candles that made the low and asks whether price has closed over it;
    it has, so a continuation is looked for on Friday. The protected low must not be taken
    out; price is expected to form its lower wick in that area and trade higher. In the worked
    example price dips slightly below, with an SMT on the low, and still expands through the
    other side of the range.

    '
  - AM Trades' handling of a week that gives nothing early. If Monday through Wednesday produce
    no engagement of a higher-timeframe PD array and price is simply consolidating in an internal
    range, he calls for a Thursday consolidation reversal. On Thursday he marks out the external
    high and the external low of that three-day consolidation and looks for a manipulation
    of one of them, which then sets up the weekly profile and the expansion into Thursday
    and Friday.
  - 'The residual profile for a week that produced neither a classic expansion nor a midweek
    reversal. Monday, Tuesday and Wednesday consolidate - no expansion through Wednesday -
    and are marked as a consolidation range. Thursday then manipulates that range: in the
    bearish case it takes out Monday''s high and the previous day''s high and closes back
    below both, which the speaker reads as a candle 2 closure on Thursday; the bullish case
    is the mirror. Given an hourly change in the state of delivery inside Thursday''s range,
    Friday is the continuation / expansion day and is the day he prefers to trade, though
    the Thursday reversal itself may be traded as a small wick.

    '
definition: 'TTrades'' own Shorts walkthrough of a bullish consolidation reversal week. Wednesday
  prints a bearish expansion candle, and he explicitly refuses to call Wednesday the low of
  the week on that candle ("let another day play out"). Thursday then forms a candle 2 closure
  that is also ideal because it forms a protected swing in the same bar. With consolidation
  through Wednesday and a Thursday reversal, Friday is expected to expand. Confirmation is
  taken on the hourly: from Thursday''s low, price must close through the series of down-close
  candles (change in the state of delivery), after which a new continuation forms; Friday
  then expands higher off Thursday''s reversal.

  '
category: model
status: contested
aliases:
- Thursday consolidation reversal
- consolidation reversal
preconditions:
- Weekly bias exists (bullish in the worked case).
- Monday-Wednesday consolidate; Wednesday may itself be a bearish expansion candle.
- Monday to Wednesday with no higher-timeframe PD array engagement.
- Price consolidating in an internal range.
- No expansion through Wednesday, so a classic expansion week is ruled out.
- Because the week consolidated, a midweek reversal is also ruled out.
- A directional bias exists for the week.
detection_rules:
- Do not treat Wednesday as the weekly low/high when Wednesday is an expansion candle against
  the bias.
- Thursday must print a candle 2 closure (reversal); best case it is an ideal closure that
  also forms a protected swing.
- On the hourly, from Thursday's extreme, require a close through the series of opposing (down-close
  for bullish) candles.
- After that CISD, a new continuation (new protected swing) forms; then look for Friday to
  expand.
- Classify the candles after a large-range expansion as consolidation or retracement (large
  range -> small range).
- Target the opposite side of that range (the range high in the bullish case).
- On the lower timeframe, require a close over the series of candles that made the low before
  calling the continuation.
- The continuation day (Friday in the example) should form its lower wick above that low and
  trade higher.
- Confirm that Monday-Wednesday offered no trade and no HTF PD array engagement.
- On Thursday, mark the external high and the external low of the Monday-Wednesday range.
- Look for a manipulation (sweep) of one of those two levels on Thursday.
- Confirm with an hourly change in state of delivery, then trade the expansion away from it.
- Monday, Tuesday and Wednesday form a consolidation; a retracement or a small opposing run
  also counts, including a doji day that takes both sides of the range.
- Mark the consolidation range across those three days.
- Thursday takes out Monday's high (bearish) or Monday's low (bullish) AND the previous day's
  high or low, and closes back inside the range.
- That Thursday close-back-inside is the candle 2 closure.
- 'An hourly change in the state of delivery exists inside Thursday''s range: find the extreme,
  find the series of candles that made it, require a close through.'
- Friday is then traded as the continuation / expansion day.
invalidation:
- Wednesday's expansion candle is not a reversal - no profile is called on it.
- No hourly change in the state of delivery from Thursday's extreme.
- Price takes out the low the continuation was built from (tolerance for an SMT-marked marginal
  break is not quantified).
- No manipulation of either external level on Thursday.
- The candidate day closes as an opposing expansion candle - do not call the reversal, let
  another day play out.
- No hourly close-through inside Thursday - not confirmed.
- After the new continuation forms, price takes out the low (bullish case) that the continuation
  was built from.
measurable:
- Friday expansion rate when Thursday is an ideal C2 closure after a Mon-Wed consolidation
  vs a non-ideal one
- frequency of a Thursday sweep of a 3-day consolidation's external levels
- expansion size Thursday-Friday after such a sweep
- frequency of weeks where Mon-Wed consolidate and Thursday sweeps the range
- hit rate of Friday expanding to the opposite side of the range after a confirmed Thursday
  candle 2 closure
- how often Thursday takes out both Monday's extreme and the previous day's extreme, versus
  only one of them
- size of the Friday range relative to the Mon-Wed consolidation range
