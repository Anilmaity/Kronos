ambiguities:
- The EQ used is the EQ of the PREVIOUS DAY'S RANGE here; elsewhere in the corpus 'EQ' means
  the current candle's equilibrium / T-spot. Both appear in this unit.
- '''Respect the EQ'' is defined negatively (no hourly closures beyond it) but the timeframe
  for that closure test is only stated for the daily/hourly pairing.'
- The reversal-day wick gate reuses the unquantified small/large wick distinction.
- How far beyond the previous day's extreme to expect price to travel is said to depend on
  wick size, with no scale given.
- '''Half of the candle'' as the consolidation cut-off is the only timing quantifier given
  and appears once.'
- Whether the CISD must sit inside the wick specifically, or anywhere inside the closure candle's
  range, is not settled here.
- The reversal-day framework - the alternative when there is no daily C2 - is named but never
  specified in this unit.
- Whether the hourly CISD must sit inside the daily candle's wick or anywhere inside its range
  is not restated here.
- The New York 15-minute-CISD substitution for a reversal day is asserted in one sentence
  with no conditions attached, and he says a video on it is still to come.
- The candle-2 and candle-3 definitions are assumed from his other videos and are not restated
  mechanically in this unit.
- Whether the daily must be closed or may still be forming when the bias is taken is not stated
  consistently.
- The invalidation procedure is referred to but not given in this unit.
- Whether the hourly CISD must sit inside the daily candle's wick specifically is not restated
  here.
