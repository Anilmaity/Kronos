preconditions:
- A daily candle 2 or candle 3 closure exists, ideally also forming a protected swing.
- Previous day high, previous day low and previous day EQ are marked.
- A higher-timeframe candle 2 or candle 3 closure has printed.
- A daily chart with a completed or forming candle relative to the previous daily candle.
- A completed or forming daily candle with a defined relationship to the prior daily candle.
- A daily chart and an hourly chart of the same instrument.
detection_rules:
- Mark previous day high, previous day low, and the EQ of the previous day's range.
- 'Continuation branch: price must open, trade against the bias first, hold the EQ (no lower-timeframe
  closes beyond it), then trade through the previous day extreme.'
- 'Reversal branch: price must open, trade into the previous day extreme, then form a lower-timeframe
  CISD there.'
- 'Timeframe for that CISD by session: hourly or 30-minute in Asia/London; 5-minute or 15-minute
  in New York.'
- Points of interest are sought on the correct side of the EQ (below it for a bullish continuation)
  - do not guess which of several will react; wait for a swing / protected swing to form in
  that area.
- 'Reversal-day tradeability gate: small wick -> trade the reversal candle; large wick ->
  do not, trade the following candle instead.'
- A protected swing is only protected until it hits liquidity; a common pattern is liquidity
  taken, then the protected swing swept, then the true move.
- 'Fractal application: on the hourly use the previous candle''s high/low instead of the previous
  day''s; below the 4-hour it gets messy and he prefers not to frame reversals there.'
- Locate the extreme of the closure candle on the lower timeframe.
- Locate the series of same-direction candles that made that extreme.
- Require a close through that series. Until that close occurs the model is unconfirmed and
  no entry is valid.
- A CISD with no higher-timeframe candle closure is discarded.
- 'Quality test on the CISD: a fast V-shape is wanted. If price consolidates for half the
  candle and then closes over, treat it as consolidation rather than a confirmed reversal.'
- Find a candle 2 or candle 3 closure on the daily.
- Require a change in the state of delivery on the hourly in the same direction; until it
  prints, wait.
- With both present, the day's bias is set; only then drop to the execution pairing.
- If there is no daily C2, either stand aside or switch to the reversal-day framework.
- In the New York session a reversal day is entered off a 15-minute CISD rather than the hourly
  one.
- 'Daily candle 2: the daily sweeps the prior daily extreme and closes back inside, with a
  small wick.'
- 'Daily candle 3: the daily is the expansion candle following a candle 2.'
- Confirm with an hourly change in state of delivery in the same direction.
- Then confirm with the daily profile; if the profile does not confirm, intraday direction
  may oppose the daily bias.
- Wait for a daily candle 2 closure.
- Check the hourly for a change in the state of delivery inside it.
- Both present -> bias for that day in the direction of the closure.
- Either absent -> no bias.
invalidation:
- Price closes beyond the EQ of the previous day's range against the continuation bias.
- The day opens with the wrong extreme first for the intended bias.
- The lower timeframe makes a new extreme before closing through -- the old level is abandoned
  and the new series is tracked instead.
- No close through occurs before the higher-timeframe candle ends.
- No hourly CISD in the direction of the daily closure - the bias is not confirmed.
- No hourly CISD in the direction of the daily closure.
- The daily profile contradicts the daily closure.
- Covered by his separate invalidation-of-daily-bias lesson, not restated here.
measurable:
- hit rate of previous-day-extreme reversals vs continuations by prior-day closure type
- how often the EQ of the previous day's range is respected on continuation days
- reversal-day outcome bucketed by wick size (the missing threshold recoverable here)
- proportion of HTF closures that receive an LTF CISD within the same candle
- forward expansion of confirmed vs unconfirmed closures
- frequency of the consolidate-then-take-one-side failure mode
- share of days where daily C2/C3 plus H1 CISD is followed by expansion in that direction
- how often the hourly CISD arrives late enough to make the bias untradeable that day
- hit rate of the daily direction following C2 closure plus hourly CISD
- share of days where both conditions are met
