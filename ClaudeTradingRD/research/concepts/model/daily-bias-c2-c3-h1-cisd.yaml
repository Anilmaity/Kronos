id: daily-bias-c2-c3-h1-cisd
name: Daily Bias = Daily C2/C3 Closure Confirmed by H1 CISD
definition: 'The channel''s own ''mechanical framework'' for daily bias. Bias is a binary
  choice between a REVERSAL and a CONTINUATION, and the reversal is ALWAYS framed off the
  previous day''s high or previous day''s low - never an arbitrary level. REVERSAL: price
  opens, trades into the previous day high (bearish case) / low (bullish case), a lower-timeframe
  change in the state of delivery confirms the wick, and price trades back into the range
  toward the EQ of the previous day''s range or the opposite previous-day extreme. Whether
  the reversal DAY itself can be traded depends on wick size: small wick yes, large wick no
  - wait for candle 3. CONTINUATION: price opens, trades AGAINST the bias first, respects
  the EQ of the previous day''s range, then trades through the previous day''s extreme in
  the bias direction. ''Respect the EQ'' is operationalised as: no lower-timeframe (hourly)
  CLOSURES beyond that EQ level; the extreme itself need not reach the EQ. The whole procedure
  is fractal - on lower timeframes ''previous day high'' becomes ''previous candle''s high''.'
variants:
  definition:
  - 'The two-part gate that every setup in this unit passes through: a candle 2 (or candle
    3) closure on the higher timeframe, AND a change in the state of delivery inside that
    same candle on the paired lower timeframe. Neither half is sufficient. A closure without
    a lower-timeframe CISD is ''not a valid fractal model'' and he waits or ignores it; a
    CISD without a higher-timeframe closure ''does not mean anything''. He also gives the
    failure mode: when the CISD never forms, price typically consolidates and then takes one
    side of the range and trades to the other.'
  - 'Asked point-blank how to get a daily bias, he gives the two-step rule and calls it the
    easiest way to do it: a candle 2 or candle 3 closure on the daily, paired with a change
    in the state of delivery on the hourly - which he describes as simply running his model
    on the daily and hourly. He then walks it live on gold (candle 2 closure plus CISD, therefore
    bearish for the day) and on the dollar index in forex (range low swept, candle 2 closure,
    no hourly CISD yet so wait, CISD arrives, bias becomes bullish, only then drop to 4-hour
    / 15-minute). Asked what to do when there is no daily C2, the answer is that you either
    do not trade or you trade a reversal day, which requires a separate framework.

    '
  - 'The stated easiest method for obtaining a daily directional bias: look at the daily chart
    for a candle-2 or candle-3 closure and confirm it with a change in state of delivery on
    the hourly chart. That combination is the bias. Equilibrium, phases of price and relevant
    swings are added afterwards for refinement, and the bias must then be confirmed by the
    daily profile.

    '
  - 'Stated in this unit as the answer to ''can you elaborate daily bias through the fractal
    model'', and named by him as the easiest, most mechanical way to get bias within his model:
    go to the daily and the hourly, wait for a daily candle 2 closure, then check whether
    a change in the state of delivery exists on the hourly. If both are present, that is the
    day''s bias. He immediately qualifies it - it is not always correct, which is why he keeps
    a separate lesson on trading the invalidation of a daily bias, findable on his site by
    searching for ''invalidation''.'
