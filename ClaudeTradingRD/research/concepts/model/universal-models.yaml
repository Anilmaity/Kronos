id: universal-models
name: Universal Models (internal->external, external->internal, order-pairing ranges)
definition: 'GxTradez''s three frameworks, learned from the mmxm trader, each of which names
  a key level and the target that follows from reaching it. Internal to external: price hits
  internal range liquidity (a fair value gap), reverse and target the external high/low that
  caused the retracement into the gap. External to internal: price reaches or manipulates
  a range high, retrace back into the range — that fair value gap becomes the first target
  regardless of whether it then reverses or continues to the opposing side. Order-pairing
  / manipulation ranges: the key level is a range high or low, and the target is the opposing
  side of the range.'
category: model
status: specified
aliases:
- universal model
- order pairing ranges
- manipulation ranges
detection_rules:
- 'Internal to external: key level = a fair value gap inside the range; target = the external
  extreme that caused the retracement into it.'
- 'External to internal: key level = a range high/low that is reached or manipulated; first
  target = the fair value gap inside the range.'
- 'Order-pairing ranges: key level = a range high or range low; target = the opposing side
  of the range / the opposing swing.'
- A framework alone is not a trade — it must be confirmed by a swing formation (candle 2 or
  candle 3 closure) AND by SMT.
invalidation:
- No swing formation and no SMT at the key level — the framework is not confirmed.
measurable:
- hit rate of the first target per model type
- share of key-level touches that carry SMT
sources:
- video_id: 3eVxTV_7L2U
  title: A Complete Trading Framework (Universal Models, SMT, Swing Points) | GXT
  quote: the market cannot reverse without a swing formation
- video_id: 3eVxTV_7L2U
  title: A Complete Trading Framework (Universal Models, SMT, Swing Points) | GXT
  quote: mechanically defined as closing over the body of candle 2
- video_id: 3eVxTV_7L2U
  title: A Complete Trading Framework (Universal Models, SMT, Swing Points) | GXT
  quote: It is simply when candle 2 closes back inside of candle 1's range
ambiguities:
- '''Order pairing ranges'' and ''manipulation ranges'' are used as synonyms without a stated
  difference.'
- No rule selects which of the three frameworks is operative when price sits between an FVG
  and a range extreme.
- This is a guest's synthesis of the mmxm trader's material, not TTrades' own framing.
