id: tradingview-chart-workspace
name: TradingView Chart, Template And Shortcut Setup
definition: 'A full walkthrough of the workspace the rest of the corpus is charted in. CHART
  SETTINGS: status-line title, logo and OHLC values all off (the symbol, timeframe, date and
  his name come instead from an added watermark indicator), indicator titles on so they can
  be toggled; green up-candles with everything else black including body and wick; electronic
  trading on, adjust for contract changes on, settlement off, New York local time; solid background
  (#F5F5F5), no grid lines, dotted light-grey crosshair at 100% opacity, price scale numbers
  stacked on the left; trading buy/sell buttons and instant order placement off; all events
  off except alert lines. TEMPLATES: indicator templates are saved and starred so they appear
  as one-click buttons - a clean template that strips everything back to the watermark, a
  three-day-lookback template, an open-high-low-close template, a time-levels template with
  only three time periods enabled, plus power-of-three, weekly-candle power-of-three and kill-zones-and-pivots
  templates. Drawing templates are saved the same way, each with a fixed colour and thickness:
  breaker / mitigation block rectangles, fair value gaps, deviations from a range, buyside
  and sellside liquidity lines, order blocks (blue, thickened), SMT with separate high and
  low templates, buy stops and sell stops, a premium/discount box built on price levels 0,
  0.5 and 1, OTE levels, projections (font size 10, near-transparent background) and a risk-reward
  tool saved separately for long and short. SHORTCUTS: alt+R resets the price axes, alt+click
  focuses a pane, tab cycles panes, shift+F toggles full screen, ctrl+shift+S copies the chart
  image to the clipboard, ctrl+scroll is focus zoom, holding ctrl activates magnet mode on
  demand, holding shift constrains a line to straight / 45 degrees, middle-click deletes a
  drawing, ctrl+drag duplicates one, and the period key loads a saved layout. Finished analysis
  is grouped in the object tree, then locked and hidden - with the caveat that ''remove all
  drawings'' deletes those hidden groups too.'
category: model
status: specified
aliases:
