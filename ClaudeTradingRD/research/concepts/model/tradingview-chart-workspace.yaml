preconditions:
- TradingView as the charting platform.
detection_rules:
- 'Status line: title, logo and OHLC values off; indicator titles on.'
- 'Candles: green up-close; body, borders and wicks of down-close candles black.'
- 'Data: electronic trading on, adjust for contract changes on, settlement off, New York local
  time.'
- 'Canvas: solid #F5F5F5 background, no grid lines, dotted light-grey crosshair at 100% opacity,
  scale numbers stacked left.'
- Trading panel buttons and instant order placement off; all events off except alert lines.
- Save and star indicator templates so they load in one click; keep a 'clean' template that
  shows only the watermark.
- 'Named templates in use: clean, 3-day lookback, open-high-low-close, time (three time periods
  only), power of three, weekly candle power of three, kill zones and pivots.'
- Add the watermark indicator to every template so symbol, timeframe, date and name are always
  displayed.
- Save a drawing template per PD-array type with a fixed colour, so colour identifies the
  object type.
- Premium/discount box is a three-level tool at price levels 0, 0.5 and 1.
- 'Projection tool: levels marked, font size 10, background near-transparent, one colour reused
  for every level.'
- 'Risk-reward tool: identical settings saved separately as a long-position and a short-position
  template.'
- Group finished analysis in the object tree, lock it, then hide it - but never use 'remove
  all drawings', which deletes hidden groups.
- Keep drawings synced across the layout so a level drawn on one pane appears on the others.
invalidation:
- Not applicable - workspace configuration.
measurable:
- not a market-measurable concept; it fixes the data and display the other concepts are read
  from
