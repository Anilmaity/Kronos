ambiguities:
- Most hex codes and the drawing colours are shown on screen at the end of the video and are
  never spoken, so only the background (#F5F5F5) is recorded here.
- The time indicator is set to 'three time periods' but WHICH three is never said aloud -
  this is the closest the corpus gets to naming his session windows and it stops short.
- The kill-zones-and-pivots indicator is present as a template, but no kill-zone hours are
  stated anywhere in this video.
- The 'AG gfx Watermark' name is an auto-caption rendering.
- This is a tooling video from an earlier era; several of the templates shown (OTE, kill zones,
  premium/discount box) are tools the later material says he no longer uses - see ttfm-minimal-toolkit.
