ambiguities:
- No resolution rule is given when autobias 1 and autobias 2 disagree; it is left to discretionary
  bias.
- How the governing higher-timeframe direction is computed (last closure? last CISD?) is not
  stated.
- 'Corpus conflict: elsewhere he says the exact timeframe alignment does not matter as long
  as all timeframes point the same way, while autobias enforces a fixed one- or two-step relationship
  (see timeframe-alignment-pairs).'
- 'Contrast with the autobias recommendation elsewhere: the filter exists, but its author
  does not use it.'
