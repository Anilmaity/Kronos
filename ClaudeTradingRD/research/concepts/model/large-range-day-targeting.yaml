id: large-range-day-targeting
name: Trade Only Large-Range Trending Days
definition: 'The selection objective the whole three-step process serves. Only days expected
  to produce a large-range trending daily candle - a day with a clear direction, low resistance,
  and intent to travel far in one direction - are candidates. Every other day is deliberately
  skipped, and the claimed second-order benefit is easier trade management, easier target-hitting
  and less mental strain.

  '
category: model
status: underspecified
aliases:
- large range daily candle
- low resistance day
preconditions:
- The week's economic calendar has been tiered.
- The daily phase of price delivery has been classified.
- A weekly profile is available to align with (not on Monday).
detection_rules:
- Step 1 - from the calendar, mark the days most likely to produce a large range (days after
  a high-impact event; never Monday).
- Step 2 - from the daily chart, confirm the phase permits an expansion (an expansion cannot
  directly follow an expansion).
- Step 3 - confirm the weekly profile and take only continuation trades on the days it implies.
- 'Expectation is not permission: a day marked eligible still requires price confirmation,
  and no trade is taken without it.'
invalidation:
- Price fails to confirm on an eligible day - skip the day rather than lower the standard.
measurable:
- realised daily range of selected days versus unselected days
- proportion of days per month passing all three filters
- drawdown endured per trade on selected versus unselected days
sources:
- video_id: QmGJFxfSHxM
  title: AM Trades | Blending The Economic Calendar, Daily Chart, & Weekly Profiles
ambiguities:
- '''Large range'' is never quantified - no ATR multiple, point threshold or percentile is
  given, which is why this entry is marked underspecified.'
- '''Low resistance'' is used descriptively and never defined.'
- The three steps are ordered but no rule states what to do when they disagree.
