ambiguities:
- Both Shorts are excerpts of SF61vCsBl1A (identical wording), which the library already cites.
  The library already holds the rule that a non-ideal candle 2 followed by a candle 3 closing
  through the series is an ideal formation for trading candle 4. These clips add sources,
  not rules.
- In DMOVzdGZtsU candle 3 closes over three things at once (the series level, candle 2's high
  and the range high). Which of them is required is not separated; the library rule needs
  only the series level.
- '"Aligns pretty well with this opposing candle" does not say which level of the opposing
  candle (open, body or extreme) is meant.'
- zIpL5N8AMig calls the candle 2 closure "not even very bearish" in a bullish setup. This
  reads as a slip or caption error for "bullish". The point is that the C2 was weak.
- '"We have failure swings right here" is given as the reason the non-ideal C2 could still
  be traded. Whether the failure swings are the target or the point of interest is not said.'
- Neither Short names the timeframe.
- '"The opening price" is not identified - the opening price of the up-close series (as in
  the library entry) or of the new candle; the Short does not say.'
- Timeframe of the EbH-sjWak74 example is not stated in the transcript.
- No new content; the library already carries 'a non-ideal candle 2 followed by a candle 3
  that closes through the series is an ideal formation for trading candle 4' and the two marked
  levels.
- '"Candle three closing strong" is not quantified; the timeframe of the example is not spoken.'
- The Short does not bound the 'series of opposing candles' - the worked example happens to
  contain exactly two.
- Whether the required close is a body close or a wick close is not stated in either Short.
- The PDF he refers to ('what did we learn in the PDF') is not in the corpus, so the canonical
  wording is not recoverable here.
- '''Series of opposing candles'' is not bounded -- in the stop-loss video he says he will
  ignore small candles and take ''this whole move up'' when the structure is messy, but no
  candle count or range test is given.'
- Whether the closure must be a body close through the series, or a wick through, is not stated
  (all worked examples are body closes).
- '''Shallow wick'' in the following candle is unquantified.'
