id: ideal-formation
name: Ideal Formation (closure and protected swing in the same bar)
definition: 'Two more Shorts restate the ideal candle 2 closure: price at a point of interest
  sweeps a (small) high, and the candle 2 closure also closes through the series of up-close
  candles (bearish case) - "in this case, it''s just one" - so it forms a protected swing
  and a candle 2 closure together. The levels then marked for the next candle are the opening
  price and the EQ; price should form its next high in that area as a shallow high and then
  trade lower. The second Short applies the same label to a daily Thursday C2 inside a consolidation
  reversal week.

  '
variants:
  definition:
  - 'The Shorts restatement of the ideal formation, delivered as an explicit negative case.
    A candle 2 closure is NOT ideal merely because it closes over candle 1''s body; it is
    ideal only when the same bar simultaneously creates a protected swing, which means closing
    over the series of opposing (down-close, in the bullish case) candles that traded into
    the point of interest. The worked counter-example identifies the two down-close candles
    that reached the fair value gap and states price would have had to close over that level
    to qualify. A second Short gives the positive case: the ideal continuation is one where
    the swing point and the protected swing are formed by the same V-shaped recovery.

    '
  - 'Gold, daily: the low that formed is a protected low and also the candle closure - an
    ideal formation (he points viewers to the ''ideal formation'' graphic on his website).
    He expects expansion or continuation and wants 50% of that candle and the daily EQ level
    respected. On the hourly the next day a continuation formed and failed, the marked level
    was respected, candle 2 closure expanded. This is why he will not be bearish gold.'
  - 'An ideal formation is a candle 2 or candle 3 closure that SIMULTANEOUSLY creates a protected
    swing -- i.e. the same closure that sweeps candle 1 and closes back inside also closes
    through the series of opposing candles that reached the point of interest. He teaches
    it explicitly as a correction: most people call a candle 2 ideal because it closes over
    candle 1''s body, and that is wrong. The payoff is that the next candle can be traded
    immediately, without waiting for a separate lower-timeframe confirmation, and it comes
    with two levels to mark: the opening price of the series of opposing candles, and the
    EQ of the closure candle.'
category: model
status: contested
aliases:
- ideal candle to closure
- ideal swing
- ideal candle two closure
- ideal candle three closure
- TTrades ideal formation
preconditions:
- Price is at a point of interest.
- A small high (bearish case) is swept.
- A point of interest is present at the extreme (fair value gap, or a high/low to be swept).
- A candle 2 or candle 3 closure has formed.
detection_rules:
- Candle 2 closure that closes through the series of up-close candles (bearish) - a single
  up-close candle is enough.
- Mark the opening price and the EQ; the next candle's high should form in that area and be
  shallow.
- Locate the extreme of the closure candle and the series of opposing candles that traded
  into the point of interest.
- Ideal iff the closure candle closes beyond that series in the same bar as the candle 2 closure.
- Closing over candle 1's body alone is explicitly stated NOT to make the closure ideal.
- In a continuation, the ideal case is a V-shape recovery that forms the swing point and the
  protected swing together.
- After an ideal formation, require price to respect 50% of the candle and the daily EQ.
- Identify the extreme of the closure candle and the SERIES of opposing candles that made
  that extreme (a single candle if there is only one).
- Ideal iff the closure candle's close is beyond the opening price of that series, in the
  same bar as the candle 2 / candle 3 closure.
- Not ideal if the candle merely closes over candle 1's body without closing through that
  series.
- 'The formation may complete late: a non-ideal candle 2 followed by a candle 3 that closes
  through the series is an ideal formation for trading candle 4.'
- 'Mark two levels for the next candle: the opening price of the series of opposing candles,
  and the EQ of the closure candle. The next candle''s wick should form there and be shallow.'
- An ideal formation is still not a trade on its own -- a point of interest is still required;
  it cannot be pattern-traded.
invalidation:
- The next candle's high does not hold in the opening-price / EQ area.
- The closure clears candle 1's body but not the opposing-candle series into the point of
  interest.
- The next candle's wick trades beyond the marked opposing-candle opening price / EQ band.
- The closure did not reach a point of interest.
measurable:
- next-candle retest-and-reject rate at the opening price / EQ after an ideal C2
- share of candle 2 closures that also clear the opposing-candle series
- expansion of the following candle, ideal vs not ideal
- frequency of ideal vs non-ideal C2 closures
- expansion of the following candle, ideal vs non-ideal
- hit rate of the marked opposing-candle-open / EQ band containing the next candle's wick
