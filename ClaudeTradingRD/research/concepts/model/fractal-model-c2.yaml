id: fractal-model-c2
name: Candle 2 Closure (the reversal candle)
variants:
  name:
  - Candle 2 Closure
  definition:
  - 'PRIMARY-SOURCE DEFINITION (this is the channel''s own dedicated lesson). The model has
    exactly two closure types, candle 2 and candle 3, and they are distinguished by where
    the candle CLOSES relative to the previous candle''s extreme. A REVERSAL closure (= candle
    2) sweeps the previous candle''s high or low and then closes back INSIDE the previous
    candle''s range. A CONTINUATION closure closes BEYOND the previous candle''s extreme.
    A candle 2 closure alone is not a signal: it must occur at a higher-timeframe key level
    / point of interest (a fair value gap, or a high or low being swept), and it must be confirmed
    by a change in the state of delivery on the aligned lower timeframe before candle 3 is
    traded.'
  - 'The swing-point candle of the fractal model. Mechanically, candle 2 trades beyond candle
    1''s extreme (a sweep) and closes back inside candle 1''s range. In the playbook he states
    it categorically: candle 2 is always the swing low or the swing high, candle 1 is the
    candle before it, candle 3 the one after. A candle 2 closure is never tradeable on the
    closure alone -- it must be paired with a change in the state of delivery inside that
    candle on the paired lower timeframe, which is what confirms the wick has formed. Whether
    the candle 2 itself is tradeable, or only the candle 3 that follows it, is decided by
    wick size: a small wick supports expansion inside candle 2, a large opposing run does
    not and forces the trader to wait for candle 3.'
  - 'Across five Shorts the candle 2 closure is presented as a two-part gate that is used
    to PRUNE marked swings, not to generate them. Part one: price must sweep the previous
    candle''s extreme and close back inside it (equivalently, close below the body of candle
    2 in the bearish case). Part two: the sweep must have occurred AT a point of interest
    - a swept high/low or a fair value gap. A closure that satisfies one but not the other
    is removed from the chart. A third, discretionary step removes a mechanically valid closure
    whose swing sits too close to an adjacent swing. The same test is applied on the 5-minute
    chart, which he uses to state that the validation is fractal and applies on any timeframe.

    '
  - 'C2 is the higher-timeframe candle that sweeps the prior candle''s extreme and closes
    back inside it, producing a reversal shape: the candle opens, makes its extreme against
    the intended direction, and reverses. C1 is explicitly arbitrary and is never analysed
    on its own; it is simply whatever precedes C2. A C2 closure licenses looking for a C3
    expansion in the intended direction.

    '
  - 'The reversal candle in the fractal model, used here as the bias-setting event on whatever
    timeframe it is found. In these walkthroughs a candle 2 closure is a candle that sweeps
    the prior candle''s extreme (or a nearby consolidation extreme) and closes back in the
    opposite direction, producing the aggressive-in / aggressive-out signature on the timeframe
    below. Its function is directional: a bearish candle 2 closure on the monthly makes the
    question "is price more likely to reach the previous month''s high or the previous month''s
    low", and the answer becomes the draw. A candle 2 closure is called *ideal* when it additionally
    forms a protected swing. A candle 2 closure is not acted on until it is confirmed by a
    change in the state of delivery on the timeframe below, and the trade taken from it is
    normally the following candle''s continuation rather than the reversal itself.

    '
  - 'The primary-source statement of the model''s trigger, given as the opening premise of
    the intraday strategy video: the whole goal is to anticipate one candle''s open-high-low-close
    or open-low-high-close. The trigger that licenses that anticipation is the previous candle
    sweeping a level and closing back inside; with that sweep and closure back in, the NEXT
    candle is anticipated to expand away from the sweep. The direction is therefore supplied
    by the swept side - a swept high implies a bearish expansion candle, a swept low a bullish
    one - and is then cross-checked by lower-timeframe alignment and by the draw the trade
    is travelling toward.'
  - 'Referred to throughout these live streams as an already-taught building block rather
    than re-derived. A candle two closure is the mechanical swing-point definition on the
    higher timeframe candle - price trades beyond the prior candle''s extreme and closes back
    inside it. Once a change in state of delivery confirms it on the lower timeframe, the
    following candle is a candle three in the new direction.

    '
definition: 'SHORTS EVIDENCE. The cleanest, most compressed statement of the C2 test in the
  corpus, with worked negative examples. A candle 2 closure requires price to take out its
  PREVIOUS CANDLE''S high and then close back BELOW it (bearish), or take out the previous
  candle''s low and close back ABOVE it (bullish). The negative test is stated twice on chart:
  a swing point where price swept the previous high but never closed back below it is NOT
  a candle 2 closure and is removed. Confirmation of a daily C2 is taken on the aligned lower
  timeframe as a change in the state of delivery, and the concept is explicitly fractal -
  the same C2-at-a-point-of- interest pattern appears on the hourly chart and marks where
  the high of day forms.'
category: model
status: contested
