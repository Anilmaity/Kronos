preconditions:
- A completed previous candle with a defined high and low on the same timeframe.
- 'For the fractal/hourly application: the sweep occurs at a point of interest.'
- A previous candle (candle 1) with a defined high and low.
- A higher-timeframe point of interest at the extreme.
- A candle 1 exists with a defined high and low.
- A point of interest (fair value gap, or a swing high/low) is present at the extreme, on
  the daily and lower; on the 4-hour a point of interest is preferred but not required.
- A prior candle with a defined high and low exists (C1).
- A prior candle with a defined high and low, or a consolidation with a defined range.
- A phase classification for the leg into the candle (expansion into the level).
- A prior candle (C1) with a defined extreme to be swept.
- A completed prior candle with a defined high and low.
detection_rules:
- 'Bearish C2: high[i] > high[i-1] AND close[i] < high[i-1].'
- 'Bullish C2: low[i] < low[i-1] AND close[i] > low[i-1].'
- A sweep of the previous extreme WITHOUT the close back inside is not a C2 - discard it.
- Validate a higher-timeframe C2 by finding a change in the state of delivery on the aligned
  lower timeframe.
- After a valid C2, price must continue to respect the previous candle's range for the read
  to stand.
- 'Fractal: the same test on the hourly chart at a point of interest marks the candidate high
  (or low) of day.'
- An 'ideal' C2 is one where the closure also protects a swing - it closes over the down-close
  candles into the fair value gap, leaving that low protected.
- 'Bullish C2: the candle trades below candle 1''s low AND closes back above candle 1''s low.'
- 'Bearish C2: the candle trades above candle 1''s high AND closes back below candle 1''s
  high.'
- If the candle closes BEYOND candle 1's extreme instead, it is a continuation closure, not
  a C2.
- 'Validity gate: the sweep must occur at a point of interest - a fair value gap, or a high/low
  being taken out. Without one, it is not a valid C2 (''I need a point of interest to frame
  a candle closure'').'
- 'Confirmation gate: a change in the state of delivery must form inside candle 2 on the aligned
  lower timeframe before candle 3 is traded.'
- 'Quality: C2 should itself be a reversal (open-low-high-close for a bullish C2). A C2 with
  a shallow wick that already expanded is valid but does not set up candle 3 well.'
- 'If C2 has a large wick, watch the upper (bullish) / lower (bearish) half of that wick:
  candle 3''s wick must respect 0.5 of it or the swing point is unlikely to form.'
- Candle 2 trades beyond candle 1's high (bearish case) or below candle 1's low (bullish case).
- Candle 2 closes back inside candle 1's range.
- Drop to the paired lower timeframe and require a change in the state of delivery inside
  candle 2 before the closure counts as confirmed.
- 'Classify the candle 2 by wick size: an expansion candle has a small wick each side and
  a large body; a reversal candle opens, makes a large opposing run to form its wick, then
  returns toward its opening price before closing.'
- Small wick -> candle 2 itself may be traded for expansion. Large opposing run -> do not
  trade candle 2; let it close and trade candle 3.
- A candle 2 closure that occurs on both the bullish and bearish side is resolved by the higher-timeframe
  bias; the side against bias is ignored.
- An ideal candle 2 closure additionally closes through the series of opposing candles that
  reached the point of interest, creating a protected swing in the same bar (see ideal-formation).
- 'Candidate: price trades beyond the previous candle''s extreme and closes back inside that
  candle''s range.'
- Gate 1 - a point of interest must be present at the sweep (a swept previous high/low, or
  a fair value gap traded into).
- Gate 2 - the closure must be a valid candle 2 (or candle 3) closure; neither alone is sufficient.
- If either gate fails, discard the swing rather than trading it.
- 'Discretionary third step: discard a mechanically valid swing that sits too close to an
  adjacent same-side swing.'
- The test is applied identically on any timeframe, including the 5-minute.
- 'For a bullish C2: price trades below the previous candle low and closes back above it.'
- 'For a bearish C2: price trades above the previous candle high and closes back below it.'
- 'The candle''s own shape must be a reversal: open, then the extreme against the intended
  direction, then close in the intended direction.'
- If C2 produced no CISD on the lower timeframe, a V-shape is required instead, plus a subsequent
  continuation.
- The candle trades beyond the prior candle's extreme (or sweeps the consolidation extreme)
  and closes back inside, against the direction of the sweep.
- 'Bearish candle 2 closure: sweeps the high and closes down. Bullish candle 2 closure: sweeps
  the low and closes up.'
- The candle is called ideal if it also forms a protected swing.
- Confirm on the timeframe below with a change in the state of delivery inside the candle
  2 before acting.
- Read the confirmation on the bodies (stated for the hourly confirmation on the dollar example).
- C2 trades beyond the prior candle's extreme (the sweep) and closes back inside it.
- Direction of the anticipated expansion := away from the swept side.
- Then require the paired lower timeframe to align in that same direction, via a closure through
  the series of opposing candles (see cisd and timeframe-alignment-pairs).
- Where the higher-timeframe read is conflicted (e.g. bullish structure but a previous day
  high just taken), fall back on the daily profile to resolve it.
- The anticipated shape of the expansion candle is open-high-low-close (bearish) or open-low-high-close
  (bullish).
- Price trades beyond the prior candle's extreme and closes back inside its range.
- He prefers, but does not require, that the C2 closure forms from a key level; on the 4-hour
  and daily it does not always need to.
- A C2 with a small wick supports expansion; a C2 with a large wick suggests a trade back
  to the opening price instead.
- On a C2 with a large wick, mark 0.5 of the wick and expect price to reach it before delivering
  away.
- Once a change in state of delivery confirms the C2, the following candle is a candle three.
invalidation:
- Price fails to respect the previous candle's range after the C2 closure.
- Candle 3 fails to respect 0.5 of candle 2's wick.
- No point of interest at the sweep.
- No lower-timeframe CISD inside candle 2.
- No change in the state of delivery forms inside the candle 2 on the lower timeframe -- the
  swing point is not confirmed and the model does not print.
- Price closes back outside candle 1's range in the direction of the sweep (it was expansion,
  not manipulation).
- The protected swing formed at the candle 2 extreme is taken out.
- Price does not close back inside the previous candle's range.
- The candle opened, moved in the intended direction first, and then continued - i.e. no reversal
  shape. Not a valid C2 even if the closure levels line up (Qv6Ux_Z8VrA, 4H example).
- C2 is also the expansion candle (reversal and expansion blended into one candle) - the following
  candle then sets up at lower probability and often begins a new phase of price.
- C3 fails to close beyond the open of C2 - the sequence produces nothing.
- The extreme of the candle 2 is taken out after the closure.
- No change in the state of delivery forms inside the candle 2 on the timeframe below - not
  confirmed, no trade.
- The lower timeframe failing to close through the series of opposing candles - alignment
  is absent and the setup is not live.
- The higher-timeframe wick failing to form in the t-spot / price returning beyond the wick
  extreme.
- The candle closes outside the prior candle's range - expansion, not a C2 closure.
measurable:
- share of C2 closures followed by a C3 continuation in the same direction
- hit rate of 'high of day' when an hourly C2 forms at a point of interest
- base rate of C2 closures per month by timeframe
- expansion in candle 3 conditional on C2 having / not having a point of interest
- expansion in candle 3 conditional on the lower-timeframe CISD being present
- rate at which a daily C2 closure is followed by an LTF CISD inside it
- expansion range of C2 conditioned on wick-to-body ratio
- hit rate of trading C2 directly vs waiting for C3
- fraction of raw sweeps that survive both gates
- follow-through of surviving vs discarded closures
- Count of C2 closures per month per timeframe.
- Hit rate of C3 closing beyond the C2 open.
- Conditional hit rate when C2 is also an expansion candle vs a pure reversal candle.
- count of candle 2 closures per month per timeframe
- hit rate of the previous-period-extreme draw following a confirmed candle 2 closure
- difference in follow-through between ideal (protected-swing-forming) and ordinary candle
  2 closures
- share of sweep-and-close-back-inside candles followed by an expansion candle in the anticipated
  direction
- how often the paired lower timeframe confirms alignment before the expansion is over
- hit rate of 2R entries taken only after alignment vs immediately on the closure
- C2 formation frequency per timeframe
- outcome split by whether the C2 formed at a key level
- outcome split by C2 wick size
