ambiguities:
- Body close versus wick close is implied by 'close back below' but never stated explicitly.
- Which lower timeframe is 'the aligned timeframe' for confirmation is not given in these
  Shorts.
- 'TRANSCRIPT ARTIFACT: the auto-captions render ''candle 2'' as ''candle to'' throughout;
  quotes are preserved verbatim including that artifact.'
- '''Closes back inside the previous candle''s range'' is stated as closing back above/below
  candle 1''s LOW/HIGH specifically - so a close inside candle 1''s body is not required.
  This is more permissive than some Q&A-derived readings in the library.'
- Whether the sweep must be a wick-through or can be a full trade-through is not stated.
- '''Point of interest'' is enumerated (fair value gap, high, low) but not ranked; the video
  also allows opposing candles to serve as one, calling that ''more advanced''.'
- The exact requirements for C2/C3/C4 in the indicator are explicitly deferred to the paid
  course ('I go over all the requirements for these within my course and mentorship').
- '''Small wick'' vs ''large opposing run'' is never given a numeric threshold (no wick-to-body
  ratio, no percentage of range) anywhere in this unit, despite the whole trade/no-trade decision
  resting on it.'
- Whether the sweep must be of candle 1's wick extreme or its body extreme is not stated.
- The auto-captioner renders 'candle 2' as 'candle to' in the Weekly Profile series; in this
  unit the numeral is transcribed correctly throughout.
- The 'too close' discard step is explicitly discretionary ('does it make sense... probably
  not') with no distance threshold.
- The Shorts do not say how far left a point of interest may be drawn from; one example reaches
  back to a monthly-chart high.
- '''Closes back inside'' is shown but never stated as body-close vs wick-close.'
- '''Reversal shape'' is judged visually; no ratio of wick to body is given to separate a
  reversal candle from an expansion candle.'
- The blended reversal+expansion warning has no threshold for how much expansion disqualifies
  C2.
- Whether the sweep must be a wick or may be a body close outside is not stated.
- These videos refer back to a separate candle 2 lesson and never restate the definition in
  full; the reconstruction above is from usage across the three walkthroughs.
- 'Whether the sweep must exceed the prior candle''s extreme or merely a nearby liquidity
  pool is used inconsistently: previous day low in #2, a consolidation low in #2, and previous
  month''s structure in #3.'
- Whether the closure must be a body close back inside is not explicitly stated, though the
  speaker does say to focus on the bodies for the hourly confirmation.
- The auto-transcript renders candle 2 as candle to throughout video IzOQmcgLyA0.
- The numbering 'candle 1 / candle 2 / candle 3' is never spoken in this video; the sequence
  is described as 'this first candle' and 'this candle', so the mapping to C1/C2/C3 is inferred
  from the rest of the corpus, not stated here.
- Which level C1's sweep must be of (its own extreme, a swing, a session level) is not specified.
- Whether the closure back inside must be a body close is not stated.
- The 'conflicted bias -> use the daily profile' escape hatch is named but the daily profile
  procedure is not restated.
- The definition is assumed knowledge in these streams and never fully restated - the sweep-and-close-inside
  reading here is assembled from how he uses it, and should be corroborated against the dedicated
  C2 videos.
- '''Key level'' preference is stated without a rule for when it becomes mandatory.'
- Whether a body close or a wick close inside the range is required is not stated.
