id: smart-money-reversal
name: Smart Money Reversal
definition: 'The turn at the low or high of a market maker model — the point at which the
  curve switches from the sell side to the buy side (or vice versa). It is used as a known
  term throughout the unit and its components are listed once — change in state of delivery,
  inversion, market structure shift, and a short-term low being put in — but it is never given
  a formal definition or an ordering requirement.

  '
variants:
  definition:
  - 'Finessee_Fx states one rule about the smart money reversal and repeats it three times
    in the session, unprompted and then again in answer to a direct question: the smart money
    reversal in a market maker buy or sell model ALWAYS happens at a higher-timeframe PD array.
    It is not located by structure, by session or by time - it is located by asking which
    higher-timeframe array price has arrived at. In his two worked examples the array is a
    monthly bearish order block blended with a monthly bearish breaker, and a sell-side imbalance
    visible to the left.

    '
category: model
status: contested
aliases:
- SMR
- the reversal point
- the turn of the curve
- the reversal of the market maker model
preconditions:
- 'Price has reached a higher timeframe level (examples: a weekly fair value gap, an hourly
  fair value gap, equal highs).'
- A market maker model (buy or sell) is in progress with its original consolidation and distribution
  legs identifiable.
- Higher-timeframe PD arrays have been mapped and extended forward in time.
detection_rules:
- 'Components listed by the speaker at the reversal: a change in state of delivery (close
  through the opposing candle series), an inversion (a fair value gap closed through), a market
  structure shift, and a short-term low (or high) being put in.'
- 'Practical test used in the gold example: a close over the bearish fair value gap AND a
  close over the series of down-close candles, followed by a short-term low forming.'
- After the reversal, the prior side of the curve becomes a source of mitigation blocks and
  old fair value gaps to be dragged forward for reaccumulation/redistribution.
- Locate candidate reversal points only where price has reached a higher-timeframe PD array
  - an order block, a breaker, or an imbalance.
- The higher the timeframe of the array, the wider the reversal zone; a monthly array gives
  a wide zone.
- In his examples the strongest form is two higher-timeframe arrays blended at the same price
  (monthly order block + monthly breaker).
- The reversal is confirmed when price breaks below the array's defending candle and the level
  then holds as resistance.
invalidation:
- Not stated.
- Price closes back above the higher-timeframe array - the order flow is no longer being respected.
measurable:
- how often all four listed components appear together at a genuine reversal
- hit rate of entries taken at the reversal vs on the subsequent curve-side zones
- proportion of completed market maker models whose reversal point coincides with a higher-timeframe
  PD array
- reversal rate at monthly versus weekly versus daily arrays
