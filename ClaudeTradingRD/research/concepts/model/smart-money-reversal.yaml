ambiguities:
- Never formally defined in any available transcript — the components are listed in passing
  in one video and assumed elsewhere.
- 'No ordering or minimum subset is specified: are all four components required, or any one
  of them?'
- '''Market structure shift'' is itself undefined in this unit and may or may not be the same
  event as the change in state of delivery.'
- '''Short-term low'' is not defined (bar count, swing degree).'
- '''Higher timeframe'' is relative to the model''s own timeframe and is never fixed - the
  4-hour model reverses at a monthly array in one example, which is five steps up.'
- '''Always'' is asserted with no counter-example and no sample.'
- No rule says how close to the array price must come, or whether a wick touch suffices.
- The rule locates the reversal but supplies no timing - it says where, never when.
