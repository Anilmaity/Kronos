ambiguities:
- '''Strong closure'' / ''closes strong'' in candle 3 is the gate for taking candle 4 and
  is never quantified.'
- The half-of-range test is stated against candle 3's RANGE in the candle 4 video, but the
  same speaker elsewhere in this unit measures halves against bodies ('the upper half of this
  from body to body'). No rule says which to use when they disagree.
- Nothing states an upper limit on continuations -- candle 5 is mentioned once in passing
  in 9AL41xON3hA without being defined.
- '''The candle'' whose half is marked is ambiguous between candle 3 and the whole swing range;
  the first Short says ''the candle'', the second marks 0.5 of ''this range''.'
- Whether the half is measured wick-to-wick or body-to-body is not stated.
- '''Aggressively move lower'' is used as the gate in the second Short and is not defined
  - another instance of the corpus''s unquantified ''aggressive''.'
- Neither Short states an upper bound - whether a fifth day may be traded the same way is
  not addressed here.
- 'TRANSCRIPT HYGIENE NOTE for whoever re-reads these: the auto-captions in this corpus render
  ''candle 2'' as ''candle to''. It does not occur in the quotes cited above but does elsewhere
  in the unit.'
- The exact failure test behind the indicator's red/orange colouring is not disclosed.
- Whether candle 4 needs its own point of interest is never addressed.
- '''Both expanded'' has no quantitative definition (range vs average range is implied but
  not stated).'
- He does not say where the sequence terminates - whether candle 5 and beyond are simply counted
  on or whether the numbering resets.
- The 4-hour candle-count he reads on air ('candle two, three, four, five... already went
  lower') implies counting past 4, contradicting the way candle 4 is treated as the last continuation
  elsewhere.
