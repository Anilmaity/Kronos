ambiguities:
- When several unmitigated FVGs sit inside the range, no rule selects which is the draw —
  he uses proximity and premium/discount informally.
- '''Cannot displace through'' is the usual unquantified judgement.'
- Neither speaker says WHICH opposing array is the destination when several exist at different
  timeframes.
- Ben's equilibrium test depends entirely on choosing the correct dealing range; he says identifying
  dealing ranges accurately is the prerequisite and that getting it wrong will hinder performance,
  but gives no selection rule.
- Ben warns explicitly that the equilibrium reaction is not deterministic - price may leave
  from 50 percent, or may return to fill unmitigated gaps in the OTE first - so the test grades
  likelihood, not certainty.
- '''Engineering liquidity the whole time'' is narrative, with no observable attached.'
- '"Could not displace" is the trigger and is not defined in this clip - no candle-count,
  no closure requirement, no time limit.'
- When several fair value gaps sit inside the range, no rule selects which one is "the" internal
  liquidity.
- No timeframe is named; the clip is taught on a generic diagram.
- The range that fixes premium and discount is not fixed by rule - he marks it from 'displacement
  ranges on the higher time frames' using wicks or bodies, and says he is still experimenting
  with which.
- No rule states which of the two mechanisms to expect on the next leg.
- '''Respect'' of the FVG is judged visually in this video; the IFVG video supplies the only
  hard test (a close through the gap = inversion).'
- 'No timeframe-consistency rule: examples mix a weekly FVG with 4H swing targets.'
- No timing expectation — a leg may take many bars or be skipped entirely.
- The claim 'the market only does two things' is asserted, never tested.
- '''Respect'' of the fair value gap is judged visually here; no close-through test is stated
  in this video.'
- The condition that breaks the rotation ('or have some other movement which breaks this')
  is not specified.
