ambiguities:
- The refusals are personal-preference statements, not claims that the tools do not work -
  he repeatedly tells viewers to use whatever they want as long as they follow rules.
- '''Dogee'' is the auto-caption''s rendering of doji; ''hammer shooter'' is read as hammer
  / shooting star.'
- He says his indicator contains more than is publicly known, so the on-chart list may be
  incomplete.
- OTE is disclaimed as an entry zone but simultaneously used as an invalidation threshold
  - it is excluded as a tool while retained as a boundary.
- He says he uses OTE 'only in larger ranges' and cannot explain when; that exception is undefined.
- Volume imbalance appears once as a level-refinement without ever being introduced as a concept.
- 'The quoted list is mangled by the auto-captioner: ''air value'' is fair value and ''CAD,
  ESD'' is CISD; the reading is inferred from every other use in the unit, not from that sentence
  alone.'
- Whether 'highs and lows' means protected swings specifically or any swing point is not distinguished
  in the list.
- Order blocks / opposing candles are used in practice but do not appear in the enumerated
  list.
- He confirms he has more advanced material (inside-bar procedure, anticipation CISD, candle-3-consolidation
  handling) that he deliberately does not publish, so the public toolkit is knowingly a subset
  of the real one.
- 'PROVENANCE: this is an early tooling video. The later, canonical statements under this
  id explicitly list kill zones, OTE / fibonacci retracements, breakers and the midnight open
  among the things he does NOT use. Both readings are kept; this one is the older and should
  not be read as current practice.'
- The video demonstrates that the templates EXIST on his chart; it does not say he trades
  from them, so 'uses' is an inference and is not asserted here.
- '''OT'' is the auto-caption rendering of OTE.'
- No kill-zone hours are stated even though the kill-zone indicator is loaded on screen.
- The count is given as 'like three' while four objects are named plus OHLC logic; he does
  not say which of the four he is folding together.
- Opposing candles / order blocks, protected swings and SMT are all used elsewhere in the
  same streams but are not in this enumeration - presumably because he considers them OHLC
  logic.
- The transcript renders 'open high low close' as 'open eye low clothes' and 'ATR trail stop'
  as '8 carat Trail stop'.
- Volume is on the chart but he says he does not use it - the inventory and the usage claim
  are in tension within the same video; the resolution he gives is that it is simply left
  up there.
- The sessions indicator's window settings are not given here.
