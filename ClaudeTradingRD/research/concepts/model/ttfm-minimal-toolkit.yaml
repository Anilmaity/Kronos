id: ttfm-minimal-toolkit
name: Minimal Toolkit (what is on the chart, and what is deliberately not)
variants:
  name:
  - What Is Actually On His Chart (the eight-indicator inventory)
  definition:
  - 'The complete analytical toolkit used across all four streams: highs and lows, fair value
    gaps, and CISD, with SMT as the confluence, plus opposing candles for midpoint levels.
    Everything else in the common ICT toolkit is explicitly disclaimed on air. This matters
    for library merging: concepts drafted from other TTrades videos that rely on the excluded
    tools should be checked against these refusals.

    '
  - 'Asked what concepts he uses for reversals or counter-trend trading, he enumerates the
    complete set and closes it: highs, lows, fair value [gaps], CISD and SMT — that''s it,
    no matter what. The negative half is stated just as explicitly across the unit. He does
    not use kill zones any more (he helped build the kill-zone indicator and no longer uses
    it), does not use CRT, does not use ICT''s advanced market structure labelling, does not
    use order flow, does not use inversion fair value gaps as a model, does not use standard
    deviations much, and does not use the RTH chart. Order blocks appear only as a general
    opposing-candle notion; he criticises ICT''s order-block selection as unmechanical and
    says his own version is mechanical precisely so it can be coded.

    '
  - 'EARLIER-ERA EVIDENCE, and it runs against the later refusals. In this tooling walkthrough
    the templates he saves and demonstrates include a kill-zones-and-pivots indicator, an
    OTE template with every level marked out, and a premium/discount box - all three of which
    the later live-stream material lists among the tools he has removed. Also present: power-of-three
    and weekly-candle power-of-three indicators, an open-high-low-close indicator, a three-day
    lookback template, standard-deviation projections, and a watermark. The continuity with
    the later toolkit is the PD-array set itself: breaker / mitigation blocks, fair value
    gaps, order blocks, buyside and sellside liquidity, SMT and range deviations each get
    their own saved drawing template.'
  - 'Asked how to tell whether one is using too many concepts, he enumerates his own: highs
    and lows, fair value gap, CISD, and EQ (the 50% fib) - and says the rest is just open/high/low/close
    logic, so realistically about three concepts. Targets are almost always daily highs and
    lows. Daily bias comes from the daily chart using highs and lows, candle closures and
    phases of price. He contrasts this with the failure mode of marking out a fair value gap,
    then a 50% level, then a rejection block as each one fails - which he reads as having
    no framework at all.'
  - 'Asked about the eight indicators on his chart, TTrades enumerates them: three are watermarks
    (one of which simply prints the instrument name in the corner), two are open/high/low/close
    profile indicators (a weekly one and a daily one), one is a kill zones / sessions indicator,
    plus volume and an ATR trailing stop - and he says of the trailing stop that he has never
    really used it and of volume, separately in the same video, that he does not personally
    use it. So the working toolkit is: two power-of-three profile overlays and a sessions
    indicator. He also states he presents on TradingView rather than his broker platform because
    charting there is easier, and executes on NinjaTrader.'
definition: 'This unit is the fullest enumeration in the corpus of what he does not use, because
  viewers spend four streams offering him tools. Asked how to build a model he gives the procedure
  that produced his: find concepts that make sense to you, blend them into a mechanical way
  to enter the market, and remove everything else - and he names what he himself removed from
  earlier versions, being breaker blocks, advanced market structure, discount and premium.
  The refusals in this unit: kill zones, macros ("I believe in macroeconomics but I don''t
  believe in ICT macros. I think those are fake"), CRT, breakers, rejection blocks (except
  as wicks on doji / hammer / shooting-star candles), fib retracements, the weekly EQ, DXY
  as a correlation for the indices, RTY, volume-profile POC, order flow / delta / absorption,
  the PSP label, the first-presented fair value gap, the New York p.m. session, and the idea
  of a single market algorithm. His stated test for order flow is the one worth keeping: he
  asks whether there is a mechanical definition of absorption and of where the entry is, and
  drops the tool because there is not.

  '
category: model
