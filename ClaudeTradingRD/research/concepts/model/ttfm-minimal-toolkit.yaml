preconditions:
- A chart and a candidate concept.
- n/a
- A bare chart with correlated instruments available for SMT.
- None.
detection_rules:
- Keep only concepts that can be stated mechanically enough to define an entry; discard the
  rest.
- 'On the chart: highs, lows, fair value gaps, opposing candles / order blocks, CISD, protected
  swings, and higher-timeframe candles displayed alongside the working timeframe.'
- 'Not on the chart: kill zones, ICT macros, CRT, breakers, rejection blocks, fib retracements,
  weekly EQ, volume profile POC, order flow / delta, RTY, DXY-for-indices.'
- 'Rejection-block exception: wicks are used only on doji, hammer and shooting-star candles.'
- 'Volume profile exception: if used at all, on a higher timeframe and for low-volume nodes,
  never the POC - price sitting where the volume is means consolidation.'
- 'Chart layout: NQ left, ES middle, YM right, fixed; higher-timeframe candles drawn beside
  each pane so timeframe alignment is read without switching charts.'
- 'In use: swing highs and lows; fair value gaps; CISD; SMT (confluence); opposing candles
  and their 50% levels; volume imbalance (used opportunistically once).'
- 'Explicitly not used: OTE and fibonacci retracement; silver bullet; killzones; macros; rejection
  blocks; breaker blocks; propulsion blocks; order flow, footprint, TPO, delta and volume
  profile; midnight open; fundamental analysis; weekly bias; CRT terminology; breakaway gaps;
  settlement price.'
- 'The permitted feature set is: swing highs, swing lows, fair value gaps, CISD, SMT.'
- Anything not in that list is not part of the read — kill zones, macros, CRT, advanced market
  structure labelling, order flow, IFVG models.
- Protected swings and the T-spot are derived from that set, not added to it.
- Selection of any level must be mechanical enough to be coded; discretionary array-picking
  is rejected.
- 'On the chart in this era: kill zones and pivots, OTE levels, a premium/discount box, power
  of three, weekly candle power of three, open-high-low-close, three-day lookback, projections,
  watermark.'
- 'Drawing templates maintained for: breaker / mitigation blocks, fair value gaps, order blocks,
  buyside and sellside liquidity, SMT (separate high and low), buy stops and sell stops, range
  deviations.'
- Templates are switched wholesale rather than toggling indicators individually.
- 'Chart objects: highs and lows, fair value gaps, CISD levels, EQ / 50% levels.'
- Everything else is derived from open / high / low / close relationships.
- Targets are daily highs and lows.
- Daily bias is built on the daily chart from highs and lows, candle closures and phases of
  price.
- If a level fails, do not substitute a new tool for it - that is the absence of a framework.
- 'Chart carries: weekly open/high/low/close profile, daily open/high/low/close profile, a
  sessions / kill zones indicator.'
- Volume and an ATR trailing stop are present but not used in decisions.
- Watermarks are cosmetic (instrument name, etc.).
- Analysis and presentation on TradingView; execution on NinjaTrader.
invalidation:
- Not applicable.
- n/a
- Not applicable — this is a scope statement.
measurable:
- whether adding any rejected tool as a filter improves expectancy on the same trade set
- Whether adding any excluded tool as a filter improves expectancy of the base model.
- performance of a detector restricted to the five primitives versus one with additional arrays
- share of his live calls explainable by the five primitives alone
- which tools survive from this era into the later toolkit, as a timeline of the method
- how many distinct primitives a detector needs vs this four-item list
