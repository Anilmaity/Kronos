id: daily-profile-confirmation
name: Daily Profile Must Confirm the Daily Bias
definition: 'Two Shorts state the same discipline from opposite ends. Where the next move
  is genuinely two-sided - price can either sweep the low or respect it, and he says outright
  he does not know which - the resolution is not to pick: he lets the daily profile confirm
  or invalidate his thought process, and only acts once the profile shows its hand (here:
  the low is swept, the EQ is respected, an order block forms, and the continuation follows).
  The mirror discipline is that a single failed continuation signature intraday is NOT a reason
  to abandon the bias - he says he is not going to just switch his bias because of this, and
  remains with the read he determined earlier in the day.'
variants:
  definition:
  - 'The daily profile is the shape of the current daily candle: where it opened, whether
    it made a low or a high first, and how it expanded. It acts as a veto on the daily bias.
    A bullish daily bias is only confirmed if price opens, makes some sort of low, and then
    trades higher. If price opens and immediately expands higher into its objectives with
    no low to trade away from, the profile is read as bearish intraday, pointing back toward
    the daily open even though the daily bias is bullish.

    '
category: model
status: contested
aliases:
- daily profile
- open high first
- profile does not confirm
preconditions:
- A daily bias has been determined, and the intraday path is ambiguous.
- A daily bias has been established (daily C2/C3 plus H1 CISD).
- The current day has opened.
detection_rules:
- When two outcomes are both live (sweep the low, or respect it), do not choose - wait for
  the daily profile to confirm or invalidate.
- 'Confirmation in the worked case: the low is swept, the EQ is respected, and a change in
  the state of delivery / order block forms - then the continuation is taken.'
- A failed continuation signature (no closure over the opposing candles after the low is taken)
  is not by itself grounds to switch the bias.
- Hold the bias determined earlier in the day and keep reading the profile against it.
- 'Bullish confirmation: price opens, forms a low (ideally a shallow sweep), then trends higher.'
- 'Bearish confirmation: price opens, forms a high, then trends lower.'
- 'Non-confirmation: price opens and immediately expands into objectives without forming the
  opposing extreme first.'
- On non-confirmation, look for a move back to the daily open or to a level that gets swept,
  rather than continuation.
invalidation:
- The daily profile invalidates the thought process - though the clips do not say what that
  looks like beyond the failed case.
- A relevant level is swept, creating a new level to trade away from and restoring the bias
  direction.
measurable:
- how often a failed continuation signature is followed by the original bias still working
- time from ambiguous open to profile confirmation
- outcome of days where daily bias and daily profile agree versus disagree
