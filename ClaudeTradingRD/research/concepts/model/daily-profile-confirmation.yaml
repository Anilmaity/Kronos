ambiguities:
- 'This is the crux and it is left open: "confirm or invalidate" is never given a test, so
  the concept stays underspecified. One clip shows confirmation; the other shows the bias
  being held through a failure and then the day going the other way.'
- No rule separates "a failed continuation signature you should sit through" from "the profile
  has invalidated you".
- Whether the bias could be switched at all intraday, and on what evidence, is never said.
- The outcome contradicted the framing (YM reversed and indices were bullish after 10:00);
  no trade was taken either way.
- No enumeration of valid versus invalid profiles is given in this unit; he points to a separate
  daily-profile video.
- When bias and profile disagree he does not state a general priority rule beyond following
  whichever his model can frame.
- How much expansion counts as the day having already expanded is not quantified.
