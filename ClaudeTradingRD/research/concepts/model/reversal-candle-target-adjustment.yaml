id: reversal-candle-target-adjustment
name: Reversal Candle - Adjust Targets, Do Not Expect Expansion Past The Open
definition: 'The channel''s own version of the rule (the library previously held only a guest''s
  statement of it, and this corroborates it). When the candle in play has a large opposing
  run, expansion is not expected and the targets are cut back to the candle''s own opening
  price and the liquidity or PD arrays sitting around it - typically a fair value gap near
  the open. Reaching for the current period''s opposing extreme instead is only justified
  when that extreme is low-resistance liquidity: he wants the day to have opened and made
  a steady one-sided move leaving a run of failure swings behind. Where a protected swing
  sits on the intraday extreme he deliberately takes the smaller target at the open, on the
  reasoning that if he is wrong the higher low forms in exactly that area.'
variants:
  definition:
  - 'ADR mechanism for the target cut: a large opposing move ''is using time and range''.
    Projecting the ADR from the extreme of that large wick shows the farther target is no
    longer reachable today, and the reachable level (in his examples PDH or PDL) becomes the
    day''s target. He will not trade beyond that level the same day and waits for the new
    daily open for new range; with a small wick respecting the EQ / T-spot the farther target
    would have stayed in reach.'
  - On a daily reversal day the intraday targets are the daily open and the PREVIOUS DAY'S
    EQ, chosen according to wick size; he states lower expectations for the move and stops
    after those targets print. A small wick on the reversal candle leaves room for continuation
    beyond them.
  - 'When the daily candle being traded has a large opposing wick, it is classified as a reversal
    candle rather than a reversal-into-expansion candle. Such a candle is not expected to
    displace past its own opening price, so targets are reduced to objectives inside the current
    day''s range - typically the current day''s opposing extreme, which will be a session
    high or low. The setup requires the day to have opened in the correct direction first
    so that the opposing extreme is low-resistance liquidity (a session high or low that tagged
    no key level).

    '
category: model
status: contested
aliases:
- adjust our targets
- back towards the daily open
- trading a large-wick daily candle
preconditions:
- The candle in play has a large opposing run (see opposing-run).
- A lower-timeframe change in the state of delivery has confirmed the reversal.
- The daily candle in play has a large opposing wick.
- The day opened in the required direction first (low first for a bullish reversal candle).
- The day's extreme formed from a key level.
detection_rules:
- 'Classify the candle: large opposing run -> reversal candle, no expansion expected.'
- Default target set := the candle's own opening price, plus fair value gaps and liquidity
  points around it.
- 'Escalate to the current period''s opposing extreme ONLY if that extreme is low-resistance:
  a steady one-sided move leaving failure swings on the session extreme.'
- If a protected swing sits on the intraday extreme instead, do not reach for it - take the
  target around the open.
- On the daily specifically, this is executed on the lower timeframes back toward the daily
  open; on the 4-hour he prefers to skip and wait for the next candle.
- Measure the opposing run (wick) of the current daily candle.
- Project ADR from the wick extreme in the bias direction.
- If the projection ends at/near PDH/PDL rather than the farther target, PDH/PDL is the day's
  target; no continuation beyond it until the next day.
- Classify the day as a reversal day (expansion into a higher-timeframe target, then reversal).
- 'Targets: daily open, then previous day EQ; the choice is conditioned on wick size.'
- If the previous EQ is already hit with only a small wick, a continuation higher is still
  possible.
- Once price is back to the daily open on a reversal day, treat the day's objective as done.
- 'Classify the daily candle: large opposing wick -> reversal candle.'
- Confirm the opposing extreme of the day is a session high/low that did not tag a key level
  (low-resistance liquidity).
- Set targets inside the current day's range; do not target beyond the daily opening price.
invalidation:
- Price closes beyond the candle's opening price with expansion - the reversal-candle read
  was wrong and it was an expansion candle.
- The opposing extreme of the day already tagged a relevant key level - the profile does not
  apply.
measurable:
- hit rate of the return-to-open target on large-opposing-run candles
- R difference between taking the open vs holding for the session extreme
- hit rate of the farther target same-day vs next-day, split by wick size as fraction of ADR
- hit rate of the daily open vs previous-day EQ on reversal days
- frequency with which large-wick daily candles close beyond their open
- R achieved with reduced targets vs full targets on these days
