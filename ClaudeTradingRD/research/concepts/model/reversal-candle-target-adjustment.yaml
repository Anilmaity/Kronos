ambiguities:
- '''Large'' opposing run remains unquantified.'
- '''Liquidity points or points of interest around there'' is not bounded - how far from the
  open a target may sit and still count is not stated.'
- He gives the failure-swing / protected-swing test as the escalation rule but does not say
  how many failure swings are enough.
- What counts as 'large' vs 'small' wick is deferred to his wick-size video; in the ADR ~400
  and ~116 examples the wick consumed roughly a third or more of ADR, but no threshold is
  stated.
- How wick size selects between the daily open and the previous EQ is not stated.
- Which daily open (18:00 or midnight) is not specified in this stream.
- This exception applies only to the daily timeframe; the speaker says 4-hour reversal candles
  are not traded at all, with one unstated exception.
- '''Large'' wick remains unquantified.'
