  quote: I might as well just wait for the next candle to have a small wick
- video_id: SlWxhzhLo3A
  title: 'Wick Size Matters: The Key to Understanding Reversal and Expansion Candles'
  quote: we don't really have the filter of the candle close
- video_id: SlWxhzhLo3A
  title: 'Wick Size Matters: The Key to Understanding Reversal and Expansion Candles'
  quote: a reversal candle on the daily, then I look to trade the lower time frames
ambiguities:
- The tier-2 requirement 'enough time for this range to expand' has no threshold; the only
  worked rejection is 40 minutes left in an hourly candle.
- Tier 3 is said to be reserved for the daily, but the corpus elsewhere shows him trading
  reversal candles on other timeframes - no reconciliation is given.
- Whether tier 2 and tier 3 can both be live on the same candle (a small wick that later becomes
  large) is not addressed.
