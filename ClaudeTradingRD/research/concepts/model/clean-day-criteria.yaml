id: clean-day-criteria
name: What Makes A Day Clean To Trade
definition: 'Asked directly what makes a day clean, he gives the whole model as a four-part
  checklist expressed in his candle numbering: trade a candle 3 on the daily, trade a candle
  4 on the 4-hour, and trade with a protected swing - on the daily / 4-hour / 15-minute stack,
  or the equivalent numbers on another stack. Generalised: multiple timeframes must be aligned
  for expansion, those timeframes must not already have expanded, and a protected swing must
  exist. Asked separately for his ideal continuation, he gives the same thing from the entry
  side: in line with the daily candle, in line with one more timeframe, a reversal has formed,
  and it is a new protected swing.

  '
category: model
status: specified
aliases:
- what makes a day clean
- ideal continuation
preconditions:
- A timeframe stack chosen in advance (daily / 4-hour / 15-minute, or daily / 1-hour / 5-minute).
detection_rules:
- Daily candle is a candle 3 (continuation) in the anticipated direction.
- 4-hour candle is a candle 4 within that daily candle.
- The aligned timeframes have not already expanded - if the move is spent, the day is not
  clean.
- A reversal has formed on the execution timeframe and left a new protected swing.
- Enter the continuation; the protected swing is the invalidation.
invalidation:
- The protected swing is taken out.
- One of the aligned timeframes prints an opposing expansion candle.
measurable:
- frequency of days meeting all four criteria
- expectancy of full-checklist days vs partial-checklist days
sources:
- video_id: i2HhHhWdaPQ
  title: New York Open Live Q&A
  quote: Trade a C3 on the daily. Trade the C4 on the 4hour.
- video_id: x4sRGuZIqWk
  title: New York Open Live Q&A
  quote: in this next higher time frame candle, I'm looking for a continuation
ambiguities:
- '''Not already expanded'' is the same unquantified exhaustion test used elsewhere in the
  corpus; he judges it against the eyeballed daily range.'
- Whether the daily must be a C3 specifically or a C3 or C4 is stated both ways across the
  unit ('I only trade when the daily forms a C3 or C4' is quoted back to him without correction).
- The 4-hour C4 requirement is stated once and not repeated; the other formulations only require
  'one more timeframe' in line.
