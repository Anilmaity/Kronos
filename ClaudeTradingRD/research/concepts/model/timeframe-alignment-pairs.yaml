ambiguities:
- The pairing is stated as a fixed table but is also allowed to flex by one step for cleanliness
  - no rule says when flexing is permitted.
- The 4-hour -> 15-minute pairing skips the hourly, while the daily -> hourly pairing skips
  the 4-hour; the ratio between pairs is therefore not constant.
- The pairing rule itself (why 1H goes with 5m) is deferred to his timeframe alignment video
  and not derived here.
- The 30m-3m pair is stated once in passing and the 1H-1m pairing used in one breaker example
  is not reconciled with it.
- Whether the third refinement timeframe is fixed by the pair or chosen freely is not stated.
- The auto-captions mangle every minute timeframe ("15-minut", "5minut", "3inut", "30-inut");
  the values are unambiguous from the sequence but no timestamped text confirms them individually.
- The 30-minute row breaks the otherwise consistent 4-to-6x ratio pattern (30m pairs with
  3m, not 5m) and no reason is given.
- The Short does not say whether the middle timeframe of a three-timeframe stack carries the
  structure, the bias, or both.
- '"Messy" is the only stated trigger for stepping up a timeframe and is not defined.'
- He says the exact alignment does not matter, which conflicts with the indicator autobias
  feature that enforces one or two timeframes up.
- No rule decides which pair to choose on a given day beyond preference and session.
- The auto-captioner writes 'change in the stage delivery' for 'change in the state of delivery'.
- Whether the H1/M5 scalping pair is still in use is unclear - he says he trades higher timeframes
  as he has traded up, and elsewhere says he does not scalp.
- For intraday work he says he does not care about anything above the daily; for swings he
  goes monthly, three-month and sometimes yearly.
