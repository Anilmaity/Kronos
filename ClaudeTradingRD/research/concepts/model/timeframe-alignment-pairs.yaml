id: timeframe-alignment-pairs
name: Timeframe Pairing and Alignment
definition: 'Every model is a pair: a higher timeframe supplying the candle closure and an
  aligned lower timeframe supplying the change in the state of delivery. The pairs actually
  named in this unit are DAILY -> HOURLY, 4-HOUR -> 15-MINUTE, HOURLY -> 5-MINUTE, and (used
  once, when the 15-minute was unclean) HOURLY -> 3-MINUTE. The full model stack for an intraday
  trade is daily bias -> 4-hour swing point -> 15-minute execution. Targets are always read
  from the HIGHER timeframe of the pair. The indicator''s ''automatic'' mode applies these
  pairings by itself.'
variants:
  definition:
  - 'Pairs used explicitly in this unit, with the alignment condition attached. The model
    runs on a pair - hourly with 5-minute, daily with hourly, 15-minute with 1-minute, 30-minute
    with 3-minute - and a third, lower timeframe is used only to refine the entry (1-minute
    under the hourly/5-minute pair, 15-minute under the daily/hourly pair). Alignment is not
    assumed: after the higher-timeframe sweep and closure he waits until BOTH timeframes are
    directional the same way, which happens when the lower timeframe closes through the series
    of opposing candles that made the extreme. Until that close, the pair is not aligned and
    the setup is not live.'
  - 'A Short recites the pairing table in full and adds the row the corpus was missing at
    the top: WEEKLY pairs with the 4-HOUR. The stated list is weekly-4H, daily-1H, 4H-15m,
    1H-5m, 30m-3m and 15m-1m. He also gives the selection PROCEDURE for a three-timeframe
    stack, which runs bottom-up: decide the entry timeframe first, look up its partner, then
    look up that partner''s partner. Worked example: entry on the 5-minute -> the hourly ->
    the daily. A separate Short shows the escape hatch used live: when the execution timeframe
    is messy, step UP one timeframe (15-minute to 30-minute) to get a clear series of opposing
    candles for the change in the state of delivery.'
  - 'Bias comes from the daily and hourly charts. Beyond that the exact pairing does not matter:
    H4 with M15, H1 with M5, or M30 with M3 are all acceptable, because the goal is only that
    all the timeframes point the same direction. The entry timeframe follows the swing timeframe
    being traded (a 4-hour swing is normally entered on the 15-minute). 15-minute is the minimum
    for London; lower timeframes are only used after the New York open when volatility supports
    them. He prefers the 3-minute over the 1-minute because the 1-minute is too noisy.

    '
  - 'The pairs named in these streams. For pre-open and London: H4 with M15, or daily with
    H1 - and for London specifically he prefers H4/M15. For positional and swing work: daily
    with hourly, explicitly not weekly with 4-hour. A 1-hour/5-minute pairing is referenced
    as his scalping model. To confirm a 4-hour high or low, use a 15-minute change in the
    state of delivery. He uses every timeframe below the daily as nested inside it and refines
    downward - 4-hour tells him whether there is anything to frame, then the hourly, then
    the 15-minute.'
