preconditions:
- A chosen higher timeframe for the closure.
- A directional higher-timeframe candle event (sweep and closure back inside).
- A higher-timeframe closure that needs a lower-timeframe confirmation.
- A daily bias has been established.
detection_rules:
- Daily closure -> confirm on the hourly.
- 4-hour closure -> confirm on the 15-minute.
- Hourly closure -> confirm on the 5-minute.
- If the paired lower timeframe's structure is unclean, refine down one step (5m -> 3m) or
  step up (15m -> 30m) rather than abandoning the setup.
- Targets come from the higher timeframe of the pair - its previous candles' unswept extremes.
- 'Full intraday stack: daily bias, then a 4-hour swing point inside the daily candle, then
  a 15-minute continuation entry.'
- 'Fractal upward too: monthly -> daily -> hourly is walked in one example.'
- 'Select the pair: 1D-1H, 1H-5m, 30m-3m, or 15m-1m.'
- Alignment := the lower timeframe has closed through the series of opposing candles that
  made the swept extreme, in the same direction as the higher timeframe.
- If that close has not happened, wait - 'we have to wait through a close through that level'.
- Once aligned, a third and lower timeframe may be used purely for entry refinement.
- Lock the indicator/model to the pair's two timeframes so the levels persist when dropping
  lower.
- 'Pairs: weekly-4H, daily-1H, 4H-15m, 1H-5m, 30m-3m, 15m-1m.'
- 'Three-timeframe stack procedure: choose the ENTRY timeframe first, take its paired higher
  timeframe, then take that timeframe''s paired higher timeframe.'
- 'Worked example of the procedure: 5-minute entry -> hourly -> daily.'
- If the paired execution timeframe is messy, step up one timeframe to find a clear series
  of opposing candles for the change in the state of delivery (15-minute -> 30-minute in the
  worked case).
- Take direction from the daily plus hourly.
- 'Pick a HTF/LTF pair one or two steps down: H4/M15, H1/M5, or M30/M3.'
- Verify each selected timeframe is pointing the same direction before entering.
- For London, do not execute below the 15-minute; below that only after the New York open.
- 'Pre-open / London: H4 analysis with M15 execution, or daily analysis with H1 execution.'
- 'Positional / swing: daily analysis with hourly execution.'
- 'Scalping: H1 with M5.'
- Confirm a 4-hour extreme with a 15-minute change in the state of delivery.
- 'Refine top-down: daily, then 4-hour, then hourly, then 15-minute.'
invalidation:
- The lower timeframe making a new extreme before closing through - alignment is not achieved.
- Not applicable - a pairing convention.
- A selected timeframe opposes the others, in which case it does not confirm the bias.
measurable:
- how often the paired lower timeframe produces a CISD within the HTF candle
- outcome difference between refining down vs stepping up when structure is unclean
- lag in bars between the higher-timeframe closure and lower-timeframe alignment
- share of higher-timeframe closures that never achieve alignment
- outcome difference between entries taken before and after alignment
- CISD confirmation rate by pair
- how often the step-up-one-timeframe fallback is needed
- outcome difference between execution on 15m/5m and on 3m/1m for the same signal
- confirmation rate of 4-hour extremes by an M15 CISD
- stop-out rate per pairing
