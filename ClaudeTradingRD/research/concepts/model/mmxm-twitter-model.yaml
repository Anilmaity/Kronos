ambiguities:
- 'HEADLINE EVOLUTION FINDING: the same attributed model, the same channel, two different
  five-condition lists. This EARLIER recording is a timing/selection filter; the later WwmS47Gb3M0
  is a price-pattern recipe. They are not variants of each other and neither mentions the
  other''s conditions. The later one is canon; this one is preserved as the earlier reading.'
- '''The anticipated higher time frame level'' is not typed - daily fair value gap, daily
  order block and daily PD array are all used as examples.'
- '''A reaction off the level'' is judged visually (a closure respecting it).'
- No timezone or hours for 'the New York session'.
- The 'candle with no Wick' target preference is stated once and never explained.
- '''Market structure shift'' is never defined in this video and is used interchangeably with
  change in the state of delivery.'
- Which correlated asset supplies the SMT is chosen per example with no rule (silver for gold,
  ES/YM for NQ, GBPCAD in one case).
- The fair-value-gap selection reasoning (premium/discount, already mitigated) is given once
  and not stated as a rule.
- This is a model taught on someone else's behalf - the underlying source is the MMXM Trader's
  Twitter, not this channel's own method.
- The transcript renders 'MMXM' as 'mxm' throughout.
