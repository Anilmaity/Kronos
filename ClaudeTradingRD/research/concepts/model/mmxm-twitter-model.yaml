id: mmxm-twitter-model
name: The MMXM Trader's "Twitter Model"
definition: 'EARLIER RECORDING OF A DIFFERENT MODEL UNDER THE SAME NAME - the single most
  important divergence in this unit. This video is titled ''Next Day Model'' and presents
  what it calls the MMXM Trader''s Twitter model as FIVE CONDITIONS THAT ARE ENTIRELY ABOUT
  TIMING AND SELECTION, not about price patterns: (1) skip Mondays; (2) focus on the New York
  session only; (3) execute on the 15-minute chart; (4) use the economic calendar as the roadmap;
  (5) trade the DAY AFTER the anticipated higher-timeframe level is hit. The later re-recording
  (WwmS47Gb3M0), which the library holds as canonical under this id, gives a completely different
  five-condition list - previous-day-extreme raid, hourly opposing fair value gap target,
  15-minute structure shift, SMT, and the midnight-open side gate. Only the 15-minute execution
  is common to both.'
variants:
  definition:
  - 'A fully enumerated five-condition model that TTrades teaches on behalf of the MMXM Trader.
    It moves from external liquidity to internal liquidity on a smaller timeframe, paired
    with a market structure shift and an SMT. Short setup: previous day HIGH is raided; the
    target is a 1-hour BULLISH fair value gap below; a 15-minute market structure shift plus
    an SMT is required; and the entry may only be taken ABOVE the midnight open. Long setup
    is the exact mirror - previous day LOW raided, a 1-hour BEARISH fair value gap above as
    the target, 15-minute structure shift plus SMT, and the entry only BELOW the midnight
    open. He states the model is fractal and can be run one step up (weekly / 4-hour / 1-hour)
    or down.'
category: model
status: contested
aliases:
- Next Day Model
- the mmxm Traders Twitter model
- Twitter model
- the mxm Traders Twitter model
preconditions:
- A higher-timeframe level (daily fair value gap, daily order block, daily PD array) is marked
  in advance.
- The economic calendar for the week has been read.
- Previous day high (short) or previous day low (long) is marked and gets raided.
- A 1-hour fair value gap exists on the opposite side to serve as the target.
detection_rules:
- Skip Monday entirely; wait for Tuesday onward.
- Wait for the day on which price reaches the anticipated higher-timeframe level and reacts
  to it.
- Trade the NEXT day, not that day.
- Trade the New York session only.
- Execute on the 15-minute chart, having framed the day on the daily and hourly.
- 'Top-down chain used in every example: daily level -> hourly breaker / fair value gap /
  order block -> 15-minute fair value gap for the entry.'
- 'Weekly-profile overlay he adds: on a bullish week expect an open-low-high-close daily shape.'
- 'Target preference stated once: a candle with NO WICK is something he likes to target.'
- 'Short: previous day high raided -> target a 1-hour bullish fair value gap below.'
- 'Long: previous day low raided -> target a 1-hour bearish fair value gap above.'
- 'Fair value gap selection shown in one example: prefer the gap that has not already been
  reached into, and consider premium/discount - equilibrium of the range should sit inside
  or beyond the chosen gap.'
- On the 15-minute chart require a market structure shift AND an SMT against a correlated
  asset (silver, ES, YM and GBPCAD are each used in an example).
- Enter only above the midnight open for shorts, only below it for longs.
- 'Substitution he permits: an inversion or a change in the state of delivery may be used
  in place of the market structure shift.'
- 'Substitution he permits: the daily open may be used in place of the midnight open.'
- 'Fractal: the same shape runs on weekly / 4-hour / 1-hour, or lower.'
invalidation:
- Price does not reach the anticipated higher-timeframe level, so no next day is set up.
- No SMT at the raid.
- No 15-minute structure shift / CISD after the raid.
- Entry price on the wrong side of the midnight open.
measurable:
- hit rate of the day-after-the-level rule vs trading the level day itself
- how much the skip-Monday rule costs or saves over a sample
- share of setups that appear in New York only
- frequency of all five conditions co-occurring per week
- hit rate of the hourly fair value gap target once the raid and SMT are present
- how often the midnight-open filter would have blocked an otherwise valid entry
