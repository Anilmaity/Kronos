ambiguities:
- '"2200 candle or the 2:00 a.m. candle" - 4-hour candles on the futures grid (18/22/02/06);
  the Forex grid offset is consistent with po3-four-hour-opening-times.'
- '"Demand more confirmation" and "clean structure" are not quantified.'
- The 100-point gold daily range is an eyeballed figure for that example only.
- '"Around four R" is measured off the chart in the clip, not derived from a rule; it is an
  example, not a target policy.'
- No rule is given for choosing between the 2R exit and holding for the failure swings.
- The daily fair value gap entry with "bodies still respecting" is used as the context but
  not defined as a gate.
- The instrument is never named.
- No rule chooses between the swing-high stop and the body stop.
- '''Conveniently right around that low'' means the 2R/target coincidence is observed, not
  required.'
- '''Strong closure'' on the 06:00 candle, which gates the 10:00 expansion, is not quantified.'
- The session times quoted (2:00 / 6:00 / 10:00) are the futures grid; the forex grid differs
  by one hour (see po3-four-hour-opening-times) and this video does not flag the difference.
