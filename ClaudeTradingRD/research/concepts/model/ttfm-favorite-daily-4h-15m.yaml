id: ttfm-favorite-daily-4h-15m
name: His Favourite Pairing - Daily Bias / 4-Hour Swing Point / 15-Minute Entry
definition: 'Presented as his London session model. Daily bias (simplest: daily candle 2 or
  candle 3 closure). Then let the daily wick form by using the 4-hour: for London he wants
  the reversal in Asia or early London, ''usually the 2200 candle or the 2:00 a.m. candle''
  (Forex timings are an hour off). After the 4-hour closure, drop to the 15-minute, confirm
  the swing with a CISD, wait for the intra-candle CISD that shows the 4-hour wick has formed,
  and get onside with stop at the protected swing. Hold toward the high (low) or close of
  the expansion candle - possibly for this 4-hour candle and the next. Additions: a 4-hour
  C2 that fails to take the previous high (failure swing) is still valid but he ''must demand
  more confirmation'' and prefers SMT; a very deep 15-minute run is only traded away from
  with SMT on the low; a visible wick on the 4-hour is acceptable if the day has range left
  (gold daily expansion candles ~100 points, halfway used). Kill zones are irrelevant - entering
  at 19:00, 22:00, 01:00 or 02:00 is fine as long as the higher-timeframe wicks have formed.

  '
variants:
  definition:
  - 'The Short walks his favourite setup as a three-layer alignment with concrete execution.
    Daily: price has entered a fair value gap with the bodies still respecting it, and a candle
    2 closure prints - so expansion is expected in the next daily candle. 4-hour: right off
    the open, another candle 2 closure, so candle 3 on the 4-hour is the leg to trade, toward
    the failure swings to the left. 15-minute: a change in the state of delivery, a V-shape
    recovery, and a close over. With all timeframes aligned he takes the continuation entry
    AT THE MARKET on the new open, stop at the protected low, targeting 2R or the failure
    swings - which he prices at around 4R.'
  - SHORTS EVIDENCE walking the pairing end to end under the title 'my favorite fractal model
    setup'. Failure swings are run out into a fair value gap and a daily candle 2 closure
    prints, which sets the bearish day. The 4-hour is then checked for its own candle 2 closure
    at the reversal structure. With both in hand, execution moves to the 15-minute, where
    the LOWER HALF of the 4-hour candle is the level that must be respected and the daily
    candle's wick is treated as already formed. The target chosen is the previous day low,
    the stop is placed either on the high or on the BODIES that made the high, and the trade
    is taken on the continuation after price reaches the T-spot / fair value gap - with 2R
    landing conveniently at that previous day low.
  - 'Restated: the 4H/15m fractal model is one of the best pairings, but only with a higher-timeframe
    bias first; pattern-trading the fractal model without it is rejected.'
  - 'Stated reason for favouring the 4-hour/15-minute model: traders with the right overall
    bias get chopped up on lower timeframes and stopped before price goes their way; the 4H/15m
    pairing helps them avoid that.'
  - 'Named by the speaker as his favourite fractal model: the daily supplies bias, the 4-hour
    supplies the swing point AND the daily profile, and the 15-minute supplies the entry.
    The logic is that the daily wick is allowed to form and its body is traded, and then the
    same operation is repeated one level down -- so the trader is trading candle 3 on the
    daily and candle 3 on the 4-hour at the same time, which is stated to be where the easiest
    expansions occur.'
category: model
status: contested
aliases:
- London session model
- my preferred method for trading London
- the best timeframe for the fractal model
- daily 4H 15m
preconditions:
- Daily bias from a daily candle 2 or candle 3 closure (or more advanced daily reads).
- Price has entered a daily fair value gap with the bodies still respecting it.
- A daily candle 2 closure has printed after failure swings were run into a point of interest.
- The 4-hour has printed its own candle 2 closure.
- A daily candle 2 closure (preferred, though a bias from any source is allowed) at a point
  of interest -- a low, a high, or a fair value gap.
detection_rules:
- 'London variant: look for the 4-hour reversal / closure in the 22:00 or 02:00 (New York)
  4-hour candle, i.e. Asia or early London; Forex is shifted by one hour.'
- Confirm the swing on the 15-minute with a CISD, then wait for the intra-candle CISD in the
  new 4-hour candle before entering.
- If the 4-hour C2 is a failure swing (did not take the previous candle's high/low), require
  SMT or cleaner 15-minute continuation structure.
- A deep opposing run on the 15-minute is only traded away from if SMT is present at the extreme.
- Accept a 4-hour wick if a large share of the expected daily range remains.
- Hold for the duration of the higher-timeframe expansion candle, potentially the next one
  too, or exit at 2R.
- 'Daily: require a candle 2 closure - price reversed within that candle - so expansion is
  expected next.'
- '4-hour: require a candle 2 closure right off the open; trade candle 3 on the 4-hour.'
- 'Direction/target: the failure swings on the left side.'
- '15-minute: require a change in the state of delivery and a V-shape recovery with a close
  over.'
- Only with all three aligned, enter AT THE MARKET on the new open.
- 'Stop at the protected low. Targets: 2R, or the failure swings at roughly 4R.'
- Require the daily candle 2 closure first - that sets the day's direction.
- Require a candle 2 closure on the 4-hour at the reversal structure.
- Drop to the 15-minute and require the lower half (bearish) of the 4-hour candle to be respected.
- Wait for price to reach the T-spot / fair value gap area, then for a continuation.
- 'Stop: on the high, OR on the bodies that made the high (two options offered).'
- 'Target: the previous day low, checked against 2R.'
- Require a higher-timeframe bias before taking a 4H/15m fractal model.
- 'Daily: candle 2 closure inside a point of interest, or a reversal candle closing back inside
  the previous candle''s range -> expect expansion next day (candle 3).'
- '4-hour: wait for a candle 2 or candle 3 closure on the traded day; that closure marks where
  the daily wick formed.'
- After a 2:00 (London) 4-hour candle 2 closure, anticipate the 6:00 and 10:00 candles to
  expand; the 10:00 expansion is conditional on 6:00 closing strongly.
- Only trade the third expansion candle if the drawn liquidity has not yet been met.
- '15-minute: require a change in the state of delivery inside the 4-hour candle 3, then take
  a continuation entry (not the reversal).'
- Respect the lower/upper half of the 4-hour candle depending on direction.
invalidation:
- Price trades through the protected swing used for the stop.
- Price trades through the protected low used for the stop.
- Price trades beyond 50% of the reference candle right off the open of the new higher-timeframe
  candle.
- The in-candle change in the state of delivery fails to form before the low/high is taken
  out -- wait for a new candle 2 closure rather than abandoning the idea.
measurable:
- hit rate of setups whose 4-hour reversal candle is 22:00 vs 02:00 vs later
- performance with vs without SMT when the 4-hour C2 is a failure swing
- frequency of daily-C2 + 4H-C2 + 15m-CISD alignment per month
- hit rate of the 4R failure-swing target versus the 2R target
- R difference between the swing-high stop and the body stop on the same setups
- share of setups where 2R and the previous day low coincide
- hit rate when daily C3 and 4H C3 coincide vs daily C3 alone
- conditional expansion of the 10:00 candle given a strong 06:00 close
