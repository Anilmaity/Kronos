preconditions:
- A candle 2 closure (or a reversal point) already exists on the timeframe in question.
- 'For the trade sense: a candle 2 whose reversal is confirmed by a lower-timeframe change
  in the state of delivery.'
- 'For the closure sense: candle 2 did NOT produce a valid candle 2 closure.'
- Drawn liquidity / a target is still open -- if candle 2 already expanded all the way to
  the objective he will not trade the candle 3.
- A confirmed candle 2 (point of interest + lower-timeframe CISD), OR a swept candle that
  failed to close back inside, making the NEXT candle a C3 candidate.
- A candle 2 exists (the candidate reversal candle), whether or not it closed back inside
  the previous range.
- A candle 2 closure confirmed by a change in the state of delivery on the timeframe below.
- A defined draw for the continuation to travel toward.
- A valid C2 closure exists on the same timeframe.
- The C3 candle has opened and formed its wick against the intended direction.
- Either a confirmed C2 with a change in state of delivery (the sequential case), or a prior
  candle that made a high followed by aggressive delivery (the standalone case).
- A prior candle (candle 1) whose extreme is the reference.
detection_rules:
- C3 closure := the candle closes beyond the BODY of candle 2 in the bias direction.
- 'Branch test at a point of interest: no reversal closure -> either (a) sweep the previous
  extreme and print a C2, or (b) close over the body of C2 and print a C3.'
- After a C3 closure, mark the entire C3 candle range.
- Require the upper half (bullish) / lower half (bearish) of that range to be respected.
- If the continuation fails to close over its level, wait for a new extreme to form a new
  protected swing before re-entering.
- A clean reversal candle (C2) is what sets up the clean continuation candle (C3).
- 'Candle 3 closure (bearish): candle 2 produced no valid closure, and candle 3 closes BELOW
  the opening price of candle 2. Bullish: candle 3 closes ABOVE the opening price of candle
  2.'
- If candle 3 never closes beyond candle 2's opening price, it is not a candle 3 closure at
  all and the lower timeframes are not consulted.
- 'READING B (from the sibling unit ..._01, not from this unit''s videos): the C3 closure
  reference is candle 2''s EXTREME -- closes above candle 2''s high (bullish) / below candle
  2''s low (bearish). Reading B is strictly stronger than Reading A and will select a subset
  of Reading A''s bars, so a detector should compute both and report the disagreement rate.'
- A candle 3 closure, like a candle 2 closure, still requires a change in the state of delivery
  inside it on the paired lower timeframe before a candle 4 continuation is sought.
- 'Candle 3 as a trade: direction = the direction the confirmed candle 2 reversed toward.
  Trade only after candle 2 is a REVERSAL candle (large wick, opens and closes near the same
  point); a candle 2 that expanded is a disqualifier because a new phase of price may begin.'
- 'Exception to that disqualifier: if candle 2 expanded but left short-term drawn liquidity
  intact, candle 3 is still tradeable because there is a spot for it to reach for.'
- Inside candle 3, let the wick form against the intended direction, then trade the body --
  entry via a continuation order block, not on the reversal.
- Aligning candle 3 across several timeframes at once (e.g. daily C3 + 4H C3 + 15m protected
  swing) is the stated highest-expansion condition.
- At the point of interest, test for a candle 2 closure (sweep plus close back inside the
  previous candle).
- 'If absent, let the next candle print and test for a candle 3 closure: a close over the
  body of candle 2.'
- If neither closure forms, the model does not align - take no trade even if direction is
  anticipated.
- A candle 3 that closes outside candle 2's range licenses a continuation entry in candle
  4.
- After a confirmed candle 2 plus a change in the state of delivery, continuations are valid
  to look for in candle 3.
- 'C3 closure (bullish): the candle closes above candle 2''s high. Bearish: closes below candle
  2''s low.'
- 'Alternative wording used for the no-C2 path: the candle engulfs the previous candle by
  closing over its body.'
- A C3 closure requires the same lower-timeframe CISD confirmation before candle 4 is traded.
- 'Inside candle 3, let the wick form: wait for the intracandle CISD (or a protected swing
  already formed before the open) before trading the body.'
- 50% of candle 3's whole range is marked and expected to be respected by candle 4.
- C3 closure := the candle closes over the BODY of candle 2 (bullish); below the body of candle
  2 (bearish).
- Use C3 when the reach into the point of interest produced NO candle 2 closure - i.e. price
  did not close back inside the previous candle.
- 'Two admissible outcomes when C2 is absent: (a) price sweeps the previous low and then forms
  a C2, tradeable the following day, or (b) the next candle closes over the body of C2 - the
  C3 closure.'
- On a confirmed C3 closure, anticipate price to trade in that direction on the FOLLOWING
  candle.
- An ideal C3 closure additionally creates a protected swing.
- Candle 3 is the candle immediately following the confirmed candle 2.
- Expect candle 3 to expand in the direction the candle 2 reversed toward.
- Require candle 3's wick to form in the relevant half of the preceding candle (upper half
  for a bullish continuation) - a shallow wick supports expansion.
- Where a correlated asset is being used for confirmation, wait for that asset's corresponding
  candle to close before acting inside candle 3.
- Enter inside candle 3 on the lower timeframes at the point of interest inside the T-spot.
- C3 must close beyond the open of C2 for the sequence to have delivered.
- Within C3, wait for the counter-directional wick to complete, then trade the body.
- 'Alignment check: count how many timeframes are simultaneously in C3; more alignment implies
  easier expansion.'
- 'Sequential case: a mechanical candle two closure plus a change in state of delivery makes
  the following candle a candle three.'
- 'Standalone case: the candle does not need to sweep the prior candle''s extreme, and it
  does not need to close beyond the opening price, provided the EQ is respected - he calls
  a monthly candle bearish on exactly this basis.'
- A C3 closure is a valid short/long framework in its own right; the absence of a C2 sweep
  is not a disqualifier.
- In an earlier version of his course a wider class of candles was labelled C3 using the EQ;
  he narrowed the wording because students confused it.
- 'Candle 2 closure: price trades beyond the reference level (a sweep) and closes back inside.'
- 'Candle 3 closure: no sweep occurs - the candle engulfs instead - and closes through.'
- These two are the only defined swing-point closures; there is no candle 4 closure.
- Candle 2 is always a swing point.
- Trade the continuation after the closure, not the closure itself.
invalidation:
- Price trades through the wrong half of the C3 range instead of respecting it.
- Candle 3 fails to close beyond candle 2's opening price (closure sense).
- Candle 3 itself prints as a reversal candle rather than expanding -- he then looks to candle
  4 instead.
- The candle 2 protected swing is taken out.
- Price closes beyond the EQ of the preceding candle on the aligned timeframe (see invalidation-trade).
- Neither a candle 2 nor a candle 3 closure prints at the point of interest.
- Candle 3 closes back inside candle 2's range instead of beyond it - no candle 4 continuation.
- Candle 4 fails to respect 50% of candle 3's range.
- The candle fails to close beyond the body of candle 2 - no C3, gather more information.
- Candle 3's wick forms beyond the half level of the preceding candle - the shallow-retracement
  condition fails.
- The protected swing formed by candle 2 is taken out.
- C3 does not close beyond the open of C2 - 'then it is nothing'.
- A deep retracement inside C3 that reaches OTE of the impulse leg converts the read to a
  V-shape reversal.
- The EQ not being respected - the directional read is over.
- Price fails to hold the closure and trades back beyond the swing.
measurable:
- frequency of the C2-branch versus the C3-branch after a point of interest is tagged
- hit rate of 2R when entering in the respected half of a C3 range
- frequency of candle 3 closures (close beyond C2 open) vs candle 2 closures, by timeframe
- expansion of C3 conditioned on whether C2 was a reversal candle or an expansion candle
- hit rate of C3 continuation when 1 / 2 / 3 timeframes are simultaneously in C3
- frequency of the C2-absent / C3-present branch
- win rate of candle 4 entries following a C3 that closed outside C2's range
- expansion range of C3 conditional on C2 wick size
- share of C3s that close beyond C2's extreme (licensing C4)
- R distribution of C3-inside-C3 alignments vs single-timeframe C3
- hit rate of next-candle expansion after a C3 closure
- difference in outcome between C3 closures that do and do not form a protected swing
- expansion range of candle 3 following confirmed vs unconfirmed candle 2 closures
- proportion of candle 3s whose wick stays within the relevant half of candle 2
- hit rate of the candle 2 implied draw inside candle 3 alone
- Hit rate of C3 closing beyond the C2 open, by timeframe.
- Expectancy conditioned on the number of aligned C3 timeframes.
- frequency of C3 formations without a preceding C2 sweep
- outcome of the standalone C3 case vs the sequential case
- relative frequency of sweep-type (C2) vs engulf-type (C3) closures
- expectancy of continuations after each type
