ambiguities:
- '''Over the body of candle two'' does not say whether the reference is C2''s open or its
  close (they are the two body edges, and which one applies is not stated).'
- Whether the C3 close must be a body close through that level is not stated.
- xZQOxWQagTA and _WGmLTcIv-E are duplicate uploads of the same Short.
- 'Two wordings for the same reference level: vn1RYjhJUnQ says ''the opening price in candle
  2'', SF61vCsBl1A says ''below the body of candle two''. These coincide only when candle
  2 closed in the sweep direction; when candle 2''s body low is its close rather than its
  open, the two tests differ and no tie-break is given.'
- The dedicated candle 3 video (qdQYhePcvGE, the longest in the unit) never states the closure
  test in price terms at all -- it teaches candle 3 purely as 'the continuation after a confirmed
  candle 2'. The mechanical closure definition comes only from vn1RYjhJUnQ and SF61vCsBl1A.
- In one aside he says candle 3 'can be a reversal candle' too, without saying how to tell
  that case apart in advance.
- This unit contains no reading in which candle 3 is defined against the previous candle's
  EQ; the EQ appears only as the candle-4 continuation filter and as an invalidation level.
  This matters because the library's previously recorded EQ-based C3 rule was degenerate (nearly
  every candle closes above or below the prior EQ); the open/extreme references recorded here
  are not.
- 'CONTESTED across the two halves of the same playlist: unit ..._01 records the reference
  as candle 2''s high/low, this unit records it as candle 2''s opening price / body. No source
  read here reconciles them. Sources for reading B are not cited here because those transcripts
  were not read by this agent -- see the ..._01 drafts.'
- Only ONE extra candle is allowed to print in the worked example; the Shorts never say whether
  a candle 4 closure would also be accepted if candle 3 fails.
- '''Close over the body of candle two'' is stated, but which body edge (open or close) is
  the reference is not.'
- '''Closes strong'' and ''closes over candle 2''s high'' are given as alternatives in the
  same sentence; whether a strong close short of candle 2''s high qualifies is not resolved.'
- The C3-without-C2 path requires closing 'over its body' while the C3-after-C2 path requires
  closing over the HIGH - two different thresholds for the same label.
- Body of candle 2 means the open-or-close extreme of C2, but which one (the open, the close,
  or whichever is further) is not said - on a bullish C3 over a bearish C2 those differ.
- Whether the C3 close must be a body close or merely a trade through the level is not stated.
- The Shorts do not say the C3 read requires a lower-timeframe CISD, though other videos in
  the corpus do. Not backfilled here.
- Neither Short states how many candles may pass between C2 and the C3 closure.
- In video w-JekHg6Ldk a candle four continuation is also named without being defined; the
  numbering beyond candle 3 is not explained in this unit.
- Waiting for the correlated asset's candle to close is stated for one trade only; whether
  it is a general rule is unclear.
- No rule is given for what to do if candle 3 opens beyond the T-spot.
- '''Multiple C3s'' is asserted as the easiest expansion condition but no minimum count is
  given.'
- How far into C3 an entry remains valid is described only qualitatively ('near the opening
  price', 'not after it has made its average range').
- The full mechanical definition is not given here - he refers viewers to the dedicated candle
  three closure video. This entry captures only what the live corrections establish.
- Which EQ is used (of the prior candle, of the leg) is not specified.
- He acknowledges his own definition changed between course versions, so historical material
  may not match.
- '''Engulf'' is not defined - whether the candle must engulf the prior candle''s body or
  its full range is not stated.'
- Whether the two are mutually exclusive on a given candle, or whether a sweep-and-engulf
  counts as both, is not addressed.
- The transcript renders 'candle 2' as 'candle to' in places; it is read as candle 2 throughout.
