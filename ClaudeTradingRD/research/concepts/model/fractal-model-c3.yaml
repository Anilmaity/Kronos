id: fractal-model-c3
name: Candle 3 Continuation (the easier trade)
variants:
  name:
  - Candle 3 (the expansion candle)
  - Candle 3 Closure
  - Candle 3 Continuation (and why C3 exists at all)
  definition:
  - 'Candle 3 is the candle after candle 2, and it carries two distinct meanings that the
    primary teaching finally separates. (a) As a TRADE: candle 3 is the continuation traded
    away from a confirmed candle 2 reversal -- the direction is supplied by the candle 2,
    not by candle 3 itself. (b) As a CLOSURE (a swing-point definition in its own right):
    a candle 3 closure exists only when candle 2 failed to produce a closure, and it is defined
    as candle 3 closing beyond the OPENING PRICE of candle 2 -- below it in the bearish case,
    above it in the bullish case. This is the missing direction input: the reference is candle
    2''s open (equivalently, in the ideal-formation video, candle 2''s body), not the prior
    candle''s equilibrium. It is one-sided and therefore decidable. CONTESTED: the sibling
    unit build_a_model_intro_to_ttrades_fractal_model_01 records a stricter reference for
    the same closure -- beyond candle 2''s EXTREME (its high/low) rather than its open/body.
    Both readings are recorded below; this unit''s videos state the open/body reference explicitly
    and verbatim.'
  - 'The Shorts state the candle 3 branch as an explicit decision procedure at a point of
    interest. If the candle that reached the point of interest did NOT close back inside its
    previous candle, there is no candle 2 and the correct action is to let one more candle
    print and check for a candle 3 closure - defined here as closing over the BODY of candle
    2. If neither a candle 2 nor a candle 3 closure appears, the model does not align and
    the setup is skipped even where direction can be anticipated. Once a candle 3 closes outside
    candle 2''s range, candle 4 becomes tradeable as a further continuation.

    '
  - 'Candle 3 is the expansion candle that follows a confirmed candle 2. A candle 3 CLOSURE
    is a continuation closure: it closes BEYOND candle 2''s extreme (over candle 2''s high
    in a bullish sequence, below candle 2''s low in a bearish one) - the video also describes
    it as engulfing the previous candle by closing over its body. That strong close is what
    licenses candle 4. Candle 3 is also the fallback when candle 2 never printed: if the sweep
    candle failed to close back inside, you wait, and a candle 3 closure on the next candle
    lets you trade candle 4 instead. Trading candle 3 is stated to be the goal of the model
    - ''the easiest is aligning that candle three with a lower time frame candle three, and
    then a continuation entry''.'
  - 'Two Shorts state the candle 3 closure test in identical, unusually crisp terms: a candle
    3 closure is price CLOSING OVER THE BODY OF CANDLE 2 (mirrored below for bearish). It
    is the fallback when no candle 2 closure printed - price reached the point of interest
    but did not close back inside the previous candle, so there is no C2; the two admissible
    continuations are then either that price sweeps the previous low and forms a C2 (tradeable
    the following day), or that the next candle closes over the body of C2, which is a C3
    closure and licenses anticipating expansion in the following candle. A C3 closure that
    also creates a protected swing is called the ideal one.'
  - 'The candle following a confirmed candle 2 closure, traded as a continuation in the direction
    the candle 2 reversed toward. The speaker states outright that the reversal itself is
    difficult to trade and the continuation is much easier, and both trade reviews are structured
    around it: Tuesday reverses, therefore Wednesday is expected to expand higher; a daily
    candle 2 closure on CAD futures, therefore the next day is expected to trade higher into
    the previous month''s high. Candle 3 carries a shape requirement as well as a direction:
    because price is expanding, the retracement inside candle 3 should be shallow, so its
    wick should form in the upper half (bullish) of the preceding candle and inside the T-spot.
    A further timing condition appears in the scalp review - candle 3 is allowed to close
    before acting when the confirming correlated asset''s candle has not yet closed.

    '
  - 'C3 is the candle following a valid C2 closure, in which the expansion is expected and
    traded. Entry is taken inside C3 around its opening price after its wick has formed. The
    strongest conditions occur when several timeframes are simultaneously in C3 (described
    as "multiple C3s"), e.g. a daily C3 that also produces an H1 C3 and, via an H4 C2, a 15m
    C3.

    '
  - 'A distinct formation from a candle two closure, and the distinction is load-bearing:
    when a viewer objected that a setup was invalid because "the C2 didn''t sweep C1", he
    corrected that the formation was not a candle two at all but a candle three closure, and
    pointed to the fact that there are two separate videos for exactly this reason. A C3 also
    arises as the candle following a confirmed C2 - once the change in state of delivery confirms
    the C2, the next candle is a candle three in the new direction.

    '
  - 'Asked to explain candle 1, 2, 3, he gives the derivation of the model rather than the
    usual description, and it produces a clean discriminator. The starting premise is that
    price can only reverse if it makes a swing point, so he went through the swing points
    asking which ones he could actually define. Candle 2 closure was the first: price sweeps
    a level and closes back. Then he noticed that not all of them sweep - some engulf instead
    - and that case became the candle 3 closure. Those two are the only definitions he arrived
    at, and the continuation is traded after them. Candle 2 is therefore always a swing point.

    '
definition: 'SHORTS EVIDENCE, supplying a crisp price-level definition of the C3 CLOSURE that
  the long-form videos leave implicit: candle 3 closes OVER THE BODY OF CANDLE TWO (bullish;
  under it in the bearish case). This is offered as one of exactly two branches after a candle
  that reached a point of interest without a reversal closure - either price sweeps the previous
  low and forms a C2 (trade the following candle), or it closes over the body of C2 and is
  a C3 (anticipate expansion in the following candle). Once a C3 closure prints, the entire
  C3 range is marked and the relevant half of it must be respected. If the expected continuation
  fails to close over its level, the remedy is to wait for a NEW low to form a NEW protected
  swing and re-anchor.'
