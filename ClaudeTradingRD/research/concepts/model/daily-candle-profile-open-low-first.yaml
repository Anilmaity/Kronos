ambiguities:
- WHICH open is meant (the 18:00 open, midnight, or 09:30) is not stated in this Short.
- The EQ is not specified as the EQ of the previous day, of the current day, or of a range.
- '''Respect'' is not resolved into wick-versus-close.'
- '''Probably around 10:30'' - the cutoff is explicitly approximate and the timezone is implied
  (New York) rather than stated.'
- The instrument class matters (indices are discussed); no equivalent cutoff is given for
  forex.
