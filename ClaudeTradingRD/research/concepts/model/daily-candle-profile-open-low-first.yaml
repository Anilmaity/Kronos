id: daily-candle-profile-open-low-first
name: Daily Candle Profile - Open Low First
definition: 'SHORTS EVIDENCE giving the whole daily preparation as a three-mark chart and
  a four-beat expectation. After an ideal candle 2 closure that leaves a protected low, the
  marks required for the next day are exactly three: the EQ, the previous day high and the
  previous day low. If bullish and expecting a continuation, the expectation is: price OPENS,
  trades LOWER FIRST, RESPECTS THE EQ, and then trades HIGHER THROUGH the previous day high.
  The bearish case is the mirror.'
variants:
  definition:
  - 'A bullish daily candle is expected to open and trade low first, forming its low early
    in the day and from a key level, leaving a small wick, then expand and close near its
    high with a large body. A bearish day mirrors this: opens high first, small upper wick,
    closes near its low. The low or high of the day must form at a relevant time - a low of
    day or high of day formed after roughly 10:30 is not accepted, because there is no longer
    a relevant driver time left to expand from.

    '
category: model
status: contested
aliases:
- OLHC / OHLC candle profiles
- how a bullish day forms
preconditions:
- A daily bias exists (here from a trend of protected swings and an ideal C2 closure).
- A directional expectation for the day exists.
- Key levels for the day have been marked (previous day's levels or levels formed intraday).
detection_rules:
- 'Mark exactly three levels for the day: the EQ, the previous day high, the previous day
  low.'
- 'Bullish continuation expectation: open -> trade lower first -> respect the EQ -> expand
  through the previous day high.'
- The 'protected low' from the previous closure is what makes the bias a continuation rather
  than a reversal.
- 'Bearish mirror: open -> trade higher first -> respect the EQ -> expand through the previous
  day low.'
- 'Bullish day: price opens and trades lower first; the low forms from a key level; the opposing
  wick is small; the body closes near the high.'
- 'Bearish day: price opens and trades higher first; the high forms from a key level; the
  body closes near the low.'
- The low/high of day must form before roughly 10:30; a low/high formed later is not treated
  as the day's extreme.
- A key level for the day's extreme may come from the previous day or be formed by the current
  day's own price action (e.g. an Asia consolidation range swept in New York).
- If the candle opens the other way first but does not reach any relevant objective, the profile
  is still acceptable.
invalidation:
- Price fails to respect the EQ on the first move against the bias.
- The day's extreme forms late (after ~10:30) or away from any key level.
measurable:
- share of continuation days whose first move is against the bias and holds the EQ
- hit rate of the previous day high/low target on such days
- distribution of low-of-day / high-of-day formation time
- percentage of daily extremes that coincide with a marked key level
