id: range-edge-trading
name: Range Edge Trading
variants:
  name:
  - Trade The Edges Of A Range, Into The Range
  definition:
  - 'Inside a consolidation, the only trades he will take are at the edges of the range, going
    back into the range. He explicitly refuses to trade in the middle of a range trying to
    exit it. Applied to a specific instrument this becomes an entry-window rule: once the
    range high has already been taken, a long is no longer available - the entry had to happen
    near the daily open or mid-range, before the high was taken.

    '
definition: 'Co-host Nick''s pre-open rule for the consolidating markets of the prior month:
  look at where liquidity was taken and trade the opposite way. His live short: relatively
  equal highs on NQ were taken (stopping out his first short), then price closed below ~260
  and retested it; he entered on a 3-minute structure break with displacement, added on the
  retest, used the 9:30 open candle with no bottom wick as the level, and targeted the 8-9
  a.m. low; invalidation was a new 15m/5m gap or a 5-minute close back above 230 (sic). TTrades
  says Nick normally trades breaker blocks.'
category: model
status: contested
aliases:
- edges of the range
- range trading rule
preconditions:
- The instrument has been classified as consolidating (see phases-of-price).
- The range high and low are marked.
detection_rules:
- In a consolidating regime, identify which side's liquidity was just taken; trade toward
  the other side.
- 'Entry: structure break with displacement after the sweep; add on retest.'
- Only look for entries at the range extremes, directed back toward the middle/opposite side.
- Do not take a trade positioned in the middle of the range aiming to break out of it.
- Do not enter long above the range high, away from the daily open; the window closes once
  the high has been taken.
- If the range low is being taken, a new continuation is required before shorting - taking
  the actual low of the range is where people short and get run out.
- When the daily is not obvious, going to a lower timeframe does not help - a non-obvious
  daily usually means consolidation, and the lower timeframe will just chop.
invalidation:
- One side of the range being taken with continuation - the range is over and the phase changes.
measurable:
- win rate of range-edge entries vs mid-range entries
- how often the range EQ is reached from an edge entry
- frequency of the range low being swept before the range actually resolves lower
