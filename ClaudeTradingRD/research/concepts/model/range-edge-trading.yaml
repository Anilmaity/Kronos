ambiguities:
- '''230'' vs the ''260'' level he named earlier is likely a caption or speech slip; prices
  are NQ point suffixes only.'
- No definition of 'consolidating market' beyond 'the past month'.
- '''Edge'' vs ''middle'' has no boundary - the EQ is used as a target but not stated as the
  dividing line.'
- Interacts with consolidation-range-no-trade, where he says he has no interest at all in
  a consolidating asset; the two are reconciled only by the range being large enough to have
  tradeable edges.
