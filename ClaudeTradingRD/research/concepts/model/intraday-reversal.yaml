id: intraday-reversal
name: Intraday Reversal (4-hour closure plus hourly CISD)
definition: 'Worked live on NQ for a high of the day, with the two confirmations stated as
  ALTERNATIVES ("either ... or"): (a) an hourly CISD - an hourly consolidation, a sweep of
  the consolidation high, then a close through the series of up-close candles that made that
  high; or (b) a 4-hour candle closure, ideally a candle 3 closure. After either, the high
  is expected to hold (in the example "from 6:00 a.m. and on") and a 4-hour / 15-minute model
  is used for entry: a small SMT at the previous high, entry on the 15-minute protected swing,
  exit at 2R or when the correlated asset (YM) hits its own target.

  '
variants:
  definition:
  - 'The signature that fixes the low (or high) of the day, used as the thing the rest of
    the session is traded away from. Its two components as stated live: a 4-hour candle closure
    taking out a low, plus an hourly change in the state of delivery. Once that exists, the
    extreme is treated as the low of the day, and a new continuation is then sought to enter
    on. He points to a dedicated ''intraday reversals'' video for the full treatment and uses
    this as the prerequisite that the fractal model is then aligned to.'
  - 'Ordering stated for the Asia reversal case: the hourly change in the state of delivery
    comes first, then he waits for the 4-hour candle closure to confirm candle 2; entry only
    on a 15-minute continuation that formed before the open of the next 4-hour candle. For
    a reversal day SMT is added as confirmation because the trade is riskier. The 4-hour closure
    paired with an hourly CISD is called ''ideal''.'
  - 'Applied in the recap with only one component named: ES reversed off a low with an hourly
    CISD, and from that he expected the low to be the low of the day and looked for a higher
    low / continuation. No 4-hour closure is mentioned for this instance; the call failed
    on the day.'
category: model
status: contested
preconditions:
- 'A higher-timeframe directional context (in the worked example: previous month''s lows run
  out, an engulfing candle, trending higher).'
detection_rules:
- 'Confirmation A: hourly consolidation, sweep of its high, hourly close through the up-close
  candles that made the high (bearish case).'
- 'Confirmation B: a 4-hour candle closure, ideally a candle 3 closure; either A or B suffices.'
- After confirmation, treat the extreme as the high of the day and drop to the 15-minute.
- Entry on the 15-minute protected swing; an SMT at the previous high is supportive.
- A session extreme forms - in the example, during Asia - by taking out a low.
- A 4-hour candle closure confirms it.
- An hourly change in the state of delivery occurs inside it.
- That extreme is then treated as the low of the day.
- Wait for a new continuation to form before entering; the reversal itself is not the entry.
- Once an intraday reversal exists, align the fractal model to it for execution.
- Hourly CISD (plus SMT on a reversal day) -> then 4H candle closure -> then 15m continuation
  before the next 4H open -> enter.
- Hourly CISD off a swept low -> treat the low as low of the day and seek a continuation.
invalidation:
- The declared low of the day is traded through.
measurable:
- hit rate of 2R from the 15m protected-swing entry after hourly CISD vs after 4H C3 closure
- hit rate of the declared session extreme actually holding for the session
- frequency of the 4H-closure-plus-hourly-CISD combination
