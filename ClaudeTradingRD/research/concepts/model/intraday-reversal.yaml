id: intraday-reversal
name: Intraday Reversal (4-hour closure plus hourly CISD)
definition: 'The signature that fixes the low (or high) of the day, used as the thing the
  rest of the session is traded away from. Its two components as stated live: a 4-hour candle
  closure taking out a low, plus an hourly change in the state of delivery. Once that exists,
  the extreme is treated as the low of the day, and a new continuation is then sought to enter
  on. He points to a dedicated ''intraday reversals'' video for the full treatment and uses
  this as the prerequisite that the fractal model is then aligned to.'
category: model
status: underspecified
preconditions:
- 'A higher-timeframe directional context (in the worked example: previous month''s lows run
  out, an engulfing candle, trending higher).'
detection_rules:
- A session extreme forms - in the example, during Asia - by taking out a low.
- A 4-hour candle closure confirms it.
- An hourly change in the state of delivery occurs inside it.
- That extreme is then treated as the low of the day.
- Wait for a new continuation to form before entering; the reversal itself is not the entry.
- Once an intraday reversal exists, align the fractal model to it for execution.
invalidation:
- The declared low of the day is traded through.
measurable:
- hit rate of the declared session extreme actually holding for the session
- frequency of the 4H-closure-plus-hourly-CISD combination
sources:
- video_id: m0wTBdUe7gs
  title: New York Open Live Q&A
  quote: a 4hour candle closure plus an hourly change delivery
- video_id: yNgx9OAefuI
  title: New York Open Live Q&A
  quote: I would watch my video that I just put out called intraday reversals
ambiguities:
- Whether the 4-hour closure and the hourly CISD must occur in a particular order, or simply
  both be present, is not stated.
- The transcript renders 'change in the state of delivery' as 'change delivery'; the full
  phrase is used elsewhere in the same stream.
- The session in which the reversal may form is not restricted - the example was Asia, but
  London and New York reversals are discussed elsewhere in the corpus.
- He notes that after the reversal there was no continuation he liked, so the quality test
  for the continuation is left to the separate continuation rules.
