id: aligning-expansion-candles
name: Aligning Expansion Candles (The Model)
definition: 'TTRADES'' OWN PRIMARY STATEMENT (this unit) of the concept previously held here
  only in a guest''s voice: when a true trend occurs, all candles are aligned in the same
  direction. The procedure is to require that each higher-timeframe candle in the stack SUPPORTS
  EXPANSION - small wick, large body, opposing run formed early - in the same direction, then
  align structure with it via protected swings / continuation order blocks. The stated minimum
  is TWO aligned expansion candles (e.g. daily + 4-hour, which is enough to execute on the
  15-minute); three (daily + 4-hour + 1-hour or 30-minute) is preferred for a 5-minute or
  3-minute execution. The simplest expression is to trade a candle 3 on multiple timeframes
  at once - ''by definition, that is just a trend''. If any layer has a large wick or opens
  against the intended direction, you do not trade that layer; you wait for its next candle
  open.'
variants:
  definition:
  - 'SHORTS EVIDENCE that repeats the channel''s own headline statement of the model almost
    verbatim: a daily candle 3, a 4-hour candle 3 and an hourly candle 3 stacked together,
    because ''by definition, that is just a trend''. The Shorts add the negative test in the
    same breath - a candle that is a REVERSAL candle is not set up for expansion, so entering
    inside it does not make sense; wait for the NEXT candle, which can support expansion because
    it is the candle 3. The two-layer minimum is illustrated concretely: the daily and the
    4-hour both supporting expansion is what licenses looking for the continuation.'
  - 'The stated purpose of the whole model: trade a daily expansion candle away from a 1-hour
    or 4-hour key level, trade a 4-hour expansion candle away from that same model inside
    the daily expansion candle, and execute on a 1-hour / 30-minute / 15-minute expansion
    candle inside the 4-hour one. Three nested expansion candles are aligned away from the
    same manipulation and toward the same objective. Each layer must independently satisfy
    the expansion filter (small wick), otherwise the trader waits for the next candle open
    at that layer.

    '
category: model
status: contested
aliases:
- expansion alignment
- candle 3 on multiple timeframes
- three expansion candles toward the same draw
preconditions:
- A bias exists; expansion alignment is checked underneath it.
- A directional bias exists.
- Each timeframe in the stack has a candle whose expansion support can be judged.
- A key level and a draw on liquidity have been identified.
- The daily candle profile supports the direction (open low first for a bullish day).
detection_rules:
- 'Check each timeframe in the stack: does the current candle have a small wick and a large
  body in the intended direction?'
- A candle that opens and trades AGAINST the intended direction first, at length, does not
  support expansion - wait for its next open.
- Minimum two aligned expansion candles; three preferred for sub-5-minute execution.
- 'Preferred form: candle 3 on the daily, candle 3 on the 4-hour, candle 3 on the hourly.'
- 'Then align structure: enter on a protected swing / continuation order block inside the
  lowest layer.'
- 'Reversal variant: the same alignment can be built from small-wick reversal candles plus
  a protected swing, but it is harder to anticipate.'
- If the daily does not support expansion, the trade is still allowed with reduced targets
  - back toward the daily open or the intraday extremes rather than a large move.
- 'Check each timeframe: is the current candle a reversal candle or an expansion candle?'
- If the current candle is a reversal candle, do not enter inside it - wait for the next candle
  open.
- 'Preferred alignment: candle 3 on the daily, candle 3 on the 4-hour, candle 3 on the hourly.'
- Two aligned layers (daily plus 4-hour) is enough to look for the continuation.
- The alignment is the trend, not a separate signal.
- Daily candle supports expansion (small wick, opens in the correct direction, extreme formed
  at a key level).
- The 4-hour candle being traded within also supports expansion.
- The 1-hour (or lower) candle used for execution also supports expansion.
- All three are directed away from the same manipulation and toward the same objective.
- If any layer fails the expansion filter, wait for that layer's next candle open.
invalidation:
- Any layer prints a large opposing wick or a large opposing run.
- Any layer prints a large wick or fails to support expansion.
- Any layer prints a large opposing wick or fails to expand away from the level.
measurable:
- R multiple of 3-layer vs 2-layer alignments
- frequency of full 3-layer alignment per month
- outcome of trades taken with the daily NOT supporting expansion (reduced-target branch)
- R multiple of 3-layer versus 2-layer alignments
- frequency of full 3-layer candle-3 alignment per month
- R multiple of trades with 3-layer alignment vs 2-layer
- frequency of full 3-layer alignment occurring per month
