ambiguities:
- 'EVOLUTION vs the Updated playlist: the later canon fixes the ladder at Daily -> Hourly
  -> 5-minute in all three of its examples. This earlier version makes the ladder a FUNCTION
  of the entry timeframe and routinely uses 15-second charts, which the later material does
  not.'
- '''Are we more likely to reach lower here or reach up for this point of interest'' is resolved
  by ''to me this point of Interest makes more sense'' - no test.'
- The auto-captioner renders 'break of structure' as 'breaker structure' and 'fair value gap'
  as 'farewell you have' in the 2022-model sentence.
- No rule orders competing daily-chart levels.
- The daily bias step itself is delegated to his daily bias and weekly profile videos; only
  instances are shown here.
- '''Aligns with my bias'' is not given a test - the hourly point of interest is selected
  visually.'
- The 5-minute PD array used for entry varies by example (fair value gap, breaker block) with
  no selection rule.
- Timing anchors mentioned in passing (midnight open, 8:30 news, 9:30 open) are not organised
  into a rule here.
- 'The ratio between slots is not fixed: daily-to-hourly is 24:1 while weekly-to-4-hour is
  42:1, and no rule selects the pairing.'
- Which timeframe is 'the highest in play' is chosen per example without a stated criterion.
- When the slot-2 chart contains no fair value gap or point of interest he falls back on 'a
  sweep of this previous low', which is a different kind of object and is not listed as part
  of the procedure.
- The procedure is stated for a trending continuation; nothing is said about running it when
  slot 1 is in consolidation.
- Sourced from an ASR (whisper-small) transcript, not YouTube captions; wording may be imprecise.
- The starting timeframe varies by trade (weekly for the ES swing, monthly for the dollar
  analysis, hourly for the ES scalp) and no rule is given for choosing it.
- 'Chart Lessons #1 (video_id Nlw-PZhoViQ) has since been recovered by speech recognition
  and is now cited above. It does NOT contain an explicit framing statement of the procedure
  - it opens the series by saying only that it blends the channel''s concepts into the current
  week''s price action, and then demonstrates the same order of operations without naming
  it. The procedure remains a reconstruction from usage across all four videos.'
- The step where a consolidation is distinguished from a retracement is decided by stated
  distrust of the move in videos UBTl7za9obc and IzOQmcgLyA0, but video Nlw-PZhoViQ supplies
  a mechanical alternative (no closure to continue expanding => consolidation) - see concept
  consolidation-vs-retracement-test.
- The catalogue of daily profiles is assumed known; only 'New York reversal' and 'Asia reversal'
  are named in this unit and neither is defined here.
- What to do when bias and profile disagree is stated only negatively (do not enter), not
  as a rule for flipping or waiting.
- The relative-strength ranking step is used in every session but is not listed as part of
  the three-slot model.
