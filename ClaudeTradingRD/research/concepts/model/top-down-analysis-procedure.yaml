id: top-down-analysis-procedure
name: Top-Down Read (daily bias to entry)
variants:
  name:
  - Top-Down Read (the fixed order of operations)
  definition:
  - 'The three-layer order of operations, stated as the lesson of the worked example: start
    on the daily chart, drop to a lower timeframe to get a point of interest, then drop to
    another lower timeframe to get the entry. In this unit that is daily -> hourly -> 5-minute.
    The daily supplies the bias (a failure to displace over a swing high, an up-close candle
    that should become an order block, a Tuesday high of week implying expansion into Wednesday
    and Thursday) and the levels (previous day high and low, a daily order block). The hourly
    supplies the point of interest, typically an order block validated by displacement around
    the midnight open or before New York. The 5-minute supplies the entry - a fair value gap,
    its consequent encroachment, or a breaker block - with a stop beyond the reaction high/low
    and a minimum 2R marked before leaving runners. He credits the MMXM Trader as the person
    who taught him much of this.'
  - 'The dedicated lesson video states the procedure as three named slots with three different
    jobs. Slot 1, the highest timeframe, supplies direction only - the bias. Slot 2, called
    the intermediate or supporting timeframe, does two jobs: it carries the change in the
    state of delivery that confirms the higher-timeframe wick, and it supplies the point of
    interest to trade from. Slot 3, the lowest timeframe, supplies only the entry, taken on
    an opposing candle or order block at the slot-2 point of interest. The instances shown
    are daily-hourly-5 minute (twice) and weekly-4 hour-15 minute. Crucially he states that
    the third slot is optional: if risk can be managed on the structure timeframe he executes
    there and does not need three timeframes at all.'
  - 'The invariant sequence used to read a chart in every Chart Lessons walkthrough. It is
    an order of operations, not a pattern. Start on the highest timeframe in play and classify
    the phase of price; identify a candle 2 closure (the reversal candle) and the draw it
    implies; drop one timeframe and require a change in the state of delivery inside that
    candle 2 to confirm it; mark the levels the following candle must respect (half of the
    opposing candle, the upper or lower half of the higher-timeframe candle - the T-spot);
    locate a protected swing to serve as the invalidation; then refine the entry downward,
    timeframe by timeframe, only until the risk-to-reward to the nearest real target is acceptable.
    Bias never comes from the entry timeframe; the entry timeframe only supplies the fill
    and the stop.

    '
  - 'Challenged on whether he weights daily bias over daily profile, he states the model as
    an ordered three-slot procedure: daily bias, then daily profile, then entry. He then runs
    it out loud — bias is bullish; profile is a New York reversal; therefore first target
    previous day high, second target the intraday high — and uses the ordering to explain
    why a bullish bias does not license a long into a dying sweep of previous day high: the
    profile has to support the bias before an entry is sought. His live review sequence is
    the same order in reverse-zoom: daily chart (what does the daily candle and its SMT say),
    hourly (where is the range), rank the correlated assets, then drop to the 3-minute for
    the entry into the identified level.

    '
definition: 'The earlier top-down lesson, and it opens with the one thing the later canon
  leaves implicit: which timeframes you take points of interest from is DETERMINED BY YOUR
  ENTRY TIMEFRAME (see poi-timeframe-selection). Under a 5-minute / 1-minute / sub-1-minute
  entry regime the ladder he walks is Daily -> 4-Hour -> 1-Hour -> 15-minute for points of
  interest, then 15/5/1-minute for entries, and 15-second when the entry needs refining further.
  Daily supplies the marked levels (previous highs, an order block, the fair value gap fill,
  internal liquidity) and the question of whether price falls back into the range or reaches
  lower; the 4-hour supplies the session point of interest; the lower timeframes supply the
  entry either INTO a point of interest or AWAY from one once price has reached it.'
category: model
status: contested
aliases:
