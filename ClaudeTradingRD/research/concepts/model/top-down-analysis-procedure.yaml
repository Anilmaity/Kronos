preconditions:
- A daily directional read exists for the coming session.
- Three charts of the same instrument, or two if the entry is taken on the structure timeframe.
- A higher-timeframe chart with at least the previous period's high and low visible.
- For index futures, the correlated assets (YM, ES, NQ) charted alongside for relative strength
  and SMT.
- Daily and hourly charts of the instrument and its correlated set.
detection_rules:
- Fix the entry timeframe first; that selects which timeframes carry your points of interest.
- 'Daily: mark previous highs/lows, order blocks, the fair value gap fill and internal liquidity.
  Mark nothing else - ''that is all I really want to Mark out''.'
- '4-Hour: mark the block that is live for the session you trade.'
- '1-Hour: often contributes nothing; skip it when there is nothing to mark.'
- '15/5/1-minute: take entries either reaching FOR a point of interest or moving AWAY from
  one that price has just tagged.'
- '15-second: used to find low-risk entries toward the already-identified objective.'
- Trade from one point of interest to the next; the low-risk entry is what reduces the risk
  of the leg between them.
- At the destination point of interest, look for the 2022 model (liquidity run, break of structure,
  clean fair value gap) - but he states you do not always get it.
- 'Layer 1 (daily): form the bias, and mark previous day high, previous day low, and any daily
  order block.'
- 'Layer 2 (hourly): find a point of interest that ALIGNS with that bias - wait for displacement
  to validate an order block or breaker around the midnight open / pre-New-York.'
- 'Layer 3 (5-minute): take the entry when price reaches that point of interest, using a fair
  value gap / consequent encroachment / breaker block.'
- Mark the minimum 2R before leaving runners; runners target the swing point beyond.
- SMT at the reaction is used as confirmation, not as the trigger.
- Stop goes beyond the high/low of the reaction that is expected to hold.
- 'Slot 1 (bias): on the highest timeframe, require a formed swing point plus a close beyond
  the previous period''s level; that fixes the direction for everything below.'
- 'Slot 2 (structure / supporting timeframe): look for a change in the state of delivery to
  confirm the higher-timeframe wick has formed, AND use the same chart to locate the point
  of interest to trade from.'
- 'Slot 3 (entry): at that point of interest, look for opposing candles or order blocks and
  take the entry there.'
- 'Instances demonstrated: 1D bias / 1H structure / 5m entry; 1W bias / 4H structure / 15m
  entry.'
- Slot 3 is optional - if risk can be managed on the structure timeframe, execute there; he
  calls the choice personal preference.
- Targets are always taken from the higher timeframes (previous highs, standard deviation
  projections, the higher-timeframe objective), never from the entry chart.
- Step 1 - on the highest timeframe, classify the phase of price (expansion, retracement,
  consolidation, reversal) and identify the draw on liquidity (previous period high or low,
  equal highs or lows).
- Step 2 - identify a candle 2 closure on the working higher timeframe; prefer the continuation
  candle (candle 3) over trading the reversal itself.
- Step 3 - drop one timeframe and require a change in the state of delivery inside that candle
  2 to confirm the reversal.
- Step 4 - mark 0.5 of the opposing candle and the relevant half of the higher-timeframe candle;
  require the next candle's wick to form inside that overlap.
- Step 5 - locate a protected swing to act as the invalidation and stop reference.
- Step 6 - refine downward through the lower timeframes seeking continuations until the risk-to-reward
  to the nearest target is acceptable; enter there.
- Step 7 - manage by phase and by protected swings; partial at the intermediate targets.
- Step 0 - the series is framed as applying the channel's concepts to the current week's price
  action, replayed candle by candle; the read is rebuilt after every close rather than fixed
  once.
- A weak higher-timeframe close against the intended direction does not cancel the bias; it
  raises the confirmation requirement on the lower timeframes instead.
- 'Step 1 — daily bias: read the daily candle (closure, SMT with the correlated asset, previous
  day high/low).'
- 'Step 2 — daily profile: name which profile the day is (e.g. New York reversal) and check
  that it supports the bias.'
- 'Step 3 — entry: only then look for the entry, on the level the first two steps produced.'
- 'Live review order: daily → hourly range → relative strength ranking → execution timeframe.'
- If the profile does not support the bias, do not take the entry even though the bias stands.
invalidation:
- The hourly point of interest failing to align with the daily bias - no trade.
- Price reaching up into the high the entry structure said should hold.
- The lower-timeframe setup points against the slot-1 bias - it is refused rather than traded.
- The protected swing is taken out.
- The higher-timeframe candle fails to respect its half level / the T-spot.
- No acceptable risk-to-reward exists at any refinement level - stand aside rather than extend
  the target.
- Not applicable — this is a procedure.
measurable:
- R of point-of-interest-to-point-of-interest legs
- frequency of the full 2022-model shape at the POI
- how often an aligned hourly point of interest exists given a daily bias
- hit rate of 2R from the 5-minute entry once all three layers align
- contribution of the SMT confirmation to outcome
- R achieved with 3-slot execution vs 2-slot execution on the same signal
- how often the slot-2 chart contains no point of interest, forcing the sweep-of-a-previous-low
  fallback
- proportion of higher-timeframe candle 2 closures that receive a lower-timeframe change in
  the state of delivery
- distribution of the entry timeframe actually used (15m vs 5m vs 3m vs 1m)
- hit rate of the implied draw within N periods of the confirmed candle 2
- outcome of entries taken with bias-and-profile agreement versus bias alone
- distribution of named daily profiles and their follow-through
