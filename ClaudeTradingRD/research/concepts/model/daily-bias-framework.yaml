id: daily-bias-framework
name: Previous Candle High / Low Bias (intraday and daily)
variants:
  name:
  - Daily Bias From The Daily Closure
  - Daily Bias Framework
  - Daily Bias (Previous Day High/Low Framework)
  definition:
  - 'The one-sided daily bias is read off a single daily closure against the previous day''s
    range, and it is a hard gate -- without it he does not drop to the hourly chart. Two cases.
    CONTINUATION CLOSURE: price closes beyond the previous day''s extreme (below the previous
    day low -> expect continuation lower; above the previous day high -> expect continuation
    higher). REVERSAL CLOSURE: price sweeps the previous day''s extreme and closes back inside
    it (sweeps the previous day low and closes back above -> expect a continuation higher
    next day; sweeps the previous day high and closes back below -> expect a continuation
    lower). Both cases produce a directional expectation for the NEXT day, which is the day
    traded.'
  - 'EARLIEST RECORDING OF THE BIAS PROCEDURE IN THE CORPUS, and structurally different from
    the later previous-candle / displacement engine. It is a five-item ordered read: (1) previous
    liquidity taken - because liquidity accumulated at a low must be distributed higher and
    vice versa; (2) swing highs and lows, short-term highs and lows, and relatively equal
    highs and lows, marked because that is where stops rest; (3) market structure shifts and
    imbalances, read as the change in trend; (4) whether price is at equilibrium, premium
    or discount; (5) the plain lower-high/lower-low sequence to see which way price is turning.
    He then cleans the chart down to the closest imbalances and liquidity and states the bias
    as a path, not a direction.'
  - 'Asked to justify a bias on air he reduces it to two steps and calls it not very complex.
    Step one: read yesterday''s daily closure - a bearish closure means bearish. Step two:
    ask which is more likely to be reached today, the previous day high or the previous day
    low; the answer names the bias. He adds the mechanical shortcut he actually uses: the
    daily and hourly model on his own indicator prints a box, and he takes the direction of
    that box as the bias (grey bearish, green bullish) - whenever the model appears, that
    is the bias for the day. The supporting expectation is that a new day is more likely to
    reach a previous day extreme, and that on a bearish day price opens, makes its high, closes
    below it, and that high holds.

    '
  - 'The channel''s default procedure for producing a directional expectation for the coming
    day. Unless the day consolidates, it will take previous day high, previous day low, or
    both; the bias is simply the answer to which is more likely. That answer is produced by
    a short ordered checklist: trend, whether the previous day closed beyond a level or merely
    reached it, failure to displace at swing points, and the next day model. The bias is maintained
    until the draw on liquidity is reached, then re-derived.

    '
  - The compressed version of his daily bias procedure as given inside the draw-on-liquidity
    lesson. Beyond the overall trend, what he focuses on is displacement, or the lack of it,
    over previous day high and below previous day low. Failure to displace over previous day
    high gives a downward bias with previous day low as the draw; failure to displace below
    previous day low gives a bias back into the range; a candle that DOES displace below a
    low implies continuation and the next day is expected to reach for that previous day low.
    A day that closes over the previous day puts previous day high back as the draw.
definition: The same previous-candle test applied continuously as a draw-on-liquidity engine
  rather than as a single call. Unless price consolidates forever it must reach for the previous
  candle's high or the previous candle's low; direction of travel picks which. If price reaches
  one side and cannot displace/close outside, a reversal is framed and the OTHER side becomes
  the next draw. He runs this candle-by-candle on the 4-hour, and says the same procedure
  works on 1-hour, 30-minute and 15-minute but gets noisier the lower you go. When the read
  becomes range-bound he marks the range high and low and waits for one of those instead.
