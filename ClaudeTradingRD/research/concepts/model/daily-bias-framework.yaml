ambiguities:
- '''Displace out of this range'' vs ''close outside'' are used interchangeably; the operative
  test in every example is the CLOSE.'
- The noise claim as timeframes drop is stated but never quantified or bounded (he still uses
  the 1-minute for execution).
- When both a previous-candle level and a left-hand swing point conflict, no precedence is
  given — he lists both and waits.
- '''Closes below its previous day low'' does not say whether the reference is the previous
  day''s wick low or body low.'
- The daily open used is not stated in this unit (18:00 vs midnight); the closure test is
  applied to whatever the charting default produces.
- A day that closes inside the previous day's range without sweeping it is not covered by
  either case; by elimination it produces no bias, but this is never said.
- 'EVOLUTION, NOT CONTRADICTION: this is the earliest bias recording. The later canon (caaS6_Q7O78,
  FXJBFbZQbck) replaces this five-item read with the previous-candle take-and-close test plus
  displacement over previous day high/low. This version is superseded but is the origin of
  the ''liquidity accumulated must be distributed'' rationale. Both preserved.'
- No weighting or precedence among the five items.
- '''The closest imbalances and liquidity'' has no distance rule.'
- The video is explicitly rushed ('made it really quickly before i go on a trip').
- The indicator shortcut is not reproducible without the indicator; he does not give the box's
  derivation, only that it is the daily + hourly model.
- He also says a bias is optional - on a day with none he waits for reactions at points of
  interest instead - so the framework is a preference, not a gate.
- What makes one previous day extreme 'more likely' than the other is left to the closure
  direction alone in this unit.
- Trend, used to break ties, is never defined in this unit (no moving average, no structural
  definition).
- The rules are presented as a narrative, not as a precedence-ordered algorithm; when two
  rules disagree (e.g. weekly bullish, daily bearish) no resolution is given.
- '''Consolidation'' (the no-bias case) has no threshold.'
- The daily candle's session/timezone boundary is not stated in this video.
- '''Displacement'' is never quantified anywhere in this unit - no candle-size, gap or close-beyond
  test is given.'
- This is explicitly a summary; the full procedure is deferred to his dedicated daily bias
  video.
- The order-block-validation confirmation is applied when 'the structure is bearish', with
  structure itself undefined here.
