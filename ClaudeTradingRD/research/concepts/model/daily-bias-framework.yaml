preconditions:
- The daily candle has closed.
- A daily chart plus the intermediate timeframes (1H, 15m) for confirmation.
- The previous daily candle has closed.
- Previous day high and low are marked.
- Previous day (and ideally previous week) high and low are marked.
- Relevant swing points and PD arrays are marked.
- The previous daily candle has closed; previous day high and low are marked.
detection_rules:
- Mark the previous candle's high and low on the working timeframe.
- Direction of travel picks the more likely side to be taken first.
- Side taken + close OUTSIDE -> continue; expect the same side of the next candle to be taken.
- Side taken + close back INSIDE -> reversal; the opposite side becomes the draw.
- Both sides taken in one candle -> no bias; let another candle print.
- Inside bar -> no information; default to trend continuation.
- 'Range-bound stretches: mark the range high/low and wait for price to reach one of them.'
- Confirm the resulting draw on lower timeframes before executing.
- 'Continuation closure: daily close beyond the previous day''s high or low -> bias in that
  direction for the next day.'
- 'Reversal closure: daily trades beyond the previous day''s extreme and closes back inside
  the previous day''s range -> bias away from the swept side for the next day.'
- If neither, there is no one-sided bias and the hourly chart is not consulted.
- Confirm the bias by requiring a change in the state of delivery on the hourly inside the
  candle 2 (the reversal candle) before entries are valid.
- 'The same closure logic is applied fractally: monthly closure gives a bias for the daily;
  weekly closure gives a bias for the week.'
- 1. Mark what liquidity has just been taken; expect distribution toward the opposite side.
- 2. Mark swing highs/lows, short-term highs/lows and relatively equal highs/lows as the stop
  pools.
- 3. Mark market structure shifts and the imbalances (fair value gaps) they leave - these
  signal the change in trend.
- 4. Determine whether price is in premium, discount or at equilibrium of the operative range.
- 5. Read the simple lower-high/lower-low (or higher-high/higher-low) sequence.
- Reduce to the CLOSEST imbalance and the closest liquidity; state the expected path through
  them.
- The bias is a path, not a single direction - e.g. down to take the resting liquidity first,
  then up to the target.
- 'Read the previous daily closure: bearish close -> bearish bias; bullish close -> bullish
  bias.'
- Ask which of previous day high or previous day low is more likely to be reached; that is
  the draw.
- 'Equivalently: take the direction of the daily + hourly model when it prints.'
- Confirm with the daily candle 2 closure plus an hourly CISD (and an SMT if present) from
  the prior day.
- 'Expect the bearish-day shape: open, make the high, close below it, that high holds.'
- 1. If the previous day closed ABOVE previous day high -> bullish; the draw is the next previous
  day high.
- 2. If price reached above previous day high but closed back inside the range -> bearish;
  the draw becomes previous day low.
- 3. Mirror rules for the low side.
- 4. Apply the same two tests on previous week high/low for the weekly frame.
- 5. If previous-period levels are consumed, look left and use the nearest untaken swing point
  as the draw.
- 6. Failure to displace under a swing low -> bias up; over a swing high -> bias down.
- 7. If the day is an inside/indecision candle, declare no bias, mark both extremes, and wait
  for one to be taken.
- 8. Hold the bias until the draw is reached.
- Fail to displace over previous day high -> bearish bias, draw = previous day low.
- Fail to displace below previous day low -> bias back into the range.
- Displace below a low -> continuation expected; next day's draw is the new previous day low.
- Close over the previous day -> draw = previous day high.
- Where structure is bearish but a day closes back inside after sweeping lows, he wants to
  see the next day close BELOW the up-close candle, which validates it as an order block and
  keeps the bearish read.
invalidation:
- He shows it being wrong twice inside one worked example and simply re-reads the next close.
- An opposing candle 2 forms off the previous day extreme on the traded day.
- Price closes beyond the EQ of the previous candle on the aligned timeframe.
- The nominated liquidity is taken and price does not distribute the expected way.
- Price trades and closes beyond the extreme the bias says should hold, at which point the
  day becomes an invalidation trade rather than a bias trade.
- A close beyond the level in the opposite direction to the bias.
- Reaching the draw (the bias is then spent, not wrong).
- A daily close beyond the level whose failure produced the bias.
measurable:
- accuracy of the previous-candle draw by timeframe (4H vs 1H vs 15m) — he asserts degradation
  but gives no numbers
- frequency of both-sides-taken (no-bias) candles
- next-day directional hit rate after a continuation closure vs a reversal closure
- proportion of days with no qualifying closure (no-trade days)
- hit rate of the nominated path (liquidity grab first, then target) vs the direct move
- how often the closest-imbalance simplification changes the call
- hit rate of previous day high / low given the prior day's closure direction
- hold rate of the anticipated daily extreme
- daily frequency of consolidation / one-sided / both-sides outcomes
- hit rate of rule 1 and rule 2 separately
- R-multiple distribution of the London and New York entry patterns shown
- next-day accuracy of each of the four displacement cases
- how often the order-block-validation confirmation follows a sweep-and-close-back-inside
  day
