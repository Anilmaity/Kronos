timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 30m
  - 15m
  - 5m
  fractal: false
execution:
  bias: From the daily chart, established before the session (previous day reversal candle,
    order flow of closes, HTF PD array being drawn to).
  entry: Profile-specific; in all three directional profiles the trigger is a change in the
    state of delivery followed by entry on the resulting order block, usually after an opposing
    run at 08:30.
  stop: Beyond the extreme of the manipulation/opposing run, or beyond the order block, chosen
    by risk-to-reward.
  targets:
  - previous day high/low
  - opposite side of the range
  - failure swings / low resistance liquidity
  - 2R (his stated default)
