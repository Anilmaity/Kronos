timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  - 5m
  fractal: false
execution:
  bias: Opposite the side that was swept at the higher-timeframe PD array.
  entry: On the order block formed by the close through the opposing series of candles; New
    York open itself frequently is that order block.
  stop: At the swing extreme OR at the far side of the order block - he chooses between them
    by risk-to-reward, with a floor of 'over two R'.
  targets:
  - failure swings / low resistance liquidity left behind
  - Asia and London session highs and lows
  - midnight open (used for partials)
  - previous day high/low
