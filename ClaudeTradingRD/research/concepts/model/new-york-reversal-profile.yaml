id: new-york-reversal-profile
name: New York Is Either A Continuation Of London Or A Reversal Of It
variants:
  name:
  - New York Reversal
  - New York Reversal Profile
  definition:
  - 'Defined negatively, in one sentence: a New York reversal daily profile is when LONDON
    DOES NOT FORM A REVERSAL - London either retraces or fails to reach an important level
    - and then in New York price reaches that important level, has the change in the state
    of delivery, and expands away. Because the reversal happens later in the day, this creates
    a LARGER WICK on the higher timeframe, but he states there is still enough body to trade.
    Worked live: London reached lower and moved higher without reaching a relevant higher-timeframe
    level; New York reached it; the first attempt FAILED to change the state of delivery,
    which he reads as the instruction that price will make a new low (or at least trade down
    into the wick) before the real reversal, and the down-close series at that new low - coinciding
    with the New York open - becomes the level.'
  - 'A daily profile with the same daily-candle shapes as a London Reversal (Open-High-Low-Close
    or Open-Low-High-Close) but in which the reversal extreme forms during the New York a.m.
    session instead of London. It is defined by contrast: London ran in the counter direction
    but never reached a relevant higher-timeframe PD array, so price keeps retracing past
    05:00 until New York finally reaches that level, changes the state of delivery there,
    and expands for the rest of the day.

    '
  - 'A daily profile in which price consolidates or trends into the New York session and New
    York itself forms the reversal, after which everything from about 10:00 a.m. should be
    continuation in the new direction. It is walked through on a messy live example: an 8:30
    opposing run against the intended bias, a series of up-close candles forming the high,
    then a closure below that series which says the high should not be taken out, and delivery
    lower into consolidation lows, London lows and previous day lows.

    '
definition: 'In the Rauf episode TTrades takes over the screen to answer how to frame New
  York, and gives the binary directly: New York either continues London''s direction or reverses
  it, and knowing that it is only those two makes the session tractable. The reversal case:
  with a bullish higher-timeframe read, if London sets the current high of the day and there
  is a discount array below, he anticipates a New York reversal - London''s high must be taken,
  then the low forms and the day closes high, producing a bullish reversal candle shape. The
  continuation case: still bearish, he anticipates a reach back into a premium or some PD
  array and then continuation lower into the close, producing the classic sell day profile.
  He anchors this on the midnight open and places it inside the daily profile framework, and
  limits it to the New York AM session. The guest''s independent version is the same binary,
  which is why he only trades New York.'
category: model
status: contested
aliases:
- New York reversal
- New York continuation
- NY reversal
- New York reversal profile
preconditions:
- A higher-timeframe directional read.
- The midnight open marked.
- London's session high and low established.
- A relevant higher-timeframe level (e.g. the previous day low as sellside liquidity) is marked.
- 'A directional daily bias and a specific higher-timeframe PD array marked as the objective
  (examples used: previous day high/low, the consequent encroachment of a wick, a measured
  gap/HTF imbalance, external liquidity).'
- London 02:00-05:00 has completed without reaching that objective.
- A directional bias for the day (bearish in the worked example).
- Price consolidates into or trends into New York rather than having already delivered.
detection_rules:
- Mark the midnight open and London's session high and low.
- 'Bullish read + London set the current high of the day + a discount array sits below: anticipate
  a New York reversal - London''s high is taken, then the day''s low forms and it closes near
  the high.'
- 'Bearish read: anticipate a reach back into premium or a PD array, then continuation lower
  into the close (classic sell day).'
- Classify New York as exactly one of continuation-of-London or reversal-of-London; there
  is no third case.
- Apply within the New York AM session.
- Require that London did NOT form a reversal - it retraced, or failed to reach the important
  level.
- Require price to reach the important level during New York.
- Require a change in the state of delivery there, then expansion away.
- A failure to change the state of delivery on the first touch means expect a new low (or
  a trade down into the wick) first.
- After the new low, use the new series of down-close candles as the level - here it coincided
  with the New York open.
- Enter after the close over that series; stop at the bottom of the order block.
- Expect a larger higher-timeframe wick than the London-reversal profile, but still enough
  body to trade.
- During London, price runs counter to the intended daily direction but does not reach the
  marked higher-timeframe PD array.
- Price continues in that counter direction into the New York a.m. session and reaches the
  PD array there.
- At the level, mark the opposing series of candles; a close back through them is the change
  in the state of delivery and forms the order block.
- If a structure shift occurred in London with no relevant PD array behind it, treat it as
  a fake change in the state of delivery and expect the same liquidity to be run again, ideally
  around the New York opening times.
- A first attempted CISD that fails (price cannot close through) is read as a sign price will
  make a new extreme first; re-mark the opposing series on the new extreme.
- 8:30 makes an opposing run against the bias (higher, if bearish).
- Identify the series of up-close candles that formed that high.
- A closure below that series is the confirmation - until that close he says he has no opinion.
- After the closure, the high should not be taken out; as new opposing candles form, each
  new one supplies the next level that should not be hit.
- Anything from about 10:00 a.m. onward should be continuation lower, not further reversal.
- 'Target ladder: consolidation lows first, then London lows, then previous day lows - roughly
  three targets.'
invalidation:
- Neither shape develops - the day is neither a continuation nor a reversal profile.
- London forms the reversal instead - the day is a London reversal profile, not this one.
- Failure to close back through the opposing series of candles at the level; price makes a
  further new extreme instead and the framing is re-drawn there.
- Price trading back above the most recent opposing candle high after the closure.
- Price trading above the pre-reversal high while still on the bearish read.
measurable:
- split of New York sessions between continuation and reversal, by daily bias
- hit rate of the reversal case conditioned on London setting the day's high plus a discount
  array below
- wick-to-body ratio of NY-reversal days versus London-reversal days
- hit rate after a first failed CISD followed by a new low
- how often a London structure shift with no HTF PD array behind it is subsequently run out
  (the fake-CISD claim)
- hit rate of the 2R+ target on New York Reversal entries
- how often the reversal extreme coincides with 08:30, 09:30 or New York open
- frequency of New York reversal days per instrument
- hit rate of each rung of the three-target ladder
- how often the 10:00 a.m. continuation expectation holds
