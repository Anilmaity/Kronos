ambiguities:
- '''Discount array'' is used without a definition of which array or how the premium/discount
  range is anchored in this exchange.'
- The AM session is not given clock bounds here.
- The last quote is the guest's own statement of the same binary; the first two are the host's.
  They agree, but the reasoning shown on the chart is the host's.
- '"Enough body to trade" is asserted, not quantified - which is the same gap the wick-size
  question has everywhere else in the corpus.'
- No session clock is given for London or New York in either Short.
- '"Relevant higher time frame level" is used as a gate but not defined in these clips.'
- The first Short's transcript ends mid-sentence, so anything after "still enough body to
  trade" is lost.
- '''Relevant'' PD array is never defined; the entire distinction from a London Reversal rests
  on it.'
- The fake-CISD diagnosis is 'look left and see nothing relevant', which is not mechanically
  decidable.
- The profile is not exclusive of London Reversal - the final example is explicitly both,
  because London's continuation reached the HTF objective inside the New York session and
  the reversal was then framed from it.
- Stop selection (swing extreme vs order block edge) is decided by desired R, not by a rule.
- '''Failure swing'' is used as a target type but is never defined in this video.'
- The worked example is explicitly described as messy and lethargic; he does not show a clean
  instance.
- In r7yW6ou1LDs he says he does not trade reversal days at all and only takes the continuation
  off them - so the profile is used for anticipation rather than as a reversal entry.
- The 10:00 a.m. boundary is stated once and not defended.
