ambiguities:
- '''A relevant level'' is the trigger for expecting the counter and is not defined here.'
- No rule is given for choosing the Thursday-intraday branch over waiting for Friday.
- Whether the SMT is required or merely present in the example is not stated.
- '''Significant low'' is the load-bearing precondition and is never quantified. In one example
  a low is disqualified as ''not really... quite close to this low enough to consider a failure
  swing'', which is a visual judgement.'
- '''Small wick'' is the gate for trading the Thursday reversal day, while a ''large wick''
  is what identifies Thursday as a reversal candle. Both appear in the same video with no
  thresholds and appear to pull in opposite directions.'
- No rule is given for choosing among the three Friday targets (weekly open, week's extreme,
  failure swings) when they conflict; only a feasibility check against average daily range
  is offered, and that check itself has no stated ADR calculation.
- '''T-spot'' is used again as the area where the daily wick should form, without definition.'
- The correlated instrument supplying the SMT is unnamed in the first and third examples;
  ES and NQ are named only in the final example.
