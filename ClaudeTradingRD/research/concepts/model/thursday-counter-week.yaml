id: thursday-counter-week
name: Thursday Counter (weekly profile)
definition: 'Two Shorts run the Thursday Counter live. The setup is multiple consecutive days
  of expansion - Monday, Tuesday, Wednesday - into a relevant level, at which point a new
  phase of price is due and Thursday is expected to counter the range. Confirmation is sought
  on the hourly: the previous day''s extreme is taken with an SMT and a change in the state
  of delivery prints, which confirms the counter. From there the trade is either the continuation
  inside the reversal day itself, or the wait for Friday as the continuation day back into
  the range.

  '
variants:
  definition:
  - 'A week in which Monday, Tuesday and Wednesday all expand away from the weekly open without
    creating a significant low (in an upward expansion) or high, leaving the week with no
    meaningful internal swing point, after which Thursday prints a candle 2 closure that counters
    the range. Because Thursday counters an unanchored three-day run its wick tends to be
    large, which is what marks it as a reversal candle. Given an hourly change in the state
    of delivery inside Thursday''s range, Friday is traded back toward the weekly open, the
    current week''s low or high, and any resting failure swings. The speaker credits AM Trades
    with teaching him this profile. It is the one profile in the series where he states he
    will also trade the reversal day itself.

    '
category: model
status: contested
aliases:
- Thursday counter
preconditions:
- Monday, Tuesday and Wednesday expand away from the weekly open in one direction.
- No significant low (upward expansion) or high (downward expansion) is created inside the
  week during those three days.
- A relevant level has been reached by the end of the three-day run.
detection_rules:
- Require multiple consecutive expansion days (Mon/Tue/Wed) in one direction.
- Require that a relevant level has been hit, so a new phase of price is due.
- On Thursday, drop to the hourly and look for the previous day extreme to be taken with an
  SMT.
- Require a change in the state of delivery on the hourly to confirm the counter.
- Trade the continuation inside Thursday, or wait for Friday as the continuation day back
  into the range.
- Confirm the Mon-Wed run has no significant internal swing point; a low belonging to the
  prior Friday does not count as an internal low.
- Thursday prints a candle 2 closure countering the range - after a close on the high this
  means a sweep of the previous day high or an SMT on it.
- An hourly change in the state of delivery exists inside Thursday's range, confirming the
  daily wick.
- Friday is traded as the continuation day back into the week.
- 'Relaxations the speaker explicitly allows: Monday need not expand (a Tuesday and Wednesday
  expansion suffices), and Thursday need not take out Wednesday''s extreme to count as countering
  the range.'
invalidation:
- Thursday expands with the prior three days instead of countering.
- Price expands through the fair value gap it was supposed to respect on the continuation
  day, rather than reacting from it.
- No hourly change in the state of delivery inside Thursday - the daily wick is unconfirmed.
- Where Thursday is a candle 2 closure on both the bullish and the bearish side, only the
  side carrying an hourly CISD is trusted.
measurable:
- frequency of Thursday countering after three expansion days into a level
- R outcome of the Thursday-intraday branch vs the Friday branch
- frequency of weeks with three unanchored expansion days followed by a Thursday counter
- hit rate of Friday reaching the weekly open, and separately the current week's extreme
- how often the weekly-open target lies beyond one average daily range on Friday's open
- performance of trading the Thursday reversal day versus waiting for Friday
