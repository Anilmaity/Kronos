id: trade-away-from-manipulation
name: Trade Away From Manipulation, Never From Failure Swings
category: structure
status: specified
definition: 'TTrades states the same rule in his own voice: he cannot trade higher from failure swings
  and needs something to run out the lows first. Later, after a deep run that left a series of failure
  swings and a gap, he says he cannot trust the resulting low, contrasting it with a low he can trust.'
detection_rules:
- Before trading away from a low, require a run of the lows (manipulation).
- If the move into the low left failure swings, treat the low as untrusted.
sources:
- video_id: Hlwq1dRjBZo
  title: New York Open Live Q&A
  quote: I can't trade higher from failure swings like this.
- video_id: Hlwq1dRjBZo
  title: New York Open Live Q&A
  quote: after we made this deep run it's hard for me to trust anything
ambiguities:
- The trusted vs untrusted low is drawn on the chart only.
related:
