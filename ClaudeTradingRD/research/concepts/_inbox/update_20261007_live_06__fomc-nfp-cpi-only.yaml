id: fomc-nfp-cpi-only
name: Only Three Releases Are Tracked; Never Trade After FOMC
category: time
status: specified
voice: ttrades
definition: 'Restated with a CPI reading that is unambiguous in this transcript: only FOMC, CPI and NFP
  matter (PMI and the 10 a.m. data are ignored). New boundary: these are the only releases he will not
  trade through or hold an intraday position through; he will trade the day before, but not the session
  immediately before the release.'
detection_rules:
- Track only FOMC, CPI and NFP; ignore PMI and other releases.
- Do not hold an intraday position through FOMC, CPI or NFP.
- Do not open a trade in the session immediately before one of these releases.
- Trading on the day before the release is allowed.
sources:
- video_id: uW55Tuk-ngY
  title: New York Open Live Q&A
  quote: I don't really care about PMI. I really only care about FOMC, CPI, NFP.
- video_id: uW55Tuk-ngY
  title: New York Open Live Q&A
  quote: volatile news events that I tend to not trade through or hold something intraday
- video_id: uW55Tuk-ngY
  title: New York Open Live Q&A
  quote: I'll trade the day before. I just won't trade the session before
ambiguities:
- '"Session before" is not mapped to clock times (e.g. whether London is the session before an 8:30 CPI).'
- He is holding a multi-day swing in this stream; whether swing positions are also flattened before these
  releases is not stated - "hold something intraday" suggests only intraday positions are excluded.
- Confirms that the earlier "API, FOMC, NFP" caption in this concept was CPI.
