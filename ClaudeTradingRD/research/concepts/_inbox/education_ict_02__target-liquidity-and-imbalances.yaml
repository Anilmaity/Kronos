id: target-liquidity-and-imbalances
name: Targets Are Liquidity And Imbalances
category: risk
status: specified
definition: 'The dedicated earlier lesson on choosing targets, and it is a closed two-item list: liquidity
  and imbalances. Liquidity means the lows/highs where stops rest, and he singles out relatively equal
  lows/highs as always being a target. Imbalances means fair value gaps, on the trading timeframe
  and on the timeframe above (he cites a 5-minute gap and the 15-minute gap that coincides with the
  same liquidity run), plus order blocks used the same way. His stated reason for adding imbalances
  to the usual liquidity targets is that they give you MORE targets at the cost of exiting slightly
  earlier. The corollary he demonstrates is counter-trend scalping: chain imbalance to imbalance to
  imbalance inside a larger move.'
timeframes:
  htf:
  - 15m
  ltf:
  - 5m
  fractal: true
detection_rules:
- 'Target list 1 - liquidity: the lows/highs where stops rest; relatively equal lows/highs always
  qualify.'
- 'Target list 2 - imbalances: fair value gaps on the trading timeframe and one timeframe up, and
  order blocks.'
- Prefer a level where a liquidity target and an imbalance coincide.
- For counter-trend scalps, take the nearest imbalance, then the next, then the next.
- Accept that imbalance targets exit earlier than liquidity targets.
measurable:
- hit rate of imbalance targets vs liquidity targets
- realised R when exiting at the first imbalance vs holding to the equal highs/lows
sources:
- video_id: pWAjzKndWXo
