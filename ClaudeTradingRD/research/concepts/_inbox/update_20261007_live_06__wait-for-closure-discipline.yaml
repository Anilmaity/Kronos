id: wait-for-closure-discipline
name: Backtest-to-Live Gap Comes From Acting Before the Candle Closes
category: psychology
status: specified
voice: ttrades
definition: 'Restated with a second cause: besides acting on unclosed candles, live traders actively manage
  trades (moving the stop) whereas in backtests they skip forward to stop or target. Remedy: stop interfering
  with trades and wait for closures.'
detection_rules:
- Evaluate rules on closed candles only.
- Do not move the stop or intervene between entry and stop/target, mirroring the backtest.
sources:
- video_id: uW55Tuk-ngY
  title: New York Open Live Q&A
  quote: Stop messing with your trades. Wait for your closures.
