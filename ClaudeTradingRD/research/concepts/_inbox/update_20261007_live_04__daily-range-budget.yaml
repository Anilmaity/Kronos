id: daily-range-budget
name: Daily Range Budget (Eyeballed, Not ADR)
category: risk
status: underspecified
voice: ttrades
definition: 'The ''rope'' analogy for daily range (e.g. ~500 points on NQ). The amount of range the overnight
  sessions have already used governs what New York can deliver: if Asia forms the low and London expands,
  little is expected in New York; if the overnight uses no range and New York reverses, New York is expected
  to use the remaining range. Applied live: NQ had already expanded to the daily level, so he did not
  expect much more range.'
detection_rules:
- Estimate typical daily range (eyeballed, e.g. ~500 pts NQ).
- At the NY open, measure the range already produced by Asia and London.
- If overnight already produced the low/high and most of the range, lower NY expansion expectations /
  skip continuation entries.
- If overnight produced little range and NY reverses, expect NY to deliver the remaining range.
ambiguities:
- No threshold for 'used all the rope' is given.
- Anomaly days (e.g. 1,400-point days) are acknowledged as exceptions.
sources:
