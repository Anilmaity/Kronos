id: psp-precision-swing-point
name: PSP (Precision Swing Point)
aliases:
- precision swing point
category: structure
status: specified
voice: guest
guest_sources:
- GxTradez
definition: 'Two correlated markets closing in opposite directions on the same candle. GxTradez credits
  the concept to ''trader day'' and states it as simply as possible: one closes bullish, the other closes
  bearish, and that indicates a potential reversal.'
timeframes:
  htf:
  - 4H
  - 1H
  ltf:
  - 30m
  - 15m
  - 3m
  fractal: true
preconditions:
- A defined correlated pair/triad is being compared on the same timeframe and candle.
detection_rules:
- Take the same candle index on two correlated markets.
- One closes up, the other closes down — that is a PSP.
- Read it as a potential reversal signal at a key level.
- A PSP that opposes the open draw on liquidity is NOT a reversal — it is a continuation PSP.
invalidation:
- Both markets close the same direction.
measurable:
- PSP frequency per session by triad
- reversal rate of PSP at a key level vs away from one
sources:
- video_id: 3eVxTV_7L2U
  title: A Complete Trading Framework (Universal Models, SMT, Swing Points) | GXT
  quote: It is where between a correlated markets they close in opposite directions
- video_id: 3eVxTV_7L2U
  title: A Complete Trading Framework (Universal Models, SMT, Swing Points) | GXT
  quote: any PSP opposing our draw liquidity will not be used as reversal
ambiguities:
- No minimum body size; a doji-ish opposite close presumably counts.
- Which market of the pair leads is not specified here (he defers to his own PSP and SMT videos).
related:
