id: protected-swing
name: Protected Swing (the invalidation level)
category: structure
status: specified
aliases:
- protected high
- protected low
- new continuation
definition: 'A protected swing is a high or low that is expected to hold while the trend continues;
  it is the model''s invalidation level and, per this unit, the thing entries are actually built
  on. There are three constructions, all of which are ''point of interest, then closure through the
  series of opposing candles that made the extreme'': (1) a short-term low/high is swept, then price
  closes through the series of opposing candles that made it; (2) the sweep is absent but a correlated
  asset swept instead - SMT substitutes, and the opposing candles that made the failure swing are
  used; (3) no sweep at all, but price reaches into a fair value gap, and the opposing candles that
  made the extreme inside it are closed through. Where neither a fair value gap nor a low to be swept
  exists, 0.5 of the opposing candle is used as the point of interest.'
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  - 5m
  - 3m
  - 1m
  fractal: true
preconditions:
- A directional read exists; protected swings are tracked in the direction of trend.
detection_rules:
- 'Identify a point of interest: a swept short-term high/low, OR a fair value gap price has reached
  into, OR (fallback) 0.5 of the opposing candle.'
- Find the extreme formed at that point of interest.
- Find the series of opposing candles that made that extreme (may be a single candle).
- Require a CLOSE through that series' level. Until that close, the swing is not protected.
- 'Once closed through, the extreme is protected: it must hold for the trend to continue.'
- 'SMT substitution: if this asset did not sweep but the correlated asset did, use the opposing candles
  that made the failure swing.'
- Track protected swings forward - each new one supersedes the last as the invalidation.
invalidation:
- Price trades through the protected extreme - the trend read is over.
- A protected swing that is 'instantly invalidated' after forming signals consolidation or reversal
  rather than trend.
execution:
  bias: The direction the protected swing supports.
  entry: At or near the protected swing so the stop is close - stated explicitly as the reason to
    wait for a NEW protected swing rather than use a distant one.
  stop: On the protected swing.
  targets:
  - 2R
  - the marked liquidity / previous candle extremes
measurable:
- survival rate of protected swings by construction type (sweep / SMT / fair value gap)
- share of protected swings invalidated within N bars of forming
- R distribution of entries taken at a fresh protected swing vs at the prior one
