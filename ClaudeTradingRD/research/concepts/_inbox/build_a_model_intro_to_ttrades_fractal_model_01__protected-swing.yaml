ambiguities:
- '''The series of opposing candles that made the extreme'' is judged by eye; in several examples
  he chooses a different candle from the one the mechanical reading would pick, justifying it as
  ''that is the swing high that created this swing low''.'
- Whether the close must be a body close through the OPEN of the first opposing candle or through
  its high/low is never stated.
- The 0.5-of-the-opposing-candle fallback is introduced as 'a quick lesson' in one video and not
  carried into the definition elsewhere.
