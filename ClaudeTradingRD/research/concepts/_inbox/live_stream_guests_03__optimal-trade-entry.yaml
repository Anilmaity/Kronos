id: optimal-trade-entry
name: OTE - The 62 To 79 Retracement (restated in this unit)
aliases:
- OTE
- 62 to 79
category: entry
status: specified
definition: 'Restated in the Trade For Opportunity stream with the numeric definition supplied by
  the guest - the retracement between 62 and 79 from the low to the high or vice versa - and the fibonacci
  level set confirmed on air by the host as 0, 0.5, 0.62, 0.79 and 1. The worked use is confluence:
  the guest anchors the retracement on the leg after a big sell move (the first leg having failed
  to retrace above 50%), finds the 0.62-0.79 band lining up with a five-minute fair value gap, and
  calls that a decent short if the higher-timeframe bias is short. In the Alex''s Options stream the
  same zone is anchored on the wicks - highs and lows rather than bodies - with round-number ''bank
  levels'' offered as an alternative anchor.'
timeframes:
  htf:
  - 1H
  - 15m
  ltf:
  - 5m
  - 1m
  - 15s
  fractal: true
preconditions:
- A confirmed swing high and swing low to anchor the retracement.
- A higher-timeframe bias in the trade's direction.
detection_rules:
- ote := the 0.62 to 0.79 retracement of the leg, measured low-to-high or high-to-low.
- 'Fibonacci tool levels used on air in this unit: 0, 0.5, 0.62, 0.79, 1.'
- Prefer an OTE band that overlaps a fair value gap on the same or a lower timeframe.
- Anchor on the wicks (highs and lows) rather than the bodies; round-number bank levels are used as
  an alternative anchor.
- Require a higher-timeframe bias in the trade's direction before taking the OTE.
invalidation:
- Price trades beyond the 1.0 anchor - the swing that defined the leg is gone.
measurable:
- hit rate of an OTE tap with vs without an overlapping fair value gap
- difference in fill and outcome between wick-anchored and body-anchored OTE
