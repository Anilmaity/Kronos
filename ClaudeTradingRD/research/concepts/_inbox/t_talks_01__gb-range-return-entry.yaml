id: gb-range-return-entry
name: "GB Range-Return Entry (body close through 0.41 plus displacement)"
aliases: ["entry technique two", "trading back into the range"]
category: entry
status: specified

definition: >
  The second entry, used to catch the leg back into the range before the deep retracement. A body
  close beyond the 0.41 is treated as the signal that the local extreme is in and that price will
  retrace toward the 0.705/0.7475/0.79 zone. The close alone is not enough - displacement away
  from the level is required before engaging. The speaker claims roughly 80 percent of closes
  beyond the 0.41 produce that retracement leg.

timeframes:
  htf: ["4H", "1H"]
  ltf: ["15m", "5m", "1m", "5s"]
  fractal: true

preconditions:
  - "A fib is anchored on a validly flipped range."
  - "Price has traded into the shallow band (0.41 / 0.295)."

detection_rules:
  - "Wait for a body close beyond the 0.41. A first close beyond the 0.295 alone is treated as riskier and is not enough."
  - "Apply the body-close rule: if the level was pierced by a wick, require the body close beyond the wick's extreme, not merely beyond the level."
  - "Require displacement away from the 0.41 after the close."
  - "Enter on the retracement back to the 0.41 (or to the 0.295 when trading out of the range), preferably where an unmitigated order block, imbalance or extreme wick coincides."
  - "When trading OUT of the range, expect a body close above the 0.295 first, then a return to the 0.41."
  - "Levels are described as more sensitive when price is trading back INTO the range after displacement than when trading out of it."

invalidation:
  - "No displacement follows the close - the signal is not acted on."
  - "Price returns through the anchor extreme."

execution:
  bias: "Toward the deep zone (0.705 / 0.7475 / 0.79)."
  entry: "Limit at the 0.41 (or 0.295) on the retracement, after the close plus displacement."
  stop: "Not stated as a rule; the worked short used 'maybe at this extreme'."
  targets: ["0.7475", "0.705", "0.79"]

measurable:
  - "measured hit rate of the claimed 80 percent - does a body close beyond 0.41 with displacement produce a retracement to the deep zone"
  - "how often the retracement to 0.41 offers a fill at all after displacement"
  - "R multiple from a 0.41 entry to a 0.7475 exit"

sources:
  - video_id: gjoRPszj-Qk
    title: "AP | Use Market Structure & Fibonacci Levels for Sniper Entries"
    quote: "I'm always looking for displacement away from that area"

ambiguities:
  - "'Displacement' has no size, body-ratio or candle-count threshold."
  - "The 80 percent figure is asserted with no sample, instrument or period."
  - "One stated exception - when direct imbalances line up with the 0.41 and previous structure is being closed through, he takes the entry immediately without waiting - has no general rule."
  - "'Direct imbalances against the trade mean more drawdown should be expected' is a caution with no quantification."

python_detector: null
related: ["gb-levels", "gb-retracement-entry", "body-close-confirmation", "three-pd-array-confluence"]
