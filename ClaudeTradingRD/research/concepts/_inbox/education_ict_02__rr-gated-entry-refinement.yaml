ambiguities:
- No minimum acceptable ratio is stated in this video; 1.79R is called 'not horrible'. The 2R minimum
  recorded elsewhere in the corpus is absent here.
- No stopping rule for how far down to refine; 1-minute is the floor demonstrated, but 15-second is
  used in other videos of this unit.
- The win-rate claim is asserted, never computed.
