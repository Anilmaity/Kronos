id: rr-gated-entry-refinement
name: Refine The Entry Downward Until Risk-To-Reward Works
category: entry
status: specified
definition: 'The dedicated earlier lesson, worked as an explicit arithmetic comparison on one setup.
  Fix the target (the previous day''s low in his example). Enter on the highest timeframe first and
  compute R: the 15-minute entry gives 1.79R. Step down to the 5-minute - here the refinement yields
  nothing, because the order block available gives the same level. Step down to the 1-minute and wait
  for a CONFIRMED setup (structure break plus fair value gap), which allows a much tighter stop and
  a materially higher R to the same target. He states the payoff in win-rate terms rather than profit
  terms: a higher risk-to-reward lets you run a lower win rate.'
timeframes:
  htf:
  - 15m
  ltf:
  - 5m
  - 1m
  - 15s
  fractal: true
preconditions:
- A higher-timeframe point of interest has been tagged.
- The target is already fixed.
detection_rules:
- Fix the target first; never move it to make the ratio work.
- Compute R at the current timeframe's entry and stop.
- If R is unsatisfying, step down one timeframe (15m -> 5m -> 1m) and look for a tighter structure
  to enter against.
- A step down may yield nothing - he shows the 5-minute producing the identical ratio - in which case
  step down again.
- On the lowest timeframe wait for a CONFIRMED setup (structure break plus fair value gap) rather
  than entering at the raw level.
- Where two stop levels are available, the wider one is 'safer' when the nearer level can be run.
measurable:
- R at 15m vs 5m vs 1m entries on the same setup and target
- break-even win rate implied by each
