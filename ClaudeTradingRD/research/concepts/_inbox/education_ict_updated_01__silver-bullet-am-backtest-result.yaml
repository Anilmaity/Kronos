ambiguities:
- The year is never stated, so the window is 'July to mid-August' of an unspecified year.
- Win rate is never given — only equity growth, average RR and trade count. Several stop-outs are visible
  in the replay.
- Losses were visibly taken (at least three stop-outs are narrated) but the loss count is not reported.
- '''45 days'' is calendar days, not trading days; the trade count implies far fewer sessions traded.'
- The reported percentages are on a compounding $100k CFD account at 1% risk; no drawdown figure is
  given.
