id: silver-bullet-am-backtest-result
name: Silver Bullet AM Backtest Result (July-August, NQ, 15 trades)
aliases:
- the silver bullet backtest
category: risk
status: specified
definition: 'The one explicitly numerical backtest in this unit, run live on camera in FX Replay. Instrument:
  CFD NAS100 (NASDAQ), $100,000 starting balance, 1% risk per trade. Period: all of July plus roughly
  the first half of August — he states 45 days. Result: 15 trades, average trade duration 1 hour 29
  minutes, average risk-to-reward about 5, July +23.5%, August-to-date +16.93%, total +44.4%. Management:
  move the stop to break-even at 3R. He immediately caveats the sample himself: 45 days and 15 trades
  is not enough, and a deeper backtest would be needed.'
timeframes:
  htf:
  - 1H
  ltf:
  - 1m
  fractal: false
preconditions:
- The silver-bullet-am-model rules as taught in the same video.
detection_rules:
- 'Sample: 15 trades over 45 calendar days (July + first half of August), NQ / CFD NAS100.'
- 'Account: $100,000, 1% risk per trade.'
- 'Management: stop to break-even at 3R.'
- 'Reported: July +23.5%, August partial +16.93%, total +44.4%, average RR about 5, average hold 1h29m.'
- Roughly a third of sessions produced no trade (no sweep of the 09:00 range, or no entry before 11:00).
invalidation:
- The sample is too small to generalise — he says so on camera.
- Entry selection inside the model was discretionary ('not a fan of that price action'), so the result
  is not reproducible mechanically.
measurable:
- re-run of the same window with a fully mechanical entry rule to separate the model from the discretion
- out-of-sample months
- sensitivity of the result to the 3R break-even rule
