id: wait-for-closure-discipline
name: Backtest-to-Live Gap Comes From Acting Before the Candle Closes
category: psychology
status: contested
voice: ttrades
test_hint: untestable
definition: >
  Asked why trading only feels good in backtesting, he gives two causes. In a backtest you let
  the candles close: you skip ahead until the close and then take the trade. You also leave the
  trade alone and skip forward to see whether the stop or the TP is hit. Live, traders make
  decisions on active candles before they close and actively manage trades by moving the stop,
  and both break the strategy. His remedy, hedged as his usual diagnosis, is to stop messing
  with your trades and wait for your closures.
