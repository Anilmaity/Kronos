id: invalidation-first-timeframe-selection
name: Choose the Timeframe by Where the Stop Can Go
category: entry
status: contested
voice: ttrades
definition: 'Live example of choosing the timeframe by stop placement: on the 5-minute the only fair value
  gap sat far above price, too far for a stop, so he stepped down to the 3-minute (''your next lower time
  frame'') where a gap existed. He loosely names the no-gap condition ''immediate rebalance or something''.
  With no 5m gap, a continuation means the high of the one existing gap should remain.'
detection_rules:
- If the execution timeframe (5m) has no fair value gap near price to anchor the stop, drop to the next
  lower timeframe (3m) and use its gap.
- With no gap on the execution timeframe, the high (bearish case) of the nearest existing gap is the level
  that must hold for continuation.
ambiguities:
- '''Immediate rebalance'' is his tentative label (''what do they call it?''); no distance rule defines
  when a gap is ''too far'' for the stop.'
- No trade was taken, so the 3m-gap stop placement is shown only as framing.
sources:
- video_id: rTomJ8URFnw
  title: New York Open Live Q&A
  quote: I wouldn't want to put a stop all the way up there.
- video_id: rTomJ8URFnw
  title: New York Open Live Q&A
  quote: So you go to the 3 minute, which is your next lower time frame.
