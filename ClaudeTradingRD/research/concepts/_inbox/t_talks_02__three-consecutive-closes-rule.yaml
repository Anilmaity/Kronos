id: three-consecutive-closes-rule
name: "Three Consecutive Daily Closes Rule"
aliases: ["avoid the fourth day in the same direction"]
category: risk
status: specified

definition: >
  A frequency rule derived from observation of the instrument traded: after three
  consecutive daily candles closing in the same direction, no trades are taken in that same
  direction on the fourth day. The speaker's stated basis is that on the chart reviewed,
  price rarely produces more than three consecutive same-direction daily closes before a
  retracement or consolidation profile appears.

timeframes:
  htf: ["1D"]
  ltf: []
  fractal: false

preconditions:
  - "Daily closes for the preceding three sessions are known."

detection_rules:
  - "Count consecutive daily closes in the same direction."
  - "If the count reaches three, do not take trades in that direction on the fourth day."

invalidation:
  - "Not applicable - this is a filter, not a setup."

measurable:
  - "distribution of consecutive same-direction daily close runs per instrument"
  - "expectancy of directional trades on day 4 of a run vs days 1-3"

sources:
  - video_id: JABOO4LYNjQ
    title: "Jokerszn | Daily Orderflow - ICT Daily Bias"

ambiguities:
  - "The rule is presented as personal experience on EURUSD; it is not claimed to generalise across instruments."
  - "It is silent on whether counter-direction trades on day four are permitted (the example implies they are)."

python_detector: null
related: ["consolidation-profile-conditions", "three-daily-profiles"]
