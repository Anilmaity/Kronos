  quote: I would be taking off around 20% of my position
ambiguities:
- The scale-out fraction is given as 20% in one place and 'half' in another, with no rule for choosing.
- No rule chooses between exiting fully at T2 and scaling half there.
- Break even is applied unconditionally on T1, which is the opposite of the mechanical no-break-even,
  no-trail doctrine recorded from a different guest, and of the channel's own protected-swing gate
  - three traders' rules, not one inconsistency.
