id: v-shape-reversal-speed
name: A Real Reversal Is a Fast V-Shape
category: structure
status: contested
definition: 'SHORTS EVIDENCE adding a SECOND, independent axis to the V-shape test. The library entry
  measures V-shapes by SPEED (candle count). This unit adds a DEPTH criterion: when the V-shape is very
  aggressive, price should not return back to the BODY of the move - a retest into the body disqualifies
  it. The speed axis is corroborated negatively in a second Short, where a slow return is called out
  as not fast and not V-shaped, and the structure is reclassified as a consolidation.'
preconditions:
- Price has reached a point of interest and turned.
detection_rules:
- 'Speed test: the recovery back through the opposing series must be fast, not drawn out.'
- 'DEPTH test (this unit): on a very aggressive V-shape, price must NOT return back into the body of
  the move.'
- A slow return that never regains the level is not a V-shape - reclassify as a consolidation.
- The depth test is what lets the stop be placed tight enough for a 2R target just beyond the swept
  extreme.
invalidation:
- Price retraces back into the body of the aggressive V-shape.
measurable:
- outcome split of V-shapes that did versus did not retest into the body
- candle count of the recovery leg versus the move-in leg
sources:
- video_id: M-US3mO2Mkw
  title: 'Aggressive V Shape Reversal: Stop Above the Protected High'
  quote: I don't want to see it return back to the body
- video_id: NlKb5FzZDxo
  title: Avoid Trading Inside a Range
  quote: That is not fast or V-shaped
- video_id: oYwa0YfRaJ0
  title: Breaking Down an Ideal Continuation
  quote: we have a nice V-shaped recovery, closing over those down close candles
ambiguities:
- '''The body'' is not defined - the body of the reversal candle, or of the whole leg, is not stated.'
- '''Very aggressive'' is unquantified, so the depth test only applies to a class he identifies by eye.'
- The depth test and the library's candle-count test are never reconciled; either could fire alone.
