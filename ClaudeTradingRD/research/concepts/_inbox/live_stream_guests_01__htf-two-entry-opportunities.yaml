id: htf-two-entry-opportunities
name: "Two Entry Opportunities On A Higher-Timeframe Curve, One On A Lower"
aliases: ["two opportunities before premium", "one opportunity to buy"]
category: entry
status: underspecified
voice: guest
guest_sources:
- "$niper (Matt)"

definition: >
  A frequency claim $niper attributes to ICT and uses to budget entries. On a higher-timeframe
  model - he defines higher timeframe here as the weekly, the daily and the 4-hour - the buy side
  of the curve is expected to present TWO entry opportunities before price reaches its premium
  array. On anything below that, expect only ONE opportunity to buy before the premium array is
  reached. In the daily example he counts the opportunities as two separate taps into daily fair
  value gaps on the way up.

timeframes:
  htf: ["1W", "1D", "4H"]
  ltf: ["1H", "15m", "5m"]
  fractal: true

preconditions:
- "A market maker model is in progress and the premium (or discount) array that terminates it has been identified."

detection_rules:
- "Classify the model's timeframe: weekly / daily / 4-hour counts as higher timeframe, anything below does not."
- "On a higher-timeframe model, expect two taps into same-timeframe fair value gaps on the buy side of the curve before the premium array is reached."
- "On a lower-timeframe model, expect one."
- "Use the count as a budget: once the expected number of opportunities has been spent, the next event is the premium array, not another entry."

invalidation:
- "Not stated."

measurable:
- "empirical distribution of the number of same-timeframe fair-value-gap taps between the original consolidation and the premium array, split by model timeframe"

sources:
- video_id: UmLWRlXd_V8
  title: "8/14/22  MMXM Live with $niper  - ICT concepts"
  quote: "a buy side of the curve to present two opportunities before reaching its premium"
- video_id: UmLWRlXd_V8
  title: "8/14/22  MMXM Live with $niper  - ICT concepts"
  quote: "most likely get one opportunity to buy before getting to premium array"

ambiguities:
- "'Opportunity' is never defined; in the one worked example it is a tap into a daily fair value gap, but no rule says which fair value gaps qualify."
- "The claim is relayed as ICT's, with no sample, instrument or period behind it."
- "The higher/lower boundary is spoken as 'the weekly the daily and the four hour... anything else like below that', so the 4-hour is the last qualifying timeframe."
- "No guidance for what to do when a third opportunity appears on a higher-timeframe model."

python_detector: null
related: ["mmxm-phase-sequence", "market-maker-model", "premium-discount-equilibrium"]
contributing_units:
- live_stream_guests_01
draft_count: 1
