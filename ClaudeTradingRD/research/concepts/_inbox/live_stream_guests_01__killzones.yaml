id: killzones
name: "Killzones (Trading Sessions)"
aliases: ["kill zones", "session windows", "AM session vs PM session"]
category: time
status: specified
voice: guest
guest_sources:
- "Trader T"
- "Ben (Ben TT)"
- "$niper (Matt)"

definition: >
  Three guests in this unit gate execution on kill zones, and each names a different window - so
  the set is a comparison, not a consensus. Trader T is the only one who gives clock bounds: on his
  simulator's server clock he trades roughly 07:00-10:30 and 12:30/13:00-15:00, and he
  cross-references that clock against a live chart to anchor it (on his build 08:00 server = London
  open = 03:00 Eastern, and he deliberately starts an hour earlier at 07:00 = 02:00 Eastern). He
  stops executing around 15:40 and treats 16:00 as outside his time entirely. Ben trades only in
  kill zones and explicitly prefers the PM session, because that is where he has the most data,
  where the daily draw is clearest to him, and where trading back inside the range suits him.
  $niper checks that his entries fall inside kill-zone times as part of confirming a smart money
  reversal, and says he currently prefers the AM session to the PM.

timeframes:
  htf: ["1D"]
  ltf: ["1H", "15m", "5m", "1m"]
  fractal: false

preconditions:
- "A session indicator is on the chart; Trader T's requires the platform clock to be verified against a live chart first."

detection_rules:
- "Trader T: execute only inside 07:00-10:30 and 12:30/13:00-15:00 on the verified server clock; stop by about 15:40."
- "Trader T: the offset depends on which MT4 build the simulator runs on, so the mapping must be re-derived per platform, not assumed."
- "Trader T: record which kill zone each journalled trade fell in."
- "Ben: trade only in kill zones; his preferred window is the PM session, and he accepts missing AM moves rather than forcing them."
- "$niper: treat the kill-zone window as part of the confirmation - an entry outside the kill zone is not taken."
- "None of the three trades outside a session window; the disagreement is only about WHICH window."

invalidation:
- "The window closes - Trader T abandons setups that mature after his cut-off even when they look valid."

execution:
  bias: "Not set by this rule."
  entry: "Only inside the chosen window."
  stop: "Not set by this rule."
  targets: []

measurable:
- "expectancy by hour of day for the same setup, which is the direct test of the three competing windows"
- "trade count and expectancy of Trader T's first window versus his second"
- "how many valid setups each cut-off discards"

