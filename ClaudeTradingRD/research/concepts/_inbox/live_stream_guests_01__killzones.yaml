ambiguities:
- "Trader T's hours are on a broker server clock whose offset he says varies by MT4 build, so the times are not portable as spoken; both window ends are given as 'roughly' and the second window's start is stated as 12:30 in one place and 13:00 in another."
- "His Eastern conversion implies a fixed 5-hour offset, which will drift across daylight-saving changes; this is not addressed."
- "Ben names no clock times at all - 'the PM session' is left to the listener."
- "$niper's AM preference is explicitly conditional on the current month's price action being poor, not a standing rule."
- "None of the three states his window in a single agreed timezone, so the three cannot be compared directly from the transcripts alone."

