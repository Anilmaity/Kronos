id: consolidation
name: Consolidation
category: structure
status: underspecified
definition: 'A decidable proxy given live: nested inside candles. The daily is an inside day within the
  prior candle, which is itself inside the candle before it - ''inside day inside day'' - and that alone
  classifies the market as consolidation / rangebound. The monthly is read the same way.'
detection_rules:
- Daily candle range contained in the prior daily candle, and that candle contained in the one before
  it -> consolidation.
- Apply the same nested-inside test to the monthly.
sources:
- video_id: 9YVBe-20Hdg
  title: New York Open Live Q&A
  quote: inside day inside day pretty much just a consolidation
- video_id: 9YVBe-20Hdg
  title: New York Open Live Q&A
  quote: So that's just consolidation. Same as the monthly.
ambiguities:
- Whether a single inside day suffices or two nested inside candles are required is not stated; the example
  had two.
