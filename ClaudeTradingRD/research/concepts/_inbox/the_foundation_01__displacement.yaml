id: displacement
name: "Displacement"
aliases: ["displace", "aggressive move", "expansion"]
category: structure
status: underspecified

definition: >
  The single most used and least defined term in this unit. Displacement is an energetic
  directional move that establishes intent — through a level, out of a range, or away from a PD
  array. It is required (in words) by nearly every entry pattern here: order blocks need
  displacement together with a close through the opening price; breakers need displacement paired
  with them, ideally leaving a fair value gap; manipulation is confirmed by an aggressive move back
  into the range; bias flips on a failure to displace. No video in this unit gives a numeric
  test.

timeframes:
  htf: ["1D", "4H", "1H"]
  ltf: ["15m", "5m", "1m"]
  fractal: true

preconditions:
  - "A reference level, range boundary, or PD array."

detection_rules:
  - "No quantitative rule is given by the source. The proxies actually used on the charts are: (a) a candle CLOSING beyond the reference level or back inside the range, rather than merely wicking through it; (b) the move leaving a fair value gap behind it; (c) visibly larger candle bodies than the preceding price action."
  - "Proxy (a) is the most consistently applied in the daily bias video, where 'reach but close back inside' and 'close outside the range' are the two branches of every decision."
  - "Proxy (b) is explicitly endorsed for breakers: displacement is evidenced by the fair value gap that forms (the unicorn model)."

invalidation:
  - "n/a"

measurable:
  - "candidate formalisations to test against the annotated examples: body size > k * ATR(n); presence of an FVG in the impulse; close beyond the level; range of the impulse leg vs the prior N-bar average"
  - "sensitivity of every downstream pattern's hit rate to the chosen displacement threshold"

sources:
  - video_id: DMUiDBnTYc8
    title: "Order Blocks Simplified - ICT Concepts"
  - video_id: 75S4vwD4P1U
    title: "Breaker Blocks Simplified - ICT Concepts"
  - video_id: g3oDYq4P9ZE
