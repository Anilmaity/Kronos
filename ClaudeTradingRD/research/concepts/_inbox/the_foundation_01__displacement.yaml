  - video_id: TCFvsZeYvV8
    title: "ICT Power Of 3 - AMD"

ambiguities:
  - "Never quantified anywhere in the available transcripts — no ATR multiple, body ratio, bar count, or gap requirement."
  - "Used interchangeably with 'aggressive move', 'expansion' and 'close outside the range', which are not obviously the same test."
  - "Because displacement gates order block validation, breaker quality, manipulation confirmation and bias flips, ANY automation of this corpus must fix this definition first; it is the highest-leverage open question in the unit."

python_detector: null
related: ["failure-to-displace", "order-block", "breaker-block", "fair-value-gap", "power-of-three-amd", "cisd"]
