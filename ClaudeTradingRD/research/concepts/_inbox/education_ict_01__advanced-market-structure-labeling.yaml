id: advanced-market-structure-labeling
name: Advanced Market Structure Labelling (short-term / intermediate-term)
aliases:
- intermediate term high
- short-term high
category: structure
status: contested
definition: 'EARLIER RECORDING, and the crispest arithmetic statement of the labelling in this unit: a
  high that is HIGHER THAN THE SHORT-TERM HIGHS ON BOTH SIDES OF IT is an intermediate-term high. He uses
  it operationally rather than descriptively - the intermediate-term high is where the stop goes, and
  the trade is only valid while that high holds. The sequence he requires before entering short is: sweep
  a high, then form a short-term high on the OTHER side of it; that second short-term high is what confirms
  the swept high as intermediate-term and therefore as a stop level. He explicitly declines an earlier
  entry because the highs there were failure swings rather than sweeps.'
timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 5m
  fractal: true
preconditions:
- Short-term highs/lows are already labelled on the working timeframe.
detection_rules:
- Short-term high := a local high with lower highs either side (assumed, used without definition).
- Intermediate-term high := a high that is higher than the short-term high before it AND the short-term
  high after it.
- 'To confirm one in real time: after a sweep, wait for a short-term high to print on the far side; only
  then is the swept high intermediate-term.'
- Place the stop on the confirmed intermediate-term high.
- Do not enter short off a high that is a failure swing (a lower high) - require a sweep.
- The confirming short-term high should itself form at a PD array (fair value gap aligned with a mitigation
  block, in the example).
invalidation:
- The intermediate-term high is traded through - that is the stated invalidation of the trade.
measurable:
- how often a swept high is confirmed as intermediate-term by the next short-term high
- stop-out rate on intermediate-term-high stops vs short-term-high stops
sources:
