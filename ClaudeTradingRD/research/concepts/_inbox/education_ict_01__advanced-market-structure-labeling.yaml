  quote: my entry is a fair value Gap overlapped with a mitigation block
ambiguities:
- EARLIER RECORDING. 'Short-term high' is used as assumed knowledge and never defined here, so the recursion
  bottoms out on an undefined term.
- The confirming short-term high must 'form' - whether one candle suffices or two is shown but not stated
  as a rule.
- The later ICT Advanced Market Structure Simplified video (umyCqr_0NsI) is the canonical treatment; this
  is an applied fragment.
