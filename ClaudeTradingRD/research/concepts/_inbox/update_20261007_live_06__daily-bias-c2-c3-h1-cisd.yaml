id: daily-bias-c2-c3-h1-cisd
name: Daily Bias = Daily C2/C3 Closure Confirmed by H1 CISD
category: model
status: contested
voice: ttrades
definition: 'Restated as the easiest way to trade his model with more setups: watch for daily candle 2
  or candle 3 closures and trade either the continuation day or the invalidation of the continuation day.
  Tomorrow''s bias cannot be known until today''s daily candle has closed. For confirming a daily C2,
  drop to the hourly for the CISD.'
detection_rules:
- After a daily C2 or C3 closure, trade the continuation day in its direction.
- If that continuation is invalidated, trade the invalidation.
- Form the next-day bias only after the daily close.
sources:
