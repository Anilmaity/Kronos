  quote: or the invalidation of the continuation day
- video_id: uW55Tuk-ngY
  title: New York Open Live Q&A
  quote: don't try to predict things until you have the daily closure.
ambiguities:
- What constitutes "invalidation of the continuation day" is shown on-chart (two consecutive days) but
  not defined here.
