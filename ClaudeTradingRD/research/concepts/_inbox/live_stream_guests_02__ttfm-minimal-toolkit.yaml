id: ttfm-minimal-toolkit
name: What Is Actually On His Chart (the eight-indicator inventory)
aliases:
- chart indicators
- watermarks
category: model
status: specified
definition: 'Asked about the eight indicators on his chart, TTrades enumerates them: three are watermarks
  (one of which simply prints the instrument name in the corner), two are open/high/low/close profile
  indicators (a weekly one and a daily one), one is a kill zones / sessions indicator, plus volume and
  an ATR trailing stop - and he says of the trailing stop that he has never really used it and of volume,
  separately in the same video, that he does not personally use it. So the working toolkit is: two power-of-three
  profile overlays and a sessions indicator. He also states he presents on TradingView rather than his
  broker platform because charting there is easier, and executes on NinjaTrader.'
timeframes:
  htf:
  - 1W
  - 1D
  ltf: []
  fractal: false
preconditions: []
detection_rules:
- 'Chart carries: weekly open/high/low/close profile, daily open/high/low/close profile, a sessions
  / kill zones indicator.'
- Volume and an ATR trailing stop are present but not used in decisions.
- Watermarks are cosmetic (instrument name, etc.).
- Analysis and presentation on TradingView; execution on NinjaTrader.
invalidation: []
measurable: []
sources:
