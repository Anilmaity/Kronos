  title: Live Q&A with AM Trades - Weekly Profile
  quote: three of them are watermarks two of them are open eye low clothes
ambiguities:
- The transcript renders 'open high low close' as 'open eye low clothes' and 'ATR trail stop' as '8
  carat Trail stop'.
- Volume is on the chart but he says he does not use it - the inventory and the usage claim are in tension
  within the same video; the resolution he gives is that it is simply left up there.
- The sessions indicator's window settings are not given here.
