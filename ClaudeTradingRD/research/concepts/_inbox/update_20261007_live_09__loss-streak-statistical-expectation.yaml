id: loss-streak-statistical-expectation
name: Expect Five To Ten Consecutive Losses Over A Thousand Trades
category: risk
status: specified
definition: 'TTrades'' own version: three losses in a row is not a big deal; with a 50% win rate you will
  lose three times in a row, and three trades say nothing about a win rate - you need on the order of
  100 trades to know it.'
detection_rules:
- Do not treat a three-loss streak as a system failure at a ~50% win rate.
- Do not estimate win rate before roughly 100 trades.
