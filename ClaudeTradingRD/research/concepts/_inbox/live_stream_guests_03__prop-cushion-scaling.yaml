id: prop-cushion-scaling
name: Prop Firm Cushion As The Size-Up Ladder
aliases:
- Apex
- cushion
category: risk
status: specified
definition: 'Prop accounts are named as the fastest route to size, because the cushion above the drawdown
  line is separable from personal capital. The ladder given: pass the evaluation (Apex is the named
  firm), trade a couple of micro contracts until roughly a $2,000 cushion exists, then step to about
  20 micros, then convert to one to five full ES contracts. The binding constraint is stated to be
  mental rather than financial - taking a one- or two-thousand-dollar loss on five to ten ES contracts
  without complete confidence in the setup causes the trader to shrink size on the next trade and
  therefore never recover the loss. His self-reported progression is $600-$1,000 a day before adopting
  ICT to between $5,000 and $10,000 a day on futures alone afterwards, with the improvement attributed
  to the tighter stops and risk management rather than to a better read.'
timeframes:
  htf: []
  ltf: []
  fractal: false
preconditions:
- A passed prop-firm evaluation account.
detection_rules:
- After passing, trade minimum size (a couple of micros) until a cushion of roughly $2,000 exists.
- Step from a couple of micros to about 20 micros, then to one to five ES contracts.
- Do not step up while confidence in the setup being traded is incomplete.
invalidation:
- Cushion falls back below the threshold - step back down.
measurable:
- 'size-step survival rate: proportion of accounts that keep the cushion after each step'
- change in per-trade risk relative to the remaining cushion at each step
sources:
- video_id: V8P6lNIisvc
  title: Q&A Live with Alex's Options - ICT + Strat
  quote: once you have like a $2,000 cushion trading like a couple of micro contracts
- video_id: V8P6lNIisvc
  title: Q&A Live with Alex's Options - ICT + Strat
  quote: on futures alone, I can do between 5,000 and like 10,000 a day
ambiguities:
- The ladder has no drawdown-based cap; twenty micros against a $2,000 cushion is not reconciled with
  any per-trade risk percentage.
- The income figures are self-reported, undated and unaudited.
- This sits against the corpus's own prop-firm sizing rule, which sizes off the drawdown allowance
  rather than off a cushion balance.
