id: asia-entry-conditions
name: When And How He Trades Asia
aliases:
- Asia entries
- positional entries in Asia
- trading Asia
category: model
status: underspecified
voice: ttrades
definition: 'He trades the Asia session in only two situations: (a) an expansion candle is expected - a daily candle
  2 closure means daily candle 3 should expand; (b) price opens near a drawn liquidity so Asia can expand straight
  off the daily open (stated, not demonstrated). A higher-timeframe bias is mandatory. For (a) there are two executions:
  (1) an hourly positional entry when a protected swing formed inside the C2 closure sits very close to the candle-3
  open - enter around the daily open, stop on that swing, 2R; (2) when hourly structure is not good enough for a
  positional entry, wait for a 4-hour candle 2 closure (ideally paired with an hourly CISD) and trade the 15-minute
  fractal model on an intra-candle CISD / new protected swing, stop at the 15m protected high (in his example the
  4-hour wick high), 2R or hourly targets. A reversal day (trading daily candle 2) in Asia needs more: hourly CISD
  + SMT, then a 4-hour closure, then a 15m continuation formed before the next 4-hour open.'
timeframes:
  htf:
  - 1M
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  fractal: false
preconditions:
- A higher-timeframe bias explaining why the daily candle should expand (e.g. monthly reversal + daily ideal C2
  closure).
- Asia session (clock times not stated).
detection_rules:
- 'Gate: daily C2 closure (expansion expected) OR open near drawn liquidity. Otherwise no Asia trade.'
- 'Method 1: hourly protected swing formed before the candle-3 open and close to that open -> enter around the open,
  stop on it, 2R.'
- 'Method 2: if no adequate hourly structure, wait for a 4H C2 closure (ideally + hourly CISD), then 15m IC-CISD
  / new protected swing -> enter, stop on the 15m protected high/low, 2R.'
- 'Reversal-day variant: sweep of PDL/PDH with small wick + hourly CISD + SMT, then 4H closure, then a 15m continuation
  before the next 4H open; stop on that continuation''s extreme, 2R.'
- 'No active management overnight: entry, stop and target set, then left.'
invalidation:
- No HTF bias.
- Protected swing / 15m invalidation taken.
execution:
  bias: Daily C3 direction (or the C2 reversal direction in the advanced case).
  entry: Hourly positional at the daily open, or 15m continuation after a 4H C2 closure.
  stop: The hourly protected swing, or the 15m protected high/low (4H wick extreme in his example).
  targets:
  - 2R
  - hourly-timeframe targets for more R
measurable:
- 2R hit rate of Asia entries conditioned on daily C2 closure vs no closure
- method 1 vs method 2 hit rate and R
- fraction of days where Asia forms the daily high/low given a daily C2 closure
