id: retracement-phase
name: Retracement (Phase Of Price)
category: structure
status: underspecified
aliases:
- slow shallow move
- large range to small range
definition: 'A retracement is the opposite of an expansion: a slow, shallow move opposing the trend,
  sitting between two expansions. Its stated signature has three parts - the move is slow (it consumes
  materially more bars than the expansion it retraces), it is shallow, and it terminates in a PD
  array, generally a fair value gap. Failure swings forming on the opposing side during the retracement
  are treated as the expected accompaniment and become the targets once the new expansion begins.
  A retracement that fails to confirm - price starts back, fails to close through, and then hangs
  around - is re-labelled a consolidation.'
timeframes:
  htf:
  - 1M
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  - 5m
  fractal: true
preconditions:
- An expansion leg has just completed.
detection_rules:
- 'The counter-trend move is slow: it takes visibly more candles than the expansion leg it is retracing
  (worked examples: 9 hours retracing 3 hours of expansion; 8 candles retracing a 3-candle leg).'
- The move is shallow relative to the expansion leg.
- It terminates at a PD array, generally a fair value gap left by the expansion.
- Failure swings form on the opposing extreme during the retracement and become the targets.
- 'Two accepted ways to act: take the candle 2 closure inside the fair value gap on a lower timeframe,
  or wait for the closure through the series of opposing candles (protected swing) on the current
  timeframe.'
- Re-label as consolidation if the retracement fails to confirm with a closure and price then ranges
  instead.
invalidation:
- The counter-move is aggressive and displaces back into the range - that is a reversal, not a retracement.
- The retracement is deep rather than shallow.
execution:
  bias: With the pre-existing trend, resumed after the retracement.
  entry: Candle 2 closure inside the fair value gap, or the closure through the opposing candles
    that forms the protected swing.
  stop: On the wick or the body of the low/high that formed (one example preferred the wick where
    the body lacked a wick).
  targets:
  - the failure swings left on the opposing side
  - previous candle extremes
measurable:
- bar-count ratio of retracement leg to the expansion leg it follows
- retracement depth as a fraction of the expansion leg
- hit rate of the failure-swing target after a confirmed retracement
sources:
- video_id: F0G31iLVpVg
  title: How To Trade Retracement - Phases Of Price
  quote: We want to see a slow shallow move opposing the trend
- video_id: F0G31iLVpVg
  title: How To Trade Retracement - Phases Of Price
  quote: 9 hours worth of candles took up the range of about three hours
- video_id: F0G31iLVpVg
  title: How To Trade Retracement - Phases Of Price
  quote: you want to see them be quick
- video_id: F0G31iLVpVg
  title: How To Trade Retracement - Phases Of Price
  quote: I'm anticipating a low to form in a fair value gap
- video_id: VD4xb9VfMHA
  title: How To Trade Reversal - Phases Of Price
  quote: Takes three candles to get all of this range here
ambiguities:
- 'Two of the stated criteria pull in opposite directions and are never reconciled: the retracement
  should be SLOW (more bars than the expansion) but also QUICK (''you want to see them be quick''),
  the latter being the test for not degenerating into a consolidation. No bar count separates the
  two.'
- '''Shallow'' is unquantified - no fib or percentage bound is given, and one example explicitly
  allows it to ''dig a bit deeper'' as long as the bodies respect the gap.'
- Whether the bodies or the wicks must respect the fair value gap is stated only once, in passing
  ('you can see how the bodies respect').
