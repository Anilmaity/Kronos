    title: "Validating C2 Closures at Points of Interest"
    quote: "do they all occur at a point of interest"
  - video_id: jo2D1AOuxHM
    title: "Validating C2 Closures at Points of Interest"
    quote: "we failed to take out this high, so it is not valid"
  - video_id: La4MlftJc14
    title: "Validating Swing Points for Continuation"
    quote: "We have the sweep, we have the change in the state of delivery"
  - video_id: 0fhZ_jpespw
    title: "Validating Swing Points Is a Fractal Concept"
    quote: "it's a fractal concept, and so we can apply it to any time frame"

ambiguities:
  - "The 'too close' discard step is explicitly discretionary ('does it make sense... probably not') with no distance threshold."
  - "The Shorts do not say how far left a point of interest may be drawn from; one example reaches back to a monthly-chart high."
  - "'Closes back inside' is shown but never stated as body-close vs wick-close."

python_detector: null
