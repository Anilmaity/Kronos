id: fractal-model-c2
name: "Candle 2 Closure (the reversal candle)"
category: model
status: specified
definition: >
  Across five Shorts the candle 2 closure is presented as a two-part gate that is used to PRUNE
  marked swings, not to generate them. Part one: price must sweep the previous candle's extreme
  and close back inside it (equivalently, close below the body of candle 2 in the bearish case).
  Part two: the sweep must have occurred AT a point of interest - a swept high/low or a fair
  value gap. A closure that satisfies one but not the other is removed from the chart. A third,
  discretionary step removes a mechanically valid closure whose swing sits too close to an
  adjacent swing. The same test is applied on the 5-minute chart, which he uses to state that the
  validation is fractal and applies on any timeframe.

timeframes:
  htf: ["1M", "1W", "1D", "4H"]
  ltf: ["1H", "15m", "5m"]
  fractal: true

detection_rules:
  - "Candidate: price trades beyond the previous candle's extreme and closes back inside that candle's range."
  - "Gate 1 - a point of interest must be present at the sweep (a swept previous high/low, or a fair value gap traded into)."
  - "Gate 2 - the closure must be a valid candle 2 (or candle 3) closure; neither alone is sufficient."
  - "If either gate fails, discard the swing rather than trading it."
  - "Discretionary third step: discard a mechanically valid swing that sits too close to an adjacent same-side swing."
  - "The test is applied identically on any timeframe, including the 5-minute."

invalidation:
  - "No point of interest at the sweep."
  - "Price does not close back inside the previous candle's range."

measurable:
  - "fraction of raw sweeps that survive both gates"
  - "follow-through of surviving vs discarded closures"

sources:
