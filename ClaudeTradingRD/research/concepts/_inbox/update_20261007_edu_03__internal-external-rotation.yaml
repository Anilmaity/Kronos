ambiguities:
- He uses a target he himself calls a non-relevant failure swing in example 1; how relevance interacts with the
  'swing that made the swing' rule is not resolved.
- Whether a C3 closure (rather than C2) at the FVG also qualifies is mentioned ('candle two or a candle three closure')
  but only C2 cases are shown.
measurable:
- P(reach the swing that made the swing | C2 closure at FVG) vs unconditional FVG touch
