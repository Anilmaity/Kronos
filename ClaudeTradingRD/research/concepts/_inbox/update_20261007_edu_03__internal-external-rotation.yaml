id: internal-external-rotation
name: Internal <-> External Range Liquidity Rotation
category: model
status: contested
voice: ttrades
definition: 'TTrades'' own version in a dedicated video. Internal liquidity = a fair value gap (C1 wick and C3 wick
  do not overlap); external liquidity = a high or low, a swing point (a high with a lower high each side). The market
  moves between the two, but the rotation is only acted on when a candle 2 (or candle 3) closure prints at the level:
  C2 closure at an FVG -> trade C3/C4 toward external; after external is taken, a C2 closure there -> trade back
  into the FVG. The external target after a reversal at internal liquidity is ''the swing low that made the swing
  high'' (mirror for bullish). Trading FVG -> external with the HTF trend is called easier than trading the retracement
  back in.'
detection_rules:
- Mark FVGs (internal) and 3-bar swing points (external).
- At an FVG, require a candle 2 closure (reversal) before expecting a move to external.
- Target = the swing low that made the swing high (bearish) / the swing high that made the swing low (bullish).
- After external is taken, require a C2 closure there before expecting a move back into internal; do not assume
  it.
- A strong candle closing at the FVG with only a small wick is not a reversal signal - wait for the next candle.
- Prefer the with-trend leg (FVG -> external) over the counter-leg (external -> FVG).
