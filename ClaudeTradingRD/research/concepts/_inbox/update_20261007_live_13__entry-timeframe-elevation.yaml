id: entry-timeframe-elevation
name: "Entry Timeframe Elevation (root-cause fix for stop-outs)"
category: psychology
status: contested
voice: ttrades
definition: >
  Two statements in this stream. A standing personal rule: before the 9:30 open he trades only
  the 15-minute or higher, to avoid pre-open chop; after the open any timeframe is allowed.
  And the standard diagnosis for a viewer who blew an account shorting NQ across 15m/1m/5m/15s
  charts: get off the 1-minute, use higher timeframes; dropping down is driven by fear of
  missing the move, and the higher timeframe does not cause a missed move, only fewer stop-outs.
detection_rules:
  - "Before 09:30 New York: entry timeframe floor = 15-minute."
  - "After 09:30: no timeframe floor."
  - "Repeated chop-outs on 1-minute: move execution up (15-minute in the NQ example)."
measurable:
  - "stop-out rate of pre-09:30 entries on 15m vs 5m/1m"
sources:
  - video_id: wa9m30UHrm0
    title: "New York Open Live Q&A"
    quote: "If I trade prior to 9:30, I'm going to use the 15-minute"
  - video_id: wa9m30UHrm0
    title: "New York Open Live Q&A"
    quote: "That keeps me from getting chopped up prior to the open."
  - video_id: wa9m30UHrm0
    title: "New York Open Live Q&A"
    quote: "Get off the 15-minute and 1-minute and use the higher time frames."
  - video_id: wa9m30UHrm0
    title: "New York Open Live Q&A"
    quote: "You're not going to miss the move cuz of a higher time frame."
ambiguities:
  - "'Get off the 15-minute and 1-minute' is self-contradictory as captioned - he then calls the 15-minute trade straightforward; the 1-minute is the target of the advice."
  - "The 9:30 rule is stated for index futures; not stated for gold or FX."
related: ["daily-wick-confirmation-timeframes", "timeframe-pairing"]
