ambiguities:
- Which bar to anchor the formation to is chosen by eye; no rule selects the starting bar.
- '''Stuck inside'' has no quantitative definition (how many bars, how much of the range).'
- The auto-captions render 'broadening formation' as 'broad information', 'Browning formation', 'brown
  information' and 'routing formation', and 'the tri(angle)' as 'the try' / 'the tribe' / 'the trial'
  throughout - the concept is unmistakable from the drawn examples but no phrasing here is reliable.
