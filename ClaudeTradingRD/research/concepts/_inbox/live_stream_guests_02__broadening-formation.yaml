id: broadening-formation
name: Broadening Formation (as a higher-timeframe outside bar)
aliases:
- the try
- the tri
- compound three
- compound outside bar
category: structure
status: specified
definition: 'In TheSTRAT a broadening formation is NOT a chart pattern to be recognised by eye - it
  is the drawn representation of a higher-timeframe OUTSIDE BAR. When a run of candles has collectively
  taken out both the high and the low of the bars to their left, those bars would be a single 3 (outside
  bar) if compressed onto a higher timeframe, and the guest draws that fact as an expanding wedge by
  connecting successive highs and successive lows. He says explicitly that you draw it because your
  broker will not show you it - the timeframe on which it would be one candle may be arbitrary (his
  example: ''some wonky time frame like a two and a half day chart''). The formation is redrawn (widened)
  every time a new extreme prints, and a NEW formation is started whenever price gets stuck inside the
  current one.'
timeframes:
  htf:
  - 1Y
  - 1Q
  - 1M
  - 1W
  - 1D
  ltf:
  - 1H
  - 15m
  - 5m
  - 3m
  - 1m
  fractal: true
preconditions:
- A reference candle (or bar group) whose high and low have both since been exceeded.
detection_rules:
- Find a bar whose high has since been exceeded AND whose low has since been exceeded by the bars to
  its right - those bars are a compound 3 relative to it.
- Draw the upper boundary through the successive higher highs and the lower boundary through the successive
  lower lows.
- Redraw (extend) the boundary the moment a new high or new low prints, because you now have more information.
- When price fails to take either boundary and gets stuck inside, terminate that formation and begin
  a new one from the stuck range.
- Failing one side of the formation and reversing back in means the other side is the objective.
- Once price is outside the formation and stays outside, expect expansion toward the next pivot target.
invalidation:
- Price gets stuck inside without taking either side - the formation stops being tradeable and a new,
  smaller one starts.
execution:
  bias: Away from the side that was failed, toward the untouched side.
  entry: A 1-minute or 5-minute reversal signal at the boundary the formation was rejected from.
  stop: Not stated.
  targets:
  - the opposite boundary of the formation
  - pivot targets beyond it once price exits
measurable:
- hit rate of the opposite boundary after a failed boundary + reversal
- how often a formation is re-drawn before it resolves
- return of trades taken while price is stuck inside vs outside
