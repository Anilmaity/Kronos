id: smt-divergence
name: "SMT Divergence"
aliases: ["SMT", "crack in the correlation"]
category: structure
status: underspecified

definition: >
  A disagreement between two correlated instruments at the same structural point: one makes a
  higher high (or lower low) while the other fails to. The speaker describes it as a crack in the
  correlation. In this unit it appears only as a confluence/filter, never as a standalone
  lesson — the dedicated SMT video listed for this study unit has no transcript available.

timeframes:
  htf: ["1D", "1H"]
  ltf: ["5m"]
  fractal: true

preconditions:
  - "Two correlated instruments (examples used: NASDAQ vs ES, YM vs NQ)."
  - "A shared reference swing point in time."

detection_rules:
  - "Bearish SMT (as demonstrated): at the same time window, instrument A prints a LOWER high while instrument B prints a HIGHER high."
  - "Bullish SMT (implied by the mitigation-block use case): at the same low, one instrument sweeps the prior low while the other does not."
  - "Use 1: as top-down confluence for a directional bias (NASDAQ lower high vs ES higher high, ahead of a move to previous month's low)."
  - "Use 2: as the ONLY condition under which the speaker will trade a mitigation block — the correlated instrument swept (so it has a breaker) and the unswept instrument should therefore not reach that low."

invalidation:
  - "Not stated."

execution:
  bias: "Toward the instrument that failed to make the new extreme (i.e. against the divergent extreme)."
  entry: "Not defined here; used as a filter on other entries."
  stop: "Not stated."
  targets: ["not stated"]

measurable:
  - "hit rate of mitigation blocks with SMT vs without (the video's explicit claim)"
  - "frequency of SMT at session/day extremes on correlated index pairs"

sources:
  - video_id: bbWPoajy2MY
    title: "Mitigation Blocks Simplified - ICT Concepts"
  - video_id: YESqIoA7Wyg
    title: "Important Liquidity Levels - Draw On Liquidity - ICT"

ambiguities:
  - "The dedicated video 'SMT Divergence - ICT Concepts' (27S9gjgcSlI) is listed in this study unit but its transcript was NOT downloaded, so no definitional detail is available — this entry is deliberately thin."
  - "No rule for the comparison window (same bar? same session? same swing?)."
  - "No list of which instrument pairs are considered correlated enough."
  - "No tolerance for 'higher/lower' — an exact-equal high is not addressed."

python_detector: null
related: ["mitigation-block", "breaker-block", "draw-on-liquidity"]
