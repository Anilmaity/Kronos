ambiguities:
- '''Lowest down close candle'' vs ''the series'' is used interchangeably in the examples; for a series
  he marks the whole block.'
- Whether the higher high must CLOSE above the swing high or only wick above is not stated — the diagrams
  show a wick sweep.
- The two stop placements are offered as a risk-to-reward choice, not a rule.
