    title: "Why You Need a Small Wick to Confirm a C2 Reversal"
    quote: "looking to trade a reversal in candle 2, I need a small wick"
  - video_id: U1NJUh1RqMw
    title: "Why You Need a Small Wick to Confirm a C2 Reversal"
    quote: "This allows me to anticipate that this higher time frame wick has formed"
  - video_id: VtFC9SCnlYM
    title: "Using Inversion as an Entry Within the Fractal Model"
    quote: "expecting this to make a very shallow wick to then trade higher"

ambiguities:
  - "THE KEY GAP REMAINS OPEN: the Short poses 'what does that look like' and answers with a confirmation procedure, not a ratio. No number for wick size appears in any of the 49 Shorts in this unit."
  - "Because the wick is confirmed rather than measured, the rule as taught is circular for a detector: you know the wick was small only after the LTF closure that you were going to trade anyway."
  - "'Very shallow wick' (second source) is likewise qualitative."

