id: lack-of-displacement-entry
name: Trade The Lack Of Displacement (his stated main takeaway)
category: entry
status: specified
definition: 'The doctrine he names as the most important thing in the whole video, and it inverts
  the usual ICT emphasis: rather than waiting for displacement in your direction, use the FAILURE
  to displace against you as the entry. Stated in both directions and gated by which side of the curve
  you are on. On the BUY side of the curve, you want lows taken WITHOUT displacement - each such failure
  is a long entry. On the SELL side of the curve, a failure to displace over highs is a short entry.
  The read is continuously updated as price develops: each new short-term extreme is a fresh test,
  and the side that fails leans the other way.'
timeframes:
  htf:
  - 15m
  - 5m
  ltf:
  - 1m
  fractal: true
preconditions:
- A side of the curve (buy side / sell side) has been established, e.g. by an aggressive displacement
  through a higher-timeframe level.
detection_rules:
- 'Establish the side of the curve: displacement down through a higher-timeframe low puts you on the
  sell side; displacement up through a high puts you on the buy side.'
- 'Buy side: mark each short-term low. When one is taken WITHOUT displacement below it, that is a
  long entry.'
- 'Sell side: mark each short-term high. When one is taken WITHOUT displacement above it, that is
  a short entry.'
- 'Continue updating: every new extreme is a new test, and the failing side leans the other way.'
- 'Confirmation shape: a small break followed by an immediate close back inside the range - contrast
  with big closes beyond the level, which are displacement and mean continuation.'
- The same failure paired with a nearby breaker or fair value gap is the refined entry location.
invalidation:
- The level is taken WITH displacement - large aggressive closes beyond it - which flips the read
  to continuation in that direction.
measurable:
- win rate of long entries at non-displacing low sweeps while on the buy side of the curve
- same for the mirrored short case
sources:
