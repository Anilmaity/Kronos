ambiguities:
- '''Side of the curve'' is asserted from the chart rather than derived by a stated rule.'
- How quickly price must close back inside for the failure to count is not bounded.
- He alternates between tiny intraday lows and 'a higher time frame low' as the reference, and only
  says he prefers the latter.
- No stop placement or target is given for these entries in this video.
