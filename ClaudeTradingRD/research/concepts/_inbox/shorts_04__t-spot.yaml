id: t-spot
name: "The T-Spot (overlap of two half levels)"
category: entry
status: specified
definition: >
  The Shorts state the T-spot's function in one line: it is where all entries are looked for,
  because it is where the higher-timeframe wick is anticipated to form. Inside the T-spot the
  Short gives two alternative entries off the same zone - a limit entry when price first reaches
  down into the fair value gap with the stop below the low, or, if confirmation is preferred,
  waiting for price to close over the series of down-closed candles into the important level and
  entering there with the stop on the new protected low. Once candle 3 closes outside candle 2's
  range the same procedure repeats in candle 4.

timeframes:
  htf: ["1D", "4H", "1H"]
  ltf: ["15m", "5m", "1m"]
  fractal: true

detection_rules:
  - "Locate the T-spot on the candle following a confirmed candle 2 closure - it is where the next wick is expected."
  - "Look for entries only inside it."
  - "Limit branch: enter when price first trades into the fair value gap in the T-spot, stop below the low."
  - "Confirmation branch: wait for a close over the series of opposing candles into the important level, stop on the new protected swing."
  - "Repeat in candle 4 if candle 3 closed outside candle 2's range."

invalidation:
  - "Price trades beyond the low used for the stop."

measurable:
  - "share of next-candle wicks that terminate inside the T-spot"
  - "limit-branch vs confirmation-branch fill rate and R outcome"

