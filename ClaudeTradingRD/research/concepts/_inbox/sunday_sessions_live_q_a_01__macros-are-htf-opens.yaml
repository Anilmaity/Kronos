    title: "Candle 2 Confirmations - Live Lesson, Q&A"
  - video_id: WBwoiMDXT2c
    title: "New York Open Live Q&A"
  - video_id: egV_gABTQks
    title: "(CPI) New York Open Live Q&A"

external_corroboration: []

ambiguities:
  - "He concedes there are certain scenarios where a mid-candle window can work but declines to describe them."
  - "This directly contradicts mainstream ICT teaching, which treats macros as independent time windows; the corpus position is a rejection, not a reconciliation."

python_detector: null
