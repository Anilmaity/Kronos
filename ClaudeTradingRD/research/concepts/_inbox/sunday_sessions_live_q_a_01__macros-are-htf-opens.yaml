id: macros-are-htf-opens
name: "Macros Are Just Higher-Timeframe Candle Opens"
aliases: ["macros are not real", "9:50 to 10:10 macro"]
category: time
status: specified

definition: >
  He rejects the ICT concept of intraday macro windows entirely. What people call a macro (for
  example 9:50 to 10:10) is, in his account, nothing more than the opening of new higher-timeframe
  candles at 10:00 (4-hour, 1-hour, 30-minute). Entering inside a mid-candle time window contradicts
  his own method, which requires letting the new candle open and form its wick before trading the
  body. He states he will never make a macro video except as a troll, and he likewise does not use
  kill zones, the midnight open, or the new day opening gap.

timeframes:
  htf: ["4H", "1H", "30m"]
  ltf: []
  fractal: false

preconditions:
  - "An intraday time-window concept is being considered."

detection_rules:
  - "Identify what higher-timeframe candle opens at the start of the claimed macro window."
  - "Treat the behaviour as a function of that candle open, and wait for the candle to form its wick before trading."

invalidation: []

execution:
  bias: "Not applicable."
  entry: "Trade the higher-timeframe candle open rather than a mid-candle window."
  stop: "Not specified by this concept."
  targets: ["Not specified by this concept."]

measurable:
  - "comparison of volatility around HTF candle opens versus around claimed macro windows that do not coincide with one"

sources:
