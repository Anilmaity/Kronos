id: daily-open-eighteen-hundred
name: The Daily Open He Uses Is 18:00, Not The Midnight Or True Day Open
aliases:
- 1,800
- true day open
category: time
status: contested
definition: 'Asked to choose between the midnight open and 18:00 he answers that he always uses 18:00.
  Asked about the True Day Open he says he just uses the daily open - the normal CME or whatever the
  data feed''s open is - and gives the reason: he is trading the actual daily candle, so he sees no
  reason to take his opening price from a different timeframe. The weekly open is treated the same
  way: literally the Sunday open, marked out with nothing fancy around it.'
timeframes:
  htf:
  - 1W
  - 1D
  ltf:
  - 1H
  - 15m
  fractal: true
preconditions:
- A futures data feed whose daily candle opens at the session open.
detection_rules:
- Daily opening price = the open of the actual daily candle on the CME/data-feed session, which he
  states as 18:00.
- Weekly opening price = the Sunday open of the weekly candle.
- Do not substitute a True Day Open or a separately derived opening level.
invalidation:
- Not applicable - a level definition.
measurable:
- respect rate of the 18:00 open vs the midnight open as intraday support/resistance
sources:
- video_id: sdZkE-naNiY
  title: TTrades Indicator Updates - Walkthrough and Q&A
  quote: I always use 1,800
ambiguities:
- 'Reading A (this unit): the opening price is the 18:00 session open of the daily candle; True Day
  Open is rejected.'
- 'Reading B (elsewhere in the library, concept new-york-intraday-time-levels): the midnight opening
  price is used as intraday support/resistance and as a partials level. Both readings are his, so
  the two are recorded rather than reconciled - the conflicting videos are outside this unit and were
  not read, so no quote is offered for reading B.'
- He says '1,800' without a time zone in this sentence; EST is stated elsewhere in the same video
  for the indicator's clock.
- Whether 18:00 is a level to trade from or only the candle's origin is not stated.
