  quote: OTE of a range internal range liquidity of a range
- video_id: aDYzoae3viQ
  title: 15 Second Chart Example - ICT Concepts
  quote: which is in a discount in ote and then you can enter there
ambiguities:
- EARLIER RECORDINGS. The OTE band's boundaries are never stated as numbers; 0.62 and 0.625 are read off
  charts, and 0.79 / 0.705 never appear in this unit.
- Auto-caption renders 'OTE' variously as 'OT', 'OTE', 'ot te' and 'Ode to'.
- No rule for when the OTE and the PD array do not coincide.
