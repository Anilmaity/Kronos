id: optimal-trade-entry
name: Optimal Trade Entry (OTE)
aliases:
- OTE
- OT
- Ode to
category: entry
status: specified
definition: 'EARLIER RECORDINGS. Used throughout this unit as a RISK-TO-REWARD DEVICE bolted onto an existing
  model rather than as a standalone entry: the stated difference between his model 1 and model 3 is simply
  that model 3 requires the entry to sit in an OTE of the displacement leg, added ''to make sure you have
  solid risk reward''. It is drawn on the displacement range (low that broke structure to the reached
  high) and the levels he reads off it in the examples are 0.62 and 0.625. It is strongest when it coincides
  with a PD array - an order block or fair value gap - and with the discount of the wider dealing range.'
timeframes:
  htf:
  - 1H
  - 15m
  ltf:
  - 5m
  - 1m
  - 15s
  fractal: true
preconditions:
- A displacement leg that broke structure exists.
- A directional bias exists.
detection_rules:
- Fib the displacement leg (low that broke structure -> high reached; mirror for shorts).
- The OTE is the deep retracement zone of that leg; 0.62 / 0.625 are the levels he reads in the examples.
- Require the OTE to coincide with a PD array (order block or fair value gap) where possible.
- 'Best case: OTE of the displacement range AND discount of the dealing range AND a PD array, all at the
  same price.'
- Adding the OTE to a model is a risk-to-reward decision, not a signal - it tightens the entry.
invalidation:
- Price never retraces to the OTE before continuing - the entry is simply missed.
execution:
  bias: Direction of the displacement leg.
  entry: OTE of the leg, ideally on a PD array.
  stop: Below the leg's anchor low / the PD array.
  targets:
  - The leg's high
  - internal range liquidity first, then external
measurable:
- fill rate of OTE-gated entries vs ungated ones, and the R difference
- how often the OTE coincides with an order block or fair value gap
sources:
