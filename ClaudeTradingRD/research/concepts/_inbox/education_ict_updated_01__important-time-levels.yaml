ambiguities:
- The captioner renders 18:00 as '1,00' and '18800'; the daily-open reading is fixed by the surrounding
  sentence ('for the 18800 and0 that will be the daily candle') and by the 4-hour grid implied by 10:00/14:00.
- He says Eastern STANDARD time, not 'New York time' — whether he re-anchors across daylight saving
  is not addressed.
- The forex caveat is stated but the replacement 4-hour grid for forex is never given.
- Nothing in this video mentions a 30-minute or 15-minute candle also opening at 10:00; only the 4-hour
  is named here.
