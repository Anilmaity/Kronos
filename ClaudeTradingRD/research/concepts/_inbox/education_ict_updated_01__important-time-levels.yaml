id: important-time-levels
name: Important Time Levels (18:00, midnight, 08:30, 09:30, 10:00, 14:00 EST)
aliases:
- important time levels
- the times I use every single day
category: time
status: specified
definition: 'Six clock levels he uses daily, all in Eastern Standard Time, each with a stated reason:
  18:00 is the new daily candle open; midnight is the midnight open; 08:30 is when the news embargo
  lifts / high-impact news; 09:30 is the New York Stock Exchange open; 10:00 is a new 4-hour candle
  and sometimes news; 14:00 is a new 4-hour candle. They are used in three distinct ways: 18:00 and
  midnight frame the DAILY candle''s open-high-low-close, 10:00 and 14:00 frame the 4-HOUR candle''s;
  midnight and 08:30 additionally act as support/resistance and as premium/discount markers; and midnight,
  08:30 and 09:30 are where he looks for a Judas swing / order-block formation. He states the caveat
  that these openings shift by asset class — the 4-hour candles change on forex and there is no 09:30.'
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  - 5m
  - 1m
  fractal: false
preconditions:
- Chart timezone set to New York / Eastern Standard Time.
- Instrument is an index future (the 09:30 level does not apply to forex).
detection_rules:
- Mark 18:00 (daily open), 00:00 (midnight open), 08:30, 09:30, 10:00 and 14:00 New York.
- Use 18:00 and midnight with the DAILY candle's open-high-low-close (bullish day = open, low, high,
  close).
- Use 10:00 and 14:00 with the 4-HOUR candle's open-high-low-close / power of three.
- 'Use midnight and 08:30 as support/resistance and as premium/discount markers: bearish and above both
  = a deep premium; bullish and below both = a deep discount.'
- Look for a Judas swing / opposing run forming an order block specifically at midnight, 08:30 and 09:30.
- A retracement inside a bearish 4-hour sequence is expected at the next 4-hour open (10:00, or 14:00
  for the following leg).
- On forex, drop 09:30 and re-derive the 4-hour grid for that asset class.
invalidation:
- Price closing decisively through midnight open / 08:30 open flips them from support to resistance
  (he uses them both ways within one example).
measurable:
- frequency of the day's high or low forming within N minutes of each level
- hit rate of the midnight-open and 08:30-open support/resistance reactions
