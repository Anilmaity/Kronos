id: smt-divergence
name: SMT Divergence
category: liquidity
status: contested
aliases:
- smart money techniques
- smart money divergence
definition: 'TWO DEDICATED PRIMARY-SOURCE LESSONS in this unit, and between them they reduce SMT to
  its minimal decidable test: pick ONE level that both correlated assets are trading at; one asset
  breaks it and the other does not - that is the divergence. Framed structurally: correlated assets
  normally print the same structure (lower low against lower low, lower high against lower high);
  an SMT is where one of them diverges, e.g. a higher low against a lower low. An SMT at the LOWS
  is bullish and an SMT at the HIGHS is bearish, in both cases signalling a possible reversal. He
  prefers the 15-minute for spotting them but uses the 1-minute often, and he wants the divergence
  to occur at a liquidity grab or a point of interest rather than in open space.'
timeframes:
  htf:
  - 15m
  ltf:
  - 5m
  - 2m
  - 1m
  fractal: true
preconditions:
- Two correlated assets are charted on the same time axis (ES/NQ/YM are the pairs used).
detection_rules:
- Choose one shared level (a swing high or swing low) visible on both assets.
- SMT exists when one asset trades beyond that level and the correlated asset does not.
- Divergence at the lows = bullish SMT (possible upside reversal). At the highs = bearish SMT.
- Prefer the 15-minute for identification; the 1-minute is used but is noisier.
- Require the divergence to coincide with a liquidity grab or a point of interest that price is reaching
  for.
- The same test applies inside a fair value gap - see smt-in-fair-value-gap.
invalidation:
- The diverging asset subsequently takes the level the other one took; the divergence is gone.
measurable:
- reversal rate after an SMT at a liquidity grab vs one in open space
- 15m vs 1m SMT counts and their hit rates
sources:
