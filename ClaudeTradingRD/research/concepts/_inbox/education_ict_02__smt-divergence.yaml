  quote: i prefer the 15 minute chart but i do use the one minute chart
- video_id: eHQ4nE-TQ2w
  title: Smart Money Divergences (SMT) - ICT Concepts
  quote: if these lows or highs are broken or taken the divergence is invalidated
ambiguities:
- 'No comparison window is given: ''a certain high we are watching'' is chosen visually and no rule
  bounds how far apart in time the two assets'' reactions may be.'
- No tolerance is stated for an exactly equal high/low.
- The correlated set is never enumerated beyond ES, NQ and YM in these two videos.
