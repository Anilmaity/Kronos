id: cross-asset-reversal-confirmation
name: The Strongest Asset Must Reverse for the Weakest to Expand
category: structure
status: contested
voice: ttrades
definition: 'Restated pre-open as a question to chat: for indices to go higher he wants the weakest asset
  (YM) to reverse off its low and frame the move; for lower, the strongest (NQ) reversing off its high.
  When YM took its low while NQ took its high he framed the day as deciding ''which one''s lying''. Around
  10:00 YM reversed (''that first option''), so he turned bullish for the rest of the day without trading
  it.'
