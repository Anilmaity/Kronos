id: protected-swing
name: Protected Swing (the invalidation level)
aliases:
- it is now protected
- forming a protected low
category: structure
status: contested
definition: 'This unit supplies both the entry-side and the structure-side account of the same object.
  On the entry side: after a sweep of a low and a close back over the candles that made it, he places
  the stop on that new low because it is now protected; and on the daily, a sweep of the previous
  day low that closes back inside is described as forming a protected low that he anticipates will
  hold while the trend continues. On the structure side, the market structure video identifies which
  low that is in trend terms: it is the low that made the new high, before price came back and broke
  it - the pivot whose break ends the trend.'
timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- A swing extreme that price has swept or traded into.
detection_rules:
- The swing is protected once price has swept it and then closed back over the series of candles
  that made it.
- The stop goes on that protected extreme; it is expected to hold while price travels to the objective.
- In structural terms the protected low is the low that made the new high - the pivot whose break
  is what shifts the trend.
- 'Daily instance: price trades back into a fair value gap while sweeping the previous day low, closes
  back inside, and that forms the protected low for the following day.'
invalidation:
- The protected extreme is traded through - which is simultaneously the market structure shift.
measurable:
- hold rate of protected swings until the stated objective
- agreement rate between 'the low that made the new high' and the low the stop was actually placed
  on
sources:
- video_id: iEaMbuFZb24
