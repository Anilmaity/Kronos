ambiguities:
- The entry-side and structure-side accounts are never explicitly identified with each other; this
  unit is the closest the corpus comes and it is still the reader joining them.
- Whether the close back over must be a body close is not stated.
- No rule for how many protected swings may be stacked before the original is discarded.
