id: candle-two-closure-not-required
name: "Candle 2 Closure Not Required (Variant Of The Fractal Model)"
aliases: ["reverting to candle 1's low", "C2 without a closure"]
category: model
status: contested

definition: >
  A deliberate departure from the TTrades fractal model as taught elsewhere in this corpus.
  The speaker states he does not require a candle 2 closure: if candle 2 reaches a key level
  but does not visibly reverse on the higher-timeframe close, he accepts either a reversal
  shown on the lower timeframe within candle 2, or candle 3 confirming the reversal with a
  CISD. Separately, if candle 1 hits the key level but closes as an expansion candle, he
  reverts to candle 1's low as the reversal reference rather than requiring the key level
  itself. He restricts this relaxed swing formation to the daily and 4-hour timeframes.

timeframes:
  htf: ["1D", "4H"]
  ltf: ["1H", "15m"]
  fractal: false

preconditions:
  - "A candle has reached a key level."

detection_rules:
  - "Standard reading: candle 2 fails to displace through candle 1's low, giving a reversal, and candle 3 expands away."
  - "Variant A: candle 2 hits the key level without a visible HTF reversal close - accept a lower-timeframe reversal inside candle 2."
  - "Variant B: candle 3 confirms the reversal with a CISD."
  - "Variant C: candle 1 hits the key level but closes an expansion candle - use candle 1's low as the reversal reference; a strong candle 2 close then implies a candle 3 close, and a strong candle 3 close implies candle 4 expansion."
  - "Apply only on the daily and 4-hour timeframes."
  - "The candle 2 must contain a lower-timeframe reversal signature; a consolidation inside candle 2 is pattern trading, not a reversal."

invalidation:
  - "Neither a lower-timeframe reversal inside candle 2 nor a candle 3 CISD appears."

measurable:
  - "expansion rate of candle 3 with a strict C2 closure vs with the relaxed variants"

sources:
  - video_id: J_EeS2_2CAM
    title: "GxTradez | Phases of Price & Profiles For Expansion"

ambiguities:
  - "Marked contested because it explicitly conflicts with the candle 2 closure requirement taught in the TTrades fractal model elsewhere in this corpus. Only this speaker's side is documented here; the opposing side must be cited from the TTFM units."
  - "The speaker frames it as a personal deviation ('I do this a bit separate from T trades'), not as a correction."

python_detector: null
related: ["reversal-signature", "small-wick-supports-expansion", "aligning-expansion-candles"]
