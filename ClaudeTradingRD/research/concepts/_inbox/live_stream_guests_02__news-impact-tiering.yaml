id: news-impact-tiering
name: Red-Folder-Only News Filter (weekly profile input)
aliases:
- red folder
- high impact only
category: time
status: specified
definition: 'For building the weekly profile, AM Trades filters the economic calendar down to RED FOLDER
  events only - he explicitly filters out yellow and orange folder news on forexcalendar.com and does
  not consider it for weekly manipulation. Within red folder he concentrates on the 08:30 releases,
  with FOMC at 14:30 named as the odd one out. Because he trades indices, USD is the currency he filters
  on. This is the FIRST order of operations for a week: find the first high-impact driver, because accumulation
  and the engineering of liquidity happen before it, manipulation happens at or just prior to it, and
  expansion follows manipulation.'
timeframes:
  htf:
  - 1W
  - 1D
  ltf: []
  fractal: false
preconditions:
- A week's economic calendar filtered to the traded instrument's currency.
detection_rules:
- Filter the calendar to red folder only for the relevant currency (USD for indices).
- Identify the FIRST red-folder driver of the week.
- Expect accumulation / high-resistance price action before it.
- Expect manipulation at or just prior to that first driver.
- Expect expansion after the manipulation - expansion always follows manipulation.
- Treat 08:30 as the standard release time; FOMC at 14:30 is the exception.
invalidation:
- No manipulation forms at the driver - the profile is not confirmed.
measurable:
- distribution of the weekly high/low relative to the first red-folder event of the week
- how often expansion follows manipulation within the same week
sources:
- video_id: wGYde-h84cs
  title: Live Q&A with AM Trades - Weekly Profile
  quote: I only focus on red folder
- video_id: wGYde-h84cs
  title: Live Q&A with AM Trades - Weekly Profile
  quote: always following manipulation we look for expansion
ambiguities:
- 'This is a simplification relative to the same guest''s three-tier (high / medium / low) framing recorded
  from another video: here everything non-red is simply filtered out. Both statements are his; the tiering
  is finer, the red-folder filter is what he says he actually does.'
- '''The first high impact news driver'' - if two land on the same day, no rule chooses.'
