definition: 'Live answers to ''I can''t handle a loss'': change or quit. Changing means take the loss,
  feel it, and do not do anything dumb after it; anyone who sugarcoats that is not helping. On psychology
  in general he requires the specific problem first because ''psychology'' is a blanket term; greed is
  usually holding trades too long, so take trades at the target.'
