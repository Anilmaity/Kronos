  quote: "I'm trying to take like two to three but sometimes I get over overkill"

ambiguities:
- "This is an early (August 2022) statement made about a year into his own trading; it is recorded as spoken and is not reconciled here with the channel's later, much lower frequency doctrine."
- "'Two to three' is stated as an intention ('I'm trying to take'), not as an enforced cap."
- "Whether the count is per instrument or across all instruments is not stated."

