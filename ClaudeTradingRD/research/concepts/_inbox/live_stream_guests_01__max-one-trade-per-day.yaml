id: max-one-trade-per-day
name: "One Trade Per Day Cap"
aliases: ["two to three trades a day", "15-second overtrading"]
category: risk
status: contested
voice: ttrades
guest_sources: []

definition: >
  TTrades' own trade-frequency statement in this 2022 stream, recorded because it conflicts with
  the one-trade-per-day / one-to-two-per-week doctrine the channel states elsewhere. Asked how many
  trades he takes a day, he answers two to three, and volunteers that on the 15-second chart he
  sometimes overtrades badly ('I get over overkill... and I'll take like a lot'). He is a year into
  trading at the time of this recording. No cap, no session limit and no gating condition is
  attached to the number.

timeframes:
  htf: ["1D"]
  ltf: ["15s"]
  fractal: false

preconditions:
- "None stated."

detection_rules:
- "Stated target frequency in this unit: two to three trades per day."
- "He identifies the 15-second execution timeframe as the specific cause of taking far more than that."
- "No daily loss cap is stated by him here (the two-loss cap in this unit comes from the guests, not from him)."

invalidation:
- "Not applicable - this is a frequency policy, not a setup."

execution:
  bias: "Not applicable."
  entry: "Not applicable."
  stop: "Not applicable."
  targets: []

measurable:
- "trade count per day by execution timeframe - the empirical form of his own 15-second observation"
- "expectancy of trades 1-3 of the day versus trades 4+"

sources:
