id: strat-timeframe-continuity
name: Timeframe Continuity, Including New Monthly Continuity (TheSTRAT)
aliases:
- new monthly continuity
- timeframe continuity
category: structure
status: specified
definition: 'The guest carries directional analysis far above the monthly chart - monthly, three-month
  (quarterly), six-month and twelve-month - and says explicitly that most ICT traders stop at the
  monthly and should not. ''Continuity'' is the directional state of a higher-timeframe candle that
  is still open: a new monthly candle trading above its open is ''new monthly continuity'' to the
  upside, described as new participants entering, and he will not short against it for a large move.
  The state is re-evaluated at each new higher-timeframe open. He combines it with the inside-bar
  reading: a month that is both an inside bar of the previous month and freshly green is doubly a
  reason not to short, whereas a quarterly candle can be expected to run green and then fall back
  in toward the end.'
timeframes:
  htf:
  - 1Y
  - 1Q
  - 1M
  ltf:
  - 1W
  - 1D
  fractal: true
preconditions:
- A higher-timeframe candle that has opened and not yet closed.
detection_rules:
- Read continuity on the monthly, quarterly, six-month and twelve-month candles, not only on intraday
  timeframes.
- continuity_up := the open higher-timeframe candle is currently trading above its open price.
- Do not take a large counter-trend position against a fresh higher-timeframe candle whose continuity
  runs the other way.
- Re-evaluate at every new higher-timeframe open.
invalidation:
- The open higher-timeframe candle crosses back through its opening price - continuity flips.
measurable:
- forward return of positions taken with vs against monthly continuity
- frequency with which a green new-monthly candle closes red
sources:
- video_id: V8P6lNIisvc
  title: Q&A Live with Alex's Options - ICT + Strat
  quote: new monthly continuity, which just means new monthly open
ambiguities:
- '''Large move'' is the only qualifier on the counter-trend prohibition - scalps against continuity
  appear to be permitted but are not bounded.'
- No rule resolves conflicting continuity between the monthly, quarterly and yearly candles.
- This is the opposite of the channel's own recorded practice of skipping the weekly chart entirely;
  that is a guest-versus-host methodological difference, not a channel self-contradiction.
related:
- timeframe-alignment
- weekly-chart-not-used
- strat-inside-bar
- htf-opening-price-entry
contributing_units:
