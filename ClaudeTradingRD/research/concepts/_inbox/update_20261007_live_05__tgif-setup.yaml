id: tgif-setup
name: TGIF Setup
category: model
status: contested
aliases:
- TGIF
- TGIF profile
definition: 'Live checklist walk-through on a Friday that he REJECTS as a TGIF. He ticks the requirements
  aloud: Monday/Tuesday high (present), expansion through Thursday, weekly objective. Wednesday was a
  consolidation, so the week had expansion Tuesday and Thursday but not three consecutive days, and his
  closing review states it is not a TGIF because of that consolidation. He adds an execution requirement:
  even with a qualifying week the lower timeframe must line up - he normally wants a sweep of the previous
  day low traded back in, framed with SMT. The only way to have traded this week''s TGIF would have been
  overnight, assuming the low of the week had formed, which he did not trust.'
timeframes:
  htf:
  - 1W
  - 1D
  ltf:
  - 1H
  fractal: false
preconditions:
- Weekly extreme formed Monday or Tuesday.
- Expansion through Thursday with no intervening consolidation day.
detection_rules:
- Treat a Wednesday consolidation inside the Tuesday-Thursday run as disqualifying - the required read
  is multiple consecutive days of expansion, not expansion on two of three days.
- 'On Friday, require lower-timeframe price action that lines up: a sweep of the previous day low (bullish
  case) traded back in, ideally with SMT.'
- Do not take a TGIF that could only have been entered overnight on the assumption that the week's extreme
  had already formed.
invalidation:
- A consolidation day between the Monday/Tuesday extreme and Thursday.
measurable:
- Friday outcome on weeks with three consecutive expansion days vs weeks with a mid-week consolidation
  day
- share of qualifying TGIF Fridays that open with a previous-day-low sweep
sources:
- video_id: 4rNC3QXxC20
  title: New York Open Live Q&A
  quote: What are the requirements for a TGIF profile?
- video_id: 4rNC3QXxC20
  title: New York Open Live Q&A
  quote: Expansion through Thursday.
- video_id: 4rNC3QXxC20
  title: New York Open Live Q&A
  quote: It's not TGIF because we have this consolidation.
- video_id: 4rNC3QXxC20
  title: New York Open Live Q&A
  quote: Normally, I like to see a sweep of the previous day low
ambiguities:
- He first says 'Expansion through Thursday' and then corrects to 'three days of expansion' - whether
  a consolidation day anywhere in Tue-Thu disqualifies, or only Wednesday, is not stated.
- Whether the weekly objective was met is left open ('I could say, yeah, we hit this low').
- The day is an index day (NQ/ES/YM); no gold-specific statement.
