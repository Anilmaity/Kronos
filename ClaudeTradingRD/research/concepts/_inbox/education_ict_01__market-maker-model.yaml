ambiguities:
- EARLIER RECORDING and a single trade review - the model's phases are named in passing, never enumerated.
- How the 'original consolidation' is identified in general (beyond it coinciding with previous day low
  here) is not stated.
- No distribution-phase rules are given; the trade simply targets the consolidation.
