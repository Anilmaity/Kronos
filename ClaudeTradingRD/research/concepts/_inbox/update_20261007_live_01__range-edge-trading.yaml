id: range-edge-trading
name: Range Edge Trading
category: model
status: contested
voice: guest
guest_sources:
- Nick (co-host)
definition: 'Co-host Nick''s pre-open rule for the consolidating markets of the prior month: look at where liquidity
  was taken and trade the opposite way. His live short: relatively equal highs on NQ were taken (stopping out his
  first short), then price closed below ~260 and retested it; he entered on a 3-minute structure break with displacement,
  added on the retest, used the 9:30 open candle with no bottom wick as the level, and targeted the 8-9 a.m. low;
  invalidation was a new 15m/5m gap or a 5-minute close back above 230 (sic). TTrades says Nick normally trades
  breaker blocks.'
timeframes:
  htf:
  - 30m
  - 15m
  ltf:
  - 3m
  - 1m
  fractal: false
detection_rules:
- In a consolidating regime, identify which side's liquidity was just taken; trade toward the other side.
- 'Entry: structure break with displacement after the sweep; add on retest.'
