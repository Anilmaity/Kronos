id: pattern-trading-error
name: Pattern Trading (the error he corrects)
aliases:
- I don't pattern trade stuff
- no framework, no trade
category: psychology
status: specified

definition: >
  The single most repeated correction in these four streams. A viewer describes checking for a
  higher-timeframe fair value gap plus a candle 3 closure and is told that is just pattern
  trading - you cannot pick a fair value gap at random, see a closure and call it a setup; you
  still need an idea of what you want price to do. He accepts that a live formation is
  technically a continuation and still refuses it because there is no higher-timeframe bias
  behind it, and states the general form: being right about direction is not a reason to
  trade. He generalises it to the entry model itself - the entry pattern matters far less than
  the higher-timeframe framework, and he offers to show that the same trade could have been
  framed as an inversion fair value gap instead with no difference.

timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  fractal: false

preconditions:
- A recognisable pattern (fair value gap, candle closure, continuation) is present on the
  chart.

detection_rules:
- Before taking any pattern, require a higher-timeframe framework and a stated expectation for
  what price should do.
- A candle closure at a fair value gap chosen without that context is pattern trading; skip it.
- Being directionally right without a framework is not a reason to enter.
- Do not swap entry models looking for an edge - the framework, not the entry pattern, is
  what carries it.

invalidation:
- No higher-timeframe framework - no trade, regardless of how clean the pattern looks.

measurable:
- expectancy of setups taken with versus without a stated HTF framework
- number of no-trade days attributable to the framework gate

