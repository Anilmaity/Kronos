id: daily-market-review-journal
name: The Daily Market Review Journal (Notion template)
definition: 'His own journaling protocol, and it is a market journal rather than a trade journal:
  he journals every day whether or not a trade was taken, and calls not doing so a disservice that
  stunts a trader''s growth. The template is built in Notion as a database with a table view and
  a calendar view, so any day can be revisited. Each daily entry carries: the day''s news copied
  from forexfactory.com, a notes callout, and then one collapsible toggle section per instrument
  (ES and NQ, plus a spare for any other asset watched). Inside each instrument''s section sit two
  columns - PREDICTIONS and ACTUAL - and four chart slots: daily, hour, 15-minute, 5-minute. The
  predictions are written the evening BEFORE, anticipating the next daily candle; the actual is pasted
  in after the session, which is what makes the bias accountable. A second template covers the weekly
  review, with the week''s Forex Factory calendar, prediction versus actual, and three chart slots:
  daily, 4-hour, 1-hour. Charts are captured with the TradingView copy-image shortcut and pasted
  straight in. Mondays are not journalled because Mondays are not traded.'
category: psychology
status: specified
aliases:
- market review
- notion journal
- predictions and actual
preconditions:
- A charting platform that can copy a marked-up chart image to the clipboard.
detection_rules:
- Journal every trading day regardless of whether a trade was taken.
- 'Daily entry timeframes: daily, 1-hour, 15-minute, 5-minute - one marked-up chart each, per instrument.'
- 'Weekly review timeframes: daily, 4-hour, 1-hour.'
- Write the PREDICTION the evening before, anticipating the next daily candle; fill the ACTUAL after
  the session and compare.
- Paste the day's (and week's) forexfactory.com calendar into the entry before the session.
- One toggle section per instrument (ES, NQ, plus a spare slot) so the page stays collapsible.
- Mark up only the session actually traded in depth - the 5-minute work covers 08:30 to 12.
- On the weekly hourly chart, separate each day with a vertical divider at midnight and label them,
  so the weekly profile can be read day by day.
- Do not journal Mondays (no Monday trades).
- Re-do the daily chart on every entry - most of the narrative is derived from it.
invalidation:
- Not applicable - this is a process, not a setup.
measurable:
- hit rate of the written next-day prediction against the actual daily candle direction
- hit rate of the weekly prediction (direction and target) against the realised week
- correlation between days journalled and subsequent bias accuracy
