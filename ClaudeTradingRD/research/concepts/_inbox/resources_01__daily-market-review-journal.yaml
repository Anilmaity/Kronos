ambiguities:
- No scoring rubric is given for grading a prediction right or wrong - the comparison is visual and
  narrative.
- '''If they were wrong I''d spend more time focusing and looking at price action'' is the entire
  remediation procedure; no structured error taxonomy is defined.'
- The weekly review's prediction is judged partly correct in the worked example (direction right,
  target not reached) with no rule for how that is recorded.
- Whether losing trades get any additional treatment is deferred to a separate video that is not
  in this unit.
