id: nq-over-es-volatility-preference
name: Default To NQ, Switch To ES Only On Clear Relative Weakness
aliases:
- NQ over ES
category: risk
status: specified
definition: 'AM Trades trades NQ for the majority of his trades because it is usually more volatile,
  which exaggerates the manipulation and the expansion on the chart and makes price come out cleaner.
  His stated exception is relative strength: if ES has been clearly weaker than NQ across the week and
  he is looking for a bearish setup (his example is a TGIF opportunity), he switches to ES because it
  is likely to make the better move to the downside.'
timeframes:
  htf:
  - 1W
  - 1D
  ltf: []
  fractal: false
preconditions:
- Both index futures available and correlated.
detection_rules:
- Default instrument is NQ.
- Compare ES and NQ over the week for clear relative strength or weakness.
- For a short, if ES has been clearly the weaker of the two all week, take the setup on ES instead.
- Mirror for a long with the clearly stronger instrument.
invalidation:
- Neither instrument shows clear relative strength or weakness - stay on the default.
measurable:
- realised range of NQ vs ES per day
- R of setups taken on the relatively weaker vs the default instrument
sources:
- video_id: wGYde-h84cs
  title: Live Q&A with AM Trades - Weekly Profile
  quote: I prefer NQ just because it's usually more volatile
ambiguities:
- '''Clearly weaker throughout the entire week'' has no measure - no ratio chart, no percentage.'
- This is the mirror image of the channel's own relative-strength doctrine (rank the correlated set
  and trade the middle one); the guest's version is a simple two-way pick.
related:
