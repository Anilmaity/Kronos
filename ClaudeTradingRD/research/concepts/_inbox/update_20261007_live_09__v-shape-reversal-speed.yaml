id: v-shape-reversal-speed
name: A Real Reversal Is a Fast V-Shape
category: structure
status: contested
definition: 'Wall-clock form of the speed test: after the sweep and reaction off the low, price failed
  to form a continuation, and he states that if price is going to expand it will not wait twenty minutes
  to do so - it just goes. The elapsed time without expansion is itself taken as evidence the idea is
  failing.'
preconditions:
- A sweep and initial reaction have occurred at the level.
detection_rules:
- Measure the time from the reaction to the continuation/expansion.
- If roughly 20 minutes pass without expansion, downgrade the idea (consolidation, not expansion).
invalidation:
- Expansion arrives promptly after the reaction.
measurable:
- expansion probability as a function of minutes elapsed since the reaction
sources:
- video_id: Hlwq1dRjBZo
  title: New York Open Live Q&A
  quote: it's not going to wait 35 minutes, not 35, 20 minutes to go expand
ambiguities:
- The 20-minute figure is a self-corrected off-hand number, not a stated threshold; timeframe is the 1-minute/15-minute
  NY open context.
related:
- v-shape-reversal
- ten-am-candle-alignment
voice: ttrades
