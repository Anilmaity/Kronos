id: smt-requires-framework
name: SMT Is a Confirmation, Not a Framework
category: liquidity
status: contested
voice: ttrades
definition: Restated; adds that he wants the SMT off the EXTERNAL range high - SMT at internal equal highs
  inside a choppy range does not make a closure trustworthy. Removing SMT from the chart leaves his setup
  unchanged.
detection_rules:
- Setup and framework must exist without SMT; SMT only confirms.
- Require the SMT to form at the external range high/low, not at internal equal highs.
sources:
- video_id: uW55Tuk-ngY
  title: New York Open Live Q&A
  quote: SMT is a confirmation to a setup.
- video_id: uW55Tuk-ngY
  title: New York Open Live Q&A
  quote: But I want SMT off the external range high.
ambiguities:
- External vs internal range is not defined beyond the on-chart example (NQ 1m around the 10 a.m. open).
related:
- smt-divergence
- pattern-trading-error
