id: order-block
name: Opposing Candle / Order Block
aliases:
- opposing candle
- opposing candles
category: structure
status: contested
definition: This unit adds a disqualifier rather than a definition. Looking left at a cluster of opposing
  candles he refuses to treat them as an order block because they sit inside a consolidation, and
  instead uses the HIGH OF THE RANGE as the point of interest, looking there for a sweep or an SMT.
  The order block therefore requires the candles to have produced a structural extreme, not merely
  to be the right colour inside a range.
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  fractal: true
preconditions:
- A candidate run of opposing-close candles has been identified.
detection_rules:
- Reject a candidate order block whose candles sit inside a consolidation - the fact that they are
  opposing-close candles is not sufficient.
- In that case use the range high (or range low) as the point of interest instead.
- At that range extreme, look for a sweep or an SMT rather than a clean order-block reaction.
- A valid order block, once respected, can then be paired with a fair value gap to form what he calls
  a propulsion block.
invalidation:
- Price trades through the block without a reaction.
measurable:
- reaction rate of order blocks inside consolidations vs at structural extremes
sources:
- video_id: IPZjNI1B5a0
  title: You Are Using Discount and Premium Wrong! - EQ For Expansions
  quote: trust this as an order block because it is just in a consolidation
- video_id: IPZjNI1B5a0
  title: You Are Using Discount and Premium Wrong! - EQ For Expansions
  quote: I will use the high of the range as a point of interest
- video_id: IPZjNI1B5a0
  title: You Are Using Discount and Premium Wrong! - EQ For Expansions
  quote: either look for a sweep or an smt on that high
ambiguities:
- '''Just in a consolidation'' is judged by eye; no test is given for when a run of candles counts
  as consolidation rather than structure.'
- '''Propulsion block'' is named once in passing and never defined in this unit.'
- This video does not restate which level of the block is used (open of the first candle, the series
  extreme, or the mean threshold).
