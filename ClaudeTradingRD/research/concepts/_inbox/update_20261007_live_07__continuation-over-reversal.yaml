id: continuation-over-reversal
name: Continuation Over Reversal
category: model
status: specified
definition: 'His ''30-second'' entry explanation: a swing point to trade away from, a CISD there, do not
  trade the reversal, wait for a continuation to form, enter on it, stop on the protected swing (marked
  by his indicator), target 2R. Also given as the cure for false CISDs: retrace into a fair value gap
  and require a close through; if price reaches into the gap and never closes, there is no continuation.'
detection_rules:
- Swing point + CISD defines the framework; the reversal itself is not traded.
- Entry only after a continuation forms (retrace into FVG then close through).
- If price reaches into the gap and fails to close through, no continuation - no trade.
- Stop on the protected swing; target 2R.
