id: aligning-expansion-candles
name: Aligning Expansion Candles (The Model)
category: model
status: specified
aliases:
- expansion alignment
- candle 3 on multiple timeframes
definition: 'TTRADES'' OWN PRIMARY STATEMENT (this unit) of the concept previously held here only
  in a guest''s voice: when a true trend occurs, all candles are aligned in the same direction. The
  procedure is to require that each higher-timeframe candle in the stack SUPPORTS EXPANSION - small
  wick, large body, opposing run formed early - in the same direction, then align structure with
  it via protected swings / continuation order blocks. The stated minimum is TWO aligned expansion
  candles (e.g. daily + 4-hour, which is enough to execute on the 15-minute); three (daily + 4-hour
  + 1-hour or 30-minute) is preferred for a 5-minute or 3-minute execution. The simplest expression
  is to trade a candle 3 on multiple timeframes at once - ''by definition, that is just a trend''.
  If any layer has a large wick or opens against the intended direction, you do not trade that layer;
  you wait for its next candle open.'
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 1H
  - 30m
  - 15m
  - 5m
  - 3m
  fractal: true
preconditions:
- A bias exists; expansion alignment is checked underneath it.
detection_rules:
- 'Check each timeframe in the stack: does the current candle have a small wick and a large body
  in the intended direction?'
- A candle that opens and trades AGAINST the intended direction first, at length, does not support
  expansion - wait for its next open.
- Minimum two aligned expansion candles; three preferred for sub-5-minute execution.
- 'Preferred form: candle 3 on the daily, candle 3 on the 4-hour, candle 3 on the hourly.'
- 'Then align structure: enter on a protected swing / continuation order block inside the lowest
  layer.'
- 'Reversal variant: the same alignment can be built from small-wick reversal candles plus a protected
  swing, but it is harder to anticipate.'
- If the daily does not support expansion, the trade is still allowed with reduced targets - back
  toward the daily open or the intraday extremes rather than a large move.
invalidation:
- Any layer prints a large opposing wick or a large opposing run.
execution:
  bias: Direction shared by the aligned expansion candles.
  entry: Protected swing / continuation entry on the lowest aligned timeframe.
  stop: On that protected swing.
  targets:
  - 2R
  - previous candle extremes of the highest aligned timeframe
measurable:
- R multiple of 3-layer vs 2-layer alignments
- frequency of full 3-layer alignment per month
- outcome of trades taken with the daily NOT supporting expansion (reduced-target branch)
