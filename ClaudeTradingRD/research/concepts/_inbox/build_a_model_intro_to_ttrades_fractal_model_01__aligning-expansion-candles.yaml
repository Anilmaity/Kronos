ambiguities:
- '''Small wick'' is the gate at every layer and is never quantified anywhere in this unit.'
- The reduced-target branch (daily not supporting expansion) gives 'the daily open or the intraday
  highs' as targets but no rule for choosing between them.
- The indicator layout given (daily power-of-three at offset 15 or 32, fractal model at offset 17)
  is a display convention, not a rule.
- 'PROVENANCE NOTE: the previous entry under this id came from a guest (GxTradez, t_talks_02). The
