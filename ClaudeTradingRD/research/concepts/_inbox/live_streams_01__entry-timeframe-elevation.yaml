id: entry-timeframe-elevation
name: Entry Timeframe Elevation (root-cause fix for stop-outs)
definition: 'The standard answer given to the most repeated viewer complaint - ''my bias is right
  but I get stopped out and then it goes to target''. The diagnosis is that the entry timeframe is
  too low, and the fix is to move the entry up one timeframe. He is explicit that the alternative
  fix - simply widening the stop - is wrong, because it destroys the risk-to-reward and forces a position-size
  change; the problem is the timing of the entry, not the stop distance. Worked concretely: a trader
  pairing H1 with M5 entries should enter on M15 instead.'
category: psychology
status: specified
detection_rules:
- 'Symptom: bias correct, stopped out, target subsequently reached.'
- 'Fix: raise the execution timeframe by one step within the timeframe-pairing ladder (e.g. H1/M5
  becomes H1/M15).'
- Do not widen the stop beyond its mechanical level to compensate.
- The same fix is given for 'too early on entries' found when auditing losses.
measurable:
- stop-out rate and expectancy of the same signal executed on two adjacent timeframes
sources:
- video_id: m0wTBdUe7gs
  title: New York Open Live Q&A
  quote: move up one time frame or entry
- video_id: yNgx9OAefuI
  title: New York Open Live Q&A
  quote: Normally this means you just need to go up one time frame
ambiguities:
- How far to keep elevating if the problem persists is not addressed.
- The ladder of legal timeframe pairs is referenced ('my time frame alignment video') but not enumerated
  in these streams beyond H4/M15, D/H1 and H1/M5.
