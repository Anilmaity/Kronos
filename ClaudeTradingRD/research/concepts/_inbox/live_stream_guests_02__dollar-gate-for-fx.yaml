id: dollar-gate-for-fx
name: Analyse The Dollar First, Then Everything Priced In It
aliases:
- DXY first
- dollar-first order of operations
category: model
status: specified
definition: 'Rauf''s stated order of operations: analyse DXY before analysing EURUSD or gold, because
  everything priced in dollars is the mirror of it. He works DXY top-down (monthly, then weekly, then
  daily), because the monthly is where large funds are positioned, and derives the rest: dollar up means
  EURUSD down and NASDAQ down; dollar down means NASDAQ up. He applies the same read to gold - bullish
  dollar, so he expects gold lower into his marked levels.'
timeframes:
  htf:
  - 1M
  - 1W
  - 1D
  ltf: []
  fractal: false
preconditions:
- A dollar index chart with a clear draw on liquidity.
detection_rules:
- 'Start on DXY monthly: identify the draw on liquidity (an unfilled fair value gap, an untaken high
  or low).'
- Confirm on the DXY weekly which side the week is likely to expand toward.
- 'Derive the dollar-denominated instruments by inversion: DXY up -> EURUSD down, NASDAQ down, gold
  down; DXY down -> the mirror.'
- Do not frame EURUSD or gold before the dollar read is done.
invalidation:
- DXY has no clear monthly draw - do not derive the others from it.
measurable:
- sign agreement between the DXY weekly expansion and EURUSD / NAS / gold over the same week
- hit rate of the derived directional call
sources:
- video_id: qFtfD09Vv3E
  title: Live with Day Trading Rauf - Preparing for a New Week
  quote: you have to analyze the dollar
- video_id: qFtfD09Vv3E
