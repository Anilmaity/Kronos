ambiguities:
- The transcript drops a negation - 'if you don't analyze the dollar first it makes it much easier to
  trade' - the intended sense (analyse it first and it becomes easier) is clear from the surrounding
  minutes but the sentence as captioned is inverted.
- The inverse correlation with NASDAQ is asserted as reliable with no conditioning or measurement.
- '''Your USD'' throughout the captions is EURUSD.'
