id: cisd
name: Change In The State Of Delivery (CISD)
category: entry
status: underspecified
aliases:
- my favorite reversal pattern
definition: 'SHORTS EVIDENCE, presented as ''my favorite reversal pattern'' with TWO named requirements
  and a level construction. The requirements are: (1) price must reach into an important level, and
  (2) price must sweep out a high (bearish case) to the LEFT of that level. Only when both are met does
  he find the series of up-close candles that swept the high into that level and MARK OUT THE OPENING
  PRICE IN THAT SERIES. A close below that level makes it the area of resistance for the continuation
  lower; the bullish case is the mirror using down-close candles.'
preconditions:
- Price has reached into an important level.
- Price has swept a high (bearish) or low (bullish) sitting to the LEFT of that level.
detection_rules:
- 'Requirement 1: price reaches into an important level.'
- 'Requirement 2: price sweeps an extreme to the left of that level. BOTH are required.'
- Identify the series of up-close candles (bearish case) that swept the high into the level.
- Mark the OPENING PRICE in that series - the level is an open, not the extreme.
- A close below that level makes it resistance; trade the continuation away from it.
- 'Bullish mirror: series of down-close candles, close over their opening price, level becomes support.'
invalidation:
- Price never closes beyond the opening price of the opposing series - no CISD.
measurable:
- hold rate of the swept extreme after a close through the series' opening price
- difference in outcome between the two-requirement cases and cases where only one is met
