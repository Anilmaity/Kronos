ambiguities:
- THE BLOCKING AMBIGUITY SURVIVES. 'The opening price in that series' still does not say WHICH open
  when the series has several candles - the first candle's open, the highest/lowest open, or the series
  extreme. This Short does at least establish that the level is an OPEN and not the swept extreme.
- '''Important level'' is not defined in this Short.'
- How far to the left the swept high may be is not bounded.
- Body close versus wick through the level is not stated ('closes below' implies body).
