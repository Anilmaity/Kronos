id: bitcoin-session-time-not-used
name: Time And Kill Zones Are Not Used On Bitcoin
aliases:
- bitcoin futures
- 24/7 instrument
category: time
status: specified
definition: 'AM Trades trades Bitcoin futures alongside the indices and states that he does not gauge
  time as important on Bitcoin. Two reasons are given: the instrument runs 24/7 so the time zones
  get skewed, and he is trading it strictly off the hourly (sometimes the 15-minute) rather than sniping
  kill-zone entries on low timeframes. He concedes that volatility does increase during London and
  New York hours because the instrument is somewhat relative to the index open, but treats that as
  an observation rather than a filter. His Bitcoin approach is hourly and daily, swinging overnight
  or for a few days.'
timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 15m
  fractal: false
preconditions:
- A 24/7 instrument - stated for Bitcoin futures.
detection_rules:
- Do not apply kill zone or session filters to Bitcoin.
- Trade Bitcoin from the hourly and daily; hold overnight or for several days.
- Expect elevated volatility during London and New York hours but do not require it as a condition.
invalidation:
- Not applicable - an instrument-specific timing rule.
measurable:
- expectancy of Bitcoin setups inside vs outside the index kill zones
- realised volatility of Bitcoin by hour of day against the index session clock
sources:
- video_id: CrUfTskOveo
  title: Stream Q & A with AM Trades  - ICT concepts
  quote: i don't gage time as important on bitcoin
ambiguities:
- No alternative timing anchor is offered for a 24/7 instrument - no daily open convention, no weekly
  boundary.
- The claim that Bitcoin volatility is 'somewhat relative to the indexes opening' is asserted and
  unmeasured.
