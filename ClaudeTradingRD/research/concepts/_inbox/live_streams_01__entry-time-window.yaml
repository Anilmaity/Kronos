id: entry-time-window
name: Entry Time Window (and rejection of kill zones)
definition: 'The window said aloud in these streams: he trades the New York morning, from 8:00 a.m.,
  and the move he is trying to capture runs from 8:00 to about 10:00-10:30, with 11:00 given once
  as the outer bound. He streams from 9:15, ten to fifteen minutes before the open, and forms the
  whole day''s idea in that window. Asked whether one could trade only 8-11 a.m. and then close the
  charts for the rest of the day, he says that is what he does. Outside the window he does not care
  what price does; if he is not in a position he simply waits for the daily candle to close. Kill
  zones are explicitly not used - higher-timeframe candle opens replace them. Times are New York time
  (see est-timezone-anchor).'
category: time
status: specified
detection_rules:
- Trading window opens at 8:00 New York time.
- The intended move runs to roughly 10:00-10:30; 11:00 is the outer bound given.
- Bias and framing are done in the 9:15-9:30 pre-open.
- After the window, take no new entries; runners may be left on.
- No kill-zone windows are used - see macros-not-used.
measurable:
- distribution of entry times for profitable trades inside vs outside 8:00-11:00
- how many signals fall outside the window
sources:
- video_id: xraklBJHW5k
  title: New York Open Live Q&A
  quote: I use 8:00 a.m. to around 11
- video_id: yNgx9OAefuI
  title: New York Open Live Q&A
  quote: go to 8 to 10:30 each day and mark that out
ambiguities:
- The end of the window is given inconsistently across the two streams - 'to around 11' in one and
  '8 to 10:30' (with 'sometimes 10:30' hedged around '10ish') in the other. Both are approximations
  rather than rules.
- London is not traded at all because he is asleep, but he says a London reversal should be held into
  New York rather than closed - so the window governs entries, not exits.
- Asia is only traded when he is after a whole daily range.
