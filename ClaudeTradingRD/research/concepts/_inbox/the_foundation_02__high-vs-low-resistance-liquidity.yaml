id: high-vs-low-resistance-liquidity
name: High Resistance vs Low Resistance Liquidity
aliases:
- High Resistance liquidity
category: liquidity
status: contested
definition: 'The top-down video uses the phrase as a property of a specific swing, not as a market-wide
  condition: a swing low that has already been swept is creating high resistance liquidity. The consequence
  he draws is operational - a high-resistance low is not expected to hold on its own, so instead
  of using the low he marks 0.5 of its wick as the area that should support price. This is a different
  sense of the phrase from the one recorded in the library from the live streams, where high vs low
  resistance describes conditions set by the daily setup and by news, deciding whether price will
  slice through levels or stall.'
variants:
  definition:
  - 'Live-stream sense (already in the library): a market-wide condition - a daily set up for expansion
    means low resistance conditions, a very large range already printed or imminent high-impact news
    means high resistance conditions.'
timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 15m
  - 5m
  fractal: true
preconditions:
- An identified swing low or swing high on the working timeframe.
detection_rules:
- A swing low that has already been swept is high resistance liquidity (top-down video sense).
- 'Consequence: do not use that low itself as the level; mark 0.5 of its wick and use that as the
  support area.'
- A high-resistance low may still be traded from once price sweeps it AND closes back inside the
  range on the same candle.
invalidation:
- Price closes below 0.5 of the wick of the high-resistance low.
measurable:
- hold rate of already-swept lows vs never-swept lows
- how often 0.5 of the wick holds where the low itself does not
sources:
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: it has been swept so this is creating High Resistance liquidity
ambiguities:
- Two different senses of the same phrase now exist in the corpus - a property of a swept swing (here)
  and a market-wide condition (live streams). Neither video reconciles them.
- The low-resistance mirror is not given in this unit.
- The dedicated 'High Resistance vs Low Resistance Liquidity' video is listed in the_foundation_01
  as having no transcript on disk, so the definitive statement is still missing from the corpus.
