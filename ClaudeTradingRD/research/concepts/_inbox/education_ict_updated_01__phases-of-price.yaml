id: phases-of-price
name: Phases of Price Delivery
aliases:
- expansion, retracement, consolidation, reversal
category: structure
status: specified
definition: 'The framing he blends with candle-to-candle bias: after several candles of expansion in
  one direction, a new phase of price delivery — retracement, consolidation or reversal — becomes likely,
  and he stops taking the mechanical continuation read at face value. He states 3 days of expansion
  as the trigger in the daily example.'
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 1H
  fractal: true
detection_rules:
- Count consecutive expansion candles closing outside the previous candle's range.
- After ~3 such candles, anticipate a new phase (retracement, consolidation or reversal) rather than
  another continuation.
- Large expansion range followed by a slow / choppy retracement is read as a continuation signature.
- Do not take the mechanical previous-candle bias in isolation during consolidation — blend it with
  the phase.
invalidation:
- Expansion simply continues; he accepts he misses that leg rather than chasing.
measurable:
- forward return after the 3rd, 4th and 5th consecutive expansion close
sources:
- video_id: caaS6_Q7O78
  title: Next Day Model - Fractal Way To Get Bias For Trading
  quote: 3 days of expansion lower which generally indicates we can enter a new phase
- video_id: caaS6_Q7O78
  title: Next Day Model - Fractal Way To Get Bias For Trading
  quote: I prefer to blend it with the phases of price delivery to make more sense
ambiguities:
- '''3 days'' is stated once, in one example; elsewhere it is ''this continued expansion for multiple
  candles''.'
- Which of the three follow-on phases to expect is not predicted — only that the continuation read weakens.
