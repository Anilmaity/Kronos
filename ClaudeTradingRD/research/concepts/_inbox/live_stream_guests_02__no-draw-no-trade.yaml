ambiguities:
- '''Clear'' is not defined for either the monthly draw or the weekly expansion read.'
- The two-shapes claim ignores doji / inside weeks entirely.
- The transcript garbles 'cap the weekly range' as 'cut'/'cup' the weekly range in several places.
