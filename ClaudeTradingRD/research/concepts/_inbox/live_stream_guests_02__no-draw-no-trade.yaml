id: no-draw-no-trade
name: No Monthly Draw And No Weekly Expansion Read, No Trade
aliases:
- know where the weekly candle will expand
category: risk
status: specified
definition: 'Rauf states the gate twice: if you do not have a clear draw on the monthly and you do not
  have a clear idea of which way the weekly candle is going to expand, there is no point trading. His
  positive framing is that the weekly range IS the market - knowing which way the weekly candle expands
  lets you overlay the economic calendar and frame every setup for the week. He grounds it on the claim
  that a candle can only print two shapes (open-low-high-close or open-high-low-close), so the whole
  question reduces to which of the two the week is printing.'
timeframes:
  htf:
  - 1M
  - 1W
  ltf: []
  fractal: false
preconditions: []
detection_rules:
- Identify a clear draw on liquidity on the monthly chart (an untaken high/low or an unfilled fair value
  gap).
- Form a directional expectation for the weekly candle's expansion.
- If either is missing, take no trades on that instrument.
- Where present, overlay the economic calendar to place the manipulation within the week.
invalidation:
- The monthly draw is taken or the weekly expansion completes - re-derive.
measurable:
- proportion of weeks with a classifiable monthly draw
- P&L of weeks traded with vs without a clear weekly expansion read
