ambiguities:
- 'EVOLUTION / DIRECT CONFLICT: the daily open used in this recording is the MIDNIGHT opening price.
  The later canon anchors the daily candle at 18:00 New York and the Q&A answer is ''I always use
  18:00''. This is the earlier recording; see daily-open-eighteen-hundred.'
- No close-location or body-to-range threshold is given for calling a candle directional.
- The rule is about the ORDER of the extremes, so it is only decidable while the candle is forming;
  on a closed candle the order is not recoverable without lower-timeframe data.
- No tolerance for 'near the open'.
