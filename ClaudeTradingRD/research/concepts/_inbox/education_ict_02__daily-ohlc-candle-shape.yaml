id: daily-ohlc-candle-shape
name: OHLC / OLHC Daily Candle Shape
category: structure
status: contested
definition: 'THE DEDICATED VIDEO the library recorded as missing. The argument is arithmetic rather
  than behavioural: every candle has an open, high, low and close, so a bullish candle that does not
  open exactly on its low MUST trade below its open to put the low in before expanding up - open,
  low, high, close. A bearish candle must put its high in above the open first - open, high, low,
  close. The trading consequence is positional: with a bullish expectation look for buys BELOW or
  NEAR the opening price; with a bearish expectation look for sells BETWEEN the high and the opening
  price. Which of the two shapes you expect comes entirely from the draw on liquidity. He demonstrates
  it on the weekly (read from daily candles), the daily (using the MIDNIGHT opening price as the daily
  open, executed on 15-minute) and the 4-hour (executed on 5-minute), and closes by mapping the shape
  onto AMD.'
timeframes:
  htf:
  - 1W
  - 1D
  - 4H
  ltf:
  - 15m
  - 5m
  fractal: true
preconditions:
- A draw on liquidity has been identified; that is what selects the shape.
detection_rules:
- Bullish expectation -> expect open, LOW, high, close. Position at or below the opening price.
- Bearish expectation -> expect open, HIGH, low, close. Position between the high already made and
  the opening price.
- The shape is selected by the draw on liquidity, not by the candle itself.
- 'Confirmation while the candle develops: the opening price should SUPPORT the lower-timeframe candles
  - nothing closing below it in the bullish case.'
- 'AMD mapping: consolidation around the opening price = accumulation; the excursion beyond the opening
  price = manipulation; the move to the far extreme = distribution.'
- 'Degenerate case he names explicitly: if the candle''s low IS its open there is no wick and no entry
  window.'
invalidation:
- Lower-timeframe candles begin closing through the opening price against the expected shape.
measurable:
- proportion of directional daily candles whose extreme forms on the correct side of the open first
- R available between the open and the eventual extreme
