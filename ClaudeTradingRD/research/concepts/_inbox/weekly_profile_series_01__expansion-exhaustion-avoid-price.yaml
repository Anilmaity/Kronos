id: expansion-exhaustion-avoid-price
name: "Avoid Price (expansion exhaustion)"
aliases: ["avoid price", "a new phase of price"]
category: risk
status: underspecified

definition: >
  A stand-aside rule applied to the tail end of an expansion week. Once the week has
  delivered its expansion, the speaker stops looking for a further continuation day and
  says he wants to avoid price, on the reasoning that a new phase of price is likely to
  begin. Three triggers are stated across the series: three days of expansion have already
  occurred; two very large expansion days have occurred, making a third hard to
  anticipate; or the higher-timeframe objectives have already been reached. Conversely,
  the expansion is run until the average daily range is covered or the higher-timeframe
  objective is met, so an open objective is what keeps a further continuation day on the
  table.

timeframes:
  htf: ["1W", "1D"]
  ltf: []
  fractal: false

preconditions:
  - "A confirmed weekly extreme with at least one continuation day already delivered."

detection_rules:
  - "Count the consecutive expansion days since the confirmed weekly extreme."
  - "Stand aside once three days have expanded."
  - "Stand aside once two very large expansion days have occurred, rather than anticipating a third."
  - "Stand aside once the higher-timeframe objective has been reached, regardless of the day count."
  - "Conversely, a further continuation day is permitted only when the previous day closed strong AND a higher-timeframe objective is still open."

invalidation:
  - "A new confirmed swing point forms, restarting the sequence - the speaker's remedy in the Intraweek Reversal video is to wait for that new swing point rather than to keep taking continuations."

measurable:
  - "distribution of consecutive daily expansion days per week"
  - "expectancy of the 4th consecutive continuation day versus the 2nd and 3rd"
  - "expectancy of a continuation day taken after the higher-timeframe objective was already hit"
  - "frequency with which a week's range is complete by Thursday's close"

sources:
  - video_id: Qt7Ek4keMzs
    title: "Weekly Profile for Daily Bias - Classic Expansion"
  - video_id: -gyDd_E_qD4
    title: "Weekly Profile for Daily Bias - Midweek Reversal"
  - video_id: FvOUvQ7odiw
    title: "Weekly Profile for Daily Bias - Intraweek Reversal"
  - video_id: uPUNOi_R9fA
    title: "Weekly Profile for Daily Bias - Thursday Counter"

ambiguities:
  - "'Very big' / 'large range' expansion days are never quantified, so the two-large-days trigger is not decidable from a chart."
  - "'Closes strong' / 'closes well', which keeps a further continuation on the table, is unquantified everywhere it appears in the series."
  - "'Average daily range' is used as an expansion stop-point with no lookback period or calculation."
  - "The rule is stated as a personal preference to 'avoid' rather than a hard prohibition; in one Classic Expansion example he offers 'either avoid price or seek a further continuation lower' for the same week."
  - "Status is underspecified: the day-count trigger is decidable but the size and close-quality triggers are not."

python_detector: null
related: ["weekly-profile-framework", "classic-expansion-week", "relevant-level", "midweek-reversal-week"]
