id: dont-trade-after-expansion
name: "Don't Trade After Expansion"
aliases: ["four days of expansion", "fifth day"]
category: entry
status: contested
voice: ttrades
definition: >
  Applied to the indices: after four consecutive daily expansion days he is still bullish to
  the highs but holds no index bias, because many times a consolidation or retracement to make
  a higher low follows; a fifth day of expansion is acknowledged as possible.
timeframes:
  htf: ["1D"]
  ltf: []
  fractal: false
detection_rules:
  - "Count consecutive daily expansion candles; at four, expect consolidation or a retracement to a higher low rather than continuation."
measurable:
  - "Probability of a 5th consecutive daily expansion candle given 4."
sources:
  - video_id: KBJAGgkXdeI
    title: "New York Open Live Q&A"
    quote: "we've had what? 1 2 3 4 days of expansion."
  - video_id: KBJAGgkXdeI
    title: "New York Open Live Q&A"
    quote: "Sure, there's times where we get a fifth day when it goes that far."
  - video_id: KBJAGgkXdeI
    title: "New York Open Live Q&A"
    quote: "many times going to have some sort of consolidation or a retracement"
ambiguities:
  - "The library rule uses three days of expansion; here the count is four with a fifth called possible - consistent direction, different count."
