id: relative-strength-asset-selection
name: Ranking Correlated Assets And Trading The Chosen One
category: structure
status: contested
definition: 'THE TWO SMT VIDEOS IN THIS UNIT GIVE DIFFERENT SELECTION RULES AND BOTH ARE RECORDED.
  Reading A (eHQ4nE-TQ2w) is mechanical and directional: trade the asset that is DIVERGING. On a bearish
  divergence take the one making the LOWER high, explicitly ''because it is weaker''; on a bullish
  divergence take the one making the HIGHER low, because it is stronger. Reading B (q1NmxUTm4n4) is
  discretionary: which index he trades is ''completely dependent on the lower time frames and which
  one looks cleaner to me'', and he demonstrates switching between ES and NASDAQ inside a single move
  for exactly that reason. A third criterion appears in the same video and is decidable: prefer the
  asset that has LOW RESISTANCE LIQUIDITY in the trade''s direction.'
timeframes:
  htf:
  - 15m
  ltf:
  - 5m
  - 1m
  fractal: true
detection_rules:
- 'Reading A, bearish divergence: short the asset printing the lower high (the weaker one).'
- 'Reading A, bullish divergence: long the asset printing the higher low (the stronger one).'
- 'Reading B: choose whichever asset''s lower-timeframe structure is cleaner; switching mid-move is
  permitted.'
- 'Tie-break criterion he actually applies: take the asset with low resistance liquidity in the direction
  being traded.'
measurable:
- win rate trading the diverging asset vs the non-diverging one on the same SMT
- R difference when the low-resistance criterion is applied
sources:
- video_id: eHQ4nE-TQ2w
  title: Smart Money Divergences (SMT) - ICT Concepts
  quote: you want to take the one that is diverging
- video_id: eHQ4nE-TQ2w
