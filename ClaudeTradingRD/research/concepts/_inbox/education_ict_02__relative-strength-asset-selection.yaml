  quote: completely dependent on the lower time frames and which one looks cleaner to me
- video_id: q1NmxUTm4n4
  title: SMT Divergence - ICT Concepts
  quote: I would personally look to trade Nasdaq as it has low resistance liquidity above
ambiguities:
- Readings A and B are not reconciled by the speaker and appear in two videos of the same playlist.
- '''Looks cleaner'' has no test.'
- Reading A is stated only for a two-asset comparison; it says nothing about ranking three.
- This unit's rule (trade the DIVERGING asset) is not obviously the same as the three-way strongest/middle/weakest
  ranking recorded from later units, which selects by direction of the target rather than by which
  asset diverged.
