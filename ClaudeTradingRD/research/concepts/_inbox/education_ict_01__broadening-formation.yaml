id: broadening-formation
name: Broadening Formation
aliases:
- broadening information
- broad informations
category: structure
status: contested
definition: 'EARLIER RECORDING, and the FIRST HALF OF A TWO-PART ''STRAT + ICT'' SERIES - a framing that
  does not survive into the later re-recording, which reframes the same pattern as ICT Seek & Destroy.
  The definition given here is minimal and mechanical: a broadening formation is simply ONE HIGH TAKING
  OUT ANOTHER HIGH (and, mirrored, one low taking out another low), with the lines drawn between the taking
  high and the taken high. The trigger to start looking for one is a RANGE-BOUND market, on the reasoning
  that a consolidation must eventually expand. The directional read is the same as the later version -
  a failed side implies rotation to the other side - and the trade is then a lower-timeframe break of
  structure with a fair value gap in the discount of the displacement range.'
timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- Price has become range-bound after a move.
detection_rules:
- Wait for a range-bound stretch; only then look for the formation.
- Mark a high and a low bounding the range.
- When a later high takes out that high, draw the upper broadening line between them; same for lows.
- Extend the lines as further extremes are taken.
- When one side is run and fails, expect rotation to the other side of the range.
- 'Trade it on a lower timeframe: wait for a break of structure in the new direction, take a fair value
  gap that sits in the DISCOUNT of that displacement range, stop beyond the extreme.'
- First partial at the opposing short-term liquidity.
invalidation:
- The run of the side is followed by continuation rather than failure.
execution:
  bias: Toward the untested side of the range after the other side fails.
  entry: Lower-timeframe fair value gap in the discount/premium of the displacement range.
  stop: Beyond the run extreme.
  targets:
  - The opposite side of the range
  - the range expansion on that side
measurable:
- share of range-bound stretches that produce a broadening formation
- hit rate of the rotation-to-the-other-side read after a failed run
