ambiguities:
- 'EVOLUTION, NOT CONTRADICTION: this earlier recording is framed as ''Strat + ICT part 1'' and defines
  the formation as one high taking out another. The later Tjk9bXERZy0 reframes it as constant range expansion,
  adds the outside-bar higher-timeframe identity, the two drawing methods, four pairings, and the Seek
  & Destroy session-nesting layer - none of which appear here. Both preserved.'
- '''Range bound'' is the entry trigger and is never bounded.'
- The formations nest; no rule selects the operative one.
- Auto-caption renders 'broadening formation' as 'broading formation' / 'broad information' throughout.
