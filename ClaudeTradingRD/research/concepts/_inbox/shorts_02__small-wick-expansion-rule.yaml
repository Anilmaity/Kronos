id: small-wick-expansion-rule
name: Small Wick Supports Expansion; Large Wick Waits for Candle 3
category: model
status: specified
definition: Restated in the Shorts in its compressed form, and - importantly - paired for the first
  time with an explicit size test. Expansion days have a small wick and a large body; a candle whose
  wick is LARGER than its body is classified as a reversal candle instead. This gives the long-standing
  "small wick" gate its first stated comparison operator.
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf: []
  fractal: true
preconditions:
- A completed or forming candle on the timeframe carrying the bias.
detection_rules:
- Expansion day / expansion candle := small wick and large body.
- 'Complement, stated in the paired Short: when the wick is larger than the body, the candle is a reversal
  candle, not an expansion candle.'
- On a candle that qualifies as expansion, a London reversal supports anticipating a New York continuation.
invalidation:
- The candle prints a wick larger than its body - treat it as a reversal candle and adjust targets.
measurable:
- expansion continuation rate for wick<body candles versus wick>body candles
- share of days he would call expansion under the wick<body test
sources:
- video_id: jjmRp8oTfPo
  title: Look for price at relevant levels to reverse
  quote: They have a small wick and a large body
- video_id: TND1aTpnq5c
  title: How OHLC Plays Out in Reversal Candles
  quote: the wick is larger than the body
ambiguities:
- 'The wick<body reading is assembled from two separate Shorts: one says expansion days have a small
  wick and a large body, the other says a wick larger than the body makes it a reversal candle. Neither
  Short states the contrapositive explicitly, so treating wick<body as the definition of "small wick"
  is an inference and is recorded here as such, not as his words.'
- No ratio, percentage or point threshold is given in either Short.
- Which wick (upper, lower, or both summed) is measured is not stated.
related:
- candle-type-wick-to-body
