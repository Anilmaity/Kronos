id: timeframe-pairing
name: Timeframe Pairing (draw / stop raid / entry)
aliases:
- the ladder
- timeframe ladder
category: time
status: specified
definition: 'Three explicit, complete ladders in which each rung has a job: the DRAW timeframe supplies
  the objective, the middle timeframe supplies the stop raid, and the lowest supplies the entry. Stated
  ladders: (1H or 15m draw / 5m raid / 30s entry); (4H or 1H draw / 15m raid / 1m entry); (daily or
  4H draw / 1H raid / 5m entry). For the internal/external model he names daily / hourly / 5-minute
  as his own preference, because it aligns with the formation of the daily candle. He also demonstrates
  shifting the whole ladder up (monthly / daily / hourly; weekly / 4-hour / 15-minute) for traders who
  cannot watch intraday.'
timeframes:
  htf:
  - 1M
  - 1W
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  - 5m
  - 1m
  - 30s
  fractal: true
detection_rules:
- Pick the ladder by the entry timeframe you intend to use.
- 30-second entry -> 5-minute stop raid -> 1-hour or 15-minute draw.
- 1-minute entry -> 15-minute stop raid -> 4-hour or 1-hour draw.
- 5-minute entry -> 1-hour stop raid -> daily or 4-hour draw.
- The stop raid must be in the OPPOSITE direction of the draw.
- The whole ladder can be shifted up wholesale (monthly/daily/hourly, weekly/4H/15m) without changing
  the logic.
measurable:
- realised R and trade duration by ladder
- signal frequency by ladder
