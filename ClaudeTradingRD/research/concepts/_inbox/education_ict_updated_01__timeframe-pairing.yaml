ambiguities:
- 'The draw rung admits two timeframes (''a hour or 15-minute'', ''four hour or one hour'', ''daily
  or four hour'') with the fallback rule stated only once: use the lower one if the higher has no draw.'
- The ratios are not constant (1H:5m:30s is 120:10:1; 4H:15m:1m is 240:15:1), so no single multiplier
  defines the ladder.
