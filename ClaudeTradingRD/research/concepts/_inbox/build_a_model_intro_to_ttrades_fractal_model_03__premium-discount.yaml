id: premium-discount
name: Premium & Discount (used inverted)
aliases:
- discount and premium
- I use it the opposite
category: structure
status: contested
definition: 'The dedicated video for the inversion, and it gives the reason. He acknowledges the standard
  ICT usage and says he uses it the opposite way. The justification is the phase of price: in an expansion
  phase - the phase he trades - price rarely retraces all the way into a discount (in an up move)
  or a premium (in a down move), so waiting for a discount entry during an expansion means missing
  the move. He therefore uses the halves as a filter that must HOLD for the direction to survive,
  rather than as a location to enter counter to the current leg.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 1H
  - 15m
  fractal: true
preconditions:
- The current phase of price has been classified as expansion.
detection_rules:
- Classify the phase first; the inversion applies to expansion phases.
- In an expansion higher, require the upper half to hold; do not expect a retracement into discount.
- In an expansion lower, require the lower half to hold; do not expect a retracement into premium.
- A retracement that does reach the far half is evidence the expansion phase has ended.
- During expansion, up-close (or down-close) candles are also expected to be respected alongside the
  EQ.
invalidation:
- Price trades into the far half - the expansion reading is over.
measurable:
- retracement depth distribution within legs he classifies as expansion
- share of expansion legs that reach discount/premium before continuing
sources:
- video_id: IPZjNI1B5a0
  title: You Are Using Discount and Premium Wrong! - EQ For Expansions
  quote: however I use it the opposite
- video_id: IPZjNI1B5a0
  title: You Are Using Discount and Premium Wrong! - EQ For Expansions
  quote: price rarely goes in retraces to a discount or to a premium
ambiguities:
- CONTESTED against premium-discount-equilibrium in the library, which records the standard R:R framing
  (longs only in discount, shorts only in premium). Both are his - the standard framing is taught
  in the foundation material and inverted here for the expansion phase. No rule is given for which
  framing governs when the phase is ambiguous.
- '''Rarely'' is not quantified.'
- Which range the premium/discount is measured on (candle, leg, or swing-to-swing range) is not fixed
  - in this video it is the previous candle.
