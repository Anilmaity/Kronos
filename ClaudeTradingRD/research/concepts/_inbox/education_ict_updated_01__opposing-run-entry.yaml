id: opposing-run-entry
name: Opposing Run / Judas Swing At A Time Level
aliases:
- Judas swing
- opposing run
category: entry
status: specified
definition: At midnight, 08:30 and 09:30 New York he looks for an OPPOSING RUN — a move against the
  anticipated daily order flow — that is then closed back over (bullish case). That close validates
  the run's candles as an order block, and he then does not expect the low it created to be taken as
  price continues in the anticipated direction. He uses the terms 'Judas swing' and 'opposing run' interchangeably
  and pairs them with the same three time levels.
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- A daily bias / anticipated daily order flow exists.
- Chart is on New York (EST) time.
detection_rules:
- Watch midnight, 08:30 and 09:30 New York.
- 'Bullish bias: require a run LOWER at one of those times (the Judas swing).'
- Require price to close back over the candles that made that run.
- Those candles are now an order block; the low they created should not be taken.
- Distribution in the anticipated direction is then expected — 09:30 or 10:00 in his examples.
invalidation:
- The low created by the opposing run is subsequently taken out.
execution:
  bias: Anticipated daily order flow (opposite the run).
  entry: Retest of the validated order block, often paired with midnight open / 08:30 open acting as
    support or resistance.
  stop: Beyond the opposing run's extreme.
  targets:
  - Previous day high/low
  - The day's anticipated open-low-high-close extreme
measurable:
- frequency of an opposing run at each of 00:00 / 08:30 / 09:30
- survival rate of the low created by the opposing run
sources:
- video_id: EYzP7c24AwM
  title: Important Time Levels For Trading
  quote: I also look for a Judas swing or an order block formation at midnight
- video_id: EYzP7c24AwM
  title: Important Time Levels For Trading
  quote: if I'm bullish I want to see opposing runs at these times
- video_id: EYzP7c24AwM
  title: Important Time Levels For Trading
  quote: makes an opposing run closes over that's now an order block
- video_id: EYzP7c24AwM
  title: Important Time Levels For Trading
  quote: I don't expect this low to be taken as we continue higher
ambiguities:
- '''At'' a time level is not bounded — how many minutes after 08:30 or 09:30 an opposing run still
  counts is never stated.'
- Whether all three time levels must produce opposing runs, or any one suffices, is not stated; the
  examples use whichever printed.
- The Judas-swing framing and the premium/discount framing of midnight and 08:30 are used on the same
  levels without a precedence rule.
