id: balance-area-poc-target
name: Re-Entry Into A Balance Area Targets The Point Of Control, Then The Far Edge
aliases:
- balance area
- auction market theory range
category: model
status: specified
definition: 'HolyAngelBruv''s auction-market-theory setup, and the one he names as his main trade of
  the session he walks through. A balance area is a range where a lot of volume has transacted - equivalent
  to what an ICT trader would call a range. Once price leaves and then RE-ENTERS that balance area,
  the first objective is the point of control (the highest-volume price of the balance), and the second
  objective is the far edge of the balance. He also uses the balance boundary as a standing pivot: while
  price is below it he only looks for shorts, and he waits for a retrace back to the edge to position.'
timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 15m
  - 5m
  fractal: true
preconditions:
- A balance area identified from the volume profile (a range with concentrated volume).
detection_rules:
- Mark the balance area's high, low and point of control.
- Require price to have left the balance and then to re-enter it.
- 'First target on re-entry: the point of control.'
- 'Second target: the opposite edge of the balance area.'
- While price is outside and below the balance, take only short setups (mirror above).
invalidation:
- Price fails to re-enter, or re-enters and immediately leaves the way it came.
execution:
  bias: Toward the point of control on re-entry.
  entry: At the re-entry into the balance edge, refined with order flow.
  stop: Not stated.
  targets:
  - point of control
  - opposite edge of the balance area
measurable:
- hit rate of the point of control after a confirmed re-entry
- hit rate of the far edge conditioned on the POC being reached
sources:
- video_id: 8Z2AbZLjunU
  title: ICT + Orderflow - Q&A with HolyAngelBruv
  quote: you're going to want to target the point of control
- video_id: 8Z2AbZLjunU
  title: ICT + Orderflow - Q&A with HolyAngelBruv
  quote: your next target would be down here at the bottom of this balance area
ambiguities:
- No rule defines how much volume, or how many sessions, make a balance area.
- '''Re-enter'' is not defined - a wick back inside, or a close inside?'
- He notes that when price is far away from the balance area he abandons this entirely and trades intraday
  order flow instead, with no stated distance threshold.
