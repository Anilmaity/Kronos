id: partial-profit-taking
name: Partial Profit Taking
aliases:
- first partial
- second partial
category: risk
status: contested
definition: 'EARLIER RECORDINGS. Exits are a ladder anchored to LIQUIDITY rather than to R multiples:
  the first partial at the nearest opposing liquidity (equal lows/highs or a small order block), the second
  at the next pool beyond it, and a third or final position held to the day''s opposing extreme or to
  the close. In the morning-routine video the same ladder is stated as first partial / second partial
  / third partial / hold to close. The scalp variant pairs the first partial with moving the stop to break-even.'
timeframes:
  htf:
  - 1D
  - 15m
  ltf:
  - 5m
  - 1m
  - 15s
  fractal: false
preconditions:
- A position is open and the liquidity pools between entry and the draw are marked.
detection_rules:
- Mark the liquidity pools between entry and the draw before entering.
- First partial at the nearest opposing pool.
- Second partial at the next pool.
- Third / final position to the day's opposing extreme or held to the close.
- 'Scalp variant: first partial, then move the stop to break-even.'
invalidation:
- The stop is hit before the first pool.
measurable:
- how often each rung of the ladder is reached
- expectancy of the liquidity-anchored ladder vs a fixed-R ladder
sources:
- video_id: lpam8F-N3EM
  title: A+ ICT Entry Checklist - ICT Concepts
  quote: that would be your first partial your second partial would be these slows down here
- video_id: aDYzoae3viQ
  title: 15 Second Chart Example - ICT Concepts
  quote: move your stops to break even at least i do one scalping
ambiguities:
- EARLIER RECORDINGS. No position fractions are ever given - 'first partial' never says what percentage
  comes off.
- The ladder is anchored to liquidity, so the number of rungs varies with the chart.
- The scalp break-even pairing conflicts with the CPI review's explicit refusal to move to break-even
  (see break-even-management).
