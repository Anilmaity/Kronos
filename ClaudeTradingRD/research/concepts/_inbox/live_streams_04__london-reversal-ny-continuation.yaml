id: london-reversal-ny-continuation
name: "A+ Setup: Daily C3 + London Reversal + New York Continuation"
aliases: ["my favorite entries", "London reversal New York continuation"]
category: model
status: specified

definition: >
  Asked nothing in particular, he volunteers it as his favourite setup and writes it out:
  daily candle 3 or candle 4, a London reversal, and a 15-minute continuation entry taken
  prior to the NYSE open. The whole of the following stream is a worked example of it plus a
  full review. The logic he gives for why the 09:30 open then drives price rather than
  manipulating it is the part that is new here: if London has already reversed, the day's
  manipulation has happened inside the daily range, so the New York open has nothing left to
  manipulate and is expected to deliver volatility in the direction of the continuation. The
  expansion window that follows is 06:00 to 10:00 a.m., and he wants to be positioned inside it
  before the open rather than entering after the move.

timeframes:
  htf: ["1D", "4H"]
  ltf: ["15m", "5m"]
  fractal: false

preconditions:
  - "Daily candle is a candle 3 or candle 4 - a continuation day."
  - "London has produced a reversal, confirmed by a CISD and / or a 4-hour candle 2 closure."

detection_rules:
  - "Confirm the daily as a continuation day (C3 / C4) with a prior daily candle 2 closure whose hourly CISD and SMT are present."
  - "Confirm the London reversal on the session-appropriate timeframe (1-hour / 30-minute CISD, or a 4-hour candle 2 closure)."
  - "Because the manipulation is already inside the daily range, expect 09:30 to drive price in the continuation direction, not to manipulate."
  - "Take the 15-minute continuation entry before the NYSE open; do not enter after the open drive, which destroys the risk-to-reward."
  - "Expansion is expected across the 06:00-10:00 window."
  - "In simple structural terms the sequence reads: a high, a lower high, a lower low (mirrored for bullish)."

invalidation:
  - "No invalidation level exists for the pre-open entry (no SMT / no trustworthy opposing candle), in which case the setup is an idea only."
  - "The London reversal extreme is taken back out."

execution:
  bias: "Continuation direction of the daily candle."
  entry: "15-minute continuation before 09:30."
  stop: "Beyond the opposing candle produced by the London reversal."
  targets: ["previous day low / high", "the next swing low / high on the daily"]

measurable:
  - "frequency of C3/C4 daily + London reversal co-occurrence"
  - "expectancy of pre-09:30 entries vs post-09:30 entries on those days"
  - "share of the day's range delivered between 09:30 and 10:00 on these days"

sources:
  - video_id: N3Ml-r0X30o
    title: "New York Open Live Q&A"
    quote: "London reversal and 15 continuation prior to NYSE open"

ambiguities:
  - "The London session boundaries are never given in clock time in this unit."
  - "He says 'daily C3 / C4' without saying whether C4 is as good as C3 or a fallback."
  - "The 5-minute is allowed for the continuation but he prefers the 15-minute pre-open because the 5-minute chops."

python_detector: null
related: ["london-reversal-profile", "daily-wick-confirmation-timeframes", "entry-time-window", "clean-day-criteria", "fractal-model-c3"]

contributing_units: ["live_streams_04"]
draft_count: 1
