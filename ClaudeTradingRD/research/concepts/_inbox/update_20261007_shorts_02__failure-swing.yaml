id: failure-swing
name: Failure Swing
category: structure
status: specified
voice: ttrades
definition: >
  SHORTS EVIDENCE on crude oil, daily chart. Price builds stacked highs and lows. The lows are relevant
  lows and get small reactions; the highs are all failure swings - including one with "a bit of
  separation" between it and its neighbour, which he says is still a failure swing. He would not trust
  shorting off a high that leaves another failure swing above it, so his relevant high is the extreme
  beyond the whole cluster. When price finally hits the relevant low, a reversal is looked for with the
  failure-swing highs as target, and the stop side should carry high resistance liquidity / no failure swings.
detection_rules:
  - "A high that leaves another nearby high above it is not a level to trade away from; the relevant high is the outermost of the stacked cluster."
  - "Visible separation between two stacked highs does not by itself make the inner one relevant."
  - "Trade from the relevant low toward the stacked failure swings; keep no failure swings on the stop side."
sources:
  - video_id: ngpzd047kjU
    title: "Trading From Relevant Lows to Relevant Highs"
    quote: "Would you trust trading short off of this high leaving this one? Probably not"
  - video_id: ngpzd047kjU
    title: "Trading From Relevant Lows to Relevant Highs"
    quote: "This one has a bit of separation between those, but they are still failure swings."
  - video_id: ngpzd047kjU
    title: "Trading From Relevant Lows to Relevant Highs"
    quote: "high resistance liquidity or no failure swings on our stop loss side of the market"
ambiguities:
  - "How much separation would be enough to make a stacked high relevant is not stated; this sits in tension with relevant-swing-separation, where separation is the test."
  - "The instrument is oil, not an index or gold; applicability to XAUUSD is assumed, not stated."
related: ["relevant-swing-separation", "high-vs-low-resistance-liquidity", "trade-away-from-manipulation"]
