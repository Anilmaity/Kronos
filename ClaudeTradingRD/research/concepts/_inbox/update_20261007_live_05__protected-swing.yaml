definition: 'Asked when a protected swing fails and price re-sweeps it before continuing in the trend
  direction, he answers that it usually happens after some significant liquidity has been taken out: price
  reaches toward the final target, technically fails, re-sweeps the protected swing and then goes. He
  says he is working on a video and does not know how to explain it mechanically yet. Separately, a protected
  swing that also forms the candle closure is his ''ideal formation'' (gold example).'
