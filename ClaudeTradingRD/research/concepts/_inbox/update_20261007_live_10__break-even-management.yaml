id: break-even-management
name: Break-Even Management
category: risk
status: contested
voice: ttrades
definition: Break-even is conditioned on WHERE the entry sits relative to the new protected swing / expansion.
  If the entry was taken down in the reversal (below the EQ of the new expansion leg), a return of price
  to the entry means the expansion phase is over, so break-even is acceptable. If the entry was a continuation
  entry right at the new protected swing area, a retest of it is still a valid trade, so going break-even
  there makes no sense.
detection_rules:
- After a new protected swing and expansion, mark the EQ of the expansion leg.
- 'Entry below that EQ (in the reversal): moving the stop to break-even is acceptable - price returning
  there would invalidate the expansion.'
- 'Entry at/near the protected swing level itself: do not move to break-even; a return there is still
  valid.'
- Expect price to hold above the expansion EQ if it is going to continue.
measurable:
- stop-outs avoided vs profit forgone by entry-location-conditioned break-even
sources:
- video_id: GRc5FVB5tdg
  title: New York Open Live Q&A
  quote: any sort of entry in here or below this EQ can be break even
