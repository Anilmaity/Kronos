id: smt-requires-framework
name: SMT Is a Confirmation, Not a Framework
category: liquidity
status: contested
voice: ttrades
definition: >
  JuLkLoAv3PM (a clip of uW55Tuk-ngY) restates the doctrine: everyone tries to use SMT to force a
  setup; SMT is a confirmation to a setup, and adding it to garbage structure does not help. He
  turns SMT off on the chart and the setup off the previous day high stays exactly the same. With it
  on, it is an added confirmation for a framework he already has. hWwyr-rTFW4 (a clip of -ocfPuD_oqE)
  shows the same ordering from the direction side: the candle 2 is read only as a short, because the
  bullish reading has no close through the series of down-close candles.
detection_rules:
- The setup must stand with SMT removed; SMT only adds confirmation.
- Where a candle could be read both ways, take only the side that has closed through its opposing series (the CISD side).
sources:
- video_id: JuLkLoAv3PM
  title: Stop Trying to Force a Setup with SMT
  quote: SMT is a confirmation to a setup.
- video_id: JuLkLoAv3PM
  title: Stop Trying to Force a Setup with SMT
  quote: slapping SMT on the thing is not going to help it
- video_id: JuLkLoAv3PM
  title: Stop Trying to Force a Setup with SMT
  quote: The setup remains the exact same for me. Nothing changes.
- video_id: hWwyr-rTFW4
  title: Using SMT as Extra Confirmation for a Reversal
  quote: So it is only valid to look short scenario.
ambiguities:
- No new content; both rules are already in the library (uW55Tuk-ngY and the 'trust only the side
  that also has a CISD' rule).
- '"Garbage structure" is not defined.'
