ambiguities:
- '''Consolidating'' for the dollar reuses the consolidation definition and inherits its lack of
  a duration bound.'
- No rule is given for what to do when the EURGBP read and the individual-closure cross-check disagree.
- The same logic is asserted to transfer to NQ/ES but the equivalent 'cross' for indices is not named
  here.
