id: eurgbp-relative-strength-cross
name: EURGBP As The Relative-Strength Cross For EU vs GU
category: structure
status: specified
aliases:
- EU vs GU
- relative strength cross
definition: 'A fully mechanical asset-selection procedure for forex. Precondition: the dollar must
  not be consolidating - only then do you trade EURUSD or GBPUSD at all. To decide WHICH, read the
  cross EURGBP: if EURGBP is bullish, the euro is stronger and the pound is weaker; if EURGBP is
  bearish, the euro is weaker and the pound is stronger. Then pair strength against the dollar''s
  direction - bullish dollar: short the WEAKER foreign currency; bearish dollar: long the STRONGER
  one. The cross is read with the same machinery as everything else (daily candle 2 closures, hourly
  CISD). A secondary check is offered: compare the individual daily closures of EURUSD and GBPUSD
  directly - the weaker one closes more decisively through its opposing candles.'
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  fractal: false
preconditions:
- The dollar (DXY) is not consolidating and has a directional read.
detection_rules:
- 'Gate: if the dollar is consolidating, do not trade EU or GU.'
- Read EURGBP direction using a daily C2/C3 closure plus hourly CISD.
- EURGBP bullish -> euro stronger, pound weaker. EURGBP bearish -> euro weaker, pound stronger.
- Bullish dollar -> short the weaker of EURUSD / GBPUSD.
- Bearish dollar -> long the stronger of EURUSD / GBPUSD.
- Cross-check with the individual daily closures of EURUSD and GBPUSD - the weaker asset shows the
  more decisive closure through its opposing candles.
- Then apply the ordinary fractal model on the selected pair.
invalidation:
- EURGBP itself reverses, flipping the strength read.
execution:
  bias: Dollar direction, expressed on the correctly selected pair.
  entry: Standard fractal model entry on the selected pair.
  stop: Standard.
  targets:
  - standard
measurable:
- return difference between trading the selected pair vs the rejected one on the same signal days
- how often the EURGBP read and the individual-closure read disagree
