id: t-spot
name: The T-Spot (overlap of two half levels)
aliases:
- gray box
- green box
- T-spot
category: entry
status: underspecified
definition: 'In this unit the T-spot is the box his indicator paints (grey in the index examples,
  green in the gold example) marking the area in which the wick of the daily candle should form before
  price trades away. He states the use explicitly - he wants price to open, make a low inside the
  area, and then trade higher, so the area is where the wick low must be held - and he shows what
  is inside it: a fair value gap, which is the object actually entered from. Asked directly how the
  indicator prints the T-spot he answers only that it is what he coded, so the derivation is withheld
  here.'
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- A printed model on the higher-timeframe candle.
detection_rules:
- The box marks the zone in which the current higher-timeframe candle's wick should form.
- 'Bullish case: price must open, form its low inside the box, then trade away.'
- The entry object inside the box is a fair value gap / continuation, not the box boundary.
- Price trading beyond the box without holding it is the failure case (he shows one that chops through).
invalidation:
- The wick does not form in the box and price does not respect it.
measurable:
- share of higher-timeframe wicks terminating inside the painted box
- outcome of continuations that respect the box vs those that do not
sources:
- video_id: sdZkE-naNiY
  title: TTrades Indicator Updates - Walkthrough and Q&A
  quote: looking for the wick of the daily candle to essentially try to form
ambiguities:
- The derivation is explicitly withheld - asked how the indicator prints it, he says only that it
  is what he coded.
- The box appears grey in some examples and green in others with no stated difference in meaning.
- '''Respected'' is not defined as a wick touch, a body close or a full hold.'
