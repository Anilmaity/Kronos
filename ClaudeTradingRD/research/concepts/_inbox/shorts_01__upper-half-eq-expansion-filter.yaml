id: upper-half-eq-expansion-filter
name: Upper-Half EQ Rule For Expansion
category: structure
status: specified
definition: SHORTS EVIDENCE, given as a chart procedure rather than a principle. For expansion higher,
  the UPPER HALF of the higher-timeframe candle must support price; the operational step is to mark
  half of that candle's range and then look for a PD array sitting inside that half. That PD array -
  in the worked example a fair value gap resting above a protected low - is where the higher-timeframe
  wick is expected to form and where the lower timeframe should print its reversal / change in the state
  of delivery. The mirror applies to a bearish candle 3, where the lower half must be respected.
preconditions:
- A higher-timeframe candle (typically the C3) has been identified and its range marked.
- A directional bias exists.
detection_rules:
- Mark the 50% level of the higher-timeframe candle's range.
- 'Bullish: require the upper half to support price; bearish: require the lower half to.'
- Search that half for a PD array (fair value gap, protected swing) - that is the expected wick location.
- Enter when the lower timeframe prints a change in the state of delivery inside that PD array.
- 'The same half-of-candle test is applied to candle 3 specifically: look for the continuation in the
  upper (bullish) or lower (bearish) half of C3.'
invalidation:
- Price trades through the 50% level into the opposing half of the candle.
measurable:
- share of expansion candles whose opposing wick stays within the correct half
- hit rate of entries at a PD array located inside the correct half versus outside it
