id: options-expiry-3x-rule
name: "Options Expiry = 3x The Expected Time To Target"
aliases: ["3x the time", "theta decay"]
category: risk
status: specified

definition: >
  Asked for advice for someone starting with options, he names the failure mode - buying
  short-dated options and losing to theta decay - and gives one numeric rule against it.
  Estimate how long the idea should take to reach its target, then buy expiry at three times
  that horizon: a week becomes three weeks or a month, a month becomes three, four or five
  months. He uses options for swing exposure rather than intraday (QQQ options for swings,
  QQQM shares for the longer-term hold because of lower fees).

timeframes:
  htf: ["1W", "1D"]
  ltf: []
  fractal: false

preconditions:
  - "A directional idea with an estimated time-to-target."

detection_rules:
  - "Estimate the time for price to reach the target."
  - "Select an expiry at least three times that estimate."
  - "Do not buy short-dated options against a multi-week idea."

invalidation:
  - "Not applicable - a sizing / instrument rule."

execution:
  bias: null
  entry: null
  stop: null
  targets: null

measurable:
  - "realised time-to-target distribution vs the 3x expiry assumption"
  - "P&L attribution split between direction and time decay"

sources:
