ambiguities:
- '''Wednesday morning'' is not given a clock time.'
- The transcript renders 'the low' as 'the slow'.
- He immediately shows a week that 'wasn't great' against the template, so the tendency is presented
  as a tendency, not a rule.
- How the directional expectation for the week is formed is assumed, not given here.
