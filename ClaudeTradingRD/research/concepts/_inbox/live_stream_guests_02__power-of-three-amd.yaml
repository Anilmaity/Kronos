id: power-of-three-amd
name: Power Of Three On The Weekly Candle (manipulation low on Monday, Tuesday or Wednesday morning)
aliases:
- weekly power of three
- AMD on the week
category: model
status: specified
definition: 'TTrades walks the weekly power of three on screen. For a bullish week the sequence is:
  the weekly open, then a move DOWN which is the manipulation, then range expansion up (distribution),
  then a close near the highs. The timing claim is the operative part - the low of a bullish week should
  be put in on Monday, Tuesday or Wednesday MORNING, and he says Tuesday is usually a good idea. He
  then tells the audience to backtest it themselves by going back and looking at what every Tuesday
  did during a given move, and shows a week that fits and one that does not.'
timeframes:
  htf:
  - 1W
  - 1D
  ltf: []
  fractal: true
preconditions:
- A directional expectation for the week (e.g. reaching for liquidity above).
detection_rules:
- 'Bullish week: mark the weekly open; expect the manipulation leg lower first.'
- The weekly low should form on Monday, Tuesday or Wednesday morning - most often Tuesday.
- After that low holds, expect range expansion up and a close near the weekly highs.
- Mirror for a bearish week (high formed Monday-Wednesday morning, close near the lows).
- A week whose low forms Thursday or Friday does not fit the profile.
invalidation:
- The manipulation low is violated after Wednesday morning - the week is not the bullish power-of-three.
measurable:
- day-of-week distribution of the weekly low in up weeks (and the high in down weeks)
- proportion of up weeks closing in the top quartile of their range
