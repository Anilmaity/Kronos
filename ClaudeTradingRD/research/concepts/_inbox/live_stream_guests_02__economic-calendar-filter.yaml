id: economic-calendar-filter
name: The Economic Calendar As The Week's Roadmap (accumulation / manipulation / distribution)
aliases:
- the calendar creates the weekly range
category: time
status: underspecified
definition: 'Rauf opens the stream with the claim that the economic calendar is where most of your trades
  will be formed, because it is the roadmap that creates the weekly range. He then maps the week onto
  the AMD phases from the calendar: a Monday with no USD news is accumulation for the weekly range,
  Thursday is where he expects distribution, and the question the calendar leaves open is WHERE the
  manipulation occurs - which is why he waits for external range liquidity to be taken before acting.
  He explicitly criticises using red-folder events on their own as a directional expectation, and says
  he prefers to look at candle closes instead of at the red-folder event itself. He also discounts 03:00
  euro news because he trades New York.'
timeframes:
  htf:
  - 1W
  - 1D
  ltf: []
  fractal: false
preconditions:
- A week's economic calendar for the traded currency.
detection_rules:
- Map the week's red-folder events before analysing charts.
- A day with no relevant news early in the week is read as accumulation.
- 'Expect distribution in the back half of the week (his example: Thursday).'
- Do not assume direction from a news event - wait for external range liquidity to be taken to locate
  the manipulation.
- Prefer reading candle closes over reading the event itself.
- Ignore news for currencies outside the traded session (03:00 euro news for a New York trader).
invalidation:
- No external range liquidity is taken - the manipulation has not been located and the week is not framed.
measurable:
- day-of-week distribution of the weekly high and low relative to the first red-folder event
- hit rate of 'Thursday caps the weekly range'
sources:
- video_id: qFtfD09Vv3E
  title: Live with Day Trading Rauf - Preparing for a New Week
  quote: the economic calendar that's where most your trades will be formed
- video_id: qFtfD09Vv3E
  title: Live with Day Trading Rauf - Preparing for a New Week
  quote: because it creates the weekly range
ambiguities:
- The Monday-accumulation / Thursday-distribution mapping is asserted for the specific week under analysis
  and never generalised into a rule.
- '''Realistically trading starts on a Thursday and Friday'' is said once and then contradicted later
  in the same stream when he says he does sometimes favour trading Mondays.'
- Which external range (daily, weekly, monthly) must be taken for the manipulation is not fixed.
