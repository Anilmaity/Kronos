id: autobias-filter
name: Autobias (higher-timeframe direction filter)
category: model
status: specified
definition: 'Live explanation of the indicator setting. On an H1/M5 model viewed on the 5-minute chart,
  autobias 1 looks one timeframe up and shows the setup only if there is ALSO a valid 4-hour/15-minute
  fractal model; autobias 2 looks two timeframes up (daily/H1) and shows only setups agreeing with the
  daily model - demonstrated live, a bullish 5-minute setup disappears because the daily is bearish. When
  a viewer asks what to do if autobias 1 is bullish and autobias 2 bearish, he refuses to give a mechanical
  tiebreak: stop pattern trading the indicator and decide your own bias.'
detection_rules:
- Autobias 1 on an H1/M5 model requires a valid H4/M15 model in the same direction.
- Autobias 2 on an H1/M5 model requires agreement with the D1/H1 model.
sources:
- video_id: rVRk4MLTJSs
  title: New York Open Live Q&A
  quote: Autobias one will take a look up one time frame and look for a model
- video_id: rVRk4MLTJSs
  title: New York Open Live Q&A
  quote: Autobias 2, two time frames up.
- video_id: rVRk4MLTJSs
  title: New York Open Live Q&A
  quote: stop trying to just strictly pattern trade it and decide if you were bullish
ambiguities:
- No resolution rule is given when autobias 1 and autobias 2 disagree; it is left to discretionary bias.
