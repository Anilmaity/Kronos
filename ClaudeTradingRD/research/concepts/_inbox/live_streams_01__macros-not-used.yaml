id: macros-not-used
name: Macros Rejected
definition: 'Stated flatly and repeatedly in these streams: macros are fake. His argument is mechanical
  rather than dismissive - a macro is an arbitrary window drawn around the open of a new higher-timeframe
  candle, so the candle open is the real object and the window around it is invented. He lists macros
  alongside ''time distortion'', reaper gaps and similar as shiny names that do not help a trader
  learn basics and swing points. Kill zones are rejected on the same grounds - he cares about higher-timeframe
  candles instead.'
category: time
status: contested
detection_rules:
- Do not implement macro windows.
- Where a macro would be drawn, use the higher-timeframe candle open it surrounds.
- Same for kill zones - replace with candle opens.
measurable:
- overlap between macro windows and higher-timeframe candle opens on the same session
sources:
- video_id: yNgx9OAefuI
  title: New York Open Live Q&A
  quote: Macros are fake. That's my opinion. Not real.
- video_id: NESSCPMzWR0
  title: New York Open Live Q&A
  quote: I just care about higher time frame candles
ambiguities:
- He labels this an opinion, not a finding, and offers no data against macros.
- He does use specific clock times (9:30, 9:45, 10:00) - the rejection is of the window around them,
  not of the times themselves.
