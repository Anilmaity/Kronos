id: structure-requires-htf-context
name: Never Read Lower-Timeframe Structure Without A Higher-Timeframe Bias First
category: structure
status: specified
definition: 'Three Shorts state the same doctrine from different angles, and one of them gives the mechanism
  in a single sentence: a lower-timeframe reversal, or a lower-timeframe shift in structure, is actually
  just a RETRACEMENT to a higher-timeframe PD array. In the worked example a 5-minute structure break
  looked valid, but zooming to the hourly showed the move was only a retracement into an hourly fair
  value gap - so that retracement was going to fail, because it was going against the higher timeframe.
  The positive form: the daily chart drives every setup; if a direction can be framed on the daily,
  the lower timeframes fall into line. The discipline form: once you have a bias, come in and KEEP it,
  and let the timeframes align with it.'
timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 5m
  fractal: true
preconditions:
- A higher-timeframe (daily, or at least hourly) directional read exists.
detection_rules:
- Before trusting a lower-timeframe structure shift, check whether it is merely a retracement into a
  higher-timeframe PD array (e.g. an hourly fair value gap).
- If it is, expect that retracement - and the structure shift built on it - to FAIL.
- Frame direction on the daily first; treat lower-timeframe structure as subordinate to it.
- Having formed a bias, keep it and wait for the lower timeframes to align with it rather than re-reading
  direction off the lower timeframe.
- 'Worked case: an hourly change in the state of delivery into a previous day high was still treated
  as a retracement, because the daily read was bullish; the entry waited for the lower wick to form
  and a CISD with an ideal candle 2 closure, entering on the open of candle 3.'
invalidation:
- The higher-timeframe read itself changes (a new daily closure).
measurable:
- failure rate of LTF structure shifts that occur inside an opposing HTF PD array
- win-rate difference between HTF-aligned and HTF-opposing LTF structure shifts
sources:
- video_id: w-lr4VlpCMs
  title: Market Structure is the Foundation of Trading.
  quote: is actually just a retracement to a higher time frame PD array
- video_id: w-lr4VlpCMs
  title: Market Structure is the Foundation of Trading.
  quote: this retracement is going to fail because it's going against the higher time frame
- video_id: Us6Qsl6Tu9E
  title: Frame the Direction on the Daily, Let the Lower Timeframes Fall into Line
  quote: If I can frame a direction on the daily chart
- video_id: LwC6OF_eRdQ
  title: Let the Timeframes Align with Your Bias
  quote: you do want to come in and keep that bias
ambiguities:
- The rule is stated as a post-hoc read on charts already known to have failed; no forward test is given
  for deciding, at the time, whether the current LTF shift sits inside an opposing HTF PD array.
- '"Keep that bias" is stated without a stop condition - the Shorts do not say what would make him abandon
  it intraday.'
- Which higher timeframe outranks which is not ordered beyond "the daily chart drives all my setups".
