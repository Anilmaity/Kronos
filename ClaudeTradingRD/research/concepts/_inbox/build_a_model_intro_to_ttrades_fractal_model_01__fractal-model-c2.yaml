  quote: we want this to occur at a higher time frame key level
- video_id: tyoxl1l-6iI
  title: 'Candle 2 Closure: The Foundation of TTrades Fractal Model'
  quote: I need a point of interest to frame a candle closure
- video_id: tyoxl1l-6iI
  title: 'Candle 2 Closure: The Foundation of TTrades Fractal Model'
  quote: If it doesn't respect the 0.5, then it's likely to fail
- video_id: v1X8UMWgWmI
  title: Best Trading Strategy for 2026 - TTFM
  quote: we do need a change in the state of delivery inside that candle two
ambiguities:
- '''Closes back inside the previous candle''s range'' is stated as closing back above/below candle
  1''s LOW/HIGH specifically - so a close inside candle 1''s body is not required. This is more permissive
  than some Q&A-derived readings in the library.'
- Whether the sweep must be a wick-through or can be a full trade-through is not stated.
- '''Point of interest'' is enumerated (fair value gap, high, low) but not ranked; the video also
  allows opposing candles to serve as one, calling that ''more advanced''.'
- The exact requirements for C2/C3/C4 in the indicator are explicitly deferred to the paid course
  ('I go over all the requirements for these within my course and mentorship').
