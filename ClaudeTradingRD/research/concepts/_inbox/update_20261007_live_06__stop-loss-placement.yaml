id: stop-loss-placement
name: Stop Loss Placement (Swing vs Body)
category: risk
status: contested
voice: ttrades
definition: 'Additional documented modification: on an aggressive daily-reversal short where a stop at
  the protected high would not yield even 2R, he places the stop just above the EQ (50%) of the move instead,
  reasoning that a genuine reversal day should not trade back above the EQ - price may tap into it but
  not disrespect it. Once in, adverse moves short of the stop are not acted on: the loss was accepted
  at entry, and a stop-out is a loss, not an invalidation of the idea.'
detection_rules:
- Compute R with the stop at the protected swing; if it is below 2R, do not take that placement.
- 'Alternative: stop just beyond the EQ (50%) of the reversal leg, on the premise that a valid reversal
  should not disrespect the EQ.'
- After entry, take no action on adverse moves that do not reach the stop.
sources:
- video_id: uW55Tuk-ngY
  title: New York Open Live Q&A
  quote: I'm not even getting 2 R. Not worth it for me.
- video_id: uW55Tuk-ngY
  title: New York Open Live Q&A
  quote: So, I just put it above the EQ.
- video_id: uW55Tuk-ngY
  title: New York Open Live Q&A
  quote: I don't want to see price go over or disrespect the EQ.
- video_id: uW55Tuk-ngY
  title: New York Open Live Q&A
  quote: That's what the stop loss is for.
ambiguities:
- Which leg the EQ is measured on (the daily candle, the reversal leg, or the swing range) is pointed
  to on-chart but not stated.
- '"Go over or disrespect" vs "tap into it" - wick through vs close through is not defined.'
