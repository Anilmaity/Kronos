definition: 'Restated live: rank YM/ES/NQ before the open (here YM strongest, NQ weakest); when the ranking
  rotates repeatedly off the open he looks at the middle asset (ES) because the outer two flip around.
  He uses YM mainly as a relative-strength gauge rather than for levels, and says checking YM is not mandatory,
  just his easiest way to read strength.'
