id: daily-range-budget
name: Daily Range Budget (Eyeballed, Not ADR)
category: risk
status: underspecified
definition: 'Adds a volatility input: he checks the VIX (or just the daily chart) to set range expectations.
  With the VIX at the low of a big range he holds lower expectations for the day''s range. He also notes
  that the day''s move had already made most of a daily range and that recent days were smaller-range,
  so further expansion was not expected.'
detection_rules:
- When the VIX is at the low of its recent range, lower the expected daily range.
sources:
- video_id: rVRk4MLTJSs
  title: New York Open Live Q&A
  quote: can use the VIX to help with your expectations on range.
- video_id: rVRk4MLTJSs
  title: New York Open Live Q&A
  quote: I have lower expectations for the daily range.
ambiguities:
- No VIX level or lookback is given; 'low of this range' is read by eye.
related:
