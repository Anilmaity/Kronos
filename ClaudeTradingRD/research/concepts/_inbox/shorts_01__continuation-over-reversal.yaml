id: continuation-over-reversal
name: Continuation-Only Doctrine
category: model
status: specified
definition: 'SHORTS EVIDENCE presented as a side-by-side demonstration rather than an assertion. On
  the same downtrending price action he takes two reversal entries - each on a change in the state of
  delivery with a V-shaped reversal - and is stopped out on both. He then keeps the same bullish read
  but declines the retest entry and waits for a CONTINUATION instead: price retests into the fair value
  gap, closes over the series of down-close candles, and that produces a propulsion block / continuation
  order block, which is the entry he actually takes. The stated conclusion is that continuations are
  both better and EASIER to trade than reversals.'
preconditions:
- A reversal has already formed and the new direction is established.
detection_rules:
- Do not enter on the reversal CISD itself, and do not enter on its retest.
- Wait for price to retest into the fair value gap left by the reversal.
- Require a close over the series of down-close candles (bullish case).
- That structure is the propulsion block / continuation order block - enter there.
- Being stopped out of reversal entries does not invalidate the directional read.
measurable:
- win rate of reversal-CISD entries versus continuation entries on the same swings
- number of failed reversal attempts per eventual successful continuation
sources:
