ambiguities:
- No count is given for how many failed reversal attempts to tolerate before standing aside.
- The Short does not say whether the continuation entry uses the same stop reference as the reversal.
- QIGVXzsVER8 and zgRhc0gxFrs are duplicate uploads of the same Short.
