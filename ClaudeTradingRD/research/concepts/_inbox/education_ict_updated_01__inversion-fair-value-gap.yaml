id: inversion-fair-value-gap
name: Inversion Fair Value Gap (IFVG)
aliases:
- inversion
category: structure
status: specified
definition: 'A fair value gap that has been closed through in the opposing direction and now acts in
  the opposite polarity. He lists it as one of three interchangeable ways to signify a change in order
  flow (inversion, CISD, market structure shift) and states a stricter threshold than the common one:
  a close beyond 50% of the gap is not enough for him, he waits for a full closure below (above) the
  gap.'
timeframes:
  htf:
  - 1D
  ltf:
  - 1H
  - 15m
  - 5m
  fractal: true
detection_rules:
- A bullish fair value gap exists.
- Price closes fully below the entire gap (not merely below its 50% / consequent encroachment).
- The gap is now treated as bearish; a retest of it is resistance.
invalidation:
- Only a partial close through (e.g. below 50% but inside the gap) — he does not count it.
measurable:
- outcome difference between 50%-close inversions and full-close inversions
sources:
- video_id: E89d1HArbgM
  title: Market Structure Shift vs Change In State Of Delivery
  quote: I prefer to wait for a full closure below
- video_id: E89d1HArbgM
  title: Market Structure Shift vs Change In State Of Delivery
  quote: the change in the state of delivery happens prior to the market structure shift
ambiguities:
- '''Full closure below here'' is shown on a chart; whether it means the candle body or the whole candle
  must be below the gap is not stated.'
- He explicitly frames inversion / CISD / MSS as a matter of personal preference ('whatever your eyes
  see best'), so no precedence rule exists between them.
related:
