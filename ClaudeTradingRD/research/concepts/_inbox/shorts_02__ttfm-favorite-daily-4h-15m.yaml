id: ttfm-favorite-daily-4h-15m
name: His Favourite Pairing - Daily Bias / 4-Hour Swing Point / 15-Minute Entry
category: model
status: specified
definition: 'The Short walks his favourite setup as a three-layer alignment with concrete execution.
  Daily: price has entered a fair value gap with the bodies still respecting it, and a candle 2 closure
  prints - so expansion is expected in the next daily candle. 4-hour: right off the open, another candle
  2 closure, so candle 3 on the 4-hour is the leg to trade, toward the failure swings to the left. 15-minute:
  a change in the state of delivery, a V-shape recovery, and a close over. With all timeframes aligned
  he takes the continuation entry AT THE MARKET on the new open, stop at the protected low, targeting
  2R or the failure swings - which he prices at around 4R.'
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 15m
  fractal: true
preconditions:
- Price has entered a daily fair value gap with the bodies still respecting it.
detection_rules:
- 'Daily: require a candle 2 closure - price reversed within that candle - so expansion is expected
  next.'
- '4-hour: require a candle 2 closure right off the open; trade candle 3 on the 4-hour.'
- 'Direction/target: the failure swings on the left side.'
- '15-minute: require a change in the state of delivery and a V-shape recovery with a close over.'
- Only with all three aligned, enter AT THE MARKET on the new open.
- 'Stop at the protected low. Targets: 2R, or the failure swings at roughly 4R.'
invalidation:
- Price trades through the protected low used for the stop.
measurable:
- frequency of daily-C2 + 4H-C2 + 15m-CISD alignment per month
- hit rate of the 4R failure-swing target versus the 2R target
sources:
- video_id: 5Y-8G9eA35o
  title: My Favorite Fractal Model Setup
  quote: now that all my time frames are aligned, I can look for this continuation entry
- video_id: 5Y-8G9eA35o
  title: My Favorite Fractal Model Setup
  quote: My entry is at the market of the new open
- video_id: 5Y-8G9eA35o
  title: My Favorite Fractal Model Setup
  quote: I can look for two R or we can look for these failure swings
ambiguities:
- '"Around four R" is measured off the chart in the clip, not derived from a rule; it is an example,
  not a target policy.'
- No rule is given for choosing between the 2R exit and holding for the failure swings.
- The daily fair value gap entry with "bodies still respecting" is used as the context but not defined
  as a gate.
- The instrument is never named.
execution:
  bias: Direction shared by the daily C2, the 4-hour C2/C3 and the 15-minute CISD.
  entry: At market on the new open once all three align.
  stop: The protected low.
  targets:
  - 2R
  - the failure swings on the left (~4R in the worked case)
related:
- aligning-expansion-candles
- fractal-model-c2
- fractal-model-c3
- market-order-entry
- timeframe-alignment-pairs
- protected-swing
