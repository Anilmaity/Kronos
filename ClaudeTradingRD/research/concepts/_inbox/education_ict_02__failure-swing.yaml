id: failure-swing
name: Failure Swing
category: structure
status: contested
definition: 'In this unit a failure swing is defined by SWEEPING, not by proximity: it is a high or
  low that a subsequent price leg approached and turned away from WITHOUT taking it out. The high
  (or low) left behind by that turn is the failure swing, and the untaken liquidity resting above/below
  it is what makes the area low resistance. He uses failure swings both as the thing that identifies
  low resistance liquidity and as a place to exit - taking profit at the failure swing rather than
  holding for a more distant, already-swept level.'
timeframes:
  htf:
  - 1D
  - 4H
  - 15m
  ltf:
  - 5m
  - 1m
  fractal: true
detection_rules:
- Mark a high (or low) L. Observe the next price leg that travels toward L.
- If that leg reverses before trading through L, the extreme it made is a failure swing and L remains
  untaken.
- A cluster of such extremes on the same side is a low-resistance region.
- 'Use: exit the position at the failure swing / equal lows rather than holding for the more distant
  high-resistance extreme.'
measurable:
- realised R exiting at the failure swing vs holding to the distant swept level
sources:
- video_id: 2lIaRUtJqpU
  title: Low Resistance Liquidity Run - ICT Concepts
  quote: low resistance liquidity is just a high or low with a failure swing
- video_id: 2lIaRUtJqpU
  title: Low Resistance Liquidity Run - ICT Concepts
  quote: this is generally when I want to look for the failure swing above it
ambiguities:
- This sweep-based definition is not the same as the proximity-based definition recorded from other
  units (stacked extremes too close together to trade away from). Both are preserved.
- No lookback bound on which leg counts as 'the leg toward it'.
