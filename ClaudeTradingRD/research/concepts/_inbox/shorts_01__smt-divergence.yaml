id: smt-divergence
name: SMT Divergence (as confluence only)
category: liquidity
status: specified
definition: 'SHORTS EVIDENCE giving the plainest definition in the corpus. Correlated assets normally
  print SIMILAR STRUCTURE - one puts in a low, the other puts in a low; one puts in a higher low, the
  other puts in a higher low. An SMT is the moment one asset DIVERGES from the other: while one makes
  a low and then a higher low, the other makes a low and then a LOWER low. The bearish mirror is one
  making a high and a higher high while the other makes a high and a lower high.'
preconditions:
- Two correlated assets are charted on the same timeframe.
detection_rules:
- Establish that the two assets normally track each other structurally.
- 'Bullish SMT: asset A makes low then higher low; asset B makes low then LOWER low.'
- 'Bearish SMT: asset A makes high then higher high; asset B makes high then LOWER high.'
- The divergence itself is the SMT - no additional confirmation is defined in this Short.
measurable:
- frequency of SMT prints per session per correlated pair
- hold rate of the divergent extreme
sources:
- video_id: 4ZP1dm-ktFE
  title: Breaking Down SMT Divergence’s Role in Price Action
  quote: generally with correlated pairs or correlated assets, we're going to have similar structure
- video_id: 4ZP1dm-ktFE
  title: Breaking Down SMT Divergence’s Role in Price Action
  quote: what SMT is is when one of these assets diverge from the other
ambiguities:
- Whether the compared swing points must be time-aligned candle-for-candle is not stated.
- This Short gives the definition only - it says nothing about SMT being confluence rather than a signal,
  which other units in the library insist on.
