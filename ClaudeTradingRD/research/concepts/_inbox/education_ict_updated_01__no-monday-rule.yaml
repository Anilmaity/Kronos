id: no-monday-rule
name: Skip Mondays
aliases:
- skipping Mondays
category: time
status: specified
definition: 'A standing personal rule stated alongside the news filter: he avoids trading before the
  week''s first high-impact news event AND skips Mondays. His stated reason in the worked example is
  that Monday is generally the accumulation for the weekly profile.'
timeframes:
  htf:
  - 1W
  - 1D
  ltf: []
  fractal: false
detection_rules:
- It is Monday -> no trade.
- The week's first high-impact event has not yet released -> no trade.
measurable:
- Monday P&L vs the rest of the week
sources:
- video_id: hKCMqh0ZsY0
  title: How To Use The Economic Calendar For Trading
  quote: I avoid trading prior to the first high impact news event of the week
- video_id: hKCMqh0ZsY0
  title: How To Use The Economic Calendar For Trading
  quote: as well as skipping Mondays
ambiguities:
- It is framed as 'the general rule I use for myself' — a personal policy, not a claim about edge.
- Elsewhere in the corpus he states Monday IS tradeable when the prior Friday formed a reversal; this
  video does not reconcile the two.
- The library entry for this id was first built from a guest; this is TTrades stating the same rule
  in his own voice.
related:
- economic-calendar-filter
- monday-trade-rule
- weekly-profile-framework
voice: ttrades
contributing_units:
