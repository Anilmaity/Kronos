- video_id: tyoxl1l-6iI
  title: 'Candle 2 Closure: The Foundation of TTrades Fractal Model'
  quote: I can use these opposing candles as the point of interest
- video_id: v1X8UMWgWmI
  title: Best Trading Strategy for 2026 - TTFM
  quote: sweeping out a low or reaching into a fair value gap or ideally both
- video_id: WFqLwOp2pXw
  title: How To Trade Consolidation - Phases Of Price
  quote: That is when I can use 0.5 of this opposing candle here
ambiguities:
- No ranking is given when several points of interest are available; the stated method is to wait
  and see which one a swing actually forms at.
- '''Ideally both'' (sweep AND fair value gap) is preferred but not required.'
- No relevance test is given for which highs/lows qualify beyond 'previous days and previous weeks
  are always relevant'.
