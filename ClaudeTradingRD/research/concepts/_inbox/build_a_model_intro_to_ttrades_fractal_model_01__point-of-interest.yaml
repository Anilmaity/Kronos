id: point-of-interest
name: Point Of Interest (POI)
category: entry
status: specified
aliases:
- POI
- important level
- higher time frame key level
definition: 'The location requirement without which no candle closure and no CISD is valid. Enumerated
  in this unit as: a fair value gap, a high being taken out, or a low being taken out - ''I use fair
  value gaps and highs and lows''. Its role is stated as framing: you find the candle closures first,
  then check whether each has a point of interest, and only those that do give you a bias. Two extensions
  are given: a series of opposing candles can serve as a point of interest (''more advanced''), and
  where neither a fair value gap nor a sweepable low exists, 0.5 of the opposing candle is used instead.'
timeframes:
  htf:
  - 1M
  - 1W
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  - 5m
  fractal: true
preconditions:
- A candle closure has been identified.
detection_rules:
- 'Accept as a point of interest: a fair value gap price reached into, a high taken out, or a low
  taken out.'
- 'Procedure: mark candle closures first, then test each for a point of interest; a closure without
  one is discarded.'
- The point of interest may come from a much higher timeframe (a monthly high is used in one example).
- 'Extension: opposing candles / a protected swing can act as the point of interest.'
- 'Fallback: 0.5 of the opposing candle when no fair value gap or sweepable extreme exists.'
- A fair value gap already traded through is no longer a valid point of interest.
invalidation:
- The closure has no point of interest - not a valid setup.
measurable:
- fraction of C2 closures that survive the POI gate
- outcome difference by POI type (fair value gap vs swept high/low)
