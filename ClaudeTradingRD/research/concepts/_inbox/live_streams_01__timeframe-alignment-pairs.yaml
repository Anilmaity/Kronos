id: timeframe-alignment-pairs
name: Timeframe Pairing and Alignment
definition: 'The pairs named in these streams. For pre-open and London: H4 with M15, or daily with
  H1 - and for London specifically he prefers H4/M15. For positional and swing work: daily with hourly,
  explicitly not weekly with 4-hour. A 1-hour/5-minute pairing is referenced as his scalping model.
  To confirm a 4-hour high or low, use a 15-minute change in the state of delivery. He uses every
  timeframe below the daily as nested inside it and refines downward - 4-hour tells him whether there
  is anything to frame, then the hourly, then the 15-minute.'
category: model
status: specified
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 1H
  - 15m
  - 5m
  fractal: true
detection_rules:
- 'Pre-open / London: H4 analysis with M15 execution, or daily analysis with H1 execution.'
- 'Positional / swing: daily analysis with hourly execution.'
- 'Scalping: H1 with M5.'
- Confirm a 4-hour extreme with a 15-minute change in the state of delivery.
- 'Refine top-down: daily, then 4-hour, then hourly, then 15-minute.'
measurable:
- confirmation rate of 4-hour extremes by an M15 CISD
- stop-out rate per pairing
sources:
- video_id: xraklBJHW5k
  title: New York Open Live Q&A
  quote: H4 M15 or daily H1
- video_id: yNgx9OAefuI
  title: New York Open Live Q&A
  quote: Use a 15-minute change in the stage delivery
ambiguities:
- The auto-captioner writes 'change in the stage delivery' for 'change in the state of delivery'.
- Whether the H1/M5 scalping pair is still in use is unclear - he says he trades higher timeframes
  as he has traded up, and elsewhere says he does not scalp.
- For intraday work he says he does not care about anything above the daily; for swings he goes monthly,
  three-month and sometimes yearly.
