ambiguities:
- '''Discount array'' is used without a definition of which array or how the premium/discount range
  is anchored in this exchange.'
- The AM session is not given clock bounds here.
- The last quote is the guest's own statement of the same binary; the first two are the host's. They
  agree, but the reasoning shown on the chart is the host's.
