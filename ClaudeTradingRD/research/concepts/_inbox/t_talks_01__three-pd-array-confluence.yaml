id: three-pd-array-confluence
name: "Stacked PD Arrays As The Probability Filter"
aliases: ["three PD arrays overlapping", "stacking points of interest", "confluence"]
category: entry
status: specified

definition: >
  A probability filter shared, in different numeric forms, by three speakers in this unit: an
  entry level is only high probability when several independent points of interest resolve to the
  same price. Rauf gives it as a hard count of three, and adds the symmetric failure test - three
  PD arrays failing means the idea is invalid.

timeframes:
  htf: ["1W", "1D", "4H", "1H"]
  ltf: ["15m", "5m", "1m", "5s"]
  fractal: true

preconditions:
  - "A candidate entry level has been identified by the primary method."

detection_rules:
  - "Rauf: when three PD arrays overlap at the same price, the entry is high probability. When three PD arrays fail, the trade idea is not valid."
  - "AP: the levels alone are powerful, but explosive moves and precise entries require at least one further thing lined up - an unmitigated order block, an imbalance, the 50 percent of an internal flip zone, a peak-consolidation or volume node, or the 50 percent of an extreme wick."
  - "DTR: prefers multiple points of interest stacked - worked examples cite four stacked (50 percent of a 7-hour wick, hourly opposing candles, an hourly IFVG, an earlier hourly C2 unicorn)."
  - "DTR's exception: the daily T-spot is explicitly sufficient on its own, requiring no additional confluence."

invalidation:
  - "Rauf's symmetric test - three PD arrays failing invalidates the idea."

execution:
  bias: "Unchanged."
  entry: "Only where the required number of arrays coincide."
  stop: "Not stated."
  targets: []

measurable:
  - "hit rate and expectancy bucketed by number of coinciding PD arrays (1, 2, 3, 4+)"
  - "frequency of 3-plus stacks per week per instrument"
  - "whether the DTR T-spot exception performs as well alone as a 3-array stack"

sources:
  - video_id: wB-fQiT_UDo
    title: "DayTradingRauf | ICT MMXM Models"
    quote: "when you have three PD arrays overlapping each other"
  - video_id: gjoRPszj-Qk
    title: "AP | Use Market Structure & Fibonacci Levels for Sniper Entries"
  - video_id: 07lOxv39LdY
    title: "DTR | C2U - Blending The Fractal Model & Unicorn Model - No Daily Bias"

ambiguities:
  - "The required count differs by speaker - three (Rauf), at least two (AP), 'multiple' (DTR) - and none justifies the number."
  - "No speaker defines how close two arrays must be to count as overlapping."
  - "The set of things admitted as a PD array or point of interest differs materially between the three, so the counts are not comparable."
  - "AP explicitly declines to specify what counts as a higher-timeframe key area because different traders use different POIs."

python_detector: null
related: ["gb-levels", "c2-unicorn", "mitigation-block", "breakaway-gap-anticipation", "swing-point-above-fvg"]
