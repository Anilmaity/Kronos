id: phases-of-price
name: Phases of Price Delivery
aliases:
- run or sweep
category: structure
status: contested
definition: 'Asked how to tell a run from a sweep, he rejects the vocabulary outright - he does not
  use those terms and says he does not know what they mean - and substitutes the phases of price at
  the level. The procedure he gives is a three-way test applied once price reaches into a prior high
  or low: an aggressive V-shape reversal is a reversal; a consolidation is either a continuation or
  a coming reversal; a retracement is a continuation. He works it on a 3-minute chart, drops to the
  1-minute to size the pullback, and calls a two-to-three-candle pullback a retracement rather than
  a reversal. He is explicit that he does not judge it from one closure.'
timeframes:
  htf:
  - 1H
  - 15m
  ltf:
  - 3m
  - 1m
  fractal: true
preconditions:
- Price has reached into a prior high or low.
detection_rules:
- Aggressive V-shape reversal off the level -> reversal.
- Consolidation at the level -> either a continuation or a pending reversal; not decidable yet.
- Retracement (two to three candles on the 1-minute) -> continuation.
- Do not classify from a single candle closure - read how price trades through the area.
invalidation:
- Price displaces through and closes over, which flips the read toward a reversal.
measurable:
- distribution of the three phases at swept levels
- continuation rate after a two-to-three-candle 1-minute retracement
sources:
- video_id: tDiwwMRWF2k
  title: New York Open Live Q&A with NickDoesFutures
  quote: I don't use those terms so I don't know what they mean
