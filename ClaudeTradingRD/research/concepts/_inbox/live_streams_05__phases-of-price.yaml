ambiguities:
- 'Contested inside this unit: in the live Q&A he disowns ''run'' and ''sweep'' as terms he uses,
  while in the indicator walkthrough he narrates a setup as the sweep and the closure back in, and
  the indicator carries a ''C1 sweep'' setting. Both readings are recorded.'
- The library concept inducement-equals-sweep records him equating inducement with a liquidity sweep,
  which sits against the disavowal here.
- '''Aggressive'' V-shape is not quantified.'
