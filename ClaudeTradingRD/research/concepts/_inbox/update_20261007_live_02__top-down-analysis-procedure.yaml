id: top-down-analysis-procedure
name: Top-Down Read (daily bias to entry)
category: model
status: contested
voice: ttrades
definition: 'Two statements: (1) he always starts at the daily chart - the daily is the start of all his
  bias even when working a 30-minute chart; (2) the intraday profiling timeframe is interchangeable -
  a bearish day reads the same on 15-minute, 1-hour or 4-hour candles, so use whichever makes sense (he
  names 1H, 4H, 30m, 15m; rarely anything else, never the 8-hour). For a viewer who gets influenced by
  price and forgets the bias, the fix is to look at the higher timeframes before dropping lower.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 30m
  - 15m
  fractal: true
preconditions:
- n/a
detection_rules:
- Start every read on the daily chart.
- Profile the day on any of 4H/1H/30m/15m - the choice does not change the read.
- Never open the lower timeframe before the higher-timeframe read is done.
invalidation:
- n/a
measurable:
- agreement of day-profile classification across 15m/1H/4H
sources:
- video_id: h1ZQWWQDhKA
  title: TTrades MNQ Cup - Afternoon Session
  quote: The daily chart is the start of all of my bias
- video_id: h1ZQWWQDhKA
  title: TTrades MNQ Cup - Afternoon Session
  quote: Stop going down to the lower time frames before you look at the higher
- video_id: h1ZQWWQDhKA
  title: TTrades MNQ Cup - Afternoon Session
  quote: It doesn't matter what time frame you use.
ambiguities:
- The 'same read on any timeframe' claim is asserted, not demonstrated beyond a sketch.
related:
