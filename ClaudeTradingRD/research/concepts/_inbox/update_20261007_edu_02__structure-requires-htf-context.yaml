  title: How to Trade Breakouts (Failure to Manipulate)
  quote: It's not used alone as a model
- video_id: 8yt3jn8L6O4
  title: How to Trade Breakouts (Failure to Manipulate)
  quote: You're not just trying to blindly short or long certain highs or breakouts
