id: structure-requires-htf-context
name: Never Read Lower-Timeframe Structure Without A Higher-Timeframe Bias Frame
category: structure
status: specified
voice: ttrades
definition: >
  The breakouts video closes on this rule: range breakout / failure-to-manipulate structure is
  'just structure confirmation', must be blended with a bias or higher-timeframe reason, and is not a
  model on its own; in his final example the higher-timeframe candle read reverses the meaning of a
  mechanical lower-timeframe CISD.
detection_rules:
- Do not trade a range breakout or range manipulation without a higher-timeframe bias in that direction.
sources:
