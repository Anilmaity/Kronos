  quote: the limit orders and like the level two on yes is usually not that important
- video_id: 8Z2AbZLjunU
  title: ICT + Orderflow - Q&A with HolyAngelBruv
  quote: because people can just pull these orders
ambiguities:
- Stated for ES specifically; he does not say whether it generalises to other instruments.
- '''What''s happening on the market'' is left as executed flow without a measure.'
- The transcript renders 'ES' as 'yes'.
