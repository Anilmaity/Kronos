id: level-two-orders-can-be-pulled
name: Level 2 Is Not Evidence Because The Orders Can Be Pulled
aliases:
- DOM limits are not commitment
- resting liquidity is not intent
category: liquidity
status: specified
definition: 'HolyAngelBruv''s caution about the order book. Level 2 shows resting limit orders, but
  he argues they are usually not that important on ES specifically because participants can simply pull
  them - and it raises the question of whether anyone showing size genuinely wants to give away their
  hand. What matters instead is what actually happens AT market: executed aggression, not displayed
  intent. He notes the displayed liquidity will simply be gone when it matters.'
timeframes:
  htf: []
  ltf:
  - 1m
  - 15s
  fractal: false
preconditions:
- A depth-of-market ladder.
detection_rules:
- Do not treat displayed limit size on level 2 as a level.
- Weight executed activity (tape / footprint) over resting displayed size.
- Expect displayed size at an approaching price to be withdrawn rather than filled.
invalidation: []
measurable:
- fill rate vs pull rate of displayed size as price approaches it
- predictive value of displayed size vs traded delta at the same price
sources:
- video_id: 8Z2AbZLjunU
