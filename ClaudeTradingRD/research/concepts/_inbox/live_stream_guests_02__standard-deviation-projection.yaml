ambiguities:
- Whether the anchor uses wicks or bodies is answered only for the high side ('the absolute High to
  the swing low'); the low side is not stated.
- The transcript renders his phrase as 'Judas wins for Aviation' (= Judas swing for deviation), so the
  exact wording of the anchor definition is corrupt.
- No rule chooses between the 2 and the 2.5 as the first target.
- 'PROVENANCE: the channel owner states in the same video that HE learned standard deviations from AM
  Trades - so a ttrades-voiced version of this concept elsewhere is downstream of this guest.'
