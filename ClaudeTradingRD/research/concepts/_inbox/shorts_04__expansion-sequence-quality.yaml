id: expansion-sequence-quality
name: "Expansion Sequence Quality (expansion met with expansion)"
category: structure
status: specified
definition: >
  Two Shorts use expansion-met-with-expansion as a standing classifier and, importantly, as an
  INVALIDATOR of a continuation idea. After a directional expansion, the only two
  continuation-compatible follow-ups are a consolidation (which then runs the low and trades
  higher, or breaks out) or a retracement. If instead the next structure is a second expansion in
  the opposing direction, the read flips to reversal and the extreme is expected to be taken out.
  The same Short stacks it as one of three concurrent reversal signals alongside the daily candle
  closure and the change in the state of delivery. A related Short shows the two-candle read used
  to classify the follow-up before committing.

timeframes:
  htf: ["1D", "4H"]
  ltf: ["1H", "15m", "5m"]
  fractal: true

detection_rules:
  - "After an expansion leg, classify the next structure as consolidation, retracement, or opposing expansion."
  - "Consolidation or retracement -> continuation remains valid."
  - "Expansion met with expansion -> reversal; anticipate the extreme behind the move to be taken out."
  - "Let two candles print before classifying the follow-up."
  - "Where the daily closure, the change in the state of delivery, and expansion-met-with-expansion all read reversal, treat the reversal as confirmed."

invalidation:
  - "A second opposing expansion appears where a consolidation or retracement was required."

measurable:
  - "frequency of each of the three follow-up classes after an expansion leg"
  - "hit rate of the extreme being taken out after expansion met with expansion"

sources:
  - video_id: Uzl3zYzr90Y
    title: "Using Daily Candle Closures to Align Phases of Price"
    quote: "that expansion met with an expansion which is also saying reversal"
  - video_id: Uzl3zYzr90Y
