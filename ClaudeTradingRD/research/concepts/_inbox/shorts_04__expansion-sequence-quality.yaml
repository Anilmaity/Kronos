    quote: "Do I have a retracement to continue higher? Do I have a consolidation?"
  - video_id: HVPIhbOxnls
    title: "Using Phases of Price for Trading Reversals"
    quote: "We let two candles print here. That is looking like a consolidation or a retracement"

ambiguities:
  - "'Two candles' is the stated observation window in one example only; no general rule is given."
  - "No size test separates a second expansion from a deep retracement."
  - "The three stacked reversal signals are described as agreeing, but no rule is given for when they disagree."

