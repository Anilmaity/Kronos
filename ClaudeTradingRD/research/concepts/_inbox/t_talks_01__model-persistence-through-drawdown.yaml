id: model-persistence-through-drawdown
name: "Do Not Change The Model After A Losing Streak"
aliases: ["submit to time", "allow the probabilities to play out"]
category: psychology
status: specified

definition: >
  A rule against mid-sample revision. Four, five and six trade losing streaks are treated as
  ordinary mechanics of a positive-expectancy model, not as evidence that something must change.
  The stated failure mode is a trader who has a working model, hits a streak, and edits it -
  thereby never accumulating the sample the expectancy is defined over.

timeframes:
  htf: []
  ltf: []
  fractal: false

preconditions:
  - "A model whose rules were fixed in advance and were followed on every trade in the streak."

detection_rules:
  - "On a losing streak, verify only that the rules were followed; do not alter entry, stop, target or timing."
  - "Do not require a high win rate - a 1:2 payoff needs roughly 34 percent to break even."
  - "Judge the model over an extended period, not over a handful of trades."
  - "Keep documentation of every trade so the streak can be evaluated against the record rather than against memory."

invalidation:
  - "Not stated - and this is the concept's main gap: no condition is given under which a model SHOULD be abandoned."

execution:
  bias: "Not applicable."
  entry: "Not applicable."
  stop: "Not applicable."
  targets: []

measurable:
  - "distribution of consecutive-loss run lengths implied by the measured win rate, versus observed"
  - "number of rule changes made per 100 trades (target zero)"
  - "expectancy computed over rolling windows to distinguish variance from decay"

sources:
  - video_id: zXtJSSkiNmo
    title: "Ash Trades | The Journey To Profitability & The Unicorn Model"

ambiguities:
  - "No abandonment criterion is offered, so the rule as stated cannot distinguish variance from genuine edge decay."
  - "The 'undeniable amount of evidence' he required before going live is never given as a trade count."
  - "The referenced win-rate screenshot is not reproduced."

python_detector: null
related: ["one-model-focus", "risk-limits-and-trade-frequency", "mechanical-trade-management"]
