id: news-impact-tiering
name: "High / Medium / Low Impact News Tiering"
aliases: ["red folder tiering", "high impact news events"]
category: time
status: specified

definition: >
  A three-tier reclassification of red-folder USD economic events by the range they are held to
  affect. High impact means the event shapes the WEEKLY range. Medium impact means it shapes the
  DAILY range. Low impact means it supplies intraday energy only. The tier drives which days may
  be traded and whether a position may be held through the release.

timeframes:
  htf: ["1W", "1D"]
  ltf: ["1H"]
  fractal: false

preconditions:
  - "An economic calendar filtered to red-folder events for the traded currency (USD for indices)."

detection_rules:
  - "High impact - exactly three events: CPI; the FOMC press conference (14:30 ET Wednesday, distinct from the 14:00 statement and from FOMC minutes or other Powell appearances); non-farm payroll (usually the first Friday of the month)."
  - "Medium impact - GDP, PCE, PPI; usually released 08:30 ET."
  - "Low impact - everything else, including 10:00 ET events and unemployment claims."
  - "Do not use a single news event to predict the weekly high or low; a release can enter as expansion, as manipulation, or fall flat and consolidate."

invalidation:
  - "Not applicable - this is a classification, not a setup."

execution:
  bias: "None directly. It sets which days are eligible."
  entry: "Governed by pre-event-avoidance-rule."
  stop: "Not applicable."
  targets: []

measurable:
  - "average daily range on days carrying each tier versus the trailing average"
  - "how often the weekly high or low is set on a high-impact-event day"
  - "distribution of expansion versus manipulation versus consolidation outcomes per event type"

sources:
  - video_id: QmGJFxfSHxM
    title: "AM Trades | Blending The Economic Calendar, Daily Chart, & Weekly Profiles"

ambiguities:
  - "The tiering is asserted from experience; no data or study is cited."
  - "Events not named (retail sales, ISM, JOLTS, Fed minutes) fall into low impact by exclusion, which is never stated as a rule."
  - "The tiering is given for USD/indices only; he says the ideas transfer to forex but does not restate the tiers."

python_detector: null
related: ["pre-event-avoidance-rule", "nfp-week-protocol", "fomc-week-protocol", "large-range-day-targeting"]
