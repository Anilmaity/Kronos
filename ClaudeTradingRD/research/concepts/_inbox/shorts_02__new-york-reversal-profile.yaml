ambiguities:
- '"Enough body to trade" is asserted, not quantified - which is the same gap the wick-size question
  has everywhere else in the corpus.'
- No session clock is given for London or New York in either Short.
- '"Relevant higher time frame level" is used as a gate but not defined in these clips.'
- The first Short's transcript ends mid-sentence, so anything after "still enough body to trade" is
  lost.
