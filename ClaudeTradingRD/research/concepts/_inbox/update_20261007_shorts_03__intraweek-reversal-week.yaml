id: intraweek-reversal-week
name: Intraweek Reversal (weekly profile)
category: model
status: contested
voice: ttrades
aliases:
- intraweek reversal
definition: 'Short walk-through: Monday expands away, read as the weekly candle wanting to go higher,
  so a candle 4 continuation is traded and it forms but is small after a large range - then wait for a
  new phase. With a bullish bias a candle 2 closure appears, so the next day is expected to take the previous
  day low or reach a fair value gap. It takes the previous day low and closes above, and an SMT against
  a correlated asset (caption ''RB'') lets that be treated as a candle 2 closure / swing point. Sequence
  named: Monday expansion, Tuesday-Wednesday consolidation, Thursday treated as candle 2 / reversal, Friday
  looked to for continuation.'
timeframes:
  htf:
  - 1W
  - 1D
  ltf: []
  fractal: true
preconditions:
- Monday has expanded away (bullish in the example).
detection_rules:
- Read the Monday expansion as the weekly candle's direction.
- A small candle 4 after a large range ends that phase; wait for a new phase.
- A day that takes the previous day low and closes above it, with SMT, is treated as candle 2 / reversal.
- Trade the following day (Friday after a Thursday reversal) as the continuation.
invalidation:
- Not stated in this Short.
measurable:
- Friday continuation hit rate after a Thursday PDL-sweep-and-close-above with SMT
