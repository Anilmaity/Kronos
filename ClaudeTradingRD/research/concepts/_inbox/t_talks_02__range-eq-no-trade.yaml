id: range-eq-no-trade
name: "Never Trade The EQ Of A Range"
aliases: ["only trade the extremes of a range"]
category: risk
status: specified

definition: >
  Trading at the equilibrium (50%) of a dealing range is named as one of the lowest
  probability locations in price, because the EQ is exactly where discount becomes premium
  and price is in a neutral state. Inside a range, only the extremes are traded: the buy side
  at the bearish array capping the range and the sell side at the bullish array flooring it.

timeframes:
  htf: ["1D", "1H"]
  ltf: ["15m", "5m"]
  fractal: true

preconditions:
  - "A dealing range with a defined high and low exists."

detection_rules:
  - "Compute the 0.5 of the dealing range."
  - "Reject any setup located at or near the EQ."
  - "Accept setups only at the range extremes, at the PD arrays that define them."

invalidation:
  - "Not applicable - this is a location filter."

measurable:
  - "win rate of setups bucketed by their location within the dealing range"

sources:
  - video_id: JABOO4LYNjQ
    title: "Jokerszn | Daily Orderflow - ICT Daily Bias"

ambiguities:
  - "'Near' the EQ is not quantified - no tolerance band is given."

python_detector: null
related: ["consolidation-profile-conditions", "stuck-orderflow", "discount-requirement-before-entry"]
