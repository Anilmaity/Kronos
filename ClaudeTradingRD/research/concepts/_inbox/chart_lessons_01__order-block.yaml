id: order-block
name: "Opposing Candle / Order Block"
aliases: ["opposing candle", "continuation order block", "series of down close candles"]
category: structure
status: specified

definition: >
  The consecutive series of same-direction close candles that produced a swing extreme,
  treated as a tradeable zone once price closes back over (or under) it. In this unit the
  speaker's working term is "opposing candle": at a low, the series of down-close candles
  that made the low; at a high, the series of up-close candles that made the high. The
  series becomes actionable at the moment of the close-through - that same close is the
  change in the state of delivery - and thereafter the zone is used two ways: as the level
  that must be respected on a retest (he marks 0.5 of the opposing candle and wants that
  half respected), and as a "continuation order block" from which a continuation entry is
  taken. A daily opposing candle can be projected forward and combined with the daily
  candle's half level to build the T-spot.

timeframes:
  htf: ["1D", "1H"]
  ltf: ["15m", "5m", "1m"]
  fractal: true

preconditions:
  - "A swing extreme produced by a run of same-direction close candles."

detection_rules:
  - "Bullish: identify the consecutive down-close candles that made the low; the zone becomes valid once price closes back over their high."
  - "Bearish: identify the consecutive up-close candles that made the high; the zone becomes valid once price closes back below their low."
  - "Mark 0.5 of the opposing candle range; require that half to be respected on the retest."
  - "A zone formed in the direction of the prevailing move and used for re-entry is a continuation order block."

  - "0.5 of the opposing candle doubles as a management level, not only a retest filter: price is not expected to trade back above it, so the stop can be moved there."
  - "A single retracement into a higher-timeframe level can produce two stacked sets of opposing candles, each protecting its own extreme."
invalidation:
  - "Price closes back through the opposing candle in the original direction."
  - "The protected swing created at the extreme beneath the zone is taken out."

execution:
  bias: "Direction of the close-through."
  entry: "On the retest of the zone, or on the open into the zone (positional case)."
  stop: "Below the protected low beneath the zone; in one scalp, tight below the bodies."
  targets: ["the failure swings / equal highs above", "the higher-timeframe draw"]

measurable:
  - "retest rate of opposing candles after the close-through"
  - "proportion of retests that hold above 0.5 of the zone"
  - "R achieved from continuation order block entries vs entries at the close-through itself"

sources:
