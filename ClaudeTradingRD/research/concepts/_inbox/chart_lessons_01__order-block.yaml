    title: "TTrades Top-Down Chart Lessons #1"
    quote: "creates two sets of opposing candles"
ambiguities:
  - "Sourced from an ASR (whisper-small) transcript, not YouTube captions; wording may be imprecise."
  - "In video Nlw-PZhoViQ two separate levels are pointed at on screen - one that would form the opposing candle and one that would form the change in the state of delivery - which implies they are not always the same level, but the distinction is only visual and is not stated."
  - "The speaker uses opposing candle, order block and continuation order block in the same walkthroughs without distinguishing them; they are recorded here as one concept because they are constructed identically in these transcripts, but that identity is an inference."
  - "The zone boundaries are not stated - whether it spans the bodies or the wicks of the series is never said."
  - "No maximum number of candles in the series is given."
  - "Whether a fair value gap inside the zone is required, or merely common, is not stated."

python_detector: null
related: ["cisd", "protected-swing", "t-spot", "continuation-order-block", "opposing-run-entry"]
