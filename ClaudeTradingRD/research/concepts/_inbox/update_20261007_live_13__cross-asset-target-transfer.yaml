id: cross-asset-target-transfer
name: "Take Profit On One Asset When The Correlated Asset Hits Its Target"
category: structure
status: contested
voice: ttrades
definition: >
  Index version stated as a general rule: the strongest asset's reaction level is the target
  for the weakest. In the example YM (stronger, already expanded, consolidating) is watched for
  its previous day low; the moment YM hits its previous day low is the exit on the NQ short,
  because NQ (weakest) is expected to expand to catch up. NQ retraced from there.
timeframes:
  htf: ["1D"]
  ltf: ["15m"]
  fractal: false
detection_rules:
  - "Rank the indices; mark the previous day low (short case) on the strongest asset."
  - "Short the weakest asset; exit when the strongest asset tags its previous day low."
measurable:
  - "give-back on NQ after YM tags its previous day low vs holding"
sources:
  - video_id: wa9m30UHrm0
    title: "New York Open Live Q&A"
    quote: "you can use the strongest one to consider a target on the not strongest one"
  - video_id: wa9m30UHrm0
    title: "New York Open Live Q&A"
    quote: "YM hit previous day low. This would be my target on NQ."
ambiguities:
  - "Strongest/weakest here is judged by expansion beyond the previous day low; the labels then flip within the same session (see relative-strength-weakness)."
related: ["relative-strength-weakness", "intraday-reversal"]
