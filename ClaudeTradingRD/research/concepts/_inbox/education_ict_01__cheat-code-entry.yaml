id: cheat-code-entry
name: Cheat Code Entry (anticipating the mitigation block)
aliases:
- cheat code
- sell the open of this next candle
category: entry
status: specified
definition: 'A named anticipatory entry - he credits the name to his friend Austin - that skips the confirmation
  step of the mitigation block. Instead of waiting for the opposing candle''s extreme to be broken and
  then retested, he enters at the OPEN OF THE VERY NEXT CANDLE once the opposing candle closes: in a bearish
  trend, when a green candle closes he sells the next candle''s open with a stop one point above that
  green candle''s high; bullish mirrors. His stated reasoning is that if he already expects the candle
  to become a mitigation block, there is no reason to wait for the break.'
timeframes:
  htf:
  - 15m
  - 5m
  ltf:
  - 1m
  fractal: true
preconditions:
- An aggressive trend toward an objective is in progress.
- The trader has already formed the expectation that the current opposing candle will become a mitigation
  block.
detection_rules:
- 'Bearish: wait for an up-close (green) candle to CLOSE inside the down leg.'
- Enter short at the open of the immediately following candle.
- Stop one point above the high of that green candle.
- 'Bullish mirrors: a down-close candle closes; buy the next candle''s open, stop one point below its
  low.'
- Target the same objective the trend is reaching for.
invalidation:
- Price trades one point beyond the signal candle's extreme.
execution:
  bias: With the prevailing trend.
  entry: Open of the candle after the opposing candle closes.
  stop: One point beyond the opposing candle's extreme.
  targets:
  - The lower/higher objective the trend is reaching for
measurable:
- hit rate and R of the cheat-code entry vs the confirmed mitigation-block retest on the same candles
- how often the one-point stop is taken out before the objective
- frequency of qualifying opposing candles per trending session
sources:
- video_id: NgFIza9qsGQ
  title: Finding Entries Into Trend - ICT Concepts
  quote: what my friend Austin named as a cheat code entry
- video_id: NgFIza9qsGQ
  title: Finding Entries Into Trend - ICT Concepts
  quote: when this candle closes right here, I will just enter long
- video_id: NgFIza9qsGQ
  title: Finding Entries Into Trend - ICT Concepts
  quote: I will sell the open of this next candle
- video_id: NgFIza9qsGQ
  title: Finding Entries Into Trend - ICT Concepts
  quote: with a stop one point above this high
ambiguities:
- The 'one point' stop is stated for index futures; no instrument-independent rule is given.
- No filter says WHICH opposing candle qualifies - in a trend there are many, and he shows only the ones
  that worked.
- It relies on the trader already judging the trend 'aggressive'; that judgement is unquantified.
