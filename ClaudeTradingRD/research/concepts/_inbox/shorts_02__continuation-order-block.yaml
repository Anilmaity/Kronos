id: continuation-order-block
name: Continuation Order Block (Continuation Entry)
category: entry
status: specified
definition: 'The Short gives the one-line definition the long-form videos leave implicit: a continuation
  order block is an order block that is NOT formed at the reversal but within a continuation. After
  a trend change is signalled (a sweep of the low plus a change in the state of delivery / bullish order
  block), taking the entry right there is trading a reversal; the alternative he prefers is to wait,
  let price expand away and leave a fair value gap, let price reach back into that gap and close over
  the down-close candle that went into it, which forms a protected low, and enter on that newly formed
  order block with the stop on the new low and a 2R target.'
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 15m
  - 5m
  fractal: true
preconditions:
- 'A trend change has already been signalled: price took out the low and had a change in the state of
  delivery / formed an opposing order block.'
detection_rules:
- Do not enter at the reversal order block itself - that is trading a reversal.
- Wait for price to expand away from the reversal and create a fair value gap.
- Require price to reach back into that fair value gap.
- Require a close over the down-close candle that traded into the gap (bullish case).
- That closure forms a protected low; the closed-over candle(s) are the continuation order block.
- Enter on the continuation order block, stop on the invalidation (the new low), target 2R.
invalidation:
- Price trades through the new low - the protected swing the entry was built on.
measurable:
- hit rate of the 2R target on continuation order blocks
- expectancy of the continuation entry versus the reversal entry on the same signal
sources:
- video_id: VyOsUgZjmzY
  title: How I Trade Continuation Order Blocks Within Trend
  quote: A continuation order block is an order block that is not formed at the reversal
- video_id: VyOsUgZjmzY
  title: How I Trade Continuation Order Blocks Within Trend
  quote: I can wait for a continuation entry
- video_id: VyOsUgZjmzY
  title: How I Trade Continuation Order Blocks Within Trend
  quote: I look to target 2 R with my stop on the invalidation
ambiguities:
- The Short is taught on a schematic with no timeframe or instrument named, so the timeframes listed
  here are carried from the rest of the corpus, not from this clip.
- It says the reversal entry "is" available ("I can, but that is trading a reversal") without saying
  when he would take it - the preference is asserted, not conditioned.
- No requirement is stated that the fair value gap be on the same timeframe as the order block.
execution:
  bias: The direction of the newly signalled trend.
  entry: The newly formed order block after the close through it.
  stop: The invalidation / new low (protected swing).
  targets:
  - 2R
