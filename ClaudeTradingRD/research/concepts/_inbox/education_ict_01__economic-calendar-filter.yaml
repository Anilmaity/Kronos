ambiguities:
- EARLIER RECORDINGS. The no-news-day skip is demonstrated once in a trade review, not stated as a standing
  rule; the later corpus treats the calendar as an avoidance filter rather than a participation requirement.
  Both readings kept - this one is notably more aggressive.
- No timezone is attached to 8:30 in any of these videos.
- '''Red folder'' is ForexFactory''s own colour coding; no impact tiering beyond red is given.'
