id: economic-calendar-filter
name: Economic Calendar Filter
aliases:
- red folder news day
- the news embargo lifts
category: time
status: contested
definition: 'EARLIER RECORDINGS. Two uses, one soft and one hard. Soft: as part of the morning routine,
  open ForexFactory, find the high-impact release, and mark that time (8:30) on the chart so the manipulation
  leg can be anticipated. Hard, and stronger than anything the later corpus states: in the CPI trade review
  he walks the week''s calendar and declines Monday, Tuesday and Wednesday because they carry no news
  at all, waiting for Thursday - the week''s first RED FOLDER day - and placing his interest specifically
  POST 8:30. The 8:30 boundary is also referred to as the point at which ''the news embargo lifts'', a
  phrase used to separate pre-release from post-release price action.'
timeframes:
  htf:
  - 1D
  ltf:
  - 1H
  - 15m
  - 5m
  fractal: false
preconditions:
- Access to an economic calendar with impact colour-coding.
detection_rules:
- Before the session, read the calendar and locate the high-impact (red folder) releases.
- Mark the release time (8:30 in every example) on the chart.
- Days with no red-folder news are of lower interest; in the CPI example three consecutive no-news days
  are skipped.
- Interest begins AFTER 8:30 on a red-folder day; the release itself is expected to produce the manipulation
  leg.
- Pre-8:30 price action is treated as a separate regime ('before the news embargo lifts').
invalidation:
- Not applicable - a calendar entry either exists for the day or it does not.
measurable:
- win rate and range size on red-folder days vs no-news days
- share of days where the 8:30 release forms the session's manipulation extreme
