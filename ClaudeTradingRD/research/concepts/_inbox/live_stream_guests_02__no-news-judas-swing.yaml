id: no-news-judas-swing
name: The 9:30 Judas Swing Works Better When There Is No News
aliases:
- no news Judas swing
- volatility injection at 9:30
category: time
status: specified
definition: Rauf's own study result, offered twice and explicitly recommended to the audience as something
  to test themselves. On index futures the 09:30 open is a volatility injection. On a day with NO high-impact
  news, 09:30 is the ONLY volatility injection of the day, and he found that the Judas swing (the opening
  move against the intended direction, creating the opposite end of the range) forms more reliably at
  09:30 on exactly those days. The practical inversion is that a day with no red-folder news is not
  a day to sit out - it is the day the 09:30 opening manipulation is cleanest, and it is why he is willing
  to trade NASDAQ on a Monday on the 1-minute and 5-minute charts even though most people avoid Mondays.
timeframes:
  htf:
  - 1D
  ltf:
  - 5m
  - 1m
  fractal: false
preconditions:
- An index futures instrument (his example is NASDAQ).
- No high-impact news scheduled for that day.
detection_rules:
- Check the day's economic calendar; require no high-impact release for that day.
- At 09:30 EST, expect a volatility injection.
- Expect the first move off 09:30 to be a Judas swing - price creating the opposite end of the range
  to the intended direction.
- Fade that opening move in the direction of the prevailing draw.
- Execute on the 1-minute or 5-minute chart.
- On days that DO carry a high-impact release, the 09:30 Judas swing is less reliable because 09:30
  is no longer the only volatility injection.
invalidation:
- The 09:30 move continues in the intended direction rather than reversing - it was expansion, not a
  Judas swing.
execution:
  bias: Opposite the 09:30 opening move.
  entry: 1-minute / 5-minute after the opening swing.
  stop: Not stated.
  targets:
  - the opposite end of the range the Judas swing created
measurable:
- reversal rate of the first 09:30 impulse on no-news days vs news days
- range of the 09:30-to-close leg split by news presence
- P&L of a mechanical 09:30 fade conditioned on the calendar
sources:
