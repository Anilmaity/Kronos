ambiguities:
- '''Judas swing'' is auto-captioned as ''Judah swing'', ''judo swing'', ''due to swing'' and ''you
  to swing'' throughout; the concept is unmistakable but no wording here is verbatim-reliable.'
- No duration is given for how long after 09:30 the swing may form, and no size threshold separates
  a Judas swing from an expansion.
- The finding is his own personal study; no sample size, instrument set or period is given.
- '''High impact news'' is not tiered here as it is by other guests in this unit.'
