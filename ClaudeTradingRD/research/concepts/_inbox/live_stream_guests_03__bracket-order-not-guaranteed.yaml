id: bracket-order-not-guaranteed
name: Automate The Exit, But A Stop Order Is Not A Guaranteed Fill
aliases:
- set it and forget it
- bracket order
category: risk
status: specified
definition: 'Bracket orders - entry, stop and target set together - are endorsed because they remove
  the in-trade decision and take the emotion out of when to get in and out. The guest''s qualification
  is that automation does not transfer responsibility, and he supports it with a first-hand failure:
  holding size in deep-in-the-money Amazon call contracts with a stop order set, he returned to find
  price well beyond the stop level and the order never triggered; the broker apologised and offered
  free trades, and he absorbed a loss larger than the one he had planned. His conclusion is operational
  rather than moral - if the position cannot be watched, either reduce its size or close it.'
timeframes:
  htf: []
  ltf: []
  fractal: false
preconditions:
- A position with a pre-defined stop and target.
detection_rules:
- Set entry, stop and target as a single bracket before the trade begins.
- Continue to monitor the position; do not walk away from it.
- If the position cannot be monitored, reduce size or exit entirely.
invalidation:
- Not applicable - operational rule.
measurable:
- incidence of stop orders not filling at or near the stop level, by instrument and liquidity
- realised slippage beyond the stop price across the sample
sources:
- video_id: kG8BuEPVppo
  title: Psychology & Best Practices with STRATalorian
  quote: a stop loss in place doesn't mean that it's guaranteed to be filled
ambiguities:
- The mechanism of the non-trigger is described loosely ('never triggered and became a market order');
  no instrument or liquidity threshold is given for when this is likely.
- No alternative order type (stop-limit, guaranteed stop, hedge) is proposed.
