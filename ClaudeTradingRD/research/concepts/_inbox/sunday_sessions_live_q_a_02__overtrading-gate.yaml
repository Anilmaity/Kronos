id: overtrading-gate
name: "Higher-Timeframe Reason As Overtrading Gate"
aliases: ["step one get a bias", "how to stop overtrading"]
category: psychology
status: specified

definition: >
  Step one of the model, stated as the cure for overtrading: no entry without a
  higher-timeframe bias or reason. He estimates that in a typical overtrader's journal only
  about 2 in 10 trades would have one. The corollary stated repeatedly across all four
  streams is that on most days only one instrument and one idea are legible, and the correct
  response to an illegible chart is to take nothing and leave the desk.

timeframes:
  htf: ["1D", "4H"]
  ltf: []
  fractal: false

preconditions:
  - "A trade is being considered."

detection_rules:
  - "Before entry, state the higher-timeframe reason (bias, objective, framework)."
  - "If no reason can be stated, do not enter."
  - "Audit: in the journal, tag each trade with its higher-timeframe reason; untagged trades are overtrades."
  - "Per day, expect at most one A+ idea across the watchlist; take it or take nothing."

invalidation:
  - "n/a"

execution:
  bias: "n/a"
  entry: "Gated."
  stop: "n/a"
  targets: "n/a"

measurable:
  - "Proportion of journalled trades carrying a stated HTF reason."
  - "Expectancy split by reason-present vs reason-absent."

sources:
  - video_id: 00iZXPAdR5A
    title: "New York Open Live Q&A"
  - video_id: aqnY1yZvfYs
    title: "New York Open Live Q&A"
  - video_id: Qv6Ux_Z8VrA
    title: "New York Open Live Q&A"
  - video_id: yud7TpE2AMs
    title: "New York Open Live Q&A"

ambiguities:
  - "'Higher-timeframe reason' is not formalised into a checklist in these streams; he refers to a flowchart that exists only in his paid course."
  - "The 20% figure is an estimate offered rhetorically, not a measurement."

python_detector: null
related: ["bias-confirmation-tradeoff", "trading-window", "consolidation-avoidance"]
