id: cross-asset-reversal-confirmation
name: "The Strongest Asset Must Reverse for the Weakest to Expand"
aliases: ["wait for the strongest to reverse"]
category: structure
status: specified

definition: >
  The sequencing rule that pairs with the strength ranking: a move down in the weak asset is
  only trusted once the strong asset has itself reversed. He states it as a pre-open plan in one
  stream — if NQ (the strongest) forms a reversal at its objective, the trade is then in ES or
  YM, the weaker ones — and as a critique of a viewer's short in another: the entry was
  acceptable but he would still want to see the strongest asset show a reversal first. The
  practical consequence is that the strongest asset's reaction at its target is the trigger to
  look at the weaker asset, not the strongest asset itself.

timeframes:
  htf: ["1H", "15m"]
  ltf: ["5m", "3m", "1m"]
  fractal: false

preconditions:
  - "Correlated assets ranked strongest / middle / weakest."
  - "The strongest asset is at or approaching its own objective."

detection_rules:
  - "Watch the strongest asset into its objective."
  - "If the strongest asset forms a reversal there, switch attention to a weaker asset for the short."
  - "If the strongest asset shows no reversal at the objective, do not take the counter-trend trade in the weaker asset."
  - "Prefer the weaker asset with the cleaner range when more than one qualifies."

invalidation:
  - "The strongest asset continues through its objective without reversing — the premise for the weak-asset trade is gone."

measurable:
  - "outcome of weak-asset shorts with versus without a prior strong-asset reversal"
  - "lag in bars between the strong-asset reversal and the weak-asset move"

sources:
  - video_id: m8xcjkOuBHU
    title: "New York Open Live Q&A"
    quote: "if the strongest asset forms a reversal, you want to look to the weaker ones"
  - video_id: Je7cd9HJUBE
    title: "New York Open Live Q&A"
    quote: "see the strongest asset reverse than the weakest one to actually go expand"

ambiguities:
  - "'Forms a reversal' is not given a bar-level test here; in practice he reads it from the lower-timeframe structure and an SMT."
  - "No maximum lag is stated between the strong-asset reversal and the weak-asset entry."
  - "Which of two qualifying weak assets to take is decided by 'cleaner range', which is not defined."

python_detector: null
related: ["relative-strength-asset-selection", "smt-divergence", "relative-strength-weakness", "cross-asset-target-transfer"]

