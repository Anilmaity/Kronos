- video_id: FgP2lc9nneM
  title: The Best Timeframe for TTrades Fractal Model (Simple)
ambiguities:
- No numeric boundary between 'small' and 'large' is given in any of the five videos in this unit that
  use the rule.
- The rule is applied to the wick against the intended direction; whether the opposite wick also matters
  is not addressed.
