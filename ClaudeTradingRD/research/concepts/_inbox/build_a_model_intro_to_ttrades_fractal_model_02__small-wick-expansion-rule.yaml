  quote: focus on trading candle 3 when we have a candle 2 expansion
- video_id: FAKWJ-1NlLE
  title: Trading The 4 Hour Power Of Three - OHLC / OLHC
  quote: it can be the manipulation as well as the distribution
- video_id: eywpZT3z6GQ
