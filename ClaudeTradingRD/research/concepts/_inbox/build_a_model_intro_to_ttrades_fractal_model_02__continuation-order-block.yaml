ambiguities:
- He states a preference for the first continuation over later ones ('I feel like I'm chasing') without
  a rule for how many are acceptable.
- Whether a fair value gap must be fully tagged or merely touched is left as 'that's fine if it digs
  a little bit deeper'.
- Volume imbalances are mentioned once as an additional acceptable important level, with no definition.
