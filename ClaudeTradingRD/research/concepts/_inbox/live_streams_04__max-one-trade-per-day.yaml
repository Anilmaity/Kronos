id: max-one-trade-per-day
name: "One Trade Per Day Cap"
aliases: ["one trade a day max", "the plan"]
category: risk
status: specified

definition: >
  He prescribes the same four-line plan to two different struggling viewers in two different
  streams, and calls it by name in his mentorship. The diagnosis is fixed: the root causes are
  tilt, oversizing, revenge trading, over-managing and not following the model. The
  prescription is mechanical rather than motivational - limit to one trade a day, take 2R or
  -1R with no management in between, size properly, follow the model. His argument is
  structural: you cannot revenge trade if you are only allowed one trade. He cites a
  mentorship student twenty days into following it as evidence. His own frequency is
  consistent with the cap - one to two ideas a day, a couple of trades a week at most, and not
  a trade every day.

timeframes:
  htf: []
  ltf: []
  fractal: false

preconditions:
  - "A trader with a repeating behavioural failure (tilt, revenge trading, oversizing, over-managing)."

detection_rules:
  - "Hard cap of one trade per day, regardless of what else appears."
  - "Fixed outcomes: exit at 2R or -1R; do not manage the position in between."
  - "Size to the drawdown, not to the profit target."
  - "Follow the model's rules without discretion."
  - "Run it for a month before judging it."

invalidation:
  - "Not applicable - a behavioural constraint."

measurable:
  - "trades per day distribution before and after the cap"
  - "expectancy of the first trade of the day vs subsequent trades"
  - "drawdown depth with and without the cap"

sources:
  - video_id: eIPM-D8RrSQ
    title: "New York Open Live Q&A"
    quote: "One trade a day max, no matter what."
  - video_id: N3Ml-r0X30o
    title: "New York Open Live Q&A"
    quote: "I really only have one to two ideas each day"
  - video_id: x4sRGuZIqWk
    title: "New York Open Live Q&A"
    quote: "I only take a couple trades a week max"

ambiguities:
  - "The cap is prescribed as a remediation for a diagnosed behavioural problem, not stated as a rule of the model itself."
  - "Whether the one trade is per instrument or per day across all instruments is not stated."
  - "'Size properly' is left undefined in this unit beyond being derived from the drawdown."

python_detector: null
related: ["overtrading-gate", "root-cause-diagnosis", "realistic-r-expectations", "mechanical-trade-management", "prop-firm-drawdown-sizing"]

