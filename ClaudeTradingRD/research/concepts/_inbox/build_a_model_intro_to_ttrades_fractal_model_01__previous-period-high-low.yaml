ambiguities:
- '''Already taken out'' has no lookback bound - how far back to keep marking extremes is not stated.'
- No rule chooses between this previous-candle-extreme target set and the standard-deviation projections,
  which are also called targets and generally sit elsewhere.
- '''Too much daily range'' is judged by eye - no ADR figure is used in this unit.'
