id: previous-period-high-low
name: Previous Day / Week / Month High & Low
category: liquidity
status: specified
aliases:
- previous candle extremes
- formation liquidity
- targets
definition: 'The targeting rule of the fractal model, and it is deliberately simple: whatever timeframe
  you are entering on, take the targets from the HIGHER timeframe you are referencing, and they are
  that higher timeframe''s previous candles'' highs (bullish) or lows (bearish). Candle 1''s extreme
  is the first target, then progressively older unswept extremes. Extremes that have ALREADY been
  taken out are not marked. Equal highs/lows are singled out as good targets. Because the model is
  fractal, a lower-timeframe entry can carry a runner to the higher-timeframe version of the same
  target - this is the stated route to high R. The indicator''s ''formation liquidity'' line is this
  rule automated: the previous candle''s extreme in the bias direction that has not yet been taken.'
timeframes:
  htf:
  - 1M
  - 1W
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  fractal: true
preconditions:
- A valid swing point / model on the reference timeframe.
detection_rules:
- Identify the candle you are trading away from (candle 2).
- Look LEFT on the reference higher timeframe and mark the previous candles' highs (bullish) or lows
  (bearish), starting with candle 1's.
- Skip any extreme that has already been taken out.
- Prefer equal highs / equal lows.
- Escalate one timeframe up for the runner target (e.g. daily entry -> weekly swing extreme).
- 'SMT rule: a target counts as satisfied when the correlated asset takes it out.'
- 'Feasibility check: do not expect all targets in one day - ''that''s too much daily range''.'
invalidation: []
execution:
  bias: n/a - targeting rule.
  entry: n/a
  stop: n/a
  targets:
  - candle 1's extreme
  - older unswept previous-candle extremes
  - equal highs / equal lows
  - the higher-timeframe version of the same target for runners
measurable:
- hit rate of the first previous-candle extreme vs the second and third
- R achieved by taking partial at the short-term target and holding a runner (worked examples reached
  1:11 and 1:16)
