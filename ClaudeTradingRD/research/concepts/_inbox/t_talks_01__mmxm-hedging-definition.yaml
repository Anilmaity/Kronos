id: mmxm-hedging-definition
name: "MMXM As A Mitigation Of Orders (hedging program)"
aliases: ["market maker model", "market maker buy model", "market maker sell model"]
category: model
status: specified

definition: >
  A definitional claim about what a market maker model IS, offered as the thing traders skip.
  MMXM models are a mitigation of orders - a hedging program. Market makers are not always on the
  profitable side; they facilitate flow for large institutions, so across the whole buy-side of the
  curve they are in drawdown, selling short to fill the longs that funds and retail want. The
  visible sequence - consolidation, breakout, re-accumulation, smart money reversal, return to
  clear the original consolidation - is that facilitation cycle expressed in price.

timeframes:
  htf: ["1W", "1D"]
  ltf: ["1H", "5m", "1m"]
  fractal: true

preconditions:
  - "An identifiable original consolidation with buy-side liquidity above and sell-side liquidity below."

detection_rules:
  - "Mark the original consolidation. Price breaks out of it."
  - "Mark subsequent areas of accumulation on the same side of the curve - these are where orders are being facilitated and the maker is in drawdown."
  - "The midpoint of the whole structure is the smart money reversal, where more orders in the opposite direction are accumulated."
  - "After the reversal, expect price to work back and clear the original consolidation."
  - "Split the structure into a buy-side of the curve and a sell-side of the curve; the treatment of fair value gaps differs by side."
  - "Build the model on daily and weekly timeframes - the claim is that large institutions cannot size positions on 1-minute or 5-minute charts, even though the pattern is fractal and does appear there."

invalidation:
  - "Price returns to 50 percent of the dealing range after the reversal (stated as the model-level invalidation elsewhere in the same video)."

execution:
  bias: "Toward the original consolidation after the smart money reversal."
  entry: "At bearish breakers formed where breakout buyers were facilitated, or at mitigation blocks and old gaps on the correct side of the curve."
  stop: "Beyond the local structure of the entry (stated only for the mitigation-block case)."
  targets: ["the original consolidation"]

measurable:
  - "frequency of the full sequence completing (return to and clearing of the original consolidation)"
  - "time from smart money reversal to the original consolidation being cleared"
  - "whether the pattern's completion rate differs between daily/weekly and 1m/5m scales, testing the HTF-only claim"

sources:
  - video_id: wB-fQiT_UDo
    title: "DayTradingRauf | ICT MMXM Models"

ambiguities:
  - "The hedging/facilitation narrative is presented as mechanism, not evidence; no order-flow or COT data is shown (he explicitly sets fundamentals aside)."
  - "All illustration is schematic - no dated instrument charts appear in the video, so none of it is verifiable from the source."
  - "The HTF-only instruction sits uneasily with the admission that the model occurs on 1m and 5m; no rule resolves which scale to trade."
  - "'Original consolidation' is not given a size or duration test."

python_detector: null
related: ["smart-money-reversal-breaker-confirmation", "old-accumulation-new-distribution", "dealing-range-fib-grading", "mitigation-block"]
