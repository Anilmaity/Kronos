id: intraday-reversal
name: Intraday Reversal (4-hour closure plus hourly CISD)
category: model
status: underspecified
voice: ttrades
definition: 'Ordering stated for the Asia reversal case: the hourly change in the state of delivery comes first,
  then he waits for the 4-hour candle closure to confirm candle 2; entry only on a 15-minute continuation that formed
  before the open of the next 4-hour candle. For a reversal day SMT is added as confirmation because the trade is
  riskier. The 4-hour closure paired with an hourly CISD is called ''ideal''.'
detection_rules:
- Hourly CISD (plus SMT on a reversal day) -> then 4H candle closure -> then 15m continuation before the next 4H
  open -> enter.
sources:
