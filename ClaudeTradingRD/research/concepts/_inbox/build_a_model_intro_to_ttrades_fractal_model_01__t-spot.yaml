id: t-spot
name: The T-Spot (overlap of two half levels)
category: entry
status: underspecified
aliases:
- T spot
- the gray box
- the green box
definition: 'The indicator-drawn box inside a higher-timeframe candle marking the area where that
  candle''s wick is expected to form - i.e. where a bearish day should make its high or a bullish
  day its low. Functionally it is the zone that must hold: price closing over the T-spot on a bearish
  setup is treated as the early warning that the continuation will fail. In one worked example the
  T-spot ''is just the equilibrium'', tying it to the candle EQ; a point of interest inside the T-spot
  is what the IC-CISD is sought at.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  fractal: true
preconditions:
- A valid model has printed (closure + CISD).
detection_rules:
- The T-spot is drawn by the indicator inside the higher-timeframe candle, on the side the wick is
  expected.
- Seek the point of interest for the entry INSIDE the T-spot; a point of interest beyond it is explicitly
  not wanted.
- Price must not close over (bearish) / under (bullish) the T-spot area.
- T-spots from two timeframes can be overlapped by running two copies of the indicator; the overlap
  is treated as confluence.
invalidation:
- A close beyond the T-spot area against the setup.
measurable:
- share of higher-timeframe wick extremes that actually land inside the T-spot
- forward outcome after a close beyond the T-spot
sources:
