ambiguities:
- The derivation of the T-spot is never given in the free material - it is only ever described by
  its function. One example equates it with the equilibrium, another implies it is a band rather
  than a line.
- Whether the box is bounded by the candle EQ and something else (a half level of the wick?) is not
  stated in this unit.
