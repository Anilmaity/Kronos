ambiguities:
- "Trader T gives no minimum sample size; the protocol is about fidelity, not about statistical sufficiency."
- "He notes the simulator's index data is gappy at the open and close, which is why he prefers forex and gold in it - so the sample is instrument-biased for reasons of data quality."
- "He also cannot display DXY alongside a pair in that software, so SMT-conditioned rules cannot be tested inside his own sample."
- "Ben's drill has no scoring step - nothing records whether the prediction at a level was right."

