id: optimal-trade-entry
name: Optimal Trade Entry (OTE)
category: entry
status: specified
definition: 'Corroborating earliest statement. After a structure break, anchor a fib across the displacement
  range (low to high for a bullish leg) and expect the retracement into the 0.62 to 0.79 band, with
  the 0.5 marking the premium/discount boundary. He states two extra uses not always carried in the
  later material: the same fib levels are used as TARGETS when he is positioned in the opposite direction,
  and OTEs NEST - once price is inside one OTE and forms a new leg, the new leg''s OTE sits inside
  the old one (''an optimal trade entry inside of an optimal trade entry''). Confluence with a fair
  value gap or other point of interest inside the band is stated as helpful, not required.'
timeframes:
  htf:
  - 1H
  - 15m
  ltf:
  - 5m
  - 1m
  - 15s
  fractal: true
preconditions:
- A displacement leg with a defined start and end exists.
detection_rules:
- Anchor the fib from the start of the displacement range to its end.
- 0.5 = the premium/discount boundary; the OTE band is 0.62 to 0.79.
- Prefer a fair value gap, order block or other point of interest sitting inside the band.
- 'Nesting: after entering the band, a new displacement leg inside it defines a new, tighter OTE.'
- 'Inverse use: when positioned against the leg, the same 0.62-0.79 band is a profit target.'
measurable:
- fill rate of 0.62 vs 0.79
- R improvement from the nested OTE over the first OTE
