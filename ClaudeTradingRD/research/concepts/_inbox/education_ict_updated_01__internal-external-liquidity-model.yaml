id: internal-external-liquidity-model
name: Internal & External Liquidity Model
aliases:
- the internal/external model
category: model
status: specified
definition: 'A complete three-timeframe execution model built on the internal/external rotation. Step
  1: a higher-timeframe level. Step 2: drop one timeframe and identify internal or external liquidity
  there — the rotation gives the draw. Step 3: on the lower timeframe require, in order, that you are
  in a kill zone, a stop raid, a market structure shift, and a fair value gap — then target 2R. He names
  his preferred ladder as daily / hourly / 5-minute because it aligns with the formation of the daily
  candle, and demonstrates the same model shifted up (monthly / daily / hourly and weekly / 4-hour /
  15-minute) for people who cannot watch intraday.'
timeframes:
  htf:
  - 1M
  - 1W
  - 1D
  ltf:
  - 4H
  - 1H
  - 15m
  - 5m
  fractal: true
preconditions:
- A higher-timeframe level (fair value gap, previous period high/low) is identified.
detection_rules:
- 1. Mark the higher-timeframe level.
- 2. One timeframe down, establish the internal/external rotation and therefore the draw.
- '3. On the execution timeframe require: in a kill zone; a stop raid; a market structure shift; a fair
  value gap.'
- 4. Enter at the fair value gap (start of the gap, or its consequent encroachment, or a premium/discount
  of the displacement range).
- 5. Stop over the opposing candles; if that area is messy, step UP a timeframe to place the stop above
  a clean inversion or balanced area.
- '6. Fixed target: 2R. Runners are optional and he does not count them as the model.'
invalidation:
- Expansion met with expansion — if the aggressive displacement is met with displacement back the other
  way, he expects continuation instead.
- Trading a retracement against the higher-timeframe bias — he waits for the retracement to complete
  and trades the expansion out of it.
execution:
  bias: The higher-timeframe draw.
  entry: Fair value gap after the stop raid and market structure shift, inside a kill zone.
  stop: Over the opposing candles / the fair value gap candle's extreme, widened to a clean level a
    timeframe up if the area is messy.
  targets:
  - 2R fixed
measurable:
- hit rate of the fixed 2R target under the four lower-timeframe conditions
- difference between the tight (FVG-candle) and conservative (timeframe-up) stop
