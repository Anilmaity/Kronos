id: breaker-block
name: Breaker As A Four-Point Price Pattern (AM Trades' definition)
aliases:
- bearish breaker
- bullish breaker
category: entry
status: specified
definition: 'AM Trades gives a purely pattern-based definition on the 15-minute chart. The sequence
  is: price makes a high, a higher low, a higher high, then a lower low; then price retraces back
  into the breaker. The breaker itself is the down-close candle that sat immediately before the run
  on buy side, and it becomes a breaker only once price has broken below it. Down-close candles produce
  bearish breakers and the mirror holds for bullish breakers off up-close candles. He is explicit
  that it is ''really just a pattern in price'', and points to a simplified entry-model post on his
  own page rather than adding conditions on air.'
timeframes:
  htf:
  - 1H
  ltf:
  - 15m
  - 5m
  fractal: true
preconditions:
- A completed high / higher low / higher high / lower low sequence on the working timeframe.
detection_rules:
- 'Sequence required: high -> higher low -> higher high -> lower low.'
- 'The breaker is the down-close candle immediately preceding the leg that ran the buy side (mirror:
  the up-close candle before the leg that ran the sell side).'
- It is only a breaker once price has broken below it (above it, for a bullish breaker).
- Entry is the retracement back into that candle.
invalidation:
- Price closes back above the breaker candle in the bearish case (below, in the bullish case).
execution:
  bias: Opposite the swept side.
  entry: The retracement into the breaker candle.
  stop: Not stated in this video.
  targets:
  - Not stated in this video.
measurable:
- reaction rate at the breaker candle on the retracement, by timeframe
- difference in outcome between a single-candle breaker and a series
sources:
- video_id: CrUfTskOveo
  title: Stream Q & A with AM Trades  - ICT concepts
  quote: a down closed candle prior to a run on buy side
- video_id: CrUfTskOveo
  title: Stream Q & A with AM Trades  - ICT concepts
  quote: once we break below the down closed candle becomes a breaker
ambiguities:
- No displacement requirement is attached to the break below the candle.
- No rule is given for which candle to use when several down-close candles precede the run - single
  candle versus series is not addressed.
- Neither stop placement nor targets are given here; he defers to a post on his own page.
