ambiguities:
- Only the 5-minute/15-minute pair is given; the rule for other pairings is implied by fractality,
  not stated.
- '''Short-term low'' is not defined by a candle count in this video.'
- Displacement remains unquantified; see `displacement` for the two procedures the corpus offers.
