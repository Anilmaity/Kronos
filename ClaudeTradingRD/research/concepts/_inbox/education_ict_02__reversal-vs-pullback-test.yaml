id: reversal-vs-pullback-test
name: Reversal Or Pullback? (the structure-break test)
category: structure
status: specified
definition: 'A single decidable test with a stated timeframe hierarchy. Mark the short-term lows in
  an uptrend (short-term highs in a downtrend) and watch whether they are broken WITH DISPLACEMENT.
  If structure is not broken, what you are looking at is a pullback, full stop. If it is broken with
  displacement, it is a reversal on that timeframe. The hierarchy is the second half of the lesson:
  he reads trend on the 5-minute but the 15-minute governs, and he recommends the 15-minute to most
  people because it is less noisy and more reliable. A 5-minute reversal underneath an intact 15-minute
  uptrend is therefore traded as a counter-trend move TO the 15-minute imbalance, where longs are
  reloaded - and re-entry in the original direction requires a 5-minute or 1-minute structure shift
  at that point of interest.'
timeframes:
  htf:
  - 15m
  ltf:
  - 5m
  - 1m
  fractal: true
detection_rules:
- Mark the short-term lows (uptrend) or highs (downtrend) as they form.
- Not broken -> pullback. Broken WITH displacement -> reversal on that timeframe.
- A break with no displacement and no fair value gap does not count; keep the prior read.
- 'Check the timeframe above: if its structure is untouched, the lower-timeframe reversal is a retracement
  within the higher-timeframe trend.'
- In that case, target the higher-timeframe imbalance and reload in the original direction there.
- Re-entry at that point of interest requires a 5-minute or 1-minute market structure shift; he prefers
  to wait for more retracement and take the 1-minute version.
- 'Recommended default analysis timeframe: 15-minute.'
measurable:
- proportion of 5m structure breaks that resolve as pullbacks under an intact 15m trend
- R of the reload entry at the HTF imbalance
