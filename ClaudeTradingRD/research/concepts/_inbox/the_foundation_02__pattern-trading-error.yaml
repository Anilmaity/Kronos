id: pattern-trading-error
name: Pattern Trading (the error he corrects)
aliases:
- trade it like a pattern
category: psychology
status: contested
definition: 'The top-down video opens with the error worked as a chart, not as an argument. A textbook
  bullish order block forms - price takes out a low and closes through the series (or single) candle
  that made it - and the retest is taken with the stop on the low. The stop is run. He says he sees
  many people doing this and wondering why it happens, and gives the diagnosis: the higher-timeframe
  analysis was not considered. On the higher timeframe a high had just been swept and a bearish engulfing
  candle had closed below the low, so the next candle was expected to continue lower. The correction
  is stated as a counterfactual - if he were not trading it like a pattern, he would look only for
  bearish setups inside that bearish expansion candle, which puts him in the mirror-image bearish
  order block at the same place.'
timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 15m
  - 5m
  fractal: true
preconditions:
- A valid-looking lower-timeframe pattern exists.
detection_rules:
- Before taking any lower-timeframe pattern, read the higher-timeframe candle it sits inside.
- Inside a higher-timeframe bearish expansion candle, only bearish setups are permitted; the bullish
  pattern at the same location is refused even though it is structurally valid.
- 'The named symptom of the error: the stop is placed on the low that the pattern says should hold,
  and price runs straight through it.'
- The correction is directional filtering, not a different entry pattern - the same order-block mechanics
  are then applied to the opposing side.
invalidation:
- Not applicable - this is a discipline.
measurable:
- stop-out rate of patterns taken with vs against the containing higher-timeframe candle's direction
sources:
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: if I wasn't to trade it like a pattern
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: I see many people doing this and wondering why it happens
ambiguities:
- '''Bearish expansion candle'' as the containing context is asserted from a bearish engulfing closure
  below a low; no threshold separates it from an ordinary down candle.'
- The rule is demonstrated on one PDF diagram; how far the directional veto extends in time (the
  whole higher-timeframe candle? until the next closure?) is not stated.
python_detector: null
