- video_id: EYzP7c24AwM
  title: Important Time Levels For Trading
  quote: we don't really have the 930 open with Forex
ambiguities:
- '''Eastern Standard time'' is said literally; whether he means EST year-round or the New York local
  clock (EST/EDT) is not addressed anywhere in this unit.'
