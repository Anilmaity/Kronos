id: est-timezone-anchor
name: Session Clock Is Eastern Standard Time
aliases:
- EST
- New York time
category: time
status: specified
definition: 'All time levels he marks are stated in Eastern Standard Time. He also states that the time
  OPENINGS themselves differ by asset class: on forex the 4-hour candles change and there is effectively
  no 09:30 open.'
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  fractal: false
detection_rules:
- Set the chart timezone to Eastern Standard Time before marking any time level.
- Re-derive the 4-hour boundaries when switching asset class; do not carry the index grid onto forex.
- Drop the 09:30 level entirely on forex.
measurable:
- misalignment of the 4-hour grid when a non-EST chart timezone is used
sources:
