id: poi-timeframe-selection
name: Your Entry Timeframe Selects Which Timeframes Carry Your Points Of Interest
category: time
status: specified
definition: 'The opening statement of the earlier top-down lesson, and a decidable mapping the later
  canon does not restate. Which timeframes you draw points of interest from is a function of the timeframe
  you intend to ENTER on. Entering on the 5-minute, 1-minute or sub-1-minute charts, he does not look
  for monthly or weekly points of interest at all; his points of interest live on the Daily, 4-Hour,
  1-Hour and sometimes the 15-minute. If he were instead entering on the 4-Hour, he would look out
  to the weekly and above. The relationship is monotonic: raise the entry timeframe and the point-of-interest
  timeframes rise with it.'
timeframes:
  htf:
  - 1M
  - 1W
  - 1D
  - 4H
  - 1H
  - 15m
  ltf:
  - 5m
  - 1m
  - 15s
  fractal: true
detection_rules:
- Fix the entry timeframe before doing any analysis.
- Entry on 5m / 1m / sub-1m -> points of interest from 1D, 4H, 1H and sometimes 15m. Do NOT use monthly
  or weekly levels.
- Entry on 4H -> points of interest from the weekly and above.
- Raising the entry timeframe raises the point-of-interest set proportionally.
measurable:
- hit rate of entries taken from an out-of-band point of interest (e.g. a weekly level with a 1-minute
  entry)
sources:
- video_id: wDXTIDbIMwU
  title: Top Down Analysis - ICT Concepts
  quote: this is dependent on which time frame you're entering on
- video_id: wDXTIDbIMwU
  title: Top Down Analysis - ICT Concepts
  quote: most of my points of interest lie on The Daily 4 Hour one hour
ambiguities:
- Only two rungs of the mapping are given (5m-and-below, and 4H); the intermediate cases are not stated.
- '''Sometimes the 15-minute'' is not conditioned on anything.'
- The mapping is about which levels to MARK, not which to trade from, and he does not say what to
  do when a weekly level is obviously in the way of a 1-minute trade.
