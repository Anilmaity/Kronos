ambiguities:
- The entry model is deliberately open ('an entry model lower'); which of breaker / OB / FVG to prefer
  is decided live by what looks aggressive enough. Several sessions were skipped purely on that judgement,
  so the model as taught is NOT fully mechanical.
- '''Sweep'' is not defined against equal highs — he explicitly declined one touch as ''just equal highs''.'
- Whether the 3R break-even rule is part of the model or a backtest-only convention is not stated; he
  says 'what I did in back testing was...'.
- The framework is imported from his intraday-bias video (previous candle's high and low); it is not
  derived here.
