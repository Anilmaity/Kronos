id: dont-trade-after-expansion
name: Trade the Expansion, Not After It
category: entry
status: contested
voice: ttrades
definition: 'Restated with a reversal-day entry rule: ideal reversal entries are early into the candle,
  generally before the ADR has been created and near the open. A viewer short on EURUSD in New York with
  clean structure failed because it was taken after the daily range had already been made. Stop trading
  once price has hit your target and moved.'
detection_rules:
- For a daily reversal, enter early in the candle and near the open, before the average daily range has
  been produced.
- Reject entries taken after the day has already produced its range, even if LTF structure is clean.
- Stop trading for the day once price has hit the target and moved.
sources:
