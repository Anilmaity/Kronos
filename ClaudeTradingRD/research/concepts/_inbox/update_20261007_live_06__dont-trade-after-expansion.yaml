  quote: Early into candle generally before ADR created near the open.
- video_id: uW55Tuk-ngY
  title: New York Open Live Q&A
  quote: I trade expansions. I don't trade after the expansions.
- video_id: uW55Tuk-ngY
  title: New York Open Live Q&A
  quote: Stop trading after price already hit your target and has moved.
- video_id: uW55Tuk-ngY
  title: New York Open Live Q&A
  quote: I want to short before the expansion, not after.
ambiguities:
