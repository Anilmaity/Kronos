id: order-block
name: Order Blocks As Support For A Fair Value Gap Entry, Not As The Trade
aliases:
- order block subordinate to the FVG
category: structure
status: specified
definition: HolyAngelBruv demotes the order block. His primary points of interest are liquidity (equal
  highs, equal lows, old highs, old lows) and fair value gaps; he says he would rather take a fair value
  gap trade that is SUPPORTED by an order block than take the order block itself, and that he only uses
  order blocks to narrow his fair value gap entries. His argument against trading them directly is that
  without a narrative they are unreliable - shorting a random order block will probably not work, whereas
  order blocks on the correct side of the market-maker curve are more likely to. For drawing them he
  uses the open, or the open and the wick, but normally just the open, and he says openly that he has
  held back from publishing a video on them because the choice of which candle to use is still subjective
  to him and changes with the timeframe.
timeframes:
  htf:
  - 1H
  - 30m
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- A directional narrative (curve side) and a fair value gap as the primary point of interest.
detection_rules:
- Select the trade on liquidity plus a fair value gap, not on an order block.
- Use an order block only to refine the entry price inside that fair value gap.
- Draw the order block from the open, or the open plus the wick; default to the open.
- In a downtrend, the up-close candles (bearish order blocks) are what should resist price.
- Do not take an order block that is not on the correct side of the market maker curve.
invalidation:
- No narrative supports the order block's direction.
measurable:
- win rate of FVG entries with vs without an aligned order block
- difference in entry fill and adverse excursion between open-only and open-plus-wick drawing
sources:
- video_id: 8Z2AbZLjunU
