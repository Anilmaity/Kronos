  quote: i use the open and then the wick but normally just the open
ambiguities:
- Which candle qualifies as the order block is explicitly unresolved by the speaker himself and changes
  with the chart timeframe - he demonstrates the same structure resolving to different candles on the
  5-minute and the 30-minute.
- '''Supported by'' is not defined - overlapping, adjacent, or containing?'
- No rule states when the order block refinement should be abandoned in favour of the raw gap.
