id: swing-forming-candle-selection
name: Ignore Candles That Do Not Form A Swing
aliases:
- that doesn't form a swing, generally I ignore it
category: structure
status: underspecified
definition: A selection rule for which candle a continuation is anchored on, and therefore for where
  the CISD level sits. Where a retracement produces a candle that does not itself form a swing, he
  skips it and uses the neighbouring candle that does form one as the continuation reference. It is
  stated as a habit rather than an absolute, but it materially changes the level a closure must clear.
timeframes:
  htf:
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- A retracement has printed and a continuation reference must be chosen.
detection_rules:
- When choosing the opposing candle(s) a continuation must close through, skip a candle that does
  not form a swing.
- Use the adjacent candle that does form a swing as the continuation reference instead.
invalidation:
- Not applicable - this is a selection rule.
measurable:
- difference in CISD trigger price and outcome between the skipped and the used candle
sources:
- video_id: PQiRV0JMhIQ
  title: Why Your Continuations Fail (Order Blocks + CISD Explained)
  quote: when we have this candle that doesn't form a swing, generally I ignore it
ambiguities:
- '''Doesn''t form a swing'' is not defined in this video; the three-bar swing definition from the
  companion relevant-swings video is the only candidate test and he does not state that it is the
  one meant.'
- '''Generally I ignore it'' makes it a tendency; no exception conditions are given.'
- Because the reference candle determines where the CISD level sits, the choice materially moves the
  trigger, but no tie-break is given when several nearby candles qualify.
