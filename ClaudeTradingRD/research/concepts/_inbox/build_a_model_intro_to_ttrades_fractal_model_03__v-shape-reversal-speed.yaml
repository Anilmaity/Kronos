id: v-shape-reversal-speed
name: A Real Reversal Is a Fast V-Shape
aliases:
- nice aggressive V-shaped reversal
- swift price action
- quick recovery
category: structure
status: specified
definition: 'The ideal continuation is a nice aggressive V-shaped reversal: price reaches the point
  of interest and recovers swiftly back through the series of opposing candles. This video supplies
  the corpus''s only candle-count threshold for ''swift''. He says the closure should take only a
  couple of candles - he prefers one, two, maybe three - and that longer than that usually means it
  is taking too long. The rejected example is symmetric: two candles down met with six candles up
  that could not even regain the level. The accepted example is also symmetric: two candles up, two
  candles back down. Failing the speed test reclassifies the structure from retracement to consolidation.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- Price has reached a point of interest (a fair value gap, a swept swing, an order block).
- The series of opposing candles that must be closed through has been identified.
detection_rules:
- Count the candles from the reach into the level to the close through the opposing series.
- 'Preferred: 1 to 3 candles. He states he prefers 1, 2, maybe three.'
- Longer than three candles is 'taking too long'; reclassify the structure as a consolidation and
  drop the continuation.
- 'Compare the candle count of the recovery with the candle count of the move in: a six-candle recovery
  from a two-candle move is explicitly rejected as not V-shaped.'
- A closure that arrives only after a failed attempt plus consolidation is a sweep of the consolidation
  high, not a valid recovery.
- The same speed test is applied inside the reversal itself, not only to the entry - he rejects a
  reversal that spends a lot of time forming.
invalidation:
- The recovery grinds and fails to regain the level; price is in a range and the low/high becomes
  a target rather than a support.
measurable:
- win rate of continuations bucketed by recovery candle count (1-3 vs 4+)
- ratio of recovery candle count to approach candle count, split by outcome
