ambiguities:
- The 1-3 candle count is stated as a preference ('I prefer', 'a lot of times') rather than a hard
  rule, and one accepted example is described as 'taking a few candles to close over'.
- The timeframe on which the candles are counted is whatever chart is on screen; no anchor timeframe
  is fixed.
- Whether the count starts at the tag of the level or at the extreme is not specified.
- It is not stated whether the count is of candles to the close-through candle inclusive or exclusive.
