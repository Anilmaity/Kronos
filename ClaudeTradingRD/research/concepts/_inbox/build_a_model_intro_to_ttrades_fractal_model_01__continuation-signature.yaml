id: continuation-signature
name: Continuation Signatures (Consolidation And Retracement)
category: structure
status: specified
aliases:
- large range to small range back to large range
definition: 'PRIMARY-SOURCE READING (this unit): after an expansion, exactly two shapes mean continuation
  rather than reversal - a consolidation, or a retracement. Either one is the ''small range'' between
  two ''large ranges''. Their trade instructions differ: a consolidation requires a manipulation
  of one side of the range first (bullish: the low is run out); a retracement requires a slow shallow
  move into a PD array and a protected swing to form. The third possibility - expansion met with
  expansion - is the reversal signature instead. This gives a three-way decision procedure that is
  run after every expansion leg and re-run on every new candle close.'
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  - 5m
  fractal: true
preconditions:
- An expansion leg has just completed and an objective is still open.
detection_rules:
- 'After an expansion, classify the next price action as one of three: consolidation, retracement,
  or expansion-met-with-expansion.'
- 'Consolidation -> continuation: wait for the manipulation of the side opposite the intended direction,
  then trade away from it.'
- 'Retracement -> continuation: wait for the slow shallow move into a fair value gap, then the closure
  through the opposing candles.'
- Expansion met with expansion -> reversal, not continuation.
- If the current candle does not decide, let another candle close before acting.
- A breakout signature (closing over the previous high) also continues, without requiring the sweep
  of the range low.
invalidation:
- Price displaces aggressively back into the range instead of consolidating or retracing.
measurable:
- empirical continuation rate given each of the three post-expansion labels
- how often the ambiguous case resolves on the very next close
sources:
- video_id: VD4xb9VfMHA
  title: How To Trade Reversal - Phases Of Price
  quote: This is the opposite of a continuation signature
- video_id: 4Gm8p6O7Ebs
  title: How To Trade Expansion - Phases Of Price
  quote: large range, small range, large range, small range
- video_id: F0G31iLVpVg
  title: How To Trade Retracement - Phases Of Price
  quote: expansion, retracement, expansion, retracement, expansion
- video_id: WFqLwOp2pXw
  title: How To Trade Consolidation - Phases Of Price
  quote: this would be a breakout signature as we are now closing over these highs
ambiguities:
- The three-way classifier is only as decidable as its inputs; consolidation is the only one of the
  three with a crisp test (price internal to a high and a low).
- The breakout branch - continuation without a sweep - is mentioned in the consolidation and expansion
  videos but no condition is given for when a breakout is trusted over a sweep.
