id: decoupling-realignment
name: Decoupled Correlated Indices Must Come Back Into Alignment
category: structure
status: contested
voice: ttrades
definition: 'Asked why he says NQ and ES ''have to come back in line'', he rejects the framing: it is
  not that one must return to the other, it is that correlated markets cannot all go different directions,
  so one is ''lying'' and must reverse, which releases the other to continue. Worked example (morning
  session): NQ higher, YM lower, ES in between; YM formed a small reversal, which let NQ finish its highs;
  then NQ reversed off the highs, which allowed YM to continue trending lower.'
timeframes:
  htf:
  - 15m
  ltf: []
  fractal: false
preconditions:
- NQ, ES, YM moving in different directions intraday.
detection_rules:
- Identify the triad divergence (one up, one down).
- 'Two resolutions only: the weak one reverses and the strong one continues, or the strong one reverses
  and the weak one continues.'
- A reversal in one asset is read as permission for the other's continuation, in sequence.
invalidation:
- n/a
measurable:
- after a triad divergence, frequency that a reversal in one is followed by continuation in the other
sources:
- video_id: h1ZQWWQDhKA
  title: TTrades MNQ Cup - Afternoon Session
  quote: So it's not about one has to come back into alignment with the other
- video_id: h1ZQWWQDhKA
  title: TTrades MNQ Cup - Afternoon Session
  quote: Which one is lying? Because they can't all go different directions
ambiguities:
- His own words here contradict the library entry's name/quote ('something has to come back into alignment'
  from xraklBJHW5k); he frames it as correlation not alignment - status set contested on that wording.
- In the example both resolutions happened in sequence, so the rule does not pick in advance which asset
  reverses.
related:
- cross-asset-reversal-confirmation
- relative-strength-weakness
contributing_units:
- update_20261007_live_02
