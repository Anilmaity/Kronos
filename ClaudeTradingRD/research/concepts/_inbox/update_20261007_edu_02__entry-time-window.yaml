id: entry-time-window
name: Entry Time Window (and rejection of kill zones)
category: time
status: contested
voice: ttrades
definition: >
  In the London model video he again rejects kill zones: entry time (19:00, 22:00, 01:00, 02:00 are
  named) does not matter; all that matters is that the higher-timeframe candles have formed their wicks.
  The London model is also usable in Asia and New York.
detection_rules:
- Gate entries on higher-timeframe wick formation, not on a kill-zone clock window.
