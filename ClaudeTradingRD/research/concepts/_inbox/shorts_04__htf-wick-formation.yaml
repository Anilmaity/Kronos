id: htf-wick-formation
name: "Higher-Timeframe Wick Built From Two Aggressive Legs"
category: structure
status: specified
definition: >
  A 22-second Short states the causal claim in one sentence: a higher-timeframe reversal candle
  with a large wick IS expansion met with expansion on the lower timeframe. Dropping into the
  lower timeframes inside that wick shows expansion up met with expansion down, which is what
  forms the reversal, and the continuation is then traded after it. A second Short adds the
  forward-looking version - when a low is already expected to hold before the higher-timeframe
  candle opens, the anticipated wick is a very shallow one.

timeframes:
  htf: ["1D", "4H"]
  ltf: ["1H", "15m", "5m"]
  fractal: true

detection_rules:
  - "For a higher-timeframe candle carrying a large wick, drop to the lower timeframe covering that wick."
  - "Expect one directional expansion leg met by an opposing expansion leg; that pair is the wick."
  - "Read the pair as a reversal, and trade the continuation that follows it, not the wick itself."

invalidation:
  - "The lower-timeframe structure inside the wick is consolidation rather than two expansion legs."

measurable:
  - "share of large HTF wicks whose LTF structure is two expansion legs"
  - "outcome of continuations traded after an expansion-met-with-expansion wick"

sources:
  - video_id: yku6idnLqSo
    title: "When Expansion Meets Expansion, You Get the HTF Wick"
    quote: "when we have expansion met with expansion forming a higher time frame wick"
  - video_id: yku6idnLqSo
    title: "When Expansion Meets Expansion, You Get the HTF Wick"
    quote: "We have expansion up met with expansion down forming a reversal."
  - video_id: VtFC9SCnlYM
    title: "Using Inversion as an Entry Within the Fractal Model"
    quote: "expecting this to make a very shallow wick to then trade higher"

ambiguities:
  - "Which lower timeframe to drop to is not stated."
  - "'Expansion' inside the wick is asserted visually; the Short gives no leg-size test."

python_detector: null
related: ["expansion-sequence-quality", "half-wick-respect", "small-wick-expansion-rule", "v-shape-reversal-speed"]

voice: ttrades
contributing_units: [shorts_04]
draft_count: 1
