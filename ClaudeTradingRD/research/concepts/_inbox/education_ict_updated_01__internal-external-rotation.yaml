id: internal-external-rotation
name: Internal <-> External Range Liquidity Rotation
aliases:
- internal liquidity
- external liquidity
- external to internal
category: model
status: specified
definition: 'Internal liquidity is a fair value gap; external liquidity is simply highs and lows (swing
  highs/lows, i.e. buyside and sellside liquidity). The rotation: when price sweeps external liquidity
  and CANNOT displace through it, it is likely to reach back for internal liquidity; once it respects
  that fair value gap and closes away, the expectation is a move back to external liquidity. Price moves
  from external to internal and back to external.'
timeframes:
  htf:
  - 1W
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  - 5m
  fractal: true
detection_rules:
- 'Mark external liquidity: swing highs (high with a lower high each side) and swing lows.'
- 'Mark internal liquidity: unmitigated fair value gaps inside the range.'
- 'External -> internal: price sweeps a swing extreme and fails to displace through it; the nearest
  unmitigated FVG becomes the draw.'
- 'Internal -> external: price reaches the FVG, respects it and closes away; the opposing swing extreme
  becomes the draw.'
- A mitigated fair value gap is no longer counted as the internal draw.
invalidation:
- Displacement through the external extreme — no rotation back inside.
measurable:
- completion rate of each rotation leg by timeframe
