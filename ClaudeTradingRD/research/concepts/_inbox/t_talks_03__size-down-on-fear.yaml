id: size-down-on-fear
name: "Size Down When A Single Loss Would Tilt You"
aliases: ["risk off", "downsizing after a run", "fear as a sizing signal"]
category: risk
status: specified

definition: >
  Fear is treated as a usable sizing input rather than as a weakness to suppress. The
  guest argues that a trader who is not afraid of losing money will lose a lot of it,
  and describes acting on that fear directly: after a large winning run he found
  himself risking an amount per trade that would tilt him if it lost, and therefore
  reduced position size regardless of the fact that the model was still performing. He
  couples this with an intuition that a losing streak was due after a long profitable
  run - and reports that a six-trade losing streak arrived roughly two weeks later at
  the reduced size. The purpose is capital preservation so that size can be restored
  deliberately when conditions justify it, rather than being forced down by damage.
  Rising volatility is given as a second, independent reason to reduce size.

timeframes:
  htf: []
  ltf: []
  fractal: false

preconditions:
  - "A position size large enough that a single loss has emotional weight."

detection_rules:
  - "If a single loss at the current size would tilt you, reduce size."
  - "If realised volatility has risen materially, reduce size (he cites an index future moving 50 points in 5 minutes and a 400-point two-hour range)."
  - "Reduce after an extended winning run rather than after the losses arrive."
  - "Restore size deliberately when conditions and confidence support it."

invalidation:
  - "Not applicable - this is a sizing rule."

execution:
  bias: "n/a"
  entry: "n/a"
  stop: "n/a"
  targets: []

measurable:
  - "realised drawdown of a losing streak at reduced size vs the size held before it"
  - "correlation between realised volatility and per-trade risk actually taken"
  - "size trajectory around the largest winning runs in a track record"

sources:
  - video_id: 1wKfc2gN4xg
    title: "Trader Kane | The Mind Behind a Multi-Million Dollar Day Trader"

ambiguities:
  - "Would tilt you is subjective and has no external test; it cannot be evaluated from a chart or a ledger alone."
  - "The volatility trigger is illustrated with instance figures, not a threshold (no ATR multiple or percentile is given)."
  - "The claim that a losing streak was due after a winning run is a gambler's-fallacy-shaped statement; it is recorded as said, not endorsed, and the transcript offers no evidence for streak predictability."
  - "The interaction between this rule and the 1%-2% scaling matrix is not specified - it is unclear whether sizing down here means dropping the base or dropping the ladder entirely."

python_detector: null
related: ["dynamic-risk-scaling-matrix", "house-money-capital-structure", "probabilistic-acceptance"]
