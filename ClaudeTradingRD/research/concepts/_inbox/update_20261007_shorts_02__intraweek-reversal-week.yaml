id: intraweek-reversal-week
name: Intraweek Reversal (weekly profile)
category: model
status: contested
voice: ttrades
definition: >
  SHORTS EVIDENCE. The prior Friday leaves failure swings on the lows, so he lets Monday open rather
  than act. Monday expands away, which shows price wants to expand out of the area or form a reversal.
  Tuesday prints a SMALL candle 2 closure opposing Monday; that is read only as a retracement signal -
  expect a pullback or the previous day low to be taken - not as a reversal of the week. The next day
  (Wednesday) prints a candle 2 closure with an hourly change in the state of delivery and a new
  continuation; the low it formed must not be taken. Price continues higher; he looks for the following
  day to continue too, but warns it may consolidate - and in the example it moves up but comes back into
  the range.
detection_rules:
  - "Failure swings on the prior Friday's lows: do not pre-empt; let Monday open."
  - "A small candle 2 closure opposing the Monday expansion -> expect only a retracement / previous-day-low run, not a weekly reversal."
  - "After that retracement day, require a daily candle 2 closure plus an hourly change in the state of delivery and a new continuation before trading in the Monday direction."
  - "The low formed by that continuation must hold."
  - "The day after the first continuation is lower-quality: may consolidate back into the range."
invalidation:
  - "Price takes out the low the continuation was built from."
sources:
  - video_id: UoEA2aJqz9Q
    title: "Intraweek Reversal → Expansion Higher"
    quote: "So, we kind of want to let Monday open up."
  - video_id: UoEA2aJqz9Q
    title: "Intraweek Reversal → Expansion Higher"
    quote: "some sort of retracement or for the previous day low to get taken out"
  - video_id: UoEA2aJqz9Q
    title: "Intraweek Reversal → Expansion Higher"
    quote: "I do want to be careful as it could form some bit of a consolidation"
ambiguities:
  - "'Small' candle 2 closure is not quantified; the distinction between a retracement-only C2 and a reversal C2 rests on size alone."
  - "The caption '...previous day low to get taken out, which is a new fair value gap' is garbled; what the fair value gap refers to cannot be recovered."
  - "'how really change in the state of delivery' is a caption error, read here as 'hourly'."
  - "Unlike the library's canonical shape (Monday and Tuesday both expand, Wednesday reverses), here Tuesday is the opposing day and Wednesday is the continuation; it is closer to a retracement-continuation than to an intraweek reversal of direction."
related: ["reversal-candle-target-adjustment", "failure-swing", "midweek-reversal-week"]
