id: cisd-skip-at-target
name: "Skip the CISD Entry When the CISD Level Sits at the Target"
aliases: ["change in state of delivery at the target", "no room to enter"]
category: entry
status: specified

definition: >
  An edge case stated live: when the change-in-state-of-delivery level (the continuation level)
  coincides with the short-term target of the trade, waiting for that closure means entering at
  the target with no remaining reward. In that situation he does not use the CISD and instead
  relies on other evidence such as a V-shape reversal, a retracement into a gap, and SMT.

timeframes:
  htf: ["1H", "30m"]
  ltf: ["15m", "5m", "3m", "1m"]
  fractal: true

preconditions:
  - "A CISD entry is being considered."
  - "A short-term target has been defined."

detection_rules:
  - "Compare the CISD closure level to the distance remaining to the short-term target."
  - "If the CISD level is at or beyond the target, do not use the CISD entry."
  - "Substitute other confirmation: V-shape reversal, retracement into a fair value gap, SMT."

invalidation:
  - "Not applicable; this is an entry-selection rule."

execution:
  bias: "Unchanged."
  entry: "Non-CISD evidence when the CISD sits at the target."
  stop: "Beyond the reversal extreme."
  targets: ["The already-defined short-term target"]

measurable:
  - "share of signals where the CISD level leaves less than 1R to the target"

sources:
  - video_id: egV_gABTQks
    title: "(CPI) New York Open Live Q&A"
  - video_id: uzPGXVYpVGc
    title: "Candle 2 Confirmations - Live Lesson, Q&A"

ambiguities:
  - "No minimum reward-to-target distance is specified for when the CISD does remain usable."

python_detector: null
related: ["upper-half-positioning", "continuation-order-block", "c2-confirmation-scaling"]
