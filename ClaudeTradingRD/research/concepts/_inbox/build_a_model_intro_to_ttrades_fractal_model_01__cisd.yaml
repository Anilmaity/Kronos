id: cisd
name: Change In State Of Delivery (CISD)
category: entry
status: specified
aliases:
- change in the state of delivery
- CISD
- shift in trend
definition: 'PRIMARY-SOURCE DEFINITION, stated more explicitly here than anywhere else in the corpus:
  a change in the state of delivery is a shift in trend, found by (1) locating the level that HIT
  A POINT OF INTEREST - price interacting with a fair value gap, a high, or a low - and (2) requiring
  price to CLOSE OVER THE SERIES OF CANDLES INTO that point of interest. Bullish: price takes out
  a low, then closes over the series of down-close candles that took out that low. Bearish: price
  reaches into a high, then closes through the series of up-close candles that made it. The point
  of interest is part of the definition, not an extra filter - which is what distinguishes this reading
  from a bare ''close through the opposing candles'' rule.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 30m
  - 15m
  - 5m
  - 3m
  - 1m
  fractal: true
preconditions:
- Price has interacted with a point of interest (fair value gap, high, or low).
detection_rules:
- Locate the extreme that engaged the point of interest.
- Identify the series of opposing candles that produced that extreme (may be one candle).
- Mark the level of that series.
- Require a CLOSE through that level. Before that close there is no CISD.
- Bullish uses down-close candles into a swept low / fair value gap; bearish uses up-close candles
  into a swept high / fair value gap.
- 'Two applications: REVERSAL CISD confirms a swing point; INTRACANDLE CISD (see ic-cisd) confirms
  that a continuation candle''s wick has formed.'
- An inversion fair value gap may be used in place of the CISD to confirm a continuation.
invalidation:
- Price fails to close through the level and instead ranges - the sweep is untrusted.
execution:
  bias: Direction of the closure.
  entry: On the close, or on the retest of the level.
  stop: On the extreme, or on the bodies where the wick gives poor R.
  targets:
  - 2R
  - previous candle extremes
measurable:
- agreement rate between a POI-gated CISD detector and a bare opposing-candle-close detector
- hit rate of trades taken on the close vs on the retest
