ambiguities:
- '''Closes over the series'' - whether the level is the OPEN of the first opposing candle, the highest
  of their opens, or their extremes is never stated. This is the source of the library''s three mutually
  inconsistent CISD readings and it is NOT resolved here.'
- 'The choice of WHICH series to use is discretionary in practice: one example explicitly picks a
  different candle ''because that is the swing high that created this swing low''.'
- Whether a wick through the level counts or a body close is required is not stated.
