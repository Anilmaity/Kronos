id: htf-narrative-floor-fifteen-minute
name: The 15-Minute Is The Floor For Narrative; Hourly-To-Daily Is The Sweet Spot
aliases:
- narrative timeframe
category: time
status: specified
definition: 'AM Trades states a hard floor on where narrative may be built: the 15-minute is the absolute
  lowest timeframe on which a higher-timeframe narrative can be formed, and the hourly to daily is
  ''your sweet spot for sure, even for day trades''. Below that the timeframes are for execution only.
  The host gives the compatible workflow in the same exchange, answering a viewer restricted to a
  phone by a nine-to-five job: sit on the 15-minute chart, which does not need constant checking,
  and only open a lower timeframe once a point of interest has been tagged. AM''s addition is that
  being on the 15-minute is not a restriction imposed by the phone - it is the lowest legitimate narrative
  timeframe for anyone.'
timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: false
preconditions:
- An instrument being analysed for direction rather than for entry.
detection_rules:
- Build narrative on the hourly to daily; 15-minute is the lowest timeframe on which narrative may
  be built.
- Do not read narrative below 15 minutes - use lower timeframes for execution only.
- 'Workflow for a part-time trader: monitor the 15-minute, and open a lower timeframe only once a
  point of interest has been reached.'
invalidation:
- Not applicable - a timeframe-selection rule.
measurable:
- expectancy of setups whose narrative was formed on the 15-minute vs on the hourly/daily
- share of losing trades whose narrative was formed below 15 minutes
