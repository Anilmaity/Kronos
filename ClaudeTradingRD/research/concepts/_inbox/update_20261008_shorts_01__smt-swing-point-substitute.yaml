  quote: what are we looking to target? The previous highs.
ambiguities:
- No new content - a verbatim clip of A4NasIa371c, whose target variant is already in the library.
- The timeframe of the gold/silver comparison is not stated in the Short.
- How close silver's swept low must be to gold's unreached low is not stated (library ambiguity unchanged).
