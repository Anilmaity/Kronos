id: smt-swing-point-substitute
name: SMT As A Swing Point Substitute
category: structure
status: contested
voice: ttrades
definition: >
  Shorts restatement of the TARGET variant, cut word for word from A4NasIa371c (How to Set Price
  Targets Using the Fractal Model), which the library already cites. Price is expected to reach a
  low as its target. The one case in which price does not need to reach it is when there is an SMT,
  i.e. a correlated asset takes that low out. On gold the correlated asset shown is silver; silver
  took the low, so the target is treated as hit. The move higher is then "backed with SMT" and the
  next targets are the previous highs, marked and carried down to the lower timeframe (his indicator
  marks them automatically).
detection_rules:
- A target low exists on the traded instrument and price has not reached it.
- If a correlated instrument takes out its equivalent low, treat the target as hit (an SMT).
- After that, take the opposite side - the previous highs - as the next targets and drop to the lower timeframe.
sources:
