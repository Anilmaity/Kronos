  title: Using SMT With Correlated Assets to Target Previous Highs
  quote: When there's SMT or a correlated asset takes out this low.
- video_id: 4UVVK6Gavrs
  title: Using SMT With Correlated Assets to Target Previous Highs
  quote: that allows us to say that the target has been hit
- video_id: 4UVVK6Gavrs
