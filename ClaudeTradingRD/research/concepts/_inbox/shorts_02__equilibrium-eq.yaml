id: equilibrium-eq
name: Equilibrium / 50% Level (EQ, T spot)
category: entry
status: specified
definition: 'Two Shorts work the EQ as a BIAS INVALIDATOR rather than as an entry level, which is the
  sharpest statement of that branch in the corpus. Bullish setup after a V-shape reversal with a daily
  candle 2 closure: the next candle should open low and form a continuation higher; instead price does
  not respect the EQ and forms no bullish continuation out of the area. He states the consequence directly:
  disrespecting the EQ while never forming a bullish continuation sets up a BEARISH framework - bearish
  opposing candles, a close below the EQ, and therefore a likely reach for the previous day low and
  ultimately the candle 2 low. Notably the previous day HIGH was never taken - the EQ alone did the
  work. The companion Short shows the positive case fractally on the 4-hour: require 0.5 of the candle
  to be respected, and while 0.5 keeps being respected, expansion continues.'
timeframes:
  htf:
  - 1D
  - 4H
  ltf: []
  fractal: true
preconditions:
- A candle 2 closure / reversal has set a directional expectation for the next candle.
detection_rules:
- Mark 0.5 of the reference candle.
- Bullish continuation requires that EQ to be respected and a bullish continuation to form out of the
  area.
- 'Failure branch: price does not respect the EQ AND no bullish continuation forms -> a bearish framework,
  targeting the previous day low and then the candle 2 low.'
- A close below the EQ makes the previous day low the likely draw.
- This can happen without the previous day HIGH ever being taken - the EQ disrespect alone flips the
  read.
- 'Positive case, fractal on the 4-hour: while 0.5 continues to be respected, expect expansion to continue.'
invalidation:
- Price closes back through the EQ in the original direction and forms the continuation after all.
measurable:
- hit rate of the previous-day-low target after an EQ close against the bias
- how often the EQ flips the read without the previous day extreme being taken
sources:
- video_id: BmTJEWru_9U
  title: How Equilibrium Invalidates Daily Bias
  quote: You notice we're not respecting this EQ
- video_id: BmTJEWru_9U
  title: How Equilibrium Invalidates Daily Bias
  quote: we just disrespect the EQ and never form a bullish continuation
- video_id: CRaMFN6di6U
  title: How I Use Equilibrium to Frame Price
  quote: I'd want to see 0.5 of this candle be respected
- video_id: CRaMFN6di6U
  title: How I Use Equilibrium to Frame Price
  quote: And if we continue to respect 0.5, there we go, expansion
ambiguities:
- Which candle the EQ is measured on is shown but never said - in the bearish flip it appears to be
  the candle 2 / reversal candle, in the 4-hour case it is "this candle".
- Two conditions are joined ("disrespect the EQ AND never form a bullish continuation") with no statement
  of whether either alone suffices.
- '"Respecting" is not defined as a wick touch versus a body close, consistent with the rest of the
  corpus.'
- The 4-hour Short mixes 0.5 of a candle and 0.5 of a wick within the same walkthrough without marking
  the switch.
