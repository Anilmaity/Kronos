ambiguities:
- Both Shorts are excerpts of SF61vCsBl1A (identical wording), which the library already cites. The library already holds the rule that a non-ideal candle 2 followed by a candle 3 closing through the series is an ideal formation for trading candle 4. These clips add sources, not rules.
- In DMOVzdGZtsU candle 3 closes over three things at once (the series level, candle 2's high and the range high). Which of them is required is not separated; the library rule needs only the series level.
- '"Aligns pretty well with this opposing candle" does not say which level of the opposing candle (open, body or extreme) is meant.'
- 'zIpL5N8AMig calls the candle 2 closure "not even very bearish" in a bullish setup. This reads as a slip or caption error for "bullish". The point is that the C2 was weak.'
- '"We have failure swings right here" is given as the reason the non-ideal C2 could still be traded. Whether the failure swings are the target or the point of interest is not said.'
- Neither Short names the timeframe.
