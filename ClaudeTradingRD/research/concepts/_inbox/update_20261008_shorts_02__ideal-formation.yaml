id: ideal-formation
name: Ideal Formation (closure and protected swing in the same bar)
category: model
status: contested
voice: ttrades
definition: >
  Two Shorts show an ideal formation that completes in candle 3 instead of candle 2, which is
  what makes candle 4 tradeable. In the first, price forms a V-shape and then a consolidation,
  and runs out the consolidation low. That candle is not a candle 2 or candle 3 closure, so it
  is not traded away from. The next candle sweeps the range low and is a candle 2 closure. It
  could still be traded higher, because failure swings are there, but it is not ideal, since an
  ideal formation needs a close over the series of down-close candles. The following candle
  closes over that level, over candle 2's high and over the range high. He marks that candle's
  EQ, which aligns with the opposing candle, and candle 4 is then ideal to trade; it forms a
  shallow wick and trades higher. The second Short has the same structure. Price sweeps a low
  and prints a weak candle 2 closure that is not ideal. Candle 3 forms a continuation and closes
  over, creating a protected swing. That is a valid swing framework, so candle 4 is the trade.
timeframes:
  htf: []
  ltf: []
  fractal: true
preconditions:
- Price sweeps a range extreme (a range low in both bullish examples).
detection_rules:
- A sweep candle that is neither a candle 2 nor a candle 3 closure is not a candle to trade away from.
- A candle 2 closure that has not closed over the series of opposing (down-close, bullish case) candles is valid but not ideal.
- If the next candle (candle 3) closes over that series level, the formation is ideal and forms a protected swing; candle 4 becomes the candle to trade. In the first example candle 3 also closes over candle 2's high and the range high.
- Mark the EQ of the closure candle (candle 3); candle 4's wick is expected around it and should be shallow.
invalidation:
- Candle 3 does not close over the opposing-candle series - no ideal formation, so the candle 4 trade is not licensed by this rule.
execution:
  bias: Direction of the candle 3 closure (bullish in both examples).
  entry: In candle 4, after a shallow wick near the candle 3 EQ.
measurable:
- candle 4 outcome after a non-ideal C2 followed by an ideal C3, vs a non-ideal C2 with no ideal C3
