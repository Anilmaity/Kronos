id: weekly-open-as-fair-value
name: The Weekly Opening Price Is Fair Value For The Week
definition: 'A charting convention with an analytic claim attached, stated while building the weekly
  review: he draws the weekly candle with its opening price on the hourly chart, and treats that
  opening price as fair value for the week - then points at how price reacted along that level all
  through the week. It is paired with vertical dividers at midnight separating and labelling each
  day, so the weekly profile can be read day by day on one hourly chart.'
category: time
status: underspecified
aliases:
- weekly opening price
- fair value for the week
preconditions:
- An hourly chart spanning the full week.
detection_rules:
- Mark the weekly opening price as a horizontal level across the whole week on the hourly chart.
- Separate each day with a vertical divider at midnight and label it, so the weekly profile is visible
  by day.
- Read reactions along the weekly open as the week's fair-value reference.
invalidation:
- Not stated.
measurable:
- distribution of hourly closes above versus below the weekly open, by day of week
- frequency of touches of the weekly open per week, and reaction size at each touch
sources:
- video_id: wrIZ7CAuFCc
  title: How To Journal Everyday For Trading
  quote: the weekly opening price showing me fair value for the week
- video_id: wrIZ7CAuFCc
  title: How To Journal Everyday For Trading
  quote: you can see how price reacted along that level all throughout the week
ambiguities:
- '''Fair value'' is asserted, never defined, and no trading rule is derived from the level in this
  video - it is used for review, not entry.'
- '''Reacted along that level'' is not quantified - no reaction size, no touch tolerance.'
- Whether the weekly open is the Sunday 18:00 futures open or the Monday session open is not stated.
- The midnight dividers imply the same timezone question the rest of the corpus leaves to New York.
