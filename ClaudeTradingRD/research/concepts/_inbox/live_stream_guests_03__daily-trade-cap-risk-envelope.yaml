id: daily-trade-cap-risk-envelope
name: Three Trades A Day At One Percent - A Fixed Daily Envelope
aliases:
- three trades per day
category: risk
status: specified
definition: 'Trade For Opportunity caps himself at about three trades per day, risks about one percent
  per trade and works to roughly a two-to-one payoff. The cap is derived rather than arbitrary: without
  a trade count there is no ceiling on how much can be lost in a day, so the risk management does
  not make sense from that perspective. Three trades at one percent with a two-to-one payoff bounds
  the day at minus three percent at worst and plus six percent at best. He arrived at three by experiment
  - a few months after quitting his job he was still feeling out his style and found he was taking
  too many trades without a limit. For context on the sample behind the numbers: he started ICT when
  the 2022 mentorship dropped in January, practised on demo and Apex evaluation accounts, and had
  only been trading live for about a month at the time of the stream.'
timeframes:
  htf: []
  ltf: []
  fractal: false
preconditions:
- A defined per-trade risk percentage and a target payoff ratio.
detection_rules:
- Maximum three trades per session.
- Risk about one percent of the account per trade.
- Target about two-to-one risk-to-reward.
- The resulting daily envelope is minus three percent to plus six percent; stop when the trade count
  is spent.
invalidation:
- Not applicable - a session cap.
measurable:
- realised daily P&L distribution against the modelled -3% / +6% envelope
- expectancy of the third trade of the day vs the first
sources:
