id: upper-half-eq-expansion-filter
name: Upper-Half EQ Rule For Expansion
aliases:
- upper half to respect
- lower half to respect
category: structure
status: specified
definition: Stated here in the channel's own voice (the library previously carried only a guest's
  version). During an expansion phase he requires the upper half of the reference candle's range to
  be respected for price to trade higher, and the lower half to be respected for price to trade lower.
  The half is the operative filter, not a location to enter counter to the move. If the half is not
  respected he flips the bias and anticipates the opposite extreme of the range being taken.
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 1H
  - 15m
  - 5m
  fractal: true
preconditions:
- A reference candle (usually the previous one) whose EQ has been marked.
detection_rules:
- Mark the EQ of the reference candle (wick high to wick low; 0.5 of the wick if the wick is very
  large).
- 'Bullish: require price to hold the upper half of that range.'
- 'Bearish: require price to hold the lower half of that range.'
- If the required half is not respected, flip the bias and anticipate the opposite extreme of the
  range being taken.
- 'Applied candle by candle in a run: each day''s respect of the previous day''s EQ is what builds
  the higher-timeframe wick.'
invalidation:
- A close through the EQ against the direction being held.
measurable:
- hold rate of the required half during confirmed expansion sequences
- hit rate of the flipped target after an EQ violation
sources:
- video_id: IPZjNI1B5a0
  title: You Are Using Discount and Premium Wrong! - EQ For Expansions
  quote: looking for the upper half to respect for price to trade higher
- video_id: IPZjNI1B5a0
  title: You Are Using Discount and Premium Wrong! - EQ For Expansions
  quote: if these do not respect I then can flip my bias and anticipate the low
- video_id: IPZjNI1B5a0
  title: You Are Using Discount and Premium Wrong! - EQ For Expansions
  quote: this is where I like to use the equilibrium
ambiguities:
- Whether 'not respected' means a wick through the EQ or a close through it is not stated.
- The flip is described as immediate, with no re-test or confirmation requirement attached.
- The rule presumes the expansion phase has already been classified; the phase test is not restated
  here.
