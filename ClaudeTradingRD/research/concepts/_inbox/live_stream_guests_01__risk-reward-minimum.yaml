id: risk-reward-minimum
name: "Minimum Risk-To-Reward"
aliases: ["fixed 2R", "2.2R for the spread", "why not 1:1"]
category: risk
status: specified
voice: guest
guest_sources:
- "Trader T"
- "Ben (Ben TT)"

definition: >
  Two guests give the same target doctrine from opposite directions. Trader T uses a fixed 2R on
  every trade and defends it psychologically rather than statistically: the worse outcome is not
  missing an extension past 2R, it is watching price reach 2R and then come back and take you out
  when you could have banked it. He pads the target to about 2.2R so the spread does not stop him
  short of the fill. Ben refuses to go as low as 1:1 and gives the arithmetic: a 1:1 system forces
  break-even at a 50 percent win rate, so a sub-50 percent trader cannot be profitable on it at
  all. His own comfort band is taking profit around 2R to 2.5R with 3R to 3.5R as the sweet spot,
  and his stated method for settling the question is empirical - run 20, 25 or 50 trades at 1R,
  1.5R and 2R and see what your own data says.

timeframes:
  htf: []
  ltf: []
  fractal: false

preconditions:
- "A stop distance is fixed, so R is well defined before entry."

detection_rules:
- "Trader T: take profit at a fixed 2R; set the order at about 2.2R so the spread does not prevent the fill."
- "Trader T: if 2R is further than the structure allows, tighten the ENTRY (move the limit) rather than shorten the target."
- "Ben: reject 1:1 - it requires better than a 50 percent win rate merely to break even."
- "Ben: take profit around 2R-2.5R, with 3R-3.5R preferred, and let part of the position run."
- "Ben's procedure for choosing your own multiple: log 20-50 trades at each of 1R, 1.5R and 2R and read the result off your own data rather than adopting someone else's number."

invalidation:
- "Not applicable."

execution:
  bias: "Not applicable."
  entry: "Tightened when needed to make the R multiple reachable (Trader T)."
  stop: "The R unit."
  targets: ["2R fixed (Trader T)", "2R-2.5R, ideally 3R-3.5R (Ben)"]

measurable:
- "expectancy at 1R, 1.5R, 2R, 2.5R and 3R on the same entry list - exactly the experiment Ben prescribes"
- "how often price reaches 2R and then returns to the stop (Trader T's stated fear, made testable)"
- "fill-rate difference between a 2.0R and a 2.2R target once spread is modelled"

sources:
- video_id: wCtxmWe4KNc
  title: "Back Testing Live Session With Trader T"
  quote: "I really like 2R I find it's just peace of mind"
- video_id: wCtxmWe4KNc
  title: "Back Testing Live Session With Trader T"
  quote: "R 2.2 just to alleviate for the spread"
- video_id: yRmKkR4CojU
  title: "Fractalizing Entries -Q&A with Ben - ICT Concepts"
  quote: "forcing yourself to be break even at fifty percent win rate"

ambiguities:
- "Trader T's 2R is not derived from anything - it is stated as a personal preference that removes a decision."
- "Ben gives a band (2R-3.5R) rather than a rule, and does not say what selects a value inside it on a given trade."
- "Neither speaker reconciles a fixed R target with an obstacle (an opposing PD array) sitting between entry and target."
- "Ben's 20-50 trade sample is far too small to separate these multiples statistically, and he does not say so."

python_detector: null
