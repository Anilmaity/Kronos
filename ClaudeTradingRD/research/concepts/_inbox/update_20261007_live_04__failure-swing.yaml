id: failure-swing
name: Failure Swing
category: structure
status: contested
voice: ttrades
definition: 'Cross-walk to The Strat given to a Strat trader: a failure swing is NOT a Strat ''failed
  2'' (a bar failing to become a 2 and turning into an outside/3 bar). It is purely structural - the run
  of highs (or lows) lined up at a level without being taken out; the Strat trader''s equivalent term
  is ''pivot machine gun''.'
aliases:
- pivot machine gun (Strat-trader equivalent)
ambiguities:
- '''Lined up'' tolerance (how close the highs must be) is not quantified here either.'
sources:
- video_id: 9H15ZZvaKPQ
  title: New York Open Live Q&A
  quote: it's just all those highs that are lined up right without taking it out
