ambiguities:
- This is the earlier recording; it agrees with the updated material's clock anchors (midnight /
  08:30) and adds the price anchor, but the later canon drops the midnight open from the toolkit.
- '''Normally'' is the only frequency claim - no share of days is given.'
- The 09:30 level, present in the later statements of this concept, is not part of this video.
- The auto-captioner renders 'Judas' as 'Judith' and 'Juda'.
