id: opposing-run-entry
name: Opposing Run / Judas Swing At A Time Level
definition: 'EARLIER RECORDING that supplies the price anchor for the Judas swing rather than only
  the clock anchor. The daily profile is read as open-high-low-close on a sell day and open-low-high-close
  on a buy day; the leg to be captured is the Judas swing that forms the day''s opposite extreme,
  and he states where it normally sits: above the 08:30 and midnight open on a sell day, below them
  on a buy day. Execution is then to look for a lower-timeframe setup, and for PD arrays being reached
  into, inside that area.'
category: entry
status: contested
aliases:
- Judas swing
- Judith swing
- manipulation leg
preconditions:
- A daily directional read (buy day / sell day).
- The midnight and 08:30 opens are marked.
detection_rules:
- 'Sell day (OHLC shape): expect the Judas swing / day''s high above the midnight open and the 08:30
  open.'
- 'Buy day (OLHC shape): expect the Judas swing / day''s low below the midnight open and the 08:30
  open.'
- Look for the lower-timeframe entry setup inside that area, and for PD arrays price is reaching
  into beyond the levels.
- The Judas swing is what has to be caught to capture the daily range - entering after it is missing
  the range.
invalidation:
- Price never trading beyond the two opens on the required side - the day offers no entry location
  under this rule.
measurable:
- share of days whose Judas-swing extreme forms beyond both opens
- range captured when entering at the Judas swing versus entering after it
sources:
- video_id: b6yvRKf8haE
