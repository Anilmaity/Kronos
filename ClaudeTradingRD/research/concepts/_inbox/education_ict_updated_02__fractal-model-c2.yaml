ambiguities:
- The numbering 'candle 1 / candle 2 / candle 3' is never spoken in this video; the sequence is described
  as 'this first candle' and 'this candle', so the mapping to C1/C2/C3 is inferred from the rest
  of the corpus, not stated here.
- Which level C1's sweep must be of (its own extreme, a swing, a session level) is not specified.
- Whether the closure back inside must be a body close is not stated.
- The 'conflicted bias -> use the daily profile' escape hatch is named but the daily profile procedure
  is not restated.
