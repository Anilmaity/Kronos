id: important-time-levels
name: Important Time Levels (18:00, midnight, 08:30, 09:30, 10:00, 14:00 EST)
category: time
status: specified
definition: 'Two Shorts restate the function split of the clock levels, independently of the long-form
  video the library already holds, and the two accounts agree. 18:00 and midnight are used with the
  DAILY candle''s open-high-low-close; 10:00 and 14:00 with the 4-HOUR candle''s (open, low, high, close
  when bullish - i.e. accumulation, manipulation below the opening price, distribution). 08:30 and midnight
  additionally serve as premium/discount markers and as support and resistance: bearish and above both
  = a deep premium, and vice versa. Midnight, 08:30 and 09:30 are the three levels at which he looks
  for a Judas swing or an order block: the opposing run at that time, once closed over, is the order
  block, and he then does not expect its low to be taken as price continues.'
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  fractal: false
preconditions:
- A directional bias for the day.
detection_rules:
- Use 18:00 and midnight with the DAILY candle open-high-low-close.
- 'Use 10:00 and 14:00 with the 4-HOUR candle open-high-low-close / power of three (bullish: open, low,
  high, close = accumulation, manipulation below the opening price, distribution).'
- 'Use 08:30 and midnight as premium/discount markers and as support and resistance: bearish and above
  both levels = a deep premium; bullish and below both = the mirror.'
- Look for the Judas swing / order block at midnight, 08:30 and 09:30 specifically.
- 'Bullish case: the opposing run at that time, once closed over, is the order block; do not expect
  its low to be taken as price continues higher.'
- 'Live case: price using the midnight open as support/resistance and failing to close below it is read
  as price working back toward the order block.'
invalidation:
- Price closes decisively through the midnight open being used as support/resistance.
measurable:
- frequency of an opposing run at each of midnight / 08:30 / 09:30
- hold rate of the order block formed by that opposing run
sources:
- video_id: JZDI--Jm0bA
  title: How I Use Important Time Levels in Trading
  quote: With the 8:30 and midnight open, I will consider premium or discount
- video_id: JZDI--Jm0bA
  title: How I Use Important Time Levels in Trading
  quote: I'll use midnight, 8:30, and 9:30
- video_id: RsPf6aNXtNw
  title: OHLC Paired with Important Time Levels
  quote: 10:00 and 2:00 will be a 4hour candle
- video_id: QRxG7a_JB08
  title: Important Time Levels Paired with Daily Bias lead to Setups for Entry
  quote: 8:30 opposes my anticipated daily order flow
ambiguities:
- The auto-captions render 18:00 as "18,800" and "188" in this unit too; the daily-open reading is fixed
  only by the surrounding sentence and by the 4-hour grid implied by 10:00 and 14:00.
- '"Judith swing" is the caption rendering of "Judas swing".'
- No timezone is stated in either Short.
- How far above the midnight open still counts as a "deep" premium is not bounded.
- 09:30 is listed for the Judas-swing / order-block use but is given no OHLC-framing role, unlike the
  other five levels.
