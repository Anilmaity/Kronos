id: realistic-r-expectations
name: "Realistic R and Win-Rate Expectations"
aliases: ["one to one R", "2R or minus 1R"]
category: risk
status: specified

definition: >
  The only concrete performance figures stated aloud in this unit, read off a mentorship
  student's own results and endorsed as what the model produces when followed: four months of
  2026, gold only, on the 4-hour / 15-minute model, taking a fixed 2R - 63R over 48 trades,
  63% win rate, average risk-to-reward 1.93. That is roughly twelve trades a month on one
  instrument. Separately, asked whether the fractal model works at 1:1 R, he says yes with the
  obvious condition attached - at 1R you only need to clear a 50% win rate. The remediation
  protocol he prescribes to struggling traders uses the same numbers: one trade a day, exit at
  2R or -1R, and no management in between.

timeframes:
  htf: ["4H"]
  ltf: ["15m"]
  fractal: false

preconditions:
  - "A single model applied consistently to one instrument."

detection_rules:
  - "Benchmark: 4-hour / 15-minute model, gold, four months, 48 trades, 63% win rate, average RR 1.93, +63R."
  - "At a fixed 1R target the required win rate is above 50%."
  - "Fixed-outcome variant: take 2R or -1R and do not manage the position in between."

invalidation:
  - "Not applicable."

measurable:
  - "trade count per month per instrument under the same model"
  - "realised win rate and average RR against the 63% / 1.93 benchmark"
  - "difference in expectancy between fixed-2R exits and discretionary management"

sources:
  - video_id: N3Ml-r0X30o
    title: "New York Open Live Q&A"
    quote: "63 R over 48 trades with a 63% win rate, average RR 1.93"
  - video_id: eIPM-D8RrSQ
    title: "New York Open Live Q&A"
    quote: "you just have to get over a 50% win rate"
  - video_id: i2HhHhWdaPQ
    title: "New York Open Live Q&A"
    quote: "limit to one trade a day two R or minus one R"

ambiguities:
  - "The 63R figure is one student's result on one instrument over four months, presented on screen; it is not a backtest and no drawdown, sample-selection or survivorship information is given."
  - "It is not stated whether the 48 trades include or exclude break-even exits."
  - "Whether the 2R target is his own standing target or only the remediation prescription is not made explicit."

python_detector: null
related: ["risk-reward-minimum", "max-one-trade-per-day", "mechanical-trade-management", "position-sizing-fixed-risk", "clean-day-criteria"]

