id: relevant-swing-separation
name: Relevant Swings Require Separation
category: structure
status: underspecified
definition: 'A drill Short on marking relevant highs and lows. Equal highs / failure swings mark the
  relevant high. For lows, a low qualifies as relevant not by being a failure swing but by its SEPARATION
  from the previous low: with enough separation, price can be expected to trade into the area and a
  reversal there can be trusted, because it is so far away from the earlier low. The counter-example
  is given explicitly - a low sitting close to the previous low is not trusted, because there is not
  enough valid separation to trade away from it while leaving the earlier low untaken.'
timeframes:
  htf:
  - 1D
  ltf: []
  fractal: true
preconditions:
- A chart with prior swing highs and lows to be marked as relevant or not.
detection_rules:
- Equal highs / failure swings mark the relevant high.
- A low is relevant when it has sufficient separation from the previous low.
- With sufficient separation, a reversal formed at that low can be trusted.
- 'A low close to the previous low is rejected: not enough valid separation to trust trading away from
  it without the earlier low being taken.'
invalidation:
- Price takes the earlier low that the untrusted level was meant to leave alone.
measurable:
- distribution of separation distances he accepts versus rejects
- reversal hold rate as a function of separation from the prior low
sources:
- video_id: XCYmGJWnsAg
  title: Identifying Relevant Swings
  quote: look at the separation it has between this low
- video_id: XCYmGJWnsAg
  title: Identifying Relevant Swings
  quote: There's not enough valid separation for me to trust trading away from this low
ambiguities:
- Separation is the whole rule and it is never quantified - not in points, not in ATR, not as a fraction
  of the range. The Short is a visual drill.
- No time-separation criterion is given either (how many candles apart).
- He calls the rejected low "technically a failure swing", so failure-swing status alone does not make
  a level relevant - but no precedence rule between the two tests is given.
related:
