id: monday-range-marker
name: "Mark The Monday Range"
aliases: ["Monday high and low", "Monday profile"]
category: time
status: specified

definition: >
  The Monday high and low are marked every week and used as liquidity references for the
  rest of the week. Mondays are expected to produce either a consolidation profile or a
  retracement profile against the prevailing daily order flow. The bearish weekly pattern
  described is: Monday retraces against order flow and prints the high of the week, then
  price is expected to trade above the Monday high, reject, and run to the Monday low and
  beyond into the higher-timeframe objective.

timeframes:
  htf: ["1W", "1D"]
  ltf: ["1H", "15m"]
  fractal: false

preconditions:
  - "The Monday session has completed (or is in progress with an identifiable range)."

detection_rules:
  - "Mark the Monday high and Monday low; the Monday London session high is noted as a further confluence."
  - "Expect Monday to be a consolidation or retracement profile against daily order flow."
  - "Bearish week: expect a sweep above the Monday high, then rejection and a run to the Monday low."
  - "Use the Monday low/high as the first take-profit reference for intraweek entries."

invalidation:
  - "Price closes decisively beyond the Monday range in the direction of the sweep."

measurable:
  - "frequency with which the weekly high/low forms on Monday"
  - "hit rate of the Monday low as a first target for Tuesday entries"

sources:
  - video_id: JABOO4LYNjQ
    title: "Jokerszn | Daily Orderflow - ICT Daily Bias"

ambiguities:
  - "'Usually' is the strength of the claim about Monday profiles; no frequency is given."

python_detector: null
related: ["valuation-by-speculation", "low-probability-day-checklist", "killzone-execution-sequence"]
