id: entry-timeframe-elevation
name: Entry Timeframe Elevation (root-cause fix for stop-outs)
category: psychology
status: specified
aliases:
- move up one time frame
definition: 'Restated: if you see direction but keep getting stopped out before the move, move up one
  timeframe for entries (5-minute to 15-minute). If the problem is not entering at all, base the trade
  on an invalidation and take it.'
detection_rules:
- Repeated stop-outs on 5m entries -> execute on 15m.
