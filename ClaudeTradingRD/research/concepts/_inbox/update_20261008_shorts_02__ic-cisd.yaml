ambiguities:
- This Short re-cuts Vo2n47RjjMo (same example, same wording), which the library already cites for ic-cisd. It adds no new rule.
- The level to close below is only pointed at ("this level here"). Whether it is the opening price of the up-close series into the new high is not said, although that is the library's CISD definition.
- The stop is not stated. The roughly 2R to the previous day low implies a stop at the new high, but that is inference.
- Neither timeframe is named. Using the previous day low as the target implies that the higher-timeframe candle is daily.
- Any new high inside candle 3 is treated as a point of interest here. Whether it must sweep a specific earlier high is not stated.
