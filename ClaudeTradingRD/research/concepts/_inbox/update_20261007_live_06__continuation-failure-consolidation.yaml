id: continuation-failure-consolidation
name: 'Continuation Failure #1 - The Closure Is A Consolidation Sweep'
category: entry
status: contested
voice: ttrades
definition: 'Repeated as the explanation for why a prior day was not a bullish reversal (NQ/ES, daily):
  the CISD took so long to form that it was no longer a CISD but a consolidation range; the eventual close
  over it was a manipulation of the range high, after which price targets the other side of the range
  (the low), which is then held as the draw.'
detection_rules:
- If the change in state of delivery takes too long to form after the sweep (no V-shape, repeated failure
  to close over), reclassify as a consolidation.
- Treat the eventual close over the level as a sweep of the range high; target the range low.
