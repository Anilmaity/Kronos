id: partial-profit-taking
name: Partial Profit Taking (contested)
category: risk
status: contested
definition: 'Same arithmetic restated for a viewer who holds full stops but exits winners early: at 2R
  the break-even win rate is about 34%; exiting everything at 1R raises it to 50%. Early profit-taking
  is therefore not ''locking in profits'' but raising the win rate required to break even. His prescription:
  if this is causing you to fail, change or quit.'
detection_rules:
- Break-even win rate at a 2R target is ~34%; at 1R it is 50%.
