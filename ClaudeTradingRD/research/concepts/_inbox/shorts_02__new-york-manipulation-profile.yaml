id: new-york-manipulation-profile
name: New York Manipulation
category: model
status: specified
definition: 'A Short gives the profile its missing one-line entry condition. The daily shape is open-high-low-close
  or open-low-high-close; what makes it the NEW YORK MANIPULATION profile rather than another is what
  London did: London either consolidates or FAILS TO REACH a higher-timeframe PD array / key level.
  New York then manipulates that range - London''s range - has a change in the state of delivery, and
  continues in the daily direction. The bullish and bearish cases are stated symmetrically.'
timeframes:
  htf:
  - 1D
  ltf:
  - 1H
  - 15m
  fractal: false
preconditions:
- A daily directional read.
- The London session has completed.
detection_rules:
- 'Precondition on London: London either consolidates OR fails to reach a higher-timeframe PD array
  / key level.'
- New York then manipulates that range (London's range).
- Require a change in the state of delivery out of the manipulation.
- Continuation follows in the daily direction, completing an open-low-high-close (bullish) or open-high-low-close
  (bearish) daily candle.
invalidation:
- London itself reaches the higher-timeframe PD array and reverses - that is a different profile.
measurable:
- share of days on which London fails to reach a HTF PD array
- continuation rate after the New York manipulation plus CISD
sources:
- video_id: f6Ca0EY95Sw
  title: 'NY Manipulation: A Daily Profile Breakdown'
  quote: we have London either consolidating or failing to reach a higher time frame PD array
- video_id: f6Ca0EY95Sw
  title: 'NY Manipulation: A Daily Profile Breakdown'
  quote: then New York manipulates this range here
ambiguities:
- The Short does not give the session clock for London or New York; the hours must come from elsewhere.
- '"Failing to reach" a PD array has no tolerance - how close is still a failure is not said.'
- It is not stated whether the manipulated range is London's range specifically or the whole pre-New-York
  range; the clip says "this range here" and then "or London's range".
- No entry, stop or target is given in the clip - it is a profile description only.
