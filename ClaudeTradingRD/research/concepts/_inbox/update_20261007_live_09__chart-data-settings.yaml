id: chart-data-settings
name: Chart Data Settings (back-adjust on, settlement off)
category: risk
status: contested
definition: 'Restated with a new reason for back-adjust: the contract-rollover gap on NQ is not a real
  price move, and back-adjust makes his futures chart align with the ETF (QQQ) and the index (NDX), which
  show no such gap. Settlement stays off because he wants the actual close.'
detection_rules:
- Back-adjust ON so rollover gaps are removed and the chart aligns with the ETF and index.
- Settlement OFF - use the actual close.
