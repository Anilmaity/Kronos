id: failure-to-manipulate
name: Failure To Manipulate (deflated to phases of price)
category: structure
status: specified
voice: ttrades
aliases:
- failure to manipulate a level
- trade the breakout of a range
definition: >
  The dedicated video gives a mechanical version. At a range extreme his default is to expect a
  reversal back to the other side (sweep, aggressive candle back in, CISD). A failure to manipulate
  is when price takes out the high or low and fails to reverse off it - operationally, it fails to form
  a change in the state of delivery in the opposite direction. He does not trade the breakout candle
  itself; he waits for a new continuation (a retest of the old range, a higher low / lower high, a new
  protected swing, or a candle 2 closure after retesting a gap) and trades that, stop on the protected
  swing, 2R target. It is a structure confirmation used inside the fractal model, never alone: it must
  be paired with a higher-timeframe bias, and the higher-timeframe candle read can override the
  mechanical lower-timeframe CISD (his last example: a mechanical bearish CISD after a sweep of the
  range high is discounted because the higher-timeframe candle shows a candle 2 closure with bullish SMT,
  so the move is read as a bullish failure to manipulate and traded as a positional entry).
timeframes:
  htf: ["1D"]
  ltf: ["1H", "30m", "15m", "1m"]
  fractal: true
preconditions:
- A defined range (equal highs/lows or a consolidation) or a level price is expanding into.
- A higher-timeframe bias in the breakout direction.
detection_rules:
- Price trades beyond the range high (low).
- No opposite-direction CISD forms - price cannot close below (above) the series of up-close (down-close) candles that made each new high (low).
- An aggressive close in the breakout direction at the level strengthens the read.
- Wait for a new continuation in the breakout direction (retest of the range / FVG, higher low or lower high, new protected swing) before entering.
- Enter on that continuation; stop on its protected swing; target 2R.
- If a mechanical opposite CISD does print but the higher-timeframe candle shows a candle 2 closure with SMT in the breakout direction, defer to the higher-timeframe read.
invalidation:
- An opposite-direction CISD forms at the level and is consistent with the higher-timeframe candles - it is a manipulation, trade the reversal.
- No higher-timeframe bias - he does not trade the structure alone.
execution:
  bias: Higher-timeframe bias in the breakout direction.
  entry: New continuation after the level is taken (or positional entry at the HTF open if the protected swing formed before it).
  stop: The new protected swing.
  targets: ["2R"]
measurable:
- 2R hit rate of breakout continuations after a range extreme is taken with no opposite CISD within N bars
- comparison with and without daily-bias alignment
