ambiguities:
- How many bars to wait for the opposite CISD before declaring failure is not stated; it is resolved only when the new continuation forms.
- The override of a mechanical CISD by the higher-timeframe candle read is discretionary and makes the concept non-decidable from lower-timeframe structure alone.
