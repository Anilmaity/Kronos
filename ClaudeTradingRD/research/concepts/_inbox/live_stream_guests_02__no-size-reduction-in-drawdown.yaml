  quote: that adds another variable to the strategy
- video_id: wGYde-h84cs
  title: Live Q&A with AM Trades - Weekly Profile
  quote: it's always fixed dollar risk for me personally
ambiguities:
- '''two hour strategy'' in the transcript is the auto-caption rendering of ''2R strategy''; ''34 win
  rate'' is 34%.'
- The 34% figure ignores commissions and slippage; it is the bare 2R break-even (1/(1+2) = 33.3%) rounded
  up.
- This directly contradicts the scaling-matrix approach recorded elsewhere in the corpus from a different
  guest - that is a guest-vs-channel difference, not a channel self-inconsistency.
