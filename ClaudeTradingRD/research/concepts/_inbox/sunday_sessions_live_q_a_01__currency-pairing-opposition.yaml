id: currency-pairing-opposition
name: "Pair a Strong Currency Against a Weak One, Never Against a Consolidating One"
aliases: ["comparing currencies", "why euro not pound", "SMT currency groups"]
category: structure
status: specified

definition: >
  In FX he does all the analysis on the dollar and then pairs it with the counter currency that is
  moving hardest in the opposite direction, because expansion comes from pairing opposite
  directions. Pairing a bullish currency with one that is merely consolidating (his example:
  GBP/JPY when JPY is ranging) is rejected in favour of pairing against a directional counterpart
  (GBP/USD). For SMT he uses memorised correlation groups: GBP with EUR; NZD with AUD; JPY, CAD
  and CHF each treated alone; USD-based pairs use the dollar index as the SMT reference.

timeframes:
  htf: ["1D", "4H"]
  ltf: ["15m", "5m"]
  fractal: false

preconditions:
  - "A directional read on the dollar exists."

detection_rules:
  - "Establish the dollar direction from the daily chart."
  - "Rank the counter currencies by strength and weakness."
  - "For a bearish dollar, trade the strongest counter currency against it; for a bullish dollar, trade the weakest."
  - "Reject pairs where one leg is consolidating."
  - "For SMT, compare within the groups GBP-EUR and NZD-AUD; treat JPY, CAD and CHF individually and use the dollar index for USD pairs."

invalidation:
  - "The dollar loses direction, in which case he stays away from FX."

execution:
  bias: "Opposite the dollar direction on the counter currency."
  entry: "Per the fractal model on the selected pair."
  stop: "Per the entry model used."
  targets: ["Previous day or daily swing highs and lows on the selected pair"]

measurable:
  - "realised range of strong-versus-weak pairings compared with strong-versus-consolidating pairings"

sources:
  - video_id: egV_gABTQks
    title: "(CPI) New York Open Live Q&A"
  - video_id: WBwoiMDXT2c
    title: "New York Open Live Q&A"
  - video_id: 0AYGNc9czYc
    title: "New York Open Live Q&A"

ambiguities:
  - "Strength ranking is done visually from a watchlist; no metric or lookback is specified."
  - "The correlation groups are given as memorised knowledge without justification."

python_detector: null
related: ["relative-strength-asset-selection", "smt-requires-framework"]
