  - "Whether the Wednesday reversal in ES/NQ should be confirmed with its own candle 2 + hourly CISD before being transferred is not stated."
  - "This sits uneasily with intermarket-correlation-not-used and with cross-asset-reversal-confirmation, which is a same-time requirement rather than a one-day lead."
