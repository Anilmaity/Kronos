id: thursday-counter-week
name: Thursday Counter (weekly profile)
category: model
status: contested
voice: ttrades
definition: >
  SHORTS EVIDENCE, explicitly "not a perfect example". Monday, Tuesday and Wednesday expand higher;
  Thursday does not take out Wednesday's high but is still called a Thursday counter because it counters
  the range. Even without catching the reversal day, the profile gives Friday's bias: trade toward the
  weekly open and the current week's low, which it does. He adds an intermarket reading: on ES / NQ the
  reversal formed on Wednesday, so the week is really a Thursday continuation of a midweek reversal, and
  using that one could have looked for the reversal on Wednesday in the traded asset as well.
detection_rules:
  - "Thursday need not take out Wednesday's extreme to count as countering the range."
  - "After Mon-Wed expansion and a Thursday counter, Friday's targets are the weekly open and the current week's opposite extreme."
  - "Intermarket reclassification: if correlated indices (ES / NQ) reversed on Wednesday, treat the week as a midweek reversal and look for the reversal on Wednesday in the traded asset too."
