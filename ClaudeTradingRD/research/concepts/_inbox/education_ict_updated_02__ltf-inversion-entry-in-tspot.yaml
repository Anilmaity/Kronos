ambiguities:
- The t-spot is drawn by his indicator and its derivation is not given in this video.
- '''Inversion'' is used throughout without being defined here; it is assumed from his inversion
  fair value gap video.'
- When several inversions form inside the t-spot, the selection rule is qualitative ('I want to see
  that inversion that forms the wick').
- The positional variant - entering right on the higher-timeframe open when the invalidation has
  already formed before that open - is shown once and has no threshold for 'very close to the opening
  price'.
- Whether the time-based exit or the 2R target takes precedence is left open; he shows both on the
  same trades.
