id: max-one-trade-per-day
name: One Trade Per Day Cap
aliases:
- why one trade per day not two
category: risk
status: specified

definition: >
  Asked why the cap is one trade per day rather than two, he gives the reasoning rather than a
  new rule: most people who struggle with tilt, revenge trading or oversizing will break every
  rule they have if given a second trade, and every trade taken is another exposure to the
  market and to your own weaknesses - two trades are two opportunities to go on tilt. He pairs
  it with a related fix he has used on students: move them from 1-minute entries to 15-minute
  entries, because a 15-minute setup takes an hour to resolve and by then they are no longer
  in the state that produced the next impulsive trade. His own behaviour in these streams
  matches it - once the day's move is taken or missed he stops looking, and he does not sit at
  the screen hunting for a second setup.

timeframes:
  htf: []
  ltf:
  - 15m
  - 1m
  fractal: false

preconditions:
- The trader has a known tendency toward tilt, revenge trading or oversizing.

detection_rules:
- Cap the session at one trade.
- If impulsive re-entry is the problem, raise the entry timeframe so that each setup takes
  about an hour to resolve.
- When the day's opportunity has been taken or has passed, stop looking rather than searching
  for a replacement.

invalidation:
- n/a - a discipline rule.

measurable:
- expectancy of trade 1 versus trade 2+ per session
- change in impulsive-entry frequency after moving from 1-minute to 15-minute entries

sources:
- video_id: W7Fu3Rx5iMs
  title: New York Open Live Q&A
  quote: if you give them two trades, they will break all their rules
- video_id: W7Fu3Rx5iMs
  title: New York Open Live Q&A
  quote: Every time you take a trade, you expose yourself to the market
- video_id: W7Fu3Rx5iMs
  title: New York Open Live Q&A
  quote: they start taking 15-minute entries and they're fine
- video_id: X4XSsv5CNqg
  title: New York Open Live Q&A
  quote: I don't just sit on here all day trying to search for something

ambiguities:
- The cap is justified psychologically, never with expectancy data.
- It is prescribed for people who struggle with tilt; whether he holds himself to exactly one
  is never stated, though he describes being done after one move.
- No rule for a day where the single trade is stopped out early.

