id: consolidation-reversal-week
name: Consolidation Reversal (weekly profile) - the Thursday external-range protocol
category: model
status: contested
voice: ttrades
definition: >
  TTrades' own Shorts walkthrough of a bullish consolidation reversal week. Wednesday prints a
  bearish expansion candle, and he explicitly refuses to call Wednesday the low of the week on
  that candle ("let another day play out"). Thursday then forms a candle 2 closure that is also
  ideal because it forms a protected swing in the same bar. With consolidation through Wednesday
  and a Thursday reversal, Friday is expected to expand. Confirmation is taken on the hourly:
  from Thursday's low, price must close through the series of down-close candles (change in the
  state of delivery), after which a new continuation forms; Friday then expands higher off
  Thursday's reversal.
timeframes:
  htf: ["1W", "1D"]
  ltf: ["1H"]
  fractal: false
preconditions:
- Weekly bias exists (bullish in the worked case).
- Monday-Wednesday consolidate; Wednesday may itself be a bearish expansion candle.
detection_rules:
- Do not treat Wednesday as the weekly low/high when Wednesday is an expansion candle against the bias.
- Thursday must print a candle 2 closure (reversal); best case it is an ideal closure that also forms a protected swing.
- On the hourly, from Thursday's extreme, require a close through the series of opposing (down-close for bullish) candles.
- After that CISD, a new continuation (new protected swing) forms; then look for Friday to expand.
invalidation:
- Wednesday's expansion candle is not a reversal - no profile is called on it.
- No hourly change in the state of delivery from Thursday's extreme.
execution:
  bias: Direction of Thursday's reversal (with the weekly bias).
  entry: Friday expansion after the hourly CISD and the new continuation inside Thursday.
measurable:
- Friday expansion rate when Thursday is an ideal C2 closure after a Mon-Wed consolidation vs a non-ideal one
sources:
- video_id: 8nXRD4mm_-o
  title: Breaking Down the Consolidation Reversal Weekly Profile
  quote: I would not trust myself to say that Wednesday has formed a low
- video_id: 8nXRD4mm_-o
