  quote: it's an ideal candle two closure as it also forms a protected swing
- video_id: 8nXRD4mm_-o
  title: Breaking Down the Consolidation Reversal Weekly Profile
  quote: For Friday to expand because we have a consolidation reversal profile.
- video_id: 8nXRD4mm_-o
  title: Breaking Down the Consolidation Reversal Weekly Profile
  quote: have we closed through the series of down closed candles?
ambiguities:
- The Short does not state which external level of the Mon-Wed range Thursday swept; it only says Thursday formed a reversal / candle 2 closure.
- Here Wednesday is a bearish expansion candle, yet the period is still called a "consolidation through Wednesday" - no rule reconciles an expansion day inside the consolidation leg.
- No Friday entry, stop or target is given; only the expansion is shown.
related: [ideal-formation, hourly-cisd-confirmation, protected-swing, fractal-model-c2]
