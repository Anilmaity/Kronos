id: high-vs-low-resistance-liquidity
name: High Resistance vs Low Resistance Liquidity
category: liquidity
status: specified
definition: 'A dedicated Short answers the operational question the long-form corpus left open: how
  the two kinds of liquidity are used TOGETHER. He targets low resistance liquidity and keeps high resistance
  liquidity behind him - on his side of the curve, where the stop goes. Low resistance liquidity is
  identified structurally as a high with a lower high next to it (mirrored for lows); a level that has
  just been swept and traded away from is the high resistance side.'
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 15m
  - 5m
  fractal: true
preconditions:
- A marked-up range with identifiable swing highs and lows on both sides of price.
detection_rules:
- 'Low resistance liquidity := a high with a lower high next to it (mirror: a low with a higher low
  next to it).'
- Target low resistance liquidity.
- Keep high resistance liquidity on the stop-loss side / on your side of the curve.
- A low that has just been swept, followed by a market structure shift away from it, is high resistance
  liquidity and is therefore stop territory, not target territory.
- After the structure shift, enter on the fair value gap or the order block created by it.
- 'A leg can chain: failing to make a new high after a low leaves more low resistance liquidity ahead,
  and the move finishes into it.'
invalidation:
- Price trades back through the high resistance side that was supposed to hold - the stop.
measurable:
- hit rate of low-resistance-liquidity targets versus high-resistance ones
- stop-out rate when the stop sits behind swept (high resistance) liquidity
sources:
- video_id: go3ae4yzKDY
  title: How to Use High & Low Resistance Liquidity Together
  quote: I want to be targeting low resistance liquidity
- video_id: go3ae4yzKDY
  title: How to Use High & Low Resistance Liquidity Together
  quote: having high resistance liquidity for my stop loss
- video_id: go3ae4yzKDY
  title: How to Use High & Low Resistance Liquidity Together
  quote: a high with a lower high next to it
ambiguities:
- The Short teaches from a schematic diagram, not a live chart, so no instrument, timeframe or session
  is attached to the rule.
- '"On my side of the curve" is used interchangeably with "for my stop loss"; the curve reference is
  not developed here.'
- How far the lower high must be below the high for the pair to count as low resistance liquidity is
  not given - it is read visually.
- This does not reconcile the corpus's other sense of the same phrase (a market-wide expansion versus
  consolidation condition read off the daily); the Short only teaches the structural sense.
