id: next-day-model
name: Next Day Model (and its equivalence to a STRAT 2-2 reversal)
aliases:
- next candle model
- daily bias video
category: model
status: specified
definition: 'TTrades states that a lot of the time he gets his daily bias from the next day model -
  looking for a daily candle to close respecting a PD array, then aligning that with the weekly profile.
  In the STRAT episode he maps the same object onto the guest''s vocabulary live: a candle that goes
  up, fails, and closes back into the previous range is what his next-day-bias video calls for, and
  it is the same thing as the guest''s 2-2 reversal; the trigger fires on the next candle and the objective
  is the other side of the range. He makes the general equivalence explicit at the end - taking a previous
  low and reversing is what ICT traders describe as taking sellside and reaching for buyside.'
timeframes:
  htf:
  - 1W
  - 1D
  ltf:
  - 1H
  fractal: true
preconditions:
- A completed daily candle and a marked PD array / previous range.
detection_rules:
- A daily candle takes out one side of the previous range and closes back inside it (respecting the
  PD array).
- The following candle is expected to trade toward the OPPOSITE side of that range.
- Align the resulting bias with the weekly profile before acting.
- The same object expressed in STRAT terms is a 2-2 reversal, and the magnitude is the previous candle's
  opposite extreme.
invalidation:
- The next candle instead continues through the swept side.
measurable:
- hit rate of the opposite range extreme on the day after a fail-and-close-back-in
- agreement rate between next-day-model signals and STRAT 2-2 reversal labels
sources:
- video_id: wGYde-h84cs
  title: Live Q&A with AM Trades - Weekly Profile
  quote: I get daily bias by using next day Model A lot of the times
- video_id: 1XWyy6Q-_8Q
