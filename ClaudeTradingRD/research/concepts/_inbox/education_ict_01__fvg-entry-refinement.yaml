ambiguities:
- No rule says which of the three to prefer when they disagree.
- '''Look to your left'' has no lookback bound.'
- How far to drop the timeframe is shown (daily->hourly, 5m->1m) but not stated as a ratio.
- The claim that the refinement 'allows a lower win percentage' is asserted, never quantified.
- Auto-caption renders 'fib' as 'bib' in the first example.
