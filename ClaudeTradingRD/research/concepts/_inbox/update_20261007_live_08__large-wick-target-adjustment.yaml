id: large-wick-target-adjustment
name: Large Wick - Adjust Targets, Do Not Expect Expansion
category: risk
status: specified
definition: 'Reviewing the previous day on air, he states the large-wick target set as an ORDERED ladder,
  not a menu. When the day carries a larger wick (a larger opposing run), no expansion is expected and
  the targets are taken in this fixed sequence: the daily open first, then the intraday (overnight) lows,
  then the previous day low (mirror: daily open, intraday highs, previous day high). He says the order
  never changes. In the worked day all three were hit and he considered the day done.'
measurable:
- frequency with which large-wick-day targets are hit in the stated order (DO -> intraday extreme -> PDL/PDH)
- hit rate of each rung conditional on the previous rung being hit
detection_rules:
- Classify the daily wick as large (a larger opposing run).
- Target 1 = daily open; Target 2 = intraday/overnight extreme on the trade side; Target 3 = previous
  day low (bearish) or previous day high (bullish).
- Targets are expected to be reached in that order; once the third is hit, stop looking for more on that
  day.
sources:
- video_id: K7XVj2w3CP4
  title: New York Open Live Q&A
  quote: back to the daily open, back to those intraday lows, or previous day low.
- video_id: K7XVj2w3CP4
