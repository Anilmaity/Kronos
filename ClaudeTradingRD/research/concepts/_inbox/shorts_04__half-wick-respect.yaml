    quote: "price would respect the upper half of this wick"
  - video_id: WLFThXBRk0I
    title: "Wick Disrespected. What’s It Telling You?"
    quote: "if the upper half of this wick is not respected"
  - video_id: OuyHuNe-IP0
    title: "Wicks Don't Lie, Mastering Them Will Change Your Trading"
    quote: "I'm going to be focused on price respecting the upper half of this wick"

ambiguities:
  - "'Closure through' 0.5 of the wick is stated for the failure case, but the respect case is shown as a wick low, so the two sides use different tests (close vs touch)."
  - "The wick measured is the reversal candle's own wick; whether an intervening candle's wick may substitute is not stated."
  - "No tolerance band around the 50% level is given."

python_detector: null
