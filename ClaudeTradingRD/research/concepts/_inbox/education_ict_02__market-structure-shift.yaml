id: market-structure-shift
name: Market Structure Shift (MSS)
category: structure
status: contested
definition: 'EARLIEST RECORDINGS. The older formulation is markedly leaner than the later canon: market
  structure is nothing more than highs and lows (short-term, swing, and relatively equal), and a market
  structure shift is a prior high (in a downtrend) or prior low (in an uptrend) being BROKEN WITH
  DISPLACEMENT. That is the whole test. There is no stop-raid precondition, no requirement that price
  first engaged a higher-timeframe level, and no CISD anywhere - the term ''change in the state of
  delivery'' does not occur once in the twenty videos of this unit. The MSS is what tells you the
  trend is changing, and its by-product - the fair value gap left by the displacing leg - is the entry.'
timeframes:
  htf:
  - 15m
  - 5m
  ltf:
  - 1m
  - 15s
  fractal: true
preconditions:
- A sequence of lower highs (bearish) or higher lows (bullish) is on the chart.
detection_rules:
- 'Downtrend: mark the successive lower highs. A shift occurs when one of them is broken WITH displacement.
  Uptrend: mirror on the lows.'
- 'Displacement is required, not optional: a high that is exceeded without an energetic move and without
  a fair value gap is explicitly NOT a shift.'
- The displacing leg must leave a fair value gap; that gap is then the entry.
- 'Timeframe: he reads trend on the 5-minute but states the 15-minute is less noisy and is what he
  recommends to most people; the higher timeframe overrides the lower.'
- After the shift, mark the displacement range and take the entry only in its discount (long) or premium
  (short).
invalidation:
- The break occurs without displacement / without a fair value gap - read it as a pullback.
measurable:
- proportion of swing breaks that carry a fair value gap
- 5m vs 15m shift counts per session
