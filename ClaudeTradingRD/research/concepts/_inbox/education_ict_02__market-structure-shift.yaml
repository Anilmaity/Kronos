ambiguities:
- 'EVOLUTION vs the Updated playlist: the later canon (_94CPMjWi9E) adds two conditions absent here
  - a preferred stop raid before the break, and a REQUIRED prior engagement with a higher-timeframe
  level (''without which I do not personally search for a setup''). These are the earlier recordings
  and they impose neither.'
- 'EVOLUTION: the later canon separates MSS from CISD as two distinct signals. In this unit CISD does
  not exist as vocabulary at all; ''break structure'' does the same job everywhere.'
- Which swing counts is not filtered - he says only that he prefers a higher-timeframe low to be broken
  rather than a small intraday one, with no separation or age test.
- Whether the break must be a body close beyond the swing is never stated; every worked case is resolved
  visually by the size of the move plus the fair value gap.
