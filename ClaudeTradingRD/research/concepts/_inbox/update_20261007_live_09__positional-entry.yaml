id: positional-entry
name: Positional Entry At An Invalidation On The Open
category: entry
status: contested
definition: 'Defined live as a protected swing existing prior to the open of the new higher-timeframe
  candle. Whether to take it is gated on confidence that the bias is right and that the low holds. On
  this day he declined a positional entry at the 10:00 open: the prior run had been deep and left failure
  swings, so he could not trust the low, and with low confidence he would first let the 4-hour candle
  form whatever wick it was going to form.'
preconditions:
- A protected swing formed before the open of a new higher-timeframe candle (here the 10:00 4-hour open).
detection_rules:
- At the new higher-timeframe open, check for a protected swing formed before it.
- Take the positional entry only when confidence in the bias and in that low holding is high.
- If the run into the low was deep and left failure swings, treat the low as untrusted and do not position
  on the open; let the higher-timeframe wick form first.
invalidation:
- The protected swing is taken out.
measurable:
- stop-out rate of positional entries whose protected swing followed a deep run with failure swings vs
  a clean sweep
sources:
