id: relatively-equal-highs-lows
name: Relatively Equal Highs / Lows
definition: 'EARLIER RECORDING. Relatively equal highs and lows are clusters of swing points at approximately
  the same price. The claim made here is purely about what they are FOR: once formed and left untaken,
  they become targets for later. The worked example marks two such clusters, observes that neither
  has been hit, runs one of them, and then carries the other forward as the target for a subsequent
  short.'
category: liquidity
status: contested
aliases:
- relative equal highs
- relative equal lows
- equal highs
preconditions:
- Two or more swing points sit at approximately the same price.
detection_rules:
- Mark clusters of highs (or lows) at approximately the same price as one pool.
- If the cluster has not been traded through, carry it forward as a target for later.
- After taking one cluster, the remaining untaken cluster on the opposite side becomes the next objective.
invalidation:
- The cluster is traded through - it is no longer a target.
measurable:
- share of untaken equal-high/low clusters that are reached within N days of formation
- time-to-target distribution for clusters carried forward
sources:
- video_id: Njs-eRpeP9Q
  title: What is Liquidity? - ICT Concepts
  quote: They become targets for later
- video_id: Njs-eRpeP9Q
  title: What is Liquidity? - ICT Concepts
  quote: We just have a bunch of equal highs in here
ambiguities:
- This is the earlier recording of the liquidity lesson; the tolerance that makes two highs 'relatively
  equal' is not given here either, so the corpus-wide gap is unchanged.
- No rule for choosing between two untaken clusters when both are open.
- '''Later'' is not bounded - no expiry is given for a cluster carried forward.'
