id: small-wick-expansion-rule
name: "Small Wick Supports Expansion; Large Wick Waits for Candle 3"
category: model
status: specified

definition: >
  Four Shorts restate the rule in its most compressed form and add three things the long-form
  treatments leave implicit. First, the confirmation package: a small wick is not read alone -
  in the worked example it is stated together with a change in the state of delivery and an
  SMT, and that package is what "supports expansion". Second, the target that follows from a
  small wick inside the fractal model is named: the EQ. Third, an edge case is handled - a
  candle that does NOT support expansion but also has NO wick at all is not tradeable as a
  wick; it is downgraded to drawn liquidity and the trader waits for a new candle open. A run
  of expansion days is characterised as a run of days that all carry relatively small wicks.

timeframes:
  htf: ["1D", "4H", "1H"]
  ltf: ["15m", "5m", "1m"]
  fractal: true

preconditions:
  - "A higher-timeframe candle whose extreme is believed to have formed."
  - "In the worked example the extreme formed early in the candle, off a previous candle's
    high that was also a failure swing."

detection_rules:
  - "A small wick supports expansion in the direction away from the wick."
  - "Read the small wick as part of a package: small wick + change in the state of delivery +
    SMT is what he states as confirming the expansion."
  - "Once the wick is confirmed formed, the EQ is the mechanical target for that expansion
    inside the fractal model."
  - "A run of expansion days is expected to keep printing relatively small wicks; a large wick
    breaks the run."
  - "Edge case: if a candle does not support expansion AND has no wick, do not treat it as a
    wick to trade away from - use it as drawn liquidity and wait for a new candle open."
  - "Timing constraint stated in the same clip: with little time left in the candle it does not
    make sense for price to consolidate, sweep the high, and then expand - expect the sweep,
    then let the candle close and work from the new candle."

invalidation:
  - "A large opposing run forms instead of a small wick - switch to the target-adjustment
    branch (see large-wick-target-adjustment)."
  - "Price manipulates the low and comes back into the range rather than failing to manipulate
    it - the expansion read is off."

execution:
  bias: "Away from the small wick."
  entry: "After the lower-timeframe change in the state of delivery confirms the wick formed."
  stop: "Not restated in these Shorts."
  targets:
    - "EQ (stated as the mechanical target when the small wick supports expansion)"

measurable:
  - "expansion rate to EQ following a confirmed small-wick + CISD + SMT package"
  - "how often a candle with no wick at all is later traded from as drawn liquidity, and its
    outcome"
  - "distribution of wick size across consecutive expansion days"

