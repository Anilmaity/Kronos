id: reversal-signature
name: Reversal Signature
category: structure
status: specified
aliases:
- expansion met with expansion
- V-shape reversal
definition: 'PRIMARY-SOURCE READING (this unit): a reversal is expansion met with expansion. Price
  expands into a level and is met immediately by expansion in the opposite direction; that pair of
  legs is what forms the higher-timeframe wick. It is the opposite of a continuation signature, where
  expansion is followed by a retracement or a consolidation. A reversal is only sought at a relevant
  point of interest - an old / swing high or low, with previous days'' and previous week''s highs
  and lows named as the easy way to find relevant ones. The cleanest form is the V-shape: expansion
  into a low that sweeps liquidity, then a clean expansion away that also closes over the series
  of opposing candles (the CISD). You do not have to catch the extreme; the alternative is to take
  the continuation afterwards off a protected swing.'
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  - 5m
  fractal: true
preconditions:
- Price has expanded into a RELEVANT high or low (previous day / previous week extremes, or a swing
  point), not an arbitrary one.
detection_rules:
- Expansion into the level, immediately met by expansion in the opposite direction.
- The counter-leg displaces back into the range - it is neither a shallow retracement nor a sideways
  consolidation.
- 'Ideal form: the counter-leg also closes over the series of opposing candles that made the extreme
  (CISD), producing a V shape.'
- 'The level must be relevant: an old high/low or swing high/low; previous day and previous week
  extremes are always relevant.'
- If the current candle does not decide between retracement, consolidation and reversal, let another
  candle close - the closures supply the new data.
- Where the reversal candle carries a large wick, 50% of that wick must be respected for the reversal
  to be traded lower/higher.
invalidation:
- The counter-move is slow and shallow (retracement) or sideways (consolidation).
- The reversal is framed off a high/low that is not relevant - failure swings are left resting beyond
  it.
- 50% of the reversal candle's wick is not respected.
execution:
  bias: Away from the swept extreme.
  entry: Lower-timeframe reversal, or - if the extreme was missed - the following continuation off
    a protected swing.
  stop: Beyond the reversal extreme.
  targets:
  - previous candle extremes on the reference higher timeframe
  - the opposing side of the range
measurable:
- hit rate of reversals framed at previous-day/week extremes vs at arbitrary swings
- share of expansion-met-with-expansion events that also carry a CISD
sources:
- video_id: VD4xb9VfMHA
  title: How To Trade Reversal - Phases Of Price
  quote: A reversal is when we have expansion met with expansion
- video_id: VD4xb9VfMHA
  title: How To Trade Reversal - Phases Of Price
  quote: We want to see a reversal form at a point of interest
- video_id: VD4xb9VfMHA
  title: How To Trade Reversal - Phases Of Price
  quote: you don't want to choose a random high and low for price
- video_id: VD4xb9VfMHA
  title: How To Trade Reversal - Phases Of Price
  quote: focus on previous days highs and lows or previous week's highs and lows
ambiguities:
- '''Expansion met with expansion'' inherits every ambiguity of ''expansion'' - there is no threshold
  on either leg, so the test is decidable only once you fix an expansion detector.'
- How immediately the second expansion must follow the first is not stated; one example takes several
  candles and is still counted.
- SMT is used as confluence on many examples in this video but, unlike the guest reading in t_talks_02,
  it is NOT stated as a requirement of the reversal signature here.
