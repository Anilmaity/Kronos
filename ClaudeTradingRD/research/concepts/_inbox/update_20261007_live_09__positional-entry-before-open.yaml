id: positional-entry-before-open
name: Positional Entry Before The Equity Open
category: entry
status: contested
definition: Adds a negative case for pre-open longs. Before 9:30 price had taken out a short-term high
  while protected swings sat lined up below it; he states that after taking something out price often
  runs out those protected swings before the continuation, so this was not an open to trade through, and
  a long placed before the open made no sense because no swing was expected to hold after the high was
  taken.
preconditions:
- Pre-open, price has just taken out a short-term high.
- Protected swings / short-term lows are stacked below current price.
detection_rules:
- If the pre-open move has taken out a high and no swing below is expected to hold, do not position long
  before the open.
- Expect a retracement into the open that runs the stacked protected swing(s) before any continuation.
- Wait for that run, a reaction, and a continuation after the open.
invalidation:
- Price expands from the open without running the stacked swings.
measurable:
- frequency with which stacked protected swings below a fresh pre-open high are run within the first 30
  minutes after 9:30
sources:
- video_id: Hlwq1dRjBZo
  title: New York Open Live Q&A
  quote: This isn't an open where I would try to trade through the open.
- video_id: Hlwq1dRjBZo
  title: New York Open Live Q&A
  quote: we go run out that protected swing before we actually get the continuation
- video_id: Hlwq1dRjBZo
  title: New York Open Live Q&A
  quote: you have no swings you're expecting to hold after we take out a high
ambiguities:
- '''Short-term high'' and ''lined up'' are chart-only; no count of stacked swings is given.'
