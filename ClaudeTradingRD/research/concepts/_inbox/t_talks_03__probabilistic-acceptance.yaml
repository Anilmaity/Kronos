id: probabilistic-acceptance
name: "Everything Is Probabilities (and the job ends at the click)"
aliases: ["stacking probabilities", "once you click the button, your job is over"]
category: psychology
status: specified

definition: >
  The organising mental frame the guest credits for his longevity: nothing in a market
  is guaranteed, so a model is only a stack of probabilities arranged so that a
  favourable outcome occurs some proportion of the time. Three operational consequences
  follow. First, losses are not evidence of a broken model and must be accepted as part
  of the distribution. Second, results must be judged across a sample rather than per
  day - he contrasts a roughly $6k losing Wednesday with roughly $50k of wins across
  Friday and Monday and refuses to weight the loss more heavily. Third, control ends at
  execution: once the order is placed the outcome belongs to the market, and no amount
  of attention changes it. He extends this to intuition - he can mark a level and expect
  it to hold, and it may not, and that is not a failure of the read.

timeframes:
  htf: []
  ltf: []
  fractal: false

preconditions:
  - "A defined model executed repeatedly, so that a distribution of outcomes exists to reason about."

detection_rules:
  - "Judge performance over a sample of days or trades, never over a single session."
  - "Treat a loss inside the sample as expected, not as a signal to change the model."
  - "After execution, take no further discretionary action beyond the pre-planned management."
  - "Expect the model to run through both winning and losing streaks and treat streaks as a property of the distribution."

invalidation:
  - "Not applicable - this is a psychological frame."

execution:
  bias: "n/a"
  entry: "n/a"
  stop: "n/a"
  targets: []

measurable:
  - "sample size at which the model's expectancy stabilises"
  - "distribution of streak lengths, and the largest historical losing streak (he reports six)"
  - "difference between planned and actual management actions after entry"

sources:
  - video_id: 1wKfc2gN4xg
    title: "Trader Kane | The Mind Behind a Multi-Million Dollar Day Trader"

ambiguities:
  - "No sample size is proposed at which a run of losses should instead be read as model decay; the guest describes two weeks of consecutive losers where he doubted the edge and simply continued."
  - "Six is given as his largest losing streak while also acknowledging earlier periods of undisciplined trading he cannot count, so the figure is not a clean model statistic."
  - "Building intuition over time is credited as part of the edge but is not separable from the mechanical model in anything he describes."

python_detector: null
related: ["tilt-stop-rule", "size-down-on-fear", "journal-losers-only", "dynamic-risk-scaling-matrix"]
