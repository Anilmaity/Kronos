    quote: "So this level does not form a protected swing"
ambiguities:
  - "Sourced from an ASR (whisper-small) transcript, not YouTube captions; wording may be imprecise."
  - "In video Nlw-PZhoViQ the two ways a protected swing can form are enumerated as the operator's only two options for keeping a bias alive, but no preference or probability is attached to either branch."
  - "Whether the close over the fair value gap must be a full body close, and whether the gap must be fully or partially filled first, is not stated."
  - "Stops are placed below the bodies in one scalp and below the swing low elsewhere; no rule distinguishes the two cases."
  - "Trailing to every new protected swing stopped the scalp out on a move that subsequently resolved in his favour, and no rule is given for when not to trail."

