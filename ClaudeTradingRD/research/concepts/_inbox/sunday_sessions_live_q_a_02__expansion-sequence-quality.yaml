id: expansion-sequence-quality
name: "Expansion Sequence Quality (expansion met with expansion)"
aliases: ["expansion met with expansion", "phases of price sequence"]
category: structure
status: specified

definition: >
  A healthy directional sequence alternates: expansion, then retracement or consolidation,
  then expansion. When expansion is immediately met with expansion and then expansion again,
  with no interleaved retracement, the sequence is degenerating into consolidation and the
  setup quality drops sharply. This is used as a live filter to downgrade an otherwise
  mechanically valid continuation.

timeframes:
  htf: ["4H", "1H"]
  ltf: ["15m", "5m", "1m"]
  fractal: true

preconditions:
  - "At least one expansion leg has printed."

detection_rules:
  - "Classify each successive leg as expansion, retracement or consolidation."
  - "Three consecutive expansions with no interleaved retracement or consolidation flags a degraded sequence."
  - "A retracement that does not look like one on the trading timeframe may resolve into a clean expansion-retracement-expansion sequence one timeframe lower (he drops to 15-second to show this)."

invalidation:
  - "A clean retracement or consolidation appears and the alternation is restored."

execution:
  bias: "Unchanged, but position/conviction reduced."
  entry: "Prefer setups where the sequence alternates."
  stop: "Per the entry model."
  targets: "Per the entry model."

measurable:
  - "Expectancy by count of consecutive expansion legs preceding entry."

sources:
  - video_id: yud7TpE2AMs
    title: "New York Open Live Q&A"
    quote: "You don't really want to see the expansion met with expansion"
  - video_id: Qv6Ux_Z8VrA
    title: "New York Open Live Q&A"

ambiguities:
  - "'Expansion' vs 'retracement' vs 'consolidation' are classified by eye; no range or duration thresholds are given."
  - "Dropping a timeframe to reclassify a leg makes the rule timeframe-dependent with no stated stopping point."

python_detector: null
related: ["shallow-retracement", "consolidation-avoidance", "fractal-model-c3"]
