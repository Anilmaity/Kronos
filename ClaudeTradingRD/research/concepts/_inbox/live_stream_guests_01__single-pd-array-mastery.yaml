id: single-pd-array-mastery
name: "Pick One PD Array, Plus Highs And Lows"
aliases: ["don't get married to a pd array", "use what you see best"]
category: psychology
status: specified
voice: guest
guest_sources:
- "Ben (Ben TT)"

definition: >
  Ben's answer to whether order blocks or fair value gaps carry more weight, and the operating
  principle behind it. He does not rank the arrays; he says the array you should use is the one
  your own eye reads most reliably, and that you do not need to use everything in ICT's arsenal. He
  is candid that order blocks are his own weak point - he struggles to see them and skips one in
  the live example because it is not clean enough for him - while breaker blocks and balanced price
  ranges jump off the page. The corollary he states twice is procedural rather than aesthetic:
  pick the array, then study what price actually does at it, and let journalled data rather than
  someone else's preference decide whether you keep using it.

timeframes:
  htf: []
  ltf: []
  fractal: false

preconditions:
- "The trader has a way of logging outcomes by array type."

detection_rules:
- "Choose the PD array you identify most reliably; you do not need to use all of them."
- "Do not adopt an array because another trader uses it."
- "Study what price does at your chosen array specifically, and keep the array only if the logged data supports it."
- "Ben's own selection: breakers and balanced price ranges in, order blocks out."
- "The same principle applies to labelling schemes he has not adopted - he reads price without short-term / intermediate-term / long-term structure labels because he found enough consistency without them, and will only adopt them if his own performance changes."

invalidation:
- "Not applicable."

measurable:
- "expectancy by PD array type for a single trader, which is the decision procedure he prescribes"
- "identification consistency: how often the same trader marks the same array on the same chart"

sources:
- video_id: yRmKkR4CojU
  title: "Fractalizing Entries -Q&A with Ben - ICT Concepts"
  quote: "don't get married to a p array because somebody else uses it"
- video_id: yRmKkR4CojU
  title: "Fractalizing Entries -Q&A with Ben - ICT Concepts"
  quote: "find out what you notice best"

ambiguities:
- "'Clean enough' is the actual rejection test he applies to an order block on air, and it is purely visual."
- "No sample size is given for the point at which logged data should settle the choice."
- "The advice sits in tension with his own use of a ladder of several PD array types as targets - the selection rule applies to entries, not to targets, but he never says so explicitly."

