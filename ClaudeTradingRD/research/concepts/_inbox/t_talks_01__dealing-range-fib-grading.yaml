id: dealing-range-fib-grading
name: "Grading Price Swings Across The Dealing Range"
aliases: ["grading price swings", "swing projection"]
category: structure
status: underspecified

definition: >
  A map assigning a function to each zone of the dealing range, measured with a Fibonacci from the
  area that created the smart money reversal to the original consolidation. Each zone names what
  kind of entry should be expected there, giving a sequence rather than a single signal.

timeframes:
  htf: ["1W", "1D"]
  ltf: ["1H"]
  fractal: true

preconditions:
  - "A completed smart money reversal."
  - "An identified original consolidation to project toward."

detection_rules:
  - "Draw the fib from the smart-money-reversal area to the original consolidation."
  - "Below 0.25 of the dealing range - the low-risk buy (or low-risk sell) forms here."
  - "Just above 0.25 - the first distribution forms here; the breaker traded into at this zone belongs to this stage."
  - "Below 0.50 - if the Silver Bullet forms here, the next leg is high probability and fast."
  - "At 0.75 - the re-accumulation zone and the highest-probability entry, provided the Silver Bullet already formed below 0.50."
  - "Return to 0.50 at any point after that - the idea is invalid."

invalidation:
  - "Price returns to 50 percent of the dealing range."

execution:
  bias: "With the model direction toward the original consolidation."
  entry: "0.75 re-accumulation on a mitigation block, after a sub-0.50 Silver Bullet."
  stop: "Not stated."
  targets: ["the original consolidation"]

measurable:
  - "frequency with which each named event occurs in its designated zone"
  - "hit rate of the 0.75 entry conditioned on the Silver Bullet having formed below 0.50"
  - "invalidation rate at the 0.50"

sources:
  - video_id: wB-fQiT_UDo
    title: "DayTradingRauf | ICT MMXM Models"

ambiguities:
  - "The fib's exact anchors are described only in words; the on-screen settings are shown but not read out, so the range cannot be reproduced reliably."
  - "The 0.25 / 0.50 / 0.75 zones and the reversal midpoint are both described as halves of the structure, and their relationship is not made explicit."
  - "'First distribution' is named without a stated use."
  - "Marked underspecified because the anchoring cannot be reconstructed from the audio alone."

python_detector: null
related: ["silver-bullet-breaker-requirement", "mmxm-hedging-definition", "mitigation-block", "smart-money-reversal-breaker-confirmation"]
