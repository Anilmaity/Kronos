id: inducement-equals-sweep
name: Inducement
aliases:
- inducement
- engineered liquidity
category: liquidity
status: specified
definition: 'A move that induces buyers or sellers into the market: breakout buyers buy above an old
  high while shorts have buy stops resting there, and that is where smart money sells for the move lower
  (mirrored below lows). He maps it directly onto accumulation-manipulation-distribution and states
  the operational rule plainly — with bearish order flow he wants HIGHS to be run to position short,
  with bullish order flow he wants LOWS to be run to position long. He prefers the inducement to occur
  INSIDE a PD array, and his favourite case is when price barely reaches into that PD array.'
timeframes:
  htf:
  - 4H
  - 1D
  ltf:
  - 15m
  - 5m
  fractal: true
preconditions:
- Order flow / trend direction is already established.
- Preferably a higher-timeframe PD array has been engaged.
detection_rules:
- 'Bullish order flow: mark a low sitting inside a PD array; wait for it to be run.'
- 'Bearish order flow: mark a high sitting inside a PD array; wait for it to be run.'
- The run is the manipulation; enter as the induced level breaks, targeting the opposite side.
- 'Preferred quality: price barely reaches into the PD array, or has not yet reached equilibrium/discount
  of the range.'
- In a trending market, every run of a prior low (uptrend) is a candidate entry — he counts three in
  one leg.
invalidation:
- Closes beyond the induced level rather than a wick through it (he watches whether the closes respect
  the old lows).
execution:
  bias: With the prevailing order flow.
  entry: Positioned as the induced low/high breaks, inside the PD array.
  stop: Where it normally would be (beyond the sweep) — not further specified.
  targets:
  - The high/low the inducement was engineered from
  - Partial at the previous high
measurable:
- count of inducement sweeps per trending leg
- outcome when inside a PD array vs not
