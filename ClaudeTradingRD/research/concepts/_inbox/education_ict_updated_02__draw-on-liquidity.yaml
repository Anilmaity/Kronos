id: draw-on-liquidity
name: Draw On Liquidity (previous day high / low as objective)
aliases:
- DOL
- the easiest draw on liquidity
- previous day high and low
category: liquidity
status: specified
definition: 'The channel''s default and, in his words, easiest draw: unless price is going to stay
  in a consolidation where it fails to take either side of the range, it is going to reach for previous
  day high, previous day low, or both. The daily-chart question he asks himself is therefore binary
  - is price more likely to reach previous day high or previous day low - and answering it yields
  both a bias and a target, after which he drops to a lower timeframe to frame an entry. He credits
  the MMXM Trader for the teaching.'
timeframes:
  htf:
  - 1D
  ltf:
  - 1H
  - 15m
  - 5m
  fractal: false
preconditions:
- Previous day high and low are marked; price is not inside a consolidation that fails to take either
  side.
detection_rules:
- Mark previous day high and previous day low.
- Ask which is more likely to be reached; that answer is the draw and the target.
- If price is trending up, anticipate previous day high being taken; if trending down, previous day
  low.
- Stay out of consolidations - the rule is stated as conditional on price not remaining range-bound.
- When actually watching price, extensions beyond previous day high and below previous day low are
  also used as targets, not just the levels themselves.
- If the target is already taken (e.g. the Asia session took previous day high), the day is not traded
  in the later session.
invalidation:
- Price remaining in a consolidation that takes neither side of the range.
- The draw already having been reached earlier in the day.
execution:
  bias: Toward previous day high or previous day low.
  entry: Framed on a lower timeframe once the draw is chosen (fair value gap / box setup examples
    shown).
  stop: Beyond the manipulation low/high of the session.
  targets:
  - previous day high
  - previous day low
  - extensions beyond them
measurable:
- share of days that take previous day high, previous day low, both, or neither
- how often the draw is already taken before the New York session opens
- accuracy of the trend-based choice (see trend-by-previous-day-extremes)
sources:
- video_id: FXJBFbZQbck
  title: The Easiest Draw On Liquidity (DOL) - Daily Bias - ICT
  quote: it is going to reach for previous day high or previous day low or both
- video_id: FXJBFbZQbck
  title: The Easiest Draw On Liquidity (DOL) - Daily Bias - ICT
  quote: the Asia session already took out previous day high
- video_id: FXJBFbZQbck
  title: The Easiest Draw On Liquidity (DOL) - Daily Bias - ICT
  quote: it's not always possible to get an entry
ambiguities:
- '''Consolidation'' is the single exception to the whole rule and is never defined or bounded here.'
- Where both previous day high and low are taken in the same day, no rule orders them.
- '''Extensions beyond'' previous day high/low are used as targets with no projection method given.'
- Having a bias on nearly every day is explicitly not the same as having a trade - he says an entry
  is not always available.
