ambiguities:
  - "The speaker explicitly defers the definition to a separate 'Open High Low Close' video that is not in this unit, so this entry captures only the usage inside the daily-profile series."
  - "'Relatively the same point' for the indecision candle is not quantified; the only figure given is an 80-point NQ close-to-open distance described as small, which is an illustration and not a threshold."
  - "No body-to-range or close-location threshold is given for the directional shapes either."

