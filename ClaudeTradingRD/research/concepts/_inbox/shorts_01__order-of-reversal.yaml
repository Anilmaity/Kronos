id: order-of-reversal
name: The Order Of A Reversal (confirmation ladder)
category: entry
status: specified
definition: 'SHORTS EVIDENCE, and the corpus''s most explicitly NUMBERED statement of the ladder: he
  calls them step one through step five out loud. Step 1 is the raid of stops / turtle soup, which carries
  almost no confirmation because the prevailing trend is still intact. Step 2 is a closure over the
  opposing fair value gap, forming an inversion. Step 3 is the change in the state of delivery - the
  closure over the series of opposing-close candles that swept the extreme. Steps 4 and 5 are the fair
  value gap and the breaker, for a trader who wants still more confirmation. Once all five have printed,
  the trend is treated as shifted.'
preconditions:
- Price has swept a prior extreme at a level where a reversal is plausible.
detection_rules:
- 'Step 1: the sweep of the previous low/high (turtle soup, raid of stops). Least confirmation.'
- 'Step 2: a close beyond the fair value gap that had supported the prior move - an inversion.'
- 'Step 3: a change in the state of delivery - a close over the opposing-close candles that swept the
  extreme.'
- 'Steps 4 and 5: the fair value gap and the breaker.'
- Steps 2 and 3 together are the stated minimum for 'more confirmation that a reversal has formed'.
- Each successive step is later in time and therefore a worse price - the choice of rung is the trader's
  confirmation appetite.
measurable:
- hold rate of the swept extreme conditioned on how many rungs have printed
- average adverse excursion by entry rung
