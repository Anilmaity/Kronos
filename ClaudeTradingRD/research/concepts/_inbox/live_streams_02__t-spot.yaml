id: t-spot
name: "The T-Spot (overlap of two half levels)"
aliases: ["T-spot", "our EQ, our T-spot"]
category: entry
status: underspecified

definition: >
  Asked directly for the definition of the T-spot, he gives the purpose but refuses the
  derivation: it means where the wick should form — where the wick should go — and he says
  outright that he is not explaining where the name or the level is derived from (the name is a
  joke). In use across these streams it is printed by his indicator immediately after the CISD
  and the protected swing, it is the area the daily wick is expected to form in, and in the Asia
  example it is named interchangeably with the EQ of the candle being traded from.

timeframes:
  htf: ["1D", "4H", "1H"]
  ltf: ["15m", "5m", "1m"]
  fractal: true

preconditions:
  - "A CISD and a protected swing have printed on the higher-timeframe candle."

detection_rules:
  - "The T-spot is the zone in which the higher-timeframe candle's wick is expected to terminate."
  - "It is printed after (not before) the CISD and the protected swing."
  - "Require price to hold within it for the continuation to remain valid."
  - "In the Asia positional example the level used as the T-spot is the EQ of the candle being traded from."

invalidation:
  - "Price trades through and holds beyond the T-spot — the wick is not forming where expected."

measurable:
  - "share of higher-timeframe wicks terminating inside the T-spot"
  - "expansion following T-spot-respecting versus T-spot-violating candles"

sources:
  - video_id: m8xcjkOuBHU
    title: "New York Open Live Q&A"
    quote: "what it means is where the wick should form"
  - video_id: Je7cd9HJUBE
    title: "New York Open Live Q&A"
    quote: "marks out that protected swing, and then prints the T-spot"

ambiguities:
  - "The derivation is explicitly withheld — he says he is not explaining where the T-spot is derived from — so it cannot be computed from this unit."
  - "Naming it as the EQ in one example conflicts with the two-overlapping-half-levels construction recorded elsewhere in the corpus; both readings are used in this unit without reconciliation."
  - "Whether the wick must terminate inside it or merely trade into it is still not distinguished."

python_detector: null
related: ["equilibrium-eq", "half-wick-respect", "protected-swing", "ic-cisd", "small-wick-expansion-rule"]

contributing_units: ["live_streams_02"]
