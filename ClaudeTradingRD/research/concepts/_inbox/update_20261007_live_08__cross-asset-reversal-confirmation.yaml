id: cross-asset-reversal-confirmation
name: The Strongest Asset Must Reverse for the Weakest to Expand
category: structure
status: specified
definition: 'He picks the tell among the correlated indices by proximity: the asset closest to the relevant
  level (here YM at a previous low) is watched first, and its reaction there decides the others. A very
  shallow wick and reversal at that level means the other assets will probably reverse too (possibly with
  SMT) and continue the other way; trading right through the level with no reaction means continuation
  for the group. Live, for a bullish NQ idea he required the weakest asset (YM) to sweep its low and reverse;
  when YM swept but then failed to react he declared the day chop and took nothing.'
measurable:
- P(group continuation | tell asset trades through the level without reversal)
detection_rules:
- Among the correlated indices, identify which is closest to the relevant level; that asset is the tell.
- If the tell prints a shallow wick and reverses at the level, frame reversals (SMT) in the others.
- If the tell trades through the level with no reaction, frame continuation in the others.
- For a long in the strongest asset, require the weakest to sweep its low and reverse; if it neither reverses
  nor runs the low, stand aside.
