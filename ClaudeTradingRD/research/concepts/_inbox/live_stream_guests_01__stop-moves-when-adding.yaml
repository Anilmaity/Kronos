id: stop-moves-when-adding
name: "If You Add To A Position, The Stop Moves"
aliases: ["scaling in", "first position to break even"]
category: risk
status: specified
voice: guest
guest_sources:
- "Ben (Ben TT)"

definition: >
  Ben scales into positions, and states the consequence as a rule rather than a choice: once a
  second tranche is on, the first tranche's stop is moved - either to break even, or trailed up to
  where the second tranche's stop sits, which is typically above his first entry. He raises it
  while explaining why his win rate and his strike rate differ: the rule manufactures break-even
  exits, and break-evens are neither wins nor losses in his accounting.

timeframes:
  htf: []
  ltf: ["5m", "1m"]
  fractal: false

preconditions:
- "A first tranche is open and in profit enough for a second entry to be placed behind it."

detection_rules:
- "On adding a second tranche, move the first tranche's stop to break even, or trail it to the second tranche's stop level."
- "The second tranche's stop is typically above the first entry, so the trailed stop is at worst break even and often better."
- "Count the resulting break-even exits separately from wins and losses."

invalidation:
- "Not applicable."

execution:
  bias: "Unchanged."
  entry: "Second tranche behind the first."
  stop: "First tranche moved to break even or to the second tranche's stop."
  targets: ["unchanged"]

measurable:
- "frequency of break-even exits produced by the rule"
- "expectancy of the scaled position versus a single full-size entry on the same signals"

sources:
- video_id: yRmKkR4CojU
  title: "Fractalizing Entries -Q&A with Ben - ICT Concepts"
  quote: "if i'm scaling into a position my first position is coming to break even"

ambiguities:
- "The size ratio between tranches is never given, so the blended entry and the true break-even price are undefined."
- "What triggers the second entry is not stated in this passage - only what happens to the stop once it exists."
- "He describes himself as 'relatively aggressive with my stop after', which is looser than the two options he then names."

python_detector: null
related: ["break-even-management", "realistic-r-expectations", "partial-profit-taking"]
contributing_units:
- live_stream_guests_01
draft_count: 1
