id: smt-reversal-continuation-double
name: Reversal SMT, Continuation SMT, Double SMT
category: liquidity
status: contested
voice: ttrades
definition: >
  Two Shorts, both cut from -ocfPuD_oqE (How To Use SMT Divergence), restate the reversal SMT.
  (1) AIexWKldGU4: reversing off the previous day's high, the candle has a small wick (which supports
  expansion) and a change in the state of delivery, and gold has a reversal SMT with gold-euro and
  gold-pound. If SMT is used on candle 2, or inside the reversal candle before it closes, that candle
  must support expansion lower. In the example price expands to the EQ, fails it and takes the
  previous lows. (2) hWwyr-rTFW4: a candle 2 closure with a CISD, plus a reversal SMT of NQ against YM
  between candle 2 and candle 1, is "extra confirmation" for expansion lower in candle 3. The bullish
  reading of the same candle 2 is rejected because price has not closed through the series of
  down-close candles.
detection_rules:
- Reversal SMT = the divergence sits between candle 1's extreme and candle 2's extreme.
- Count it only when the reversal candle itself supports expansion (small wick) and has a CISD.
- SMT adds confirmation; it does not create the direction.
sources:
