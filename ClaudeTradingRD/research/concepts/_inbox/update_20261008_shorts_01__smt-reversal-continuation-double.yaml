  quote: This is on NQ from candle two to candle one.
- video_id: hWwyr-rTFW4
  title: Using SMT as Extra Confirmation for a Reversal
  quote: That gives us an extra confirmation that this can reverse here
ambiguities:
- No new content; both clips are verbatim cuts of -ocfPuD_oqE, which the library already cites
  for this rule (including "it has to support expansion lower").
- '"Small wick" is not quantified here either (see small-wick-expansion-rule).'
- The caption renders "candle 2" as "candle to" in hWwyr-rTFW4.
