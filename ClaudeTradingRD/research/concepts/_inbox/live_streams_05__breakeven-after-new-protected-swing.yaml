id: breakeven-after-new-protected-swing
name: Move the Stop Only After a New Protected Swing Forms
aliases:
- new invalidation
category: risk
status: specified
definition: 'Worked live. After the entry, price sweeps a low, prints a candle 2 closure and forms
  a continuation on the 1-minute; that continuation creates a new invalidation level, and at that
  point - and only at that point - the position can be moved to break even. The converse is stated
  in the same session as the exit trigger for the idea: when price comes back and invalidates the
  protected swing, he is no longer interested because the session becomes choppy.'
timeframes:
  htf:
  - 1H
  - 15m
  ltf:
  - 5m
  - 1m
  fractal: true
preconditions:
- An open position and an original invalidation level.
detection_rules:
- Wait for a sweep plus a candle 2 closure plus a formed continuation on the execution timeframe.
- That structure is the new invalidation; move to break even against it.
- Do not move the stop merely because price has travelled.
- If the protected swing is later invalidated, stand down rather than re-entering.
invalidation:
- The new protected swing is taken out.
measurable:
- break-even stop-out rate when moved on a new protected swing vs on distance
sources:
- video_id: tDiwwMRWF2k
  title: New York Open Live Q&A with NickDoesFutures
  quote: you can be break even because price formed a new invalidation
ambiguities:
- Whether the stop goes exactly to entry or behind the new swing is not distinguished here - he says
  break even.
related:
- protected-swing
