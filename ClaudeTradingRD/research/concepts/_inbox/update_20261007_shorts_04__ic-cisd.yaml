id: ic-cisd
name: Intracandle CISD (IC-CISD)
category: entry
status: contested
voice: ttrades
definition: >
  Short walkthrough of letting the wick form with an intracandle CISD (bearish case, hourly
  inside an aligned daily candle). The prior candle is a candle 2 closure with a valid change
  in the state of delivery, and a new continuation has formed before the new candle opens, so
  that high should hold if price is to trade lower. Inside the new candle price moves choppily
  up into a point of interest, then closes through the series of up-close candles there - a
  valid intracandle CISD. The high it protects is treated as the daily wick high, which must
  remain intact for the move lower; the example then expands lower.
timeframes:
  htf: ["1D"]
  ltf: ["1H"]
  fractal: true
preconditions:
- Candle 2 closure with a valid CISD on the previous candle.
- A new continuation (protected swing) formed before the new candle's open.
detection_rules:
- Inside the new candle, wait for price to move into a point of interest against the bias.
- Require a close through the series of up-close (bearish case) candles into that point of interest = IC-CISD.
- Treat the resulting high as the protected intraday high = the daily wick high.
invalidation:
- The protected wick high is traded through.
execution:
  bias: Direction of the candle 2 closure.
  entry: After the IC-CISD forms inside the continuation candle.
  stop: Above the protected wick high (bearish).
