id: fair-value-gap
name: Fair Value Gap (FVG)
category: structure
status: specified
definition: 'Corroborating primary-source statement from the earliest recordings: a fair value gap
  is a break in price delivery, read off three candles, where the wick of the first candle and the
  wick of the third candle do not overlap. He contrasts it directly with the normal case where the
  wicks DO overlap (''price was delivered well there''). It is the signature of price moving quickly
  through an area, which is why it doubles as the detection aid for displacement.'
timeframes:
  htf:
  - 4H
  - 1H
  - 15m
  ltf:
  - 5m
  - 1m
  - 15s
  fractal: true
detection_rules:
- Take three consecutive candles 1, 2, 3.
- 'Bullish: candle 1''s high does not overlap candle 3''s low. Bearish: candle 1''s low does not overlap
  candle 3''s high.'
- The unfilled space between those two wicks is the gap zone.
- Overlapping wicks across the three candles = price delivered normally = no gap.
- A fair value gap left by a structure break is the entry for that break.
measurable:
- count of fair value gaps per session by timeframe
- fill rate of gaps left by a structure break
sources:
- video_id: PePk1V0Q4QQ
  title: Intro to Market Structure Shifts, Fair Value Gaps, and Displacement - ICT Concepts
