id: timeframe-pairing
name: Timeframe Pairing (entry timeframe fixes the analysis timeframes)
aliases:
- higher time frames are relative to the time frames you are entering on
category: time
status: contested
definition: 'EARLIER RECORDING, and the most explicit numeric statement of the pairing in this unit. The
  higher timeframes are not absolute - they are RELATIVE to the timeframe you execute on. Three concrete
  pairs are given: executing on 1-minute and 15-second -> watch 15-minute, 1-hour and 4-hour for points
  of interest; executing on 5-minute and lower -> daily, 4-hour and 1-hour supply the draw; executing
  on the 1-hour -> look up to the weekly and monthly. The purpose of fixing the pair is attention management:
  you only drop to the execution timeframe when price reaches one of the higher-timeframe levels, because
  you do not want to be searching all the time.'
timeframes:
  htf:
  - 1M
  - 1W
  - 1D
  - 4H
  - 1H
  - 15m
  ltf:
  - 5m
  - 1m
  - 15s
  fractal: true
preconditions:
- The trader has chosen an execution timeframe.
detection_rules:
- 1m / 15s execution -> 15m, 1H, 4H are the point-of-interest timeframes.
- 5m and lower execution -> 1D, 4H, 1H supply the draw on liquidity.
- 1H execution -> weekly and monthly supply the draw.
- Only drop to the execution timeframe once price has reached a level on the paired higher timeframe.
invalidation:
- Not applicable - this is a configuration rule, not a chart pattern.
measurable:
- share of executed trades that began at a level from the paired timeframe
- number of hours per day spent watching the execution chart under this rule vs continuous watching
