ambiguities:
- The two pairings he gives for himself are not identical (1m/15s -> 15m/1H/4H in one video; 5m and lower
  -> 1D/4H/1H in the other), so the ladder overlaps rather than tiles cleanly.
- No rule says how many of the three higher timeframes must agree.
- EARLIER RECORDING - the later corpus states the pairing in fractal-model terms instead.
