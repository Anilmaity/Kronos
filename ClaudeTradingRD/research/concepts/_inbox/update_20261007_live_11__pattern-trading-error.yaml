id: pattern-trading-error
name: "Pattern Trading Error"
aliases: ["I don't pattern trade things", "no bias, stay out"]
category: psychology
status: specified
voice: ttrades
definition: >
  Two live restatements. A fair value gap forming does not make his bias bearish - he does
  not pattern-trade. And asked whether an intra-candle change in state of delivery is better
  with no bias, he answers that with no bias you should not take entries at all; dropping to
  lower timeframes until a bias appears just gets you chopped up - go to the higher timeframes
  or stay out.
timeframes:
  htf: ["1D"]
  ltf: []
  fractal: false
detection_rules:
  - "No daily bias -> no entries; do not search lower timeframes for one."
  - "A single FVG print is not a bias input on its own."
measurable:
  - "Outcome of LTF CISD entries taken on days with no daily bias vs with one."
