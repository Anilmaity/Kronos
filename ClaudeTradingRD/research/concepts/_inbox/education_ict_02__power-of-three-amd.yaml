id: power-of-three-amd
name: Power Of Three (Accumulation, Manipulation, Distribution)
category: model
status: contested
definition: 'Two earlier statements that anchor AMD to objects the later canon states less directly.
  (a) CANDLE-LEVEL AMD, anchored on the OPENING PRICE: the consolidation around the opening price
  is accumulation; the excursion beyond the opening price is manipulation; the move to the far extreme
  and the close is distribution. That makes the opening price - not an arbitrary consolidation box
  - the reference the three phases are measured against. (b) RANGE-LEVEL AMD via failure to displace:
  fail one side of the range and you should expect the other side to be sought; he equates that directly
  with the broadening formation and with power of three (consolidation, manipulation, then distribution).'
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
detection_rules:
- 'Candle-level: mark the period''s opening price. Consolidation around it = accumulation.'
- The first sustained excursion beyond the opening price = manipulation.
- The move away from that excursion toward the far extreme = distribution.
- 'Range-level: a failure to displace out of one side of the range is the manipulation; expect the
  distribution to seek the opposite side.'
- The same shape read on two diverging lines is a broadening formation.
measurable:
- proportion of periods whose manipulation excursion resolves beyond the opening price
- size of the distribution leg relative to the manipulation leg
sources:
- video_id: YXoNowXQirM
  title: Open High Low Close (OHLC / OLHC) - ICT Concepts
  quote: what happens when we go above this opening price that is our manipulation
- video_id: 5rbFskdmEmU
  title: Structure Shift vs Liquidity Grab - ICT Concepts
  quote: you fail one side of the range you want to see the other side
- video_id: PlZD45uLPjE
  title: Seek & Destroy Profile - ICT Concepts
  quote: the first thing I do is identify deviations from the range
ambiguities:
- '''Consolidate around here'' for the accumulation phase has no width or duration bound.'
- The opening-price anchor here is the MIDNIGHT open (see daily-open-eighteen-hundred), which the
  later canon replaces with 18:00.
- Whether the manipulation must close beyond the opening price or merely trade beyond it is not stated.
