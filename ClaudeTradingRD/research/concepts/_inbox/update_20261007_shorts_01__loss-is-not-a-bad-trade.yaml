id: loss-is-not-a-bad-trade
name: A Loss Is Not A Bad Trade (data collection framing)
category: psychology
status: specified
voice: ttrades
definition: >
  Short cut from the same Q&A answer already in the library: a bad trade is not following rules;
  a rule-following loss is just the strategy; n must approach infinity before the distribution means
  anything; three losses in a row does not make the win rate zero; fear of losses causes
  undertrading; view each qualifying setup as data collection.
detection_rules:
- If the setup meets the model, take it, to collect the data point.
sources:
