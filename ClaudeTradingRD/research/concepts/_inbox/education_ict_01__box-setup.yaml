id: box-setup
name: Box Setup
aliases:
- the Box setup
- deviation from the range
category: entry
status: contested
definition: 'EARLIER RECORDING (old ''Education - ICT'' playlist; re-recorded later as HFfChGFHD44, the
  canonical reading). Same core - consolidation, aggressive move OUT of the range, aggressive move BACK
  IN, then trade the retest of the range edge - but three things differ from the later version. (1) He
  credits the model to a third party, ''Alex''s video on this'', which the later recording drops. (2)
  The stated rationale is power-of-three / AMD only; the later recording adds the deeper reason (this
  is what forms the higher-timeframe wick). (3) He adds a timing preference the later video does not carry:
  catch the retest EARLY, near the aggressive move, rather than waiting for the full retracement to the
  far edge, justified by which side of the curve price is on.'
timeframes:
  htf:
  - 4H
  - 1H
  - 15m
  ltf:
  - 5m
  - 1m
  - 15s
  fractal: true
preconditions:
- A consolidation range, or an old high/low, with resting liquidity beyond it.
- An aggressive move out of it followed by an aggressive move back into it.
detection_rules:
- Mark the consolidation range; bodies by default, wicks by discretion when the bodies do not fit.
- Require an aggressive move OUT (often evidenced by a fair value gap) and an aggressive move BACK IN
  (also a fair value gap) - the pair is the important part, not the consolidation itself.
- Entry on the retest of the range edge / previous low or high that was deviated through.
- Stop beyond the manipulation extreme; target the other side of the range or a higher-timeframe point
  of interest.
- Prefer to enter EARLY in the retracement rather than waiting for the far edge of the zone.
- 'Fallback when the bodies never closed back through: use the fair value gaps / BPR left by the return
  leg as the level.'
- 'Higher-timeframe use: run the same reading on the 4-hour or 1-hour purely for BIAS, looking only at
  displacement and lack of displacement.'
invalidation:
- No aggressive return into the range.
- Price is on the wrong side of the curve for the intended direction.
execution:
  bias: Opposite the deviation.
  entry: Retest of the deviated range edge, taken early.
  stop: Beyond the manipulation extreme.
  targets:
  - The other side of the consolidation
  - The higher-timeframe point of interest
measurable:
- fill rate and R of the early entry vs the far-edge entry on the same boxes
- how often price on the 'wrong side of the curve' runs through the level instead of reversing
- hit rate of the 4H/1H bias variant
