ambiguities:
- 'EVOLUTION, NOT CONTRADICTION: this is the EARLIER recording. It attributes the model to ''Alex'' and
  omits the HTF-wick rationale that the later HFfChGFHD44 makes central; it adds the enter-early preference
  that the later one omits. Both readings retained.'
- '''Aggressive'' remains unquantified in both directions.'
- The enter-early rule is justified by the curve but no rule locates the curve's midpoint (see market-curve-side).
- Bodies vs wicks for the range is explicitly discretionary.
