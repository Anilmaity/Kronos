id: htf-wick-formation
name: Higher-Timeframe Wick Formation
category: structure
status: underspecified
definition: 'Answering whether ''let the wick form'' can be reduced to time: no special time mystique
  - time only matters because it produces the higher-timeframe candles (9:30, 9:45, 10:00). The wick is
  judged formed when, after going into the area with a bias, price sweeps the previous candle and expands
  back with a close the other way.'
detection_rules:
- In the bias area, price sweeps the previous candle's extreme.
- Price then expands back and closes the other way -> wick formed; trade in that direction.
