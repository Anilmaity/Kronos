id: turtle-soup-sweep-entry
name: "Turtle Soup Conditions (and Why He Discourages It)"
aliases: ["turtle soup", "sweep entry with tight stop"]
category: entry
status: underspecified

definition: >
  The conditions he gives for a turtle soup: all timeframes aligned in one direction, plus the
  phases of price (for example a consolidation) so that a sweep is anticipated, then an entry
  taken at the sweep with a stop just beyond the sweep extreme. He says most people should avoid
  it because it is not easy, and separately calls out social-media traders who enter with a wide
  stop and then trail it down so the screenshot resembles a perfect turtle soup.

timeframes:
  htf: ["1D", "4H", "1H"]
  ltf: ["15m", "5m", "3m", "1m"]
  fractal: true

preconditions:
  - "All referenced timeframes point the same direction."
  - "A consolidation or similar phase makes a sweep of one side anticipated."

detection_rules:
  - "Identify the level expected to be swept."
  - "Enter at the sweep."
  - "Place the stop immediately beyond the sweep extreme, not at a distant level."

invalidation:
  - "Price closes beyond the swept level and expands, making it a break rather than a sweep."

execution:
  bias: "Opposite the swept side."
  entry: "At the sweep."
  stop: "Immediately beyond the sweep extreme."
  targets: ["The opposing side of the consolidation"]

measurable:
  - "hit rate of sweep entries with tight stops versus continuation entries on the same setups"

sources:
  - video_id: egV_gABTQks
    title: "(CPI) New York Open Live Q&A"

ambiguities:
  - "He does not say how far beyond the sweep the stop should sit, only that it must be tight."
  - "He recommends avoiding the setup without specifying who it is appropriate for."

python_detector: null
related: ["liquidity-sweep-vs-consolidation", "continuation-order-block", "inducement-equals-sweep"]
