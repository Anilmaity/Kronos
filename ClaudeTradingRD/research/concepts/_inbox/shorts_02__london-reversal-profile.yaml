ambiguities:
- The London hours are given twice, as "2:5" and as "2 to 5", with NO timezone attached anywhere in
  the clip and no a.m./p.m. marker. Read as 02:00-05:00 in the corpus's Eastern clock, but that is inference
  from the surrounding corpus, not from this Short.
- Whether the 2-to-5 window is a hard gate (nothing outside it counts) or a description of where the
  wick usually forms is not stated.
- '"Change the state of delivery or get a market structure shift ... however you define it" is said
  explicitly - he treats them as interchangeable here, which conflicts with videos that separate them.'
- The New York continuation has no start time attached in this clip.
