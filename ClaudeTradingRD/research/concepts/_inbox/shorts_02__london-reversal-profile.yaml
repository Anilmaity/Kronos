id: london-reversal-profile
name: London Reversal / New York Continuation
category: model
status: specified
definition: 'A Short equates the profile with a candle shape and, unusually for this corpus, attaches
  HOURS to the session: a London reversal is basically a classic expansion candle, and the manipulation
  leg is put in "during London or 2 to 5". Bullish: open, drop during London (2 to 5) to create the
  wick of the daily candle, change the state of delivery or get a market structure shift, and New York
  continues off London''s reversal. Bearish: open, high during London 2 to 5, CISD / MSS, New York continuation
  - completing the open-high-low-close of the daily candle. A second Short works it live on the 15-minute
  and 30-minute, and a third pairs it with the expansion-day test (small wick, large body) as the reason
  a New York continuation can be anticipated at all.'
timeframes:
  htf:
  - 1D
  ltf:
  - 30m
  - 15m
  fractal: false
preconditions:
- A daily directional read.
- The London window (2 to 5) is in play.
detection_rules:
- London window is given as 2 to 5.
- 'Bullish: open, then drop during London to create the daily candle''s wick.'
- Require a change in the state of delivery or a market structure shift out of that London extreme.
- New York then continues off London's reversal, completing the daily open-low-high-close (mirror for
  bearish).
- 'Worked live: if the 15-minute series of opposing candles is messy, step up to the 30-minute to get
  a clear series for the CISD.'
- Approaching New York, look for an opposing run back into the order block to get on side for the continuation.
- On an expansion day (small wick, large body), a London reversal licenses anticipating a New York continuation.
invalidation:
- London does not form the reversal - the day becomes a New York reversal or New York manipulation profile
  instead.
measurable:
- frequency of the daily extreme printing inside the 2-to-5 window
- continuation rate into New York after a London CISD
