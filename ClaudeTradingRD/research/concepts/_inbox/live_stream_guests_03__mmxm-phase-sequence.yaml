ambiguities:
- '''Significant low'' is not defined.'
- The kill zone is named (13:30 to the 16:00 equity close) but never stated as a hard filter on the
  entry.
- He says elsewhere in the same stream that he does not really form a daily bias, so the higher-timeframe
  array is the only directional input in the whole procedure.
