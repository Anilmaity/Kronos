id: daily-ohlc-candle-shape
name: OHLC / OLHC Daily Candle Shape
category: structure
status: contested
voice: ttrades
definition: 'Gold example: a bearish daily idea is not traded intraday because the current daily candle
  is ''by definition'' a doji (dogey), which does not support expansion lower; he wants it back to the
  open and prefers to wait for the daily close and trade the next day. A scalp back into the range would
  need refining in the T-spot, targeting the hourly gap.'
detection_rules:
- A daily candle forming as a doji does not support same-day expansion; defer the directional trade to
  the next day.
