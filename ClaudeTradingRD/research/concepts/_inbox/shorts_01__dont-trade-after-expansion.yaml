id: dont-trade-after-expansion
name: Trade the Expansion, Not After It
category: entry
status: specified
definition: 'SHORTS EVIDENCE, given as the diagnosis for a specific recurring complaint: ''why are you
  always getting caught in a consolidation?'' The answer is that the problem is not the lower timeframe
  at all - the trader is entering at the END of a higher-timeframe expansion candle, chasing a move
  that is already delivered. The remedy is stated as a three-step sequence: stop entering at the end
  of higher-timeframe candles, wait for the new one to open, let it form its wick, and only then trade
  it. The same logic is applied to a candle currently expanding against the intended direction - do
  not fight it; wait for it to close.'
preconditions:
- A higher-timeframe candle is currently in expansion.
detection_rules:
- Locate where price sits within the CURRENT higher-timeframe candle, not just on the entry timeframe.
- If price is at the end of that candle's expansion, do not enter.
- Wait for the higher-timeframe candle to close and the next one to open.
- Let the new candle form its wick, then trade its body.
- Do not trade back into a range against a candle that is still expanding away from it.
measurable:
- win rate bucketed by position within the higher-timeframe candle at entry time
- share of stop-outs occurring on entries taken in the final third of an HTF candle
