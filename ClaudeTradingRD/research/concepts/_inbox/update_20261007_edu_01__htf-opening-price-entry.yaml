id: htf-opening-price-entry
name: Enter Around The Higher-Timeframe Opening Price
category: entry
status: specified
voice: ttrades
definition: >
  Restated as the purpose of letting the wick form: once the wick is anticipated, enter around
  the opening price of the higher-timeframe candle so the position is on side for the body
  (the expansion). In the worked examples the ideal entry is described as near the opening
  price with the stop on the anticipated wick, and the wick should be formed early in the candle.
detection_rules:
  - "Anticipate the wick (protected swing / IC-CISD) first."
  - "Prefer the entry when it is still near the higher-timeframe opening price; the wick should form early in the candle."
execution:
  bias: "Direction of the higher-timeframe candle."
  entry: "Near the HTF opening price after the wick forms."
  stop: "On the anticipated wick."
  targets: ["2R", "range high / low"]
sources:
  - video_id: RX8vtP3PLYk
    title: "Let The Wick Form, Trade The Body (Stop Getting Stopped Out)"
    quote: "Let the wick form, enter around the opening price"
  - video_id: RX8vtP3PLYk
    title: "Let The Wick Form, Trade The Body (Stop Getting Stopped Out)"
    quote: "we want to be able to enter around the opening price"
ambiguities:
  - "'Around' / 'near' is still not bounded in this video."
related: ["wick-trust-test", "ic-cisd", "time-based-exit-htf-close"]
