id: mitigation-block
name: Mitigation Block
aliases:
- mitigation block entry
category: entry
status: contested
definition: 'EARLIER RECORDING (old ''Education - ICT'' playlist). A candle-level, not swing-level, definition
  used purely as a trend-continuation entry. In a bearish trend: an UP-close (green) candle prints inside
  the move; when the LOW of that candle is broken, the candle becomes a mitigation block and its HIGH
  must not subsequently be invalidated. The entry is the retest of that high, or of the candle''s opening
  price; the stop sits just beyond the high. Bullish mirrors with a down-close candle whose high is broken.
  He also pairs it with a fair value gap - the CPI trade review enters on a fair value gap that overlaps
  a mitigation block.'
timeframes:
  htf:
  - 15m
  - 5m
  ltf:
  - 1m
  - 30s
  - 15s
  fractal: true
preconditions:
- An aggressive trend toward an objective is already established (see trend-as-aggressive-move-to-objective).
- The trend is judged too fast to retrace to an OTE, which is why this entry is used at all.
detection_rules:
- 'Bearish: find an up-close candle inside the down leg. Wait for a later candle to trade below that candle''s
  LOW.'
- Once its low is broken, the candle is a mitigation block and its HIGH is the invalidation level.
- 'Entry option A: limit at the block''s high on the retest.'
- 'Entry option B: limit at the block''s opening price.'
- Level choice follows wick-vs-body-marking-rule - very small body -> use the wicks; clustered candles
  -> use the opening price.
- 'Entry option C: drop to a 15- or 30-second chart and take a fair value gap / model inside the block.'
- Stop just beyond the block's high (bearish) or low (bullish).
- 'Bullish mirrors: down-close candle whose HIGH is broken; its LOW must not be invalidated.'
invalidation:
- Price closes beyond the block's protected extreme (the high in the bearish case).
execution:
  bias: With the prevailing trend.
  entry: Retest of the block high / opening price, or a LTF model inside it.
  stop: Just beyond the block extreme.
  targets:
  - The trend's objective (HTF point of interest or liquidity pool)
measurable:
- hit rate of the block-high retest vs the opening-price entry on the same blocks
- how often the protected extreme is invalidated after the low is broken
- R achieved by the LTF-model-inside-the-block variant vs the plain limit
