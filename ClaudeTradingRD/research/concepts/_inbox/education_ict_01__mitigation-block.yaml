ambiguities:
- 'EVOLUTION / DIVERGENCE, NOT CONTRADICTION: the library already holds two readings of this id - a four-point
  swing sequence with no sweep, and a guest''s ''up-close candle that traded into fair value''. This EARLIER
  TTrades recording is a third, purely candle-level reading with a break-the-low trigger. All three are
  kept; none supersedes the others on the evidence here.'
- '''Aggressive trend'' is the gate for choosing this entry and is never quantified.'
- No rule chooses between the block-high entry and the opening-price entry beyond the wick/body test.
- Whether the break of the candle's low must be a close below or a wick below is not stated.
