id: currency-pairing-opposition
name: Pair a Strong Currency Against a Weak One, Never Against a Consolidating One
category: structure
status: specified
voice: ttrades
definition: >
  DXY daily example: with a bearish dollar read (C2 closure at a relevant range high, small
  hourly wick expected), he does not short the dollar itself but longs a foreign currency -
  checking that EURUSD shows the same structure (swept previous low, breaking out) before
  entering with the stop on that low.
detection_rules:
  - "Form the bias on DXY; execute on the counter currency (EURUSD) after confirming it mirrors the structure."
sources:
  - video_id: cWDnzI3lpUk
    title: "How to Trade With a 9-5 Job (TTrades Fractal Model Explained)"
    quote: "I would want to long a foreign currency."
ambiguities:
  - "Why EUR rather than another counter currency is not justified in this example."
related: ["relative-strength-weakness"]
