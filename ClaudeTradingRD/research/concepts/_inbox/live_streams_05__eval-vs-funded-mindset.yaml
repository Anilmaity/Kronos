id: eval-vs-funded-mindset
name: Trade The Evaluation The Way You Will Trade The Funded Account
aliases:
- trading to pass vs trading not to fail
category: psychology
status: specified
definition: 'The diagnosis offered to a trader who passes evaluations but cannot reach a payout: on
  the evaluation you are trading to pass, and on the funded account you switch to trading not to fail.
  The prescription is to trade the evaluation exactly as the funded account will be traded, minus
  the risk, so that no behavioural switch happens at funding. The named failure mode is going into
  capital preservation and becoming too conservative once funded.'
timeframes:
  htf:
  - 1D
  ltf:
  - 5m
  fractal: false
preconditions:
- A prop evaluation or funded account.
detection_rules:
- Run the same process, setups and frequency on the evaluation as on the funded account.
- Differ only in risk size.
- Treat a switch to capital preservation after funding as the error to correct.
invalidation:
- Not applicable - a behavioural rule.
measurable:
- trade count and average R, evaluation phase vs funded phase, per trader
