id: swing-forming-candle-selection
name: Ignore Candles That Do Not Form A Swing
category: structure
status: specified
definition: 'Corroborated live and stated as an explicit instruction rather than a habit. Looking for
  a 15-minute protected swing under a 4-hour read, the area is messy: he says outright that this is
  when he ignores those small candles and takes the whole move up as the series instead. The operational
  consequence is stated immediately after - price makes a new high, he asks where the series of candles
  that made that high is, confirms a close below it, and that gives the protected swing and therefore
  the invalidation.'
timeframes:
  htf:
  - 4H
  ltf:
  - 15m
  fractal: true
preconditions:
- A higher-timeframe level has been reached (previous range high, into a fair value gap).
- The paired lower timeframe is being read for a protected swing.
detection_rules:
- When the lower-timeframe area is messy, ignore the small candles and treat the whole move as the series.
- After a sweep of the high, identify the series of candles that made that high.
- Require a close below that series; that yields the protected swing and the invalidation.
- Enter on the close - a reversal entry, taken because no continuation exists yet in the model.
invalidation:
- Price trades back through the protected swing formed by the selected series.
measurable:
- difference in stop distance between the whole-move series and the strict candle-by-candle series
- stop-out rate under each series-selection convention
sources:
- video_id: 9jvWodPJgVI
  title: How a Protected Swing Confirms a Reversal Entry
  quote: That is when I'm going to ignore those small candles
- video_id: 9jvWodPJgVI
  title: How a Protected Swing Confirms a Reversal Entry
  quote: I'm just going to take this whole move up
ambiguities:
- '"Messy" and "small candles" are the trigger and are not defined - no candle-count, no range test.'
- Taking "this whole move" as the series necessarily widens the stop, and the clip does not address
  the risk-to-reward consequence.
- He notes the entry is a reversal because there are no continuations in his model for a proper framework
  here, but does not say whether that downgrades the trade.
