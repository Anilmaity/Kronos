ambiguities:
- The auto-captioner renders 'break of structure' as 'breaker structure' and once as 'brachet structure';
  it is read as break of structure throughout.
- '''Break of structure'' is never given a swing-confirmation rule here - which swing must be closed
  through, and whether a wick through counts, is not stated.'
- 'The two validations are not reconciled: the structural version requires a break of structure,
  the candle version requires only a close beyond the block''s opening price.'
- Choice among opening price / wick / wick-to-open is explicitly delegated to the trader, so the
  level is not uniquely determined by the source.
- '''Important level'' is enumerated by example (fair value gap, prior high/low) but not defined
  or ranked.'
