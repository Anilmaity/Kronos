definition: 'Worked live: the day''s profile was bullish (opened low first, then traded higher), so a
  bearish reversal on YM was only expected to take price back into the range toward the daily open, not
  to ''rip''; he therefore did not trust it as a short framework. Later a news candle (~100 NQ points)
  drove price into the daily open, which he names as what would have been the target.'
