ambiguities:
- '''Significant high'' is not defined here; it is presumably the relevant-swing test from the companion
  video, but he does not say so.'
- '''Three candles of expansion'' is stated on one example, and elsewhere in the corpus the same count
  appears as a cue rather than a rule.'
- Which timeframe supplies the 'higher timeframe objective' is left to the top-down read.
