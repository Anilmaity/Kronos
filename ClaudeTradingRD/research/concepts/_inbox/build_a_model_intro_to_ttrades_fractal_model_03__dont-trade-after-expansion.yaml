id: dont-trade-after-expansion
name: Trade the Expansion, Not After It
aliases:
- a higher time frame target has already been taken
- reason number three
category: entry
status: contested
definition: 'The third of three named reasons continuations fail, framed here as a FOMO trap: a higher-timeframe
  target has already been taken, the trader who missed the move sees a fresh continuation print, enters,
  and is stopped out. His account is that hitting a higher-timeframe target is precisely when a new
  phase of price can begin, and that such a continuation is often simultaneously setting up an opposing
  change in the state of delivery. The disqualifier is stated with a count in the closing example
  - one, two, three candles of expansion plus a significant high taken - after which he will not look
  for continuations at all. He states plainly that missing moves is acceptable.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- A continuation has formed.
detection_rules:
- Before entering, check whether a higher-timeframe objective has already been reached.
- If it has, do not look for a continuation in the same direction - a new phase of price is due.
- 'Count expansion candles: roughly three candles of expansion INTO a significant high or low is the
  stated disqualifier.'
- Read a continuation printing at an already-hit objective as a candidate opposing CISD rather than
  as an entry.
- Accept the missed move rather than chasing it.
invalidation:
- Not applicable - this is an avoidance filter.
measurable:
- win rate of continuations taken at vs away from an already-hit HTF objective
- frequency of an opposing CISD forming within N candles of an objective being hit
