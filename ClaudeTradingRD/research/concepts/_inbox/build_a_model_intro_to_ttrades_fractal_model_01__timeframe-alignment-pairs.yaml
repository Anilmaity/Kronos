ambiguities:
- The pairing is stated as a fixed table but is also allowed to flex by one step for cleanliness
  - no rule says when flexing is permitted.
- The 4-hour -> 15-minute pairing skips the hourly, while the daily -> hourly pairing skips the 4-hour;
  the ratio between pairs is therefore not constant.
