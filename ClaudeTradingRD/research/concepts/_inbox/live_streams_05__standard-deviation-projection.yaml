id: standard-deviation-projection
name: Standard Deviation Projection Of The Manipulation Leg
aliases:
- projections
category: entry
status: underspecified
definition: In the indicator the projections are an optional overlay, off until enabled. Measured
  from the wicks by default, with a setting to measure from the bodies instead. The levels he names
  while pointing at them on screen are 2, 2.5 and 4. He keeps them off personally because they distort
  the scale of his other drawings.
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  fractal: true
preconditions:
- A printed model with a measurable manipulation leg.
detection_rules:
- Projections are measured from the wicks by default.
- A setting switches the measurement to the bodies.
- The drawn levels are 2, 2.5 and 4.
invalidation:
- Not applicable - a projection overlay.
measurable:
- hit rate of the 2, 2.5 and 4 levels per instrument
- difference in hit rate between wick-measured and body-measured projections
sources:
- video_id: sdZkE-naNiY
  title: TTrades Indicator Updates - Walkthrough and Q&A
  quote: Two to two and a half. There's your four.
ambiguities:
- The leg the projection is measured from is not named in this video.
- Whether 3 exists as a level between 2.5 and 4 is not said; only 2, 2.5 and 4 are spoken.
- He does not use them himself, so no rule ties a projection level to a target choice here.
