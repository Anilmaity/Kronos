id: fractal-model-c4
name: "Candle 4 (second continuation candle)"
aliases: ["C4"]
category: model
status: specified

definition: >
  A direct correction of a viewer who asked whether candle 2 closure is enough or whether he
  also needs to learn candle 3 and candle 4. The answer contains the clarification: candle 3
  and candle 4 come after a candle 2 closure so they do have to be learned, but there is no
  such thing as a candle 4 closure. Candle 4 is a position in the sequence - the second
  continuation candle - not a defined closure pattern the way candle 2 and candle 3 are. It is
  used positionally elsewhere in the unit: the 4-hour candle being a candle 4 inside a daily
  candle 3 is part of what he calls a clean day, and a day already in candle 4 is a reason to
  stand aside and wait for a new swing point.

timeframes:
  htf: ["1D", "4H"]
  ltf: ["1H", "15m"]
  fractal: true

preconditions:
  - "A candle 2 closure exists and candle 3 has followed it."

detection_rules:
  - "Candle 4 is the candle following candle 3 in the same sequence - a positional label only."
  - "There is no candle 4 closure; do not look for a closure pattern to define it."
  - "A 4-hour candle 4 inside a daily candle 3 is one of the alignment criteria for a clean day."

invalidation:
  - "The sequence's protected swing is taken out."

measurable:
  - "expectancy of candle 4 continuations vs candle 3 continuations"

sources:
  - video_id: N3Ml-r0X30o
    title: "New York Open Live Q&A"
    quote: "But there is no candle four closure."

ambiguities:
  - "He does not say where the sequence terminates - whether candle 5 and beyond are simply counted on or whether the numbering resets."
  - "The 4-hour candle-count he reads on air ('candle two, three, four, five... already went lower') implies counting past 4, contradicting the way candle 4 is treated as the last continuation elsewhere."

python_detector: null
related: ["fractal-model-c2", "fractal-model-c3", "clean-day-criteria", "expansion-exhaustion-avoid-price"]

