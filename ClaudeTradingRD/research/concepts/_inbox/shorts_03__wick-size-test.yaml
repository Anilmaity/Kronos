ambiguities:
  - "NO NUMERIC THRESHOLD IS GIVEN ANYWHERE IN THIS UNIT. 'Large' and 'shallow' are labels
    applied to a run by eye; there is no ratio, percentage, fib level or bar count."
  - "'A bunch of time and a bunch of range' is the only stated measurement basis and it is
    stated once, informally, in a 37-second clip."
  - "Two different reference denominators are implied and never reconciled: the run measured
    against the candle's own body (large wick / small body) and the run measured against the
    candle's elapsed time. Either could be the operative one."
  - "Whether the wick is measured to the extreme's wick tip or to the body edge is not stated."
  - "The Shorts never state whether the same threshold applies across timeframes, though the
    concept is used identically on daily, 4-hour and hourly candles."
  - "TRANSCRIPT HYGIENE: these are auto-captions; 'reach' is rendered 'wretch' elsewhere in the
    corpus and 'candle 2' as 'candle to'. Neither artifact affects the quotes cited here."

