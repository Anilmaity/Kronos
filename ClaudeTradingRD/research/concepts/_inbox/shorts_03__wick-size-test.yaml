id: wick-size-test
name: How Wick Size Is Judged (the wick is the opposing run)
aliases:
  - shallow run vs large opposing run
  - large wick and a small body
  - wick size
category: structure
status: underspecified

definition: >
  The Shorts state, more directly than the long-form lessons, what the "wick" being sized
  actually is and by what evidence it is called small or large. The wick is the OPPOSING RUN
  the candle makes before it turns: on a bearish frame the area from the turn back up to the
  high IS the wick. Sizing it is a binary label applied to that run - it is either a "shallow
  run" (small wick) or a "large opposing run" (large wick). The stated evidence for calling a
  run large is that it consumed a large amount of time and a large amount of range measured
  from the candle's open to its extreme; the resulting candle then has a large wick and a
  small body, which is the reversal-candle signature and the opposite of the expansion
  signature. No numeric ratio, percentage or bar count is given in any of the sixty Shorts in
  this unit - the label remains a relative visual judgement against the candle's own body and
  against the time available in the candle.

timeframes:
  htf: ["1D", "4H", "1H"]
  ltf: ["15m", "5m", "1m"]
  fractal: true

preconditions:
  - A candle on the working timeframe whose extreme has (or may have) formed.
  - The lower-timeframe path inside that candle is available, since the judgement is made on
    the run from the open to the extreme, not on the finished OHLC alone.

detection_rules:
  - "Identify the opposing run: the leg from the candle's open to its extreme, before the turn.
    That leg is the wick."
  - "Ask the binary question stated in the source: is this a shallow run, or a large opposing
    run?"
  - "Evidence for LARGE: the run consumed a large amount of range from open to extreme, and it
    consumed a large amount of the candle's available time."
  - "Resulting shape test on the closed candle: large wick with a small body = reversal candle;
    small wick with a large body = expansion candle."
  - "Consequence, small wick: expansion is supported in the direction away from the wick."
  - "Consequence, large wick: do not expect expansion; adjust targets (see
    large-wick-target-adjustment)."

invalidation:
  - "Not applicable - this is a classification test, not a setup. Its output feeds the
    expansion / target-adjustment decision."

measurable:
  - "distribution of wick-length / body-length ratio on candles he labels 'small wick' vs
    'large wick' in the annotated examples"
  - "distribution of the fraction of the candle's elapsed time consumed by the opposing run,
    on candles labelled shallow vs large"
  - "expansion rate in the wick's opposite direction, bucketed by that ratio"

