id: small-wick-expansion-rule
name: Small Wick Supports Expansion; Large Wick Waits for Candle 3
aliases:
- wick size matters
- expansion candle
- reversal candle
- shallow opposing run
- large opposing run
- supports expansion
category: model
status: contested
definition: 'The dedicated teaching video for the filter, and the closest the corpus comes to defining
  ''small''. An expansion candle has a small wick on both sides and a large body; a reversal candle
  has a large wick and a small body. Crucially the size test is TWO-DIMENSIONAL and both dimensions
  are relative to the candle itself: the opposing run must consume only a small amount of the candle''s
  RANGE and only a small amount of its TIME. The stated mechanism is that the extreme must form early
  into the candle so that the remainder of the time period is left for price to expand and close near
  its high or low. A large opposing run is described once, on a worked example, as using ''almost
  half the time and quite a bit of range''. No ratio, fraction or percentage is ever given for either
  axis.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- A higher-timeframe candle is open or has just closed and its opposing run can be measured.
- A directional bias exists, so the opposing side is defined.
detection_rules:
- opposing_run := from the candle's opening price to the extreme against the intended direction (his
  own definition of the term).
- 'Grade the opposing run on two axes at once: fraction of the candle''s range consumed, and fraction
  of the candle''s time period consumed.'
- 'Expansion candle (small wick): the extreme forms early into the candle, uses little range, the
  body is large, and the candle closes near its high or low.'
- 'Reversal candle (large wick): the run uses most of the candle''s time period and most of its range;
  the body is small; the candle returns toward its opening price.'
- '''Almost half the time and quite a bit of range'' is the one worked description of a large opposing
  run.'
- 'A large-wick candle is not traded for expansion: wait for the next higher-timeframe candle open
  and require a small wick there (candle 3), then trade the expansion.'
- 'Time-remaining check: if too little of the candle''s period remains for the expansion to complete,
  do not take it - he rejects a setup with 40 minutes left in an hourly candle.'
- On a large-wick candle the targets change - see reversal-candle-target-adjustment.
- 'Small wick alone is not sufficient: it must be paired with a lower-timeframe change in the state
  of delivery before the wick counts as confirmed.'
invalidation:
- The candle extends its opposing run, converting a small wick into a large one before the close.
- The candle closes with a large wick - the expansion reading is dead and the next candle open becomes
  the reference.
execution:
  bias: Direction of the body expansion away from the opposing run.
  entry: Inside a small-wick candle after the lower-timeframe CISD confirms the wick; otherwise at
    the next higher-timeframe candle open (candle 3).
  stop: Beyond the confirmed wick extreme.
  targets:
  - expansion targets
  - liquidity points
  - the average candle's range
measurable:
- wick-to-range ratio distribution of candles he calls expansion vs reversal candles
- time-to-extreme as a fraction of the candle period, split by outcome
- close-in-extreme-third rate conditioned on wick-to-range ratio buckets
sources:
- video_id: SlWxhzhLo3A
  title: 'Wick Size Matters: The Key to Understanding Reversal and Expansion Candles'
  quote: it has a small wick on both sides and a large body
- video_id: SlWxhzhLo3A
  title: 'Wick Size Matters: The Key to Understanding Reversal and Expansion Candles'
  quote: This small wick supports expansion because it is making a shallow opposing run.
- video_id: SlWxhzhLo3A
  title: 'Wick Size Matters: The Key to Understanding Reversal and Expansion Candles'
  quote: We use almost half the time and quite a bit of range
- video_id: SlWxhzhLo3A
  title: 'Wick Size Matters: The Key to Understanding Reversal and Expansion Candles'
  quote: we don't use much range there, but also we don't use much time
- video_id: SlWxhzhLo3A
  title: 'Wick Size Matters: The Key to Understanding Reversal and Expansion Candles'
  quote: Yes, we have a small wick relative to the daily range.
ambiguities:
- THE THRESHOLD IS STILL NOT GIVEN. This is the corpus's dedicated wick video and it supplies no wick-to-body
  or wick-to-range ratio. 'Almost half the time and quite a bit of range', said of one large opposing
  run, is the single most specific statement in the corpus and it is a description of an example,
  not a rule.
- The two axes (time consumed and range consumed) are never weighted against each other; a candle
  small in range but slow in time is not adjudicated.
- One grading is made 'relative to the daily range' while the candle being graded is an hourly, so
  the reference range is not consistently the candle's own.
- The PDF says small wick 'on both sides' but every worked example grades only the opposing side.
- '''Early into the candle'' is never converted to a fraction of the period; the only numeric trace
  is a rejection with 40 minutes left in an hourly candle.'
- CONTESTED against the outcome-based reading elsewhere in the corpus ('expansion candles are objective
  - did price expand?'). This video adjudicates in favour of the shape-based reading, because here
  the classification is made on a still-forming candle in order to decide whether to trade it, which
  the outcome-based test cannot do.
