id: fractal-model-c2
name: Candle 2 Closure (the reversal candle)
category: model
status: specified
definition: 'SHORTS EVIDENCE. The cleanest, most compressed statement of the C2 test in the corpus,
  with worked negative examples. A candle 2 closure requires price to take out its PREVIOUS CANDLE''S
  high and then close back BELOW it (bearish), or take out the previous candle''s low and close back
  ABOVE it (bullish). The negative test is stated twice on chart: a swing point where price swept the
  previous high but never closed back below it is NOT a candle 2 closure and is removed. Confirmation
  of a daily C2 is taken on the aligned lower timeframe as a change in the state of delivery, and the
  concept is explicitly fractal - the same C2-at-a-point-of- interest pattern appears on the hourly
  chart and marks where the high of day forms.'
preconditions:
- A completed previous candle with a defined high and low on the same timeframe.
- 'For the fractal/hourly application: the sweep occurs at a point of interest.'
detection_rules:
- 'Bearish C2: high[i] > high[i-1] AND close[i] < high[i-1].'
- 'Bullish C2: low[i] < low[i-1] AND close[i] > low[i-1].'
- A sweep of the previous extreme WITHOUT the close back inside is not a C2 - discard it.
- Validate a higher-timeframe C2 by finding a change in the state of delivery on the aligned lower timeframe.
- After a valid C2, price must continue to respect the previous candle's range for the read to stand.
- 'Fractal: the same test on the hourly chart at a point of interest marks the candidate high (or low)
  of day.'
- An 'ideal' C2 is one where the closure also protects a swing - it closes over the down-close candles
  into the fair value gap, leaving that low protected.
invalidation:
- Price fails to respect the previous candle's range after the C2 closure.
measurable:
- share of C2 closures followed by a C3 continuation in the same direction
- hit rate of 'high of day' when an hourly C2 forms at a point of interest
