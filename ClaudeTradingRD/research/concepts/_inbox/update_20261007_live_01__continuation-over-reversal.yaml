id: continuation-over-reversal
name: Continuation Over Reversal
category: model
status: contested
voice: ttrades
definition: Stated twice in this stream. He declines a technically valid 15m/1m SMT reversal off the previous 4-hour
  high because he is a continuation trader, not a reversal trader; asked why he does not trade reversals, the reason
  given is win rate - he prefers a higher win rate and says continuations have a higher win rate than reversals.
detection_rules:
- Do not take the reversal off an SMT at a high; wait for a continuation after it.
