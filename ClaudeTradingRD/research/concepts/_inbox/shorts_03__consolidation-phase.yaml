    quote: "that is following a large range or after price reaches an important level"
  - video_id: yfj10dtkRKY
    title: "Understanding When Consolidation Happens"
    quote: "If the low of the range gets taken out first, that is generally bullish"
  - video_id: yfj10dtkRKY
    title: "Understanding When Consolidation Happens"
    quote: "the only time the range doesn't have to get taken out"
  - video_id: -YZBFoNfeUA
    title: "Understanding Price Inside a Consolidation"
    quote: "price hasn't traded below this low, and price hasn't traded above this high"
  - video_id: -YZBFoNfeUA
    title: "Understanding Price Inside a Consolidation"
    quote: "Price is pretty lethargic, right? It's just hanging around."

ambiguities:
  - "DIRECT TENSION WITH THE LIBRARY'S EXISTING RULE. The library holds that the manipulated
    side is chosen BY BIAS (bullish requires the low to be run). This Short reads the direction
    OFF the side that is taken first, with no prior bias needed. Both readings are the channel
    owner's own voice. They are not reconciled anywhere in this unit."
  - "'For a period of time' is still unbounded - no minimum bar count or duration."
  - "'Generally bullish' / 'generally bearish' are hedged, and no condition is given for when
    the generalisation fails."
  - "'A large range' as the precondition is not quantified."
  - "In the second Short he says he does not need to catch the sweep at all because he prefers
    continuations, which is a third interaction mode not integrated with the other two."

