id: swing-point
name: Swing High / Swing Low
aliases:
- swing High
- swing low
- let's see if a swing forms
category: structure
status: contested
definition: 'The market structure video treats swing formation as a timing problem rather than a
  definition problem: it names the liquidity video as the prerequisite for the swing definition itself,
  and then spends the walkthrough on when a swing may be USED. Two statements matter. First, a higher
  high can be recorded as soon as price trades above the prior high, even if the swing high containing
  it has not formed yet - he says so explicitly and then narrates ''let''s see if a swing forms''
  bar by bar. Second, he filters: highs and lows made inside a leg that get swept before price continues
  are not counted, and the comparison is made against the prominent prior extreme.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- The 3-bar swing definition from the liquidity video is assumed known.
detection_rules:
- A higher high / lower low may be registered on the trade beyond the prior extreme; the SWING itself
  is only usable once the right-hand bar has formed.
- Interior highs and lows that are swept before price continues are not counted as structure.
- Comparison is always made against the prominent prior extreme, not the nearest one.
- A candidate structure break is rejected when there is no swing to break, even where a higher high
  exists.
invalidation:
- Not applicable - this is a primitive.
measurable:
- count of 3-bar fractal swings vs the count he actually marks on the same chart window
- effect on structure-shift counts of requiring the right-hand bar before use
sources:
- video_id: sgAnVR6RSDg
  title: Understanding Market Structure For Trading
  quote: a higher high even if we have not formed a swing High yet
- video_id: sgAnVR6RSDg
  title: Understanding Market Structure For Trading
  quote: those get swept out before we go
ambiguities:
- The gap between the unfiltered 3-bar fractal and the swings he actually uses is restated but still
  not closed - no separation, range or lookback filter is given.
- He both registers a higher high before a swing confirms and rejects a shift because 'we don't have
  a swing we break' - the two are used in the same walkthrough without a rule reconciling them.
- Wicks vs bodies for swing detection is not stated (the chart work uses wicks).
python_detector: null
