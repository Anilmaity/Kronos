id: fair-value-gap
name: Fair Value Gap (FVG)
category: structure
status: specified
definition: Defined mechanically and then given its purpose in one clause. A fair value gap is a three-candle
  pattern in which the wick of the FIRST candle and the wick of the THIRD candle do not overlap - and
  the reason it matters is that the non-overlap SHOWS AGGRESSIVE PRICE ACTION through that area. That
  last clause is the closest thing in the corpus so far to an operational test for the word "aggressive",
  which is used as a gate in several other concepts without definition.
timeframes:
  htf: []
  ltf: []
  fractal: true
preconditions:
- Three consecutive candles on any timeframe.
detection_rules:
- FVG := a three-candlestick pattern in which the wick of candle 1 and the wick of candle 3 do not overlap.
- The gap is measured on the WICKS, not the bodies, in this statement.
- 'Interpretation: the non-overlap is evidence of aggressive price action through that area.'
- A fair value gap is the corpus's "internal liquidity".
invalidation:
- The first and third candle wicks overlap - no gap.
measurable:
- count of FVGs per session per timeframe under the wick-based definition
- rebalance rate of wick-defined FVGs versus body-defined ones
sources:
- video_id: Ix8l6yDRpp8
  title: Relationship between External and Internal Liquidity
  quote: It is just a three candlestick pattern in which the wick of the first candle
- video_id: Ix8l6yDRpp8
  title: Relationship between External and Internal Liquidity
  quote: showing aggressive price action through this area
ambiguities:
- 'The "aggressive" clause is descriptive, not a threshold: it says a non-overlap SHOWS aggression,
  not how much aggression, and it does not license reading "aggressive" elsewhere in the corpus as "there
  is an FVG". Treat it as the nearest available proxy, not a definition.'
- No minimum gap size is given.
- The clip does not say whether the middle candle must displace, or in which direction.
- It conflicts in emphasis with library entries that measure the gap between bodies; this Short says
  wicks explicitly.
