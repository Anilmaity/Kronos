id: cross-asset-reversal-confirmation
name: The Strongest Asset Must Reverse for the Weakest to Expand
category: structure
status: contested
voice: ttrades
aliases:
- weakest asset forming a reversal
definition: 'Worked live on NQ/ES/YM at the 9:30 open. NQ was strongest, YM weakest, ES choppy. Rather than trade
  the strongest into its equal highs directly, he waited for the weakest asset (YM) to form a reversal off its low,
  stating the confirmation as a 5-minute closure over; once YM closed through, NQ ran out the equal highs and the
  previous highs. He restates the logic for chat: when the weakest of correlated markets reverses, that is usually
  when the strongest starts to trend, because they then all align. Later in the session the mirror continuation
  case is shown: YM fails to manipulate (does not reverse off) its previous low and continues through the 9:30 lows,
  and ES/NQ follow it lower.'
timeframes:
  htf:
  - 30m
  - 15m
  ltf:
  - 5m
  - 1m
  fractal: true
preconditions:
- Correlated assets ranked strongest / weakest on the session.
- The weakest asset is at a low (for a long on the strongest).
detection_rules:
- 'For a long on the strongest asset: wait for the weakest asset to form a reversal off its low.'
- Confirmation of that reversal in the worked case = a 5-minute candle closing over (through the opposing series)
  on the weakest asset.
- After the confirmation, target the strongest asset's equal highs / previous highs.
- 'Continuation mirror: if the weakest asset fails to reverse at its low and continues through it, expect the other
  assets to follow lower.'
invalidation:
- The weakest asset does not get the 5-minute closure through - the strongest-asset long is not timed.
measurable:
- lag between the weakest asset's 5m reversal closure and the strongest asset taking its highs
- hit rate of strongest-asset target after a weakest-asset 5m closure vs without
sources:
- video_id: ES-R3ByDYrY
  title: TTrades MNQ Cup - Morning Session
  quote: So we want to see a 5minute closure over
- video_id: ES-R3ByDYrY
  title: TTrades MNQ Cup - Morning Session
  quote: You want to wait for the weakest one to form a reversal
- video_id: ES-R3ByDYrY
  title: TTrades MNQ Cup - Morning Session
  quote: YM failing to manipulate this previous low
ambiguities:
- Which level the 5-minute closure must pass (opening price of the down-close series, or a swing) is not stated
  explicitly; 'closure through' is used.
- Only one live instance; the strength ranking itself switched twice in the first 15 minutes.
related:
