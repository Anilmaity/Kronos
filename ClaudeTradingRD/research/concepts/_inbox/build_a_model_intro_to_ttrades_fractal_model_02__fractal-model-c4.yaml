ambiguities:
- '''Strong closure'' / ''closes strong'' in candle 3 is the gate for taking candle 4 and is never quantified.'
- The half-of-range test is stated against candle 3's RANGE in the candle 4 video, but the same speaker
  elsewhere in this unit measures halves against bodies ('the upper half of this from body to body').
  No rule says which to use when they disagree.
- Nothing states an upper limit on continuations -- candle 5 is mentioned once in passing in 9AL41xON3hA
  without being defined.
