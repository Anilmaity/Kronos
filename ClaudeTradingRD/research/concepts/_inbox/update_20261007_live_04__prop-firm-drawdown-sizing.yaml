id: prop-firm-drawdown-sizing
name: Prop Firm Sizing Off The Drawdown
category: risk
status: contested
voice: ttrades
definition: Trailing-drawdown rule with arithmetic. On a $1,500 trailing drawdown, risking $700 per trade
  means a $1,500 gain followed by a give-back to break-even ends the account, whereas risking $100 leaves
  $1,400 of buffer. On trailing (especially intraday-trailing) accounts risk less per trade and get leverage
  by running more accounts instead.
detection_rules:
- 'If account drawdown is trailing/intraday-trailing, cap per-trade risk at a small fraction of the drawdown
  (example: $100 of $1,500).'
- Scale exposure across multiple accounts rather than raising per-account risk.
ambiguities:
- No explicit percentage of drawdown is stated beyond the $100/$1,500 example (~6.7%).
sources:
