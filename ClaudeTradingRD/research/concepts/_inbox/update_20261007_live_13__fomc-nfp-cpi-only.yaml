id: fomc-nfp-cpi-only
name: "Only Three Releases Are Tracked; Never Trade After FOMC"
category: time
status: contested
voice: ttrades
definition: >
  Restated as 'don't trade right before' FOMC, NFP or CPI, and otherwise no news matters; orange
  folder news is ignored. New secondary list: crude oil inventories (normally 10:30) matter only
  when trading oil; bond auctions 'sometimes'; and a Fed chair speech.
detection_rules:
  - "Do not enter shortly before an FOMC, NFP or CPI release."
  - "Ignore orange-folder (medium) news."
  - "If trading crude oil, also treat the 10:30 crude oil inventories release as a news event."
  - "Bond auctions and Fed chair speeches are optional secondary events."
measurable:
  - "crude-oil intraday entries taken before vs after the 10:30 inventories release"
sources:
  - video_id: wa9m30UHrm0
    title: "New York Open Live Q&A"
    quote: "FOMC, NFP, CPI. Don't trade right before it. Otherwise, I do not care."
  - video_id: wa9m30UHrm0
    title: "New York Open Live Q&A"
    quote: "Don't care about orange orange folder news."
  - video_id: wa9m30UHrm0
    title: "New York Open Live Q&A"
    quote: "The only other news I'd care about is crude oil inventories."
  - video_id: wa9m30UHrm0
    title: "New York Open Live Q&A"
    quote: "And that would be normally at 10:30. And that's only if I'm"
  - video_id: wa9m30UHrm0
    title: "New York Open Live Q&A"
    quote: "you can care about bond auctions sometimes."
ambiguities:
  - "Caption 'trading red older days' = red folder days."
  - "'Right before' is not quantified (minutes vs the session before); conflicts with other units that avoid the whole release day."
  - "'when Fed speaker. Not Powell anymore' - the chair is meant; name not given."
related: ["economic-calendar-filter", "pre-event-avoidance-rule"]
