id: loss-is-not-a-bad-trade
name: "A Loss Is Not A Bad Trade (data collection framing)"
aliases: ["a bad trade is not following rules", "n approaching infinity"]
category: psychology
status: specified

definition: >
  His answer to a viewer who described undertrading because he was "only taking bad trades": a
  loss does not equal a bad trade — a bad trade is one that did not follow the rules. A trade
  that met the model and lost is simply the model being followed. He then makes the statistical
  version of the point: you need n to approach infinity before the distribution of outcomes
  means anything, three losses in a row does not make the win rate zero, and until enough trades
  are collected the sample is just random dots. The prescription is to stop scoring individual
  trades as win or lose and to treat each qualifying setup as a data point that must be
  collected.

timeframes:
  htf: []
  ltf: []
  fractal: false

preconditions:
  - "A defined model with rules that can be checked after the fact."

detection_rules:
  - "Classify each trade as rule-following or rule-breaking, not as good or bad by outcome."
  - "A rule-following loss is not a defect and requires no model change."
  - "Do not re-estimate win rate from a handful of trades — expect runs of losses within a normal distribution."
  - "If the setup meets the model, take it, in order to collect the data point."

invalidation:
  - "Not applicable — this is a classification rule."

measurable:
  - "share of trades that were rule-breaking versus rule-following, and the R of each set"
  - "sample size at which the running win rate stabilises"

sources:
  - video_id: m8xcjkOuBHU
    title: "New York Open Live Q&A"
    quote: "A loss doesn't equal a bad trade. A bad trade is not following rules."

ambiguities:
  - "No sample size is named as sufficient; 'n to approach infinity' is rhetorical."
  - "This coexists with his own no-trade filters (avoid consolidation, avoid post-expansion) — when a setup 'meets the model' but he declines it on context, the classification of that skip is not addressed."

