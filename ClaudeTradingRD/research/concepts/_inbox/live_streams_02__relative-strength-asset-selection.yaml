id: relative-strength-asset-selection
name: "Ranking Correlated Assets And Trading The Middle One"
aliases: ["strongest, middle, weakest", "the strength switch", "I don't trade the lagging asset"]
category: structure
status: specified

definition: >
  Every session in this unit opens with the same ritual: rank YM, ES and NQ as strongest,
  middle and weakest, then choose the instrument from the rank rather than from the setup. The
  selection rule stated here is directional. If the objective is a high, focus on the strongest
  asset because it is closest to that liquidity and will reach it first; if the objective is a
  low, focus on the weakest. The negative form is stated as a slogan — he does not trade the
  lagging asset — and is explained with the YM/NQ example: when he is bearish and YM is the
  strongest, he will not touch YM. He also names the strength switch: when the ranking rotates
  mid-session (NQ becomes stronger, YM weaker) the middle asset is usually the cleaner one to
  trade, and he treats a mid-session rotation as a reason to re-check the framing rather than
  to persist with the original instrument.

timeframes:
  htf: ["1D", "1H"]
  ltf: ["15m", "5m", "3m"]
  fractal: false

preconditions:
  - "Two or more correlated instruments (YM / ES / NQ) charted side by side."
  - "A directional objective (a specific high or low) already identified."

detection_rules:
  - "Rank the correlated set strongest / middle / weakest by how far each has travelled toward the same reference level."
  - "Targeting a high: trade the strongest — it is closest to that liquidity."
  - "Targeting a low: trade the weakest; do not trade the lagging (opposite-direction) asset."
  - "When the ranking rotates mid-session (strength switch), expect the asset that has moved into the middle to give the cleaner structure."
  - "When one asset opposes all the others, treat that asset as the one that is 'lying' and expect it to reverse or to catch up."

invalidation:
  - "The ranking rotates again before the trade triggers — the framing must be redone."

measurable:
  - "R of trades on the ranked-correct asset versus the lagging asset on the same signal"
  - "frequency of intraday strength switches and their effect on outcome"
  - "how often the divergent asset resolves toward, rather than away from, the majority"

sources:
  - video_id: Je7cd9HJUBE
    title: "New York Open Live Q&A"
    quote: "I don't trade the lagging asset"
  - video_id: m8xcjkOuBHU
    title: "New York Open Live Q&A"
    quote: "NQ is the strongest YM is the weakest ES is in the middle"
  - video_id: G1IIdQ3RAkY
    title: "New York Open Live Q&A"
    quote: "So NQ got stronger now. YM's weaker."
  - video_id: TjUolMJNCMY
    title: "New York Open Live Q&A"
    quote: "Now I'm just looking to see the middle asset"

ambiguities:
  - "The ranking is done by eye against a shared reference level; no normalisation (percentage move, ATR units) is specified, so two observers could rank differently."
  - "Trading the strongest and trading the middle are both advocated in this unit without a stated tie-breaker; the middle is preferred specifically after a strength switch."
  - "How much rotation counts as a 'switch' is not bounded — the strengths are described as switching several times inside one session."

python_detector: null
