id: prop-firm-drawdown-sizing
name: "Prop Firm Sizing Off The Drawdown"
aliases: ["it's really a fifteen hundred dollar account", "0.5 percent on funded"]
category: risk
status: specified
voice: mixed
guest_sources:
- "Trader T"

definition: >
  The one place in this unit where TTrades states a risk principle in his own words, and the guest
  had just stated its arithmetic counterpart. Trader T's version: on a prop account you only have
  the drawdown to play with, so hitting the profit target is effectively doubling the money you
  actually control. TTrades' version, offered immediately after and in his own framing: a 25,000
  dollar account with a 1,500 dollar drawdown is treated by most people as a 25,000 dollar account
  when in reality it is a 1,500 dollar account. Trader T's implementation follows from it - he
  risks 0.5 percent per trade on funded accounts (having previously used 1 percent and found it too
  aggressive when only 10 percent of the balance is available), averages roughly 3-7 percent a
  month on them, and deliberately pushes risk up to about 1 percent during a challenge to get it
  passed. He was funded with 400k at FTMO plus 300k at a second firm, about 700k total.

timeframes:
  htf: []
  ltf: []
  fractal: false

preconditions:
- "The account is a prop / evaluation account with a maximum drawdown much smaller than its nominal balance."

detection_rules:
- "Size from the DRAWDOWN, not from the nominal balance - the drawdown is the real account."
- "Funded account: 0.5 percent of nominal per trade (Trader T), chosen because 1 percent leaves only about ten losing trades of headroom."
- "Challenge / evaluation: risk may be raised to about 1 percent to pass, and he does push it when the account is only slightly in profit late in the period."
- "Do not push risk once already above the extension threshold (he cites 5 percent) - the extension makes the gamble unnecessary."
- "Expected return on a funded account at 0.5 percent risk: about 3-7 percent per month."

invalidation:
- "Not applicable."

execution:
  bias: "Not applicable."
  entry: "Not applicable."
  stop: "Not applicable."
  targets: []

measurable:
- "risk per trade expressed as a fraction of the DRAWDOWN rather than of the balance"
- "probability of ruin at 0.5 percent versus 1 percent of nominal given the firm's drawdown cap and the measured win rate"
- "pass rate of challenges run at 1 percent versus 0.5 percent"

