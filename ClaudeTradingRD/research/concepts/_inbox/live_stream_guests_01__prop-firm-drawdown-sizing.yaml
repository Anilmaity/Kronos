ambiguities:
- "The 25,000 / 1,500 framing is TTrades' own statement; the '10 percent to play with' arithmetic immediately preceding it is Trader T's. They converge on air, but the transcript has no speaker labels, so the exact turn boundary is inferred from context - TTrades introduces the point with 'I was just gonna say to go along with accounts'."
- "Raising risk during a challenge is stated as personal practice and is in tension with the same speaker's own drawdown-is-the-account logic; the tension is not addressed."
- "The percentages are of nominal balance, not of drawdown, so the sizing rule and the framing principle are stated in different units."
- "The second firm is named only in garbled caption form ('my 4x1'), so only the FTMO 400k figure is reliably attributable."

