id: midweek-reversal-week
name: Midweek Reversal (weekly profile)
category: model
status: specified
voice: ttrades
definition: >
  Short showing the deferred-confirmation path. Wednesday takes out a small high and prints only a
  "reversal looking candle", not a candle 2 closure. He declines Thursday as "not super clean" and
  lets Thursday's daily candle close: the candle 3 closure plus a CISD confirms Wednesday formed the
  high of the week, and Friday is traded as the continuation lower. He describes the week as
  expansion, retracement, new expansion, and says Monday, Tuesday and Wednesday all oppose the
  weekly range.
detection_rules:
- If Wednesday has no candle 2 closure (only a reversal-looking candle), do not trade Thursday; wait for the Thursday daily close.
- Thursday candle 3 closure plus CISD confirms Wednesday as the weekly extreme; trade Friday's continuation.
sources:
- video_id: lffsulC_Np4
  title: "Midweek Reversal Profile: Expansion → Retracement → Expansion"
  quote: but we do have a reversal looking candle.
- video_id: lffsulC_Np4
  title: "Midweek Reversal Profile: Expansion → Retracement → Expansion"
  quote: Monday, Tuesday, Wednesday, they all oppose the weekly range.
- video_id: lffsulC_Np4
  title: "Midweek Reversal Profile: Expansion → Retracement → Expansion"
  quote: Thursday's actually the confirmation that Wednesday has formed the high
ambiguities:
- '"Monday, Tuesday, Wednesday all oppose the weekly range" conflicts in wording with the library rule that only Monday and Tuesday oppose the bias; read here as Wednesday''s high being part of the weekly wick, not as a third opposing close.'
- '"Expansion, retracement into a new expansion" labels the week but the phases are not mapped to days.'
- '"candle to closure" is a caption error for "candle 2 closure".'
