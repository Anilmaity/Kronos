ambiguities:
- The ES / MES dollar-per-point values are never spoken - only that they share the 25-cent tick and
  the same mini/micro tenth relationship. Do not assume a figure.
- The auto-captioner garbles the point arithmetic example ('it would move from 400.2 to 41.25');
  the intended step is one point.
- Margin figures given for platforms are garbled in the transcript ('$112,000', '$133,000', '$500
  day margin') and are platform- and date-specific; they are not treated as reliable numbers here.
- Tick values for instruments other than the ES/NQ family are explicitly deferred to the broker's
  website.
