id: pattern-trading-error
name: Pattern Trading (the error he corrects)
category: psychology
status: contested
voice: ttrades
definition: 'Viewer-requested definition: pattern trading is following some pattern and trading it every
  time no matter what, never doing higher-timeframe analysis. He rejects the idea of reducing the market
  to a single always-traded pattern - discretion and higher-timeframe analysis are required, otherwise
  people would just run bots.'
