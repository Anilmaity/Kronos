id: aligning-expansion-candles
name: Aligning Expansion Candles (The Model)
category: model
status: specified
definition: 'SHORTS EVIDENCE that repeats the channel''s own headline statement of the model almost
  verbatim: a daily candle 3, a 4-hour candle 3 and an hourly candle 3 stacked together, because ''by
  definition, that is just a trend''. The Shorts add the negative test in the same breath - a candle
  that is a REVERSAL candle is not set up for expansion, so entering inside it does not make sense;
  wait for the NEXT candle, which can support expansion because it is the candle 3. The two-layer minimum
  is illustrated concretely: the daily and the 4-hour both supporting expansion is what licenses looking
  for the continuation.'
preconditions:
- A directional bias exists.
- Each timeframe in the stack has a candle whose expansion support can be judged.
detection_rules:
- 'Check each timeframe: is the current candle a reversal candle or an expansion candle?'
- If the current candle is a reversal candle, do not enter inside it - wait for the next candle open.
- 'Preferred alignment: candle 3 on the daily, candle 3 on the 4-hour, candle 3 on the hourly.'
- Two aligned layers (daily plus 4-hour) is enough to look for the continuation.
- The alignment is the trend, not a separate signal.
invalidation:
- Any layer prints a large wick or fails to support expansion.
measurable:
- R multiple of 3-layer versus 2-layer alignments
- frequency of full 3-layer candle-3 alignment per month
