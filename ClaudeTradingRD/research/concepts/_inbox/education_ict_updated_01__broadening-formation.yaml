id: broadening-formation
name: Broadening Formation
aliases:
- broadening information
- megaphone pattern
category: structure
status: specified
definition: 'A pattern in which price is constantly expanding: starting from a range, price takes one
  side, fails to break out, trades back through the range and takes the other side, and repeats — ending
  with a larger range than it started with. On a higher timeframe the same structure resolves into an
  OUTSIDE BAR, because that candle took both the range high and the range low.'
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  fractal: true
preconditions:
- A range or consolidation exists.
detection_rules:
- Mark buyside and sellside liquidity on both sides of the initial range.
- When one side is taken, extend that line out.
- When price trades back through and takes the other side, extend that line to the new extreme.
- Repeat; the two diverging lines are the broadening formation.
- 'Alternative construction: from a given high and low, look left and connect the highs/lows each of
  them took out.'
- 'Higher-timeframe equivalent: a candle that takes both the previous range high and range low — an
  outside bar.'
- 'Directional read: if price fails to break out of one side, expect it to trade back through to the
  other side.'
invalidation:
- A genuine breakout — the broken side becomes support/resistance and price continues away.
execution:
  bias: Toward the side of the range not yet taken, after a failed breakout.
  entry: At the edges of the range (in a consolidation he is only interested in the external part),
    ideally with SMT at that edge.
  targets:
  - Buyside/sellside liquidity on the opposite edge
  - The broadening formation trendline itself (price aligning with time)
  - Equilibrium of the initial range when full rotation is not expected
measurable:
- frequency of outside-bar days on the daily
- rotation completion rate after a failed breakout of one side
