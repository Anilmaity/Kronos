  quote: if London session took Asia high and low then I'm anticipating New York
ambiguities:
- Broadening formations nest inside broadening formations at every scale; no rule selects which one
  is operative.
- Whether to use bodies or wicks for the initial range is stated as optional ('I can use the bodies
  or the Wicks').
- '''Fail to break out'' is again the unquantified displacement judgement.'
