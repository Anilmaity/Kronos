id: dont-trade-after-expansion
name: "Trade the Expansion, Not After It"
aliases: ["trade the trend, not after the trend", "already expanded"]
category: entry
status: specified

definition: >
  Given as the answer to "I'm having difficulty finding entry after expansion": the difficulty
  is the answer — you want to be trading the expansion, not after it. In these sessions the rule
  is applied to whole instruments and whole days, not just single entries. Overnight expansion
  that has already run means the New York open is a lower-probability window; a market that has
  already covered its typical daily range is dropped; oil is dismissed because "it already made
  the move"; gold is dismissed as consolidating with the instruction to trade something that is
  trending instead. He states the positive version as a chart test: price is trending here and
  consolidating there, so it is less ideal to be seeking trades in the consolidating stretch.

timeframes:
  htf: ["1D", "4H", "1H"]
  ltf: ["15m", "5m"]
  fractal: true

preconditions:
  - "A completed or in-progress expansion leg is identifiable."

detection_rules:
  - "Seek entries inside the expansion leg, not after it has completed."
  - "If the instrument has already covered its typical daily range, stand aside for the session."
  - "If the targets of the expansion are already hit, do not seek a further continuation."
  - "Prefer an instrument that is trending over one that is consolidating, even if a pattern exists on the consolidating one."
  - "After an expansion, wait for a new swing point or a new higher-timeframe candle open before re-engaging."

invalidation:
  - "Not applicable — this is a regime filter."

measurable:
  - "R of entries inside the expansion leg versus after it"
  - "share of post-expansion continuation attempts that reach target"
  - "outcome difference between trending and consolidating instruments on the same signal"

sources:
  - video_id: m8xcjkOuBHU
    title: "New York Open Live Q&A"
    quote: "We want to be trading the expansion, not after it."
  - video_id: Je7cd9HJUBE
    title: "New York Open Live Q&A"
    quote: "Trade something that's trending."
  - video_id: TjUolMJNCMY
    title: "New York Open Live Q&A"
    quote: "it already made the move. That's why I'm not interested in it"

ambiguities:
  - "How much expansion counts as 'already made the move' is decided by eye against the eyeballed daily range."
  - "The rule is applied both to a single leg and to a whole session without distinguishing them."
  - "No test is given for when a consolidation has lasted long enough to become tradeable again beyond 'wait for a new swing point'."

python_detector: null
related: ["expansion-exhaustion-avoid-price", "average-daily-range", "consolidation-avoidance", "htf-opening-price-entry", "small-wick-expansion-rule"]

