id: options-expiry-3x-rule
name: Options Expiry = 3x The Expected Time To Target
category: risk
status: contested
voice: ttrades
definition: 'In this stream he states the expiry multiple as FOUR times the expected time-to-target (a
  one-week idea gets four weeks; a one-day idea gets about a week), contradicting the 3x figure recorded
  from eIPM-D8RrSQ. He adds a strike rule: buy slightly out of the money (or near/in the money when chop
  is expected) so the initial move puts the contract in the money and delta/gamma drive the return, because
  far-OTM contracts decay each day they are not in the money. He does not use short-dated options for
  swings.'
detection_rules:
- Estimate the time for the idea to reach its target.
- Select an expiry four times that estimate (one day -> about one week).
- 'Strike: slightly out of the money; move to near or in the money when chop before the move is expected.'
- Do not buy far-OTM contracts whose value depends on the move arriving quickly.
sources:
- video_id: uW55Tuk-ngY
  title: New York Open Live Q&A
  quote: I'm giving myself four times the amount of time I think it'll take
- video_id: uW55Tuk-ngY
  title: New York Open Live Q&A
  quote: I prefer to be slightly out of the money
- video_id: uW55Tuk-ngY
  title: New York Open Live Q&A
  quote: I don't really do shortdated options uh for swings.
ambiguities:
- 3x (eIPM-D8RrSQ) vs 4x (this stream) - the multiple is not stable across streams; kept as contested.
- '"One day -> a week" is about 5x trading days, so the multiple is a rough heuristic, not a formula.'
- 'Worked trade: QQQ puts, 715 strike, expiry October 2nd, bought at Friday close - the strike/expiry
  relation to the target is not quantified.'
