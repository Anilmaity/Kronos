id: large-wick-target-adjustment
name: Large Wick - Adjust Targets, Do Not Expect Expansion
category: risk
status: contested
definition: 'A viewer case: daily close bearish, then a 1-hour CISD and a 1-hour close above the daily
  C2 EQ. He calls this a SOFT invalidation of the bearish bias, not a mechanical one: price can still
  reverse, but trading higher builds a larger wick, so less expansion is expected; if price goes back
  lower, targets are adjusted to the current daily open, the intraday lows and sometimes the previous
  day low.'
detection_rules:
- 'Bearish bias + an H1 close above the daily C2 EQ = soft invalidation: keep the bias but cut targets
  to daily open / intraday lows / sometimes previous day low (mirror for bullish).'
measurable:
- target hit rates (daily open vs previous day low) conditional on an H1 close beyond the daily C2 EQ
sources:
- video_id: rVRk4MLTJSs
  title: New York Open Live Q&A
  quote: this can be considered a soft invalidation of the bias if you're looking lower.
- video_id: rVRk4MLTJSs
  title: New York Open Live Q&A
  quote: it has a larger wick, which means you're expecting less expansion.
- video_id: rVRk4MLTJSs
  title: New York Open Live Q&A
  quote: It's just I'm adjusting my targets.
