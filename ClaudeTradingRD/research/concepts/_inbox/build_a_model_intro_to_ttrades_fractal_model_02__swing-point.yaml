ambiguities:
- The three-candle test uses lows/highs, not bodies, but the same speaker elsewhere in this unit measures
  things body-to-body without saying which governs here.
- Nothing says how far apart two swing points must be to both count as relevant (the separation question
  is raised in q3nauvjT3q0 only in relation to equal highs/lows).
