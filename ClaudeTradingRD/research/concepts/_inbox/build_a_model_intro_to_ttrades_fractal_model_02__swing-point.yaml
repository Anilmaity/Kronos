id: swing-point
name: Swing High / Swing Low
category: structure
status: specified
aliases:
- three candle swing point
- the swing point
definition: 'The foundational premise of the whole model, stated identically in three videos in this
  unit: price cannot reverse without forming a swing point -- bearish to bullish requires a swing low,
  bullish to bearish requires a swing high. Mechanically a swing low is a low with a HIGHER LOW on each
  side (three candles), and a swing high a high with a lower high on each side. The swing candle is
  candle 2 of the model. Because the third candle is needed to confirm it, a swing point is only complete
  one candle late, which is why the candle 2 closure and candle 3 closure definitions exist at all.'
timeframes:
  htf:
  - 1M
  - 1W
  - 1D
  - 4H
  - 1H
  - 30m
  - 15m
  ltf:
  - 5m
  - 3m
  - 1m
  fractal: true
preconditions:
- Three consecutive candles.
detection_rules:
- 'Swing low: the middle candle''s low is lower than the low of the candle on each side.'
- 'Swing high: the middle candle''s high is higher than the high of the candle on each side.'
- The swing candle is labelled candle 2; the continuation after a confirmed swing is candle 4.
- Within the fractal model only swing points are traded -- where no new swing has formed for several
  candles, only continuation of the existing direction is favoured.
- SMT against a correlated asset, or a daily change in the state of delivery, may substitute for the
  swing point's sweep.
invalidation:
- The swing point's extreme is taken out.
measurable:
- swing points per month per timeframe
- how often a 3-candle swing point is later violated
sources:
