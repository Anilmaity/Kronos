id: breaker-block
name: Breaker Block (preferred over the order block, as a mitigation)
aliases:
- breaker
category: entry
status: specified
definition: 'Rauf names the breaker as his favourite entry technique and gives his reason: a breaker
  shows a real change in the state of delivery, and he quotes ICT that a change in state of delivery
  is where opportunities are born. His structural definition is low, high, lower low (bullish), with
  the significant candle being the one no bodies subsequently pass. Functionally he treats a breaker
  as another FORM OF MITIGATION - the place where anyone who was positioned the other way can square
  or offset their position. He prefers breakers to order blocks purely as personal preference but says
  he finds them much more meaningful, and notes that every ICT PD array can be reclaimed but breakers
  differ in that they carry this structure.'
timeframes:
  htf:
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- A swing structure with a low, a subsequent high, and a lower low (mirror for bearish).
detection_rules:
- 'Bullish breaker: mark the low, the following high, and the lower low.'
- The breaker candle is the one at that structure past which no bodies subsequently close.
- Treat the level as a mitigation zone where opposing positions are squared or offset.
- Entry is on the return into the breaker after price has moved away.
- A body close through the breaker's defining extreme disqualifies it.
invalidation:
- Bodies close through the breaker.
measurable:
- reaction rate on first return into a breaker vs into an order block at the same structure
sources:
- video_id: qFtfD09Vv3E
  title: Live with Day Trading Rauf - Preparing for a New Week
  quote: Breakers are probably my favorite entry techniques to enter the market
- video_id: qFtfD09Vv3E
  title: Live with Day Trading Rauf - Preparing for a New Week
  quote: a breaker is another form of mitigation
- video_id: qFtfD09Vv3E
  title: Live with Day Trading Rauf - Preparing for a New Week
  quote: we have this breaker we've got a low high and a lower low
ambiguities:
- The choice of breaker over order block is stated as personal preference, with no comparative evidence.
- Whether the breaker requires the liquidity sweep first (as in other corpus definitions) is not stated
  here.
- He says an MMXM is 'by definition mitigation - a mitigation of orders' and that a breaker is a form
  of the same thing, without reconciling breaker and mitigation block as separate objects.
