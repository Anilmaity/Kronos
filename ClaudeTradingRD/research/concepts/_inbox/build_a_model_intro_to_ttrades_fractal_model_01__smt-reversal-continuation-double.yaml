id: smt-reversal-continuation-double
name: Reversal SMT, Continuation SMT, Double SMT
category: liquidity
status: specified
aliases:
- reversal SMT
- continuation SMT
- double SMT
definition: SMT is a divergence between correlated markets - they should move together, so a difference
  in structure at a level is the signal. Within the fractal model SMT is classified by WHERE in the
  candle sequence it forms. A REVERSAL SMT is a divergence between candle 1 and candle 2 (it forms
  at the reversal). A CONTINUATION SMT is a divergence between candle 2 and candle 3 (this asset
  fails to take the extreme that the correlated one takes, during the continuation). A DOUBLE SMT
  is both present in the same sequence. All three are confluence only - they are looked for after
  a model exists, never before.
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- 'A valid model: C2 or C3 closure with the aligned lower-timeframe CISD.'
- A named correlated market (ES/NQ/YM; gold vs gold-euro / gold-pound; USDCAD vs DXY; AUDUSD vs NZDUSD).
detection_rules:
- Compare the same swing on this asset and the correlated one; a difference in structure (one makes
  the higher high / lower low, the other does not) is an SMT.
- 'Reversal SMT: the divergence sits between candle 1''s extreme and candle 2''s extreme.'
- 'Continuation SMT: the divergence sits between candle 2''s extreme and candle 3''s extreme.'
- 'Double SMT: both are present.'
- 'Order of operations is fixed: find the model first, then look for SMT. Never the reverse.'
- If trading the candle 2 reversal itself, the candle must independently support expansion (small
  wick) before the SMT is allowed to count.
- SMT alone never licenses a trade - intraday confirmation that the wick has formed is still required.
invalidation:
- The setup is invalidated intraday (wrong extreme first) - the SMT does not save it.
measurable:
- hit rate of models with reversal SMT vs continuation SMT vs double SMT vs none
- how often SMT is present at all given a valid model
