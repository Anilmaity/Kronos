ambiguities:
- Which correlated asset is authoritative is never specified; examples switch between ES, NQ and
  YM and one is described as 'a bit messy' for that reason.
- No tolerance is given for 'relatively equal' - how far apart the two extremes may be and still
  count as a divergence.
- Whether a divergence must be at the SAME bar index on both assets is not stated.
