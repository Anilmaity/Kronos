id: internal-external-liquidity-model
name: Internal & External Liquidity Model
category: model
status: contested
voice: ttrades
definition: 'TTrades'' fractal-model variant of the model (contrasts with the library''s kill zone / stop raid /
  MSS / FVG checklist version): HTF C2 closure at internal liquidity gives the draw to external; drop to an aligned
  LTF and wait for a valid fractal model (CISD, then a new protected swing formed by reaching into an FVG and closing
  through). Enter, stop on the swing high or on its bodies, take 2R as the LTF target or hold runners to the HTF
  external target. Ladders shown: daily/hourly/5m, daily/4H/15m, weekly/4H/15m, 15m/1m.'
detection_rules:
- 'HTF: C2 closure at an FVG -> draw = external swing.'
- 'Middle TF: confirm with CISD (SMT/PSP optional confluence) and a new swing at its own FVG.'
- 'LTF: new protected swing after CISD; enter (on the open of the new candle in the weekly example).'
- Stop on the protected high/low or on the bodies; target 2R or hold to the HTF external target.
