id: entry-model-least-important
name: The Entry Model Is The Least Important Part
aliases:
- it's mostly about managing risk
category: psychology
status: specified
definition: Asked to summarise what is most important in his entry model, TTrades answers that the entry
  model becomes LESS important the more you learn, and that trading is mostly about managing risk. He
  does name what he wants to see when he does enter - displacement, then failure swings below (mirrored
  for shorts) - while noting there are many ways to enter a trade.
timeframes:
  htf: []
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: false
preconditions: []
detection_rules:
- Look for displacement, then failure swings behind it, as the entry condition.
- Do not treat the entry pattern as the source of edge - risk management is.
- Accept that several entry techniques can serve the same setup.
invalidation: []
measurable:
- dispersion of outcomes across entry variants on the same setup
- contribution of sizing vs entry to realised P&L
sources:
- video_id: wGYde-h84cs
  title: Live Q&A with AM Trades - Weekly Profile
  quote: the entry models the more and more you learn is like the least important part
- video_id: wGYde-h84cs
  title: Live Q&A with AM Trades - Weekly Profile
  quote: I like to see displacement and then some failure swings below
ambiguities:
- '''Displacement'' and ''failure swings'' are named without thresholds in this exchange.'
- It is a stance, not a decidable rule; the detection rules restate the entry condition, not the stance.
