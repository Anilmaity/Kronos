id: new-york-manipulation-profile
name: New York Manipulation
category: model
status: specified
definition: 'SHORTS EVIDENCE giving the timing question and its two candidate answers. With a daily
  bias to reach for the previous day high, London is watched first and does little but consolidate.
  The question then asked verbatim is when the manipulation is likely to occur, and only two times are
  offered: 8:30 or 9:30. The manipulation that does arrive at 8:30 runs HIGHER, and he reads that as
  pointing lower - the manipulation direction is the inverse of the intended direction. Execution then
  drops to the 5-minute: price takes a low, makes a new low it cannot displace below, and at the New
  York open closes over the down-close candle - that is the entry, stop on the low, targeting the previous
  day high.'
preconditions:
- A daily bias exists with the previous day high (or low) as the objective.
- London has not delivered the move.
detection_rules:
- If London only consolidates, expect the manipulation at 8:30 or 9:30.
- Read the manipulation direction as the INVERSE of the intended direction (a move up leads to a look
  lower).
- Wait for the failure to displace below the new extreme.
- Enter on the close over the opposing candle at the New York open.
- Stop on the low; target the previous day high.
measurable:
- split of manipulation timing between 8:30 and 9:30 on days when London consolidates
- hit rate of the previous day high target from a New York open entry
sources:
- video_id: 4629-YQ7_9g
  title: 'Daily Profile: New York Manipulation to Identify Entries'
  quote: when is that likely to occur? either 8:30 or 9:30
- video_id: 4629-YQ7_9g
  title: 'Daily Profile: New York Manipulation to Identify Entries'
  quote: The manipulation higher leads me to look lower
ambiguities:
- The timezone of 8:30 / 9:30 is not stated in the Short.
- No rule chooses between 8:30 and 9:30 in advance - both are offered as candidates.
- '''London doesn''t really do a whole lot'' is the trigger condition and is not quantified.'
