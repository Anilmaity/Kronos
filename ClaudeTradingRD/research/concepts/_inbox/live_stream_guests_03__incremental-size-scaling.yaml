id: incremental-size-scaling
name: Earn The Right To Trade Bigger Size (incremental scaling through micros)
aliases:
- do not test the depth of the water with both feet
- scaling up
category: risk
status: specified
definition: 'Open the trading account deliberately small - a $500 or $1,000 account - regardless of
  how much capital is available, and then scale size in the smallest increment the instrument allows
  rather than by doubling. The concrete mechanic given is the micro contract: ten micros equal one
  full NQ contract, so a trader on one NQ steps to eleven, twelve or thirteen micros, not to two NQ.
  The stated justification is physical - bench-pressing 250 pounds on your first day in a gym - and
  the summarising proverb is ''do not test the depth of the water with both feet''. The in-trade diagnostic
  is panic: if you are panicking while in a position, size is too large, and the first remedy offered
  to any struggling trader is to halve position size.'
timeframes:
  htf: []
  ltf: []
  fractal: false
preconditions:
- A live account with real money; paper trading is described as a learning tool only.
detection_rules:
- Open the account at $500-$1,000 even when more capital is available.
- 'Express the next size step in micros: 10 micros = 1 NQ mini; step from 1 mini to 11, 12 or 13 micros,
  not to 2 minis.'
- If panic is felt while in a position, size is too large - reduce to a level that can be held calmly.
- 'First remedy for a struggling account: halve the position size.'
invalidation:
- Not applicable - behavioural rule.
measurable:
- realised R distribution and rule-break rate before vs after each size step
- relationship between position size and self-reported in-trade anxiety
