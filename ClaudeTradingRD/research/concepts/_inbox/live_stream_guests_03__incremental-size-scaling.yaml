ambiguities:
- No criterion is given for when a size step has been 'earned' - no trade count, equity threshold
  or elapsed time.
- '''A comfortable level'' is the only sizing test and is entirely subjective.'
- The 10:1 micro ratio is stated for NQ only; other instruments are not addressed.
