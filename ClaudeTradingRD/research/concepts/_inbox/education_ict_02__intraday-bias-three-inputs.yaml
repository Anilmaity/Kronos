id: intraday-bias-three-inputs
name: Intraday Bias From Displacement, Structure And Imbalances
category: model
status: contested
aliases:
- intraday bias
- 4-hour and 1-hour as your daily timeframe
definition: 'THE EARLIER INTRADAY-BIAS PROCEDURE, and it is a different procedure from the later canonical
  one. The frame: use the 4-hour and 1-hour charts AS your daily timeframe and base trades off them.
  The bias itself comes from exactly three inputs, named as a closed list - DISPLACEMENT, STRUCTURE
  and IMBALANCES. In the worked cases: aggressive move down (displacement) + relatively equal lows
  (structure) + a fair value gap left behind (imbalance) gives a bearish read whose draw is those
  lows. A second construction he names separately is narrative framing off the London and Asia price
  action plus the previous session''s action: a previous high run, displacement down, a fair value
  gap; London then runs highs back into that gap and forms an intermediate-term high; if that holds
  the read is bearish and the draw is the resting lows beneath the large gaps below.'
timeframes:
  htf:
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
detection_rules:
- Work on the 4-hour and 1-hour charts, treating them as the daily timeframe.
- 'Input 1 - displacement: an aggressive directional move.'
- 'Input 2 - structure: the highs and lows the move leaves, especially relatively equal lows/highs.'
- 'Input 3 - imbalance: the fair value gap the move creates.'
- The bias is the direction implied by all three; the draw is the liquidity or imbalance on the far
  side.
- 'Sequence he uses repeatedly: old lows are run, THEN displacement up -> look for longs from a lower-timeframe
  entry, targeting the obvious liquidity or a fair value gap in a premium.'
- 'Alternative framing: read London and Asia''s price action against the previous session''s; a run
  of highs into a fair value gap forming an intermediate-term high, if it holds, is bearish.'
- Once the bias exists, drop to lower timeframes and take the entry (OTE, fair value gap in a discount).
measurable:
- hit rate of the identified draw being reached the same session
- how often all three inputs agree versus two of three
