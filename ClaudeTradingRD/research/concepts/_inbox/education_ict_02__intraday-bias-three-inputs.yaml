ambiguities:
- 'EVOLUTION vs the Updated playlist: the later canonical intraday-bias video (6zTz7WMdMWg) derives
  bias from the PREVIOUS 4-HOUR CANDLE''S HIGH AND LOW as a continuous draw engine - take one side
  and close outside = continuation, close back inside = reversal. That mechanism is entirely absent
  here, and the three-input version is absent there. This is the earlier recording.'
- No precedence is given when the three inputs disagree.
- '''Displacement'' is unquantified (see `displacement`).'
- The London/Asia framing gives no session boundaries.
