id: weekly-profile-not-predicted-in-advance
name: The Weekly Profile Is Not Known Before The Week Opens
aliases:
- let the chart paint it
- profile is recognised not predicted
category: model
status: specified
definition: AM Trades names as a misconception the idea that seeing a weekly-profile guide means you
  know the week in advance. He states that when a week opens he does not know which profile it will
  be, and that he lets the chart paint it out for him. Operationally this is why Monday is not traded
  but recorded, why the profile is only 'confirmed' by an hourly change in state of delivery on a day
  the calendar made likely, and why the earliest he will act is Tuesday. The host echoes the same posture
  for his own week ahead.
timeframes:
  htf:
  - 1W
  - 1D
  ltf:
  - 1H
  fractal: false
preconditions: []
detection_rules:
- Do not assign a weekly profile before the week has traded.
- Let Monday (and if necessary Tuesday and Wednesday) print, and classify only from what has happened.
- The profile is considered confirmed only when the manipulation is confirmed by an hourly change in
  state of delivery.
- Until confirmed, the only levels of interest are the external high and low of the developing range.
invalidation: []
measurable:
- day-of-week on which the profile becomes classifiable, distribution
- accuracy of a Monday-morning profile guess vs a post-confirmation classification
