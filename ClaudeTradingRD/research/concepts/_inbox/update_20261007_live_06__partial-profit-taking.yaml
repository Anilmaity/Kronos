id: partial-profit-taking
name: Partial Profit Taking (contested)
category: risk
status: contested
voice: ttrades
definition: 'Live management of a swing short (NQ, entered Friday close, three targets): he took a partial
  of about 3.5R on one portion because the correlated asset (ES) had already taken his target and the
  instrument was already at its average daily range, while holding the main position for lower targets
  into the following day.'
detection_rules:
- Take a partial when the correlated asset has already reached the target level.
- Take a partial when the day has already produced its average daily range.
- Keep the main position for the remaining targets.
sources:
