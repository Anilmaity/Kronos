ambiguities:
- The auto-captions mangle every minute timeframe ("15-minut", "5minut", "3inut", "30-inut"); the values
  are unambiguous from the sequence but no timestamped text confirms them individually.
- The 30-minute row breaks the otherwise consistent 4-to-6x ratio pattern (30m pairs with 3m, not 5m)
  and no reason is given.
- The Short does not say whether the middle timeframe of a three-timeframe stack carries the structure,
  the bias, or both.
- '"Messy" is the only stated trigger for stepping up a timeframe and is not defined.'
