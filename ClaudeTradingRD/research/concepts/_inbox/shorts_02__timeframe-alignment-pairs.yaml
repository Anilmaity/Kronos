id: timeframe-alignment-pairs
name: Timeframe Pairing and Alignment
category: model
status: specified
definition: 'A Short recites the pairing table in full and adds the row the corpus was missing at the
  top: WEEKLY pairs with the 4-HOUR. The stated list is weekly-4H, daily-1H, 4H-15m, 1H-5m, 30m-3m and
  15m-1m. He also gives the selection PROCEDURE for a three-timeframe stack, which runs bottom-up: decide
  the entry timeframe first, look up its partner, then look up that partner''s partner. Worked example:
  entry on the 5-minute -> the hourly -> the daily. A separate Short shows the escape hatch used live:
  when the execution timeframe is messy, step UP one timeframe (15-minute to 30-minute) to get a clear
  series of opposing candles for the change in the state of delivery.'
timeframes:
  htf:
  - 1W
  - 1D
  - 4H
  - 1H
  - 30m
  ltf:
  - 15m
  - 5m
  - 3m
  - 1m
  fractal: true
preconditions:
- A higher-timeframe closure that needs a lower-timeframe confirmation.
detection_rules:
- 'Pairs: weekly-4H, daily-1H, 4H-15m, 1H-5m, 30m-3m, 15m-1m.'
- 'Three-timeframe stack procedure: choose the ENTRY timeframe first, take its paired higher timeframe,
  then take that timeframe''s paired higher timeframe.'
- 'Worked example of the procedure: 5-minute entry -> hourly -> daily.'
- If the paired execution timeframe is messy, step up one timeframe to find a clear series of opposing
  candles for the change in the state of delivery (15-minute -> 30-minute in the worked case).
invalidation:
- Not applicable - a pairing convention.
measurable:
- CISD confirmation rate by pair
- how often the step-up-one-timeframe fallback is needed
