  quote: the answer for me is yes that's just what works with my schedule
ambiguities:
- The timezone is not stated on air in this unit; EST is assumed from the rest of the corpus.
- '''When I find the best moves to occur'' is asserted with no measurement, and is bundled with a
  scheduling reason.'
