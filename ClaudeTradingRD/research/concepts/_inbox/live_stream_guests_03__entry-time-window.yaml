id: entry-time-window
name: Trade Only 08:30 To 11:00 (the host's own window, stated in this unit)
aliases:
- 8 30 to 11
category: time
status: specified
definition: 'Asked directly whether he only trades between 08:30 and 11:00, the host answers yes,
  and gives two reasons - it fits his schedule, and it is when he finds the best moves to occur. His
  pre-session routine sits inside that window: on the 15-minute or hourly, mark where 08:30 is, look
  left, mark the obvious resting highs and lows, then wait for one to be run before dropping to a
  lower timeframe. Alex''s Options adds a compatible timing read from the guest side in a different
  video: after a Judas swing off the open the reversal is expected in the morning, around 10:00, sometimes
  a little earlier or later, and an afternoon reversal after the lunch consolidation is tradeable
  but is normally skipped.'
timeframes:
  htf:
  - 1H
  - 15m
  ltf:
  - 5m
  - 1m
  - 15s
  fractal: false
preconditions:
- An index futures session with a New York cash open.
detection_rules:
- Trade only between 08:30 and 11:00.
- Before the session, mark 08:30 on the chart and mark the obvious resting highs and lows to its left,
  on the 15-minute or hourly.
- Wait for one of those levels to be run before dropping to a lower timeframe for a setup.
invalidation:
- Not applicable - a session filter.
measurable:
- expectancy by hour of day against the 08:30-11:00 window
- share of the day's setups that occur inside the window
sources:
- video_id: 0bH_kkG2q6s
