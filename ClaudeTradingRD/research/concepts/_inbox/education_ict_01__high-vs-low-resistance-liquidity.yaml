  quote: I want to have high resistance liquidity on the highs and Target low resistance liquidity
ambiguities:
- EARLIER RECORDING. High resistance liquidity is defined only by contrast; no positive test is given
  here.
- How many lower highs are needed to call a failure swing is not stated (two in the example).
- Auto-caption renders 'liquidity' cleanly here but 'sell side' as 'cells side' elsewhere in the same
  video.
