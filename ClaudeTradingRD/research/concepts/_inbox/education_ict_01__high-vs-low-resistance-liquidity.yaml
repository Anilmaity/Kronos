id: high-vs-low-resistance-liquidity
name: High vs Low Resistance Liquidity
aliases:
- low resistance liquidity
- failure swing
category: liquidity
status: contested
definition: 'EARLIER RECORDING, applied in a live trade rather than taught. A sequence of LOWER highs
  (a failure swing) constitutes LOW RESISTANCE liquidity - price can reach it easily. The directional
  rule he states is a pairing: when trading lower he wants HIGH resistance liquidity above (highs that
  are hard to reach, so the upside is protected) and LOW resistance liquidity below as the target. The
  consequence in the trade is that he refuses to short into the failure-swing highs and instead waits
  for an actual SWEEP before entering.'
timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 5m
  fractal: true
preconditions:
- At least two prior highs (or lows) to compare.
detection_rules:
- A high lower than the previous high = a failure swing = low resistance liquidity in that direction.
- When positioning short, require high resistance liquidity above (equal or higher highs, hard to run)
  and target low resistance liquidity below.
- Do not take a short entry at failure-swing highs; wait for a sweep of a genuine high first.
invalidation:
- The low-resistance side is consumed - it stops being a target.
measurable:
- hit rate of low-resistance targets vs high-resistance targets on the same day
- how often a failure-swing high is later swept anyway
sources:
