id: broadening-formation
name: Broadening Formation
category: structure
status: specified
definition: 'SHORTS EVIDENCE for both the fractal equivalence and the drawing procedure. The equivalence
  is stated flatly: a broadening formation on a higher timeframe will be an OUTSIDE BAR, because that
  candle took both the range high and the range low - so a daily candle that takes both the previous
  day high and the previous day low IS a broadening formation one timeframe down. The drawing procedure
  is given as the method most people succeed with: draw buyside and sellside liquidity; when one side
  of the range is taken, connect and EXTEND those lines out; repeat as each side is taken in turn.'
preconditions:
- A range with a marked high and low exists.
detection_rules:
- Mark buyside and sellside liquidity on both sides of the initial range.
- When one side is taken, connect the relevant points and extend the line out.
- Repeat as price alternates sides; the two diverging lines are the formation.
- 'HTF equivalence: an outside bar (took both the previous candle''s high and low) IS the broadening
  formation on the timeframe below.'
- 'Daily application: previous day high AND previous day low both taken -> broadening formation.'
- 'Directional read: failure to break out of one side implies a trade back through to the other side.'
measurable:
- frequency of consecutive outside bars on the daily
- share of broadening-range sides that fail to break out and rotate back through
sources:
