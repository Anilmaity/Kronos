  quote: a 1.79 risk to reward which isn't horrible but can be better
ambiguities:
- 'EVOLUTION: the later canon frames placement around the PROTECTED SWING and the order block mean
  threshold. Neither term appears here; the vocabulary is ''the candle that made the fair value gap''
  and ''the short-term high''. Same geometry, earlier names.'
- '''Depending on my risk tolerance for that certain play'' is explicitly discretionary.'
- No buffer beyond the extreme (ticks, points, ATR) is specified.
- The video is framed as 'a template for you to work on... and to experiment with', so it is not presented
  as a fixed rule at all.
