id: stop-loss-placement
name: Stop Loss Placement (Swing vs Body)
category: risk
status: contested
definition: 'THE DEDICATED EARLIER LESSON, and it is explicitly offered as a template to experiment
  with rather than a rule. Two placements only, and he switches between them by risk tolerance for
  the particular play: (1) the high (short) or low (long) of the CANDLE THAT MADE the fair value gap
  / order block being entered, and (2) the short-term high or low above/below it. Where a lower low
  sits nearby that has a chance of being run, he prefers the safer, wider of the two. The choice is
  explicitly a function of what else sits above the level - imbalances and other things overhead push
  him to the wider stop.'
timeframes:
  htf:
  - 15m
  - 5m
  ltf:
  - 1m
  fractal: true
detection_rules:
- 'Option A: stop beyond the extreme of the single candle that created the fair value gap or order
  block being entered.'
- 'Option B: stop beyond the short-term high (short) or short-term low (long) that contains it.'
- Choose between them by risk tolerance for the play and by what sits beyond the level (imbalances
  above/below push toward Option B).
- Where a nearby lower low has a chance of being run, take the wider placement - 'safer to risk there'.
measurable:
- stop-out rate of the candle stop vs the short-term-swing stop on the same entries
- R difference between the two placements
sources:
- video_id: LZZAaILYNyI
  title: Stop Losses, Placement & Trailing - ICT Concepts
  quote: i can use the high of the candle that made the fair value gap
- video_id: LZZAaILYNyI
  title: Stop Losses, Placement & Trailing - ICT Concepts
  quote: i switch them out depending on my risk tolerance
- video_id: FXNLGYxfbDc
