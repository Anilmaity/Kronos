id: eurgbp-relative-strength-cross
name: EURGBP As The Relative-Strength Cross For EU vs GU
category: structure
status: contested
voice: ttrades
definition: >
  Daily worked example: after a sweep with a candle 2 closure, with a bullish dollar he looks for
  the most bearish foreign currency. EURGBP prints a bearish daily candle, so the euro is weaker;
  the bearish read is held "as long as it remains in respect to 0.5 of this range". EURUSD is
  therefore the pair to short. Cross-check: EURUSD has a bearish daily closure while GBPUSD's daily
  candle is bullish. Execution on lower timeframes is the fractal model: CISD, price opens, sweeps
  a consolidation high (where the daily wick should form), then continues lower.
detection_rules:
- 'Bullish dollar: choose the most bearish foreign currency.'
- 'Bearish EURGBP daily candle -> euro weaker -> short EURUSD.'
- 'Hold the EURGBP read only while price respects 0.5 (50%) of that daily candle range.'
- 'Cross-check: EURUSD daily closure bearish, GBPUSD daily closure not bearish.'
- 'LTF entry: CISD, then the open, then a sweep of a consolidation high as the daily wick, then continuation.'
