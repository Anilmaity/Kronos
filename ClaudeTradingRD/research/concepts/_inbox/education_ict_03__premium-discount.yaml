id: premium-discount
name: Premium & Discount (used inverted)
definition: 'EARLIER RECORDING - and it is the STANDARD, non-inverted usage, which is why this entry
  is contested. Here premium and discount are locations measured against two clock levels (the midnight
  open and the 08:30 open) rather than halves of a leg or range: below the levels is discount and
  is where longs are sought, above them is premium and is where shorts are sought. He also describes
  the levels as a line in the sand, points of interest, or targets. The later, canonical video on
  this topic states the opposite stance - that he uses premium and discount the opposite way to common
  ICT usage and does not wait for a retracement into discount during an expansion.'
category: structure
status: contested
aliases:
- discount
- premium
- line in the sand
preconditions:
- The midnight and 08:30 opens are marked.
detection_rules:
- 'EARLIER READING: discount := below the midnight or 08:30 open; buy there.'
- 'EARLIER READING: premium := above the midnight or 08:30 open; sell there.'
- The same two levels double as points of interest and as targets once price has moved away from
  them.
invalidation:
- Price crossing back through the level moves it out of that classification.
measurable:
- expectancy of longs taken below the two opens versus longs taken above them
- how often a day's entry location under this rule agrees with the later EQ-based inverted rule
sources:
- video_id: b6yvRKf8haE
  title: Why You Should Use 8:30 & Midnight Open (EST) -  ICT Concepts
  quote: kind of a Line in the Sand or points of interest or targets
- video_id: b6yvRKf8haE
  title: Why You Should Use 8:30 & Midnight Open (EST) -  ICT Concepts
  quote: that's what I consider to be a discount
ambiguities:
- 'PROVENANCE: this is the EARLIER recording and it uses premium/discount in the ORTHODOX sense (buy
  the discount). The updated video ''You Are Using Discount and Premium Wrong! - EQ For Expansions''
  explicitly reverses this. Both readings are preserved; do not average them.'
- The two framings also differ in their anchor - clock levels here, the EQ of a leg or candle later
  - so they are not strictly the same measurement made twice.
- No level between the two opens is given as the divide when price sits between them.
