id: mmxm-phase-sequence
name: "MMXM Phase Sequence And The Silver Bullet"
aliases: ["market maker sell model", "second distribution leg"]
category: model
status: specified
voice: guest
guest_sources:
- "$niper (Matt)"

definition: >
  $niper's market maker sell model read left to right - an original consolidation, a push up into a
  premium array (previous daily high, higher-timeframe fair value gap, or buy-side liquidity) which
  identifies the left half of the chart as the buy side of the curve, a smart money reversal where
  that liquidity is taken, a displacement lower that is the market structure break, a retracement
  into an OTE fair value gap sitting in premium, a break of structure below the low of that
  retracement, and then a SECOND distribution leg which he names the silver bullet and calls the
  highest-probability entry in the whole model. Mirrored for the buy model.

timeframes:
  htf: ["1W", "1D", "4H"]
  ltf: ["1H", "15m", "5m", "1m"]
  fractal: true

preconditions:
- "An original consolidation is identified."
- "The current half of the chart has been classified as buy side or sell side of the curve before anything else."

detection_rules:
- "Classify the curve side first - this is the first action taken on any MMXM chart."
- "Require price to push from the original consolidation into a premium array: a previous daily high, a higher-timeframe fair value gap, or buy-side liquidity."
- "A smart money reversal is only counted once the liquidity has been taken AND the reaction after it has formed; taking a random high does not qualify."
- "The first aggressive drop after the sweep is the market structure break / shift."
- "Require a retracement into an optimal trade entry fair value gap (or order block) that sits above equilibrium of the fib drawn from the high to the low of the retracement leg."
- "The break of the low left by that retracement is the break of structure and opens the second distribution leg."
- "The second distribution leg is the silver bullet and is treated as the confirmation that the sell-side lows will be taken."
- "Protected highs are marked at the shift and at the break of structure."

invalidation:
- "Not stated as a price. He names protected highs at the shift and at the break of structure but gives no level whose violation kills the model."

execution:
  bias: "Toward the opposite side of the curve (short in the sell model)."
  entry: "First entry in the OTE fair value gap or order block after the market structure break; second entry on the second distribution leg."
  stop: "Above the protected high; after the first partial the stop is pulled down to where the second entry sits."
  targets: ["previous daily low", "session lows", "relatively equal lows"]

measurable:
- "hit rate and R of the second-distribution-leg entry versus the first (post-MSS) entry"
- "frequency of the full consolidation-to-second-leg sequence per month per instrument"
- "how often the sell-side objective is reached after the break of structure"

sources:
