- video_id: UmLWRlXd_V8
  title: "8/14/22  MMXM Live with $niper  - ICT concepts"
  quote: "I don't take a short unless price is above equilibrium"

ambiguities:
- "'Silver bullet' is used purely structurally here - it is the second distribution leg, with no time window of any kind attached."
- "'Wait for the reaction' is the whole test for confirming a smart money reversal and is never quantified."
- "No rule bounds how deep the retracement into the OTE may go, beyond being above equilibrium."
- "The model is presented on one annotated schematic plus a 15-minute chart; no dated, instrument-labelled worked example is completed end to end."
- "He says the model is fractal (1m through daily) but gives no rule for choosing which timeframe to run it on."

