id: point-of-interest
name: Point Of Interest (POI) - required for reversals, optional for continuations
definition: 'A live exception that cuts against the general requirement. Asked whether the daily candle
  must reach a point of interest before its closure can be used for a swing, he answers no: the daily
  is the one specific timeframe where he does not require a point of interest, provided he has the
  context of the higher timeframe (in the example, a monthly candle trending down). It is ideal but
  not required. He redraws the case to make the point - an aggressive daily closure with no fair value
  gap under it is still clean to him. Separately he narrows what counts as a point of interest at
  all: he does not use breakers, rarely uses higher-timeframe order blocks, uses CISD levels, and
  mostly prefers gaps and highs and lows.'
category: entry
status: contested
detection_rules:
- Reversals elsewhere in the corpus require a point of interest.
- On the daily timeframe specifically, a candle 2 / candle 3 closure does not require one, provided
  higher-timeframe context supports the direction.
- 'Candidate points of interest for this model: gaps, highs and lows, CISD levels.'
- 'Not points of interest for this model: breaker blocks; higher-timeframe order blocks are used rarely.'
measurable:
- win rate of daily closures with a POI vs without, given aligned monthly context
sources:
- video_id: xraklBJHW5k
  title: New York Open Live Q&A
  quote: I don't require a point of interest
- video_id: m0wTBdUe7gs
  title: New York Open Live Q&A
  quote: which is gaps and highs and lows
ambiguities:
- This contradicts the stricter POI requirement recorded elsewhere in the corpus; the exemption is
  stated only for the daily timeframe and only when higher-timeframe context exists.
- '''The context of the monthly candle trending down'' is the substitute for the POI and is not itself
  given a test.'
