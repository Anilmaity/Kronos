id: root-cause-diagnosis
name: Root-Cause Diagnosis for Repeated Account Failure
aliases:
- remove the losing trades
category: psychology
status: specified

definition: >
  His standing answer to "I keep losing with your model". The instruction is diagnostic, not
  additive: work out what your losing trades have in common and what your best trades look
  like, then stop taking the losing category - his worked illustration being a trader who
  keeps trading the reversal and losing, whose fix is to stop trading the reversal. Asked how
  to improve a 40% win rate, he refuses the framing of adding winners and says the work is
  removing losers, since dropping a couple of losing categories moves the win rate a long way
  on its own. He also refuses to let evaluation-account failure be treated as a model problem
  when the person has no model - stop buying evaluations and go learn one first.

timeframes:
  htf: []
  ltf: []
  fractal: false

preconditions:
- A logged trade history exists.

detection_rules:
- Group the losing trades and find what they have in common.
- Identify what the best trades look like.
- Stop taking the losing category rather than adding new setups or filters.
- If there is no defined model at all, stop trading evaluations until there is one.

invalidation:
- n/a

measurable:
- win rate before and after removing the identified losing category
- share of losses concentrated in one setup type

sources:
- video_id: W7Fu3Rx5iMs
  title: New York Open Live Q&A
  quote: what's in common with your losing trades
- video_id: U4j-fZD-FJk
  title: New York Open Live Q&A
  quote: I wouldn't worry about trying to add winners
- video_id: U4j-fZD-FJk
  title: New York Open Live Q&A
  quote: what can you do to remove the losing trades

ambiguities:
- No minimum sample size is given before a category can be called a loser.
- He does not address the case where removing the losing category also removes most of the
  frequency.
- '"Two months of logged data" is accepted as enough to start the exercise, without comment.'

