id: inducement-model
name: The Inducement Model
category: model
status: contested
aliases:
- inducement model
- internal liquidity ran before the actual move
definition: 'A complete multi-leg MODEL, presented alongside and compared to the 2022 mentorship model
  - not the general ''a move that induces buyers or sellers'' definition the later canon gives. The
  bearish sequence: a high is put in with liquidity resting above; that liquidity is run; structure
  breaks; INTERNAL RANGE LIQUIDITY forms inside the resulting range; that internal liquidity is run
  BEFORE the real move begins. The bullish sequence he walks: a low, then a lower high, then the low
  is run (sweeping the liquidity), then a high is put in breaking structure, then a low forms that
  induces people to go long - and THAT low is run before the actual move. His own compression of it:
  it is just internal liquidity in a range that is run before the actual move. He states a preference
  for a fair value gap being present at the inducement, and identifies the induced level as where
  the stops of the trapped participants now rest - including stops that were moved to break-even.'
timeframes:
  htf:
  - 1H
  - 15m
  - 5m
  ltf:
  - 1m
  fractal: true
preconditions:
- A range with a defined external extreme has formed and that extreme has been run.
detection_rules:
- 'Step 1: mark the high (bearish) or low (bullish) with resting liquidity beyond it.'
- 'Step 2: that liquidity is run - the sweep / liquidity grab.'
- 'Step 3: structure breaks in the intended direction, ideally with displacement.'
- 'Step 4: identify the internal range liquidity created inside the new range - the swing that induces
  participants into the wrong side. A fair value gap at that level is preferred.'
- 'Step 5: wait for that INTERNAL level to be run. Only after that run does the real move begin -
  that run is the entry location.'
- 'Applies equally to break-even stops: participants who entered at the induced level and moved stops
  to break-even are run out at the same place.'
invalidation:
- The internal level is never run and price simply continues - there was no inducement leg.
measurable:
- frequency of the internal level being run before the expansion
- R of entering at the internal-level run vs at the initial structure break
