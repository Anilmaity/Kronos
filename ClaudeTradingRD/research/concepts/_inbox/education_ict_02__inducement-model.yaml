ambiguities:
- 'EVOLUTION vs the Updated playlist: the later `Inducement` video (-GkOTMYoJT4) reduces this to a
  general definition (''a move that induces buyers or sellers into the market'') plus a preference
  for it occurring inside a PD array. The five-step sequence recorded here is not restated there.
  This is the earlier recording.'
- He never says how the model differs from the 2022 mentorship model, only that it does - the video
  title promises the comparison and the transcript does not deliver it.
- Which internal swing is 'the' inducement when several exist inside the range is not stated.
- No timing bound between the structure break and the run of the internal level.
