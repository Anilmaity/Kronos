ambiguities:
- Stated for the daily candle while the day is still forming ('so far'); whether a single wick beyond the prior
  range ends the consolidation, or a close is required, is not said.
- This rule is an inside-bar test and conflicts with the library's earlier negative test (higher highs/lows without
  displacement can also be consolidation); the two are compatible only if both are sufficient conditions.
- How to decide which of PDH/PDL is 'more likely' is not given here; he later reads it from a closure over the daily
  open (see notes).
