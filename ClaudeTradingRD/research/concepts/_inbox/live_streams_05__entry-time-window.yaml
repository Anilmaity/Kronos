id: entry-time-window
name: Entry Time Window (and rejection of kill zones)
category: time
status: specified
definition: This unit adds a plain session preference and a hard pre-open rule. Asked which session
  is best for trading gold he answers that he prefers New York for most things. In the live session
  he states there is nothing to anticipate pre-open and that he has to wait for 9:30 for anything
  at all; on the days he does not get a read he defers to watching what Asia and London do and then
  decides in New York. The indicator carries a session filter that can enforce this by hiding every
  setup outside the chosen session.
timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 15m
  - 5m
  fractal: false
preconditions:
- None.
detection_rules:
- Default session is New York, for most instruments including gold.
- Do not act pre-open; wait for 9:30.
- When the daily closure gives no bias, watch Asia and London for information and decide in the New
  York session.
- The session filter can enforce the window mechanically.
invalidation:
- Not applicable - a session policy.
measurable:
- expectancy by session on the same instrument
- share of days where the pre-open read survives the open
sources:
- video_id: sdZkE-naNiY
  title: TTrades Indicator Updates - Walkthrough and Q&A
  quote: I prefer New York for most things to be honest with you
- video_id: tDiwwMRWF2k
  title: New York Open Live Q&A with NickDoesFutures
  quote: I got to wait for 9:30 for anything
ambiguities:
- No end time for his own New York window is given in this unit (the 9:30-11:30 window in the same
  stream is the guest's, not his).
- The time zone for 9:30 is not stated in the live Q&A; EST is stated only for the indicator's clock
  in the other video.
