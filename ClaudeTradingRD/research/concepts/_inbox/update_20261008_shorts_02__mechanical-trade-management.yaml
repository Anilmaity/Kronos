ambiguities:
- This Short re-cuts the 4rNC3QXxC20 live Q&A answer, which the library already cites. The anecdote and the 6R arithmetic are the same (the caption here reads "six R"). It adds no new rule.
- The +6R figure is one viewer's sample with no trade count or period. It is an anecdote, not a statistic.
- '"Early on" is not bounded. When management may start, and what it should look like, is not stated.'
- The +2R / -1R pairing is the scenario he posed to the viewer. It is not stated here as the only acceptable target.
related: [break-even-management, max-one-trade-per-day, wait-for-closure-discipline, risk-reward-minimum]
