id: mechanical-trade-management
name: Mechanical Management - Validation Or Invalidation Only
category: risk
status: contested
voice: ttrades
definition: >
  Asked whether a strict take profit and stop loss beats going break even, TTrades says traders
  early on should run a strict take profit and stop loss and not manage the position, because
  management adds extra decisions, thoughts and stress and beginners "mess up the management".
  His evidence is one viewer scenario: with no management at all, taking only +2R or -1R, the
  viewer would have been up an extra 6R. Managing the position is something to work on later.
timeframes:
  htf: []
  ltf: []
  fractal: false
preconditions:
- A trader early in development whose entry, stop and target are set at entry.
detection_rules:
- 'Beginner default: the trade ends only at the fixed take profit (+2R in the scenario) or the stop (-1R).'
- No break-even move or other management between entry and those two outcomes.
- Position management is deferred to a later stage of development.
invalidation:
- Not applicable - a management doctrine.
execution:
  bias: Unchanged.
  entry: Unchanged.
  stop: Fixed at entry, never moved.
  targets: ["fixed 2R"]
measurable:
- expectancy of the same entries held to fixed +2R / -1R vs managed with a break-even move
sources:
