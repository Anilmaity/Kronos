id: prop-firm-drawdown-sizing
name: Prop Firm Sizing Off The Drawdown
definition: 'The same principle stated from the purchasing side rather than the sizing side: the
  headline account size is not what you are buying. A ''50k'' evaluation whose drawdown is a couple
  of thousand dollars is really an account of that couple of thousand, and the number that actually
  matters when comparing offers is the drawdown-to-profit-target ratio - a $3,000 profit target against
  roughly $2,000 of drawdown means the trader must make about 150% on the capital genuinely at risk.
  He applies the same lens to cost, totalling evaluation fee plus activation fee per firm and noting
  that a cheaper evaluation is the better buy for anyone likely to fail several attempts.'
category: risk
status: contested
aliases:
- effective account size
- drawdown to profit target ratio
preconditions:
- An evaluation account with a stated drawdown and profit target.
detection_rules:
- effective_capital := max_drawdown, NOT the nominal account size.
- required_return := profit_target / max_drawdown (his example is roughly 150%).
- Compare offers on required_return and on total cost = evaluation fee + activation fee.
- If several failed attempts are likely, weight the evaluation fee more heavily than the activation
  fee.
invalidation:
- Any sizing or comparison derived from the nominal account balance.
measurable:
- expected total cost to reach a payout at each firm given a measured win rate and R
- probability of achieving required_return before breaching max_drawdown
sources:
