  account'); the ratio argument survives but the exact drawdown figure for the 50k tier is not reliably
  recoverable from the transcript. The $3,000 profit target and the 150% figure are stated clearly.
- The firm-by-firm fee table is on screen only; the spoken figures ($95, ~$177, $49 + $149 ~ $200)
  are partial and date-specific.
- No risk-per-trade percentage is given in this video - that comes from other units under this id.
