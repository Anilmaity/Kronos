id: failure-to-manipulate
name: Failure To Manipulate
category: structure
status: underspecified
definition: 'Applied live to the weakest index (YM) at a low: when the weakest asset trades through the
  low without reversing, that is a failure to manipulate, and the expected destination becomes its previous
  day low; because it went that far below the low, the correlated assets are expected to be dragged down
  with it.'
detection_rules:
- Weakest asset trades into the low without forming a reversal.
- Read as failure to manipulate; next draw = previous day low of that asset.
- Expect the correlated (stronger) assets to follow lower rather than hold.
sources:
