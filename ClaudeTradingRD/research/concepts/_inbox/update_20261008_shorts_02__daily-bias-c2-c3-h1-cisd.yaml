ambiguities:
- This Short re-cuts uW55Tuk-ngY, and the library already holds its last quote from that stream. It adds no new rule.
- '"Up here" and "stays lower" are only pointed at on the chart. No level (PDH/PDL, EQ or open) is named, so this clip cannot tie the close test to the C2/C3 closure definition.'
- The bullish read is hedged ("probably bullish"). The Short does not mention the hourly CISD step that this entry's full rule requires.
