id: daily-bias-c2-c3-h1-cisd
name: Daily Bias = Daily C2/C3 Closure Confirmed by H1 CISD
category: model
status: contested
voice: ttrades
definition: >
  Asked how to know tomorrow's bias, he answers that it cannot be known before today's daily
  candle has closed. If price trades all the way up and closes there today, tomorrow's bias is
  probably bullish; if it stays lower, it is bearish. Stop trying to predict bias weeks in
  advance, and make no prediction until the daily closure is in.
timeframes:
  htf: ["1D"]
  ltf: []
  fractal: false
preconditions:
- The current daily candle has closed.
detection_rules:
- Do not set the next day's bias until the current daily candle has closed.
- 'Read the close: a close up at the high side of the move points to a bullish next day, and a close that stays lower points to a bearish one.'
invalidation:
- Not applicable - a timing rule for when bias may be set.
measurable:
- next-day direction conditional on where the daily candle closes
