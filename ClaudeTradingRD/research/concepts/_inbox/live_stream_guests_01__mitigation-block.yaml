id: mitigation-block
name: "Mitigation Block"
aliases: ["mitigation block versus breaker"]
category: structure
status: specified
voice: guest
guest_sources:
- "Ben (Ben TT)"

definition: >
  Ben supplies only the discriminator, and is explicit that he does not study or trade the pattern
  itself. A breaker's move creates a NEW swing extreme - which is precisely why the candle is not a
  failure swing. A mitigation block's move does not: the same candle type, but price fails to make
  the new high (or low) before returning. He points at two candidates on the chart that never
  recreate a new swing high and labels them mitigation blocks, then says he does not use them.

timeframes:
  htf: ["1D", "4H"]
  ltf: ["1H", "15m"]
  fractal: true

preconditions:
- "An opposing-close candle exists before a move that takes liquidity."

detection_rules:
- "Check whether the move originating from the candle created a new swing high (bullish case: new swing low)."
- "New extreme created -> breaker. No new extreme -> mitigation block."
- "Because the breaker's move makes a new extreme, it is by definition not a failure swing; the mitigation block's move is."

invalidation:
- "Not stated - he does not trade the pattern."

measurable:
- "relative reaction rate of blocks that did versus did not create a new swing extreme - the direct test of whether his discriminator matters"

sources:
- video_id: yRmKkR4CojU
  title: "Fractalizing Entries -Q&A with Ben - ICT Concepts"
  quote: "this doesn't recreate a new swing high"

ambiguities:
- "He states the distinction and then declines to use it, so no entry, stop or target rules exist for the mitigation block in this unit."
- "'New swing high' is not qualified by how far beyond the prior high the move must go."
- "Other speakers in the corpus define the mitigation block by whether the candle traded into fair value rather than by swing formation; Ben's test is purely structural."

python_detector: null
related: ["breaker-block", "failure-swing", "order-block", "swing-point"]
