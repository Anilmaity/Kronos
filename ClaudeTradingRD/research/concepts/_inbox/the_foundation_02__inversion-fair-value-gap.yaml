ambiguities:
- '''Closes through it'' is not pinned to the far edge versus merely outside the near edge, and the
  CE contradiction (see consequent-encroachment) sits directly underneath this.'
- 'No expiry: because the retest may come much later, a detector needs a horizon that he never supplies.'
- How many times an inverted gap can be reused is not stated, though he shows one being used twice.
