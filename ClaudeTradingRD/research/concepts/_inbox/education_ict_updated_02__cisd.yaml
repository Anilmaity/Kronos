ambiguities:
- '''Close over'' is never specified as a body close vs any close - the examples are all body closes
  but the rule is not stated.'
- 'The untidy-leg fallback (''just use this whole move'') has no boundary rule: where the move starts
  is chosen visually.'
- No timeframe is mandated for the CISD itself; it is inherited from the timeframe pairing in use.
- In this unit CISD and 'market structure shift' are used interchangeably in one video (the Twitter
  model) and treated as alternatives in another.
