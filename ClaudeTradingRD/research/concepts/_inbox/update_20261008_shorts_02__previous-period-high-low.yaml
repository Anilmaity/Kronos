ambiguities:
- This Short re-cuts A4NasIa371c (same "why am I not marking out this high here" line), which the library already cites. It adds no new rule.
- No limit is given on how far back to keep marking untaken highs. The example marks three.
- The higher timeframe is not named, and the Short does not say whether "previous highs" means candle highs or swing highs.
