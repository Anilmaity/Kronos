id: previous-period-high-low
name: Previous Day / Week / Month High & Low
category: liquidity
status: contested
voice: ttrades
definition: >
  Price runs out a whole range and prints a candle 2 closure. The targets for the move up are
  the previous highs. A high that has already been taken out is deliberately left unmarked;
  only highs that have not been taken out count as targets. In the example price takes all of
  them. His summary is to keep targets very simple: whatever the higher-timeframe reference is
  supplies the targets, so focus on previous highs and lows.
timeframes:
  htf: []
  ltf: []
  fractal: true
preconditions:
- A candle 2 closure on the reference timeframe.
detection_rules:
- After a candle 2 closure, mark the previous highs (bullish) or lows (bearish) on the higher-timeframe reference as targets.
- Skip any high (or low) that has already been taken out.
invalidation:
- Not applicable - a targeting rule.
execution:
  bias: Direction of the candle 2 closure.
  targets: ["untaken previous highs (bullish) / lows (bearish) on the higher-timeframe reference"]
measurable:
- hit rate of untaken previous highs/lows after a candle 2 closure vs an equidistant level
