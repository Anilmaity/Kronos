id: inversion-fair-value-gap
name: Inversion Fair Value Gap (IFVG)
category: structure
status: specified
aliases:
- IFVG
- inversion
definition: 'An inversion fair value gap is a fair value gap that is not respected and is swiftly
  closed over: what was resistance becomes support and what was support becomes resistance. The distinctive
  TTrades content is the gating condition, not the pattern. Trading an inversion as a bare pattern
  - sweep, inversion, entry - is named as the mistake most people make. Within the fractal model
  an inversion is only valid inside a candle 2 that supports expansion: there must be a sweep of
  candle one''s high/low (or an SMT in its place), a SMALL wick on that candle 2, and then the inversion.
  If the candle has a large opposing run, the inversion is not traded on that candle - you wait for
  the open of the next higher-timeframe candle. An inversion can also be used in place of the CISD
  to confirm a continuation.'
timeframes:
  htf:
  - 4H
  - 1H
  - 30m
  ltf:
  - 15m
  - 5m
  - 3m
  fractal: true
preconditions:
- A fair value gap exists.
- A higher-timeframe candle 2 has swept candle one's high or low (or an SMT stands in for it).
detection_rules:
- Sweep of the previous higher-timeframe candle's high (bearish) or low (bullish) - this is the relevant
  level requirement.
- The candle doing the sweeping must have a SMALL wick, i.e. it supports expansion.
- Price then closes swiftly through the fair value gap - the inversion.
- Where several fair value gaps stack, the close must clear the whole series.
- 'Tolerance rule: one rejection of the inverted level is acceptable provided price quickly closes
  back through it; repeated failure that becomes a consolidation means waiting for a new high/low
  first.'
- 'Optional confluence: SMT between candle one''s high and candle two''s high.'
- If the candle has a large opposing run, wait for the open of the next higher-timeframe candle before
  entering.
invalidation:
- No inversion forms - price fails to close through the gap.
- 'No V-shape reversal, only consolidation at the level: stand aside (''this is where I want to avoid
  price'').'
execution:
  bias: Direction of the inversion.
  entry: On the closure through the gap, or on the open of the next higher-timeframe candle, or on
    a continuation that follows.
  stop: On the swing point / the high of the sweep.
  targets:
  - 2R
  - the other side of the range
  - failure swings
measurable:
- hit rate of inversions gated on small-wick candle 2 vs ungated inversions
- how often the single-rejection tolerance precedes success vs failure
