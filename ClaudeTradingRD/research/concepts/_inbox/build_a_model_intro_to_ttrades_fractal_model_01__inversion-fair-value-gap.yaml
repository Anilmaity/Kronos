ambiguities:
- '''Swiftly closed over'' has no bar limit.'
- The 'one rejection is fine' tolerance is stated as 'the one rule I have' but the number of acceptable
  rejections and the time before it becomes a consolidation are not given.
- '''Small wick'' is again the load-bearing gate and again unquantified.'
