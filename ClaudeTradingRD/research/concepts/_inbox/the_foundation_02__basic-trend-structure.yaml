id: basic-trend-structure
name: Basic Market Structure (higher highs and higher lows)
aliases:
- basic Market structure
- Trend
- trending up
- trending lower
category: structure
status: specified
definition: 'The channel''s foundational definition of trend, stated before anything advanced. Price
  trends higher by making higher highs and higher lows, each measured relative to the immediately
  preceding opposite-side point; it trends lower by making lower highs and lower lows. The read is
  maintained bar by bar as a running expectation: after a higher high he wants a higher low, after
  a higher low he wants a higher high. A trend stays intact while no opposing swing has been broken,
  and a new extreme may be registered before the swing that contains it has confirmed.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- Swing highs and swing lows are already understood (he links the liquidity video as a prerequisite).
detection_rules:
- 'Uptrend: each new high is higher than the previous high AND each new low is higher than the previous
  low, each measured relative to the preceding opposite-side point.'
- 'Downtrend: each new high is lower than the previous high AND each new low is lower than the previous
  low.'
- 'Running expectation used while the chart develops: after a higher high require a higher low; after
  a higher low require a higher high (mirrored for downtrends).'
- A higher high may be recorded as soon as price trades above the prior high, before the swing high
  itself has confirmed on the right-hand bar.
- The trend is still read as intact while the opposing swing has not been broken - he keeps a stretch
  labelled bullish purely because the low below was never broken.
- Interior highs and lows that are subsequently swept are ignored; the comparison is made against
  the prominent prior extreme.
invalidation:
- The opposing swing is broken (a swing low is closed below in an uptrend) - the read moves to a
  possible market structure shift.
measurable:
- count of confirmed HH/HL and LH/LL sequences per instrument per month
- how long a trend label survives after the first opposing swing break
sources:
- video_id: sgAnVR6RSDg
  title: Understanding Market Structure For Trading
  quote: we're going to have to make higher highs and higher lows
- video_id: sgAnVR6RSDg
  title: Understanding Market Structure For Trading
  quote: we never broke this low down here
- video_id: sgAnVR6RSDg
  title: Understanding Market Structure For Trading
  quote: a higher high even if we have not formed a swing High yet
ambiguities:
- Which swing highs and lows are eligible for comparison is visual - he skips many minor swings on
  the chart and says 'those get swept out before we go' without a filter rule.
- '''Relative to this high'' - the reference extreme is chosen by eye, so an unfiltered 3-bar-fractal
  implementation will label far more structure than he does.'
- Whether the higher high must be a body close above the prior high or a wick through it is not stated
  in the trend definition (it IS stated for the structure shift, where a close is required).
- No statement of how many HH/HL pairs constitute a trend before the label applies.
