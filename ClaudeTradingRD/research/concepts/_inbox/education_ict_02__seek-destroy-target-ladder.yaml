id: seek-destroy-target-ladder
name: Seek & Destroy Target Ladder (equilibrium, OTE, opposite side)
category: model
status: specified
definition: 'The concrete, ordered target set for trading a seek-and-destroy / consolidation profile,
  and the piece the library recorded as missing (''no rule says how to trade the profile''). From
  every DEVIATION out of the range, three targets are looked for and he numbers them: (1) the EQUILIBRIUM
  of the range, (2) an OTE measured with a fib on the price leg, and (3) the opposite side of the
  range - the buyside or sellside liquidity resting there. He applies the ladder identically to every
  deviation walked through in the video, in both directions, and notes that in a seek-and-destroy
  profile price respects the fib retracement levels fairly well.'
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 15m
  - 5m
  fractal: true
preconditions:
- A seek-and-destroy / consolidation profile has been identified.
- Price has deviated outside the range and is returning into it.
execution:
  bias: Back into the range, away from the deviation.
  entry: At the deviation from the range (the point at which buyside/sellside was taken and price
    closed back inside).
  stop: Beyond the deviation extreme.
  targets:
  - equilibrium of the range
  - the OTE of the price leg
  - the opposite side of the range (buyside/sellside liquidity)
detection_rules:
- 'Mark every deviation: a point where price took buyside or sellside and returned into the range.'
- 'Target 1: the equilibrium (50%) of the range.'
- 'Target 2: the OTE of the leg, measured with a fib.'
- 'Target 3: the liquidity resting on the opposite side of the range.'
- Apply the same three in the same order from a deviation on either side.
- The range used for equilibrium can be the outer consolidation OR the individual price leg; he does
  both in the same walkthrough.
measurable:
- hit rate of target 1 vs 2 vs 3 from a deviation
- average R at each rung
sources:
- video_id: PlZD45uLPjE
  title: Seek & Destroy Profile - ICT Concepts
  quote: one equilibrium two OTE and then three the other side of the range
- video_id: PlZD45uLPjE
  title: Seek & Destroy Profile - ICT Concepts
  quote: the first thing I do is identify deviations from the range
- video_id: PlZD45uLPjE
  title: Seek & Destroy Profile - ICT Concepts
  quote: generally I like to stay away from this profile as it's pretty choppy
ambiguities:
- Which range anchors the equilibrium is not fixed - the outer consolidation and the individual price
  leg are both used without a selection rule.
- The OTE band is not restated in this video; the levels come from the OTE lesson.
- No rule says whether to scale out across the three rungs or to pick one.
- The whole ladder sits under his stated default of avoiding the profile entirely.
