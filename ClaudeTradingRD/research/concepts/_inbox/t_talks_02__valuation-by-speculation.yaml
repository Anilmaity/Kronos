id: valuation-by-speculation
name: "Valuation By Speculation (Early-Week False Move)"
aliases: ["the fake out for the week", "the false move of the week"]
category: model
status: specified

definition: >
  An aggressive move early in the week - typically Monday into Tuesday - that runs against
  the intended weekly direction and is not driven by an economic release. It is the phase
  in which the weekly higher-low (bullish case) or lower-high (bearish case) is formed, and
  it is deliberately convincing: at the moment it happens the market looks like it is going
  the other way. Three speakers in this unit read the same phenomenon; they differ on the
  response, with one buying into it and two simply refusing to trade it.

timeframes:
  htf: ["1W", "1D"]
  ltf: ["4H", "1H"]
  fractal: false

preconditions:
  - "A directional expectation for the week exists."
  - "No high-impact economic release is driving the counter-move."

detection_rules:
  - "The move occurs early in the week, typically Monday into Tuesday."
  - "It travels against the anticipated weekly direction."
  - "It is not attributable to a scheduled economic driver."
  - "It occurs below the weekly opening price in a bullish week (or above it in a bearish week)."

invalidation:
  - "The counter-move is driven by a scheduled economic release."
  - "Price continues in the counter direction past the higher-timeframe level that framed the weekly bias."

execution:
  bias: "The intended weekly direction, opposite the false move."
  entry: "Gene: buy into it at/below the weekly open once the weekly higher-low forms. Nick: no trade on a Monday with no news."
  stop: "Not stated."
  targets: ["the weekly objective"]

measurable:
  - "frequency with which the weekly high or low forms on Monday or Tuesday"
  - "P&L of trading Monday-no-news sessions vs skipping them"

sources:
  - video_id: nncJGt6j19Q
    title: "Gene | Align Yourself For High Probability Trades"
  - video_id: G44VpidBD_U
    title: "NickDoesFutures | Unicorn Model & Experiences With ICT"
  - video_id: JABOO4LYNjQ
    title: "Jokerszn | Daily Orderflow - ICT Daily Bias"

ambiguities:
  - "The three speakers agree on the read but not the response: participate (Gene) vs abstain (Nick) vs simply expect it (Jokerszn). This is a doctrine difference, not a factual conflict."
  - "'Aggressively' is not quantified."
  - "Jokerszn frames the Monday behaviour as consolidation or retracement against daily order flow rather than as a manipulation per se."

python_detector: null
related: ["weekly-candle-institutional-profile", "low-probability-day-checklist", "monday-range-marker"]
