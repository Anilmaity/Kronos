ambiguities:
- Whether the validating close must also displace (leave an FVG) is stated in E89d1HArbgM ('close and
  displacement') but only as 'closes below' in 7p9MBFk8EEM.
- '''Important level'' is enumerated by instance (daily/weekly FVG, previous month high, daily swing
  low) but never ranked or bounded.'
- When a SERIES of opposing candles is used, whether the opening price is the first candle's open or
  the highest/lowest is not stated.
