id: idea-vs-executable-setup
name: An Idea Is Not A Setup (no trustworthy invalidation, no trade)
category: risk
status: specified
voice: ttrades
definition: 'Chat repeatedly asks why he does not short NQ after his bullish idea fails three times. His
  answer: no continuation formed either way, the strongest asset gave no sweep, and there is nothing to
  place an invalidation behind - so there is nothing to trade; a failed idea is not itself a setup.'
detection_rules:
- If the planned idea failed and no continuation or trusted invalidation exists in the opposite direction,
  take no trade.
sources:
- video_id: 9H15ZZvaKPQ
  title: New York Open Live Q&A
  quote: Am I trading an invalidation from what?
- video_id: 9H15ZZvaKPQ
  title: New York Open Live Q&A
  quote: If if that's the case, I just don't trade it.
