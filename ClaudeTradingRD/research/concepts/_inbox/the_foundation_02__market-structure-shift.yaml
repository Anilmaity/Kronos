ambiguities:
- Displacement is never quantified; the only operational test he applies is the close beyond the
  pivot, which is decidable but is a proxy he never labels as the definition.
- Whether the pivot must already be a confirmed 3-bar swing before it can be 'broken' is stated both
  ways in the same video - he registers a higher high 'even if we have not formed a swing High yet',
  but rejects a candidate because 'we don't have a swing we break'.
- The preference for the post-shift lower high to sit in premium (or the higher low in discount)
  is stated as 'ideally', not as a filter.
- 'No expiry: how long a confirmed shift remains the operative read is not stated.'
- He defers the harder cases to a follow-up 'Advanced Market structure' video which is not part of
  this unit.
