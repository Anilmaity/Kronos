ambiguities:
- '''Not very aggressive'' is the operative judgement on every chart and is never quantified beyond
  the candle-shape and comparative tests recorded under `displacement`.'
- '''Higher time frame low'' has no specific timeframe attached.'
- No bar-count limit on how quickly price must close back inside for the failure to count.
