id: failure-to-displace
name: Failure To Displace
category: structure
status: contested
definition: 'The dedicated earlier treatment, and it is the strongest statement of the concept in
  the corpus: the video''s actual subject is ''displacement and the lack of displacement'', and his
  closing summary makes the lack of displacement the ENTRY rather than merely a bias input. Mechanically:
  price trades beyond a marked high or low and comes straight back into the range with no large closes
  beyond it. The stated inference is symmetric and exhaustive - ''the lack of [displacement] on each
  side leans in the other direction'' - so a failure to displace below leans bullish and a failure
  to displace above leans bearish. When BOTH sides fail in sequence he calls the result a broadening
  formation / power of three: fail one side, expect the other side to be sought.'
timeframes:
  htf:
  - 15m
  - 5m
  ltf:
  - 1m
  - 15s
  fractal: true
detection_rules:
- Mark a short-term high or low. Price trades beyond it.
- Failure to displace := no large aggressive candle closes beyond the level; price closes back inside
  the range immediately.
- 'Read the lean as the opposite direction: failure below -> expect higher; failure above -> expect
  lower.'
- He prefers the failure to be measured against a HIGHER-timeframe low/high rather than a tiny intraday
  one.
- Both sides failing in sequence = broadening formation / power of three; expect the untaken side
  to be sought next.
- A failure to displace followed by an immediate aggressive move the other way is a BPR / box setup
  on the lower timeframe.
measurable:
- continuation rate in the leaned direction after a failure to displace, by timeframe
- same statistic for higher-timeframe vs short-term reference levels
