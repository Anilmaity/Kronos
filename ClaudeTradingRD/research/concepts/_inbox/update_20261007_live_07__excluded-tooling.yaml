id: excluded-tooling
name: Excluded Tooling
category: model
status: specified
definition: 'This stream adds to the ''not used'' list: quarterly theory, volume profile, break of structure
  / market structure shift / change of character (replaced solely by CISD, which he started using after
  market structure shift in 2022), and kill zones - rejected because the model is built on higher-timeframe
  candles, so an entry at 6:45 is not skipped just because it is outside a 7:00 kill zone.'
detection_rules:
- No kill-zone gate; entry allowed whenever the higher-timeframe wick has formed.
- No BOS / MSS / CHoCH; trend change is read only by CISD.
- No quarterly theory, no volume profile.
