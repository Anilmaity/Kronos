id: fair-value-gap
name: Fair Value Gap (FVG)
category: structure
status: specified
aliases:
- FVG
- gap
definition: A three-candlestick pattern in which the wick of candle one and the wick of candle three
  do not overlap, leaving a gap. In this unit the fair value gap is used almost exclusively as a
  POINT OF INTEREST - the place a retracement is expected to terminate and where a protected swing
  is then allowed to form - rather than as an entry in itself. Where several fair value gaps stack,
  they are treated as one large fair value gap and the closure must clear all of them.
timeframes:
  htf:
  - 1M
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  - 5m
  - 3m
  fractal: true
preconditions:
- Three consecutive candles.
detection_rules:
- Take candles 1, 2, 3. If wick of candle 1 and wick of candle 3 do not overlap, the space between
  them is a fair value gap.
- 'Bullish gap: candle 1 high below candle 3 low. Bearish gap: candle 1 low above candle 3 high.'
- Multiple adjacent gaps are treated as a single large gap; a closure must clear the whole series
  to count.
- A gap already traded through is no longer treated as a relevant level.
invalidation:
- A swift close through the gap inverts it (see inversion-fair-value-gap).
measurable:
- frequency of FVG formation by timeframe
- reaction rate at single vs stacked fair value gaps
sources:
- video_id: FKTBkTzsmUA
  title: How To Actually Trade Inversion Fair Value Gaps (IFVG)
  quote: the wick of candle one and the wick of candle three do not overlap
