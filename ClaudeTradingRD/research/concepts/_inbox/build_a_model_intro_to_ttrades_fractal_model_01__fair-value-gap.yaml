  title: How To Actually Trade Inversion Fair Value Gaps (IFVG)
  quote: I want to use all of those fair value gaps and treat it like one
ambiguities:
- Whether the gap is measured wick-to-wick or body-to-body is stated as wick-to-wick here, but the
  retracement video judges respect by the BODIES ('you can see how the bodies respect').
- No minimum gap size is given.
