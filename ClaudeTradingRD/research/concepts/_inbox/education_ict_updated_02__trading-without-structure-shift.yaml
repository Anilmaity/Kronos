ambiguities:
- '''Aggressive'' is the load-bearing word in both branches and is never quantified - no candle-range,
  ATR or bar-count threshold is given.'
- '''Short-term high or low'' is not defined; no separation or age filter is stated.'
- BPR (balanced price range) and the box setup are named and drawn but not defined in this video
  - both are deferred to other videos.
- Which of BPR / fair value gap / box / OTE to use when several are available is not stated.
- The execution timeframe varies wildly across examples (1-minute, 15-second, 5-minute) with no selection
  rule beyond 'depending on the time frame I am trading'.
