id: trading-without-structure-shift
name: Trading Without A Market Structure Shift / Break
aliases:
- trading without a market structure shift
- entering prior to the structure shift
category: entry
status: underspecified
definition: 'An entry method built to fire BEFORE a market structure shift or break, motivated by
  his having repeatedly missed moves waiting for one. Two things are required. First, a higher-timeframe
  point of interest - highs and lows, fair value gaps, order blocks, or whatever PD array the trader
  has selected. Second, and named as the most important, a run of a short-term high or low followed
  by an aggressive move back into the range. The run-and-return produces a balanced price range,
  a fair value gap, or a box setup, and that is the entry. A separate branch: a higher-timeframe
  point of interest that is run aggressively with NO higher-timeframe closure beyond the level gives
  an OTE / discount-or-premium entry. When both branches are present at once, the setup is at its
  best.'
timeframes:
  htf:
  - 1H
  - 15m
  ltf:
  - 5m
  - 1m
  - 15s
  fractal: true
preconditions:
- A higher-timeframe point of interest is identified and price has reached it.
- A short-term high or low exists that can be run.
detection_rules:
- Require a higher-timeframe point of interest (high/low, fair value gap, order block, or the trader's
  chosen PD array).
- Require a short-term high or low to be run aggressively, followed by an aggressive move back into
  the range.
- The entry construction is then a balanced price range, a fair value gap, or a box setup formed
  by that run-and-return.
- 'Alternative branch: the higher-timeframe point of interest itself is run aggressively AND the
  higher timeframe fails to close beyond it - then use an OTE / discount or premium entry (0.62 is
  used in one example).'
- Do not look for longs before the low has actually been taken - 'we never took that low no reason
  to be looking long yet'.
- The method may be used purely as bias on the analysis timeframe rather than as an entry.
invalidation:
- A higher-timeframe close or displacement beyond the level - that removes the come-back-into-the-range
  expectation.
execution:
  bias: Back into the range, away from the run.
  entry: At the balanced price range, the fair value gap, the box level, or the OTE zone.
  stop: On the low (or high) that was run.
  targets:
  - previous lows / internal highs
  - examples show 2.6R and just over 4R
measurable:
- hit rate of run-and-return entries taken before a structure shift vs after one
- how often the higher timeframe subsequently closes beyond the level (the invalidation rate)
- distribution of R outcomes for the BPR / box / OTE variants separately
