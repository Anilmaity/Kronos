id: thursday-counter-week
name: "Thursday Counter (weekly profile)"
category: model
status: specified
definition: >
  Two Shorts run the Thursday Counter live. The setup is multiple consecutive days of expansion -
  Monday, Tuesday, Wednesday - into a relevant level, at which point a new phase of price is due
  and Thursday is expected to counter the range. Confirmation is sought on the hourly: the
  previous day's extreme is taken with an SMT and a change in the state of delivery prints, which
  confirms the counter. From there the trade is either the continuation inside the reversal day
  itself, or the wait for Friday as the continuation day back into the range.

timeframes:
  htf: ["1W", "1D"]
  ltf: ["4H", "1H"]
  fractal: false

detection_rules:
  - "Require multiple consecutive expansion days (Mon/Tue/Wed) in one direction."
  - "Require that a relevant level has been hit, so a new phase of price is due."
  - "On Thursday, drop to the hourly and look for the previous day extreme to be taken with an SMT."
  - "Require a change in the state of delivery on the hourly to confirm the counter."
  - "Trade the continuation inside Thursday, or wait for Friday as the continuation day back into the range."

invalidation:
  - "Thursday expands with the prior three days instead of countering."

measurable:
  - "frequency of Thursday countering after three expansion days into a level"
  - "R outcome of the Thursday-intraday branch vs the Friday branch"

sources:
  - video_id: oBkh-__IL-I
    title: "Will Thursday Counter the Range?"
    quote: "We could look to see is Thursday going to counter this range?"
  - video_id: oBkh-__IL-I
    title: "Will Thursday Counter the Range?"
    quote: "look for a continuation inside this reversal day, or we can wait for Friday"
  - video_id: _VquvUgdQmA
    title: "Using EURGBP for Relative Strength"
    quote: "Monday, Tuesday, Wednesday, Thursday forms a counter."
  - video_id: _VquvUgdQmA
    title: "Using EURGBP for Relative Strength"
    quote: "So, we can anticipate Friday back into the range."

ambiguities:
  - "'A relevant level' is the trigger for expecting the counter and is not defined here."
  - "No rule is given for choosing the Thursday-intraday branch over waiting for Friday."
  - "Whether the SMT is required or merely present in the example is not stated."

python_detector: null
related: ["weekly-profile-framework", "tgif-setup", "smt-divergence", "phases-of-price", "midweek-reversal-week"]

