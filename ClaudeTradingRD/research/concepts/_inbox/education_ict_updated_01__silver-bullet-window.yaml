id: silver-bullet-window
name: Silver Bullet Window (10:00-11:00 AM)
aliases:
- am session Silver Bullet window
category: time
status: specified
definition: 'The AM-session Silver Bullet window is 10:00 to 11:00 New York. He states the constraint
  twice and enforces it mechanically in the backtest: the only time he will take an entry is if the
  setup appears between 10 and 11, and an order still unfilled at 11:00 is cancelled.'
timeframes:
  htf:
  - 1H
  ltf:
  - 1m
  fractal: false
detection_rules:
- Mark 10:00 and 11:00 New York with vertical lines.
- Entries must be filled inside that window.
- Cancel any unfilled order at 11:00.
- No qualifying sweep/entry by 11:00 = no trade.
measurable:
- share of qualifying setups that fill before 11:00
sources:
- video_id: o0v4KQxZbpU
  title: ICT Silver Bullet Strategy - No Daily Bias | With Backtest!
  quote: 'I''m going to be focusing on the 10 to 11: a.m. time window'
- video_id: o0v4KQxZbpU
  title: ICT Silver Bullet Strategy - No Daily Bias | With Backtest!
  quote: 'these entries have to fall within 10 to 11: a.m. window'
ambiguities:
- He mentions a possible PM-session version but does not give its window.
- The window coincides exactly with the 10:00 4-hour open he teaches elsewhere; he does not say whether
  that is the reason.
