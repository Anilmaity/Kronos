ambiguities:
- This is the CHANNEL OWNER's restatement inside a guest video; it is deliberately filed separately
  from the guest's STRAT definition so the two are not conflated.
- The drawing-direction difference (guest draws backwards from the extreme, host draws forward) is stated
  as preference, and neither says it changes the levels.
- No stop rule and no lower-timeframe entry trigger is specified.
