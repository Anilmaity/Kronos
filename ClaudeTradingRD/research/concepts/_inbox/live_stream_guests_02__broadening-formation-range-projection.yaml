id: broadening-formation-range-projection
name: Broadening Formation Read As A Range With Two Liquidity Sides (the host's own version)
aliases:
- range with buyside and sellside
- fail one side reach the other
category: structure
status: specified
definition: 'TTrades, after the guest''s STRAT presentation, restates the broadening formation in his
  own terms and demonstrates it on his own chart: he simply marks a range, treats the two boundaries
  as sellside and buyside liquidity, and reasons that if price fails one side of the range and falls
  back in, the other side is the objective - which is also what makes the drawn shape. He then drops
  to a lower timeframe to find the entry toward that other side, and expands the drawing as more information
  arrives. He states the drawing direction differs from the guest''s: the guest anchors from the extreme
  and draws backwards, TTrades draws forward from the range. He also states the value he takes from
  it is target projection, and closes by asserting the equivalence explicitly - taking a previous low
  and reversing is the same event most ICT traders describe as taking sellside and reaching for buyside.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- A range with an identifiable high and low (sellside and buyside).
detection_rules:
- Mark the range; its high is buyside liquidity and its low is sellside liquidity.
- Wait for a run on one side that fails and returns inside the range.
- The objective is then the opposite side of the range.
- Drop to a lower timeframe to find the entry toward that opposite side.
- Expand the drawn boundaries as new extremes print.
- If price stays stuck inside the drawing, there is no trade.
- If price gets below the formation and cannot get back into the range, expect continuation lower (mirror
  for highs).
invalidation:
- Price remains inside the formation, chopping, taking neither side.
execution:
  bias: Toward the side of the range that has not been taken.
  entry: Lower-timeframe entry after the failed side.
  stop: Not stated.
  targets:
  - the opposite side of the range
  - projected targets from the formation boundaries
measurable:
- hit rate of the opposite range extreme after a failed sweep and return
- how often price instead gets stuck inside (the no-trade case)
