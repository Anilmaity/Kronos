id: htf-opening-price-entry
name: Enter Around The Higher-Timeframe Opening Price
definition: 'The positional argument against chasing: you want to be entering in the middle of the
  candle or near its opening price, not after the candle has already made its range. He applies it
  to reject a silver setup sitting at the range highs with the daily range already covered, and says
  explicitly that this is what keeps him from chasing. The same principle appears as the mechanical
  form of his bullish day - working from the previous day''s EQ and wanting the wick to form in the
  upper part of it, with the previous month''s EQ nearby.'
category: entry
status: specified
detection_rules:
- Locate the current higher-timeframe candle's opening price.
- Enter near that open or in the middle of the candle's range.
- Do not enter once the candle has already made its range or is at its extreme.
- Cross-check against the daily range already covered.
measurable:
- expectancy by entry location within the higher-timeframe candle range
sources:
- video_id: m0wTBdUe7gs
  title: New York Open Live Q&A
  quote: entering in the middle of the candle or near the opening price
ambiguities:
- '''The middle of the candle'' and ''near the opening price'' are given as one option, but no boundary
  is drawn between acceptable and too-far.'
- Which higher-timeframe candle is meant is context-dependent - the example moved between the daily
  and the 4-hour.
