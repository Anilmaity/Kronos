id: macros-are-htf-opens
name: Macros Are Just Higher-Timeframe Candle Opens
category: time
status: contested
definition: Restated live and tied to the email he sent that morning ('Macros are fake'). A macro is reduced
  to a window of about ten minutes either side of a higher-timeframe candle's close/open. He does not
  want to enter at the end of a higher-timeframe candle after its range is already made; he waits for
  the new candle to open and form its wick. Entering in the first ten minutes of a NEW higher-timeframe
  candle has logic to him; a blanket 20-minute window straddling the open does not. Asked whether 24-hour
  trading will change 'the time macro', he answers that 9:30 is not a macro time but the New York stock
  market open, that the daily candle will still exist, and that if 9:30 loses volatility its role simply
  adjusts.
detection_rules:
- Do not enter in the last minutes of a higher-timeframe candle after its range has formed.
- Entries in the first ~10 minutes of a newly opened higher-timeframe candle are acceptable; the pre-open
  half of a 'macro' window is not.
- 'Exception stated: a positional entry is taken at the open itself.'
sources:
- video_id: rVRk4MLTJSs
  title: New York Open Live Q&A
  quote: I realize macros are just 10 minutes on either side of a candle closing
- video_id: rVRk4MLTJSs
  title: New York Open Live Q&A
  quote: 9:30 is the New York stock market open.
- video_id: rVRk4MLTJSs
  title: New York Open Live Q&A
  quote: I would always wait for the open of the new higher time frame candle.
ambiguities:
- '''Ten minutes'' is his description of other people''s macro windows, not a parameter he trades.'
- The 24-hour-trading answer is speculative opinion, not a rule.
