id: risk-reward-minimum
name: Minimum R and Position Management
category: risk
status: specified
aliases:
- 2R
- look for two R
definition: '2R is the default target across this entire unit - it appears in essentially every worked
  trade, with the stop on the protected swing / model invalidation. Where the geometry does not offer
  2R, the stated fix is to MOVE THE ENTRY (down to a fair value gap, or wait for a retest) or to
  use the BODIES rather than the wick for the stop - never to widen the target or take a worse trade.
  Runners are the exception: once the short-term target is banked, a portion is held toward the higher-timeframe
  objective, which is where the outsized R comes from.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- A valid model with a defined invalidation.
detection_rules:
- Stop on the protected swing / the model's invalidation; measure R to the nearest previous candle
  extreme.
- If 2R is not available, adjust the ENTRY (retest, or deeper into the fair value gap) or use the
  bodies rather than the wick for the stop.
- If neither works, do not take the trade at that location.
- Partial at the short-term target; hold a runner to the higher-timeframe target.
- A target slightly beyond the nearest level may be extended 'a little' to make 2R work.
invalidation: []
measurable:
- distribution of achievable R at model formation
- how often the entry-adjustment rule converts a sub-2R setup into a 2R setup, and its hit rate
sources:
- video_id: WFqLwOp2pXw
  title: How To Trade Consolidation - Phases Of Price
  quote: can extend it a little for 2 R
- video_id: F0G31iLVpVg
  title: How To Trade Retracement - Phases Of Price
  quote: I wouldn't really trust the body here with the lack of wick
- video_id: xMFd_kfmIqI
  title: Positional Entries - Enter Before The Expansion
  quote: if the risk to reward does not make sense
- video_id: A4NasIa371c
  title: How to Set Price Targets Using the Fractal Model
  quote: take off a portion of your position at your short-term target
ambiguities:
- 2R is universal in the examples but never stated as a rule; it is a revealed default.
- The runner size is never specified.
- '''Manipulate your entry or your stop loss in some way'' is explicitly discretionary.'
