  quote: that closure right there over my level was the early warning
ambiguities:
- '''Aligned lower timeframe'' is defined by the pairing table, which is itself only partially stated
  (daily->hourly, 4H->15m, hourly->5m).'
- Whether the CISD must complete before the HTF candle closes or may form after is shown both ways.
