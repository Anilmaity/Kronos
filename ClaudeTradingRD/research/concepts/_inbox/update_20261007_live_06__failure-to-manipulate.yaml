id: failure-to-manipulate
name: Failure To Manipulate (deflated to phases of price)
category: structure
status: specified
voice: ttrades
definition: 'Cross-asset reading: ES took a low and then formed a protected swing (continuation) instead
  of reversing - a failure to form a reversal / failure to manipulate - which he reads as the correlated
  assets continuing in the same direction.'
detection_rules:
- If one asset sweeps a low and forms a protected swing instead of a reversal, read it as failure to manipulate.
- Expect the correlated assets to continue in the same direction.
