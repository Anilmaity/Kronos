id: level-to-trade-away-from
name: No Level to Trade Away From, No Trade
category: entry
status: specified
definition: 'Stated as a top-down principle with a decidable rejection test. Price should reverse at
  a RELEVANT point of interest; a candle closing back inside its previous range is not enough on its
  own. The rejection test given is positional: if reversing here would leave a low untaken to the left,
  it does not make sense to reverse and form a failure swing there - so he either misses the move if
  it does reverse, or waits for price to reverse off the key level. Only once price hits the key level
  does he drop to the lower timeframes to look for the reversal structure - shown as a change in the
  state of delivery and then a continuation forming off it.'
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 15m
  - 5m
  fractal: true
preconditions:
- A top-down read is in progress with key levels marked.
detection_rules:
- Require price to be AT a relevant point of interest before accepting a reversal.
- 'Rejection test: if reversing here would leave a low (or high) untaken to the left, do not accept
  it.'
- Accept missing the move rather than taking a reversal without a level.
- Only after price hits the key level, drop to the lower timeframes for the reversal structure.
- Reversal structure = a change in the state of delivery, then a continuation forming off it.
invalidation:
- Price reverses without reaching the key level - a missed move, by design, not a trade.
measurable:
- share of reversals that occur at a marked key level versus away from one
- cost of the missed-move branch over a sample
