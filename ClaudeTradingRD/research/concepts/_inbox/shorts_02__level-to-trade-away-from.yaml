ambiguities:
- '"Relevant point of interest" and "key level" are used interchangeably in the clip and neither is
  defined here.'
- The leave-a-low-to-the-left test assumes exactly one candidate low; no rule handles several.
- Which lower timeframe to drop to is not stated.
