id: average-daily-range
name: Average Daily Range (eyeballed) as target filter
category: risk
status: contested
voice: ttrades
aliases:
- ADR
- average daily range
definition: 'This unit adds TTrades'' first explicit arithmetic definition: ADR = total high-to-low range of N daily
  candles divided by N (slide: 297 + 379 + 314 = 990 points over 3 days = 330), with ''ideally a few more'' than
  three days. He names the TradingView ''Average Daily Range'' technical indicator and says to change its timeframe
  setting from chart to daily - yet in the same video says he likes to eyeball the ADR off how big recent candles
  are. The ADR is laid on the current day from the extreme already made to judge what is still reachable.'
detection_rules:
- ADR = sum(daily high - low over N days) / N; N unspecified, > 3 recommended.
- 'TradingView: add ''Average Daily Range'' (technicals), set its timeframe to daily.'
- Project ADR from the current day's extreme; levels beyond that projection are not realistic targets today.
