ambiguities:
- Library variants say he rejects an ADR indicator and only reads recent expansion candles; here he recommends the
  indicator AND eyeballing - contested on method, not on use.
- Indicator lookback not stated; worked ADRs (~950, ~880, ~400, ~116, ~105) given for unnamed instruments.
measurable:
- agreement between eyeballed ADR and indicator ADR at N=5/10/14/20
