id: four-candle-model-window
name: The Model Needs Four Candles
aliases:
- my model just needs four candles
category: model
status: specified
definition: 'The model is scoped to a fixed window of four higher-timeframe candles, which is why
  the indicator''s default higher-timeframe candle count is four and why he refuses a request to make
  it fewer: the four candles are what a swing point needs. He counts them aloud as candle zero or
  one, 2, 3, 4. C1 is not itself labelled on the chart - it exists only as the liquidity that candle
  2''s reversal sweeps.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- A higher-timeframe candle series is displayed.
detection_rules:
- Read the model across four consecutive higher-timeframe candles.
- C1 supplies the liquidity that C2 sweeps; it carries no label of its own.
- The C1 sweep marker can be shown on the higher-timeframe candles only, or hidden.
- Fewer than four candles is not supported - the swing point cannot be framed.
invalidation:
- Not applicable - a framing rule.
measurable:
- share of setups whose full sequence completes inside four HTF candles
sources:
- video_id: sdZkE-naNiY
  title: TTrades Indicator Updates - Walkthrough and Q&A
  quote: my model just needs four candles
ambiguities:
- He says 'candle zero or one 2 3 4' in one breath, so whether the count starts at 0 or 1 is left
  open.
- Whether the four-candle window is a hard invalidation (a setup that takes five candles is dead)
  or only a display default is not stated.
related:
- fractal-model-c2
- fractal-model-c3
- fractal-model-c4
- swing-point
- continuation-timing
contributing_units:
