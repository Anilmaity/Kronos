id: cross-asset-target-transfer
name: "Cross-Asset Target Transfer"
aliases: ["hold the pound short until the dollar hits its gap"]
category: structure
status: specified
voice: ttrades
definition: >
  FX version of the rule: he is bullish the dollar into a daily gap, which frames bearish
  continuations on EUR and GBP (he prefers GBP). A GBP/EUR short can be held until DXY reaches
  that gap - a good profit-taking target - or, it being an expansion day, generally until the
  close.
timeframes:
  htf: ["1D"]
  ltf: ["5m"]
  fractal: false
detection_rules:
  - "Mark the DXY draw (daily gap) before the open."
  - "Exit GBPUSD/EURUSD shorts when DXY tags that draw; otherwise on an expansion day hold to the close."
measurable:
  - "R of GBP shorts exited at DXY target vs at the close."
sources:
  - video_id: KBJAGgkXdeI
    title: "New York Open Live Q&A"
    quote: "So that would frame any sort of bearish continuation on euro or pound"
  - video_id: KBJAGgkXdeI
    title: "New York Open Live Q&A"
    quote: "you can hold until the dollar hits that level a good profit taking target"
  - video_id: KBJAGgkXdeI
    title: "New York Open Live Q&A"
    quote: "can generally hold till the close."
ambiguities:
  - "Which 'close' (session or daily) is meant is not stated."
python_detector: null
related: ["intermarket-correlation-not-used", "currency-pairing-opposition"]
