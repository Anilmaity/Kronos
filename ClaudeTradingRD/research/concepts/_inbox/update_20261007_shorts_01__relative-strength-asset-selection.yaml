id: relative-strength-asset-selection
name: Ranking Correlated Assets And Trading The Middle One
category: structure
status: contested
voice: ttrades
definition: >
  Two Shorts compare correlated assets with SMT and candle closures. (1) SMT: at a shared low,
  the asset making a higher low while the other makes a lower low is "propped higher" and is the
  stronger one; on the upside, the asset that takes out highs is read as more bullish than one
  held lower. (2) Closures, applied to gold: XAUUSD and gold-GBP (XAUGBP) are compared on the
  candle that validates a bearish change in the state of delivery. The asset whose candle closes
  below the CISD level is the weaker one; the asset that cannot close below that level is stronger.
  He states that the closures of the candles that create the CISD or the continuation are where
  relative strength usually shows.
detection_rules:
- 'SMT reading: at a shared swing low, higher low = stronger asset, lower low = weaker asset.'
- 'Upside: the asset that takes out its prior highs is more bullish than the one held below them.'
- 'Closure reading: on the candle that should validate a CISD, the asset that closes through the CISD level is weaker (bearish case); the asset that fails to close through it is stronger.'
- 'Gold application: compare XAUUSD against XAUGBP on that CISD-validating candle.'
