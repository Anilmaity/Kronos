id: cross-asset-reversal-confirmation
name: The Strongest Asset Must Reverse for the Weakest to Expand
category: structure
status: contested
voice: ttrades
definition: Live worked example of the rule refusing a trade. With NQ the strongest index and ES/YM weaker,
  a short in ES needed the strongest asset (NQ) to sweep and reverse off its own high first, giving SMT;
  only then would he frame ES lower. NQ only printed failure swings below that high, so he declined every
  short in the session even though price later fell.
detection_rules:
- Rank NQ/ES/YM; identify the strongest asset for a short idea.
- Require the strongest asset to sweep its relevant high and reverse; failure swings below the high do
  not count.
- Only then trade the middle/weaker asset (ES) in the SMT direction.
ambiguities:
- He adds that if the weak asset's continuation is 'too far away' he avoids it; distance is not quantified.
sources:
