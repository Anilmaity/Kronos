  quote: a breaker and it really isn't but I do find that it works
ambiguities:
- Which swing low qualifies as 'a low that can be swept' is not filtered - no separation or age requirement
  is given.
- The SMT substitution names no correlated asset in most examples and gives no divergence tolerance.
- The fair-value-gap variant (see intermediate-term-swing-formation) is admitted by the speaker not
  to be a real breaker at all.
- No maximum distance or bar count between the sweep and the higher high is stated.
