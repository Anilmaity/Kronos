id: nfp-week-protocol
name: Non-Farm Payroll Week Protocol
aliases:
- NFP protocol
category: time
status: specified
definition: 'The week-shape rule for a non-farm payroll week, which he credits to AM Trades: interest
  lies mainly on FRIDAY, post release. Tuesday and Wednesday are also watched. Thursday is avoided because
  it is the day prior to a high-impact release. Monday is already excluded by his standing rule.'
timeframes:
  htf:
  - 1W
  - 1D
  ltf: []
  fractal: false
detection_rules:
- NFP is scheduled this week (Friday).
- 'Friday post-release: primary focus.'
- 'Tuesday and Wednesday: watch.'
- 'Thursday: avoid (day prior to high impact).'
- 'Monday: already skipped.'
measurable:
- distribution of tradeable-day outcomes in NFP weeks vs non-NFP weeks
sources:
- video_id: hKCMqh0ZsY0
  title: How To Use The Economic Calendar For Trading
  quote: my interest lies mainly on Friday post news release
- video_id: hKCMqh0ZsY0
  title: How To Use The Economic Calendar For Trading
  quote: I will also watch Tuesday and Wednesday but avoid Thursday
ambiguities:
- '''Post release'' is not bounded — how long after 08:30 the avoidance lifts is not stated.'
- A week carrying both FOMC and NFP (his first example) collapses to two tradeable days; whether that
  is the general consequence is not stated as a rule.
