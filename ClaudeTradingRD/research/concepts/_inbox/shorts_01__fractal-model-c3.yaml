id: fractal-model-c3
name: Candle 3 Continuation (the easier trade)
category: model
status: specified
definition: 'SHORTS EVIDENCE, supplying a crisp price-level definition of the C3 CLOSURE that the long-form
  videos leave implicit: candle 3 closes OVER THE BODY OF CANDLE TWO (bullish; under it in the bearish
  case). This is offered as one of exactly two branches after a candle that reached a point of interest
  without a reversal closure - either price sweeps the previous low and forms a C2 (trade the following
  candle), or it closes over the body of C2 and is a C3 (anticipate expansion in the following candle).
  Once a C3 closure prints, the entire C3 range is marked and the relevant half of it must be respected.
  If the expected continuation fails to close over its level, the remedy is to wait for a NEW low to
  form a NEW protected swing and re-anchor.'
preconditions:
- A candle 2 closure (or a reversal point) already exists on the timeframe in question.
detection_rules:
- C3 closure := the candle closes beyond the BODY of candle 2 in the bias direction.
- 'Branch test at a point of interest: no reversal closure -> either (a) sweep the previous extreme
  and print a C2, or (b) close over the body of C2 and print a C3.'
- After a C3 closure, mark the entire C3 candle range.
- Require the upper half (bullish) / lower half (bearish) of that range to be respected.
- If the continuation fails to close over its level, wait for a new extreme to form a new protected
  swing before re-entering.
- A clean reversal candle (C2) is what sets up the clean continuation candle (C3).
invalidation:
- Price trades through the wrong half of the C3 range instead of respecting it.
measurable:
- frequency of the C2-branch versus the C3-branch after a point of interest is tagged
- hit rate of 2R when entering in the respected half of a C3 range
