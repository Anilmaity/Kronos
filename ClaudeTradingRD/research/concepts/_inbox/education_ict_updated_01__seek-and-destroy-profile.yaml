id: seek-and-destroy-profile
name: Seek & Destroy (broadening daily profile)
aliases:
- seek and destroy
category: model
status: underspecified
definition: 'The daily profile in which the broadening formation is the day''s shape: price takes one
  session''s high and low, fails to break out, and rotates to take the other side, expanding the range
  in both directions. His session mechanic is explicit: if London took Asia''s high AND low without
  displacing out of either, he anticipates New York using London''s high and low as points of interest
  and/or a broadening formation. He anticipates this profile mostly when the economic calendar is empty,
  or on a day spent waiting for the next day''s news.'
timeframes:
  htf:
  - 1D
  ltf:
  - 1H
  - 15m
  fractal: true
preconditions:
- A day with no high-impact news, or a day waiting on tomorrow's release.
detection_rules:
- Mark the Asia session high and low.
- If London takes BOTH and cannot displace out of either, flag the seek-and-destroy read.
- Mark London's high and low; those become New York's points of interest.
- Extend the broadening lines as each new extreme is made; expect the untaken side to be sought after
  each failed breakout.
- 'Higher-timeframe signature: the daily candle is an outside bar (both previous day high and low taken).'
invalidation:
- A session displaces cleanly out of one side and holds — trend day, not seek and destroy.
measurable:
- frequency of days where London takes both Asia extremes
- share of those days that print an outside daily bar
- conditional frequency on empty-calendar days vs news days
sources:
- video_id: Tjk9bXERZy0
  title: Broadening Formations - ICT Seek & Destroy
  quote: if London session took Asia high and low then I'm anticipating New York
