  quote: a broadening information on a higher time frame will be an outside bar
ambiguities:
- He offers to make a dedicated video on this profile, so the treatment here is deliberately partial.
- Session boundaries are set by an indicator ('_boxes') whose settings he says he adjusts and does not
  disclose.
- No rule says how to trade the profile beyond using the session extremes as points of interest.
