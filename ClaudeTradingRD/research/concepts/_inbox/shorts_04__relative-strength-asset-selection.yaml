    quote: "This is where we can use separation."
  - video_id: nNfhTDkyhtw
    title: "Using Candle Closures to Measure Relative Strength & Weakness"
    quote: "This is a doji candle, while this is an engulfing bearish candle."

ambiguities:
  - "'Separation' is measured by eye off the chart; no normalisation (points, ATR, percentage) is given."
  - "The order of precedence is implied by the narration (SMT first, separation when SMT is absent) but never stated as a rule."
  - "'Doji' and 'engulfing' are used without the closure-size thresholds that would make them decidable."

python_detector: null
