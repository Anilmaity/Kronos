  title: Q&A Live with Alex's Options - ICT + Strat
  quote: we know we're not targeting inefficiencies
ambiguities:
- How far back to enumerate the consolidations is not stated.
- '''Consolidation'' is not sized or bounded here - it is identified by eye on the chart.'
