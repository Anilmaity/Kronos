id: target-consolidation-lows-not-fvgs
name: After A Market Maker Model Reverses, Target The Consolidation Lows, Not The Inefficiencies
aliases:
- stop losses left behind
- consolidation lows as targets
category: liquidity
status: specified
definition: 'When an uptrend built from a series of stacked consolidations reverses, the draw is the
  lows of those consolidations - the stop losses left behind by everyone who bought them - and not
  the fair value gaps inside the up-move. Fair value gaps are demoted to targets: the top edge and
  the bottom edge of a gap are used the way relatively equal highs and lows are used, but the gap
  is not expected to hold price. He names the error being corrected: seeing one fair value gap fill,
  green candles emerge from it, and concluding the move back to the high is on, while the structure
  is still printing lower highs and lower lows. He also separates two things that sound alike - targeting
  liquidity is not the same as looking for liquidity to get run - and offers the rule as the way to
  re-enter a move already missed, by extending the consolidation lows forward and trading the next
  leg.'
timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- A prior expansion composed of identifiable consolidations.
- A confirmed reversal of that expansion (lower highs and lower lows established).
detection_rules:
- Identify the consolidations that built the prior expansion; their lows (highs, mirrored) are the
  liquidity targets after the reversal.
- Treat fair value gaps inside the prior expansion as take-profit levels only - use the top edge and
  the bottom edge as you would relatively equal highs and lows.
- Do not read a reaction out of one of those gaps as a trend change while lower highs and lower lows
  persist.
- Extend the consolidation lows forward as levels; they remain valid targets on later legs.
invalidation:
- Price reclaims the structure highs that defined the reversal.
measurable:
- hit rate of consolidation lows vs fair value gaps as post-reversal targets
- share of post-reversal reactions at fair value gaps that fail to produce a trend change
sources:
