id: stop-loss-placement
name: Stops Belong Behind Long-Term And Intermediate-Term Swings, Never Short-Term Ones
aliases:
- stop behind long term highs and lows
category: risk
status: specified
definition: 'Rauf says he does not read market structure for direction, but he does use it for one thing:
  stop placement. He finds the best stops form at intermediate-term and long-term highs and lows, and
  that placing stops above long-term highs (or below long-term lows) is much safer. Short-term highs
  and lows he considers much riskier as stop locations.'
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  fractal: true
preconditions:
- Swing points labelled short-term / intermediate-term / long-term.
detection_rules:
- Place the stop beyond a long-term high or low where available.
- Intermediate-term highs and lows are the acceptable second choice.
- Do not place the stop beyond a short-term high or low.
invalidation: []
measurable:
- stop-out rate by swing class
- average adverse excursion beyond short-term vs intermediate-term swings
sources:
- video_id: qFtfD09Vv3E
  title: Live with Day Trading Rauf - Preparing for a New Week
  quote: the best ones will form at intermediate term highs and lows
ambiguities:
- The short/intermediate/long labelling is assumed from ICT and not defined here.
- No rule reconciles a long-term stop with a risk-to-reward floor when the long-term swing is far away.
related:
- advanced-market-structure-labeling
- protected-swing
- position-sizing-fixed-risk
- stop-size-reduction
contributing_units:
- live_stream_guests_02
draft_count: 1
voice: guest
guest_sources:
- Day Trading Rauf
