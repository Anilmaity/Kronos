name: Do Not Fade The Current Daily Candle
category: model
status: contested
definition: 'Live lesson at the end of a chopped session: the daily profile was still bearish (open high
  first), so the bullish NQ retracement he had framed was fighting the daily candle. Fading the daily
  profile is allowed only with lower expectations - daily open, maybe intraday highs, not a trend day;
  when trades line up well the daily candle supports them.'
detection_rules:
- If the intended trade opposes the developing daily candle, cap targets at the daily open and intraday
  extremes; do not expect a trend day.
