id: ttfm-minimal-toolkit
name: "Minimal Toolkit (what is on the chart, and what is deliberately not)"
aliases: ["remove anything else", "how to make your own model"]
category: model
status: specified

definition: >
  This unit is the fullest enumeration in the corpus of what he does not use, because viewers
  spend four streams offering him tools. Asked how to build a model he gives the procedure that
  produced his: find concepts that make sense to you, blend them into a mechanical way to enter
  the market, and remove everything else - and he names what he himself removed from earlier
  versions, being breaker blocks, advanced market structure, discount and premium. The refusals
  in this unit: kill zones, macros ("I believe in macroeconomics but I don't believe in ICT
  macros. I think those are fake"), CRT, breakers, rejection blocks (except as wicks on doji /
  hammer / shooting-star candles), fib retracements, the weekly EQ, DXY as a correlation for
  the indices, RTY, volume-profile POC, order flow / delta / absorption, the PSP label, the
  first-presented fair value gap, the New York p.m. session, and the idea of a single market
  algorithm. His stated test for order flow is the one worth keeping: he asks whether there is
  a mechanical definition of absorption and of where the entry is, and drops the tool because
  there is not.

timeframes:
  htf: ["1D", "4H"]
  ltf: ["15m", "5m"]
  fractal: false

preconditions:
  - "A chart and a candidate concept."

detection_rules:
  - "Keep only concepts that can be stated mechanically enough to define an entry; discard the rest."
  - "On the chart: highs, lows, fair value gaps, opposing candles / order blocks, CISD, protected swings, and higher-timeframe candles displayed alongside the working timeframe."
  - "Not on the chart: kill zones, ICT macros, CRT, breakers, rejection blocks, fib retracements, weekly EQ, volume profile POC, order flow / delta, RTY, DXY-for-indices."
  - "Rejection-block exception: wicks are used only on doji, hammer and shooting-star candles."
  - "Volume profile exception: if used at all, on a higher timeframe and for low-volume nodes, never the POC - price sitting where the volume is means consolidation."
  - "Chart layout: NQ left, ES middle, YM right, fixed; higher-timeframe candles drawn beside each pane so timeframe alignment is read without switching charts."

invalidation:
  - "Not applicable."

measurable:
  - "whether adding any rejected tool as a filter improves expectancy on the same trade set"

sources:
  - video_id: eIPM-D8RrSQ
    title: "New York Open Live Q&A"
    quote: "Is there a mechanical definition for absorption?"
  - video_id: N3Ml-r0X30o
    title: "New York Open Live Q&A"
    quote: "I don't really use kill zones. I just use higher time frame candles."
  - video_id: x4sRGuZIqWk
    title: "New York Open Live Q&A"
    quote: "I don't trade CRT. I trade my fractal model."
  - video_id: i2HhHhWdaPQ
    title: "New York Open Live Q&A"
    quote: "I only use wicks on dogee candles or like hammer shooter candles"

ambiguities:
  - "The refusals are personal-preference statements, not claims that the tools do not work - he repeatedly tells viewers to use whatever they want as long as they follow rules."
  - "'Dogee' is the auto-caption's rendering of doji; 'hammer shooter' is read as hammer / shooting star."
  - "He says his indicator contains more than is publicly known, so the on-chart list may be incomplete."

python_detector: null
related: ["killzones", "macros-not-used", "point-of-interest", "chart-data-settings", "one-model-focus"]

contributing_units: ["live_streams_04"]
draft_count: 1
voice: ttrades
