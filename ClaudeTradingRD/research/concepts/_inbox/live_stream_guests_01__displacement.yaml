- "'A small Wick breaks the load' (the audience question, garbled by the captioner from 'a small wick breaks the low') has no size threshold either."
- "The transcript carries no speaker labels, so the exact turn boundary in this exchange is inferred; both speakers state the fair-value-gap requirement in adjacent turns and agree."
- "How many candles a fair value gap may take to form for the break to still count is not stated."

