id: displacement
name: "Displacement"
aliases: ["aggression", "energy of a move"]
category: structure
status: specified
voice: mixed
guest_sources:
- "$niper (Matt)"

definition: >
  The test both speakers apply, in consecutive turns, to decide whether a break of a swing is real.
  A break must be an aggressive move that leaves a fair value gap. A small wick through a low
  followed by an aggressive move back up is not a break at all - it is a liquidity grab that
  continues the prior direction. The corollary TTrades states in his own words is diagnostic rather
  than merely definitional: if the up-moves on the chart contain no fair value gaps, there is no
  aggression and therefore no reason to be bullish.

timeframes:
  htf: ["1D", "4H", "1H"]
  ltf: ["15m", "5m", "1m", "15s"]
  fractal: true

preconditions:
- "A swing high or low has been traded through."

detection_rules:
- "Require the move through the swing to leave a fair value gap. No fair value gap, no displacement."
- "A small wick beyond the swing followed by an aggressive move back in the opposite direction is classified as a liquidity grab, not a structure break."
- "TTrades' directional reading: scan the legs in the candidate direction; if none of them contain fair value gaps, the direction has no aggression behind it and is not traded."
- "$niper's corollary: without a fair value gap there is no array to retrace into, so there is no entry even if the break is accepted."

invalidation:
- "The move back through the level is itself aggressive and leaves a gap in the opposing direction."

measurable:
- "outcome of breaks that left a fair value gap versus breaks that did not"
- "frequency of small-wick breaks that reverse (liquidity grabs) versus continue"

