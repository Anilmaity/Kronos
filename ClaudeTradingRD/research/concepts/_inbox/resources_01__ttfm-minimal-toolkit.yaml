ambiguities:
- 'PROVENANCE: this is an early tooling video. The later, canonical statements under this id explicitly
  list kill zones, OTE / fibonacci retracements, breakers and the midnight open among the things
  he does NOT use. Both readings are kept; this one is the older and should not be read as current
  practice.'
- The video demonstrates that the templates EXIST on his chart; it does not say he trades from them,
  so 'uses' is an inference and is not asserted here.
- '''OT'' is the auto-caption rendering of OTE.'
- No kill-zone hours are stated even though the kill-zone indicator is loaded on screen.
