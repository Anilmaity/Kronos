id: ttfm-minimal-toolkit
name: Minimal Toolkit (what is on the chart, and what is deliberately not)
definition: 'EARLIER-ERA EVIDENCE, and it runs against the later refusals. In this tooling walkthrough
  the templates he saves and demonstrates include a kill-zones-and-pivots indicator, an OTE template
  with every level marked out, and a premium/discount box - all three of which the later live-stream
  material lists among the tools he has removed. Also present: power-of-three and weekly-candle power-of-three
  indicators, an open-high-low-close indicator, a three-day lookback template, standard-deviation
  projections, and a watermark. The continuity with the later toolkit is the PD-array set itself:
  breaker / mitigation blocks, fair value gaps, order blocks, buyside and sellside liquidity, SMT
  and range deviations each get their own saved drawing template.'
category: model
status: contested
aliases:
- templates
- indicators
- what is on the chart
preconditions:
- None.
detection_rules:
- 'On the chart in this era: kill zones and pivots, OTE levels, a premium/discount box, power of
  three, weekly candle power of three, open-high-low-close, three-day lookback, projections, watermark.'
- 'Drawing templates maintained for: breaker / mitigation blocks, fair value gaps, order blocks,
  buyside and sellside liquidity, SMT (separate high and low), buy stops and sell stops, range deviations.'
- Templates are switched wholesale rather than toggling indicators individually.
invalidation:
- Not applicable.
measurable:
- which tools survive from this era into the later toolkit, as a timeline of the method
sources:
