id: tgif-setup
name: TGIF Setup
category: model
status: contested
voice: ttrades
definition: >
  Negative Short: Tuesday forms the high of the week, Wednesday and Thursday both expand, but
  no relevant level has been hit. Therefore he does not look for Friday to return into the
  weekly range to form the weekly wick; he expects continuation toward the target instead, and
  price does reach lower. TGIF does not apply until the relevant level is hit.
timeframes:
  htf: ["1W", "1D"]
  fractal: false
preconditions:
- Weekly high (bearish week) on Tuesday with Wednesday and Thursday expansion.
detection_rules:
- Before calling TGIF, check whether a relevant level has been hit; if none, expect Friday continuation toward the target, not a retrace into the range.
invalidation:
- No relevant level hit by Thursday - TGIF is not applicable.
sources:
- video_id: lGew8anIeLA
  title: TGIF Doesn't Apply Until the Relevant Level Is Hit
  quote: Well, we have never hit any relevant level.
- video_id: lGew8anIeLA
  title: TGIF Doesn't Apply Until the Relevant Level Is Hit
  quote: where I'd want to see a continuation to reach for this target.
ambiguities:
- The target / relevant level is not named in the transcript.
related: [relevant-level, level-to-trade-away-from]
