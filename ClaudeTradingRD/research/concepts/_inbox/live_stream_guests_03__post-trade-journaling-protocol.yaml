id: post-trade-journaling-protocol
name: Review Every Trade, And Journal What Is Happening Outside Trading
aliases:
- your trade journal is your flight path
- what is measured can be improved upon
category: psychology
status: specified
definition: 'Every trade is reviewed after the fact, winners included, and the review is against the
  plan written before entry. The guest offers this as the one guarantee he is willing to make - that
  reviewing trades produces improvement - and frames refusal to review as refusal to accept responsibility
  for the outcome. The journal must also carry non-trading context: what is going on in the trader''s
  life and career, on the argument that trading will not solve non-trading problems and that unresolved
  emotion surfaces in execution. The governing metaphor is aviation: the journal is the flight path,
  a small deviation caught early is cheaply corrected, and a long stretch flown in the wrong direction
  takes time to undo.'
timeframes:
  htf: []
  ltf: []
  fractal: false
preconditions:
- A written pre-trade plan exists to review against.
detection_rules:
- Review every trade taken, winners included, against the plan written before entry.
- Record what is happening outside trading - life, career, state of mind - in the same journal.
- 'Use the review to classify the cause of a losing run: the trader, the system, trade management,
  market conditions or the broker.'
- If not currently in a fit state of mind, do not trade at all that session.
invalidation:
- Not applicable - process rule.
measurable:
- journal completion rate against trades taken
- expectancy of trades taken on days flagged as poor state of mind vs the rest
sources:
- video_id: kG8BuEPVppo
  title: Psychology & Best Practices with STRATalorian
  quote: if you review your trades then you can improve as a Trader
ambiguities:
- No template, cadence or storage format is prescribed.
- This conflicts with the mature-stage policy recorded elsewhere in the corpus of journalling only
  losers and emotional trades; the two are different traders' policies, not one speaker contradicting
  himself.
