id: cisd
name: Change In State Of Delivery (CISD)
category: entry
status: specified
aliases:
- change in the state of delivery
- CISD level
definition: 'The primary teaching gives one definition, twice, in the same two-part form: a change in
  the state of delivery is (a) price REACHING INTO AN IMPORTANT LEVEL -- sweeping out a low or reaching
  into a fair value gap -- and then (b) CLOSING THROUGH THE SERIES OF CANDLES that reached into that
  level. He also gives the ontology: it is ''the order block formation that forms when trend changes''.
  Its role is fixed: it is a confirmation of a swing point and nothing else -- it is looked for inside
  an already-printed candle 2 or candle 3 closure on the timeframe above, and a CISD with no such closure
  is discarded outright.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 1H
  - 30m
  - 15m
  - 5m
  - 3m
  - 1m
  fractal: true
preconditions:
- A candle 2 or candle 3 closure on the timeframe above (otherwise the CISD is meaningless).
- 'An important level: a low/high to sweep, or a fair value gap to trade into.'
detection_rules:
- Find the extreme of the higher-timeframe closure candle on the lower timeframe.
- Confirm that extreme reached an important level (swept a low/high, or tagged a fair value gap).
- Identify the SERIES of same-direction candles that reached into that level (may be one candle).
- Require a close through that series. Before that close, the swing point is unconfirmed.
- If a new extreme forms first, re-anchor on the new series.
- 'Quality: a fast V-shape is wanted. A close-through that took roughly half the candle to arrive is
  read as consolidation, not a confirmed reversal.'
- The CISD LEVEL (the opening price of that series) doubles as a last-resort point of interest -- but
  only when no fair value gap and no swing high/low exist in the range.
invalidation:
- No close through occurs -- 'this is not a valid fractal model and I would not be looking for a continuation'.
- Price closes back beyond 50% of the bodies of that opposing-candle series.
execution:
  bias: Away from the confirmed extreme.
  entry: At market on the close through, on a retest of the CISD level, or on a later continuation.
  stop: The protected swing created by the CISD, or its body extreme.
  targets:
  - 2R
  - standard deviation projections
  - drawn liquidity
measurable:
- CISDs per higher-timeframe candle
- share of HTF closures that receive a CISD
- outcome split by V-shape vs slow close-through
sources:
