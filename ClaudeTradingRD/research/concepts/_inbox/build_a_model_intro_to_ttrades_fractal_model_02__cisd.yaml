  title: 'The Phases of Price Action: A Blueprint for Market Movement'
ambiguities:
- '''The series of candles that reached into that level'' has no bound -- he ignores small candles and
  takes the whole leg when the structure is messy, which is discretionary.'
- Whether the close must be through the series' OPENING PRICE or merely 'over that level' varies between
  passes in the same video.
- The important-level precondition is waived once, when he expects the low to hold with no fair value
  gap present.
- The transcripts of this unit render 'reach' as 'wretch' repeatedly (auto-caption artifact); it is
  read as 'reach' everywhere.
