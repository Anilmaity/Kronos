ambiguities:
- '''Closes the fair value gap'' is not resolved to full fill versus consequent encroachment - the
  examples show full closure but no rule is stated.'
- '''Price tends to reverse or has the possibility of reversing'' is hedged in the source itself
  and carries no probability or follow-through condition.'
- Whether a wick or a body must do the rebalancing is not stated.
- This is an EARLIER recording; the updated playlist re-records the fair-value-gap material, where
  'inversion' rather than 'rebalance' carries most of the post-fill logic. No direct contradiction
  is stated, but the vocabulary shifted.
- The auto-captioner renders 'fair value gap' as 'fair value got' in one place; read as gap.
