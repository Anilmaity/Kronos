id: rebalance
name: Rebalance (of a fair value gap)
definition: 'His dedicated definition of rebalancing, given as exactly two cases. Case one, a gap
  rebalanced AFTER it is created: price comes back and closes the fair value gap, and once it has,
  there is no imbalance left in that area - which he offers as the reason price then tends to reverse,
  or at least has the possibility of reversing. Case two, which he says is what the majority of candles
  do, is a gap rebalanced BEFORE it is created: a candle opens away from the prior candle''s range
  so that a fair value gap would exist if price continued, but price first trades back to balance
  that area, ensuring no fair value gap is created, and only then continues. He says he focuses on
  this second, pre-creation form on the daily chart.'
category: structure
status: specified
aliases:
- rebalancing
- rebalanced
- balanced out
preconditions:
- A three-candle window in which the first and third candles do not overlap (an actual or prospective
  fair value gap).
detection_rules:
- 'Post-creation rebalance: a fair value gap exists, and price later trades back and closes it. That
  gap is now rebalanced.'
- After a post-creation rebalance there is no imbalance left there, so a reversal from that area
  becomes possible.
- 'Pre-creation rebalance: candle 3 opens leaving a would-be gap against candle 1''s extreme.'
- If, before continuing, price trades back through that would-be gap zone, the area is balanced and
  no fair value gap is created.
- 'He applies the pre-creation form mainly on the daily chart: the daily candle opens, comes down
  and rebalances, then moves higher.'
invalidation:
- Price continues away without returning - the fair value gap is created and remains unbalanced.
measurable:
- share of daily candles that rebalance the prior gap before continuing versus leaving a fair value
  gap
- reversal rate immediately following a completed post-creation rebalance
