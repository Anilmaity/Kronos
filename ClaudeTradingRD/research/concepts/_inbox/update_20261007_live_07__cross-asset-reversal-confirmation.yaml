id: cross-asset-reversal-confirmation
name: Cross-Asset Reversal Confirmation
category: structure
status: specified
definition: 'Live restatement on a no-bias pre-FOMC day: with NQ strongest and YM weakest, the bullish
  idea on the strong asset needs the WEAKEST asset (YM) to reverse at its low. The question is framed
  as which asset is lying - YM reverses and the holding assets are right, or YM keeps going and drags
  the rest lower.'
detection_rules:
- For a long on the strongest asset, watch the weakest asset into its low.
- If the weakest asset forms a reversal there (SMT with the stronger assets), the stronger assets may
  drift higher.
- If the weakest asset fails to react and trades well below the low, expect the stronger assets to be
  dragged lower with it.
sources:
- video_id: 9YVBe-20Hdg
  title: New York Open Live Q&A
  quote: You need the weakest asset to reverse.
- video_id: 9YVBe-20Hdg
  title: New York Open Live Q&A
  quote: is YM lying, right? Where it's going to form a reversal here
ambiguities:
- '''Far below the low'' (the point at which the failure to react is declared) is not quantified.'
