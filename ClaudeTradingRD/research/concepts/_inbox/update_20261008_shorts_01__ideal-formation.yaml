id: ideal-formation
name: Ideal Formation (closure and protected swing in the same bar)
category: model
status: contested
voice: ttrades
definition: >
  6IBR6kZ9nrU (a clip of SF61vCsBl1A) restates the late-completing ideal formation. A candle 2
  closure reaches into a fair value gap and closes outside it, but is NOT ideal, because it did not
  close over the down-close candle that reached into the gap. The next candle then closes over both
  candle 2's high and that level, creating a protected swing. With a candle 2 closure, a strong
  candle 3 closure and a protected swing, candle 4 is the ideal continuation. He marks that level and
  the EQ of candle 3 as the area that should support price in candle 4. In the example it holds and
  candle 4 expands.
detection_rules:
- A candle 2 closure that does not close over the opposing series into the point of interest is not ideal.
- If candle 3 then closes over candle 2's extreme and that series, the formation is ideal for trading candle 4.
- Mark the series level and candle 3's EQ; candle 4 should hold there and expand.
