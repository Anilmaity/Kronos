id: consolidation-reversal-week
name: Consolidation Reversal (weekly profile) - the Thursday external-range protocol
category: model
status: contested
voice: ttrades
definition: >
  SHORTS EVIDENCE. After a large-range move the following candles are read as a consolidation or a
  retracement ("a large range to a small range"), which is taken as a continuation signal toward the
  other side of the range / the range high. On the lower timeframe he finds the series of candles that
  made the low and asks whether price has closed over it; it has, so a continuation is looked for on
  Friday. The protected low must not be taken out; price is expected to form its lower wick in that
  area and trade higher. In the worked example price dips slightly below, with an SMT on the low, and
  still expands through the other side of the range.
detection_rules:
  - "Classify the candles after a large-range expansion as consolidation or retracement (large range -> small range)."
  - "Target the opposite side of that range (the range high in the bullish case)."
  - "On the lower timeframe, require a close over the series of candles that made the low before calling the continuation."
  - "The continuation day (Friday in the example) should form its lower wick above that low and trade higher."
invalidation:
  - "Price takes out the low the continuation was built from (tolerance for an SMT-marked marginal break is not quantified)."
sources:
  - video_id: BJL66W1m-c4
    title: "Consolidation Reversal → Expansion"
    quote: "A large range to a small range. We can be looking for a continuation."
  - video_id: BJL66W1m-c4
    title: "Consolidation Reversal → Expansion"
    quote: "So, we don't want to see price do what? Take out this low."
  - video_id: BJL66W1m-c4
    title: "Consolidation Reversal → Expansion"
    quote: "We have an SMT on the low, but then we expand through"
ambiguities:
  - "The clip says 'consolidation or a retracement' and never decides which; both are treated as the same continuation signal."
  - "The lower timeframe used for the close-over check is not named ('zooming in')."
  - "Again price trades 'a little bit lower' than the invalidation low with an SMT and still works; how far a break is tolerated is unstated - same ambiguity as the existing entry."
  - "The weekdays of the large and small ranges are not stated, only that the continuation is looked for on Friday; whether this is the Monday-Wednesday consolidation of the library definition is inferred from the title only."
related: ["continuation-signature", "consolidation-vs-retracement-test", "smt-divergence"]
