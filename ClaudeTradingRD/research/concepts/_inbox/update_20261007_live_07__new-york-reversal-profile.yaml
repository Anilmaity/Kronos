id: new-york-reversal-profile
name: New York Reversal Profile
category: model
status: underspecified
definition: 'Gold example called the clean New York reversal: previous day''s high taken, many failure
  swings, a clean 30-minute formation, targeting the lows. Caveat he adds: price opened below and traded
  up first, so the target sits in a ''weird middle ground'' rather than a normal reversal objective, hence
  he does not expect it to run far.'
detection_rules:
- Previous day high taken out.
- Failure swings at the high.
- Clean 30-minute reversal formation; target the lows.
- If the open was below and the move up was from there, reduce target expectation.
