ambiguities:
- Conflicts with the library's naive 'zoom in, nearest high and low' definition (CAuN4tvLInQ); this video anchors the range to the C2 extreme and the swing that created it - hence contested.
- '"The swing high that made this swing low" is not defined beyond walking back on higher-timeframe candles; which swing definition (3-bar fractal or otherwise) is not stated.'
- The 25% cutoff is stated only for shorts; the 75% mirror for longs is inferred.
- He marks the range on higher-timeframe candles but says he 'prefers to do it on the lower time frame' - wick vs body extremes not stated.
- Caption 'shorten the premium' = 'short in the premium'; 'gone box' = Gann box.
