id: dealing-range
name: Dealing Range
category: structure
status: contested
voice: ttrades
aliases:
- overall dealing range
- the overall range that we are trading within
definition: >
  In the TTFM "Dealing Ranges" video the dealing range is anchored mechanically to a valid fractal
  model rather than to the nearest visible high/low. Start from the candle 2 extreme being traded
  away from (the C2 low for a long). On the higher-timeframe candles, walk back to the opposite swing
  that "made" that extreme - the swing high from which the leg into the C2 low began; this is not
  necessarily candle 1. The range from that swing to the C2 extreme is the dealing range: the far end
  is the overall higher-timeframe target, the near end is the invalidation. Its 0.5 splits premium
  (upper 50%) from discount (lower 50%). Long in discount, short in premium, because that is where 2R
  is reachable before the dealing-range target is taken. He separates this explicitly from his EQ
  concept: candle 3 must still respect the EQ of candle 2 for expansion, while the dealing range is
  the larger range governing where to enter. Ranges are fractal and nest; best R comes from entering
  in the premium (discount) of BOTH the higher-timeframe and the lower-timeframe dealing range,
  taking first profits at the inner range's target and holding runners to the outer one.
timeframes:
  htf: ["1D", "1H"]
  ltf: ["15m", "5m", "1m"]
  fractal: true
preconditions:
- A valid fractal model exists (a candle 2 closure / reversal to trade away from).
detection_rules:
- Identify the swing extreme being traded away from (the candle 2 high or low).
- On the higher-timeframe candles, follow price back to the opposite swing point that made that extreme; continue past candle 1 if needed until that swing is found.
- Dealing range = that swing to the traded-away-from extreme; mark 0.5 (Gann box or 0.5 Fibonacci).
- Bullish setup - take longs around the EQ or in the discount (lower 50%); reject longs high in the premium.
- Bearish setup - take shorts around the EQ or in the premium (upper 50%); at 25% of the range or lower he is 'not really looking for shorts' (mirror for longs at 75%+ by inference).
- Nested ranges - mark the lower-timeframe setup's own dealing range as well; the best entries sit in the premium (shorts) of both the inner and the outer range.
- Swing points define the range mechanically even when the target end is only failure swings.
invalidation:
- Price trades through the near (invalidation) end of the range - the model is void.
- Price has already taken the target end - the range is spent; look for the opposite side instead (in the worked 15m/1m example, longs at the high after the target was taken 'doesn't make sense').
execution:
  bias: From the fractal model (candle 2 / candle 3 closure).
  entry: Any model entry located in the discount (longs) or premium (shorts) of the dealing range, EQ acceptable.
  stop: The protected swing / candle 2 extreme.
  targets: ["2R before the dealing-range target", "Inner dealing-range target for partials, outer dealing-range target for runners"]
measurable:
- R achieved by entry location within the swing-anchored dealing range (deciles)
- share of setups entered below 25% of a bearish range that reach 2R before the range low
- agreement rate between the swing-anchored range and the naive nearest-high/low range
