id: half-wick-respect
name: 0.5 of the Wick Must Be Respected
category: structure
status: specified
definition: SHORTS EVIDENCE corroborating the corpus's load-bearing half-level. Given a candle 2 closure,
  the 0.5 level of that candle's WICK (not of its whole range) is marked out, and that is the zone price
  is expected to reach back up into before the reversal continues. The entry inside it is an intra-candle
  change in the state of delivery.
preconditions:
- A candle 2 closure with a defined wick exists.
detection_rules:
- Take the wick of the candle 2 closure (extreme to body edge).
- Mark its 50% level.
- Expect price to reach into that level and no further.
- Enter on an intra-candle change in the state of delivery inside the level.
invalidation:
- Price trades decisively beyond the 0.5 of the wick.
measurable:
- share of C2 wicks whose 0.5 level contains the subsequent retracement
- hit rate of intra-candle CISD entries at the 0.5-of-wick level
sources:
- video_id: hTsltdflraY
  title: Breaking Down the TGIF Weekly Profile
  quote: with a candle to closure, we'll mark out 0.5 of the wick
ambiguities:
- Whether the wick is measured to the candle's open or to its close (the two body edges) is not stated.
- Whether a wick THROUGH the level or only a close beyond it invalidates is not stated.
