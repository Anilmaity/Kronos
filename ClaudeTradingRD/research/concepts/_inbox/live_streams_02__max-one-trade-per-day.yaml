id: max-one-trade-per-day
name: "One Trade Per Day Cap"
aliases: ["one trade a day max"]
category: risk
status: specified

definition: >
  Prescribed here not as a general policy but as the specific remedy for a trader who says he
  cannot end the day after a loss and must trade back to green. The cap is stated flatly — one
  trade a day max — and he attaches a consequence: if you cannot follow a rule this simple you
  either need to change or you need to quit, because you will not make it. It is paired in the
  same breath with correcting position size, because the underlying failure (revenge trading) is
  described as normally travelling with overleveraging.

timeframes:
  htf: []
  ltf: []
  fractal: false

preconditions:
  - "A diagnosed pattern of revenge trading or of being unable to stop after a loss."

detection_rules:
  - "Hard cap of one trade per day."
  - "Apply it together with a corrected position size, not instead of one."
  - "Treat inability to keep the cap as the decision point: change the behaviour or stop trading."

invalidation:
  - "Not applicable — this is a hard limit."

measurable:
  - "P&L of the first trade of each day versus all subsequent trades"
  - "frequency of cap breaches and their aggregate R"

sources:
  - video_id: m8xcjkOuBHU
    title: "New York Open Live Q&A"
    quote: "One trade a day max."

ambiguities:
  - "Whether the cap is meant permanently or only until the behaviour is corrected is not stated."
  - "He himself takes more than one idea per session in these streams, so the cap is clearly remedial rather than universal."
  - "Scaling into or out of a single idea is not addressed by the cap."

python_detector: null
