id: intermediate-timeframe-bridge
name: Demand The Confirming Structure Shift On The Intermediate Timeframe
aliases:
- 15 5 1
- domino
category: structure
status: specified
definition: 'The timeframe triad in this unit is 15-minute / 5-minute / 1-minute, and the load-bearing
  claim is where the confirming structure change must appear. Trade For Opportunity, relaying ICT,
  says a trader needs three timeframes - a high, an intermediate and a low - and that the most confident
  structure changes should be demanded on the intermediate timeframe at minimum, involving both displacement
  and a close beyond the structure that would invalidate the previous trend. The host restates it
  concretely: with 15/5/1 you ideally want the structure shift on the five-minute. He also gives the
  sequencing preference - a 1-minute break leading to a 5-minute break leading to a 15-minute break,
  a domino - while conceding the cost honestly: by the time the five-minute has confirmed you have
  usually missed the low-risk entry, so the trader is choosing a point on that trade-off rather than
  getting both. The triad itself scales with horizon; only the day-trading version is given.'
timeframes:
  htf:
  - 15m
  ltf:
  - 5m
  - 1m
  fractal: true
preconditions:
- A higher-timeframe bias or point of interest already established.
detection_rules:
- 'Use three timeframes: high (15m), intermediate (5m) and low (1m).'
- Require the confirming structure change on the intermediate timeframe at minimum, with displacement
  and a close.
- Prefer the sequence 1m break -> 5m break -> 15m break (the domino).
- Accept that waiting for intermediate-timeframe confirmation forfeits the lowest-risk entry.
invalidation:
- The lower-timeframe break does not propagate to the intermediate timeframe.
measurable:
- win rate and R of entries confirmed on the intermediate timeframe vs entries taken on the low timeframe
  alone
- average adverse excursion given up by waiting for the intermediate confirmation
sources:
- video_id: 0bH_kkG2q6s
