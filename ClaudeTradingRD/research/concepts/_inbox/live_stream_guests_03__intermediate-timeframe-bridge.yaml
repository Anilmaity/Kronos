ambiguities:
- No time bound is given for how long the domino may take to complete.
- The triad is said to scale with trading horizon ('depends on what your core time frames are') but
  only the day-trading 15/5/1 version is stated.
- The trade-off between confirmation and entry price is acknowledged but no rule resolves it.
