    title: "Change In State Of Delivery [CISD] - Orderblock Formation - ICT Concepts"
    quote: "price goes from bullish to bearish or from bearish to bullish"
  - video_id: 3OivsP1j_UE
    title: "Internal & External Liquidity (Daily Bias) - ICT Concepts"
  - video_id: uDJI2AbyyCs
    title: "Inversion Fair Value Gaps (IFVG) - ICT Concepts"

ambiguities:
  - "Body close vs wick through the opening price is never stated ('closed below' implies body)."
  - "The definition of the 'series' is not given — whether the run must be strictly contiguous, and whether a single down-close candle inside it breaks the run."
  - "CISD is used interchangeably with 'shift structure' / 'market structure shift' in the internal-external video; whether they are the same test is not stated."
  - "The requirement for an important level is inherited from the order block video but is only implied here ('into a higher time frame PD array or important level')."

python_detector: null
