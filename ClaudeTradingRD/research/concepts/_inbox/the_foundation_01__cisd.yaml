id: cisd
name: "Change In State Of Delivery (CISD)"
aliases: ["CISD", "change in state of delivery", "change of state of delivery"]
category: structure
status: specified

definition: >
  The event that marks price switching from bullish to bearish delivery or vice versa, made
  operational as a close through the opening price of the last single-or-series of
  opposing-close candles that traded into an important level. Bearish CISD: price closes BELOW
  the opening price of the up-close candle (or of the FIRST candle of a series of up-close
  candles) that made the high into a higher timeframe PD array. Bullish CISD: price closes OVER
  the opening price of the down-close candle(s) that made the low. The same close simultaneously
  validates those candles as an order block, which is why this video is titled "CISD - Orderblock
  Formation".

timeframes:
  htf: ["1D", "4H", "1H"]
  ltf: ["15m", "5m", "2m", "1m"]
  fractal: true

preconditions:
  - "Price has traded into an important level / higher timeframe PD array."
  - "Preferred (not required): a sweep of buyside or sellside liquidity, ideally visible on a lower timeframe."

detection_rules:
  - "Identify the contiguous run of up-close candles (close > open) that produced the local high into the level."
  - "cisd_level := open of the FIRST candle of that run (stated explicitly twice)."
  - "Bearish CISD fires on the first candle whose close < cisd_level."
  - "Bullish CISD is the mirror: run of down-close candles into the level, cisd_level := open of the first, fires on the first close > cisd_level."
  - "On firing, the run is also validated as an order block at cisd_level."
  - "Multiple sequential CISDs can occur in one leg, each creating a further order block that 'supports price lower'."

invalidation:
  - "Failure to produce the close: he shows price failing to close below the level, so there is no CISD and no trade, until a new sweep occurs."
  - "A subsequent CISD in the opposite direction reverses the state."

execution:
  bias: "Direction of the close that produced the CISD."
  entry: "At the CISD level on retest (i.e. the order block), or at an overlapping fair value gap."
  stop: "On the manipulation extreme (the swept high for shorts, swept low for longs)."
  targets: ["prior session lows/highs", "equal highs/lows", "-2 to -2.5 and -4 to -4.5 projections of the manipulation leg", "minimum 2R"]

measurable:
  - "count of CISD events per session and per timeframe"
  - "hit rate of a fixed 2R trade taken on the first retest of cisd_level"
  - "share of CISDs preceded by a liquidity sweep vs not, and the hit-rate difference"

sources:
