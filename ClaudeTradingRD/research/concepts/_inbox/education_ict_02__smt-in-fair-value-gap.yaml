id: smt-in-fair-value-gap
name: SMT Inside A Fair Value Gap
category: liquidity
status: specified
definition: 'A third SMT location, stated by TTrades in his own voice (the library previously held
  this ''SMT fill'' idea only from a guest). Instead of comparing the two assets at a shared high
  or low, compare them at the same FAIR VALUE GAP: after an aggressive move, both assets leave a gap;
  the divergence is that one asset trades UP INTO its gap while the correlated asset does not. He
  walks the case where S&P enters its gap and NASDAQ does not, and the resolution is a move down to
  the low followed by the ordinary SMT at that low.'
timeframes:
  htf:
  - 15m
  ltf:
  - 5m
  - 2m
  - 1m
  fractal: true
preconditions:
- Both correlated assets have left a fair value gap from the same move.
detection_rules:
- Draw the equivalent fair value gap on both correlated assets.
- SMT-in-gap exists when one asset trades into its gap and the other does not.
- Read it the same way as an SMT at a high or a low - as a possible reversal signal in the direction
  away from the asset that failed to reach.
measurable:
- reversal rate after an SMT-in-gap vs an SMT at a swing extreme
sources:
- video_id: q1NmxUTm4n4
  title: SMT Divergence - ICT Concepts
  quote: we have an SMT within a fair value gap
ambiguities:
- '''Trades into the gap'' is not specified as near edge, consequent encroachment or full fill.'
- The two assets' gaps are not required to be identical in size or in candle position.
- Only one example is given.
related:
- smt-divergence
- fair-value-gap
- smt-as-confirmation-not-signal
voice: ttrades
contributing_units:
- education_ict_02
draft_count: 1
python_detector: null
