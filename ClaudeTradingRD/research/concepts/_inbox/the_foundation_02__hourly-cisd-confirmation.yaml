id: hourly-cisd-confirmation
name: Hourly Change In The State Of Delivery (confirming a daily wick)
aliases:
- change in the state of delivery to form this Wick
category: entry
status: specified
definition: 'The top-down video shows that this gate is not hourly-specific but is applied at every
  level of the stack. The operation is unchanged - locate the extreme, identify the series of opposing-close
  candles that made it, and require a close through that series - but in a single walkthrough he
  demands it on the hourly to confirm a daily wick AND again on the 5-minute to confirm the 5-minute
  low he is entering against; in the silver example the weekly candle''s own closure through the
  up-close candles that made the high is read as the same event, and then again on the 15-minute.
  He states its purpose in one line: it is what confirms the wick has formed.'
timeframes:
  htf:
  - 1W
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  fractal: true
preconditions:
- A higher-timeframe candle has traded into a point of interest and is a candidate reversal.
detection_rules:
- Locate the extreme inside the candidate candle, identify the consecutive series of opposing-close
  candles that made it, and require a close through that series.
- 'Bullish: close over the series of down-close candles that made the low. Bearish: close below the
  series of up-close candles that made the high.'
- The series may be a single candle - he says so explicitly on the weekly example.
- The closure is what confirms the higher-timeframe wick has formed, and only then is the candle
  tradeable away from.
- 'Applied fractally in a single walkthrough: on the hourly to confirm the daily, and again on the
  5-minute at the entry; and on the 15-minute under the 4-hour in the silver example.'
invalidation:
- The closure through the series has not yet occurred - the wick is not confirmed and no entry is
  taken.
measurable:
- share of higher-timeframe candidate reversals that receive the confirming closure
- difference in outcome between requiring the CISD at every level of the stack vs only at the structure
  timeframe
sources:
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: look for a change in the state of delivery to form this Wick
- video_id: iEaMbuFZb24
