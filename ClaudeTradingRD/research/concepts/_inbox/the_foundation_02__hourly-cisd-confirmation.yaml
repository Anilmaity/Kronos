  quote: closed through the series of down Clos candles that made this low
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: because we are closing through the up close candles
ambiguities:
- The concept name is hourly-specific but the operation is used on the weekly, hourly, 15-minute
  and 5-minute in this one video; whether the CISD is REQUIRED at every level or only at the confirming
  level is never stated.
- Whether the close must be beyond the opening price of the first candle of the series (the order-block
  formulation) or beyond the whole series is not restated here.
- The auto-captioner renders 'down-close candles' as 'down Clos candles'; the quote is reproduced
  exactly as transcribed.
