id: daily-bias-c2-c3-h1-cisd
name: Daily Bias = Daily C2/C3 Closure Confirmed by H1 CISD
aliases:
- the easiest most mechanical way to get bias
category: model
status: specified
definition: 'Stated in this unit as the answer to ''can you elaborate daily bias through the fractal
  model'', and named by him as the easiest, most mechanical way to get bias within his model: go to
  the daily and the hourly, wait for a daily candle 2 closure, then check whether a change in the
  state of delivery exists on the hourly. If both are present, that is the day''s bias. He immediately
  qualifies it - it is not always correct, which is why he keeps a separate lesson on trading the
  invalidation of a daily bias, findable on his site by searching for ''invalidation''.'
timeframes:
  htf:
  - 1D
  ltf:
  - 1H
  fractal: true
preconditions:
- A daily chart and an hourly chart of the same instrument.
detection_rules:
- Wait for a daily candle 2 closure.
- Check the hourly for a change in the state of delivery inside it.
- Both present -> bias for that day in the direction of the closure.
- Either absent -> no bias.
invalidation:
- Covered by his separate invalidation-of-daily-bias lesson, not restated here.
measurable:
- hit rate of the daily direction following C2 closure plus hourly CISD
- share of days where both conditions are met
sources:
- video_id: tDiwwMRWF2k
  title: New York Open Live Q&A with NickDoesFutures
  quote: That's the easiest, most mechanical way to get bias within my model
ambiguities:
- The invalidation procedure is referred to but not given in this unit.
- Whether the hourly CISD must sit inside the daily candle's wick specifically is not restated here.
