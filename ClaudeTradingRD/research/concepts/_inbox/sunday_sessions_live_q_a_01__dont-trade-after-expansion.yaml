id: dont-trade-after-expansion
name: "Trade the Expansion, Not After It"
aliases: ["where do I enter after expansion", "chasing"]
category: entry
status: specified

definition: >
  After price has already expanded, the next phase can only be a consolidation, a retracement or a
  reversal, none of which he prefers to trade except the reversal case where a sweep occurs. The
  stated rule is to trade the expansion itself rather than to enter after it. Entering at the high
  of the day, above previous day highs, after the range and the targets are done, is defined as
  chasing.

timeframes:
  htf: ["1D", "4H", "1H"]
  ltf: ["15m", "5m"]
  fractal: true

preconditions:
  - "A visible expansion leg has already occurred."

detection_rules:
  - "Classify the current phase: expansion, retracement, consolidation or reversal."
  - "If the expansion has already occurred, do not enter in the same direction."
  - "The only acceptable post-expansion entry is a reversal following a sweep of a relevant level."
  - "Do not enter above previous day highs or below previous day lows once targets and range are done."

invalidation:
  - "A new sweep creates a fresh level to trade away from, restarting the sequence."

execution:
  bias: "Unchanged."
  entry: "Before or during expansion only."
  stop: "Per the entry model used."
  targets: ["Drawn liquidity ahead of the expansion"]

measurable:
  - "expectancy of entries taken after the expansion leg versus before it"

sources:
  - video_id: 0AYGNc9czYc
    title: "New York Open Live Q&A"
  - video_id: egV_gABTQks
    title: "(CPI) New York Open Live Q&A"

ambiguities:
  - "What magnitude of move counts as the expansion having occurred is judged against the daily range budget, itself eyeballed."

python_detector: null
related: ["daily-range-budget", "three-entry-quality-criteria", "upper-half-positioning"]
