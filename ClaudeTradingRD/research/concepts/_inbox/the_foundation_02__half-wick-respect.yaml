id: half-wick-respect
name: 0.5 of the Wick Must Be Respected
aliases:
- 05 of the wick
- 0.5 of this Wick
category: structure
status: contested
definition: 'Used twice in the top-down video, and both uses are the large-wick half rather than
  the expansion-candle half. On the daily, where a swing low has already been swept and is therefore
  high resistance liquidity, he marks 0.5 of that wick and treats it as the support area. On the
  hourly confirming chart he restates it as a condition: 0.5 of that wick must be respected to trade
  higher. This corroborates the live-stream EQ rule''s large-wick branch (50% of the wick); the expansion-candle
  branch (50% high-to-low) is not mentioned anywhere in this unit.'
timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 15m
  - 5m
  fractal: true
preconditions:
- A candle with a wick large enough to mark, typically at a swept swing.
detection_rules:
- Where a swing low has already been swept (high resistance liquidity), mark 0.5 of that wick and
  use it as the support area.
- On the confirming timeframe, 0.5 of that same wick must be respected for the higher-timeframe read
  to stand.
- The level is used together with, not instead of, the sweep-and-close-back-inside condition on the
  same candle.
invalidation:
- Price fails to respect 0.5 of the wick - the higher-timeframe read is dropped.
measurable:
- hold rate of 0.5-of-wick on swept swing lows vs unswept ones
- reaction depth relative to the 0.5 level before continuation
sources:
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: look to use 05 of the wick as an area for A2 support
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: 0.5 of this Wick be respected to trade higher
ambiguities:
- He defers the derivation to a dedicated 'Wicks video' which is not part of this unit.
- '''Respected'' is not distinguished into a wick touch versus a body close through.'
- The auto-caption renders the level as '05' and 'A2 support' (an area to support); the quotes are
  reproduced exactly as transcribed.
- The expansion-candle 50%-of-high-to-low branch of the EQ rule does not appear at all in these three
  videos, so this unit corroborates only half of it.
