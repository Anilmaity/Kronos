id: relevant-swings-separation
name: "Relevant Swing Highs and Lows (separation)"
aliases: ["separation", "relevant highs and lows", "which swings matter"]
category: structure
status: underspecified

definition: >
  Only swing highs and lows with visible vertical separation from their neighbours count as
  independent levels or targets. Two extremes close together collapse into one level and only
  the outer one is marked. He states twice, under direct questioning, that there is no
  mechanical rule or percentage for how much separation is enough, because it changes across
  timeframes.

timeframes:
  htf: ["1D", "4H", "1H"]
  ltf: ["15m", "5m"]
  fractal: true

preconditions:
  - "A set of candidate swing highs/lows on the chart."

detection_rules:
  - "Compare each pair of adjacent same-side extremes; if the vertical distance is negligible relative to the chart, treat them as one level."
  - "If there is meaningful separation, mark both as independent targets."

invalidation:
  - "Not stated."

execution:
  bias: "n/a - level selection."
  entry: "n/a"
  stop: "n/a"
  targets: ["each separated extreme becomes its own target in sequence"]

measurable:
  - "Sensitivity of target hit-rate to a candidate separation threshold (e.g. fraction of ATR)."

sources:
  - video_id: aqnY1yZvfYs
    title: "New York Open Live Q&A"
  - video_id: yud7TpE2AMs
    title: "New York Open Live Q&A"

ambiguities:
  - "Explicitly non-mechanical by the speaker's own admission - the single largest automation gap in this unit."
  - "He notes a dedicated video ('Which swing highs and lows matter') exists and another was in production; those may specify more."

python_detector: null
related: ["draw-on-liquidity", "failure-swing", "average-daily-range"]
