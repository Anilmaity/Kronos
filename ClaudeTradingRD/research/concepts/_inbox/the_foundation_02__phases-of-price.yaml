  quote: I use the daily candles to tell me what is happening
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: if we close lower it's going to be a reversal
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: if we close back inside the range I'm viewing it as a retracement
ambiguities:
- '''The range'' in ''close back inside the range'' is not defined - the previous candle''s range
  and the expansion leg''s range give different verdicts.'
- This maps close-back-inside to RETRACEMENT, whereas the library entry assembled from other units
  maps failing to close over the opposing series and falling back inside to CONSOLIDATION. The two
  must be reconciled before a detector is written.
- '''Strong bearish closure'' (the disqualifier for consolidation) is unquantified.'
- Nothing is said about how many candles may pass before the classification is abandoned.
