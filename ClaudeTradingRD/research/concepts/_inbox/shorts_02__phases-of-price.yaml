id: phases-of-price
name: Phases of Price Delivery
category: structure
status: specified
definition: 'The Shorts compress the cycle into a slogan and two decidable sub-rules. The slogan: LARGE
  RANGE, SMALL RANGE, AND THEN A NEW LARGE RANGE - stated twice in one clip, once as the anticipation
  and once as the confirmation. The counting rule: three days of expansion lower means a new phase of
  price can be expected rather than a fourth continuation. The reversal rule, stated as an exclusive:
  if price has expansion through a low, THE ONLY WAY to form a reversal is to get expansion opposite
  - expansion met with an expansion is a reversal, and it is the higher-timeframe wick. In the same
  clip, the failure of the alternative (no closure over the down-close candles, i.e. no continuation
  signature) is explicitly NOT treated as a reason to flip the bias.'
timeframes:
  htf:
  - 1D
  ltf:
  - 4H
  - 1H
  fractal: true
preconditions:
- A directional bias for the period, so that the phase read can be blended with it.
detection_rules:
- 'Cycle: large range -> small range -> new large range.'
- The small range resolves as either a consolidation or a retracement; a reversal is the branch where
  the next large range is opposite.
- 'Count consecutive expansion days: after three days of expansion in one direction, anticipate a new
  phase of price rather than a further continuation.'
- 'Reversal test: after expansion through a level, the ONLY way to form a reversal is expansion in the
  opposite direction. Expansion met with expansion = reversal = a higher-timeframe wick.'
- 'Continuation signature (bullish): a closure over the down-close candles after the low is taken. Its
  absence is not, by itself, a reason to flip the bias.'
- 'Blend the phase with the daily bias: if bullish, want either a manipulation of the lows to trade
  higher, or a breakout of the highs then a retracement then a continuation.'
invalidation:
- Expansion arrives in the opposite direction, converting a continuation read into a reversal.
measurable:
- distribution of consecutive expansion-day counts before a phase change
- share of large ranges followed by a small range on the next candle
sources:
- video_id: 1vSentM2RnI
  title: Large Range → Small Range → Large Range
  quote: Large range, small range, and then a new large range
- video_id: 1vSentM2RnI
  title: Large Range → Small Range → Large Range
  quote: You can see another large range, small range, large range
- video_id: AArNO58yBiw
  title: How to Establish Daily Bias with Candle Closures
  quote: three days of expansion lower so we can get a new phase
- video_id: 08MZAXZ5WAM
  title: How to Align Daily Bias With Phases of Price
  quote: the only way to form a reversal is to get expansion opposite
- video_id: 08MZAXZ5WAM
  title: How to Align Daily Bias With Phases of Price
  quote: So we have expansion met with an expansion which is a reversal
ambiguities:
- '"Large range" and "small range" are never given a measure - not in points, not as a multiple of the
  previous range, not versus an average.'
- The three-day count is stated once, on one chart, as "we've had three days of expansion lower so we
  can get a new phase" - "can" not "will", and no rule for what to do on day four.
- Whether the expansion days must be consecutive closes outside the previous range is not restated here.
- The clip that says a missing continuation signature does not flip the bias also shows the bias being
  wrong, and gives no rule for when it WOULD flip.
