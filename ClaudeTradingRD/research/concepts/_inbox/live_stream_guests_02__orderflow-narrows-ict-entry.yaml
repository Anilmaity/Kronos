ambiguities:
- '''Speed picking up'' and ''aggressive on the buy side'' are read by eye off the footprint; no delta,
  volume or rate threshold is given.'
- He states plainly that the DOM is the part he has not mastered ('i don't think i'm quite there yet
  with the dom'), so this stack is aspirational at the DOM layer.
- He also warns the same stack produces analysis paralysis when the flow and the PD array disagree,
  and gives no tie-break.
