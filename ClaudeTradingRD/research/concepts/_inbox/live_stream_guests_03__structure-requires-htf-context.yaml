id: structure-requires-htf-context
name: A Higher-Timeframe Point Of Interest Comes First, Or You Get Lost
aliases:
- higher time frame reference
category: structure
status: specified
definition: 'Stated in three of the four videos in this unit and agreed to on air every time. The
  host: it is important to have a higher-timeframe point of interest, or else you get lost on the
  lower timeframes - and Alex''s Options agrees immediately, saying he has fallen victim to it at
  least a couple of times, and repeats the point himself, that looking at lower timeframes too much
  without a higher-timeframe reference gets confusing and difficult. Trade For Opportunity applies
  it specifically to order blocks: a down-close candle is only expected to act as support when price
  is working with the higher-timeframe bias; in a downtrend the same candle is not something you look
  for at all, and he describes an order block as essentially a fancy term for support turned resistance.
  AM Trades gives the workflow form - the 15-minute point of interest first, drop to a lower timeframe
  only after it is tagged. The single qualification comes from Alex''s Options: on a 15-second chart
  the payoff ratio ''comes to the rescue'' so the higher-timeframe reference can be skipped, at the
  cost of never catching the large running moves.'
timeframes:
  htf:
  - 1W
  - 1D
  - 1H
  - 15m
  ltf:
  - 5m
  - 1m
  - 15s
  fractal: true
preconditions:
- A higher-timeframe chart of the same instrument is read before the lower one.
detection_rules:
- Establish a higher-timeframe point of interest or bias before reading any lower-timeframe structure.
- An order block (a down-close candle) is only expected to hold when it agrees with the higher-timeframe
  bias; in the opposing trend it is not a level to look for.
- Drop timeframes only once the higher-timeframe point of interest has been tagged.
invalidation:
- No higher-timeframe point of interest exists - do not read the lower-timeframe structure at all.
measurable:
- stop-out rate of lower-timeframe setups taken with vs without a tagged higher-timeframe point of
  interest
- expectancy of pure 15-second trading with no higher-timeframe reference (the stated exception)
sources:
- video_id: V8P6lNIisvc
  title: Q&A Live with Alex's Options - ICT + Strat
  quote: important you have a higher time frame point of interest
- video_id: 0bH_kkG2q6s
  title: Stream Q & A with Trade For Opportunity  - ICT concepts
  quote: when price is working with your higher time frame bias
- video_id: 0bH_kkG2q6s
  title: Stream Q & A with Trade For Opportunity  - ICT concepts
  quote: a fancy term for support turned resistance
ambiguities:
- Alex's Options carves out an exception for pure 15-second scalping where payoff replaces context,
  and the exception is not bounded in size, frequency or instrument.
- '''Higher timeframe'' is not fixed - 15-minute, hourly, daily and weekly are all used as the reference
  in different examples in this unit.'
