id: indicator-print-conditions
name: What Counts As A Valid Model (closure plus CISD)
aliases:
- not qualified as a fractal setup
- it's automatic
category: model
status: specified
definition: 'The mechanical admission test for his model, stated while explaining why the indicator
  sometimes stays blank on a chart where the viewer sees a setup. Two things must both be present:
  a candle 2 or candle 3 closure, and a change in the state of delivery. If either is missing nothing
  prints, and that absence is the answer - the setup is not qualified. By default nothing is drawn
  until the candle closes. The indicator emits no entry, stop or target and therefore, he says, has
  no win rate; a printed model is mechanically valid by construction but is not automatically a trade
  he wants.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 1H
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- A higher-timeframe / lower-timeframe fractal pair is selected.
detection_rules:
- Require a candle 2 OR candle 3 closure on the higher-timeframe candle.
- Require a change in the state of delivery on the lower timeframe.
- Both must be present; if either is absent the setup does not qualify and nothing is marked.
- Confirmation is on the candle closure; nothing is drawn before it unless the early CISD setting
  is enabled.
- A qualifying print carries no direction to enter, no stop and no target - discretion decides whether
  it is taken.
invalidation:
- The required closure or the CISD is absent - the model is simply not there.
measurable:
- count of qualifying prints per instrument per month
- hit rate of qualifying prints that he would actually take vs skip
sources:
- video_id: sdZkE-naNiY
  title: TTrades Indicator Updates - Walkthrough and Q&A
  quote: it has to have that closure and the change in the state delivery
ambiguities:
- Candle 2 and candle 3 closure are treated as interchangeable admission triggers here; no preference
  between them is stated.
- The CISD definition the code uses is not spelled out in this video.
