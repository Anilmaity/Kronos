id: consolidation-range-no-trade
name: No Interest While Consolidating
category: risk
status: contested
voice: ttrades
definition: 'Intraday version among correlated indices: when NQ/ES/YM are chopping and swapping strength,
  he expects one of the assets to run out a low, which ''resets the chop''; until then the price action
  is not traded.'
detection_rules:
- While correlated indices chop with rotating strength, stand aside.
- Re-engage only after one asset runs out a nearby low (or high), then reframe.
ambiguities:
- Which low (session, swing, range) counts is not specified.
sources:
- video_id: 9H15ZZvaKPQ
  title: New York Open Live Q&A
  quote: Normally we want one of these assets to run out a low
- video_id: 9H15ZZvaKPQ
  title: New York Open Live Q&A
  quote: then that kind of resets the chop.
