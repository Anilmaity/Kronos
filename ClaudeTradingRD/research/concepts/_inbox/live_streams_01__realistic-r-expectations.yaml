id: realistic-r-expectations
name: Realistic R and Win-Rate Expectations
definition: 'The break-even arithmetic he quotes live: a 1:1 system needs to win 51% of trades, a
  2R system needs 34%. He deliberately sits in the 2R-3R-4R band because it lets one winner cover
  three losses and because a trader can be right three or four times out of ten and still be fine;
  he notes the trade-off that a higher R normally comes with a lower win rate, and that lower-R systems
  give a smoother equity curve which is why they are popular for prop evaluations. A 56% win rate
  at 1-2R is called absurdly good, and 46% at 2R is described as still making money over a long enough
  series.'
category: risk
status: specified
detection_rules:
- 1:1 risk-to-reward requires a 51% win rate to break even.
- 2R requires 34%.
- Target band for this model is 2R to 4R.
- Expect the win rate to fall as the R target rises.
- Judge a win rate only over a large sample - single trades and short streaks say nothing.
measurable:
- realised win rate at each R target vs the break-even threshold
- sample size needed before the observed win rate stabilises
sources:
- video_id: NESSCPMzWR0
  title: New York Open Live Q&A
  quote: When you go to 1:1 R, you have to win 51%
ambiguities:
- The 51% and 34% figures ignore commission and slippage; he does not adjust for them.
- He gives no target win rate for his own model, only that C3-with-IC is its highest.
