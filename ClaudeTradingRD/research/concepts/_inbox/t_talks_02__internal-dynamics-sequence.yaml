id: internal-dynamics-sequence
name: "Internal Dynamics Sequence Inside A Power Of Three"
aliases: ["internal dynamics", "turtle soup then order block then breaker"]
category: structure
status: specified

definition: >
  Inside a single Power of Three candle, the lower-timeframe price action delivers a fixed
  ordered sequence of ICT structures. First the turtle soup (the sweep that prints the
  manipulation wick), then the order block (the last opposing candle, confirmed once price
  closes through it), then the breaker (which forms once price closes back through the
  current candle's opening price), and finally the fair value gap / OTE / silver bullet
  zone that carries the continuation leg. Which of these the current candle begins with
  depends on where it opened relative to the previous range.

timeframes:
  htf: ["1D", "4H"]
  ltf: ["15m", "5m", "1m"]
  fractal: true

preconditions:
  - "A PO3 candle is in development on the working timeframe."
  - "A lower timeframe is available to see the internal delivery."

detection_rules:
  - "Turtle soup: price sweeps a prior short-term high or low and reverses - this prints the manipulation wick."
  - "Order block: the last opposing candle before the reversal, confirmed by a close through it."
  - "Breaker: forms only once price closes back through the opening price of the candle in development; the strongest breakers overlap that time-opening."
  - "FVG / OTE / silver bullet zone: the final retracement zone before the distribution leg."
  - "If the candle opened at the 2 / 2.5 deviation, the first internal dynamic is likely the turtle soup; if it opened above the time opening, the first retracement is likely into the breaker instead."

invalidation:
  - "Price fails to close back through the opening price - no breaker forms."

measurable:
  - "frequency of the full turtle-soup -> order-block -> breaker sequence inside a 4H candle"
  - "hit rate of the breaker-at-opening-price retracement holding"

sources:
  - video_id: wWIHS_dxbEY
    title: "DexterLab | Putting All The ICT Pieces Together - Master PO3"
    quote: "the turtle soup here the order Block Breaker Zone here in this area"

ambiguities:
  - "The lower timeframe on which internal dynamics are read is not fixed; 15m and 5m are both shown for a daily candle."
  - "Whether every PO3 must contain all four dynamics or only those that fit the opening classification is not stated."

python_detector: null
related: ["opening-price-breaker", "opening-location-vs-previous-range", "wick-to-pd-array-rule"]
