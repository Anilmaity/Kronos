id: discount-requirement-before-entry
name: "Discount / Premium Requirement Before Entry"
aliases: ["above equilibrium to sell", "OTE fair value gap"]
category: entry
status: specified
voice: guest
guest_sources:
- "$niper (Matt)"

definition: >
  A hard location gate $niper states twice: he does not take a short unless price is above
  equilibrium of the retracement leg. The fib is drawn from the high to the low of the leg that
  produced the market structure break; above 50 percent is premium, below is discount. Only an
  entry array (fair value gap or order block) sitting in premium is taken for a short, and the
  mirror for a long. The array he wants is an OTE fair value gap - a fair value gap that is itself
  inside the OTE zone of that fib.

timeframes:
  htf: ["1D", "4H", "1H"]
  ltf: ["15m", "5m", "1m"]
  fractal: true

preconditions:
- "A market structure break has occurred and the leg that produced it can be fibbed high-to-low."

detection_rules:
- "Draw the fib from the high to the low of the retracement leg."
- "Classify above 50 percent as premium, below 50 percent as discount."
- "Reject any short entry that is not above equilibrium; reject any long entry that is not below it."
- "Prefer an entry array that is simultaneously a fair value gap and inside the OTE zone."

invalidation:
- "The array sits outside the required half of the range - no trade."

execution:
  bias: "Set by the structure break, not by this rule."
  entry: "The OTE fair value gap (or order block) inside the correct half of the range."
  stop: "Not stated by this rule."
  targets: ["the opposing liquidity pool"]

measurable:
- "hit rate of entries taken above versus below equilibrium on the same structure break"
- "how often the post-break array happens to fall in the required half at all"

sources:
- video_id: UmLWRlXd_V8
  title: "8/14/22  MMXM Live with $niper  - ICT concepts"
  quote: "I don't take a short unless price is above equilibrium"

ambiguities:
- "The exact OTE band (0.62-0.79 in common ICT usage) is never spoken - only 'above equilibrium' and 'OTE' are said."
- "Which high and which low anchor the fib when several candidates exist is not stated."
- "Whether the wick or the body must be above equilibrium is not stated."

python_detector: null
related: ["optimal-trade-entry", "premium-discount-equilibrium", "htf-reaction-mss-retrace-entry", "mmxm-phase-sequence"]
