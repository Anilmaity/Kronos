id: small-wick-expansion-rule
name: Small Wick Supports Expansion
category: model
status: contested
voice: ttrades
definition: 'Applied to the current daily candle intraday: the daily EQ is where he wants to see respect if the
  day is going to expand with a small wick. On this day the EQ was not respected, the daily candle printed a large
  wick, he notes he usually does not like to fade the daily candle but that it had now been faded, and concludes
  a large wick does not support much expansion - so he expects little range for the rest of the day.'
timeframes:
  htf:
  - 1D
  ltf:
  - 15m
  - 5m
  fractal: true
detection_rules:
- If price trades through the current daily candle's EQ against the candle's direction, classify the wick as large.
- Large daily wick -> lower the expectation of further range for the day.
sources:
- video_id: ES-R3ByDYrY
  title: TTrades MNQ Cup - Morning Session
  quote: That is a large wick, which doesn't really support too much expansion
- video_id: ES-R3ByDYrY
  title: TTrades MNQ Cup - Morning Session
  quote: So I'm not expecting a lot of range today
ambiguities:
- Whether 'the EQ' is the EQ of the current day's range or of the previous day is not explicit in the transcript.
related:
- no-fading-the-daily-candle
- equilibrium-eq
