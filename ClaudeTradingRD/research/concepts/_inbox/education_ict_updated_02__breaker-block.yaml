  quote: I prefer to just use order blocks as I find them more simple and easy
ambiguities:
- For the bearish case the PDF says the zone runs 'from this high to the low', but a later example
  marks 'those down close candles on the move down' - whether the anchor is the FIRST high or the
  higher high is stated both ways in the same video.
- Whether the zone spans all same-direction closes between the two points or only the contiguous
  run adjacent to the extreme is not stated.
- Wick vs body bounding is explicitly discretionary ('with these wicks kind of everywhere I will
  focus on the bodies').
- He closes by saying he prefers plain order blocks because they are simpler, so the breaker material
  is offered as an alternative, not as his own model.
- Swing confirmation lag (how many bars must pass before a swing point counts) is never given.
