id: breaker-block
name: Breaker Block
aliases:
- breaker
- bullish breaker
- bearish breaker
category: entry
status: specified
definition: 'A four-point swing sequence plus a candle-selection rule, stated here as a candlestick
  pattern. Bearish: high, low, higher high, lower low - the zone is the DOWN-close candles marked
  from that high to that low, and it is expected to resist price on a return. Bullish: low, high,
  lower low, higher high - the zone is the UP-close candles before the move that made the lower low,
  and it is expected to support price. When wicks are untidy he marks the zone off the BODIES. This
  lesson matches, word for word, the sequence the host used on air to correct a guest who had called
  a low-high-higher-high-lower-low structure a breaker.'
timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- Four confirmed swing points in the required order.
detection_rules:
- 'Bullish: confirm the sequence low, high, lower low, higher high. The pattern does not exist until
  the higher high prints.'
- Bullish zone := the up-close candles before the move that produced the lower low.
- 'Bearish: confirm the sequence high, low, higher high, lower low.'
- Bearish zone := the down-close candles marked from that high to that low.
- Where wicks are scattered, mark the zone from the bodies rather than the extremes.
invalidation:
- The fourth swing point never forming.
- Price trading through the far side of the breaker zone after the retest.
execution:
  bias: Direction of the fourth leg.
  entry: On the close through, or on the retest of the zone.
  stop: On the other side of the breaker, or on the swing low/high - he states he uses the other
    side of the breaker in these examples.
  targets:
  - 2R
  - the opposite side of the range
  - prior highs/lows to the left
measurable:
- frequency of the four-point sequence per instrument and timeframe
- hit rate of a fixed 2R trade on first retest of the zone
- difference between wick-marked and body-marked zones on the same sample
sources:
