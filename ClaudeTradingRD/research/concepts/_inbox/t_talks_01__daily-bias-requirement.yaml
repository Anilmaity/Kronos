id: daily-bias-requirement
name: "Is A Daily Bias Required Before Entry?"
aliases: ["no daily bias", "bias-free model"]
category: model
status: contested

definition: >
  A direct doctrinal conflict inside this unit over whether a directional daily bias is a
  precondition for taking a trade. Two speakers build bias first and treat it as the foundation of
  the model; one refuses to use one at all and enters purely from points of interest; a fourth
  replaces bias with a calendar-and-profile day-selection layer.

timeframes:
  htf: ["1D"]
  ltf: ["1H", "5m"]
  fractal: false

preconditions:
  - "A model is being designed or evaluated."

detection_rules:
  - "Bias-required position (Ash Trades): bias is taken from the daily via internal versus external liquidity, and the hourly areas of interest are then filtered to that direction only. Without it there are no areas of interest to search."
  - "Bias-required position (Sniper): the internal/external read on monthly, weekly, daily and 4H IS the bias, and the whole timeframe-alignment entry hangs off it."
  - "Bias-free position (DTR): no daily bias is used. The stated reasons are that there are too many mutually inconsistent ways to build one, that he could never commit to a single method, and that nothing obliges a model to have one. Entries come from hourly swing points reaching a point of interest, in either direction."
  - "Bias-replaced position (AM Trades): no daily directional bias is described. The selection layer is the economic calendar, the daily phase of price delivery and the weekly profile, which yield direction only after a manipulation is confirmed on the hourly."

invalidation:
  - "Not applicable - this is a design conflict, not a setup."

execution:
  bias: "Contested by definition."
  entry: "Bias-required models filter setups by direction; the bias-free model takes whichever direction the point of interest produces."
  stop: "Not applicable."
  targets: []

measurable:
  - "expectancy of the same point-of-interest entries with and without a daily-bias direction filter applied"
  - "proportion of winning trades that were counter to the daily bias that would have been assigned"
  - "how often two different published bias methods disagree on the same day - the empirical form of DTR's objection"

sources:
  - video_id: 07lOxv39LdY
    title: "DTR | C2U - Blending The Fractal Model & Unicorn Model - No Daily Bias"
    quote: "I don't specifically rely on a daily bias in order to enter a trade"
  - video_id: zXtJSSkiNmo
    title: "Ash Trades | The Journey To Profitability & The Unicorn Model"
  - video_id: 5aRB_ZY3474
    title: "$niper | Internal & External Liquidity - ICT Daily Bias"
  - video_id: QmGJFxfSHxM
    title: "AM Trades | Blending The Economic Calendar, Daily Chart, & Weekly Profiles"

ambiguities:
  - "None of the four speakers addresses the others' position, so the conflict is inferred from the unit rather than debated in it."
  - "DTR notes his model CAN be paired with a daily bias if the trader wants one, which weakens the conflict to a preference rather than a mechanical incompatibility."
  - "AM Trades' position is the reader's classification - he never says whether he considers his calendar-and-profile process a bias method."
  - "No speaker offers evidence either way."

python_detector: null
related: ["internal-external-range-liquidity", "c2-unicorn", "unicorn-model", "large-range-day-targeting", "one-model-focus"]
