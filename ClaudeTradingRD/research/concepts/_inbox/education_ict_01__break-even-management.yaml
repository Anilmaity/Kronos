id: break-even-management
name: Break-Even Management
aliases:
- move your stops to break even
- not invalidated at break even
category: risk
status: contested
definition: 'THE TWO POSITIONS ARE BOTH IN THIS UNIT AND THEY DISAGREE, split by trade type. In the CPI
  trade review (a 2R intraday position) he argues explicitly AGAINST moving the stop to break-even: the
  trade is not invalidated at break-even, it is invalidated at the intermediate-term high, and he shows
  the exact drawdown that would have stopped a break-even trader out immediately before the target was
  hit. In the 15-second scalp example he does the opposite - takes the first partial and moves the stop
  to break-even, qualifying it as what he does WHEN SCALPING - and is then stopped out at break-even on
  the trade shown. The reconciling principle he states is that risk is accepted at the structural invalidation
  level, not at the entry price.'
timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 5m
  - 1m
  - 15s
  fractal: false
preconditions:
- A position is open with a structural invalidation level identified.
detection_rules:
- Identify the structural invalidation (the intermediate-term high / the protected extreme).
- 'Swing / intraday positions: leave the stop at the structural invalidation; do NOT move it to break-even
  on favourable movement.'
- 'Scalps: take the first partial, then move the stop to break-even.'
- 'The test he applies: ask where the trade is actually invalidated, not where it is currently comfortable.'
invalidation:
- Price reaches the structural invalidation level.
measurable:
- P&L difference between break-even management and structural stops over a sample of the same setups
- frequency of trades that touch break-even before reaching the target
- whether the scalp/non-scalp split survives testing
sources:
- video_id: 0R61Y6Pn74Q
  title: CPI Gold Trade Review | ICT Market Maker Sell Model [MMXM]
  quote: my trade is not invalidated at break even
- video_id: 0R61Y6Pn74Q
  title: CPI Gold Trade Review | ICT Market Maker Sell Model [MMXM]
  quote: this is where I accept the risk
- video_id: aDYzoae3viQ
  title: 15 Second Chart Example - ICT Concepts
  quote: move your stops to break even at least i do one scalping
ambiguities:
- 'CONTESTED WITHIN THIS UNIT: the anti-break-even argument (CPI trade review) and the pro-break-even
  practice (15-second scalp) are both his, in the same playlist. The only stated discriminator is that
  the second is a scalp; no timeframe or R threshold separates the two regimes.'
- '''One scalping'' is the auto-caption''s rendering of ''when scalping''.'
- No rule says when partials themselves should be taken relative to break-even.
