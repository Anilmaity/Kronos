id: killzone-open-avoidance
name: Never Trade At The Beginning Of A Kill Zone
aliases:
- use the 7:30 or 8:30 opening price
- kill zone open is the entice
category: time
status: specified
definition: 'Rauf states that he would never trade at the beginning of a kill zone. His example is the
  forex 07:00-10:00 window: at the start of it the market is doing the opposite of what it is actually
  going to do, enticing traders to read it the wrong way. His remedy is to use the opening price part-way
  into the window - 07:30 or 08:30 - as the reference, from which the prescription becomes clear. This
  sits alongside his broader time rule that his day starts at 04:00 and that he considers nothing before
  it significant.'
timeframes:
  htf:
  - 1D
  ltf:
  - 1H
  - 15m
  - 5m
  fractal: false
preconditions:
- A defined kill zone window.
detection_rules:
- Do not enter on the first candles of a kill zone window.
- Mark the 07:30 opening price and the 08:30 opening price as reference levels within the 07:00-10:00
  window.
- Read direction relative to those opening prices rather than to the window's first print.
- Treat the initial move inside the window as likely to be opposite the day's actual direction.
invalidation: []
measurable:
- reversal rate of the first 30 minutes of a kill zone
- P&L of entries in the first 30 minutes vs after the 07:30 / 08:30 opening price
sources:
- video_id: qFtfD09Vv3E
  title: Live with Day Trading Rauf - Preparing for a New Week
  quote: I would never paid at the beginning of a Kill Zone
- video_id: qFtfD09Vv3E
  title: Live with Day Trading Rauf - Preparing for a New Week
  quote: if you start to use 7 30 opening price or 8 30 opening price
- video_id: qFtfD09Vv3E
  title: Live with Day Trading Rauf - Preparing for a New Week
  quote: I usually start my day from 4am
ambiguities:
- '''The beginning'' has no duration - 5 minutes, 30 minutes, the first candle?'
- The rule is given for the forex 07:00-10:00 window and it is not stated whether it transfers to the
  index open.
- This directly opposes another guest in this corpus who executes ONLY at session opens (London 02:00,
  New York 09:30). That is a guest-vs-guest methodological difference, not a channel inconsistency -
  the two ids are kept distinct.
- The transcript renders 'trade' as 'paid'.
