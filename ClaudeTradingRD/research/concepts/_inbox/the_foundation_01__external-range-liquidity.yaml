id: external-range-liquidity
name: "External Range Liquidity"
aliases: ["external liquidity", "ERL"]
category: liquidity
status: specified

definition: >
  A swing high or swing low, in the form of buyside or sellside liquidity, marking the outer
  boundary of the current range. It is the counterpart to internal range liquidity (a fair
  value gap): the market is said to do only two things — reach for old highs and lows
  (external), or rebalance a fair value gap (internal).

timeframes:
  htf: ["1W", "1D", "4H", "1H"]
  ltf: ["15m", "5m", "1m"]
  fractal: true

preconditions:
  - "A confirmed swing high or swing low that has not yet been traded through."

detection_rules:
  - "external_range_liquidity := price of the nearest untaken confirmed swing high (upside) or swing low (downside) bounding the current range."
  - "It becomes the active draw immediately after internal range liquidity (an FVG) has been reached and respected."
  - "Once taken, it ceases to be a target and the draw rotates back to internal."

invalidation:
  - "Price trades through the swing (the pool is consumed)."

execution:
  bias: "After internal liquidity is reached and respected, bias is toward external liquidity in the direction of the respect."
  entry: "n/a — target/bias role only."
  stop: "n/a"
  targets: ["the swing high / swing low itself"]

measurable:
  - "hit rate of external liquidity being reached after an FVG is respected"
  - "average excursion from the FVG to the external target in R terms"

sources:
  - video_id: 3OivsP1j_UE
    title: "Internal & External Liquidity (Daily Bias) - ICT Concepts"
    quote: "external range liquidity is a swing high or a swing low"
  - video_id: U8xH2dEgH5A
    title: "Liquidity: Buyside & Sellside - ICT Concepts"

ambiguities:
  - "Which swing bounds 'the range' is judged visually; no algorithm selects it among nested swings."
  - "The swing definition inherits the unresolved filtering problem noted under swing-point."
  - "No statement on whether external liquidity must be on the same timeframe as the internal FVG."

python_detector: null
related: ["swing-point", "buyside-sellside-liquidity", "internal-range-liquidity", "internal-external-rotation"]
