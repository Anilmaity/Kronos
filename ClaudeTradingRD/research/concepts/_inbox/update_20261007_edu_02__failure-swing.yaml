id: failure-swing
name: Failure Swing
category: structure
status: contested
voice: ttrades
definition: >
  Adds a candle-level usage: a 4-hour candle 2 closure that swept its previous candle and closed back
  but did NOT take out the earlier high is 'a valid candle to closure' that is 'a failure swing'. It may
  still be traded, but he prefers SMT there and demands cleaner lower-timeframe continuation structure.
  Proximity matters: failure swings close to the reversal are 'pretty concerning'; further away he does
  not mind trading away from them. In the dealing-range video, failure swings at the target end are
  acceptable as a mechanical range bound ('ideally you want to see price reach out the failure swings').
preconditions:
- A higher-timeframe candle 2 closure exists near an untaken earlier high/low.
detection_rules:
- If the C2 extreme fails to take the earlier swing, classify it as a failure-swing C2.
- Trade a failure-swing C2 only with SMT or clearly clean lower-timeframe continuation structure.
invalidation:
- n/a (a gating rule).
measurable:
- outcome of failure-swing C2 setups with vs without SMT
sources:
- video_id: tUbrCewFdCU
  title: How to Trade London Using TTrades Fractal Model
  quote: This is a valid candle to closure
- video_id: tUbrCewFdCU
  title: How to Trade London Using TTrades Fractal Model
  quote: I would prefer there to be SMT here
- video_id: yb3Te7tiGRk
  title: Understanding Dealing Ranges in Trading (Get Better Risk Reward)
  quote: ideally you want to see price reach out the failure swings
ambiguities:
- '"Quite close" vs "further away" from the reversal is not quantified.'
