id: relative-strength-asset-selection
name: Ranking Correlated Assets And Trading The Middle One
category: structure
status: contested
definition: 'Live index-triad reads. Normally ES sits in the middle with NQ and YM at opposite ends; on
  this day ES was strongest while NQ and YM fell together, which he dislikes and waits out. Rules stated:
  if NQ takes a low and ES does not, expect bullish movement; if ES is to reverse lower it probably does
  so when YM takes the high. When one asset prints a C2 closure and a correlated asset breaks out beyond
  it, that is just an SMT while the first remains valid, and for a short he trades the weakest one, not
  the one making new highs. Gold vs silver: silver ran the low, gold did not and is nearer the highs,
  so long gold.'
detection_rules:
- If the usual ordering (ES in the middle) breaks and two of the triad move together against the third,
  stand aside.
- When correlated assets diverge around a C2 closure, short the weakest / long the strongest of them.
