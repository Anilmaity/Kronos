id: top-down-analysis-procedure
name: Top-Down Read (the fixed order of operations)
aliases:
- bias, structure, entry
- my supporting time frame
- intermediate time frame
category: model
status: contested
definition: 'The dedicated lesson video states the procedure as three named slots with three different
  jobs. Slot 1, the highest timeframe, supplies direction only - the bias. Slot 2, called the intermediate
  or supporting timeframe, does two jobs: it carries the change in the state of delivery that confirms
  the higher-timeframe wick, and it supplies the point of interest to trade from. Slot 3, the lowest
  timeframe, supplies only the entry, taken on an opposing candle or order block at the slot-2 point
  of interest. The instances shown are daily-hourly-5 minute (twice) and weekly-4 hour-15 minute.
  Crucially he states that the third slot is optional: if risk can be managed on the structure timeframe
  he executes there and does not need three timeframes at all.'
timeframes:
  htf:
  - 1W
  - 1D
  ltf:
  - 4H
  - 1H
  - 15m
  - 5m
  fractal: true
preconditions:
- Three charts of the same instrument, or two if the entry is taken on the structure timeframe.
detection_rules:
- 'Slot 1 (bias): on the highest timeframe, require a formed swing point plus a close beyond the
  previous period''s level; that fixes the direction for everything below.'
- 'Slot 2 (structure / supporting timeframe): look for a change in the state of delivery to confirm
  the higher-timeframe wick has formed, AND use the same chart to locate the point of interest to
  trade from.'
- 'Slot 3 (entry): at that point of interest, look for opposing candles or order blocks and take
  the entry there.'
- 'Instances demonstrated: 1D bias / 1H structure / 5m entry; 1W bias / 4H structure / 15m entry.'
- Slot 3 is optional - if risk can be managed on the structure timeframe, execute there; he calls
  the choice personal preference.
- Targets are always taken from the higher timeframes (previous highs, standard deviation projections,
  the higher-timeframe objective), never from the entry chart.
invalidation:
- The lower-timeframe setup points against the slot-1 bias - it is refused rather than traded.
measurable:
- R achieved with 3-slot execution vs 2-slot execution on the same signal
- how often the slot-2 chart contains no point of interest, forcing the sweep-of-a-previous-low fallback
sources:
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: the first thing I want to do is have a higher time frame bias
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: on an intermediate time frame I'm going to use this for structure
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: the daily is where I will derive my bias
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: my hourly will be my structure or my supporting time frame
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: look for opposing candles or order blocks
ambiguities:
- 'The ratio between slots is not fixed: daily-to-hourly is 24:1 while weekly-to-4-hour is 42:1,
  and no rule selects the pairing.'
- Which timeframe is 'the highest in play' is chosen per example without a stated criterion.
- When the slot-2 chart contains no fair value gap or point of interest he falls back on 'a sweep
  of this previous low', which is a different kind of object and is not listed as part of the procedure.
- The procedure is stated for a trending continuation; nothing is said about running it when slot
  1 is in consolidation.
