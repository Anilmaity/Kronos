id: daily-bias-framework
name: Previous Candle High / Low Bias (intraday and daily)
category: model
status: contested
definition: 'A confusion diagnostic: ask whether the market is one-sided - can you frame it only in one
  direction, or in both? On this day the reversal at the previous day low framed bullish, but the failed
  continuation framed bearish into a C4, so it was two-sided and he did not trade. A C3 daily candle can
  only be framed one way, which is why he tells learners to focus on C3 daily candles. He adds that even
  a mechanically ideal C3 closure (creating a protected swing at the same time) is less ideal if it has
  already expanded and taken the intraday low.'
detection_rules:
- If the daily context can be framed both bullish and bearish (e.g. a reversal day whose continuation
  failed), classify the day as two-sided and stand aside.
- A C3 daily closure is one-sided by construction.
measurable:
- expectancy on days classified two-sided vs one-sided
