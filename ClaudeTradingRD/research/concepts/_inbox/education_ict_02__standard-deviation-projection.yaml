ambiguities:
- He puts the fib settings on screen instead of speaking them, so the exact level list is not recoverable
  from the transcript.
- '''If it makes sense'' is the only gate on the post-4th-deviation retracement expectation.'
- The 2-to-2.5 band has no rule for which edge to use as the order price.
- Sign convention is inconsistent within the video (2/2.5 and 4 spoken as positives, projected downwards).
