id: standard-deviation-projection
name: Standard Deviation Projection Of The Manipulation Leg
category: entry
status: contested
definition: 'The dedicated earlier lesson, credited outright to AM Trades (''my friend am trades showed
  me''). The setup that produces the anchor is stated as a fixed sequence: price runs into a higher-timeframe
  PD array, a short-term high forms, price moves OVER that high and then back into the range shifting
  structure bearish. The leg that took those highs is the manipulation leg. Anchor the fib from that
  leg''s high to its low and project. Targets are the 2 to 2.5 standard deviation band first, then
  the fourth, and he prefers a PD array or resting liquidity to coincide with the level before he
  uses it to take profit. One addition not carried in the later canon: after the fourth deviation
  is hit, look for a retracement back INTO the range - specifically when price has run through the
  original consolidation and then fails to keep displacing.'
timeframes:
  htf:
  - 1H
  - 15m
  ltf:
  - 5m
  - 2m
  fractal: true
preconditions:
- Price has reached a higher-timeframe PD array.
- A short-term high (or low) has been taken and structure has shifted the other way.
detection_rules:
- 'Identify the manipulation leg: the move that took the short-term high (or low) immediately before
  the structure shift back the other way.'
- Anchor the fib across that leg - high to low for a bearish projection, low to high for bullish.
- 'First target band: -2 to -2.5 standard deviations. Second target: the fourth deviation.'
- Only treat a projected level as a take-profit when a PD array or resting liquidity lines up with
  it; he calls that alignment the confluence he is looking for.
- The 1st and 2nd deviations are used as nearer targets on lower-timeframe instances.
- After the fourth deviation, expect a retracement back into the range where price has already run
  through the original consolidation and stops displacing.
measurable:
- hit rate of -2/-2.5 vs -4
- hit rate when a PD array coincides vs when it does not
