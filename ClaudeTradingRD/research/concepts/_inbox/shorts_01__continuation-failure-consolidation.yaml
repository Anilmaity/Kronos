id: continuation-failure-consolidation
name: 'Continuation Failure #1 - The Closure Is A Consolidation Sweep'
category: entry
status: specified
definition: 'SHORTS EVIDENCE for the reclassification rule and its pay-off. When a supposed retracement
  fails to close back over the level, it is no longer a retracement - it is a consolidation, and the
  correct response is to flip what the level means: instead of anticipating the low to hold, the low
  becomes the point of interest you wait for price to reach into. Every closure internal to that range
  is then ignored. He states the benefit plainly - reclassifying saves the loss. The breakout case is
  handled by the same rule: the breakout alone is never traded; a continuation must form after it, and
  if that continuation fails to reach a point of interest it is not valid.'
preconditions:
- A continuation was expected at a point of interest inside a trend.
detection_rules:
- 'Test the recovery: does price close back over the level? A slow, non-V-shaped return means no.'
- On failure, reclassify the structure from retracement to consolidation and mark the range high and
  low.
- Ignore all closures over levels INTERNAL to the range - they are not continuations.
- 'Flip the level''s role: the range low becomes the point of interest to wait for, not a level to defend.'
- Never trade the breakout by itself - require a NEW continuation to form after the breakout.
- A continuation that does not reach a point of interest is not valid, even if the closure is clean.
- In a consolidation the only two events of interest are a manipulation of the low or a breakout of
  the high.
measurable:
- share of failed-recovery levels that are later swept to the opposite range extreme
- win rate of breakout entries with a post-breakout continuation versus without
