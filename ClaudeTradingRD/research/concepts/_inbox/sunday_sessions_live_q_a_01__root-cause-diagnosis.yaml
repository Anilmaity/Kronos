id: root-cause-diagnosis
name: "Root-Cause Diagnosis for Repeated Account Failure"
aliases: ["why do I keep blowing accounts", "make change or quit"]
category: psychology
status: specified

definition: >
  For traders who repeatedly blow accounts or fail payout phases, he refuses generic advice and
  requires identification of the root cause first, from a short list: tilt or overtrading, absence
  of a system, or oversizing. Each cause maps to a specific fix: a hard limit of one trade per day
  for tilt and overtrading, learning a model (any model) for absence of a system, and correct
  sizing for oversizing. He frames the outcome as binary: make a change or quit, because repeating
  the cycle wastes years.

timeframes:
  htf: []
  ltf: []
  fractal: false

preconditions:
  - "A repeated pattern of account failure or failed payouts exists."

detection_rules:
  - "Classify the cause: tilt/overtrading, no system, or oversizing."
  - "Tilt or overtrading: impose a maximum of one trade per day (or a max-loss limit)."
  - "No system: adopt and follow a defined model."
  - "Oversizing: reduce size to a correct level."
  - "If the rule is then broken, the problem is rule-breaking, not the market."

invalidation: []

execution:
  bias: "Not applicable."
  entry: "Not applicable."
  stop: "Not applicable."
  targets: ["Not applicable."]

measurable:
  - "trade count per day and loss per day before and after imposing the limit"

sources:
