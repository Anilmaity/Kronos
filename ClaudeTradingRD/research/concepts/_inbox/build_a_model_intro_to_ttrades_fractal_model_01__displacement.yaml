  quote: expansion is when we have a one-sided trending move
- video_id: Kf4c41_qO1s
  title: Higher Timeframe Analysis For Trading - Aligning Expansion Candles
  quote: Candles that support expansion will have a small wick and a large body
ambiguities:
- 'The single most important gap in the corpus survives the primary teaching unit: four dedicated
  phase lessons and a dedicated wick lesson give NO numeric threshold for expansion / displacement
  / small wick.'
- The FVG proxy ('we expand when we create fair value gaps') is stated once, in passing, and is the
  only proxy that is fully mechanical - it should be tested first.
- '''Displacement'' and ''expansion'' are used interchangeably here, which conflicts with units where
  displacement is a property of a single impulse and expansion is a phase.'
