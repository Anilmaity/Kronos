id: displacement
name: Displacement
category: structure
status: underspecified
aliases:
- displace
- aggressive move
- expansion
definition: 'FINDING FROM THE PRIMARY TEACHING UNIT: across these twenty videos the word ''displacement''
  is largely REPLACED by ''expansion'', and the qualitative test given for expansion is the closest
  thing to a displacement definition the channel offers - a one-sided trending move with only shallow
  moves against it, a large range against a small range, a candle with a small wick and a large body.
  Where ''displace'' is used it is used as a synonym for that (''is it displacing back into the range?''
  is the test for reversal vs retracement). Still no numeric threshold anywhere: no ATR multiple,
  no body ratio, no bar count.'
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  - 5m
  fractal: true
preconditions:
- A reference level, range boundary, or PD array.
detection_rules:
- 'Proxy from this unit (a): the move is one-sided with only shallow counter-moves - the expansion
  signature.'
- 'Proxy (b): the move''s range is large relative to the immediately preceding leg (large range vs
  small range).'
- 'Proxy (c): the candle has a small wick and a large body.'
- 'Proxy (d): the move leaves a fair value gap (''you can say that we expand when we create fair
  value gaps'').'
- 'Decision use: expansion back INTO the range = reversal; slow shallow move back = retracement;
  sideways = consolidation.'
invalidation: []
measurable:
- agreement rate between proxies (a)-(d) on the same bars
- sensitivity of the reversal/retracement classifier to the chosen displacement threshold
sources:
- video_id: VD4xb9VfMHA
  title: How To Trade Reversal - Phases Of Price
  quote: It is displacing back into the range
- video_id: VD4xb9VfMHA
