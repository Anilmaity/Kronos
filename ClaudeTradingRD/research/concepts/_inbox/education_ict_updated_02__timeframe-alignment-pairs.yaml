- video_id: WwmS47Gb3M0
  title: The "Twitter Model" The MMXM Trader - ICT Concepts
ambiguities:
- The pairing rule itself (why 1H goes with 5m) is deferred to his timeframe alignment video and
  not derived here.
- The 30m-3m pair is stated once in passing and the 1H-1m pairing used in one breaker example is
  not reconciled with it.
- Whether the third refinement timeframe is fixed by the pair or chosen freely is not stated.
