ambiguities:
- The daily bias step itself is delegated to his daily bias and weekly profile videos; only instances
  are shown here.
- '''Aligns with my bias'' is not given a test - the hourly point of interest is selected visually.'
- The 5-minute PD array used for entry varies by example (fair value gap, breaker block) with no
  selection rule.
- Timing anchors mentioned in passing (midnight open, 8:30 news, 9:30 open) are not organised into
  a rule here.
