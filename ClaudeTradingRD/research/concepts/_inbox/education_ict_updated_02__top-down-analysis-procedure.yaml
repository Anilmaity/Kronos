id: top-down-analysis-procedure
name: Top-Down Read (daily bias to entry)
aliases:
- top down analysis
- daily bias to entries
category: model
status: specified
definition: 'The three-layer order of operations, stated as the lesson of the worked example: start
  on the daily chart, drop to a lower timeframe to get a point of interest, then drop to another
  lower timeframe to get the entry. In this unit that is daily -> hourly -> 5-minute. The daily supplies
  the bias (a failure to displace over a swing high, an up-close candle that should become an order
  block, a Tuesday high of week implying expansion into Wednesday and Thursday) and the levels (previous
  day high and low, a daily order block). The hourly supplies the point of interest, typically an
  order block validated by displacement around the midnight open or before New York. The 5-minute
  supplies the entry - a fair value gap, its consequent encroachment, or a breaker block - with a
  stop beyond the reaction high/low and a minimum 2R marked before leaving runners. He credits the
  MMXM Trader as the person who taught him much of this.'
timeframes:
  htf:
  - 1D
  ltf:
  - 1H
  - 15m
  - 5m
  fractal: true
preconditions:
- A daily directional read exists for the coming session.
detection_rules:
- 'Layer 1 (daily): form the bias, and mark previous day high, previous day low, and any daily order
  block.'
- 'Layer 2 (hourly): find a point of interest that ALIGNS with that bias - wait for displacement
  to validate an order block or breaker around the midnight open / pre-New-York.'
- 'Layer 3 (5-minute): take the entry when price reaches that point of interest, using a fair value
  gap / consequent encroachment / breaker block.'
- Mark the minimum 2R before leaving runners; runners target the swing point beyond.
- SMT at the reaction is used as confirmation, not as the trigger.
- Stop goes beyond the high/low of the reaction that is expected to hold.
invalidation:
- The hourly point of interest failing to align with the daily bias - no trade.
- Price reaching up into the high the entry structure said should hold.
execution:
  bias: From the daily chart.
  entry: 5-minute fair value gap / consequent encroachment / breaker block at the hourly point of
    interest.
  stop: Above the reaction high (short) or below the reaction low (long).
  targets:
  - minimum 2R
  - previous day low / previous day high
  - the swing point beyond, on runners
measurable:
- how often an aligned hourly point of interest exists given a daily bias
- hit rate of 2R from the 5-minute entry once all three layers align
- contribution of the SMT confirmation to outcome
