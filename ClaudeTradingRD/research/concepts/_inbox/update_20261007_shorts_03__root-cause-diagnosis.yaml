id: root-cause-diagnosis
name: Root-Cause Diagnosis for Repeated Account Failure
category: psychology
status: specified
voice: ttrades
aliases:
- change or quit
definition: 'Short restatement of the standing answer to a viewer who has followed for two years without
  success: he cannot know the individual''s problem, so the trader must find the root cause that prevents
  progress - usually tilt, oversizing, revenge trading or not following a model - and then either change
  it or quit; anything else wastes the trader''s own time.'
timeframes:
  htf: []
  ltf: []
  fractal: false
preconditions:
- A trader has been failing to progress over an extended period (two years in the question).
detection_rules:
- Name the root cause first; the default candidates are tilt, oversizing, revenge trading, not following
  a model.
- 'Outcome is binary: make a change that addresses the cause, or quit.'
invalidation:
- Not applicable.
measurable: []
