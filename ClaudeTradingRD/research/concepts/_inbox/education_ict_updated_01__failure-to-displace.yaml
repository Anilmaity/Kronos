id: failure-to-displace
name: Failure To Displace
aliases:
- liquidity grab
- failure to close outside the range
category: structure
status: specified
definition: Price reaches beyond a structural level (an old high or old low) but cannot produce large
  aggressive candles closing outside it, and closes back inside instead. He treats this as the mirror
  image of displacement and as the signal that price will return into the range and seek the opposite
  side.
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
detection_rules:
- Price trades beyond a marked swing high / swing low or range extreme.
- The candle(s) close back inside that level rather than closing outside it.
- 'Read the consequence: expect a return into the range, then the opposite side.'
- Before reversing, he wants price to return at least to a premium (bearish) or discount (bullish) of
  the range.
invalidation:
- Aggressive candles subsequently close outside the level — displacement, not a failure.
measurable:
- hit rate of 'close back inside -> opposite side of range is reached' by timeframe
- how often the premium/discount retracement precondition is met before the reversal
sources:
- video_id: ynFA6E3qHj0
  title: Market Structure Shift vs Liquidity Grab
  quote: a liquidity grab simply put is a failure to displace over structure
- video_id: ynFA6E3qHj0
  title: Market Structure Shift vs Liquidity Grab
  quote: it is important to have some sort of directional bias
- video_id: 6zTz7WMdMWg
  title: Intraday Bias Simplified
  quote: price cannot displace out of this range or above previous candles high
ambiguities:
- On a 1-minute chart he concedes the reading becomes unusable without a directional bias ('a lot of
  structure breaks, a lot of failure to displace') but gives no filter beyond 'have a bias'.
- The premium/discount retracement requirement is applied 'a lot of times', not always.
