id: box-setup
name: "Box Setup"
aliases: ["the Box setup", "deviation from the range"]
category: entry
status: underspecified

definition: >
  An entry taken on the retest of the extreme BODY of an accumulation range after price has
  deviated outside that range and returned. For a short: mark the accumulation, mark the highest
  body within it, mark the deviation (manipulation) above it; the plain box entry is the retest
  of that highest-body level with the stop above the manipulation. For a long: the lowest body
  of the range. The speaker's preferred, confirmed variant does not enter blind at the level —
  it waits for an order block or a change in state of delivery to form at the retest.

timeframes:
  htf: ["1D", "1H"]
  ltf: ["15m", "5m", "1m"]
  fractal: true

preconditions:
  - "An accumulation range where price cannot make new highs or lows."
  - "A deviation (manipulation) outside that range followed by a move back inside."

detection_rules:
  - "Mark the accumulation range."
  - "box_level (short) := the highest body (max of open/close) inside the accumulation. box_level (long) := the lowest body."
  - "Require a deviation beyond the range followed by a displacement back inside."
  - "Plain entry: limit at box_level on the retest, stop beyond the deviation extreme."
  - "Confirmed entry: on the retest, additionally require an order block to form (a sweep, then a close through the opening price of the opposing candles) before entering; the stop may then be placed at the local sweep extreme instead."
  - "Targets from projecting the manipulation leg."

invalidation:
  - "Price closing back beyond the deviation extreme."

execution:
  bias: "Opposite the deviation."
  entry: "box_level retest, plain or order-block-confirmed."
  stop: "Above/below the deviation extreme, or at the confirming sweep extreme."
  targets: ["projection of the manipulation leg", "a previous high/low or fair value gap coinciding with the first deviation band"]

measurable:
  - "hit rate of plain box entries vs order-block-confirmed box entries"
  - "how often box_level is retested at all after the deviation"

sources:
  - video_id: CHIK5oBRKiw
    title: "Change In State Of Delivery [CISD] - Orderblock Formation - ICT Concepts"
  - video_id: TCFvsZeYvV8
    title: "ICT Power Of 3 - AMD"
  - video_id: MPeeE55rNOw
    title: "ICT Killzones & Indicator Settings"

ambiguities:
  - "The Box setup is referenced as having its own dedicated video ('if you are familiar with the Box setup video') which is NOT part of this unit — so the full rule set is unavailable here."
  - "Whether box_level is the highest body of the whole accumulation or only of the candles adjacent to the deviation is not stated."
  - "His phrasing that the box setup is a retest of the previous highs leaves the precise level ambiguous between the body cluster and the range high."
  - "No rule for when to prefer the plain versus the confirmed variant."

python_detector: null
related: ["power-of-three-amd", "cisd", "order-block", "standard-deviation-projection", "manipulation-first-heuristic"]
