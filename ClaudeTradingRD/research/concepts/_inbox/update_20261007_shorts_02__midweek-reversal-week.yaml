    title: "Midweek Reversal Breakdown"
    quote: "Monday we expand higher, Tuesday we form a reversal candle."
  - video_id: HkYIaPT8cms
    title: "Midweek Reversal Breakdown"
    quote: "So, on this next day, it is okay to be bullish, right?"
  - video_id: HkYIaPT8cms
    title: "Midweek Reversal Breakdown"
    quote: "Wednesday reversal, Thursday continuation with a strong closure on Thursday"
ambiguities:
  - "This example has Monday expanding WITH the eventual bias, contradicting the library rule that Monday and Tuesday both close against it; whether Wednesday's low is still the low of the week is not stated in the transcript."
  - "Two fair value gaps are offered ('here or here') for Wednesday's reaction with no rule to choose between them."
  - "'Pretty strong closure' (the Friday gate) remains unquantified."
