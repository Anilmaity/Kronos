id: midweek-reversal-week
name: Midweek Reversal (weekly profile)
category: model
status: specified
voice: ttrades
definition: >
  SHORTS EVIDENCE with a different early-week shape from the library definition. Monday expands
  higher (in the eventual bias direction), Tuesday prints a reversal candle, and Wednesday is expected
  to trade back lower into a fair value gap and form a swing point from which to trade higher. Wednesday
  closes as a candle 2 closure reversed out of a point of interest; on the hourly there is a change in
  the state of delivery inside it, so Thursday may be traded bullish. Thursday expands and closes strong,
  which is read as licensing a Friday continuation.
detection_rules:
  - "Allowed early-week shape: Monday expands in the bias direction, Tuesday forms an opposing reversal candle, Wednesday retraces into a fair value gap (point of interest)."
  - "Wednesday must close as a candle 2 closure out of that point of interest."
  - "Confirm with an hourly change in the state of delivery inside Wednesday before being bullish for Thursday."
  - "A strong Thursday close licenses a Friday continuation."
sources:
