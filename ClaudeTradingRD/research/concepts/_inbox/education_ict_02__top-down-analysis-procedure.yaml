id: top-down-analysis-procedure
name: Top-Down Read (daily bias to entry)
category: model
status: contested
definition: 'The earlier top-down lesson, and it opens with the one thing the later canon leaves implicit:
  which timeframes you take points of interest from is DETERMINED BY YOUR ENTRY TIMEFRAME (see poi-timeframe-selection).
  Under a 5-minute / 1-minute / sub-1-minute entry regime the ladder he walks is Daily -> 4-Hour ->
  1-Hour -> 15-minute for points of interest, then 15/5/1-minute for entries, and 15-second when the
  entry needs refining further. Daily supplies the marked levels (previous highs, an order block,
  the fair value gap fill, internal liquidity) and the question of whether price falls back into the
  range or reaches lower; the 4-hour supplies the session point of interest; the lower timeframes
  supply the entry either INTO a point of interest or AWAY from one once price has reached it.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  - 15m
  ltf:
  - 5m
  - 1m
  - 15s
  fractal: true
detection_rules:
- Fix the entry timeframe first; that selects which timeframes carry your points of interest.
- 'Daily: mark previous highs/lows, order blocks, the fair value gap fill and internal liquidity.
  Mark nothing else - ''that is all I really want to Mark out''.'
- '4-Hour: mark the block that is live for the session you trade.'
- '1-Hour: often contributes nothing; skip it when there is nothing to mark.'
- '15/5/1-minute: take entries either reaching FOR a point of interest or moving AWAY from one that
  price has just tagged.'
- '15-second: used to find low-risk entries toward the already-identified objective.'
- Trade from one point of interest to the next; the low-risk entry is what reduces the risk of the
  leg between them.
- At the destination point of interest, look for the 2022 model (liquidity run, break of structure,
  clean fair value gap) - but he states you do not always get it.
measurable:
- R of point-of-interest-to-point-of-interest legs
- frequency of the full 2022-model shape at the POI
