ambiguities:
- 'EVOLUTION vs the Updated playlist: the later canon fixes the ladder at Daily -> Hourly -> 5-minute
  in all three of its examples. This earlier version makes the ladder a FUNCTION of the entry timeframe
  and routinely uses 15-second charts, which the later material does not.'
- '''Are we more likely to reach lower here or reach up for this point of interest'' is resolved by
  ''to me this point of Interest makes more sense'' - no test.'
- The auto-captioner renders 'break of structure' as 'breaker structure' and 'fair value gap' as 'farewell
  you have' in the 2022-model sentence.
- No rule orders competing daily-chart levels.
