ambiguities:
  - "Only ONE extra candle is allowed to print in the worked example; the Shorts never say whether a candle 4 closure would also be accepted if candle 3 fails."
  - "'Close over the body of candle two' is stated, but which body edge (open or close) is the reference is not."

python_detector: null
