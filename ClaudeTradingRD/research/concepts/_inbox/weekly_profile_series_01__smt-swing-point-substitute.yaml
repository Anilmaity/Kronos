    title: "Weekly Profile for Daily Bias - Intraweek Reversal"
  - video_id: uPUNOi_R9fA
    title: "Weekly Profile for Daily Bias - Thursday Counter"
  - video_id: -gyDd_E_qD4
    title: "Weekly Profile for Daily Bias - Midweek Reversal"
  - video_id: McJflkKuvrI
    title: "Weekly Profile for Daily Bias - Consolidation Reversal"

ambiguities:
  - "SMT is never defined in this unit; it is assumed knowledge from other playlists in the corpus."
  - "The correlated instrument is unnamed in almost every use. The Intraweek Reversal video refers to it only as 'RB', which the transcript never expands and which is not verifiable without the chart, so it is left unidentified here rather than guessed. ES and NQ are named once, in the final Thursday Counter example."
  - "No rule is given for how to choose the correlated instrument for a given traded instrument."
  - "Whether the divergence must be on the same timeframe as the candidate candle is not stated."
  - "The interaction between the SMT substitution and the usual hourly-CISD requirement is not spelled out - in the Thursday Counter reversal-day case it is unclear whether the CISD is still required or whether SMT plus a small wick replaces it."
  - "Status is underspecified because the divergence test itself is never stated in this unit."

python_detector: null
related: ["reversal-candle-quality", "thursday-counter-week", "intraweek-reversal-week", "hourly-cisd-confirmation"]
