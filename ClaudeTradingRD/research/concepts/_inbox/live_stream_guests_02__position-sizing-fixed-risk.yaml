id: position-sizing-fixed-risk
name: Fixed-Risk Position Sizing (stop from the chart, size from the risk)
aliases:
- fixed dollar risk
category: risk
status: specified
definition: Both host and guest state the same procedure in the same exchange, so this is a genuine
  convergence rather than one man's rule. The stop goes where the CHART says it goes; the position size
  is then solved so that the dollar risk is the same on every trade. TTrades adds that on funded accounts
  the risk figure is set for him and on a personal account it may be a little higher, but it is always
  a fixed dollar amount. AM Trades declines to say how much anyone should risk, only that this is the
  process.
timeframes:
  htf: []
  ltf: []
  fractal: false
preconditions:
- A trade with a chart-derived invalidation level.
detection_rules:
- Place the stop at the structural invalidation on the chart - never at a fixed distance.
- Compute position size = fixed dollar risk / stop distance.
- Keep the fixed dollar risk constant across trades.
- On a funded account, use the account's prescribed risk figure.
invalidation: []
measurable:
- variance of realised dollar risk per trade
- distribution of stop distances
sources:
- video_id: wGYde-h84cs
  title: Live Q&A with AM Trades - Weekly Profile
  quote: it's always fixed dollar risk for me personally
- video_id: wGYde-h84cs
  title: Live Q&A with AM Trades - Weekly Profile
  quote: you should be having your stop based on the chart
ambiguities:
- No percentage-of-account figure is given by either speaker; both explicitly decline to prescribe one.
- No rule caps the position size when the chart stop is very tight.
related:
