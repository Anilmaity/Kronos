id: po3-four-hour-opening-times
name: 4-Hour Power of Three Openings (futures vs forex grids)
category: time
status: specified
definition: 'SHORTS EVIDENCE naming two concrete 4-hour opening times and the if-then that links them.
  The 6 a.m. 4-hour candle is where the higher-timeframe wick forms; if 6 a.m. forms the REVERSAL, then
  the 10:00 a.m. 4-hour candle is looked at to CONTINUE - that being the candle 3 continuation, or the
  continuation expansion candle. Execution is dropped onto the paired hourly and 5-minute fractal model,
  waiting for the T-spot: price opens, makes its wick inside the zone, then trades away.'
preconditions:
- A previous day extreme has been swept and expansion has printed a reversal.
detection_rules:
- Read the 4-hour candle that opened at 6 a.m. - is it a reversal (large opposing wick)?
- If 6 a.m. formed the reversal, expect the 10:00 a.m. 4-hour candle to be the continuation.
- That 10:00 a.m. candle is the candle 3 / continuation expansion candle.
- Execute on the paired hourly and 5-minute fractal model, in the T-spot.
- Stop on the opposing candle or on the fair value gap; target 2R or the negative one standard deviation.
measurable:
- share of 6 a.m. reversal candles followed by a 10 a.m. continuation candle
- 2R hit rate of T-spot entries inside the 10 a.m. candle
sources:
- video_id: R_KRKwYpzdE
  title: A Simple Way to Trade the 4H Power of Three
  quote: if 6 a.m. forms a reversal, we can look for 10:00 a.m.
- video_id: R_KRKwYpzdE
  title: A Simple Way to Trade the 4H Power of Three
  quote: That would be that candle 3 continuation or the continuation expansion candle
ambiguities:
- The timezone of '6 a.m.' and '10:00 a.m.' is not stated in the Short (the library elsewhere anchors
  the session clock to EST, but this clip does not say so).
- Only two of the six 4-hour opens are named; the rest of the grid is not given here.
- It is not stated whether this is the futures grid or the forex grid.
