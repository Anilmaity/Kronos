id: trade-frequency-under-two-per-day
name: Fewer Than Two Trades A Day, Around Eight A Week
aliases:
- less rather than more
category: risk
status: specified
definition: 'AM Trades'' stated frequency when trading market maker models: fewer than two trades
  a day on average, with some days taking none, giving roughly eight a week. He frames the number
  as an output of the model rather than as an enforced cap - some weeks the market presents more opportunity
  than others, market maker models do not set up every day, and when they do appear they are high
  probability, so the count comes out ''less rather than more''. It is recorded here because it is
  a concrete frequency figure and because it differs by roughly four-fold from the channel''s own
  stated baseline of one to two trades a week.'
timeframes:
  htf: []
  ltf: []
  fractal: false
preconditions:
- Trading market maker models on indices and Bitcoin, which is his stated instrument set.
detection_rules:
- Expect fewer than two trades per day on average, and roughly eight per week.
- Take no trades on days when the model does not present.
invalidation:
- Not applicable - a frequency observation.
measurable:
- realised trades per week over a live sample against the stated eight
- expectancy per trade at eight per week vs at a lower frequency
sources:
- video_id: CrUfTskOveo
  title: Stream Q & A with AM Trades  - ICT concepts
  quote: i'm probably taking less than two a day
ambiguities:
- Stated as an observed average, not an enforced cap - unlike the other two guests in this unit, no
  hard per-day maximum is given.
- The figure is not broken down by instrument or by session.
