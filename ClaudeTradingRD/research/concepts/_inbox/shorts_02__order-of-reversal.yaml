id: order-of-reversal
name: The Order Of A Reversal (confirmation ladder)
category: entry
status: specified
definition: 'A Short walks the ladder live and numbers the rungs out loud: step one is the turtle soup
  (the sweep of the high out of a consolidation), step two is the inversion, step three is the change
  in the state of delivery / order block formation, and immediately after that a breaker block plus
  a fair value gap form and overlap. He then anticipates the move to the lows, with the retest into
  the overlapping fair value gap and breaker - bodies still respecting the CISD - producing a new propulsion
  block.'
timeframes:
  htf:
  - 1H
  ltf:
  - 15m
  - 5m
  fractal: true
preconditions:
- Price is being read as a consolidation and reaches into London.
- A sweep of the consolidation high (or low) occurs.
detection_rules:
- 'Step one: the sweep of the consolidation high - a turtle soup.'
- 'Step two: an inversion forming after the sweep; this is already an entry.'
- 'Step three: the change in the state of delivery / order block formation.'
- 'Immediately after step three: a breaker block and a fair value gap form and overlap.'
- On the retest, require the bodies to still respect the change in the state of delivery.
- The retest into that overlap can itself form a new propulsion block.
invalidation:
- Price takes out the low the reversal was trading toward without the sequence completing - the Short
  ends with exactly that happening.
measurable:
- expectancy by rung (turtle soup vs inversion vs CISD entry)
- how often the breaker and fair value gap overlap after step three
sources:
- video_id: v7gxt39p1NU
  title: Recognizing the Reversal Sequence
  quote: I would anticipate this to be a turtle soup or step one in a reversal
- video_id: v7gxt39p1NU
  title: Recognizing the Reversal Sequence
  quote: So, then that would be an entry or step two
- video_id: v7gxt39p1NU
  title: Recognizing the Reversal Sequence
  quote: Now, step three would be looking for this change in the state of delivery
ambiguities:
- The Short numbers three steps and then describes the breaker and fair value gap without numbering
  them, so whether they are rungs four and five or just consequences is left open here.
- No rule is given for choosing which rung to take; the clip simply narrates all of them.
- The clip is on an unnamed instrument and only London is named as the session.
