id: fomc-nfp-cpi-only
name: Only Three Releases Are Tracked; Never Trade After FOMC
definition: The entire economic calendar is reduced to three releases. Everything else - the red and
  orange impact colouring on calendar sites - is ignored. On FOMC day he holds no expectation for
  the release, does not trade after it, and waits for the next day. He also does not use fundamental
  analysis intraday.
category: time
status: specified
detection_rules:
- Filter the economic calendar to the three named releases; ignore all other impact tiering.
- Do not take a trade after the FOMC release; resume the next session.
- Expect a low-quality, range-bound session on FOMC day before the release.
- No fundamental or rate-expectation input feeds the intraday model.
measurable:
- expectancy of signals taken after an FOMC release vs all other sessions
- how many sessions per year the filter removes
sources:
- video_id: m0wTBdUe7gs
  title: New York Open Live Q&A
  quote: I only focus on three things
- video_id: xraklBJHW5k
  title: New York Open Live Q&A
  quote: never trade after FOMC. I just wait for the next day
ambiguities:
- The auto-captioner renders the three releases as 'API, FOMC, NFP'. FOMC and NFP are unambiguous;
  'API' is almost certainly CPI mis-transcribed (there is no plausible reason for the American Petroleum
  Institute crude stocks report to sit alongside FOMC and NFP for an index trader). It is recorded
  here as spoken rather than corrected.
- '''After FOMC'' is not bounded - no rule says whether the rest of that day or a fixed number of
  hours is excluded.'
- Nothing is said about trading before the release on FOMC day beyond low expectations.
