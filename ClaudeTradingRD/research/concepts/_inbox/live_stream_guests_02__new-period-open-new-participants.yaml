id: new-period-open-new-participants
name: Every New Timeframe Open Brings A New Participant Group
aliases:
- new month new participants
- new open new algo instruction
category: time
status: specified
definition: 'The guest''s causal story for why higher-timeframe opens matter: roughly 70% of traded
  volume is algorithmic, and an algorithm has to be told three things - what to trade, how to trade
  it (sit on the bid, sit on the offer, or take the offer aggressively), and WHEN. Because the ''when''
  is anchored to period opens, each new yearly, quarterly, monthly, weekly, daily or hourly open introduces
  a fresh participant group. The practical consequence he trades is that at each new open you want to
  see either confirmation of what the higher timeframes are doing, or a reversal that negates them -
  and a period flipping from selling to buying right on its open is the observable signature.'
timeframes:
  htf:
  - 1Y
  - 1Q
  - 1M
  - 1W
  - 1D
  ltf:
  - 1H
  fractal: true
preconditions:
- Period opens marked on the chart.
detection_rules:
- At each new period open, classify the new candle relative to the previous period's range.
- A new period that immediately trades opposite to the previous period's direction is a participant
  change - treat it as the reversal candidate.
- A new period that continues the previous direction confirms the higher timeframe.
- For day trading the relevant new opens are the hour and the day; for positioning, the month, quarter
  and year.
invalidation:
- The new period fails to confirm or reverse and prints a 1 (inside bar) - nobody is in control.
measurable:
- forward return of a period whose first bars reverse the previous period's direction
- frequency of an immediate open-flip at monthly and quarterly opens
