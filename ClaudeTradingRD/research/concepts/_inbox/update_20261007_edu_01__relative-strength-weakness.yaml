ambiguities:
  - "The three inputs are again not weighted; one example shows only closures differing, another only SMT, and he says not all three will show up."
  - "Separation is visual; 'a few points' vs 'quite far' on ES/NQ is not normalised across instruments."
  - "Strength in one example 'switched' later in the move; no rule says whether to change the traded asset."
  - "In the gold vs gold-GBP example both assets reached the target, so the selection payoff is not demonstrated."
