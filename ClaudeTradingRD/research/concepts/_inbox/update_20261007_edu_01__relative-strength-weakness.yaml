id: relative-strength-weakness
name: Relative Strength & Weakness (ES / NQ / YM)
category: structure
status: specified
voice: ttrades
definition: >
  Dedicated full-guide lesson (yH4eYwUgdTY), generalised beyond the index triad to any
  correlated pair (ES/NQ, gold futures vs gold-GBP, gold futures vs gold-euro). Rule: long the
  stronger asset, short the weaker. Three inputs, in the order taught: (1) SMT - at the same
  shared low the asset making the higher low is stronger, the one making the lower low weaker
  (mirrored at highs); (2) structure/separation - used when SMT is NOT present: measure each
  asset's distance from the same extreme; the greater the separation from the low, the
  stronger the asset (closer to a shared high = stronger); (3) candle closures - the
  'more advanced' input, read candle by candle at the same timestamps. It must only be used on
  correlated assets and never alone - a higher-timeframe framework and strategy come first.
detection_rules:
  - "Correlated assets only; mark the SAME swing (same-timeframe high/low) on both."
  - "SMT: asset that makes a higher low (bull) / higher high (bear side reversed) at the shared level is stronger; lower low / lower high is weaker."
  - "If no SMT exists (neither or both took the level), use separation: the asset farther from the shared low is stronger; the asset farther below a shared high is weaker."
  - "Candle-2 closure test: both assets sweep the prior low; the one whose C2 closes back above C1's low is stronger, the one that cannot close back inside is weaker."
  - "CISD-closure test: the asset whose candle closes through the level validating the change in state of delivery shows the move (weakness on a bearish CISD); the asset that cannot close through it is stronger on that side."
  - "Body test: a candle closing over its previous candle's body vs a doji / inside close at the same time marks the stronger asset; an engulfing bearish candle vs a doji marks the weaker."
  - "Multiple SMTs on different timeframes can stack; when they agree they reinforce the same ranking."
  - "Re-read continuously: closures can show strength switching between the assets later in the move."
execution:
  bias: "From the higher-timeframe framework, not from relative strength."
  entry: "Per the model, on the stronger asset for longs, the weaker for shorts."
  stop: "Per the entry model."
  targets: ["Per the entry model"]
measurable:
  - "forward R of the model on the asset ranked stronger vs weaker by each of the three tests"
  - "agreement rate between SMT, separation and closure tests"
