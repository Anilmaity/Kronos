id: intermediate-term-swing-formation
name: An Intermediate-Term Low Or High Forms Two Ways
category: structure
status: specified
definition: 'A Short gives the structural build-up and, usefully, a NAME the corpus did not have for
  the second route. A short-term low is a swing low (a low with a higher low on each side); a short-term
  low that has a HIGHER short-term low on its right and on its left becomes an INTERMEDIATE-TERM low
  (mirrored for highs). That is the first type. The second type he names outright: a REBALANCED intermediate-term
  high or low, which forms when price drops into a fair value gap and trades away from it (mirrored
  above).'
timeframes:
  htf: []
  ltf:
  - 5m
  - 1m
  fractal: true
preconditions:
- Short-term highs and lows have already been marked (three-candle swing definition).
detection_rules:
- Short-term low := a low with a higher low on each side of it. Short-term high := a high with a lower
  high on each side.
- Type 1 intermediate-term low := a short-term low with a HIGHER short-term low to its right and to
  its left.
- Type 1 intermediate-term high := a short-term high with a short-term high to its left and to its right.
- Type 2, "rebalanced" intermediate-term low := price drops down into a fair value gap and trades away,
  creating the low.
- 'Type 2 mirrored: price trades up into a fair value gap and then away, creating the intermediate-term
  high.'
invalidation:
- Not applicable - a labelling rule.
measurable:
- ratio of type-1 to rebalanced intermediate-term swings per session
- how often a rebalanced intermediate-term low holds versus a type-1 one
sources:
- video_id: d0x29IO1CQQ
  title: Intermediate Term Lows and Highs role in Market Structure
  quote: A short-term low is when we form a swing low
