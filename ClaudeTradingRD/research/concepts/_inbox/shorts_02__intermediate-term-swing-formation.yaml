  quote: price drops down into a fair value gap and trades away
ambiguities:
- The bearish type-1 wording in the Short is loose - "a short-term high with a short-term high to its
  left and to its right" omits the LOWER qualifier the bullish case carries. Read as an auto-caption
  / speech slip rather than a different rule, but it is not corrected on the clip.
- The rebalanced route does not say how far into the fair value gap price must trade, nor whether the
  gap must then be respected.
- No timeframe is named in the clip; the diagram is generic.
