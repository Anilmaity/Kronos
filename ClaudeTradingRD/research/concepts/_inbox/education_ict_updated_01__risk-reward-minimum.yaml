id: risk-reward-minimum
name: Minimum Risk-To-Reward
aliases:
- minimum R
- at least two R
category: risk
status: specified
definition: 'He states a personal floor of 2R in two separate videos and a 1:2 minimum in a third, and
  lets it drive both target selection and entry refinement: he rejects a 1.19R entry and moves it up
  to about 2R, and he declines a fixed 1:1 in favour of structural targets. In the internal/external
  model 2R is the fixed target rather than a floor. Break-even is moved at 3R in the silver-bullet backtest.'
timeframes:
  htf: []
  ltf: []
  fractal: false
detection_rules:
- Compute R to the intended structural target before entering.
- Below ~2R, refine the entry downward (deeper into the FVG, to the consequent encroachment, to the
  mean threshold) rather than take the trade.
- If refinement cannot reach 2R and the target is fixed, skip.
- Where a fixed target is used (internal/external model), it is 2R.
- Move the stop to break-even at 3R (stated for the silver-bullet backtest).
invalidation:
- Refining the entry raises R but lowers fill probability — he explicitly trades that off rather than
  always maximising R.
measurable:
- fill rate vs realised R at each refinement level
- outcome of trades taken below the 2R floor
