ambiguities:
- 2R appears as a floor (6zTz7WMdMWg), a fixed target (mwmWNCTEYtY) and a preference (AdmnWLjf8rY) —
  the three uses are not reconciled.
- The Son's-model 1:1 he teaches is explicitly ICT's, and he says he personally would not trade it;
  both are presented in the same video.
- '''Partial then runners'' is shown repeatedly but never given a size or a rule.'
