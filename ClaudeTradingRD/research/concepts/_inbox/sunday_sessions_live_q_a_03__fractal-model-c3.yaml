id: fractal-model-c3
name: "Candle 3 Closure"
aliases: ["C3", "candle three closure", "C3 closure"]
category: model
status: underspecified

definition: >
  A distinct formation from a candle two closure, and the distinction is load-bearing:
  when a viewer objected that a setup was invalid because "the C2 didn't sweep C1", he
  corrected that the formation was not a candle two at all but a candle three closure,
  and pointed to the fact that there are two separate videos for exactly this reason.
  A C3 also arises as the candle following a confirmed C2 - once the change in state of
  delivery confirms the C2, the next candle is a candle three in the new direction.

timeframes:
  htf: ["1M", "1D", "4H", "1H"]
  ltf: ["15m", "5m"]
  fractal: true

preconditions:
  - "Either a confirmed C2 with a change in state of delivery (the sequential case), or a prior candle that made a high followed by aggressive delivery (the standalone case)."

detection_rules:
  - "Sequential case: a mechanical candle two closure plus a change in state of delivery makes the following candle a candle three."
  - "Standalone case: the candle does not need to sweep the prior candle's extreme, and it does not need to close beyond the opening price, provided the EQ is respected - he calls a monthly candle bearish on exactly this basis."
  - "A C3 closure is a valid short/long framework in its own right; the absence of a C2 sweep is not a disqualifier."
  - "In an earlier version of his course a wider class of candles was labelled C3 using the EQ; he narrowed the wording because students confused it."

invalidation:
  - "The EQ not being respected - the directional read is over."

execution:
  bias: "The direction of the C3 delivery."
  entry: "Lower timeframe CISD, then the 4-hour/15-minute or hourly/5-minute continuation."
  stop: "Beyond the C3 extreme."
  targets: ["2R", "the drawn objective"]

measurable:
  - "frequency of C3 formations without a preceding C2 sweep"
  - "outcome of the standalone C3 case vs the sequential case"

sources:
  - video_id: bMkRomKEunU
    title: "New York Open Live Q&A"
  - video_id: wM1s7UivQ08
    title: "New York Open Live Q&A"

ambiguities:
  - "The full mechanical definition is not given here - he refers viewers to the dedicated candle three closure video. This entry captures only what the live corrections establish."
  - "Which EQ is used (of the prior candle, of the leg) is not specified."
  - "He acknowledges his own definition changed between course versions, so historical material may not match."

python_detector: null
related: ["fractal-model-c2", "cisd", "premium-discount", "timeframe-alignment"]
