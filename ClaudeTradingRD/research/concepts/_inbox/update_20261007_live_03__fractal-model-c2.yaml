id: fractal-model-c2
name: Candle 2 Closure (the reversal candle)
category: model
status: contested
definition: 'Clarifications from viewer questions. (1) Relabelling: if C3 opens and sweeps the C2 extreme,
  the old candle is no longer C2 - the new candle becomes C2, and you wait for a new closure. (2) Targets
  of a daily C2: first the EQ, second the previous day high (bullish case). (3) Trading C2 is inherently
  trading a reversal, so it is more likely to fail than waiting for a C3 continuation the next day. (4)
  Non-trading days do not count as candles: if Thursday is C2, Friday is C3 and Monday is C4; a bank-holiday
  Monday does not count.'
detection_rules:
- If the candle after a C2 trades beyond the C2 extreme, discard the old C2 and treat the new candle as
  the candidate C2; wait for its closure.
- 'Daily C2 targets: T1 = C2 range EQ, T2 = previous day''s opposite extreme.'
- Only trading days count in the C1-C4 sequence.
measurable:
- frequency of C2 relabelling (C3 sweeping the C2 extreme)
- hit rate of EQ then previous-day-extreme after a daily C2
sources:
- video_id: rVRk4MLTJSs
  title: New York Open Live Q&A
  quote: This isn't C2 anymore. This is now C2.
- video_id: rVRk4MLTJSs
  title: New York Open Live Q&A
  quote: First target's the EQ. second target, previous day high.
- video_id: rVRk4MLTJSs
  title: New York Open Live Q&A
  quote: So, it's more likely to fail than if this would have closed up here.
ambiguities:
- Whether the relabelled candle must itself close back inside to become C2 is implied by 'wait for a new
  closure' but not stated.
