id: intermediate-term-swing-formation
name: An Intermediate-Term Swing Point Is One That Rebalanced A Fair Value Gap
aliases:
- intermediate term high
- intermediate term low
- advanced market structure
category: structure
status: specified
definition: 'Two guests in this unit give the same mechanical test for an intermediate-term swing
  point: it is the swing that formed when price traded back into - rebalanced - a fair value gap.
  AM Trades adds the directional use, which is the whole point of the labelling: while bearish you
  want intermediate-term lows to be broken and intermediate-term highs to stay unviolated, and reading
  structure this way replaces higher-high / higher-low labelling entirely. Alex''s Options gives a
  second route in the same unit - a high flanked by a short-term high on each side, which he describes
  as looking like a small head-and-shoulders - and says he rolls the reference intermediate-term low
  upward as new ones form. Both defer to ICT''s 2022 mentorship, episodes 12 and 13, for the full
  scheme.'
timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 30m
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- A fair value gap exists that price can retrace into; a directional read is already in place.
detection_rules:
- A swing that formed on a retracement into a fair value gap is an intermediate-term swing point.
- 'Second route stated by Alex''s Options: a high flanked by a short-term high on each side is an
  intermediate-term high.'
- 'Bearish: require intermediate-term lows to be broken and intermediate-term highs to stay unviolated.
  Mirror for bullish.'
- As price advances, roll the reference intermediate-term swing forward to the most recent one.
invalidation:
- An intermediate-term high is violated while the read is bearish (mirror for bullish).
measurable:
- continuation rate after an intermediate-term low is broken vs after an ordinary swing low is broken
- relative frequency of the two formation routes
sources:
- video_id: CrUfTskOveo
  title: Stream Q & A with AM Trades  - ICT concepts
  quote: swing points are going to occur when price trades back into a fair value gap
- video_id: CrUfTskOveo
  title: Stream Q & A with AM Trades  - ICT concepts
  quote: intermediate term lows broken and intermediate term highs staying unviolated
ambiguities:
- The two routes given by the two guests are never reconciled with each other.
- '''Trades back into'' is not quantified - a touch, the 50%, or a full fill are not distinguished.'
- Both speakers defer the full short-term / intermediate-term / long-term scheme to ICT's mentorship
  rather than stating it.
