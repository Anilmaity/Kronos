id: po3-four-hour-opening-times
name: 4-Hour Power of Three Openings (futures vs forex grids)
category: time
status: specified
aliases:
- 4-hour grid
- 6am 10am candle
definition: 'The 4-hour power-of-three is anchored to a fixed grid of candle opens, and this video states
  that the grid DIFFERS between futures and forex -- an hour apart. The futures candles referenced in
  the walkthroughs are 02:00, 06:00, 10:00 and 14:00 (New York time), implying the 18/22/02/06/10/14
  grid. The forex candles referenced are 17:00, 21:00, 01:00 and 09:00, implying a 17/21/01/05/09/13
  grid. He introduces the forex example by saying the timings are different from futures, so the divergence
  is deliberate, not a transcript artifact. Operationally: a 02:00 (London) reversal implies the 06:00
  candle continues, and the 10:00 candle continues conditional on 06:00 closing strongly.'
timeframes:
  htf:
  - 4H
  ltf:
  - 15m
  - 5m
  - 3m
  fractal: false
preconditions:
- A daily bias and a 4-hour candle 2 / candle 3 read.
detection_rules:
- 'Futures 4-hour opens used in this unit: 02:00, 06:00, 10:00, 14:00 New York (with 18:00 and 22:00
  completing the grid).'
- 'Forex 4-hour opens used in this unit: 17:00, 21:00, 01:00, 09:00 New York (with 05:00 and 13:00 completing
  the grid).'
- A 02:00 reversal (London) implies 06:00 as the continuation candle.
- 10:00 is treated as conditional on 06:00 closing strongly.
- Only trade the third expansion candle in the sequence if the drawn liquidity has not yet been met.
- At the close of an expansion candle (e.g. 14:00) do not fight it -- wait for the close and then for
  a reversal candle to form.
invalidation:
- The higher-timeframe target is reached inside the earlier candle -- the later candle in the sequence
  is no longer sought.
measurable:
- expansion of the 06:00 and 10:00 candles conditioned on a 02:00 reversal
- whether the forex grid or the futures grid better fits realised 4-hour swings on FX pairs
sources:
- video_id: FAKWJ-1NlLE
  title: Trading The 4 Hour Power Of Three - OHLC / OLHC
  quote: you can see how those timings are a bit different from futures
- video_id: FgP2lc9nneM
  title: The Best Timeframe for TTrades Fractal Model (Simple)
  quote: 10 a.m. is dependent on 6 a.m. with a strong closure
ambiguities:
- The exact grids are shown on-screen as slides and only partially spoken; the futures set 02/06/10/14
  and the forex set 17/21/01/09 are the values actually verbalised, and 18/22 and 05/13 are completed
  by inference.
- The timezone is not named in this video; New York is assumed from the rest of the corpus.
- No explanation is given for WHY the forex grid should be offset by an hour from the futures grid.
- '''Strong closure'' on the 06:00 candle is unquantified.'
