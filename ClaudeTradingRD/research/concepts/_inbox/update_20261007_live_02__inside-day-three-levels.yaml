id: inside-day-three-levels
name: Inside Day — Only Three Points Of Interest
category: liquidity
status: specified
voice: ttrades
aliases:
- double inside day
definition: 'Adds the double inside day case: when neither side of the previous day''s range has been
  taken (he calls the session a double inside day) the day is consolidation by definition, and his stated
  expectation is that price sits around the EQ and the opening price.'
timeframes:
  htf:
  - 1D
  - 1H
  ltf: []
  fractal: false
preconditions:
- Current day has taken neither previous-day high nor previous-day low; previous day was itself inside.
detection_rules:
- 'Double inside day: two consecutive daily ranges each contained by the prior one.'
- On such a day expect price to oscillate around the range EQ and the daily opening price.
invalidation:
- Either previous-day extreme is taken.
measurable:
- mean distance of intraday closes from daily open and range EQ on double inside days vs other days
sources:
- video_id: h1ZQWWQDhKA
  title: TTrades MNQ Cup - Afternoon Session
  quote: We are double inside day
- video_id: h1ZQWWQDhKA
  title: TTrades MNQ Cup - Afternoon Session
  quote: normally we're just going to be right around the EQ and the opening price
ambiguities:
- Whether 'double inside day' means two consecutive inside days or simply an inside day that has taken
  neither side is ambiguous from the caption ('previous days high, previous day's high').
- Which EQ (previous day, or the current range) is meant is not stated.
