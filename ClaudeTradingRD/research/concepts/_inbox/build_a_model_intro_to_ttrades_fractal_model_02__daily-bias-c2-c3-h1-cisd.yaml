id: daily-bias-c2-c3-h1-cisd
name: Daily Bias = Daily C2/C3 Closure Confirmed by H1 CISD
category: model
status: specified
aliases:
- the two-part gate
- closure plus CISD
definition: 'The two-part gate that every setup in this unit passes through: a candle 2 (or candle 3)
  closure on the higher timeframe, AND a change in the state of delivery inside that same candle on
  the paired lower timeframe. Neither half is sufficient. A closure without a lower-timeframe CISD is
  ''not a valid fractal model'' and he waits or ignores it; a CISD without a higher-timeframe closure
  ''does not mean anything''. He also gives the failure mode: when the CISD never forms, price typically
  consolidates and then takes one side of the range and trades to the other.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 1H
  - 15m
  - 5m
  - 3m
  fractal: true
preconditions:
- A higher-timeframe candle 2 or candle 3 closure has printed.
detection_rules:
- Locate the extreme of the closure candle on the lower timeframe.
- Locate the series of same-direction candles that made that extreme.
- Require a close through that series. Until that close occurs the model is unconfirmed and no entry
  is valid.
- A CISD with no higher-timeframe candle closure is discarded.
- 'Quality test on the CISD: a fast V-shape is wanted. If price consolidates for half the candle and
  then closes over, treat it as consolidation rather than a confirmed reversal.'
invalidation:
- The lower timeframe makes a new extreme before closing through -- the old level is abandoned and the
  new series is tracked instead.
- No close through occurs before the higher-timeframe candle ends.
measurable:
- proportion of HTF closures that receive an LTF CISD within the same candle
- forward expansion of confirmed vs unconfirmed closures
- frequency of the consolidate-then-take-one-side failure mode
