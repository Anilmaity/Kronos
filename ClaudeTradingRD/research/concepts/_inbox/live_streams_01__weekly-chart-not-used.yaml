id: weekly-chart-not-used
name: The Weekly Chart Is Skipped
definition: He does not use the weekly timeframe as a chart. The weekly profile is read off the daily
  candles instead, and any level a weekly chart would supply - previous week's high or low - is already
  visible on the daily as a swing high or low. The top-down read therefore goes monthly to daily,
  with the weekly step done in his head. Timeframe selection for positional work is likewise daily
  plus hourly, not weekly plus 4-hour.
category: time
status: specified
timeframes:
  htf:
  - 1M
  - 1D
  ltf:
  - 4H
  - 1H
  fractal: false
detection_rules:
- Do not chart the weekly timeframe; step from monthly to daily.
- Derive the weekly profile from the sequence of daily candles.
- Previous week's high/low is taken as the corresponding daily swing high/low.
- Positional / swing analysis uses the daily and the hourly.
measurable:
- whether a weekly-derived level ever differs from the daily-derived equivalent
sources:
- video_id: NESSCPMzWR0
  title: New York Open Live Q&A
  quote: I don't really use the weekly chart, to be honest
- video_id: yNgx9OAefuI
  title: New York Open Live Q&A
  quote: I use the daily and hourly
ambiguities:
- He allows that a weekly bias can be used ('you can use it') but says he does not make his bias off
  the weekly candle most of the time - so this is a preference, not a prohibition.
- For swing trades he does go above the daily - monthly, three-month and sometimes yearly - so the
  skipped timeframe is specifically the weekly.
