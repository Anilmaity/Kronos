ambiguities:
- '''A very large Wick'' - the trigger for switching from whole-candle EQ to wick EQ - is not quantified.
  The switch condition is decidable only via the reversal reading (a close above 0.5 of the range),
  which is itself hedged with ''generally''.'
- He says he would 'allow it to trade slightly a bit higher' than the exact 0.5 of a wick, so the
  level is a zone whose width is not given.
- Wick touch versus body close through the EQ is not distinguished.
- CONTESTS the body-based reading recorded elsewhere in the library ('use 50% of the bodies of the
  opposing candle'). This dedicated video rules bodies out for EQ specifically and assigns them to
  the CISD and order blocks. The two statements cannot both be his general rule; this one is from
  the primary teaching.
- The auto-captions render 0.5 variously as '0.5', '05', '0 five' and '5 of that'.
