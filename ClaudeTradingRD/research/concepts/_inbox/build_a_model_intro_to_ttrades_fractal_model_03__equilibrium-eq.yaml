id: equilibrium-eq
name: Equilibrium / 50% Level (EQ, T spot)
aliases:
- EQ
- equilibrium
- 0.5 of the range
- 0.5 of this Wick
category: entry
status: contested
definition: 'The dedicated teaching video for how he measures EQ, and it settles the measurement question
  the rest of the corpus leaves open. The tool is a plain Fibonacci with 0.5 (and 1) marked, usually
  reduced to just the 0.5. The candle is ALWAYS measured wick high to wick low; he states directly
  that he does not use the bodies for this, because bodies are what he uses for the change in the
  state of delivery and for order blocks. One exception is given and it is the exception the corpus
  needed: when a candle carries a very large wick, taking the EQ of the whole candle ''doesn''t really
  make sense'' and he switches to 0.5 of that wick instead. The switch is tied to a readable trigger
  - a close above 0.5 of the candle''s range is generally what makes him view the candle as a reversal,
  after which 0.5 of its wick is the level in use. He applies it on the previous completed candle
  to govern the current one, and says it is fractal but that he prefers daily / 4-hour / hourly because
  a 5-minute application becomes too much to look at.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 1H
  - 15m
  - 5m
  fractal: true
preconditions:
- A completed candle (or range) whose 0.5 can be marked.
detection_rules:
- Draw the Fibonacci from the candle's WICK HIGH to its WICK LOW; EQ := the 0.5 level.
- Do NOT use the bodies - bodies are reserved for the CISD and for order blocks.
- 'Default: EQ of the whole candle''s high-to-low range.'
- 'Exception: when the candle carries a very large wick, use 0.5 of THAT WICK instead of 0.5 of the
  whole candle.'
- 'Switch trigger: price closing above 0.5 of a candle''s range is generally read as a reversal, after
  which 0.5 of that candle''s wick becomes the level in use.'
- Apply the previous completed candle's EQ to govern the current candle.
- Fractal across timeframes; he uses daily, 4-hour and hourly and declines the 5-minute.
- He allows price to trade slightly beyond the exact 0.5 of a wick rather than treating it as a hard
  line.
invalidation:
- Price closes through the EQ against the direction being held - the bias flips to the opposite extreme
  of the range.
measurable:
- hold rate of previous-candle EQ split by whole-range EQ vs wick EQ
- distribution of overshoot beyond 0.5 on reactions that still worked
