id: breaker-block
name: "Breaker Block"
aliases: ["breaker"]
category: structure
status: underspecified

definition: >
  Given as a one-sentence answer to a chat question and immediately qualified with the
  statement that he does not really use them. The construction: a low, then a high, then
  a lower low, then a higher high; take the range from the first low to the high and
  extend it forward. That extended zone is the breaker block.

timeframes:
  htf: []
  ltf: []
  fractal: true

preconditions:
  - "A four-point sequence exists: low, high, lower low, higher high (bullish orientation as described)."

detection_rules:
  - "Mark the first low."
  - "Mark the subsequent high."
  - "Confirm a lower low forms after that high."
  - "Confirm a higher high forms after the lower low."
  - "Take the range from the FIRST low to the high and extend it forward as the block."

invalidation:
  - "Not stated."

measurable:
  - "frequency of the four-point sequence per instrument"
  - "reaction rate when price returns to the extended zone"

sources:
  - video_id: wM1s7UivQ08
    title: "New York Open Live Q&A"

ambiguities:
  - "He states plainly that he does not use breaker blocks much, so this is a definition he supplied on request rather than part of his model - treat it as low-weight."
  - "Only the bullish orientation is described; the bearish mirror is not stated."
  - "No invalidation, entry trigger or target rule is given."
  - "Whether the range is taken from wicks or bodies is not stated."

python_detector: null
related: ["order-block", "opposing-candle"]
