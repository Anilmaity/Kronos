ambiguities:
- 'EVOLUTION, NOT CONTRADICTION: this is the earlier recording. The later rXMVPUZPw4A narrows the block
  to ''the lowest down close candle prior to the move that made the higher high''; this earlier video
  says the series between H1 and L1 without the lowest-candle qualifier. Both readings kept.'
- Whether the higher high / lower low must CLOSE beyond the prior extreme or may only wick beyond is not
  stated.
- '''Little wicks'' vs ''a large Wick and smaller body'' is a comparison, never a ratio.'
- The volume imbalance used as a second level in the first example is marked but not defined here.
