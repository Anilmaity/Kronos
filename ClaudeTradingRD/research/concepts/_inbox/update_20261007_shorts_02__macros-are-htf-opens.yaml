id: macros-are-htf-opens
name: Macros Are Just Higher-Timeframe Candle Opens
category: time
status: contested
voice: ttrades
definition: >
  SHORTS EVIDENCE (28-second clip) restating the existing position with no new mechanism. He calls
  macros "fake" and "my opinion", reduces them to arbitrary ranges drawn around the opens of new
  higher-timeframe candles (4-hour, hourly, 30-minute), and gives the single execution rule: he does
  not enter at 9:50, near the end of a 15-minute candle, but waits for the new candle to open.
detection_rules:
  - "Do not enter late inside a forming 15-minute candle (the stated example is 9:50); wait for the next candle open."
