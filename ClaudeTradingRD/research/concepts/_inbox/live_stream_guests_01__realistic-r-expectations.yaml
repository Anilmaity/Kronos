id: realistic-r-expectations
name: "Realistic R And Win-Rate Expectations"
aliases: ["strike rate", "58 to 65 percent", "win rate versus strike rate"]
category: risk
status: specified
voice: guest
guest_sources:
- "Trader T"
- "Ben (Ben TT)"

definition: >
  The numbers the guests give that the channel host does not. Trader T reports a strike rate on his
  2R strategy that hovers around 58 to 65 percent, averaging about 58, with good months near 80 and
  bad months at 45-55, and argues directly against the expectation of an 80-90 percent rate: he
  does not believe anyone sustains that, and with a high-frequency 2R strategy a 55-60 percent rate
  is enough for the arithmetic to work. Ben puts his win rate in the mid 60s and, more usefully,
  insists on separating WIN RATE from STRIKE RATE: because he scales in and moves the first
  position to break even, break-evens are not counted as losses in his win rate, so 60 percent of
  his trades not being losers does NOT mean he reaches his take-profit 60 percent of the time.

timeframes:
  htf: []
  ltf: []
  fractal: false

preconditions:
- "A fixed R target is in use, so the rate is comparable across trades."

detection_rules:
- "Report the rate together with the R multiple it was earned at - Trader T's 58-65 percent is specifically on a 2R target."
- "Expect month-to-month dispersion: he reports months of 20-25 percent return and months of 2-3 percent from the same system."
- "Ben's accounting rule: a break-even trade is neither a win nor a loss, so win rate over-states how often the target is actually reached; strike rate is the stricter measure."
- "Do not benchmark against 80-90 percent rates - Trader T states he knows nobody who sustains that."

invalidation:
- "Not applicable."

execution:
  bias: "Not applicable."
  entry: "Not applicable."
  stop: "Not applicable."
  targets: []

measurable:
- "strike rate at a fixed 2R over a stated sample, split by month, to reproduce the 45-80 percent dispersion"
- "the gap between win rate and strike rate once break-evens are separated out (Ben's distinction)"
- "monthly return distribution rather than an average"

sources:
- video_id: wCtxmWe4KNc
  title: "Back Testing Live Session With Trader T"
  quote: "it hovers around 58 to 65 percent"
- video_id: yRmKkR4CojU
  title: "Fractalizing Entries -Q&A with Ben - ICT Concepts"
  quote: "my win rate is teetering somewhere in like the mid 60s"

ambiguities:
- "Neither figure comes with a sample size, instrument set or period; both are self-reported in a live Q&A."
- "Trader T's figure blends simulated (replay) results with live prop-account results."
- "Ben declines on air to give his rate of return when asked to substantiate the presentation, pointing at his public timeline instead - so the mid-60s figure is unaudited by his own framing."
- "Neither says whether the rate is per trade or per trade idea (scaled entries counted once or several times)."

