ambiguities:
- 10:00 being a 4-hour boundary implies a 4-hour grid at 02:00 / 06:00 / 10:00 / 14:00 /
  18:00 / 22:00, but he never says so and never names the timezone.
- Whether the rule generalises off indices (he uses higher timeframes on currencies) is not
  stated.
- '"Behaving as an expansion candle" is judged live, with no threshold.'

