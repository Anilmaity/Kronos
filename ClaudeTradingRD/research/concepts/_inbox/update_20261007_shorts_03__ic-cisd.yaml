id: ic-cisd
name: Intracandle CISD (IC-CISD)
category: entry
status: contested
voice: ttrades
aliases:
- intra-candle CISD
definition: 'Worked Short on a bullish candle 3 after a candle 2 closure. The point of interest is the
  run of the lows; price instead runs the highs first and moves aggressively against the bias. He does
  NOT invalidate the bias because the move is not a reversal off the previous day high, and waits for
  a new continuation. The first candidate level looks like a consolidation and is ''really hard to trust'',
  so he requires another sweep; after it, an aggressive move out forms the continuation inside candle
  3, which he takes as the formed daily wick. Trade: long, stop on the low, target the daily high, 2R
  reached by a retest (limit) entry; it is not filled and that is accepted.'
timeframes:
  htf:
  - 1D
  ltf: []
  fractal: true
preconditions:
- A candle 2 closure exists and candle 3 is forming.
- A point of interest against the bias is defined (the lows to be run, bullish case).
detection_rules:
- A run of the opposite-side highs first does not invalidate a bullish bias unless it is a reversal off
  the previous day high.
- If the first candidate intracandle swing is consolidation-like, do not trust it - require another sweep.
- Accept the IC-CISD only after the sweep is followed by an aggressive move out.
- Treat that continuation as the formed daily wick and trade the body in the bias direction.
invalidation:
- A reversal off the previous day high (bullish case) - stated as the condition that would invalidate
  the bias.
- 'Entry not filled on the retest: no trade.'
execution:
  bias: Candle 3 direction (bullish in the example).
  entry: Retest (limit) entry chosen so the trade offers 2R.
  stop: On the low of the intracandle continuation.
  targets:
  - The daily high (previous candle high).
measurable:
- share of candle-3 IC-CISD setups where the first candidate swing was consolidation-like and a second
  sweep was required
- fill rate of retest entries priced for 2R
