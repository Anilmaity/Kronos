id: displacement
name: Displacement
aliases:
- aggressive move
- displacement candle
category: structure
status: underspecified
definition: An aggressive move made of full-bodied candles — one candle or several — that closes over
  or below structure. The stated way to spot it is to look for the fair value gap it leaves behind;
  on a higher timeframe the same move resolves into a single candle.
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
detection_rules:
- One or more consecutive full-bodied candles in the same direction.
- The move closes over/below the structural level in question.
- A fair value gap is present inside the move (his stated identification shortcut).
invalidation:
- Price extends past the level but closes back inside — a failure to displace.
measurable:
- proportion of structure breaks that carry an FVG inside the breaking leg
sources:
- video_id: _94CPMjWi9E
  title: Market Structure Shift
  quote: displacement is an aggressive move with full-bodied candles
- video_id: _94CPMjWi9E
  title: Market Structure Shift
  quote: the easiest way to spot it is just looking for fair value gaps
- video_id: ynFA6E3qHj0
  title: Market Structure Shift vs Liquidity Grab
  quote: displacement is a large aggressive move it can be single or multiple candles
ambiguities:
- '''Full-bodied'' and ''aggressive'' carry no threshold; the FVG heuristic is offered as a proxy but
  not as the definition.'
- Whether an FVG is required or merely usually present is not stated.
