ambiguities:
- Both Shorts are excerpts of SF61vCsBl1A, which the library already cites for fractal-model-c4. They add no new rule.
- '"Shallow wick" is not quantified. The EQ of candle 3 is its 0.5 level, which matches the library''s rule that candle 4 should respect the relevant half of candle 3. The Shorts do not state that rule themselves.'
- No stop or target is given for the candle 4 trade.
