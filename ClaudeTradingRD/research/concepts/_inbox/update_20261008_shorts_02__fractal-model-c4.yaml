id: fractal-model-c4
name: Candle 4 (second continuation candle)
category: model
status: contested
voice: ttrades
definition: >
  Both Shorts answer when it is ideal to trade candle 4. It becomes ideal after a candle 3
  closure that completes an ideal formation, meaning it closes over the opposing-candle series
  and forms a protected swing, in a sequence where the candle 2 closure itself was not ideal.
  Candle 4 is then traded in the direction of the closure. In the first example its wick is
  shallow, near the EQ of the previous candle, and it trades higher.
timeframes:
  htf: []
  ltf: []
  fractal: true
preconditions:
- A candle 2 closure exists (here a non-ideal one) and candle 3 has followed it.
detection_rules:
- Require a candle 3 closure that forms a protected swing by closing over the series of opposing candles. In the first example it also closes over candle 2's high.
- Mark the EQ of candle 3; look for candle 4's wick to form there and stay shallow.
- Trade candle 4 in the direction of the candle 3 closure.
invalidation:
- With only a non-ideal candle 2 and no such candle 3 closure, candle 4 is not ideal to trade.
execution:
  bias: Direction of the candle 3 closure (bullish in both examples).
  entry: In candle 4, after a shallow wick near the candle 3 EQ.
measurable:
- expectancy of candle 4 continuations after an ideal C3 that followed a non-ideal C2
