id: realistic-r-expectations
name: "Realistic R and Win-Rate Expectations"
aliases: ["2R is plenty", "no one has a 100 percent win rate"]
category: risk
status: specified

definition: >
  His stated performance frame: 2R is the normal target and is enough; at 2R a win rate above 50%
  is good. Large-R screenshots (his example, 17R) are neither realistic nor sustainable, and a
  trader consistently shooting for 10R must have a low win rate by arithmetic. Claims of 90% or
  100% win rates are dismissed: with a genuine 100% win rate you would bet everything on every
  trade. He takes roughly one or two trades a week and expects a mechanical model to miss moves.

timeframes:
  htf: []
  ltf: []
  fractal: false

preconditions:
  - "A defined entry with a defined stop, so R is computable."

detection_rules:
  - "Set the default target at 2R."
  - "Evaluate the model over a sample: above 50% win rate at 2R is acceptable performance."
  - "Treat any claimed win rate near 100% as implausible."
  - "Accept that a mechanical model will miss valid moves; do not widen rules to catch them."

invalidation: []

execution:
  bias: "Not applicable."
  entry: "Not applicable."
  stop: "Defines the R unit."
  targets: ["2R as the default"]

measurable:
  - "win rate at a fixed 2R target over a sample"
  - "trades per week"

sources:
  - video_id: egV_gABTQks
    title: "(CPI) New York Open Live Q&A"
  - video_id: uzPGXVYpVGc
    title: "Candle 2 Confirmations - Live Lesson, Q&A"

ambiguities:
  - "Sample size for evaluating the win rate is never specified."
  - "He also references 3R to 5R targets on specific examples without reconciling them with the 2R default."

python_detector: null
related: ["breakeven-after-new-protected-swing", "root-cause-diagnosis", "three-entry-quality-criteria"]
