id: futures-trading-hours
name: Futures Trading Hours (18:00 to 17:00, Sunday to Friday)
definition: 'The session envelope he states for futures: they run from 6:00 p.m. to 5:00 p.m., Sunday
  through Friday, with no futures trading on Saturday. This is the outer clock inside which every
  other time level in the corpus (18:00, midnight, 08:30, 09:30) sits.'
category: time
status: specified
aliases:
- futures hours
- 6pm to 5pm
- Sunday to Friday
preconditions:
- Instrument is a futures contract.
detection_rules:
- Session runs 18:00 to 17:00 the following day.
- Sessions exist Sunday through Friday; there is no Saturday session.
- A one-hour daily break separates the 17:00 close from the 18:00 open.
invalidation:
- Not applicable.
measurable:
- bar-count sanity check on a continuous futures series against the stated envelope
sources:
- video_id: dtsrR8dX2Ro
  title: Intro To Futures Trading & Prop Firms
  quote: Futures run from 6:00 p.m. to 5:00 p.m.
- video_id: dtsrR8dX2Ro
  title: Intro To Futures Trading & Prop Firms
  quote: there is no Futures Trading on Saturday
ambiguities:
- No timezone is spoken; the rest of the corpus fixes bare clock times to New York, and 18:00 New
  York is the daily open used elsewhere.
- He explicitly defers the detail ('I would suggest Googling that as well'), so holiday and early-close
  handling is out of scope.
- No distinction is drawn between the electronic session and any regular-trading-hours sub-session
  here; that appears in the chart-data settings instead.
