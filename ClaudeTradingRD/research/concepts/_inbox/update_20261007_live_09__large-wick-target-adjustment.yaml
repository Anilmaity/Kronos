id: large-wick-target-adjustment
name: Large Wick - Adjust Targets, Do Not Expect Expansion
category: risk
status: contested
definition: 'Applied three times in the stream. Pre-open: a larger opposing run (EQ not respected) means
  the day is not set up for expansion, so targets are the daily open, the overnight lows or intraday liquidity,
  and then potentially the previous day high. On the 15-minute C2 at 9:45: a large wick means he does
  not enter on that C2; the targets are the daily open and intracandle highs, and he expects a retracement
  with the following candle doing the expansion. On CL hourly: a large wick gives targets of daily open,
  intraday lows, then previous day low.'
preconditions:
- The candle being traded away from has a large wick / large opposing run.
detection_rules:
- Do not enter on the large-wick C2 itself; expect a retracement and look to the following candle for
  expansion.
- 'Target ladder: daily open, then intraday / overnight session liquidity, then the previous day high
  (or low).'
invalidation:
- Not applicable - a target-setting rule.
measurable:
- hit rate of daily open vs intraday liquidity vs previous-day extreme after a large-wick C2
sources:
- video_id: Hlwq1dRjBZo
  title: New York Open Live Q&A
  quote: Go back to the daily open, the overnight lows or the intraday liquidity
- video_id: Hlwq1dRjBZo
  title: New York Open Live Q&A
  quote: Would it be ideal to enter on the 15-minut C2? No
- video_id: Hlwq1dRjBZo
  title: New York Open Live Q&A
  quote: Daily open, intraday lows, and then previous day low
ambiguities:
- '''Large'' wick is not quantified here.'
- Whether the previous-day extreme is a standard third target or a stretch target ('potentially') is unclear.
