id: relevant-swing-separation
name: Relevant Swings Require Separation
category: structure
status: contested
voice: ttrades
definition: 'Gold example: price hit a low that had no separation from the adjacent low; it was a valid
  target for a short, but not relevant for framing a long off a failure swing. Being short into a level
  as a target is different from using that level to frame a reversal.'
detection_rules:
- A level without separation may serve as a target but not as the swing to frame a reversal from.
sources:
- video_id: uW55Tuk-ngY
  title: New York Open Live Q&A
  quote: Is that relevant? No, cuz there's no separation to this one.
ambiguities:
- Separation still not quantified.
