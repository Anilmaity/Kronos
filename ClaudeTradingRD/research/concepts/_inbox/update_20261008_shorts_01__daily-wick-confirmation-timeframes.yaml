id: daily-wick-confirmation-timeframes
name: 'Confirming The Day''s High Or Low: Which Timeframe, By Session'
category: time
status: contested
voice: ttrades
definition: >
  MrNfRoNeL1I (a clip of Mo9QMtotQyo) walks the stacked confirmation. With a daily candle 2 closure
  and a CISD, the question is "has the daily wick formed?". Working into London, price reaches into a
  fair value gap. He waits for an hourly change in the state of delivery, gets the close through, and
  answers yes. He can then get on side on that timeframe. Once the 06:00 4-hour candle has opened, he
  checks it too. It is a 4-hour candle 2 closure, so the trade can also be taken on the 15-minute.
  He expects the area to hold, and price then expands lower.
detection_rules:
- Ask whether the daily wick has formed once price reaches the point of interest.
- Confirm it with an hourly CISD, a 4-hour candle 2 closure, or both together.
- With the 4-hour candle 2 closure, execute on the 15-minute.
