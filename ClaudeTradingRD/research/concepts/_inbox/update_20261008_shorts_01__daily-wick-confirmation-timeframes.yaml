ambiguities:
- No new content; the library already has the 'both checked off' state (hourly CISD plus 4-hour
  closure) from Mo9QMtotQyo.
- The Short leaves out the sentence before it in Mo9QMtotQyo, which says not to use hourly candle
  2 closures this early in the day.
- Inference, not stated in the Short - a 4-hour candle opening at 06:00 implies the futures grid
  (02/06/10/14 NY), not the forex grid the vault locks for gold. The asset is not named.
