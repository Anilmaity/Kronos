id: cisd
name: Change In State Of Delivery (CISD)
aliases:
- change in the state of delivery
- closure through the series of down close candles
- closure through that level
category: entry
status: contested
definition: 'In this unit the CISD is used throughout in its dominant corpus form: locate the extreme,
  locate the series of down-close (bullish case) or up-close (bearish case) candles that made it,
  and require price to close back through that level. Three things are added. First, and directly
  contradicting a Q&A statement recorded elsewhere in the library, he says he will use a SINGLE candle
  when the structure only contains one. Second, a selection rule for the series: a candle that does
  not itself form a swing is generally skipped, and the candle beyond it is used instead. Third, speed
  is promoted from a quality preference to a validity condition - a closure that arrives only after
  a slow grind is not a CISD at all but a sweep of a consolidation high. He also accepts an inversion
  as a substitute for the CISD when the candle range is extremely large. This video does NOT state
  which price the close must be measured against.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- Price has reached a point of interest - a fair value gap, a swept low or high.
- A series (or, per this video, a single candle) of opposing-close candles made the extreme.
detection_rules:
- Locate the extreme the reversal turned on.
- Locate the run of down-close candles that made the low (or up-close candles that made the high).
- Skip a candidate candle that does not itself form a swing; use the adjacent one that does.
- A single candle is acceptable as the run when the structure contains no more than one (stated explicitly
  in this video).
- Require price to close back through that level.
- 'Speed condition: the closure must arrive within roughly 1 to 3 candles of the reach into the level;
  a slow grind back is a consolidation, and the eventual closure is a sweep of the consolidation high
  rather than a CISD.'
- An inversion may substitute for the CISD when the candle range is extremely large.
- The CISD is only trusted when it is not simultaneously taking out a short-term high/low and not
  at an already-hit higher-timeframe objective (see the two continuation-failure entries).
invalidation:
- Price fails to close through the level and falls back inside the prior range - the phase is consolidation,
  not retracement.
- The closure through arrives only after a failed attempt plus consolidation around the level.
measurable:
- candle count from level-tag to close-through, split by outcome
- outcome difference between single-candle and multi-candle series
