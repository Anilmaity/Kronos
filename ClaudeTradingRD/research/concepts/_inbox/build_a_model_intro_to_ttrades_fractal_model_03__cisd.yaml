ambiguities:
- THIS VIDEO DOES NOT ADJUDICATE THE LEVEL. The library holds two incompatible readings - close through
  the series' extreme, versus close through the OPEN of the first candle of the run - and this video
  says only 'close over the series of down close candles' throughout, never naming the price. The
  disagreement survives.
- 'It DOES adjudicate the series-length question, and against the library''s current majority: here
  a single candle is explicitly acceptable when the structure has only one, whereas a Sunday-session
  answer says he never selects one candle and always uses a series. Both are his; this is the dedicated
  model video.'
- '''Doesn''t form a swing'' is not defined here; the three-bar definition from the relevant-swings
  video is the only candidate test and he does not say it is the one meant.'
- Body close versus wick through is never stated.
- The auto-captions render 'down close' as 'downclo', 'downclosed', 'downcloed' and 'downlosed' in
  this transcript.
