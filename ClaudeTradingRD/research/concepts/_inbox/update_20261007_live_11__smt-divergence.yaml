id: smt-divergence
name: "SMT Divergence"
aliases: ["three minute SMT with silver", "one minute SMT"]
category: liquidity
status: contested
voice: ttrades
definition: >
  A timeframe-trust limit stated in his own voice: he does not trust a 3-minute SMT between
  gold and silver, and is not a fan of using a 1-minute SMT to frame a whole idea. On the gold
  invalidation day he used a small SMT off a swing (timeframe not marked on screen) as the
  reason for expecting the move lower, while a 1-minute silver SMT that was present was
  acknowledged but not relied on.
timeframes:
  htf: ["1H", "5m"]
  ltf: ["3m", "1m"]
  fractal: true
detection_rules:
  - "Do not use a 3m gold/silver SMT as a framing input."
  - "Do not use a 1m SMT to frame the idea; at most as minor confluence inside an existing framework."
measurable:
  - "Reversal follow-through of gold/silver SMT on 1m and 3m vs 5m and above."
sources:
  - video_id: KBJAGgkXdeI
    title: "New York Open Live Q&A"
    quote: "I don't really like to trust the three minute SMT with silver."
  - video_id: KBJAGgkXdeI
    title: "New York Open Live Q&A"
    quote: "not a huge fan of SMT on the one minute to frame the whole idea"
ambiguities:
  - "No lowest trusted timeframe is stated; only 3m (with silver) and 1m are excluded."
  - "Elsewhere in the library he names gold-in-euro/pound rather than silver as gold's correlate; here he reads silver anyway."
python_detector: null
related: ["smt-requires-framework", "gold-correlated-assets"]
