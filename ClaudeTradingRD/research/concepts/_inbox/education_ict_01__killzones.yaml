ambiguities:
- PARTIAL ANSWER TO THE LIBRARY'S 'SESSION HOURS' GAP. 8:30 and 9:30 are given as the New York morning
  session's start and its next marker, but NO END TIME is stated and NO TIMEZONE is named in any video
  in this unit. The library's existing entry (from MPeeE55rNOw) gives full windows; this unit is consistent
  with its INDICES New York AM 08:30-11:00 but does not independently establish it.
- '''Which kill zones you enter in'' is framed as a per-trader choice, so the gate is configurable rather
  than fixed.'
- No hours at all are given for Asia, London or London close in this unit.
