id: killzones
name: Killzones (Trading Sessions)
aliases:
- kill zones
- New York morning session
- the news embargo lifts
category: time
status: contested
definition: 'EARLIER RECORDINGS. Two things this unit adds to the library''s killzone entry. First, the
  kill zone is stated as a REQUIRED CONFIGURATION CHOICE of any entry model - deciding which kill zones
  you enter in comes second only to deciding the execution timeframe, and models are hunted only inside
  them; his own choice is stated as the New York open. Second, the only explicit clock reading in the
  unit: the New York morning session is described as starting at 8:30 and then running into 9:30, with
  8:30 also identified as the moment ''the news embargo lifts'' that separates London price action from
  New York''s.'
timeframes:
  htf:
  - 1D
  ltf:
  - 15m
  - 5m
  - 1m
  - 15s
  fractal: false
preconditions:
- Chart timezone configured (not stated in these videos).
detection_rules:
- Choose the execution timeframe first, then choose which kill zone(s) the model is hunted in.
- Search for the entry model only inside the chosen kill zone.
- 'New York morning session: 8:30 start, running into 9:30.'
- 8:30 is the news-embargo boundary; price action before it (London) is treated as a different regime.
- 'His own stated choice: 1-minute / 15-second execution during the New York open.'
invalidation:
- Not applicable - a time window either contains the bar or it does not.
measurable:
- hit rate of the same entry model inside vs outside the chosen kill zone
- share of the day's range formed between 8:30 and 9:30
