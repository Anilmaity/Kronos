id: realistic-r-expectations
name: Realistic R and Win-Rate Expectations
category: risk
status: contested
voice: ttrades
definition: 'On negative risk-to-reward: it can work for some and is not terrible for prop firms if the
  math is understood (higher win rate, smoother curve), but he rejects it for himself - needing ~80% wins
  to break even is too much pressure. He prefers a structure that breaks even at ~40% wins, so 60-70%
  is doing well; he usually trades below 5R (about 3R the previous day); higher R mechanically means a
  lower win rate; nobody has a 100% win rate.'
