id: smt-break-reversal-trigger
name: A Broken SMT As The Reversal Trigger
aliases:
- when SMT breaks
- the lagging asset catches up
category: liquidity
status: underspecified
voice: guest
guest_sources:
- GxTradez
definition: 'GxTradez treats the FAILURE of an SMT as a signal in its own right. When one asset of a
  triad clearly fails to manipulate a level that the others reached, he expects one or both assets to
  catch up; the moment the weakest / lagging asset catches up and BREAKS the SMT, markets can reverse.
  He identifies two arrangements: the middle asset breaks the SMT while the third and weakest diverges
  at that high (the higher-probability version), or all markets break the SMT and the lagging asset
  is the trigger.'
timeframes:
  htf:
  - 1W
  - 1D
  - 4H
  ltf:
  - 30m
  fractal: true
preconditions:
- A triad is marked at a common high/low.
- At least one asset has clearly failed to manipulate that level.
detection_rules:
- Mark the same high/low across all three correlated assets.
- Identify the asset that failed to reach it — an SMT is present.
- Wait for that asset (or the middle one) to catch up and trade through the level, breaking the SMT.
- That break is the reversal trigger; the same sequence is checked across weekly, daily and 4-hour.
invalidation:
- The SMT resolves by expansion away instead of the lagging asset catching up.
measurable:
- reversal rate following an SMT break, by which asset breaks it
sources:
- video_id: 3eVxTV_7L2U
  title: A Complete Trading Framework (Universal Models, SMT, Swing Points) | GXT
  quote: once the weakest asset actually catches up to that SMT and breaks it
ambiguities:
- '''Clearly failed to manipulate'' has no distance threshold.'
- He explicitly defers the mechanics to his own external SMT video, so the failure taxonomy is not reproduced
  here.
- No time limit on how long the lagging asset may take to catch up.
