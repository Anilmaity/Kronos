id: intermediate-term-swing-formation
name: An Intermediate-Term Low Or High Forms Two Ways
aliases:
- intermediate term low
- intermediate term high
category: structure
status: specified
definition: 'When no low is available to be swept, he falls back on advanced market structure: the
  thing he is actually waiting for is an intermediate-term low or high, and that forms in one of
  exactly two ways - by sweeping out a low (or high), or by reaching into a fair value gap. In the
  second case the up-close candle before the move into the fair value gap, once closed over, is used
  as the level to trade higher. He states plainly that this second construction is not a real breaker,
  and keeps it only because he finds that it works.'
timeframes:
  htf:
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- A directional read is already in place; a short-term low has formed.
detection_rules:
- 'Route 1: a prior low is swept -> the resulting low is an intermediate-term low.'
- 'Route 2: price reaches into a fair value gap -> the low made there is an intermediate-term low.'
- In route 2 the tradeable level is the up-close candle (or series) immediately before the move into
  the fair value gap, once price closes over it.
- Mirror for intermediate-term highs.
- He describes the underlying sequence as a short-term low, a sweep of it, and then another short-term
  low, which together form the intermediate-term low.
invalidation:
- Price trading back below the intermediate-term low (bullish case).
measurable:
- relative frequency of route 1 vs route 2 formations
- continuation hit rate conditional on which route formed the swing
sources:
- video_id: xP-o11jRCyg
  title: Trade Continuations Using Breaker Blocks
  quote: we are looking for an intermediate term low or high
- video_id: xP-o11jRCyg
  title: Trade Continuations Using Breaker Blocks
  quote: a breaker and it really isn't but I do find that it works
ambiguities:
- The full advanced-market-structure labelling scheme is referred to a separate video and is not
  restated here.
- '''Reaching into a fair value gap'' is not quantified - near edge, consequent encroachment or full
  fill are not distinguished.'
- The short-term / intermediate-term / long-term hierarchy is used without definitions in this unit.
