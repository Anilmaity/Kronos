ambiguities:
- The anchor is described twice in different words ('the leg that made the low before the high', 'the
  breaker formation as well'); which endpoint the projection is anchored FROM (the high or the low)
  is shown on charts but never stated in words.
- Sign convention flips between examples (-1/-2/-4 for downside, 4/4.5 for upside in hKCMqh0ZsY0); the
  magnitude is what matters.
- Substituting a failure swing for the manipulation leg is done 'in this case', with no rule for when.
- No rule orders the -2/-2.5 band against a competing structural target.
