id: no-shorting-below-lows
name: Do Not Short Below Lows (trade back into the range instead)
definition: 'Restated twice under live questioning as the reason for declining an otherwise valid-looking
  short. Once price is already trading below the lows that were the targets, and a decent part of
  the daily range has been spent, there is no drawn liquidity left below to trade toward, so it is
  not a place to be looking short. The same logic is given for gold making a new low late in the day:
  rather than sell below the lows he waits for a new day with a new candle and fresh expansion potential.'
category: entry
status: specified
preconditions:
- The identified target lows have already been taken.
detection_rules:
- Check whether price is already below the drawn target lows.
- Check how much of the daily range has already been covered.
- If both, do not enter short - there is no remaining drawn liquidity to trade toward.
- Wait for a new session with a new candle rather than chasing.
measurable:
- expectancy of shorts entered below the day's target lows vs above them
sources:
- video_id: xraklBJHW5k
  title: New York Open Live Q&A
  quote: This is not where it makes sense to be looking short
- video_id: yNgx9OAefuI
  title: New York Open Live Q&A
  quote: I'm not personally a fan of trying to trade below the lows
ambiguities:
- How far below the lows the rule starts to bite is not quantified; both examples were visually obvious.
- The mirror-image case (do not buy above the highs) is implied by the daily-range argument but is
  not stated in these streams.
