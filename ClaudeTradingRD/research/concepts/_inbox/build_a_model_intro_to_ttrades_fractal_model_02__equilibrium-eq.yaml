ambiguities:
- Range-based EQ and body-based EQ are both used in this unit ('the upper half of this from body to
  body') without a selection rule.
- Which candle is 'the previous candle' for the invalidation test depends on the aligned timeframe,
  which is not pinned down.
- He explicitly says an EQ break is not deterministic and offers a counter-example, but gives no filter
  to separate the cases.
