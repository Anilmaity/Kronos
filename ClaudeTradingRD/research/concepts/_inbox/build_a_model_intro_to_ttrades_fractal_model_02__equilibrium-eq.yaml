id: equilibrium-eq
name: Equilibrium / 50% Level (EQ)
category: entry
status: specified
aliases:
- EQ
- the 50% level
- T-spot overlap
definition: 'The 50% of a reference candle''s range, used in this unit for three distinct jobs. (1)
  CANDLE 4 FILTER: for a bullish continuation the candle 4 wick must form in the upper half of candle
  3''s range (lower half for bearish), because expansions do not give deep retracements. (2) INVALIDATION:
  a close beyond the EQ of the previous candle on the aligned timeframe is one of only two conditions
  under which he will trade against his own bias. (3) TARGET: on a large-wick reversal candle the EQ
  of the previous candle is the target, in place of expansion targets. He is careful that (2) is probabilistic
  -- an EQ break makes expansion unlikely, it does not guarantee reversal.'
timeframes:
  htf:
  - 1M
  - 1D
  - 4H
  - 1H
  ltf:
  - 30m
  - 15m
  - 5m
  fractal: true
preconditions:
- A reference candle whose range is being halved (usually candle 3, or the previous candle).
detection_rules:
- Mark 0.5 of the reference candle's range.
- 'Continuation filter: the next candle''s counter-directional wick must stay in the upper half (bullish)
  / lower half (bearish).'
- 'Invalidation: a close beyond the EQ on the aligned lower timeframe, with no continuation formed in
  the original direction, flips the read.'
- 'Target: on a large-wick candle, use the EQ of the previous candle (plus the daily open and session
  extremes) instead of expansion targets.'
- 'Stop-placement reference: a low that sits below the EQ of the previous candle is a defensible stop
  location.'
- The EQ frequently overlaps the opposing-candle opening price; the overlap band is what he wants respected.
invalidation:
- Price closes beyond the EQ -- 'once price reaches beyond that EQ, it's not a small wick anymore mechanically'.
measurable:
- respect rate of the EQ of candle 3 by candle 4's wick
- forward return after an EQ close-through vs an EQ hold
sources:
