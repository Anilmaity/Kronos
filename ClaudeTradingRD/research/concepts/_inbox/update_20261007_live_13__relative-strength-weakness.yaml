id: relative-strength-weakness
name: "Relative Strength & Weakness (ES / NQ / YM)"
category: structure
status: contested
voice: ttrades
definition: >
  Live reading for a bearish day: the weakest index is the one with the most expansion beyond
  its previous day low (NQ); an index that has already hit its target and is consolidating is
  called the stronger one (YM). The ranking flipped twice in the session: once NQ hit its
  target it became the stronger and YM the weakest, so he would no longer short NQ. He says
  relative strength is hard to explain mechanically and promises a dedicated video.
detection_rules:
  - "Short case: weakest = the asset with the largest expansion beyond its previous day low."
  - "An asset that has reached its target and is consolidating is re-labelled the stronger asset."
  - "After the weakest asset hits its target, re-rank; the former weakest may become strongest."
measurable:
  - "frequency of ranking flips immediately after the weakest asset tags its target"
sources:
  - video_id: wa9m30UHrm0
    title: "New York Open Live Q&A"
    quote: "It has the most expansion, right? Especially beyond its previous day low."
  - video_id: wa9m30UHrm0
    title: "New York Open Live Q&A"
    quote: "Already expanded so it's consolidating or becoming the stronger asset while NQ catches up."
  - video_id: wa9m30UHrm0
    title: "New York Open Live Q&A"
    quote: "Because here NQ is weakest, it hits its target, and then YM becomes the weakest."
ambiguities:
  - "He admits it is 'a hard concept to try to conceptualize and explain mechanically'; no numeric measure is given."
  - "'Stronger' for a consolidating asset after a down move conflicts with the separation reading (closest to the target = weakest)."
related: ["cross-asset-target-transfer", "failure-to-manipulate"]
