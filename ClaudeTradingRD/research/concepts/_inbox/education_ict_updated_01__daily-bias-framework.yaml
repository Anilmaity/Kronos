ambiguities:
- '''Displace out of this range'' vs ''close outside'' are used interchangeably; the operative test
  in every example is the CLOSE.'
- The noise claim as timeframes drop is stated but never quantified or bounded (he still uses the 1-minute
  for execution).
- When both a previous-candle level and a left-hand swing point conflict, no precedence is given — he
  lists both and waits.
