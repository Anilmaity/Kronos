id: daily-bias-framework
name: Previous Candle High / Low Bias (intraday and daily)
aliases:
- intraday bias
- previous candle's high and low
category: model
status: specified
definition: The same previous-candle test applied continuously as a draw-on-liquidity engine rather
  than as a single call. Unless price consolidates forever it must reach for the previous candle's high
  or the previous candle's low; direction of travel picks which. If price reaches one side and cannot
  displace/close outside, a reversal is framed and the OTHER side becomes the next draw. He runs this
  candle-by-candle on the 4-hour, and says the same procedure works on 1-hour, 30-minute and 15-minute
  but gets noisier the lower you go. When the read becomes range-bound he marks the range high and low
  and waits for one of those instead.
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 1H
  - 30m
  - 15m
  - 1m
  fractal: true
detection_rules:
- Mark the previous candle's high and low on the working timeframe.
- Direction of travel picks the more likely side to be taken first.
- Side taken + close OUTSIDE -> continue; expect the same side of the next candle to be taken.
- Side taken + close back INSIDE -> reversal; the opposite side becomes the draw.
- Both sides taken in one candle -> no bias; let another candle print.
- Inside bar -> no information; default to trend continuation.
- 'Range-bound stretches: mark the range high/low and wait for price to reach one of them.'
- Confirm the resulting draw on lower timeframes before executing.
invalidation:
- He shows it being wrong twice inside one worked example and simply re-reads the next close.
execution:
  bias: The previous candle's untaken side.
  entry: 'Down one or two timeframes: an open-low-high-close shape for a bullish higher-timeframe candle,
    then an order block / fair value gap at the low.'
  stop: Below the mean threshold of the order block being used (so price can revisit the block without
    stopping you out).
  targets:
  - The previous higher-timeframe candle's high/low
  - Minimum 2R
measurable:
- accuracy of the previous-candle draw by timeframe (4H vs 1H vs 15m) — he asserts degradation but gives
  no numbers
- frequency of both-sides-taken (no-bias) candles
