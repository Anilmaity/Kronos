id: strat-vs-ict-objectivity-tradeoff
name: Why He Left ICT For TheSTRAT (objectivity and position count)
aliases:
- less thinking
- objectiveness
category: psychology
status: specified
definition: 'The guest states plainly that he traded ICT alongside TheSTRAT, mostly on futures, and
  moved to TheSTRAT for one stated reason: objectivity at scale. ICT works well when you are focused
  on one or two instruments and can dial in every timeframe and reason about the draw on liquidity,
  but he runs scans and may hold seven to eight positions in a day, and that becomes hectic. TheSTRAT
  lets him ''think a little bit less''. He also states he stopped using order blocks specifically because
  they can be run through and he would rather be stopped out and take the trade back the other way than
  be wrong slowly; and that combining STRAT and ICT confused him. The two methods also aim at different
  things: ICT trades the range, TheSTRAT tries to build a position and hold it.'
timeframes:
  htf: []
  ltf: []
  fractal: false
preconditions: []
detection_rules:
- If the workflow is scan-driven and multi-position, prefer rules decidable from candle relationships
  alone.
- Do not run STRAT signals and ICT PD-array reasoning on the same trade decision - the guest reports
  this produced confusion.
- Prefer a stop-out and immediate reverse over defending a level that can be traded through.
invalidation: []
measurable:
- number of concurrent positions manageable per method
- decision latency per setup
