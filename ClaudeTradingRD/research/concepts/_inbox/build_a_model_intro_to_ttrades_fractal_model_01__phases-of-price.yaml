id: phases-of-price
name: Phases of Price Delivery
category: structure
status: specified
aliases:
- phases of price
- the four phases
- large range to small range
definition: 'Price is always in one of four phases and the phases cycle: consolidation, expansion,
  retracement, reversal. The organising principle stated in the series is that the market alternates
  large ranges with small ranges. Expansion (large range) is followed by either a retracement or
  a consolidation (small range), which is followed by a new expansion; a reversal is the one case
  where expansion is followed immediately by expansion in the opposite direction. Each phase carries
  a different instruction: in a consolidation you wait for one side of the range to be manipulated;
  in a retracement you wait for a protected swing to form at a PD array; in an expansion you trade
  continuations off opposing candles; at a reversal you trade away from the swept extreme. This is
  a five-part series and the fifth part (blending the phases) is not in this unit.'
timeframes:
  htf:
  - 1M
  - 1W
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  - 5m
  - 3m
  - 1m
  fractal: true
preconditions:
- A directional bias exists; the phases are read underneath it.
detection_rules:
- 'Consolidation: price remains internal to a marked high and low (no close outside either).'
- 'Expansion: a one-sided trending move - large range with only shallow moves against it.'
- 'Retracement: a slow, shallow move opposing the trend, generally into a fair value gap, taking
  materially more bars than the expansion leg it retraces.'
- 'Reversal: expansion into a level met immediately by expansion in the opposite direction.'
- After an expansion, expect a small range next (retracement or consolidation); after a small range,
  expect a large range next.
- Three days of expansion (or two very large ones) is the point at which a new phase is anticipated
  rather than a further continuation.
invalidation:
- The phase call is provisional until a candle closes; the video repeatedly says to let another candle
  print when the current one is ambiguous.
measurable:
- frequency of each phase label by timeframe
- conditional probability of expansion given the previous bar-set was labelled consolidation vs retracement
- hit rate of the 'three days of expansion then a new phase' rule
sources:
- video_id: WFqLwOp2pXw
  title: How To Trade Consolidation - Phases Of Price
  quote: price moves from large ranges to small ranges
- video_id: 4Gm8p6O7Ebs
  title: How To Trade Expansion - Phases Of Price
  quote: I expect expansion to occur after a consolidation or after a retracement
- video_id: F0G31iLVpVg
  title: How To Trade Retracement - Phases Of Price
  quote: Expansion is aggressive, fast and large range. Retracement is slow and shallow
- video_id: VD4xb9VfMHA
  title: How To Trade Reversal - Phases Of Price
  quote: A reversal is when we have expansion met with expansion
ambiguities:
- '''Large range'' vs ''small range'' is never quantified - it is judged against the immediately
  preceding leg, not against an ATR or a fixed lookback.'
- The phases are labelled after the fact in every worked example; no rule is given for how many bars
  must elapse before a label is committed.
- Consolidation and retracement are treated as interchangeable for the purpose of 'a small range
  follows a large range', yet they carry different trade instructions.
