id: single-pd-array-mastery
name: Pick One PD Array, Plus Highs And Lows
aliases:
- choosing a PD array
- focus on less and master that
category: psychology
status: specified
definition: 'His diagnosis of why people fail with ICT: not a lack of knowledge or understanding,
  but an inability to filter the concepts down to one. The prescription is a selection procedure
  and a constraint. Selection: ask which PD array is easiest for YOU to see on the chart, which makes
  the most sense to you, and how much confirmation you need. Constraint: use that single PD array
  in combination with highs and lows - liquidity is mandatory alongside whatever array is chosen
  - and stop jumping to new things after a rough patch. He states his own answer plainly: highs,
  lows, and opposing candles / the change in the state of delivery, and nothing else.'
timeframes:
  htf: []
  ltf: []
  fractal: false
preconditions:
- The trader already understands the individual PD arrays.
detection_rules:
- 'Enumerate the candidate PD arrays: fair value gap, inversion, breaker block, order block, change
  in the state of delivery, OTE / Fibonacci.'
- 'Select exactly one, using three questions: which is easiest to see, which makes the most sense,
  how much confirmation is wanted.'
- Pair it with highs and lows / liquidity - this is stated as mandatory, not optional.
- Ignore the remaining arrays even when they are visible on the chart.
- Do not switch arrays after a losing stretch.
- 'Test of a good model: entry, stop and data collection are repeatable because they are always derived
  the same way.'
invalidation:
- Not applicable - this is a process rule, not a chart pattern.
measurable:
- variance of entry-location definition across a trade sample (the thing he says single-array focus
  fixes)
- journal completeness / comparability before and after restricting to one array
sources:
- video_id: r_UF8U-hsL8
  title: Why You're Failing with ICT Concepts
  quote: It's just the inability to filter through the concepts and focus on one
- video_id: r_UF8U-hsL8
  title: Why You're Failing with ICT Concepts
  quote: find a PDA that suits you. Forget the rest.
- video_id: r_UF8U-hsL8
  title: Why You're Failing with ICT Concepts
  quote: use highs and lows or liquidity in combination with the selected PDA
- video_id: r_UF8U-hsL8
  title: Why You're Failing with ICT Concepts
  quote: I use highs, lows, and opposing candles or the change in the state of delivery
ambiguities:
- The selection criteria are subjective by design ('which is easiest for you to see'), so the rule
  cannot be applied mechanically.
- How much confirmation to require maps onto the order-of-reversal ladder but he does not make that
  mapping explicit.
- No guidance is given on when, if ever, a chosen array should be abandoned.
