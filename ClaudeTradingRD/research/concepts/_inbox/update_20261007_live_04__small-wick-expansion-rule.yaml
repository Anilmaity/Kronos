id: small-wick-expansion-rule
name: Small Wick Supports Expansion; Large Wick Waits for Candle 3
category: model
status: contested
voice: ttrades
definition: 'This unit sides with the RANGE-AND-TIME reading: the test for whether the day can continue
  expanding is how much range and time were spent forming the wick. A wick formed quickly leaves range
  (and time) to expand; a wick that consumed most of the range and time leaves little. He also says the
  indicator''s gray boxes are where he determines what counts as a small wick.'
