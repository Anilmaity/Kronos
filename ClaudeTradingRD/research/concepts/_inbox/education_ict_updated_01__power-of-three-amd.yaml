id: power-of-three-amd
name: Power Of Three (Accumulation, Manipulation, Distribution)
aliases:
- AMD
- power of three
- accumulation manipulation distribution
category: model
status: specified
definition: Accumulation is some sort of consolidation; manipulation is a fake breakout / the false
  move; distribution is the real move in the opposite direction of the manipulation. He states that
  the box setup IS this pattern, and applies the same sequence across sessions — his general expectation
  is Asia accumulates, London manipulates, New York distributes — and across the 4-hour and daily candle
  (open, manipulate below the opening price, distribute).
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  - 5m
  fractal: true
detection_rules:
- Mark the consolidation (accumulation). For the box setup he marks the bodies.
- Manipulation = the move outside the consolidation, in the direction OPPOSITE the intended trade.
- Confirm the manipulation by requiring aggressive displacement back into the range plus a structure
  break or CISD; without that aggressive return, expect continuation instead.
- Distribution = the move away from the manipulation, projected with standard deviations off the manipulation
  leg.
- 'Session form: Asia accumulation, London manipulation, New York distribution.'
- 'Candle form: bullish 4-hour/daily candle = open, low (manipulation below the opening price), high,
  close.'
invalidation:
- No aggressive displacement back into the range — the excursion was expansion, not manipulation.
execution:
  bias: Direction of distribution — opposite the manipulation.
  entry: Retest of the manipulation / the deviation from the range; or the CISD order block at its extreme.
  stop: Beyond the manipulation extreme.
  targets:
  - -2 to -2.5 then -4 standard deviations of the manipulation leg
  - Failure swings and old highs/lows ('low hanging fruit')
measurable:
- how often London takes an Asia extreme and New York expands the other way
- hit rate of the -2/-2.5 band measured from the London manipulation
