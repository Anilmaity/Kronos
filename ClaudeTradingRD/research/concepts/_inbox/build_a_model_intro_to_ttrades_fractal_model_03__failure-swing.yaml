  quote: these are not relevant highs because we are not expecting a reversal right here
- video_id: HbOeD_JVens
  title: Which Swing Highs and Lows Matter in Trading? (Relevant Swings)
  quote: not expecting a reverse right here because there are still highs to its left
ambiguities:
- 'CONTESTED against the corpus''s other definition: elsewhere a failure swing is defined by not having
  swept prior liquidity. Here it is defined purely by proximity to a neighbouring extreme. The two
  tests can disagree on the same bar.'
- '''Close together'' is the same unquantified separation judgement as relevant-swings-separation.'
- He refers viewers to a separate failure-swings video as the prerequisite, so the full definition
  is out of scope of this transcript.
