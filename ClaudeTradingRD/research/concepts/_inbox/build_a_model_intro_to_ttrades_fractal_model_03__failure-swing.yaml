id: failure-swing
name: Failure Swing
aliases:
- stacked highs
- stacked liquidity
- not relevant
category: structure
status: contested
definition: 'In this video failure swings are defined by proximity rather than by whether they swept
  anything: they are the stacked highs or lows that sit close enough to one another that no one of
  them can be trusted as a level to trade away from, because price is expected to reach past them
  to the extreme. They are what you target, not what you trade away from, and he does not want them
  sitting on the stop-loss side of a position. A run through a cluster of failure swings into the
  relevant extreme is what creates the tradeable event.'
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  fractal: true
preconditions:
- Two or more same-side extremes exist at a similar level.
detection_rules:
- Identify same-side extremes that sit close together with no valid separation.
- Classify all but the outermost as failure swings.
- Do not look for a reversal at a failure swing - expect price to reach past it into the relevant
  extreme.
- Use the failure-swing cluster as the target when trading toward that side.
- Require the stop-loss side to carry no failure swings (high resistance liquidity).
- A fair value gap can be read as a failure swing because it is a high on a lower timeframe.
invalidation:
- The relevant extreme beyond the cluster is taken, resolving the cluster.
measurable:
- hit rate of failure-swing clusters as targets
- stop-out rate of trades whose stop sits behind a failure-swing cluster
sources:
- video_id: HbOeD_JVens
  title: Which Swing Highs and Lows Matter in Trading? (Relevant Swings)
  quote: high resistance liquidity or no failure swings on our stop-loss side
- video_id: HbOeD_JVens
