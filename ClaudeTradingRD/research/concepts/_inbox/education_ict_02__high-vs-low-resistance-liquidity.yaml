ambiguities:
- '''A high or low with a failure swing'' is decidable only relative to a chosen lookback: which price
  leg counts as ''the leg toward it'' is not bounded in candles or time.'
- Whether a wick through the level (rather than a close) is enough to convert low resistance into
  high resistance is not stated.
- The consecutive-days scan is given as 'consecutive candles where no high is broken' with no minimum
  count.
- This unit's sense (a property of a specific swept/unswept level) is not the same as the sunday_sessions_live_q_a_03
  / the_foundation_02 sense (a whole-day regime classification). Both are preserved; this is the dedicated
  lesson.
