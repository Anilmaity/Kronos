  quote: step one is to wait to see this next candle and how it reacts
- video_id: PQiRV0JMhIQ
  title: Why Your Continuations Fail (Order Blocks + CISD Explained)
  quote: we can either trade the breakout with a continuation or wait for a new manipulation
ambiguities:
- The boundary between a slow retracement and a consolidation is the speed test, which is itself a
  preference ('1 2 maybe three') rather than a hard count.
- '''Wait one more candle'' is given as step one but he elsewhere says ''give it a couple candles'';
  the number of confirmation candles is not fixed.'
- No rule is given for choosing between route A and route B when both become available.
