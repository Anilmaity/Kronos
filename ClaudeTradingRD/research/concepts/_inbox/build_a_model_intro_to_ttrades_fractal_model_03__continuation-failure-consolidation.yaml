id: continuation-failure-consolidation
name: 'Continuation Failure #1 - The Closure Is A Consolidation Sweep'
aliases:
- it's actually just sweeping out the high in the consolidation range
- reason number one
category: entry
status: specified
definition: 'The first of three named reasons continuations fail. When the recovery back into the
  range is slow rather than V-shaped, the structure is a consolidation, not a retracement. The eventual
  close over the level - the one the trader reads as validating the low - is in fact a manipulation
  of the consolidation range''s high, after which price trades to the other side of the range. The
  remedy is to reclassify: once the recovery is slow, stop treating the level as a continuation trigger,
  mark the range high and low, and take one of only two ways back in - wait for a manipulation of
  the range low and a V-shaped recovery off it, or trade the breakout but only if a NEW continuation
  forms after it. The universal first step after any suspect closure is to let one more candle print
  and see whether a new continuation forms or price comes back across the range.'
timeframes:
  htf:
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- A continuation was expected at a point of interest inside a trend.
detection_rules:
- 'Measure the recovery speed into the level (see v-shape-reversal-speed: 1-3 candles).'
- If the recovery is slow or fails to regain the level, reclassify the structure as a consolidation
  and mark the range high and range low.
- Ignore all closures over levels internal to the range - they are not continuations.
- 'Route A: wait for a manipulation of the range low (bullish case) and require a V-shaped recovery
  off it before entering.'
- 'Route B: trade the breakout of the range only if a new continuation forms after the breakout; the
  breakout alone is not tradeable.'
- Step one after any suspect closure is to wait one more candle and see whether a new continuation
  forms off the high or price returns across the range.
- If price returns across the range instead, the low being manipulated becomes the level to trade
  away from.
invalidation:
- A new continuation does form off the breakout - the range reading is superseded.
execution:
  bias: Away from the manipulated range extreme, or with the confirmed breakout.
  entry: On the V-shaped recovery after the range extreme is manipulated, or on the continuation that
    follows a breakout.
  stop: Beyond the manipulated range extreme / the new protected swing.
  targets:
  - the other side of the range
  - failure swings beyond it
measurable:
- share of slow closures that are followed by a move to the opposite range extreme
- win rate of route A vs route B entries
