id: half-wick-respect
name: 0.5 of the Wick Must Be Respected
category: structure
status: contested
aliases:
- half of the wick
- 0.5 of the range
definition: 'The half-level that must be respected is measured differently depending on the candle type,
  and this unit supplies the discriminator that resolves an apparent contradiction elsewhere in the
  corpus. On a LARGE-wick reversal candle, 0.5 of the WICK is the level. But on a SMALL-wick expansion
  candle he explicitly refuses 0.5 of the wick, because a retracement to the midpoint of a small wick
  would still be a deep move relative to the candle -- so he uses 0.5 of the whole CANDLE''S RANGE instead.
  He states the underlying principle both ways: the goal is a shallow retracement consistent with expansion.'
timeframes:
  htf:
  - 1W
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  fractal: true
preconditions:
- A candle 2 / reversal candle whose wick is the reference.
detection_rules:
- 'Classify the candle: large opposing wick (reversal) vs small wick (expansion).'
- 'Large-wick candle: mark 0.5 of the WICK; expect price to reach it, form an intracandle change in
  the state of delivery, then trade away.'
- 'Small-wick candle: mark 0.5 of the CANDLE''S RANGE instead; a move to 0.5 of the small wick would
  not be a shallow retracement.'
- In parallel he marks 50% of the BODIES of the opposing-candle series (the mean threshold) and requires
  no closures beyond it.
- 'Candle 4 uses a related but distinct level: 0.5 of candle 3''s range, with the wick required in the
  correct half.'
invalidation:
- Price closes beyond the marked half level -- the expansion read is downgraded or dead.
measurable:
- respect rate of 0.5-of-wick vs 0.5-of-range, split by wick size
- forward expansion conditioned on which half level held
sources:
- video_id: qdQYhePcvGE
  title: TTrades Fractal Model - Trading Candle 3
  quote: I'm going to look for 0.5 of this daily candles range
- video_id: NqSbvqDKML0
  title: The Only Points of Interest That Actually Matter For Trading
  quote: I want to see 50% of the bodies hold as well
- video_id: 9BY-MQRNy-Y
  title: TTrades Swing Trading Model - Simple Strategy
- video_id: 5fnFOh5YuM0
  title: TTrades Fractal Model - Trading Candle 4
- video_id: FAKWJ-1NlLE
  title: Trading The 4 Hour Power Of Three - OHLC / OLHC
ambiguities:
- Three different half levels are in use in this unit -- 0.5 of the wick, 0.5 of the candle range, 50%
  of the bodies -- and only the first two get an explicit selection rule.
- The selection rule itself depends on the unquantified small/large wick classification, so it inherits
  that ambiguity.
- 9BY-MQRNy-Y applies 0.5 of the wick to a weekly candle 2 closing on its wick without invoking the
  wick-size test.
