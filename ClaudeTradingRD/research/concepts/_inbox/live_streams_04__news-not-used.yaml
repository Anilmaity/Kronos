id: news-not-used
name: "Macro News In The Decision (contested within the same unit)"
aliases: ["I don't pay attention to news", "FOMC later in the day"]
category: time
status: contested

definition: >
  Two streams in the same unit give opposite readings and neither is qualified. Reading A
  (x4sRGuZIqWk): he does not use macroeconomics or major news events in trading decisions at
  all, saying much news is a smoke screen, and he declines to make a video on it because he
  does not use it. Reading B (N3Ml-r0X30o): on an FOMC day he checks the economic calendar on
  air, downgrades his expectation that the 9:30 drive will produce the day's move because FOMC
  later in the day is likely to make the actual move, and states he does not trade post-FOMC.
  Both readings are the channel's own voice, recorded here without reconciliation.

timeframes:
  htf: ["1D"]
  ltf: []
  fractal: false

preconditions:
  - "A scheduled high-impact release on the day being traded."

detection_rules:
  - "Reading A: ignore the economic calendar entirely; the model is unchanged by scheduled news."
  - "Reading B: on an FOMC day, downgrade the expectation that the 9:30 / New York open drives the day's range, because the release later in the day is expected to produce the move."
  - "Reading B: do not trade after the FOMC release."

invalidation:
  - "Not applicable - a filter."

measurable:
  - "share of the daily range produced before vs after a scheduled release"
  - "expectancy of 9:30-driven continuations on FOMC days vs non-FOMC days"

sources:
  - video_id: x4sRGuZIqWk
    title: "New York Open Live Q&A"
    quote: "I don't really use macroeconomics and major news events in my trading decisions"
  - video_id: N3Ml-r0X30o
    title: "New York Open Live Q&A"
    quote: "we have FOMC later in the day that is likely to make"

ambiguities:
  - "The two statements are eight days of streams apart with no acknowledgement of the conflict; it may be that FOMC specifically is the exception to a general no-news stance, but he never says that."
  - "'I don't trade post FOMC' is given with the aside that he used to when he traded options, and no window length is attached."
  - "No tiering of releases is given anywhere in this unit."

python_detector: null
related: ["pre-event-avoidance-rule", "fomc-week-protocol", "news-impact-tiering", "trading-window"]

contributing_units: ["live_streams_04"]
draft_count: 1
voice: ttrades
