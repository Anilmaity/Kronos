id: timeframe-alignment
name: Timeframe Alignment (all timeframes green)
aliases:
- aligning my lower time frames with my higher time frames
- align all the time frames together
category: structure
status: specified
definition: 'In this unit alignment is not a filter applied to a trade - it is offered as the definition
  of expansion itself. He asks and answers the question directly: expansion occurs when you align
  all the timeframes together. The silver example is the worked case, where the entry is taken at
  the moment the 15-minute turns bearish while the 4-hour and the weekly are already bearish, and
  he replays the same moment on the USDJPY chart: the expansion arrives at the closure through the
  down-close candles, because that closure is what makes the lowest timeframe agree with the two
  above it.'
timeframes:
  htf:
  - 1W
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  - 5m
  fractal: true
preconditions:
- A bias timeframe, a structure timeframe and an entry timeframe are all being read.
detection_rules:
- Alignment = every timeframe in the stack directionally agreeing at the same moment; that state
  is what he calls expansion.
- 'Worked instance: weekly bearish AND 4-hour bearish AND 15-minute bearish simultaneously.'
- The moment of alignment is the lowest-timeframe closure through the opposing series of candles
  - before that closure the stack is not yet aligned.
- If the higher-timeframe analysis is missing you will be looking in the wrong direction and get
  caught offside; he calls this one of the most important concepts in trading.
invalidation:
- Any timeframe in the stack is directionally opposed - wait rather than trade.
measurable:
- size of the move following full-stack alignment vs partial alignment
- elapsed time between the highest-timeframe signal and the lowest-timeframe closure that completes
  the alignment
sources:
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: when does expansion occur it is when you align all the time frames together
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: this is aligning my lower time frames with my higher time frames
ambiguities:
- Alignment is asserted after the fact in every example; no pre-trade test is given for whether the
  lowest timeframe is aligned beyond its CISD having occurred.
- '''Directionally agreeing'' is not reduced to a per-timeframe rule here (elsewhere in the corpus
  it is wick geometry supporting expansion).'
- He defers the detail to a separate 'time frame alignment video' which is not in this unit.
python_detector: null
