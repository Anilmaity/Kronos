id: one-minute-premature-entry
name: Enter Before The Signal Timeframe Confirms (1-minute inside the higher candle)
category: entry
status: specified
voice: ttrades
definition: TTrades' own statement of the pre-confirmation entry (previously only a guest's, on 5m/1m).
  He takes a 1-minute entry inside a 15-minute candle that is expected to confirm a protected low, and
  then requires that 15-minute candle to close over the level. If it reverses and fails to close over,
  the trade is scratched.
detection_rules:
- Mark the level the 15-minute candle must close over to protect the low.
- Enter early on the 1-minute inside that 15-minute candle.
- If the 15-minute closes over the level, hold.
- If it fails to close over, scratch the trade.
sources:
- video_id: GRc5FVB5tdg
  title: New York Open Live Q&A
  quote: it's an earlier entry into this 15minute confirming that this low is there
- video_id: GRc5FVB5tdg
  title: New York Open Live Q&A
  quote: If that 15-minute candle would have reversed, didn't close over it
- video_id: GRc5FVB5tdg
  title: New York Open Live Q&A
  quote: And then you can scratch the trade, do whatever.
ambiguities:
- Whether 'scratch' means exit at market at the close or move to break-even is not stated.
