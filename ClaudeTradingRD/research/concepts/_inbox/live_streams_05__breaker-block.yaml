id: breaker-block
name: Breaker Block
aliases:
- breaker
category: entry
status: contested
definition: 'A naming dispute worked out live between host and guest over the same five-minute structure.
  The guest marks a low, high, higher high, lower low sequence and calls it a breaker, using it as
  the level to close through. The host refuses the label twice: he says that is not a breaker, it
  is an order block, and then restates the sequence he requires for a breaker - a low, high, lower
  low, higher high - before agreeing to work with the guest''s level anyway, calling it a level rather
  than a breaker. Both readings are preserved.'
timeframes:
  htf:
  - 1H
  - 15m
  ltf:
  - 5m
  - 1m
  fractal: true
preconditions:
- A four-point swing sequence on the execution timeframe.
detection_rules:
- 'Host''s reading: a bullish breaker is the sequence low, high, lower low, higher high - price closing
  through and forming the higher high is what makes it a breaker.'
- 'Guest''s reading: the sequence low, high, higher high, lower low, used as the level to trade the
  close through.'
- 'Host''s classification of the guest''s structure: an order block, not a breaker.'
invalidation:
- Not stated for either reading in this unit.
measurable:
- outcome difference between levels drawn under the two sequence definitions
sources:
- video_id: tDiwwMRWF2k
  title: New York Open Live Q&A with NickDoesFutures
  quote: that's not a breaker, that's an order block
- video_id: sdZkE-naNiY
  title: TTrades Indicator Updates - Walkthrough and Q&A
  quote: C1 is just the liquidity for the reversal of candle 2
ambiguities:
- The second source quote is included only to anchor the host's own vocabulary in this unit; the indicator
  video makes no breaker statement, and his indicator does not draw breakers at all.
- The exchange is partly a stream-delay misunderstanding, so how much of the disagreement is definitional
  versus a crossed-wires moment is not fully separable.
- Neither speaker states which candle body or wick bounds the level.
