id: mean-reversion-3atr-21ema
name: Plus-Three-ATR Extension Back To The 21 EMA (an explicitly non-ICT system)
aliases:
- reversion to the mean
- TTM squeeze
category: model
status: underspecified
definition: 'The guest states plainly, in answer to a viewer, that he does not primarily trade ICT.
  He names three systems he does trade: John Carter''s TTM squeeze, a reversion-to-the-mean system,
  and TheSTRAT. The only mechanics given anywhere in the video are the mean-reversion trigger and
  its target - price is judged overextended at plus three ATR, and the expectation is a move back
  to the 21-period exponential moving average. This entry exists as documentation of what this guest
  actually trades, not as a channel method: the corpus records the channel''s own toolkit as deliberately
  excluding moving averages.'
timeframes:
  htf: []
  ltf: []
  fractal: false
preconditions:
- An instrument and timeframe on which ATR and a 21 EMA are computed - neither is specified.
detection_rules:
- Flag price as overextended when it is plus three ATR from the mean.
- Target the 21-period EMA as the reversion objective.
invalidation:
- Not stated.
measurable:
- hit rate of a return to the 21 EMA after a +3 ATR extension, by instrument and timeframe
- maximum adverse excursion between the +3 ATR trigger and the EMA touch
