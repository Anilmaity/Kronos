  shorts are all unstated.
- No stop, invalidation or position-sizing rule is attached.
- The TTM squeeze and TheSTRAT are named but no mechanics for either are given in this video.
- Directly at odds with the channel's own excluded-tooling stance on moving averages - a guest-versus-host
  difference, not a channel inconsistency.
