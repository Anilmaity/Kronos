id: continuation-timing
name: Continuations Must Form Early in a New Higher-Timeframe Candle
aliases:
- wait for the new candle open
- frame your entries when it is forming the wick
category: entry
status: contested
definition: 'Both videos in this unit converge on the same timing doctrine and one of them states
  it as the single takeaway: frame entries while the higher-timeframe wick is forming, which means
  early in a new higher-timeframe candle. The reasoning is given twice. From the wick side: a shallow
  opposing run matters not only because it uses little range but because it uses little TIME, leaving
  the rest of the period to expand - so an extreme printed late in a candle cannot be traded for expansion.
  From the continuation side: a candle that has already expanded is not the candle to enter on; he
  waits for the next one to open, form its wick, and then trades away from it. The worked rejection
  is an hourly candle with 40 minutes left, where taking the high and then expanding would not fit.
  He extends the same argument to dismiss macros.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  - 15m
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- A higher-timeframe candle is in progress and its remaining time is known.
detection_rules:
- Frame entries in the window where the higher-timeframe wick is forming - i.e. early in a new higher-timeframe
  candle.
- If the current candle has already expanded, do not enter on it; wait for the next candle to open
  and form its wick.
- Reject a setup whose remaining candle time is insufficient for the expansion to complete - 40 minutes
  left in an hourly candle is the worked rejection.
- If price spends a long time forming the reversal inside a candle, wait for the new candle open rather
  than entering late.
- 'Session overlay: prefer the extreme to form early New York or before New York so New York can expand.'
invalidation:
- The higher-timeframe candle closes - the window is over and the next open becomes the reference.
measurable:
- expansion distance conditioned on elapsed fraction of the HTF candle at entry
- win rate of entries in the first vs the last third of the HTF candle
sources:
