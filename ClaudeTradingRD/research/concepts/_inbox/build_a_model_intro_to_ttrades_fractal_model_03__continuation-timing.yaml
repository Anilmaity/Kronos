  quote: Does it make sense for price to consolidate here and then with 40 minutes left
- video_id: SlWxhzhLo3A
  title: 'Wick Size Matters: The Key to Understanding Reversal and Expansion Candles'
  quote: We want to see that early into the candle.
- video_id: SlWxhzhLo3A
  title: 'Wick Size Matters: The Key to Understanding Reversal and Expansion Candles'
  quote: that's why macros don't even make sense
ambiguities:
- '''Early into the candle'' is never given as a fraction of the period; the 40-minutes case is one
  example on an hourly, not a stated cut-off.'
- Which timeframe counts as 'the higher timeframe' shifts between examples (daily under hourly, hourly
  under 5-minute, 15-minute under 1-minute).
- The macro dismissal is asserted from the timing argument alone with no further support.
