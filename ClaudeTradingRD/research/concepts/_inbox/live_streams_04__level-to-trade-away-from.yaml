id: level-to-trade-away-from
name: "No Level to Trade Away From, No Trade"
aliases: ["failed to reach a relevant level", "nothing to range for"]
category: entry
status: specified

definition: >
  Used three times in this unit to decline setups that look good on the chart. A viewer offers
  a clean hourly short on oil; he agrees the pattern looks great and refuses it, because oil
  failed to reach the relevant level above - the pattern supports nothing when there is no
  level behind it. The same reasoning appears as a long refusal: he has no low he would trust
  to trade away from, so he will not favour longs. And the reverse case is stated for targets:
  where there is no draw on liquidity, nothing to range for, you do not frame a continuation at
  all - you favour a retracement or a reversal instead.

timeframes:
  htf: ["1D", "4H", "1H"]
  ltf: ["15m", "5m"]
  fractal: true

preconditions:
  - "A candidate setup on the execution timeframe."

detection_rules:
  - "Identify the level the trade is being taken away from; if it does not exist, do not take the trade regardless of pattern quality."
  - "A level that price failed to reach is not a level to trade away from."
  - "A swing that is too old or too untrustworthy does not qualify as a level to trade away from."
  - "Identify the draw the trade is going toward; with no draw, do not frame a continuation - favour retracement or reversal."
  - "Unless price is already close to the draw, a continuation is not framed."

invalidation:
  - "Not applicable - a pre-trade gate."

measurable:
  - "expectancy of setups taken with vs without an identified level behind them"
  - "expectancy of continuations framed with no open draw"

sources:
  - video_id: x4sRGuZIqWk
    title: "New York Open Live Q&A"
    quote: "when it has failed to reach a relevant level"
  - video_id: eIPM-D8RrSQ
    title: "New York Open Live Q&A"
    quote: "I don't really have any low to trade away from"

ambiguities:
  - "'Relevant' is carried over from the relevant-level concept and is not re-derived here."
  - "'Really close to the draw' is the threshold for framing a continuation and is not quantified."
  - "He caveats the oil refusal with 'that's just my opinion though', so it is stated as a personal filter."

python_detector: null
related: ["relevant-level", "point-of-interest", "no-draw-no-trade", "idea-vs-executable-setup", "draw-on-liquidity"]

contributing_units: ["live_streams_04"]
draft_count: 1
