id: invalidation-first-timeframe-selection
name: Choose the Timeframe by Where the Stop Can Go
aliases:
- I don't need three time frames
- if I can manage my risk
category: entry
status: specified
definition: 'The top-down video states the corollary of this rule explicitly while running a three-timeframe
  example: he does not need three timeframes, and he can execute on the hourly structure timeframe
  directly, provided he can manage his risk there. Dropping to the lower timeframe is presented as
  being done for one reason only - to enter into the same higher-timeframe objective with better
  risk-to-reward - and the choice between the two is called personal preference rather than a rule.'
timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 15m
  - 5m
  fractal: true
preconditions:
- A structure-timeframe setup already exists with an identifiable invalidation level.
detection_rules:
- 'The number of timeframes in the stack is not fixed: if risk can be managed on the structure timeframe,
  execute there.'
- The stated purpose of dropping a timeframe is to increase risk-to-reward toward the higher-timeframe
  targets, not to find a different signal.
- Targets stay on the higher timeframe regardless of which timeframe the entry is taken on.
- The choice between structure-timeframe execution and lower-timeframe refinement is stated as personal
  preference.
invalidation:
- Risk cannot be managed on the current timeframe - drop one and re-check.
measurable:
- R distribution of hourly-executed vs 5-minute-executed entries on the same setup
- stop-out rate by execution timeframe
sources:
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: I don't need three time frames
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: either works it is just personal preference
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: using the lower time frames to enter into it to increase your risk to reward
ambiguities:
- '''If I can manage my risk'' is not turned into a test - no maximum stop distance in points, percent
  of ADR, or R terms.'
- The transcript reads 'I cannot go lower if I can manage my risk', which is an auto-caption rendering
  of 'I can not go lower...'; the meaning is that going lower is optional.
- No guidance on when the preference should flip.
python_detector: null
