id: loss-streak-statistical-expectation
name: Expect Five To Ten Consecutive Losses Over A Thousand Trades
aliases:
- think in the next thousand trades
- trading capital is your oxygen tank
category: risk
status: specified
definition: 'A frequency claim used to set position size and to interpret drawdown. Over a sample
  of a thousand trades it is stated to be almost a statistical certainty that the trader will lose
  five to ten trades in a row, so capital must be sized such that such a run cannot end the account
  (''think of your trading capital as your oxygen tank ... if you run out it''s game over''). The
  prescribed mental frame follows: think about the next hundred or thousand trades, not the next one,
  and no single trade should be able to make or break the account. The corollary offered for live
  drawdown is that a 60-70% win rate still loses 30-40% of the time, so three or four losses in a
  row are not by themselves evidence of a broken system - the diagnosis (trader, system, trade management,
  market conditions or broker) comes from the trade review, not from the streak.'
timeframes:
  htf: []
  ltf: []
  fractal: false
preconditions:
- A defined system being executed with consistent size.
detection_rules:
- Size so that five to ten consecutive full-risk losses cannot end the account.
- Do not treat a three- or four-trade losing run as evidence the system is broken.
- On a losing streak, review the trades first, then classify the cause as the trader, the system,
  trade management, market conditions or the broker.
- Evaluate performance over the next hundred to thousand trades, not the next trade.
invalidation:
- Not applicable - a distributional expectation, not a chart condition.
measurable:
- observed maximum consecutive-loss run per 1,000 trades vs the claimed 5-10
- account survival probability under the observed run length at the chosen risk per trade
