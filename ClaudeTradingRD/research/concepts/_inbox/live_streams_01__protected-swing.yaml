id: protected-swing
name: Protected Swing (the invalidation level)
definition: 'Two live refinements. First, the mechanical formation rule stated aloud: once price closes
  over the level, that swing is protected - the close is what protects it, and until the close happens
  the low is not protected. Second, a quality filter: a swing whose sweep is very shallow, barely
  forming a sweep and close to equal highs, is hard to trust even when the indicator marks it mechanically;
  to trade away from a swing he wants to see at least some sort of reach. He also uses a protected
  swing as the thing to trail a stop to, and treats a swing as no longer protected once the previous
  day''s low that anchored it has been taken.'
category: structure
status: contested
detection_rules:
- A swing becomes protected when price closes over (or under) the level.
- Before that close, the swing is not protected and is not tradeable as an invalidation.
- Filter out swings whose sweep is negligible - near-equal highs with barely any reach.
- A protected swing ceases to count once the level that anchored it has been taken out.
measurable:
- sweep depth distribution of protected swings that held vs those that failed
- how many mechanically-marked swings the reach filter removes
sources:
- video_id: NESSCPMzWR0
  title: New York Open Live Q&A
  quote: When this closes over, this swing is protected
- video_id: yNgx9OAefuI
  title: New York Open Live Q&A
  quote: Barely even forms a sweep
ambiguities:
- '''Some sort of reach'' is the filter and is never quantified - no minimum sweep depth in points,
  ticks or fraction of range.'
- His own indicator marks the shallow case as a protected swing, so the filter is discretionary on
  top of the mechanical definition; he states this openly.
