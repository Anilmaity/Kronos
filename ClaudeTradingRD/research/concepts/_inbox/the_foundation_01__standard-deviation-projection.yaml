id: standard-deviation-projection
name: "Standard Deviation Projection Of The Manipulation Leg"
aliases: ["projection", "projecting the manipulation", "standard deviations", "-2 to -2.5", "-4 to -4.5"]
category: entry
status: underspecified

definition: >
  A target-generation technique: measure the manipulation leg (the move that swept liquidity
  and reversed) and project multiples of it beyond the reversal point, marking the -2 to -2.5
  and -4 to -4.5 bands as expected destinations for the distribution. It is used across the
  unit for both targets and for anticipating retracement/reversal zones, and its value is said
  to come from coinciding with pre-existing liquidity — the speaker consistently checks what
  rests at those bands before accepting them. Attributed in part to "Dexter lab".

timeframes:
  htf: ["1D", "1H"]
  ltf: ["15m", "5m", "1m", "30s"]
  fractal: true

preconditions:
  - "A completed manipulation leg with an identifiable origin and extreme."

detection_rules:
  - "Breaker context: the manipulation leg is the leg that created the lower low (bullish breaker) / higher high (bearish breaker); project it out to the subsequent extreme."
  - "AMD context: project 'from this low to this high — the low that made the manipulation move' (he drops to a 30-second chart in one example to identify the exact anchor)."
  - "Mark the 2 to 2.5 and 4 to 4.5 bands (negative sign used for downside targets)."
  - "Accept a band as a target preferentially when existing liquidity (equal lows/highs, old highs/lows, a prior-session extreme, a fair value gap) coincides with it."
  - "Also used as a reversal/retracement zone when price arrives at the 2 to 2.5 band."

invalidation:
  - "Not stated."

execution:
  bias: "Same as the parent setup."
  entry: "n/a — target and confluence tool. In one example the 2-2.5 arrival is used to anticipate a retracement or reversal against the move."
  stop: "n/a"
  targets: ["-2 to -2.5", "-4 to -4.5"]

measurable:
  - "hit rate of the 2-2.5 band and the 4-4.5 band once a manipulation leg is defined"
  - "how often the bands coincide with pre-existing liquidity"
  - "sensitivity of hit rate to the anchor choice (same-timeframe vs lower-timeframe anchor)"

sources:
  - video_id: CHIK5oBRKiw
    title: "Change In State Of Delivery [CISD] - Orderblock Formation - ICT Concepts"
  - video_id: TCFvsZeYvV8
    title: "ICT Power Of 3 - AMD"
