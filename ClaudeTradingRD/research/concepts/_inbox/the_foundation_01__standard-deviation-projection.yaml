  - video_id: MPeeE55rNOw
    title: "ICT Killzones & Indicator Settings"

ambiguities:
  - "The arithmetic is never stated in words. From the visuals the bands appear to be multiples of the manipulation leg measured from its origin, but whether a '2' means 2x the leg from the origin or from the reversal point is not confirmed anywhere in the available transcripts."
  - "The anchor is timeframe-dependent: one example requires dropping to a 30-second chart to find 'the low that made the new high', so the projection is not uniquely determined on the trading timeframe."
  - "Why the bands are called 'standard deviations' is never explained; no statistical quantity is computed."
  - "No rule decides between the 2-2.5 band and the 4-4.5 band as the primary target other than what liquidity sits there."
  - "The tool is attributed to an external source (Dexter lab's Twitter, linked in the description) rather than derived."

python_detector: null
