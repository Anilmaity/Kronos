ambiguities:
  - "Sourced from an ASR (whisper-small) transcript, not YouTube captions; wording may be imprecise."
  - "The conflict case (open supports the bias but the close is over 0.5 of the CISD) is resolved by requiring more lower-timeframe confirmation, not by a stated rule about which signal wins."
  - "In video Nlw-PZhoViQ the CISD levels are read off the on-screen indicator (he selects it and sets the bias) rather than constructed by hand, so the exact construction is not observable in the transcript."
  - "Whether the close-through must be a body close is never stated explicitly, though the speaker does once say to focus on the bodies."
  - "The series of same-direction candles is unbounded - no maximum count, and no rule for what terminates a series."
  - "In several passages the CISD is read directly off the speaker's on-screen indicator rather than constructed manually; the indicator's rule set is not given in these transcripts."
  - "The relationship between CISD and the opposing candle is shown by example but never stated as an identity."

python_detector: null
