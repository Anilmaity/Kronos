id: trade-frequency-baseline
name: Expected Trade Frequency (one to two a week)
definition: 'The stated live cadence of the model: normally one to two trades a week, occasionally
  three or four, and not every day. The daily-chart swing setups he sizes up for come around roughly
  six to eight times a year. Frequency is explicitly a function of the timeframe traded - lower timeframe
  means more setups and correspondingly smaller risk per setup; higher timeframe means fewer setups
  and more risk on each.'
category: risk
status: specified
detection_rules:
- 'Intraday model on the stated instruments: expect one to two signals per week, up to three or four.'
- 'Daily-chart swing setups: expect six to eight per year.'
- There is no minimum - 'one trade a day max' is a cap, not a quota, and many days produce nothing.
- Risk per trade scales inversely with setup frequency for the timeframe being traded.
measurable:
- signals per week produced by a candidate detector vs the one-to-two baseline
- signals per year on the daily timeframe vs the six-to-eight baseline
sources:
- video_id: xraklBJHW5k
  title: New York Open Live Q&A
  quote: Normally, it's like one to two
- video_id: NESSCPMzWR0
  title: New York Open Live Q&A
  quote: They're like six to eight times a year
- video_id: yNgx9OAefuI
  title: New York Open Live Q&A
  quote: I don't trade every day
ambiguities:
- The one-to-two-a-week figure is given for his own trading across his whole watchlist (indices plus
  gold plus occasional oil/dollar), not per instrument.
- It is not stated whether the six-to-eight-a-year swing setups are per instrument or across the whole
  watchlist.
