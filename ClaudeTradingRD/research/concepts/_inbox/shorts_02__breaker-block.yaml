id: breaker-block
name: Breaker Block
category: entry
status: specified
definition: A Short gives the bullish breaker as a strict four-point sequence and then walks it forward
  live on GBPUSD 5-minute. The sequence is LOW, HIGH, LOWER LOW, HIGHER HIGH. Once the higher high confirms
  it, the breaker itself is the series (or the single) UP-CLOSE candle between the low and the high;
  that marked area is what price should react to when it returns, and the expectation is continuation
  higher off it.
timeframes:
  htf: []
  ltf:
  - 5m
  fractal: true
preconditions:
- A swing low has formed.
detection_rules:
- 'Bullish breaker sequence: a low, then a high, then a LOWER low, then a HIGHER high.'
- Only after the higher high is made is the breaker block formation confirmed.
- Mark the series (or single) up-close candle between the low and the high as the breaker block.
- On a return into that area, expect a reaction and continuation higher.
invalidation:
- Price trades through the marked area without reacting.
measurable:
- reaction rate on first retest of a breaker marked by this sequence
- frequency of the full four-point sequence per session on the 5-minute
sources:
- video_id: DUIhKL5v1uQ
  title: Identifying Breaker Blocks for Possible Entries
  quote: with a bullish breaker, we need a low high lower low then higher high
- video_id: DUIhKL5v1uQ
  title: Identifying Breaker Blocks for Possible Entries
  quote: the series or single up close candle here between the low and the high
ambiguities:
- The Short does not say whether the higher high must CLOSE above the prior high or merely trade above
  it.
- '"Between the low and the high" identifies the up-close candles positionally; which of them to use
  when several qualify is not stated.'
- No stop, entry price within the block, or target is given in this clip - only "look for a reaction
  there".
- The bearish mirror is not stated.
