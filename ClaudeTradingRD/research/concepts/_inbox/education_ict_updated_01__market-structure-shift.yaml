ambiguities:
- The sweep/stop-raid precondition is 'I also prefer' in _94CPMjWi9E and part of the definition in ynFA6E3qHj0
  — preference vs requirement is not resolved.
- '''Aggressive'' / ''large full-bodied'' displacement is never quantified (no body-to-range ratio,
  no ATR multiple).'
- In umyCqr_0NsI he says he often waits for an INTERMEDIATE-term high/low to be taken rather than any
  swing, which raises the bar but is not stated as a rule.
- Whether the close must be a body close or any close beyond the swing is not stated, though every example
  shows a body close.
