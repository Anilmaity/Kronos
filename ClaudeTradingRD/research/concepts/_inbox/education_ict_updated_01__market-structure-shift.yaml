id: market-structure-shift
name: Market Structure Shift (MSS)
aliases:
- MSS
- shift in structure
- break structure
category: structure
status: specified
definition: A change in trend from bullish to bearish or bearish to bullish, produced by displacement
  that closes beyond a prior swing high (bullish shift) or swing low (bearish shift). Displacement means
  a large aggressive move of full-bodied candles, single or multiple, easiest to spot by the fair value
  gap it leaves. He additionally requires a stop raid of that swing immediately before the displacement,
  and requires that price had engaged a higher-timeframe level before the shift; without that engagement
  he does not look for a setup at all.
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- Price has engaged a higher-timeframe level (PD array / point of interest) on that or a lower timeframe.
- A prior swing high or swing low exists to be broken.
detection_rules:
- Locate a prior swing high (for a bullish shift) or swing low (for a bearish shift).
- 'A stop raid occurs first: price sweeps that swing (preferred, not universally enforced in the examples).'
- Price then displaces — large full-bodied candle(s), typically leaving a fair value gap — and CLOSES
  beyond that swing level.
- The close must be beyond the swing itself, not merely beyond an opposing candle's opening price (that
  is the CISD test instead).
- Only then does he look left for a PD array (order block / FVG / OTE / breaker) in the retracement
  to enter.
invalidation:
- Price reaches the swing but cannot close beyond it (that is a liquidity grab, not a shift).
- No higher-timeframe level was engaged before the break — he does not search for a setup.
execution:
  bias: Direction of the displacement through the swing.
  entry: Retracement into a PD array inside the displacement range (premium for shorts, discount for
    longs).
  stop: Beyond the swept extreme / the opposing candles.
  targets:
  - The liquidity that drew price (old high / old low)
  - Opposite side of the displacement range
measurable:
- frequency of MSS bars that were preceded by a sweep vs not
- hit rate of MSS with prior HTF-level engagement vs without
- median bars from CISD to the corresponding MSS
