id: v-shape-reversal
name: V-Shape Reversal
category: structure
status: underspecified
definition: 'Live gold read: a sharp V-shaped reversal is distrusted. The origin of the V is the area
  that must be respected if it were truly bullish; usually price closes back below it and then runs to
  the actual lows.'
detection_rules:
- Mark the origin of the V as the level that must hold.
- Expect a closure back below it and continuation to the lows.
