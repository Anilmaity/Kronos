id: ttfm-minimal-toolkit
name: Minimal Toolkit (what is on the chart, and what is deliberately not)
definition: 'Asked how to tell whether one is using too many concepts, he enumerates his own: highs
  and lows, fair value gap, CISD, and EQ (the 50% fib) - and says the rest is just open/high/low/close
  logic, so realistically about three concepts. Targets are almost always daily highs and lows. Daily
  bias comes from the daily chart using highs and lows, candle closures and phases of price. He contrasts
  this with the failure mode of marking out a fair value gap, then a 50% level, then a rejection block
  as each one fails - which he reads as having no framework at all.'
category: model
status: specified
detection_rules:
- 'Chart objects: highs and lows, fair value gaps, CISD levels, EQ / 50% levels.'
- Everything else is derived from open / high / low / close relationships.
- Targets are daily highs and lows.
- Daily bias is built on the daily chart from highs and lows, candle closures and phases of price.
- If a level fails, do not substitute a new tool for it - that is the absence of a framework.
measurable:
- how many distinct primitives a detector needs vs this four-item list
sources:
- video_id: NESSCPMzWR0
  title: New York Open Live Q&A
  quote: realistically I use just like three concepts
- video_id: xraklBJHW5k
  title: New York Open Live Q&A
  quote: I almost always use daily highs and lows as targets
ambiguities:
- The count is given as 'like three' while four objects are named plus OHLC logic; he does not say
  which of the four he is folding together.
- Opposing candles / order blocks, protected swings and SMT are all used elsewhere in the same streams
  but are not in this enumeration - presumably because he considers them OHLC logic.
