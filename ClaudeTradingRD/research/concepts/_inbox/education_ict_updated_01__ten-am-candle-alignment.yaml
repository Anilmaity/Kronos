id: ten-am-candle-alignment
name: 10:00 And 14:00 Are 4-Hour Candle Opens
aliases:
- new 4-hour candle
- 10 a.m. open
category: time
status: specified
definition: '10:00 New York opens a new 4-hour candle (and sometimes carries news); 14:00 opens the
  next one. Combined with the 18:00 daily open he uses and the 06:00 4-hour candle he narrates in the
  same video, the implied grid is 18:00 / 22:00 / 02:00 / 06:00 / 10:00 / 14:00 New York. He uses these
  opens to frame the 4-hour power of three and to time retracements: a retracement inside a directional
  4-hour sequence is expected on the flip of a new 4-hour candle.'
timeframes:
  htf:
  - 4H
  ltf:
  - 1H
  - 15m
  - 5m
  fractal: false
detection_rules:
- Mark 10:00 and 14:00 New York as 4-hour candle opens.
- Frame the 4-hour open-high-low-close / power of three from those opens (bullish 4H = open, low, high,
  close).
- Expect a retracement at the flip of a new 4-hour candle when the prior 4-hour expanded.
- The 06:00 candle is used the same way in his examples, confirming an 18/22/02/06/10/14 grid.
measurable:
- share of 4-hour extremes formed within the first hour of the 4H open
sources:
- video_id: EYzP7c24AwM
  title: Important Time Levels For Trading
  quote: 10:00 is when we have a new 4-Hour candle and sometimes news
- video_id: EYzP7c24AwM
  title: Important Time Levels For Trading
  quote: 10:00 and 2:00 will be a 4-Hour candle
ambiguities:
- The 18:00/22:00/02:00 members of the grid are inferred from the 06:00 and 10:00/14:00 candles he narrates
  plus his 18:00 daily open; he never lists the six boundaries explicitly.
- He does NOT say in this video that any other timeframe (1H / 30m / 15m) opens simultaneously at 10:00
  — that claim is not supported by this source.
- The grid is index-specific; he warns the 4-hour candles change on forex.
