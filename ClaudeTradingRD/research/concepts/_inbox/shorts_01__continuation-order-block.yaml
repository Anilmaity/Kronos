id: continuation-order-block
name: Continuation Order Block (Continuation Entry)
category: entry
status: specified
definition: 'SHORTS EVIDENCE for the ideal-continuation shape and one extra gate. After an expansion
  leg, the move lower is classified by the NEXT candle: a reach into the fair value gap / point of interest
  plus a V-shaped recovery closing over the down-close candles makes it a retracement, and that closure
  PROTECTS the low. The extra gate given here concerns highs that get taken on the way: when price takes
  out a high, a CLOSURE THROUGH that high is required, not merely a wick through it.'
preconditions:
- An expansion leg in the direction of bias has printed.
- A point of interest (fair value gap) exists within the pullback.
detection_rules:
- Wait for price to reach into the fair value gap / point of interest.
- Require a V-shaped recovery closing over the series of down-close candles (bullish case).
- That closure protects the low - anticipate continuation of the trend.
- When price takes out a high on the way, require a CLOSURE through that high, not just a wick.
- If the recovery is slow instead, the structure is a consolidation, not a retracement.
invalidation:
- The protected low is traded through.
measurable:
- hold rate of the protected low after a V-shaped closure over the opposing series
- difference in continuation rate between wick-through and close-through of an intervening high
sources:
- video_id: oYwa0YfRaJ0
  title: Breaking Down an Ideal Continuation
  quote: we have a nice V-shaped recovery, closing over those down close candles
- video_id: oYwa0YfRaJ0
  title: Breaking Down an Ideal Continuation
  quote: we want to see a closure through that high
ambiguities:
- '''Closure through that high'' does not say on which timeframe the close is measured.'
- No depth requirement is given for the reach into the fair value gap.
