id: seek-and-destroy-profile
name: Seek & Destroy (defined, and explicitly not traded)
aliases:
- broadening formation as a weekly profile
- failure to displace both sides
category: model
status: specified
definition: 'Asked how he uses Seek & Destroy as a weekly profile, AM Trades answers that it is one
  of ICT''s profiles but not one of his, and that he never uses it. His definition is a profile in which
  the external range is continuously swept in both directions; his stated reason for not trading it
  is that the order flow is not clear. He gives the mechanical signature on an hourly chart: price fails
  to displace over the buyside, falls back into the range, fails to displace under the sellside, comes
  back in, and ends up stuck in the middle of the range. The host adds that this is what he would call
  a broadening formation.'
timeframes:
  htf:
  - 1W
  - 1D
  ltf:
  - 1H
  fractal: true
preconditions:
- A defined external range with a high and a low.
detection_rules:
- Price runs the external high and fails to displace above it, closing back inside.
- Price then runs the external low and fails to displace below it, closing back inside.
- Price settles in the middle of the range.
- When this signature is present, take no trades - the order flow is not readable.
invalidation:
- A displacement that holds outside one side of the external range ends the profile.
measurable:
- frequency of double-sided failure to displace per month
- P&L of trades attempted during this signature
sources:
- video_id: wGYde-h84cs
  title: Live Q&A with AM Trades - Weekly Profile
  quote: that's really just a profile where the external range is just being continuously swept
- video_id: wGYde-h84cs
  title: Live Q&A with AM Trades - Weekly Profile
  quote: not something I trade because the order flow isn't very clear
ambiguities:
- '''Fails to displace'' is not quantified - no close-through, size or candle-count threshold.'
- The guest calls it a profile ICT uses and he does not; the host maps the same shape onto 'broadening
  formation'. These are two different vocabularies for one price signature, not a disagreement about
  the signature.
related:
