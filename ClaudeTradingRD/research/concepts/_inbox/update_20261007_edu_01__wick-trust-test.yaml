ambiguities:
  - "'One more high' as the last chance is a single worked example, not a stated count; no clock-time cutoff is given."
  - "The choice between a single opposing candle and the full series is justified by a lower-timeframe structure shift that is shown, not defined."
  - "'Do I trust' remains a discretionary judgement; the IC-CISD is offered as its mechanical stand-in."
related: ["ic-cisd", "htf-opening-price-entry", "protected-swing", "cisd", "relevant-swing-separation"]
