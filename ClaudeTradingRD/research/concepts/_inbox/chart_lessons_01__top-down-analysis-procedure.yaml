ambiguities:
  - "Sourced from an ASR (whisper-small) transcript, not YouTube captions; wording may be imprecise."
  - "The starting timeframe varies by trade (weekly for the ES swing, monthly for the dollar analysis, hourly for the ES scalp) and no rule is given for choosing it."
  - "Chart Lessons #1 (video_id Nlw-PZhoViQ) has since been recovered by speech recognition and is now cited above. It does NOT contain an explicit framing statement of the procedure - it opens the series by saying only that it blends the channel's concepts into the current week's price action, and then demonstrates the same order of operations without naming it. The procedure remains a reconstruction from usage across all four videos."
  - "The step where a consolidation is distinguished from a retracement is decided by stated distrust of the move in videos UBTl7za9obc and IzOQmcgLyA0, but video Nlw-PZhoViQ supplies a mechanical alternative (no closure to continue expanding => consolidation) - see concept consolidation-vs-retracement-test."

