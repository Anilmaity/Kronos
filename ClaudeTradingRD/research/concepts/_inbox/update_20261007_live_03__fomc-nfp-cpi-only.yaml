id: fomc-nfp-cpi-only
name: Only Three Releases Are Tracked; Never Trade After FOMC
category: time
status: specified
definition: Distinguishes the FOMC minutes from the FOMC rate decision. The minutes (released at 2 p.m.
  that day) do not bring volatility and are ignored; only the actual FOMC (federal funds rate, statement,
  economic projections) does. With no USD 8:30 news and only crude inventories and minutes on the calendar,
  he cared about no news that day.
detection_rules:
- FOMC minutes are not treated as an FOMC event.
