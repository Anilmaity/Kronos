ambiguities:
- 'Anchor ambiguity: the video says to project the manipulation leg but anchors ''from our high to
  our low'', which combined with the indicator drawing ''from the bodies'' gives at least two possible
  anchor conventions (wick-to-wick vs body-to-body).'
- '''-2 to -2.5'' is a band, and no rule is given for which edge to use for an order.'
- The relationship between these projections and the previous-candle-extreme targets (A4NasIa371c)
  is never stated - both are called targets and they do not generally coincide.
