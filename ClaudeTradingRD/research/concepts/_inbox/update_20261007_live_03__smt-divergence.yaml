id: smt-divergence
name: SMT Divergence
category: liquidity
status: contested
definition: 'Two refinements stated live. (1) A STRUCTURAL SMT - correlated assets diverging at a range
  low or high, e.g. silver running out a range low while gold does not - is a different thing from the
  SMT inside the model''s swing point, and may be read before the model''s candle closes. His videos''
  rule to look for SMT only after a C2/C3 closure applies to the swing-point type, and exists to stop
  people shorting a bare SMT. (2) SMT is confirmed by a change in the state of delivery. Worked example:
  gold forms a C2 reversal with silver taking the range low and gold not, so gold (closer to the highs,
  strongest) is the long toward the range high; he would not have bought gold until silver ran the low
  (around 15:00 the previous day). Counter-trend framing off a set of highs needs the correlated asset
  to sweep a high first - without that SMT he will not short against the highs.'
detection_rules:
- Classify an SMT as structural (at a range extreme / previous-day level) or swing-point (inside the model's
  C2).
- A structural SMT can be read before the model's closure; a swing-point SMT only after a C2/C3 closure.
- Treat the SMT as confirmed only once a CISD occurs.
- Do not frame a counter-trend trade off highs unless a correlated asset sweeps those highs while the
  traded one does not.
measurable:
- hit rate of the range-opposite extreme after a structural SMT confirmed by CISD vs unconfirmed
sources:
