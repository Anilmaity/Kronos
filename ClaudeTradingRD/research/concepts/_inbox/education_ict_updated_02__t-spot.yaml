id: t-spot
name: The T-Spot
aliases:
- t-spot
- where the higher time frame wick forms
category: entry
status: underspecified
definition: 'In this unit the t-spot is defined purely functionally: it is the area in which the
  higher-timeframe wick is expected to form, drawn by his indicator once the higher-timeframe sweep-and-closure
  and the lower-timeframe alignment are both present. Its operational uses are stated clearly - it
  is where a lower-timeframe point of interest is looked for, and it doubles as a diagnostic: if
  the t-spot has already formed the wick of the higher-timeframe candle, that is what he wants to
  see; if the higher-timeframe wick is missing, price can be anticipated to retrace into the t-spot
  to build one. A t-spot that prints large is a reason NOT to take a positional entry, because the
  stop below its lows makes the risk-to-reward unworkable.'
timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- A higher-timeframe sweep and closure back inside.
- The paired lower timeframe aligned in the same direction.
detection_rules:
- The t-spot is only marked AFTER the higher-timeframe closure and the lower-timeframe alignment
  (confirmation) have occurred.
- Look for a PD array or point of interest inside the t-spot; that is where the lower-timeframe entry
  is sought.
- If the higher-timeframe wick is absent, anticipate a retrace into the t-spot to form it.
- If the t-spot is large, do not take a positional entry - wait for price to reach back into it.
- Chart settings are locked to the model's two timeframes so the t-spot persists while dropping to
  lower timeframes.
invalidation:
- Price trading beyond the far side of the t-spot / the wick extreme it defines.
measurable:
- share of higher-timeframe wicks that terminate inside the marked t-spot
- return rate into the t-spot after alignment
- R:R distribution of positional entries by t-spot size
sources:
- video_id: 4jU547ocod4
  title: TTrades Fractal Model + Inversion (Intraday Strategy)
  quote: the area in which I expect this higher time frame Wick to form
ambiguities:
- The t-spot's construction is never given in this unit - it is produced by his paid indicator, so
  the level cannot be reproduced from this source alone.
- '''A bit large'' as the disqualifier for a positional entry is not quantified.'
- Whether the t-spot is derived from the higher-timeframe candle, the lower-timeframe one, or the
  overlap of both is not stated here.
