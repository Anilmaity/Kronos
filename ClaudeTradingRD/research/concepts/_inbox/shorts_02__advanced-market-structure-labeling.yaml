id: advanced-market-structure-labeling
name: Short-Term / Intermediate-Term / Long-Term Highs and Lows
category: structure
status: specified
definition: 'Three Shorts assemble the ladder and, critically, define the LONG-term extreme by CAUSE
  rather than by nesting: a long-term low is the low formed off the reaction of the higher-timeframe
  level. Having found it, look left for the intermediate-term low (a short-term low with a short-term
  low either side). Worked live, the sequence is watched forward: short-term highs accumulate, a long-term
  high is confirmed once a short-term high forms on the other side of it, and an intermediate-term high
  is confirmed once a short-term high forms to its right. Once the intermediate-term high is in, he
  does not expect price to reach back up to it before delivering to the original consolidation / sellside
  liquidity.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 5m
  fractal: true
preconditions:
- A higher-timeframe level has been reached and reacted from.
- Short-term highs and lows are being marked on the execution timeframe.
detection_rules:
- Long-term low / high := the extreme formed off the REACTION of the higher-timeframe level.
- From the long-term extreme, look left for the intermediate-term extreme.
- Confirmation of the long-term high requires a short-term high to form on the other side of it.
- Confirmation of an intermediate-term high requires a short-term high to form on its right side.
- Once the intermediate-term high is confirmed, do not expect price to trade back up to it before delivering
  to the original consolidation / sellside liquidity.
invalidation:
- Price returns above the confirmed intermediate-term high before reaching the sellside objective.
measurable:
- how often price returns to a confirmed intermediate-term high before reaching the opposite objective
- time from long-term-high confirmation to the sellside target
sources:
- video_id: A8SneEwpQrc
  title: 'Key Market Levels: Long, Intermediate & Short Term Lows and Highs'
  quote: the low that is formed off the reaction of the higher time frame level
- video_id: Rpu0iLIfaSw
  title: Market Structure is the Key to Trading Success.
  quote: I want to see a short-term high on the other side of it
- video_id: d0x29IO1CQQ
  title: Intermediate Term Lows and Highs role in Market Structure
  quote: A short-term low is when we form a swing low
ambiguities:
- The Shorts use "long-term" and "intermediate-term" confirmation in adjacent sentences on the same
  chart with the same evidence (a short-term high on the right), so the two definitions overlap and
  the clip does not disambiguate them.
- Which higher-timeframe level qualifies to create a long-term extreme is not specified in these clips.
- The live example (Asia highs swept, London up-close candle order block, 5-minute execution) is described
  but the instrument is never named.
