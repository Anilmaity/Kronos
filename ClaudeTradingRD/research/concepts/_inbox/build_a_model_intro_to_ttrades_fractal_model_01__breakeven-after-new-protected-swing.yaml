ambiguities:
- '''How much range is left'' is judged by eye against the average daily range; no calculation is
  given.'
- '''High RR'' - the point at which aggressive trailing becomes appropriate - is not quantified (examples
  show 4-5R already banked).'
- Whether to move to break-even when no protected swing appears there is not addressed.
