id: advanced-market-structure-labeling
name: Short-Term / Intermediate-Term / Long-Term Highs and Lows
aliases:
- advanced market structure
- STH/STL
- ITH/ITL
- LTH/LTL
category: structure
status: specified
definition: A three-tier swing labelling scheme, credited by him to 'the mxm trader'. A short-term low
  is a swing low (a low with a higher low on each side); a short-term high is a high with a lower high
  on each side. An intermediate-term low is a short-term low with a HIGHER short-term low on both its
  left and its right; an intermediate-term high is a short-term high with a short-term high on each
  side. There is a second kind of intermediate-term point — the 'rebalanced' one — created when price
  rebalances a fair value gap and trades away. A long-term low is the low formed off the reaction to
  a higher-timeframe level, validated once a short-term low prints on its right side (mirrored for highs).
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 1H
  - 5m
  - 1m
  fractal: true
preconditions:
- A higher-timeframe level / PD array is identified for the long-term point.
detection_rules:
- Short-term low = a low with a higher low immediately either side. Short-term high = a high with a
  lower high either side.
- Intermediate-term low = a short-term low that has a higher short-term low on both its left and its
  right side.
- 'Intermediate-term high = a short-term high with a short-term high on both sides (in practice: a short-term
  high is swept, then another short-term high forms to its right).'
- Rebalanced intermediate-term point = price trades into a fair value gap, rebalances it, and trades
  away; that turn is an intermediate-term point regardless of the short-term pattern.
- Long-term low/high = the extreme formed off the reaction to a higher-timeframe level, confirmed once
  a short-term point forms on its right side and price trades away.
- Once an intermediate-term point is confirmed, he does not expect it to be violated while the directional
  idea holds.
invalidation:
- A confirmed intermediate-term low being violated invalidates the bullish read (mirrored for highs).
execution:
  bias: Direction away from the confirmed long-term point.
  entry: A short-term high/low used as the entry reference when the chart is choppy and no clean fair
    value gaps exist.
  stop: Beyond the intermediate-term point that should not be violated.
  targets:
  - The drawn liquidity that produced the higher-timeframe reaction
measurable:
- survival rate of confirmed intermediate-term lows (not violated) within N bars
- count of ITL/ITH per session by timeframe
