ambiguities:
- The PDF definition of an intermediate-term point ('a short-term low with a higher short-term low on
  the right and left') and the chart procedure he actually narrates ('a short-term low is swept, then
  a short-term low forms on the other side') are not obviously the same test — the chart version adds
  a sweep.
- The rebalanced intermediate-term point has no rule for how deep into the FVG price must trade.
- He says he 'often' prefers an intermediate-term high to be taken to call a structure shift, rather
  than any short-term high; this is stated as a habit, not a rule.
- 'This video is his own (voice: ttrades) but the library entry for this id was first built from a guest
  — the merged entry will span both.'
