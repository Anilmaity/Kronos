ambiguities:
- '''Strength'' is read visually from the correlated-asset display of his own indicator; no percent-change
  or normalisation formula is given.'
- On one stream he takes the weakest asset (ES) for a short because YM had too many failure swings
  - so 'never trade the lagging' is about the extreme of the ranking, and the weakest/strongest labels
  move with direction.
- The rule is stated for the three US index futures only.
