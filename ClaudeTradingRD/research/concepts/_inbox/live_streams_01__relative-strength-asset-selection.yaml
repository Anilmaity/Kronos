id: relative-strength-asset-selection
name: Ranking Correlated Assets And Trading The Middle One
definition: 'Rank ES, NQ and YM by strength each session. The lagging (extreme) asset is never traded
  - only the middle one. In practice ES is described as usually in the middle, which is why a viewer
  struggling to choose a pair is told to just focus on ES. NQ or YM lead in one direction more than
  90% of the time; sessions where ES is the strongest are called weird and rare. Direction picks the
  side of the ranking: bullish means focus on YM or ES, bearish means NQ or ES. He also declines assets
  that have already expanded too far, and warns that the ranking can switch at the open and can differ
  between timeframes - when it does, trade the one that is aligned on the lower timeframes.'
category: structure
status: contested
detection_rules:
- Rank ES / NQ / YM by relative strength for the session.
- Never trade the lagging extreme; trade the middle asset.
- 'Bullish: YM or ES. Bearish: NQ or ES.'
- Re-check the ranking at the open - it can switch.
- If the ranking differs between higher and lower timeframes, take the asset aligned on the lower
  timeframes.
- Skip an asset that has already completed its expansion, even if it ranks correctly.
measurable:
- expectancy of trading the middle asset vs the extreme asset on the same signal
- frequency with which the ranking switches between the pre-open and the open
sources:
