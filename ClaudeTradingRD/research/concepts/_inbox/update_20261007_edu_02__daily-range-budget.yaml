id: daily-range-budget
name: Daily Range Budget (Eyeballed, Not ADR)
category: risk
status: underspecified
voice: ttrades
definition: >
  Applied on gold in the London model: a 4-hour candle 2 with 'a little bit of a wick' is still
  traded because the daily range of recent expansion candles is around 100 points and the day is only
  halfway through it, so 'we still have a lot of range left'. The wick is judged against the remaining
  daily range, not in isolation.
detection_rules:
- Estimate the daily range of recent expansion candles (gold example ~100 points).
- If roughly half or more remains, a moderate 4-hour wick does not disqualify the trade.
measurable:
- outcome by fraction of expected daily range remaining at entry
sources:
- video_id: tUbrCewFdCU
  title: How to Trade London Using TTrades Fractal Model
  quote: our daily range of these expansion candles around 100 points
- video_id: tUbrCewFdCU
  title: How to Trade London Using TTrades Fractal Model
  quote: We have a small enough wick to still allow for range
ambiguities:
- 'Halfway is the only threshold implied; the 100-point figure is one example on gold futures.'
related:
