id: wick-trust-test
name: Let the Wick Form, Trade the Body (Wick Trust Test)
aliases:
- confirming this wick
- cannot confirm this wick high
category: structure
status: specified
definition: 'This unit supplies the confirmation half of the test in unusually plain terms: a wick
  is not confirmed by its shape alone. A shallow run above the previous extreme with no change in
  the state of delivery is explicitly shown failing, and he states that without the CISD the wick
  high cannot be confirmed. The second condition is time-of-day rather than shape: the extreme should
  form early in, or before, the New York session so that New York is left to expand.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- Price has traded into the anticipated wick-formation area of an open candle.
detection_rules:
- The extreme is reached early into the higher-timeframe candle, not midway through it.
- The reach into the extreme is a shallow opposing run, not a deep one.
- A lower-timeframe change in the state of delivery has closed through the series that made the extreme
  - without it the wick is NOT confirmed, however shallow it looks.
- 'Session condition: prefer the extreme to form early New York or before New York, leaving New York
  to expand.'
- If the extreme is reached but price only consolidates there, the wick is not formed - wait for another
  run at the level or for the next candle.
invalidation:
- Price returns through the extreme.
- Price consolidates at the extreme instead of displacing away.
measurable:
- rate at which a shallow-run extreme without a CISD is subsequently exceeded
- expansion distance conditioned on time-of-day of the extreme
sources:
- video_id: SlWxhzhLo3A
  title: 'Wick Size Matters: The Key to Understanding Reversal and Expansion Candles'
  quote: Without that change in the state of delivery there, we cannot confirm this wick high
- video_id: SlWxhzhLo3A
  title: 'Wick Size Matters: The Key to Understanding Reversal and Expansion Candles'
  quote: paired with a change in the state of delivery, it's then confirming this wick
- video_id: SlWxhzhLo3A
  title: 'Wick Size Matters: The Key to Understanding Reversal and Expansion Candles'
  quote: we want to see this high day form early New York or before New York
ambiguities:
- '''Early into the candle'' is never quantified as a fraction of the period.'
- '''Early New York or before New York'' is a session window, not a clock time; no cut-off is given.'
- The timeframe on which the confirming CISD must appear is not fixed here - the examples use the
  hourly under a daily and the 1-minute under a 15-minute.
