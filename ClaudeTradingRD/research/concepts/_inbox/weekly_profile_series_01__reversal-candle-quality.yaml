ambiguities:
  - "'Candle 2 closure' itself is assumed knowledge from the TTrades Fractal Model playlists; its sweep-and-close-back definition is never restated anywhere in this unit, so this entry describes quality filters on a term this unit does not define."
  - "'Reversal looking candle' is treated as categorically different from a candle 2 closure and is acted on, but is never defined."
  - "The open-low-high-close test is a statement about the intracandle path, which is not recoverable from daily OHLC alone - it needs lower-timeframe data or an explicit rule the videos do not give."
  - "'Somewhat of a bearish expansion candle' is used to describe a candle 2 closure that is accepted anyway with extra hourly confirmation, so the OLHC test is a preference rather than a hard filter."
  - "Wick size thresholds are relative and unquantified: 'larger wick' triggers the 0.5-of-wick marking, and 'small wick' versus 'large wick' carry opposite meanings in the Thursday Counter video."
  - "Status is underspecified because every test in it is comparative or visual rather than numeric."

python_detector: null
