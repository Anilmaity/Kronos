id: reversal-candle-quality
name: "Candle 2 Closure Quality (reversal candle vs expansion candle)"
aliases: ["reversal candle", "reversal looking candle", "ideal candle 2 closure", "two-sided candle 2"]
category: structure
status: underspecified

definition: >
  A set of quality tests the speaker applies to a daily candle 2 closure before he will
  trade away from it. The primary test is the candle's internal sequence: a bullish
  reversal candle should be open-low-high-close, whereas an open-high-low-close candle is
  an expansion candle and is explicitly rejected as a reversal even when it closes in the
  right place. Secondary markers of an ideal candle 2 closure are that it also forms a
  protected swing, and that it sits at a point of interest. Two degraded cases are named
  and handled: a candle that is merely 'reversal looking' without being a candle 2 closure
  is not tradeable on its own and requires waiting for the next day's closure; and a
  candle that is simultaneously a bullish and a bearish candle 2 closure is low quality,
  resolved by taking only the side that carries an hourly change in the state of delivery
  and by demanding additional intraday confirmation.

timeframes:
  htf: ["1D"]
  ltf: ["1H"]
  fractal: true

preconditions:
  - "A daily candle has closed and is a candidate reversal for a weekly profile."

detection_rules:
  - "Bullish candidate: require the sequence open, low, high, close. Reject open, high, low, close - that is an expansion candle."
  - "Bearish candidate: the mirror - reject a candle that opened, made its low first and then its high."
  - "Prefer a candidate that also forms a protected swing and that sits at a point of interest."
  - "If the candle is a candle 2 closure on both the bullish and the bearish side, take only the side that carries an hourly change in the state of delivery, and additionally wait intraday for price to open, make its extreme, and form a new continuation before entering."
  - "If the candle is only 'reversal looking' and is not a candle 2 closure, do not trade it - let the next daily candle close and use that closure plus the hourly CISD as the confirmation instead."
  - "On a candle 2 closure with a large wick, mark 0.5 of the wick as the level price should reach and react from."

invalidation:
  - "The candidate is an opposing expansion candle - do not call the reversal, let another day play out."
  - "The additional intraday confirmation fails: price does not respect the area it was required to respect."
  - "On a monthly-scale candle 2, 50% of the candle stops being respected."

measurable:
  - "hit rate of open-low-high-close candle 2 closures versus open-high-low-close candles as weekly-extreme triggers"
  - "frequency of two-sided candle 2 days and their outcome once filtered by which side carries the hourly CISD"
  - "how often the 0.5-of-wick level is reached and reacted from on a large-wick candle 2"
  - "outcome difference when the candle 2 closure also forms a protected swing versus when it does not"

