id: tgif-setup
name: TGIF Setup
category: model
status: specified
definition: 'SHORTS EVIDENCE showing the full weekly qualification then the Friday execution. The week
  runs: expansion, a retracement into Monday, a Tuesday candle 2 closure (described as ideal), then
  continuation on Wednesday and Thursday into an objective - here a high to the left. Once the objective
  is hit, all the requirements for a valid TGIF are met and the trade is the reversal back. If Thursday
  has not formed the reversal on the hourly, Friday is expected to form it: take the previous high,
  then require either candlestick confirmation or a change in the state of delivery. With a candle 2
  closure in hand, mark 0.5 of the wick and wait for price to reach up into it, print an intra-candle
  change in the state of delivery, and trade lower.'
preconditions:
- The week has already delivered expansion and a mid-week continuation.
- A weekly objective (a high or low to the left) has been reached.
detection_rules:
- Require the week's objective to be hit before calling the TGIF valid.
- Check on the hourly whether Thursday already formed the reversal; if not, expect Friday to.
- On Friday, require the previous high (or low) to be taken.
- Require candlestick confirmation OR a change in the state of delivery before entering.
- With a candle 2 closure, mark 0.5 of its wick as the entry zone.
- Enter on the intra-candle change in the state of delivery inside that zone.
measurable:
- share of weeks where the objective is reached by Thursday close
- hit rate of the 0.5-of-wick zone on Friday
