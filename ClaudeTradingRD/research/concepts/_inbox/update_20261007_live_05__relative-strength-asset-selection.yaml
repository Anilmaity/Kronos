id: relative-strength-asset-selection
name: Ranking Correlated Assets And Trading The Middle One
category: structure
status: contested
aliases:
- I never trade the lagging asset
- middle asset
definition: 'Restated live with two additions. (1) When to trade ES instead of NQ: NQ is weakest and has
  already hit its low and continued through it, YM (strongest) has just reversed off a high, and ES (middle)
  has not yet reached the corresponding low - then trade ES back to that low. (2) A later continuation
  in the weakest asset needs the other assets to supply SMT: YM or ES must run its previous high (or reach
  into a gap) while NQ does not, after which NQ can continue to the previous day low. He never trades
  the lagging asset (here YM while bearish) but may trade the middle one. At a new 15-minute candle the
  ranking switched (ES became the middle); he then expects NQ to consolidate or drift while ES moves.'
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 15m
  - 3m
  fractal: false
detection_rules:
- Never trade the lagging asset (the strongest when bearish).
- Trade ES when the weakest has already gone through the target low, the strongest has reversed, and ES
  has not yet reached its low.
- For a later continuation in the weakest asset, require the stronger asset(s) to run a previous high
  while the weakest does not (SMT).
- Re-rank at each new 15-minute candle; a switch moves the expected mover to the new middle asset.
