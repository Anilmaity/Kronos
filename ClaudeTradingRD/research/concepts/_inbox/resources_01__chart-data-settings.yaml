id: chart-data-settings
name: Chart Data Settings (back-adjust on, settlement off)
definition: 'The same two futures data settings, demonstrated on screen in this unit with the reason
  for each. Back-adjust (adjusting for contract changes) is ON: with it off, the rollover shows as
  a visible break where the two contracts are simply stitched together; with it on the series is
  combined and made more fluid. Settlement is OFF: he shows the daily candles changing materially
  when it is toggled and points to specific days that would have changed his bias, and says it gives
  him cleaner candles. The TradingView tutorial in the same unit repeats the trio as a settings checklist
  - electronic trading on, adjust for contract changes on, settlement off - and adds that the chart
  is always in New York local time, with a solid background, no grid lines, and a real-time data
  subscription (without which the feed is delayed about 15 minutes).'
category: risk
status: contested
aliases:
- back adjust
- B adjust
- settlement
- electronic trading
- contract changes
preconditions:
- A continuous futures chart with a contract roll in the visible history.
detection_rules:
- 'Back-adjust / adjust for contract changes: ON.'
- 'Settlement: OFF.'
- 'Electronic trading (full session): ON.'
- 'Chart timezone: New York local time.'
- With back-adjust off, rollovers appear as stitched-together segments with visible breaks.
- Toggling settlement changes daily candles enough to change the daily bias on some days.
- Real-time data requires a paid feed subscription; without it the series is delayed about 15 minutes.
invalidation:
- Not applicable - data configuration.
measurable:
- count of daily candles whose classification changes between settlement on and off over a year
- count of level breaks that disagree between adjusted and unadjusted series
