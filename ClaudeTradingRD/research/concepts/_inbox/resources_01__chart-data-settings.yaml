ambiguities:
- One sentence in the futures video reads 'I have found that settlement works best for my strategy'
  immediately after he says he has settlement turned OFF; the on-screen demonstration and the TradingView
  video both show it off, so the sentence is treated as a misspeak or caption error rather than a
  second reading.
- The back-adjustment method (difference vs ratio) is still not stated - only that it combines the
  contracts without a gap.
- The exact data-feed product and price are shown on screen but not spoken, so they are not recorded.
