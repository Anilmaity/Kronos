id: weekly-profile-alignment
name: "Weekly Profile Alignment"
aliases: ["classic expansion", "consolidation reversal", "midweek reversal"]
category: model
status: underspecified

definition: >
  Naming the shape of the week from the days that have already printed, then trading the remaining
  days as continuations of that shape. The profile is only assigned after a manipulation has been
  confirmed on the hourly; it is never predicted from the news calendar alone. Three profiles are
  named in this video.

timeframes:
  htf: ["1W", "1D"]
  ltf: ["1H"]
  fractal: false

preconditions:
  - "At least Monday (and usually Tuesday) has closed, so there is profile data to reference."
  - "An hourly change in state of delivery has confirmed the manipulation."

detection_rules:
  - "Classic expansion - Monday makes the high (or low) and Tuesday continues; the rest of the week extends that direction."
  - "Consolidation reversal - Monday, Tuesday and Wednesday consolidate, Thursday reverses out of the range, Thursday and Friday continue."
  - "Midweek reversal - Monday consolidates, Tuesday runs one way, Wednesday reverses, Thursday and Friday continue."
  - "Assign the profile only after the confirming hourly change in state of delivery; from then on trade continuations at New York open on the remaining days."

invalidation:
  - "An overnight move that trades deep back into the range with no signature to get on side invalidates the profile; the following day is then avoided (demonstrated in the classic-expansion week)."

execution:
  bias: "The direction of the confirmed profile."
  entry: "New York AM open on each remaining day, using bearish/bullish daily profiles for the intraday confirmation."
  stop: "Not stated."
  targets: ["the external low or high the weekly range is drawing to"]

measurable:
  - "frequency of each named profile per quarter"
  - "hit rate of continuation entries on the days after profile confirmation"
  - "how often a confirmed profile is invalidated overnight"

sources:
  - video_id: QmGJFxfSHxM
    title: "AM Trades | Blending The Economic Calendar, Daily Chart, & Weekly Profiles"

ambiguities:
  - "Only three profiles are named here; the complete profile set is assumed from material outside this video."
  - "The definitions above are reconstructed from the three worked weeks - he never states them as definitions."
  - "No rule for the case where the week's days fit two profiles."
  - "'Bearish daily profiles' are referenced as the intraday confirmation layer but not taught here."

python_detector: null
related: ["daily-phases-of-price-delivery", "hourly-cisd-manipulation-confirmation", "no-monday-rule", "nfp-week-protocol"]
