id: relevant-swing-separation
name: Relevant Swings Require Separation
category: structure
status: contested
voice: ttrades
definition: >
  Two Shorts. Highs that sit close to the previous high are failure swings and are not traded away
  from; a reversal off a low is trusted because it has valid separation from the prior low. He
  states plainly there is no mechanical rule for separation - it is experience and discernment.
  A gap (FVG) sitting close to an unswept relevant high is not a place to look for a reversal;
  after that high is taken, the next relevant highs/lows (those with a lot of separation from the
  prior swing) become the levels to look for a reaction.
detection_rules:
- Do not trade away from highs that are close to the previous high (failure swings).
- Do not look for a reversal at a gap that sits close to an unswept relevant high.
- After the relevant high is taken, re-mark the relevant highs and lows and look for a reaction there.
- A low with a lot of separation from the previous low is relevant.
sources:
- video_id: 91I_Pq2pZ2Y
  title: Finding Points of Interest With Relevant Swings
  quote: I don't have a mechanical reason to say, "Hey, this is valid separation."
- video_id: 91I_Pq2pZ2Y
  title: Finding Points of Interest With Relevant Swings
  quote: Because it has valid separation to this low.
- video_id: vHvYT6bmaQM
  title: Look for Price to React at Relevant Swings
  quote: Not really cuz we're so close to this high.
- video_id: vHvYT6bmaQM
  title: Look for Price to React at Relevant Swings
  quote: There is a lot of separation between the previous low.
ambiguities:
- Separation is explicitly discretionary ("comes with experience"); no threshold, confirming the library's existing gap.
- '"So close to this high" for the gap is likewise unquantified.'
