ambiguities:
- The sub-tiering of red-folder events into high/medium/low is shown as a slide list, not a rule — CPI/FOMC/NFP
  are high and PPI is medium in his examples, but no general assignment procedure is given.
- '''Avoid the session prior'' assumes a session grid that is not defined in this video.'
- '''Watch after'' is not an entry permission; he pairs it with the weekly profile before trading.'
- Whether the Monday skip yields to a Monday high-impact release is not addressed.
