id: economic-calendar-filter
name: Economic Calendar Filter (three-tier news avoidance)
aliases:
- how to use the economic calendar
- news filter
category: time
status: specified
definition: 'A fully mechanical news filter. Filter forexfactory.com''s calendar to the currency of
  the instrument traded and to the red-folder (high-impact) events only. Then sub-tier those red-folder
  events into high, medium and low impact and apply fixed rules — credited to AM Trades: HIGH impact,
  avoid the day prior, avoid the release, watch after; MEDIUM impact, no need to avoid the day prior
  but avoid the SESSION prior, avoid the release, watch after; LOW impact, no restrictions. Layered
  on top is his own standing rule: skip Mondays, and avoid trading before the first high-impact event
  of the week.'
timeframes:
  htf:
  - 1W
  - 1D
  ltf: []
  fractal: false
preconditions:
- The instrument's driving currency is known (US dollar for NQ/ES; both currencies for a cross such
  as AUDCAD).
detection_rules:
- On forexfactory.com open the calendar and filter to the instrument's currency.
- Filter to the red folder / high impact only; drop medium and low.
- Sub-tier the remaining events into high / medium / low impact (FOMC and NFP are high; CPI is high;
  PPI is medium in his example).
- 'High impact: no trading the day prior, none through the release, watch after.'
- 'Medium impact: trading allowed the day prior, but not in the session prior, none through the release,
  watch after.'
- 'Low impact: no restriction.'
- 'Standing rules: skip Monday; do not trade before the week''s first high-impact event.'
- 'NFP week: focus on Friday post-release; also watch Tuesday and Wednesday; avoid Thursday as the day
  prior.'
- The output is a list of tradeable days computed at the START of the week.
invalidation:
- None stated — it is a hard calendar filter applied before any chart work.
measurable:
- number of tradeable days per week produced by the filter
- performance on filtered-out days vs kept days
