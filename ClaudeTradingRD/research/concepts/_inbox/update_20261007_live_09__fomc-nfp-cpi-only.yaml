id: fomc-nfp-cpi-only
name: Only Three Releases Are Tracked; Never Trade After FOMC
category: time
status: contested
definition: 'Stated as his only news rule: he avoids the day of CPI, NFP and FOMC (and days where they
  coincide). He does not care much about the day before FOMC and thinks it can have fine moves, and he
  denies ever saying to avoid the session before PPI.'
preconditions:
- A CPI, NFP or FOMC release is scheduled.
detection_rules:
- Skip trading entirely on the day of a CPI, NFP or FOMC release.
- The day before FOMC is tradeable.
- PPI is not a filter.
invalidation:
- Not applicable - a calendar filter.
measurable:
- expectancy on CPI/NFP/FOMC days vs other days
- expectancy on the day before FOMC vs other days
sources:
- video_id: Hlwq1dRjBZo
  title: New York Open Live Q&A
  quote: I avoid the day of CPI and NF NFP and NFP FOMC CPI same day
- video_id: Hlwq1dRjBZo
  title: New York Open Live Q&A
  quote: I don't really care too much about the day before FOMC
ambiguities:
- Conflicts with the library's 'do not trade after the FOMC release' (implies trading before it) and with
  pre-event-avoidance-rule (avoid days before); this stream says avoid the whole release day.
related:
- fomc-day-participation
- pre-event-avoidance-rule
- economic-calendar-filter
voice: ttrades
