id: mechanical-trade-management
name: "Mechanical Management - Validation Or Invalidation Only"
aliases: ["no break even", "no trailing", "fixed 2R"]
category: risk
status: contested

definition: >
  A management doctrine in which the only two outcomes permitted after entry are the stop and the
  target. Entry, stop and take-profit are all set as resting limit orders at the moment of entry
  and are never adjusted. Break-even moves, trailing stops and partial profit-taking are all
  refused, on the stated grounds that they convert a correct idea into a break-even outcome. Other
  speakers in this unit manage actively, so this is recorded as contested.

timeframes:
  htf: []
  ltf: []
  fractal: false

preconditions:
  - "A model whose entry, stop and target are all defined before entry."

detection_rules:
  - "Ash's rule: set a limit entry at the beginning of the breaker, a limit stop on the other side of the breaker, and a limit take-profit at 2R. Then do nothing."
  - "Ash's rule: do not move to break even, do not trail, do not trim - the position either validates or invalidates."
  - "Ash's supporting case: he shows a trade that pulled back close to entry and would have stopped a trailed position at break even, then ran to 2R."
  - "AP's contrary practice: he exits at the shallow levels, then looks for continuation re-entries once de-risked, and explicitly says trailing and managing positions matter."
  - "DTR's contrary practice: he takes the nearest 'low hanging fruit' target for 2 to 2.5R but notes he could have trimmed and trailed for more, and describes a four-hour trade held through drawdown with a second tag-in."

invalidation:
  - "Not applicable - this is a management doctrine."

execution:
  bias: "Unchanged."
  entry: "Limit, unmanaged."
  stop: "Limit, unmoved."
  targets: ["a fixed 2R (Ash)", "nearest session level for 2 to 2.5R (DTR)", "shallow fib band then re-entry (AP)"]

measurable:
  - "expectancy of the same entry set managed three ways - fixed 2R, break-even-then-run, and trail"
  - "proportion of trades that would have been stopped at break even before reaching 2R"
  - "R lost to trimming versus R gained by avoiding full stop-outs"

sources:
  - video_id: zXtJSSkiNmo
    title: "Ash Trades | The Journey To Profitability & The Unicorn Model"
    quote: "I do not accept break even I do not Trail my position"
  - video_id: gjoRPszj-Qk
    title: "AP | Use Market Structure & Fibonacci Levels for Sniper Entries"
  - video_id: 07lOxv39LdY
    title: "DTR | C2U - Blending The Fractal Model & Unicorn Model - No Daily Bias"

ambiguities:
  - "Contested across three speakers with no shared test - the disagreement is doctrinal, and none of them cites data."
  - "Ash gives no exception for a 2R target sitting beyond an obvious obstacle."
  - "AP and DTR describe management by feel without stating trailing rules, so their side of the conflict cannot be backtested as specified."

python_detector: null
related: ["unicorn-model", "risk-limits-and-trade-frequency", "low-hanging-fruit-target", "model-persistence-through-drawdown"]
