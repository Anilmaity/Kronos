ambiguities:
- '''High resistance'' is never quantified.'
- In a previous unit the same guest allowed a Tuesday exception on a 'really specific and convincing
  signature'; here the exception is narrowed to Monday engaging a HTF PD array. The two statements are
  compatible but not identical.
- The host's concurrence is softer ('I usually don't even trade Mondays') than the guest's absolute.
