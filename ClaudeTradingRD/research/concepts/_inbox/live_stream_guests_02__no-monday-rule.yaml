id: no-monday-rule
name: Never Trade Monday
aliases:
- I never trade Mondays
- Monday is data
category: time
status: specified
definition: 'AM Trades states the rule absolutely and the host concurs on air, so this is a genuine
  point of agreement between them in this episode. AM gives three reasons: Monday is usually high-resistance
  accumulation; there is never high-impact news on a Monday, so volatility does not enter until Tuesday
  at the earliest; and if you rely on weekly profiles you have no data for the week yet when Monday
  opens. Monday''s role is to BE the data - what Monday does is the input that lets you anticipate the
  profile for the rest of the week. His only stated exception is that Tuesday can offer a trade if Monday
  engaged a higher-timeframe PD array, which he says does not always happen.'
timeframes:
  htf:
  - 1W
  - 1D
  ltf: []
  fractal: false
preconditions: []
detection_rules:
- Do not take trades on Monday.
- Record Monday's range and whether it engaged a higher-timeframe PD array.
- If Monday engaged a higher-timeframe PD array, Tuesday becomes a candidate trading day.
- If it did not, wait for the first high-impact news driver of the week.
invalidation: []
measurable:
- Monday range vs the other four days, per instrument
- hit rate of Tuesday setups conditioned on Monday engaging a HTF PD array
