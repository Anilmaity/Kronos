name: The MMXM Trader's "Twitter Model"
aliases:
- Next Day Model
- the mmxm Traders Twitter model
category: model
status: contested
definition: 'EARLIER RECORDING OF A DIFFERENT MODEL UNDER THE SAME NAME - the single most important divergence
  in this unit. This video is titled ''Next Day Model'' and presents what it calls the MMXM Trader''s
  Twitter model as FIVE CONDITIONS THAT ARE ENTIRELY ABOUT TIMING AND SELECTION, not about price patterns:
  (1) skip Mondays; (2) focus on the New York session only; (3) execute on the 15-minute chart; (4) use
  the economic calendar as the roadmap; (5) trade the DAY AFTER the anticipated higher-timeframe level
  is hit. The later re-recording (WwmS47Gb3M0), which the library holds as canonical under this id, gives
  a completely different five-condition list - previous-day-extreme raid, hourly opposing fair value gap
  target, 15-minute structure shift, SMT, and the midnight-open side gate. Only the 15-minute execution
  is common to both.'
timeframes:
  htf:
  - 1W
  - 1D
  - 1H
  ltf:
  - 15m
  fractal: false
preconditions:
- A higher-timeframe level (daily fair value gap, daily order block, daily PD array) is marked in advance.
- The economic calendar for the week has been read.
detection_rules:
- Skip Monday entirely; wait for Tuesday onward.
- Wait for the day on which price reaches the anticipated higher-timeframe level and reacts to it.
- Trade the NEXT day, not that day.
- Trade the New York session only.
- Execute on the 15-minute chart, having framed the day on the daily and hourly.
- 'Top-down chain used in every example: daily level -> hourly breaker / fair value gap / order block
  -> 15-minute fair value gap for the entry.'
- 'Weekly-profile overlay he adds: on a bullish week expect an open-low-high-close daily shape.'
- 'Target preference stated once: a candle with NO WICK is something he likes to target.'
invalidation:
- Price does not reach the anticipated higher-timeframe level, so no next day is set up.
execution:
  bias: Away from the higher-timeframe level that was reached the previous day.
  entry: 15-minute fair value gap / hourly breaker retrace during the New York session.
  stop: Beyond the level being traded away from.
  targets:
  - The draw on liquidity below/above (equal lows/highs, previous week's extreme)
measurable:
- hit rate of the day-after-the-level rule vs trading the level day itself
- how much the skip-Monday rule costs or saves over a sample
- share of setups that appear in New York only
