id: invalidation-trade
name: "Invalidation Trade (trading the failure of a valid model)"
aliases: ["invalidation of daily bias", "invalidation day", "gold invalidation trade"]
category: model
status: contested
voice: ttrades
definition: >
  Restated live on gold. A daily candle 2 at a potential low of the month was the bullish
  idea; it needed an intraday confirmation and a continuation over the level. No continuation
  formed, so the idea is invalidated and the opposing previous day low becomes the target.
  He names the invalidation as forming in exactly two ways - a reversal off the previous day
  high (shown on NQ) or a failure of the EQ (a close below the EQ plus a bearish continuation,
  shown on gold, replayed three minutes at a time) - and states the target as always the
  previous day low. He frames the C2 closure, C3 closure and their invalidation as the
  "easiest bias" because a formed setup, unless it consolidates, either works or fails.
timeframes:
  htf: ["1D", "1H"]
  ltf: ["5m", "3m", "1m"]
  fractal: true
preconditions:
  - "A daily candle 2 (here at a potential low of the month) gave a directional idea."
detection_rules:
  - "Invalidation route 1: price reverses off the previous day high (bullish idea failing)."
  - "Invalidation route 2: price closes below the EQ AND forms a bearish continuation."
  - "Once invalidated, either stand aside or trade toward the previous day low."
  - "Do not enter in the reversal candle; enter after price breaks down and forms the bearish continuation."
  - "If price instead sweeps a new high, the invalidation read is void - wait for a new C2."
invalidation:
  - "Price sweeps out a new high above the failing swing - wait for a new candle 2."
execution:
  bias: "Opposite the failed C2."
  entry: "LTF continuation after the EQ failure (3m/1m here, since the 5m did not give enough R without a limit order)."
  stop: "Above the high that must remain (the wick being invalidated)."
  targets: ["previous day low"]
measurable:
  - "Share of daily C2/C3 setups that neither work nor fail (consolidate)."
  - "Hit rate of previous day low after a close-below-EQ plus bearish continuation."
sources:
  - video_id: KBJAGgkXdeI
    title: "New York Open Live Q&A"
    quote: "We're either going to reverse off our previous days high."
  - video_id: KBJAGgkXdeI
    title: "New York Open Live Q&A"
    quote: "Or we're going to fail the EQ."
  - video_id: KBJAGgkXdeI
    title: "New York Open Live Q&A"
    quote: "it to its previous day low it's always going to be that"
  - video_id: KBJAGgkXdeI
    title: "New York Open Live Q&A"
    quote: "Handle two closure, handle three closure, then the invalidation of those"
  - video_id: KBJAGgkXdeI
    title: "New York Open Live Q&A"
    quote: "then you kind of have to just wait for a new C2"
ambiguities:
  - "'Handle two/three closure' is a caption error for candle two/three closure."
  - "He calls the entry 'not super ideal' because it sat low in the dealing range; no location threshold is given."
  - "Which timeframe's EQ was failed on gold is not stated on air (hourly chart was being viewed)."
python_detector: null
related: ["fractal-model-c2", "equilibrium-eq", "draw-on-liquidity", "continuation-timing"]
