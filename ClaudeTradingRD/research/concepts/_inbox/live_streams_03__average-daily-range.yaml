id: average-daily-range
name: Average Daily Range (eyeballed) as target filter
aliases:
- ADR
- daily range
category: risk
status: underspecified

definition: >
  He confirms directly that he uses average daily range rather than an ATR indicator, that he
  suspects the two are the same thing, and that he does not compute it - he looks at the chart.
  Its use in these streams is as a stop-looking filter: once the day has already covered a
  whole average daily range, the remaining opportunity is small and he only stays interested
  because a nearby higher low is still reachable. On NQ he calls a 300-400 point day "fine for
  an average daily range", the only number attached to the idea in this unit, and elsewhere
  calls a 350-point NQ move "basically a daily range last week".

timeframes:
  htf:
  - 1D
  ltf: []
  fractal: false

preconditions:
- A daily chart with recent expansion candles to eyeball.

detection_rules:
- Eyeball the typical recent daily high-to-low range for the instrument (NQ example - 300-400
  points is normal).
- Measure how much of it the current day has already covered.
- If a whole average daily range is already covered, treat further continuation as low-value
  and require a nearby objective to stay involved.
- Do not compute it as an indicator.

invalidation:
- n/a - a filter.

measurable:
- hit rate of targets lying inside versus beyond the remaining eyeballed range
- comparison of his eyeballed figure against ATR(n) on the same instrument

sources:
- video_id: X4XSsv5CNqg
  title: New York Open Live Q&A
  quote: I use average daily range. I think it's the same, I don't know
- video_id: X4XSsv5CNqg
  title: New York Open Live Q&A
  quote: I don't use it as an indicator. I just look at the chart
- video_id: X4XSsv5CNqg
  title: New York Open Live Q&A
  quote: we've already made a whole average daily range
- video_id: c7nk7ypJHN4
  title: New York Open Live Q&A
  quote: 300 400 points which I think is fine for an average daily range

ambiguities:
- No lookback length, no averaging method, no session basis (RTH vs full session) - he
  explicitly says he does not use an indicator.
- The 300-400 point figure is NQ-specific and given in passing; no figures for ES, YM, gold
  or currencies.
- '"Already made a whole average daily range" is not turned into a hard no-trade rule; it
  downgrades rather than blocks.'

