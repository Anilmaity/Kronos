id: premium-discount-equilibrium
name: Premium, Discount & Equilibrium
aliases:
- premium array
- discount of this range
category: structure
status: specified
definition: Used in this unit as a quality filter on the structure points themselves rather than
  only on entries. When looking for the higher low that continues an uptrend he says he ideally likes
  to see it in discount, and this is where he uses discount and premium; conversely he declines to
  be interested in a lower high in a downtrend because of premium and discount, saying he would like
  to see a premium array instead. The top-down video applies the same test to an entry level, noting
  approvingly that price is back into the discount of the range when the closure arrives.
timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 15m
  - 5m
  fractal: true
preconditions:
- A range with a defined high and low, so equilibrium can be marked.
detection_rules:
- For a bullish continuation, prefer the higher low to form in the discount of the current range.
- For a bearish continuation, prefer the lower high to form in premium - a lower high sitting in
  discount is explicitly of less interest.
- 'The same test is applied to the entry level itself: an entry closure taken back inside the discount
  of the range is treated as better.'
invalidation:
- Not applicable - this is a preference filter.
measurable:
- outcome of continuations whose pullback point sits in discount vs at or above equilibrium
- share of his marked structure points that satisfy the premium/discount preference
sources:
- video_id: sgAnVR6RSDg
  title: Understanding Market Structure For Trading
  quote: ideally I like to see discount
- video_id: sgAnVR6RSDg
  title: Understanding Market Structure For Trading
  quote: I'm not as interested in this because of premium and discount
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: we're back into the discount of this range
ambiguities:
- Stated as a preference ('ideally', 'not as interested'), never as a hard filter - he still marks
  and follows structure points that fail it.
- Which range the premium/discount is measured against is not restated in these videos; on a nested
  chart the answer changes the verdict.
