id: continuation-order-block
name: "Continuation Order Block (Continuation Entry)"
category: entry
status: specified
definition: >
  Four Shorts give the same four-step recipe for the continuation entry inside an expansion.
  Price retraces into an important level (generally a fair value gap), an opposing candle
  (down-close in the bullish case) prints into that level, price closes over that opposing
  candle, and the close creates a new protected swing which is the invalidation. The entry is
  taken at the retest of that block, the stop on the new protected swing, and the target is 2R or
  the liquidity the move is drawing toward. One Short adds the negative case: reaching the point
  of interest and printing a candle closure is not enough if no continuation forms.

timeframes:
  htf: ["1D", "4H", "1H"]
  ltf: ["15m", "5m", "1m"]
  fractal: true

detection_rules:
  - "Require an established direction (expansion, or a confirmed candle 2 plus CISD)."
  - "Wait for price to retrace into an important level, generally a fair value gap."
  - "Identify the opposing candle(s) that traded into that level."
  - "Require a close over the series of opposing candles - this creates the new protected swing."
  - "Enter on the retest of that block; stop on the new protected swing; target 2R or the drawn liquidity."
  - "A closure into the point of interest that does not produce a continuation is not an entry - wait for the next one."

invalidation:
  - "The new protected swing is taken out."
  - "No close over the opposing candles occurs at the level."

measurable:
  - "hit rate of 2R on continuation order-block entries"
  - "frequency of the reach-but-no-continuation case"

