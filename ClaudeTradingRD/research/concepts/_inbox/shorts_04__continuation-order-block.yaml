ambiguities:
  - "'Important level' is enumerated only as 'generally a fair value gap' - no ranking of level types is given."
  - "Whether the entry is a limit at the block or a market order on the retest differs between the Shorts and is never reconciled."
  - "'Low risk buy' is used as a label for the block without a definition."

