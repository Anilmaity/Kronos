id: cisd
name: Change In The State Of Delivery (CISD)
category: entry
status: contested
voice: ttrades
definition: >
  vtreLT_8v8I (a clip of rVRk4MLTJSs) restates the OB-versus-CISD answer. A CISD is the order block
  that changes the trend, here from bullish to bearish. An order block already in line with the
  trend is just an order block, or a continuation. Once the bearish CISD is confirmed, every later
  bearish protected swing or order block is not a CISD, because the trend is already bearish. The
  next CISD is a bullish one lower down, a potential shift back from bearish to bullish.
detection_rules:
- A CISD is the first order block that flips the prevailing trend.
- Same-direction protected swings or order blocks after it are order blocks or continuations, not CISDs.
sources:
