id: trade-frequency-baseline
name: "Expected Trade Frequency (one to two a week)"
aliases: ["one to two trades a week", "you don't need to trade every session"]
category: risk
status: specified
voice: guest
guest_sources:
- "Ben (Ben TT)"

definition: >
  Ben's frequency claim, notable because it is paired with an outcome claim: he averages about one
  to two trades a week EVEN THOUGH he executes on the 1-minute and 2-minute, and says that doing so
  has produced the most consistency and the highest win rate of his entire trading career. The
  supporting doctrine is permission to miss: you do not need to catch every swing, you do not need
  to trade every session, and traders go days or weeks without a trade. He accepts missing AM
  moves outright when the setup he wants does not appear or he needs more data.

timeframes:
  htf: ["1D"]
  ltf: ["5m", "2m", "1m"]
  fractal: false

preconditions:
- "A defined setup with the discipline to skip everything else."

detection_rules:
- "Target frequency: one to two trades per week, regardless of how low the execution timeframe is."
- "Low execution timeframe is for R and precision, not for frequency - the two are decoupled."
- "Missing a session or a whole day is expected behaviour, not a failure."

invalidation:
- "Not applicable."

execution:
  bias: "Not applicable."
  entry: "Not applicable."
  stop: "Not applicable."
  targets: []

measurable:
- "trades per week against win rate for the same trader - his implicit claim is that they move in opposite directions"
- "expectancy of the marginal trade beyond the second in a week"

sources:
- video_id: yRmKkR4CojU
  title: "Fractalizing Entries -Q&A with Ben - ICT Concepts"
  quote: "i'm only averaging about one to two trades a week"

ambiguities:
- "The link between low frequency and his best-ever win rate is asserted, not evidenced, and he declines on air to give a rate of return."
- "He is three years into trading and about five months into this methodology at the time of recording, so the 'entire trading career' comparison is short."
- "No rule states what makes a week's second setup the last one - the frequency is an observed average, not a cap."
- "This sits directly against the host's own two-to-three-trades-a-day figure in another video of this unit; different speakers, different eras."

python_detector: null
related: ["max-one-trade-per-day", "risk-limits-and-trade-frequency", "sponsorship-vs-execution-timeframe", "overtrading-gate"]
contributing_units:
- live_stream_guests_01
draft_count: 1
