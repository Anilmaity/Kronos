ambiguities:
  - "Sourced from an ASR (whisper-small) transcript, not YouTube captions; wording may be imprecise."
  - "In video Nlw-PZhoViQ failure swings are read as a positive expectation (the level will be revisited) rather than as irrelevant structure, which sits alongside - not obviously with - the dismissal of failure swings in video UBTl7za9obc. No reconciliation is offered."
  - "The term is used as if already defined and is never defined in this unit; the reconstruction above is entirely from how it is applied on the two charts."
  - "No count and no tolerance is given - how many swings at how similar a level constitutes failure swings is unstated."
  - "The relationship to equal highs is left implicit; in video w-JekHg6Ldk both are cited at the same level without distinguishing them."

python_detector: null
