id: ttfm-favorite-daily-4h-15m
name: His Favourite Pairing - Daily Bias / 4-Hour Swing Point / 15-Minute Entry
category: model
status: contested
voice: ttrades
aliases:
- London session model
- my preferred method for trading London
definition: >
  Presented as his London session model. Daily bias (simplest: daily candle 2 or candle 3 closure).
  Then let the daily wick form by using the 4-hour: for London he wants the reversal in Asia or early
  London, 'usually the 2200 candle or the 2:00 a.m. candle' (Forex timings are an hour off). After the
  4-hour closure, drop to the 15-minute, confirm the swing with a CISD, wait for the intra-candle CISD
  that shows the 4-hour wick has formed, and get onside with stop at the protected swing. Hold toward
  the high (low) or close of the expansion candle - possibly for this 4-hour candle and the next.
  Additions: a 4-hour C2 that fails to take the previous high (failure swing) is still valid but he
  'must demand more confirmation' and prefers SMT; a very deep 15-minute run is only traded away from
  with SMT on the low; a visible wick on the 4-hour is acceptable if the day has range left (gold daily
  expansion candles ~100 points, halfway used). Kill zones are irrelevant - entering at 19:00, 22:00,
  01:00 or 02:00 is fine as long as the higher-timeframe wicks have formed.
timeframes:
  htf: ["1D", "4H"]
  ltf: ["15m"]
  fractal: true
preconditions:
- Daily bias from a daily candle 2 or candle 3 closure (or more advanced daily reads).
detection_rules:
- 'London variant: look for the 4-hour reversal / closure in the 22:00 or 02:00 (New York) 4-hour candle, i.e. Asia or early London; Forex is shifted by one hour.'
- Confirm the swing on the 15-minute with a CISD, then wait for the intra-candle CISD in the new 4-hour candle before entering.
- If the 4-hour C2 is a failure swing (did not take the previous candle's high/low), require SMT or cleaner 15-minute continuation structure.
- A deep opposing run on the 15-minute is only traded away from if SMT is present at the extreme.
- Accept a 4-hour wick if a large share of the expected daily range remains.
- Hold for the duration of the higher-timeframe expansion candle, potentially the next one too, or exit at 2R.
invalidation:
- Price trades through the protected swing used for the stop.
execution:
  bias: Daily C2/C3 closure direction.
  entry: 15-minute continuation / protected swing after the 4-hour wick is confirmed (positional entry at the new 4-hour open also shown).
  stop: The 15-minute protected swing.
  targets: ["2R", "previous day high/low", "close of the 4-hour (and next 4-hour) expansion candle"]
measurable:
- hit rate of setups whose 4-hour reversal candle is 22:00 vs 02:00 vs later
- performance with vs without SMT when the 4-hour C2 is a failure swing
