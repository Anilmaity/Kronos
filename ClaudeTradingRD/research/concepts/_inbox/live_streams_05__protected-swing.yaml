ambiguities:
- Whether the closure must be a body close through the whole series or only through its extreme is
  not stated.
- '''Series of candles'' has no maximum length; one example is a single candle.'
- On stocks he says the protected-swing display gets messy and he would turn it off, without giving
  a rule for when it is unreliable.
