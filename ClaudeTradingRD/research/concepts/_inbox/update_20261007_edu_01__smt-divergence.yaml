id: smt-divergence
name: SMT Divergence
category: liquidity
status: specified
voice: ttrades
definition: >
  Restated as the first and easiest input to relative strength: between correlated assets, a
  difference in structure at the same high or low (one takes it, the other does not). He adds
  that several SMTs on different timeframes can exist at once in the same leg.
detection_rules:
  - "Mark the same-timeframe high/low on both assets; one takes it and the other does not = SMT."
  - "Check nearby swings on other timeframes too; multiple SMTs may print and should agree."
sources:
  - video_id: yH4eYwUgdTY
    title: "Relative Strength & Weakness + SMT Divergence (Full Guide)"
    quote: "between correlated assets a difference in structure"
  - video_id: yH4eYwUgdTY
    title: "Relative Strength & Weakness + SMT Divergence (Full Guide)"
    quote: "there are multiple SMTs across multiple different time frames sometimes"
ambiguities:
  - "No rule for conflicting SMTs across timeframes is given; the example only shows agreeing ones."
related: ["relative-strength-weakness"]
