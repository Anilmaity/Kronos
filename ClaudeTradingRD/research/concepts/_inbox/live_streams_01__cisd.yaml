ambiguities:
- The minimum candle count for a 'series' is never given - he rejects one candle and accepts what
  he calls an actual structural point, but no n is stated.
- '''Insignificant'' is the word used to disqualify a candle; no size or range threshold is attached
  to it.'
- The auto-captioner renders CISD variously as 'CSD', 'CISD' and 'CIS'; all are the same term.
