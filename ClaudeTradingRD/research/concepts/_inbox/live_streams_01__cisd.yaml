id: cisd
name: Change In State Of Delivery (CISD)
definition: 'Live-Q&A refinement of what counts as the ''series of candles'' a CISD must close through.
  Two viewer setups are rejected on exactly this point. A single small opposing candle is not a series:
  he will not treat one tiny consolidation candle as the structure, and instead looks for the actual
  structural point that made the extreme. The procedure he restates is: locate the low (or high),
  locate the series of candles that produced it, and require a close over (or under) that level -
  if no such series can be pointed at, there is no CISD.'
category: entry
status: contested
detection_rules:
- Find the extreme (the low for a bullish CISD, the high for a bearish one).
- Find the series of candles that made that extreme - the structural point, not the nearest single
  candle.
- Require a close through that level.
- A single small consolidation candle does not qualify as the series; a close below it is not a CISD.
- If no series of candles can be identified at the extreme, the setup is not a CISD regardless of
  what price did.
measurable:
- difference in CISD count between a 1-candle-series detector and an n>=2 series detector
- expectancy of trades from single-candle 'series' vs multi-candle series
sources:
