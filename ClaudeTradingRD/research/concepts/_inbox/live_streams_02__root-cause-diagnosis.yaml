id: root-cause-diagnosis
name: "Root-Cause Diagnosis for Repeated Account Failure"
aliases: ["find the root cause", "change or quit"]
category: psychology
status: specified

definition: >
  The organising frame of the longest teaching block in this unit. Rather than answering
  "what should I do", he insists the trader identify the root cause of the failure and then
  either change or quit — anything else is wasting time. In the m8xcjkOuBHU stream he then works
  through viewer problems live and gives a fixed fix for each: stopped out then the market goes
  → move up a timeframe or two; can't stop after a loss / revenge trading → one trade a day max;
  breached account "because of market situations" → take accountability, limit trades and size
  correctly; two months without passing → probably fear and too-small size, so winners and
  losers mean nothing; "I've learned so many strategies" → you have knowledge and no strategy;
  hit break-even then the trade runs → stop going to break-even; can't hold to full take-profit
  → fear, so set a 2R exit and do nothing; struggles with direction → the hindsight daily-candle
  drill. Asked whether a struggling trader should switch strategy, the answer is no: the
  strategy is almost never the problem.

timeframes:
  htf: []
  ltf: []
  fractal: false

preconditions:
  - "A repeated, identifiable failure pattern across accounts or sessions."

detection_rules:
  - "Name the root cause before choosing a fix; the listed defaults are tilt, oversizing, revenge trading and not following a model."
  - "Stopped out then price runs to target → raise the execution timeframe by one or two."
  - "Cannot stop after a loss → hard cap of one trade per day."
  - "Blaming market conditions → treat as forcing trades; limit trade count and correct position size."
  - "Long-run failure to pass with tiny outcomes → size is too small for winners to matter."
  - "Many concepts, no results → there is no strategy; adopt one and follow it."
  - "Trades hit break-even then run → stop moving to break-even."
  - "Cannot hold to target → place a fixed ~2R exit and do not manage."
  - "Do not switch strategy as a response to underperformance."

invalidation:
  - "Not applicable — this is a diagnostic procedure."

measurable:
  - "recurrence rate of a named failure after its prescribed fix"
  - "R difference before and after each single fix (timeframe raise, one-trade cap, no-break-even)"

sources:
  - video_id: G1IIdQ3RAkY
    title: "New York Open Live Q&A"
    quote: "You have to find out the root cause of what is preventing you from progressing."
  - video_id: m8xcjkOuBHU
    title: "New York Open Live Q&A"
    quote: "what is the root cause of my problem and then how do I fix it"

ambiguities:
  - "The diagnoses are made from one-line viewer messages and he says explicitly he is guessing; the mapping from symptom to cause is not evidence-based."
  - "'Stop going to break-even' is stated flatly here, which contradicts the break-even and stop-migration rules taught elsewhere in the corpus (move the stop only after a new protected swing forms)."
  - "'Correct position size' is quantified only through the prop-drawdown tiers given in the same stream."

