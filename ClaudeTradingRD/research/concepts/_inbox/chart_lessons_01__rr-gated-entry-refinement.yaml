id: rr-gated-entry-refinement
name: "Refine The Entry Downward Until Risk-To-Reward Works"
aliases: ["seek continuations until the risk-to-reward makes sense", "refining the entry"]
category: entry
status: specified

definition: >
  The rule that decides which timeframe supplies the entry. The target is fixed first -
  the nearest real objective, typically the intraday highs or lows - and the entry
  timeframe is then whatever is required to reach that target at acceptable risk-to-reward.
  In the ES walkthrough he tests the 5-minute continuation and rejects it because the stop
  is too far for the target, tests the 3-minute and rejects it for the same reason, and
  only then - "rarely, and in this case" - refines to the 1-minute, where the same
  wick / close-through / protected-low structure appears at a size that gives just over 4R.
  The crucial constraint is the one he states negatively: he will not extend the target to
  manufacture the ratio, because price may reverse at the nearer level anyway. If no
  refinement level produces acceptable risk-to-reward, the correct action is to keep
  waiting for further continuations rather than to force the trade.

timeframes:
  htf: ["1H", "15m"]
  ltf: ["5m", "3m", "1m"]
  fractal: true

preconditions:
  - "A confirmed directional idea from the higher timeframe."
  - "A target chosen independently of the entry - the nearest genuine objective, not a distance."

detection_rules:
  - "Fix the target first (intraday highs/lows or the higher-timeframe draw)."
  - "Attempt the entry on the current timeframe; compute R from the required stop (the protected swing) to the fixed target."
  - "If R is insufficient (roughly 2R is treated as the working minimum), do not take it - step down one timeframe and look for the next continuation."
  - "Repeat: 5m, then 3m, then 1m. The 1-minute is described as rarely used."
  - "Never extend the target to make the ratio acceptable."
  - "If no level works, keep waiting for further continuations rather than entering."

  - "A second trigger for dropping a timeframe, independent of R: if the current timeframe will not produce a swing formation (because the higher-timeframe wick is already forming), step down to one that will."
invalidation:
  - "Price reaches the target before an acceptable entry appears - the trade is missed and is not chased."

execution:
  bias: "Unchanged by refinement; set on the higher timeframe."
  entry: "Lowest timeframe at which the fixed target is reachable at acceptable R."
  stop: "The protected swing available on that refinement timeframe."
  targets: ["intraday highs or lows", "higher-timeframe draw"]

measurable:
  - "distribution of refinement timeframe actually used per trade"
  - "R achieved by refinement level"
  - "frequency of missed trades where no refinement level qualified"

sources:
  - video_id: UBTl7za9obc
    title: "TTrades Top-Down Chart Lessons #2"
    quote: "I'm just looking to seek continuations until the risk-to-reward makes sense"
  - video_id: w-JekHg6Ldk
    title: "TTrades Top-Down Chart Lessons #4"

  - video_id: Nlw-PZhoViQ
    title: "TTrades Top-Down Chart Lessons #1"
    quote: "I can drop down one timeframe or go to the 30 minute"
ambiguities:
  - "Sourced from an ASR (whisper-small) transcript, not YouTube captions; wording may be imprecise."
  - "Video Nlw-PZhoViQ contains a counter-case to the never-extend-the-target constraint: he acknowledges he cannot reach the R multiple against the nearest low, and takes the entry anyway because he is targeting the higher-timeframe objectives instead. The two videos are not reconciled. (The R figures in that passage are mistranscribed by the ASR and are read from context.)"
  - "The minimum acceptable ratio is never stated as a rule. 2R is repeatedly treated as sufficient in the narration and sub-2R setups are refused, so 2R is inferred, not taught."
  - "No stopping rule is given for how far down to refine; the 1-minute is described as rare but not as a floor."
  - "In video w-JekHg6Ldk the same logic appears as a refusal to use a distant protected low, without the explicit timeframe ladder."

python_detector: null
related: ["protected-swing", "cisd", "timeframe-pairing", "partial-profit-taking", "top-down-analysis-procedure"]
