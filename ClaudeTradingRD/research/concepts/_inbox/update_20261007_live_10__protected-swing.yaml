id: protected-swing
name: Protected Swing (the invalidation level)
category: structure
status: specified
voice: ttrades
definition: 'Reaffirmed live: a wick into the T-spot does not by itself make a protected swing; it becomes
  protected only on a closure over the series of down-close candles that made the low. Anticipating that
  close and trading with a stop beneath is allowed as a reversal-style entry.'
detection_rules:
- Wick into a point of interest alone is not sufficient.
- Require the 15-minute close over the down-close series that made the low.
