ambiguities:
- The layout makes SMT visible; it does not define SMT. No rule is given here for how far short of
  the extreme the non-confirming instrument must stop.
- Which pair of instruments constitutes a valid SMT pair is not addressed in this video (ES/NQ is
  simply what is on screen).
- Whether the comparison uses wicks or bodies is not stated.
