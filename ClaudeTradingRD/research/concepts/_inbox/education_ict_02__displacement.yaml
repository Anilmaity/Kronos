ambiguities:
- The four-candle window is the number used in his single worked comparison; he never states it as
  a parameter, so whether the window is fixed at 4 or is just 'the same amount of time' is not decidable
  from the transcript.
- The comparison is RELATIVE - it needs a reference instance of a non-displacing break on the same
  chart. No absolute threshold (ATR multiple, body ratio, point value) is ever given.
- '''Closes in the high or the low'' is the nearest thing to a wick-size rule in this unit, but no
  ratio of wick to body or wick to range is stated.'
- 'EVOLUTION vs the Updated playlist: here the fair value gap is a REQUIREMENT for displacement (''for
  displacement to occur you want to see a fair value gap created''). In the later canon (_94CPMjWi9E,
  education_ict_updated_01) the gap is downgraded to a detection aid - ''the easiest way to spot it
  is just looking for fair value gaps''. These are the earlier recordings.'
- Whether the FVG must be left by the breaking candle itself or anywhere in the leg is not stated.
