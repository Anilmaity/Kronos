id: displacement
name: Displacement
category: structure
status: contested
aliases:
- energetic move
- aggressive candles
- displacement over structure
definition: 'EARLIEST RECORDINGS IN THE CORPUS, and the only place the channel supplies a MEASUREMENT
  PROCEDURE rather than an adjective. Two complementary statements. (a) The candle-shape reading:
  displacement is large aggressive candles whose closes are AT the high (bullish) or AT the low (bearish)
  of the candle, and it only counts when it happens OVER a structural level. (b) The comparative reading:
  after a short-term high is broken, take a FIXED NUMBER of candles (four in his worked example) and
  compare two quantities against a non-displacing instance of the same event - the RANGE of that fixed
  window, and the DISTANCE travelled beyond the short-term high. Displacement is the case with the
  larger range and the greater distance covered in the same amount of time. A third, weaker reading
  also appears here and is stated as a requirement rather than as a detection aid: for displacement
  to occur a fair value gap must be created.'
timeframes:
  htf:
  - 1D
  - 4H
  - 15m
  ltf:
  - 5m
  - 1m
  - 15s
  fractal: true
preconditions:
- A short-term high or low (structure) exists and has just been traded through.
detection_rules:
- 'Candle-shape test: the breaking candle(s) are large and close AT or very near their own high (bullish)
  or low (bearish) - i.e. no meaningful wick on the close side.'
- 'Location test: the move must occur OVER a structural level; a large candle inside the range is
  not called displacement here.'
- 'Comparative test (the only procedure given anywhere in the corpus): fix a candle window - he uses
  four candles from the break - and compute (i) the range of that window and (ii) the distance price
  travelled beyond the broken short-term high.'
- Compare those two quantities against a prior break of the same kind that he labels NOT energetic;
  the displacement case has the larger range AND the greater distance in the same number of candles.
- 'FVG test (stated as a requirement in PePk1V0Q4QQ): a fair value gap must be created by the move;
  a break with no fair value gap is explicitly rejected as not displacement (FdRKBTz0Fps).'
- 'Consequence, stated in the same breath: once displacement is confirmed, mark the displacement range
  and buy only in its discount / sell only in its premium.'
invalidation:
- Price trades through the level and closes back inside - see failure-to-displace.
- The break leaves no fair value gap and covers no more distance than a prior non-energetic break.
measurable:
- range of the 4-candle window after a structure break, normalised by the preceding 4-candle range
- distance beyond the broken swing at N=4 candles, displacing vs non-displacing breaks
- hit rate of the FVG-required filter versus the close-beyond-level filter
