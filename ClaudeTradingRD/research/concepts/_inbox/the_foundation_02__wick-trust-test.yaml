id: wick-trust-test
name: Let the Wick Form, Trade the Body (Wick Trust Test)
aliases:
- letting the wick form
- trade the body
category: structure
status: specified
definition: 'Stated in the top-down video as the whole content of the 4-hour slot when a directional
  week is anticipated: what he is focused on is letting the wick form in the higher-timeframe candle,
  because an expansion candle will have small wicks and a larger body - so once the wick has formed
  he can trade the body, from the extreme to the close. What makes the wick trustworthy is named
  explicitly and mechanically: the change in the state of delivery on the supporting timeframe is
  what confirms the wick has formed.'
timeframes:
  htf:
  - 1W
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  - 5m
  fractal: true
preconditions:
- A higher-timeframe candle has opened and price has traded into the anticipated wick area.
detection_rules:
- Wait for the higher-timeframe candle to trade into a point of interest and reverse rather than
  entering at the open.
- Require a change in the state of delivery on the supporting timeframe inside that candle - that
  closure is what confirms the wick has formed.
- 'Once confirmed, the trade is the body of the higher-timeframe candle: from the extreme, through
  the body, toward the close.'
- 'The geometry expected of the candle being traded: small wicks and a larger body.'
- 'In the bearish case he phrases the same operation as: after the high forms (open-high), trade
  from the high to the low and then the close.'
invalidation:
- The higher-timeframe candle keeps extending its wick - the CISD has not occurred, so there is no
  trade yet.
measurable:
- how often the extreme confirmed by a supporting-timeframe CISD is subsequently exceeded within
  the same higher-timeframe candle
- body-to-wick ratio of candles that were traded vs skipped
sources:
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: letting the wick form in the higher time frame candle
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: once that Wick forms I can then look to trade the body
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: that is what to me confirms this Wick has formed here
ambiguities:
- '''Small wicks and a larger body'' is never given a ratio.'
- How early in the higher-timeframe candle the wick must form is not stated in this unit (other units
  require it early).
- The supporting timeframe used for the CISD varies with the higher timeframe (hourly under the daily,
  15-minute under the 4-hour) without a stated pairing rule.
