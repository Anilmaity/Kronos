id: break-even-management
name: Break-Even Management
category: risk
status: contested
voice: ttrades
definition: 'Swing-trade variant: holding a daily short, he states that if the day closes well (a candle
  2 / candle 3 continuation), price should not come back above 50% of that candle; because his entry sits
  above that 50% level, he is effectively at break-even risk and stops caring about the outcome.'
detection_rules:
- After a favourable daily closure, mark 50% of the closed candle.
- If the entry lies beyond that 50% level (above it for a short), the trade can be treated as break-even
  protected.
sources:
- video_id: uW55Tuk-ngY
  title: New York Open Live Q&A
  quote: I don't want to see price come above 50% of this
- video_id: uW55Tuk-ngY
  title: New York Open Live Q&A
  quote: well that's above that so I can be break even now
ambiguities:
- Whether the stop is physically moved to entry or the 50% level is just a mental invalidation is not
  stated.
