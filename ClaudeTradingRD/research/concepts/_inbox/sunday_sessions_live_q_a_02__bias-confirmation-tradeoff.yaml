id: bias-confirmation-tradeoff
name: "Bias / Confirmation Trade-off"
aliases: ["strong bias needs less confirmation"]
category: psychology
status: specified

definition: >
  The amount of lower-timeframe confirmation demanded before entry is inversely proportional
  to the strength of the higher-timeframe bias. With a strong bias, little confirmation is
  needed; with a weak bias, a specific confirming closure must print or no trade is taken -
  even if the directional idea subsequently proves correct.

timeframes:
  htf: ["1D", "4H"]
  ltf: ["15m", "5m", "3m", "1m"]
  fractal: false

preconditions:
  - "A higher-timeframe bias has been formed and its strength assessed."

detection_rules:
  - "Grade bias strength (his own test: how confident the daily chart read is, developed by screen time)."
  - "If bias is strong, act on the setup with minimal lower-timeframe confirmation."
  - "If bias is weak, define in advance the specific closure required; if it does not print, do not trade."

invalidation:
  - "n/a - this is a sizing/gating rule rather than a pattern."

execution:
  bias: "Whatever the HTF read is."
  entry: "Gated by the confirmation level set by bias strength."
  stop: "Per the entry model."
  targets: "Per the entry model."

measurable:
  - "Expectancy split by pre-declared bias-strength grade."
  - "Proportion of weak-bias days where the required confirmation never printed."

sources:
  - video_id: Qv6Ux_Z8VrA
    title: "New York Open Live Q&A"
    quote: "The more my bias increases, right? The less confirmation I need."

ambiguities:
  - "Bias strength is self-assessed by feel ('once you watch the daily chart enough you'll get a feeling'); no scale or criteria are given."

python_detector: null
related: ["daily-bias-candle-formation", "continuation-over-reversal", "cisd"]
