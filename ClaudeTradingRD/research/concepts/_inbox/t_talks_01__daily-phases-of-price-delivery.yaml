id: daily-phases-of-price-delivery
name: "Daily Phases Of Price Delivery (no expansion follows an expansion)"
aliases: ["phases of price delivery", "expansion to retracement / reversal / consolidation"]
category: structure
status: specified

definition: >
  A reading of the daily chart as a cycle of four phases - expansion, retracement, reversal,
  consolidation - with one hard sequencing claim: an expansion is never immediately followed by
  another expansion. After a large-range expansion closes, an intermediate phase (retracement,
  reversal, or consolidation) must occur before the next expansion.

timeframes:
  htf: ["1D"]
  ltf: ["1H"]
  fractal: false

preconditions:
  - "The daily chart's most recent completed phase can be classified."

detection_rules:
  - "If the previous week closed with large-range expansive daily candles, do not expect or trade another expansion immediately."
  - "Expect one of three intermediate phases next: retracement, reversal, or consolidation."
  - "If the opening days of the week trade in the same direction as the prior expansion, avoid - that would be expansion to expansion."
  - "If the opening days consolidate, avoid."
  - "If the opening days frame a manipulation for a reversal or a retracement, seek trades in the counter direction."

invalidation:
  - "Not stated as a price level. The phase read is revised as new daily candles print."

execution:
  bias: "Counter to the prior expansion during the intermediate phase, then with the new expansion once confirmed."
  entry: "Refined on the hourly - a change in state of delivery confirming the manipulation."
  stop: "Not stated at this level."
  targets: ["the external low or high of the daily range being resolved"]

measurable:
  - "frequency with which two large-range same-direction expansion days occur back to back (the rule says this should be rare)"
  - "distribution of which intermediate phase follows an expansion"
  - "P&L of trades taken with versus against the phase sequence"

sources:
  - video_id: QmGJFxfSHxM
    title: "AM Trades | Blending The Economic Calendar, Daily Chart, & Weekly Profiles"

ambiguities:
  - "No threshold defines a 'large range' or 'expansive' daily candle."
  - "No test is given for telling in real time which of the three intermediate phases is forming - all three are simply possible."
  - "The claim that expansion never follows expansion is asserted as a tendency and never bounded (over how many days? at what scale?)."

python_detector: null
related: ["weekly-profile-alignment", "consolidation-external-liquidity-only", "large-range-day-targeting"]
