id: no-shorting-below-lows
name: Do Not Short Below Lows (trade back into the range instead)
category: entry
status: specified
definition: 'Restated for a day where London had already expanded into and through the previous day low:
  in New York the only frame he allows is a retracement back into the range; he will not short below the
  lows because it is a location problem, and he generally avoids New York on such reversal-type days that
  fight the daily range.'
detection_rules:
- If the overnight session already expanded through a relevant level (e.g. PDL), do not initiate shorts
  beneath it in New York.
- The only New York frame is a retracement back into the range, with reduced targets (daily open, intraday
  highs).
