ambiguities:
- No timezone label is ever spoken in these four streams. The clock is pinned only indirectly -
  09:30 is stated to be the New York stock market open, which is 09:30 New York time by
  definition, and 10:00 is stated to open a new 4-hour candle. Both are inferences from what
  he says, not statements he makes.
- No tolerance window around any time (is 09:33 still "9:30"?).
- The 08:30 reversal / 09:30 continuation pairing is referred back to a separate time video
  that is not in this unit.
- He says he does not trade past about 11:00 but gives no rule, only a habit.

