id: mean-threshold
name: Mean Threshold Of An Order Block
aliases:
- mean threshold
- main threshold (auto-caption)
- 0.5 fib of the body
category: entry
status: specified
definition: 'The 0.5 fib level of an order block measured from body high to body low. It is used
  as an alternative entry to the opening price, and its stated benefit is stop-size reduction: in
  the worked example the opening-price entry required a stop at the block low for 3.5 points of risk,
  while the mean-threshold entry cut that to 1.75 points. It is also used as a behavioural test on
  propulsion blocks, where price must not break or close beyond it.'
timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 5m
  - 1m
  fractal: true
preconditions:
- A validated order block or propulsion block.
detection_rules:
- body_high := max(open, close) of the block; body_low := min(open, close).
- mean_threshold := the 0.5 fib between body_high and body_low.
- 'Entry alternative: enter at mean_threshold instead of the opening price to reduce stop distance.'
- 'Respect test (propulsion blocks): price must not break or close beyond the mean threshold.'
invalidation:
- A break or close beyond the mean threshold against the intended direction.
measurable:
- fill rate of mean-threshold entries vs opening-price entries
- 'measured stop-size reduction across a sample (his example: 3.5 points -> 1.75 points)'
sources:
- video_id: Y8DkNYhq0X0
  title: Orderblocks Simplified - ICT Concepts
  quote: from body high to body low 8.5 FIB of that area
- video_id: Y8DkNYhq0X0
  title: Orderblocks Simplified - ICT Concepts
  quote: my stop size reduces from 3.5 points to 1.75 points
- video_id: 9PKJ0U1gl4g
  title: Propulsion Blocks Simplified - ICT Concepts
  quote: I do not want to see price break the mean threshold of a propulsion block
- video_id: c_mh19e3mhI
  title: The Best Relative Strength Indicator For ES & NQ - ICT
ambiguities:
- The transcript renders '0.5 fib' as '8.5 FIB'; it is read as 0.5 (the 50% level), consistent with
  the rest of the corpus and with the arithmetic of the quoted 3.5 -> 1.75 point stop reduction.
- For a multi-candle series it is not stated whether body_high/body_low span the whole series or
  the first candle only.
- '''Break'' and ''close beyond'' are used interchangeably in the propulsion-block test, so wick-through
  vs body-through is undecided.'
