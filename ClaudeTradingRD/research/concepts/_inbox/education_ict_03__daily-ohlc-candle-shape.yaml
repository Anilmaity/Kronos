ambiguities:
- Earlier recording; the updated material carries the same OHLC/OLHC framing plus an indecision-candle
  case that is absent here.
- No test is given for classifying the day as a buy or sell day in advance - the shape is applied
  under an assumed bias.
- '''Isn''t very clean'' is the only label for the degraded case; no criterion separates clean from
  unclean days.'
