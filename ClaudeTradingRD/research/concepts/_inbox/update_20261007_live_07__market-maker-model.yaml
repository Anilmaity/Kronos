id: market-maker-model
name: Market Maker Model (MMXM)
category: model
status: underspecified
definition: 'Mapped onto the fractal model on a live YM chart: smart money reversal = the swing point;
  original consolidation = the swing low that made the swing high (the target); first leg / second leg
  (''silver bullet'') of distribution are just continuations. He says the same trade is a candle closure
  plus CISD targeting the 4-hour swing low / previous day low, so learning his model trades MMXM ''automatically''.'
detection_rules:
- Smart money reversal := the swing point.
- Original consolidation := the swing low that made the swing high; it is the target.
- Distribution legs := continuations after the CISD.
