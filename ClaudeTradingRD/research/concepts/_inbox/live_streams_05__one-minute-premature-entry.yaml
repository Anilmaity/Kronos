id: one-minute-premature-entry
name: 1-Minute Premature Entry Against A 5-Minute Level
aliases:
- premature entry
- early entry
category: entry
status: specified
definition: The guest's method for entering before his signal timeframe confirms, used when the 5-minute
  closes too late or too close to the target for a 2R trade. He marks the level on the 5-minute (he
  calls it a breaker; the host disputes the naming). Instead of waiting for the 5-minute close through
  that level, he takes the entry the moment a 1-minute candle closes through it, keeping the stop
  where the 5-minute trade's stop would have been. If the 5-minute candle then fails to close through,
  he exits early for a small loss and waits for confirmation; if it does close through, he simply
  holds the position he is already in. He notes this became necessary in a higher-volatility period
  and pairs it with a 4-hour level plus a 15-minute level above it.
timeframes:
  htf:
  - 4H
  - 15m
  ltf:
  - 5m
  - 1m
  fractal: true
preconditions:
- A 4-hour level and a 15-minute level in the trade direction.
- A marked 5-minute level (breaker / order block) that price is returning to.
detection_rules:
- Mark the level on the 5-minute chart.
- Enter when a 1-minute candle closes through that 5-minute level.
- Keep the stop at the 5-minute level's stop, not a 1-minute stop.
- If the 5-minute candle does not close through the level, exit early for a small loss.
- If the 5-minute confirms, hold the position taken pre-closure.
invalidation:
- The 5-minute candle closes back without confirming - cut it.
measurable:
- R saved by the earlier fill vs the frequency of the small cut-loss cases
- share of 1-minute closes through the level that the 5-minute then confirms
sources:
- video_id: tDiwwMRWF2k
  title: New York Open Live Q&A with NickDoesFutures
  quote: if a 1-minute candle closes above that breaker
ambiguities:
- '''Small loss'' is not quantified.'
- Whether the cut is taken at the 5-minute close or immediately on weakness is not stated.
- The host disagrees the marked structure is a breaker at all (see breaker-block), so which object
  the rule attaches to is contested.
