ambiguities:
- The firm names attached to each type (Apex, TopStep, My Funded Futures) and their discount levels
  are shown in an on-screen table and are date-specific; only the TopStep daily-loss-limit example
  is spoken clearly enough to record.
- Whether the end-of-day trail stops once the account is in profit above the initial balance (a common
  'trail to breakeven then stop' rule) is not addressed.
- No guidance is given on which drawdown type to prefer, only on what each does.
