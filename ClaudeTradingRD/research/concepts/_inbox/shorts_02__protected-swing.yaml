id: protected-swing
name: Protected Swing (the invalidation level)
category: structure
status: specified
definition: 'A Short states the sequencing rule that the entry waits on: after a daily sweep and closure
  back in, the existing protected high is marked, and then he explicitly LETS A NEW PROTECTED SWING
  FORM before looking for the entry. The new one forms when price reaches into a point of interest (a
  fair value gap), leaves a series - or a single - up-close candle into it, and closes through. Only
  then does he sell, with the stop on the protected swing high, looking for 2R and then the first standard
  deviation projection. He states the expectation that the new protected swing remains intact if the
  trend is going to continue.'
timeframes:
  htf:
  - 1D
  ltf:
  - 1H
  - 15m
  fractal: true
preconditions:
- A daily sweep of the highs with a closure back inside (bearish case).
- The existing protected high has been identified as the series of candles that made that high.
detection_rules:
- 'Identify the current protected swing: the series of candles that made the high (it can be a single
  candle).'
- Do not enter on it - let a NEW protected swing form first.
- New protected swing forms when price reaches into a point of interest (fair value gap), prints the
  series or single up-close candle into it, and closes through it.
- Enter there; stop on the protected swing high; target 2R, then the first standard deviation projection.
- Expect the new protected swing to remain intact for the trend to continue.
invalidation:
- Price trades through the new protected swing.
measurable:
- hold rate of the new protected swing through to 2R
- R difference between entering at the first protected swing and waiting for the new one
sources:
- video_id: sAh3ZMkzzpQ
  title: Let a New Protected Swing Form, Then Look for the Entry
  quote: I'm going to let a new protected swing form to look for an entry
- video_id: sAh3ZMkzzpQ
  title: Let a New Protected Swing Form, Then Look for the Entry
  quote: put my stop on the protected swing high, and then look for 2R
ambiguities:
- The Short does not say how long to wait for the new protected swing, or what to do if none forms.
- '"Closed through" is not specified as a body close or a wick.'
- He notes his indicator marks the protected swing automatically, so the manual rule is only demonstrated,
  not fully specified.
