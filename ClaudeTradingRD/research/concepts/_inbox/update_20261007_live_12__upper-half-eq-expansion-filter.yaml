voice: ttrades
definition: 'Answered as a Q&A definition: the EQ is the mechanical test for whether a wick is small enough
  for expansion. If price holds above it the candle can still expand; if price trades all the way below
  it, the candle may still be bullish but will not expand and is likely to return to its daily open or
  intraday highs.'
