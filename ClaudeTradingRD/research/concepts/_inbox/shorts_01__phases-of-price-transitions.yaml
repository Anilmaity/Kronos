id: phases-of-price-transitions
name: Phases Of Price Delivery - Legal Transitions
category: structure
status: specified
definition: 'SHORTS EVIDENCE, delivered as an explicit flowchart with expansion as the fixed entry point.
  Everything begins with expansion; from expansion price can go to a retracement, to a consolidation,
  or straight into an opposing expansion. Expansion -> retracement is a CONTINUATION signature. Expansion
  -> consolidation is AMBIGUOUS and resolves only on what the range does: a manipulation of one side
  is a continuation, a breakout is the other. Expansion met with expansion in the OPPOSITE direction
  is a REVERSAL. The cycle then restarts at expansion. The bias-alignment use is shown in a second Short:
  a framed reversal that contradicts the continuation signature is discarded because it is not aligned
  with the bias.'
preconditions:
- An expansion leg has printed.
detection_rules:
- Start from expansion - it is the entry point of the cycle.
- expansion -> retracement := continuation signature; expect the move to continue in the same direction.
- expansion -> consolidation := undecided; resolve on whether the range is manipulated (continuation)
  or broken out of.
- expansion -> opposing expansion := reversal.
- After a reversal, restart the cycle at expansion.
- Discard a framed setup whose phase reading contradicts the standing bias.
measurable:
- empirical transition matrix between the four phases per timeframe
- resolution split of the expansion->consolidation branch (manipulation versus breakout)
