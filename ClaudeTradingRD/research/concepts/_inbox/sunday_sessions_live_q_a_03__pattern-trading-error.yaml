id: pattern-trading-error
name: "Pattern Trading (the error he corrects)"
aliases: ["pattern trading", "no context trading", "going to the lower timeframe too early"]
category: psychology
status: specified

definition: >
  The failure mode he names most often: seeing a clean lower timeframe formation and
  acting on it with no higher timeframe context. He demonstrates it live - a structurally
  valid V-shape reversal with a change in state of delivery that he refuses because there
  is no model and no bias behind it, and which then fails. The prescribed fix is mechanical
  rather than motivational: do not open the lower timeframe until you have a higher
  timeframe reason to be there.

timeframes:
  htf: ["1D", "4H", "1H"]
  ltf: ["5m", "1m"]
  fractal: false

preconditions:
  - "A lower timeframe formation exists that would look tradeable in isolation."

detection_rules:
  - "Before dropping timeframes, require a higher timeframe reason: a candle two / candle three closure aligned with the 4-hour, or another framework element."
  - "If the higher timeframe gives nothing, stay on the 4-hour or hourly and wait for the next candle boundary (e.g. 10:00 a.m.)."
  - "A formation with correct structure but no model behind it is not a trade - he counts 'there's no model' as a sufficient veto even when the CISD is present."
  - "When the daily is not obvious, going lower makes it worse, because a non-obvious daily generally means consolidation."

invalidation:
  - "Not applicable - this is a process rule."

execution:
  bias: null
  entry: null
  stop: null
  targets: null

measurable:
  - "P&L split by whether an HTF framework element was recorded before the entry"
  - "count of LTF formations per day that pass structure but fail the context test"

sources:
  - video_id: bMkRomKEunU
    title: "New York Open Live Q&A"
  - video_id: wM1s7UivQ08
    title: "New York Open Live Q&A"

ambiguities:
  - "'Higher timeframe reason' is enumerated by example (candle two/three closure aligned with the 4-hour) rather than defined as a checklist."
  - "He also says the structure of the rejected setup was good, so the rule is about permission to look rather than about the pattern's quality."

python_detector: null
related: ["timeframe-alignment", "continuation-over-reversal", "max-one-trade-per-day", "consolidation-range-no-trade"]
