id: equilibrium-eq
name: Equilibrium / 50% Level (EQ, T spot)
category: entry
status: specified
definition: 'SHORTS EVIDENCE using the EQ as a directional invalidation rather than an entry zone. After
  a monthly candle 2 closure that failed to produce a strong closure, the daily is watched for the reaction;
  when price instead closes BELOW the EQ, the bullish read is dropped and he looks for price to fail
  and reach for the lows instead. He is careful to state the limit of the rule: it is not all or nothing,
  and if price is bought back up it can still go higher - the phases of price must be watched. The whole
  invalidation is explicitly fractal, as the model is.'
preconditions:
- A higher-timeframe closure has set a directional expectation.
- The relevant range's 50% level has been marked.
detection_rules:
- Mark the EQ of the range in play.
- A close BELOW the EQ (bullish case) invalidates the directional expectation.
- On invalidation, switch the objective to the lows.
- The invalidation is not absolute - if price is bought back up the original read can resume.
- The same test is applied at every scale (monthly closure -> daily reaction -> lower timeframe).
measurable:
- share of EQ-close invalidations that go on to reach the opposite extreme
- false-invalidation rate (price recovers back through the EQ and continues)
sources:
- video_id: HMYcwQwaWm0
  title: Daily Bias Invalidation Is A Fractal Concept
  quote: Closing below the EQ here means that we could be looking for price
- video_id: HMYcwQwaWm0
  title: Daily Bias Invalidation Is A Fractal Concept
  quote: this is a fractal concept as my fractal model is
ambiguities:
- Which range the EQ belongs to (the C2 candle, the monthly range, the swing) is not stated.
- '''We didn''t get a very strong closure'' is the trigger for needing the EQ test at all, and ''strong''
  is not quantified anywhere in this Short.'
- No rule states how long price may sit below the EQ before the recovery branch is ruled out.
