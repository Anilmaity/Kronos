  fractal: true
preconditions:
- 'For the trade sense: a candle 2 whose reversal is confirmed by a lower-timeframe change in the state
  of delivery.'
- 'For the closure sense: candle 2 did NOT produce a valid candle 2 closure.'
- Drawn liquidity / a target is still open -- if candle 2 already expanded all the way to the objective
  he will not trade the candle 3.
detection_rules:
- 'Candle 3 closure (bearish): candle 2 produced no valid closure, and candle 3 closes BELOW the opening
  price of candle 2. Bullish: candle 3 closes ABOVE the opening price of candle 2.'
- If candle 3 never closes beyond candle 2's opening price, it is not a candle 3 closure at all and
  the lower timeframes are not consulted.
- 'READING B (from the sibling unit ..._01, not from this unit''s videos): the C3 closure reference
  is candle 2''s EXTREME -- closes above candle 2''s high (bullish) / below candle 2''s low (bearish).
  Reading B is strictly stronger than Reading A and will select a subset of Reading A''s bars, so a
  detector should compute both and report the disagreement rate.'
- A candle 3 closure, like a candle 2 closure, still requires a change in the state of delivery inside
  it on the paired lower timeframe before a candle 4 continuation is sought.
- 'Candle 3 as a trade: direction = the direction the confirmed candle 2 reversed toward. Trade only
  after candle 2 is a REVERSAL candle (large wick, opens and closes near the same point); a candle 2
  that expanded is a disqualifier because a new phase of price may begin.'
- 'Exception to that disqualifier: if candle 2 expanded but left short-term drawn liquidity intact,
  candle 3 is still tradeable because there is a spot for it to reach for.'
- Inside candle 3, let the wick form against the intended direction, then trade the body -- entry via
  a continuation order block, not on the reversal.
- Aligning candle 3 across several timeframes at once (e.g. daily C3 + 4H C3 + 15m protected swing)
  is the stated highest-expansion condition.
invalidation:
- Candle 3 fails to close beyond candle 2's opening price (closure sense).
- Candle 3 itself prints as a reversal candle rather than expanding -- he then looks to candle 4 instead.
- The candle 2 protected swing is taken out.
- Price closes beyond the EQ of the preceding candle on the aligned timeframe (see invalidation-trade).
execution:
  bias: The direction the confirmed candle 2 reversed toward.
  entry: 'Continuation order block inside candle 3 on the paired lower timeframe: price reaches a point
    of interest, then closes through the series of opposing candles that went into it.'
  stop: The protected swing created by that continuation; body extreme if R is insufficient.
  targets:
  - previous day / week high or low
  - failure swings and equal highs/lows
  - -1 / -2 / -2.5 standard deviation projections
measurable:
- frequency of candle 3 closures (close beyond C2 open) vs candle 2 closures, by timeframe
- expansion of C3 conditioned on whether C2 was a reversal candle or an expansion candle
- hit rate of C3 continuation when 1 / 2 / 3 timeframes are simultaneously in C3
