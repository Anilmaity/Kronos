ambiguities:
- 'Two wordings for the same reference level: vn1RYjhJUnQ says ''the opening price in candle 2'', SF61vCsBl1A
  says ''below the body of candle two''. These coincide only when candle 2 closed in the sweep direction;
  when candle 2''s body low is its close rather than its open, the two tests differ and no tie-break
  is given.'
- The dedicated candle 3 video (qdQYhePcvGE, the longest in the unit) never states the closure test
  in price terms at all -- it teaches candle 3 purely as 'the continuation after a confirmed candle
  2'. The mechanical closure definition comes only from vn1RYjhJUnQ and SF61vCsBl1A.
- In one aside he says candle 3 'can be a reversal candle' too, without saying how to tell that case
  apart in advance.
- This unit contains no reading in which candle 3 is defined against the previous candle's EQ; the EQ
  appears only as the candle-4 continuation filter and as an invalidation level. This matters because
  the library's previously recorded EQ-based C3 rule was degenerate (nearly every candle closes above
  or below the prior EQ); the open/extreme references recorded here are not.
- 'CONTESTED across the two halves of the same playlist: unit ..._01 records the reference as candle
  2''s high/low, this unit records it as candle 2''s opening price / body. No source read here
  reconciles them. Sources for reading B are not cited here because those transcripts were not read
  by this agent -- see the ..._01 drafts.'
