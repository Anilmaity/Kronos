id: fractal-model-c3
name: Candle 3 Continuation (the easier trade)
category: model
status: contested
aliases:
- C3
- candle 3 closure
- the continuation candle
- the distribution candle
definition: 'Candle 3 is the candle after candle 2, and it carries two distinct meanings that the primary
  teaching finally separates. (a) As a TRADE: candle 3 is the continuation traded away from a confirmed
  candle 2 reversal -- the direction is supplied by the candle 2, not by candle 3 itself. (b) As a CLOSURE
  (a swing-point definition in its own right): a candle 3 closure exists only when candle 2 failed to
  produce a closure, and it is defined as candle 3 closing beyond the OPENING PRICE of candle 2 -- below
  it in the bearish case, above it in the bullish case. This is the missing direction input: the reference
  is candle 2''s open (equivalently, in the ideal-formation video, candle 2''s body), not the prior
  candle''s equilibrium. It is one-sided and therefore decidable. CONTESTED: the sibling unit
  build_a_model_intro_to_ttrades_fractal_model_01 records a stricter reference for the same closure
  -- beyond candle 2''s EXTREME (its high/low) rather than its open/body. Both readings are recorded
  below; this unit''s videos state the open/body reference explicitly and verbatim.'
