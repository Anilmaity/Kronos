id: average-daily-range
name: Average Daily Range (eyeballed) as target filter
definition: 'The daily range is eyeballed off the last few daily candles, never computed. He states
  outright that he does not use ATR mechanically and just looks at the daily chart to ask how far
  price can go. Concrete numbers said aloud: on NASDAQ (NQ) the recent daily candles ran about 600
  points each, so ~600 was called a good range and used to place the day''s target - one prior day
  was noted as an unusual 1,000; another session was sized at 400-500. Gold was given an assumed ~80-point
  range and silver ~2.4. When the range is already covered he will not enter.'
category: risk
status: underspecified
detection_rules:
- Read the last few daily candles and take a representative range figure by eye.
- Project that figure from the session open to place the day's target.
- If the range is already covered, do not enter - the candle has already made its range.
- 'Recent reference figures spoken aloud: NQ ~600 points, gold ~80, silver ~2.4.'
measurable:
- difference between an eyeballed range and a computed N-day ATR on the same instrument
- hit rate of targets placed at the eyeballed range distance
sources:
- video_id: m0wTBdUe7gs
  title: New York Open Live Q&A
  quote: I personally just look at the daily chart
- video_id: yNgx9OAefuI
  title: New York Open Live Q&A
  quote: I don't use them mechanically
ambiguities:
- No lookback, no averaging method, no ATR - the figure is explicitly a judgement from the last few
  candles, so two traders will not derive the same number.
- The instrument figures are point values on that date and are not scale-invariant; they cannot be
  reused as constants.
- Whether the range is measured high-to-low or open-to-target is not stated; the worked examples project
  from the open.
