id: smt-requires-framework
name: SMT Is a Confirmation, Not a Framework
definition: Held to firmly under live pressure. Viewers repeatedly point at an SMT on the previous
  day's low as a reason to reverse; he refuses each time on the grounds that SMT and PSP are only
  looked at when a valid fractal model already exists. He states he does not care about them absent
  a model. Consistent with this, his indicator only marks SMTs at the specific places his model looks
  - a reversal SMT and a continuation SMT - and he declines to make it more sensitive, because marking
  arbitrary SMTs is not the point.
category: liquidity
status: specified
detection_rules:
- Establish the fractal model first; only then look for SMT or PSP.
- An SMT with no model behind it produces no trade, however clean.
- 'Only two SMT locations are relevant: at a reversal and at a continuation within the model.'
- An SMT at a level that has not been reached is doubly irrelevant - the level must matter first.
measurable:
- expectancy of SMT signals with a model present vs absent
- count of arbitrary SMTs filtered out by restricting to model locations
sources:
- video_id: NESSCPMzWR0
  title: New York Open Live Q&A
  quote: I do not care unless I have a model
- video_id: yNgx9OAefuI
  title: New York Open Live Q&A
  quote: it looks for a reversal SMT and a continuation SMT within my model
ambiguities:
- PSP is named alongside SMT and given the same treatment, but is not defined in these streams.
- An SMT he marked by hand on stream would not have been marked mechanically by his own indicator
  - so the discretionary and mechanical definitions do not coincide.
