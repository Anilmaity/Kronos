id: intraweek-reversal-week
name: Intraweek Reversal (weekly profile)
category: model
status: specified
definition: 'SHORTS EVIDENCE with a stand-aside rule attached. Monday expands (continuing the previous
  week''s Thursday reversal), Tuesday also expands, and Wednesday forms the intraweek reversal - which
  then sets up Thursday as a continuation day and, depending on how Thursday closes, Friday as another.
  The operative instruction is what to do with Tuesday: leave it alone because it has already expanded
  a fair bit, and wait for a NEW SWING POINT to form. That swing point is Wednesday, and it is what
  licenses the Thursday and Friday continuations.'
preconditions:
- Monday and Tuesday have both expanded in the same direction.
detection_rules:
- Do not trade the second consecutive expansion day - it has already spent its range.
- Wait for a new swing point to form (typically Wednesday).
- Once that swing point exists, look for Thursday to continue in the reversed direction.
- Judge Friday on how Thursday closes - a continuation closure licenses a Friday continuation.
- Confirm the level with a close below the up-close candles and below the equal lows.
measurable:
- frequency of the Wednesday-reversal profile per quarter
- hit rate of Thursday and Friday continuations after a Wednesday swing point
