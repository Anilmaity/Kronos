id: breakeven-after-new-protected-swing
name: Move the Stop Only After a New Protected Swing Forms
definition: 'Trailing is anchored to structure, not to profit. As price forms each new protected swing,
  the stop can be moved to it - the same marked levels are described as being either entries or trail
  points. For a coarse trail he uses daily swings; when he wants to tighten up because momentum is
  visibly slowing, he drops to a lower timeframe and trails to the new protected swing there, on the
  reasoning that price ideally should not return to it. He also reframes the pullback for a nervous
  trader: a pullback is not a threat, it is the thing that creates the next level to trail to.'
category: risk
status: specified
preconditions:
- An open position with at least one new protected swing formed since entry.
detection_rules:
- Move the stop only when a new protected swing has formed.
- 'Coarse trail: daily swing points.'
- 'Tighter trail: drop a timeframe and use the protected swings there.'
- Tighten when momentum is visibly slowing, not on a fixed R.
measurable:
- give-back per trade under structural trailing vs a fixed break-even move
- how often price returns to the trailed protected swing
sources:
- video_id: yNgx9OAefuI
  title: New York Open Live Q&A
  quote: this is either entries or you can trail your stop here
- video_id: xraklBJHW5k
  title: New York Open Live Q&A
  quote: If you want to trail tighter, you can just use a lower time frame
ambiguities:
- '''Momentum slowing'' is the trigger for tightening and is purely visual.'
- He allows using a swing that is 'not technically protected' when nothing else is available on the
  timeframe, which weakens the rule.
