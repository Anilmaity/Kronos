id: ideal-formation
name: "Ideal Formation (closure and protected swing in the same bar)"
category: model
status: specified
definition: >
  The Shorts restatement of the ideal formation, delivered as an explicit negative case. A candle
  2 closure is NOT ideal merely because it closes over candle 1's body; it is ideal only when the
  same bar simultaneously creates a protected swing, which means closing over the series of
  opposing (down-close, in the bullish case) candles that traded into the point of interest. The
  worked counter-example identifies the two down-close candles that reached the fair value gap
  and states price would have had to close over that level to qualify. A second Short gives the
  positive case: the ideal continuation is one where the swing point and the protected swing are
  formed by the same V-shaped recovery.

timeframes:
  htf: ["1D", "4H"]
  ltf: ["1H", "15m", "5m"]
  fractal: true

detection_rules:
  - "Locate the extreme of the closure candle and the series of opposing candles that traded into the point of interest."
  - "Ideal iff the closure candle closes beyond that series in the same bar as the candle 2 closure."
  - "Closing over candle 1's body alone is explicitly stated NOT to make the closure ideal."
  - "In a continuation, the ideal case is a V-shape recovery that forms the swing point and the protected swing together."

invalidation:
  - "The closure clears candle 1's body but not the opposing-candle series into the point of interest."

measurable:
  - "share of candle 2 closures that also clear the opposing-candle series"
  - "expansion of the following candle, ideal vs not ideal"

sources:
  - video_id: OjSyhPw1WIw
    title: "What Is NOT an Ideal Candle 2 Closure?"
    quote: "price has to make a candle to closure while simultaneously creating a protected swing"
  - video_id: OjSyhPw1WIw
    title: "What Is NOT an Ideal Candle 2 Closure?"
    quote: "close over the series of down close candles into the point of interest"
  - video_id: _w0AXMw04Sk
    title: "What Does an Ideal Continuation Look Like?"
    quote: "this is an ideal formation as we're forming a swing point"

ambiguities:
  - "The Short does not bound the 'series of opposing candles' - the worked example happens to contain exactly two."
  - "Whether the required close is a body close or a wick close is not stated in either Short."
  - "The PDF he refers to ('what did we learn in the PDF') is not in the corpus, so the canonical wording is not recoverable here."

python_detector: null
related: ["fractal-model-c2", "protected-swing", "point-of-interest", "v-shape-reversal-speed"]

