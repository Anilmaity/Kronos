id: propulsion-block
name: Propulsion Block
aliases:
- propulsion block
category: structure
status: underspecified
definition: 'Named twice in this unit and defined neither time. In the first use, a sweep of a low
  followed by a close over the down-close candles that made it produces what he calls a valid order
  block ''or in this case a propulsion block''. In the second, a newly formed propulsion block is
  used as a floor: he does not anticipate price trading below it and he does not want to see a close
  below its mean threshold (the auto-caption renders mean threshold as ''main threshold''). Both
  uses place it inside an existing directional leg rather than at a fresh higher-timeframe level,
  which is the only thing distinguishing it from an ordinary order block - and that distinction is
  inferred from usage, never said.'
timeframes:
  htf:
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- An existing directional leg with an order block already established behind it.
- A sweep of a lower-timeframe low (bullish case) inside that leg.
detection_rules:
- 'Constructed identically to a continuation order block: price sweeps a low, then closes over the
  series of down-close candles that made it.'
- Once formed it is treated as a floor - price is not anticipated to trade below it.
- A close below its mean threshold is explicitly not wanted.
- In both uses it sits INSIDE an existing leg rather than at a fresh higher-timeframe level; this
  is the only observable difference from an order block and it is never stated as a rule.
invalidation:
- A close below the mean threshold of the block.
measurable:
- how often a block he labels propulsion holds versus an ordinary continuation order block in the
  same leg
- frequency of closes below the mean threshold and what follows them
sources:
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: a valid order block or in this case a propulsion block
- video_id: iEaMbuFZb24
