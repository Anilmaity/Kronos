  quote: I formed a new propulsion block here
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: I don't want to see a close below the main threshold of it
ambiguities:
- Never defined. The difference from an ordinary order block is inferred purely from where it sits.
- Its mean threshold is invoked without saying whether it is measured on the bodies (as for an order
  block) or on the full candle range.
- the_foundation_01 recorded the same term from the IFVG video as 'an order block formed off another
  order block'; the two accounts are compatible but neither is a definition, and they are still unreconciled.
- No statement of whether a propulsion block can be entered on, or is only a level that must hold.
