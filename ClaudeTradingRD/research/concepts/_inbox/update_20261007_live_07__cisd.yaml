id: cisd
name: Change In The State Of Delivery (CISD)
category: entry
status: contested
definition: 'Answering why a visible 15-minute CISD on NQ was ignored: it was not paired with a swing
  point and it went against the established bias (NQ the bullish asset). He states volatility is NOT part
  of the CISD definition; the exclusion is consolidation - do not use a CISD formed inside consolidation.'
detection_rules:
- Ignore a CISD not paired with a swing point.
- Ignore a CISD that opposes the day's bias for that asset.
- Do not require volatility; do exclude CISDs formed within consolidation.
