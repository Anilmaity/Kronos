id: ict-2022-mentorship-study-path
name: The Prescribed Study Path (2022 mentorship first, then market maker series)
aliases:
- braveheart notes
- episode 12 and 13
category: psychology
status: specified
definition: Asked repeatedly across this unit how to learn, the host and two of the guests give the
  same answer with no disagreement between them. Watch ICT's 2022 mentorship series start to finish,
  in order, before anything else, and master what is in it before seeking more. The explicit warning
  is that it is easy to scroll back past that series into older uploads and find something that sets
  you back and confuses you. After the 2022 series the recommended additions are the market maker
  series and advanced market structure, with episodes 12 and 13 named for short-term / intermediate-term
  / long-term highs and lows. The host adds a consumption tactic - watch at 1.5x speed while warming
  up at the gym - and pushes back on the 'he rambles too much' objection as a motivation problem rather
  than a content problem. A third-party notes document, referred to as the Braveheart notes, is recommended
  as a study companion for its worked examples that are not in the videos.
timeframes:
  htf: []
  ltf: []
  fractal: false
preconditions:
- A trader starting on ICT material.
detection_rules:
- Watch the ICT 2022 mentorship series in order, start to finish, before other material.
- Master its content before adding anything; do not scroll back into older uploads.
- Then add the market maker series and advanced market structure - episodes 12 and 13 are named.
- Pair the videos with the third-party Braveheart notes document.
invalidation:
- Not applicable - a study path.
measurable:
- time to first consistent month, split by whether the path was followed in order
- concept coverage of the 2022 series against the concepts actually used in a live model
