id: weekly-written-game-plan
name: "Written Weekly Game Plan"
aliases: ["pre-week plan", "pre-session game plan"]
category: psychology
status: specified

definition: >
  A written plan produced on Sunday or Monday night, in words rather than only charts, that
  pre-classifies each day of the coming week. Inputs, in order: the economic calendar; what
  the weekly and daily charts are reaching for; and the correlated set (ES, YM, NQ, DXY,
  bonds - bonds correlating with indices and DXY inversely correlated with both). Each day
  is labelled no-trade / low probability / medium probability with a stated reason, and the
  plan is framed as if-this-then-that so that the decision is already made before the
  session. A shorter four-line pre-session plan is written every morning: bias, the liquidity
  above, the liquidity below, the news, and whether today is a low-probability day.

timeframes:
  htf: ["1W", "1D"]
  ltf: []
  fractal: false

preconditions:
  - "Access to the economic calendar and the correlated instruments."

detection_rules:
  - "Write the plan before the week starts, in sentences, not only chart markups."
  - "Include: economic calendar, weekly/daily draw, correlated set read (indices, DXY, bonds)."
  - "Label each day no-trade / low probability / medium probability with a reason."
  - "Express the plan as if-this-then-that conditions."
  - "Write a four-item pre-session plan each morning: bias, upside liquidity, downside liquidity, news / low-probability status."

invalidation:
  - "Not applicable - process rule. The plan may be traded against only after a clear daily shift or the invalidation of a HTF PD array."

measurable:
  - "adherence rate: trades taken that were pre-authorised by the plan"
  - "P&L of plan-conforming trades vs improvised ones"

sources:
  - video_id: G44VpidBD_U
    title: "NickDoesFutures | Unicorn Model & Experiences With ICT"

ambiguities:
  - "Bonds/DXY correlation is asserted as a working assumption, not measured."
  - "No rule is given for how much of the plan must be invalidated before it is abandoned wholesale."

python_detector: null
related: ["low-probability-day-checklist", "model-vs-entry-pattern", "post-trade-journaling-protocol"]
