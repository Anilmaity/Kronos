id: relevant-swings-separation
name: Relevant Swing Highs and Lows (separation)
aliases:
- relevant swing high
- relevant swing low
- relevant highs and lows
- valid separation
- not relevant
category: structure
status: underspecified
definition: The dedicated teaching video for the term. A relevant swing is a swing point that has
  enough vertical separation from the next same-side extreme that a reversal off it can be trusted
  without that neighbouring extreme being taken first. Swings sitting close to another same-side extreme
  are failure swings and are not levels he will trade away from; you go outward to the extreme and
  mark that instead. Relevant swing highs and lows are the only places he looks for a reaction or
  a reversal, and they are also the targets. He states outright that he has no mechanical rule for
  how much separation is enough - it is discernment gained from experience.
timeframes:
  htf:
  - 1M
  - 1W
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  fractal: true
preconditions:
- A chart with completed swing points that can be marked.
detection_rules:
- 'Mark every swing point (bullish: a low with a higher low on each side; bearish: a high with a lower
  high on each side).'
- For each candidate, compare it with the nearest same-side extreme.
- If the two sit close together, the candidate is a failure swing, not a relevant swing; go outward
  and mark the extreme instead.
- If there is visible separation, mark the candidate as the relevant swing - it may be used both as
  a point of interest for a reversal and as a target.
- A swing that is technically a failure swing can still be relevant if its separation from the neighbour
  is large (stated explicitly on one example).
- Once a relevant high is reached and price does not reverse off it, the next extreme beyond becomes
  the relevant high; multiple relevant swings can be live at once.
- Keep the stop-loss side free of failure swings - want high resistance liquidity there.
- No numeric or percentage threshold defines 'enough separation'.
invalidation:
- Price reaches the relevant swing and does not reverse - the level is superseded by the next extreme
  beyond it.
measurable:
- reversal rate at swings bucketed by separation-to-neighbour distance (in ATR)
- frequency with which a low-separation swing is taken out before the outer one holds
