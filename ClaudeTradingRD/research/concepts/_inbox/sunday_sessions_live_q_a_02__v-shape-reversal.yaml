    title: "New York Open Live Q&A"

ambiguities:
  - "No geometric definition (retracement fraction, bar count, wick/body ratio) is ever given."
  - "The relationship between 'V-shape' and 'deep retracement' is asserted rather than defined - they may be the same test stated twice."

python_detector: null
related: ["shallow-retracement", "cisd", "fractal-model-c2", "continuation-over-reversal"]
