ambiguities:
- '''Aggressive'' is again the load-bearing, unquantified word.'
- Whether the two gaps must be adjacent in time or may be separated is not stated.
- The 'too much risk' fallback (frame a narrative instead) has no risk threshold attached.
- 'ATTRIBUTION: he credits the closely-related box shape to ''Alex''s Box video'', a third party.'
