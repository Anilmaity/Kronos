id: balanced-price-range-overlap
name: Balanced Price Range (BPR)
aliases:
- BPR
- balance price range
- aggressive buy met with an aggressive sell
category: structure
status: specified
definition: 'TTRADES'' OWN PRIMARY STATEMENT of a concept the library previously held mainly in a guest''s
  voice. A BPR is formed where a bearish fair value gap and a bullish fair value gap OVERLAP. The traded
  zone is the SMALLER of the two gaps - i.e. the intersection - and the trade is the retracement back
  into it. Structurally it is ''aggressive price action used to your advantage'': an aggressive move one
  way immediately met by an aggressive move the other. He is explicit that it is the same shape as the
  box setup (break out of consolidation, return, retest, go), and that it can be used as a bias tool on
  higher timeframes as well as an entry on lower ones.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  - 15m
  ltf:
  - 1m
  fractal: true
preconditions:
- A higher-timeframe point of interest / liquidity raid gives a reason to be looking in that direction.
- Two opposing fair value gaps that overlap in price.
detection_rules:
- Find a bearish fair value gap and a bullish fair value gap whose price ranges overlap.
- BPR := the intersection - whichever of the two gaps is smaller.
- Trade the retracement back into that zone, in the direction of the second (later) aggressive move.
- Reject a BPR that sits on the wrong side of the range's equilibrium - do not buy one in a premium.
- Require a prior liquidity raid / point of interest under (or over) the zone before taking it.
- 'If the zone gives too much risk, use it to frame the narrative instead: wait for an internal low to
  form and be taken, then look for the long.'
invalidation:
- Price closes through the overlap zone without reacting.
- The zone sits in a premium (for longs) / discount (for shorts) of the operative range.
execution:
  bias: Direction of the second aggressive move.
  entry: Retracement into the overlap.
  stop: Beyond the extreme that formed the first gap.
  targets:
  - Equal highs / lows
  - The higher-timeframe draw
measurable:
- reaction rate at the intersection vs at the full extent of either gap
- how often the BPR sits on the correct side of equilibrium when it is otherwise valid
- frequency of BPRs per session on 1m / 15m
