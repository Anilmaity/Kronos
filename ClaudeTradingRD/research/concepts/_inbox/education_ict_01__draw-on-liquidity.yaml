ambiguities:
- 'EVOLUTION, NOT CONTRADICTION: the later FXJBFbZQbck collapses the draw to a binary between previous
  day high and previous day low; this earlier recording keeps an open list of PD arrays with no ranking.
  Both readings preserved; the later one is canon for the simplified form.'
- No precedence rule among the candidate levels - 'the next PD array that draws my eyes'.
- '''Displacing'' / ''fails to displace'' are used without a threshold.'
- '''The occasional volume imbalance'' is admitted as a discretionary extra.'
