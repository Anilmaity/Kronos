id: draw-on-liquidity
name: Draw On Liquidity (DOL)
aliases:
- DOL
- where price is likely to draw to
category: liquidity
status: contested
definition: 'EARLIER RECORDING (old ''Education - ICT'' playlist; later re-recorded as FXJBFbZQbck, which
  reduces the whole thing to previous day high / previous day low). This earlier version is a broader
  SEARCH LIST rather than a binary. He looks for external liquidity (old highs and lows, equal highs and
  lows), then internal liquidity (fair value gaps, order blocks, and occasionally volume imbalances or
  gaps in price), and then adds two behavioural reads on top: where price FAILS TO DISPLACE over a low
  or high, and where price IS displacing to - following the displacement is ''generally right''. The draw
  is established each morning and then used as the target that keeps him in a lower-timeframe position
  when the noise argues against it.'
timeframes:
  htf:
  - 1M
  - 1W
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- The execution timeframe is fixed first - the draw timeframes are chosen relative to it.
detection_rules:
- 'Choose the draw timeframes relative to the entry timeframe: entering on 5-minute and lower -> daily,
  4-hour and 1-hour supply the draw.'
- Entering on the 1-hour -> look up to the weekly and monthly instead.
- 'External candidates: old highs, old lows, equal highs, equal lows.'
- 'Internal candidates: fair value gaps, order blocks, occasionally volume imbalances / gaps in price.'
- 'Behavioural read 1: failure to displace over a low or high argues for the opposite side as the draw.'
- 'Behavioural read 2: follow the displacement - the side price is displacing toward is generally the
  draw.'
- Once the draw is set, use it to hold through lower-timeframe noise rather than to time the entry.
invalidation:
- Price displaces through the level that was the draw - the next PD array becomes the draw.
measurable:
- hit rate of the nominated draw being reached the same day
- relative accuracy of the failure-to-displace read vs the follow-the-displacement read
- how often the draw sequence chains (one PD array reached, next one nominated)
