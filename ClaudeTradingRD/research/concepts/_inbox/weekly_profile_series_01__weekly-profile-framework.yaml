id: weekly-profile-framework
name: "Weekly Profile (for Daily Bias)"
aliases: ["weekly profile", "weekly profile for daily bias"]
category: model
status: specified

definition: >
  A method for deriving daily bias from the shape the current weekly candle is forming.
  You do not predict which weekday will make the high or low of the week; you let the
  weekly extreme form, confirm it with a daily candle 2 closure plus an hourly change in
  the state of delivery inside that candle, and then trade the following days as
  continuations away from that extreme. The weekday on which the confirmed extreme forms
  classifies the week into one of the named profiles (classic expansion, midweek reversal,
  consolidation reversal, intraweek reversal, Thursday counter), with TGIF as a
  Friday-only trade of the resulting weekly wick. The speaker states repeatedly that the
  profiles are logic, not templates to be matched, and that they are most useful precisely
  when the fractal model does not print a picture-perfect setup.

timeframes:
  htf: ["1W", "1D"]
  ltf: ["1H"]
  fractal: true

preconditions:
  - "A directional bias exists, generally taken from a weekly-timeframe reversal candle or an expectation of expansion in one direction."
  - "The current week is in progress; at least one daily candle has closed."

detection_rules:
  - "For each closed daily candle of the current week, ask whether the high (bearish bias) or low (bullish bias) of the week can be considered formed."
  - "A day qualifies as the weekly extreme only if it prints a candle 2 closure on the daily chart."
  - "Confirm that candle 2 closure by locating a change in the state of delivery on the 1H chart inside that daily candle; without it the extreme is not confirmed."
  - "If the current day does not qualify, let another daily candle print rather than declaring the extreme."
  - "Classify the week by the weekday of the confirmed extreme: Monday/Tuesday = classic expansion; Wednesday = midweek reversal; Thursday after a Mon-Wed consolidation = consolidation reversal; Thursday after an unanchored Mon-Wed expansion = Thursday counter; a confirmed reversal that is not the weekly extreme = intraweek reversal."
  - "Trade the days after the confirmed extreme as continuations (candle 3, then candle 4 if candle 3 closes well)."

invalidation:
  - "The candidate extreme day closes as an opposing expansion candle rather than a reversal candle."
  - "The required hourly change in the state of delivery has not yet closed through; the extreme stays unconfirmed."
  - "Price trades beyond the confirmed extreme, removing the swing point being traded away from."

execution:
  bias: "Away from the confirmed weekly extreme, in the direction of the pre-existing higher-timeframe bias."
  entry: "On the day after the confirmed extreme (candle 3), after the hourly change in the state of delivery inside the extreme candle."
  stop: "Not specified at the framework level; the individual profiles reference the protected swing or the reversal candle's extreme."
  targets: ["higher-timeframe key level / objective", "average daily range"]

measurable:
  - "distribution of the weekday on which the weekly high and weekly low actually form"
  - "frequency of each of the five week classifications"
  - "hit rate of candle 3 continuing in the anticipated direction, conditioned on the hourly CISD being present vs absent"
  - "how often a daily candle 2 closure at the weekly extreme is NOT accompanied by an hourly CISD"

sources:
  - video_id: Qt7Ek4keMzs
    title: "Weekly Profile for Daily Bias - Classic Expansion"
    quote: "not trying to match templates together, but instead finding the high or the low"
  - video_id: McJflkKuvrI
    title: "Weekly Profile for Daily Bias - Consolidation Reversal"
    quote: "I prefer to wait for the continuation day on the following day"
  - video_id: uPUNOi_R9fA
    title: "Weekly Profile for Daily Bias - Thursday Counter"
    quote: "It is not 100%. Things do fail."
  - video_id: -gyDd_E_qD4
    title: "Weekly Profile for Daily Bias - Midweek Reversal"
  - video_id: FvOUvQ7odiw
    title: "Weekly Profile for Daily Bias - Intraweek Reversal"
  - video_id: _CSO5Mf7CM8
    title: "Weekly Profile - TGIF Setup"

ambiguities:
  - "The bias that must exist before applying the framework is sourced outside this unit; no bias-formation procedure is given in any of the six videos."
  - "'Closes well' / 'closes strong' gates whether candle 4 is taken, but is never quantified."
  - "'Average daily range' is used as an expansion stop-point with no stated lookback or calculation."
  - "The classification is presented as a set of named profiles rather than an explicit decision tree; the ordering used here (classic expansion checked first, then midweek reversal, then consolidation reversal) is stated only in the Consolidation Reversal video and is assumed to generalise."
  - "The speaker allows a profile to be read even when its own preconditions are partly violated ('use the logic'), which makes strict classification of borderline weeks undecidable from the videos alone."

python_detector: null
related: ["classic-expansion-week", "midweek-reversal-week", "consolidation-reversal-week", "intraweek-reversal-week", "thursday-counter-week", "tgif-setup", "hourly-cisd-confirmation", "expansion-exhaustion-avoid-price"]
