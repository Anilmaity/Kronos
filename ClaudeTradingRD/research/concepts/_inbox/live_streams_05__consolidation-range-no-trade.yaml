id: consolidation-range-no-trade
name: No Interest While Consolidating
category: risk
status: specified
definition: Applied live to gold across both videos of this unit. Gold is in a consolidation, so it
  is not watched that day at all - he says he will simply not trade it and that viewers may do as
  they like. The generalisation he states is a preference for a trending market over a consolidating
  one. The disqualifying signature named here is small days with small bodies; the re-entry condition
  is that the range boundary be taken (in the gold case, the range high) before it becomes interesting
  again.
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  fractal: false
preconditions:
- The instrument is inside a defined range.
detection_rules:
- An instrument printing small days and small bodies inside a range is not traded and not monitored.
- It becomes interesting again only once the range boundary is taken out.
- Prefer a trending instrument over a consolidating one when choosing what to watch.
invalidation:
- The range extreme is taken and a new phase of price begins.
measurable:
- P&L of trades taken inside identified consolidations vs outside them
- expansion range after the boundary is taken
sources:
- video_id: tDiwwMRWF2k
  title: New York Open Live Q&A with NickDoesFutures
  quote: gold is in a consolidation. Not going to watch it today
ambiguities:
- '''Small days, small bodies'' is not quantified.'
- The range itself is drawn by eye; no rule defines its boundaries.
related:
