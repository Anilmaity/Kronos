id: consequent-encroachment
name: Consequent Encroachment (CE)
aliases:
- CE
- the 50 of the fair value Gap
category: entry
status: contested
definition: '50% of a fair value gap, and the level on which the gap''s fate is judged. The canonical
  FVG video contains two incompatible statements about the same threshold, in the same video. Reading
  A (invalidation): the one thing he looks for when invalidating a fair value gap is a close - when
  price starts to close over the consequent encroachment OR outside the fair value gap, price is
  not respecting it and often will not reverse back. Reading B (hint only): in the inversion walkthrough
  the close below the consequent encroachment is called the FIRST CLUE, followed by a failure to
  displace back out, and he then waits for a close below the whole fair value gap before treating
  it as inverted. the_foundation_01 recorded Reading B from the IFVG video as the library position
  (''explicitly NOT sufficient'').'
variants:
  detection_rules:
  - Reading A - a close over the CE is itself sufficient to invalidate the gap as a level to trade
    from.
  - Reading B - a close over the CE is a clue only; the gap is not written off (and not inverted)
    until a close beyond the whole gap.
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- A defined fair value gap with a known high and low.
detection_rules:
- ce := (gap_high + gap_low) / 2.
- 'Respect: price reaches the CE and reacts away; he prefers a candle to close back outside the gap
  but accepts respect of the CE alone, saying he is pretty flexible with that.'
- 'Reading A (invalidation threshold): a close over the CE or outside the gap means price is not
  respecting it - he calls that invalidating the fair value gap.'
- 'Reading B (inversion threshold): a close below the CE is the first clue; add a failure to displace
  back out; only a close below the whole fair value gap declares the inversion.'
- 'The probable reconciliation, not stated by him: the CE close kills the gap as a level to trade
  FROM, while the full-gap close is what licenses trading it as the opposite polarity. Recorded here
  as an inference, not as his words.'
invalidation:
- Under Reading A, a close beyond the CE; under Reading B, a close beyond the far edge of the gap.
measurable:
- conditional reaction rate after a close beyond the CE but not beyond the gap - this single statistic
  decides between the two readings
- fill rate of CE entries vs near-edge entries
sources:
- video_id: ZVUDpCyvxfQ
  title: Understanding Fair Value Gaps (FVG) - ICT Concepts
  quote: close over the consequent encroachment or outside of the fair value Gap
- video_id: ZVUDpCyvxfQ
  title: Understanding Fair Value Gaps (FVG) - ICT Concepts
  quote: our first clue is that this close below the consequent encroachment
- video_id: ZVUDpCyvxfQ
  title: Understanding Fair Value Gaps (FVG) - ICT Concepts
  quote: the consequent encroachment or the 50 of the fair value Gap
ambiguities:
- The contradiction is INTERNAL to a single video, so it cannot be resolved by preferring one source
  over another.
- '''Respecting the consequent encroachment'' is explicitly a flexible judgement, not a threshold.'
- Whether the 50% is measured on the gap boundary prices or on the outer candles' wicks is still
  not stated.
- Whether a wick through the CE without a close counts is not addressed.
