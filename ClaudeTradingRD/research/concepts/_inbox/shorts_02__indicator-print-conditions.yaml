id: indicator-print-conditions
name: What Counts As A Valid Model (closure plus CISD)
category: model
status: specified
definition: 'A Short shows the negative case, which is the cleanest way the rule has been stated: a
  run of all the highs to the left plus a nice V-shape reversal closing as a bearish candle 2 closure
  is NOT yet a valid setup. Validity requires confirmation by a lower-timeframe change in the state
  of delivery at the identified level. Price fails to close below that level, and he states the consequence
  twice - it is not a valid bearish setup, and his indicator will not print one. What followed was a
  range: one side swept, then a move to the other side.'
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  fractal: true
preconditions:
- A candle 2 closure has printed on the higher timeframe.
detection_rules:
- A candle 2 closure alone - even with a V-shape reversal that ran all the highs to the left - is not
  a valid setup.
- Identify the lower-timeframe level whose breach would be the change in the state of delivery.
- Require a close below (bearish) / above (bullish) that level.
- If that close does not happen, the setup is not valid and the indicator does not print it.
- 'Expect a range in that case: one side swept, then a trade to the other side.'
invalidation:
- The lower-timeframe CISD level is never closed through.
measurable:
- share of HTF candle-2 closures that never get their LTF CISD
- outcome distribution of unconfirmed C2 closures (range versus continuation)
sources:
- video_id: zYDn5B3UNBw
  title: No Confirmation = No Valid Swing Point
  quote: confirm it with a lower time frame change in the state of delivery
- video_id: zYDn5B3UNBw
  title: No Confirmation = No Valid Swing Point
  quote: When it fails to form the change in the state of delivery
- video_id: zYDn5B3UNBw
  title: No Confirmation = No Valid Swing Point
  quote: that means it's not a valid bearish setup
ambiguities:
- The lower timeframe used for confirmation is not named in the clip - only "a lower time frame".
- No time limit is given for the CISD to arrive after the closure.
- Whether the CISD close must be a body close is not stated.
- The indicator behaviour is cited as evidence of the rule, which makes the rule partly a statement
  about the tool rather than about price.
