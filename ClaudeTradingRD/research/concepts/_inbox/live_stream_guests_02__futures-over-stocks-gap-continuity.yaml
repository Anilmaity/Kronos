id: futures-over-stocks-gap-continuity
name: Trade Futures, Not Stocks, Because Stock Charts Gap
aliases:
- daily candles open where the previous closed
category: risk
status: specified
definition: 'Asked whether the methodology applies to stocks, AM Trades says he has not backtested it
  and gives a structural objection: a stock does not trade through the London-to-Asia window, so its
  daily chart is full of gaps, which makes the daily candle unreadable. The futures chart is ''very
  fluid'' - each daily candle opens where the previous day closed - which is what the profile and power-of-three
  reading depend on. He demonstrates the contrast directly between the NQ futures daily chart and the
  QQQ ETF daily chart. He adds a second, separate reservation: he does not actually know whether stocks
  follow ICT concepts.'
timeframes:
  htf:
  - 1D
  ltf: []
  fractal: false
preconditions: []
detection_rules:
- Prefer instruments whose daily candle opens at the previous day's close (futures) over ones with overnight
  gaps (cash equities, ETFs, CFDs).
- If an instrument's daily chart contains regular opening gaps, the daily open/high/low/close profile
  reading is not reliable on it.
invalidation: []
measurable:
- proportion of daily bars with an opening gap, per instrument class
- profile classification agreement between a futures chart and its ETF proxy
sources:
- video_id: wGYde-h84cs
  title: Live Q&A with AM Trades - Weekly Profile
  quote: the daily candles start or they open where the previous day closed
ambiguities:
- He does not exempt or address instruments that gap only occasionally.
- The host adds separately that an index CFD is 'not the same as futures' and 'a little more gappy'
  - a consistent but independently stated point.
