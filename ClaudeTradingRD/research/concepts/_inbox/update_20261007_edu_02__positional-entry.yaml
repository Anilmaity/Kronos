id: positional-entry
name: Positional Entry At An Invalidation On The Open
category: entry
status: specified
voice: ttrades
definition: >
  Restated twice in this unit: when the protected swing forms before the new higher-timeframe candle
  opens, enter around that opening price with the stop on the protected swing (breakouts video, last
  example); in the London model a continuation formed with SMT 'prior to the open the new higher
  time frame candle' can be taken as a positional entry, or one can wait for a new continuation.
detection_rules:
- If the protected swing forms before the higher-timeframe open, enter around the opening price, stop at the protected swing.
sources:
- video_id: 8yt3jn8L6O4
  title: How to Trade Breakouts (Failure to Manipulate)
  quote: enter around the opening price with our stop on that protected low
- video_id: tUbrCewFdCU
  title: How to Trade London Using TTrades Fractal Model
  quote: look to take that as a positional entry
