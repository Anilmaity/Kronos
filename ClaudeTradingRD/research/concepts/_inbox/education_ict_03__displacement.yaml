id: displacement
name: Displacement
definition: 'EARLIER RECORDING evidence on the word itself rather than on a threshold. In this video
  ''aggressive move'' and ''displacement'' are used as a single term - ''an aggressive move or displacement
  above'' - and ''aggressive'' is thereafter used as the intensifier attached to displacement, sell-offs
  and directional moves. That is the closest the corpus comes to defining ''aggressive'': it is not
  a separate concept with its own test, it is the qualitative label for a displacing move. No numeric
  threshold is given here either.'
category: structure
status: contested
aliases:
- aggressive move
- aggressive displacement
- displace
preconditions:
- A level or swing has just been taken.
detection_rules:
- 'TERMINOLOGY FINDING: ''aggressive move'' and ''displacement'' are used interchangeably in this
  video (''an aggressive move or displacement above'').'
- '''Aggressive'' is applied to sell-offs and breakouts as an intensifier, never given its own test.'
- 'Practical proxy used on the charts here: price closes decisively beyond a marked opening price
  rather than wicking through it.'
- Failure to displace back over the level after trading beyond it is read as continuation in the
  direction of travel.
invalidation:
- Price failing to close beyond the level - no displacement, and the prior direction is expected
  to continue.
measurable:
- distribution of candle range on moves the speaker labels aggressive versus the day's average candle
  range
- whether an 'aggressive' label ever attaches to a move that does not close beyond the reference
  level
sources:
- video_id: b6yvRKf8haE
  title: Why You Should Use 8:30 & Midnight Open (EST) -  ICT Concepts
  quote: had an aggressive move or displacement above hives
- video_id: b6yvRKf8haE
