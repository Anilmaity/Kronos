ambiguities:
- 400 points on NASDAQ is an instance, not a threshold - it is never normalised by ADR,
  timeframe or instrument, and no minimum is given.
- Separation is judged by eye with a measuring tool on the chart.
- Nothing is said about separation in time (how many candles apart), only in price.

