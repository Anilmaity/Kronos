id: relevant-swing-separation
name: Relevant Swings Require Separation
aliases:
- good separation
- the most relevant low
category: structure
status: underspecified

definition: >
  Which of several nearby swings counts as the level to trade away from. He compares the same
  structure across two instruments live: on NASDAQ the two lows are 400 points apart, which he
  calls good separation and the more preferred structure; on ES the equivalent lows sit close
  together, which he calls less ideal. Asked why a particular low was marked and not one
  further left, he answers that it is the most relevant low because it has enough separation
  from the next one that one could hold while the other is taken. A high that sits right next
  to another high is dismissed as just a failure swing rather than the relevant swing.

timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 15m
  - 5m
  fractal: true

preconditions:
- Two or more same-side swings are candidates for the level being traded away from or toward.

detection_rules:
- Compare the candidate swing with the nearest same-side swing.
- If they sit close together, the structure is less ideal and the pair is not a relevant level.
- If they are well separated - 400 points on NASDAQ is the worked example - the outer one is
  the relevant swing.
- 'Separation test stated functionally: one level could hold while price goes to the other.'
- A high or low immediately adjacent to another is classified as a failure swing, not the
  relevant swing.

invalidation:
- A sweep of the cluster collapses it into a single relevant swing.

measurable:
- follow-through when trading away from well-separated versus tightly-clustered swings
- separation distance normalised by ADR at the moment of the decision

