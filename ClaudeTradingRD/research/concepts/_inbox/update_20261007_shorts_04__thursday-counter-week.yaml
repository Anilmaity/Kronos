id: thursday-counter-week
name: Thursday Counter (weekly profile)
category: model
status: contested
voice: ttrades
definition: >
  A FAILED Thursday counter shown deliberately. Monday, Tuesday and Wednesday expand away from
  the weekly open (up); Thursday is expected to counter and Friday to continue lower back toward
  the weekly open. The ideal requirement is that the daily candle's wick high forms in the
  "lower half", in the T-spot - open, form a high, then form a continuation to trade lower.
  Instead price grinds up, dips, reaches into an intraday fair value gap and expands through
  it (consolidating rather than continuing), then respects an inversion and trades through the
  high. Stated lesson: a weekly profile forming does not mean it will work; it is not 100%.
timeframes:
  htf: ["1W", "1D"]
  ltf: ["1H"]
  fractal: false
preconditions:
- Mon-Wed expansion away from the weekly open.
detection_rules:
- On the continuation day, require the daily wick to form in the T-spot and an intraday continuation to form from it.
- Require the intraday fair value gap to be respected for the continuation.
invalidation:
- Price expands through the intraday fair value gap instead of respecting it - treat as consolidation, not continuation.
- Price respects an opposing inversion and trades through the daily high.
measurable:
- failure rate of Thursday-counter weeks; share failing via FVG expansion-through
