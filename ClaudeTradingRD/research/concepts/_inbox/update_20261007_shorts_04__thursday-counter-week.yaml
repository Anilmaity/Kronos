ambiguities:
- '"Lower half" for a bearish wick high is odd (one would expect the upper half / premium); the reference range is not stated, so the side cannot be decided from the transcript.'
- Unclear whether the failed day is Thursday or Friday.
related: [t-spot, weekly-profile-not-predicted-in-advance, invalidation-trade]
