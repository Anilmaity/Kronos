ambiguities:
- '"A protected swing I can trust" adds a trust qualifier on top of the structural definition
  and never says what makes one untrustworthy.'
- No stop-width rule for surviving the open is given in this unit.
- '"Usually not on a lower time frame" leaves the exception open.'

