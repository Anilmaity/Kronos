id: positional-entry-before-open
name: Positional Entry Before The Equity Open
aliases:
- pre-market trade
- entry before the New York open
category: entry
status: specified

definition: >
  The gate for taking an entry before 09:30. Asked whether he would enter pre-open on a
  confirmed setup, he gives two conditions: it has to be a valid 15-minute setup, and there
  has to be a protected swing he can trust already formed before the open - usually not on a
  lower timeframe. Elsewhere in the same stream he restates the same test negatively: he takes
  pre-market trades when something tells him he can, and on this day there was nothing to base
  his stop off of, so he had to wait for the open. He also notes that if a setup had already
  formed before the open he would simply have traded it pre-open rather than waiting.

timeframes:
  htf:
  - 4H
  - 1H
  ltf:
  - 15m
  fractal: false

preconditions:
- A setup exists before the equity open.

detection_rules:
- The setup must be valid on the 15-minute, not on a lower timeframe.
- A protected swing must already have formed before the open, and it must be one you can
  trust as the stop reference.
- If there is nothing to place the stop behind, do not take the pre-open entry - wait for the
  open.
- If the setup completed before the open, trade it pre-open rather than waiting for 09:30.

invalidation:
- No trustworthy protected swing before the open.

execution:
  bias: From the higher-timeframe framework already in place.
  entry: On the pre-open 15-minute setup.
  stop: Behind the pre-formed protected swing.
  targets:
  - the day's framed objective

measurable:
- outcome of pre-open entries versus post-09:30 entries on the same framing
- how often a pre-open protected swing survives the open

sources:
