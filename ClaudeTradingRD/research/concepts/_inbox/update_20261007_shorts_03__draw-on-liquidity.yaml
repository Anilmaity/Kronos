id: draw-on-liquidity
name: Draw On Liquidity (DOL)
category: liquidity
status: specified
voice: ttrades
aliases:
- previous day high and low
definition: 'For the target of an expected candle 3 expansion, he marks only the previous lows on the
  higher timeframe (two of them in the example) and carries those same levels down to the lower timeframe
  as sequential targets. His stated summary: keep targets super simple - on an intraday timeframe or the
  hourly chart, focus on the previous days'' highs and lows.'
timeframes:
  htf:
  - 1D
  ltf:
  - 1H
  fractal: true
preconditions:
- A directional expectation exists (candle 3 expected to expand lower in the example).
detection_rules:
- Mark the previous lows (bearish) or previous highs (bullish) on the higher timeframe as targets.
- Project those levels onto the lower timeframe and treat them as first and second target in order of
  distance.
- On intraday / hourly trading, the targets are the previous days' highs and lows.
invalidation:
- Not stated.
measurable:
- hit rate of the nearest previous-day low/high within the candle 3 window
- hit rate of the second previous-day level given the first was hit
sources:
- video_id: CEm1Bnhvb2I
  title: Make Targets Simple Using the Fractal Model
  quote: We can just mark out our previous lows, right?
- video_id: CEm1Bnhvb2I
  title: Make Targets Simple Using the Fractal Model
  quote: focus on those previous days highs and lows.
ambiguities:
- How many previous days back to look is not stated (two lows are used in the example; see previous-day-lookback-three-days).
- The higher timeframe in the example is not named; daily is inferred from 'previous days highs and lows'.
related:
