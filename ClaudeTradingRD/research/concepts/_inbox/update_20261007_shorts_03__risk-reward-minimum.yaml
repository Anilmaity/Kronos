id: risk-reward-minimum
name: Minimum Risk-To-Reward
category: risk
status: contested
voice: ttrades
aliases:
- taking profit early
definition: 'In TTrades'' own voice (the library had this arithmetic mainly from a guest): habitually
  closing early stems from fear. On a 2R system the break-even win rate is 34%; taking profit at 1:1 instead
  changes the system so the break-even win rate becomes 50%. He reframes ''locking in profits'' as forcing
  yourself to need a higher win rate.'
timeframes:
  htf: []
  ltf: []
  fractal: false
preconditions:
- A system with a planned 2R target.
detection_rules:
- Break-even win rate at 2R = 34% (his figure); at 1R = 50%.
- Exiting before the planned target changes the system's break-even win rate; treat early exits as a system
  change, not a lock-in.
invalidation:
- Not applicable.
measurable:
- realized average R vs planned R
- break-even win rate implied by realized average R
sources:
- video_id: tCDsDlYQ1gw
  title: Taking Profit Early Forces You to Have a Higher Win Rate
  quote: The root cause of this is what? Fear.
- video_id: tCDsDlYQ1gw
  title: Taking Profit Early Forces You to Have a Higher Win Rate
  quote: A 34% win rate to break even.
- video_id: tCDsDlYQ1gw
  title: Taking Profit Early Forces You to Have a Higher Win Rate
  quote: now you have to win 50% of the time to break even.
- video_id: tCDsDlYQ1gw
  title: Taking Profit Early Forces You to Have a Higher Win Rate
  quote: I take profit early here. I now have to have a higher win rate.
ambiguities:
- 34% is his rounding; exact break-even at 2R without costs is 33.3%.
