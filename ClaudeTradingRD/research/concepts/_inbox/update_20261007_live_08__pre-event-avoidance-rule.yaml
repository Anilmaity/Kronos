id: pre-event-avoidance-rule
name: Avoid The Days Before High Impact News; Never Hold Through A Release
category: risk
status: contested
definition: 'He states an explicit exception to never holding through a release: intraday positions are
  not held through CPI or NFP, but a position entered on the daily chart (a higher-timeframe trade) is
  held through CPI/NFP, which he says he has done. He also does not trade right during a Fed announcement.'
measurable:
- outcome of daily-entry trades held through CPI/NFP vs closed before
detection_rules:
- 'Intraday position open before CPI/NFP: close or do not hold through the release.'
- 'Position entered on the daily chart: may be held through CPI/NFP.'
- Do not enter during the Fed announcement itself.
sources:
