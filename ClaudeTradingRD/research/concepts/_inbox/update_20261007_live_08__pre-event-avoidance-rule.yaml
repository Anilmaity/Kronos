- video_id: K7XVj2w3CP4
  title: New York Open Live Q&A
  quote: Obviously, don't trade right during the Fed announcement
ambiguities:
- Whether a 4H-entry trade counts as 'higher time frame' for the exception is not stated; only the daily
  is named.
