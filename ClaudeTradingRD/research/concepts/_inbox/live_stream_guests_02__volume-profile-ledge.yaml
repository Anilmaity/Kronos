id: volume-profile-ledge
name: Volume Profile Ledges And Low Volume Nodes As Levels
aliases:
- ledge
- low volume node
- absorption shelf
category: structure
status: specified
definition: 'The two things HolyAngelBruv takes from the volume profile, and the only two. A LEDGE is
  a straight-out protrusion of volume on the profile - a price at which far more volume traded than
  at its neighbours - which he reads as an area of absorption and therefore a pivot: price can bounce
  off it, and if price breaks through it the absorbers get annihilated and liquidate, so it works in
  both directions. A LOW VOLUME NODE is the opposite, used in a breakout. He makes the bridge to ICT
  explicit: every fair value gap is really just a low volume node, because price moved so fast through
  it that little volume could transact, whereas an area price spent time in accumulates volume. He uses
  these to narrow down where inside a broad ICT area to actually enter.'
timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- A volume profile on the relevant range.
detection_rules:
- 'Mark ledges: prices whose volume protrudes sharply beyond neighbouring prices on the profile.'
- Treat a ledge as an absorption area and therefore a pivot - expect a reaction on first touch.
- If price trades through a ledge, expect the absorbed positions to liquidate and the move to accelerate.
- Mark low volume nodes and use them on breakouts.
- Treat any fair value gap as a low volume node and vice versa.
- Use these to choose the entry price inside a broader ICT point of interest.
invalidation:
- A ledge traded through without reaction and without acceleration.
measurable:
- reaction rate at ledges vs at random price levels
- overlap rate between marked fair value gaps and low volume nodes
- acceleration after a ledge is broken vs held
