id: macros-not-used
name: "Macros Rejected"
aliases: ["macro times", "ICT macros"]
category: time
status: contested

definition: >
  He does not trade macros and states that he does not think they are a real thing.
  His reading is that a macro is simply a certain section of an open-high-low-close,
  and that traders reach for macros because they lack an understanding of OHLC. This
  is a direct rejection of a standard ICT time tool, recorded here for completeness
  rather than as a positive technique.

timeframes:
  htf: []
  ltf: []
  fractal: false

preconditions: []

detection_rules:
  - "No macro time windows are marked or used."
  - "The intraday delivery a macro would describe is instead read as open-high-low-close on a smaller timeframe."

invalidation: []

measurable:
  - "whether macro-window filtering adds anything on top of an OHLC-shape model on the same trade set"

sources:
  - video_id: r7yW6ou1LDs
    title: "TTrades Sunday Session - Live Q&A"
    quote: "all a macro is is a certain section of an open high low close"
  - video_id: u8bnmaih_hA
    title: "TTrades Sunday Session - Live Q&A"

ambiguities:
  - "CONTESTED against mainstream ICT, which treats macros as discrete algorithmic windows. He offers a reductive explanation but no evidence or test."
  - "He gives no account of why the specific macro clock times would arise from OHLC delivery."

python_detector: null
related: ["daily-ohlc-candle-shape", "entry-time-window"]
