id: volume-spike-at-extremes
name: Volume Spikes On Sub-Minute Charts Mark Resting Orders
aliases:
- volume spike
- big resting orders
category: liquidity
status: underspecified
definition: 'Two guests in this unit use raw volume in the same narrow way and in no other way. Alex''s
  Options: a spike in volume while price is moving lower marks an area of demand - somebody is sitting
  there trying to buy as much as possible - and the mirror holds at highs. He applies it on the daily
  for swing context and on the 1-minute for ES, expects a retest of the spike area rather than an
  instant reversal, and offers it explicitly as added context when trading small timeframes without
  a higher-timeframe reference. Trade For Opportunity: volume is not relevant at five minutes or above,
  but on 30-second and 15-second charts the spikes show where interest is arriving, and are actionable
  when they coincide with a big pivot being taken, a liquidity run or a stop hunt - his example being
  a 15-second stop hunt with a high-volume one-minute reversal candle and a fair value gap that then
  retraced about half the prior down move. The host states in the same stream that he personally does
  not use volume at all, so this is a guest tool rather than a channel one.'
timeframes:
  htf:
  - 1D
  - 1m
  ltf:
  - 30s
  - 15s
  fractal: false
preconditions:
- A volume-bearing instrument (futures) on a sub-minute chart.
detection_rules:
- Read volume only on sub-minute charts (15s / 30s / 1m); it is judged irrelevant at five minutes
  and above.
- A volume spike while price is falling marks demand; a spike while price is rising marks supply.
- Require the spike to coincide with a swing being taken out, a liquidity run or a stop hunt before
  acting on it.
- Expect a retest of the spike area rather than an immediate reversal.
invalidation:
- Price trades cleanly through the spike area on a retest without reaction.
measurable:
- reaction rate at sub-minute volume spikes, split by whether a swing was taken out on the spike
- distribution of retest depth after a spike
sources:
- video_id: V8P6lNIisvc
  title: Q&A Live with Alex's Options - ICT + Strat
  quote: What I look for is spikes in volume when price is moving lower
- video_id: 0bH_kkG2q6s
  title: Stream Q & A with Trade For Opportunity  - ICT concepts
  quote: you can really see where the spikes are coming in
- video_id: 0bH_kkG2q6s
  title: Stream Q & A with Trade For Opportunity  - ICT concepts
  quote: i just personally don't use volume
ambiguities:
- '''Spike'' is never defined - no multiple of average volume, no lookback window, no threshold.'
- The two guests give different upper timeframe bounds (Alex's Options uses it on the daily as well;
  Trade For Opportunity says it is useless above five minutes).
- The host rejects volume outright in the same stream, which the corpus already records as part of
  the channel's excluded tooling.
