id: trade-away-from-manipulation
name: Trade Away From Manipulation, Never From Failure Swings
category: structure
status: specified
voice: ttrades
definition: 'Asked whether the strong-asset sweep requirement is about not trading away from failure swings,
  he agrees: in real time he requires the sweep and will not trade away from a stack of failure swings,
  even if a case can be made.'
detection_rules:
- For a short, require the strongest correlated asset to sweep its high; a stack of failure swings below
  it is not a level to trade away from.
