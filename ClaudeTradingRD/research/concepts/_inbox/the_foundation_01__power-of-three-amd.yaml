id: power-of-three-amd
name: "Power Of Three (Accumulation, Manipulation, Distribution)"
aliases: ["PO3", "AMD", "accumulation manipulation distribution"]
category: model
status: specified

definition: >
  The three-phase anatomy of a higher timeframe candle. Accumulation is a range or
  consolidation, which by existing creates buy stops above its high and sell stops below its
  low. Manipulation is a false breakout outside that range, which stops out positions taken
  inside it and induces breakout traders the wrong way. Distribution is the expansion in the
  opposite direction. On the higher timeframe candle, the manipulation forms the wick and the
  distribution forms the body, producing an open-high-low-close or open-low-high-close shape.
  The speaker gates the whole model behind a prior requirement: there must be higher timeframe
  order flow or a draw on liquidity, or you are only trading patterns.

timeframes:
  htf: ["1D", "1H"]
  ltf: ["15m", "5m", "1m", "30s"]
  fractal: true

preconditions:
  - "A higher timeframe narrative / draw on liquidity exists."
  - "A range (accumulation) with a defined high and low."

detection_rules:
  - "1. Accumulation: a consolidation range; record range_high and range_low."
  - "2. Manipulation: price trades outside range_high or range_low and then moves aggressively back INSIDE the range."
  - "3. Failure test stated explicitly: if price does NOT displace back into the range after leaving it, expect continuation in the breakout direction instead of a reversal."
  - "4. Distribution: expansion in the direction opposite the manipulation."
  - "5. On the daily candle: manipulation above the open forms the upper wick and predicts a bearish (open-high-low-close) day; manipulation below the open forms the lower wick and predicts a bullish (open-low-high-close) day."
  - "6. Targets for the distribution come from projecting the manipulation leg (2-2.5, 4-4.5)."
  - "Session mapping observed: Asia accumulates, London manipulates, New York distributes."

invalidation:
  - "Failure to displace back into the range after the excursion (converts to continuation)."

execution:
  bias: "Opposite the manipulation."
  entry: "Either a reversal entry inside the manipulation (catching the whole distribution) or a continuation entry inside the distribution. Triggers used in the examples: inversion, box setup, order block; a market structure shift is used only when the geometry allows it."
  stop: "Beyond the manipulation extreme."
  targets: ["2-2.5 and 4-4.5 projections of the manipulation leg", "equal lows/highs and prior-session extremes coinciding with those bands"]

measurable:
  - "share of daily candles classifiable as OHLC/OLHC with the wick formed in London"
  - "hit rate of the distribution reaching the 2-2.5 band"
  - "frequency of the failure case (no displacement back into the range)"
  - "share of the daily range produced during the distribution phase"

sources:
  - video_id: TCFvsZeYvV8
    title: "ICT Power Of 3 - AMD"
    quote: "accumulation is a range or a consolidation"
  - video_id: MPeeE55rNOw
    title: "ICT Killzones & Indicator Settings"
  - video_id: CHIK5oBRKiw
    title: "Change In State Of Delivery [CISD] - Orderblock Formation - ICT Concepts"

ambiguities:
  - "'Aggressive' move out and back is never quantified — no candle count, range or ATR criterion."
  - "No minimum duration or maximum width for the accumulation range."
  - "No time limit on how long a manipulation may last before it stops being a wick."
  - "The daily-candle mapping assumes a specific day boundary (midnight New York is used in the examples) but this is not stated as a rule."
  - "The dedicated OHLC/OLHC video (sIcsLFSNoXM) is missing from this unit."

python_detector: null
related: ["manipulation-first-heuristic", "box-setup", "standard-deviation-projection", "killzones", "next-day-model", "cisd-entry-model"]
