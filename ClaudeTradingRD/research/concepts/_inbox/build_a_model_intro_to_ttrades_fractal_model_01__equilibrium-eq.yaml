ambiguities:
- Three distinct levels share one name within a single unit; nothing in the material disambiguates
  them when 'the EQ' is used without qualification.
- The T-spot is equated with the equilibrium in one example, which would make (b) and the T-spot
  the same object - contradicted by the T-spot being drawn as a BOX, not a line.
- The previous-day-EQ test is stated for hourly closures under a daily/hourly pairing; no equivalent
  closure timeframe is given for other pairings.
