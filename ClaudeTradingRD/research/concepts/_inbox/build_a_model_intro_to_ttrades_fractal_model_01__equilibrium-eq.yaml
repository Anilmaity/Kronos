id: equilibrium-eq
name: Equilibrium / 50% Level (EQ, T spot)
category: entry
status: contested
aliases:
- EQ
- equilibrium
- 50% of the candle
definition: 'CONTESTED WITHIN THIS UNIT - three different 50% levels are all called ''the EQ'' and
  are used for different jobs: (a) the EQ of the PREVIOUS DAY''S RANGE, which a continuation day''s
  opposing move must respect - operationalised as no hourly closures beyond it; (b) the EQ of the
  CURRENT higher-timeframe candle, which the indicator draws and which candle 4 must respect at 50%
  of candle 3''s range; and (c) 0.5 of a WICK (body-to-extreme), which is the half-wick-respect test.
  Additionally, a range''s equilibrium is used as a magnet: if price deviates from a consolidation
  range it is expected back to the middle of that range.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 1H
  - 15m
  - 5m
  fractal: true
preconditions:
- 'A defined range: a previous day, a candle, a wick, or a consolidation.'
detection_rules:
- 'Reading (a) previous day range EQ: mark 50% of the previous day''s high-low. On a continuation
  day the opposing move must hold it - specifically, no hourly closures beyond it. Price need not
  reach it.'
- 'Reading (b) current candle EQ: 50% of the higher-timeframe candle''s range; drawn by the indicator;
  candle 4 must respect 50% of candle 3''s range.'
- 'Reading (c) wick EQ: 50% of the wick measured body-to-extreme (see half-wick-respect).'
- 'Range magnet: if price deviates outside a consolidation, expect a return toward that range''s
  equilibrium.'
- Disrespecting the EQ is read as the swing point being likely to fail, which makes that swing the
  new draw on liquidity.
invalidation:
- A close beyond the relevant EQ against the read.
measurable:
- how often each of the three EQ readings holds, measured separately
- whether 'no hourly closure beyond the previous day EQ' actually predicts continuation days
