id: ttfm-scalping-model
name: TTrades Scalping Model (Hourly bias / 15-minute swing / 1-minute entry)
category: model
status: specified
voice: ttrades
definition: 'Reason to drop from his favourite 4H/15m pairing to the 15m/1m: on a reversal day he does
  not expect much expansion, so the 15-minute entry gives poor risk-to-reward. He used the 15m/1m fractal
  model at 10:00, ''let the wick form'' and traded the body, noting the 3-minute would not give a setup
  around the open without waiting for a closure already at target.'
detection_rules:
- If the day is a reversal day (low expansion expectation), do not use the 4H/15m entry; refine to the
  15m/1m.
- If the 3-minute closure would only confirm at the target, refine to the 1-minute.
