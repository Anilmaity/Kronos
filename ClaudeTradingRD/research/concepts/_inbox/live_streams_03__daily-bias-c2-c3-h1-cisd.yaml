id: daily-bias-c2-c3-h1-cisd
name: Daily Bias = Daily C2/C3 Closure Confirmed by H1 CISD
aliases:
- easiest way to get a daily bias
category: model
status: specified

definition: >
  Asked point-blank how to get a daily bias, he gives the two-step rule and calls it the
  easiest way to do it: a candle 2 or candle 3 closure on the daily, paired with a change in
  the state of delivery on the hourly - which he describes as simply running his model on the
  daily and hourly. He then walks it live on gold (candle 2 closure plus CISD, therefore
  bearish for the day) and on the dollar index in forex (range low swept, candle 2 closure,
  no hourly CISD yet so wait, CISD arrives, bias becomes bullish, only then drop to 4-hour /
  15-minute). Asked what to do when there is no daily C2, the answer is that you either do not
  trade or you trade a reversal day, which requires a separate framework.

timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 4H
  - 15m
  - 5m
  fractal: true

preconditions:
- A daily chart with a completed or forming candle relative to the previous daily candle.

detection_rules:
- Find a candle 2 or candle 3 closure on the daily.
- Require a change in the state of delivery on the hourly in the same direction; until it
  prints, wait.
- With both present, the day's bias is set; only then drop to the execution pairing.
- If there is no daily C2, either stand aside or switch to the reversal-day framework.
- In the New York session a reversal day is entered off a 15-minute CISD rather than the
  hourly one.

invalidation:
- No hourly CISD in the direction of the daily closure - the bias is not confirmed.

execution:
  bias: Direction of the daily C2/C3 closure once the hourly CISD confirms it.
  entry: On the paired execution timeframe (4H/15m, 1H/5m).
  stop: Beyond the confirmed swing.
  targets:
  - previous day / week / month extremes

measurable:
- share of days where daily C2/C3 plus H1 CISD is followed by expansion in that direction
- how often the hourly CISD arrives late enough to make the bias untradeable that day

