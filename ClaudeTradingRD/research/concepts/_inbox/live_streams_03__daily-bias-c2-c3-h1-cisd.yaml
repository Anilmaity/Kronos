ambiguities:
- The reversal-day framework - the alternative when there is no daily C2 - is named but never
  specified in this unit.
- Whether the hourly CISD must sit inside the daily candle's wick or anywhere inside its range
  is not restated here.
- The New York 15-minute-CISD substitution for a reversal day is asserted in one sentence with
  no conditions attached, and he says a video on it is still to come.

