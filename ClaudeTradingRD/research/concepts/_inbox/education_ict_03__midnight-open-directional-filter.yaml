ambiguities:
- 'PROVENANCE: this is the EARLIER Education - ICT recording. The later, canonical material (ttfm-minimal-toolkit,
  entry-time-window) lists the midnight open among the tools he NO LONGER uses, and the existing
  entry under this id comes from the updated playlist''s Twitter-model video. Both readings are kept;
  this one is the older.'
- No timezone is spoken in the transcript body - only the video title carries (EST).
- No rule is given for when the midnight open and when the 08:30 open governs; both are used, and
  'either' is enough for the plain filter while 'both' defines the deep case.
- '''Failing to close above/below'' is applied to intraday candles whose timeframe is never named.'
- The chart is index futures throughout; the 08:30 level is a US-data-release open and no equivalent
  is offered for other asset classes.
