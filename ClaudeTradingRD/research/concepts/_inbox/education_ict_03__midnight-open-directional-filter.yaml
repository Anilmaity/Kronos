id: midnight-open-directional-filter
name: Only Short Above The Midnight Open, Only Long Below It
definition: 'EARLIER RECORDING, and the channel''s dedicated video on the two levels. Two opening
  prices are marked - the midnight open and the 08:30 open - and they are used three ways. (1) As
  a directional filter expressed in premium/discount language: below either level is a discount and
  is where longs are looked for; above either is a premium and is where shorts are looked for. (2)
  As pivots: in choppy conditions price bounces around the level, and failing to close beyond it
  is read as a signal for continuation the other way. (3) As targets: after an aggressive sell-off
  or breakout away from them, the same two levels become the objective for the move back. The stated
  purpose behind all three is capturing the daily range - the manipulation leg of a buy day normally
  sits below these levels and of a sell day above them.'
category: time
status: contested
aliases:
- midnight open
- 8:30 open
- 830 open
- line in the sand
preconditions:
- The midnight (00:00) and 08:30 opening prices are marked on the intraday chart.
- A daily directional read (buy day / sell day) exists.
detection_rules:
- 'Mark two levels: midnight_open (00:00 open) and eight_thirty_open (08:30 open).'
- Longs are looked for below either level; shorts above either level.
- On a sell day the manipulation / opposing run normally prints ABOVE these levels; on a buy day
  BELOW them.
- 'Pivot use: price failing to close back above a level after trading below it signals continued
  downside (mirror for upside).'
- 'Target use: after an aggressive move away from the levels, they become the objective for the return
  move.'
- Look for the lower-timeframe setup, and for PD arrays, in the area beyond these levels rather than
  at the levels themselves.
invalidation:
- Price closing back through the level after failing to displace away from it reverses the read.
measurable:
- share of days whose high (sell days) or low (buy days) forms beyond the midnight / 08:30 open
- hit rate of the two opens as return targets after a day's aggressive move away from them
- expectancy of entries taken on the permitted side of the level versus the other side
