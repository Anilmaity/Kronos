id: swing-point
name: Swing High / Swing Low
aliases:
- the model is based off of swing points
category: structure
status: specified

definition: >
  Answering whether the fractal model will stop working now that many people use it, he
  restates what the model is anchored to: it is based off swing points, and a market cannot
  reverse without forming one - he challenges the chat to find a reversal that formed without
  a swing point and offers to delete his channel if anyone can. Because the model keys on
  something price must do to change direction, he is not concerned about crowding. He gives
  the same account of how he built the model in the first place: he learned swing points,
  decided which swing points he would focus on (a candle 2 or candle 3 closure), then worked
  out how to confirm them on a lower timeframe and how to build a mechanical entry around them.

timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true

preconditions:
- Price has turned.

detection_rules:
- Any reversal necessarily prints a swing point; there is no reversal without one.
- Of all swing points, only those qualifying as a candle 2 or candle 3 closure are traded.
- Confirm the chosen swing point on the lower timeframe before building the entry.

invalidation:
- n/a - a structural primitive.

measurable:
- share of reversals in a sample that qualify as C2 or C3 closures rather than plain swings

sources:
- video_id: X4XSsv5CNqg
  title: New York Open Live Q&A
  quote: The fractal model is based off of swing points
- video_id: X4XSsv5CNqg
  title: New York Open Live Q&A
  quote: a time the market reverses without forming a swing point
- video_id: U4j-fZD-FJk
  title: New York Open Live Q&A
  quote: I learned swing points

ambiguities:
- The candle-count definition of a swing point (how many candles either side) is not restated
  in this unit.
- The claim that a reversal must form a swing point is tautological at the bar level and does
  not by itself establish that the model has an edge - he treats it as if it does.

