id: hourly-cisd-confirmation
name: Hourly Change In The State Of Delivery (confirming a daily wick)
category: entry
status: contested
definition: 'Exception stated for a very large manipulation leg. Viewer: gold swept the previous day low,
  but the hourly CISD series spanned the whole previous daily candle. He agrees that waiting for that
  CISD makes no sense because by the time it closes through, most of the daily range is already created.
  Substitutes: a higher-timeframe candle closure (a 4-hour closure is shown) or a new continuation (price
  reaches a fair value gap and closes over it). He stresses that mechanically the trend has not shifted
  until the closure through the CISD level - the substitutes are a discretionary allowance.'
detection_rules:
- If the CISD level sits so far away that closing through it would consume most of the expected daily
  range, the 4-hour candle closure or a new continuation (close over a reached FVG) may stand in for the
  CISD.
- Mechanically the trend is unchanged until the close through the CISD level.
measurable:
- outcome of trades confirmed by 4H closure / FVG continuation vs by the full H1 CISD, on days with a
  large manipulation leg
sources:
- video_id: rVRk4MLTJSs
  title: New York Open Live Q&A
  quote: in the cases where you have a very large manipulation leg
