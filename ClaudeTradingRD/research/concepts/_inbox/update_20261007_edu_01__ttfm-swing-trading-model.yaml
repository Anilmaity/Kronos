id: ttfm-swing-trading-model
name: TTrades Swing Trading Model (Weekly bias / Daily swing / Hourly entry)
category: model
status: specified
voice: ttrades
definition: >
  Presented as the model for traders with a full-time (9-5) job; he rejects scalping for busy
  traders and says to go to the higher timeframes. Weekly bias = will price reach for the
  previous week's high or low, or a weekly candle 2 / candle 3 closure (a daily bias alone is
  accepted as a substitute). Then align a daily swing point (daily C2/C3 closure with an
  hourly change in the state of delivery) and execute the daily + hourly fractal model: let
  the daily wick form, enter on an hourly intra-candle CISD (go-to), a swing-point entry, or a
  positional entry. Because the model runs on hourly closures, chart checking is one minute at
  the top of each hour. Target 2R inside the daily range, or hold for the weekly range (even
  over weekends / multiple weeks when aligned).
detection_rules:
  - "Weekly bias: previous week's high vs low as the draw, or a weekly C2/C3 closure; a daily-chart bias is an accepted shortcut."
  - "Daily: C2 or C3 closure at a relevant level, confirmed by an hourly CISD."
  - "Hourly: let the daily wick form; enter on an IC-CISD / new protected swing in line with the bias; stop on the protected swing."
  - "Check cadence: inspect the chart only at the top of each hour (one minute per hourly close)."
  - "US-timezone traders: first try to position in the Asia session; if no setup, check again at the New York session."
  - "Targets: 2R within the daily range, or hold for the weekly range."
execution:
  bias: "Weekly (or daily) C2/C3 closure / previous-week high-low draw."
  entry: "Hourly IC-CISD inside the daily candle; positional entry allowed."
  stop: "Protected swing (or body of the opposing candle for positional)."
  targets: ["2R", "daily range", "weekly range"]
measurable:
  - "R of daily+hourly fractal model trades when evaluated only on hourly closes"
  - "Asia-session vs New York-session entry hit rates"
