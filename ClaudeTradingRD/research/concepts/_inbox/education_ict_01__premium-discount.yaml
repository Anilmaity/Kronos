ambiguities:
- EARLIER RECORDING. No precedence rule is given for when the displacement-range read and the overall-range
  read disagree - both are simply required to be satisfied in the examples.
- The 'overall range' is chosen by eye ('last friday's action'); no rule fixes the lookback.
- Whether the fib is drawn on wicks or bodies is not stated.
