id: premium-discount
name: Premium & Discount
aliases:
- discount and premium
- above the 0.5 fib
category: structure
status: contested
definition: 'EARLIER RECORDING. Taught at TWO scales that are used together and kept separate: (a) premium/discount
  of the DISPLACEMENT RANGE, used to refine an entry after a market structure shift - long only below
  the 0.5 of the leg, short only above it; and (b) premium/discount of the OVERALL RANGE (e.g. the previous
  session''s low to high), used as the day''s positional frame - it tells you where you should be looking
  to buy and where to sell. He closes by subordinating both to bias: the premium/discount read is applied
  underneath a directional bias, not instead of one.'
timeframes:
  htf:
  - 1D
  - 1H
  - 15m
  ltf:
  - 5m
  - 1m
  fractal: true
preconditions:
- A range with a defined high and low (either a displacement leg or the day's range).
detection_rules:
- 'Displacement scale: after a market structure shift, fib the displacement leg; longs only in the discount
  half, shorts only in the premium half.'
- 'Overall scale: fib the prior session''s low to high; look for longs only in the discount, shorts only
  in the premium.'
- Reject an otherwise valid fair value gap purely because it sits on the wrong side of the 0.5.
- A setup that breaks structure but never retraces past the 0.5 of the leg is not taken.
- Both reads are applied underneath an existing bias, never as a substitute for one.
invalidation:
- The range is superseded (a new displacement leg, a new session range).
measurable:
- hit rate of entries in the correct half vs the wrong half of the displacement range
- how often the two scales disagree on the same candidate entry
