id: small-wick-expansion-rule
name: Small Wick Supports Expansion; Large Wick Waits for Candle 3
aliases:
- small Wicks and a larger body
category: model
status: contested
definition: 'The top-down video gives the cleanest single-sentence statement of the expansion filter
  in the corpus: if we are going to have an expansion candle, it will have small wicks and a larger
  body. He derives the practical consequence immediately - because the wick is small, the tradeable
  part is the body, so let the wick form and then trade from the extreme to the close. It is applied
  here as the reason for dropping from the weekly to the 4-hour when a bearish week is anticipated.'
timeframes:
  htf:
  - 1W
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  fractal: true
preconditions:
- A higher-timeframe candle whose direction is already anticipated.
detection_rules:
- An expansion candle has small wicks and a larger body.
- 'Consequence: the tradeable portion is the body; wait for the wick to complete before entering.'
- 'Applied top-down: anticipate the direction on the higher timeframe, then look inside it on the
  supporting timeframe for the wick to form.'
invalidation:
- The candle develops a large wick against the anticipated direction - it is not an expansion candle.
measurable:
- distribution of wick-to-body ratio on candles he labels expansion vs the rest
- forward return of the body given a wick-to-body ratio threshold
sources:
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: an expansion candle it will have small Wicks and a larger body
ambiguities:
- '''Small'' and ''larger'' are never quantified - no wick-to-body ratio, no percentage of range.'
- Whether both wicks or only the leading wick must be small is not said.
- This unit gives the filter but not the fallback (waiting for candle 3), which comes from other
  units.
python_detector: null
related:
