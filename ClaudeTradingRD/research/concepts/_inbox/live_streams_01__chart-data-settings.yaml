id: chart-data-settings
name: Chart Data Settings (back-adjust on, settlement off)
definition: 'Confirmed again in live Q&A: settlement is turned off, and back-adjust is turned on.
  Data comes from CME via Ninja Trader, at a cost he puts at roughly $4 a month for the CME feed.
  All charting is done on the mini contracts rather than the micros, and on futures rather than CFDs,
  so that the price series is the exact exchange data.'
