id: post-trade-journaling-protocol
name: "Post-Trade And Post-Session Journaling Protocol"
aliases: ["trade journal template", "before and after screenshots"]
category: psychology
status: specified
voice: guest
guest_sources:
- "$niper (Matt)"
- "Ben (Ben TT)"

definition: >
  Two guests give near-identical journaling protocols, with one distinctive addition each.
  $niper logs pair, date, position, win / break-even / loss, session, confluence, FEELINGS DURING
  THE TRADE, R multiple and the chart - and argues the emotional column is the point, because it
  lets you compare the confluences present on a confident trade against those on a skeptical one.
  Ben logs every trade with before-and-after screenshots, instrument, time, direction and the entry
  mechanics (which side of liquidity was taken, the structure shift, whether the fair value gap was
  in premium or discount), and says the purpose is to find anomalies inside your own trading and to
  build the recognition that lets you hold a winner.

timeframes:
  htf: []
  ltf: []
  fractal: false

preconditions:
- "A trade has been taken (Ben extends the protocol to demo trades)."

detection_rules:
- "$niper's columns: pair, date, position, win/break-even/loss, session, confluence, feelings during the trade, R, chart screenshot."
- "$niper's rule: record the emotional state (confident / skeptical / nervous) alongside the confluences that produced it, and compare across trades."
- "Ben's columns: before and after screenshots, instrument, time, direction, entry mechanics - sell-side or buy-side taken, market structure shift, fair value gap created in premium or discount, OTE."
- "Ben's rule: journal demo trades too, before going live."
- "Ben's stated purpose: dissect it, make it systematic, and look for anomalies inside your own trading."

invalidation:
- "Not applicable."

measurable:
- "correlation between the logged emotional state and trade outcome"
- "outcome grouped by logged entry mechanic, which is the anomaly search Ben describes"

sources:
- video_id: UmLWRlXd_V8
  title: "8/14/22  MMXM Live with $niper  - ICT concepts"
  quote: "very important to note down how you felt during a trade"
- video_id: yRmKkR4CojU
  title: "Fractalizing Entries -Q&A with Ben - ICT Concepts"
  quote: "take before and after screenshots of all your trades log them"

ambiguities:
- "Neither gives a review cadence - when the log is read back, or against what benchmark."
- "$niper's emotional scale is informal (confident / skeptical / nervous) with no fixed vocabulary."
- "Ben admits he did not journal for a long time and frames the protocol as a correction, not as something he has measured."
- "$niper's template is credited to another trader on Twitter, unnamed in the video."

python_detector: null
