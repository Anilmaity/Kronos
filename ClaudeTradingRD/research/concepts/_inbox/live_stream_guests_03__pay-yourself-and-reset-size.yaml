id: pay-yourself-and-reset-size
name: Pay Yourself, Then Reset The Account To A Size You Can Actually Trade
aliases:
- paying yourself
- two twenty five thousand dollar accounts
category: psychology
status: specified
definition: 'Withdraw money from the trading account on a recurring basis and spend it on something
  real, because until money leaves the account it reads as numbers on a screen rather than money.
  The second half of the rule is structural: when the balance grows past the size the trader is used
  to, do not simply trade the larger balance. Either withdraw the excess and reset - grow $10,000
  to $25,000, withdraw back to $10,000, repeat - or split the account, on the argument that one $50,000
  account and two $25,000 accounts hold identical money but the split version keeps the trader sizing
  at a level already proven survivable. Withdrawal is also offered as a euphoria circuit-breaker after
  a winning streak.'
timeframes:
  htf: []
  ltf: []
  fractal: false
preconditions:
- An account that has grown beyond the balance the trader has previously traded.
detection_rules:
- Withdraw profit periodically and spend it, so the P&L stops reading as a video-game score.
- When the balance exceeds the familiar size, split it into two accounts of the familiar size, or
  withdraw the excess.
- After withdrawing, reset the working balance to the previously comfortable level and repeat the
  cycle.
- Use a withdrawal deliberately after a winning streak, as a brake on euphoric size inflation.
invalidation:
- Not applicable - behavioural rule.
measurable:
- realised risk per trade before vs after a balance increase, with and without the reset
- drawdown depth on accounts that were reset vs accounts left to compound
sources:
