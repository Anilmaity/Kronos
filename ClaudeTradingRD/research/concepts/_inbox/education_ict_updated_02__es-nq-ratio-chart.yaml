id: es-nq-ratio-chart
name: The ES / NQ Ratio Chart As A Relative Strength Indicator
aliases:
- es divided by NQ
- es and Q comparison chart
- the esnq comparison chart
category: structure
status: specified
definition: The mechanical device the video is named for. He charts ES divided by NQ in TradingView
  as a single instrument. When that ratio chart is bullish, ES has the relative strength and NQ the
  relative weakness; when it is bearish, ES is weak and NQ is strong. He then reads the ratio chart's
  own trend and reversals the way he would read any chart, and uses the result to decide which of
  the two instruments to look for longs on and which to look for shorts on.
timeframes:
  htf:
  - 1D
  ltf:
  - 1H
  - 5m
  fractal: true
preconditions:
- A charting platform that supports the ES/NQ ratio symbol.
detection_rules:
- ratio := ES / NQ, charted as its own instrument on the working timeframe.
- ratio bullish / trending up -> ES relatively strong, NQ relatively weak.
- ratio bearish / trending down -> ES relatively weak, NQ relatively strong.
- A reversal on the ratio chart flips the strength assignment.
- 'Apply the result to setup selection: look for shorts on the weaker asset and longs on the stronger
  one.'
invalidation:
- A reversal in the ratio chart reverses the assignment.
measurable:
- agreement rate between the ratio-chart read and the swing-point / closure / candle-size tests
- expectancy of shorting the ratio-designated weak asset vs the strong one over a matched sample
- how often the ratio read persists for a full session / week once set
