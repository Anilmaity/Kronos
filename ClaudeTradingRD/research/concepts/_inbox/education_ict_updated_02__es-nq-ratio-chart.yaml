ambiguities:
- '''Bullish'' and ''bearish'' on the ratio chart are not defined - no moving average, structure
  test or lookback is given.'
- Which timeframe's ratio governs is not stated; he works the daily but applies it to 5-minute setups.
- He notes the ratio ticker cannot be replayed in his platform, so the walkthrough is partly hindsight.
- Only ES/NQ is demonstrated; nothing is said about extending the construction to other pairs.
