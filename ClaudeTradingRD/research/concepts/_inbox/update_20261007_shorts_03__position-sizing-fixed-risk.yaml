id: position-sizing-fixed-risk
name: Fixed-Risk Position Sizing
category: risk
status: specified
voice: ttrades
aliases:
- 1R
- R is your risk
definition: 'Definition of R in his own words: R is your risk - the size of your stop loss, which for
  him is a dollar risk determined by entry and stop placement, and which then determines position size.
  Every trade risks exactly 1R regardless of stop width; reward is counted in multiples of that rectangle
  ($100 risk: 1R = $100, 2R = $200, 3R = $300). ''I got 2R'' means the target was twice the stop distance
  and was held to.'
timeframes:
  htf: []
  ltf: []
  fractal: false
preconditions:
- Entry and stop are defined.
detection_rules:
- 1R = dollar loss at the stop, set by entry-to-stop distance and position size.
- A wider stop is still 1R - size changes, not the risk.
- Trade outcome in R = (exit - entry) / (entry - stop), signed.
invalidation:
- Not applicable.
measurable:
- dispersion of realized loss per losing trade around 1R
