id: cisd
name: Change In The State Of Delivery (CISD)
category: entry
status: contested
definition: 'Answer to ''difference between OB and CISD'': a CISD is the order block that changes the
  trend. An order block already in line with the prevailing trend is just an order block or a continuation;
  once a CISD is confirmed, subsequent same-direction protected swings/order blocks are not CISDs. He
  dates his own switch away from ''market structure shift'' to before his November 2023 CISD video.'
detection_rules:
- Label a close-through as a CISD only if it flips the prevailing direction; same-direction ones are continuation
  order blocks.
sources:
