id: cisd
name: Change In The State Of Delivery (CISD)
aliases:
- change in the state of delivery
- CSD
category: entry
status: specified
definition: 'THE adjudicating definition in the corpus, from the video whose entire subject is separating
  CISD from a market structure shift. CISD is displacement and a CLOSE BELOW (bullish case: above) THE
  OPENING PRICE of the up-close candle, or series of up-close candles, that ran into an important level
  — and that close is what validates those candles as an order block. It is explicitly NOT focused on
  the close beyond a swing high or swing low; that is the market structure shift. CISD and MSS can coincide
  on one candle, but CISD generally occurs EARLIER, which is its stated advantage and its stated risk.'
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- Price has traded into an important level (higher-timeframe PD array or resting liquidity).
- A single up-close candle, or a contiguous series of up-close candles, exists inside the move into
  that level (mirrored for the bullish case).
detection_rules:
- Identify the opposing candle or series of opposing candles that delivered price into the important
  level.
- Take the OPENING PRICE of that candle / that series.
- 'Bearish CISD: price displaces and closes below that opening price. Bullish CISD: price displaces
  and closes above it.'
- That close simultaneously validates the candles as an order block.
- Do NOT require the close to be beyond the swing high/low — that is the market structure shift test,
  which is a separate and generally later event.
invalidation:
- Price never closes beyond the opening price of the opposing series.
- The CISD occurs but price then continues against it — he warns explicitly that an earlier entry is
  'not always a good thing' and can produce a loser the MSS would have filtered out.
execution:
  bias: Direction of the CISD close.
  entry: Retest of the validated order block; or the fair value gap inside it; or its 0.5 / mean threshold
    when the order-block retest gives poor risk-to-reward (his worked example rejected a 1.1 R block
    entry and refined to the FVG and the mean threshold).
  stop: On the high (bearish) / low (bullish) of the order block.
  targets:
  - The old low / old high on the other side
  - Standard-deviation projections of the manipulation leg
measurable:
- bars between the CISD close and the corresponding MSS close
- win rate of CISD-only entries vs MSS-confirmed entries on the same setups
- share of CISDs that never produce an MSS
