ambiguities:
- The word 'displacement' appears in the PDF definition ('close and displacement below the opening price')
  but every chart narration reduces it to 'we close below the series of up close candles' — whether
  an FVG must be left inside the CISD leg is therefore unresolved even here.
- For a SERIES of opposing candles he says 'the opening price of this up close or series of up close
  candles' without stating whether that is the first candle's open or the extreme open of the series.
  The charts show the series' outermost open.
- The 'into an important level' clause is part of the PDF definition but is not re-tested in the chart
  examples, where he simply looks for the close through the opposing candles.
- The library previously held three mutually inconsistent readings of CISD. On this unit's evidence
  the opening-price-of-the-opposing-series reading is unambiguously his; the swing-break reading belongs
  to the market structure shift, which he defines separately in the same video.
