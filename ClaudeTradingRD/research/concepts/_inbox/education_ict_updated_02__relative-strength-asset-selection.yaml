id: relative-strength-asset-selection
name: Trade The Weak Asset Short And The Strong Asset Long
aliases:
- cleaner short setup
- which asset to trade
category: structure
status: specified
definition: 'The operational payoff of the relative strength read: once one of two correlated assets
  is identified as relatively weaker, that asset is where short setups are looked for, because it
  presents the cleaner and better short; the stronger asset is where long setups are looked for.
  In the Friday walkthrough he applies exactly this - NQ is the weak asset so he looks for shorts
  on NQ into last month''s low, and ES is the strong asset so he looks for longs on ES at its own
  point of interest.'
timeframes:
  htf:
  - 1D
  ltf:
  - 1H
  - 5m
  fractal: true
preconditions:
- A relative strength assignment exists (from the ratio chart or the three tests).
detection_rules:
- Identify the relatively weaker asset; take short setups there.
- Identify the relatively stronger asset; take long setups there.
- 'Frame each side against its OWN higher-timeframe level (in the example: last month''s low / monthly
  fair value gap on NQ, a daily fair value gap consequent encroachment on ES).'
- 'Confirming behaviour at the level: the weak asset barely reaches into the fair value gap before
  displacing lower, while the strong asset trades above it before reversing.'
invalidation:
- The strength assignment flipping (see ratio-chart-reversal-lead).
measurable:
- expectancy of shorts on the designated weak asset vs the strong one
- how often the weak asset fails to reach a level the strong asset reaches
sources:
- video_id: c_mh19e3mhI
  title: The Best Relative Strength Indicator For ES & NQ - ICT
  quote: NQ will generally present a cleaner and better short setup
ambiguities:
- No rule states how long an assignment remains valid before it must be re-derived.
- Nothing is said about whether both sides may be held simultaneously as a pair, or whether only
  one is taken.
- '''Cleaner and better'' is a qualitative claim with no supporting statistics in the video.'
