id: est-timezone-anchor
name: Session Clock Is Eastern Standard Time
definition: 'Corroboration from the platform settings themselves: walking through his TradingView
  chart configuration he states the chart is always in New York local time. Every bare clock time
  elsewhere in this unit (18:00, midnight, 08:30, 09:30, the 08:30-to-12 trading window) is therefore
  read on that clock.'
category: time
status: contested
aliases:
- New York local time
- chart timezone
preconditions:
- A charting platform with a configurable timezone.
detection_rules:
- Set the chart timezone to New York local time before marking any time level.
- Interpret every bare clock time in this unit as America/New_York.
invalidation:
- Not applicable - a chart setting.
measurable:
- level-timing differences introduced by charting on any other timezone
sources:
- video_id: JPVhmPZiLKY
  title: TradingView Tutorial For Beginners [Full Guide]
  quote: I'm always in New York local time
ambiguities:
- He says 'New York local time', which is the TradingView setting name and follows daylight saving;
  the corpus elsewhere says 'Eastern Standard Time'. The two differ by an hour for part of the year
  and the discrepancy is never addressed.
