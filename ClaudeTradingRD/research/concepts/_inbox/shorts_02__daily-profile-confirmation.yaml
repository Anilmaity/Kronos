id: daily-profile-confirmation
name: Daily Profile Must Confirm the Daily Bias
category: model
status: underspecified
definition: 'Two Shorts state the same discipline from opposite ends. Where the next move is genuinely
  two-sided - price can either sweep the low or respect it, and he says outright he does not know which
  - the resolution is not to pick: he lets the daily profile confirm or invalidate his thought process,
  and only acts once the profile shows its hand (here: the low is swept, the EQ is respected, an order
  block forms, and the continuation follows). The mirror discipline is that a single failed continuation
  signature intraday is NOT a reason to abandon the bias - he says he is not going to just switch his
  bias because of this, and remains with the read he determined earlier in the day.'
timeframes:
  htf:
  - 1D
  ltf:
  - 1H
  - 15m
  fractal: false
preconditions:
- A daily bias has been determined, and the intraday path is ambiguous.
detection_rules:
- When two outcomes are both live (sweep the low, or respect it), do not choose - wait for the daily
  profile to confirm or invalidate.
- 'Confirmation in the worked case: the low is swept, the EQ is respected, and a change in the state
  of delivery / order block forms - then the continuation is taken.'
- A failed continuation signature (no closure over the opposing candles after the low is taken) is not
  by itself grounds to switch the bias.
- Hold the bias determined earlier in the day and keep reading the profile against it.
invalidation:
- The daily profile invalidates the thought process - though the clips do not say what that looks like
  beyond the failed case.
measurable:
- how often a failed continuation signature is followed by the original bias still working
- time from ambiguous open to profile confirmation
sources:
- video_id: f_yfS7JNR60
  title: Let the Daily Profile Confirm or Invalidate Your Bias
  quote: that's when I just let the daily profile confirm or invalidate my thought process
- video_id: 08MZAXZ5WAM
  title: How to Align Daily Bias With Phases of Price
  quote: I'm not going to just switch my bias because of this
- video_id: 08MZAXZ5WAM
  title: How to Align Daily Bias With Phases of Price
  quote: I'm still bullish as I determined earlier in the day
ambiguities:
- 'This is the crux and it is left open: "confirm or invalidate" is never given a test, so the concept
  stays underspecified. One clip shows confirmation; the other shows the bias being held through a failure
  and then the day going the other way.'
- No rule separates "a failed continuation signature you should sit through" from "the profile has invalidated
  you".
- Whether the bias could be switched at all intraday, and on what evidence, is never said.
