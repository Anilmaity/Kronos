ambiguities:
- The EQ used is the EQ of the PREVIOUS DAY'S RANGE here; elsewhere in the corpus 'EQ' means the
  current candle's equilibrium / T-spot. Both appear in this unit.
- '''Respect the EQ'' is defined negatively (no hourly closures beyond it) but the timeframe for
  that closure test is only stated for the daily/hourly pairing.'
- The reversal-day wick gate reuses the unquantified small/large wick distinction.
- How far beyond the previous day's extreme to expect price to travel is said to depend on wick size,
  with no scale given.
