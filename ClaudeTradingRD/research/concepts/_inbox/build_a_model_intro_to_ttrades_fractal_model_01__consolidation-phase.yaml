ambiguities:
- '''For a period of time'' is never bounded - no minimum bar count is given, and the examples range
  from 3 bars to an 18-hour range.'
- The rule allows the range high/low to be re-drawn when price pokes out but 'fails to trade out
  of it'; how far a poke can go before the consolidation label is abandoned is not stated.
- Which of the several possible highs/lows to mark as the range boundary is done by eye.
