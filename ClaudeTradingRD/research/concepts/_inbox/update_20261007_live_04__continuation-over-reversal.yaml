id: continuation-over-reversal
name: Continuation-Only Doctrine
category: model
status: contested
voice: ttrades
definition: 'Live demonstration: off the NY open he tracked three bullish reversal attempts on ES/NQ,
  none of which produced a lower-timeframe continuation, and he took nothing. He states that trading the
  reversals would have cost about two stop losses, and that waiting for continuations is what protects
  against failed reversals and gives a higher win rate; if the idea works, it can be caught later on the
  continuation.'
ambiguities:
- The 'higher win rate' claim is asserted, not measured, in this stream.
