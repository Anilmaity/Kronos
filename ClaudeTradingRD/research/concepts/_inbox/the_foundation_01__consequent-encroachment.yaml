id: consequent-encroachment
name: "Consequent Encroachment (CE)"
aliases: ["CE", "50% of a fair value gap", "midpoint of the gap"]
category: entry
status: specified

definition: >
  The 50% level of a fair value gap, marked by dragging a fib from the gap's high to its low.
  It has two uses in this corpus: as a behavioural test (price respecting the CE implies
  continuation in the respecting direction, violating it anticipates the whole gap failing) and
  as an entry refinement (entering at the CE of an old gap instead of its near edge when the
  near-edge entry does not meet the minimum risk-to-reward).

timeframes:
  htf: ["1M", "1D", "4H", "1H"]
  ltf: ["15m", "5m", "1m"]
  fractal: true

preconditions:
  - "A defined fair value gap zone with a known high and low."

detection_rules:
  - "ce := (gap_high + gap_low) / 2."
  - "Respect: price trades to the CE and reacts away without closing beyond it -> continuation expected."
  - "Violation: price closes beyond the CE -> anticipate price working through the rest of the gap."
  - "Partial signal explicitly stated: closing over the CE 'gives us a hint' of an inversion but is NOT sufficient — a close beyond the full gap is required to declare an inversion."

invalidation:
  - "A close beyond the CE in the opposing direction."

execution:
  bias: "Continuation in the direction of the party defending the CE."
  entry: "Limit at the CE when the near-edge entry gives insufficient R:R (his example rejects ~1R and moves the entry to the CE)."
  stop: "Beyond the swing extreme, not the gap edge."
  targets: ["the opposite side of the range", "fixed 2R+"]

measurable:
  - "fill rate of CE entries vs near-edge entries (how often CE is reached at all)"
  - "hit rate conditional on CE respected vs violated"
  - "R:R improvement from CE entries in the sample"

sources:
  - video_id: uDJI2AbyyCs
    title: "Inversion Fair Value Gaps (IFVG) - ICT Concepts"
  - video_id: YESqIoA7Wyg
    title: "Important Liquidity Levels - Draw On Liquidity - ICT"
  - video_id: TCFvsZeYvV8
    title: "ICT Power Of 3 - AMD"

ambiguities:
  - "Whether the fib is anchored wick-to-wick on the outer candles or to the gap boundary prices themselves is not stated (they differ)."
  - "'Respect' is a close-based test in some phrasings and a visual reaction in others."
  - "CE is also referenced for a new day opening gap (power-of-three video) and a monthly FVG (liquidity levels video) without restating the construction."

python_detector: null
related: ["fair-value-gap", "inversion-fair-value-gap", "mean-threshold", "internal-range-liquidity"]
