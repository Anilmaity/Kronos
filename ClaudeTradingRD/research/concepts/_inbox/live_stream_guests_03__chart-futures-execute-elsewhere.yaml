id: chart-futures-execute-elsewhere
name: Chart The Futures, Execute The Option - Because Of Overnight Structure
aliases:
- ES chart SPX options
category: risk
status: specified
definition: Both speakers in the Trade For Opportunity stream reach the same conclusion for the same
  reason. The host would use SPX and SPY options while reading the ES chart, and NQ for the Nasdaq
  products, specifically because the futures chart carries the overnight structure that a cash-session
  ETF chart does not. The guest gives the same reason from the negative side - he does not apply ICT
  to individual equities precisely because of the price gaps and the missing overnight continuation,
  which make price harder to make sense of than in futures and forex. Both add that if equity options
  are traded at all, large caps are preferable to thinly traded small caps with wider spreads.
timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: false
preconditions:
- An instrument pair where one vehicle trades overnight and the other does not.
detection_rules:
- Read structure on the continuous futures chart - ES for S&P products, NQ for Nasdaq products.
- Execute the option on SPX/SPY (or QQQ) rather than framing the setup on the ETF chart.
- Avoid framing ICT setups on individual equity charts because of gaps and missing overnight structure.
- If equity options are traded, prefer large caps over thinly traded names.
invalidation:
- Not applicable - a vehicle-selection rule.
measurable:
- difference in identified levels between the futures chart and the ETF chart on the same day
- fill quality and spread cost by vehicle
sources:
- video_id: 0bH_kkG2q6s
  title: Stream Q & A with Trade For Opportunity  - ICT concepts
  quote: i would use spx and spy options and just use the es chart
- video_id: 0bH_kkG2q6s
  title: Stream Q & A with Trade For Opportunity  - ICT concepts
  quote: i don't tend to use ict with stocks
ambiguities:
- No adjustment is described for the price offset between ES and SPX, or between NQ and QQQ.
- '''Large caps'' is not bounded by market cap, volume or spread.'
