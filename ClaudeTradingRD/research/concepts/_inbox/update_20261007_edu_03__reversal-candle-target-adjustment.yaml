id: reversal-candle-target-adjustment
name: Reversal Candle - Adjust Targets, Do Not Expect Expansion Past The Open
category: model
status: contested
voice: ttrades
definition: 'ADR mechanism for the target cut: a large opposing move ''is using time and range''. Projecting the
  ADR from the extreme of that large wick shows the farther target is no longer reachable today, and the reachable
  level (in his examples PDH or PDL) becomes the day''s target. He will not trade beyond that level the same day
  and waits for the new daily open for new range; with a small wick respecting the EQ / T-spot the farther target
  would have stayed in reach.'
detection_rules:
- Measure the opposing run (wick) of the current daily candle.
- Project ADR from the wick extreme in the bias direction.
- If the projection ends at/near PDH/PDL rather than the farther target, PDH/PDL is the day's target; no continuation
  beyond it until the next day.
sources:
