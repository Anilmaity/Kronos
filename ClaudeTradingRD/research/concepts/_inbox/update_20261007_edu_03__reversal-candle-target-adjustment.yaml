- video_id: 3OIq9HmckH8
  title: How to Use Average Daily Range (ADR) with PDH / PDL — No More Fakeouts
  quote: but not really until the following day most of the time
ambiguities:
- What counts as 'large' vs 'small' wick is deferred to his wick-size video; in the ADR ~400 and ~116 examples the
  wick consumed roughly a third or more of ADR, but no threshold is stated.
measurable:
- hit rate of the farther target same-day vs next-day, split by wick size as fraction of ADR
