id: harder-target-behind-protected-swing
name: A Target Behind A Protected Swing Is Harder To Reach
aliases:
- why that low and not the low below it
category: risk
status: underspecified

definition: >
  A target-selection filter, given when a viewer asked why he was targeting one low and not
  the deeper one below it. The deeper low is guarded by a protected swing - a low that took
  out a run of prior lows - and he says that makes it materially harder to reach than the
  nearer, unguarded low, so he targets the nearer one. In the same passage he shows how he
  draws the expected reaction area: take the bodies of the relevant candles and mark roughly
  50% of them by eye, then expect the low to form in that middle area.

timeframes:
  htf:
  - 1D
  ltf:
  - 15m
  - 5m
  fractal: true

preconditions:
- Two or more candidate targets exist on the same side of price.

detection_rules:
- Enumerate the candidate targets on the working side.
- Mark which candidates sit beyond a protected swing (a swing that itself took out a series
  of prior swings).
- Downgrade those; prefer the nearest candidate not sitting behind one.
- Draw the expected reaction zone as roughly 50% of the relevant candle bodies, eyeballed.

invalidation:
- n/a - a target filter.

measurable:
- hit rate of targets sitting beyond a protected swing versus targets that are not, on the
  same day
- how often the eyeballed 50%-of-bodies zone contains the day's extreme

sources:
- video_id: U4j-fZD-FJk
  title: New York Open Live Q&A
  quote: This is a protected swing
- video_id: U4j-fZD-FJk
  title: New York Open Live Q&A
  quote: it's going to be a lot harder to get to this low
- video_id: U4j-fZD-FJk
  title: New York Open Live Q&A
  quote: taking the bodies of these, and then marking out around 50%

ambiguities:
- '"Protected swing" is used here as a property of the target rather than of the entry''s
  invalidation, which is how the rest of the corpus uses it. The two usages are never
  reconciled.'
- '"A lot harder" is not measured - no probability, no ratio, no rule for when the deeper
  target becomes acceptable.'
- The 50%-of-bodies construction is explicitly eyeballed ("I just eyeballed it") and no rule
  says which bodies enter the cluster.

