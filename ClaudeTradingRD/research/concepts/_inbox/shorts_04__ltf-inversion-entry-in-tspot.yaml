id: ltf-inversion-entry-in-tspot
name: "1-Minute Inversion Entry Inside The T-Spot"
category: entry
status: specified
definition: >
  A 46-second Short states the full five-step recipe end to end: establish a higher-timeframe
  bias; require a candle closure in line with it (a candle 2 closure where price sweeps the
  previous candle and closes inside); confirm on the 5-minute with a change in the state of
  delivery; identify a point of interest inside the T-spot where the higher-timeframe wick of
  candle 3 is expected to form; then drop to the 1-minute, wait for an inversion to form there,
  take the entry and look for 2R. A companion Short adds the shortcut case: when the invalidation
  sits very close to the higher-timeframe opening price, the inversion can be entered at the
  open.

timeframes:
  htf: ["1D", "4H", "1H"]
  ltf: ["5m", "1m"]
  fractal: true

detection_rules:
  - "Step 1: higher-timeframe bias."
  - "Step 2: a candle closure in line with that bias (sweep of the previous candle, close back inside)."
  - "Step 3: confirm on the 5-minute with a change in the state of delivery."
  - "Step 4: locate a point of interest (fair value gap) inside the T-spot, where the candle 3 wick is expected."
  - "Step 5: on the 1-minute, wait for an inversion to form there, enter, target 2R."

invalidation:
  - "The T-spot low (bullish case) is taken out."
  - "No inversion forms on the 1-minute inside the point of interest."

measurable:
  - "hit rate of 2R on 1-minute inversion entries inside the T-spot"
  - "how often an inversion actually forms once the T-spot is tagged"

sources:
  - video_id: gLul2OZQe9Q
    title: "Using a Lower Timeframe Inversion Entry within the Fractal Model"
    quote: "have a higher time frame bias"
  - video_id: gLul2OZQe9Q
    title: "Using a Lower Timeframe Inversion Entry within the Fractal Model"
    quote: "price reaches into that fair value gap in the T-spot"
  - video_id: gLul2OZQe9Q
    title: "Using a Lower Timeframe Inversion Entry within the Fractal Model"
    quote: "wait for an inversion to form, take my entry, and then look for 2 R"
  - video_id: VtFC9SCnlYM
    title: "Using Inversion as an Entry Within the Fractal Model"
    quote: "using an inversion, you can go ahead and just enter on the open"

ambiguities:
  - "The higher timeframe is never named in the Short - only 'higher time frame' against a 5-minute confirmation and a 1-minute entry."
  - "'Inversion' is not defined inside the Short; it is assumed known."
  - "No time limit is placed on how long to wait on the 1-minute after the T-spot is tagged."

python_detector: null
related: ["t-spot", "inversion-fair-value-gap", "fractal-model-c3", "cisd", "positional-entry"]

voice: ttrades
contributing_units: [shorts_04]
draft_count: 1
