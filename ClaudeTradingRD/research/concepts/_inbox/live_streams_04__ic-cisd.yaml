id: ic-cisd
name: "Intracandle CISD (IC-CISD)"
aliases: ["ICSD", "IC CISD"]
category: entry
status: underspecified

definition: >
  Asked what ICSD is, he gives the only definition of it in this unit: a concept he created
  within his fractal model which determines the wick of a continuation candle. He adds that he
  has not made a video called that - he has made a video on the idea but does not use the name
  in it - and separately confirms that he coined the C2, C3 and IC-CISD terminology himself.
  No mechanics are given here, so the concept remains a name attached to a job (locating where
  a continuation candle's wick will end) rather than a testable rule.

