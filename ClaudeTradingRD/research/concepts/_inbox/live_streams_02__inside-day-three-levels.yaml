id: inside-day-three-levels
name: "Inside Day — Only Three Points Of Interest"
aliases: ["previous day high, previous day EQ, previous day low", "stuck inside day"]
category: liquidity
status: specified

definition: >
  When the current daily candle is an inside day (its range contained by the previous day's),
  he reduces the chart to exactly three levels and refuses to use anything else: previous day
  high, previous day EQ, and — only if the EQ fails — previous day low. He states the cut-off
  plainly: "I only have three points of interest. That's all I'm looking for." In the session
  shown, price traded below previous day EQ intraday and he did not treat that as an
  invalidation of the bullish bias, reading it instead as a sweep of the liquidity resting
  around the EQ of the range, and stayed bullish to previous day high.

timeframes:
  htf: ["1D", "1H"]
  ltf: ["15m", "5m", "3m"]
  fractal: false

preconditions:
  - "The current daily candle is inside the previous daily candle's range."

detection_rules:
  - "On an inside day, mark only previous day high, previous day EQ and previous day low."
  - "Do not add intraday fair value gaps or other arrays as points of interest on such a day."
  - "Work from the EQ first: a reaction there projects toward previous day high (bullish case)."
  - "Only if previous day EQ fails does previous day low come into play."
  - "A close through previous day EQ is not automatically a bias invalidation — read it as a sweep of the liquidity around the EQ."

invalidation:
  - "Explicit invalidation of the bias is not the EQ close; he says only to focus on invalidation of bias, which is left undefined for this case."

measurable:
  - "reaction rate at previous day EQ on inside days"
  - "share of inside days that reach previous day high or low"
  - "outcome of flipping bias on an EQ close versus holding"

sources:
  - video_id: G1IIdQ3RAkY
    title: "New York Open Live Q&A"
    quote: "I only have three points of interest. That's all I'm looking for."

ambiguities:
  - "He states elsewhere in the same stream that he has a mechanical procedure for trading an inside day but deliberately will not publish it, so the actual inside-day entry model is missing from the corpus by design."
  - "What does count as invalidation of the bias on an inside day is never given — only that the EQ close is not it."
  - "Whether the EQ used is the previous day's body EQ or full-range EQ is not stated here."

python_detector: null
related: ["equilibrium-eq", "previous-period-high-low", "daily-bias-candle-formation", "draw-on-liquidity"]

