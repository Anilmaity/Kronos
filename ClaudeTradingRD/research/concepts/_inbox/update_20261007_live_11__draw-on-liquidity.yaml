id: draw-on-liquidity
name: "Draw On Liquidity"
aliases: ["drawn liquidity"]
category: liquidity
status: specified
voice: ttrades
definition: >
  Answered to a viewer: from current price, look left and ask whether price is more likely to
  reach a level above or below; trade toward that one. Worked on gold - a bullish setup that
  fails to form a continuation makes the opposite (previous day low) the draw. He says a draw
  can be a reversal level but is primarily just where he thinks price should go.
timeframes:
  htf: ["1D", "1H"]
  ltf: []
  fractal: true
detection_rules:
  - "If the setup toward one side fails to continue, the opposite liquidity becomes the draw."
sources:
  - video_id: KBJAGgkXdeI
    title: "New York Open Live Q&A"
    quote: "You are going to look left"
  - video_id: KBJAGgkXdeI
    title: "New York Open Live Q&A"
    quote: "if it's going to fail, is it more likely to go here or here?"
ambiguities: []
python_detector: null
related: ["invalidation-trade"]
