id: feel-emotion-dont-act
name: Feel the Emotion, Do Not Act On It
category: psychology
status: specified
voice: ttrades
definition: 'Blowing several accounts in a day is a management issue - tilt and sizing - not a strategy
  issue. The way to overcome psychological issues: when you are about to revenge trade or size up to win
  a loss back, don''t. He diagnoses unprofitability as either no strategy or discipline/psychology, and
  uses a video-game analogy: after a loss you respawn, you do not quit to the main menu and rebuild your
  whole loadout.'
