ambiguities:
- 'EVOLUTION, NOT CONTRADICTION: this is the earliest bias recording. The later canon (caaS6_Q7O78, FXJBFbZQbck)
  replaces this five-item read with the previous-candle take-and-close test plus displacement over previous
  day high/low. This version is superseded but is the origin of the ''liquidity accumulated must be distributed''
  rationale. Both preserved.'
- No weighting or precedence among the five items.
- '''The closest imbalances and liquidity'' has no distance rule.'
- The video is explicitly rushed ('made it really quickly before i go on a trip').
