id: daily-bias-framework
name: Daily Bias Framework
aliases:
- how to get my bias
category: model
status: contested
definition: 'EARLIEST RECORDING OF THE BIAS PROCEDURE IN THE CORPUS, and structurally different from the
  later previous-candle / displacement engine. It is a five-item ordered read: (1) previous liquidity
  taken - because liquidity accumulated at a low must be distributed higher and vice versa; (2) swing
  highs and lows, short-term highs and lows, and relatively equal highs and lows, marked because that
  is where stops rest; (3) market structure shifts and imbalances, read as the change in trend; (4) whether
  price is at equilibrium, premium or discount; (5) the plain lower-high/lower-low sequence to see which
  way price is turning. He then cleans the chart down to the closest imbalances and liquidity and states
  the bias as a path, not a direction.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  fractal: true
preconditions:
- A daily chart plus the intermediate timeframes (1H, 15m) for confirmation.
detection_rules:
- 1. Mark what liquidity has just been taken; expect distribution toward the opposite side.
- 2. Mark swing highs/lows, short-term highs/lows and relatively equal highs/lows as the stop pools.
- 3. Mark market structure shifts and the imbalances (fair value gaps) they leave - these signal the change
  in trend.
- 4. Determine whether price is in premium, discount or at equilibrium of the operative range.
- 5. Read the simple lower-high/lower-low (or higher-high/higher-low) sequence.
- Reduce to the CLOSEST imbalance and the closest liquidity; state the expected path through them.
- The bias is a path, not a single direction - e.g. down to take the resting liquidity first, then up
  to the target.
invalidation:
- The nominated liquidity is taken and price does not distribute the expected way.
measurable:
- hit rate of the nominated path (liquidity grab first, then target) vs the direct move
- how often the closest-imbalance simplification changes the call
