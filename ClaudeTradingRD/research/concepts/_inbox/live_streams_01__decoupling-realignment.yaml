id: decoupling-realignment
name: Decoupled Correlated Indices Must Come Back Into Alignment
definition: 'When correlated indices decouple - one strongly directional while the others are flat
  or opposite - the divergence is read as one of them ''lying''. The expectation is that alignment
  is restored, and the tradeable question is which asset does the restoring: either the laggard catches
  up or the leader gives back. In the worked example YM was sharply bullish while NQ and ES were flat;
  the next session YM was the asset that came back, and its resolution target was the previous day''s
  low.'
category: structure
status: underspecified
timeframes:
  htf:
  - 1D
  ltf:
  - 1H
  - 15m
  fractal: false
preconditions:
- Two or more correlated indices (ES, NQ, YM) charted together.
- A visible divergence in daily direction or percent change between them.
detection_rules:
- 'Identify the decoupled pair: one index strongly directional, the other(s) flat or opposite on the
  day.'
- 'State the two ways alignment can be restored: the laggard expands to catch up, or the leader retraces.'
- Once the realigning asset is identified, its target is the nearest daily level - the previous day
  low / high.
- The realigning asset is also read as the weakest (or strongest) of the set for asset selection.
invalidation:
- The divergence widens further rather than closing.
measurable:
- frequency with which a decoupled index closes the divergence within N sessions
- which side (leader or laggard) does the realigning
sources:
- video_id: xraklBJHW5k
  title: New York Open Live Q&A
  quote: something has to come back into alignment
ambiguities:
- No threshold defines 'decoupled' - the example used one index down ~0.63% while the other two were
  roughly flat on the day, but no percentage rule is given.
- No rule decides in advance which of the two assets does the realigning; in the example he inferred
  it after the fact and admitted on stream he mis-framed the trade.
- No time horizon is given for the realignment.
