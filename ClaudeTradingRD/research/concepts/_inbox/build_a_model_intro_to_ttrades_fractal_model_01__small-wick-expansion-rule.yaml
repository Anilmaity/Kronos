ambiguities:
- NO NUMERIC THRESHOLD EXISTS IN THIS UNIT. Five of the twenty videos gate on wick size and none
  gives a ratio, a percentage, or a fib level. The dedicated wick video (LKNQDAdId4s) gives only
  the 0.5-of-wick RESPECT test, not a size test.
- A dedicated video titled 'Wick Size Matters' (SlWxhzhLo3A) exists in the corpus but is assigned
  to unit build_a_model_intro_to_ttrades_fractal_model_03 - that is where the threshold, if it exists
  anywhere, should be looked for next.
- '''Formed early into the candle'' introduces a TIME criterion alongside the size criterion; the
  two are used interchangeably but are not the same measurement.'
- Small vs large is judged relative to the same candle's body in some statements and relative to
  the previous candle's wick in others.
