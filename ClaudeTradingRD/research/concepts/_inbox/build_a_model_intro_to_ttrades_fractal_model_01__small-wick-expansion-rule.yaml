id: small-wick-expansion-rule
name: Small Wick Supports Expansion; Large Wick Waits for Candle 3
category: model
status: underspecified
aliases:
- wick size
- supports expansion
- large opposing run
definition: 'The single most load-bearing filter in the model, and - the key negative finding of
  this unit - it is STILL not quantified in the channel''s own primary teaching series. A candle
  that supports expansion has a small wick and a large body: it opens, forms its opposing wick EARLY,
  and then trends for the rest of the period. A candle that does not support expansion has a large
  wick or a large opposing run: it spends a long time making its opposing move and therefore cannot
  trend, and price tends to return toward its opening price or its current extreme. Operationally:
  small wick -> the reversal candle itself may be traded; large wick -> do not trade the reversal
  candle, wait for the following candle (candle 3). The nearest thing to a mechanical test offered
  is indirect: a candle that trades through 0.5 of the previous candle''s wick ''would form too large
  of a wick for an expansion candle''.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 30m
  - 15m
  - 5m
  fractal: true
preconditions:
- A candle has opened at or from a key level with a directional read.
detection_rules:
- Small wick + large body + wick formed EARLY in the period -> supports expansion; the reversal candle
  may be traded.
- Large wick, or a long-lasting opposing run -> does not support expansion; wait for the next candle
  open and trade candle 3 instead.
- 'Indirect threshold (the only one given): if price trades/closes through 0.5 of the reference wick,
  the resulting wick would be too large for an expansion candle.'
- A candle with NO wick is treated as a level to trade away from rather than an expansion candle,
  and you wait for the new candle open.
- The filter is applied independently at every timeframe layer in the alignment stack.
invalidation:
- Not applicable - this is a classification filter.
measurable:
- forward expansion distance bucketed by wick-to-range ratio - the direct way to recover the missing
  threshold
- win rate of reversal-candle entries bucketed by wick ratio
- how much of the period elapses before the wick extreme prints (the 'early' criterion)
