id: level-to-trade-away-from
name: Level To Trade Away From
category: entry
status: contested
voice: ttrades
definition: Repeated three times in the stream. (1) After ES/YM failed to sweep the previous 4-hour high he says
  there is no way to frame shorts when price fails to sweep an important level, so the up-trend stands. (2) On gold
  he cannot frame longs until price runs out the previous-day lows below, because a reversal before that would be
  a failure swing (he points viewers to his relevant swings video). (3) Once gold does hit that low he is no longer
  bearish but still will not trade the bounce, because that is a reversal and he does not try to catch little highs
  or lows.
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  fractal: true
detection_rules:
- No counter-direction framing until the important level (PDH/PDL, previous 4H high) has been swept.
- A reversal that leaves the target low untaken is a failure swing - do not trade it.
- After the level is hit, the reversal itself is still not traded; wait for a continuation.
