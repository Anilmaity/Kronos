id: continuation-signature
name: Continuation Signatures (Consolidation And Retracement)
category: structure
status: specified
voice: ttrades
aliases: []
definition: 'Applied at a target: after price expands lower and hits its first target (a previous low),
  he asks whether the reaction is a retracement, a reversal, or a consolidation. In the example it is
  a consolidation, which he calls a continuation signature, and price continues lower to the second target.
  Used here as the hold-or-exit decision between sequential targets.'
timeframes:
  htf:
  - 1D
  ltf:
  - 1H
  fractal: true
preconditions:
- Price has expanded into and hit a first target, with a further target beyond it.
detection_rules:
- After the first target is hit, classify the reaction as retracement, reversal or consolidation.
- Consolidation at the first target = continuation signature; expect the next target to be reached.
invalidation:
- A reversal at the first target (not defined mechanically in this Short).
measurable:
- probability of reaching target 2 after a consolidation at target 1 vs after a retracement
sources:
- video_id: CEm1Bnhvb2I
  title: Make Targets Simple Using the Fractal Model
  quote: Do we get a retracement or a reversal?
- video_id: CEm1Bnhvb2I
  title: Make Targets Simple Using the Fractal Model
  quote: we get a consolidation, which is a continuation signature, and we trade lower.
ambiguities:
- Here a retracement is listed alongside reversal as the non-consolidation outcome, whereas the library
  entry counts a retracement as a continuation signature too; the Short does not say what a retracement
  at target 1 would mean.
related:
- draw-on-liquidity
- consolidation
python_detector: null
