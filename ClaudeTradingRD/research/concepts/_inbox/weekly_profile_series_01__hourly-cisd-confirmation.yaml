ambiguities:
  - "The scope of the search is stated inconsistently across the series: 'inside this wick' (Classic Expansion) versus 'inside that candle two' / 'inside Thursday's range' (Midweek Reversal, Consolidation Reversal, Thursday Counter). Whether the CISD must occur within the wick portion only, or anywhere inside the daily candle, is not resolved."
  - "Whether the required close-through is a body close or may be a wick through the level is never stated."
  - "The 'series of candles that made the low' is not bounded - no maximum count, and no rule for what breaks a series."
  - "In the TGIF video the speaker permits substituting a plain candle closure for the CISD once New York is in session, on volatility grounds, which weakens the gate at a time boundary that is not precisely given."
  - "The CISD is repeatedly read off his own indicator on screen; the indicator's exact rule set is not published in these transcripts."

python_detector: null
