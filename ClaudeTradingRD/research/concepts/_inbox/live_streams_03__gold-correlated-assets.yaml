id: gold-correlated-assets
name: Correlated Assets For Gold (gold-euro and gold-pound)
aliases:
- gold euro gold pound
category: liquidity
status: specified

definition: >
  Which instruments he compares gold against when looking for SMT. Answering a viewer who
  asserted that silver is the correlation for gold, he names gold priced in euro and gold
  priced in pound instead. He charts gold itself as CME gold futures (typed on screen as
  GC1!) and says he uses futures only, so he does not look at other feeds. In a separate
  stream he notes gold's correlation was behaving oddly that day and he therefore had no
  gold idea.

timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  fractal: true

preconditions:
- An SMT / relative-strength comparison is being made on gold.

detection_rules:
- Compare gold against gold-in-euro and gold-in-pound, not against silver.
- Chart gold as the CME gold future (GC1!) rather than a CFD or spot feed.
- If the correlation is behaving oddly on the day, stand aside rather than force the read.

invalidation:
- n/a - an instrument-selection rule.

measurable:
- frequency and predictive value of SMT between gold, gold-in-euro and gold-in-pound versus
  gold versus silver

sources:
- video_id: W7Fu3Rx5iMs
  title: New York Open Live Q&A
  quote: generally, I use the gold euro gold pound
- video_id: W7Fu3Rx5iMs
  title: New York Open Live Q&A
  quote: I just use futures so I don't look at anything else
- video_id: c7nk7ypJHN4
  title: New York Open Live Q&A
  quote: the correlation is a little weird

ambiguities:
- The exact symbols are never spelled out; "gold euro gold pound" is read as XAU/EUR and
  XAU/GBP but the transcript does not say so.
- No preference or ranking between the two is given, and nothing is said about how to rank
  three gold instruments the way he ranks ES / NQ / YM.
- He does not say silver is wrong, only that gold-euro and gold-pound are what he uses; in
  another stream he looks at silver alongside gold without calling it a correlation pair.

related:
