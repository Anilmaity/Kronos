id: monday-trade-rule
name: The Monday Rule (when Monday is tradeable)
definition: 'Restated verbatim under a viewer question about skipping Mondays entirely: the only time
  he looks to trade a Monday is when Friday produced a reversal day. He also declines to anticipate
  over the weekend on instruments that gap - oil is named - preferring to let the gap resolve into
  a marked level first.'
category: time
status: specified
preconditions:
- The previous Friday closed as a reversal day.
detection_rules:
- Monday is tradeable only if Friday formed a reversal.
- Otherwise skip Monday and let its range form.
- Do not carry weekend anticipation into gap-prone instruments.
measurable:
- expectancy of Monday trades with and without a Friday reversal
sources:
- video_id: NESSCPMzWR0
  title: New York Open Live Q&A
  quote: The only time I look to trade Mondays
ambiguities:
- '''Reversal day'' is used here without the candle-2-closure qualifier applied to it in the weekly-profile
  series, where Monday is candle 3 of a Friday candle 2 closure.'
