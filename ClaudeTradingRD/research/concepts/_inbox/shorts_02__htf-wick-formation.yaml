id: htf-wick-formation
name: Higher-Timeframe Wick Built From Two Aggressive Legs
category: structure
status: specified
definition: 'The most compressed statement of this mechanic anywhere in the corpus: a higher timeframe
  wick IS a lower timeframe reversal. A candle whose distance from its low to its closing price is very
  large is, one timeframe down, price opening, trading lower, and then trading back towards its opening
  price - and that round trip is what builds the wick.'
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  fractal: true
preconditions:
- A candle with a visibly large wick relative to the distance to its close.
detection_rules:
- Identify a candle whose distance from its low to its closing price is very large.
- 'Drop one timeframe: that wick is price opening, trading lower, and trading back towards the opening
  price.'
- Read the higher-timeframe wick and the lower-timeframe reversal as the same event.
invalidation:
- Not applicable - a structural identity, not a setup.
measurable:
- share of large-wick HTF candles that contain an identifiable LTF reversal
sources:
- video_id: rTnu3ZEb2ZE
  title: How a Higher Timeframe Wick Forms
  quote: A higher time frame wick is a lower time frame reversal
- video_id: rTnu3ZEb2ZE
  title: How a Higher Timeframe Wick Forms
  quote: price opens, it trades lower, and then trades back towards its opening price
ambiguities:
- The Short measures the wick "from its low to its closing price", not from the body extreme to the
  low, which is a different measurement from the one the half-wick-respect rule uses. It is not said
  whether the two are meant to be the same.
- '"Very large" is not quantified in this clip.'
- Which lower timeframe to drop to is not stated.
