ambiguities:
- '''Beyond the EQ'' is stated for the ideal case, but one final example accepts a protected swing
  that ''doesn''t technically cover the EQ'' on the grounds that the area is large enough - so the
  test is a preference, not a hard rule.'
- No guidance on how recently before the open the protected swing must have formed.
