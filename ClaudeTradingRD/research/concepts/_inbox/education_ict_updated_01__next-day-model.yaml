ambiguities:
- '''Closes back into the range'' — whether the close must be inside the previous candle''s BODY or
  its full high-low range is never stated; the examples read as full range.'
- The conflict rule ('if I had to choose I would be bullish because of this strong closure') is judgement,
  not a rule.
- He runs the mechanical read and then overrides it with phases of price several times in the same example;
  the override has no trigger condition.
