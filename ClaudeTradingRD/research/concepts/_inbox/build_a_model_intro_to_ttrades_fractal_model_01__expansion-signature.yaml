id: expansion-signature
name: Expansion Signature
category: structure
status: specified
aliases:
- one-sided trending move
- large range
definition: 'PRIMARY-SOURCE READING (this unit): expansion is a one-sided trending move whose signature
  is very shallow moves against the trend. Expansion is expected after a consolidation or after a
  retracement - the market cycles large range, small range, large range. Inside an expansion you
  do not wait for a deep retracement into discount; you look for the opposing candles (down-close
  candles in a bull leg, up-close candles in a bear leg) to support price, and you take protected
  swings as they form. Three days of expansion, or expansion into an already-hit objective, is the
  stated point to stop seeking continuation.'
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 1H
  - 15m
  - 5m
  fractal: true
preconditions:
- An objective / draw on liquidity is open in the direction of the move.
detection_rules:
- 'The move is one-sided: a sequence of same-direction candles making a large range.'
- Counter-trend moves within it are shallow - price does not retrace into a discount of the leg to
  continue.
- The candle carries a small wick and a large body (see small-wick-expansion-rule).
- The prior phase was a consolidation or a retracement (small range).
- 'Continuation entries are taken at opposing candles: price reaches a PD array, then closes through
  the series of opposing candles into it, forming a new protected swing.'
- 'Stand-aside rule: after three days of expansion, or after expansion into an objective, do not
  seek a further continuation - a new phase of price is due.'
invalidation:
- A deep retracement rather than a shallow one.
- Expansion met with expansion in the opposite direction (that is a reversal).
execution:
  bias: With the one-sided move.
  entry: Close through the series of opposing candles into a PD array (new protected swing).
  stop: Beyond the protected swing.
  targets:
  - previous candles' unswept highs/lows on the reference higher timeframe
measurable:
- distribution of counter-trend retracement depth inside legs labelled expansion
- forward return after the 3rd consecutive expansion day vs after the 1st
- wick-to-body ratio distribution of candles called expansion candles
