  quote: Expansions are large ranges that have shallow retracements
- video_id: 4Gm8p6O7Ebs
  title: How To Trade Expansion - Phases Of Price
  quote: after we have 3 days of expansion, this is generally when it can set up
- video_id: Kf4c41_qO1s
  title: Higher Timeframe Analysis For Trading - Aligning Expansion Candles
  quote: Candles that support expansion will have a small wick and a large body
ambiguities:
- '''Shallow'' is never quantified. No percentage-of-leg, ATR multiple or fib level is given for
  the maximum counter-trend depth that still counts as expansion.'
- '''One-sided trending move'' has no bar-count or net-displacement threshold.'
- The '3 days of expansion' stand-aside is stated as 'generally', and one example counts two large
  days as sufficient - so the count itself is soft.
- The guest reading of this concept (t_talks_02, GxTradez) is compatible but adds an upper-half-EQ
  mechanisation that TTrades does not state here.
