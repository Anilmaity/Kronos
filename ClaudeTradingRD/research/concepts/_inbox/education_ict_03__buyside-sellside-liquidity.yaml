id: buyside-sellside-liquidity
name: Buyside & Sellside Liquidity
definition: 'EARLIER RECORDING of the channel''s liquidity lesson (the old Education - ICT playlist;
  the topic was later re-recorded). The definition given is the barest in the corpus: liquidity is
  simply where people''s stops are sitting, and those sit at the most obvious highs and lows. Stops
  of shorts rest above an obvious high (buyside), stops of longs rest below an obvious low (sellside).
  The lesson adds a sequencing rule the later material keeps: a pool being taken is not the trade,
  it is the cue to start looking for the trade. It also adds a granularity rule - you do not have
  to run the whole range of stops; inside a range, stops sit at the internal obvious highs and lows
  too, because a trader entering mid-range will not place a stop at the far end of the range.'
category: liquidity
status: specified
aliases:
- where people stops are sitting
- obvious highs and lows
- buy-side liquidity
- sell-side liquidity
preconditions:
- An obvious swing high or swing low is visible on the working timeframe.
detection_rules:
- buyside_liquidity := price of an obvious swing high (stops of shorts rest above it).
- sellside_liquidity := price of an obvious swing low (stops of longs rest below it).
- Inside a range, also mark the internal obvious highs and lows - a trader who entered mid-range
  stops there, not at the range extreme.
- A pool is 'taken' when price trades through it; once taken, stop treating it as a target.
- Only after the pool is taken do you look for the entry setup (drop to the execution timeframe).
- Untaken relatively equal highs / lows carry forward as targets for later.
invalidation:
- Once the level is traded through it stops being a target and attention moves to the next untaken
  pool.
measurable:
- frequency with which an obvious high/low is traded through within N bars of being marked
- hit rate of the 'once taken, look for the setup' sequencing versus entering before the sweep
