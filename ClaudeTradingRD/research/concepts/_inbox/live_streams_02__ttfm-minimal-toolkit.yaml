id: ttfm-minimal-toolkit
name: "Minimal Toolkit (what is on the chart, and what is deliberately not)"
aliases: ["highs, lows, fair value, CISD, SMT", "that's all I use"]
category: model
status: specified

definition: >
  Asked what concepts he uses for reversals or counter-trend trading, he enumerates the complete
  set and closes it: highs, lows, fair value [gaps], CISD and SMT — that's it, no matter what.
  The negative half is stated just as explicitly across the unit. He does not use kill zones any
  more (he helped build the kill-zone indicator and no longer uses it), does not use CRT, does
  not use ICT's advanced market structure labelling, does not use order flow, does not use
  inversion fair value gaps as a model, does not use standard deviations much, and does not use
  the RTH chart. Order blocks appear only as a general opposing-candle notion; he criticises
  ICT's order-block selection as unmechanical and says his own version is mechanical precisely
  so it can be coded.

timeframes:
  htf: ["1D", "4H", "1H"]
  ltf: ["15m", "5m", "3m", "1m"]
  fractal: true

preconditions:
  - "A bare chart with correlated instruments available for SMT."

detection_rules:
  - "The permitted feature set is: swing highs, swing lows, fair value gaps, CISD, SMT."
  - "Anything not in that list is not part of the read — kill zones, macros, CRT, advanced market structure labelling, order flow, IFVG models."
  - "Protected swings and the T-spot are derived from that set, not added to it."
  - "Selection of any level must be mechanical enough to be coded; discretionary array-picking is rejected."

invalidation:
  - "Not applicable — this is a scope statement."

measurable:
  - "performance of a detector restricted to the five primitives versus one with additional arrays"
  - "share of his live calls explainable by the five primitives alone"

sources:
  - video_id: TjUolMJNCMY
    title: "New York Open Live Q&A"
    quote: "Highs, lows, air value, CAD, ESD, SMT. That's it."
  - video_id: Je7cd9HJUBE
    title: "New York Open Live Q&A"
    quote: "I just don't use kill zones anymore"
  - video_id: G1IIdQ3RAkY
    title: "New York Open Live Q&A"
    quote: "So mine are mechanical. That's how I can code it up."

ambiguities:
  - "The quoted list is mangled by the auto-captioner: 'air value' is fair value and 'CAD, ESD' is CISD; the reading is inferred from every other use in the unit, not from that sentence alone."
  - "Whether 'highs and lows' means protected swings specifically or any swing point is not distinguished in the list."
  - "Order blocks / opposing candles are used in practice but do not appear in the enumerated list."
  - "He confirms he has more advanced material (inside-bar procedure, anticipation CISD, candle-3-consolidation handling) that he deliberately does not publish, so the public toolkit is knowingly a subset of the real one."

python_detector: null
related: ["cisd", "smt-divergence", "fair-value-gap", "protected-swing", "macros-not-used", "killzones"]

