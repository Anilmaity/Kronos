ambiguities:
  - "The timeframe on which the EQ close is read is not named; the chart is daily but the intraday sequence implies a lower timeframe."
  - "Whether the EQ is of the candle 2 or of the previous day's range is not stated."
  - "No entry is described for the bearish trade; the clip only names the target (candle 2 low)."
