id: invalidation-trade
name: Invalidation Trade (trading the failure of a valid model)
category: model
status: contested
voice: ttrades
aliases: ["failed candle two", "daily bias invalidation"]
definition: >
  SHORTS EVIDENCE on the daily. A V-shape reversal with a strong close into the highs is a bullish
  daily candle 2 closure. The expected path is: open, trade lower into a point of interest (a fair
  value gap), respect the EQ, trade higher. Instead price consolidates in the point of interest - which
  he reads as an early bad sign for the continuation - then makes a very aggressive closure below the
  EQ, disrespects the fair value gap and is not bought back up. That makes a continuation lower into
  the candle 2 low the anticipated move: a "failed candle two", because a bullish setup could not form,
  so it is simply a bearish setup.
detection_rules:
  - "Consolidation inside the point of interest where the continuation should react is an early warning that the candle 2 continuation is failing."
  - "An aggressive close below the EQ, through the fair value gap, with no buy-back, confirms the failure."
  - "On a failed candle 2, target the candle 2's own low."
