id: structure-requires-htf-context
name: "Never Read Lower-Timeframe Structure Without A Higher-Timeframe Bias First"
aliases: ["15-second chart doesn't care about the monthly"]
category: structure
status: contested
voice: ttrades
guest_sources: []

definition: >
  TTrades' own 2022 position on how far up the stack an intraday trader has to look, recorded
  because it cuts against the top-down doctrine the channel states elsewhere. Asked about starting
  top-down from the monthly, he says most of his analysis is the hourly and 15-minute, that the
  4-hour is not really needed if you have used the daily, and that when he is trading a 15-second
  chart he does not care what the monthly is doing. The operative gate he does keep is much
  shorter-range: the displacement / fair-value-gap read on the timeframe being traded (see
  displacement).

timeframes:
  htf: ["1D", "1H"]
  ltf: ["15m", "5m", "1m", "15s"]
  fractal: true

preconditions:
- "An intraday execution timeframe has been chosen."

detection_rules:
- "Stated working stack in this unit: daily, then hourly and 15-minute for analysis, with entries off the 15-minute, 5-minute or 1-minute."
- "The 4-hour is treated as optional once the daily has been read."
- "On a 15-second execution chart he states the monthly is not consulted at all."
- "What does gate the trade at that scale is the presence of displacement / fair value gaps in the intended direction on the traded timeframe."

invalidation:
- "Not applicable."

measurable:
- "expectancy of 15-second and 1-minute entries with and without a monthly / weekly directional filter applied"

sources:
- video_id: UmLWRlXd_V8
  title: "8/14/22  MMXM Live with $niper  - ICT concepts"
  quote: "trading a 15 second chart I don't really care what the monthly is doing"

ambiguities:
- "This is an August 2022 statement and is recorded as spoken; it is not reconciled here with the channel's later insistence on higher-timeframe context before lower-timeframe structure."
- "He does not say where the cut-off sits - the monthly is dismissed for a 15-second chart, but no rule maps execution timeframe to the highest timeframe that still matters."
- "The guest in the same video ($niper) does run a monthly-to-15-minute top-down read, so the disagreement is visible on air but is never argued out."

python_detector: null
related: ["top-down-analysis-procedure", "timeframe-pairing", "displacement", "max-one-trade-per-day"]
