ambiguities:
- '''Large manipulation leg'' is judged against the available range by eye -- the closest he comes to
  a threshold is one example where the leg is ''almost half'' of the distance to the target.'
- It is not stated whether the anchor uses wicks or bodies.
- The level set is offered as personal ('you can always add levels that you find work for you'), so
  it is a default rather than a rule.
