id: standard-deviation-projection
name: Standard Deviation Projection Of The Manipulation Leg
category: entry
status: specified
aliases:
- projections
- negative one standard deviation
- fib projection
definition: 'The fully mechanical target tool, and the most numerically specific concept in the unit.
  Set a Fibonacci tool to the levels 1, 0, -1, -2, -2.5, -4 and -4.5. Anchor it inside CANDLE 2 at the
  reversal point: from the low (bullish) to the high that made that low -- the manipulation leg -- and
  project. Target selection is governed by the SIZE of that manipulation leg: a normal-sized leg targets
  -2 to -2.5, extending to -4/-4.5 on expansion; a large leg targets only -1, because the further deviations
  are more range than the period can plausibly cover. He states he uses projections as CONFLUENCE to
  existing liquidity targets, and alone only where no liquidity rests (e.g. at all-time highs).'
timeframes:
  htf:
  - 1W
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  fractal: true
preconditions:
- A candle 2 closure with a confirmed change in the state of delivery.
detection_rules:
- 'Fibonacci levels: 1, 0, -1, -2, -2.5, -4, -4.5.'
- 'Locate the manipulation leg inside candle 2: the low, and the high that made that low (bullish);
  reversed for bearish.'
- Anchor at the low, drag to the high that made it, and project.
- Normal manipulation leg -> primary targets -2 to -2.5; on continued expansion, -4 to -4.5.
- Large manipulation leg (a large share of the available range) -> target -1 only.
- Prefer targets where a projection level coincides with resting liquidity (equal highs/lows, previous
  period extremes, failure swings).
- When the -2/-2.5 sits just BEYOND a liquidity pool, take profit at the liquidity pool instead of holding
  for the projection.
invalidation:
- Price reverses before the first projection level -- he then re-projects from the new candle 2.
execution:
  bias: From the confirmed candle 2.
  entry: Per the model.
  stop: Per the model.
  targets:
  - '-1'
  - -2 to -2.5
  - -4 to -4.5
measurable:
- hit rate of -1 / -2 / -2.5 / -4 by manipulation-leg size
- frequency with which a projection level coincides with resting liquidity
- profit given up by taking the pre-projection liquidity target instead
sources:
