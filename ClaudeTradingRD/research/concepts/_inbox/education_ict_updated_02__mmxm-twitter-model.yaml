  quote: although the model says a market structure shift I will also look for an inversion
ambiguities:
- '''Market structure shift'' is never defined in this video and is used interchangeably with change
  in the state of delivery.'
- Which correlated asset supplies the SMT is chosen per example with no rule (silver for gold, ES/YM
  for NQ, GBPCAD in one case).
- The fair-value-gap selection reasoning (premium/discount, already mitigated) is given once and
  not stated as a rule.
- This is a model taught on someone else's behalf - the underlying source is the MMXM Trader's Twitter,
  not this channel's own method.
- The transcript renders 'MMXM' as 'mxm' throughout.
