  quote: I'm going to have to enter at the open
ambiguities:
- '''Aggressive'' is never defined. No candle count, range, body-to-wick ratio or speed measure is given
  for what makes an expansion aggressive - the term is used ostensively, pointing at a chart. This is
  the whole reason the entry is underspecified.'
- '''Very shallow'' is given a location (into a fair value gap) but no fraction of the leg.'
- No rule states how long to wait before concluding that no retracement is coming.
- The two Shorts do not say whether the market-on-open entry is a different risk size from a retracement
  entry.
