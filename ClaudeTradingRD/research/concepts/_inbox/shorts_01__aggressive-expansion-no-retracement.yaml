id: aggressive-expansion-no-retracement
name: Aggressive Expansion Yields Little Or No Retracement
category: structure
status: underspecified
aliases:
- aggressive expansion
- aggressive move
- no retracement at all
definition: 'The Shorts state the operational consequence of calling an expansion ''aggressive'': an
  aggressive expansion produces either a very shallow retracement or no retracement at all, and a very
  aggressive move is unlikely to give much of a retracement. Two actions follow. First, if no retracement
  into a point of interest occurs, there is simply no setup and the trade is skipped - he narrates twice
  in one clip that he ''would not get a setup''. Second, when he does want the trade anyway, the retracement
  cannot be waited for, so he enters at the open of the new candle rather than on a pullback. The shallow-retracement
  case is located: the shallow move goes into a fair value gap and no further.'
preconditions:
- An expansion leg has printed and is described as aggressive.
- A directional read already exists (this is a depth expectation, not a bias source).
detection_rules:
- Classify the expansion leg as aggressive or not (the classifier itself is NOT defined here).
- 'If aggressive: expect either a very shallow retracement or none at all.'
- '''Shallow'' is located, not measured: the retracement reaches into a fair value gap and no further.'
- If no retracement into a point of interest occurs, there is no setup - stand aside.
- If the trade is still wanted, enter at the candle open rather than waiting for a pullback.
invalidation:
- 'A deep retracement prints, which contradicts the aggressive-expansion read (see shallow-retracement:
  a retracement to OTE flips the read).'
measurable:
- distribution of retracement depth (fraction of the impulse leg) conditioned on leg speed / size
- share of aggressive expansions that produce no touch of the fair value gap at all
- fill rate of limit orders at the gap versus market-on-open entries after aggressive legs
