id: a-plus-entry-checklist
name: A+ Entry Checklist
aliases:
- my a plus ICT entry checklist
category: entry
status: specified
definition: 'The fixed, ordered gate he applies AFTER a daily bias or direction already exists: (1)
  a stop raid — a low (or high) was put in and then run; (2) a market structure shift or displacement
  — a previous high broken and aggressively moved over; (3) price returns into a DISCOUNT of the displacement
  range (the one place he grants flexibility); (4) some PD array in that area — his preference order
  is fair value gap or order block, and he also uses OTE and breaker block. Each of the four could be
  an entry model on its own; he blends one, two or three.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- A daily bias / direction has already been established — the checklist does not produce direction.
detection_rules:
- '1. Stop raid: a swing low (bullish case) is put in and then broken.'
- '2. Market structure shift / displacement: a previous high broken and aggressively closed over.'
- 3. Fib the displacement range; require price back into the discount half (below 0.5) for longs, premium
  half for shorts. An OTE narrows this further.
- '4. A PD array inside that discount: fair value gap, order block, OTE, or breaker block — blended
  is preferred.'
- Choose among the candidate entries by risk-to-reward balanced against fill probability, since moving
  the entry toward the stop raises R but lowers fill odds.
- 'Hard gate: without a lower-timeframe liquidity raid before the move, he is not interested — displacement
  alone does not qualify.'
invalidation:
- The PD array sits in a premium of the range for a long (his stated reason for rejecting an otherwise
  valid FVG).
- No prior stop raid before the displacement.
execution:
  bias: Pre-existing daily bias.
  entry: The chosen PD array inside the discount/OTE.
  stop: Below the order block low / the swept low.
  targets:
  - Opposing liquidity (the highs/lows the raid was engineered from)
  - Partial, then break-even, then runners
measurable:
- fill rate vs realised R across the four entry refinements on the same setup
- outcome of setups missing the discount condition
