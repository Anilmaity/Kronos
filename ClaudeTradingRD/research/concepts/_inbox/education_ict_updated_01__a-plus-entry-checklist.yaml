  quote: without a lower time frame liquidity rate prior to a move I am not interested
ambiguities:
- '''A little bit of flexibility'' on the discount requirement is never bounded — the box-setup example
  is admitted with NO structure shift at all.'
- The choice among FVG / OB / OTE / breaker is explicitly 'what catches my eye the most' — not decidable.
- Partial-taking and break-even are shown but not specified as rules.
