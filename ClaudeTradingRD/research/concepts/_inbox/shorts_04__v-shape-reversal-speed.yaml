id: v-shape-reversal-speed
name: "A Real Reversal Is a Fast V-Shape"
category: structure
status: specified
definition: >
  Four Shorts converge on the same claim from both sides. Positively: the V-shape recovery IS
  what forms the change in the state of delivery, and the ideal case is one where the V-shape
  simultaneously creates the swing point and the protected swing; the closure over the level
  should be swift, taking only a couple of candles. Negatively: where the reversal is not a clean
  V-shape, the structure is a consolidation and he wants to avoid price there entirely - and he
  adds that a subsequent run higher out of such a structure is usually just the consolidation
  highs being taken before price goes lower.

timeframes:
  htf: ["1D", "4H"]
  ltf: ["1H", "15m", "5m"]
  fractal: true

detection_rules:
  - "After the point of interest is reached, require a swift recovery that closes back through the level."
  - "The V-shape recovery is what constitutes the change in the state of delivery."
  - "Ideal: the same recovery forms both the swing point and the protected swing."
  - "No clean V-shape -> classify as consolidation and stand aside."
  - "Treat a subsequent run out of that consolidation as a sweep of its highs, not as a continuation signal."

invalidation:
  - "The recovery drifts rather than snapping back, or fails to close through the level."

measurable:
  - "candles-to-closure for structures later classified V-shape vs consolidation"
  - "how often a run out of the rejected consolidation reverses lower"

sources:
  - video_id: OFfjyo4-s6U
    title: "Validating Swing Points Using Continuation Order Blocks"
    quote: "that V-shape reversal forms the change in the state of delivery"
  - video_id: ZEK8fDzxClA
    title: "What to Look for in an Ideal Continuation"
    quote: "A nice V-shape reversal that recovers and then closes over this."
  - video_id: _w0AXMw04Sk
    title: "What Does an Ideal Continuation Look Like?"
    quote: "that's a nice V-shape recovery"
  - video_id: MtczT00fhJI
    title: "Using IFVGs to Identify Low-Probability Setups"
    quote: "when we fail to have a nice V-shape reversal"

ambiguities:
  - "'V-shape' is never given a geometric test - no leg-symmetry, retracement or bar-count criterion."
  - "'Swift' is quantified only as 'a couple candles' in one of the four Shorts."

python_detector: null
related: ["continuation-timing", "ideal-formation", "cisd", "expansion-exhaustion-avoid-price", "consolidation-vs-retracement-test"]

