id: hedge-driven-bias-disclosure
name: The Live Intraday Bias Can Be Hedge-Driven, Not Model-Driven
aliases:
- I'm more inclined to trade short because it hedges my position
category: psychology
status: specified

definition: >
  A disclosure that matters to anyone mining these streams for signals: his stated intraday
  direction is sometimes a function of his existing book rather than of the model. He holds
  long swing exposure in stocks and ETFs taken at a marked yearly imbalance, buys six
  instruments every day on an automated DCA, and says plainly that he therefore favours the
  downside intraday to hedge that portfolio and is less inclined to trade long because he
  already has that exposure. On the day he trades in this unit he says outright that his
  Discord note was "mostly holding my long swing only on shorts to hedge".

timeframes:
  htf:
  - 1M
  - 1D
  ltf:
  - 15m
  - 5m
  fractal: false

preconditions:
- The speaker holds directional swing exposure outside the intraday trade.

detection_rules:
- When a live bias is stated, check whether he also states existing exposure in the opposite
  direction.
- Where he does, treat the intraday direction as partly hedge-motivated rather than purely
  model-derived.
- He states the motive explicitly when it applies rather than hiding it.

invalidation:
- n/a - a disclosure, not a setup.

measurable:
- share of live-stream directional calls accompanied by a stated hedge motive
- outcome of hedge-motivated calls versus purely model-framed calls

sources:
- video_id: U4j-fZD-FJk
  title: New York Open Live Q&A
  quote: I do favor looking to the downside in terms of hedging my portfolio
- video_id: U4j-fZD-FJk
  title: New York Open Live Q&A
  quote: I have long exposure, so I'm more favoring downside in terms of hedging myself
- video_id: c7nk7ypJHN4
  title: New York Open Live Q&A
  quote: I'm more inclined to trade short because it hedges my position
- video_id: c7nk7ypJHN4
  title: New York Open Live Q&A
  quote: already have long exposure, so I'm less inclined to really trade long

ambiguities:
- Never quantified - no rule for how much a hedge motive is allowed to shift a discretionary
  read, and no statement of hedge ratio.
- It is not presented as teaching, so it is unclear whether he would advise a student to let
  portfolio exposure tilt an intraday bias at all.
- The swing book is described only loosely (ETFs, some single stocks, gold and silver swings),
  so its actual direction on any given day cannot be reconstructed.

