id: positional-entry
name: Positional Entry At An Invalidation On The Open
category: entry
status: contested
voice: ttrades
definition: 'Asia framing of the positional entry: it is only taken with a higher-timeframe bias that explains why
  candle 3 should expand, after an ideal candle 2 closure with a change in the state of delivery, and when the protected
  swing sits near the open of the higher-timeframe candle. When the structure is not good enough, no positional
  entry - wait for a 4-hour closure instead.'
detection_rules:
- Require HTF bias + ideal C2 closure + CISD + protected swing near the HTF open.
- Reject positional entry on reversal setups or poor structure; fall back to a 4H closure + 15m model.
