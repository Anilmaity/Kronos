id: time-based-exit-htf-close
name: Time-Based Exit at the Higher-Timeframe Candle Close
category: time
status: contested
voice: ttrades
definition: >
  Restated for the London model: expansion candles have small wicks, so once on side you can hold
  toward the high/low or close of the higher-timeframe candle, for its whole duration and potentially
  the next candle as it reaches its draw. He names this explicitly as a time-based exit.
detection_rules:
- Hold to the close of the 4-hour expansion candle; extend to the next 4-hour candle if it also expands.
