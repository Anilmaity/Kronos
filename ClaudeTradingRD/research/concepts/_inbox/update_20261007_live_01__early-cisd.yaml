id: early-cisd
name: Early CISD
category: entry
status: specified
voice: ttrades
aliases:
- early C2
definition: Asked for his indicator settings he says they are essentially default except that he turns on early
  C2. Asked why a CISD sometimes paints after a long delay, he explains that without the early setting nothing prints
  until the higher-timeframe candle closes.
detection_rules:
- 'Early C2 off: CISD drawn only after the higher-timeframe candle closes.'
- 'Early C2 on: drawn while the HTF candle is still forming.'
sources:
- video_id: ES-R3ByDYrY
  title: TTrades MNQ Cup - Morning Session
  quote: All I do is I turn on the early C2
- video_id: ES-R3ByDYrY
  title: TTrades MNQ Cup - Morning Session
  quote: it's not going to print this until the close of the higher time frame
ambiguities:
- The library entry says he leaves early CISD off by default for learners; here he states he personally runs it
  on. Not a contradiction (default vs his own chart) but worth keeping apart.
related:
- ttfm-indicator-settings
