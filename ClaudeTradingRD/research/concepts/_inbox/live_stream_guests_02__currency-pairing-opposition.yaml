id: currency-pairing-opposition
name: Pair A Weak Currency Future Against A Strong One
aliases:
- individual currency futures
- low resistance liquidity run pairing
category: structure
status: specified
definition: 'Rauf''s method for choosing which FX pair or cross to trade: chart the INDIVIDUAL currency
  futures (6E for euro, 6B for sterling, and so on) rather than the pair, rank them for strength and
  weakness, and then match a weak one against a strong one. That combination is where a low-resistance
  liquidity run forms. He applies it live: sterling futures have been selling off and are in a deeper
  discount than the euro, so he will not touch the pound and will trade EURUSD instead; and when scanning
  crosses he rejects the ones whose component currencies are merely consolidating.'
timeframes:
  htf:
  - 1W
  - 1D
  ltf: []
  fractal: false
preconditions:
- Individual currency futures charts available (6E, 6B, 6A, 6C, 6N, etc.).
detection_rules:
- Chart the individual currency futures rather than the cross.
- 'Rank them: which are clearly strong, which are clearly weak, which are consolidating.'
- Trade the weak one against the strong one - that is where the low-resistance liquidity run forms.
- Do not trade a cross where neither leg is clearly strong or weak (both consolidating).
- Reject the weakest-of-all leg if it is already in deep discount and prefer the cleaner one.
invalidation:
- No currency future shows clear relative strength or weakness - no cross is taken.
measurable:
- realised trend persistence of strong-vs-weak crosses vs consolidating-leg crosses
- run distance to the next external level per pairing class
sources:
- video_id: qFtfD09Vv3E
