ambiguities:
- '''Clearly strong'' and ''clearly weak'' are eyeballed off the futures chart; no ranking measure is
  given.'
- The transcript renders the GBP futures symbol as '6v1' (i.e. 6B1!).
- This aligns with the channel's own currency-pairing doctrine but is stated independently by the guest.
