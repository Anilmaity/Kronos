id: structure-requires-htf-context
name: Never Read Lower-Timeframe Structure Without A Higher-Timeframe Bias First
aliases:
- you have to understand the higher time frames
- go with the higher time frame Trend
category: structure
status: specified
definition: 'Stated twice in this unit as the closing lesson of the market structure video and the
  opening lesson of the top-down video, in both cases with a worked loss. The named failure mode
  is a lower-timeframe structure shift taken on its own merits: price makes higher highs and higher
  lows, then displaces down to a lower low, traders short it, and price makes a new higher high and
  stops them out - because the aggressive move lower was only a retracement to a higher-timeframe
  PD array. The top-down video runs the same failure from the other side: a textbook bullish order
  block retest gets its stop run because the higher timeframe had just swept a high and closed below
  it with a bearish engulfing candle. The correction in both cases is the same - fix the higher-timeframe
  direction first, then look only for setups in that direction on the lower timeframe.'
timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- A higher-timeframe chart of the same instrument is read before the lower one.
detection_rules:
- Establish the higher-timeframe trend or bias before reading any lower-timeframe structure.
- A lower-timeframe structure shift AGAINST the higher-timeframe trend is read as a retracement into
  a higher-timeframe PD array, not as a reversal; mark that PD array and expect the shift to fail.
- Inside a higher-timeframe bearish expansion candle, only bearish lower-timeframe setups are permitted
  - the mirror-image bullish pattern at the same location is refused outright.
- 'Preferred alternative to catching the turn: frame a continuation with the higher-timeframe trend,
  which he says is a lot easier than catching every top or bottom.'
- 'Diagnostic he gives for repeated stop-outs at exactly the turn: the higher-timeframe analysis
  was not consulted.'
invalidation:
- No higher-timeframe read is available - do not read the lower-timeframe structure at all.
measurable:
- stop-out rate of lower-timeframe structure shifts taken with vs against the higher-timeframe trend
- share of counter-trend lower-timeframe shifts that terminate exactly at a higher-timeframe fair
  value gap
