id: ttfm-indicator-settings
name: TTFM Indicator - Settings, Defaults and Colour Semantics
category: model
status: specified
definition: 'Additions from this stream. (1) XC2 label: an ''X'' before C2 marks a candle 2 closure whose
  model FAILED; he deliberately shows failures because the indicator does not repaint. (2) No dot is drawn
  at the H1 CISD of a C2 because the C2 label itself is what he wants shown. (3) Learning use: turn all
  fractals off, save that as a ''quiz'' template, mark the model up by hand (closure, CISD, T-spot, candle
  1 high), then switch back to the normal template to check. (4) If a 4-hour C2 does not print, the fractal
  setting is probably not on automatic. Dots on the chart are protected swings, not generic swing points.'
detection_rules:
- XC2 = a printed candle 2 closure whose model subsequently failed.
- Indicator dots mark protected swings.
measurable:
- share of C2 prints later relabelled XC2 (indicator-defined failure rate)
sources:
