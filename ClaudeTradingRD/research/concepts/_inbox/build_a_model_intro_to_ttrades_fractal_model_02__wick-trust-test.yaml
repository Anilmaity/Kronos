id: wick-trust-test
name: Let the Wick Form, Trade the Body
category: structure
status: specified
aliases:
- let the wick form
- don't catch the wick
definition: 'The instruction he asks the viewer to repeat internally, and the operational core of the
  model: do not try to catch the extreme of the higher-timeframe candle; let its wick form, confirm
  the wick with a lower-timeframe protected swing / change in the state of delivery, and then trade
  the body. His stated reason is failure-mode-driven -- trying to catch the wick means being continuously
  stopped out. The same procedure is applied recursively: the daily wick is confirmed by the 4-hour,
  the 4-hour wick by the 15-minute, and so on.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 30m
  - 15m
  - 5m
  - 3m
  - 1m
  fractal: true
preconditions:
- A directional bias for the higher-timeframe candle.
detection_rules:
- Let the higher-timeframe candle open and put in its counter-directional wick.
- On the paired lower timeframe, require a change in the state of delivery / protected swing inside
  that wick.
- Only then take the entry, and target the body of the higher-timeframe candle.
- 'Prefer waiting for a reaction over placing a limit into the level: ''I would rather just wait for
  it to react or not react and save myself a loss than to place a limit.'''
invalidation:
- The confirmed wick's extreme is taken out.
measurable:
- stop-out rate of wick-catching entries vs body entries
- time from higher-timeframe candle open to wick confirmation
sources:
- video_id: FAKWJ-1NlLE
  title: Trading The 4 Hour Power Of Three - OHLC / OLHC
  quote: I need to let the wick form and then look to trade the body
- video_id: FgP2lc9nneM
  title: The Best Timeframe for TTrades Fractal Model (Simple)
- video_id: eywpZT3z6GQ
  title: TTrades Scalping Model - Simple Day Trading Strategy
ambiguities:
- 'No deadline is given: how late into the higher-timeframe candle the wick may still form before the
  candle is abandoned is not stated (only that expansion candles ''have so much range and so much time'').'
