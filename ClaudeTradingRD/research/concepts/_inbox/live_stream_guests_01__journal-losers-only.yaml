id: journal-losers-only
name: "Journal Losers And Emotional Trades Only"
aliases: ["log all the losers", "winners are less important"]
category: psychology
status: specified
voice: guest
guest_sources:
- "Trader T"

definition: >
  Trader T's asymmetric journaling policy, stated twice while backtesting live. He logs every
  losing trade obsessively - with screenshots of the 4-hour, 1-hour, 5-minute and 1-minute charts,
  the pair, the reason for entry, the kill zone, the R and the time - and treats winners as
  optional, because the winners do not tell him anything he can act on. His stated payoff is
  pattern avoidance rather than confidence: he shows a live case where a previously logged loss (a
  setup taken after the lows had already been swept) is what keeps him out of an identical setup
  later in the same session.

timeframes:
  htf: []
  ltf: []
  fractal: false

preconditions:
- "A completed trade."

detection_rules:
- "Log every loss. Logging a win is optional."
- "For a loss, capture the 4-hour, 1-hour, 5-minute and 1-minute charts, the pair, the entry reason, the kill zone the trade fell in, the R and the time of day."
- "Read the log back before taking a similar setup - the explicit purpose is to recognise and skip repeats of setups that previously failed."
- "The journal template should be personal: different traders run different criteria, so the fields should match your own strategy."

invalidation:
- "Not applicable."

measurable:
- "recurrence rate of the same logged failure pattern before and after it is logged"
- "expectancy of setups that match a previously logged loss"

sources:
- video_id: wCtxmWe4KNc
  title: "Back Testing Live Session With Trader T"
  quote: "my winners are not as important to log for me"
- video_id: wCtxmWe4KNc
  title: "Back Testing Live Session With Trader T"
  quote: "I think attacking the losses are way more important than the wins"

ambiguities:
- "Logging only losses means the base rate for the same pattern in winning trades is never recorded, so the avoidance decision is made on one half of the sample - he does not address this."
- "The auto-captioner renders his word as 'attacking the losses'; from context the intended word is 'tracking'."
- "The other guest in this unit who discusses journaling (Ben) logs everything with before-and-after screenshots, which is the opposite policy - two traders, not channel self-inconsistency."
- "No review cadence is given."

python_detector: null
related: ["post-trade-journaling-protocol", "backtesting-protocol", "loss-is-not-a-bad-trade"]
contributing_units:
- live_stream_guests_01
draft_count: 1
