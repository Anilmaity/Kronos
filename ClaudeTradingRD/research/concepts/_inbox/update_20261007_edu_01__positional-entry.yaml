id: positional-entry
name: Positional Entry At An Invalidation On The Open
category: entry
status: specified
voice: ttrades
definition: >
  NASDAQ hourly example (9-5 model video): after a candle 2 closure with a V-shape, no
  intra-candle continuation formed, so waiting would have missed the move. The positional
  alternative: expect the EQ to hold and 50% of the change-in-state-of-delivery to hold, put
  the stop below both, usually around the body of the opposing candle, which gave about 2R to
  the highs. He accepts that waiting for confirmation sometimes misses trades.
detection_rules:
  - "Use when confident in the move and the IC-CISD has not formed."
  - "Stop below both the candle EQ and 50% of the CISD, usually around the body of the opposing candle."
  - "Proceed only if that gives about 2R to the target."
