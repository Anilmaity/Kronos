  quote: this is an ideal candle to closure
ambiguities:
- WHICH open is meant (the 18:00 open, midnight, or 09:30) is not stated in this Short.
- The EQ is not specified as the EQ of the previous day, of the current day, or of a range.
- '''Respect'' is not resolved into wick-versus-close.'
