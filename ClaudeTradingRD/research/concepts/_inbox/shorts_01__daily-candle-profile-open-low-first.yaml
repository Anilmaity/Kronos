id: daily-candle-profile-open-low-first
name: Daily Candle Profile - Open Low First
category: model
status: specified
definition: 'SHORTS EVIDENCE giving the whole daily preparation as a three-mark chart and a four-beat
  expectation. After an ideal candle 2 closure that leaves a protected low, the marks required for the
  next day are exactly three: the EQ, the previous day high and the previous day low. If bullish and
  expecting a continuation, the expectation is: price OPENS, trades LOWER FIRST, RESPECTS THE EQ, and
  then trades HIGHER THROUGH the previous day high. The bearish case is the mirror.'
preconditions:
- A daily bias exists (here from a trend of protected swings and an ideal C2 closure).
detection_rules:
- 'Mark exactly three levels for the day: the EQ, the previous day high, the previous day low.'
- 'Bullish continuation expectation: open -> trade lower first -> respect the EQ -> expand through the
  previous day high.'
- The 'protected low' from the previous closure is what makes the bias a continuation rather than a
  reversal.
- 'Bearish mirror: open -> trade higher first -> respect the EQ -> expand through the previous day low.'
invalidation:
- Price fails to respect the EQ on the first move against the bias.
measurable:
- share of continuation days whose first move is against the bias and holds the EQ
- hit rate of the previous day high/low target on such days
sources:
