id: ideal-formation
name: Ideal Formation (closure and protected swing in the same bar)
category: model
status: contested
voice: ttrades
definition: >
  Two more Shorts restate the ideal candle 2 closure: price at a point of interest sweeps a
  (small) high, and the candle 2 closure also closes through the series of up-close candles
  (bearish case) - "in this case, it's just one" - so it forms a protected swing and a candle
  2 closure together. The levels then marked for the next candle are the opening price and the
  EQ; price should form its next high in that area as a shallow high and then trade lower. The
  second Short applies the same label to a daily Thursday C2 inside a consolidation reversal week.
timeframes:
  htf: ["1D"]
  ltf: ["1H"]
  fractal: true
preconditions:
- Price is at a point of interest.
- A small high (bearish case) is swept.
detection_rules:
- Candle 2 closure that closes through the series of up-close candles (bearish) - a single up-close candle is enough.
- Mark the opening price and the EQ; the next candle's high should form in that area and be shallow.
invalidation:
- The next candle's high does not hold in the opening-price / EQ area.
execution:
  bias: Direction of the closure.
  entry: Retest of the opening-price / EQ area by the next candle's shallow high.
measurable:
- next-candle retest-and-reject rate at the opening price / EQ after an ideal C2
