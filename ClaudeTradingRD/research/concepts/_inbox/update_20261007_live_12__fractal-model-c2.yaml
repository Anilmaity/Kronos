definition: 'Q&A restatement of the numbering and the interest filter: C2 is always the swing high/low,
  C1 is arbitrary (just prior), C3 and C4 follow. Every C2 is a swing point, but only a C2 closure or
  C3 closure at a point of interest matters; worked contrast between a C2 high not closing at a POI (ignored)
  and one that sweeps a high into a gap and closes back below (valid).'
