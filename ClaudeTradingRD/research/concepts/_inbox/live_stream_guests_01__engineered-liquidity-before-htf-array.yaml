id: engineered-liquidity-before-htf-array
name: "Price Stops Shy Of The Intended Level And Engineers Liquidity First"
aliases: ["stop shy before the main intended level", "engineer more liquidity"]
category: liquidity
status: underspecified
voice: guest
guest_sources:
- "Finessee_Fx"

definition: >
  Finessee_Fx's account of what happens between marking a higher-timeframe array and price
  reaching it, offered as the reason he sat through a month of chop on EURUSD without shorting.
  Before price can move to the main intended level it will stop shy of it, consolidate sideways and
  engineer more liquidity, and only then spike into the level and reverse. He states the frequency
  as nine times out of ten and says it holds on any timeframe. He explicitly does NOT want the next
  candle to rally straight into a marked weekly order block and turn - a straight run to the level
  is the less likely and less desirable case.

timeframes:
  htf: ["1M", "1W", "1D"]
  ltf: ["4H", "1H"]
  fractal: true

preconditions:
- "A higher-timeframe array (order block, breaker, imbalance) has been marked as the intended destination."

detection_rules:
- "Expect price to halt short of the marked array rather than reach it on the first approach."
- "Expect a sideways phase that builds relatively equal highs / lows (engineered liquidity) beneath or above the array."
- "Only after that phase does the spike into the array occur - and that spike is the tradeable event."
- "Do not take the trade in the direction of the eventual move while price is still inside the consolidation - he took losses doing exactly this."

invalidation:
- "Not stated. He gives the 9-out-of-10 frequency but no condition under which the straight-to-the-level case should be assumed instead."

execution:
  bias: "The direction of the higher-timeframe array being approached."
  entry: "Only after the array is tagged, not during the consolidation."
  stop: "Beyond the array."
  targets: ["the opposing array"]

measurable:
- "how often price consolidates rather than running straight into a marked higher-timeframe array (the empirical form of the 9-out-of-10 claim)"
- "distance by which price 'stops shy' of the level before the consolidation, as a fraction of the approach leg"

sources:
- video_id: eK_6wgNpNh0
  title: "Advanced ICT Directional Bias Teachings with Finessee_Fx"
  quote: "it's always going to stop shy before the main intended level is hit"
- video_id: eK_6wgNpNh0
  title: "Advanced ICT Directional Bias Teachings with Finessee_Fx"
  quote: "they wanted to engineer more liquidity into the market"

ambiguities:
- "'Stop shy' has no distance attached - it could be one point or one percent."
- "The nine-out-of-ten figure is asserted with no sample, instrument or period."
- "How long the consolidation should last before the spike is not stated; in his example it was the whole of July."
- "No test distinguishes 'engineering liquidity below the level' from a genuine failure to reach it."

python_detector: null
related: ["smart-money-reversal", "relatively-equal-highs-lows", "wick-to-body-order-block-zone", "liquidity-grab"]
contributing_units:
- live_stream_guests_01
draft_count: 1
