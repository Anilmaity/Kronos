id: stop-loss-placement
name: Stop Loss Placement (Swing vs Body)
category: risk
status: contested
voice: ttrades
definition: In a 4H/15m short where a stop on the 4H high made the risk-to-reward unworkable, he put the stop on
  the lower-timeframe high instead, justified because the stop still sat beyond 50% of the higher-timeframe leg
  he wanted respected.
detection_rules:
- If the HTF-swing stop gives poor R:R, a LTF protected high is acceptable provided it lies beyond the 50% of the
  HTF range expected to hold.
