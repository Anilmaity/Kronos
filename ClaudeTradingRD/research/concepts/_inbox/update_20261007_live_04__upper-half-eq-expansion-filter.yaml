id: upper-half-eq-expansion-filter
name: Upper-Half EQ Rule For Expansion
category: structure
status: contested
voice: ttrades
definition: 'LTF refinement of the upper-half rule taught live. When he does not trust a reversal but
  still wants it, the area that must hold is the upper 50% of the higher-timeframe point of interest,
  and holding is evidenced only by a 1-minute swing (a 1m continuation) forming inside that half; otherwise
  the idea fails. Candle-level preference: after a bearish expansion candle that closes near its low,
  the next candle should first take out the previous candle''s low and then react bullishly (stated as
  a preference, not a requirement); a candle that prints its upper wick first is read as more bearish.'
detection_rules:
- Mark 50% of the HTF point-of-interest range.
- On 1m/3m, require a swing (continuation) to form inside the upper half (bullish case).
- Prefer the candle after a bearish expansion candle to sweep that candle's low before the bullish reaction.
- Treat an upper-wick-first candle as bearish evidence against the hold.
ambiguities:
- '''Technically doesn''t have to take the low'' - the prior-candle-low sweep is a preference; no rule
  for weighting it.'
- Which HTF timeframe the POI belongs to (5m vs 15m) is left implicit in the live example.
