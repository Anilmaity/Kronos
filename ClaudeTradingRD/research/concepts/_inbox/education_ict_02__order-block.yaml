id: order-block
name: Order Block
category: structure
status: contested
definition: 'EARLIEST RECORDING''S CONTRIBUTION IS THE ZONE BOUNDS, which the later canon leaves to
  the trader. Marking up a daily chart he states that on the daily he includes THE WICK TO THE OPEN
  of the block, and gives the reason: that is the most sensitive part. On the 4-hour, in the same
  video, he marks THE BODY TO THE WICK of the series of up-close candles. So two different bounds
  are used at two different timeframes within one markup, both wider than a single opening-price line.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
detection_rules:
- 'Daily block: bound the zone from the WICK to the OPEN of the block candle - the stated ''most sensitive
  part''.'
- '4-Hour block: bound the zone from the BODY to the WICK of the series of up-close candles.'
- The block is a series of same-direction closes, not necessarily a single candle.
- Entry inside the zone is combined with a lower-timeframe setup rather than taken blind.
measurable:
- reaction rate at the wick-to-open zone vs the opening price alone, by timeframe
sources:
- video_id: wDXTIDbIMwU
  title: Top Down Analysis - ICT Concepts
  quote: I do include the wick to the open on these
- video_id: wDXTIDbIMwU
  title: Top Down Analysis - ICT Concepts
  quote: the body to the wick of the series of up close candles
- video_id: LZZAaILYNyI
  title: Stop Losses, Placement & Trailing - ICT Concepts
  quote: i can use the high of the candle that made the fair value gap
ambiguities:
- The two bounds are used in the same video at different timeframes and the difference is never explained
  - it may be a timeframe rule or may be incidental.
- '''Wick to the open'' is ambiguous about WHICH wick when the block is a series of candles.'
- Neither the sweep precondition nor the break-of-structure precondition from the later canon is mentioned
  in this markup; blocks are simply pointed at on the chart.
