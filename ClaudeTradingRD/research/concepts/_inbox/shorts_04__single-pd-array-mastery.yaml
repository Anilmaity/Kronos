id: single-pd-array-mastery
name: "Pick One PD Array, Plus Highs And Lows"
category: psychology
status: specified
definition: >
  A Short built as a deliberate demonstration of over-marking. He walks a 3-minute chart and
  points out, in sequence, the turtle soup, the inversion, the change in the state of delivery, a
  breaker block and several fair value gaps - all genuinely present - and then asks whether
  marking them helps or merely clutters the chart. His answer is that he does not need any of it:
  the sweep of the previous high plus the closure through the series of candles that made it is
  enough to anticipate a continuation, and from there he only watches the opposing candles.

timeframes:
  htf: ["1D", "1H"]
  ltf: ["15m", "5m", "3m"]
  fractal: true

detection_rules:
  - "Mark the sweep of the previous relevant high or low."
  - "Mark the closure through the series of candles that made that extreme."
  - "That pair alone licenses anticipating a continuation."
  - "Track opposing candles for the entries; do not add further PD arrays to the chart."

invalidation:
  - "Not applicable - this is a tooling policy, not a setup."

measurable:
  - "number of distinct markups per chart versus realised expectancy"
  - "decision latency with a minimal versus a fully marked chart"

sources:
  - video_id: __E1fj1n4xg
    title: "You Know Too Much. Master One or Two Concepts."
    quote: "I just need to see the sweep of this previous high and then the closure"
  - video_id: __E1fj1n4xg
    title: "You Know Too Much. Master One or Two Concepts."
    quote: "is it just going to cluster my chart and make things more confusing?"
  - video_id: __E1fj1n4xg
    title: "You Know Too Much. Master One or Two Concepts."
    quote: "Instead of marking out five different things, I'm just focusing on mastering one."

ambiguities:
  - "The Short does not say which single PD array a beginner should pick, only that one is enough."
  - "It is stated as a personal preference ('for me, I don't need all of that'), not as a rule for others."

python_detector: null
