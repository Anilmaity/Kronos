id: journal-losers-only
name: "Journal Losers And Emotional Trades Only (mature-stage policy)"
aliases: ["I don't journal my winners", "journaling the losers"]
category: psychology
status: specified

definition: >
  A stage-dependent journaling policy. Early in a trading journey the guest journaled
  everything, and says the sole purpose was to find consistency across repetitions and
  to establish that an edge existed at all; he states that not journaling early is
  self-sabotage. Once the repetitions are done and the model's winners behave as
  expected, he stops journaling winners on the grounds that they carry no information
  to act on, and journals only two categories: losing trades, reviewed for what could
  have been done differently to reach break-even or avoid the trade, and trades taken
  for emotional reasons - revenge trades, or entries taken on gut feeling with no
  valid reason. The most common loser-review finding he names is having entered on too
  low a timeframe when moving up a timeframe would have shown he was buying or selling
  into the wrong end of an expansive move.

timeframes:
  htf: []
  ltf: []
  fractal: false

preconditions:
  - "For the mature policy: enough repetitions with one model that winners are recognisably routine."

detection_rules:
  - "Early stage: journal every trade."
  - "Mature stage: journal a trade if it lost, or if it was entered emotionally (revenge, gut feeling, no valid reason)."
  - "For each logged loser, ask what could have been done differently to produce a break-even or a no-trade."
  - "Check specifically whether the entry timeframe was too low relative to the higher-timeframe context."

invalidation:
  - "Not applicable - this is a process rule."

execution:
  bias: "n/a"
  entry: "n/a"
  stop: "n/a"
  targets: []

measurable:
  - "frequency of each loss cause across a journal sample"
  - "share of losses attributable to entering on too low a timeframe"
  - "count of emotionally-flagged trades per month as a tilt proxy"

sources:
  - video_id: 1wKfc2gN4xg
    title: "Trader Kane | The Mind Behind a Multi-Million Dollar Day Trader"

ambiguities:
  - "The boundary between the two stages is described qualitatively, as having done the repetitions, with no trade count or duration."
  - "Skipping winners forfeits the ability to measure whether winners are being managed optimally; the guest does not address this trade-off."
  - "This conflicts in emphasis with material elsewhere in the corpus that treats journaling as a continuous full-sample discipline; only this video is cited here."

python_detector: null
related: ["tilt-stop-rule", "probabilistic-acceptance", "less-trades-more-capital"]
