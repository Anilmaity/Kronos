id: consolidation-open-whipsaw
name: 'No-Bias Range Day: Expect the Open To Sweep One Side, Then Rotate'
category: model
status: specified
voice: ttrades
definition: 'Adds the close-based acceptance test he states while coaching a live short: if price breaks
  out of the range you do not want to see it close back inside the range - you want a retest or a continuation.
  A close back inside is read as accumulation-manipulation and a move to the other side (AMD in the opposite
  direction).'
timeframes:
  htf:
  - 5m
  ltf:
  - 15s
  fractal: true
preconditions:
- A marked range high and low.
detection_rules:
- After a breach of a range boundary, a candle close back inside the range = deviation; expect rotation
  toward the opposite side.
- After a breach, a retest that holds or an immediate continuation (no close back inside) = breakout.
invalidation:
- n/a
measurable:
- follow-through to the opposite boundary after a close back inside vs after a hold outside
sources:
- video_id: h1ZQWWQDhKA
  title: TTrades MNQ Cup - Afternoon Session
  quote: you don't want to see us close back in the range
- video_id: h1ZQWWQDhKA
  title: TTrades MNQ Cup - Afternoon Session
  quote: You want to see us retest or get a continuation
ambiguities:
- Timeframe of the deciding close is not named; it was spoken over a 5-minute / 15-second chart during
  the afternoon game trades.
- Said in the PM session, outside his own trading window; it is coaching commentary, not his own trade.
related:
