id: wick-to-body-order-block-zone
name: "Wick-To-Body Demarcation Of Order Blocks And Breakers"
aliases: ["wick down to the body", "the most sensitive level"]
category: entry
status: specified
voice: guest
guest_sources:
- "Finessee_Fx"

definition: >
  Finessee_Fx's signature mechanic, repeated on every example in the video and defended twice when
  challenged from chat. He does not use the whole candle and he does not use its 50 percent: he
  draws the zone from the candle's WICK EXTREME to the near edge of its BODY (open or close) and
  extends that box forward in time. He applies the identical construction to order blocks and to
  breakers, on monthly, weekly, daily and 4-hour charts. His stated reason is empirical rather than
  theoretical - over years of trading he found this band to be the most sensitive part of the
  candle, and it gets him filled more often than waiting for a deeper entry.

timeframes:
  htf: ["1M", "1W", "1D", "4H"]
  ltf: ["1H", "15m"]
  fractal: true

preconditions:
- "A qualifying order block or breaker candle has been identified."

detection_rules:
- "Take the candle's wick extreme on the side price will approach from, and its body edge (the open or the close) on the other side; that band is the zone."
- "Extend the zone forward in time indefinitely and treat it as support / resistance on every lower timeframe."
- "Use the identical construction for breakers, not just order blocks."
- "Where two consecutive same-direction candles form the block, merge both candles into one zone."
- "Limit placement: put the limit slightly BEFORE the zone is reached (inside the wick, ahead of the open/close), accepting a worse price in exchange for certainty of fill."
- "Deeper refinement is allowed only conditionally: if you dissect the block on a lower timeframe and find a nested fair value gap or PD array towards its equilibrium, then use that instead - otherwise wick-to-body."

invalidation:
- "The order block is violated - i.e. price trades decisively through the zone - at which point the order flow is no longer bullish (bearish) and the bias must be changed."

execution:
  bias: "The direction of the order flow the block belongs to."
  entry: "A limit inside the wick-to-body band, placed slightly ahead of it."
  stop: "Always below (above) the order block itself."
  targets: ["the opposing array - old highs / old lows"]

measurable:
- "fill rate and maximum adverse excursion of a wick-to-body limit versus a 50-percent (mean threshold) limit on the same blocks"
- "reaction rate of the wick-to-body band versus the full candle range"
- "how often the 'slightly early' limit is the difference between a fill and a miss"

sources:
- video_id: eK_6wgNpNh0
  title: "Advanced ICT Directional Bias Teachings with Finessee_Fx"
  quote: "I go from the wick to the body and extend that out in time"
- video_id: eK_6wgNpNh0
  title: "Advanced ICT Directional Bias Teachings with Finessee_Fx"
  quote: "that's going to be a more sensitive level"
- video_id: eK_6wgNpNh0
  title: "Advanced ICT Directional Bias Teachings with Finessee_Fx"
  quote: "I would put my limit a little bit before the order block actually gets hit"
- video_id: eK_6wgNpNh0
  title: "Advanced ICT Directional Bias Teachings with Finessee_Fx"
  quote: "stop losses would always be below the order block"

ambiguities:
- "How far 'a little bit before' the zone the limit goes is never quantified."
- "'Violated' as the invalidation is not defined as a wick or a body event."
- "The claim that this band is the most sensitive is stated from personal experience over years, with no sample or test."
- "This is in direct tension with the mean-threshold (50 percent of the order block) practice he describes other traders using and explicitly declines to follow."

python_detector: null
