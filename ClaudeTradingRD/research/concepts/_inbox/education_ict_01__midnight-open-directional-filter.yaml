id: midnight-open-directional-filter
name: Midnight Open As A Directional Filter
aliases:
- midnight opening price
- classic buy day
category: time
status: underspecified
definition: 'EARLIER RECORDING. The midnight opening price is marked during preparation and used as a
  directional precondition: on a day he expects to be bullish he wants to see price trade BELOW the midnight
  open before looking to get long - he calls that the classic buy day. In the same unit it is also used
  passively as a reference the market respects (in the Twitter-model examples, price retests midnight
  and no bodies close below it before expanding), and as a timing marker for where the hourly point of
  interest should form.'
timeframes:
  htf:
  - 1D
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: false
preconditions:
- A directional expectation for the day already exists.
- The midnight opening price is drawn on the chart.
detection_rules:
- Mark the midnight opening price.
- 'Bullish day: require a move BELOW the midnight open before taking a long (''classic buy day''). Bearish
  mirrors.'
- Watch whether bodies close through the level - bodies respecting it while wicks pierce it is treated
  as confirmation.
- The hourly point of interest is expected to form around the midnight open or just before New York.
invalidation:
- Price never trades back through the midnight open.
measurable:
- share of bullish days on which price trades below the midnight open before the low of day
- hit rate of longs taken with vs without the below-midnight-open condition satisfied
