id: news-events-ignored
name: Scheduled News Is Not A Filter
aliases:
- nothing changes for me
- orange folder
category: time
status: contested

definition: >
  His stated handling of scheduled economic releases. Asked to make a video on how to approach
  CPI, NFP and FOMC days, he answers that nothing changes for him. On a day with a release at
  10:00 he says he does not care for it, and adds that news lately has barely been moving the
  market, naming NFP specifically. Asked whether to be cautious with NFP the following day, he
  redirects to the profile of the day rather than the calendar. Against this, in the same unit
  he twice attributes his own inaction to a release - saying he was waiting for NFP and had
  not looked at gold, and calling an otherwise clean day "mainly just NFP" - so the corpus
  contains both a stated no-op and observed deferral.

timeframes:
  htf:
  - 1D
  ltf: []
  fractal: false

preconditions:
- A scheduled high-impact release exists on the day or the next day.

detection_rules:
- 'Reading A (stated policy): do not change bias, timeframe or entry because of a scheduled
  release; judge the day by its profile.'
- 'Reading B (observed behaviour): a pending release is given as the reason for not having a
  read and for waiting.'
- Neither reading is turned into a rule about position sizing or holding through a release in
  this unit.

invalidation:
- n/a

measurable:
- realised range and model hit rate on release days versus non-release days
- how often his own live streams produce no trade on a release day

sources:
- video_id: X4XSsv5CNqg
  title: New York Open Live Q&A
  quote: Nothing changes for me
- video_id: U4j-fZD-FJk
  title: New York Open Live Q&A
  quote: news lately based off how the market's trading just doesn't care
- video_id: U4j-fZD-FJk
  title: New York Open Live Q&A
  quote: even NFPs barely been reacting
- video_id: X4XSsv5CNqg
  title: New York Open Live Q&A
  quote: I was waiting for NFP

ambiguities:
- The X4XSsv5CNqg exchange is garbled by the auto-captioner - the text runs the viewer's
  question and his answer together as "Don't trade the day that current day prior to the
  news", which could be read as an avoidance rule. Only "Nothing changes for me" is
  unambiguously his.
- '"News lately ... doesn''t care" is an observation about a regime, not a rule, and he gives
  no test for when that regime ends.'
- Nothing is said about holding an open position through a release.
- This conflicts with the guest-voiced pre-event avoidance material elsewhere in the corpus.

