id: relative-strength-asset-selection
name: "Ranking Correlated Assets And Trading The Middle One"
category: structure
status: specified

definition: >
  A Short supplies a sharper ranking test than the library's existing "bullish closure =
  stronger". Strength is graded by HOW FAR EACH ASSET'S CLOSE HAS PROGRESSED AGAINST ITS OWN
  OPPOSING-CANDLE SERIES - the same level a change in the state of delivery uses. The weaker
  asset's closure still sits below the down-close candles (and below the low); the stronger
  asset has bought all the way back up and closed OVER its down-close candles. The stated
  consequence: the asset that has closed over its series is forming a continuation, the one
  that has not yet even reached for the opening price of its down-close candle is not, and he
  would rather trade the stronger one - which is the one that then delivers the expansion.

timeframes:
  htf: ["1D", "4H", "1H"]
  ltf: ["15m", "5m"]
  fractal: true

preconditions:
  - "Two or more correlated assets, compared on the same closed candle."
  - "Each asset has an identifiable series of opposing (down-close, in the bullish case)
    candles that made its low."

detection_rules:
  - "For each asset, locate the series of down-close candles that made the low (bullish case)."
  - "Grade the same candle's close on each asset against that series."
  - "WEAKER: the close is still below those down-close candles, or below the low."
  - "STRONGER: the close has bought all the way back up and closed OVER those down-close
    candles."
  - "Intermediate/weakest reading: the asset has not yet even reached for the OPENING PRICE of
    its down-close candle."
  - "The asset that closed over its series is forming a continuation; the one that has not is
    not."
  - "Trade the stronger asset."

invalidation:
  - "Not stated in this Short; the ranking is re-graded on each new closed candle."

execution:
  bias: "The direction the stronger asset has confirmed."
  entry: "On the stronger asset, per the ordinary continuation entry."
  stop: "Not stated in this Short."
  targets: "Not stated in this Short."

measurable:
  - "expansion delivered by the asset that closed over its opposing series vs the one that did
    not, measured over the next N candles"
  - "how often the grading by opposing-series progress disagrees with the simple
    bullish-close/bearish-close grading, and which is more predictive"

sources:
