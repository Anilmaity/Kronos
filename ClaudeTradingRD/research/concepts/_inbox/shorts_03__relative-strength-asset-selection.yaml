  - video_id: yTatKcNuKQU
    title: "Use Relative Strength to Trade the Stronger Asset"
    quote: "this one is forming a continuation, while this one is not yet reaching"
  - video_id: yTatKcNuKQU
    title: "Use Relative Strength to Trade the Stronger Asset"
    quote: "we'd rather focus on trading the stronger asset"

ambiguities:
  - "This Short works only the BULLISH case (trade the stronger). The library's fuller rule is
    directional - trade the strongest when targeting a high, the weakest when targeting a low.
    This clip states no such condition and does not mention a target. Do not read the
    directional qualifier into it."
  - "The assets being compared are never named in the clip, so the correlated set is unknown."
  - "The timeframe of the compared candles is not stated."
  - "No tie-break is given when both assets have closed over their series, or neither has."
  - "'Reaching for the opening price of this down close candle' introduces a third, finer grade
    between 'closed over' and 'closed below', but no ranking is stated for it."

