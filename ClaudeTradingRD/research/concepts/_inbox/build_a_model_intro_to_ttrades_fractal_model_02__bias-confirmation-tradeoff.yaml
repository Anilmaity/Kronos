id: bias-confirmation-tradeoff
name: Bias / Confirmation Trade-off
category: psychology
status: specified
aliases:
- strong bias, aggressive entry
definition: 'An explicit, stated inverse relationship between how strong the higher-timeframe bias is
  and how much lower-timeframe confirmation he demands. With a strong higher-timeframe bias (a clean
  higher-timeframe continuation) he will take a LOWER-timeframe REVERSAL entry. With a weak bias (e.g.
  the higher-timeframe candle 2 already expanded, or he is trading a higher-timeframe candle 2 rather
  than a candle 3) he DEMANDS a lower-timeframe continuation, and may demand SMT plus a V-shape on top.
  He also gives the practical reason the trade-off is not free: waiting for the continuation sometimes
  leaves no room for a stop and no target left, so the setup is simply missed.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  - 3m
  - 1m
  fractal: true
preconditions:
- A higher-timeframe model exists and its quality has been assessed.
detection_rules:
- Strong HTF bias (HTF continuation day, clean reversal candle, drawn liquidity open) -> a lower-timeframe
  reversal entry is permitted.
- Weak HTF bias (HTF candle 2 already expanded, consolidation, or trading the HTF candle 2 itself) ->
  require a lower-timeframe continuation, and optionally SMT and a V-shaped reversal.
- If the continuation entry leaves no room for a stop or the target sits at the entry, take the reversal
  or skip.
- 'Preferred default when in doubt: trade a higher-timeframe continuation with a lower-timeframe continuation.'
invalidation:
- The higher-timeframe read that justified the aggression is itself invalidated.
measurable:
- hit rate of LTF-reversal entries under strong vs weak HTF bias
- count of setups skipped because the continuation offered no stop or no target
sources:
- video_id: qdQYhePcvGE
  title: TTrades Fractal Model - Trading Candle 3
  quote: if you have a strong bias, you can trade those lower time frame reversals
- video_id: 9BY-MQRNy-Y
  title: TTrades Swing Trading Model - Simple Strategy
ambiguities:
- '''Strong bias'' is never scored; the classification is entirely discretionary and he says so.'
- The extra confirmations demanded on a weak bias (SMT, V-shape) are listed as options, not as a required
  set.
