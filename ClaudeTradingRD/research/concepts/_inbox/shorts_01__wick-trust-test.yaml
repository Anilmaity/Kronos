id: wick-trust-test
name: Let the Wick Form, Trade the Body
category: structure
status: specified
definition: SHORTS EVIDENCE, stated as an ordering rule. Once a daily bias exists, the open-high-low-close
  of the daily candle is the most important thing, because a bullish day must open, form its LOW first,
  and only then expand to its high and close. The practical instruction is therefore to wait for the
  candle to build its opposing wick - confirmed by a change in the state of delivery at the extreme
  - and to trade only the body that follows.
preconditions:
- A daily bias has already been established.
detection_rules:
- Bullish bias -> wait for the daily candle to form its LOWER wick before entering.
- Bearish bias -> wait for the daily candle to form its UPPER wick before entering.
- Confirm the wick extreme with a change in the state of delivery on the lower timeframe.
- Only then trade the body of the candle towards its target.
measurable:
- time-of-day distribution of the daily wick extreme, split by bias direction
- R outcome of entries before versus after the wick extreme is confirmed
sources:
- video_id: V8V-GdjsN84
  title: 'Daily OHLC: Let the Wick Form, Then Trade the Body'
  quote: the open high, low, close of the daily candle is the most important thing
- video_id: wvP9Y74Q_hQ
  title: Expansion Happens When the HTF Candle’s Upper Half Supports Price Higher
  quote: mark out half of that and then look for a PDA in that area
ambiguities:
- No cut-off time is given after which an unformed wick means the day is skipped.
- The Short does not state which lower timeframe the confirming CISD is read on.
related:
