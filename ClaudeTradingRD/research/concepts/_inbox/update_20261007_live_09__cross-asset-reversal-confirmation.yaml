id: cross-asset-reversal-confirmation
name: The Strongest Asset Must Reverse for the Weakest to Expand
category: structure
status: contested
definition: 'Stated as the stream''s first ''lesson of the day'' in both directions: if bullish, use the
  weakest asset reversing to frame longs on the strongest; if bearish, use the strongest asset reversing
  to frame shorts on the weakest. Live, with NQ strongest and YM weakest, the NQ long to the overnight
  highs needed YM to reverse after running its lows; YM kept going lower, the two assets did not align,
  price consolidated and the idea was abandoned. He adds a preference about HOW the weakest should reverse:
  ideally with another sweep of its low (catching late shorts and early longs and printing a fresh SMT),
  but not a run all the way down to the deeper low, which costs too much time and range.'
preconditions:
- Correlated indices ranked strongest / middle / weakest at the open.
- A directional idea on the strongest (long) or weakest (short) asset.
detection_rules:
- 'Bullish idea: watch the weakest asset at its low; require it to reverse before framing the long on
  the strongest.'
- 'Preferred form: the weakest makes one more sweep of its low and then reverses (a fresh SMT).'
- 'Disfavoured form: the weakest runs all the way to a deeper / distant low - too much time and range
  for a pre-10:00 continuation.'
- 'Bearish idea: mirror - require the strongest asset to reverse before shorting the weakest.'
- If the weakest keeps continuing against the idea while the strongest stalls, expect consolidation and
  drop the idea.
invalidation:
- The required asset continues through its level instead of reversing (here YM continued lower; NQ was
  the 'liar').
measurable:
- outcome of strongest-asset longs with vs without a weakest-asset reversal
- outcome when the weakest reverses after a second sweep vs a single sweep vs a deep run
