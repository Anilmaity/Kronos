id: smt-requires-framework
name: "SMT Is a Confirmation, Not a Framework"
aliases: ["model first, SMT confirms"]
category: liquidity
status: specified

definition: >
  The clearest statement of it in the corpus, delivered as a correction of what he says
  everyone does. The wrong order is to find an SMT first and then build a framework around it.
  His order is the reverse: have the model first, then use SMT to confirm or as a confluence.
  He refuses on air to short on the basis that ES has not taken a high that NQ has, because
  that divergence is not supported by his model. Two further filters emerge from the same
  streams. An SMT where the correlated assets are already far beyond the level is technically
  an SMT but not one he wants - he would rather see the level taken out than expect a reaction
  from it. And where the two sides of a candle both present, only the side that also has a
  CISD is trusted.

timeframes:
  htf: ["4H", "1H"]
  ltf: ["15m", "5m"]
  fractal: true

preconditions:
  - "A model / framework already exists on the instrument."
  - "Two or more correlated assets."

detection_rules:
  - "Establish the framework first; only then look for SMT."
  - "Never treat a bare divergence between correlated assets as a setup."
  - "Reject an SMT where the other assets have traded well beyond the shared level - prefer to see that level taken out instead of expecting a reaction."
  - "Where both a bullish and a bearish reading exist, trust only the side that also has a CISD."
  - "An SMT is what supplies the trustworthy invalidation level; without it he will not trade away from a high or low."

invalidation:
  - "The divergence resolves - the lagging asset takes the level too."

measurable:
  - "expectancy of SMT-first entries vs model-first entries"
  - "reaction rate of SMTs where the correlated asset is far beyond the level vs close to it"

sources:
  - video_id: i2HhHhWdaPQ
    title: "New York Open Live Q&A"
    quote: "I always have a model first, use SMT to confirm."
  - video_id: eIPM-D8RrSQ
    title: "New York Open Live Q&A"
    quote: "I'd more want to see it get taken out than have a reaction"

ambiguities:
  - "'Way over it' is the disqualifier for a stale SMT but no distance measure is given."
  - "SMT is called a confluence here yet is simultaneously the thing without which he will not take the trade (see idea-vs-executable-setup); the two roles are not reconciled."
  - "Which correlated asset supplies the SMT for gold is answered only as 'they just need to be correlated' (silver is allowed)."

python_detector: null
related: ["smt-divergence", "smt-as-confirmation-not-signal", "idea-vs-executable-setup", "relative-strength-asset-selection"]

