id: relative-strength-asset-selection
name: "Ranking Correlated Assets And Choosing Which To Trade"
aliases: ["ES leading", "strongest asset", "weakest asset"]
category: structure
status: contested
voice: ttrades
definition: >
  Live restatement plus a base rate. He states that ES does not lead on roughly nine out of
  ten days; normally NQ should be the weaker (bearish case) off the initial move. On a day
  when ES does lead (it trades below lows the others hold), ES usually trends a little and
  then NQ and YM follow along. Selection rules repeated: when YM is strongest, shorts go on
  ES or NQ, not YM, because the lagging asset chops; and the strongest asset reversing off
  its previous day high is what licenses shorting the weakest.
timeframes:
  htf: ["1D"]
  ltf: ["15m", "5m", "1m"]
  fractal: false
preconditions:
  - "YM, ES and NQ ranked intraday by which one has taken shared lows/highs."
detection_rules:
  - "Expect ES not to be the leader (stated as about 9 days in 10)."
  - "If ES is the only index below a shared low, classify ES as weakest intraday and expect NQ/YM to follow."
  - "Bearish: never short the strongest asset (YM in the example); short ES or NQ."
  - "A reversal of the strongest asset off its previous day high is the trigger to short the weakest."
measurable:
  - "Frequency of ES leading (first to take a shared low/high) per month vs the stated ~10%."
  - "Follow-through rate of NQ/YM within the session after ES leads."
sources:
  - video_id: KBJAGgkXdeI
    title: "New York Open Live Q&A"
    quote: "Like nine out of 10 days ES does not lead."
  - video_id: KBJAGgkXdeI
    title: "New York Open Live Q&A"
    quote: "usually ES trends a little and then the others follow along"
  - video_id: KBJAGgkXdeI
    title: "New York Open Live Q&A"
    quote: "YM is the strongest asset. So, you would want to trade ES or NQ"
  - video_id: KBJAGgkXdeI
    title: "New York Open Live Q&A"
    quote: "asset reversing off of its previous day high allows you to short the weakest asset"
ambiguities:
  - "He immediately adds 'I'm actually more than that' - the 9/10 figure is a lower bound, not a measurement."
  - "An earlier library entry quotes 'three or four days in the past month' for ES leading; both are offhand estimates."
python_detector: null
related: ["relative-strength-weakness", "correlated-triads", "smt-divergence"]
