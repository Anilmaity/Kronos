id: ttfm-minimal-toolkit
name: "Minimal Toolkit (what is on the chart, and what is deliberately not)"
aliases: ["what I use", "highs lows FVG CISD SMT"]
category: model
status: specified

definition: >
  The complete analytical toolkit used across all four streams: highs and lows, fair value
  gaps, and CISD, with SMT as the confluence, plus opposing candles for midpoint levels.
  Everything else in the common ICT toolkit is explicitly disclaimed on air. This matters for
  library merging: concepts drafted from other TTrades videos that rely on the excluded tools
  should be checked against these refusals.

timeframes:
  htf: ["1D", "4H", "1H"]
  ltf: ["15m", "5m", "3m", "1m"]
  fractal: true

preconditions:
  - "n/a"

detection_rules:
  - "In use: swing highs and lows; fair value gaps; CISD; SMT (confluence); opposing candles and their 50% levels; volume imbalance (used opportunistically once)."
  - "Explicitly not used: OTE and fibonacci retracement; silver bullet; killzones; macros; rejection blocks; breaker blocks; propulsion blocks; order flow, footprint, TPO, delta and volume profile; midnight open; fundamental analysis; weekly bias; CRT terminology; breakaway gaps; settlement price."

invalidation:
  - "n/a"

execution:
  bias: "n/a"
  entry: "n/a"
  stop: "n/a"
  targets: "n/a"

measurable:
  - "Whether adding any excluded tool as a filter improves expectancy of the base model."

sources:
  - video_id: aqnY1yZvfYs
    title: "New York Open Live Q&A"
  - video_id: Qv6Ux_Z8VrA
    title: "New York Open Live Q&A"
  - video_id: yud7TpE2AMs
    title: "New York Open Live Q&A"
  - video_id: 00iZXPAdR5A
    title: "New York Open Live Q&A"

ambiguities:
  - "OTE is disclaimed as an entry zone but simultaneously used as an invalidation threshold - it is excluded as a tool while retained as a boundary."
  - "He says he uses OTE 'only in larger ranges' and cannot explain when; that exception is undefined."
  - "Volume imbalance appears once as a level-refinement without ever being introduced as a concept."

python_detector: null
related: ["shallow-retracement", "equilibrium-eq", "smt-divergence", "cisd"]
