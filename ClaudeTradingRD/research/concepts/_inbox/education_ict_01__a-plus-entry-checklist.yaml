id: a-plus-entry-checklist
name: A+ Entry Checklist
aliases:
- my a plus setup
- the 2022 mentorship model
category: entry
status: contested
definition: 'EARLIER RECORDING (old ''Education - ICT'' playlist; re-recorded later as 0xygpCMwxbQ, the
  canonical reading). Here the checklist is framed explicitly as the ICT 2022 MENTORSHIP MODEL - a framing
  the later recording drops entirely. The steps are: (1) a liquidity grab; (2) a market structure shift
  WITH displacement; (3) a fair value gap or order block positioned above/below the 0.5 fib of the DISPLACEMENT
  RANGE - premium for shorts, discount for longs; (4) price returns into it; (5) solid risk-to-reward.
  The substantive addition over the later version is an explicit SUBSTITUTION for step 1: the liquidity
  grab does not have to be a run of highs or lows - trading into a higher-timeframe imbalance counts as
  the same thing, ''a higher time frame reasoning''.'
timeframes:
  htf:
  - 15m
  - 5m
  ltf:
  - 1m
  fractal: true
preconditions:
- A directional idea exists before the checklist is applied.
detection_rules:
- '1. A liquidity grab: equal highs/lows or an obvious swing is run.'
- '1b. SUBSTITUTE: price trading into a higher-timeframe fair value gap counts as the liquidity grab.'
- 2. A market structure shift with displacement - an aggressive break of the opposing short-term extreme.
- 3. Fib the displacement range low-to-high (longs) and require the entry PD array below the 0.5; mirror
  for shorts.
- 4. A fair value gap or order block, ideally unmitigated, inside that half.
- 5. Entry there; stop above the fair value gap, or on the candle that created it - stated as user discretion.
- He explicitly dislikes stops placed all the way at the swing low - too much risk.
- 'Exits are a partial ladder: first partial at the nearest opposing liquidity, second at the next, third/final
  at the day''s extreme.'
invalidation:
- No liquidity grab and no higher-timeframe imbalance reached.
- The PD array sits on the wrong side of the 0.5 of the displacement range.
execution:
  bias: Direction of the displacement leg.
  entry: Unmitigated FVG / OB beyond the 0.5 of the displacement range.
  stop: Above the fair value gap or on the creating candle - discretionary.
  targets:
  - Nearest opposing liquidity
  - Next liquidity pool
  - The day's opposing extreme
measurable:
- hit rate when step 1 is a literal sweep vs when it is the HTF-imbalance substitute
- R difference between the tight (FVG) stop and the swing stop
- how often each of the three partials is reached
