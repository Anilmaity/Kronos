id: exit-when-target-nearly-hit
name: Exit When One Point From Target And Price Is Reversing
category: risk
status: underspecified
voice: ttrades
aliases:
- one point from TP
definition: 'Responding to a viewer who held a long to within one point of take-profit and let it come
  all the way back: once price is that close to the target you are risking the whole open profit for one
  more point, so if price is reversing, exit rather than hold. He also notes the same logic is why range
  days require taking profit repeatedly.'
timeframes:
  htf: []
  ltf: []
  fractal: true
preconditions:
- Open position within a very small distance of its take-profit.
detection_rules:
- If price is within ~1 point (NQ example) of the target and starts reversing, close the position.
invalidation:
- n/a
measurable:
- expectancy with a near-target exit (distance X) vs holding for the exact target
sources:
- video_id: h1ZQWWQDhKA
  title: TTrades MNQ Cup - Afternoon Session
  quote: not taking your profit if it's like one point away and price is reversing
- video_id: h1ZQWWQDhKA
  title: TTrades MNQ Cup - Afternoon Session
  quote: now you're risking one point for all of that
ambiguities:
- '''Reversing'' and the near-target distance are undefined; one point on MNQ is the only example.'
- He prefaces with 'to each their own' - preference, not a hard rule.
related:
- partial-profit-taking
- time-based-exit
contributing_units:
