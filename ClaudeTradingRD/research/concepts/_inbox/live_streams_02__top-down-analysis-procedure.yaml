id: top-down-analysis-procedure
name: "Top-Down Read (the fixed order of operations)"
aliases: ["daily bias, daily profile, entry", "my model is"]
category: model
status: specified

definition: >
  Challenged on whether he weights daily bias over daily profile, he states the model as an
  ordered three-slot procedure: daily bias, then daily profile, then entry. He then runs it out
  loud — bias is bullish; profile is a New York reversal; therefore first target previous day
  high, second target the intraday high — and uses the ordering to explain why a bullish bias
  does not license a long into a dying sweep of previous day high: the profile has to support the
  bias before an entry is sought. His live review sequence is the same order in reverse-zoom:
  daily chart (what does the daily candle and its SMT say), hourly (where is the range), rank
  the correlated assets, then drop to the 3-minute for the entry into the identified level.

timeframes:
  htf: ["1D", "1H"]
  ltf: ["15m", "5m", "3m"]
  fractal: true

preconditions:
  - "Daily and hourly charts of the instrument and its correlated set."

detection_rules:
  - "Step 1 — daily bias: read the daily candle (closure, SMT with the correlated asset, previous day high/low)."
  - "Step 2 — daily profile: name which profile the day is (e.g. New York reversal) and check that it supports the bias."
  - "Step 3 — entry: only then look for the entry, on the level the first two steps produced."
  - "Live review order: daily → hourly range → relative strength ranking → execution timeframe."
  - "If the profile does not support the bias, do not take the entry even though the bias stands."

invalidation:
  - "Not applicable — this is a procedure."

measurable:
  - "outcome of entries taken with bias-and-profile agreement versus bias alone"
  - "distribution of named daily profiles and their follow-through"

sources:
  - video_id: G1IIdQ3RAkY
    title: "New York Open Live Q&A"
    quote: "my model is daily bias, daily profile entry"
  - video_id: m8xcjkOuBHU
    title: "New York Open Live Q&A"
    quote: "this is just going to be my top down analysis over my thoughts"

ambiguities:
  - "The catalogue of daily profiles is assumed known; only 'New York reversal' and 'Asia reversal' are named in this unit and neither is defined here."
  - "What to do when bias and profile disagree is stated only negatively (do not enter), not as a rule for flipping or waiting."
  - "The relative-strength ranking step is used in every session but is not listed as part of the three-slot model."

python_detector: null
related: ["daily-bias-framework", "daily-profile-framework", "new-york-reversal-profile", "relative-strength-asset-selection", "timeframe-pairing"]

contributing_units: ["live_streams_02"]
