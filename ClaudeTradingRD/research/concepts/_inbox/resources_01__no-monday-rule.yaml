id: no-monday-rule
name: Skip Mondays
definition: 'Stated in his own voice as an established habit rather than argued: he does not journal
  Mondays because he never trades them, and journals Tuesday through Friday only. No justification
  is offered in this video - it is presented as settled practice.'
category: time
status: contested
aliases:
- I never trade Mondays
preconditions:
- None - unconditional.
detection_rules:
- It is Monday -> no trade, and no journal entry.
- Journal entries exist for Tuesday, Wednesday, Thursday and Friday.
invalidation:
- None stated.
measurable:
- Monday P&L that would have accrued from setups meeting all other criteria
sources:
- video_id: wrIZ7CAuFCc
  title: How To Journal Everyday For Trading
  quote: I don't Journal Mondays because I never trade Mondays
ambiguities:
- No reason is given here; the reasons in the rest of the corpus (smallest range day, no news, no
  weekly-profile data yet) are absent from this video.
- It is stated as personal habit, not as an edge claim.
- Elsewhere in the corpus Monday IS tradeable when the prior Friday formed a reversal; this video
  does not acknowledge the exception.
