id: midweek-reversal-week
name: Midweek Reversal (weekly profile)
category: model
status: specified
voice: ttrades
definition: >
  Gold hourly example: Monday and Tuesday expand higher, Wednesday forms a reversal, so
  Thursday and Friday are expected to continue lower; a protected swing at the open of the new
  daily candle is used to position short for 2R.
detection_rules:
  - "Mon/Tue expansion, Wednesday reversal (daily C2/C3 with CISD) -> look for Thursday/Friday continuation in the reversal direction."
sources:
  - video_id: cWDnzI3lpUk
    title: "How to Trade With a 9-5 Job (TTrades Fractal Model Explained)"
    quote: "if we have that Wednesday or midweek reversal, we can look for Thursday and Friday"
ambiguities:
  - "One example only."
related: ["ttfm-swing-trading-model"]
