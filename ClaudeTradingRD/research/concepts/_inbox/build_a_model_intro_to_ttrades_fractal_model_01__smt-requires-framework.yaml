id: smt-requires-framework
name: SMT Is a Confirmation, Not a Framework
category: liquidity
status: specified
aliases:
- framework first, SMT second
definition: 'Doctrine, stated repeatedly and with an explicit worked counter-example: you do not
  find an SMT and then build a model around it - you find the model and then check for an SMT. The
  gate is concrete: a candle 2 or candle 3 closure PLUS the aligned lower-timeframe change in the
  state of delivery must exist first. In one example an SMT is visibly present on gold, and he refuses
  to use it because the hourly CISD has not yet closed through; once it does, the SMT is allowed
  to count.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  fractal: true
preconditions:
- None - this is an ordering rule.
detection_rules:
- 'Step 1: higher-timeframe closure (C2 or C3) at a point of interest.'
- 'Step 2: aligned lower-timeframe change in the state of delivery.'
- 'Step 3 only then: check the correlated market for SMT as confluence.'
- An SMT present before step 2 is ignored, however clean it looks.
- SMT is never a substitute for intraday confirmation that the wick has formed.
invalidation: []
measurable:
- outcome of SMT-first entries vs model-first entries on the same data
- how many visible SMTs are discarded by the ordering rule
sources:
- video_id: -ocfPuD_oqE
  title: How To Use SMT Divergence - TTrades Fractal Model
  quote: SMT is not used to force yourself upon a model
- video_id: -ocfPuD_oqE
  title: How To Use SMT Divergence - TTrades Fractal Model
  quote: I'm finding a framework and then applying SMT to that
- video_id: -ocfPuD_oqE
  title: How To Use SMT Divergence - TTrades Fractal Model
  quote: If my model has not formed, I do not look for SMT yet
- video_id: -ocfPuD_oqE
  title: How To Use SMT Divergence - TTrades Fractal Model
  quote: just because you see SMT doesn't mean everything's going to work
ambiguities:
- 'The doctrine is unambiguous, but it coexists in this unit with the SMT-as-swing-point substitute
  rule, where SMT DOES supply a missing structural precondition. The two are not reconciled: SMT
  may replace a sweep, but may not replace the closure or the CISD.'
