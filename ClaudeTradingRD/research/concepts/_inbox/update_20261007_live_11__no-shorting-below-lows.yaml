id: no-shorting-below-lows
name: "Do Not Short Below Lows"
aliases: ["trail to it, don't enter it"]
category: entry
status: contested
voice: ttrades
definition: >
  Gold made most of the daily range to the previous day low; he would never enter short there
  unless already short from higher and holding runners. When price then broke below the
  previous day low with a 1-minute failure to manipulate and a new continuation, that
  continuation was a place to trail the stop to, not one he would enter, because of location.
timeframes:
  htf: ["1D"]
  ltf: ["1m"]
  fractal: false
detection_rules:
  - "If price is below the previous day low / has made the daily range to it, take no new short."
  - "A continuation printed there is used only as a trailing-stop reference for an existing short."
measurable:
  - "R of shorts initiated below the previous day low vs above it."
sources:
  - video_id: KBJAGgkXdeI
    title: "New York Open Live Q&A"
    quote: "This is not a continuation I would personally enter because of the location."
  - video_id: KBJAGgkXdeI
    title: "New York Open Live Q&A"
    quote: "So, this is a continuation where I would trail my stop to."
  - video_id: KBJAGgkXdeI
    title: "New York Open Live Q&A"
    quote: "I would never be entering short into here"
ambiguities: []
python_detector: null
related: ["failure-to-manipulate", "breakeven-after-new-protected-swing"]
