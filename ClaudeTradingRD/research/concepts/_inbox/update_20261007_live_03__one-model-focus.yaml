id: one-model-focus
name: One Model, One Concept, One Time (less is more)
category: psychology
status: specified
definition: 'How to avoid watching charts for hours: define your model and what you are looking for, define
  when you look for it (he trades New York morning, sometimes swings Asia, never the PM session), watch
  only if a setup exists and otherwise stop paying attention. Also: no signals, because copying a streamer
  builds no skill.'
detection_rules:
- Before the session, fix the model, the setup sought and the session window; outside that window, or
  with no setup forming, do not watch charts.
