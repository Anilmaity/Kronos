id: prop-firm-drawdown-sizing
name: "Prop Firm Sizing Off The Drawdown"
aliases: ["risk per trade", "percent of drawdown", "money-versus-time tradeoff"]
category: risk
status: specified

definition: >
  The only place in this unit where risk per trade is given as a number. He frames evaluation
  sizing as a money-versus-time trade-off and gives three tiers as a percentage of the account's
  *drawdown* (not of equity): aggressive, where you do not mind spending money to pass fast, is
  roughly 20% and may go to 50%; the middle ground is about 7-10% (he first says "five to seven"
  then corrects to "maybe seven to 10"); conservative is about 5% or below. Worked on his own
  example of a $1,500 drawdown account, that is roughly $750 aggressive, $150 middle, $75
  conservative. The stated design constraint behind the conservative end is that sizing should
  survive about 10 losers in a row without hitting the drawdown, and the middle tier is
  described as taking about 10 trades to blow up and about 5-10 winners to pass. Separately, on
  a live account the sizing procedure is stated generically: decide the dollars you are willing
  to risk, then derive contract size from your stop distance.

timeframes:
  htf: []
  ltf: []
  fractal: false

preconditions:
  - "An account with a defined maximum drawdown."
  - "A stop distance implied by the setup (protected swing) before size is chosen."

detection_rules:
  - "Express risk per trade as a percentage of the account drawdown, not of equity."
  - "Aggressive (optimising for speed over cost): ~20% of drawdown, up to 50%."
  - "Middle: ~7-10% of drawdown; expect ~10 trades to blow up, ~5-10 winners to pass."
  - "Conservative (optimising for cost over speed): ~5% of drawdown or below."
  - "Sanity check the conservative end: sizing should absorb ~10 consecutive losers without breaching drawdown."
  - "On a live account: fix the dollar risk first, then compute contract size from the stop distance."

invalidation:
  - "Not applicable — this is a sizing policy."

measurable:
  - "probability of breaching drawdown at each tier given a measured win rate and R"
  - "expected cost and expected time to pass at each tier"
  - "realised maximum consecutive-loss run versus the 10-loser assumption"

sources:
  - video_id: m8xcjkOuBHU
    title: "New York Open Live Q&A"
    quote: "risk where you can have, you know, those 10 losers in a row"
  - video_id: TjUolMJNCMY
    title: "New York Open Live Q&A"
    quote: "you decide how many dollars you want to risk on a trade"

ambiguities:
  - "The tiers are drawn on a whiteboard-style curve as illustration, not stated as prescriptions; he says explicitly 'it's not oh you need to risk this amount'."
  - "He self-corrects the middle tier mid-sentence (five-to-seven then seven-to-ten), so the middle band is soft."
  - "The 10-losers-in-a-row constraint is asserted, not derived from a stated win rate."
  - "No equivalent percentage is ever given for a personal (non-prop) account."

python_detector: null
