ambiguities:
- 'EVOLUTION vs the Updated playlist: the later canon (Tjk9bXERZy0) anticipates this profile from
  an EMPTY ECONOMIC CALENDAR (''a lack of news events''). This earlier recording never mentions news
  at all and derives it from a lack of higher-timeframe direction. Both readings preserved.'
- '''Lack of higher timeframe direction'' has no test - no range-width, no candle count, no reference
  to previous-candle extremes.'
- The auto-captioner renders 'London session' as 'lemon session' at the one place he gives the Asia-range
  trigger.
- No deadline is given for when London must have taken both Asia extremes.
- Which range is the operative one when profiles nest is not stated.
