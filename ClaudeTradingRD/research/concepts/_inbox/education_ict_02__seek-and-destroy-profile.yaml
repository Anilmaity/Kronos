id: seek-and-destroy-profile
name: Seek & Destroy (broadening daily profile)
category: model
status: contested
definition: 'THE DEDICATED EARLIER LESSON. The definition given here is causal rather than descriptive:
  a seek and destroy profile is a LACK OF HIGHER-TIMEFRAME DIRECTION relative to the timeframe being
  watched, which leaves consolidation. The behavioural consequence is that every attempt to leave
  the range returns into it - buyside taken then back inside, sellside taken then back inside. It
  is explicitly fractal: seek-and-destroy profiles nest inside larger ones. His stated default is
  avoidance (''pretty choppy''), and the tradeable version is entirely built on DEVIATIONS: mark every
  point where price took buyside or sellside and came back in, and trade from those, with a fixed
  three-step target ladder (see seek-destroy-target-ladder).'
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- The higher timeframe has no direction relative to the timeframe being traded.
detection_rules:
- Mark the reference range's buyside and sellside liquidity.
- Each time price takes one side and closes back inside, record a DEVIATION from the range; those
  deviations are the only trade locations.
- 'Daily anticipation trigger: London takes BOTH the Asian range high and the Asian range low. That
  creates a deviation on both sides, and New York a.m. is then expected either to consolidate or to
  target London''s own high and low.'
- Treat the profile as fractal - the same deviation/return behaviour repeats on lower timeframes inside
  the larger range.
- Default action is to stand aside; only trade the deviations if you choose to engage.
invalidation:
- A very large displacement candle out of the range - he flags that price 'may start to leave this
  range' and the profile is ending.
measurable:
- count of deviations per day
- rate at which a deviation returns to range equilibrium
