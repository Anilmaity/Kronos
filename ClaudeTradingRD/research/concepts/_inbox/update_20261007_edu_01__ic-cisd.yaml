id: ic-cisd
name: Intracandle CISD (IC-CISD)
category: entry
status: specified
voice: ttrades
definition: >
  Restated as the mechanical definition of 'let the wick form': with a directional expectation
  for the higher-timeframe candle, the candle first shows a short-term counter move (forming
  the wick) and then a shift back - price reaches an important level (fair value gap, swept
  high/low) and closes through the series of candles that made the extreme inside that
  level. That creates a protected swing inside the candle, which is anticipated to be the
  candle's wick and is used as the stop. He says he created the concept specifically to
  mechanise that logic, and that it is the go-to entry in the daily + hourly fractal model.
detection_rules:
  - "Inside the higher-timeframe candle, wait for a reach into an important level against the intended direction (FVG, or sweep of a prior low/high)."
  - "Require a close through the series of opposing candles into that level - this forms the intracandle protected swing."
  - "Entry: on the close-through, or anywhere after it as long as the stop is near that protected swing."
  - "Timing filter (hourly model on indices): before 9:30 he prefers to read the 15-minute candle rather than the hourly for this formation."
  - "If the wick is anticipated with high confidence, a discretionary entry anywhere in the zone with the stop on the extreme is allowed instead of waiting for the IC-CISD."
execution:
  bias: "Direction of the higher-timeframe candle."
  entry: "On or after the close through the series."
  stop: "On the intracandle protected swing."
  targets: ["2R", "3R to short-term targets", "7R to the higher-timeframe target in one example"]
measurable:
  - "R achieved by IC-CISD entries vs discretionary pre-CISD entries"
sources:
  - video_id: RX8vtP3PLYk
    title: "Let The Wick Form, Trade The Body (Stop Getting Stopped Out)"
    quote: "the whole reason I created that concept was to try to mechanically define this logic"
  - video_id: RX8vtP3PLYk
    title: "Let The Wick Form, Trade The Body (Stop Getting Stopped Out)"
    quote: "generally prior to 9:30, I want to use the 15-minute candle"
  - video_id: cWDnzI3lpUk
    title: "How to Trade With a 9-5 Job (TTrades Fractal Model Explained)"
    quote: "the go-to is always going to be an intra-candle change"
ambiguities:
  - "The pre-9:30 15-minute preference is said in passing inside one 5-minute/hourly example; whether it means the 15-minute replaces the hourly as the HTF candle or as the confirmation timeframe is not explicit."
  - "A first IC-CISD that fails off the open (gold example in cWDnzI3lpUk) is called 'a valid loss'; a later protected swing in the same candle is then taken - no limit on re-entries is given."
related: ["wick-trust-test", "protected-swing", "positional-entry"]
