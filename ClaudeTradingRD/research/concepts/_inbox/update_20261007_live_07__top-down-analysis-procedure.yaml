id: top-down-analysis-procedure
name: Top-Down Analysis Procedure
category: model
status: specified
definition: 'Fractal-model version given live: daily for directional bias; 4-hour or 1-hour for structure
  (fair value gap, EQ of the daily wick, swing points) to find where price should react; let the daily
  candle''s wick form; then align a fractal model with it, everything resolving to CISD.'
detection_rules:
- Daily -> bias.
- 4H/1H -> reaction area (FVG, daily-wick EQ, swing points).
- Wait for the daily wick to form.
- Execute with a fractal model / CISD.
