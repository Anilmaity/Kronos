id: unicorn-candle-count-filter
name: "Unicorn Candle-Count Filter (10-12 candles or fewer)"
aliases: ["clear and decisive movement", "quick unicorn"]
category: entry
status: underspecified

definition: >
  A speed filter that separates a genuine unicorn from consolidation wearing the shape of one. The
  breaker-plus-FVG formation should complete within roughly 10 to 12 candles, ideally fewer. A
  formation that takes several hours, or that contains substantial consolidation between the
  breaker and the close through it, is rejected as a swing high and swing low mixed with
  consolidation rather than a decisive move.

timeframes:
  htf: ["1H", "4H", "15m"]
  ltf: ["15m", "5m", "1m"]
  fractal: true

preconditions:
  - "A unicorn (breaker plus aligned fair value gap) is forming at a point of interest."

detection_rules:
  - "Count the candles taken to form the unicorn; accept roughly 10 to 12 or fewer."
  - "Reject unicorns where a run of consolidation sits between the breaker and the candle that closes through it."
  - "Reject unicorns formed far down the candle body or built over several hours, even though some of those do win."
  - "Worked examples that were accepted took 7, 8 and 9 candles."

invalidation:
  - "The count exceeds the threshold - the setup is passed, not taken late."

execution:
  bias: "Unchanged."
  entry: "Only on unicorns passing the count."
  stop: "Not stated."
  targets: ["the nearest session level"]

measurable:
  - "win rate and expectancy of unicorns bucketed by formation candle count (1-6, 7-9, 10-12, 13+)"
  - "proportion of unicorns rejected by the filter"

sources:
  - video_id: 07lOxv39LdY
    title: "DTR | C2U - Blending The Fractal Model & Unicorn Model - No Daily Bias"
    quote: "I want to see a unicorn form quickly and concisely"

ambiguities:
  - "The threshold is a range ('10 to 12 or less') with no hard cut, so it is not decidable at the boundary - hence underspecified."
  - "The counting start point is not stated - from the breaker candle, from the sweep, or from the arrival at the point of interest."
  - "He concedes that some rejected formations do win, so the filter trades hit rate against sample size by an unmeasured amount."

python_detector: null
related: ["c2-unicorn", "unicorn-model"]
