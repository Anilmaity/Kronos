id: displacement
name: Displacement
aliases:
- displace
- lack of displacement
- aggressive move
category: structure
status: underspecified
definition: 'The market structure lesson is the densest use of this term anywhere in the corpus,
  and it is the first place the speaker himself supplies an operational test rather than leaving
  it to the viewer. Every time he resolves ''did we displace?'' on the chart he resolves it as a
  CLOSE beyond the reference structural level: ''now we get some displacement a close over this previous
  high'', ''once we displace and close below this low''. He also uses its absence as a classifier
  - a higher high with no displacement around it is consolidation, not trend - and in the top-down
  video he corroborates the second-best proxy by pointing at a fair value gap left behind by the
  move. There is still no magnitude threshold, so the concept remains underspecified, but the close-beyond-the-level
  proxy is now stated by the speaker rather than inferred by the reader.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- 'A reference structural level: a prior swing high, swing low, or range boundary.'
detection_rules:
- 'Speaker-stated proxy (market structure video): displacement over a level = a CLOSE over the previous
  high; displacement under a level = a CLOSE below the previous low. He uses this phrasing every
  time he adjudicates a structure break.'
- 'Corroborating proxy (top-down video): the displacing leg leaves a fair value gap behind it - he
  narrates ''we get a nice displacement now we have a fair value Gap'' in that order.'
- 'Lack of displacement is itself a signal in both directions: failing to displace lower after a
  lower low is the precondition for a bullish structure shift, and structure advancing with no displacement
  is labelled consolidation.'
- The read is explicitly built on the pairing of swing points with the displacement (or lack of it)
  around them - that is his summary of the whole market structure lesson.
invalidation:
- Not applicable - this is a primitive, not a setup.
measurable:
- sensitivity of every downstream detector (structure shift, order block, CISD) to close-beyond-level
  vs an ATR-magnitude definition of displacement
- how often a close beyond the pivot is followed by the confirming opposite-side swing, split by
  candle size
- share of closes-beyond-level that also leave a fair value gap
