ambiguities:
- 'Still no magnitude: no ATR multiple, body ratio, or minimum range is ever given, so ''a close
  over the previous high'' by one tick qualifies under his own stated test.'
- The close-beyond-level proxy only applies where a reference level exists; the 'aggressive move'
  sense used for manipulation in other units has no such anchor and is not covered by it.
- Whether the close must be the candle body beyond the level, or the candle merely closing on the
  far side, is not distinguished (they are the same thing for a close, but he also says 'break of
  this low' interchangeably).
- '''Displacement out of this range'' and ''displacement around them'' are used loosely for legs,
  not for single candles.'
- 'This remains the single highest-leverage open definition in the corpus: it gates market structure
  shift, order block validation and consolidation classification simultaneously.'
