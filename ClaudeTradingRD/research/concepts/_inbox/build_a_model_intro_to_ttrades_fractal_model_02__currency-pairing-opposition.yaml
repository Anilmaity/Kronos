id: currency-pairing-opposition
name: Pair a Strong Currency Against a Weak One, Never Against a Consolidating One
category: structure
status: specified
aliases:
- the fraction rule
- numerator denominator
definition: 'The arithmetic behind pair selection, taught literally as fractions. A forex pair is numerator/denominator;
  raising the numerator or lowering the denominator makes the pair bullish, and doing both makes it
  strongly bullish. The actionable content is the avoidance list: pairing strong with strong, or weak
  with weak, moves both sides of the fraction the same way and leaves you with a CONSOLIDATION, not
  a trend. Pairing anything with a consolidating currency gives a trend, but a weak one. The target
  state is the strongest currency against the weakest.'
timeframes:
  htf:
  - 1M
  - 1W
  - 1D
  ltf:
  - 4H
  - 1H
  fractal: false
preconditions:
- Currency futures charts for the majors, each classified as strong bullish / bullish / consolidating
  / bearish / strong bearish.
detection_rules:
- 'Avoid: strong + strong, or weak + weak -> the pair consolidates.'
- 'Acceptable but weak: trending currency + consolidating currency -> a trend, but not a strong one.'
- 'Target: strongest currency as one leg, weakest as the other -> strong trend.'
- Numerator up + denominator down = strong bullish pair; numerator down + denominator up = strong bearish
  pair.
- When all currencies trend the same way and no opposing leg exists, pair against a consolidating one
  and accept the weaker trend.
invalidation:
- The relative-strength ranking changes -- the pair choice must be redone.
measurable:
- realised daily range of pairs selected by this rule vs pairs excluded by it
- frequency of the all-trending-same-way case
sources:
- video_id: HrjYoxAUb3s
  title: Using Currency Futures to Choose the Right Forex Pair
  quote: finding the weakest currency and pairing that with the strongest currency
ambiguities:
- The five strength categories are icons on a slide with no derivation -- how a currency future is graded
  is never stated.
- The ranking is done off daily candle appearance in the walkthroughs, with no lookback window.
