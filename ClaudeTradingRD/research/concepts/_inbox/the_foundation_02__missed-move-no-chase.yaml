id: missed-move-no-chase
name: Missed Move / No-Chase Rule
aliases:
- let's say I miss this trade
category: psychology
status: specified
definition: 'The top-down video gives the constructive half of this rule. Having missed the first
  5-minute entry he asks whether it is already too late, and answers that it is not - because the
  objective he framed the trade toward has not been reached yet. The remedy is explicit and is not
  a late market entry: go back out to the structure timeframe and wait for a NEW setup there (a retrace
  into the order block, a sweep and a closure), then drop back down. He supports the judgement structurally
  by noting that a fresh opposing candle has formed and should hold price up while it trends to the
  highs.'
timeframes:
  htf:
  - 1H
  ltf:
  - 5m
  fractal: true
preconditions:
- An entry was missed while the framed objective is still unreached.
detection_rules:
- 'Test whether the trade is gone: has the objective the trade was framed toward already been reached?
  If not, it is not too late.'
- Do not enter late at market; return to the structure timeframe and wait for a new setup - a retrace
  into the order block, a sweep, and a closure.
- 'Supporting structural check: a newly formed opposing candle is expected to hold price while the
  move continues to the objective.'
- If the objective HAS been reached, there is no continuation to seek (see the exhaustion rules elsewhere
  in the corpus).
invalidation:
- The objective is reached - the idea is finished, not re-entered.
measurable:
- outcome of second and third entries taken after a missed first entry, conditional on the objective
  being unreached
sources:
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: let's say I miss this trade
- video_id: iEaMbuFZb24
  title: Trade Like TTrades - Top Down Analysis
  quote: I'd once again just want to wait for a new hourly setup
ambiguities:
- '''Objective not yet reached'' is the only stated gate; distance remaining relative to the average
  daily range is not considered here, though other units make that a filter.'
- No cap is given on how many re-entries a single idea may generate - the same example produces at
  least three.
python_detector: null
