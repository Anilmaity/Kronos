id: smt-requires-framework
name: SMT Requires A Framework
category: liquidity
status: contested
voice: ttrades
definition: 'Answering a viewer who finds SMT confusing: stop looking for SMT when you do not have a valid model;
  first have a model or a reason to look in a direction, then use SMT as confluence. Asked whether a CISD must appear
  on both correlated assets to take a trade, the answer is no - it is nice to see but not required.'
detection_rules:
- Require a valid model / directional reason before SMT is considered.
- A CISD on only the traded asset is sufficient; the correlated asset need not print its own CISD.
sources:
- video_id: ES-R3ByDYrY
  title: TTrades MNQ Cup - Morning Session
  quote: stop looking for SMT when you don't have a valid model
- video_id: ES-R3ByDYrY
  title: TTrades MNQ Cup - Morning Session
  quote: Is it necessary to see CISD in both assets
ambiguities:
- The 'no' answer to the both-assets CISD question is two words in a Q&A; no example accompanies it.
