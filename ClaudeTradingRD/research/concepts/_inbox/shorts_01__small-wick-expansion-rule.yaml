ambiguities:
- STILL NO THRESHOLD. 'Smaller relative to the body' fixes the denominator but supplies no ratio - wick/body
  < 1? < 0.5? < 0.33? Never said anywhere in this unit.
- 'The comparison basis conflicts across the corpus: this unit says relative to the BODY, the dedicated
  long-form video says relative to the candle''s RANGE and TIME. No precedence given.'
- Whether both wicks or only the opposing wick is measured is not stated in these Shorts.
- ZPCFCPzNWic announces 'three different types of candles that I focus on' but the transcript ends mid-sentence
  after only the directional type is given; the other two are not recoverable here.
