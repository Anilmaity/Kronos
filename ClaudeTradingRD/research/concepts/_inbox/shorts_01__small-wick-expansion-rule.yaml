id: small-wick-expansion-rule
name: Small Wick Supports Expansion; Large Wick Waits for Candle 3
category: model
status: underspecified
aliases:
- directional candle
definition: 'SHORTS EVIDENCE for the corpus''s central unquantified filter. The most useful single line
  in this unit gives the measurement BASIS explicitly: on a directional candle the wick is smaller RELATIVE
  TO THE BODY. That is a body-relative comparison, stated for a candle of any timeframe, not a range-relative
  or time-relative one. A directional candle is otherwise described in time order: price went one direction
  for the most part of the period - open, first extreme, one-way run, second extreme, close. The rest
  of the unit applies the filter exactly as the long-form videos do: a small wick means the candle can
  be traded in its direction; a large wick means it does not support expansion and the trader waits.'
preconditions:
- A candle has closed, or is forming, at or from a key level.
detection_rules:
- Measure the wick against the candle's OWN BODY - this unit states the comparison basis as 'smaller
  relative to the body'.
- Directional candle := price moved one direction for the majority of the period; small wick, large
  body.
- Small wick -> the candle supports expansion and may be traded in its direction.
- Large wick -> the candle does not support expansion; wait for the next candle.
- The filter is applied to each timeframe in the stack independently.
measurable:
- forward expansion distance bucketed by wick-to-BODY ratio (as opposed to wick-to-range)
- win rate of entries inside candles with wick/body < 1 versus >= 1
