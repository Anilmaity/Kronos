ambiguities:
- EARLIER RECORDING. No ranking among the five, and no rule for what to do when two conflict.
- '''Which Highs are likely to be taken'' is a judgement, not a test.'
- The counter-trend caveat ('we're in a bearish trend here so it's likely we couldn't displace over this
  High') is stated as context, not as a gate.
