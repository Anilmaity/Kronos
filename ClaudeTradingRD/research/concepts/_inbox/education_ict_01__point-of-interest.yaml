id: point-of-interest
name: Point Of Interest (POI)
aliases:
- higher time frame points of interest
- the five things I search for
category: entry
status: contested
definition: 'EARLIER RECORDING. Here the POI is given as a CLOSED LIST OF FIVE trigger types whose only
  job is to tell you when to drop to the execution timeframe and start hunting an entry model: (1) highs
  and lows - equal highs/lows, session highs/lows, daily highs/lows; (2) fair value gaps; (3) order blocks,
  including the point at which a fair value gap FILLS; (4) the OTE of a range; (5) internal range liquidity
  of a range, which often coincides with the OTE. The explicit purpose is negative - to stop you watching
  the lower timeframe all day.'
timeframes:
  htf:
  - 4H
  - 1H
  - 15m
  ltf:
  - 5m
  - 1m
  - 15s
  fractal: true
preconditions:
- The higher timeframes have been fixed relative to the execution timeframe.
detection_rules:
- Mark which highs and lows have already been taken and which are still likely to be taken; untaken equal
  highs/lows act as magnets.
- Mark fair value gaps on the paired higher timeframes.
- Mark order blocks, and the price at which a higher-timeframe fair value gap would be fully filled.
- Mark the OTE of the operative range.
- Mark internal range liquidity inside the range.
- When price reaches any of the five, drop to the execution timeframe and look for the entry model - and
  only then.
- 'Target selection after a sweep: internal range liquidity first, then the external highs/lows.'
invalidation:
- The level is consumed (fair value gap filled, high taken) without a model forming - move to the next
  POI.
measurable:
- share of the five POI types that actually produce a lower-timeframe model
- how often internal range liquidity is reached before external liquidity after a sweep
