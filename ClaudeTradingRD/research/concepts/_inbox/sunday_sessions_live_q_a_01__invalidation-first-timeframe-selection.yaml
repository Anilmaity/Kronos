id: invalidation-first-timeframe-selection
name: "Choose the Timeframe by Where the Stop Can Go"
aliases: ["what timeframe should I enter on", "stop first"]
category: entry
status: specified

definition: >
  He reframes the question of entry timeframe as the wrong question. Instead of asking which
  timeframe to enter on, ask where the invalidation can be placed: the level that can legitimately
  serve as the stop determines which timeframe the entry belongs on.

timeframes:
  htf: ["4H", "1H"]
  ltf: ["15m", "5m", "3m", "1m"]
  fractal: true

preconditions:
  - "A directional idea exists and a candidate level has been identified."

detection_rules:
  - "Identify the nearest level that would genuinely invalidate the idea if traded through."
  - "Select the timeframe on which that level is a structural swing."
  - "Enter on that timeframe rather than on a preferred default timeframe."

invalidation:
  - "No level exists that would invalidate the idea, in which case there is no trade."

execution:
  bias: "Unchanged."
  entry: "On the timeframe where the invalidation level is structural."
  stop: "At the identified invalidation level."
  targets: ["Sized in R from that stop; 2R described as normal"]

measurable:
  - "stop distance and realised R when timeframe is chosen by invalidation versus by habit"

sources:
  - video_id: 0AYGNc9czYc
    title: "New York Open Live Q&A"
  - video_id: uzPGXVYpVGc
    title: "Candle 2 Confirmations - Live Lesson, Q&A"

ambiguities:
  - "Genuine invalidation is defined only by example (protected swings, HTF wicks, SMT closure levels)."

python_detector: null
related: ["timeframe-alignment-pairs", "wick-trust-test", "continuation-order-block"]
