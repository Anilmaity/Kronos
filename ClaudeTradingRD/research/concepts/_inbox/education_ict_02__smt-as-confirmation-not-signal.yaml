id: smt-as-confirmation-not-signal
name: SMT As Confirmation, Not Signal
category: liquidity
status: contested
definition: 'THE TWO SMT VIDEOS IN THIS UNIT DISAGREE WITH EACH OTHER, and both readings are recorded.
  Reading A (q1NmxUTm4n4, the longer lesson): SMT is a confluence to an already existing model - when
  it forms he goes looking for a lower-timeframe entry model, and the SMT itself is never the trigger.
  Reading B (eHQ4nE-TQ2w): SMT can be traded DIRECTLY - enter on the diverging asset with the stop
  at the diverging low/high, because if that level is taken the divergence is invalidated. He presents
  B as one of two ways to trade an SMT, the second being the lower-timeframe structure-shift-plus-fair-value-gap
  entry, which he calls the safer of the two but notes it ''may not always present itself''.'
timeframes:
  htf:
  - 15m
  ltf:
  - 5m
  - 2m
  - 1m
  fractal: true
detection_rules:
- 'Reading A: on SMT, do not enter. Drop to a lower timeframe and take the entry from an existing
  model (deviation/box setup, structure break plus fair value gap, order block).'
- 'Reading B, direct entry: enter on the asset that is diverging, stop beyond the diverging low (bullish
  SMT) or high (bearish SMT).'
- 'Reading B, confirmed entry: after spotting the SMT, wait on the 1-to-5-minute chart for a market
  structure shift and a return to the fair value gap it leaves.'
- The confirmed entry is described as safer but as not always available.
measurable:
- win rate and R of the direct SMT entry vs the confirmed LTF entry on the same divergences
sources:
- video_id: q1NmxUTm4n4
  title: SMT Divergence - ICT Concepts
  quote: I personally use SMTs as a confluence to an already existing model.
- video_id: eHQ4nE-TQ2w
  title: Smart Money Divergences (SMT) - ICT Concepts
  quote: if these lows or highs are broken or taken the divergence is invalidated
- video_id: eHQ4nE-TQ2w
  title: Smart Money Divergences (SMT) - ICT Concepts
  quote: look for a lower time frame entry on the one through five minute charts
- video_id: eHQ4nE-TQ2w
  title: Smart Money Divergences (SMT) - ICT Concepts
  quote: this entry is safer but may not always present itself
ambiguities:
- The two videos are both in this older playlist and are not reconciled by the speaker.
- The later canon sides with Reading A (SMT as confirmation), so Reading B is the earlier and apparently
  superseded position - but it is the only place the corpus gives SMT its own invalidation level,
  which makes it independently useful.
- No rule says when the direct entry is permitted and when the confirmed entry is required.
