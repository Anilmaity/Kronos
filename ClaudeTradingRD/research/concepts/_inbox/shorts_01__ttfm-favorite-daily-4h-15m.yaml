id: ttfm-favorite-daily-4h-15m
name: His Favourite Pairing - Daily Bias / 4-Hour Swing Point / 15-Minute Entry
category: model
status: specified
definition: SHORTS EVIDENCE walking the pairing end to end under the title 'my favorite fractal model
  setup'. Failure swings are run out into a fair value gap and a daily candle 2 closure prints, which
  sets the bearish day. The 4-hour is then checked for its own candle 2 closure at the reversal structure.
  With both in hand, execution moves to the 15-minute, where the LOWER HALF of the 4-hour candle is
  the level that must be respected and the daily candle's wick is treated as already formed. The target
  chosen is the previous day low, the stop is placed either on the high or on the BODIES that made the
  high, and the trade is taken on the continuation after price reaches the T-spot / fair value gap -
  with 2R landing conveniently at that previous day low.
preconditions:
- A daily candle 2 closure has printed after failure swings were run into a point of interest.
- The 4-hour has printed its own candle 2 closure.
detection_rules:
- Require the daily candle 2 closure first - that sets the day's direction.
- Require a candle 2 closure on the 4-hour at the reversal structure.
- Drop to the 15-minute and require the lower half (bearish) of the 4-hour candle to be respected.
- Wait for price to reach the T-spot / fair value gap area, then for a continuation.
- 'Stop: on the high, OR on the bodies that made the high (two options offered).'
- 'Target: the previous day low, checked against 2R.'
measurable:
- R difference between the swing-high stop and the body stop on the same setups
- share of setups where 2R and the previous day low coincide
sources:
- video_id: zJLaABC_hM8
  title: Breaking Down My Favorite Fractal Model Setup
  quote: The lower half of this 4-hour candle
