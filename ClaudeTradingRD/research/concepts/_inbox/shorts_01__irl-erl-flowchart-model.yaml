id: irl-erl-flowchart-model
name: The Internal / External Range Liquidity Model (flowchart)
category: model
status: underspecified
definition: 'SHORTS EVIDENCE - three separate Shorts state the same four-step flowchart, which makes
  this the most repeated procedure in the unit. Step 1: establish a higher-timeframe (daily) bias. Step
  2: drop ONE timeframe to locate internal range liquidity (a fair value gap) and external range liquidity
  (the highs and lows). Step 3: depending on which is already taken, anticipate the rotation - external
  to internal, or internal to external. Step 4: drop to the lower timeframe, wait for a stop raid and
  a change in the state of delivery, and target roughly 2R. One Short adds the gate that the whole thing
  must occur within a kill zone; another asks the question the same way - whether the reach into internal
  liquidity happened during a kill zone.'
preconditions:
- A higher-timeframe (daily) directional bias exists.
- The reach into the liquidity must occur inside a kill zone.
detection_rules:
- 'Step 1: set the higher-timeframe bias.'
- 'Step 2: drop one timeframe and mark internal range liquidity (fair value gap) and external range
  liquidity (swing high / swing low).'
- 'Step 3a: bullish with internal liquidity in play -> require a swing low to form, target the external
  high.'
- 'Step 3b: external liquidity already taken -> anticipate rotation back into internal liquidity.'
- 'Step 4: on the lower timeframe wait for a stop raid, then a change in the state of delivery.'
- Target approximately 2R.
- 'Gate: the whole sequence must occur within a kill zone.'
measurable:
- hit rate of the internal->external and external->internal rotations per bias direction
- 2R hit rate of entries taken after the stop raid plus CISD
