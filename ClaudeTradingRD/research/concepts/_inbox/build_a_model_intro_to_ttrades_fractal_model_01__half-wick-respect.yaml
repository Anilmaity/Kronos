  quote: the main focus for Wix is marking out 0.5 of this Wick
- video_id: LKNQDAdId4s
  title: Master Candlestick Wicks - The Key To Catching Reversals
  quote: if the upper half of this Wick is not respected then it is likely
- video_id: tyoxl1l-6iI
  title: 'Candle 2 Closure: The Foundation of TTrades Fractal Model'
  quote: If it doesn't respect the 0.5, then it's likely to fail
- video_id: CKltGYiesHA
  title: Quit Moving Your Stop Loss Before You Know This (Trailing Stop Loss)
  quote: we want to see it respect 50% of this higher time frame candle
ambiguities:
- 'Two different 50% levels are used in the same corpus without being distinguished by name: 0.5
  of the WICK (body-to-extreme, this concept) and 0.5 of the CANDLE (the EQ / T-spot). The trailing-stop
  video says ''respect 50% of this higher time frame candle'', which is the candle EQ, not the wick
  half.'
- Whether the disrespect must be a body close or a wick through is stated as a close in the rules
  but shown both ways on the charts.
- No rule is given for which of the two halves to use when a candle has wicks on both ends.
