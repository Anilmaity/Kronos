    title: "TTrades Top-Down Chart Lessons #3"
  - video_id: w-JekHg6Ldk
    title: "TTrades Top-Down Chart Lessons #4"
  - video_id: UBTl7za9obc
    title: "TTrades Top-Down Chart Lessons #2"

ambiguities:
  - "These videos refer back to a separate candle 2 lesson and never restate the definition in full; the reconstruction above is from usage across the three walkthroughs."
  - "Whether the sweep must exceed the prior candle's extreme or merely a nearby liquidity pool is used inconsistently: previous day low in #2, a consolidation low in #2, and previous month's structure in #3."
  - "Whether the closure must be a body close back inside is not explicitly stated, though the speaker does say to focus on the bodies for the hourly confirmation."
  - "The auto-transcript renders candle 2 as candle to throughout video IzOQmcgLyA0."

python_detector: null
