ambiguities:
- '''Small wick'' vs ''large opposing run'' is never given a numeric threshold (no wick-to-body ratio,
  no percentage of range) anywhere in this unit, despite the whole trade/no-trade decision resting on
  it.'
- Whether the sweep must be of candle 1's wick extreme or its body extreme is not stated.
- The auto-captioner renders 'candle 2' as 'candle to' in the Weekly Profile series; in this unit the
  numeral is transcribed correctly throughout.
