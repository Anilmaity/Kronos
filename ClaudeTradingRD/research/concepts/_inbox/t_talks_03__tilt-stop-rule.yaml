id: tilt-stop-rule
name: "Rule-Based Step-Away (edge not in play)"
aliases: ["stepping away from the chart", "tilt rule", "revenge trading guard"]
category: psychology
status: underspecified

definition: >
  A pre-committed, rule-based trigger for stopping trading on a day, on the premise
  that the edge is simply not present that session. The guest insists the trigger must
  have structure - a specific count of losses, or a specific mix of wins and losses -
  and equally insists that the number itself is personal and cannot be prescribed. The
  emphasis is on compliance rather than on the parameter: he argues that setting the
  rule and then ignoring it when tilted is worse than not having one, and quantifies
  the cost roughly - if half your days are given back to tilt at a few percent each,
  the winning days stop compounding and the trader reads as flat despite a working
  model. He describes the honest failure mode explicitly: being stopped out and
  immediately framing another trade.

timeframes:
  htf: []
  ltf: []
  fractal: false

preconditions:
  - "A defined model, so that the statement that the edge is not in play is meaningful."

detection_rules:
  - "Pre-commit to a stop-trading trigger expressed as a count of losses or a win/loss mix for the session."
  - "On hitting the trigger, close the platform and do something else for the rest of the session."
  - "Treat framing a new trade immediately after a stop-out as the warning signal for tilt."

invalidation:
  - "Not applicable - this is a behavioural rule."

execution:
  bias: "n/a"
  entry: "n/a"
  stop: "n/a"
  targets: []

measurable:
  - "P&L of sessions continued past the Nth loss vs sessions stopped at the Nth loss"
  - "compliance rate with the pre-committed trigger"
  - "proportion of monthly loss attributable to trades taken after the trigger"

sources:
  - video_id: 1wKfc2gN4xg
    title: "Trader Kane | The Mind Behind a Multi-Million Dollar Day Trader"

ambiguities:
  - "The loss count is deliberately left unspecified - the speaker says the number differs for everybody - so the rule cannot be encoded without a user-supplied parameter."
  - "No re-entry condition is given - whether the trader resumes the next session, or after a review, is not stated."
  - "The percentage illustration of tilt cost is given conversationally and is not a measured figure."

python_detector: null
