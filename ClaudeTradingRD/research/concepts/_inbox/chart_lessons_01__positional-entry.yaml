id: positional-entry
name: "Positional Entry At An Invalidation On The Open"
aliases: ["positional entry", "let this swing into the next day", "into the overnight"]
category: entry
status: underspecified

definition: >
  An entry taken not on a lower-timeframe trigger but purely on location: when price opens
  right next to a freshly formed invalidation - a protected swing created by a close over a
  fair value gap - a position can be taken there and carried into the overnight session,
  letting the following day resolve it. The stop sits on the protected low and the target is
  the higher-timeframe draw. In the CAD futures example the sequence is: daily ideal candle
  2 closure, hourly protected swing, then a second and tighter protected swing, then price
  opens adjacent to that invalidation, and he enters when price is seen to respect it. The
  attraction is stated implicitly - the stop is small because the invalidation is close, so
  the position is already at 2R by the New York session without an intraday entry sequence.

timeframes:
  htf: ["1D"]
  ltf: ["1H"]
  fractal: false

preconditions:
  - "A confirmed higher-timeframe candle 2 closure with a defined draw."
  - "A recently formed protected swing on the hourly (price into a fair value gap, then a close over it)."
  - "Price opening near that protected swing."

detection_rules:
  - "Identify the most recent, tightest protected swing on the hourly."
  - "Require price to open near that level rather than extended away from it."
  - "Require price to respect the level (trade into it and hold) before entering."
  - "Place the stop on the protected swing and the target at the higher-timeframe draw."
  - "Hold through the overnight session; reassess at the New York session."

invalidation:
  - "The protected swing is taken out overnight."

execution:
  bias: "Direction of the daily candle 2 closure."
  entry: "At the invalidation level on the open, once respected."
  stop: "On the protected low (or high)."
  targets: ["previous month high or low", "equal highs or lows", "consolidation extreme on reassessment"]

measurable:
  - "overnight stop-out rate of positional entries at a protected swing"
  - "R at the New York session open for positions entered this way"
  - "difference in R between positional entries and same-idea intraday entries"

sources:
  - video_id: IzOQmcgLyA0
    title: "TTrades Top-Down Chart Lessons #3"

ambiguities:
  - "Right near an invalidation is not quantified - no maximum distance from the level is given."
  - "The actual trigger is the speaker seeing price respect the level, which is not defined as a rule (no candle closure or structure requirement is stated)."
  - "No condition is given for when a positional overnight entry is preferable to waiting for the session; it is demonstrated once, not taught as a rule."
  - "Overnight risk (gaps, news) is not discussed at all."

python_detector: null
related: ["protected-swing", "fractal-model-c2", "order-block", "rr-gated-entry-refinement"]
