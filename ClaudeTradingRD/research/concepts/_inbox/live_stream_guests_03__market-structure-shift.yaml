id: market-structure-shift
name: Displacement Plus A Close - And The Terms Are Interchangeable
aliases:
- MSS
- BOS
- break of structure
- change of character
category: structure
status: specified
definition: 'Stated by the host in two of the four videos in this unit: market structure break, market
  structure shift, break of structure and change of character are the same thing under different names,
  and what matters is the test rather than the label. His test has two parts - displacement, an energetic
  move, and a candle close beyond the structure being broken - and he explicitly rejects a wick or
  a small candle as sufficient. The guest states the same two criteria in the same stream (''one displacement
  and two closing above ... some structure for a change in trend''), and the ICT definition is read
  from the screen (episode six): price rallies above an old high or highs then quickly shifts lower,
  with significance placed on the word quick and on the displacement. The host''s practical use of
  it is negative: a level taken out with neither displacement nor a close is a liquidity grab, not
  a break of structure, and the higher-timeframe direction stands until the higher-timeframe intermediate-term
  low or high is taken.'
timeframes:
  htf:
  - 1H
  - 15m
  ltf:
  - 5m
  - 1m
  fractal: true
preconditions:
- A prior swing high or low on the working timeframe.
detection_rules:
- Terminology (MSS / MSB / BOS / CHoCH) is interchangeable; apply the test, not the label.
- Require displacement - an energetic move, not a wick and not a small candle.
- Require a candle close beyond the previous high (bullish) or previous low (bearish).
- Absent both, classify the event as a liquidity grab and keep the prior higher-timeframe direction.
- 'Resolve the grab-versus-break question on the higher timeframe: the trend stands until the higher-timeframe
  intermediate-term low/high is taken.'
invalidation:
- Price immediately reclaims the broken level without follow-through - the break was a grab.
measurable:
- continuation rate of breaks with a close and displacement vs wick-only breaks
- how often a lower-timeframe break against higher-timeframe direction fails
sources:
