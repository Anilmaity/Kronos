ambiguities:
- Displacement is never sized - no candle-range, ATR or body-ratio threshold anywhere in this unit.
- '''Quick'' carries no candle-count bound.'
- AM Trades disagrees within this same unit, reserving 'break' for an intermediate-term swing point
  being taken; the second and third quotes above come from the guest and from a screen reading of
  ICT rather than from the host, though the host states the interchangeability claim himself.
