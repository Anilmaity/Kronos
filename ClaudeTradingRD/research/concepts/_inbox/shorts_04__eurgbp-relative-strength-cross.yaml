ambiguities:
  - "The dollar direction is taken as given in both Shorts; how it was established is not shown."
  - "No rule is given for what to do when the cross and the individual closures disagree."
  - "The timeframe of the EURGBP closure used is the daily in one Short and unstated in the other."

