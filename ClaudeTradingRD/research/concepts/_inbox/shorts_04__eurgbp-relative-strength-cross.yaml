id: eurgbp-relative-strength-cross
name: "EURGBP As The Relative-Strength Cross For EU vs GU"
category: structure
status: specified
definition: >
  Two Shorts run the cross as a two-step decision. Step one: with a bullish dollar, the question
  is which of the two foreign currencies is weaker, because that is the one to trade. Step two:
  read EURGBP - if EURGBP is bullish then the euro is stronger than the pound, so the pound is
  the weaker leg and GBPUSD is the pair to focus on for a short. Both Shorts then cross-check the
  conclusion against the individual closures on EURUSD versus GBPUSD, treating a bearish closure
  through a series of up-closed candles on one and not the other as confirming confluence rather
  than as the primary signal.

timeframes:
  htf: ["1D", "4H"]
  ltf: ["1H", "15m"]
  fractal: true

detection_rules:
  - "Determine the dollar direction first."
  - "Read EURGBP: bullish EURGBP = euro stronger, pound weaker; bearish EURGBP = the reverse."
  - "With a bullish dollar, trade the weaker foreign currency against the dollar (short it)."
  - "Cross-check on the individual pairs: the weaker one should show the closure through the series of opposing candles that the stronger one lacks."
  - "Use the cross-check as extra confluence, not as the primary signal."

invalidation:
  - "The individual closures contradict the cross's reading."

measurable:
  - "agreement rate between the EURGBP read and the subsequent EU/GU performance spread"
  - "R outcome of trading the cross-selected leg vs the other"

