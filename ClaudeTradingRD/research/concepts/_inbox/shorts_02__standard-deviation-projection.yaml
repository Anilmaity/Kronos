id: standard-deviation-projection
name: Standard Deviation Projection Of The Manipulation Leg
category: entry
status: specified
definition: 'Three Shorts state the target-selection half of the tool as a pair of symmetric cases,
  which together amount to: take whichever comes FIRST, the projection or the liquidity. The anchor
  is always the manipulation leg, projected low to high in a bullish scenario. Case A - the manipulation
  leg is very large, so the projections land way beyond the logical liquidity targets: use the -1 or
  the liquidity as the target, because -2 to -2.5 does not make sense. Case B - the liquidity sits beyond
  the projections: take profit at the projection points and NOT the liquidity, because a retracement
  or reversal can occur before the liquidity target is reached. The third Short states the ideal: do
  not use projections as random targets, align them with the structure and liquidity on the chart, and
  the confluence (here, -2 and -2.5 landing on failure swings) is what makes the target trustworthy.'
timeframes:
  htf: []
  ltf: []
  fractal: true
preconditions:
- A manipulation leg has been identified and the fib projected across it.
detection_rules:
- 'Anchor: mark the manipulation leg, low to high in a bullish scenario.'
- 'Case A - the manipulation leg is very large and the projections land beyond the logical liquidity:
  use the -1, or the liquidity itself, as the target; -2 to -2.5 does not make sense.'
- 'Case B - the liquidity sits beyond the projections: take profit at the projection points, not the
  liquidity, because a retracement or reversal can come first.'
- 'Ideal case: the projection coincides with the liquidity (e.g. -2 / -2.5 landing on failure swings)
  - that confluence is what he wants.'
- Do not use projections as standalone random targets.
invalidation:
- Price retraces or reverses before the chosen target - the reason Case B exists.
measurable:
- hit rate of -1 targets on large manipulation legs versus -2/-2.5 targets
- hit rate of projection targets when they sit short of liquidity versus beyond it
