ambiguities:
- '"Very large" manipulation leg is the switch that demotes the target from -2/-2.5 to -1, and it is
  not quantified in the clip - it is described only as the projections landing "way beyond the logical
  liquidity targets", which is circular.'
- The first Short's transcript is truncated mid-sentence ("I will be using the negative one as a"),
  so the rest of that rule is lost.
- The two cases together imply a "take the nearer of projection and liquidity" rule, but neither Short
  states that generalisation - it is an inference and is recorded here as one.
- No rule is given for how close a projection and a liquidity level must be to count as aligned.
