ambiguities:
- '''Expansion'' itself has no size threshold; the whole flowchart is anchored on an undefined primitive.'
- '''Slow shallow move'' (retracement) vs a fast counter-move (reversal) is judged visually; only the
  protected-swing test is mechanical.'
- In the scalping video a consolidation is called a continuation signature outright, while the flowchart
  makes it a branch that can go either way -- the difference is that the bias resolves the branch, but
  this is stated only in the flowchart video.
