id: ic-cisd
name: Intracandle CISD (IC-CISD)
category: entry
status: specified
aliases:
- intra candle change in the state of delivery
- letting the wick form
definition: 'The channel''s own invention, stated as such: a change in the state of delivery applied
  INSIDE a continuation candle in order to MECHANICALLY DEFINE THE FORMATION OF A WICK. In candle
  3 of a bullish sequence the candle opens with a short-term BEARISH trend while it forms its lower
  wick; when that intracandle trend shifts to bullish - the same point-of-interest-plus-closure test,
  producing a protected swing inside the candle - the wick is declared formed and the body can be
  traded. The whole concept exists to answer one question mechanically: has this candle finished
  making its wick? It applies to candle 4 as well as candle 3.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 1H
  - 15m
  - 5m
  - 1m
  fractal: true
preconditions:
- A confirmed candle 2 (or candle 3) closure with its own reversal CISD.
- The continuation candle has opened.
detection_rules:
- Inside the continuation candle, wait for price to reach a point of interest against the intended
  direction (a fair value gap, or a high/low swept) - ideally inside the T-spot.
- Identify the series of opposing candles into that point of interest.
- Require a close through that level - this is the intracandle CISD, and it forms a protected swing
  inside the higher-timeframe candle.
- Once formed, treat the higher-timeframe wick as complete and trade the body away from it.
- 'TIMING RULE: it is ideal for the IC-CISD to form EARLY in the candle so the candle has time and
  range to expand. If it forms late in the candle but is still valid, wait for the NEXT candle -
  it brings new range.'
- A point of interest too far into the candle (e.g. a gap high above the T-spot) is explicitly not
  wanted, because from there expansion is less likely.
- New continuations forming later inside the same candle are additional valid entries.
invalidation:
- The protected swing formed by the IC-CISD is taken out.
- Price spends too long consolidating instead of producing the closure - the continuation can fail.
execution:
  bias: Direction of the higher-timeframe candle.
  entry: On the close of the IC-CISD or on its retest.
  stop: On the intracandle protected swing - on the bodies where that is needed for 2R.
  targets:
  - 2R
  - previous day / previous candle extremes
measurable:
- distance from candle open to the IC-CISD, expressed as a fraction of the candle's duration, vs
  subsequent expansion (the early-vs-late claim is directly testable)
- share of continuation candles that produce an IC-CISD at all
- R distribution of IC-CISD entries vs positional entries at the open
