id: post-trade-journaling-protocol
name: "Post-Trade And Post-Session Journaling Protocol"
aliases: ["how to journal a trade"]
category: psychology
status: specified

definition: >
  After every trade: post a chart markup, then record how you felt before the trade, during
  the trade (hand on the mouse, staring at the screen) and after it. The "after" entry is
  written later in the day rather than immediately, on the reasoning that if a loss still
  registers twelve hours later that is the thing worth working on. Then record what was done
  well (limits set properly, stop and target placed properly, runners held) and what was done
  badly (taking full profit at 1R, breaking the risk protocol). A post-session note is
  written every session whether or not a trade was taken. Two diagnostics are attached to
  in-trade anxiety: either the position is oversized, or the entry technique has not been
  back-tested enough to have muscle memory.

timeframes:
  htf: []
  ltf: []
  fractal: false

preconditions:
  - "A trading session has completed (traded or not)."

detection_rules:
  - "Post a chart markup for every trade taken."
  - "Record feelings before, during and after; write the 'after' entry later in the day."
  - "Record what was done well and what was done badly, referencing the model's own rules."
  - "Write a post-session note every session, including no-trade sessions."
  - "If in-trade anxiety was present, check for oversizing first and insufficient back-testing second."

invalidation:
  - "Not applicable - process rule."

measurable:
  - "journal completion rate"
  - "correlation between logged anxiety and position size / realised R"

sources:
  - video_id: G44VpidBD_U
    title: "NickDoesFutures | Unicorn Model & Experiences With ICT"
    quote: "not necessarily about doing anything more as a Trader it's about doing less"

ambiguities:
  - "No template or storage format is specified."
  - "The anxiety-to-cause mapping (oversizing or under-testing) is offered as personal observation, not evidence."

python_detector: null
related: ["model-vs-entry-pattern", "weekly-written-game-plan", "less-trades-more-capital"]
