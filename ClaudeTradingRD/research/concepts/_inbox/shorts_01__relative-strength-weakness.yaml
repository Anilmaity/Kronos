id: relative-strength-weakness
name: Relative Strength & Weakness (ES / NQ / YM)
category: structure
status: specified
definition: SHORTS EVIDENCE isolating one of the three named inputs - SEPARATION - and showing how it
  is measured. The same previous high is marked on both correlated assets, and the question asked of
  each is how CLOSE it is to that shared high. In the worked example the S&P sits only a few points
  away while the Nasdaq is quite far away; that difference in separation is itself the relative strength
  reading. He states this is one of three things to combine, and that practising the combination is
  what builds the understanding.
preconditions:
- Two correlated assets are charted on the same timeframe.
- A shared reference level (a previous high or low) exists on both.
detection_rules:
- Mark the SAME previous high (or low) on both assets.
- Measure how far each asset currently sits from that shared level.
- The asset closer to the level is the stronger one on that side; the further asset is weaker.
- Combine separation with the other two inputs rather than using it alone.
measurable:
- correlation between separation-rank at a level and which asset takes the level first
- forward return spread between the near and far asset
sources:
- video_id: Gpp8vicZo10
  title: Asset Separation Shows Relative Strength & Weakness
  quote: the separation between those assets also shows you the relative strength and weakness
- video_id: Gpp8vicZo10
  title: Asset Separation Shows Relative Strength & Weakness
  quote: How close are we to that high on Nasdaq
ambiguities:
- Separation is measured in POINTS, which is not comparable across instruments with different point
  values - no normalisation (ATR, percentage) is given.
- The other two of the 'three things' are referred to but not named in this Short.
