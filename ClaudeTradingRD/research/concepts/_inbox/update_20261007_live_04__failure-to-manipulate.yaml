id: failure-to-manipulate
name: Failure To Manipulate (deflated to phases of price)
category: structure
status: specified
voice: ttrades
definition: 'Used live as the branch of an if-then: if price fails to form the reversal at the expected
  level, that is a failure to manipulate and price heads to the other level; if it reacts, the original
  idea stands.'
detection_rules:
- 'At the expected reversal level: no reversal formed = failure to manipulate, target the other level;
  reaction formed = keep the original idea.'
