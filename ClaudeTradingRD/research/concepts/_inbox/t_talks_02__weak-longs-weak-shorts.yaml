id: weak-longs-weak-shorts
name: "Weak Longs And Weak Shorts"
aliases: ["displacement equals attention", "chasing the displacement"]
category: psychology
status: specified

definition: >
  Fast displacement attracts attention, and attention produces two crowds of poorly
  positioned participants: weak longs, who buy the breakout because they feel they missed
  the move, and weak shorts, who sell into it early trying to call the top. The subsequent
  retracement into discount forces the weak longs into drawdown until they capitulate, and
  the next expansion leg removes the weak shorts. The instruction is to be neither - to
  wait for price to return into a discount array rather than chase the leg that created the
  excitement.

timeframes:
  htf: ["1D", "4H"]
  ltf: ["1H", "15m"]
  fractal: true

preconditions:
  - "A displacement leg has occurred and is visible / being discussed."

detection_rules:
  - "A fast one-sided move occurs; social attention on the asset increases."
  - "Buyers entering after the displacement, above the prior range, are weak longs."
  - "Sellers entering counter-trend into the displacement are weak shorts."
  - "Expect a retracement below equilibrium of the range that flushes the weak longs, then continuation that removes the weak shorts."

invalidation:
  - "Price never returns below equilibrium before continuing (the trade is simply missed)."

measurable:
  - "frequency with which price retraces below 50% of a displacement leg before continuing"
  - "drawdown suffered by an entry taken at the top of a displacement leg vs at discount"

sources:
  - video_id: nncJGt6j19Q
    title: "Gene | Align Yourself For High Probability Trades"

ambiguities:
  - "The range whose equilibrium is measured is not specified."
  - "This is a behavioural narrative rather than a measurable market variable; the Bitcoin 2021 example is illustrative, not evidential."

python_detector: null
related: ["discount-requirement-before-entry", "weekly-candle-institutional-profile"]
