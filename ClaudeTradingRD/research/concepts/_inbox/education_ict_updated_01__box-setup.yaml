id: box-setup
name: Box Setup
aliases:
- deviation from the range
- aggressive out, aggressive back in
category: entry
status: specified
definition: Resting liquidity — usually an old high or low, or a consolidation range — is taken by an
  aggressive move OUT of the range, which is then met by an aggressive move BACK INTO the range. The
  excursion is the 'deviation from the range'. The trade is the retest of that deviation. He states
  outright that this is the same thing as power of three / accumulation-manipulation-distribution, and
  that the aggressive-out-aggressive-in requirement exists because that is what forms the WICK on a
  higher timeframe.
timeframes:
  htf:
  - 1D
  - 4H
  ltf:
  - 15m
  - 5m
  - 1m
  - 30s
  fractal: true
preconditions:
- 'Resting liquidity: an old high/low, or a consolidation range.'
detection_rules:
- Mark the range. Default to the BODIES; on the daily timeframe he switches to the WICKS.
- Price must move aggressively out of the range (taking the liquidity).
- Price must then move aggressively BACK into the range — this is the load-bearing condition.
- 'Mark the deviation: the highest bodies (bearish) or lowest bodies (bullish) that were run.'
- Entry on the retest of that deviation level.
- 'Fallback when no range is identifiable: wait for displacement over highs, then look left at which
  highs were run and mark the highest body.'
- 'Exception: when the body level sits too far from the extreme, he uses the wick instead.'
invalidation:
- No aggressive move back into the range — he does not look for the reversal.
- Price fails to hold the deviation level on the retest.
execution:
  bias: Back into and through the range, away from the swept side.
  entry: Retest of the deviation from the range.
  stop: On the current high (bearish) / low (bullish) — i.e. beyond the manipulation extreme.
  targets:
  - Whatever liquidity rests on the other side of the range
  - 2R before runners in one example
measurable:
- hit rate of deviation retests reaching the opposite side of the range
- difference in outcome using bodies vs wicks to define the range
