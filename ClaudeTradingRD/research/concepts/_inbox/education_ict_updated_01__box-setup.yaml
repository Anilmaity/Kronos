ambiguities:
- '''Aggressive'' is never quantified in either direction; it is the single decision the whole model
  turns on.'
- Bodies-by-default / wicks-on-the-daily is a stated habit with one explicit exception ('when the body
  level would be too far'), not a rule with a threshold.
- Whether the move back in must close inside the range or merely trade inside is not stated.
