ambiguities:
- NO RULE LOCATES THE CURVE. Nothing says where the buy side ends and the sell side begins - it is not
  tied to the range equilibrium, to a swing, or to a timeframe. Not decidable as stated.
- 'The transcript is internally confusing on which side is which: ''we''re on the buy side of the curve
  right so we''re moving up'' but later ''you''re trying to enter long on a cell side of the curve'' as
  the described ERROR. The intent - do not fade the direction price is currently seeking - is clear; the
  labelling is not. Auto-caption renders ''sell'' as ''cell'' throughout.'
- Its relationship to premium/discount is implied but never stated as identity.
