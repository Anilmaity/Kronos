id: market-curve-side
name: Buy Side vs Sell Side Of The Curve
aliases:
- buy side of the curve
- cell side of the curve
- sell side of the curve
category: structure
status: underspecified
definition: A positional filter he uses to decide whether a level is likely to hold or to be run through.
  Price is treated as sitting on one side of a curve; on the sell side of the curve price is seeking liquidity
  below and discount PD arrays are expected to support it, while on the buy side premium PD arrays are
  expected to RESIST price. The operational consequence he states twice is that trades taken against the
  curve - looking for a reversal on the wrong side - tend to be run straight through, and that this is
  the diagnosis for repeatedly getting stopped out at otherwise valid levels.
timeframes:
  htf:
  - 4H
  - 1H
  - 15m
  ltf:
  - 5m
  - 1m
  fractal: true
preconditions:
- A range or dealing range with an identifiable high and low.
detection_rules:
- Locate where price sits within the operative range - moving up = one side of the curve, moving down
  = the other.
- On the sell side of the curve, expect price to keep seeking the liquidity below rather than reverse
  at a level.
- On the buy side of the curve, expect premium PD arrays (e.g. an order block above) to RESIST price.
- Do not look for a reversal long while price is still on the side of the curve that is seeking lower
  liquidity.
invalidation:
- Price transitions to the other side of the curve (a new extreme / a reversal).
measurable:
- reaction rate at a PD array taken with the curve vs against it
- share of stop-outs attributable to counter-curve entries
