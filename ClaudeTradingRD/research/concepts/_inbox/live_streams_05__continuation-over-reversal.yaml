id: continuation-over-reversal
name: Continuation-Only Doctrine
category: model
status: contested
definition: 'Asked directly whether he is more of a reversal or a continuation trader he answers continuation,
  and states the single exception: he will trade a reversal when his bias is very strong, which the
  same session''s gold read did not satisfy. The design of the indicator encodes the same preference
  - the early candle-2 display is off by default because he does not want people learning the model
  to trade candle 2, which he calls more complex, and the advancement path he describes is to trade
  C3 and C4 first and learn to trade C2 only later.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  fractal: true
preconditions:
- A printed model with both a reversal candle and continuation candles.
detection_rules:
- Default to the continuation (C3, C4) rather than the reversal (C2).
- Take the reversal only when the bias is very strong.
- For a learner, trade C3 and C4 after a valid model prints; add C2 later.
invalidation:
- Not applicable - a selection preference.
measurable:
- win rate and R of C2 entries vs C3/C4 entries on the same models
sources:
- video_id: sdZkE-naNiY
  title: TTrades Indicator Updates - Walkthrough and Q&A
  quote: I'll trade reversals in the case that it's very strong on my bias
ambiguities:
- '''Very strong bias'' is the only gate for taking a reversal and is not quantified.'
- The library entry for this id is already contested across units; this unit supports the continuation-preferred
  reading with an explicit exception rather than an absolute ban.
related:
- fractal-model-c2
- fractal-model-c3
- fractal-model-c4
- early-cisd
- dont-trade-after-expansion
contributing_units:
