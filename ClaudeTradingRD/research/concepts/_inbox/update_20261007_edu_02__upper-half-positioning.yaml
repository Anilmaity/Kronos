id: upper-half-positioning
name: Position in the Upper Half of the Swing-to-Target Range
category: entry
status: specified
voice: ttrades
aliases:
- short in a premium of the dealing range
definition: >
  The dedicated dealing-range video restates the rule with a numeric floor: shorts are taken in the
  premium or around the EQ of the range from the swing being traded away from to the target; at 25%
  of that range or lower he is no longer looking for shorts because 2R is unavailable before the
  target. Entries near the target also risk a new phase of price (consolidation or reversal) and
  'keep you out of consolidation moves' when avoided.
preconditions:
- A swing to trade away from and a defined target exist (the dealing range).
detection_rules:
- Shorts acceptable from the EQ upward; reject shorts at or below 25% of the swing-to-target range.
- Mirror for longs (reject above 75%, inferred).
invalidation:
- Entry location at or beyond 25% from the target end.
measurable:
- 2R hit rate of shorts by entry location (above EQ, EQ-25%, below 25%)
sources:
- video_id: yb3Te7tiGRk
  title: Understanding Dealing Ranges in Trading (Get Better Risk Reward)
  quote: that is where I'm not really looking for shorts
- video_id: yb3Te7tiGRk
  title: Understanding Dealing Ranges in Trading (Get Better Risk Reward)
  quote: It's okay if I'm entering right around that EQ point
ambiguities:
- Between the EQ and 25% is a grey zone; he calls a setup there worse but not forbidden.
related:
- dealing-range
- premium-discount
