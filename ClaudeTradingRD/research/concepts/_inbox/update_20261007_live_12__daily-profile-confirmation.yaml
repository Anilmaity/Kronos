id: daily-profile-confirmation
name: Daily Profile Must Confirm the Daily Bias
category: model
status: contested
voice: ttrades
definition: 'Index example: after multiple days of expansion and an overnight expansion over all-time/previous
  highs, the hourly shows only failure swings up, which he reads as not bullish in daily-profile terms;
  he can therefore only frame the downside, expecting a 9:30 manipulation and move lower or a consolidation.
  When the open chopped he kept the bias rather than flipping to match chat.'
detection_rules:
- If the instrument has already expanded over previous (all-time) highs overnight and the intraday profile
  shows only failure swings up, do not frame longs; frame only a reversal lower or expect consolidation.
ambiguities:
- The outcome contradicted the framing (YM reversed and indices were bullish after 10:00); no trade was
  taken either way.
sources:
- video_id: rTomJ8URFnw
  title: New York Open Live Q&A
  quote: I can't trade long when my daily profile looks like this
- video_id: rTomJ8URFnw
  title: New York Open Live Q&A
  quote: normally on a day like this, you either consolidate or you have a reversal.
- video_id: rTomJ8URFnw
  title: New York Open Live Q&A
  quote: So, I stick with my bias.
