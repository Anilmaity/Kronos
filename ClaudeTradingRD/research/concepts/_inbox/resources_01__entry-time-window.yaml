id: entry-time-window
name: Entry Time Window (and rejection of kill zones)
definition: 'The tightest one-line statement of his trading window found in this unit, said while
  explaining why he only marks up the lower timeframes for part of the day: he only looks to take
  trades between 08:30 and 12, that is the session he is trading, and he does not care much for price
  action outside it. The 5-minute markup in the worked example runs from before 08:30 (a low-risk
  sell not taken), through the 08:30 release, to the 09:30 open.'
category: time
status: contested
aliases:
- 8:30 to 12
- the session I am trading
- New York morning
preconditions:
- Instrument is a US index future (ES / NQ in the examples).
detection_rules:
- Trades are only taken between 08:30 and 12.
- Lower-timeframe (15-minute, 5-minute) chart work is confined to that window; price action outside
  it is not analysed.
- The 08:30 and 09:30 opening prices bound the part of the session that is marked up.
invalidation:
- Not applicable - a time filter.
measurable:
- share of the corpus's setups that occur inside 08:30-12
- expectancy of entries inside the window versus outside it
sources:
- video_id: wrIZ7CAuFCc
  title: How To Journal Everyday For Trading
  quote: I only look to take trades between 8:30 and 12
- video_id: wrIZ7CAuFCc
  title: How To Journal Everyday For Trading
  quote: this is the session I am trading
ambiguities:
- No timezone is spoken in this video; the corpus elsewhere fixes bare clock times to New York, and
  the TradingView video in this same unit shows the chart set to New York local time.
- 12 is stated as the outer bound here; other units in the corpus give 10:00, 10:30 or 11:00 as the
  practical cut-off. This is the widest of them.
- The window is stated for index futures; nothing is said about other asset classes.
- '''Kill zone'' is never named in this unit, so this window is not presented as one.'
