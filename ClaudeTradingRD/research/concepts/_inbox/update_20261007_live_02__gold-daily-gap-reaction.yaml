id: gold-daily-gap-reaction
name: Gold Respects Daily Fair Value Gaps (pull back, then move away)
category: structure
status: underspecified
voice: ttrades
aliases:
- daily gap
- daily imbalance
definition: 'An asset-specific observation on XAUUSD: gold has lately been very good about pulling back
  into daily gaps and moving away from them. On the day, gold traded down into a daily gap/imbalance;
  his plan was to wait for a nice displacement up out of it on the hourly chart and then target the high
  above (possibly in Asia that night or the next day).'
timeframes:
  htf:
  - 1D
  ltf:
  - 1H
  fractal: false
preconditions:
- A daily fair value gap below (bullish case) that price has traded into.
detection_rules:
- Price trades into a daily FVG.
- Require hourly displacement out of the gap before acting.
- Target the nearest swing high above.
invalidation:
- No hourly displacement out of the gap; price closes through it.
execution:
  bias: Away from the daily gap (bullish from a gap below).
  entry: After hourly displacement out of the gap (entry model not stated).
  stop: Not stated.
  targets:
  - The swing high above
measurable:
- rate at which XAUUSD reverses from a first touch of a daily FVG vs closes through it
sources:
- video_id: h1ZQWWQDhKA
  title: TTrades MNQ Cup - Afternoon Session
  quote: gold did reach into that weekly that daily gap
- video_id: h1ZQWWQDhKA
  title: TTrades MNQ Cup - Afternoon Session
  quote: gold has been very very good about we're pulling back to uh daily gaps
ambiguities:
- Recency claim ('has been') - no period given; it may be regime-specific.
- He self-corrects between weekly/daily and 4-hour/hourly in the caption; daily gap and hourly displacement
  is the final reading.
- Explicitly not a competition (MNQ) idea; a passing remark, not a taught model.
