id: silver-bullet-window
name: "Silver Bullet Window"
aliases: ["Silver Bullet", "the one hour window"]
category: time
status: underspecified

definition: >
  A one-hour window inside a killzone, in New York time, during which the speaker looks for
  price to draw to a liquidity pool. The only window actually named and demonstrated in this
  video is 10:00-11:00 New York time, marked either with vertical timestamp lines or by
  repurposing the indicator's "New York lunch" session box. He explicitly defers the detail to
  ICT's own channel.

timeframes:
  htf: ["1D"]
  ltf: ["15m", "5m", "1m"]
  fractal: false

preconditions:
  - "Chart on New York time."
  - "An identified draw on liquidity."

detection_rules:
  - "silver_bullet_window := 10:00-11:00 New York time (the only window stated in this unit)."
  - "Inside the window, look for a setup delivering price to an already-identified liquidity pool."

invalidation:
  - "Not stated."

execution:
  bias: "Inherited from the draw on liquidity."
  entry: "Not specified in this video."
  stop: "Not specified."
  targets: ["the identified liquidity pool"]

measurable:
  - "frequency with which a liquidity pool is reached during 10:00-11:00 NY"
  - "share of daily range delivered inside the window"

sources:
  - video_id: MPeeE55rNOw
    title: "ICT Killzones & Indicator Settings"

ambiguities:
  - "Only ONE Silver Bullet window is named here; whether other windows exist is not addressed, and the topic is explicitly delegated to ICT's channel."
  - "No entry, stop or target rules are given — the video covers only how to draw the window on the chart."
  - "Whether the window applies to forex, indices, or both is not stated."

python_detector: null
related: ["killzones", "draw-on-liquidity", "session-high-low"]
