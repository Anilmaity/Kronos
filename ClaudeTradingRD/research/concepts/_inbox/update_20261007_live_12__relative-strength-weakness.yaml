id: relative-strength-weakness
name: Relative Strength & Weakness (ES / NQ / YM)
category: structure
status: contested
voice: ttrades
definition: 'Live evidence that the ranking flips intraday: pre-open NQ strongest/YM weakest; after 9:30
  ES held up when it should have been lowest, then NQ became weakest, then YM weak/NQ strong again. He
  resolves the ''which is lying'' question only by waiting for candle closures (first 5, maybe 15 minutes)
  and states that if both are lying the result is consolidation.'
detection_rules:
- Repeated strength switches between the correlated indices after the open are read as consolidation/chop,
  not a tradeable divergence.
sources:
- video_id: rTomJ8URFnw
  title: New York Open Live Q&A
  quote: You just kind of wait for closures to tell you, right?
- video_id: rTomJ8URFnw
  title: New York Open Live Q&A
  quote: They could both be lying and then you end up with a consolidation
