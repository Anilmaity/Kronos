  - 5m
  ltf:
  - 15s
  fractal: true
preconditions:
- n/a
detection_rules:
- 'Pair: 5-minute swing point -> 15-second execution.'
- If the usual pairing shows no model, look for one on a lower pair rather than declaring no setup.
invalidation:
