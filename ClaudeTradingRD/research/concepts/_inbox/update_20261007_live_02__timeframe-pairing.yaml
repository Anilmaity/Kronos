id: timeframe-pairing
name: Timeframe Pairing (context / swing point / entry)
category: time
status: contested
voice: ttrades
definition: 'Adds the 5-minute -> 15-second pair: ''if you want to trade the 15-second model, that would
  be a five minute swing point, 15 second.'' Answering ''no TTFM today'' he says there is always a fractal
  model somewhere, only the timeframe changes. The afternoon game trades with Nick were all 5-minute structure
  / 15-second (and 5-second) executions.'
timeframes:
