id: expansion-signature
name: "Expansion Signature"
category: structure
status: specified
definition: >
  A 39-second Short gives a complete three-part statement of expansion: what it is, when to
  expect it, and how to interact with it. It is a one-sided aggressive move with very shallow
  retracements, if any at all. It is expected to follow a consolidation or a retracement, on the
  stated ground that small ranges lead to large ranges and large ranges lead to small ranges. To
  participate, wait for price to retrace into an important level (generally a fair value gap),
  require a close over the series of down-closed candles, and only then is there an invalidation
  to place a stop against and a trade to take.

timeframes:
  htf: ["1D", "4H"]
  ltf: ["1H", "15m", "5m"]
  fractal: true

detection_rules:
  - "Expansion = a one-sided move whose counter-trend retracements are very shallow or absent."
  - "Expect expansion after a consolidation or a retracement (small range -> large range -> small range)."
  - "Do not enter into the expansion itself; wait for a retracement into an important level, generally a fair value gap."
  - "Require a close over the series of down-closed candles at that level to create the invalidation."
  - "Take the entry only once that protected low exists."

invalidation:
  - "A deep rather than shallow retracement."
  - "No close over the opposing candles at the level."

measurable:
  - "retracement depth distribution within moves classified as expansion"
  - "frequency of expansion following consolidation vs following retracement"

sources:
  - video_id: 46VIOAlxmEE
    title: "When to Expect Expansion & How to Interact"
    quote: "An expansion is a one-sided aggressive move that has very shallow retracements"
  - video_id: 46VIOAlxmEE
    title: "When to Expect Expansion & How to Interact"
    quote: "I expect it to occur following consolidation or retracement"
  - video_id: 46VIOAlxmEE
    title: "When to Expect Expansion & How to Interact"
    quote: "small ranges lead to large ranges, and large ranges lead to small ranges"

ambiguities:
  - "'Aggressive' and 'very shallow' are both used inside the definition and neither is quantified."
  - "'Small range' and 'large range' are relative terms with no reference period."
  - "'Important level' is given only as 'generally a fair value up' (captions: 'gap')."

python_detector: null
related: ["phases-of-price", "continuation-order-block", "retracement-phase", "consolidation-phase", "expansion-sequence-quality"]

voice: ttrades
contributing_units: [shorts_04]
draft_count: 1
