detection_rules:
- Do not run Day's Quarter Theory as a separate framework.
- Where a quarter-theory level is quoted, treat it as a session open or a higher-timeframe candle open
  and read power of three from it.
invalidation: []
measurable:
- agreement rate between quarter-theory levels and higher-timeframe candle opens
