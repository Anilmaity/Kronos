id: macros-are-htf-opens
name: Day's Quarter Theory Is Just Power Of Three On Session Opens (and is not used)
aliases:
- DQT
- quarterly theory
category: time
status: specified
definition: 'Asked whether he applies Day''s Quarter Theory, TTrades says he does not, and gives his
  reduction of it in the same breath: it is basically power of three based on sessions, or on the opens
  of different timeframes. The claim is that the theory adds a vocabulary rather than a mechanism already
  absent from the power-of-three read he already runs.'
