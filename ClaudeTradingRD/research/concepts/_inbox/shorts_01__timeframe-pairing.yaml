id: timeframe-pairing
name: Timeframe Pairing (context / swing point / entry)
category: time
status: specified
definition: 'SHORTS EVIDENCE for the alignment requirement inside a pair, stated as a directional condition
  rather than a table. The rule given is that the lower-timeframe setup must MATCH the higher-timeframe
  structure in direction: a 5-minute bearish setup that aligns with the hourly bearish structure is
  what produces expansion conditions. Two concrete pairs are worked in this unit - hourly context with
  5-minute entry, and 30-minute context with 3-minute entry - and in both the instruction on reaching
  the higher-timeframe point of interest is to WAIT for the lower timeframe to align before entering.'
preconditions:
- A higher-timeframe structural direction has been established.
- Price has reached into the higher-timeframe point of interest.
detection_rules:
- On reaching the HTF point of interest, wait for the LTF to align in the same direction.
- Require the LTF setup direction to match the HTF structure direction - alignment is the trigger.
- 'Worked pairs in this unit: 1H context / 5m entry, and 30m context / 3m entry.'
- Once aligned, the conditions are set for expansion - enter, stop on the swing, target 2R.
invalidation:
- The lower timeframe never aligns - no trade.
measurable:
- share of HTF POI taps that produce an aligned LTF setup
- 2R hit rate by pairing (1H/5m versus 30m/3m)
sources:
- video_id: lvM278EeQlw
  title: 5 Minute Entry Aligned with Higher Time Frame Structure
  quote: a 5-minute bearish setup that aligns with the hourly bearish structure
- video_id: XwL3Hy9za7M
  title: 30m Structure → 3m Entry
  quote: I want to wait for this to align with my higher timeframe
ambiguities:
- The 30m/3m pair is demonstrated but never stated as a rule - it is inferred from the chart used.
- No time limit is given for how long to wait for alignment before abandoning the level.
