ambiguities:
- Session boundaries are never given as clock times in this unit - Asia / London / New York are used
  without hours, and no timezone is named in these two videos.
- '''I don''t trust an hourly closure this early'' is a judgement, applied inconsistently: an hourly
  closure is refused in Asia and London but accepted in New York.'
- Whether the 4-hour closure and the hourly CISD are alternatives or should both be present is stated
  as 'either' in the framework and as 'both checked off' in the worked example.
