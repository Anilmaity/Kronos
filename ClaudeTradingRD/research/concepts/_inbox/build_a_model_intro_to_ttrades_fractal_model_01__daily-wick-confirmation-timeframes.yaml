id: daily-wick-confirmation-timeframes
name: 'Confirming The Day''s High Or Low: Which Timeframe, By Session'
category: time
status: specified
aliases:
- intraday reversal
- has the daily candle formed its wick
definition: 'The most explicit session-to-timeframe map in the corpus. The single question asked
  all day is ''has the daily candle formed its wick?''. Two instrument types answer it - a change
  in the state of delivery, or a candle closure - and which timeframe you use depends on session
  volatility, because Asia is slower than London which is slower than New York. ASIA: hourly CISD,
  or a 4-hour candle closure. LONDON: 15-minute or 30-minute CISD, or a 4-hour candle closure. NEW
  YORK: 5-minute or 15-minute CISD, or an hourly candle closure (sometimes 30-minute). A higher-timeframe
  CISD is always acceptable if it has occurred; the reason for dropping down in New York is that
  waiting for the hourly CISD there leaves you behind the move.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 30m
  - 15m
  - 5m
  - 3m
  fractal: true
preconditions:
- A daily bias exists (C2/C3 closure); the day's extreme has not yet been confirmed.
detection_rules:
- 'Asia: require an hourly CISD or a 4-hour candle closure. Do not trust an hourly candle closure
  alone this early.'
- 'London: require a 15-minute or 30-minute CISD, or a 4-hour candle closure.'
- 'New York: an hourly candle closure, or a 5-minute / 15-minute CISD; 30-minute closure sometimes.'
- A higher-timeframe CISD always counts if it has already occurred; the session map is a floor, not
  a ceiling.
- The candle closure used must itself be a C2 or C3 closure at a point of interest, read in respect
  of the daily equilibrium.
- 'Typical New York shape: an opposing move at 9:30, then the 09:00-10:00 candle closes as a C2,
  and the 10:00 candle is the tradeable C3.'
- Pre-open entries are taken on the 15-minute rather than the 5-minute, because 5-minute pre-market
  structure gets swept.
- 'Confluence is preferred: an hourly CISD together with a 4-hour candle closure is the stated ''both
  checked off'' state.'
- The level being confirmed need not be the literal high/low of the day - it need only be a high
  or low to trade away from.
invalidation:
- The confirmed extreme is traded through.
- 'Bias was wrong: the confirmation can be mechanically correct and the trade still fails.'
measurable:
- share of true daily extremes confirmed within N bars by each session's prescribed instrument
- lateness cost of waiting for the hourly CISD in New York vs the 5-minute CISD
