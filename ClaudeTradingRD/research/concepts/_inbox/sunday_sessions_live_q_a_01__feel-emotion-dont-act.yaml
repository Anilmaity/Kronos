id: feel-emotion-dont-act
name: "Feel the Emotion, Do Not Act On It"
aliases: ["you cannot be a robot", "tilt management"]
category: psychology
status: specified

definition: >
  He rejects the common instruction to feel no emotions while trading as impossible, and relocates
  the discipline to the gap between feeling and acting. The change a trader must make is to feel
  the emotion and not act on it; a small realised loss taken while stepping away (his live example:
  a viewer who felt tilt, closed the trade and moved to paper at minus one hundred dollars) is a
  success because it preserves the ability to trade the next day.

timeframes:
  htf: []
  ltf: []
  fractal: false

preconditions:
  - "The trader notices an emotional impulse during or after a trade."

detection_rules:
  - "Identify the impulse (revenge entry, size increase, forcing a trade in unclear conditions)."
  - "Do not act on it; close down or move to simulation instead."
  - "Judge the session by whether the impulse was acted on, not by the profit and loss."

invalidation: []

execution:
