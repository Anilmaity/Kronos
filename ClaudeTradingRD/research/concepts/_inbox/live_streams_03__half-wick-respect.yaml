  quote: the upper 50% of the wick, you want to see the next candle
- video_id: W7Fu3Rx5iMs
  title: New York Open Live Q&A
  quote: Use 0.5 of that
- video_id: U4j-fZD-FJk
  title: New York Open Live Q&A
  quote: Using around half of that

ambiguities:
- '"Rather quickly" is never given a candle count or a time limit.'
- Whether the 50% is measured on the wick alone or on the whole candle varies by example - he
  uses "0.5 of that" on a swing, on a wick, and on a body cluster in different passages.
- Wick touch versus body close through the level is not distinguished.

