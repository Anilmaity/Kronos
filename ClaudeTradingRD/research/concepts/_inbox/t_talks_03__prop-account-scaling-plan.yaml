id: prop-account-scaling-plan
name: "Multi-Account Prop Campaign (base hits across scale)"
aliases: ["20 accounts", "base hits", "clearing the trailing drawdown"]
category: risk
status: underspecified

definition: >
  A deliberate campaign structure for extracting payouts from futures prop firms.
  Scale comes from the number of funded accounts rather than from size or hold time
  in any one account. The guest describes accumulating twenty accounts and running
  them up inside a 70-80 day window, sized to the payout rules in force at the time
  (ten trading days plus six or seven payouts before the full balance could be
  withdrawn). Within that structure he traded aggressively at the very start with the
  single objective of escaping the trailing drawdown - he says he cleared it in four
  days - and thereafter reverted to small conservative wins of roughly 100 ticks,
  closing trades once they were profitable enough rather than holding for the target.

timeframes:
  htf: []
  ltf: []
  fractal: false

preconditions:
  - "Multiple funded prop accounts traded in parallel."
  - "Knowledge of the firm's trailing-drawdown mechanics and payout schedule."

detection_rules:
  - "Phase 1: trade aggressively, in and out fast, grabbing impulsive expansion moves, until the trailing drawdown is cleared."
  - "Phase 2: revert to small conservative wins, roughly 100 ticks per trade."
  - "Close a trade once its size makes the outcome acceptable, rather than holding to the full target."
  - "Obtain scale from the number of accounts, not from size or hold time in one account."

invalidation:
  - "Not applicable - this is a campaign plan, not a setup."

execution:
  bias: "n/a"
  entry: "n/a"
  stop: "n/a"
  targets: ["approximately 100 ticks per trade in the conservative phase"]

measurable:
  - "days to clear the trailing drawdown under aggressive vs conservative sizing"
  - "distribution of trade size in ticks across the campaign"
  - "survival rate of accounts through the campaign window"

sources:
  - video_id: 1wKfc2gN4xg
    title: "Trader Kane | The Mind Behind a Multi-Million Dollar Day Trader"

ambiguities:
  - "Very aggressive in phase 1 is not quantified in risk terms, and it directly contradicts the 1%-base scaling matrix he gives elsewhere in the same interview; the reconciliation is not stated."
  - "The payout terms cited (10 trading days, 6-7 payouts) are described as being those in force at the time and are firm-specific; the firm's name is garbled in the auto-transcript and is not recoverable."
  - "The threshold at which he closes a profitable trade early is not defined."
  - "He states the strategy differs from how he trades personal capital but gives no rule for switching between the two."

python_detector: null
related: ["house-money-capital-structure", "dynamic-risk-scaling-matrix", "partial-profit-taking"]
