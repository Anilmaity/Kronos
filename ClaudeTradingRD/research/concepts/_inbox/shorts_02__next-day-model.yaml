ambiguities:
- Whether "takes out" means any trade through the level or a close beyond it differs between the three
  branches and is never stated as one rule.
- The consolidation branch gives no rule for which side is taken first.
- The Shorts do not say how many candles to wait when the read is ambiguous - only "wait for another
  candle".
- No confirmation requirement (hourly CISD, etc.) is attached in these clips, although the rest of the
  corpus requires one. Do not backfill it from those videos.
