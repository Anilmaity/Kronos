id: next-day-model
name: Next Day Model (next candle model)
category: model
status: specified
definition: 'Compressed to its decision table across four Shorts. Relative to the previous candle of
  the same timeframe, the current candle produces exactly one of three reads for the NEXT candle: closing
  OUTSIDE the previous range means anticipate a continuation; taking out one side but closing back INSIDE
  means anticipate a reversal (i.e. a move the other way); taking out BOTH the high and the low and
  closing back inside means anticipate a consolidation. The reversal read is the definition he gives
  for a reversal - price takes out its previous candle''s high or low and closes back into the range
  - and it licenses anticipating a continuation on the following candle in the new direction.'
timeframes:
  htf:
  - 1D
  ltf:
  - 4H
  - 1H
  fractal: true
preconditions:
- A completed previous candle with a defined high and low.
detection_rules:
- Close outside the previous candle's range -> anticipate a continuation on the following candle.
- Reach beyond the previous high (or low) but close back inside the range -> reversal; anticipate the
  following candle to continue in the reversed direction.
- Take out BOTH the previous high and the previous low and close back inside -> anticipate a consolidation.
- Successive closes below the previous day low sustain the "anticipate a continuation lower" read day
  after day.
- When a candle closes over the previous high but the setup is muddied (e.g. a swing high on the left
  was also taken), wait for another candle rather than acting.
- A candle that closes neither over the previous high nor below the previous low gives no read - wait.
invalidation:
- The anticipated continuation candle instead closes back inside the previous range, which converts
  the read to a reversal.
measurable:
- frequency of each of the three classes per instrument per month
- next-candle directional hit rate conditional on each class
