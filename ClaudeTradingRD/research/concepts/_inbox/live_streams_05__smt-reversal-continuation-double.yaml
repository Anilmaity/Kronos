id: smt-reversal-continuation-double
name: Reversal SMT, Continuation SMT, Double SMT
aliases:
- double SMT
- two-stage SMT
category: liquidity
status: specified
definition: His own three-way naming for SMT by where in the sequence it forms. An SMT formed with
  the reversal is a reversal SMT. A further SMT forming afterwards, inside the continuation, is a
  continuation SMT. Both present is what he calls a double SMT. He presents this as his deliberately
  simple version and acknowledges more advanced treatments exist. Mechanically the reversal SMT displays
  on the CISD while the continuation one forms live.
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  - 3m
  fractal: true
preconditions:
- A correlated asset is being tracked alongside the traded one.
detection_rules:
- SMT coinciding with the reversal (the candle 2 / CISD) = reversal SMT.
- A second SMT after the reversal, inside the continuation = continuation SMT.
- Both present = double SMT.
- The reversal SMT is marked on the CISD; the continuation SMT prints live as it forms.
invalidation:
- The correlated assets make matching highs or lows - no divergence.
measurable:
- frequency of double SMT vs single
- expansion following double-SMT sequences vs single-SMT sequences
sources:
- video_id: sdZkE-naNiY
  title: TTrades Indicator Updates - Walkthrough and Q&A
  quote: That will be a reversal SMT because it's an SMT formed with the reversal
ambiguities:
- No claim is made that a double SMT is better than a single one - it is naming only.
- He says the double case is more common on the 3-minute but gives no reason.
related:
