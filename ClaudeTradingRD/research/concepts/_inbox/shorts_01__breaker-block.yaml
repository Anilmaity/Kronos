id: breaker-block
name: Breaker Block
category: entry
status: specified
definition: 'SHORTS EVIDENCE, and the crispest four-point statement of the pattern in the corpus. A
  BEARISH breaker is the sequence high, low, higher high, LOWER LOW; the zone is then the DOWN-CLOSE
  candles taken from the FIRST high to the FIRST low, used as resistance. A BULLISH breaker is the mirror:
  low, high, lower low, HIGHER HIGH; the zone is the up-close candles between the first low and the
  first high, used as support. The pattern is not complete until the fourth point prints - a worked
  counter-example shows high, low, higher high with no lower low following, which he rules out as not
  a breaker. He states the gate directly: a breaker is a candlestick pattern showing a reversal and
  must be used with a higher-timeframe bias, not pattern-traded on its own.'
preconditions:
- A higher-timeframe bias exists (stated as a hard requirement, not a preference).
detection_rules:
- 'Bearish breaker point sequence: high -> low -> higher high -> lower low.'
- 'Bullish breaker point sequence: low -> high -> lower low -> higher high.'
- If the fourth point never prints, there is no breaker - discard the structure.
- Bearish zone := the down-close candles spanning the FIRST high to the FIRST low.
- Bullish zone := the up-close candles spanning the first low to the first high.
- Wait for price to retest the zone and require continuation away from it.
- Do not take the pattern without a higher-timeframe bias.
invalidation:
- Price closes through the zone in the opposing direction.
measurable:
- hold rate of the breaker zone on first retest
- frequency of the three-point structure that never completes the fourth point
