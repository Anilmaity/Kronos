ambiguities:
- '''Down close candles from the first high to the first low'' does not say whether the zone is their
  combined open-to-close body span or the full high-to-low of those candles.'
- How the four points are identified (swing definition, lookback) is not stated in these Shorts.
- Whether a SINGLE down-close candle suffices, or a series is required, is not addressed.
