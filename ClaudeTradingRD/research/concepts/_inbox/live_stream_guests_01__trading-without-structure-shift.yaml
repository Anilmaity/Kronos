id: trading-without-structure-shift
name: "Trading Without A Market Structure Shift / Break"
aliases: ["I don't consider market structure breaks", "raw price action"]
category: entry
status: specified
voice: guest
guest_sources:
- "Finessee_Fx"

definition: >
  Asked directly what a market structure shift means to him and whether he waits for a low to
  rebalance a bullish fair value gap or for one to be broken, Finessee_Fx says he does not use
  market structure breaks at all and never considers them. His replacement is to trade the raw
  price action off the four arrays in his toolkit and to hold one bias until price proves him
  wrong - which for him means an order block being violated, not a swing being broken. He is
  careful to frame this as personal rather than universal.

timeframes:
  htf: ["1M", "1W", "1D", "4H"]
  ltf: ["1H", "15m"]
  fractal: true

preconditions:
- "A higher-timeframe PD array has been identified and the direction of order flow around it read."

detection_rules:
- "No market structure break / shift is required at any point in the entry sequence."
- "The entry trigger is arrival at one of his four arrays, taken with a limit or at market."
- "Bias persistence: one directional bias is held until it is proven wrong."
- "The proof is array-based - the order block being violated means order flow no longer respects that direction and the bias flips - not swing-based."

invalidation:
- "The order block (or breaker) that anchored the bias is violated."

execution:
  bias: "Held until an anchoring array is violated."
  entry: "At the array, with no confirmation trigger."
  stop: "Beyond the array."
  targets: ["the opposing array"]

measurable:
- "expectancy of array-only entries versus the same arrays gated by a lower-timeframe structure break"
- "how much earlier the array-only entry fills, and how much larger its adverse excursion is"
- "how many additional entries per month the no-MSS rule admits"

sources:
- video_id: eK_6wgNpNh0
  title: "Advanced ICT Directional Bias Teachings with Finessee_Fx"
  quote: "I don't folk with Market structure breaks I don't ever"
- video_id: eK_6wgNpNh0
  title: "Advanced ICT Directional Bias Teachings with Finessee_Fx"
  quote: "I just trade the raw price action"
- video_id: eK_6wgNpNh0
  title: "Advanced ICT Directional Bias Teachings with Finessee_Fx"
  quote: "I stick the one bias until I'm proven wrong"

ambiguities:
- "He never defines what he is rejecting, so the boundary of the rejection is unclear."
- "'Proven wrong' is pinned to the order block being violated elsewhere in the video, not in this answer."
- "He uses the phrase 'market structure quote unquote shift' once while walking through a bullish breaker, so the concept is used descriptively even though it is rejected as a trigger."
- "It is not stated how a bias survives a large opposing move that never reaches the anchoring order block."
- "This is a direct methodological opposite of the other guests in this unit, who all require a lower-timeframe break before entry; the disagreement is never put to him on air. Guest-versus-guest, not channel self-inconsistency."

python_detector: null
