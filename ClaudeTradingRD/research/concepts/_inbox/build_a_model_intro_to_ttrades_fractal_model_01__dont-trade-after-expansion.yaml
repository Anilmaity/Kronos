id: dont-trade-after-expansion
name: Trade the Expansion, Not After It
category: entry
status: specified
aliases:
- three days of expansion
- a new phase of price
definition: 'Stand-aside rule. After three days of expansion - or after expansion into an already-hit
  objective, or after two very large expansion days - do not seek another continuation in the same
  direction: a new phase of price is due. The same logic runs inside the candle sequence: candle
  5 and candle 6 are where you get caught in a new phase. It is also expressed positively - after
  a large range expect a small range, so an entry taken immediately after an expansion is an entry
  into the phase transition.'
timeframes:
  htf:
  - 1D
  - 4H
  - 1H
  ltf:
  - 15m
  - 5m
  fractal: true
preconditions:
- A completed expansion sequence.
detection_rules:
- Count consecutive expansion candles on the reference timeframe. At three, stop seeking continuation.
- Two very large expansion candles can substitute for three ordinary ones.
- If the higher-timeframe objective has already been hit, stop regardless of the count.
- Beyond candle 4 in a C2/C3/C4 sequence, treat a new phase of price as likely.
- 'Instead of continuing, look for the next phase: consolidation (then wait for its manipulation),
  retracement (then wait for the protected swing), or a reversal off a relevant level.'
invalidation: []
measurable:
- forward return of continuation entries taken after the 3rd expansion candle vs the 1st/2nd
- distribution of consecutive expansion-candle run lengths by timeframe
sources:
- video_id: 4Gm8p6O7Ebs
  title: How To Trade Expansion - Phases Of Price
  quote: after we have 3 days of expansion, this is generally when it can set up
- video_id: 4Gm8p6O7Ebs
  title: How To Trade Expansion - Phases Of Price
  quote: I don't really want to enter a trade right after an expansion
- video_id: FKTBkTzsmUA
  title: How To Actually Trade Inversion Fair Value Gaps (IFVG)
  quote: After 3 days of expansion, I don't want to trade in the same direction
- video_id: tyoxl1l-6iI
  title: 'Candle 2 Closure: The Foundation of TTrades Fractal Model'
  quote: once you get into candle five and six, that's where you can get caught
ambiguities:
- '''Three'' is hedged with ''generally'' and one example counts two very large days as enough -
  the count is soft.'
- '''Expansion day'' inherits the unquantified expansion definition, so the count itself is not mechanical
  yet.'
