id: previous-day-lookback-three-days
name: 'Previous-Day Lookback: Three Days'
category: liquidity
status: specified
definition: 'Restated as his simplest liquidity answer: go back three days, mark those daily highs and
  lows (his indicator therefore shows four daily candles, current included); the relevant liquidity question
  is which side of those ranges price targets. Rationale for previous day high/low as liquidity: anyone
  short yesterday has a stop on the previous day high or a swing high, and once price is above previous
  day high every one of those shorts is underwater.'
detection_rules:
- Mark highs and lows of the prior three days (four candles shown incl. today).
- 'Frame the day as: which of these levels is the draw.'
