id: risk-reward-minimum
name: Minimum Risk-To-Reward (2R)
aliases:
- 2R minimum
category: risk
status: specified
definition: Asked directly what his risk to reward is, TTrades answers that it depends on the target
  but that he thinks he does 2R minimum. This is stated as a floor, not a fixed target - the target
  itself comes from structure.
timeframes:
  htf: []
  ltf: []
  fractal: false
preconditions:
- A trade with a defined stop and a structural target.
detection_rules:
- Reject a setup whose structural target is less than 2R from the stop.
- Where the target is further, take the target rather than a fixed 2R.
invalidation: []
measurable:
- distribution of planned R per taken setup
- rejection rate of setups on the 2R floor
sources:
- video_id: wGYde-h84cs
  title: Live Q&A with AM Trades - Weekly Profile
  quote: I think I do two are minimum
ambiguities:
- '''I think'' - stated with hedging, not as a hard rule.'
- Whether the 2R is measured to the first target or the final target is not stated.
