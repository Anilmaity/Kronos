id: tgif-setup
name: TGIF Setup
category: model
status: specified
definition: 'A Short deliberately shows a NON-textbook TGIF and says so up front: not every one is picture
  perfect. The week runs Monday consolidation, Tuesday sweeps Monday and Friday to form a new swing
  and a candle 2 closure, Wednesday expands into the objective, and Thursday hits that objective and
  forms a REVERSAL candle. He calls this still a TGIF - the variant where THURSDAY is the reversal day
  and FRIDAY is the continuation day. Execution is the same as elsewhere: drop to the hourly, require
  an hourly change in the state of delivery, then look for the move back into the range on Friday, which
  in this case was choppy but did deliver.'
timeframes:
  htf:
  - 1W
  - 1D
  ltf:
  - 1H
  fractal: false
preconditions:
- A weekly objective was reached before Friday.
detection_rules:
- 'Variant condition: Thursday hits the objective and forms the reversal candle; Friday is the continuation
  day.'
- 'Preceding shape in the worked case: Monday consolidation, Tuesday sweeps Monday and the previous
  Friday forming a candle 2 closure, Wednesday expands into the objective.'
- 'Execution: drop to the hourly and require an hourly change in the state of delivery.'
- Then look for the move back into the range on Friday.
- Accept an imperfect shape - not every weekly profile is picture perfect.
invalidation:
- No hourly change in the state of delivery forms - no trade.
measurable:
- share of TGIF weeks where the reversal day is Thursday rather than Friday
- retracement depth back into the range on the Friday continuation
sources:
- video_id: _-aPdmLe6zw
  title: Not Every TGIF Weekly Profile Will Be Picture Perfect
  quote: You will notice not everyone is picture perfect
- video_id: _-aPdmLe6zw
  title: Not Every TGIF Weekly Profile Will Be Picture Perfect
  quote: Thursday forms the reversal and this is where Friday is the continuation day
ambiguities:
- How far into the week the objective must be hit for the Thursday variant to apply is not stated.
- No target is given for the Friday continuation beyond "back into the range".
- '"Not everyone is picture perfect" licenses accepting degraded shapes but gives no floor on how degraded
  is still tradeable.'
