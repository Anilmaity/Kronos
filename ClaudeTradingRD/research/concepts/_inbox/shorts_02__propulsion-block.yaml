  quote: I would like to see price respect the lower half of this
ambiguities:
- 'Two different invalidation levels are used across the Shorts for the same object: "the mean threshold"
  and "the lower half of this". They may be the same level (50% of the block) but that equivalence is
  never stated.'
- '"Break" versus "close through" the mean threshold is not distinguished.'
- The first Short's transcript is truncated mid-sentence at "the mean threshold of a propulsion", so
  anything he added after that is lost.
- The stop choice (low vs body vs intermediate-term low) is left to preference with no rule.
execution:
  bias: The direction the propulsion block propels.
  entry: The opening price of the propulsion block.
  stop: The low, the body, or the intermediate-term low.
  targets:
  - 2R
