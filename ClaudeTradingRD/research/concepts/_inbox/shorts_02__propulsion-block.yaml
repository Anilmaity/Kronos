  quote: I do not want to see price break the mean threshold of a propulsion
- video_id: QqvT4HoQ_ds
  title: Propulsion Block Setup →Clean Entry, Strong Expansion.
  quote: I'd look to enter on the opening price with my stop
- video_id: wfkLTu96Dh8
