ambiguities:
- '''Scenario two'' implies a numbered list of scenarios that is not enumerated in these Shorts.'
- '''Short-term high'' is not bounded by a lookback in this unit.'
- '''How strong your bias is'' is offered as the dial controlling aggressiveness and is not quantified.'
