id: continuation-failure-short-term-target
name: Short-Term Target Already Taken (continuation invalidator)
category: model
status: specified
definition: 'SHORTS EVIDENCE, restated three separate times in this unit and given a name - ''scenario
  two''. When the closure that forms the continuation ALSO takes out a short-term high (bullish) or
  low (bearish), or a range extreme, the setup is not taken as-is; he waits for ANOTHER continuation
  to form. He states the trade-off explicitly: how aggressive to be depends on how strong the bias is,
  and he personally prefers to wait and see whether price makes a swing or takes him out - in the worked
  example the wait saves the loss. A second, independent reason to wait is given: once the short-term
  high is taken, the protected swing is far enough away that the risk-to-reward is no longer good.'
preconditions:
- A structurally valid continuation (closure through the opposing series at a point of interest) has
  formed.
detection_rules:
- Check whether the continuation closure simultaneously takes out a short-term high/low or a range extreme.
- If yes, do not enter on that closure - wait for a further continuation off the level.
- 'Independent check: if the protected swing is now too far away for acceptable risk-to-reward, wait.'
- 'While waiting, watch for the binary: a new continuation (breakout confirmed) or a move back across
  the range (the closure was the manipulation).'
- If price comes back across the range, the level becomes the point of interest for the opposite direction.
measurable:
- win rate of continuations that also took a short-term extreme versus those that did not
- share of such closures that resolve back across the range instead of continuing
