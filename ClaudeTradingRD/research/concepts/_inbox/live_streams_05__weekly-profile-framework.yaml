id: weekly-profile-framework
name: Weekly Profile (for Daily Bias)
aliases:
- weekly open
category: model
status: underspecified
definition: 'This unit adds how the weekly open is derived and used. The weekly opening price is literally
  the Sunday open, marked out with nothing fancy around it. Reading the current week from it: if the
  week has no real established low and price trades higher, that is the expansion; if instead it reverses
  at that area, the weekly profile is to trade back toward the weekly open.'
timeframes:
  htf:
  - 1W
  - 1D
  ltf:
  - 4H
  - 1H
  fractal: true
preconditions:
- The Sunday open is marked.
detection_rules:
- Weekly open = the Sunday open of the weekly candle, marked as a single level.
- No established low in the week plus a trade higher = the expansion case.
- A reversal at that area = trade back toward the weekly open.
invalidation:
- Not stated in this unit.
measurable:
- share of weeks that return to the weekly open after an early reversal
sources:
- video_id: sdZkE-naNiY
  title: TTrades Indicator Updates - Walkthrough and Q&A
  quote: generally your weekly profile is to trade back towards the weekly open
ambiguities:
- '''No real great established low'' is the switch between the two branches and is not quantified.'
- This is a live read of one week, not a statement of the full profile taxonomy taught elsewhere.
related:
