    title: "Simple Bias + Simple Entry"
    quote: "we don't have a clean series of down close candles"
  - video_id: OJPqaO6I-so
    title: "Simple Bias + Simple Entry"
    quote: "I just use this whole move"
  - video_id: OJPqaO6I-so
    title: "Simple Bias + Simple Entry"
    quote: "I would have to wait for a retest to then look to get long again"
  - video_id: mARxFtQ-Ivg
    title: "The Real Reason Your Entry Model Is Failing"
    quote: "I personally look for a change in the state of delivery."
  - video_id: mARxFtQ-Ivg
    title: "The Real Reason Your Entry Model Is Failing"
    quote: "I'm looking for a closure through the series of down closed candles."

ambiguities:
  - "THE LIBRARY'S PRIMARY OPEN QUESTION IS NOT ANSWERED HERE. Neither Short states WHICH price
    of the opposing-candle series the close must clear - the first candle's open, the highest
    open, or the extreme. Both clips say only 'closure through the series'."
  - "The untidy-leg fallback still has no boundary rule: where 'this whole move' starts is
    chosen visually, and 'clean' is not defined."
  - "Whether a body close or any close counts is not stated in either Short."
  - "The retest branch has no rule for how deep the retest must be, or how long to wait."
  - "TRANSCRIPT HYGIENE: the auto-captions render 'down close' as 'down closed' in one of these
    clips; both spellings appear in the corpus and mean the same thing."

