id: cisd
name: "Change In The State Of Delivery (CISD)"
category: entry
status: contested

definition: >
  This unit adds two things to a heavily-sourced concept. First, independent corroboration of
  the UNTIDY-LEG FALLBACK, which the library currently flags as an open ambiguity: when the leg
  into the level does not present a clean series of down-close candles, he uses the WHOLE MOVE
  as the reference instead, and a later close over that reference confirms the CISD. He states
  this as his general practice, not as a one-off. Second, a compressed statement of why the
  CISD is the chosen trigger at all: in a single reversal sequence there are several valid
  entry patterns, and rather than mark them all he picks ONE and looks only for the closure
  through the series of down-close candles; the reversal is then taken as having occurred and
  the following continuations become the entries.

timeframes:
  htf: ["4H", "1H"]
  ltf: ["15m", "5m", "1m"]
  fractal: true

preconditions:
  - "An extreme has formed that engaged a level (in the worked example, hourly internal-to-
    external liquidity being used to frame a 5-minute CISD)."

detection_rules:
  - "Identify the series of opposing (down-close, bullish case) candles that made the extreme."
  - "FALLBACK, corroborated here: if there is no clean series of down-close candles, use the
    whole move as the reference instead."
  - "Require a close over that reference. The close is what confirms the CISD."
  - "Once confirmed, get on side - but check risk-to-reward first: if entering on the close
    with the stop on the low does not make sense on R, wait for a retest instead."
  - "Selection discipline: of the several entry patterns available in a reversal sequence,
    mark only the CISD and ignore the rest."
  - "After the CISD confirms the reversal, take the CONTINUATIONS that follow as the entries."

invalidation:
  - "No close through the reference - no CISD, wait."
  - "Stated caveat in the worked example: taking the retest without a strong directional
    narrative is something he wants to avoid; the CISD alone does not carry the trade."

execution:
  bias: "Direction of the close through the series."
  entry: "On the close, or on a retest when the immediate entry fails the risk-to-reward test."
  stop: "On the low that the series made."
  targets: "External liquidity in the worked example."

measurable:
  - "how often the untidy-leg fallback is needed versus a clean series being available"
  - "outcome difference between entering on the close and waiting for the retest"
  - "how often the whole-move reference produces a materially different trigger price than a
    best-guess clean series would"

sources:
