    title: "Gene | Align Yourself For High Probability Trades"
    quote: "trading is about finding the highest probability analysis"
  - video_id: G44VpidBD_U
    title: "NickDoesFutures | Unicorn Model & Experiences With ICT"

ambiguities:
  - "The component list is assembled from two speakers' overlapping enumerations; neither presents it as a closed checklist."

python_detector: null
