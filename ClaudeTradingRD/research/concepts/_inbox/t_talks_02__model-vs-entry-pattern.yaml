id: model-vs-entry-pattern
name: "A Model Is Not An Entry Pattern"
aliases: ["analysis is not trading", "a model is more than a pattern on a chart"]
category: psychology
status: specified

definition: >
  Two speakers in this unit independently argue that what most traders call a "model" is
  only an entry protocol, and that a model must instead be a full step-by-step filter that
  separates analysis from execution: the risk protocol, the enumerated low-probability and
  high-probability conditions, the sessions and timeframes traded, the entry function, and
  the journaling routine. The associated claim is that analysis and trading are distinct
  skills - being able to call direction correctly is compatible with being break-even,
  because the path into the level costs more than the move pays.

timeframes:
  htf: []
  ltf: []
  fractal: false

preconditions:
  - "The trader already has a directional method."

detection_rules:
  - "A written model must specify: risk protocol, low-probability conditions, high-probability conditions, sessions/times traded, entry function, journaling routine."
  - "If the written artefact contains only an entry pattern, it is not a model."

invalidation:
  - "Not applicable - this is a process rule."

measurable:
  - "count of the six required components actually documented"
  - "variance in trade selection before vs after the written model exists"

sources:
