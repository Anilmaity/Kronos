id: continuation-over-reversal
name: "Continuation-Only Doctrine"
aliases: ["I'm going to wait for a continuation entry", "not going to trade the breakout", "get on side"]
category: model
status: specified

definition: >
  Applied here to a case the other Chart Lessons do not cover: a consolidation that resolves
  by breaking out rather than by sweeping one side first. He accepts the break as legitimate
  - "that is fine, we can do that" - and then refuses to trade it, saying he will not trade
  inside the range and will not trade the breakout, but will wait for a continuation entry
  after it. The continuation is then framed with the same phase question he uses everywhere:
  having expanded out of the range, does price expand back in (reversal), retrace (continue),
  or consolidate. Only the retracement branch is traded, and only once the closure that
  confirms it prints. The doctrine is also visible in the negative through the whole
  walkthrough: several legs are narrated as having no way to get on side, and he simply lets
  them pass.

timeframes:
  htf: ["1D", "1H", "30m"]
  ltf: ["15m", "3m"]
  fractal: true

preconditions:
  - "A move that has already resolved - a consolidation break, an expansion leg, or a confirmed reversal."

detection_rules:
  - "Never enter inside a consolidation range and never enter on the break of it."
  - "After the break, classify the next leg: expansion back into the range (reversal), retracement (continue), or consolidation."
  - "Take only the retracement branch, and only after the closure through the opposing candle confirms it."
  - "If a leg offers no protected swing, there is no way to get on side - let it pass rather than improvise an entry."
  - "The same continuation logic is repeated after every expansion leg, so a single directional day supplies several sequential continuation entries."

invalidation:
  - "Expansion back into the range instead of a retracement - the break was a reversal, stand aside."
  - "The confirming closure does not print."

execution:
  bias: "From the higher-timeframe read, unchanged by the break."
  entry: "The continuation after the break, at the point of interest, on the confirming closure."
  stop: "The protected swing formed by that closure."
  targets: ["previous day low or high", "the higher-timeframe objectives"]

measurable:
  - "expectancy of the breakout entry vs the first continuation entry after it, same instrument"
  - "number of sequential continuation entries offered per trending day"
  - "how often the post-break leg is a reversal rather than a retracement"

sources:
  - video_id: Nlw-PZhoViQ
    title: "TTrades Top-Down Chart Lessons #1"
    quote: "I'm not going to trade inside of this, trading the breakout"

ambiguities:
  - "Sourced from an ASR (whisper-small) transcript, not YouTube captions; wording may be imprecise."
  - "No rule distinguishes a consolidation that should be expected to sweep one side from one that will simply break out; both are accepted after the fact."
  - "How long after the break a continuation remains valid is not stated."

python_detector: null
related: ["consolidation-sweep-entry", "phases-of-price", "cisd", "protected-swing", "consolidation-vs-retracement-test"]
