category: time
status: contested
voice: ttrades
definition: 'Stated pairing: daily always; below it H1 or H4; lower-timeframe entries on M15, M5 or M3;
  1-minute generally not needed. For newcomers who want to swing trade: daily and H1 fractal model.'
detection_rules:
- Bias on the daily.
- Swing/confirmation on H1 or H4.
- Entries, when refined, on M15, M5 or M3.
