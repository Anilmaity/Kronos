id: large-wick-target-adjustment
name: Large Wick - Adjust Targets, Do Not Expect Expansion
category: risk
status: specified
definition: 'SHORTS EVIDENCE. When the candle in play has a large wick, the trade is not abandoned -
  the targets are cut. Two named fallbacks are given: look back towards the DAILY OPEN, or target the
  CURRENT HIGH OF DAY (the extreme already made). The alternative to cutting targets is to skip the
  candle entirely and trade the following day for a continuation. The stated reason is a range budget:
  daily candles only have so much range, so a large opposing wick has already spent it. Conversely,
  a small-wick daily candle earns the full target - the body may be traded out to the average daily
  range.'
preconditions:
- A daily bias exists.
- The current daily candle has printed a large opposing wick.
detection_rules:
- If the daily candle has a large wick, do not expect expansion.
- 'Target 1: back towards the daily open.'
- 'Target 2: the current high (or low) of day.'
- 'Alternative: skip this candle and trade the following day for a continuation.'
- If instead the wick is small, target the average daily range with the body of the candle.
measurable:
- hit rate of 'daily open' and 'current high of day' targets after large-wick days
- realised range of large-wick days versus small-wick days
sources:
- video_id: yvnISqEET-4
  title: A C2 Supporting Expansion Has a Small Wick
  quote: better off either looking back towards the daily open or trading the following day
- video_id: V8V-GdjsN84
  title: 'Daily OHLC: Let the Wick Form, Then Trade the Body'
  quote: target back towards the daily open or the current high of day
- video_id: V8V-GdjsN84
  title: 'Daily OHLC: Let the Wick Form, Then Trade the Body'
  quote: because daily candles only have so much range
- video_id: V8V-GdjsN84
  title: 'Daily OHLC: Let the Wick Form, Then Trade the Body'
  quote: I can trade the body of this candle higher to its average daily range
ambiguities:
- '''Large'' is not quantified (the blocking term - see small-wick-expansion-rule).'
- No rule chooses between the daily-open target and the current-high-of-day target.
- '''Average daily range'' is invoked as the small-wick target with no lookback period stated here.'
