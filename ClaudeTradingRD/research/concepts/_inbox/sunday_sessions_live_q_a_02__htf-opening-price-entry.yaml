id: htf-opening-price-entry
name: "Enter Around The Higher-Timeframe Opening Price"
aliases: ["let the wick form and trade the body", "trade around the opening price"]
category: entry
status: specified

definition: >
  Entries belong near the opening price of the higher-timeframe candle you intend to trade.
  The logic is explicit: to capture the body of an expansion candle you must be positioned
  before the body is built, which is only possible near the open. Entering before the
  candle's counter-directional wick has formed puts you in drawdown by construction;
  entering after the candle has already produced its average range is a chase.

timeframes:
  htf: ["1D", "4H", "1H"]
  ltf: ["15m", "5m", "3m", "1m"]
  fractal: true

preconditions:
  - "A higher-timeframe candle has opened and a directional bias for it exists."

detection_rules:
  - "Wait until the counter-directional wick of the HTF candle has formed (a lower-timeframe reversal/CISD marks this)."
  - "Enter while price is still near the HTF candle's opening price."
  - "Do not enter once the candle's realised range approaches or exceeds its typical range."

invalidation:
  - "Price is already beyond the previous swing/high-low that defined the objective - treated as a chase, skip."
  - "The wick has not formed yet - entry is premature."

execution:
  bias: "The HTF candle's expected direction."
  entry: "Near the HTF opening price, after the wick forms."
  stop: "Beyond the formed wick."
  targets: ["previous day high or low", "equal highs or lows", "the HTF candle close (time-based exit)"]

measurable:
  - "MAE of entries taken near the HTF open vs mid-body."
  - "Realised R by entry distance from the HTF opening price."

sources:
  - video_id: Qv6Ux_Z8VrA
    title: "New York Open Live Q&A"
  - video_id: yud7TpE2AMs
    title: "New York Open Live Q&A"
  - video_id: 00iZXPAdR5A
    title: "New York Open Live Q&A"
    quote: "you're letting the wick form, and you're trying to trade the body"

ambiguities:
  - "'Near the opening price' is never bounded as a distance or fraction of the candle."
  - "Which HTF candle governs (1H vs 4H vs daily) is left to the trader; he states repeatedly that the entry timeframe itself does not matter."

python_detector: null
related: ["fractal-model-c3", "time-based-exit", "average-daily-range"]
