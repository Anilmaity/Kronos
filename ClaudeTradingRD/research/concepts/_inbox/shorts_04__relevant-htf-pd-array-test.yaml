    quote: "London moves lower, never reaches a relevant higher time frame level"
  - video_id: 2ctrcNs4tFo
    title: "What Sets NY Reversals Apart from London Reversals?"
    quote: "we go higher until New York to form the reversal"

ambiguities:
  - "'Relevant' PD array is again asserted and never defined - this Short repeats the term without adding a test."
  - "NO SESSION HOURS ARE GIVEN. 'London' and 'New York' are used as hard gates in this Short with no clock times attached."
  - "No tolerance for 'reached' (wick touch vs body trade into the level)."

python_detector: null
