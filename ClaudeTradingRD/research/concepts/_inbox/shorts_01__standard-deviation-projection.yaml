id: standard-deviation-projection
name: Standard Deviation Projection Of The Manipulation Leg
category: entry
status: specified
definition: 'SHORTS EVIDENCE giving the anchoring procedure as a two-step recipe. After the reversal
  point is found and a change in the state of delivery has printed, identify the MANIPULATION LEG by
  finding the low first and then finding the HIGH THAT MADE THE LOW. Those two points are the Fibonacci
  anchors, and the projections extended from them are the targets the bullish move is expected to reach.
  The bearish case is the mirror: anchor from the high to the low.'
preconditions:
- A reversal point has been identified.
- A change in the state of delivery has printed.
detection_rules:
- Find the reversal extreme (the low, in the bullish case).
- Find the high that MADE that low - the origin of the manipulation leg.
- Anchor a Fibonacci tool on those two points.
- Project targets from that anchor and treat them as the objectives for the move.
- 'Bearish mirror: anchor from the high to the low.'
measurable:
- hit rate of each projection level from the manipulation-leg anchor
- agreement rate between projection levels and nearby drawn liquidity
sources:
- video_id: LLuI42YNUko
  title: Breaking Down How to Use Projections
  quote: finding the low, then finding the high that made the low
- video_id: LLuI42YNUko
  title: Breaking Down How to Use Projections
  quote: using a Fibonacci to mark out those as anchor points to project out targets
- video_id: LLuI42YNUko
  title: Breaking Down How to Use Projections
  quote: you're going to anchor from the high to the low
ambiguities:
- WHICH deviations are used (-1, -2, -2.5, -4) is not stated in this Short.
- Whether the anchors are wicks or bodies is not stated.
- '''The high that made the low'' assumes an unambiguous origin candle; no tie-break rule is given.'
