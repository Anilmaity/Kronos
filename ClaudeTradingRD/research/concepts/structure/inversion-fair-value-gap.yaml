id: inversion-fair-value-gap
name: Inversion Fair Value Gap (IFVG)
definition: 'An inversion fair value gap is a fair value gap that is not respected and is
  swiftly closed over: what was resistance becomes support and what was support becomes resistance.
  The distinctive TTrades content is the gating condition, not the pattern. Trading an inversion
  as a bare pattern - sweep, inversion, entry - is named as the mistake most people make.
  Within the fractal model an inversion is only valid inside a candle 2 that supports expansion:
  there must be a sweep of candle one''s high/low (or an SMT in its place), a SMALL wick on
  that candle 2, and then the inversion. If the candle has a large opposing run, the inversion
  is not traded on that candle - you wait for the open of the next higher-timeframe candle.
  An inversion can also be used in place of the CISD to confirm a continuation.'
variants:
  definition:
  - 'A fair value gap that price has closed through — "disrespected" — and which therefore
    flips polarity: a bearish gap closed above becomes support, a bullish gap closed below
    becomes resistance. After the inversion, price is expected either to retrace into the
    old gap and respect it (the tradeable case) or to continue directly without a retest.
    The channel treats inversions as one of its primary entry zones, and specifically as the
    way to join an existing trend: the opposing PD arrays that fail are the trend''s entry
    points.

    '
  - 'When a fair value gap fails, or price closes through it, that gap can then be used as
    support or resistance in the opposite direction. The canonical video adds one detail that
    materially changes any detector built from it: the inversion and its retest do not need
    to occur back to back, the gaps do not have to overlap, and the return can come after
    an intervening period of consolidation. The worked failure sequence is three-staged -
    a close below the consequent encroachment as the first clue, an inability to displace
    back out, then a close below the whole fair value gap - after which the old bullish gap
    is used as resistance on return.'
  - 'A fair value gap that has been closed through in the opposing direction and now acts
    in the opposite polarity. He lists it as one of three interchangeable ways to signify
    a change in order flow (inversion, CISD, market structure shift) and states a stricter
    threshold than the common one: a close beyond 50% of the gap is not enough for him, he
    waits for a full closure below (above) the gap.'
