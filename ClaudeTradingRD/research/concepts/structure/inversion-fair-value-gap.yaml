preconditions:
- A fair value gap exists.
- A higher-timeframe candle 2 has swept candle one's high or low (or an SMT stands in for
  it).
- A previously formed fair value gap of the opposite polarity to the intended direction.
- An existing fair value gap that price has closed through.
detection_rules:
- Sweep of the previous higher-timeframe candle's high (bearish) or low (bullish) - this is
  the relevant level requirement.
- The candle doing the sweeping must have a SMALL wick, i.e. it supports expansion.
- Price then closes swiftly through the fair value gap - the inversion.
- Where several fair value gaps stack, the close must clear the whole series.
- 'Tolerance rule: one rejection of the inverted level is acceptable provided price quickly
  closes back through it; repeated failure that becomes a consolidation means waiting for
  a new high/low first.'
- 'Optional confluence: SMT between candle one''s high and candle two''s high.'
- If the candle has a large opposing run, wait for the open of the next higher-timeframe candle
  before entering.
- 'Given a bearish FVG with zone [z_low, z_high]: inversion occurs on the first candle whose
  close > z_high. Mirror for a bullish FVG (close < z_low).'
- A close beyond the CE only is explicitly NOT sufficient ('gives us a hint'); the close must
  be beyond the gap.
- After inversion, the same zone is used as support (bullish inversion) or resistance (bearish
  inversion) on retest.
- 'Entry refinement: if the retest entry at the zone edge gives insufficient R:R, use the
  CE of the old gap instead.'
- 'Trend usage: in an uptrend, each failed bearish gap that is closed over marks a candidate
  higher-low entry (and mirrored in a downtrend).'
- 'Inversion trigger: the fair value gap fails, or price closes through it; the zone then
  flips polarity.'
- After inversion the old zone is used as support (was bearish) or resistance (was bullish)
  on the next return.
- 'The retest need not be immediate: extend the zone forward in time and wait; it may be reached
  after a period of consolidation, and the two gaps need not overlap.'
- 'Observed failure sequence before the inversion: close beyond the CE (first clue), failure
  to displace back out, then a close beyond the whole gap.'
- 'Worked mirror: an old bearish gap whose CE is then used as support, with price returning
  to the same old gap a second time and displacing away from it.'
- A bullish fair value gap exists.
- Price closes fully below the entire gap (not merely below its 50% / consequent encroachment).
- The gap is now treated as bearish; a retest of it is resistance.
invalidation:
- No inversion forms - price fails to close through the gap.
- 'No V-shape reversal, only consolidation at the level: stand aside (''this is where I want
  to avoid price'').'
- Price closing back through the inverted zone in the original direction.
- Price closes back through the inverted zone in the original direction - not stated as a
  rule, only implied by the polarity logic.
- Only a partial close through (e.g. below 50% but inside the gap) — he does not count it.
measurable:
- hit rate of inversions gated on small-wick candle 2 vs ungated inversions
- how often the single-rejection tolerance precedes success vs failure
- 'retest rate: share of inversions that see price return to the zone'
- hit rate of a fixed-2R trade taken on the first retest
- share of inversions that immediately fail (close back through)
- distribution of bars between the inverting close and the first retest
- reaction rate on the first retest vs the second and third
- outcome difference between 50%-close inversions and full-close inversions
