ambiguities:
- '''Swiftly closed over'' has no bar limit.'
- The 'one rejection is fine' tolerance is stated as 'the one rule I have' but the number
  of acceptable rejections and the time before it becomes a consolidation are not given.
- '''Small wick'' is again the load-bearing gate and again unquantified.'
- Body close vs wick is implied by the word 'close' but never stated.
- Whether the close must be beyond the far edge of the gap or merely outside the near edge
  is ambiguous in the phrasing 'closed over'.
- 'No expiry: how long an inverted gap remains valid, or how many retests it survives, is
  not given.'
- The relationship between an inversion and an order block at the same location is not disambiguated
  — several examples label the same candles both ways.
- '''Closes through it'' is not pinned to the far edge versus merely outside the near edge,
  and the CE contradiction (see consequent-encroachment) sits directly underneath this.'
- 'No expiry: because the retest may come much later, a detector needs a horizon that he never
  supplies.'
- How many times an inverted gap can be reused is not stated, though he shows one being used
  twice.
- '''Full closure below here'' is shown on a chart; whether it means the candle body or the
  whole candle must be below the gap is not stated.'
- He explicitly frames inversion / CISD / MSS as a matter of personal preference ('whatever
  your eyes see best'), so no precedence rule exists between them.
