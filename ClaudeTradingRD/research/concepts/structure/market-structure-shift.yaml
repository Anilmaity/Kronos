execution:
  bias: Direction of the displacement through the swing.
  entry: Retracement into a PD array inside the displacement range (premium for shorts, discount
    for longs).
  stop: Beyond the swept extreme / the opposing candles.
  targets:
  - The liquidity that drew price (old high / old low)
  - Opposite side of the displacement range
