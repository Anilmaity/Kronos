id: market-structure-shift
name: Market Structure Shift (MSS)
variants:
  name:
  - Market Structure Shift / Market Structure Break
  - Displacement Plus A Close - And The Terms Are Interchangeable
  definition:
  - A change in trend from bullish to bearish or bearish to bullish, produced by displacement
    that closes beyond a prior swing high (bullish shift) or swing low (bearish shift). Displacement
    means a large aggressive move of full-bodied candles, single or multiple, easiest to spot
    by the fair value gap it leaves. He additionally requires a stop raid of that swing immediately
    before the displacement, and requires that price had engaged a higher-timeframe level
    before the shift; without that engagement he does not look for a setup at all.
  - 'The transition from one trend to the other, defined by the swing sequence plus a close
    beyond the pivot. Bearish-to-bullish: while making lower highs and lower lows, price puts
    in a lower low but cannot displace lower; it then displaces and closes over the previous
    high, creating a higher high; the pullback that follows is the higher low (which he calls
    the low-risk buy), and a further higher high confirms the new uptrend. Bullish-to-bearish
    is the mirror: after a higher high and higher low price makes a lower low, puts in a lower
    high, then displaces and closes below that low to make another lower low, followed by
    a lower high. He names the confirming close as the point where the market structure shift
    or market structure break occurs, and he specifies which pivot counts: the low that made
    the new high, before price came back and broke it.'
  - 'Ben''s answer to the sharpest question asked in this unit - how do you tell a market
    structure shift from a stop run, when both break a swing with displacement and both leave
    a fair value gap? His first answer is that you cannot, from structure alone: the two are
    identical locally, and you will keep mistaking one for the other until you have a daily
    bias and a draw on liquidity, after which the rest of the picture resolves itself. His
    second answer is a mechanical test that does not need the bias: fib the impulse leg, and
    if price never came back to equilibrium of it, the extension beyond it is a stop hunt
    rather than a real swing, because the leg was never balanced. He also distinguishes a
    TEMPORARY shift - one he will trade toward the next PD array without committing to the
    far extreme of the range.

    '
  - 'Stated by the host in two of the four videos in this unit: market structure break, market
    structure shift, break of structure and change of character are the same thing under different
    names, and what matters is the test rather than the label. His test has two parts - displacement,
    an energetic move, and a candle close beyond the structure being broken - and he explicitly
    rejects a wick or a small candle as sufficient. The guest states the same two criteria
    in the same stream (''one displacement and two closing above ... some structure for a
    change in trend''), and the ICT definition is read from the screen (episode six): price
    rallies above an old high or highs then quickly shifts lower, with significance placed
    on the word quick and on the displacement. The host''s practical use of it is negative:
    a level taken out with neither displacement nor a close is a liquidity grab, not a break
    of structure, and the higher-timeframe direction stands until the higher-timeframe intermediate-term
    low or high is taken.'
definition: 'EARLIEST RECORDINGS. The older formulation is markedly leaner than the later
  canon: market structure is nothing more than highs and lows (short-term, swing, and relatively
  equal), and a market structure shift is a prior high (in a downtrend) or prior low (in an
  uptrend) being BROKEN WITH DISPLACEMENT. That is the whole test. There is no stop-raid precondition,
  no requirement that price first engaged a higher-timeframe level, and no CISD anywhere -
  the term ''change in the state of delivery'' does not occur once in the twenty videos of
  this unit. The MSS is what tells you the trend is changing, and its by-product - the fair
  value gap left by the displacing leg - is the entry.'
category: structure
status: contested
aliases:
- MSS
- shift in structure
- break structure
- market structure break
- change in Trend
- lowrisk buy
- stop run versus structure shift
- temporary shift
- BOS
- break of structure
- change of character
preconditions:
- A sequence of lower highs (bearish) or higher lows (bullish) is on the chart.
- Price has engaged a higher-timeframe level (PD array / point of interest) on that or a lower
  timeframe.
- A prior swing high or swing low exists to be broken.
- An established trend read on the working timeframe.
- The higher-timeframe trend is known first - he states this as the condition that decides
  whether the shift is believable.
- A swing has been broken with displacement and a fair value gap - i.e. the local pattern
  already looks like a shift.
- A prior swing high or low on the working timeframe.
detection_rules:
- 'Downtrend: mark the successive lower highs. A shift occurs when one of them is broken WITH
  displacement. Uptrend: mirror on the lows.'
- 'Displacement is required, not optional: a high that is exceeded without an energetic move
  and without a fair value gap is explicitly NOT a shift.'
- The displacing leg must leave a fair value gap; that gap is then the entry.
- 'Timeframe: he reads trend on the 5-minute but states the 15-minute is less noisy and is
  what he recommends to most people; the higher timeframe overrides the lower.'
- After the shift, mark the displacement range and take the entry only in its discount (long)
  or premium (short).
- Locate a prior swing high (for a bullish shift) or swing low (for a bearish shift).
- 'A stop raid occurs first: price sweeps that swing (preferred, not universally enforced
  in the examples).'
- Price then displaces — large full-bodied candle(s), typically leaving a fair value gap —
  and CLOSES beyond that swing level.
- The close must be beyond the swing itself, not merely beyond an opposing candle's opening
  price (that is the CISD test instead).
- Only then does he look left for a PD array (order block / FVG / OTE / breaker) in the retracement
  to enter.
- 'Bearish-to-bullish step 1: inside a sequence of lower highs and lower lows, price makes
  a lower low and then fails to displace lower.'
- 'Step 2: price displaces and closes over the previous high, creating a higher high.'
- 'Step 3: the retracement that follows is the higher low; a further higher high confirms
  the uptrend.'
- 'Bullish-to-bearish: after higher highs and higher lows price makes a lower low; a lower
  high is put in; price then displaces and closes below that low, creating another lower low;
  the following lower high completes the shift.'
- The pivot whose break counts is the low that made the new high (bullish trend) or the high
  that made the new low - not any nearby swing.
- 'A new extreme without a swing being broken is NOT a shift: he rejects a candidate on the
  grounds that a higher high formed but no swing was broken.'
- Displacement is resolved in every worked case as a CLOSE beyond the pivot ('displace and
  close below this low'), never as a size threshold.
- 'Do not classify from the break alone: with displacement and a gap present, a stop run and
  a structure shift are locally identical.'
- Apply the directional filter first - establish the daily bias and the likely draw on liquidity
  (Ben derives his from the dollar).
- 'Balance test: fib the impulse leg; if price never traded back to its equilibrium, treat
  the move beyond it as a stop hunt, not a swing.'
- A break that raids equal lows / clustered stops and immediately rebalances into an unmitigated
  inefficiency is the stop-run signature; the real shift is the one that then delivers to
  discount and leaves.
- 'A shift can be classified as temporary: trade toward the near PD arrays but do not assume
  the far extreme of the range until price confirms it.'
- 'Stop selection after a shift: do not use a swing that has just been raided as the stop
  reference; use the one behind it.'
- Terminology (MSS / MSB / BOS / CHoCH) is interchangeable; apply the test, not the label.
- Require displacement - an energetic move, not a wick and not a small candle.
- Require a candle close beyond the previous high (bullish) or previous low (bearish).
- Absent both, classify the event as a liquidity grab and keep the prior higher-timeframe
  direction.
- 'Resolve the grab-versus-break question on the higher timeframe: the trend stands until
  the higher-timeframe intermediate-term low/high is taken.'
invalidation:
- The break occurs without displacement / without a fair value gap - read it as a pullback.
- Price reaches the swing but cannot close beyond it (that is a liquidity grab, not a shift).
- No higher-timeframe level was engaged before the break — he does not search for a setup.
- The confirming close never arrives - the oil example forms the lower high but never closes
  below the low, and price takes the first high instead.
- The shift runs against the higher-timeframe trend, in which case it is read as a retracement
  into a higher-timeframe PD array and is expected to fail.
- The move classified as a shift is itself retraced and the prior extreme reclaimed.
- Price immediately reclaims the broken level without follow-through - the break was a grab.
measurable:
- proportion of swing breaks that carry a fair value gap
- 5m vs 15m shift counts per session
- frequency of MSS bars that were preceded by a sweep vs not
- hit rate of MSS with prior HTF-level engagement vs without
- median bars from CISD to the corresponding MSS
- hit rate of shifts taken with the higher-timeframe trend vs against it
- share of first-candidate shifts that never receive the confirming close
- distribution of bars between the displacing close and the confirming opposite-side swing
- outcome of breaks whose impulse leg never returned to equilibrium versus those that did
  - the direct test of his balance rule
- classification accuracy of the bias-first procedure versus structure-only classification
- continuation rate of breaks with a close and displacement vs wick-only breaks
- how often a lower-timeframe break against higher-timeframe direction fails
