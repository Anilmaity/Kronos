ambiguities:
- 'EVOLUTION vs the Updated playlist: the later canon (_94CPMjWi9E) adds two conditions absent
  here - a preferred stop raid before the break, and a REQUIRED prior engagement with a higher-timeframe
  level (''without which I do not personally search for a setup''). These are the earlier
  recordings and they impose neither.'
- 'EVOLUTION: the later canon separates MSS from CISD as two distinct signals. In this unit
  CISD does not exist as vocabulary at all; ''break structure'' does the same job everywhere.'
- Which swing counts is not filtered - he says only that he prefers a higher-timeframe low
  to be broken rather than a small intraday one, with no separation or age test.
- Whether the break must be a body close beyond the swing is never stated; every worked case
  is resolved visually by the size of the move plus the fair value gap.
- The sweep/stop-raid precondition is 'I also prefer' in _94CPMjWi9E and part of the definition
  in ynFA6E3qHj0 — preference vs requirement is not resolved.
- '''Aggressive'' / ''large full-bodied'' displacement is never quantified (no body-to-range
  ratio, no ATR multiple).'
- In umyCqr_0NsI he says he often waits for an INTERMEDIATE-term high/low to be taken rather
  than any swing, which raises the bar but is not stated as a rule.
- Whether the close must be a body close or any close beyond the swing is not stated, though
  every example shows a body close.
- Displacement is never quantified; the only operational test he applies is the close beyond
  the pivot, which is decidable but is a proxy he never labels as the definition.
- Whether the pivot must already be a confirmed 3-bar swing before it can be 'broken' is stated
  both ways in the same video - he registers a higher high 'even if we have not formed a swing
  High yet', but rejects a candidate because 'we don't have a swing we break'.
- The preference for the post-shift lower high to sit in premium (or the higher low in discount)
  is stated as 'ideally', not as a filter.
- 'No expiry: how long a confirmed shift remains the operative read is not stated.'
- He defers the harder cases to a follow-up 'Advanced Market structure' video which is not
  part of this unit.
- The balance test depends entirely on which leg is chosen as the impulse and which range
  is the dealing range; he says identifying dealing ranges accurately is the prerequisite
  and that getting it wrong will hinder performance, but gives no selection rule.
- He states plainly that price may leave from equilibrium without ever filling gaps in the
  OTE, so the test grades likelihood rather than deciding the case.
- '''Temporary shift'' is not given a bound - nothing says when a temporary shift becomes
  a committed one.'
- 'The whole procedure is circular for an automated system: it needs a daily bias that this
  unit never specifies mechanically.'
- Displacement is never sized - no candle-range, ATR or body-ratio threshold anywhere in this
  unit.
- '''Quick'' carries no candle-count bound.'
- AM Trades disagrees within this same unit, reserving 'break' for an intermediate-term swing
  point being taken; the second and third quotes above come from the guest and from a screen
  reading of ICT rather than from the host, though the host states the interchangeability
  claim himself.
