id: aggressive-run-hammer-signature
name: The Run-And-Return Is A Hammer Wick On The Higher Timeframe
definition: 'The stated equivalence that makes the run-and-return setup recognisable one timeframe
  up: an aggressive move out of a range followed by an aggressive move back into it creates
  the wick of a hammer candle on the higher timeframe. At the top of a range the mirror move
  - aggressive up then down - creates what he calls a shooter candle. The lower-timeframe
  sequence and the higher-timeframe candle shape are two views of the same event.'
category: structure
status: underspecified
aliases:
- hammer candle wick
- shooter candle
preconditions:
- A range low or high has just been run and price has returned inside.
detection_rules:
- 'At a range low: aggressive move below the low, then an aggressive move back inside -> the
  higher-timeframe candle prints a hammer (long lower wick).'
- 'At a range high: aggressive move above, then back down -> a ''shooter'' candle (long upper
  wick).'
- Use the higher-timeframe wick as the confirmation that the lower-timeframe run-and-return
  has occurred.
invalidation:
- The higher-timeframe candle closing beyond the level instead of wicking through it.
measurable:
- correlation between a hammer/shooter print on the pairing timeframe and a completed run-and-return
  one timeframe down
- continuation rate after a hammer at a range low vs elsewhere
sources:
- video_id: yq4Z7q4E6nU
  title: Trading without a Structure Shift / Break - ICT Concepts
  quote: will create the wick of a hammer Candle on the entire time frame
ambiguities:
- No wick-to-body ratio is given, so 'hammer' here is a visual description, not a candlestick
  definition.
- '''Shooter candle'' is named once and never defined; it is read as the bearish mirror of
  the hammer.'
- The transcript reads 'on the entire time frame'; in context this means the higher timeframe
  on which the whole sequence is one candle.
- Which timeframe pair the equivalence holds on is shown once (1-minute sequence -> 5-minute
  hammer) and not generalised.
