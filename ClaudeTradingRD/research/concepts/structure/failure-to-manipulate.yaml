ambiguities:
- How many bars to wait for the opposite CISD before declaring failure is not stated; it is
  resolved only when the new continuation forms.
- The override of a mechanical CISD by the higher-timeframe candle read is discretionary and
  makes the concept non-decidable from lower-timeframe structure alone.
- No time limit is given for how long the reversal may take before the day is declared trending.
- He hedges in the same breath ('It could react here'); in the session the drag did not cleanly
  play out and he called the day choppy.
- No threshold separates 'expansion back out' (reversal) from 'retracement' (failure); it
  is the same unquantified V-shape judgement used elsewhere.
- He says it is 'more focused on two assets' but does not say what the second asset must show
  - presumably an SMT, but he does not say so.
