id: failure-to-manipulate
name: Failure To Manipulate (deflated to phases of price)
definition: 'Asked twice in one stream to explain "failure to manipulate", he defines it and
  then deliberately deflates the term. The setup is a level being used as a target - say a
  low. Price expands into that low. Either it expands back out, which is the reversal, or
  it does not, which is a retracement or a consolidation and therefore a continuation through
  the level. A failure to manipulate is simply the second branch: price does not reverse off
  the low and continues lower. He says people invent labels for this and that it is nothing
  more than phases of price, and that it is read across two correlated assets rather than
  one.

  '
category: structure
status: specified
aliases:
- fail to manipulate
- failure to manipulate
preconditions:
- A level (a previous low or high) is being used as a target / draw.
- Price has expanded into that level.
detection_rules:
- Price expands into the target level.
- 'Reversal branch: price expands back out of the level, forming a reversal - the manipulation
  succeeded.'
- 'Failure branch: price only retraces or consolidates at the level and then continues through
  it - failure to manipulate.'
- Read it across two correlated assets rather than on one chart alone.
invalidation:
- A reversal forms after the fact, converting the read back to a manipulation.
measurable:
- proportion of expansions into a target level that reverse vs continue
- conditioning of that proportion on whether the correlated asset diverged
sources:
- video_id: i2HhHhWdaPQ
  title: New York Open Live Q&A
  quote: It's really just phases of price.
ambiguities:
- No threshold separates 'expansion back out' (reversal) from 'retracement' (failure); it
  is the same unquantified V-shape judgement used elsewhere.
- He says it is 'more focused on two assets' but does not say what the second asset must show
  - presumably an SMT, but he does not say so.
