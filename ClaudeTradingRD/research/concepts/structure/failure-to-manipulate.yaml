id: failure-to-manipulate
name: Failure To Manipulate (deflated to phases of price)
variants:
  name:
  - Failure To Manipulate
  definition:
  - 'Adds the consequence: when price trades through the previous day low and forms a continuation
    instead of a reversal (no move back into the range, no bullish CISD), the failure to manipulate
    marks a trending day. On such a day he will not try to catch lows - the long side is off
    for the session ("either bearish or nothing"). Read as a cascade across indices: YM fails
    to manipulate its low, so ES is expected to its low, so NQ heads for its lows.

    '
  - 'Cross-asset reading: ES took a low and then formed a protected swing (continuation) instead
    of reversing - a failure to form a reversal / failure to manipulate - which he reads as
    the correlated assets continuing in the same direction.'
  - 'Applied live to the weakest index (YM) at a low: when the weakest asset trades through
    the low without reversing, that is a failure to manipulate, and the expected destination
    becomes its previous day low; because it went that far below the low, the correlated assets
    are expected to be dragged down with it.'
  - 'Used live as the branch of an if-then: if price fails to form the reversal at the expected
    level, that is a failure to manipulate and price heads to the other level; if it reacts,
    the original idea stands.'
  - 'Asked twice in one stream to explain "failure to manipulate", he defines it and then
    deliberately deflates the term. The setup is a level being used as a target - say a low.
    Price expands into that low. Either it expands back out, which is the reversal, or it
    does not, which is a retracement or a consolidation and therefore a continuation through
    the level. A failure to manipulate is simply the second branch: price does not reverse
    off the low and continues lower. He says people invent labels for this and that it is
    nothing more than phases of price, and that it is read across two correlated assets rather
    than one.

    '
definition: 'The dedicated video gives a mechanical version. At a range extreme his default
  is to expect a reversal back to the other side (sweep, aggressive candle back in, CISD).
  A failure to manipulate is when price takes out the high or low and fails to reverse off
  it - operationally, it fails to form a change in the state of delivery in the opposite direction.
  He does not trade the breakout candle itself; he waits for a new continuation (a retest
  of the old range, a higher low / lower high, a new protected swing, or a candle 2 closure
  after retesting a gap) and trades that, stop on the protected swing, 2R target. It is a
  structure confirmation used inside the fractal model, never alone: it must be paired with
  a higher-timeframe bias, and the higher-timeframe candle read can override the mechanical
  lower-timeframe CISD (his last example: a mechanical bearish CISD after a sweep of the range
  high is discounted because the higher-timeframe candle shows a candle 2 closure with bullish
  SMT, so the move is read as a bullish failure to manipulate and traded as a positional entry).

  '
category: structure
status: contested
aliases:
- failure to manipulate a level
- trade the breakout of a range
- fail to manipulate
- failure to manipulate
preconditions:
- A defined range (equal highs/lows or a consolidation) or a level price is expanding into.
- A higher-timeframe bias in the breakout direction.
- A level (a previous low or high) is being used as a target / draw.
- Price has expanded into that level.
detection_rules:
- Price trades beyond the range high (low).
- No opposite-direction CISD forms - price cannot close below (above) the series of up-close
  (down-close) candles that made each new high (low).
- An aggressive close in the breakout direction at the level strengthens the read.
- Wait for a new continuation in the breakout direction (retest of the range / FVG, higher
  low or lower high, new protected swing) before entering.
- Enter on that continuation; stop on its protected swing; target 2R.
- If a mechanical opposite CISD does print but the higher-timeframe candle shows a candle
  2 closure with SMT in the breakout direction, defer to the higher-timeframe read.
- Price trades through previous day low and forms a continuation (no reversal, no bullish
  CISD back into the range).
- 'Classify the day as trending: no counter-trend (long) entries for the rest of the session.'
- Expect correlated indices to run to their own corresponding lows.
- If one asset sweeps a low and forms a protected swing instead of a reversal, read it as
  failure to manipulate.
- Expect the correlated assets to continue in the same direction.
- Weakest asset trades into the low without forming a reversal.
- Read as failure to manipulate; next draw = previous day low of that asset.
- Expect the correlated (stronger) assets to follow lower rather than hold.
- 'At the expected reversal level: no reversal formed = failure to manipulate, target the
  other level; reaction formed = keep the original idea.'
- Price expands into the target level.
- 'Reversal branch: price expands back out of the level, forming a reversal - the manipulation
  succeeded.'
- 'Failure branch: price only retraces or consolidates at the level and then continues through
  it - failure to manipulate.'
- Read it across two correlated assets rather than on one chart alone.
invalidation:
- An opposite-direction CISD forms at the level and is consistent with the higher-timeframe
  candles - it is a manipulation, trade the reversal.
- No higher-timeframe bias - he does not trade the structure alone.
- A reversal forms after the fact, converting the read back to a manipulation.
measurable:
- 2R hit rate of breakout continuations after a range extreme is taken with no opposite CISD
  within N bars
- comparison with and without daily-bias alignment
- intraday range and close location on days where PDL is broken without a reversal vs with
  one
- expectancy of long entries after a failed PDL manipulation
- proportion of expansions into a target level that reverse vs continue
- conditioning of that proportion on whether the correlated asset diverged
