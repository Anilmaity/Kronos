ambiguities:
- '"Messy" and "small candles" are the trigger and are not defined - no candle-count, no range
  test.'
- Taking "this whole move" as the series necessarily widens the stop, and the clip does not
  address the risk-to-reward consequence.
- He notes the entry is a reversal because there are no continuations in his model for a proper
  framework here, but does not say whether that downgrades the trade.
- '''Doesn''t form a swing'' is not defined in this video; the three-bar swing definition
  from the companion relevant-swings video is the only candidate test and he does not state
  that it is the one meant.'
- '''Generally I ignore it'' makes it a tendency; no exception conditions are given.'
- Because the reference candle determines where the CISD level sits, the choice materially
  moves the trigger, but no tie-break is given when several nearby candles qualify.
