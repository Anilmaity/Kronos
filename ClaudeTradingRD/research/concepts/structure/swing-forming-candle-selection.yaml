id: swing-forming-candle-selection
name: Ignore Candles That Do Not Form A Swing
definition: 'Corroborated live and stated as an explicit instruction rather than a habit.
  Looking for a 15-minute protected swing under a 4-hour read, the area is messy: he says
  outright that this is when he ignores those small candles and takes the whole move up as
  the series instead. The operational consequence is stated immediately after - price makes
  a new high, he asks where the series of candles that made that high is, confirms a close
  below it, and that gives the protected swing and therefore the invalidation.'
variants:
  definition:
  - A selection rule for which candle a continuation is anchored on, and therefore for where
    the CISD level sits. Where a retracement produces a candle that does not itself form a
    swing, he skips it and uses the neighbouring candle that does form one as the continuation
    reference. It is stated as a habit rather than an absolute, but it materially changes
    the level a closure must clear.
category: structure
status: contested
aliases:
- that doesn't form a swing, generally I ignore it
preconditions:
- A higher-timeframe level has been reached (previous range high, into a fair value gap).
- The paired lower timeframe is being read for a protected swing.
- A retracement has printed and a continuation reference must be chosen.
detection_rules:
- When the lower-timeframe area is messy, ignore the small candles and treat the whole move
  as the series.
- After a sweep of the high, identify the series of candles that made that high.
- Require a close below that series; that yields the protected swing and the invalidation.
- Enter on the close - a reversal entry, taken because no continuation exists yet in the model.
- When choosing the opposing candle(s) a continuation must close through, skip a candle that
  does not form a swing.
- Use the adjacent candle that does form a swing as the continuation reference instead.
invalidation:
- Price trades back through the protected swing formed by the selected series.
- Not applicable - this is a selection rule.
measurable:
- difference in stop distance between the whole-move series and the strict candle-by-candle
  series
- stop-out rate under each series-selection convention
- difference in CISD trigger price and outcome between the skipped and the used candle
sources:
