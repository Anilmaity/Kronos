id: balanced-price-range-overlap
name: Balanced Price Range (BPR)
variants:
  name:
  - Balanced Price Range From Overlapping Opposing Gaps
  definition:
  - 'Where a former bullish fair value gap and a newly formed bearish fair value gap overlap
    in price, the overlap itself is marked as a balanced price range and treated as a single
    stronger point of interest with a defined polarity. The same construction is applied fractally:
    on the daily, on the H1, and on the M15 in the worked examples, and it is the level from
    which lower-timeframe executions are framed.

    '
definition: 'TTRADES'' OWN PRIMARY STATEMENT of a concept the library previously held mainly
  in a guest''s voice. A BPR is formed where a bearish fair value gap and a bullish fair value
  gap OVERLAP. The traded zone is the SMALLER of the two gaps - i.e. the intersection - and
  the trade is the retracement back into it. Structurally it is ''aggressive price action
  used to your advantage'': an aggressive move one way immediately met by an aggressive move
  the other. He is explicit that it is the same shape as the box setup (break out of consolidation,
  return, retest, go), and that it can be used as a bias tool on higher timeframes as well
  as an entry on lower ones.'
category: structure
status: contested
aliases:
- BPR
- balance price range
- aggressive buy met with an aggressive sell
- inversion gap overlapping a new gap
preconditions:
- A higher-timeframe point of interest / liquidity raid gives a reason to be looking in that
  direction.
- Two opposing fair value gaps that overlap in price.
- Two opposing fair value gaps exist at overlapping prices.
detection_rules:
- Find a bearish fair value gap and a bullish fair value gap whose price ranges overlap.
- BPR := the intersection - whichever of the two gaps is smaller.
- Trade the retracement back into that zone, in the direction of the second (later) aggressive
  move.
- Reject a BPR that sits on the wrong side of the range's equilibrium - do not buy one in
  a premium.
- Require a prior liquidity raid / point of interest under (or over) the zone before taking
  it.
- 'If the zone gives too much risk, use it to frame the narrative instead: wait for an internal
  low to form and be taken, then look for the long.'
- Identify a bullish FVG that has been inverted and a bearish FVG formed over it (or vice
  versa).
- The price overlap of the two gaps is the balanced price range.
- Assign polarity from the more recent gap; a close beyond the balanced price range invalidates
  that polarity.
invalidation:
- Price closes through the overlap zone without reacting.
- The zone sits in a premium (for longs) / discount (for shorts) of the operative range.
- A candle close beyond the balanced price range in the opposing direction.
measurable:
- reaction rate at the intersection vs at the full extent of either gap
- how often the BPR sits on the correct side of equilibrium when it is otherwise valid
- frequency of BPRs per session on 1m / 15m
- hold rate of balanced price ranges vs single fair value gaps on first retest
