preconditions:
- A directional bias for the period, so that the phase read can be blended with it.
- A directional bias exists; the phases are read underneath it.
- An identified expansion leg to start from.
- A daily bias, to decide which branch is wanted.
- A completed expansion, ideally into a fair value gap or objective.
- A visible swing structure on the timeframe being classified.
- A completed expansion leg exists (in the reviews, typically two to three consecutive expansion
  days).
- A range or recent leg whose phase can be classified.
- Price has reached into a prior high or low.
detection_rules:
- 'Cycle: large range -> small range -> new large range.'
- The small range resolves as either a consolidation or a retracement; a reversal is the branch
  where the next large range is opposite.
- 'Count consecutive expansion days: after three days of expansion in one direction, anticipate
  a new phase of price rather than a further continuation.'
- 'Reversal test: after expansion through a level, the ONLY way to form a reversal is expansion
  in the opposite direction. Expansion met with expansion = reversal = a higher-timeframe
  wick.'
- 'Continuation signature (bullish): a closure over the down-close candles after the low is
  taken. Its absence is not, by itself, a reason to flip the bias.'
- 'Blend the phase with the daily bias: if bullish, want either a manipulation of the lows
  to trade higher, or a breakout of the highs then a retracement then a continuation.'
- 'Consolidation: price remains internal to a marked high and low (no close outside either).'
- 'Expansion: a one-sided trending move - large range with only shallow moves against it.'
- 'Retracement: a slow, shallow move opposing the trend, generally into a fair value gap,
  taking materially more bars than the expansion leg it retraces.'
- 'Reversal: expansion into a level met immediately by expansion in the opposite direction.'
- After an expansion, expect a small range next (retracement or consolidation); after a small
  range, expect a large range next.
- Three days of expansion (or two very large ones) is the point at which a new phase is anticipated
  rather than a further continuation.
- Start at expansion. Then classify the next leg.
- Slow shallow counter-move that closes through the series of opposing candles and forms a
  protected swing = retracement -> expect expansion again in the same direction.
- Counter-move that fails to form a protected swing, or price staying inside one candle's
  range, or an inside bar = consolidation -> expect one side of the range to be taken, then
  a move to the other side.
- Expansion one way immediately met with expansion the other way = reversal -> a higher-timeframe
  wick has formed; expect a continuation away from it.
- Expansion -> consolidation -> expansion opposite -> met with expansion = the manipulation
  branch, i.e. a reversal formed out of a consolidation.
- After any phase resolves, return to expansion and repeat.
- If the next phase is not yet decidable, let more candles print rather than guessing.
- 'After expansion, expect exactly one of three next phases: consolidation, retracement, or
  reversal.'
- Do not classify from the expansion candle itself - let a further daily candle close and
  read that.
- A candle that forms a strong directional closure is not consolidating; the read narrows
  to retracement or reversal.
- 'The next close decides: close lower (beyond) -> reversal, trade toward the lows. Close
  back inside the range -> retracement, trade back in the original direction toward the highs.'
- Once classified as a retracement, the bias is directional and the top-down procedure is
  run beneath it.
- Expansion - a directional leg that generates fair value gaps.
- Reversal - expansion into a level met with expansion out of it; aggressive move down followed
  immediately by aggressive move up (or the inverse).
- Retracement - a counter-move after which price continues in the prior direction; specifically,
  price does not expand back to make a higher low and then a higher high.
- Consolidation - a two-sided range; mark the range high and the range low.
- After a consolidation whose extreme is swept, expect a new phase of price.
- Three candles of expansion is given once as a cue that a new phase of price may be starting.
- 'After an expansion leg, the next phase is one of exactly three: a retracement that continues
  the direction, a consolidation, or expansion back the other way.'
- Test the three options in order against each new candle as it closes - does it look like
  a retracement, does it look like a consolidation - and if neither, it is expansion the other
  way.
- Expansion met with expansion is a reversal (stated flatly, and applied both at a low and
  at a high).
- If price cannot produce the closure needed to continue expanding, the leg is a consolidation
  - mark the high and low of the range and watch only those.
- Retracement is confirmed when price closes over the series of down-close candles that made
  the pullback (bullish case); mirrored for bearish.
- If price fails to close over that series and instead falls back inside the prior range,
  classify the phase as consolidation.
- Reversal requires expansion into the level and expansion straight back out - a V shape.
  Expansion in followed by a shallow retracement or by consolidation is continuation, not
  reversal.
- Once classified as consolidation, take no position until one side of the range is taken.
- Count consecutive expansion candles closing outside the previous candle's range.
- After ~3 such candles, anticipate a new phase (retracement, consolidation or reversal) rather
  than another continuation.
- Large expansion range followed by a slow / choppy retracement is read as a continuation
  signature.
- Do not take the mechanical previous-candle bias in isolation during consolidation — blend
  it with the phase.
- Price manipulated the edge of a range -> expect expansion.
- Price has already expanded -> expect consolidation.
- Price is retracing -> expect expansion.
- Price expanded into a high or a low -> expect a new phase of price; do not initiate in that
  direction.
- A new higher-timeframe candle open is where a new phase of price begins.
- Aggressive V-shape reversal off the level -> reversal.
- Consolidation at the level -> either a continuation or a pending reversal; not decidable
  yet.
- Retracement (two to three candles on the 1-minute) -> continuation.
- Do not classify from a single candle closure - read how price trades through the area.
invalidation:
- Expansion arrives in the opposite direction, converting a continuation read into a reversal.
- The phase call is provisional until a candle closes; the video repeatedly says to let another
  candle print when the current one is ambiguous.
- A reversal read is invalidated if expansion is met with expansion in the opposite direction
  again and the anchoring extreme is taken.
- A continuation read is invalidated when the counter-move goes beyond the EQ.
- The classifying close does not arrive - let another daily candle pass.
- A leg labelled retracement that instead makes a higher low and a higher high was a new expansion
  phase, not a retracement.
- A consolidation whose extreme is taken and holds transitions to a different phase.
- A retracement read is invalidated when price fails to close over the series of opposing
  candles and re-enters the range.
- A reversal read is invalidated when the move out of the level is slow or consolidatory rather
  than aggressive.
- Expansion simply continues; he accepts he misses that leg rather than chasing.
- The expected phase does not appear, which itself reclassifies the sequence.
- Price displaces through and closes over, which flips the read toward a reversal.
measurable:
- distribution of consecutive expansion-day counts before a phase change
- share of large ranges followed by a small range on the next candle
- frequency of each phase label by timeframe
- conditional probability of expansion given the previous bar-set was labelled consolidation
  vs retracement
- hit rate of the 'three days of expansion then a new phase' rule
- transition frequency matrix between the four phases
- forward return after each transition type
- share of counter-moves that qualify as retracement (protected swing) vs consolidation (none)
- agreement between the close-lower / close-back-inside test and the eventual outcome over
  a large daily sample
- base rates of the three phases following an expansion into a fair value gap
- frequency of each phase label per instrument per timeframe
- probability that a leg labelled retracement is followed by a new expansion in the same direction
- probability that a consolidation sweep is followed by a phase change within N candles
- distribution of which of the three phases follows a 2-3 day expansion leg
- hit rate of the close-over-the-series test as a predictor of continuation
- how often a consolidation range resolves to the side that was swept first
- forward return after the 3rd, 4th and 5th consecutive expansion close
- transition matrix between expansion, retracement and consolidation on daily closures
- share of phase changes that begin within n bars of a 4-hour candle open
- distribution of the three phases at swept levels
- continuation rate after a two-to-three-candle 1-minute retracement
