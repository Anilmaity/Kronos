ambiguities:
- '"Large range" and "small range" are never given a measure - not in points, not as a multiple
  of the previous range, not versus an average.'
- The three-day count is stated once, on one chart, as "we've had three days of expansion
  lower so we can get a new phase" - "can" not "will", and no rule for what to do on day four.
- Whether the expansion days must be consecutive closes outside the previous range is not
  restated here.
- The clip that says a missing continuation signature does not flip the bias also shows the
  bias being wrong, and gives no rule for when it WOULD flip.
- '''Large range'' vs ''small range'' is never quantified - it is judged against the immediately
  preceding leg, not against an ATR or a fixed lookback.'
- The phases are labelled after the fact in every worked example; no rule is given for how
  many bars must elapse before a label is committed.
- Consolidation and retracement are treated as interchangeable for the purpose of 'a small
  range follows a large range', yet they carry different trade instructions.
- '''Expansion'' itself has no size threshold; the whole flowchart is anchored on an undefined
  primitive.'
- '''Slow shallow move'' (retracement) vs a fast counter-move (reversal) is judged visually;
  only the protected-swing test is mechanical.'
- In the scalping video a consolidation is called a continuation signature outright, while
  the flowchart makes it a branch that can go either way -- the difference is that the bias
  resolves the branch, but this is stated only in the flowchart video.
- '''The range'' in ''close back inside the range'' is not defined - the previous candle''s
  range and the expansion leg''s range give different verdicts.'
- This maps close-back-inside to RETRACEMENT, whereas the library entry assembled from other
  units maps failing to close over the opposing series and falling back inside to CONSOLIDATION.
  The two must be reconciled before a detector is written.
- '''Strong bearish closure'' (the disqualifier for consolidation) is unquantified.'
- Nothing is said about how many candles may pass before the classification is abandoned.
- Sourced from an ASR (whisper-small) transcript, not YouTube captions; wording may be imprecise.
- In video Nlw-PZhoViQ the classification is run candle-by-candle as a live decision tree,
  which makes the sequence decidable, but the primitive judgements (does this leg look like
  a retracement) are still made by eye.
- Consolidation versus retracement is the pivotal call and is made by stated distrust of the
  move rather than by rule; in video UBTl7za9obc the speaker raises the retracement label,
  rejects it in favour of consolidation, and gives no criterion.
- Aggressive is never quantified; the only evidence offered is that a fair value gap was generated.
- Three candles of expansion as a phase-change cue is stated once in passing and may be a
  description of that instance rather than a threshold.
- A separate market-cycle ordering is given by a guest in t_talks_03 (expansion, consolidation,
  retracement, consolidation, expansion) which does not match this four-phase scheme; not
  reconciled.
- '''Series of down-close candles'' has no stated minimum count.'
- The V-shape test for a reversal is visual and unquantified - no measure of how aggressive
  the move out has to be.
- Whether 'expansion' requires a fixed number of days is not stated; the reviews use two to
  three days but he also says he will not trade after three days of expansion.
- '''3 days'' is stated once, in one example; elsewhere it is ''this continued expansion for
  multiple candles''.'
- Which of the three follow-on phases to expect is not predicted — only that the continuation
  read weakens.
- No measure separates a retracement from a consolidation; both are read visually off daily
  closures.
- Whether expansion can follow expansion directly is not addressed here (a guest concept elsewhere
  says it cannot).
- 'Contested inside this unit: in the live Q&A he disowns ''run'' and ''sweep'' as terms he
  uses, while in the indicator walkthrough he narrates a setup as the sweep and the closure
  back in, and the indicator carries a ''C1 sweep'' setting. Both readings are recorded.'
- The library concept inducement-equals-sweep records him equating inducement with a liquidity
  sweep, which sits against the disavowal here.
- '''Aggressive'' V-shape is not quantified.'
