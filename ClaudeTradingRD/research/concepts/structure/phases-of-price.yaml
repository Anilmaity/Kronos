id: phases-of-price
name: Phases of Price Delivery
variants:
  name:
  - Phases Of Price (expansion, retracement, consolidation, reversal)
  definition:
  - 'Price is always in one of four phases and the phases cycle: consolidation, expansion,
    retracement, reversal. The organising principle stated in the series is that the market
    alternates large ranges with small ranges. Expansion (large range) is followed by either
    a retracement or a consolidation (small range), which is followed by a new expansion;
    a reversal is the one case where expansion is followed immediately by expansion in the
    opposite direction. Each phase carries a different instruction: in a consolidation you
    wait for one side of the range to be manipulated; in a retracement you wait for a protected
    swing to form at a PD array; in an expansion you trade continuations off opposing candles;
    at a reversal you trade away from the swept extreme. This is a five-part series and the
    fifth part (blending the phases) is not in this unit.'
  - 'Four phases -- expansion, retracement, consolidation, reversal -- arranged as a closed
    flowchart that ALWAYS starts at expansion and always returns to it. Legal transitions:
    expansion -> retracement -> expansion in the SAME direction (continuation signature);
    expansion -> consolidation -> either a breakout (expansion same direction) or a manipulation
    (expansion opposite, which if met with expansion back is a reversal); expansion met with
    expansion = reversal, which forms a higher-timeframe wick and is followed by a continuation.
    He insists the phases must be blended with the daily bias, because the phase alone does
    not say which side to take -- the bias says whether he wants the low or the high of a
    consolidation run out.'
  - 'The gold example in the top-down video applies the framework with an unusually crisp
    close-based test. After continued expansion into a fair value gap he says he is looking
    for a new phase of price delivery, which will be a consolidation, a retracement, or a
    reversal, and that he uses the daily candles to tell him which - so he lets a further
    daily candle pass rather than classifying off the expansion itself. The candle that prints
    is not consolidating (it forms a strong bearish closure), so it is one of the other two,
    and the next close decides: if we close lower it is a reversal and he trades to the lows;
    if we close back inside the range he views it as a retracement and trades higher. This
    mapping conflicts with the library''s existing rule set, drawn from other units, where
    falling back inside the prior range is what classifies the phase as consolidation.'
  - 'The classification layer applied before any level is drawn. Every leg of price is labelled
    as one of four phases and the label determines what is looked for next. Expansion is a
    directional move that generates fair value gaps. A retracement is a counter-move that
    then continues the prior direction - it is a retracement rather than a new phase precisely
    because price does not expand back to make a higher low and then a higher high (bearish
    case inverted). A consolidation is a two-sided range whose high and low are marked and
    traded from. A reversal is expansion into a level met with expansion out of it - an aggressive
    move one way immediately followed by an aggressive move the other, which on the timeframe
    above is a single reversal candle. The phase sequence is what he trades: after expansion
    he wants a retracement into a point of interest and then a new expansion; after a consolidation
    whose extreme is taken, a new phase can begin.

    '
  - 'After a period of expansion, price enters exactly one of three next phases: retracement
    (a shallow pullback that then continues the original direction), reversal (a V-shaped
    turn - expansion in, expansion straight back out), or consolidation (a range). The phase
    is classified from daily closures, not from the shape of intraday price. The classification
    is the gate for whether any trade exists: consolidation means no interest until one side
    of the range is taken, retracement means look for the continuation, reversal means the
    prior leg is done.

    '
  - 'The framing he blends with candle-to-candle bias: after several candles of expansion
    in one direction, a new phase of price delivery — retracement, consolidation or reversal
    — becomes likely, and he stops taking the mechanical continuation read at face value.
    He states 3 days of expansion as the trigger in the daily example.'
  - 'Asked how to spot a consolidation early, he compresses the whole framework into three
    if-then statements: in the simplest sense price either expands or consolidates, so if
    price manipulates the edge of a range you look for it to expand; if price has already
    expanded you look for it to consolidate; and if price is retracing you look for it to
    expand. He couples that with daily closures as the read. Two consequences recur through
    the unit. A move that expanded into a low or a high is due a new phase of price, which
    is why he will not initiate in that direction there. And a new higher-timeframe candle
    - the 10:00 a.m. 4-hour open is his example - is where a new phase of price can start,
    so it is both the exit for the old phase and the earliest entry for the next.

    '
  - 'Asked how to tell a run from a sweep, he rejects the vocabulary outright - he does not
    use those terms and says he does not know what they mean - and substitutes the phases
    of price at the level. The procedure he gives is a three-way test applied once price reaches
    into a prior high or low: an aggressive V-shape reversal is a reversal; a consolidation
    is either a continuation or a coming reversal; a retracement is a continuation. He works
    it on a 3-minute chart, drops to the 1-minute to size the pullback, and calls a two-to-three-candle
    pullback a retracement rather than a reversal. He is explicit that he does not judge it
    from one closure.'
definition: 'The Shorts compress the cycle into a slogan and two decidable sub-rules. The
  slogan: LARGE RANGE, SMALL RANGE, AND THEN A NEW LARGE RANGE - stated twice in one clip,
  once as the anticipation and once as the confirmation. The counting rule: three days of
  expansion lower means a new phase of price can be expected rather than a fourth continuation.
  The reversal rule, stated as an exclusive: if price has expansion through a low, THE ONLY
  WAY to form a reversal is to get expansion opposite - expansion met with an expansion is
  a reversal, and it is the higher-timeframe wick. In the same clip, the failure of the alternative
  (no closure over the down-close candles, i.e. no continuation signature) is explicitly NOT
  treated as a reason to flip the bias.'
