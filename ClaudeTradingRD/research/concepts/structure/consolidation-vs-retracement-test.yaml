id: consolidation-vs-retracement-test
name: The Protected-Swing Test For Consolidation vs Retracement
definition: 'The one mechanical test in the corpus for the consolidation phase, which otherwise
  blocks everything downstream of it. A counter-move that looks like a retracement IS a retracement
  only if it forms a protected swing -- i.e. price reaches an important level and then closes
  through the series of opposing candles that made the extreme. If it does not, it is a consolidation.
  Three corroborating signatures are given: price staying inside a single prior candle''s
  range; an inside bar; and a close-through that takes longer than about half the candle to
  occur (that is ''usually just a consolidation''). The practical consequence is a phase switch:
  with a retracement he waits for the continuation, with a consolidation he stops waiting
  and instead demands a sweep of one side of the range.'
variants:
  definition:
  - 'This unit supplies a second, closure-based form of the same test, and it is the only
    mechanical answer this unit gives to the question the other three Chart Lessons decide
    by eye. A leg that has expanded is provisionally read as expansion -> retracement -> expansion.
    The retracement label is only earned if price then produces the closure that continues
    the expansion (a close below the level for a bearish sequence). If price cannot produce
    that closure, the leg is not a retracement at all - it is a consolidation, and the operator
    switches immediately to range handling: mark the high and the low and watch only those.
    The same closure test is used one level up to separate a retracement from a reversal:
    a leg against the move is left unclassified on purpose, and the opposing-direction change
    in the state of delivery is what resolves it. The explicit stance is that the classification
    does not have to be made early - it is decided by whether a closure arrives, not by judgement.

    '
category: structure
status: contested
aliases:
- is it a retracement or a consolidation
- consolidation test
- is this a retracement or a reversal
- we are now just consolidating
- failure to close below this level
preconditions:
- An expansion leg has completed and a counter-move is in progress.
- An expansion leg has completed and a counter-move or a stall is in progress.
- A defined level whose breach would continue the expansion.
detection_rules:
- Mark the extreme of the counter-move and the series of opposing candles that made it.
- If price closes through that series (protected swing forms) -> retracement. Continuation
  is expected in the original direction.
- If no such close occurs -> consolidation. Mark the range high and low and wait for one side
  to be swept.
- 'Corroborating signatures of consolidation: price remains inside one prior candle''s range;
  the current bar is an inside bar; repeated failures to close over the level.'
- 'Timing signature: if the close-through takes longer than roughly half the candle, treat
  it as consolidation rather than a confirmed reversal.'
- Once in consolidation, only the edges of the range are traded, and only after a sweep plus
  a change in the state of delivery.
- Provisionally frame the sequence as expansion, retracement, expansion, and identify the
  level that must be closed through for the second expansion.
- If that closure arrives, the leg was a retracement and the expansion continues.
- If the closure repeatedly fails to arrive, reclassify the leg as a consolidation - stop
  looking for the continuation and mark only the range high and the range low.
- 'To separate a retracement from a reversal, do not decide early: wait to see whether the
  opposing-direction change in the state of delivery prints. Its arrival makes the leg a reversal;
  its absence leaves the original direction in play.'
- 'A separate, softer signature is stated in the same video: after a failure to close below
  the level, the high is usually taken out - so a failed closure predicts a sweep of the opposite
  side rather than immediate continuation.'
invalidation:
- One side of the consolidation range is swept and confirmed -- the consolidation resolves
  and the phase clock restarts at expansion.
- The closure that was awaited finally arrives late - the leg was a slow retracement, not
  a consolidation.
- One side of the consolidation range is swept and the sequence restarts at expansion.
measurable:
- share of counter-moves classified consolidation vs retracement by this test
- forward return of the range-edge trade after a consolidation sweep
- how often 'inside bar' and 'no protected swing' agree
- share of counter-moves that eventually produce the continuation closure, by how many candles
  it took
- hit rate of 'no closure => the opposite extreme of the range is taken next'
- forward return after reclassification to consolidation vs after the closure arrives
