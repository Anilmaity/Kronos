ambiguities:
- The test is stated once, in passing, inside a longer example -- it is not presented as a
  named rule, so its intended generality is inferred from its repeated use rather than declared.
- '''Half of the candle'' is a fraction of the higher-timeframe candle''s duration, but nothing
  says whether the count starts at the candle open or at the sweep.'
- The three signatures (no protected swing / inside range / inside bar) are never reconciled
  when they disagree.
- Sourced from an ASR (whisper-small) transcript, not YouTube captions; wording may be imprecise.
- How many failed closure attempts are required before reclassifying is not stated - in the
  worked example it is one candle that cannot close through.
- Whether the closure must be a body close is not stated, though the whole video is read on
  closures.
- The passage that states the CISD differentiates a retracement from a reversal is one where
  the ASR garbles the phrase for the change in the state of delivery; the reading given here
  is recovered from context (he is waiting for a bullish CISD to decide whether the leg is
  a reversal) and from the identical construction used elsewhere in the same video.
