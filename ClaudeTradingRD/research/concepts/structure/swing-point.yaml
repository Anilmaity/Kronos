ambiguities:
- The three-candle test uses lows/highs, not bodies, but the same speaker elsewhere in this
  unit measures things body-to-body without saying which governs here.
- Nothing says how far apart two swing points must be to both count as relevant (the separation
  question is raised in q3nauvjT3q0 only in relation to equal highs/lows).
- The candle-count definition of a swing point (how many candles either side) is not restated
  in this unit.
- The claim that a reversal must form a swing point is tautological at the bar level and does
  not by itself establish that the model has an edge - he treats it as if it does.
- Whether the neighbouring candles are compared on wicks or bodies is not stated.
- No separation or 'relevance' requirement is applied in these Shorts (other library entries
  add one).
- The 3-bar fractal definition is stated, but in practice the speaker filters heavily, attending
  only to the obvious highs and lows on the outside of the range. No filter criterion (bar
  count, range size, ATR, lookback) is given, so a literal 3-bar detector will produce many
  more swings than he uses. This is the largest automation gap in the unit.
- Wick-based vs body-based highs/lows is never stated; all chart examples appear to use wicks.
- Strict vs non-strict inequality (equal lows on either side) is not addressed.
- The breaker video says a swing must be 'confirmed' before counting but does not restate
  how many bars confirmation takes.
- Whether wicks or bodies define the high/low is not stated here; the examples are read off
  wicks.
- Equal highs/lows (a low exactly equal to its neighbour) are not covered by the strict inequality
  he gives, yet he marks 'basically exactly equal' lows on the chart.
- The gap between the unfiltered 3-bar fractal and the swings he actually uses is restated
  but still not closed - no separation, range or lookback filter is given.
- He both registers a higher high before a swing confirms and rejects a shift because 'we
  don't have a swing we break' - the two are used in the same walkthrough without a rule reconciling
  them.
- Wicks vs bodies for swing detection is not stated (the chart work uses wicks).
