id: swing-point
name: Swing High / Swing Low
definition: 'The foundational premise of the whole model, stated identically in three videos
  in this unit: price cannot reverse without forming a swing point -- bearish to bullish requires
  a swing low, bullish to bearish requires a swing high. Mechanically a swing low is a low
  with a HIGHER LOW on each side (three candles), and a swing high a high with a lower high
  on each side. The swing candle is candle 2 of the model. Because the third candle is needed
  to confirm it, a swing point is only complete one candle late, which is why the candle 2
  closure and candle 3 closure definitions exist at all.'
variants:
  definition:
  - 'Answering whether the fractal model will stop working now that many people use it, he
    restates what the model is anchored to: it is based off swing points, and a market cannot
    reverse without forming one - he challenges the chat to find a reversal that formed without
    a swing point and offers to delete his channel if anyone can. Because the model keys on
    something price must do to change direction, he is not concerned about crowding. He gives
    the same account of how he built the model in the first place: he learned swing points,
    decided which swing points he would focus on (a candle 2 or candle 3 closure), then worked
    out how to confirm them on a lower timeframe and how to build a mechanical entry around
    them.

    '
  - SHORTS EVIDENCE for the three-candle definition AND for the confirmation delay it implies.
    A swing high is a high with a LOWER HIGH ON EACH SIDE; a swing low is a low with a higher
    low on each side. Because the right-hand candle must exist, a swing point cannot be confirmed
    at the moment the extreme prints - he narrates checking a low, finding no candle on the
    right, and deliberately letting ONE DAY PASS before treating it as a confirmed swing low.
  - 'A swing low is a low that has a higher low immediately to its left and a higher low immediately
    to its right; a swing high is a high that has a lower high immediately to its left and
    a lower high immediately to its right. The swing is only readable once the right-hand
    bar exists, so identification always lags by at least one bar. Swing points are the anchors
    for every other primitive in this corpus: liquidity pools sit beyond them, ranges are
    drawn between them, and fib/OTE tools are anchored to them.

    '
  - 'Restated at the opening of the relevant-swings video in its plainest form, and it matches
    the three-bar definition recorded elsewhere in the corpus: a bullish swing point is a
    candle with a low that has a higher low on its right and on its left; a bearish swing
    point is a candle with a high that has a lower high on its left and right. Everything
    downstream in this unit - relevant swings, candle 2 / candle 3 closures, the fractal model
    itself - is filtered from this set.'
  - 'The market structure video treats swing formation as a timing problem rather than a definition
    problem: it names the liquidity video as the prerequisite for the swing definition itself,
    and then spends the walkthrough on when a swing may be USED. Two statements matter. First,
    a higher high can be recorded as soon as price trades above the prior high, even if the
    swing high containing it has not formed yet - he says so explicitly and then narrates
    ''let''s see if a swing forms'' bar by bar. Second, he filters: highs and lows made inside
    a leg that get swept before price continues are not counted, and the comparison is made
    against the prominent prior extreme.'
