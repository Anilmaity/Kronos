preconditions:
- Three consecutive candles.
- Price has turned.
- Three consecutive candles on the timeframe in question.
- At least three consecutive bars exist.
- Three consecutive candles are complete.
- The 3-bar swing definition from the liquidity video is assumed known.
detection_rules:
- 'Swing low: the middle candle''s low is lower than the low of the candle on each side.'
- 'Swing high: the middle candle''s high is higher than the high of the candle on each side.'
- The swing candle is labelled candle 2; the continuation after a confirmed swing is candle
  4.
- Within the fractal model only swing points are traded -- where no new swing has formed for
  several candles, only continuation of the existing direction is favoured.
- SMT against a correlated asset, or a daily change in the state of delivery, may substitute
  for the swing point's sweep.
- Any reversal necessarily prints a swing point; there is no reversal without one.
- Of all swing points, only those qualifying as a candle 2 or candle 3 closure are traded.
- Confirm the chosen swing point on the lower timeframe before building the entry.
- Swing high := high[i] > high[i-1] AND high[i] > high[i+1].
- Swing low := low[i] < low[i-1] AND low[i] < low[i+1].
- The right-hand candle must have completed - a swing point is only confirmed one candle later.
- If the confirming candle does not yet exist, let one more candle pass before acting on it.
- swing_low(i) := low[i] < low[i-1] AND low[i] < low[i+1].
- swing_high(i) := high[i] > high[i-1] AND high[i] > high[i+1].
- A swing at index i may only be used from bar i+1 onward (the right-hand bar must have closed).
- If a subsequent low fails to trade below the prior swing low, treat the two as one pool
  (see relatively-equal-highs-lows).
- The right-hand candle must have printed, so a swing at index i is usable only from i+1.
- Swing points are then filtered by separation (relevant vs failure swing) before use.
- A higher high / lower low may be registered on the trade beyond the prior extreme; the SWING
  itself is only usable once the right-hand bar has formed.
- Interior highs and lows that are swept before price continues are not counted as structure.
- Comparison is always made against the prominent prior extreme, not the nearest one.
- A candidate structure break is rejected when there is no swing to break, even where a higher
  high exists.
invalidation:
- The swing point's extreme is taken out.
- n/a - a structural primitive.
- The swing low is 'taken' / 'swept' once price trades below it; the speaker then stops tracking
  it and moves attention to the next swing in that direction.
- Not applicable - this is a primitive definition.
- Not applicable - this is a primitive.
measurable:
- swing points per month per timeframe
- how often a 3-candle swing point is later violated
- share of reversals in a sample that qualify as C2 or C3 closures rather than plain swings
- count of confirmed swing points per timeframe per month
- cost in R of the one-candle confirmation delay
- count of raw 3-bar swings per session vs count the speaker actually annotates (measures
  the size of the discretionary filter)
- median bars between a swing forming and being swept
- count of three-bar swing points per HTF window, split into relevant vs failure
- count of 3-bar fractal swings vs the count he actually marks on the same chart window
- effect on structure-shift counts of requiring the right-hand bar before use
