ambiguities:
- No time bound is given for how long the domino may take to complete.
- The triad is said to scale with trading horizon ('depends on what your core time frames
  are') but only the day-trading 15/5/1 version is stated.
- The trade-off between confirmation and entry price is acknowledged but no rule resolves
  it.
- Gene gives the principle (H4/H1 as intermediate) and Nick gives the explicit pairing table;
  the two are compatible but were not stated as one rule.
- The MMXM talk in this unit gives a different pairing table (monthly-daily, weekly-4H, daily-1H,
  4H-15m, H1-5m, M15-M1) for internal/external range plays specifically.
