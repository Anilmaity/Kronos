id: intermediate-timeframe-bridge
name: Demand The Confirming Structure Shift On The Intermediate Timeframe
variants:
  name:
  - Intermediate Timeframes Bridge HTF Analysis And LTF Execution
  definition:
  - 'The failure mode named in this unit is framing trades directly from the execution timeframe
    against a higher-timeframe idea. The fix is an explicit intermediate layer: the daily
    and weekly supply direction, the 4-hour and 1-hour supply the narrative and the dealing
    range, and the 15-minute or 5-minute are used only to time an entry that was already justified
    on the intermediate timeframe. A parallel rule from another speaker in this unit pairs
    each higher-timeframe point of interest with a specific execution timeframe: a 4H point
    of interest requires 15-minute confirmation before a 1-minute execution, and a 1-hour
    point of interest maps to a 5-minute execution.

    '
definition: 'The timeframe triad in this unit is 15-minute / 5-minute / 1-minute, and the
  load-bearing claim is where the confirming structure change must appear. Trade For Opportunity,
  relaying ICT, says a trader needs three timeframes - a high, an intermediate and a low -
  and that the most confident structure changes should be demanded on the intermediate timeframe
  at minimum, involving both displacement and a close beyond the structure that would invalidate
  the previous trend. The host restates it concretely: with 15/5/1 you ideally want the structure
  shift on the five-minute. He also gives the sequencing preference - a 1-minute break leading
  to a 5-minute break leading to a 15-minute break, a domino - while conceding the cost honestly:
  by the time the five-minute has confirmed you have usually missed the low-risk entry, so
  the trader is choosing a point on that trade-off rather than getting both. The triad itself
  scales with horizon; only the day-trading version is given.'
category: structure
status: contested
aliases:
- 15 5 1
- domino
- the rabbit and the eagle
- H4/H1 narrative, M15/M5 execution
preconditions:
- A higher-timeframe bias or point of interest already established.
- A higher-timeframe directional bias exists.
detection_rules:
- 'Use three timeframes: high (15m), intermediate (5m) and low (1m).'
- Require the confirming structure change on the intermediate timeframe at minimum, with displacement
  and a close.
- Prefer the sequence 1m break -> 5m break -> 15m break (the domino).
- Accept that waiting for intermediate-timeframe confirmation forfeits the lowest-risk entry.
- Direction is taken from the daily/weekly.
- The dealing range and narrative are drawn on H4/H1.
- M15 is used to confirm what was already visible on H1; M5/M1 are execution only.
- 'Pairing: 4H POI -> 15m confirmation -> 1m execution; 1H POI -> 5m execution.'
invalidation:
- The lower-timeframe break does not propagate to the intermediate timeframe.
- An execution-timeframe pattern is taken with no intermediate-timeframe justification.
measurable:
- win rate and R of entries confirmed on the intermediate timeframe vs entries taken on the
  low timeframe alone
- average adverse excursion given up by waiting for the intermediate confirmation
- win rate of executions that had intermediate-timeframe confirmation vs those that did not
