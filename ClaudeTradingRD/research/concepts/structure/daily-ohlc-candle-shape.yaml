preconditions:
- A draw on liquidity has been identified; that is what selects the shape.
- A completed daily (or 4-hour) candle.
- A directional bias for the period.
- A daily directional read exists before the day is traded.
- A directional read on the daily candle exists (from daily closures and phases of price).
- A daily candle whose close does not settle the direction (it closes back inside its range).
- A lower-timeframe chart on which the intraday order of the high and the low can be read.
- A completed daily candle.
detection_rules:
- Bullish expectation -> expect open, LOW, high, close. Position at or below the opening price.
- Bearish expectation -> expect open, HIGH, low, close. Position between the high already
  made and the opening price.
- The shape is selected by the draw on liquidity, not by the candle itself.
- 'Confirmation while the candle develops: the opening price should SUPPORT the lower-timeframe
  candles - nothing closing below it in the bullish case.'
- 'AMD mapping: consolidation around the opening price = accumulation; the excursion beyond
  the opening price = manipulation; the move to the far extreme = distribution.'
- 'Degenerate case he names explicitly: if the candle''s low IS its open there is no wick
  and no entry window.'
- 'Bearish directional day: the high is made before the low in time, and the close is in the
  lower portion of the range (Open-High-Low-Close).'
- 'Bullish directional day: the low is made before the high in time, and the close is in the
  upper portion of the range (Open-Low-High-Close).'
- 'Indecision candle: open and close at relatively the same point, with no sustained directional
  expansion.'
- 'The same shape is applied to the 4-hour candle: one 4-hour candle can contain a full London-consolidation
  / New York-sweep / expansion sequence as its own Power of Three.'
- Record the time order of the period's open, high, low and close.
- Open then low first -> bullish shape. Open then high first -> bearish shape.
- The wick formed first must be confirmed (CISD or lower-timeframe candle closure) before
  the body is traded.
- Bullish continuation additionally requires the opposing move to respect the EQ of the previous
  period's range.
- Sell day := open, high, low, close in that order; the high is the manipulation.
- Buy day := open, low, high, close in that order; the low is the manipulation.
- 'Pair the manipulation point with the two opens: sell-day high above them, buy-day low below
  them.'
- A day that gaps and then oscillates around the midnight open is classified as not clean;
  use the level as a pivot rather than expecting the shape.
- 'Bearish daily: expect open -> high -> lower -> close. Position at or above the daily open.'
- 'Bullish daily: expect open -> low -> higher -> close. Position at or below the daily open.'
- If bearish, price should NOT retrace above 50% of the opposing candle range; that indicates
  a wick forming the other way and the bearish read is done.
- A candle that opens and delivers immediately with no wick gives no OHLC shape and therefore
  no validation of the idea.
- Only the daily open and an equilibrium mark stay on the chart during analysis.
- Drop to the hourly and reconstruct the day in time order from the open.
- Open, low first, then high, then close back in => the bullish shape.
- Open, high first, then low, then close back in => the bearish shape; read the candle as
  bearish regardless of the sign of the close.
- 'Applied forward: a day that opens and makes its high first is forming the upper wick and
  supports a bearish setup for that day.'
- The shape read can be outvoted by a closure that is too strong the other way - when the
  shape says bearish and the close is bullish and late in the day, the setup is called less
  than ideal and more lower-timeframe confirmation is required.
- A doji daily closure yields no bias for the following day.
- Protected swings on both sides with price in the middle is likewise a no-bias state.
- 'In that state, let the day form: watch which side of the wick is respected on the open,
  or whether the previous day extreme is swept.'
- Defer the decision to the New York session rather than pre-framing it.
invalidation:
- Lower-timeframe candles begin closing through the opening price against the expected shape.
- Not applicable (a classification of a completed candle).
- Price opens and makes the extreme in the wrong order for the bias - the setup is invalidated
  (one worked SMT example is abandoned for exactly this reason).
- Price making its extreme on the wrong side of the opens, or oscillating across them, means
  the shape is not in play that day.
- Price trading above the invalidation level above the daily open (bearish case).
- Price trading above 50% of the opposing candle range.
- The daily candle building the opposite shape (open-low-high-close when bearish was expected).
- The reconstructed order of extremes is the opposite of the assumed one.
- The following day opens and makes its low first when a bearish shape was expected.
- A directional closure replaces the no-bias state.
measurable:
- proportion of directional daily candles whose extreme forms on the correct side of the open
  first
- R available between the open and the eventual extreme
- distribution of OHLC vs OLHC vs indecision daily candles per instrument per month
- time-of-day distribution of the daily high and daily low
- body-to-range ratio threshold that best separates the speaker's directional days from his
  indecision days
- distribution of OLHC vs OHLC days conditional on the previous day's closure type
- expectancy of trading the body after the first extreme is confirmed
- share of days that deliver a clean OHLC / OLHC shape
- share of the daily range captured by entering at the second point of the shape
- distribution of daily candle shapes (OHLC vs OLHC vs other) per instrument
- hit rate of the 50%-of-opposing-candle invalidation
- how often the daily wick reaches back past the daily open
- hit rate of 'high made first => the day closes in the lower half' by instrument
- how often the shape read and the close sign disagree, and which one predicts the next day
  better
- follow-through of days that open and make the expected extreme first
- next-day range and directional outcome following doji daily closes
- share of no-bias days that resolve in the New York session
