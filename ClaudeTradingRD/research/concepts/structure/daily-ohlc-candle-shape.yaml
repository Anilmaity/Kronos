id: daily-ohlc-candle-shape
name: OHLC / OLHC Daily Candle Shape
variants:
  name:
  - OHLC / OLHC Daily Candle Shape (and the Indecision Candle)
  - Daily Open High Low Close (OHLC / OLHC)
  definition:
  - 'The vocabulary the whole daily-profile series uses to state what a completed day looks
    like. A bearish directional day is Open-High-Low-Close: the day opens, prints its high,
    expands lower, and closes near the low. A bullish directional day is Open-Low-High-Close.
    The manipulation leg forms the wick of the daily candle and the expansion leg forms the
    body. A day that is neither is an indecision candle - open and close at relatively the
    same point with no directional expansion - which is the daily signature of Seek & Destroy.

    '
  - 'The shape a candle prints in time order is the read. Stated flatly in this unit: when
    price opens and makes a LOW first, that is bullish; when price opens and makes a HIGH
    first, that is bearish. A bullish day is therefore expected to deliver open-low-high-close,
    and a bearish day open-high-low-close. This is the target of the whole intraday procedure:
    the wick (the first extreme) is allowed to form and confirm, then the body is traded.'
  - 'EARLIER RECORDING. The daily profile is taught as a four-point shape: a sell day delivers
    open, then high, then low, then close; a buy day delivers open, then low, then high, then
    close. The shape is used to locate where in the day the entry must happen - the second
    point (the high on a sell day, the low on a buy day) is the manipulation to be sold or
    bought, and this video anchors that point in price by pairing it with the midnight and
    08:30 opens. He also shows the degraded case: a day that gaps and then chops around the
    midnight open delivers no clean shape, and the levels are used as pivots instead.'
  - 'The foundation of his model: he is only ever trying to trade the shape of the daily candle.
    If bearish he expects open, then a high (the wick), then delivery lower into the close
    - so he wants to be selling at or above the daily open, in the wick of the candle. If
    bullish, open, then a low, then delivery higher. The entire chart he analyses on carries
    only the daily open and an equilibrium mark.

    '
  - 'Used here as the tie-breaker when the daily close itself is not conclusive. A daily candle
    that closes back inside its range tells you very little on its own, so he drops to the
    hourly and asks a single question about the order in which the day was built: did price
    open, trade lower, trade higher and close back in - or did it open, trade higher, trade
    lower and close back in. The answer is the read. Because that day opened and made its
    high first, he calls it more of a bearish candle even though the closure is bullish. The
    same shape test is then applied prospectively to the following day: opening and creating
    the high first is called a good indication of a bearish setup, because it is the upper
    wick forming. The order of extremes is therefore treated as evidence independent of, and
    sometimes opposed to, where the candle closed.

    '
  - 'This unit adds the no-information case, worked live on gold. A daily doji closure means
    he does not have much bias going into the next day, because the day can do whatever it
    wants; he says outright that this is not a good closure and shows what a good one would
    have looked like. The positional test he applies is symmetric: with a protected swing
    on each side and price sitting in the middle, the day has to be let to form - does it
    open and respect one side of the wick and trade higher, respect the other side and trade
    lower, or sweep the previous day high? Until that resolves he watches what Asia and London
    do and defers the decision to New York.'
  category:
  - time
definition: 'THE DEDICATED VIDEO the library recorded as missing. The argument is arithmetic
  rather than behavioural: every candle has an open, high, low and close, so a bullish candle
  that does not open exactly on its low MUST trade below its open to put the low in before
  expanding up - open, low, high, close. A bearish candle must put its high in above the open
  first - open, high, low, close. The trading consequence is positional: with a bullish expectation
  look for buys BELOW or NEAR the opening price; with a bearish expectation look for sells
  BETWEEN the high and the opening price. Which of the two shapes you expect comes entirely
  from the draw on liquidity. He demonstrates it on the weekly (read from daily candles),
  the daily (using the MIDNIGHT opening price as the daily open, executed on 15-minute) and
  the 4-hour (executed on 5-minute), and closes by mapping the shape onto AMD.'
