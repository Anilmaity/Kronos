ambiguities:
- 'EVOLUTION / DIRECT CONFLICT: the daily open used in this recording is the MIDNIGHT opening
  price. The later canon anchors the daily candle at 18:00 New York and the Q&A answer is
  ''I always use 18:00''. This is the earlier recording; see daily-open-eighteen-hundred.'
- No close-location or body-to-range threshold is given for calling a candle directional.
- The rule is about the ORDER of the extremes, so it is only decidable while the candle is
  forming; on a closed candle the order is not recoverable without lower-timeframe data.
- No tolerance for 'near the open'.
- The speaker explicitly defers the definition to a separate 'Open High Low Close' video that
  is not in this unit, so this entry captures only the usage inside the daily-profile series.
- '''Relatively the same point'' for the indecision candle is not quantified; the only figure
  given is an 80-point NQ close-to-open distance described as small, which is an illustration
  and not a threshold.'
- No body-to-range or close-location threshold is given for the directional shapes either.
- The rule is about the ORDER of the extremes, so it is only decidable intrabar; on a closed
  candle it requires lower-timeframe data.
- No tolerance is given for the degenerate case where the open IS the extreme (no wick).
- Earlier recording; the updated material carries the same OHLC/OLHC framing plus an indecision-candle
  case that is absent here.
- No test is given for classifying the day as a buy or sell day in advance - the shape is
  applied under an assumed bias.
- '''Isn''t very clean'' is the only label for the degraded case; no criterion separates clean
  from unclean days.'
- The daily candle open convention is inconsistent - he says he uses the 6 p.m. open but also
  that he does not care what happens at midnight price.
- '''Equilibrium mark'' is described as the EQ of the previous day range in one place but
  not defined generally.'
- How far above the daily open selling is acceptable is bounded only by the 50%-of-opposing-candle
  rule.
- Sourced from an ASR (whisper-small) transcript, not YouTube captions; wording may be imprecise.
- No tolerance is given for how much of a wick counts as 'trading higher first' - a one-tick
  excursion above the open is not distinguished from a substantial upper wick.
- The shape read and the closure read are explicitly allowed to conflict, and the conflict
  is resolved by demanding more confirmation rather than by ranking the two.
- Which lower timeframe to reconstruct the day on is not stated; the hourly is used here without
  comment.
- '''Doji'' is never quantified - no body-to-range ratio is given.'
- '''In the middle'' between the two protected swings is not bounded.'
