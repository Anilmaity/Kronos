ambiguities:
- 'THE SAME CONTRADICTION THE LIBRARY ALREADY CARRIES SURVIVES HERE, and these two Shorts
  are its clearest statement: one says the retracement is SLOW (it consumes more time than
  the expansion it retraces), the other says it must be QUICK. No bar count or duration separates
  the two readings.'
- '''Aggressive'', ''fast'', ''slow'' and ''shallow'' are defined only against each other.
  There is still no threshold - no bar count, no fib depth, no ATR multiple.'
- '''Small range'' and ''large range'' are relative to the adjacent leg, which is stated by
  implication in the worked example but never as a rule.'
- '''Hangs around'' as the consolidation trigger has no duration bound.'
- 'Two of the stated criteria pull in opposite directions and are never reconciled: the retracement
  should be SLOW (more bars than the expansion) but also QUICK (''you want to see them be
  quick''), the latter being the test for not degenerating into a consolidation. No bar count
  separates the two.'
- '''Shallow'' is unquantified - no fib or percentage bound is given, and one example explicitly
  allows it to ''dig a bit deeper'' as long as the bodies respect the gap.'
- Whether the bodies or the wicks must respect the fair value gap is stated only once, in
  passing ('you can see how the bodies respect').
- '''Slow'' and ''shallow'' are the two operative words and neither is given a bar count or
  a percentage.'
- One Short concedes the retracement 'digs a bit deeper' while still qualifying, on the ground
  that the bodies respect the level - so the test is on bodies, but no depth limit is given.
- No rule distinguishes a retracement from a consolidation at the same location.
