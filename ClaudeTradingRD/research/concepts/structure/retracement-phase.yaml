id: retracement-phase
name: Retracement (Phase Of Price)
definition: 'The Shorts compress the retracement definition into a single contrasting pair
  that the long-form videos never state side by side: expansion is aggressive, fast, and large
  range; retracement is slow and shallow in a small range. This is the corpus''s only explicit
  gloss on what "aggressive" and "shallow" mean - they are the two halves of the same speed-and-range
  contrast, defined against each other rather than against a threshold. A second Short adds
  the degeneration test: a retracement is also supposed to be QUICK, and if price starts back,
  fails to close through, and then hangs around, it is re-labelled a consolidation. The worked
  example measures the retracement in time consumed relative to the expansion it retraces
  (candles on the way back taking up the range of about three hours of expansion).

  '
variants:
  definition:
  - 'A retracement is the opposite of an expansion: a slow, shallow move opposing the trend,
    sitting between two expansions. Its stated signature has three parts - the move is slow
    (it consumes materially more bars than the expansion it retraces), it is shallow, and
    it terminates in a PD array, generally a fair value gap. Failure swings forming on the
    opposing side during the retracement are treated as the expected accompaniment and become
    the targets once the new expansion begins. A retracement that fails to confirm - price
    starts back, fails to close through, and then hangs around - is re-labelled a consolidation.'
  - 'Two Shorts supply a one-line definition: a retracement is a slow, shallow move opposing
    the higher-timeframe trend. The operational contrast is explicit - if the counter-move
    is an expansion instead, that is a reversal, not a retracement. The destination is normally
    a PD array, usually a fair value gap. The instruction for participating is to wait until
    the retracement phase is over, drop to the lower timeframe for a change in the state of
    delivery, and get on side during or just before the expansion that follows.

    '
category: structure
status: contested
aliases:
- slow shallow move
- large range to small range
preconditions:
- An expansion leg has completed.
- In the worked example the continuation candidate is a fair value gap left by that expansion.
- An expansion leg has just completed.
detection_rules:
- 'Contrast test, stated as a pair: expansion = aggressive, fast, large range. Retracement
  = slow, shallow, small range.'
- 'Measure the counter-move in time consumed against the expansion it retraces (worked example:
  the move back took up the range of about three hours of expansion).'
- 'Continuation sequence wanted: expansion, retracement, expansion.'
- 'Degeneration test: if price starts a retracement, fails to confirm it with a close through,
  and then hangs around, re-label the leg a consolidation.'
- 'Two acceptable actions once the retracement is in place: take the candle closure as the
  model, or wait for a protected swing to form and take that.'
- 'The counter-trend move is slow: it takes visibly more candles than the expansion leg it
  is retracing (worked examples: 9 hours retracing 3 hours of expansion; 8 candles retracing
  a 3-candle leg).'
- The move is shallow relative to the expansion leg.
- It terminates at a PD array, generally a fair value gap left by the expansion.
- Failure swings form on the opposing extreme during the retracement and become the targets.
- 'Two accepted ways to act: take the candle 2 closure inside the fair value gap on a lower
  timeframe, or wait for the closure through the series of opposing candles (protected swing)
  on the current timeframe.'
- Re-label as consolidation if the retracement fails to confirm with a closure and price then
  ranges instead.
- A counter-trend move that is slow and shallow = retracement.
- A counter-trend move that is an expansion = reversal, not retracement.
- The retracement normally terminates in a PD array, usually a fair value gap.
- Do not enter during the retracement; wait until it is over.
- Confirm with a lower-timeframe change in the state of delivery, then enter for the following
  expansion.
invalidation:
- The counter-move is aggressive, fast and large range - that is an expansion against you,
  not a retracement.
- The retracement never confirms and price ranges instead - the label moves to consolidation
  and, if it happens on the lows, that consolidation is itself the thing to read.
- The counter-move is aggressive and displaces back into the range - that is a reversal, not
  a retracement.
- The retracement is deep rather than shallow.
- The counter-move expands rather than drifting (reclassify as reversal).
measurable:
- bar-count and elapsed-time ratio of the retracement leg to the expansion leg it retraces
- range of the retracement leg as a fraction of the expansion leg
- how often a 'failed to close through then hung around' leg resolves in the trend direction
  versus against it
- bar-count ratio of retracement leg to the expansion leg it follows
- retracement depth as a fraction of the expansion leg
- hit rate of the failure-swing target after a confirmed retracement
- speed and depth of counter-moves later classified retracement vs reversal
- share of retracements terminating inside a fair value gap
