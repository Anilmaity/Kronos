execution:
  bias: With the pre-existing trend, resumed after the retracement.
  entry: Candle 2 closure inside the fair value gap, or the closure through the opposing candles
    that forms the protected swing.
  stop: On the wick or the body of the low/high that formed (one example preferred the wick
    where the body lacked a wick).
  targets:
  - the failure swings left on the opposing side
  - previous candle extremes
