id: upper-half-eq-expansion-filter
name: Upper-Half EQ Rule For Expansion
definition: 'Three Shorts state the rule as a single crisp filter and add the branch that
  follows a failure. The requirement: when price is expanding, the next candle must open and
  make its LOW in the upper half of the previous candle''s range (bearish mirror: its high
  in the lower half), and then expand. A second, equivalent phrasing is given in fib terms
  - the retracement must NOT reach into a discount of the higher-timeframe range. The failure
  branch is stated explicitly and is two-sided: if price opens and trades a lot lower than
  the EQ, expansion is off, and price will either fail and take out the previous candle''s
  low, OR reverse back to its opening price, in which case the NEXT candle becomes the expansion
  candidate. The rule is applied on the fourth day of a swing as well, where 0.5 of the swing
  range is marked and the upper half must hold.

  '
variants:
  definition:
  - SHORTS EVIDENCE, given as a chart procedure rather than a principle. For expansion higher,
    the UPPER HALF of the higher-timeframe candle must support price; the operational step
    is to mark half of that candle's range and then look for a PD array sitting inside that
    half. That PD array - in the worked example a fair value gap resting above a protected
    low - is where the higher-timeframe wick is expected to form and where the lower timeframe
    should print its reversal / change in the state of delivery. The mirror applies to a bearish
    candle 3, where the lower half must be respected.
  - Stated here in the channel's own voice (the library previously carried only a guest's
    version). During an expansion phase he requires the upper half of the reference candle's
    range to be respected for price to trade higher, and the lower half to be respected for
    price to trade lower. The half is the operative filter, not a location to enter counter
    to the move. If the half is not respected he flips the bias and anticipates the opposite
    extreme of the range being taken.
  - 'A Short applies the half rule to a candle 3 rather than to a wick, which makes the construction
    explicit. After a candle 3 closure forms at a point of interest, mark the ENTIRE range
    of that candle 3 and take its equilibrium. For a bullish continuation, price in the following
    candle is expected to trade higher from the upper half of that range - the EQ is respected
    and the move continues. The Short pairs this with the continuation confirmation that the
    following candle closes over the previous candle''s high.

    '
  - 'A mechanical proxy for wick size. After a reversal wick or an expansion candle close,
    mark the equilibrium (50%) of that candle''s range or of the reversal wick. For a bullish
    continuation, the following candle''s low must form in the upper half of that range; disrespecting
    the EQ would by construction create a large opposing wick, which does not support expansion.
    The bearish case mirrors it - the following candle''s high must form in the lower half.

    '
category: structure
status: contested
aliases:
- upper half to respect
- lower half to respect
- premium and discount as a wick-size filter
- EQ for expansions
preconditions:
- Price has been classified as expanding, or a completed swing point exists whose range can
  be halved.
- A higher-timeframe candle (typically the C3) has been identified and its range marked.
- A directional bias exists.
- A reference candle (usually the previous one) whose EQ has been marked.
- A reversal wick or expansion candle close exists on the working timeframe.
detection_rules:
- Mark 0.5 of the reference candle's (or swing's) range.
- 'Bullish: the next candle must open and make its LOW in the upper half of that range, then
  expand higher.'
- 'Equivalent fib phrasing: the retracement must not reach into a discount of the range.'
- 'Failure branch A: price opens and trades a lot lower than the EQ - do not look for expansion;
  expect it to fail and take out the previous candle''s low.'
- 'Failure branch B: if price instead reverses and comes back to its opening price, the NEXT
  candle becomes the expansion candidate.'
- 'Lower-timeframe shape wanted inside the passing candle: open, trade lower, form a change
  in the state of delivery, then trade higher.'
- 'Applied to the 4th day of a swing: mark 0.5 of the swing range, require the upper half
  to hold, and look for the PD arrays sitting in that half.'
- Mark the 50% level of the higher-timeframe candle's range.
- 'Bullish: require the upper half to support price; bearish: require the lower half to.'
- Search that half for a PD array (fair value gap, protected swing) - that is the expected
  wick location.
- Enter when the lower timeframe prints a change in the state of delivery inside that PD array.
- 'The same half-of-candle test is applied to candle 3 specifically: look for the continuation
  in the upper (bullish) or lower (bearish) half of C3.'
- Mark the EQ of the reference candle (wick high to wick low; 0.5 of the wick if the wick
  is very large).
- 'Bullish: require price to hold the upper half of that range.'
- 'Bearish: require price to hold the lower half of that range.'
- If the required half is not respected, flip the bias and anticipate the opposite extreme
  of the range being taken.
- 'Applied candle by candle in a run: each day''s respect of the previous day''s EQ is what
  builds the higher-timeframe wick.'
- Mark the entire range (high to low) of the candle 3 closure.
- Compute its equilibrium (50%).
- 'Bullish: expect the following candle to trade higher out of the upper half; the EQ should
  be respected.'
- A close over the previous candle's high in the following candle signals further continuation.
- Mirror for the bearish case using the lower half.
- Mark the 50% level of the reference candle's range (or of the reversal wick).
- 'Bullish: the next candle''s low must form above that 50% level.'
- 'Bearish: the next candle''s high must form below that 50% level.'
- A violation of the EQ disqualifies the candle as an expansion candle.
invalidation:
- Price makes its extreme in the wrong half of the reference range.
- The retracement reaches into a discount of the higher-timeframe range.
- Price trades through the 50% level into the opposing half of the candle.
- A close through the EQ against the direction being held.
- The following candle trades and holds below the EQ of the marked range.
- The following candle trades through the EQ and forms its extreme in the wrong half.
measurable:
- continuation rate when the next candle's extreme forms in the required half vs when it does
  not
- how often failure branch A (takes out the previous candle's low) occurs vs branch B (returns
  to the opening price and the next candle expands)
- hit rate of the 2R target on 4th-day entries taken inside the upper half
- share of expansion candles whose opposing wick stays within the correct half
- hit rate of entries at a PD array located inside the correct half versus outside it
- hold rate of the required half during confirmed expansion sequences
- hit rate of the flipped target after an EQ violation
- share of following candles whose wick stays in the marked half
- continuation rate conditional on the EQ being respected
- continuation rate when the next candle's extreme respects the EQ vs when it does not
