ambiguities:
- '''Respect'' / ''hold'' is not resolved into wick vs body - whether a wick through the EQ
  breaks the filter or only a close does is not stated in any of the three Shorts.'
- '''Trades a lot lower than the EQ'' is a second, looser threshold than ''below the EQ'',
  and the two are used interchangeably in the same clip.'
- Failure branch B has no time bound - how long price may take to return to its opening price
  before the setup is abandoned is not stated.
- The reference range is variously the previous candle's range, 'this range' on the higher
  timeframe, and the swing range on the 4th day. Which one applies when several are available
  is not stated.
- Whether the halves are measured wick-to-wick or body-to-body is not stated here.
- Whether 'respected' means no wick through the 50% level or no CLOSE through it is not stated.
- If there is no PD array inside the correct half, no fallback is given.
- Whether 'not respected' means a wick through the EQ or a close through it is not stated.
- The flip is described as immediate, with no re-test or confirmation requirement attached.
- The rule presumes the expansion phase has already been classified; the phase test is not
  restated here.
- The Short marks the range of candle 3, whereas the library's other readings mark the reversal
  wick - which reference is canonical is not resolved here.
- '''Respect the EQ'' is not given as body-close or wick-touch.'
- Whether the EQ is taken from the full candle range or only from the reversal wick varies
  between the slides described; both are used.
- Wick-based vs body-based range endpoints are not specified.
