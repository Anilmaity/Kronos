id: reversal-signature
name: Reversal Signature
definition: 'PRIMARY-SOURCE READING (this unit): a reversal is expansion met with expansion.
  Price expands into a level and is met immediately by expansion in the opposite direction;
  that pair of legs is what forms the higher-timeframe wick. It is the opposite of a continuation
  signature, where expansion is followed by a retracement or a consolidation. A reversal is
  only sought at a relevant point of interest - an old / swing high or low, with previous
  days'' and previous week''s highs and lows named as the easy way to find relevant ones.
  The cleanest form is the V-shape: expansion into a low that sweeps liquidity, then a clean
  expansion away that also closes over the series of opposing candles (the CISD). You do not
  have to catch the extreme; the alternative is to take the continuation afterwards off a
  protected swing.'
variants:
  definition:
  - 'A reversal is identified as expansion into a level met immediately by expansion away
    from it - a V shape on the chart - confirmed by a CISD and paired with an SMT on a correlated
    asset. If price engages the level and consolidates instead of reversing, the reversal
    point is moved to the consolidation high (or low), and the same expansion-into / expansion-away
    signature is required off that consolidation extreme. On the higher timeframe the reversal
    signature is simply a swing point, gauged by a candle close.

    '
category: structure
status: contested
aliases:
- expansion met with expansion
- V-shape reversal
- the V shape
- AMD reversal
preconditions:
- Price has expanded into a RELEVANT high or low (previous day / previous week extremes, or
  a swing point), not an arbitrary one.
- Price has reached a key level (FVG / internal liquidity, swing point, or order block).
- A correlated asset is being watched for SMT.
detection_rules:
- Expansion into the level, immediately met by expansion in the opposite direction.
- The counter-leg displaces back into the range - it is neither a shallow retracement nor
  a sideways consolidation.
- 'Ideal form: the counter-leg also closes over the series of opposing candles that made the
  extreme (CISD), producing a V shape.'
- 'The level must be relevant: an old high/low or swing high/low; previous day and previous
  week extremes are always relevant.'
- If the current candle does not decide between retracement, consolidation and reversal, let
  another candle close - the closures supply the new data.
- Where the reversal candle carries a large wick, 50% of that wick must be respected for the
  reversal to be traded lower/higher.
- Expansion into the level followed immediately by expansion away from it.
- A CISD confirms the reversal.
- An SMT with the correlated asset is present at the reversal point.
- If price consolidates at the level instead, revert to the consolidation high/low as the
  reversal point and require the same signature there.
- On the HTF, the reversal is registered by a candle close forming a swing point.
invalidation:
- The counter-move is slow and shallow (retracement) or sideways (consolidation).
- The reversal is framed off a high/low that is not relevant - failure swings are left resting
  beyond it.
- 50% of the reversal candle's wick is not respected.
- Price expands into the level but does not expand away - the candle instead closes as an
  expansion candle through the level.
- The correlated asset that swept fails to reverse (see fake-smt-strength-switch).
measurable:
- hit rate of reversals framed at previous-day/week extremes vs at arbitrary swings
- share of expansion-met-with-expansion events that also carry a CISD
- hit rate of reversals confirmed by CISD + SMT vs CISD alone
- frequency of the consolidation-high fallback being required
