ambiguities:
- '''Expansion met with expansion'' inherits every ambiguity of ''expansion'' - there is no
  threshold on either leg, so the test is decidable only once you fix an expansion detector.'
- How immediately the second expansion must follow the first is not stated; one example takes
  several candles and is still counted.
- SMT is used as confluence on many examples in this video but, unlike the guest reading in
  t_talks_02, it is NOT stated as a requirement of the reversal signature here.
- The captions render CISD as 'CSD'; the expansion is inferred from context and from the rest
  of the corpus.
- Inverse fair value gaps are mentioned as an acceptable alternative confirmation but not
  developed.
