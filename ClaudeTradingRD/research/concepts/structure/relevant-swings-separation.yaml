id: relevant-swings-separation
name: Relevant Swing Highs and Lows (separation)
definition: The dedicated teaching video for the term. A relevant swing is a swing point that
  has enough vertical separation from the next same-side extreme that a reversal off it can
  be trusted without that neighbouring extreme being taken first. Swings sitting close to
  another same-side extreme are failure swings and are not levels he will trade away from;
  you go outward to the extreme and mark that instead. Relevant swing highs and lows are the
  only places he looks for a reaction or a reversal, and they are also the targets. He states
  outright that he has no mechanical rule for how much separation is enough - it is discernment
  gained from experience.
variants:
  definition:
  - 'Only swing highs and lows with visible vertical separation from their neighbours count
    as independent levels or targets. Two extremes close together collapse into one level
    and only the outer one is marked. He states twice, under direct questioning, that there
    is no mechanical rule or percentage for how much separation is enough, because it changes
    across timeframes.

    '
category: structure
status: contested
aliases:
- relevant swing high
