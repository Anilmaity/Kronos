ambiguities:
- He states directly that there is no mechanical rule for valid separation and that it comes
  from experience and discernment. This is the PRIMARY teaching video for the term, so the
  vagueness is his, not an artefact of a Q&A answer - the corpus does not contain a threshold
  to recover.
- '''Close'' and ''far'' are never bounded in points, percent of range, or ATR.'
- 'The relation between failure swing and relevant swing is not exclusive: one low is called
  ''a failure swing technically'' and still relevant because of its separation.'
- Whether separation is measured only against the immediate neighbour or against the whole
  cluster of nearby extremes is not stated.
- One example is hedged as 'a little bit sketchy because we are so close to this low', with
  the resolution being to wait for a close through and confirm - so confirmation can substitute
  for separation, but the substitution rule is not generalised.
- Explicitly non-mechanical by the speaker's own admission - the single largest automation
  gap in this unit.
- He notes a dedicated video ('Which swing highs and lows matter') exists and another was
  in production; those may specify more.
