preconditions:
- A chart with completed swing points that can be marked.
- A set of candidate swing highs/lows on the chart.
detection_rules:
- 'Mark every swing point (bullish: a low with a higher low on each side; bearish: a high
  with a lower high on each side).'
- For each candidate, compare it with the nearest same-side extreme.
- If the two sit close together, the candidate is a failure swing, not a relevant swing; go
  outward and mark the extreme instead.
- If there is visible separation, mark the candidate as the relevant swing - it may be used
  both as a point of interest for a reversal and as a target.
- A swing that is technically a failure swing can still be relevant if its separation from
  the neighbour is large (stated explicitly on one example).
- Once a relevant high is reached and price does not reverse off it, the next extreme beyond
  becomes the relevant high; multiple relevant swings can be live at once.
- Keep the stop-loss side free of failure swings - want high resistance liquidity there.
- No numeric or percentage threshold defines 'enough separation'.
- Compare each pair of adjacent same-side extremes; if the vertical distance is negligible
  relative to the chart, treat them as one level.
- If there is meaningful separation, mark both as independent targets.
invalidation:
- Price reaches the relevant swing and does not reverse - the level is superseded by the next
  extreme beyond it.
- Not stated.
measurable:
- reversal rate at swings bucketed by separation-to-neighbour distance (in ATR)
- frequency with which a low-separation swing is taken out before the outer one holds
- Sensitivity of target hit-rate to a candidate separation threshold (e.g. fraction of ATR).
