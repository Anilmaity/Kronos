preconditions:
- Two or more correlated instruments (YM / ES / NQ) charted side by side.
- A directional objective (a specific high or low) already identified.
- Two or more correlated instruments (ES / NQ / YM) charted side by side.
- Two or more correlated assets on screen (his fixed layout is NQ left, ES middle, YM right).
- Two or more correlated assets, compared on the same closed candle.
- Each asset has an identifiable series of opposing (down-close, in the bullish case) candles
  that made its low.
- Two or more correlated instruments charted side by side (YM/ES/NQ, or DXY plus currency
  futures).
- A directional bias established on one of them or on the dollar.
- A directional bias exists from the daily chart.
- At least two correlated instruments are compared over the same window.
- Two or more genuinely correlated assets are on the screen (he uses YM, ES, NQ together;
  also gold with a correlated metal, and oil with gasoline).
- A relative strength assignment exists (from the ratio chart or the three tests).
- ES, NQ and YM charts side by side with the previous day extremes marked.
detection_rules:
- 'Precondition: the assets must be correlated and normally share the same structure.'
- 'Tool 1 (SMT): at a shared reference level, the asset making the lower high is weaker; the
  higher high is stronger.'
- 'Tool 2 (separation): with no obvious SMT, compare distance travelled from the shared reference;
  further from it = stronger.'
- 'Tool 3 (closures): compare the same candle across assets - doji/small range = weaker, engulfing/strong
  body = stronger.'
- Also check which asset took out the previous candle's extreme and which did not.
- 'Reading A, bearish divergence: short the asset printing the lower high (the weaker one).'
- 'Reading A, bullish divergence: long the asset printing the higher low (the stronger one).'
- 'Reading B: choose whichever asset''s lower-timeframe structure is cleaner; switching mid-move
  is permitted.'
- 'Tie-break criterion he actually applies: take the asset with low resistance liquidity in
  the direction being traded.'
- Rank the correlated set strongest / middle / weakest by how far each has travelled toward
  the same reference level.
- 'Targeting a high: trade the strongest — it is closest to that liquidity.'
- 'Targeting a low: trade the weakest; do not trade the lagging (opposite-direction) asset.'
- When the ranking rotates mid-session (strength switch), expect the asset that has moved
  into the middle to give the cleaner structure.
- When one asset opposes all the others, treat that asset as the one that is 'lying' and expect
  it to reverse or to catch up.
- Rank the correlated assets by relative strength; the default is NQ strongest, ES middle,
  YM weakest, or the mirror image.
- Never trade the lagging asset - not the weakest in a bullish complex, not the strongest
  in a bearish one.
- When the ranking is switching around intraday, trade the middle asset (ES) to avoid the
  whipsaw.
- To trade the weakest asset, first wait for the strongest one to reverse at its level.
- Treat ES leading as an off-pattern day and lower expectations.
- 'Compare the most recent closed higher-timeframe candle across the assets: bullish closure
  = stronger, bearish closure = weaker.'
- Measure that comparison on the timeframe you intend to execute on, not on a higher one.
- Add SMT (divergence at a shared high or low) as the second input.
- If the ranking is unclear or keeps switching, trade ES.
- Trade the strongest or the weakest, never the lagging asset.
- 'Looking lower: do not trade the strongest asset. Looking higher: do not trade the weakest.'
- The middle asset is only traded in the scenario where one asset has already expanded or
  reversed and the middle one is expected to follow, and even then only if entry is still
  in the upper half (short) or lower half (long) of the swing-to-target range.
- For each asset, locate the series of down-close candles that made the low (bullish case).
- Grade the same candle's close on each asset against that series.
- 'WEAKER: the close is still below those down-close candles, or below the low.'
- 'STRONGER: the close has bought all the way back up and closed OVER those down-close candles.'
- 'Intermediate/weakest reading: the asset has not yet even reached for the OPENING PRICE
  of its down-close candle.'
- The asset that closed over its series is forming a continuation; the one that has not is
  not.
- Trade the stronger asset.
- 'Rank the correlated assets by: location of price relative to structure; SMT (which asset
  has taken the level and which has not); candle type (expansion candle vs reversal candle).'
- The asset closest to its previous day low is the weakest; the one with a clean bullish expansion
  candle is the strongest.
- For a long, prefer the strongest; for a short, prefer the weakest.
- If the strongest has already expanded and is trading over highs, expect consolidation there
  and take the middle asset.
- 'Currency case: bearish dollar implies bullish foreign currency futures; on a USD-quoted
  pair the same setup is inverted.'
- Among valid candidates, select the one with the cleanest daily formation.
- Rank ES / NQ / YM by relative strength for the session.
- Never trade the lagging extreme; trade the middle asset.
- 'Bullish: YM or ES. Bearish: NQ or ES.'
- Re-check the ranking at the open - it can switch.
- If the ranking differs between higher and lower timeframes, take the asset aligned on the
  lower timeframes.
- Skip an asset that has already completed its expansion, even if it ranks correctly.
- Rank correlated assets by which has reached or failed to reach the same relative level (one
  makes the high while another leaves equal highs).
- 'Bearish bias: select the weakest asset (the one that failed to make the high, or is nearest
  its low).'
- 'Bullish bias: select the strongest asset.'
- If NQ versus YM strength is ambiguous, select ES.
- Never select the lagging asset, the one still to reach its level.
- 'Step 1 - SMT: check which asset failed to make the corresponding high or low.'
- 'Step 2 - separation / structure: check which asset has traded further from the shared level.'
- 'Step 3 - candle closures: a large bearish closure on one asset against a bullish closure
  on the correlated asset marks the weak/strong pair.'
- Assign strongest / middle / weakest. For the index triad, YM and NQ occupy the two ends
  and ES the middle.
- If shorting, execute on the weakest. If longing, execute on the strongest.
- Do not execute on the lagging asset even when its own chart looks clean; prefer the leading
  or the middle asset.
- Identify the relatively weaker asset; take short setups there.
- Identify the relatively stronger asset; take long setups there.
- 'Frame each side against its OWN higher-timeframe level (in the example: last month''s low
  / monthly fair value gap on NQ, a daily fair value gap consequent encroachment on ES).'
- 'Confirming behaviour at the level: the weak asset barely reaches into the fair value gap
  before displacing lower, while the strong asset trades above it before reversing.'
- Check the shared level on all three assets before committing to a draw.
- If the strength/weakness ranking is switching during the session, take ES as the middle
  asset.
- The intended sequence in a bearish case is that the weakest asset pushes through its low
  first and drags the others.
invalidation:
- The assets decouple structurally, so they no longer share the reference level being compared.
- The ranking rotates again before the trade triggers — the framing must be redone.
- The ranking flips against the position while it is running.
- Strength switches, which he says can happen at any time and does so repeatedly on air.
- Not stated in this Short; the ranking is re-graded on each new closed candle.
- The ranking flips intraday (the weakest asset reverses off its level and the strongest stalls).
- The strongest asset fails to reverse at its level, removing the basis for the weakest asset
  to expand.
- The strongest asset failing to reverse off a level means the weaker assets should reach
  for their corresponding level rather than turning - the pairing has not broken, the direction
  has.
- Strength can switch after a sweep; he states he does not attempt to anticipate a switch
  and treats it as a reason to stand aside.
- The strength assignment flipping (see ratio-chart-reversal-lead).
- The intended weak asset switches to strongest, which is what happened here and is given
  as the reason the move was slower than wanted.
measurable:
- agreement rate between the SMT, separation and closure rankings on the same bar
- subsequent relative performance of the ranked assets
- win rate trading the diverging asset vs the non-diverging one on the same SMT
- R difference when the low-resistance criterion is applied
- R of trades on the ranked-correct asset versus the lagging asset on the same signal
- frequency of intraday strength switches and their effect on outcome
- how often the divergent asset resolves toward, rather than away from, the majority
- expectancy by rank position (strongest / middle / weakest) at entry
- frequency of ES-leading days per month and their outcome
- agreement rate between closure-based ranking and subsequent relative performance
- expectancy of trading the selected asset vs the lagging asset on the same signal
- how often ES outperforms a coin-flip between NQ and YM when the ranking is ambiguous
- expansion delivered by the asset that closed over its opposing series vs the one that did
  not, measured over the next N candles
- how often the grading by opposing-series progress disagrees with the simple bullish-close/bearish-close
  grading, and which is more predictive
- expansion range of strongest vs middle vs weakest asset after the ranking is made
- hit rate of long-the-strongest vs long-the-middle when the strongest is already over highs
- frequency with which the three ranking inputs disagree
- expectancy of trading the middle asset vs the extreme asset on the same signal
- frequency with which the ranking switches between the pre-open and the open
- difference in realised R between trading the weakest and the strongest asset on the same
  signal
- hit rate of the same signal taken on strongest vs weakest vs middle asset
- frequency with which ES resolves as the middle of the YM/NQ pair
- frequency of strength switching after a relevant sweep
- expectancy of shorts on the designated weak asset vs the strong one
- how often the weak asset fails to reach a level the strong asset reaches
- frequency of intraday strength/weakness switching
- outcome of trading ES vs the extreme-ranked asset on switching days
