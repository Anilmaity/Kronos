id: relative-strength-asset-selection
name: Ranking Correlated Assets And Trading The Middle One
variants:
  name:
  - Ranking Correlated Assets And Trading The Chosen One
  - Ranking Correlated Assets And Choosing Which To Trade
  - Trade the Weakest Asset Short, the Strongest Long
  - Relative Strength / Weakness Asset Selection
  - Trade The Weak Asset Short And The Strong Asset Long
  definition:
  - 'THE TWO SMT VIDEOS IN THIS UNIT GIVE DIFFERENT SELECTION RULES AND BOTH ARE RECORDED.
    Reading A (eHQ4nE-TQ2w) is mechanical and directional: trade the asset that is DIVERGING.
    On a bearish divergence take the one making the LOWER high, explicitly ''because it is
    weaker''; on a bullish divergence take the one making the HIGHER low, because it is stronger.
    Reading B (q1NmxUTm4n4) is discretionary: which index he trades is ''completely dependent
    on the lower time frames and which one looks cleaner to me'', and he demonstrates switching
    between ES and NASDAQ inside a single move for exactly that reason. A third criterion
    appears in the same video and is decidable: prefer the asset that has LOW RESISTANCE LIQUIDITY
    in the trade''s direction.'
  - 'Every session in this unit opens with the same ritual: rank YM, ES and NQ as strongest,
    middle and weakest, then choose the instrument from the rank rather than from the setup.
    The selection rule stated here is directional. If the objective is a high, focus on the
    strongest asset because it is closest to that liquidity and will reach it first; if the
    objective is a low, focus on the weakest. The negative form is stated as a slogan — he
    does not trade the lagging asset — and is explained with the YM/NQ example: when he is
    bearish and YM is the strongest, he will not touch YM. He also names the strength switch:
    when the ranking rotates mid-session (NQ becomes stronger, YM weaker) the middle asset
    is usually the cleaner one to trade, and he treats a mid-session rotation as a reason
    to re-check the framing rather than to persist with the original instrument.

    '
  - 'How he picks which index to trade once the three are ranked. He never trades the lagging
    asset: if the complex is bullish he will not trade the weakest, and if it is bearish he
    will not trade the strongest, because those catch up sometimes but usually just stop you
    out. His default ranking is NQ strongest, ES middle, YM weakest (or the mirror), and when
    the strength ranking whipsaws intraday he deliberately takes the middle asset - ES - because
    it does not whipsaw the way the outer two do, which matters when he is in options. If
    he does want the weakest asset to move, he waits for the strongest to reverse first. He
    also notes that ES leading is unusual and throws his expectations off, and quantifies
    it: it had happened three or four days in the past month.

    '
  - 'Across all four streams he is asked how he picks between NQ, ES and YM, and the answer
    is consistently mechanical and small: compare the same higher-timeframe candle''s closure
    across the correlated assets. A bullish 4-hour (or 1-hour) closure on one and a bearish
    closure on another is the whole of it - "don''t make it super complex" - and he adds the
    divergence (SMT) as the second input. Three selection rules sit on top. First, the relative
    strength that matters is measured on the timeframe you are executing on, not on the daily:
    if you are trading a 5-minute move you care about the lower-timeframe strength. Second,
    when the ranking is unclear, default to ES, because NQ and YM alternate and bounce around
    while ES sits in the middle and moves most consistently. Third, never trade the lagging
    asset in the hope that it follows - trade the strongest or the weakest; and if you are
    looking lower, do not trade the strongest. He also declines to call the closure divergence
    a PSP, because PSP implies a reversal and he is using it only as basic relative strength.

    '
  - 'A Short supplies a sharper ranking test than the library''s existing "bullish closure
    = stronger". Strength is graded by HOW FAR EACH ASSET''S CLOSE HAS PROGRESSED AGAINST
    ITS OWN OPPOSING-CANDLE SERIES - the same level a change in the state of delivery uses.
    The weaker asset''s closure still sits below the down-close candles (and below the low);
    the stronger asset has bought all the way back up and closed OVER its down-close candles.
    The stated consequence: the asset that has closed over its series is forming a continuation,
    the one that has not yet even reached for the opening price of its down-close candle is
    not, and he would rather trade the stronger one - which is the one that then delivers
    the expansion.

    '
  - 'Instrument selection is a separate decision from setup identification, made by ranking
    correlated assets against each other. For index futures the ranking is across YM, ES and
    NQ using three named inputs: where price currently sits relative to structure, the SMT
    between them, and the candle type (an expansion candle is strong, a reversal candle is
    not). The general rule is to long the strongest and short the weakest. The refinement
    that both walkthroughs actually use is the exception: if the strongest asset has already
    expanded and is trading over highs, expect consolidation there and take the next strongest
    - the middle asset - instead. The same logic runs across currencies through the dollar:
    a bearish dollar bias makes foreign currency futures bullish, the currency futures are
    then scanned for the cleanest daily formation, and USD-quoted pairs invert the setup.

    '
  - 'Rank ES, NQ and YM by strength each session. The lagging (extreme) asset is never traded
    - only the middle one. In practice ES is described as usually in the middle, which is
    why a viewer struggling to choose a pair is told to just focus on ES. NQ or YM lead in
    one direction more than 90% of the time; sessions where ES is the strongest are called
    weird and rare. Direction picks the side of the ranking: bullish means focus on YM or
    ES, bearish means NQ or ES. He also declines assets that have already expanded too far,
    and warns that the ranking can switch at the open and can differ between timeframes -
    when it does, trade the one that is aligned on the lower timeframes.'
  - 'Among correlated assets (NQ, ES, YM for indices; the dollar versus its counter currencies
    in FX), the bias direction decides which instrument is traded: for a bearish idea trade
    the weakest asset, for a bullish idea trade the strongest. The asset that has not yet
    reached its level is the lagging asset and is deliberately not traded. When relative strength
    between the two extremes is unclear, ES (the middle asset) is used because it behaves
    more cleanly.

    '
  - 'Among a set of correlated assets, rank them into strongest, middle and weakest, then
    route the trade to the correct one: short the weakest, long the strongest, and never trade
    the lagging asset. For the US index futures he states the ranking is structural - YM and
    NQ sit at opposite ends of the strength spectrum and ES is always the middle, so if YM
    is strong then NQ is weak and vice versa. The same idea and the same trade can lose on
    the wrong asset and win on the right one.

    '
  - 'The operational payoff of the relative strength read: once one of two correlated assets
    is identified as relatively weaker, that asset is where short setups are looked for, because
    it presents the cleaner and better short; the stronger asset is where long setups are
    looked for. In the Friday walkthrough he applies exactly this - NQ is the weak asset so
    he looks for shorts on NQ into last month''s low, and ES is the strong asset so he looks
    for longs on ES at its own point of interest.'
  - 'Worked live across ES, NQ and YM. The draw is confirmed by checking all three: the previous
    day low remains on ES while neither NQ nor YM has taken theirs, so the previous day low
    on the indices is the objective. The selection rule he states is about instability rather
    than extremes - when strength and weakness are switching between the assets intraday (YM
    was weakest before the open, then switched), he cannot tell which will end up strongest
    or weakest, so he takes ES because it is generally in the middle.'
definition: 'Three Shorts lay out the ranking toolkit as an ordered fallback. The precondition
  is stated flatly: this can only be done with correlated assets, which should share the same
  structure. Tool 1 is SMT - when one asset takes a shared reference level and the other does
  not, the one making the lower high is weaker. Tool 2 is used when there is no obvious SMT:
  separation, meaning how far each asset has travelled from the shared reference low; the
  one further away is the stronger. Tool 3 is the candle closure itself - a doji or small-range
  candle against an engulfing candle on the correlated asset ranks the two directly.

  '
