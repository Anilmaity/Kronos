ambiguities:
- '''Separation'' is measured by eye off the chart; no normalisation (points, ATR, percentage)
  is given.'
- The order of precedence is implied by the narration (SMT first, separation when SMT is absent)
  but never stated as a rule.
- '''Doji'' and ''engulfing'' are used without the closure-size thresholds that would make
  them decidable.'
- Readings A and B are not reconciled by the speaker and appear in two videos of the same
  playlist.
- '''Looks cleaner'' has no test.'
- Reading A is stated only for a two-asset comparison; it says nothing about ranking three.
- This unit's rule (trade the DIVERGING asset) is not obviously the same as the three-way
  strongest/middle/weakest ranking recorded from later units, which selects by direction of
  the target rather than by which asset diverged.
- The ranking is done by eye against a shared reference level; no normalisation (percentage
  move, ATR units) is specified, so two observers could rank differently.
- Trading the strongest and trading the middle are both advocated in this unit without a stated
  tie-breaker; the middle is preferred specifically after a strength switch.
- How much rotation counts as a 'switch' is not bounded — the strengths are described as switching
  several times inside one session.
- Relative strength is read visually from three synced charts, never computed; no lookback
  or normalisation is given.
- The middle-asset preference is stated as a response to whipsaw, with no test for when the
  ranking counts as whipsawing.
- The same streams contain the opposite emphasis at times - he focuses on the weakest asset
  reaching a target once the strongest has already expanded too far - so "middle asset" is
  a default, not a law.
- '''Uncertain'' is not defined; in practice it means the ranking has flipped during the session.'
- There is unresolved tension between 'default to ES' (the middle asset) and 'never trade
  the lagging asset' - ES is by construction between the leader and the laggard.
- How much of the closure must be directional (body vs wick) is not stated; he reads it visually.
- He rejects the PSP label for the closure divergence without saying what, if anything, would
  make it a PSP.
- This Short works only the BULLISH case (trade the stronger). The library's fuller rule is
  directional - trade the strongest when targeting a high, the weakest when targeting a low.
  This clip states no such condition and does not mention a target. Do not read the directional
  qualifier into it.
- The assets being compared are never named in the clip, so the correlated set is unknown.
- The timeframe of the compared candles is not stated.
- No tie-break is given when both assets have closed over their series, or neither has.
- '''Reaching for the opening price of this down close candle'' introduces a third, finer
  grade between ''closed over'' and ''closed below'', but no ranking is stated for it.'
- The three ranking inputs are unweighted and no tie-break is given when they disagree.
- Already expanded and over highs is the disqualifier for the strongest asset and is not quantified.
- In video UBTl7za9obc the ordering is given as YM strongest, NQ weakest and ES in the middle,
  or the reverse, so the ordering is observed per day, not fixed.
- In video IzOQmcgLyA0 the speaker chose CAD futures on structure while GBPUSD produced the
  larger expansion that day, and he calls this a mistake - so structure quality and expansion
  magnitude can point to different instruments, with no rule for resolving it.
- '''Strength'' is read visually from the correlated-asset display of his own indicator; no
  percent-change or normalisation formula is given.'
- On one stream he takes the weakest asset (ES) for a short because YM had too many failure
  swings - so 'never trade the lagging' is about the extreme of the ranking, and the weakest/strongest
  labels move with direction.
- The rule is stated for the three US index futures only.
- Strength and weakness are assessed visually over an unspecified lookback window.
- He notes strength can switch intraday (YM strongest on the day but weakest into the open)
  without giving a rule for handling the switch.
- 'CONTESTED: in bMkRomKEunU YM is central to the triad and he routes trades by it; in r7yW6ou1LDs
  he says he never watches YM at all and finds it very uncorrelated to ES and NQ. Neither
  statement is qualified or reconciled.'
- '''Separation'' is judged visually with no threshold.'
- No rule is given for how to rank more than three assets, or for metals, where he says he
  is much less confident.
- No rule states how long an assignment remains valid before it must be re-derived.
- Nothing is said about whether both sides may be held simultaneously as a pair, or whether
  only one is taken.
- '''Cleaner and better'' is a qualitative claim with no supporting statistics in the video.'
- '''Switching'' is diagnosed by eye; no measurement window is given.'
- The library entry for this id is contested across units; this unit adds the middle-asset
  fallback, not a resolution.
