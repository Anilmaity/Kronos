ambiguities:
- 'Two different invalidation levels are used across the Shorts for the same object: "the
  mean threshold" and "the lower half of this". They may be the same level (50% of the block)
  but that equivalence is never stated.'
- '"Break" versus "close through" the mean threshold is not distinguished.'
- The first Short's transcript is truncated mid-sentence at "the mean threshold of a propulsion",
  so anything he added after that is lost.
- The stop choice (low vs body vs intermediate-term low) is left to preference with no rule.
- Whether OB2's candles must sit strictly inside OB1's range, or merely react at it, is not
  stated.
- '''Break'' vs ''close beyond'' the mean threshold is used both ways in the same video -
  wick-through is not resolved.'
- No statement on how long a propulsion block stays valid, or whether it can be re-used after
  a first touch.
- Whether a propulsion block can chain (a third block off the propulsion block) is not addressed.
- Never defined. The difference from an ordinary order block is inferred purely from where
  it sits.
- Its mean threshold is invoked without saying whether it is measured on the bodies (as for
  an order block) or on the full candle range.
- the_foundation_01 recorded the same term from the IFVG video as 'an order block formed off
  another order block'; the two accounts are compatible but neither is a definition, and they
  are still unreconciled.
- No statement of whether a propulsion block can be entered on, or is only a level that must
  hold.
- '''Half of the bodies'' is his gloss on mean threshold, but whether the midpoint is taken
  across the whole series of bodies or the single validating candle is not stated.'
- In caaS6_Q7O78 he identifies propulsion blocks in passing without restating the definition;
  the only explicit rule in this unit is the mean-threshold one from hKCMqh0ZsY0.
- No rule distinguishes a propulsion block from an ordinary nested order block beyond 'it
  sits inside an existing one'.
