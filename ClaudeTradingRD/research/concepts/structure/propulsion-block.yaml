id: propulsion-block
name: Propulsion Block
definition: 'Given its cleanest definition in the corpus: a propulsion block is an ORDER BLOCK
  OFF OF ANOTHER ORDER BLOCK. The build is stated stepwise: a down-close candle into an important
  level is closed over, validating an order block; price later retraces back into that order
  block; the down-close candle (or series) that went into it is then closed over, and that
  second structure is the propulsion block. Its distinguishing property is sensitivity of
  the OPENING PRICE: he does not want price to break the mean threshold of a propulsion block.
  Traded live, he enters on the opening price with the stop either on the low or on the body
  (he is fine with the body on a propulsion block; the safe alternative is the intermediate-term
  low), targeting 2R.'
variants:
  definition:
  - 'An order block that forms off another order block. Sequence: a first order block is validated
    (candles into an important level, then a close beyond their opening price); price retraces
    and reaches back into that first block; the opposing-close candle or series that reacted
    inside the first block is then itself closed through, and that second block is the propulsion
    block. Its opening price is expected to be very sensitive, and the defining behavioural
    requirement is that price must not break or close beyond the mean threshold of the propulsion
    block.'
  - 'Named twice in this unit and defined neither time. In the first use, a sweep of a low
    followed by a close over the down-close candles that made it produces what he calls a
    valid order block ''or in this case a propulsion block''. In the second, a newly formed
    propulsion block is used as a floor: he does not anticipate price trading below it and
    he does not want to see a close below its mean threshold (the auto-caption renders mean
    threshold as ''main threshold''). Both uses place it inside an existing directional leg
    rather than at a fresh higher-timeframe level, which is the only thing distinguishing
    it from an ordinary order block - and that distinction is inferred from usage, never said.'
  - 'A block formed when a series of opposing-close candles trades INTO an existing order
    block and is then closed through. He names the resulting structure a propulsion block
    and states one behavioural requirement: price should not trade or close below its mean
    threshold — ''half of the bodies'' — and ideally trades into its opening price and then
    away.'
category: structure
status: contested
aliases:
- propulsion block
- propulsion block off an order block
preconditions:
- A validated order block already exists (a candle into an important level, closed through).
- A validated order block already exists at an important level.
- Price has retraced back into that order block.
- An existing directional leg with an order block already established behind it.
- A sweep of a lower-timeframe low (bullish case) inside that leg.
- A validated order block already exists at the level.
detection_rules:
- Order block := a single or series of up-close candles into an important level, after which
  price displaces and closes BELOW the opening price of that single or series (mirror for
  bullish).
- Propulsion block := an order block formed off of another order block.
- 'Build: price retraces into the existing order block; the down-close candle or series that
  traded into it is then closed over; that is the propulsion block.'
- Treat the propulsion block's OPENING PRICE as very sensitive.
- Do not accept a closure or break below the MEAN THRESHOLD of the propulsion block.
- Entry on the opening price; stop on the low or on the body (the body is acceptable here;
  the conservative choice is the intermediate-term low); target 2R.
- Respect the lower half of the propulsion block (bullish case).
- Identify order block OB1 (see order-block).
- Require price to trade back into OB1.
- Identify the single or series of opposing-close candles that reacted inside OB1 - candidate
  OB2.
- Require a close beyond the opening price of OB2 in the intended direction; OB2 is now the
  propulsion block.
- Treat the propulsion block's opening price as the level and require it to be respected.
- Require that price does not break or close beyond the propulsion block's mean threshold.
- 'Constructed identically to a continuation order block: price sweeps a low, then closes
  over the series of down-close candles that made it.'
- Once formed it is treated as a floor - price is not anticipated to trade below it.
- A close below its mean threshold is explicitly not wanted.
- In both uses it sits INSIDE an existing leg rather than at a fresh higher-timeframe level;
  this is the only observable difference from an order block and it is never stated as a rule.
- A series of down-close candles (bullish case) reaches into the existing order block.
- Price then closes over that series — the propulsion block is formed.
- Mark its mean threshold (half of the bodies) and its opening price.
- Expect price to trade into the opening price and away; the upper half should be respected.
invalidation:
- Price breaks / closes below the mean threshold of the propulsion block.
- Price closing beyond (or, as also stated, breaking) the mean threshold of the propulsion
  block.
- A close below the mean threshold of the block.
- Price trades or closes below the mean threshold of the propulsion block.
measurable:
- hit rate of 2R entries at the propulsion block opening price
- how often the mean threshold is violated before target
- hit rate of a 2R trade from the propulsion-block opening price
- how often the mean threshold is respected once a propulsion block is validated
- frequency of propulsion blocks per instrument per month by timeframe
- how often a block he labels propulsion holds versus an ordinary continuation order block
  in the same leg
- frequency of closes below the mean threshold and what follows them
- frequency of mean-threshold violation before the target is reached
