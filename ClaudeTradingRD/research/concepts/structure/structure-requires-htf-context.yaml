ambiguities:
- The rule is stated as a post-hoc read on charts already known to have failed; no forward
  test is given for deciding, at the time, whether the current LTF shift sits inside an opposing
  HTF PD array.
- '"Keep that bias" is stated without a stop condition - the Shorts do not say what would
  make him abandon it intraday.'
- Which higher timeframe outranks which is not ordered beyond "the daily chart drives all
  my setups".
- Which higher timeframe to consult is chosen per example (5m checked against the hourly in
  the oil case; 5m against daily and hourly in the top-down cases).
- '''Going with the higher timeframe trend'' is asserted as easier but never measured.'
- No rule is given for the case where the higher timeframe is itself in consolidation.
- Alex's Options carves out an exception for pure 15-second scalping where payoff replaces
  context, and the exception is not bounded in size, frequency or instrument.
- '''Higher timeframe'' is not fixed - 15-minute, hourly, daily and weekly are all used as
  the reference in different examples in this unit.'
- The daily candle 2 closure is the only anchor named; whether a candle 3 closure or a weekly
  anchor serves equally is not said here.
- '''In line with something'' is not enumerated.'
- This is an August 2022 statement and is recorded as spoken; it is not reconciled here with
  the channel's later insistence on higher-timeframe context before lower-timeframe structure.
- He does not say where the cut-off sits - the monthly is dismissed for a 15-second chart,
  but no rule maps execution timeframe to the highest timeframe that still matters.
- The guest in the same video ($niper) does run a monthly-to-15-minute top-down read, so the
  disagreement is visible on air but is never argued out.
