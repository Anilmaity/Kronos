id: structure-requires-htf-context
name: Never Read Lower-Timeframe Structure Without A Higher-Timeframe Bias First
variants:
  name:
  - A Higher-Timeframe Point Of Interest Comes First, Or You Get Lost
  definition:
  - 'Stated twice in this unit as the closing lesson of the market structure video and the
    opening lesson of the top-down video, in both cases with a worked loss. The named failure
    mode is a lower-timeframe structure shift taken on its own merits: price makes higher
    highs and higher lows, then displaces down to a lower low, traders short it, and price
    makes a new higher high and stops them out - because the aggressive move lower was only
    a retracement to a higher-timeframe PD array. The top-down video runs the same failure
    from the other side: a textbook bullish order block retest gets its stop run because the
    higher timeframe had just swept a high and closed below it with a bearish engulfing candle.
    The correction in both cases is the same - fix the higher-timeframe direction first, then
    look only for setups in that direction on the lower timeframe.'
  - 'Stated in three of the four videos in this unit and agreed to on air every time. The
    host: it is important to have a higher-timeframe point of interest, or else you get lost
    on the lower timeframes - and Alex''s Options agrees immediately, saying he has fallen
    victim to it at least a couple of times, and repeats the point himself, that looking at
    lower timeframes too much without a higher-timeframe reference gets confusing and difficult.
    Trade For Opportunity applies it specifically to order blocks: a down-close candle is
    only expected to act as support when price is working with the higher-timeframe bias;
    in a downtrend the same candle is not something you look for at all, and he describes
    an order block as essentially a fancy term for support turned resistance. AM Trades gives
    the workflow form - the 15-minute point of interest first, drop to a lower timeframe only
    after it is tagged. The single qualification comes from Alex''s Options: on a 15-second
    chart the payoff ratio ''comes to the rescue'' so the higher-timeframe reference can be
    skipped, at the cost of never catching the large running moves.'
  - 'His answer to how to get better at reading market structure, and the same point appears
    in the indicator stream as a condition on the hourly. Reading structure cold does not
    work because a chart with no context alternates bullish and bearish changes in the state
    of delivery and you cannot tell which to believe. The fix is ordered: first fix a direction
    from a daily candle 2 closure, then read structure, trend and protected swings on the
    lower timeframe in that one direction only. Structure on the hourly is still required,
    but it has to be in line with something - otherwise it is pattern trading.'
  - 'TTrades'' own 2022 position on how far up the stack an intraday trader has to look, recorded
    because it cuts against the top-down doctrine the channel states elsewhere. Asked about
    starting top-down from the monthly, he says most of his analysis is the hourly and 15-minute,
    that the 4-hour is not really needed if you have used the daily, and that when he is trading
    a 15-second chart he does not care what the monthly is doing. The operative gate he does
    keep is much shorter-range: the displacement / fair-value-gap read on the timeframe being
    traded (see displacement).

    '
definition: 'Three Shorts state the same doctrine from different angles, and one of them gives
  the mechanism in a single sentence: a lower-timeframe reversal, or a lower-timeframe shift
  in structure, is actually just a RETRACEMENT to a higher-timeframe PD array. In the worked
  example a 5-minute structure break looked valid, but zooming to the hourly showed the move
  was only a retracement into an hourly fair value gap - so that retracement was going to
  fail, because it was going against the higher timeframe. The positive form: the daily chart
  drives every setup; if a direction can be framed on the daily, the lower timeframes fall
  into line. The discipline form: once you have a bias, come in and KEEP it, and let the timeframes
  align with it.'
category: structure
status: contested
aliases:
- you have to understand the higher time frames
- go with the higher time frame Trend
- higher time frame reference
- you need the context
- 15-second chart doesn't care about the monthly
preconditions:
- A higher-timeframe (daily, or at least hourly) directional read exists.
- A higher-timeframe chart of the same instrument is read before the lower one.
- A daily chart and a lower-timeframe chart of the same instrument.
- An intraday execution timeframe has been chosen.
detection_rules:
- Before trusting a lower-timeframe structure shift, check whether it is merely a retracement
  into a higher-timeframe PD array (e.g. an hourly fair value gap).
- If it is, expect that retracement - and the structure shift built on it - to FAIL.
- Frame direction on the daily first; treat lower-timeframe structure as subordinate to it.
- Having formed a bias, keep it and wait for the lower timeframes to align with it rather
  than re-reading direction off the lower timeframe.
- 'Worked case: an hourly change in the state of delivery into a previous day high was still
  treated as a retracement, because the daily read was bullish; the entry waited for the lower
  wick to form and a CISD with an ideal candle 2 closure, entering on the open of candle 3.'
- Establish the higher-timeframe trend or bias before reading any lower-timeframe structure.
- A lower-timeframe structure shift AGAINST the higher-timeframe trend is read as a retracement
  into a higher-timeframe PD array, not as a reversal; mark that PD array and expect the shift
  to fail.
- Inside a higher-timeframe bearish expansion candle, only bearish lower-timeframe setups
  are permitted - the mirror-image bullish pattern at the same location is refused outright.
- 'Preferred alternative to catching the turn: frame a continuation with the higher-timeframe
  trend, which he says is a lot easier than catching every top or bottom.'
- 'Diagnostic he gives for repeated stop-outs at exactly the turn: the higher-timeframe analysis
  was not consulted.'
- Establish a higher-timeframe point of interest or bias before reading any lower-timeframe
  structure.
- An order block (a down-close candle) is only expected to hold when it agrees with the higher-timeframe
  bias; in the opposing trend it is not a level to look for.
- Drop timeframes only once the higher-timeframe point of interest has been tagged.
- 'Step 1: find a daily candle 2 closure and take its direction.'
- 'Step 2: inside that day, look for structure only in that direction.'
- A lower-timeframe CISD against the established direction is not read as a signal.
- Hourly structure is still required and must line up with the higher-timeframe context.
- 'Stated working stack in this unit: daily, then hourly and 15-minute for analysis, with
  entries off the 15-minute, 5-minute or 1-minute.'
- The 4-hour is treated as optional once the daily has been read.
- On a 15-second execution chart he states the monthly is not consulted at all.
- What does gate the trade at that scale is the presence of displacement / fair value gaps
  in the intended direction on the traded timeframe.
invalidation:
- The higher-timeframe read itself changes (a new daily closure).
- No higher-timeframe read is available - do not read the lower-timeframe structure at all.
- No higher-timeframe point of interest exists - do not read the lower-timeframe structure
  at all.
- No higher-timeframe closure exists to anchor the read - do not read structure at all.
- Not applicable.
measurable:
- failure rate of LTF structure shifts that occur inside an opposing HTF PD array
- win-rate difference between HTF-aligned and HTF-opposing LTF structure shifts
- stop-out rate of lower-timeframe structure shifts taken with vs against the higher-timeframe
  trend
- share of counter-trend lower-timeframe shifts that terminate exactly at a higher-timeframe
  fair value gap
- stop-out rate of lower-timeframe setups taken with vs without a tagged higher-timeframe
  point of interest
- expectancy of pure 15-second trading with no higher-timeframe reference (the stated exception)
- accuracy of structure calls made with vs without a fixed daily direction
- expectancy of 15-second and 1-minute entries with and without a monthly / weekly directional
  filter applied
