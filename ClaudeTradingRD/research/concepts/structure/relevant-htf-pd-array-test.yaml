ambiguities:
- '''Relevant'' PD array is again asserted and never defined - this Short repeats the term
  without adding a test.'
- NO SESSION HOURS ARE GIVEN. 'London' and 'New York' are used as hard gates in this Short
  with no clock times attached.
- No tolerance for 'reached' (wick touch vs body trade into the level).
- '''Relevant'' is never defined. The list of level types above is inferred from what he actually
  marked in the examples, not from a stated rule.'
- No rule for which timeframe counts as 'higher' relative to the execution timeframe.
- No tolerance is given for 'reached' - whether a wick touch is enough, or whether the level
  must be traded into by a body.
- The fake-CISD test ('look left, is there anything relevant?') is a judgement call and is
  not mechanically decidable as taught.
- This test is the hinge of the entire London-vs-New-York-Reversal distinction, so its underspecification
  propagates to both profile concepts.
