id: relevant-htf-pd-array-test
name: Relevant Higher-Timeframe PD Array Test (London Reversal vs New York Reversal)
definition: 'A 46-second Short states the discriminator in a single sentence: what separates
  a New York reversal from a London reversal is that in the New York case London never reached
  a relevant PD array. The retracement therefore continues past London into New York, where
  the higher-timeframe key level is finally reached; the change in the state of delivery prints
  there and the move follows. The Short also gives the resulting daily candle shape for both
  directions - open, high, low, close for the bearish case and open, low, high, close for
  the bullish one.

  '
variants:
  definition:
  - 'The discriminator that decides which daily profile is in play once London has run counter
    to the intended daily direction. If the London run reached a relevant higher-timeframe
    PD array, the reversal is allowed to stand and the day is a London Reversal. If it did
    not, any structure shift printed in London is treated as a fake change in the state of
    delivery: the liquidity built there is expected to be run again, and the genuine reversal
    is deferred to the New York a.m. session where the level is finally reached.

    '
category: structure
status: contested
aliases:
- relevant PD array
- higher time frame key level
- fake change in the state of delivery
preconditions:
- A counter-directional run has occurred in the London window.
- Higher-timeframe levels are marked on the chart before the session.
detection_rules:
- When London runs counter to the intended daily direction, test whether that run reached
  a relevant higher-timeframe PD array.
- Reached -> the reversal stands in London (London reversal).
- Not reached -> the retracement continues into New York, where the level is reached and the
  reversal forms there.
- Confirm the New York reversal with a change in the state of delivery at that level before
  entering.
- Expect the daily candle to print open-low-high-close (bullish) or open-high-low-close (bearish).
- 'Identify whether the extreme of the London run touched a marked higher-timeframe PD array.
  Levels used as ''relevant'' in the worked examples: previous day high or low, the consequent
  encroachment (midpoint) of a wick, a measured gap between a high and a low (higher-timeframe
  imbalance), a daily fair value gap, and external liquidity/range extremes.'
- 'If it did: the London change in the state of delivery is taken as genuine and the day is
  traded as a London Reversal.'
- If it did not - and looking left shows only equal highs/lows, i.e. newly manufactured liquidity,
  rather than a level - the structure shift is a fake change in the state of delivery.
- After a fake CISD, expect the swept liquidity to be run again, ideally around the New York
  opening times.
invalidation:
- The higher-timeframe level is never reached in either session.
- 'Price reaches the higher-timeframe PD array intraday: from that point a reversal from the
  level is valid regardless of what London did (the final example is a London Reversal that
  becomes a New York Reversal once the objective is hit).'
measurable:
- share of London counter-runs that reach a marked HTF level
- hit rate of the New York branch when London did not reach one
- 'hit rate of the fake-CISD claim: given a London structure shift with no HTF level at its
  extreme, how often is that extreme taken out again the same day'
- how often a London CISD at a marked HTF level holds as the day's extreme
- how often the re-run of the faked level occurs within 08:30-10:00
