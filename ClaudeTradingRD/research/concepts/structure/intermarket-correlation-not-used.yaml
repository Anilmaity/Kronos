id: intermarket-correlation-not-used
name: Intermarket Correlation Not Used
definition: 'He does not use intermarket analysis across asset classes for bias. Asked about
  the US 10-year, DXY and indices together, he says the dollar no longer correlates usefully
  with gold, that he does not use dollar against indices at all, and that while he accepts
  everything affects everything, the operative question is whether the correlation is strong
  enough to act on - for him it is not. Correlation is used only *within* an asset class,
  as relative strength between closely correlated instruments.

  '
variants:
  definition:
  - 'Restated: he uses no correlation between the dollar and the indices; he will not let
    a risk-on/risk-off dollar read veto an index setup he has waited for all month - think
    less.

    '
category: structure
status: contested
aliases:
- DXY vs gold
- dollar vs indices
- 10-year yields
- no dollar for indices
detection_rules:
- Do not derive bias from DXY against gold, or from DXY against indices.
- Do not use bond yields as a directional input.
- 'Use correlation only within a class: the YM/ES/NQ triad, gold against a correlated metal,
  oil against gasoline.'
- He also does not use contract-vs-contract SMT (MNQ against NQ).
- News and geopolitics are acknowledged to affect everything, but only acted on if the correlation
  is strong enough to trade - on a 5- or 15-minute chart he treats the influence as zero.
- Do not use DXY direction as an input to index bias or entries.
measurable:
- measured correlation of DXY to gold and to index futures over recent windows, to test the
  claim
- whether adding a DXY filter changes outcomes on the same trade set
sources:
- video_id: bMkRomKEunU
  title: New York Open Live Q&A
