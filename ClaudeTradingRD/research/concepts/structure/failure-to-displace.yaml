ambiguities:
- '''Not very aggressive'' is the operative judgement on every chart and is never quantified
  beyond the candle-shape and comparative tests recorded under `displacement`.'
- '''Higher time frame low'' has no specific timeframe attached.'
- No bar-count limit on how quickly price must close back inside for the failure to count.
- On a 1-minute chart he concedes the reading becomes unusable without a directional bias
  ('a lot of structure breaks, a lot of failure to displace') but gives no filter beyond 'have
  a bias'.
- The premium/discount retracement requirement is applied 'a lot of times', not always.
- '''Displacement'' is never quantified anywhere in the unit — no minimum candle range, ATR
  multiple, or number of bars. The close-back-inside proxy is inferred from the examples,
  not stated as the definition.'
- The speaker uses 'fails to displace' and 'cannot close outside the range' interchangeably;
  whether they are the same test is not confirmed.
- How long after the failed probe the flipped bias remains valid is not stated.
- Sourced from an ASR (whisper-small) transcript, not YouTube captions; wording may be imprecise.
- '''Usually'' is the only strength given - no frequency, and no window within which the opposite
  extreme should be taken.'
- Which high counts as the one that gets taken (the immediate swing, or the range high) is
  shown on screen and not stated.
- This unit does not use the term 'displacement' at all; the entry is filed under this id
  because the mechanic - reach the level, fail to close through, expect the other side - is
  the same one the library records under that name. That identification is an inference.
