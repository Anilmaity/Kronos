preconditions:
- A defined reference level (swing point, previous period high/low, or session extreme).
- Price has traded to or beyond that level.
- A directional bias with a defined level that must be closed through for the move to continue.
- Price has traded to or into that level.
detection_rules:
- Mark a short-term high or low. Price trades beyond it.
- Failure to displace := no large aggressive candle closes beyond the level; price closes
  back inside the range immediately.
- 'Read the lean as the opposite direction: failure below -> expect higher; failure above
  -> expect lower.'
- He prefers the failure to be measured against a HIGHER-timeframe low/high rather than a
  tiny intraday one.
- Both sides failing in sequence = broadening formation / power of three; expect the untaken
  side to be sought next.
- A failure to displace followed by an immediate aggressive move the other way is a BPR /
  box setup on the lower timeframe.
- Price trades beyond a marked swing high / swing low or range extreme.
- The candle(s) close back inside that level rather than closing outside it.
- 'Read the consequence: expect a return into the range, then the opposite side.'
- Before reversing, he wants price to return at least to a premium (bearish) or discount (bullish)
  of the range.
- bearish_failure_to_displace := high[i] > level AND close[i] < level AND close[i] inside
  the previous period's range.
- bullish_failure_to_displace := low[i] < level AND close[i] > level AND close[i] inside the
  previous period's range.
- The complement — a close outside the range — is treated as displacement and produces a continuation
  read instead.
- Identify the level whose breach continues the move (the opposing candle / the level that
  would form the change in the state of delivery).
- 'Bearish case: price trades to the level but no candle closes below it.'
- Expect the opposite side - the nearest high above - to be taken out before the move resumes.
- 'Do not treat this as an invalidation of the bias: it changes the sequence, not the direction.
  The bias is kept and the confirmation requirement is raised.'
- At the daily scale the same failure appears as a close that is not weak enough - a bearish
  day that closes back up into its range rather than into its lows requires more lower-timeframe
  confirmation the following day.
invalidation:
- Aggressive candles subsequently close outside the level — displacement, not a failure.
- A subsequent close beyond the level in the original direction cancels the flipped bias.
- The closure arrives on a later candle without the opposite side being taken - the tendency
  did not hold, which the speaker shows happening.
- Price expands away through the level - it displaced after all.
measurable:
- continuation rate in the leaned direction after a failure to displace, by timeframe
- same statistic for higher-timeframe vs short-term reference levels
- hit rate of 'close back inside -> opposite side of range is reached' by timeframe
- how often the premium/discount retracement precondition is met before the reversal
- 'hit rate: after a failure to displace at PDH, does the following day trade to PDL'
- distribution of how far beyond the level the failed probe extends
- hit rate of 'failed closure at the level => nearest opposite extreme is taken within N candles'
- how much further the move travels after the sweep-then-closure route vs the direct closure
  route
- frequency of the daily variant (close not weak enough) and the next day's outcome
