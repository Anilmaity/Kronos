id: failure-to-displace
name: Failure To Displace
definition: 'The dedicated earlier treatment, and it is the strongest statement of the concept
  in the corpus: the video''s actual subject is ''displacement and the lack of displacement'',
  and his closing summary makes the lack of displacement the ENTRY rather than merely a bias
  input. Mechanically: price trades beyond a marked high or low and comes straight back into
  the range with no large closes beyond it. The stated inference is symmetric and exhaustive
  - ''the lack of [displacement] on each side leans in the other direction'' - so a failure
  to displace below leans bullish and a failure to displace above leans bearish. When BOTH
  sides fail in sequence he calls the result a broadening formation / power of three: fail
  one side, expect the other side to be sought.'
variants:
  definition:
  - Price reaches beyond a structural level (an old high or old low) but cannot produce large
    aggressive candles closing outside it, and closes back inside instead. He treats this
    as the mirror image of displacement and as the signal that price will return into the
    range and seek the opposite side.
  - 'Price trades to or through a level (a swing point, previous-period high/low, or session
    extreme) but cannot expand beyond it and returns inside the prior range. The channel treats
    this as a bias-flipping event: failure to displace under a low makes the bias up, failure
    to displace over a high makes the bias down. In the worked examples the operational test
    used is a candle that reaches beyond the level but closes back inside the previous range.

    '
  - 'The unit''s clearest statement of the consequence of a failed closure, offered as a general
    tendency rather than as an observation about the chart in front of him. Price reaches
    a level it needs to close through in order to continue expanding, trades into it, and
    cannot produce the close. The stated expectation is that the opposite side - the high,
    in the bearish case being walked through - is then usually taken out. It is used twice
    in the same walkthrough: once at the daily scale, where a failure to close bearishly enough
    turns the next day from a clean continuation into a setup requiring extra lower-timeframe
    confirmation, and once on the 15-minute, where the failed closure is followed by the sweep
    it predicts. He is careful to note the tendency is not a certainty - in the second instance
    the high is not in fact taken and the closure eventually comes anyway.

    '
