id: intermediate-term-swing-formation
name: An Intermediate-Term Low Or High Forms Two Ways
variants:
  name:
  - An Intermediate-Term Swing Point Is One That Rebalanced A Fair Value Gap
  definition:
  - 'When no low is available to be swept, he falls back on advanced market structure: the
    thing he is actually waiting for is an intermediate-term low or high, and that forms in
    one of exactly two ways - by sweeping out a low (or high), or by reaching into a fair
    value gap. In the second case the up-close candle before the move into the fair value
    gap, once closed over, is used as the level to trade higher. He states plainly that this
    second construction is not a real breaker, and keeps it only because he finds that it
    works.'
  - 'Two guests in this unit give the same mechanical test for an intermediate-term swing
    point: it is the swing that formed when price traded back into - rebalanced - a fair value
    gap. AM Trades adds the directional use, which is the whole point of the labelling: while
    bearish you want intermediate-term lows to be broken and intermediate-term highs to stay
    unviolated, and reading structure this way replaces higher-high / higher-low labelling
    entirely. Alex''s Options gives a second route in the same unit - a high flanked by a
    short-term high on each side, which he describes as looking like a small head-and-shoulders
    - and says he rolls the reference intermediate-term low upward as new ones form. Both
    defer to ICT''s 2022 mentorship, episodes 12 and 13, for the full scheme.'
definition: 'A Short gives the structural build-up and, usefully, a NAME the corpus did not
  have for the second route. A short-term low is a swing low (a low with a higher low on each
  side); a short-term low that has a HIGHER short-term low on its right and on its left becomes
  an INTERMEDIATE-TERM low (mirrored for highs). That is the first type. The second type he
  names outright: a REBALANCED intermediate-term high or low, which forms when price drops
  into a fair value gap and trades away from it (mirrored above).'
category: structure
status: contested
aliases:
- intermediate term low
- intermediate term high
- advanced market structure
preconditions:
- Short-term highs and lows have already been marked (three-candle swing definition).
- A directional read is already in place; a short-term low has formed.
- A fair value gap exists that price can retrace into; a directional read is already in place.
detection_rules:
- Short-term low := a low with a higher low on each side of it. Short-term high := a high
  with a lower high on each side.
- Type 1 intermediate-term low := a short-term low with a HIGHER short-term low to its right
  and to its left.
- Type 1 intermediate-term high := a short-term high with a short-term high to its left and
  to its right.
- Type 2, "rebalanced" intermediate-term low := price drops down into a fair value gap and
  trades away, creating the low.
- 'Type 2 mirrored: price trades up into a fair value gap and then away, creating the intermediate-term
  high.'
- 'Route 1: a prior low is swept -> the resulting low is an intermediate-term low.'
- 'Route 2: price reaches into a fair value gap -> the low made there is an intermediate-term
  low.'
- In route 2 the tradeable level is the up-close candle (or series) immediately before the
  move into the fair value gap, once price closes over it.
- Mirror for intermediate-term highs.
- He describes the underlying sequence as a short-term low, a sweep of it, and then another
  short-term low, which together form the intermediate-term low.
- A swing that formed on a retracement into a fair value gap is an intermediate-term swing
  point.
- 'Second route stated by Alex''s Options: a high flanked by a short-term high on each side
  is an intermediate-term high.'
- 'Bearish: require intermediate-term lows to be broken and intermediate-term highs to stay
  unviolated. Mirror for bullish.'
- As price advances, roll the reference intermediate-term swing forward to the most recent
  one.
invalidation:
- Not applicable - a labelling rule.
- Price trading back below the intermediate-term low (bullish case).
- An intermediate-term high is violated while the read is bearish (mirror for bullish).
measurable:
- ratio of type-1 to rebalanced intermediate-term swings per session
- how often a rebalanced intermediate-term low holds versus a type-1 one
- relative frequency of route 1 vs route 2 formations
- continuation hit rate conditional on which route formed the swing
- continuation rate after an intermediate-term low is broken vs after an ordinary swing low
  is broken
- relative frequency of the two formation routes
