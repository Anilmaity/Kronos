ambiguities:
- The bearish type-1 wording in the Short is loose - "a short-term high with a short-term
  high to its left and to its right" omits the LOWER qualifier the bullish case carries. Read
  as an auto-caption / speech slip rather than a different rule, but it is not corrected on
  the clip.
- The rebalanced route does not say how far into the fair value gap price must trade, nor
  whether the gap must then be respected.
- No timeframe is named in the clip; the diagram is generic.
- The full advanced-market-structure labelling scheme is referred to a separate video and
  is not restated here.
- '''Reaching into a fair value gap'' is not quantified - near edge, consequent encroachment
  or full fill are not distinguished.'
- The short-term / intermediate-term / long-term hierarchy is used without definitions in
  this unit.
- The two routes given by the two guests are never reconciled with each other.
- '''Trades back into'' is not quantified - a touch, the 50%, or a full fill are not distinguished.'
- Both speakers defer the full short-term / intermediate-term / long-term scheme to ICT's
  mentorship rather than stating it.
