id: consolidation
name: Consolidation
definition: 'One of the corpus''s three load-bearing undefined terms, and this unit contains
  its only attempt at a test - a negative one. Price can print a higher high and a higher
  low and still not be trending, because there is no displacement around the swings; he calls
  that consolidation and says the reason it matters is that direction is unknown. The top-down
  video applies the complement on the daily chart: a day that forms a strong directional closure
  is explicitly not consolidating and is classified as a retracement or a reversal instead.
  No range width, bar count, duration or volatility bound is given anywhere in this unit.'
variants:
  definition:
  - 'Asked live how he mechanically defines a consolidation, he gives a one-line positive
    rule: price fails to take out a previous range. He applies it to the daily chart on the
    spot - the previous day was a consolidation (an inside day), and the current day is ''by
    definition so far also a consolidation'' because it has not left the prior day''s range.
    This fills the gap the library entry records (whether an inside bar counts): in this stream,
    it does. The stated handling is to typically avoid such days; if forced to trade one (the
    competition), the single question to ask is whether price is more likely to reach the
    previous day high or the previous day low, and that answer is the bias.'
  - 'Asked for a mechanical definition he gives none beyond: a high and a low price stays
    within for a period of time; you get used to seeing it.'
  - 'A decidable proxy given live: nested inside candles. The daily is an inside day within
    the prior candle, which is itself inside the candle before it - ''inside day inside day''
    - and that alone classifies the market as consolidation / rangebound. The monthly is read
    the same way.'
category: structure
status: contested
aliases:
- consolidating
- no real Direction
- inside day
- inside day after inside day
preconditions:
- A stretch of price action with identifiable swing highs and lows.
- A completed previous range (the previous daily candle in the worked case) with a defined
  high and low.
detection_rules:
- 'No positive mechanical rule is given. The only test he applies is the ABSENCE of displacement:
  a higher-high / higher-low sequence with no displacement around it is labelled consolidation
  rather than trend.'
- 'Complement applied on the daily: a candle that forms a strong directional closure is not
  consolidating, and the phase read moves to retracement or reversal.'
- 'Behavioural marker he narrates while consolidating: price is ''just sweeping highs and
  lows'' with no real direction.'
- 'Operational consequence stated: while consolidating, you do not know where price wants
  to go, so you let it play out.'
- Consolidation = the current candle has not traded beyond the previous candle's high nor
  its low (inside candle).
- Consecutive inside days are each a consolidation ('inside day after inside day').
- 'Default handling: avoid trading the inside range.'
- If trading anyway, set bias by judging which of previous day high / previous day low price
  is more likely to reach next.
- Daily candle range contained in the prior daily candle, and that candle contained in the
  one before it -> consolidation.
- Apply the same nested-inside test to the monthly.
invalidation:
- Displacement appears (a close over the previous high / below the previous low) - the label
  moves to trend or to a structure shift.
- Price trades beyond the previous range's high or low - the day is no longer a consolidation
  by this definition.
measurable:
- 'candidate formalisations to test against his annotated examples: N bars with no close beyond
  the prior swing; range of the last N bars below k * ATR; ratio of body sum to net displacement'
- how often a stretch he labels consolidation is followed by expansion in either direction
- frequency of inside days on NQ/ES daily
- conditional probability that the day after an inside day takes the PDH vs the PDL
- daily range of inside days vs non-inside days
