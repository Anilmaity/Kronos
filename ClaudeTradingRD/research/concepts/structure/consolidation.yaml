ambiguities:
- 'The definition is circular for automation purposes: consolidation is the absence of displacement,
  and displacement is itself never quantified in this corpus.'
- No range width, bar count, duration or volatility threshold is given.
- Whether an inside bar, a doji, or a shallow retracement counts as consolidation is not addressed
  in these three videos (other units treat all three as consolidation signatures).
- The relationship between this bar-level 'consolidation' and the weekly consolidation-reversal
  profile is never drawn.
- '''Strong directional closure'' (the disqualifier on the daily) is itself unquantified.'
- Stated for the daily candle while the day is still forming ('so far'); whether a single
  wick beyond the prior range ends the consolidation, or a close is required, is not said.
- This rule is an inside-bar test and conflicts with the library's earlier negative test (higher
  highs/lows without displacement can also be consolidation); the two are compatible only
  if both are sufficient conditions.
- How to decide which of PDH/PDL is 'more likely' is not given here; he later reads it from
  a closure over the daily open (see notes).
- No minimum duration or bar count.
- Whether a single inside day suffices or two nested inside candles are required is not stated;
  the example had two.
