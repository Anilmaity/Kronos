ambiguities:
- 'The definition is circular for automation purposes: consolidation is the absence of displacement,
  and displacement is itself never quantified in this corpus.'
- No range width, bar count, duration or volatility threshold is given.
- Whether an inside bar, a doji, or a shallow retracement counts as consolidation is not addressed
  in these three videos (other units treat all three as consolidation signatures).
- The relationship between this bar-level 'consolidation' and the weekly consolidation-reversal
  profile is never drawn.
- '''Strong directional closure'' (the disqualifier on the daily) is itself unquantified.'
