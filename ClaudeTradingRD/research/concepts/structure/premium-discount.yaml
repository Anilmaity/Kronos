id: premium-discount
name: Premium & Discount
variants:
  name:
  - Premium & Discount (used inverted)
  definition:
  - 'The dedicated video for the inversion, and it gives the reason. He acknowledges the standard
    ICT usage and says he uses it the opposite way. The justification is the phase of price:
    in an expansion phase - the phase he trades - price rarely retraces all the way into a
    discount (in an up move) or a premium (in a down move), so waiting for a discount entry
    during an expansion means missing the move. He therefore uses the halves as a filter that
    must HOLD for the direction to survive, rather than as a location to enter counter to
    the current leg.'
  - 'EARLIER RECORDING - and it is the STANDARD, non-inverted usage, which is why this entry
    is contested. Here premium and discount are locations measured against two clock levels
    (the midnight open and the 08:30 open) rather than halves of a leg or range: below the
    levels is discount and is where longs are sought, above them is premium and is where shorts
    are sought. He also describes the levels as a line in the sand, points of interest, or
    targets. The later, canonical video on this topic states the opposite stance - that he
    uses premium and discount the opposite way to common ICT usage and does not wait for a
    retracement into discount during an expansion.'
  - 'He uses premium and discount the opposite way to the common ICT framing. Rather than
    waiting for a bearish retracement into premium to sell at a better price, he treats a
    deep retracement into premium as evidence that the move is no longer bearish - it shows
    a wick forming the other way. What he wants instead is a shallow run. The EQ of the relevant
    candle or range is the level that must hold for the directional read to survive.

    '
definition: 'EARLIER RECORDING. Taught at TWO scales that are used together and kept separate:
  (a) premium/discount of the DISPLACEMENT RANGE, used to refine an entry after a market structure
  shift - long only below the 0.5 of the leg, short only above it; and (b) premium/discount
  of the OVERALL RANGE (e.g. the previous session''s low to high), used as the day''s positional
  frame - it tells you where you should be looking to buy and where to sell. He closes by
  subordinating both to bias: the premium/discount read is applied underneath a directional
  bias, not instead of one.'
category: structure
status: contested
aliases:
- discount and premium
- above the 0.5 fib
- I use it the opposite
- discount
- premium
- line in the sand
- discount PD array
- premium retracement
- EQ
preconditions:
- A range with a defined high and low (either a displacement leg or the day's range).
- The current phase of price has been classified as expansion.
- The midnight and 08:30 opens are marked.
- A directional read on the higher timeframe candle or leg.
detection_rules:
- 'Displacement scale: after a market structure shift, fib the displacement leg; longs only
  in the discount half, shorts only in the premium half.'
- 'Overall scale: fib the prior session''s low to high; look for longs only in the discount,
  shorts only in the premium.'
- Reject an otherwise valid fair value gap purely because it sits on the wrong side of the
  0.5.
- A setup that breaks structure but never retraces past the 0.5 of the leg is not taken.
- Both reads are applied underneath an existing bias, never as a substitute for one.
- Classify the phase first; the inversion applies to expansion phases.
- In an expansion higher, require the upper half to hold; do not expect a retracement into
  discount.
- In an expansion lower, require the lower half to hold; do not expect a retracement into
  premium.
- A retracement that does reach the far half is evidence the expansion phase has ended.
- During expansion, up-close (or down-close) candles are also expected to be respected alongside
  the EQ.
- 'EARLIER READING: discount := below the midnight or 08:30 open; buy there.'
- 'EARLIER READING: premium := above the midnight or 08:30 open; sell there.'
- The same two levels double as points of interest and as targets once price has moved away
  from them.
- If bearish, price should make only a shallow retracement. Price retracing up into premium
  indicates a wick forming and kills the bearish read.
- If continuing an expansion higher, price should not trade all the way back down into discount.
- 'The EQ is the practical boundary: a monthly candle that did not close below its open is
  still counted as bearish as long as the EQ is respected.'
- Price trading above 50% of the opposing candle range in a bearish setup means he expects
  the highs to be taken instead.
invalidation:
- The range is superseded (a new displacement leg, a new session range).
- Price trades into the far half - the expansion reading is over.
- Price crossing back through the level moves it out of that classification.
- A retracement into premium (bearish case) or discount (bullish case) past the EQ.
measurable:
- hit rate of entries in the correct half vs the wrong half of the displacement range
- how often the two scales disagree on the same candidate entry
- retracement depth distribution within legs he classifies as expansion
- share of expansion legs that reach discount/premium before continuing
- expectancy of longs taken below the two opens versus longs taken above them
- how often a day's entry location under this rule agrees with the later EQ-based inverted
  rule
- retracement depth distribution on continuation legs vs failed legs
- hit rate of the EQ holding as a directional filter
