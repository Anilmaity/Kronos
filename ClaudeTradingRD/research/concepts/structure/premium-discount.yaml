ambiguities:
- EARLIER RECORDING. No precedence rule is given for when the displacement-range read and
  the overall-range read disagree - both are simply required to be satisfied in the examples.
- The 'overall range' is chosen by eye ('last friday's action'); no rule fixes the lookback.
- Whether the fib is drawn on wicks or bodies is not stated.
- CONTESTED against premium-discount-equilibrium in the library, which records the standard
  R:R framing (longs only in discount, shorts only in premium). Both are his - the standard
  framing is taught in the foundation material and inverted here for the expansion phase.
  No rule is given for which framing governs when the phase is ambiguous.
- '''Rarely'' is not quantified.'
- Which range the premium/discount is measured on (candle, leg, or swing-to-swing range) is
  not fixed - in this video it is the previous candle.
- 'PROVENANCE: this is the EARLIER recording and it uses premium/discount in the ORTHODOX
  sense (buy the discount). The updated video ''You Are Using Discount and Premium Wrong!
  - EQ For Expansions'' explicitly reverses this. Both readings are preserved; do not average
  them.'
- The two framings also differ in their anchor - clock levels here, the EQ of a leg or candle
  later - so they are not strictly the same measurement made twice.
- No level between the two opens is given as the divide when price sits between them.
- CONTESTED against mainstream ICT usage, where a retracement into premium is the sell entry;
  he states the inverse and calls it 'the opposite'.
- Which range the EQ is taken of - the candle, the leg, or the dealing range - varies across
  the examples and is not fixed.
- '''Shallow'' is not quantified.'
