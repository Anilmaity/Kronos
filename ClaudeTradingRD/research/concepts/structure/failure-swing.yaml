id: failure-swing
name: Failure Swing
variants:
  name:
  - Failure Swings (structure that is ignored, liquidity that is targeted)
  definition:
  - 'A cluster of swing highs (or lows) at a similar level that failed to expand, treated
    in two connected ways. First, as structure to disregard: a reversal that only leaves failure
    swings behind it is called basically irrelevant and does not change the bias. Second,
    as an obstruction and a target: with failure swings stacked on the highs, a short cannot
    be framed off the open on that instrument - a manipulation into the low would have to
    come first - and conversely, when trading long the objective is to be positioned before
    those failure swings are taken, because they are where the liquidity sits. In the ES scalp
    the failure swings on the highs, together with equal highs, are the stated draw for the
    trade.

    '
  - 'A minor high or low that did not sweep meaningful liquidity. Failure swings are not trusted
    as levels to trade away from and cannot support a stop; the stop must be placed behind
    the genuine swing point above/below them. A run through a cluster of failure swings into
    a real swing point is what creates the tradeable structure.

    '
  - 'Adds a candle-level usage: a 4-hour candle 2 closure that swept its previous candle and
    closed back but did NOT take out the earlier high is ''a valid candle to closure'' that
    is ''a failure swing''. It may still be traded, but he prefers SMT there and demands cleaner
    lower-timeframe continuation structure. Proximity matters: failure swings close to the
    reversal are ''pretty concerning''; further away he does not mind trading away from them.
    In the dealing-range video, failure swings at the target end are acceptable as a mechanical
    range bound (''ideally you want to see price reach out the failure swings'').

    '
  - 'SHORTS EVIDENCE on crude oil, daily chart. Price builds stacked highs and lows. The lows
    are relevant lows and get small reactions; the highs are all failure swings - including
    one with "a bit of separation" between it and its neighbour, which he says is still a
    failure swing. He would not trust shorting off a high that leaves another failure swing
    above it, so his relevant high is the extreme beyond the whole cluster. When price finally
    hits the relevant low, a reversal is looked for with the failure-swing highs as target,
    and the stop side should carry high resistance liquidity / no failure swings.

    '
  - 'In this unit a failure swing is defined by SWEEPING, not by proximity: it is a high or
    low that a subsequent price leg approached and turned away from WITHOUT taking it out.
    The high (or low) left behind by that turn is the failure swing, and the untaken liquidity
    resting above/below it is what makes the area low resistance. He uses failure swings both
    as the thing that identifies low resistance liquidity and as a place to exit - taking
    profit at the failure swing rather than holding for a more distant, already-swept level.'
  - 'The small swings left behind after a protected high or low forms - the shallow highs
    and lows that did not get taken during the move away. He uses them two ways: as a non-greedy
    target (price returning to sweep failure swings before continuing), and as the side of
    the market with low resistance, since a side carrying failure swings is the side he expects
    price to run first. Failure swings can be read from the higher timeframe, where previous
    day lows serve as failure swings.

    '
  - 'Cross-walk to The Strat given to a Strat trader: a failure swing is NOT a Strat ''failed
    2'' (a bar failing to become a 2 and turning into an outside/3 bar). It is purely structural
    - the run of highs (or lows) lined up at a level without being taken out; the Strat trader''s
    equivalent term is ''pivot machine gun''.'
  category:
  - liquidity
definition: 'In this video failure swings are defined by proximity rather than by whether
  they swept anything: they are the stacked highs or lows that sit close enough to one another
  that no one of them can be trusted as a level to trade away from, because price is expected
  to reach past them to the extreme. They are what you target, not what you trade away from,
  and he does not want them sitting on the stop-loss side of a position. A run through a cluster
  of failure swings into the relevant extreme is what creates the tradeable event.'
category: structure
status: contested
aliases:
- stacked highs
- stacked liquidity
- not relevant
- failure swings
- these failure swings here
- short-term low
- short-term high
- failed swing
- pivot machine gun (Strat-trader equivalent)
preconditions:
- Two or more same-side extremes exist at a similar level.
- Multiple swing points formed at a similar level without expansion beyond them.
- A visible sequence of minor highs or lows below/above a larger swing point.
- A higher-timeframe candle 2 closure exists near an untaken earlier high/low.
- A protected swing has formed and price has delivered away from it.
detection_rules:
- Identify same-side extremes that sit close together with no valid separation.
- Classify all but the outermost as failure swings.
- Do not look for a reversal at a failure swing - expect price to reach past it into the relevant
  extreme.
- Use the failure-swing cluster as the target when trading toward that side.
- Require the stop-loss side to carry no failure swings (high resistance liquidity).
- A fair value gap can be read as a failure swing because it is a high on a lower timeframe.
- Identify repeated swing highs (or lows) at a similar level that did not expand.
- A reversal that produces only failure swings does not change the higher-timeframe bias -
  disregard it.
- Do not frame a trade into the side covered by failure swings without a manipulation into
  the opposite extreme first.
- When trading toward them, target the failure swings and be positioned before they are taken.
- Failure swings and equal highs are cited together at the same level and treated as the same
  thing for targeting purposes.
- Failure swings on a side mean there is no protected swing on that side, which is a direct
  reason to refuse to get onside.
- 'The positive use: when failure swings are present, expect those levels to be revisited
  and taken out, and wait for that to happen before framing the trade.'
- A minor extreme that price makes without sweeping a prior extreme is treated as a failure
  swing.
- A genuine swing point is one whose sweep takes out a prior extreme (liquidity).
- If the C2 extreme fails to take the earlier swing, classify it as a failure-swing C2.
- Trade a failure-swing C2 only with SMT or clearly clean lower-timeframe continuation structure.
- A high that leaves another nearby high above it is not a level to trade away from; the relevant
  high is the outermost of the stacked cluster.
- Visible separation between two stacked highs does not by itself make the inner one relevant.
- Trade from the relevant low toward the stacked failure swings; keep no failure swings on
  the stop side.
- Mark a high (or low) L. Observe the next price leg that travels toward L.
- If that leg reverses before trading through L, the extreme it made is a failure swing and
  L remains untaken.
- A cluster of such extremes on the same side is a low-resistance region.
- 'Use: exit the position at the failure swing / equal lows rather than holding for the more
  distant high-resistance extreme.'
- Identify the shallow swings left behind between the protected extreme and the current price.
- When price reacts and comes back, it will often take out those failure swings before resuming
  - use the first failure swing as a target when there is no strong higher timeframe bias.
- On the daily chart, the side carrying failure swings is the low-resistance side; do not
  look for trades in the other direction until they are taken.
- Previous day lows can be treated as failure swings when read from the higher timeframe.
invalidation:
- The relevant extreme beyond the cluster is taken, resolving the cluster.
- Price expands cleanly through the cluster - they were not failure swings but the start of
  a trend leg.
- Not stated as a separate condition.
- n/a (a gating rule).
- Price trading through the protected extreme itself rather than merely the failure swings.
measurable:
- hit rate of failure-swing clusters as targets
- stop-out rate of trades whose stop sits behind a failure-swing cluster
- count of swing points required before a cluster reads as failure swings
- hit rate of failure-swing clusters as an intraday draw
- frequency of trades framed against a failure-swing side that failed
- Stop-out rate of stops placed behind failure swings vs behind the next genuine swing.
- outcome of failure-swing C2 setups with vs without SMT
- realised R exiting at the failure swing vs holding to the distant swept level
- hit rate of the first failure swing as a target
- how often the failure-swing side of the daily chart is run first
