ambiguities:
- 'CONTESTED against the corpus''s other definition: elsewhere a failure swing is defined
  by not having swept prior liquidity. Here it is defined purely by proximity to a neighbouring
  extreme. The two tests can disagree on the same bar.'
- '''Close together'' is the same unquantified separation judgement as relevant-swings-separation.'
- He refers viewers to a separate failure-swings video as the prerequisite, so the full definition
  is out of scope of this transcript.
- Sourced from an ASR (whisper-small) transcript, not YouTube captions; wording may be imprecise.
- In video Nlw-PZhoViQ failure swings are read as a positive expectation (the level will be
  revisited) rather than as irrelevant structure, which sits alongside - not obviously with
  - the dismissal of failure swings in video UBTl7za9obc. No reconciliation is offered.
- The term is used as if already defined and is never defined in this unit; the reconstruction
  above is entirely from how it is applied on the two charts.
- No count and no tolerance is given - how many swings at how similar a level constitutes
  failure swings is unstated.
- The relationship to equal highs is left implicit; in video w-JekHg6Ldk both are cited at
  the same level without distinguishing them.
- The boundary between a failure swing and a genuine swing point is asserted visually; the
  only stated test is whether the sweep took out a prior extreme.
- In aqnY1yZvfYs he says 'don't really trust those failure swings' as a reason to skip a whole
  idea, implying they can also invalidate a setup, not just a stop placement.
- This sweep-based definition is not the same as the proximity-based definition recorded from
  other units (stacked extremes too close together to trade away from). Both are preserved.
- No lookback bound on which leg counts as 'the leg toward it'.
- No mechanical definition is given - failure swings are pointed at on the chart rather than
  defined by a rule.
- The relationship between 'failure swing' and 'relatively equal lows' is not clarified; he
  refuses to trade away from equal lows but targets failure swings, and the two look similar
  on a chart.
- How many failure swings must exist for a side to count as low resistance is not stated.
