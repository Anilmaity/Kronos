preconditions:
- A candle with a wick has closed, and a directional read exists.
- A candle 2 / reversal candle whose wick is the reference.
- A wick or opposing candle exists whose 50% level can be marked.
- A wick (opposing run) or a change-in-state-of-delivery leg exists with a defined high and
  low.
- A closed higher timeframe candle with an identifiable wick against the direction of travel.
- A candle 2 closure has occurred (or a strong candle 3 closure, for the candle-4 case).
- A candle with a wick large enough to mark, typically at a swept swing.
- A candle 2 closure with a defined wick exists.
detection_rules:
- Measure the wick from the candle BODY to the wick extreme; mark its 50%.
- 'Bullish: on the following period price should open, form a low at or above that level,
  then trade higher (open-low-high-close).'
- 'Bearish: price should open, form a high at or below that level, then trade lower (open-high-low-close).'
- A close through 0.5 of the wick counts as disrespect; the opposite extreme then becomes
  the more likely draw.
- Disrespect early in the period is stronger evidence than a late poke - one example notes
  a level respected all period then run out at the very end.
- 'Classify the candle: large opposing wick (reversal) vs small wick (expansion).'
- 'Large-wick candle: mark 0.5 of the WICK; expect price to reach it, form an intracandle
  change in the state of delivery, then trade away.'
- 'Small-wick candle: mark 0.5 of the CANDLE''S RANGE instead; a move to 0.5 of the small
  wick would not be a shallow retracement.'
- In parallel he marks 50% of the BODIES of the opposing-candle series (the mean threshold)
  and requires no closures beyond it.
- 'Candle 4 uses a related but distinct level: 0.5 of candle 3''s range, with the wick required
  in the correct half.'
- After a higher-timeframe reversal candle, mark 50% of its wick.
- 'Bullish: the following candle should open, form its low in the upper half of the wick,
  and trade higher.'
- Confirm that low with a change in the state of delivery before treating it as held.
- 'A close through 0.5 of the wick inverts the read: anticipate the swing to fail and the
  low to be taken out.'
- Mirror for the bearish case using the lower half.
- Mark 50% of the relevant wick.
- For a continuation, require the next candle to form its low (or high) in the half nearer
  the direction of travel, then close over.
- Require the reaction to happen quickly rather than grinding at the level.
- When refining an entry, use 0.5 of the lower-timeframe swing as the line price must not
  trade beyond.
- Compute the midpoint of the wick, or of the CISD leg.
- For a continuation to remain valid, price must not trade beyond that midpoint.
- For a CISD entry, the stop must lie within 50% of the CISD leg.
- Mark 0.5 of the wick of the relevant candle.
- In the continuation case, expect the next candle to open, reach into 0.5 of the wick, and
  then deliver away from it.
- In the bearish case, the lower half of a weak-close wick should support price lower.
- 'For positional entries: price trading above 50% of the opposing candle range invalidates
  a bearish idea and shifts the expectation to the highs being taken.'
- 'Bullish continuation: price should respect 0.5 of the opposing candles during a strong
  trend or expansion; closing below it ends that reading.'
- Mark 0.5 of the previous candle's high-to-low range.
- 'Bullish case: candle 3''s LOW must form in the upper half of that range.'
- 'Bearish case (mirrored): candle 3''s high must form in the lower half.'
- 'For candle 4 continuation: require candle 3 to close above candle 2''s high, then mark
  EQ of candle 3''s range and require candle 4''s low in its upper half.'
- Where a swing low has already been swept (high resistance liquidity), mark 0.5 of that wick
  and use it as the support area.
- On the confirming timeframe, 0.5 of that same wick must be respected for the higher-timeframe
  read to stand.
- The level is used together with, not instead of, the sweep-and-close-back-inside condition
  on the same candle.
- Take the wick of the candle 2 closure (extreme to body edge).
- Mark its 50% level.
- Expect price to reach into that level and no further.
- Enter on an intra-candle change in the state of delivery inside the level.
invalidation:
- Price closes beyond 0.5 of the wick against the read.
- Price closes beyond the marked half level -- the expansion read is downgraded or dead.
- Price closes through the 50% level of the wick.
- Price trades beyond 50% of the wick, or takes out the lower-timeframe swing that the level
  was drawn from.
- Price trades materially beyond 50% of the wick; the setup is then treated as a reversal
  candle and the next candle becomes the continuation candidate.
- A close beyond 0.5 of the wick / 0.5 of the opposing candle range.
- The next candle's low forms below EQ of the prior candle's range — the wick is too large
  to support expansion.
- Price fails to respect 0.5 of the wick - the higher-timeframe read is dropped.
- Price trades decisively beyond the 0.5 of the wick.
measurable:
- forward expansion conditional on the 0.5-of-wick level holding vs breaking
- false-signal rate of a late-period disrespect vs an early one
- respect rate of 0.5-of-wick vs 0.5-of-range, split by wick size
- forward expansion conditioned on which half level held
- hit rate of the extreme being taken out after a close through 0.5 of the wick
- share of next-period lows that form in the upper half after a bullish reversal candle
- hit rate of continuations that hold 0.5 of the wick versus those that breach it
- time-to-reaction at the 50% level, split by outcome
- rate at which a violated 0.5-of-wick level is followed by failure of the continuation
- hit rate of price reaching 0.5 of the wick before continuation
- hit rate of 0.5 holding as support/resistance during confirmed expansion
- expansion rate of candles whose low is above vs below prior-candle EQ
- hold rate of 0.5-of-wick on swept swing lows vs unswept ones
- reaction depth relative to the 0.5 level before continuation
- share of C2 wicks whose 0.5 level contains the subsequent retracement
- hit rate of intra-candle CISD entries at the 0.5-of-wick level
