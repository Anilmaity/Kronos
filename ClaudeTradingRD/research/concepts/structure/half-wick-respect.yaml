ambiguities:
- 'Two different 50% levels are used in the same corpus without being distinguished by name:
  0.5 of the WICK (body-to-extreme, this concept) and 0.5 of the CANDLE (the EQ / T-spot).
  The trailing-stop video says ''respect 50% of this higher time frame candle'', which is
  the candle EQ, not the wick half.'
- Whether the disrespect must be a body close or a wick through is stated as a close in the
  rules but shown both ways on the charts.
- No rule is given for which of the two halves to use when a candle has wicks on both ends.
- Three different half levels are in use in this unit -- 0.5 of the wick, 0.5 of the candle
  range, 50% of the bodies -- and only the first two get an explicit selection rule.
- The selection rule itself depends on the unquantified small/large wick classification, so
  it inherits that ambiguity.
- 9BY-MQRNy-Y applies 0.5 of the wick to a weekly candle 2 closing on its wick without invoking
  the wick-size test.
- '''Closure through'' 0.5 of the wick is stated for the failure case, but the respect case
  is shown as a wick low, so the two sides use different tests (close vs touch).'
- The wick measured is the reversal candle's own wick; whether an intervening candle's wick
  may substitute is not stated.
- No tolerance band around the 50% level is given.
- '"Rather quickly" is never given a candle count or a time limit.'
- Whether the 50% is measured on the wick alone or on the whole candle varies by example -
  he uses "0.5 of that" on a swing, on a wick, and on a body cluster in different passages.
- Wick touch versus body close through the level is not distinguished.
- He says price should not trade beyond it, but also that price can exceed it and still reverse;
  how far beyond 0.5 counts as invalidation is not specified.
- It is not stated whether the midpoint is measured to the wick extreme or to a body close.
- 0.5 is sometimes of the wick and sometimes of the opposing candle's full range; the two
  are used interchangeably in speech.
- Whether a wick through 0.5 without a close counts as a violation is not stated.
- No minimum wick size for the rule to apply.
- EQ is taken on the full high-to-low range; he does not say whether wicks or bodies define
  that range.
- This is a guest's mechanisation of the channel's own small-wick rule; whether TTrades himself
  uses the same 0.5 test is not established by this video.
- He defers the derivation to a dedicated 'Wicks video' which is not part of this unit.
- '''Respected'' is not distinguished into a wick touch versus a body close through.'
- The auto-caption renders the level as '05' and 'A2 support' (an area to support); the quotes
  are reproduced exactly as transcribed.
- The expansion-candle 50%-of-high-to-low branch of the EQ rule does not appear at all in
  these three videos, so this unit corroborates only half of it.
- Whether the wick is measured to the candle's open or to its close (the two body edges) is
  not stated.
- Whether a wick THROUGH the level or only a close beyond it invalidates is not stated.
