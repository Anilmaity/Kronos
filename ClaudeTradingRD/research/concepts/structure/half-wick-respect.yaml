id: half-wick-respect
name: 0.5 of the Wick Must Be Respected
variants:
  name:
  - Equilibrium Of The Previous Candle's Range Must Support The Next Candle's Low
  definition:
  - 'The half-level that must be respected is measured differently depending on the candle
    type, and this unit supplies the discriminator that resolves an apparent contradiction
    elsewhere in the corpus. On a LARGE-wick reversal candle, 0.5 of the WICK is the level.
    But on a SMALL-wick expansion candle he explicitly refuses 0.5 of the wick, because a
    retracement to the midpoint of a small wick would still be a deep move relative to the
    candle -- so he uses 0.5 of the whole CANDLE''S RANGE instead. He states the underlying
    principle both ways: the goal is a shallow retracement consistent with expansion.'
  - 'Four Shorts state the half-wick rule as a matched respected/disrespected pair, which
    makes it the cleanest if-then in the unit. After a higher-timeframe reversal candle prints,
    mark 50% of that candle''s wick. If price is going to continue in the reversal direction,
    the following period''s low (bullish case) must form in the UPPER half of that wick: open,
    low into the upper half, change in the state of delivery to confirm the low, then trade
    higher. If instead price closes through 0.5 of the wick, the swing is expected to fail
    and the extreme to be taken out.

    '
  - 'Applied live as the level a continuation must hold. After price tags a fair value gap
    and reacts, he says you want to see it respect 50% of that wick, and quickly - the next
    candle should form its low in the upper half of the wick, then close over and continue.
    He uses the same construction when refining an entry down through timeframes (take the
    lower-timeframe swing that the 15-minute gap sits on and use 0.5 of it as the level price
    should not trade below) and again when marking a level around a small lower-timeframe
    protected swing, using around half of it.

    '
  - 'When a candle forms a wick large enough that mechanical expansion is doubtful, the midpoint
    (equilibrium) of that wick becomes the level the subsequent move must respect. Price trading
    back beyond 50% of the wick means the candle is behaving as a reversal candle rather than
    a continuation candle. The same midpoint test is applied to a change-in-state-of-delivery
    leg: the stop should not sit beyond 50% of that leg.

    '
  - 'Where a higher timeframe candle closes leaving a significant wick, the midpoint of that
    wick is the level that decides whether the read survives. In a continuing move price may
    reach into 0.5 of the wick and trade away from it; price closing beyond 0.5 of the wick
    means the candle is no longer supporting that direction. The same 50% logic is applied
    to the opposing candle''s range for positional entries.

    '
  - 'GxTradez''s mechanical substitute for eyeballing wick size. After a candle 2 closure
    (candle 2 closes back inside candle 1''s range), mark equilibrium — 0.5 — of the previous
    candle''s range and require the upper half of that range to support price and to contain
    the LOW of candle 3. He states the purpose explicitly: it is a mechanical way to measure
    wick size, because expansion candles have small wicks and reversal candles have large
    ones. The same test is then reapplied to candle 3''s range for candle 4.'
  - 'Used twice in the top-down video, and both uses are the large-wick half rather than the
    expansion-candle half. On the daily, where a swing low has already been swept and is therefore
    high resistance liquidity, he marks 0.5 of that wick and treats it as the support area.
    On the hourly confirming chart he restates it as a condition: 0.5 of that wick must be
    respected to trade higher. This corroborates the live-stream EQ rule''s large-wick branch
    (50% of the wick); the expansion-candle branch (50% high-to-low) is not mentioned anywhere
    in this unit.'
  - SHORTS EVIDENCE corroborating the corpus's load-bearing half-level. Given a candle 2 closure,
    the 0.5 level of that candle's WICK (not of its whole range) is marked out, and that is
    the zone price is expected to reach back up into before the reversal continues. The entry
    inside it is an intra-candle change in the state of delivery.
definition: 'A wick is read as a lower-timeframe reversal: during that period price made an
  aggressive move and came back. The level marked is 0.5 of the wick, measured FROM THE BODY
  TO THE LOW (bullish) or FROM THE BODY TO THE HIGH (bearish) - i.e. the midpoint of the wick
  itself, not of the candle. The test: in a bullish read the upper half of the wick must support
  price higher; in a bearish read the lower half of the wick must support price lower. If
  that half is not respected - price closes through 0.5 of the wick - the candle is unlikely
  to be an expansion candle in that direction and price is instead more likely to run the
  opposite extreme.'
category: structure
status: contested
