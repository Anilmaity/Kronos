preconditions:
- A short-term high or low (structure) exists and has just been traded through.
- A reference level, range boundary, or PD array.
- 'A reference structural level: a prior swing high, swing low, or range boundary.'
- A level or swing has just been taken.
- A swing high or low has been traded through.
detection_rules:
- 'Candle-shape test: the breaking candle(s) are large and close AT or very near their own
  high (bullish) or low (bearish) - i.e. no meaningful wick on the close side.'
- 'Location test: the move must occur OVER a structural level; a large candle inside the range
  is not called displacement here.'
- 'Comparative test (the only procedure given anywhere in the corpus): fix a candle window
  - he uses four candles from the break - and compute (i) the range of that window and (ii)
  the distance price travelled beyond the broken short-term high.'
- Compare those two quantities against a prior break of the same kind that he labels NOT energetic;
  the displacement case has the larger range AND the greater distance in the same number of
  candles.
- 'FVG test (stated as a requirement in PePk1V0Q4QQ): a fair value gap must be created by
  the move; a break with no fair value gap is explicitly rejected as not displacement (FdRKBTz0Fps).'
- 'Consequence, stated in the same breath: once displacement is confirmed, mark the displacement
  range and buy only in its discount / sell only in its premium.'
- 'Proxy from this unit (a): the move is one-sided with only shallow counter-moves - the expansion
  signature.'
- 'Proxy (b): the move''s range is large relative to the immediately preceding leg (large
  range vs small range).'
- 'Proxy (c): the candle has a small wick and a large body.'
- 'Proxy (d): the move leaves a fair value gap (''you can say that we expand when we create
  fair value gaps'').'
- 'Decision use: expansion back INTO the range = reversal; slow shallow move back = retracement;
  sideways = consolidation.'
- 'No quantitative rule is given by the source. The proxies actually used on the charts are:
  (a) a candle CLOSING beyond the reference level or back inside the range, rather than merely
  wicking through it; (b) the move leaving a fair value gap behind it; (c) visibly larger
  candle bodies than the preceding price action.'
- Proxy (a) is the most consistently applied in the daily bias video, where 'reach but close
  back inside' and 'close outside the range' are the two branches of every decision.
- 'Proxy (b) is explicitly endorsed for breakers: displacement is evidenced by the fair value
  gap that forms (the unicorn model).'
- 'Speaker-stated proxy (market structure video): displacement over a level = a CLOSE over
  the previous high; displacement under a level = a CLOSE below the previous low. He uses
  this phrasing every time he adjudicates a structure break.'
- 'Corroborating proxy (top-down video): the displacing leg leaves a fair value gap behind
  it - he narrates ''we get a nice displacement now we have a fair value Gap'' in that order.'
- 'Lack of displacement is itself a signal in both directions: failing to displace lower after
  a lower low is the precondition for a bullish structure shift, and structure advancing with
  no displacement is labelled consolidation.'
- The read is explicitly built on the pairing of swing points with the displacement (or lack
  of it) around them - that is his summary of the whole market structure lesson.
- One or more consecutive full-bodied candles in the same direction.
- The move closes over/below the structural level in question.
- A fair value gap is present inside the move (his stated identification shortcut).
- 'TERMINOLOGY FINDING: ''aggressive move'' and ''displacement'' are used interchangeably
  in this video (''an aggressive move or displacement above'').'
- '''Aggressive'' is applied to sell-offs and breakouts as an intensifier, never given its
  own test.'
- 'Practical proxy used on the charts here: price closes decisively beyond a marked opening
  price rather than wicking through it.'
- Failure to displace back over the level after trading beyond it is read as continuation
  in the direction of travel.
- Require the move through the swing to leave a fair value gap. No fair value gap, no displacement.
- A small wick beyond the swing followed by an aggressive move back in the opposite direction
  is classified as a liquidity grab, not a structure break.
- 'TTrades'' directional reading: scan the legs in the candidate direction; if none of them
  contain fair value gaps, the direction has no aggression behind it and is not traded.'
- '$niper''s corollary: without a fair value gap there is no array to retrace into, so there
  is no entry even if the break is accepted.'
invalidation:
- Price trades through the level and closes back inside - see failure-to-displace.
- The break leaves no fair value gap and covers no more distance than a prior non-energetic
  break.
- n/a
- Not applicable - this is a primitive, not a setup.
- Price extends past the level but closes back inside — a failure to displace.
- Price failing to close beyond the level - no displacement, and the prior direction is expected
  to continue.
- The move back through the level is itself aggressive and leaves a gap in the opposing direction.
measurable:
- range of the 4-candle window after a structure break, normalised by the preceding 4-candle
  range
- distance beyond the broken swing at N=4 candles, displacing vs non-displacing breaks
- hit rate of the FVG-required filter versus the close-beyond-level filter
- agreement rate between proxies (a)-(d) on the same bars
- sensitivity of the reversal/retracement classifier to the chosen displacement threshold
- 'candidate formalisations to test against the annotated examples: body size > k * ATR(n);
  presence of an FVG in the impulse; close beyond the level; range of the impulse leg vs the
  prior N-bar average'
- sensitivity of every downstream pattern's hit rate to the chosen displacement threshold
- sensitivity of every downstream detector (structure shift, order block, CISD) to close-beyond-level
  vs an ATR-magnitude definition of displacement
- how often a close beyond the pivot is followed by the confirming opposite-side swing, split
  by candle size
- share of closes-beyond-level that also leave a fair value gap
- proportion of structure breaks that carry an FVG inside the breaking leg
- distribution of candle range on moves the speaker labels aggressive versus the day's average
  candle range
- whether an 'aggressive' label ever attaches to a move that does not close beyond the reference
  level
- outcome of breaks that left a fair value gap versus breaks that did not
- frequency of small-wick breaks that reverse (liquidity grabs) versus continue
