id: displacement
name: Displacement
definition: 'EARLIEST RECORDINGS IN THE CORPUS, and the only place the channel supplies a
  MEASUREMENT PROCEDURE rather than an adjective. Two complementary statements. (a) The candle-shape
  reading: displacement is large aggressive candles whose closes are AT the high (bullish)
  or AT the low (bearish) of the candle, and it only counts when it happens OVER a structural
  level. (b) The comparative reading: after a short-term high is broken, take a FIXED NUMBER
  of candles (four in his worked example) and compare two quantities against a non-displacing
  instance of the same event - the RANGE of that fixed window, and the DISTANCE travelled
  beyond the short-term high. Displacement is the case with the larger range and the greater
  distance covered in the same amount of time. A third, weaker reading also appears here and
  is stated as a requirement rather than as a detection aid: for displacement to occur a fair
  value gap must be created.'
variants:
  definition:
  - 'FINDING FROM THE PRIMARY TEACHING UNIT: across these twenty videos the word ''displacement''
    is largely REPLACED by ''expansion'', and the qualitative test given for expansion is
    the closest thing to a displacement definition the channel offers - a one-sided trending
    move with only shallow moves against it, a large range against a small range, a candle
    with a small wick and a large body. Where ''displace'' is used it is used as a synonym
    for that (''is it displacing back into the range?'' is the test for reversal vs retracement).
    Still no numeric threshold anywhere: no ATR multiple, no body ratio, no bar count.'
  - 'The single most used and least defined term in this unit. Displacement is an energetic
    directional move that establishes intent — through a level, out of a range, or away from
    a PD array. It is required (in words) by nearly every entry pattern here: order blocks
    need displacement together with a close through the opening price; breakers need displacement
    paired with them, ideally leaving a fair value gap; manipulation is confirmed by an aggressive
    move back into the range; bias flips on a failure to displace. No video in this unit gives
    a numeric test.

    '
  - 'The market structure lesson is the densest use of this term anywhere in the corpus, and
    it is the first place the speaker himself supplies an operational test rather than leaving
    it to the viewer. Every time he resolves ''did we displace?'' on the chart he resolves
    it as a CLOSE beyond the reference structural level: ''now we get some displacement a
    close over this previous high'', ''once we displace and close below this low''. He also
    uses its absence as a classifier - a higher high with no displacement around it is consolidation,
    not trend - and in the top-down video he corroborates the second-best proxy by pointing
    at a fair value gap left behind by the move. There is still no magnitude threshold, so
    the concept remains underspecified, but the close-beyond-the-level proxy is now stated
    by the speaker rather than inferred by the reader.'
  - An aggressive move made of full-bodied candles — one candle or several — that closes over
    or below structure. The stated way to spot it is to look for the fair value gap it leaves
    behind; on a higher timeframe the same move resolves into a single candle.
  - 'EARLIER RECORDING evidence on the word itself rather than on a threshold. In this video
    ''aggressive move'' and ''displacement'' are used as a single term - ''an aggressive move
    or displacement above'' - and ''aggressive'' is thereafter used as the intensifier attached
    to displacement, sell-offs and directional moves. That is the closest the corpus comes
    to defining ''aggressive'': it is not a separate concept with its own test, it is the
    qualitative label for a displacing move. No numeric threshold is given here either.'
  - 'The test both speakers apply, in consecutive turns, to decide whether a break of a swing
    is real. A break must be an aggressive move that leaves a fair value gap. A small wick
    through a low followed by an aggressive move back up is not a break at all - it is a liquidity
    grab that continues the prior direction. The corollary TTrades states in his own words
    is diagnostic rather than merely definitional: if the up-moves on the chart contain no
    fair value gaps, there is no aggression and therefore no reason to be bullish.

    '
category: structure
status: contested
aliases:
