ambiguities:
- The four-candle window is the number used in his single worked comparison; he never states
  it as a parameter, so whether the window is fixed at 4 or is just 'the same amount of time'
  is not decidable from the transcript.
- The comparison is RELATIVE - it needs a reference instance of a non-displacing break on
  the same chart. No absolute threshold (ATR multiple, body ratio, point value) is ever given.
- '''Closes in the high or the low'' is the nearest thing to a wick-size rule in this unit,
  but no ratio of wick to body or wick to range is stated.'
- 'EVOLUTION vs the Updated playlist: here the fair value gap is a REQUIREMENT for displacement
  (''for displacement to occur you want to see a fair value gap created''). In the later canon
  (_94CPMjWi9E, education_ict_updated_01) the gap is downgraded to a detection aid - ''the
  easiest way to spot it is just looking for fair value gaps''. These are the earlier recordings.'
- Whether the FVG must be left by the breaking candle itself or anywhere in the leg is not
  stated.
- 'The single most important gap in the corpus survives the primary teaching unit: four dedicated
  phase lessons and a dedicated wick lesson give NO numeric threshold for expansion / displacement
  / small wick.'
- The FVG proxy ('we expand when we create fair value gaps') is stated once, in passing, and
  is the only proxy that is fully mechanical - it should be tested first.
- '''Displacement'' and ''expansion'' are used interchangeably here, which conflicts with
  units where displacement is a property of a single impulse and expansion is a phase.'
- Never quantified anywhere in the available transcripts — no ATR multiple, body ratio, bar
  count, or gap requirement.
- Used interchangeably with 'aggressive move', 'expansion' and 'close outside the range',
  which are not obviously the same test.
- Because displacement gates order block validation, breaker quality, manipulation confirmation
  and bias flips, ANY automation of this corpus must fix this definition first; it is the
  highest-leverage open question in the unit.
- 'Still no magnitude: no ATR multiple, body ratio, or minimum range is ever given, so ''a
  close over the previous high'' by one tick qualifies under his own stated test.'
- The close-beyond-level proxy only applies where a reference level exists; the 'aggressive
  move' sense used for manipulation in other units has no such anchor and is not covered by
  it.
- Whether the close must be the candle body beyond the level, or the candle merely closing
  on the far side, is not distinguished (they are the same thing for a close, but he also
  says 'break of this low' interchangeably).
- '''Displacement out of this range'' and ''displacement around them'' are used loosely for
  legs, not for single candles.'
- 'This remains the single highest-leverage open definition in the corpus: it gates market
  structure shift, order block validation and consolidation classification simultaneously.'
- '''Full-bodied'' and ''aggressive'' carry no threshold; the FVG heuristic is offered as
  a proxy but not as the definition.'
- Whether an FVG is required or merely usually present is not stated.
- No threshold, ATR multiple, body ratio or bar count is given - identical to the rest of
  the corpus.
- Whether 'aggressive' adds anything to 'displacement' (a strength grade) or is purely synonymous
  is not resolvable from this video; the phrasing 'aggressive move or displacement' reads
  as apposition.
- The auto-captioner renders 'highs' as 'hives' in the quoted line.
- This is an earlier recording; the later material largely replaces 'displacement' with 'expansion'.
- '''Aggressive'' is never given a size, body-ratio or candle-count threshold - the fair-value-gap
  test is the only mechanical part.'
- '''A small Wick breaks the load'' (the audience question, garbled by the captioner from
  ''a small wick breaks the low'') has no size threshold either.'
- The transcript carries no speaker labels, so the exact turn boundary in this exchange is
  inferred; both speakers state the fair-value-gap requirement in adjacent turns and agree.
- How many candles a fair value gap may take to form for the break to still count is not stated.
