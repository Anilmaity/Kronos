  quote: so it is a volume imbalance and not a gap
ambiguities:
- '''Complete absence of trading'' is stated in words but the price test (high[i] < low[i+1]
  for an up gap) is never written out.'
- No minimum size, so on a tick-dense instrument nearly every candle boundary produces a volume
  imbalance.
- Whether the zone is close-to-open or open-to-close when the two candles are opposite-coloured
  is not addressed.
- No invalidation, expiry or consequent-encroachment analogue is given for a volume imbalance.
- No ranking rule for what to do when a volume imbalance and a fair value gap sit at the same
  price.
