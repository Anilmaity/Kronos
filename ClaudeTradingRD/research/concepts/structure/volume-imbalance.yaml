id: volume-imbalance
name: Volume Imbalance (and how it differs from a Gap)
definition: Two two-candle objects, defined by contrast with each other and with the three-candle
  fair value gap. A volume imbalance is a gap between the closing price of one candle and
  the opening price of the next where price nonetheless traded through the area - the two
  candles' high/low ranges overlap. A gap is the same construction with a complete absence
  of trading between the two candles. He shows price returning to a volume imbalance and reacting
  from it, so it is treated as a reactive level rather than a curiosity.
category: structure
status: specified
aliases:
- volume imbalance
- gap
preconditions:
- Two consecutive candles on the working timeframe.
detection_rules:
- 'volume_imbalance between candle i and candle i+1: close[i] != open[i+1], AND the two candles''
  high/low ranges overlap (price traded through the area).'
- 'gap between candle i and candle i+1: a complete absence of trading between them - no overlap
  between the two candles'' ranges.'
- 'The distinguishing test is stated in exactly those terms: a gap has a complete absence
  of trading, a volume imbalance had trading or overlap between the high and the low.'
- Both are two-candle objects; a fair value gap is a three-candle object - this is the whole
  point of the closing section.
- The zone is the span between that closing price and that opening price.
invalidation:
- Not stated. No fill, expiry or violation rule is given for either object.
measurable:
- fill rate of volume imbalances by timeframe
- reaction rate on first return, compared against fair value gaps at the same distance
- frequency of true gaps (no overlap) by instrument and session
sources:
- video_id: ZVUDpCyvxfQ
