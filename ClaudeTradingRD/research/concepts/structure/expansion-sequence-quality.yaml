id: expansion-sequence-quality
name: Expansion Sequence Quality (expansion met with expansion)
definition: 'Two Shorts use expansion-met-with-expansion as a standing classifier and, importantly,
  as an INVALIDATOR of a continuation idea. After a directional expansion, the only two continuation-compatible
  follow-ups are a consolidation (which then runs the low and trades higher, or breaks out)
  or a retracement. If instead the next structure is a second expansion in the opposing direction,
  the read flips to reversal and the extreme is expected to be taken out. The same Short stacks
  it as one of three concurrent reversal signals alongside the daily candle closure and the
  change in the state of delivery. A related Short shows the two-candle read used to classify
  the follow-up before committing.

  '
variants:
  definition:
  - 'A healthy directional sequence alternates: expansion, then retracement or consolidation,
    then expansion. When expansion is immediately met with expansion and then expansion again,
    with no interleaved retracement, the sequence is degenerating into consolidation and the
    setup quality drops sharply. This is used as a live filter to downgrade an otherwise mechanically
    valid continuation.

    '
category: structure
status: contested
aliases:
- expansion met with expansion
- phases of price sequence
preconditions:
- At least one expansion leg has printed.
detection_rules:
- After an expansion leg, classify the next structure as consolidation, retracement, or opposing
  expansion.
- Consolidation or retracement -> continuation remains valid.
- Expansion met with expansion -> reversal; anticipate the extreme behind the move to be taken
  out.
- Let two candles print before classifying the follow-up.
- Where the daily closure, the change in the state of delivery, and expansion-met-with-expansion
  all read reversal, treat the reversal as confirmed.
- Classify each successive leg as expansion, retracement or consolidation.
- Three consecutive expansions with no interleaved retracement or consolidation flags a degraded
  sequence.
- A retracement that does not look like one on the trading timeframe may resolve into a clean
  expansion-retracement-expansion sequence one timeframe lower (he drops to 15-second to show
  this).
invalidation:
- A second opposing expansion appears where a consolidation or retracement was required.
- A clean retracement or consolidation appears and the alternation is restored.
measurable:
- frequency of each of the three follow-up classes after an expansion leg
- hit rate of the extreme being taken out after expansion met with expansion
- Expectancy by count of consecutive expansion legs preceding entry.
