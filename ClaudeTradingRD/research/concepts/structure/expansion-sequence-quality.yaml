ambiguities:
- '''Two candles'' is the stated observation window in one example only; no general rule is
  given.'
- No size test separates a second expansion from a deep retracement.
- The three stacked reversal signals are described as agreeing, but no rule is given for when
  they disagree.
- '''Expansion'' vs ''retracement'' vs ''consolidation'' are classified by eye; no range or
  duration thresholds are given.'
- Dropping a timeframe to reclassify a leg makes the rule timeframe-dependent with no stated
  stopping point.
