ambiguities:
- Which 'close' (session or daily) is meant is not stated.
- Strongest/weakest here is judged by expansion beyond the previous day low; the labels then
  flip within the same session (see relative-strength-weakness).
- '''Sometimes'' - no rule says when this substitution applies.'
- Which correlated instrument supplies the transferred target is chosen by eye from the strength
  ranking; no rule is given when two lag.
- Whether the exit is on the tag or on a reaction at that level is not stated.
- The technique is demonstrated on index futures only; nothing is said about metals or FX.
