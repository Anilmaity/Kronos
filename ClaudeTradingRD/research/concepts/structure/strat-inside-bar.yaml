id: strat-inside-bar
name: Inside Bar Is A Consolidation (TheSTRAT)
definition: 'TTrades'' own use, without STRAT vocabulary: with the monthly printing inside
  bar after inside bar, he reads the market as consolidation and favours reversion back into
  the range over breakouts.'
variants:
  definition:
  - In TheSTRAT vocabulary as this guest uses it, an inside bar is a candle whose high and
    low both sit inside the previous candle's high and low, and it is by definition a consolidation
    - 'it's inside of that previous time frame's highs and lows, which is the definition of
    a consolidation'. An inside bar is read as doing nothing, and he refuses to short against
    a month that is an inside bar of the prior month. The trigger that ends the consolidation
    is a break of the inside bar's extreme, which puts the preceding candles' extremes in
    play as sequential targets. He also uses composite descriptions - an inside bar that closes
    as a shooter (shooting star) on the quarterly is named as a bearish continuation signature,
    conditional on the prior low not being taken.
category: structure
status: contested
aliases:
- inside bar
- inside day
preconditions:
- Two consecutive candles on the analysis timeframe.
detection_rules:
- If the current monthly candle (and the prior) are inside bars, classify as consolidation.
- Favour trades back into the range over breakout trades.
- inside_bar := candle.high <= prev.high AND candle.low >= prev.low.
- Classify an inside bar as a consolidation; do not take a directional position against the
  candle it is inside of.
- A break of the inside bar's high or low ends the consolidation and puts prior candles' extremes
  in play.
- The construction is applied on every timeframe up to the quarterly and yearly.
invalidation:
- The bar's range exceeds the previous candle's range on either side - it is no longer inside.
measurable:
- directional follow-through rate after an inside-bar breakout, by timeframe
- share of inside bars that resolve as outside bars instead
sources:
- video_id: GRc5FVB5tdg
  title: New York Open Live Q&A
  quote: Like we're just inside bar inside bar. So, it's more consolidation.
- video_id: GRc5FVB5tdg
  title: New York Open Live Q&A
  quote: So, I favor a reversion back into the range um over breakouts.
- video_id: V8P6lNIisvc
