  quote: it's inside of that previous time frame's highs and lows
ambiguities:
- Stated for the monthly only; whether it applies to lower timeframes in his usage is not
  said.
- Whether the containment test uses wicks or bodies is never stated.
- '''Shooter'' and ''hammer'' are used as classifications without definition anywhere in this
  unit.'
- The STRAT numeric candle labels (1 / 2 / 3) are never explained on air, so the inside bar
  is only identifiable descriptively.
