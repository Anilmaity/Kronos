ambiguities:
- '''Green'' is read off his own indicator; the underlying colouring rule is not restated
  in these streams beyond the wick geometry.'
- Whether the weekly or monthly must also align is not addressed - he says a day trader does
  not need the monthly.
- The exact 4-hour candle boundaries beyond the 10:00 a.m. one are not enumerated here.
- Alignment is asserted after the fact in every example; no pre-trade test is given for whether
  the lowest timeframe is aligned beyond its CISD having occurred.
- '''Directionally agreeing'' is not reduced to a per-timeframe rule here (elsewhere in the
  corpus it is wick geometry supporting expansion).'
- He defers the detail to a separate 'time frame alignment video' which is not in this unit.
