id: timeframe-alignment
name: Timeframe Alignment (all timeframes green)
definition: 'True expansion occurs only when the stacked higher timeframe candles all support
  the same direction at the same time - daily, 4-hour and hourly together. He runs the timeframes
  side by side on one screen for exactly this check. If one of them does not support expansion
  (typically the 4-hour, via its wick), the trade is still possible but is being taken against
  that candle and is materially harder and less clean; the mechanical expectation becomes
  a trade back to the non-supporting candle''s open.

  '
variants:
  definition:
  - 'In this unit alignment is not a filter applied to a trade - it is offered as the definition
    of expansion itself. He asks and answers the question directly: expansion occurs when
    you align all the timeframes together. The silver example is the worked case, where the
    entry is taken at the moment the 15-minute turns bearish while the 4-hour and the weekly
    are already bearish, and he replays the same moment on the USDJPY chart: the expansion
    arrives at the closure through the down-close candles, because that closure is what makes
    the lowest timeframe agree with the two above it.'
category: structure
status: contested
aliases:
- all timeframes green
- aligning higher timeframe candles
- expansion alignment
- aligning my lower time frames with my higher time frames
- align all the time frames together
preconditions:
- Daily, 4-hour and hourly charts all visible and assessed for the same direction.
- A bias timeframe, a structure timeframe and an entry timeframe are all being read.
detection_rules:
- Assess each of daily, 4-hour and hourly for whether its wick geometry supports expansion
  in the intended direction.
- All three supporting = aligned; take the setup.
- Any one not supporting = wait, typically for the next higher timeframe candle open (10:00
  a.m. brings a fresh 4-hour candle).
- For a pre-open positional entry, alignment across all timeframes is required, not optional.
- Alignment = every timeframe in the stack directionally agreeing at the same moment; that
  state is what he calls expansion.
- 'Worked instance: weekly bearish AND 4-hour bearish AND 15-minute bearish simultaneously.'
- The moment of alignment is the lowest-timeframe closure through the opposing series of candles
  - before that closure the stack is not yet aligned.
- If the higher-timeframe analysis is missing you will be looking in the wrong direction and
  get caught offside; he calls this one of the most important concepts in trading.
invalidation:
- A higher timeframe candle in the stack closing against the direction.
- Any timeframe in the stack is directionally opposed - wait rather than trade.
measurable:
- outcome of setups taken with full alignment vs setups taken against one timeframe
- frequency of full three-timeframe alignment per week
- size of the move following full-stack alignment vs partial alignment
- elapsed time between the highest-timeframe signal and the lowest-timeframe closure that
  completes the alignment
