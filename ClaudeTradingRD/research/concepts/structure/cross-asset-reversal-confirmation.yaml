ambiguities:
- '''Very shallow wick'' is not quantified.'
- No time limit is given for the tell to react.
- '''Another sweep'' vs ''all the way to the low'' is shown on the chart with no distance
  threshold.'
- No time limit for the weakest asset to reverse is given beyond waiting for the 10:00 re-evaluation.
- Reverses is defined only by V-shape displacement and closure back into the range, with no
  candle count.
- How long to wait for the paired reversal is given only as the next couple of candles in
  one instance.
- Which level the 5-minute closure must pass (opening price of the down-close series, or a
  swing) is not stated explicitly; 'closure through' is used.
- Only one live instance; the strength ranking itself switched twice in the first 15 minutes.
- '''Forms a reversal'' is not given a bar-level test here; in practice he reads it from the
  lower-timeframe structure and an SMT.'
- No maximum lag is stated between the strong-asset reversal and the weak-asset entry.
- Which of two qualifying weak assets to take is decided by 'cleaner range', which is not
  defined.
- How long to wait for the confirming reversal is not stated; in practice he waits until the
  next 4-hour candle open and then re-reads.
- Strength can switch mid-session (it does so several times on air), which changes which asset
  must reverse - he gives no rule for re-anchoring after a switch.
- He adds that if the weak asset's continuation is 'too far away' he avoids it; distance is
  not quantified.
- '''Far below the low'' (the point at which the failure to react is declared) is not quantified.'
- '''Gap'' is an hourly gap he later says could be refined to a 30-minute gap; no rule chooses
  between them.'
- He says he would trade the reversal on NQ or ES interchangeably ('It doesn't really matter
  to me'), so the traded asset is not fixed by this rule.
