id: cross-asset-reversal-confirmation
name: The Strongest Asset Must Reverse for the Weakest to Expand
definition: 'A short idea in the weakest correlated asset is only actionable if the strongest
  correlated asset reverses at its own level at the same time. If the strongest asset keeps
  pushing higher, the weakest asset is unlikely to expand lower and the idea should be treated
  as wrong. The mirror case holds too: the weakest asset must sweep its low and reverse before
  the strongest can be framed higher.

  '
variants:
  definition:
  - 'The sequencing rule that pairs with the strength ranking: a move down in the weak asset
    is only trusted once the strong asset has itself reversed. He states it as a pre-open
    plan in one stream — if NQ (the strongest) forms a reversal at its objective, the trade
    is then in ES or YM, the weaker ones — and as a critique of a viewer''s short in another:
    the entry was acceptable but he would still want to see the strongest asset show a reversal
    first. The practical consequence is that the strongest asset''s reaction at its target
    is the trigger to look at the weaker asset, not the strongest asset itself.

    '
  - 'The sequencing rule he uses to decide when a correlated-asset trade is live, stated in
    both directions in the same unit. To trade the weakest asset lower, the strongest must
    first reverse off its level; if the strongest asset cannot reverse, the weakest will not
    get its continuation. Mirrored: to trade the strongest asset higher, wait for the weakest
    to form a reversal first. His justification is that correlated assets go in the same direction,
    so when one is diverging, one of them is lying - the question of the day is which. He
    runs both streams'' framing off it, and on the day the strongest never swept anything
    at the open he simply refuses to frame the reversal and waits for the 10:00 candle.

    '
category: structure
status: contested
aliases:
- pair the reversal
- confirm with the other index
- wait for the strongest to reverse
- wait for the weakest asset to reverse
- who is lying
preconditions:
- A weakest/strongest asset pair has been identified.
- The strongest asset is trading at a relevant level such as a session high or previous day
  high.
- Correlated assets ranked strongest / middle / weakest.
- The strongest asset is at or approaching its own objective.
- Two or more correlated assets, with the strongest and weakest identified.
- The strongest (or weakest) is at a level from which a reversal could form.
detection_rules:
- 'For a short on the weakest asset: require the strongest asset to reverse off its high and
  trade back into its range.'
- 'For a long on the strongest asset: require the weakest asset to sweep a low and form a
  reversal there.'
- Absence of the paired reversal within the next few candles means the idea is not confirmed.
- Watch the strongest asset into its objective.
- If the strongest asset forms a reversal there, switch attention to a weaker asset for the
  short.
- If the strongest asset shows no reversal at the objective, do not take the counter-trend
  trade in the weaker asset.
- Prefer the weaker asset with the cleaner range when more than one qualifies.
- To trade the weakest asset lower, require the strongest to reverse off its level first.
- To trade the strongest asset higher, require the weakest to form a reversal first.
- A reversal in the required asset needs a sweep - if it never swept anything, no reversal
  can be framed there.
- If the required reversal does not appear, do not trade; wait for the next higher-timeframe
  candle open.
- If the required asset instead continues through its level, expect the others to follow it
  rather than diverge.
invalidation:
- The strongest asset continues to make new highs while the weakest fails to displace lower.
- The strongest asset continues through its objective without reversing — the premise for
  the weak-asset trade is gone.
- The asset that was supposed to reverse trades through its level instead.
measurable:
- hit rate of weakest-asset shorts with and without a simultaneous strongest-asset reversal
- outcome of weak-asset shorts with versus without a prior strong-asset reversal
- lag in bars between the strong-asset reversal and the weak-asset move
- conditional probability of the weakest asset's continuation given the strongest reversed
- false-signal rate when the required reversal is absent
