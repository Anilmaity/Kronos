id: cross-asset-reversal-confirmation
name: The Strongest Asset Must Reverse for the Weakest to Expand
variants:
  name:
  - Cross-Asset Reversal Confirmation
  definition:
  - 'Stated as the stream''s first ''lesson of the day'' in both directions: if bullish, use
    the weakest asset reversing to frame longs on the strongest; if bearish, use the strongest
    asset reversing to frame shorts on the weakest. Live, with NQ strongest and YM weakest,
    the NQ long to the overnight highs needed YM to reverse after running its lows; YM kept
    going lower, the two assets did not align, price consolidated and the idea was abandoned.
    He adds a preference about HOW the weakest should reverse: ideally with another sweep
    of its low (catching late shorts and early longs and printing a fresh SMT), but not a
    run all the way down to the deeper low, which costs too much time and range.'
  - 'A short idea in the weakest correlated asset is only actionable if the strongest correlated
    asset reverses at its own level at the same time. If the strongest asset keeps pushing
    higher, the weakest asset is unlikely to expand lower and the idea should be treated as
    wrong. The mirror case holds too: the weakest asset must sweep its low and reverse before
    the strongest can be framed higher.

    '
  - 'Worked live on NQ/ES/YM at the 9:30 open. NQ was strongest, YM weakest, ES choppy. Rather
    than trade the strongest into its equal highs directly, he waited for the weakest asset
    (YM) to form a reversal off its low, stating the confirmation as a 5-minute closure over;
    once YM closed through, NQ ran out the equal highs and the previous highs. He restates
    the logic for chat: when the weakest of correlated markets reverses, that is usually when
    the strongest starts to trend, because they then all align. Later in the session the mirror
    continuation case is shown: YM fails to manipulate (does not reverse off) its previous
    low and continues through the 9:30 lows, and ES/NQ follow it lower.'
  - 'Restated pre-open as a question to chat: for indices to go higher he wants the weakest
    asset (YM) to reverse off its low and frame the move; for lower, the strongest (NQ) reversing
    off its high. When YM took its low while NQ took its high he framed the day as deciding
    ''which one''s lying''. Around 10:00 YM reversed (''that first option''), so he turned
    bullish for the rest of the day without trading it.'
  - 'The sequencing rule that pairs with the strength ranking: a move down in the weak asset
    is only trusted once the strong asset has itself reversed. He states it as a pre-open
    plan in one stream — if NQ (the strongest) forms a reversal at its objective, the trade
    is then in ES or YM, the weaker ones — and as a critique of a viewer''s short in another:
    the entry was acceptable but he would still want to see the strongest asset show a reversal
    first. The practical consequence is that the strongest asset''s reaction at its target
    is the trigger to look at the weaker asset, not the strongest asset itself.

    '
  - 'The sequencing rule he uses to decide when a correlated-asset trade is live, stated in
    both directions in the same unit. To trade the weakest asset lower, the strongest must
    first reverse off its level; if the strongest asset cannot reverse, the weakest will not
    get its continuation. Mirrored: to trade the strongest asset higher, wait for the weakest
    to form a reversal first. His justification is that correlated assets go in the same direction,
    so when one is diverging, one of them is lying - the question of the day is which. He
    runs both streams'' framing off it, and on the day the strongest never swept anything
    at the open he simply refuses to frame the reversal and waits for the 10:00 candle.

    '
  - Live worked example of the rule refusing a trade. With NQ the strongest index and ES/YM
    weaker, a short in ES needed the strongest asset (NQ) to sweep and reverse off its own
    high first, giving SMT; only then would he frame ES lower. NQ only printed failure swings
    below that high, so he declined every short in the session even though price later fell.
  - 'Live restatement on a no-bias pre-FOMC day: with NQ strongest and YM weakest, the bullish
    idea on the strong asset needs the WEAKEST asset (YM) to reverse at its low. The question
    is framed as which asset is lying - YM reverses and the holding assets are right, or YM
    keeps going and drags the rest lower.'
  - 'Live NY-open application (long side): on a bullish reversal day he requires the WEAKEST
    index (NQ that day) to trade into the hourly gap / below the reference low first and form
    a reversal there; the stronger assets (YM strongest, ES middle) are then expected to continue
    higher, producing an SMT off that gap. Because no asset had reached the gap at the open,
    he refused to frame an intraday long until it did.'
definition: 'He picks the tell among the correlated indices by proximity: the asset closest
  to the relevant level (here YM at a previous low) is watched first, and its reaction there
  decides the others. A very shallow wick and reversal at that level means the other assets
  will probably reverse too (possibly with SMT) and continue the other way; trading right
  through the level with no reaction means continuation for the group. Live, for a bullish
  NQ idea he required the weakest asset (YM) to sweep its low and reverse; when YM swept but
  then failed to react he declared the day chop and took nothing.'
category: structure
status: contested
aliases:
- pair the reversal
- confirm with the other index
- weakest asset forming a reversal
- wait for the strongest to reverse
- wait for the weakest asset to reverse
- who is lying
preconditions:
- Correlated indices ranked strongest / middle / weakest at the open.
- A directional idea on the strongest (long) or weakest (short) asset.
- A weakest/strongest asset pair has been identified.
- The strongest asset is trading at a relevant level such as a session high or previous day
  high.
- Correlated assets ranked strongest / weakest on the session.
- The weakest asset is at a low (for a long on the strongest).
- Correlated assets ranked strongest / middle / weakest.
- The strongest asset is at or approaching its own objective.
- Two or more correlated assets, with the strongest and weakest identified.
- The strongest (or weakest) is at a level from which a reversal could form.
- Daily reversal context (target hit, daily profile open-low-first).
- Assets ranked strongest / middle / weakest on the hourly.
detection_rules:
- Among the correlated indices, identify which is closest to the relevant level; that asset
  is the tell.
- If the tell prints a shallow wick and reverses at the level, frame reversals (SMT) in the
  others.
- If the tell trades through the level with no reaction, frame continuation in the others.
- For a long in the strongest asset, require the weakest to sweep its low and reverse; if
  it neither reverses nor runs the low, stand aside.
- 'Bullish idea: watch the weakest asset at its low; require it to reverse before framing
  the long on the strongest.'
- 'Preferred form: the weakest makes one more sweep of its low and then reverses (a fresh
  SMT).'
- 'Disfavoured form: the weakest runs all the way to a deeper / distant low - too much time
  and range for a pre-10:00 continuation.'
- 'Bearish idea: mirror - require the strongest asset to reverse before shorting the weakest.'
- If the weakest keeps continuing against the idea while the strongest stalls, expect consolidation
  and drop the idea.
- 'For a short on the weakest asset: require the strongest asset to reverse off its high and
  trade back into its range.'
- 'For a long on the strongest asset: require the weakest asset to sweep a low and form a
  reversal there.'
- Absence of the paired reversal within the next few candles means the idea is not confirmed.
- 'For a long on the strongest asset: wait for the weakest asset to form a reversal off its
  low.'
- Confirmation of that reversal in the worked case = a 5-minute candle closing over (through
  the opposing series) on the weakest asset.
- After the confirmation, target the strongest asset's equal highs / previous highs.
- 'Continuation mirror: if the weakest asset fails to reverse at its low and continues through
  it, expect the other assets to follow lower.'
- Watch the strongest asset into its objective.
- If the strongest asset forms a reversal there, switch attention to a weaker asset for the
  short.
- If the strongest asset shows no reversal at the objective, do not take the counter-trend
  trade in the weaker asset.
- Prefer the weaker asset with the cleaner range when more than one qualifies.
- To trade the weakest asset lower, require the strongest to reverse off its level first.
- To trade the strongest asset higher, require the weakest to form a reversal first.
- A reversal in the required asset needs a sweep - if it never swept anything, no reversal
  can be framed there.
- If the required reversal does not appear, do not trade; wait for the next higher-timeframe
  candle open.
- If the required asset instead continues through its level, expect the others to follow it
  rather than diverge.
- Rank NQ/ES/YM; identify the strongest asset for a short idea.
- Require the strongest asset to sweep its relevant high and reverse; failure swings below
  the high do not count.
- Only then trade the middle/weaker asset (ES) in the SMT direction.
- For a long on the strongest asset, watch the weakest asset into its low.
- If the weakest asset forms a reversal there (SMT with the stronger assets), the stronger
  assets may drift higher.
- If the weakest asset fails to react and trades well below the low, expect the stronger assets
  to be dragged lower with it.
- 'Before the reach: if the weakest asset has not traded into the hourly gap or below the
  reference low, do not frame the long.'
- Watch the weakest asset into that gap; a reversal there with the stronger asset holding
  its low = SMT.
- Weakest asset reverses -> expect continuation on the middle/strong assets.
- If the weakest asset instead continues lower, expect the other assets to reverse down with
  it (they are still correlated).
invalidation:
- The required asset continues through its level instead of reversing (here YM continued lower;
  NQ was the 'liar').
- The strongest asset continues to make new highs while the weakest fails to displace lower.
- The weakest asset does not get the 5-minute closure through - the strongest-asset long is
  not timed.
- The strongest asset continues through its objective without reversing — the premise for
  the weak-asset trade is gone.
- The asset that was supposed to reverse trades through its level instead.
- The weakest asset trades through the gap without reversing.
measurable:
- P(group continuation | tell asset trades through the level without reversal)
- outcome of strongest-asset longs with vs without a weakest-asset reversal
- outcome when the weakest reverses after a second sweep vs a single sweep vs a deep run
- hit rate of weakest-asset shorts with and without a simultaneous strongest-asset reversal
- lag between the weakest asset's 5m reversal closure and the strongest asset taking its highs
- hit rate of strongest-asset target after a weakest-asset 5m closure vs without
- outcome of weak-asset shorts with versus without a prior strong-asset reversal
- lag in bars between the strong-asset reversal and the weak-asset move
- conditional probability of the weakest asset's continuation given the strongest reversed
- false-signal rate when the required reversal is absent
