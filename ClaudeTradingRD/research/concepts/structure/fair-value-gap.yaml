- Three consecutive candles on the working timeframe.
- Three consecutive candles.
- Three consecutive candles on any timeframe.
detection_rules:
- Measure the gap from the pre-move candle's extreme to the post-move candle's opposing extreme.
- 'Finessee_Fx''s merge rule: if two consecutive same-direction candles form the block, use
  both; the span is then measured across the pair, and the gap is balanced only when that
  entire span has been traded through.'
- A partial tap does not count as filled - a gap that price never completely closed remains
  live and may be revisited.
- 'Ben''s invalidation: mark the defending edge (the top of a bearish gap, the bottom of a
  bullish one) and require no candle CLOSE beyond it; wicks through it do not invalidate.'
- 'Ben: fair value gaps are treated as less sensitive than other PD arrays, so he prefers
  to stack one with a breaker or an order block rather than trade it alone.'
- 'Finessee_Fx: a large imbalance can be dissected on a lower timeframe to find a nested gap
  or order block that becomes the precise destination.'
- 'bullish_fvg (BISI) at i: low[i+1] > high[i-1]. Gap zone = [high[i-1], low[i+1]].'
- 'bearish_fvg (SIBI) at i: high[i+1] < low[i-1]. Gap zone = [high[i+1], low[i-1]].'
- Consequent encroachment (CE) = the midpoint of the gap zone.
- 'Respect: price trades into the zone and reacts away without closing through it — the order-block
  video describes bodies holding the gap while wicks penetrate it.'
- 'Violation: a candle closes beyond the far edge of the gap -> the gap becomes an inversion.'
- 'bullish_fvg (BISI) at i: low[i+1] > high[i-1]. Zone = [high[i-1], low[i+1]].'
- 'bearish_fvg (SIBI) at i: high[i+1] < low[i-1]. Zone = [high[i+1], low[i-1]].'
- The overlap test is stated in terms of the candles' HIGH and LOW, and demonstrated by dragging
  those extremes across - so the test is on wicks, not bodies. This resolves an open question
  left by the_foundation_01.
- 'Negative test he works three times: extend the first candle''s high and the third candle''s
  low; if they overlap there is no fair value gap.'
- SIBI = a bearish fair value gap; BISI = a bullish fair value gap. The imbalance/inefficiency
  wording is an economic gloss on the same object, not an extra condition.
- Take candles 1, 2, 3. If wick of candle 1 and wick of candle 3 do not overlap, the space
  between them is a fair value gap.
- 'Bullish gap: candle 1 high below candle 3 low. Bearish gap: candle 1 low above candle 3
  high.'
- Multiple adjacent gaps are treated as a single large gap; a closure must clear the whole
  series to count.
- A gap already traded through is no longer treated as a relevant level.
- Take three consecutive candles 1, 2, 3.
- 'Bullish: candle 1''s high does not overlap candle 3''s low. Bearish: candle 1''s low does
  not overlap candle 3''s high.'
- The unfilled space between those two wicks is the gap zone.
- Overlapping wicks across the three candles = price delivered normally = no gap.
- A fair value gap left by a structure break is the entry for that break.
- Take three consecutive candles.
- 'Bearish FVG: candle 1 low > candle 3 high (no overlap).'
- 'Bullish FVG: candle 1 high < candle 3 low (no overlap).'
- The unfilled span between them is the gap; its midpoint is the consequent encroachment.
- FVG := a three-candlestick pattern in which the wick of candle 1 and the wick of candle
  3 do not overlap.
- The gap is measured on the WICKS, not the bodies, in this statement.
- 'Interpretation: the non-overlap is evidence of aggressive price action through that area.'
- A fair value gap is the corpus's "internal liquidity".
invalidation:
- A candle closes beyond the defending edge of the gap (Ben).
- The gap is fully closed - it is then efficient and no longer a target (Finessee_Fx).
- A close through the entire gap converts it into an inversion fair value gap of the opposite
  polarity.
- Full fill without a close through leaves it consumed as a target but the direction unchanged.
- A close over the consequent encroachment or outside the gap - he uses the word 'invalidate'
  for this; see consequent-encroachment, where the threshold is contested.
- A swift close through the gap inverts it (see inversion-fair-value-gap).
- A close through the gap on the opposing side inverts it (see inversion-fair-value-gap).
- The first and third candle wicks overlap - no gap.
measurable:
- difference in fill statistics between the single-candle and merged-candle measurement
- forward return after a partial tap versus a complete fill
- reaction rate of fair value gaps alone versus gaps stacked with a breaker (Ben's sensitivity
  claim)
- fill rate of FVGs by timeframe and by distance from price
- share of FVGs respected on first touch vs closed through
- R-multiple of near-edge entries vs CE entries
- count of FVGs per timeframe per instrument with a wick-based test
- fill rate by distance from price and by timeframe
- reaction rate at the near edge vs the CE vs on full fill
- frequency of FVG formation by timeframe
- reaction rate at single vs stacked fair value gaps
- count of fair value gaps per session by timeframe
- fill rate of gaps left by a structure break
- count of FVGs per session by timeframe
- fill rate and time-to-fill
- count of FVGs per session per timeframe under the wick-based definition
- rebalance rate of wick-defined FVGs versus body-defined ones
