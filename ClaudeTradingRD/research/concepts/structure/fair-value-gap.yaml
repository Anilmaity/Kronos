ambiguities:
- Asked directly at what point a gap counts as efficient, Finessee_Fx calls it a grey area
  that depends on context, then answers with the merge rule rather than a fill percentage
  - which sits awkwardly beside his 'fully closed' rule.
- Whether 'fully closed' is measured by wick or by body is not stated.
- '''Less sensitive than other PD arrays'' is Ben''s personal-study impression with no measurement.'
- The Finessee_Fx transcript renders 'order block' as 'water block' and 'fair value gap' as
  'for Value Gap'; the Ben transcript renders FVG as 'feg', 'fpg' and 'fiji'. All are auto-caption
  artifacts.
- '''Does not overlap'' — whether exactly equal prices (touching) count as a gap is not stated.'
- Wicks vs bodies for the overlap test are not specified; the standard reading (and the chart
  examples) use wicks.
- No minimum gap size, so on low-volatility instruments the detector will produce many trivial
  gaps.
- 'No expiry rule: how long an unfilled FVG stays a valid target is never stated (examples
  use gaps from prior days and weeks).'
- The dedicated fair value gap video is referenced ('click the link in the top right') but
  is not part of this unit.
- Whether exactly equal prices (touching, not overlapping) count as a gap is still not stated.
- No minimum gap size, so low-volatility instruments produce many trivial gaps.
- No expiry rule for an unfilled gap.
- The auto-captioner renders SIBI as 'city'/'sibi' and BISI as 'busy'/'bissy', and 'buy side
  imbalance' as 'buy side inbounds' - the quotes above are reproduced exactly as transcribed.
- Whether the gap is measured wick-to-wick or body-to-body is stated as wick-to-wick here,
  but the retracement video judges respect by the BODIES ('you can see how the bodies respect').
- No minimum gap size is given.
- The test is stated on the WICKS in this recording, consistent with the later canon's high/low
  formulation.
- No minimum gap size is given anywhere.
- rXMVPUZPw4A words the test on the candle low/high; mwmWNCTEYtY words it on the WICKS of
  candle 1 and 3. These are the same in practice but he never states whether bodies could
  ever be used.
- 'The "aggressive" clause is descriptive, not a threshold: it says a non-overlap SHOWS aggression,
  not how much aggression, and it does not license reading "aggressive" elsewhere in the corpus
  as "there is an FVG". Treat it as the nearest available proxy, not a definition.'
- The clip does not say whether the middle candle must displace, or in which direction.
- It conflicts in emphasis with library entries that measure the gap between bodies; this
  Short says wicks explicitly.
