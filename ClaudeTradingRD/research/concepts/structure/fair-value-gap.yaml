id: fair-value-gap
name: Fair Value Gap (FVG)
definition: 'Two guests supply the two halves a detector needs: how the gap is measured and
  how it is invalidated. Finessee_Fx measures it from the pre-move candle''s extreme to the
  post-move candle''s opposing extreme - but with a merge rule: where two consecutive same-direction
  candles form the block, BOTH are treated as the block and the gap is spanned across them,
  so a retrace that only reaches the inner candle does not count as balanced. He treats fair
  value gap, imbalance, liquidity void and buy-side / sell-side imbalance as one thing, and
  counts a gap as efficient only once it is fully closed. Ben supplies invalidation by candle
  close: he marks the defending edge of the gap and requires no candle CLOSE beyond it, and
  notes from his own study that fair value gaps are somewhat less sensitive than other PD
  arrays, so a gap can be revisited - especially one that was never completely filled.

  '
variants:
  definition:
  - 'A three-candlestick pattern in which the first candle''s low does not overlap the third
    candle''s high (bearish case), or the first candle''s high does not overlap the third
    candle''s low (bullish case). The unfilled space between those two prices is the gap.
    This is the only explicit FVG definition given anywhere in the available transcripts of
    this unit; every other video uses the term as already known.

    '
  - 'The channel''s dedicated definition video, and therefore the canonical statement: a fair
    value gap is a three-candlestick pattern where the first candle''s LOW does not overlap
    with the third candle''s HIGH, or where the first candle''s HIGH does not overlap with
    the third candle''s LOW. The construction is demonstrated by dragging the first candle''s
    low and the third candle''s high across and checking for overlap, and three negative examples
    are worked where the two lines do overlap and there is therefore no gap. The economics
    are named: SIBI is sell side imbalance buy side inefficiency - sell side was offered but
    buy side was not - which is simply a bearish fair value gap; BISI is the mirror and is
    simply a bullish fair value gap.'
  - A three-candlestick pattern in which the wick of candle one and the wick of candle three
    do not overlap, leaving a gap. In this unit the fair value gap is used almost exclusively
    as a POINT OF INTEREST - the place a retracement is expected to terminate and where a
    protected swing is then allowed to form - rather than as an entry in itself. Where several
    fair value gaps stack, they are treated as one large fair value gap and the closure must
    clear all of them.
  - 'Corroborating primary-source statement from the earliest recordings: a fair value gap
    is a break in price delivery, read off three candles, where the wick of the first candle
    and the wick of the third candle do not overlap. He contrasts it directly with the normal
    case where the wicks DO overlap (''price was delivered well there''). It is the signature
    of price moving quickly through an area, which is why it doubles as the detection aid
    for displacement.'
  - 'A three-candlestick pattern in which the first candle''s wick and the third candle''s
    wick do not overlap. Bearish: candle 1''s low does not overlap candle 3''s high. Bullish:
    candle 1''s high does not overlap candle 3''s low. He equates the fair value gap with
    internal range liquidity.'
  - Defined mechanically and then given its purpose in one clause. A fair value gap is a three-candle
    pattern in which the wick of the FIRST candle and the wick of the THIRD candle do not
    overlap - and the reason it matters is that the non-overlap SHOWS AGGRESSIVE PRICE ACTION
    through that area. That last clause is the closest thing in the corpus so far to an operational
    test for the word "aggressive", which is used as a gate in several other concepts without
    definition.
