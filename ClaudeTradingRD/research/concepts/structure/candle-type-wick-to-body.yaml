ambiguities:
- This is the ONLY explicit wick-size comparison found in the corpus so far. It is a comparison
  (wick > body), not a ratio - no percentage or multiple is given, and no tolerance band is
  given for the case where wick and body are nearly equal.
- Whether "the wick" means the single directional wick or the sum of both wicks is not stated.
  The chart he points at has one dominant wick, so the single-wick reading is the more likely
  one, but a candle with two medium wicks is not covered.
- The reversal-candle test is stated as a property of a completed candle, but the sequencing
  he narrates (which extreme came first) is not recoverable from OHLC alone.
- '"Fairly small" body and "very close" open-to-close for the indecision candle are not quantified.'
- The Shorts say "the next candle type" and "the last candle type", so at least one earlier
  type (presumably the directional / expansion candle) is defined in a Short not in this unit.
  Do not assume its threshold is the mirror of this one.
