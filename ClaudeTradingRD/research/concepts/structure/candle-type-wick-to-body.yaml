id: candle-type-wick-to-body
name: Candle Types Classified By Wick Size Relative To Body
definition: 'The Shorts state, for the first time in the corpus with an explicit comparison,
  what makes a candle a REVERSAL candle rather than a directional one: the wick is larger
  than the body. The speaker points at the wick that formed first (the manipulation leg) and
  compares its length against the body, and reads the candle as a lower-timeframe move in
  one direction that was reversed before the close. A second named type in the same series
  is the INDECISION candle: a longer wick on EACH side with a small body, where the open and
  the close sit very close together, meaning price did not go anywhere over that period. These
  two are presented as members of an enumerated list of "candle types" he looks for; the third
  (the directional / expansion candle, small wick and large body) is asserted elsewhere in
  the unit but not enumerated here.'
category: structure
status: specified
aliases:
- reversal candle
- indecision candle
- candle type
preconditions:
- A completed candle with a defined open, high, low and close.
detection_rules:
- Reversal candle := the wick is larger than the body.
- 'The relevant wick is the one made FIRST in time - the leg price ran before reversing (bullish
  reversal candle: open, high, then reversal down to the close; bearish: open, low, then reversal
  up).'
- 'Read a reversal candle as a lower-timeframe reversal: price ran one way, then reversed
  to close the other way.'
- Indecision candle := a longer wick on each side plus a small body, with the open and the
  close very close together.
- An indecision candle means no direction was delivered over that period.
invalidation:
- Not applicable - this is a classification of a completed candle, not a setup.
measurable:
- frequency of wick > body candles per instrument per month, by timeframe
- next-candle expansion rate conditional on wick>body versus body>wick
- the wick-to-body ratio cut-off that best separates his labelled reversal candles from his
  expansion candles
