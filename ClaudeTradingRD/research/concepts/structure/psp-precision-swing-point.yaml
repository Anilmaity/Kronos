id: psp-precision-swing-point
name: PSP (Precision Swing Point)
variants:
  name:
  - PSP (opposite candle closes across correlated assets)
  definition:
  - 'PSP is a divergence in the CLOSE COLOUR of the same-time candle across correlated assets:
    the structure matches (both swept, both closed back in) but one asset closes a different
    colour from the other. He frames it as a smaller sibling of SMT -- SMT is a divergence
    in whether the level was taken, PSP is a divergence in the closure. Two named types, both
    defined by WHERE in the model the divergent candle sits: a CANDLE ONE PSP (the candle
    before the swing point closes a different colour) and a CANDLE TWO PSP (the swing candle
    itself closes a different colour). He is emphatic about scope: PSP is only looked for
    inside an already-valid fractal model, never used to form one.'
  - A PSP exists when the same higher-timeframe candle closes bearish on one asset and bullish
    on its correlated partner. He states this is all it means and explicitly separates it
    from SMT, which he defines as a divergence between the assets. In the indicator it is
    drawn only in combination - a candle 2 that also has a PSP - and it can be looked for
    on candle 1, candle 2 or both; the PSP itself is only legible on the higher-timeframe
    candles because on the chart it clutters.
definition: 'Two correlated markets closing in opposite directions on the same candle. GxTradez
  credits the concept to ''trader day'' and states it as simply as possible: one closes bullish,
  the other closes bearish, and that indicates a potential reversal.'
category: structure
status: contested
aliases:
- precision swing point
- candle one PSP
- candle two PSP
- PSP
preconditions:
- A defined correlated pair/triad is being compared on the same timeframe and candle.
- 'A valid fractal model on the primary asset: a candle 2 or candle 3 closure WITH its change
  in the state of delivery.'
- At least one correlated asset (for NQ he uses ES and YM).
- A correlated pair or triplet of assets (ES/NQ/YM in his examples).
detection_rules:
- Take the same candle index on two correlated markets.
- One closes up, the other closes down — that is a PSP.
- Read it as a potential reversal signal at a key level.
- A PSP that opposes the open draw on liquidity is NOT a reversal — it is a continuation PSP.
- Align the same-period candles across the correlated assets.
- 'Candle 1 PSP: candle 1 closes a different colour on the correlated asset than on the primary.'
- 'Candle 2 PSP: candle 2 (the swing candle) closes a different colour on the correlated asset.'
- PSP may be combined with SMT on the same candle for additional confluence.
- Do not scan for PSP on arbitrary candles -- only on the higher-timeframe candles that belong
  to a valid model.
- Take the same higher-timeframe candle on both assets.
- PSP is present when one closes bearish and the other closes bullish.
- It is surfaced only as 'C2 plus a PSP', not as a standalone signal.
- It can be evaluated on candle 1, candle 2, or both.
invalidation:
- Both markets close the same direction.
- The underlying fractal model is invalid -- the PSP then means nothing.
- Both assets close the same direction - no PSP.
measurable:
- PSP frequency per session by triad
- reversal rate of PSP at a key level vs away from one
- expansion of C3 with vs without a C1 or C2 PSP present
- co-occurrence rate of PSP and SMT at the same swing point
- frequency of C2-with-PSP vs C2-without-PSP
- outcome difference between the two
