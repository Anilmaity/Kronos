ambiguities:
- No minimum body size; a doji-ish opposite close presumably counts.
- Which market of the pair leads is not specified here (he defers to his own PSP and SMT videos).
- No rule ranks candle 1 PSP against candle 2 PSP, or says whether both together is stronger.
- Which correlated asset to check is left open -- for Nasdaq he says he uses ES and YM and
  'all three personally'.
- No statement on what a PSP against the direction of the model means, only what a confirming
  one means.
- What a PSP adds to a C2 - whether it is a filter, a confluence or a requirement - is never
  stated; he defers it to a promised standalone video.
- Whether the two candles must be the same period on both assets when sessions differ is not
  addressed.
- Whether a doji close counts for either side is not stated.
