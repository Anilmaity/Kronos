id: consolidation-phase
name: Consolidation (Phase Of Price)
definition: 'A dedicated Short restates the definition and, importantly, states the DIRECTIONAL
  rule the other way round from the library''s existing entry. Definition: consolidation is
  price staying within a given range for a period of time; it is expected following a large
  range, or after price reaches an important level. Interaction: wait for either the high
  or the low of the range to be taken out - and here the side that is taken FIRST supplies
  the direction, rather than a pre-existing bias selecting which side must be taken. If the
  low is taken out first that is generally bullish and he trades to the other side of the
  range; if the high is taken out first that is generally bearish and he trades to the low
  of the range. The one exception: the range does not have to be taken out at all if a correlated
  asset takes it out or creates SMT, in which case he trades to the other side without a manipulation
  on this asset.

  '
variants:
  definition:
  - 'A consolidation is price remaining internal to a marked high and a marked low - not taking
    out the high, not taking out the low - for a period of time. It is expected after a large
    range or when price hits a higher-timeframe level. The trading instruction is explicitly
    negative: do not trade inside the range, because that is guessing the breakout direction.
    Wait for one side of the range to be manipulated (bullish: the low is run out; bearish:
    the high is run out), then trade away from it - accumulation, manipulation, distribution.
    A consolidation resolves either as a continuation (no HTF level hit, an objective is still
    open) or as a reversal (a higher-timeframe level has been hit).'
category: structure
status: contested
aliases:
- remaining internal to a high and a low
- range
preconditions:
- A high and a low can be marked that price has not traded beyond.
- Typically following a large range, or after price has reached an important level.
- A high and a low can be marked that price has not closed outside of.
detection_rules:
- Consolidation = price stays within a given range for a period of time.
- Expect it after a large range, or after price reaches an important level.
- 'Confirmation in the worked example is negative and mechanical: price has not traded below
  the marked low and has not traded above the marked high.'
- Wait for one side of the range to be taken out before trading.
- Low taken out FIRST -> generally bullish -> trade to the other side of the range.
- High taken out FIRST -> generally bearish -> trade to the low of the range.
- 'Exception: if a correlated asset takes the side out, or SMT forms, trade to the other side
  without requiring the manipulation on this asset.'
- 'Behavioural marker he narrates while it is happening: price is lethargic, just hanging
  around.'
- Mark a high and a low; price remains internal to them - it does not take out the high and
  does not take out the low.
- If price pokes outside but fails to trade out of it, re-adjust the range high and low and
  the label still holds.
- 'Entry condition: one side of the range must be run out (manipulation) before any trade
  is sought.'
- 'The manipulated side is chosen by bias: bullish requires the range low to be run out; bearish
  requires the range high to be run out.'
- 'Exception: if the correlated asset runs out that side and this one does not, the SMT substitutes
  for the sweep.'
- After the manipulation, either enter on the reversal or wait for the closure through the
  series of opposing candles (the protected swing) and trade the continuation.
- 'Continuation vs reversal resolution: if no higher-timeframe level has been reached and
  an objective is open, expect continuation; if a higher-timeframe level has been hit, expect
  a reversal.'
invalidation:
- Price trades and holds beyond the marked range - the phase has resolved.
- A close outside the range that is not a manipulation - i.e. a breakout signature, price
  closing over the previous high and continuing.
measurable:
- share of consolidations where the first side taken predicts the eventual resolution
- how often the SMT exception fires instead of a same-asset sweep
- how often consolidation follows a large range or an important-level tag, versus at random
- share of consolidations that resolve by sweep-then-reverse vs breakout
- expectancy of the post-sweep continuation entry vs entering inside the range
- how often the EQ of the range is returned to after a deviation
