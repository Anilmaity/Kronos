id: trade-away-from-manipulation
name: Trade Away From Manipulation, Never From Failure Swings
definition: 'Asked whether the strong-asset sweep requirement is about not trading away from
  failure swings, he agrees: in real time he requires the sweep and will not trade away from
  a stack of failure swings, even if a case can be made.'
variants:
  definition:
  - 'TTrades states the same rule in his own voice: he cannot trade higher from failure swings
    and needs something to run out the lows first. Later, after a deep run that left a series
    of failure swings and a gap, he says he cannot trust the resulting low, contrasting it
    with a low he can trust.'
  - 'Expansion is anticipated only after manipulation. When price retraces into internal range
    liquidity, a manipulation or protected swing must form there before a trade back into
    the range is taken; entries taken away from failure swings - deep pullbacks that left
    stacked highs or lows with no sweep - are rejected. The corollary is that fair value gaps
    and order blocks are most useful when they are formed by the manipulation itself, since
    those are the arrays expected to support the expansion away from it.

    '
category: structure
status: contested
aliases:
- manipulation is the trigger for expansion
- protected swing requirement
preconditions:
- Price has retraced into internal range liquidity or reached an external key level.
detection_rules:
- For a short, require the strongest correlated asset to sweep its high; a stack of failure
  swings below it is not a level to trade away from.
- Before trading away from a low, require a run of the lows (manipulation).
- If the move into the low left failure swings, treat the low as untrusted.
- Require a sweep (manipulation) of a prior high or low at the level before entering.
- If the level was reached without a sweep, only failure swings exist - do not trade away
  from it.
- Prefer FVGs and order blocks that were formed by the manipulation over pre-existing ones.
- Every manipulation used as a trigger is paired with an SMT.
invalidation:
- A deep retracement follows the manipulation instead of expansion - the manipulation is treated
  as invalidated.
measurable:
- expansion rate after a swept level vs an unswept level
- frequency of the deep-retracement invalidation after manipulation
