ambiguities:
- The trusted vs untrusted low is drawn on the chart only.
- Price 'does not have to manipulate' to expand - the speaker says so explicitly - so this
  is a selection filter, not a description of price.
- The depth of retracement that invalidates a manipulation is not quantified.
