id: original-consolidation-identification
name: Identifying The Original Consolidation Of A Market Maker Model
definition: 'The procedure $niper uses to locate the accumulation block that anchors a market
  maker model. He does not derive it from structure - he looks at the Asia session''s price
  action together with the previous daily low (or high) and any relatively equal lows/highs,
  and where those coincide in a stretch of chop he calls that block the original consolidation
  where price was accumulated. Asia''s highs and lows are explicitly treated as liquidity
  engineered to be targeted later.

  '
category: structure
status: underspecified
aliases:
- original consolidation
- accumulation area
preconditions:
- A session / kill-zone indicator is on the chart so the Asia session can be delimited.
detection_rules:
- Mark the Asia session range.
- Mark the previous daily low (buy model) or previous daily high (sell model).
- Where Asia's extreme, the previous daily extreme and any relatively equal highs/lows sit
  together in a stretch of chop, label that block the original consolidation.
- Treat the extremes of that block as engineered liquidity to be targeted at the end of the
  model.
invalidation:
- Not stated.
measurable:
- how often the Asia-session extreme and the previous-day extreme coincide within a chosen
  tolerance
- hit rate of the original-consolidation extreme being reached at the end of a completed model
sources:
- video_id: UmLWRlXd_V8
  title: 8/14/22  MMXM Live with $niper  - ICT concepts
  quote: previous daily lows and Asia's lows are in a form of chop and consolidation
ambiguities:
- '''A form of chop and consolidation'' is the entire test and is never bounded - no candle
  count, range width or ATR fraction.'
- How close Asia's low and the previous daily low must be to count as coinciding is not stated.
- Whether the consolidation must contain the Asia session or merely overlap it is not stated.
- He answers the audience question 'how do you confirm your original consolidation' with a
  single worked chart rather than a rule.
