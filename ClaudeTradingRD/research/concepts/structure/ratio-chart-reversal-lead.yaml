id: ratio-chart-reversal-lead
name: Ratio-Chart Reversals As An Early Reversal Signal (his stated theory)
definition: 'Explicitly labelled by the speaker as a theory he has come up with, not an established
  rule: a reversal on the ES/NQ comparison chart shows a change in correlation and can be
  used to anticipate a reversal on ES or NQ themselves, as well as to reassign relative strength.
  He calls it ''kind of like an smt without an smt'' and says that from what he has seen it
  will sometimes be AHEAD of the reversal that actually occurs on the charts. He closes by
  asking viewers to test it and report back, which is the clearest signal in the unit that
  this is unvalidated.'
category: structure
status: underspecified
aliases:
- change in correlation
- smt without an smt
preconditions:
- An ES/NQ ratio chart is being watched alongside both instruments.
detection_rules:
- 'Detect a reversal on the ratio chart (in his examples: a sweep of a high on the ratio followed
  by a fall back inside the range).'
- Read it as a change in correlation - the previously strong asset is becoming weak and vice
  versa.
- Anticipate a reversal on ES and/or NQ at or after that point.
- 'Timing claim: the ratio reversal may print before the instruments'' own reversal (his example
  has the ratio high at 10:00 and the instruments'' low at 10:05).'
invalidation:
- Not stated - no falsification condition is offered for the theory.
measurable:
- lead/lag distribution in minutes between ratio-chart reversals and ES/NQ reversals
- false-positive rate of ratio reversals that produce no reversal on either instrument
- whether the effect survives on a matched random-time control sample
sources:
- video_id: c_mh19e3mhI
  title: The Best Relative Strength Indicator For ES & NQ - ICT
  quote: reversals on the es and Q comparison chart
- video_id: c_mh19e3mhI
