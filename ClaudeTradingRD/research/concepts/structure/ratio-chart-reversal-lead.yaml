  quote: it's kind of like an smt without an smt
ambiguities:
- The speaker frames this as an untested theory and solicits viewer feedback, so it carries
  no claimed hit rate.
- '''Reversal'' on the ratio chart is not defined; the two examples use a sweep-and-close-back-inside
  shape only.'
- The lead time is asserted from two intraday instances (9:30 and 10:00 to 10:05), which is
  not a sample.
- It is not stated whether the ratio must reverse at a level or anywhere.
