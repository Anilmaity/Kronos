ambiguities:
- HIGHEST-VALUE PARTIAL ANSWER TO THE LIBRARY'S 'WICK SIZE' GAP, BUT STILL NOT A NUMBER. He
  gives a comparison ('large Wick and smaller body') and a procedure, never a ratio or percentage.
  A detector must pick its own cut - wick_span > body_span is the reading the words support.
- Which wick is measured when the candle has wicks on both sides is not stated.
- The mitigation-block branch uses a third criterion ('clustered together') that is about
  the neighbourhood of candles, not the candle itself, and is not defined.
- This rule governs WHICH LEVEL to mark. It is silent on the separate question - which the
  corpus also never answers - of whether a wick is small enough for the candle to count as
  an expansion candle.
