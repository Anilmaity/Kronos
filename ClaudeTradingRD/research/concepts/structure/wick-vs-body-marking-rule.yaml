id: wick-vs-body-marking-rule
name: Wick-vs-Body Rule For Marking A Block's Level
definition: 'The channel''s only stated PROCEDURE for what counts as a small versus a large
  wick, and the only place where the answer changes something mechanical. It is a within-candle
  comparison, not an absolute threshold: if the candle is full-bodied with little wick, the
  block level is the whole BODY and the half-level used is the mean threshold (50% of the
  body). If the candle has a large wick and a smaller body, the block level is instead the
  CLOSE-to-extreme span (close to the low for a bearish block, close to the high for a bullish
  one) and the half-level used is the 0.5 of that WICK. A third, coarser branch is given for
  mitigation blocks in a fast trend: a very small body -> use the wicks; price clustered together
  -> use the opening price.'
category: structure
status: specified
aliases:
- which part of the candle I use
- close to the low
- 0.5 of the wick
preconditions:
- A block (breaker, order block or mitigation block) has already been validated structurally.
detection_rules:
- Compare the candle's body span |close - open| with its wick span on the relevant side.
- Body dominant (full body, little wick) -> zone := open..close; half-level := mean threshold
  = 50% of the body.
- Wick dominant (large wick, smaller body) -> zone := close..extreme (close-to-low bearish,
  close-to-high bullish); half-level := 0.5 of that wick span.
- Bodies must respect the chosen level; wicks are allowed to trade into it.
- 'Mitigation-block variant in a fast trend: very small body -> use the wicks; candles clustered
  together -> use the opening price.'
invalidation:
- A body closes beyond the chosen half-level.
measurable:
- reaction rate at the body mean threshold vs the 0.5-of-wick level, bucketed by wick/body
  ratio
- the wick/body ratio at which the two markings stop agreeing, measured over a sample of blocks
- how often the wick-marked level would have been hit when the body-marked level was not
