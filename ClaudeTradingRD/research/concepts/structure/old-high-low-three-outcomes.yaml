id: old-high-low-three-outcomes
name: The Three Things Price Does At An Old High Or Low
definition: An explicit, exhaustive three-way classification he applies whenever price returns
  to a marked old high or old low. Price will either (1) displace out of the range, retrace,
  and continue in that direction; (2) displace out of the range, displace back into the range,
  and reverse; or (3) fail to displace out and come back into the range. Each branch dictates
  a different expectation, so the outcome is decidable once the relevant candles close.
category: structure
status: specified
aliases:
- what I look for when price returns to an old high or low
preconditions:
- An old high or old low is marked and price is returning to it.
detection_rules:
- 'Branch 1 — displacement out of the range followed by a shallow retracement (no aggressive
  move back in): continuation in the breakout direction.'
- 'Branch 2 — displacement out of the range MET WITH aggressive displacement back into the
  range: reversal; target the opposite side of the range.'
- 'Branch 3 — no displacement out at all (closes back inside): return into the range and seek
  the opposite side.'
- For branch 3 he wants price to return to at least a premium (bearish) or discount (bullish)
  of the range before trusting the reversal.
invalidation:
- A later aggressive close reclassifies the branch; the read is only valid on closes.
measurable:
- empirical frequency of each of the three branches at swept swings
- forward return by branch, per timeframe
sources:
- video_id: ynFA6E3qHj0
  title: Market Structure Shift vs Liquidity Grab
  quote: those are the three things that I look for
- video_id: ynFA6E3qHj0
  title: Market Structure Shift vs Liquidity Grab
  quote: a liquidity grab simply put is a failure to displace over structure
ambiguities:
- '''Aggressive'' is unquantified in both directions, so branch 1 vs branch 2 rests on eyeball
  judgement of the return leg.'
- How many candles may pass before 'displacement back in' no longer counts is not stated.
