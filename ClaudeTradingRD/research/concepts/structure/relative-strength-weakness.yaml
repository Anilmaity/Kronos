id: relative-strength-weakness
name: Relative Strength & Weakness (ES / NQ / YM)
variants:
  name:
  - Relative Strength & Weakness (ES / NQ)
  - Relative Strength / Weakness
  definition:
  - 'A daily ranking of the three correlated index futures (ES, NQ, YM) into strongest, middle
    and weakest, derived from three inputs only: SMT at the relevant level, candle closures
    on lower timeframes, and structure/separation from the target. Longs are taken on the
    strongest asset and shorts on the weakest; the lagging asset is never traded. ES is treated
    as structurally the middle asset. The ranking is re-derived every day after the directional
    bias is set, and it can flip intraday.

    '
  - 'Live reading for a bearish day: the weakest index is the one with the most expansion
    beyond its previous day low (NQ); an index that has already hit its target and is consolidating
    is called the stronger one (YM). The ranking flipped twice in the session: once NQ hit
    its target it became the stronger and YM the weakest, so he would no longer short NQ.
    He says relative strength is hard to explain mechanically and promises a dedicated video.

    '
  - SHORTS EVIDENCE isolating one of the three named inputs - SEPARATION - and showing how
    it is measured. The same previous high is marked on both correlated assets, and the question
    asked of each is how CLOSE it is to that shared high. In the worked example the S&P sits
    only a few points away while the Nasdaq is quite far away; that difference in separation
    is itself the relative strength reading. He states this is one of three things to combine,
    and that practising the combination is what builds the understanding.
  - 'Vocabulary restated: leading means strongest and lagging means weakest, readable simply
    from the candles (4H: one bright green, one bright red, one consolidating). He shows why
    it matters: an entry at 9:30 on the middle asset went nowhere while the strongest trended.'
  - 'Live evidence that the ranking flips intraday: pre-open NQ strongest/YM weakest; after
    9:30 ES held up when it should have been lowest, then NQ became weakest, then YM weak/NQ
    strong again. He resolves the ''which is lying'' question only by waiting for candle closures
    (first 5, maybe 15 minutes) and states that if both are lying the result is consolidation.'
  - 'Relative strength or weakness is simply one of two correlated assets being more bullish
    or more bearish than the other. The three things he judges it on are named explicitly:
    swing points, candle closures, and the size of the candle. Concretely - which asset takes
    out a shared swing point and which fails to reach it; which asset closes inside the body
    of a shared order block and which closes outside it; which asset respects an order block''s
    mean threshold and which trades straight through; and which produces the larger candle
    out of the same level.'
  - YM is mainly used as a relative-strength indicator to trade the other indices rather than
    traded itself.
definition: 'Dedicated full-guide lesson (yH4eYwUgdTY), generalised beyond the index triad
  to any correlated pair (ES/NQ, gold futures vs gold-GBP, gold futures vs gold-euro). Rule:
  long the stronger asset, short the weaker. Three inputs, in the order taught: (1) SMT -
  at the same shared low the asset making the higher low is stronger, the one making the lower
  low weaker (mirrored at highs); (2) structure/separation - used when SMT is NOT present:
  measure each asset''s distance from the same extreme; the greater the separation from the
  low, the stronger the asset (closer to a shared high = stronger); (3) candle closures -
  the ''more advanced'' input, read candle by candle at the same timestamps. It must only
  be used on correlated assets and never alone - a higher-timeframe framework and strategy
  come first.

  '
category: structure
status: contested
aliases:
- relative strength
- strongest asset
- weakest asset
- lagging asset
- relative weakness
preconditions:
- A directional bias for the day already exists (strength is assessed after bias, not before).
- A shared reference level exists across the assets (e.g. previous day high/low).
- Two correlated assets are charted on the same timeframe.
- A shared reference level (a previous high or low) exists on both.
- Two correlated assets charted side by side on the same timeframe (ES and NQ here).
detection_rules:
- Correlated assets only; mark the SAME swing (same-timeframe high/low) on both.
- 'SMT: asset that makes a higher low (bull) / higher high (bear side reversed) at the shared
  level is stronger; lower low / lower high is weaker.'
- 'If no SMT exists (neither or both took the level), use separation: the asset farther from
  the shared low is stronger; the asset farther below a shared high is weaker.'
- 'Candle-2 closure test: both assets sweep the prior low; the one whose C2 closes back above
  C1''s low is stronger, the one that cannot close back inside is weaker.'
- 'CISD-closure test: the asset whose candle closes through the level validating the change
  in state of delivery shows the move (weakness on a bearish CISD); the asset that cannot
  close through it is stronger on that side.'
- 'Body test: a candle closing over its previous candle''s body vs a doji / inside close at
  the same time marks the stronger asset; an engulfing bearish candle vs a doji marks the
  weaker.'
- Multiple SMTs on different timeframes can stack; when they agree they reinforce the same
  ranking.
- 'Re-read continuously: closures can show strength switching between the assets later in
  the move.'
- 'Check SMT at the reference level: the asset that failed to take the level is the strong
  one on that side.'
- Compare candle closures on a lower timeframe (30m/15m) across the three assets; the weakest
  close marks the weakest asset.
- 'Compare separation from the target: the asset closest to the downside target is weakest
  for shorts.'
- Rank the three; ES is expected to sit in the middle.
- 'Short case: weakest = the asset with the largest expansion beyond its previous day low.'
- An asset that has reached its target and is consolidating is re-labelled the stronger asset.
- After the weakest asset hits its target, re-rank; the former weakest may become strongest.
- Mark the SAME previous high (or low) on both assets.
- Measure how far each asset currently sits from that shared level.
- The asset closer to the level is the stronger one on that side; the further asset is weaker.
- Combine separation with the other two inputs rather than using it alone.
- Label the strongest of the triad 'leading', the weakest 'lagging', the other 'middle', from
  the same-timeframe candles.
- Repeated strength switches between the correlated indices after the open are read as consolidation/chop,
  not a tradeable divergence.
- Mark a swing point that both assets formed on the same date.
- 'Strength test 1 (swing points): the asset that takes out the shared swing point is relatively
  stronger; the one that cannot reach it is relatively weaker.'
- 'Strength test 2 (candle closures): at a shared order block, the asset that closes inside
  the body and respects the mean threshold is relatively stronger (bullish case); the one
  that closes outside it is weaker.'
- 'Strength test 3 (candle size): out of the same level, the asset producing the larger directional
  candle is the stronger one in that direction.'
- SMT (one asset makes a higher high while the other makes a lower high) is a fourth read
  of the same thing.
- Use YM to rank strength; execute on NQ/ES rather than YM.
invalidation:
- The ranking flips intraday; the flip typically occurs at a higher low (bullish) and after
  the leading asset has hit its targets.
- The correlation itself changing - see ratio-chart-reversal-lead.
measurable:
- forward R of the model on the asset ranked stronger vs weaker by each of the three tests
- agreement rate between SMT, separation and closure tests
- Per-day agreement rate between the three ranking inputs (SMT, closures, separation).
- Realised R of the ranked-strongest vs ranked-weakest vs middle asset on the same idea.
- Frequency and time-of-day of intraday strength flips.
- frequency of ranking flips immediately after the weakest asset tags its target
- correlation between separation-rank at a level and which asset takes the level first
- forward return spread between the near and far asset
- agreement rate between the three tests on the same bar
- 'persistence: how long the stronger asset stays stronger once identified'
