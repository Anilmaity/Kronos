ambiguities:
- The three inputs are never weighted or ordered when they disagree.
- In aqnY1yZvfYs he tells struggling traders to default to ES (the middle asset) because it
  'does what actually is happening'; in yud7TpE2AMs he says he prefers NOT to trade the lagging
  or middle asset. Advice for beginners vs his own practice.
- No rule is given for whether to switch assets after an intraday strength flip; in aqnY1yZvfYs
  he explicitly refuses to.
- Separation is measured in POINTS, which is not comparable across instruments with different
  point values - no normalisation (ATR, percentage) is given.
- The other two of the 'three things' are referred to but not named in this Short.
- '''More bullish than the other'' is introduced by two side-by-side charts and eyeballed;
  no numeric measure is given for the three tests.'
- '''The size of the candle'' is not normalised for the two instruments'' different point
  values or volatility.'
- Which shared swing point to use is chosen visually (he uses one dated the same day).
