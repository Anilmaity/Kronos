id: three-drive-reversal-pattern
name: Three Drives Into The Same Level As A Reversal Read
definition: 'Rauf walks a live trade and names the structure: price took liquidity three times
  above the same area, which he calls a three drive pattern and reads as a reversal pattern.
  His reasoning is stated as logic rather than as a rule - once the buy stops above have been
  taken three times, price has come back into fair value, and anyone who tried to continue
  higher has failed, the easier path for the market is to run the sell stops below rather
  than travel all the way back up.'
category: structure
status: underspecified
aliases:
- three drive pattern
preconditions:
- A level (relatively equal highs or a marked liquidity pool) that has been run more than
  once.
detection_rules:
- Count runs above the same high (or below the same low).
- Three runs into the same area is read as a three drive pattern.
- Require the subsequent candle to leave a wick and return into fair value, with continuation
  higher having failed.
- The read is then a reversal toward the opposite side's stops.
invalidation:
- A fourth run that expands away and holds outside.
measurable:
- reversal rate after the 3rd run of the same level vs the 1st and 2nd
- distance travelled to the opposite pool after a three-drive read
sources:
- video_id: qFtfD09Vv3E
  title: Live with Day Trading Rauf - Preparing for a New Week
  quote: we've taken liquidity three times above here and then we printed this candle
- video_id: qFtfD09Vv3E
  title: Live with Day Trading Rauf - Preparing for a New Week
  quote: so we have three Drive pattern right here so this is usually a reversal pattern
ambiguities:
- '''Three times above here'' has no tolerance band - how close the three highs must be is
  not stated.'
- '''Usually'' - stated as a tendency with no measurement.'
- The logic argument (easier to run the sell stops) is heuristic, not a decidable rule; the
  detection rules capture only the counting part.
