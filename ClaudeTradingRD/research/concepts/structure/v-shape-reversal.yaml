id: v-shape-reversal
name: V-Shape Reversal
definition: 'A sharp reversal shape used in two roles. (1) As a substitute for CISD: if C2
  produced no CISD, a V-shape is required instead before the sequence can be trusted - and
  even then a subsequent continuation is still needed. (2) As an invalidator: when a supposed
  retracement is deep enough that the leg is fully bought/sold back, it is reclassified as
  a V-shape reversal and the prior directional read is dropped. A V-shape occurring away from
  a relevant level is dismissed as a "fake move" that creates no framework.

  '
variants:
  definition:
  - 'Live gold read: a sharp V-shaped reversal is distrusted. The origin of the V is the area
    that must be respected if it were truly bullish; usually price closes back below it and
    then runs to the actual lows.'
category: structure
status: contested
aliases:
- V-shape
- V shape reversal
preconditions:
- A recent directional leg whose reversal can be assessed.
detection_rules:
- Price reverses sharply with little or no consolidation at the turn, retracing a large fraction
  of the prior leg.
- 'Role 1: accept as C2 confirmation only when no CISD is present, and only with a following
  continuation.'
- 'Role 2: if the retracement of an expansion leg is deep (reaching OTE of the leg), reclassify
  as V-shape reversal and drop the continuation read.'
- 'Role 3 (filter): a V-shape not occurring at a relevant level does not create a tradeable
  framework.'
- Mark the origin of the V as the level that must hold.
- Expect a closure back below it and continuation to the lows.
invalidation:
- The reversal occurs at no relevant level - treated as noise.
measurable:
- Continuation rate after V-shapes at relevant levels vs away from them.
- Overlap between the V-shape reclassification and the OTE-depth threshold.
