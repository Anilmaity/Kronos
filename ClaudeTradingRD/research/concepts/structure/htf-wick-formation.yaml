id: htf-wick-formation
name: Higher-Timeframe Wick Built From Two Aggressive Legs
definition: 'The mechanic that links the lower timeframe to the higher one. An aggressive
  move in one direction immediately met with an aggressive move in the other is, on the timeframe
  above, a single candle with a long wick - and on the timeframe above that, a reversal candle.
  The speaker uses it in both directions: on the daily he shows an aggressive move lower followed
  by an aggressive move higher (evidenced by fair value gaps on both sides) and then moves
  up to the weekly to show the same thing as one reversal candle; and on the 1-minute he waits
  for "expansion down met with expansion up" specifically because that is what forms the higher-timeframe
  wick he needs. Once formed, the wick supplies the levels the model uses next - its 0.5 becomes
  one half of the T-spot, and the extreme becomes the protected swing.

  '
variants:
  definition:
  - 'A 22-second Short states the causal claim in one sentence: a higher-timeframe reversal
    candle with a large wick IS expansion met with expansion on the lower timeframe. Dropping
    into the lower timeframes inside that wick shows expansion up met with expansion down,
    which is what forms the reversal, and the continuation is then traded after it. A second
    Short adds the forward-looking version - when a low is already expected to hold before
    the higher-timeframe candle opens, the anticipated wick is a very shallow one.

    '
  - 'The most compressed statement of this mechanic anywhere in the corpus: a higher timeframe
    wick IS a lower timeframe reversal. A candle whose distance from its low to its closing
    price is very large is, one timeframe down, price opening, trading lower, and then trading
    back towards its opening price - and that round trip is what builds the wick.'
category: structure
status: contested
aliases:
- V-shaped reversal
- aggressive move lower met with an aggressive move higher
- forming this higher time frame wick
preconditions:
- A directional leg into a level.
- A candle with a visibly large wick relative to the distance to its close.
detection_rules:
- Identify an aggressive move into a level, evidenced by a fair value gap.
- Require an aggressive move back out of it, also evidenced by a fair value gap - fair value
  gaps on both sides of the market.
- That combination is a V-shaped reversal on the working timeframe and a wick on the timeframe
  above.
- Read the bodies to confirm the V shape where the wicks are noisy.
- Mark 0.5 of the resulting wick as a level to be respected.
- 'Used prospectively as well as descriptively: standing at a high after expansion into it,
  the reversal is anticipated by asking which of consolidation, retracement or expansion-out
  arrives, and only expansion-out forms the higher-timeframe wick.'
- For a higher-timeframe candle carrying a large wick, drop to the lower timeframe covering
  that wick.
- Expect one directional expansion leg met by an opposing expansion leg; that pair is the
  wick.
- Read the pair as a reversal, and trade the continuation that follows it, not the wick itself.
- Identify a candle whose distance from its low to its closing price is very large.
- 'Drop one timeframe: that wick is price opening, trading lower, and trading back towards
  the opening price.'
- Read the higher-timeframe wick and the lower-timeframe reversal as the same event.
invalidation:
- The move out is not aggressive - price drifts back rather than expanding - so no wick forms
  and the reversal is not confirmed.
- The lower-timeframe structure inside the wick is consolidation rather than two expansion
  legs.
- Not applicable - a structural identity, not a setup.
measurable:
- wick-to-body ratio of the resulting higher-timeframe candle
- frequency of two-sided fair value gaps at reversal points
- hold rate of 0.5 of the formed wick on the subsequent retracement
- share of large HTF wicks whose LTF structure is two expansion legs
- outcome of continuations traded after an expansion-met-with-expansion wick
- share of large-wick HTF candles that contain an identifiable LTF reversal
