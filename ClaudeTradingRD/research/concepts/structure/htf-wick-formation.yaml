ambiguities:
- Sourced from an ASR (whisper-small) transcript, not YouTube captions; wording may be imprecise.
- In video Nlw-PZhoViQ the two-sided-fair-value-gap evidence for aggressive is absent - the
  legs are classified as expansion purely by eye - so aggressiveness is even less constrained
  here than in the other walkthroughs.
- Aggressive is defined only by the presence of a fair value gap, which is a weak proxy -
  no size or velocity threshold is given.
- How immediately the second leg must follow the first is not stated.
- 'The relationship between this and the shallow-wick expansion condition is not addressed:
  a large wick here is desirable for the reversal, while a small wick is desirable on the
  continuation candle.'
- Which lower timeframe to drop to is not stated.
- '''Expansion'' inside the wick is asserted visually; the Short gives no leg-size test.'
- The Short measures the wick "from its low to its closing price", not from the body extreme
  to the low, which is a different measurement from the one the half-wick-respect rule uses.
  It is not said whether the two are meant to be the same.
- '"Very large" is not quantified in this clip.'
