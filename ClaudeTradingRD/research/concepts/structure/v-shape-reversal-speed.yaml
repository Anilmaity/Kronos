ambiguities:
- The 1-3 candle count is stated as a preference ('I prefer', 'a lot of times') rather than
  a hard rule, and one accepted example is described as 'taking a few candles to close over'.
- The timeframe on which the candles are counted is whatever chart is on screen; no anchor
  timeframe is fixed.
- Whether the count starts at the tag of the level or at the extreme is not specified.
- It is not stated whether the count is of candles to the close-through candle inclusive or
  exclusive.
- '''V-shape'' is never given a geometric test - no leg-symmetry, retracement or bar-count
  criterion.'
- '''Swift'' is quantified only as ''a couple candles'' in one of the four Shorts.'
- '''The body'' is not defined - the body of the reversal candle, or of the whole leg, is
  not stated.'
- '''Very aggressive'' is unquantified, so the depth test only applies to a class he identifies
  by eye.'
- The depth test and the library's candle-count test are never reconciled; either could fire
  alone.
- No candle count or time limit defines how quickly the displacement must occur.
- V-shape is a visual description with no measurable slope or retracement criterion.
