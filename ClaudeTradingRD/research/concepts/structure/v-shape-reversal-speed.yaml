id: v-shape-reversal-speed
name: A Real Reversal Is a Fast V-Shape
definition: 'The ideal continuation is a nice aggressive V-shaped reversal: price reaches
  the point of interest and recovers swiftly back through the series of opposing candles.
  This video supplies the corpus''s only candle-count threshold for ''swift''. He says the
  closure should take only a couple of candles - he prefers one, two, maybe three - and that
  longer than that usually means it is taking too long. The rejected example is symmetric:
  two candles down met with six candles up that could not even regain the level. The accepted
  example is also symmetric: two candles up, two candles back down. Failing the speed test
  reclassifies the structure from retracement to consolidation.'
variants:
  definition:
  - 'Four Shorts converge on the same claim from both sides. Positively: the V-shape recovery
    IS what forms the change in the state of delivery, and the ideal case is one where the
    V-shape simultaneously creates the swing point and the protected swing; the closure over
    the level should be swift, taking only a couple of candles. Negatively: where the reversal
    is not a clean V-shape, the structure is a consolidation and he wants to avoid price there
    entirely - and he adds that a subsequent run higher out of such a structure is usually
    just the consolidation highs being taken before price goes lower.

    '
  - 'SHORTS EVIDENCE adding a SECOND, independent axis to the V-shape test. The library entry
    measures V-shapes by SPEED (candle count). This unit adds a DEPTH criterion: when the
    V-shape is very aggressive, price should not return back to the BODY of the move - a retest
    into the body disqualifies it. The speed axis is corroborated negatively in a second Short,
    where a slow return is called out as not fast and not V-shaped, and the structure is reclassified
    as a consolidation.'
  - 'A reversal at a level must displace away immediately, forming a V-shape. Price that reaches
    a level and then lingers is building failure swings and is more likely to run the level
    again; each additional period without displacement reduces the validity of the reversal
    idea. A consolidation at a relevant level is read as a signal for continuation, not reversal.

    '
category: structure
status: contested
aliases:
- nice aggressive V-shaped reversal
- swift price action
- quick recovery
- V-shape reversal
- the longer it takes the less interested I become
preconditions:
- Price has reached a point of interest (a fair value gap, a swept swing, an order block).
- The series of opposing candles that must be closed through has been identified.
- Price has reached a point of interest and turned.
- Price has reached a relevant level where a reversal is anticipated.
detection_rules:
- Count the candles from the reach into the level to the close through the opposing series.
- 'Preferred: 1 to 3 candles. He states he prefers 1, 2, maybe three.'
- Longer than three candles is 'taking too long'; reclassify the structure as a consolidation
  and drop the continuation.
- 'Compare the candle count of the recovery with the candle count of the move in: a six-candle
  recovery from a two-candle move is explicitly rejected as not V-shaped.'
- A closure that arrives only after a failed attempt plus consolidation is a sweep of the
  consolidation high, not a valid recovery.
- The same speed test is applied inside the reversal itself, not only to the entry - he rejects
  a reversal that spends a lot of time forming.
- After the point of interest is reached, require a swift recovery that closes back through
  the level.
- The V-shape recovery is what constitutes the change in the state of delivery.
- 'Ideal: the same recovery forms both the swing point and the protected swing.'
- No clean V-shape -> classify as consolidation and stand aside.
- Treat a subsequent run out of that consolidation as a sweep of its highs, not as a continuation
  signal.
- 'Speed test: the recovery back through the opposing series must be fast, not drawn out.'
- 'DEPTH test (this unit): on a very aggressive V-shape, price must NOT return back into the
  body of the move.'
- A slow return that never regains the level is not a V-shape - reclassify as a consolidation.
- The depth test is what lets the stop be placed tight enough for a 2R target just beyond
  the swept extreme.
- Require displacement away from the level within the first few candles after the level is
  reached.
- Require a close back through the level and through the lower-timeframe swing that formed
  on the approach.
- If instead price consolidates and builds equal highs or lows near the level, discard the
  reversal and expect continuation.
invalidation:
- The recovery grinds and fails to regain the level; price is in a range and the low/high
  becomes a target rather than a support.
- The recovery drifts rather than snapping back, or fails to close through the level.
- Price retraces back into the body of the aggressive V-shape.
- Price fails to close back through the level quickly.
- New failure swings form at the level.
measurable:
- win rate of continuations bucketed by recovery candle count (1-3 vs 4+)
- ratio of recovery candle count to approach candle count, split by outcome
- candles-to-closure for structures later classified V-shape vs consolidation
- how often a run out of the rejected consolidation reverses lower
- outcome split of V-shapes that did versus did not retest into the body
- candle count of the recovery leg versus the move-in leg
- follow-through rate of reversals that displace within N candles versus those that consolidate
