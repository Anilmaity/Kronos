ambiguities:
- '''Consolidating'' for the dollar reuses the consolidation definition and inherits its lack
  of a duration bound.'
- No rule is given for what to do when the EURGBP read and the individual-closure cross-check
  disagree.
- The same logic is asserted to transfer to NQ/ES but the equivalent 'cross' for indices is
  not named here.
- The dollar direction is taken as given in both Shorts; how it was established is not shown.
- No rule is given for what to do when the cross and the individual closures disagree.
- The timeframe of the EURGBP closure used is the daily in one Short and unstated in the other.
