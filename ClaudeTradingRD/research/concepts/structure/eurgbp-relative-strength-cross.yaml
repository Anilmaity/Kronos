id: eurgbp-relative-strength-cross
name: EURGBP As The Relative-Strength Cross For EU vs GU
definition: 'A fully mechanical asset-selection procedure for forex. Precondition: the dollar
  must not be consolidating - only then do you trade EURUSD or GBPUSD at all. To decide WHICH,
  read the cross EURGBP: if EURGBP is bullish, the euro is stronger and the pound is weaker;
  if EURGBP is bearish, the euro is weaker and the pound is stronger. Then pair strength against
  the dollar''s direction - bullish dollar: short the WEAKER foreign currency; bearish dollar:
  long the STRONGER one. The cross is read with the same machinery as everything else (daily
  candle 2 closures, hourly CISD). A secondary check is offered: compare the individual daily
  closures of EURUSD and GBPUSD directly - the weaker one closes more decisively through its
  opposing candles.'
variants:
  definition:
  - 'Two Shorts run the cross as a two-step decision. Step one: with a bullish dollar, the
    question is which of the two foreign currencies is weaker, because that is the one to
    trade. Step two: read EURGBP - if EURGBP is bullish then the euro is stronger than the
    pound, so the pound is the weaker leg and GBPUSD is the pair to focus on for a short.
    Both Shorts then cross-check the conclusion against the individual closures on EURUSD
    versus GBPUSD, treating a bearish closure through a series of up-closed candles on one
    and not the other as confirming confluence rather than as the primary signal.

    '
category: structure
status: contested
aliases:
- EU vs GU
- relative strength cross
preconditions:
- The dollar (DXY) is not consolidating and has a directional read.
detection_rules:
- 'Gate: if the dollar is consolidating, do not trade EU or GU.'
- Read EURGBP direction using a daily C2/C3 closure plus hourly CISD.
- EURGBP bullish -> euro stronger, pound weaker. EURGBP bearish -> euro weaker, pound stronger.
- Bullish dollar -> short the weaker of EURUSD / GBPUSD.
- Bearish dollar -> long the stronger of EURUSD / GBPUSD.
- Cross-check with the individual daily closures of EURUSD and GBPUSD - the weaker asset shows
  the more decisive closure through its opposing candles.
- Then apply the ordinary fractal model on the selected pair.
- Determine the dollar direction first.
- 'Read EURGBP: bullish EURGBP = euro stronger, pound weaker; bearish EURGBP = the reverse.'
- With a bullish dollar, trade the weaker foreign currency against the dollar (short it).
- 'Cross-check on the individual pairs: the weaker one should show the closure through the
  series of opposing candles that the stronger one lacks.'
- Use the cross-check as extra confluence, not as the primary signal.
invalidation:
- EURGBP itself reverses, flipping the strength read.
- The individual closures contradict the cross's reading.
measurable:
- return difference between trading the selected pair vs the rejected one on the same signal
  days
- how often the EURGBP read and the individual-closure read disagree
- agreement rate between the EURGBP read and the subsequent EU/GU performance spread
- R outcome of trading the cross-selected leg vs the other
