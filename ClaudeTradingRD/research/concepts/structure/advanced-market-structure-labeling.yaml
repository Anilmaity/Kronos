preconditions:
- A higher-timeframe level / PD array is identified for the long-term point.
- Short-term highs/lows are already labelled on the working timeframe.
- A higher-timeframe level has been reached and reacted from.
- Short-term highs and lows are being marked on the execution timeframe.
- Swing points labelled short/intermediate/long term.
- Price has reacted from a higher-timeframe internal or external range level.
- The paired lower timeframe is in view.
detection_rules:
- Short-term low = a low with a higher low immediately either side. Short-term high = a high
  with a lower high either side.
- Intermediate-term low = a short-term low that has a higher short-term low on both its left
  and its right side.
- 'Intermediate-term high = a short-term high with a short-term high on both sides (in practice:
  a short-term high is swept, then another short-term high forms to its right).'
- Rebalanced intermediate-term point = price trades into a fair value gap, rebalances it,
  and trades away; that turn is an intermediate-term point regardless of the short-term pattern.
- Long-term low/high = the extreme formed off the reaction to a higher-timeframe level, confirmed
  once a short-term point forms on its right side and price trades away.
- Once an intermediate-term point is confirmed, he does not expect it to be violated while
  the directional idea holds.
- Short-term high := a local high with lower highs either side (assumed, used without definition).
- Intermediate-term high := a high that is higher than the short-term high before it AND the
  short-term high after it.
- 'To confirm one in real time: after a sweep, wait for a short-term high to print on the
  far side; only then is the swept high intermediate-term.'
- Place the stop on the confirmed intermediate-term high.
- Do not enter short off a high that is a failure swing (a lower high) - require a sweep.
- The confirming short-term high should itself form at a PD array (fair value gap aligned
  with a mitigation block, in the example).
- Long-term low / high := the extreme formed off the REACTION of the higher-timeframe level.
- From the long-term extreme, look left for the intermediate-term extreme.
- Confirmation of the long-term high requires a short-term high to form on the other side
  of it.
- Confirmation of an intermediate-term high requires a short-term high to form on its right
  side.
- Once the intermediate-term high is confirmed, do not expect price to trade back up to it
  before delivering to the original consolidation / sellside liquidity.
- Prefer intermediate-term highs and lows as the working structure level.
- Label the extreme set inside the HTF level as the long-term low (bullish case) or long-term
  high (bearish case).
- Label the next minor swing as the short-term low/high.
- When that short-term point is violated, the swing it protected becomes the intermediate-term
  low/high.
- The entry candidate is the short-term point formed immediately to the right of the intermediate-term
  point.
- 'Bearish mirror: after an intermediate-term high is created by a stop hunt, use the short-term
  high to its right as the short entry.'
invalidation:
- A confirmed intermediate-term low being violated invalidates the bullish read (mirrored
  for highs).
- The intermediate-term high is traded through - that is the stated invalidation of the trade.
- Price returns above the confirmed intermediate-term high before reaching the sellside objective.
- Not stated explicitly. Only a stop-placement alternative is offered - place the stop nearer
  the intermediate-term high if the short-term high feels too tight.
measurable:
- survival rate of confirmed intermediate-term lows (not violated) within N bars
- count of ITL/ITH per session by timeframe
- how often a swept high is confirmed as intermediate-term by the next short-term high
- stop-out rate on intermediate-term-high stops vs short-term-high stops
- how often price returns to a confirmed intermediate-term high before reaching the opposite
  objective
- time from long-term-high confirmation to the sellside target
- stop-out rate behind short-term vs intermediate-term vs long-term swings
- hit rate of the short-term-point entry versus a naive entry at the HTF level touch
- average stop distance for the tight versus the wide placement
