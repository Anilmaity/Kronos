ambiguities:
- The PDF definition of an intermediate-term point ('a short-term low with a higher short-term
  low on the right and left') and the chart procedure he actually narrates ('a short-term
  low is swept, then a short-term low forms on the other side') are not obviously the same
  test — the chart version adds a sweep.
- The rebalanced intermediate-term point has no rule for how deep into the FVG price must
  trade.
- He says he 'often' prefers an intermediate-term high to be taken to call a structure shift,
  rather than any short-term high; this is stated as a habit, not a rule.
- 'This video is his own (voice: ttrades) but the library entry for this id was first built
  from a guest — the merged entry will span both.'
- EARLIER RECORDING. 'Short-term high' is used as assumed knowledge and never defined here,
  so the recursion bottoms out on an undefined term.
- The confirming short-term high must 'form' - whether one candle suffices or two is shown
  but not stated as a rule.
- The later ICT Advanced Market Structure Simplified video (umyCqr_0NsI) is the canonical
  treatment; this is an applied fragment.
- The Shorts use "long-term" and "intermediate-term" confirmation in adjacent sentences on
  the same chart with the same evidence (a short-term high on the right), so the two definitions
  overlap and the clip does not disambiguate them.
- Which higher-timeframe level qualifies to create a long-term extreme is not specified in
  these clips.
- The live example (Asia highs swept, London up-close candle order block, 5-minute execution)
  is described but the instrument is never named.
- No definition of intermediate-term is given in this exchange - the labelling is assumed
  from ICT's material.
- '''Focuses on the most'' is a preference, not a rule; nothing says the other two are excluded.'
- No definition of what size or fractal degree makes a swing minor enough to be short-term
  rather than long-term - the labels are applied by eye.
- The promotion rule is stated once and never restated in the same words for the bearish case.
- It is not stated whether violation means a wick through or a body close through.
- No rule for how many short-term points may form to the right before the setup is stale.
