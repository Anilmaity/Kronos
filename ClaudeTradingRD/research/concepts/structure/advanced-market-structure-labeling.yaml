id: advanced-market-structure-labeling
name: Short-Term / Intermediate-Term / Long-Term Highs and Lows
variants:
  name:
  - Advanced Market Structure Labelling (short-term / intermediate-term)
  - Short-Term / Intermediate-Term / Long-Term Highs And Lows (which one to use)
  - Advanced Market Structure (long-term / short-term / intermediate-term points)
  definition:
  - 'EARLIER RECORDING, and the crispest arithmetic statement of the labelling in this unit:
    a high that is HIGHER THAN THE SHORT-TERM HIGHS ON BOTH SIDES OF IT is an intermediate-term
    high. He uses it operationally rather than descriptively - the intermediate-term high
    is where the stop goes, and the trade is only valid while that high holds. The sequence
    he requires before entering short is: sweep a high, then form a short-term high on the
    OTHER side of it; that second short-term high is what confirms the swept high as intermediate-term
    and therefore as a stop level. He explicitly declines an earlier entry because the highs
    there were failure swings rather than sweeps.'
  - 'Three Shorts assemble the ladder and, critically, define the LONG-term extreme by CAUSE
    rather than by nesting: a long-term low is the low formed off the reaction of the higher-timeframe
    level. Having found it, look left for the intermediate-term low (a short-term low with
    a short-term low either side). Worked live, the sequence is watched forward: short-term
    highs accumulate, a long-term high is confirmed once a short-term high forms on the other
    side of it, and an intermediate-term high is confirmed once a short-term high forms to
    its right. Once the intermediate-term high is in, he does not expect price to reach back
    up to it before delivering to the original consolidation / sellside liquidity.'
  - Asked directly whether he uses short-term / intermediate-term / long-term highs and lows,
    TTrades answers that he personally focuses on INTERMEDIATE-term structure the most, and
    restates it when the question is re-asked in the context of the ICT 2022 mentorship. The
    guest declines to answer because he is unsure what counts as structure. The guest in another
    episode of this same unit uses the same labelling for stop placement, preferring intermediate-term
    and long-term highs and lows over short-term ones.
  - 'A three-tier labelling of swing points used to refine the entry after price reacts from
    a higher-timeframe key level. A long-term point is anchored inside the HTF level. A short-term
    point forms next; when that short-term point is violated it promotes the swing to an intermediate-term
    point. The preferred entry is the short-term point formed immediately to the right of
    the intermediate-term point.

    '
definition: A three-tier swing labelling scheme, credited by him to 'the mxm trader'. A short-term
  low is a swing low (a low with a higher low on each side); a short-term high is a high with
  a lower high on each side. An intermediate-term low is a short-term low with a HIGHER short-term
  low on both its left and its right; an intermediate-term high is a short-term high with
  a short-term high on each side. There is a second kind of intermediate-term point — the
  'rebalanced' one — created when price rebalances a fair value gap and trades away. A long-term
  low is the low formed off the reaction to a higher-timeframe level, validated once a short-term
  low prints on its right side (mirrored for highs).
