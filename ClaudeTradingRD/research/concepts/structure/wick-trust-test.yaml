preconditions:
- A directional bias for the higher-timeframe candle.
- Price has traded into the anticipated wick-formation area of an open candle.
- A higher-timeframe candle has opened and price has traded into the anticipated wick area.
- A daily bias has already been established.
- A higher-timeframe candle has opened and price has traded into the anticipated wick-formation
  area.
detection_rules:
- Let the higher-timeframe candle open and put in its counter-directional wick.
- On the paired lower timeframe, require a change in the state of delivery / protected swing
  inside that wick.
- Only then take the entry, and target the body of the higher-timeframe candle.
- 'Prefer waiting for a reaction over placing a limit into the level: ''I would rather just
  wait for it to react or not react and save myself a loss than to place a limit.'''
- The extreme is reached early into the higher-timeframe candle, not midway through it.
- The reach into the extreme is a shallow opposing run, not a deep one.
- A lower-timeframe change in the state of delivery has closed through the series that made
  the extreme - without it the wick is NOT confirmed, however shallow it looks.
- 'Session condition: prefer the extreme to form early New York or before New York, leaving
  New York to expand.'
- If the extreme is reached but price only consolidates there, the wick is not formed - wait
  for another run at the level or for the next candle.
- Wait for the higher-timeframe candle to trade into a point of interest and reverse rather
  than entering at the open.
- Require a change in the state of delivery on the supporting timeframe inside that candle
  - that closure is what confirms the wick has formed.
- 'Once confirmed, the trade is the body of the higher-timeframe candle: from the extreme,
  through the body, toward the close.'
- 'The geometry expected of the candle being traded: small wicks and a larger body.'
- 'In the bearish case he phrases the same operation as: after the high forms (open-high),
  trade from the high to the low and then the close.'
- Bullish bias -> wait for the daily candle to form its LOWER wick before entering.
- Bearish bias -> wait for the daily candle to form its UPPER wick before entering.
- Confirm the wick extreme with a change in the state of delivery on the lower timeframe.
- Only then trade the body of the candle towards its target.
- The extreme was reached early in the higher-timeframe candle, not midway through it.
- The reach into the extreme is shallow (a small opposing run), not a deep run using much
  of the candle range.
- A lower-timeframe change in state of delivery has confirmed the reversal away from the extreme.
- If all three hold, the extreme is trusted and becomes the stop; otherwise widen the stop
  to a level that is trusted, or skip the trade.
invalidation:
- The confirmed wick's extreme is taken out.
- Price returns through the extreme.
- Price consolidates at the extreme instead of displacing away.
- The higher-timeframe candle keeps extending its wick - the CISD has not occurred, so there
  is no trade yet.
- Price consolidates at the extreme instead of displacing away, so the wick is likely to be
  extended.
measurable:
- stop-out rate of wick-catching entries vs body entries
- time from higher-timeframe candle open to wick confirmation
- rate at which a shallow-run extreme without a CISD is subsequently exceeded
- expansion distance conditioned on time-of-day of the extreme
- how often the extreme confirmed by a supporting-timeframe CISD is subsequently exceeded
  within the same higher-timeframe candle
- body-to-wick ratio of candles that were traded vs skipped
- time-of-day distribution of the daily wick extreme, split by bias direction
- R outcome of entries before versus after the wick extreme is confirmed
- frequency with which an extreme meeting all three detection rules is subsequently exceeded
- stop-out rate of entries placed against untrusted vs trusted extremes
