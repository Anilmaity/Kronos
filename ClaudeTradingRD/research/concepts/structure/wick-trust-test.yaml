ambiguities:
- 'No deadline is given: how late into the higher-timeframe candle the wick may still form
  before the candle is abandoned is not stated (only that expansion candles ''have so much
  range and so much time'').'
- '''Early into the candle'' is never quantified as a fraction of the period.'
- '''Early New York or before New York'' is a session window, not a clock time; no cut-off
  is given.'
- The timeframe on which the confirming CISD must appear is not fixed here - the examples
  use the hourly under a daily and the 1-minute under a 15-minute.
- '''Small wicks and a larger body'' is never given a ratio.'
- How early in the higher-timeframe candle the wick must form is not stated in this unit (other
  units require it early).
- The supporting timeframe used for the CISD varies with the higher timeframe (hourly under
  the daily, 15-minute under the 4-hour) without a stated pairing rule.
- No cut-off time is given after which an unformed wick means the day is skipped.
- The Short does not state which lower timeframe the confirming CISD is read on.
- Early into the candle versus midway through it is never quantified as a fraction of the
  candle time or range.
- Shallow reach is judged visually against the candle body with no numeric threshold.
