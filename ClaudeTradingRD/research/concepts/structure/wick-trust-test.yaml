id: wick-trust-test
name: Let the Wick Form, Trade the Body
variants:
  name:
  - Let the Wick Form, Trade the Body (Wick Trust Test)
  definition:
  - 'This unit supplies the confirmation half of the test in unusually plain terms: a wick
    is not confirmed by its shape alone. A shallow run above the previous extreme with no
    change in the state of delivery is explicitly shown failing, and he states that without
    the CISD the wick high cannot be confirmed. The second condition is time-of-day rather
    than shape: the extreme should form early in, or before, the New York session so that
    New York is left to expand.'
  - 'Stated in the top-down video as the whole content of the 4-hour slot when a directional
    week is anticipated: what he is focused on is letting the wick form in the higher-timeframe
    candle, because an expansion candle will have small wicks and a larger body - so once
    the wick has formed he can trade the body, from the extreme to the close. What makes the
    wick trustworthy is named explicitly and mechanically: the change in the state of delivery
    on the supporting timeframe is what confirms the wick has formed.'
  - SHORTS EVIDENCE, stated as an ordering rule. Once a daily bias exists, the open-high-low-close
    of the daily candle is the most important thing, because a bullish day must open, form
    its LOW first, and only then expand to its high and close. The practical instruction is
    therefore to wait for the candle to build its opposing wick - confirmed by a change in
    the state of delivery at the extreme - and to trade only the body that follows.
  - 'The model reduced to one operation: wait until the higher-timeframe candle''s wick can
    be trusted as complete, then trade the body of that candle away from it. The decidable
    test is whether price returning through the extreme would still leave the idea valid.
    If it would, the wick is not formed and the extreme cannot be used as a stop; if it would
    not, the extreme is a trusted invalidation.

    '
definition: 'The instruction he asks the viewer to repeat internally, and the operational
  core of the model: do not try to catch the extreme of the higher-timeframe candle; let its
  wick form, confirm the wick with a lower-timeframe protected swing / change in the state
  of delivery, and then trade the body. His stated reason is failure-mode-driven -- trying
  to catch the wick means being continuously stopped out. The same procedure is applied recursively:
  the daily wick is confirmed by the 4-hour, the 4-hour wick by the 15-minute, and so on.'
