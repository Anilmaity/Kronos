id: premium-discount-equilibrium
name: Premium, Discount & Equilibrium
definition: 'A range is drawn from a swing high to a swing low; its 0.5 level is equilibrium.
  Everything above 0.5 is premium, everything below is discount. The purpose is explicitly
  risk-to-reward, not prediction: an entry exactly at equilibrium with the stop at the far
  extreme and the target at the near extreme is 1R by construction, and R:R improves the deeper
  into discount (for longs) or premium (for shorts) the entry sits. Therefore longs are only
  sought at PD arrays in discount and shorts only at PD arrays in premium. Ranges are nested
  and expanding: while a new extreme is still forming, the range is re-anchored bar by bar,
  and each new leg creates an additional coexisting range.

  '
variants:
  definition:
  - Used in this unit as a quality filter on the structure points themselves rather than only
    on entries. When looking for the higher low that continues an uptrend he says he ideally
    likes to see it in discount, and this is where he uses discount and premium; conversely
    he declines to be interested in a lower high in a downtrend because of premium and discount,
    saying he would like to see a premium array instead. The top-down video applies the same
    test to an entry level, noting approvingly that price is back into the discount of the
    range when the closure arrives.
category: structure
status: contested
aliases:
- discount and premium
- equilibrium
- the 0.5
- dealing range
- premium array
- discount of this range
preconditions:
- A swing high and a swing low defining 'the most prominent range in this area'.
- A range with a defined high and low, so equilibrium can be marked.
detection_rules:
- equilibrium := (range_high + range_low) / 2.
- premium := price > equilibrium; discount := price < equilibrium.
- While price is making new highs and no swing high has been confirmed, re-anchor range_high
  to the running high each bar (the range expands).
- When a new leg forms after a new swing point, create a NEW range; multiple ranges coexist
  and are evaluated separately.
- 'Filter: take long PD-array entries only below equilibrium; short PD-array entries only
  above equilibrium.'
- Also used with a displacement range (the impulse leg) as the anchor rather than a classic
  swing pair.
- For a bullish continuation, prefer the higher low to form in the discount of the current
  range.
- For a bearish continuation, prefer the lower high to form in premium - a lower high sitting
  in discount is explicitly of less interest.
- 'The same test is applied to the entry level itself: an entry closure taken back inside
  the discount of the range is treated as better.'
invalidation:
- A new swing extreme re-anchors the range, moving equilibrium.
- Not applicable - this is a preference filter.
measurable:
- R:R distribution of entries by decile of range position (the video's 3.43R at OTE vs 1.6R
  at equilibrium is the claim to test)
- hit rate of discount-only longs vs all longs on the same signal set
- outcome of continuations whose pullback point sits in discount vs at or above equilibrium
- share of his marked structure points that satisfy the premium/discount preference
