ambiguities:
- Selecting the most prominent range in the area is discretionary and has no algorithm; the
  speaker concedes the nesting gets confusing.
- No precedence rule when nested ranges disagree about premium vs discount.
- Wick-to-wick versus body-to-body anchoring is not stated.
- Fib tool and Gann box are treated as interchangeable, implying only the 0.5 matters.
- Stated as a preference ('ideally', 'not as interested'), never as a hard filter - he still
  marks and follows structure points that fail it.
- Which range the premium/discount is measured against is not restated in these videos; on
  a nested chart the answer changes the verdict.
