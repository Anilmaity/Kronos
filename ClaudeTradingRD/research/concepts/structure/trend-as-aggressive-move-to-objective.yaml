  quote: when price is trending, you're likely going to have very wide stops
ambiguities:
- '''Aggressive'' is the entire content of the definition and is never quantified anywhere
  in this unit - no ATR multiple, no body/range ratio, no candle count. This is the same blocking
  term the library already flags on box-setup and the expansion concepts.'
- '''Not many pullbacks'' is not turned into a count or a depth.'
- Whether the objective must be on a specific timeframe is not stated; 4-hour and daily are
  the examples.
