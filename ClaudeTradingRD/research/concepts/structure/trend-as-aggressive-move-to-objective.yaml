id: trend-as-aggressive-move-to-objective
name: Trend Defined As An Aggressive Move Toward An Objective
definition: His own definition of trend, given as the opening statement of the trend-entry
  video and different from the structural (higher-high / higher-low) and the previous-day-extreme
  definitions the corpus carries elsewhere. A trend is an AGGRESSIVE MOVE REACHING TOWARDS
  AN OBJECTIVE - the objective being a marked higher-timeframe point of interest such as a
  4-hour or daily order block. The corollary he states is that in a genuine trend you do not
  want to see many pullbacks, which is precisely why the normal retracement entries (fair
  value gaps, OTE) are unavailable and the mitigation-block family of entries is used instead.
category: structure
status: underspecified
aliases:
- how I define trend
preconditions:
- A higher-timeframe objective (order block, point of interest, liquidity pool) has been marked.
detection_rules:
- Identify a marked HTF objective - e.g. a 4-hour order block above, a daily order block below.
- Trend := price moving aggressively toward that objective.
- Expect few pullbacks; many/deep pullbacks argue against treating the move as a trend.
- 'Consequence: do not take entries directly off fair value gaps in a trend - the stops are
  too wide; drop timeframes instead.'
invalidation:
- Price stops reaching for the objective, or begins retracing deeply and repeatedly.
measurable:
- distribution of pullback depth inside moves he labels trends vs moves he does not
- stop width of an FVG entry vs a LTF entry on the same trend leg (he cites 16 points vs 4
  points in one case)
sources:
- video_id: NgFIza9qsGQ
  title: Finding Entries Into Trend - ICT Concepts
  quote: the way I define trend is an aggressive move reaching towards an objective
