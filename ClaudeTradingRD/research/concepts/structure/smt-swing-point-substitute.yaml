ambiguities:
- No rule for which correlated asset is authoritative when two disagree.
- How close the failure swing must be to the correlated asset's swept level is not stated.
- Which correlated asset is authoritative is not specified in this unit beyond ES/NQ/YM and
  CL/RB examples.
- Whether the SMT must be on the exact same candle as the would-be sweep is not stated.
- SMT is never defined in this unit; it is assumed knowledge from other playlists in the corpus.
- The correlated instrument is unnamed in almost every use. The Intraweek Reversal video refers
  to it only as 'RB', which the transcript never expands and which is not verifiable without
  the chart, so it is left unidentified here rather than guessed. ES and NQ are named once,
  in the final Thursday Counter example.
- No rule is given for how to choose the correlated instrument for a given traded instrument.
- Whether the divergence must be on the same timeframe as the candidate candle is not stated.
- The interaction between the SMT substitution and the usual hourly-CISD requirement is not
  spelled out - in the Thursday Counter reversal-day case it is unclear whether the CISD is
  still required or whether SMT plus a small wick replaces it.
- Status is underspecified because the divergence test itself is never stated in this unit.
- The correlated asset is unnamed in the breaker examples; only the Twitter-model video names
  specific pairs.
- No tolerance is given for how closely the two assets' structures must correspond for an
  SMT to count.
- He calls the substitution 'a little bit more discretionary', so it is not mechanically decidable
  as stated.
