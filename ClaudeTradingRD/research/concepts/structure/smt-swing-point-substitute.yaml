id: smt-swing-point-substitute
name: SMT As A Swing Point Substitute
definition: 'Where the model requires a liquidity sweep to validate a swing point or a protected
  swing, an SMT can stand in for it. If this asset did not run out the high/low but a correlated
  asset did, the level is treated as if it had been swept: the opposing candles that made
  the failure swing are used as the series to close through, and the resulting extreme is
  treated as protected. This is stated for consolidations (the manipulation requirement),
  for protected swings, and for targets (a target counts as hit if the correlated asset took
  it).'
variants:
  definition:
  - 'SMT against a correlated asset is allowed to REPLACE the sweep requirement in two places
    in this unit, which is a stronger claim than ''SMT is confluence''. (1) For a continuation
    order block: normally price must sweep a low or reach a fair value gap before an opposing
    candle counts -- but if the correlated asset swept and this one did not, the opposing
    candle is accepted anyway. (2) At a swing point: when a low is expected to hold and price
    does not reach it, an SMT with the correlated asset means the low no longer needs to be
    taken, and the closure through the opposing candles is accepted as confirmation.'
  - 'Within this series SMT (a divergence against a correlated instrument) is used not as
    a standalone setup but as a licence to treat a day as a swing point when the daily candle
    alone does not earn it. Two distinct uses appear. First, substitution: a day that takes
    out the previous day''s low and closes above it, with an SMT present, may be treated as
    a candle 2 closure or a swing point even though it is not sitting at a point of interest
    - explicitly relaxing the usual point-of-interest requirement. Second, escalation: in
    the Thursday Counter profile, an SMT off the previous day''s high or low is what upgrades
    the reversal day from wait-for-the-continuation to tradeable on the day itself, provided
    the wick is small. SMT is also cited simply as added confluence at a confirmed weekly
    extreme.

    '
  - The one sanctioned exception to the requirement that a low must actually be swept before
    a continuation structure counts. Asked directly whether the low always has to be taken
    out, he answers yes - unless it is paired with an SMT. When the correlated asset HAS formed
    the structure and this one has not, the unswept low is treated as protected and the setup
    is traded as if the breaker had formed, with the stop on that low. He flags the substitution
    as more discretionary than the rest, because what forms is not a true breaker.
category: structure
status: contested
aliases:
- SMT in place of the sweep
