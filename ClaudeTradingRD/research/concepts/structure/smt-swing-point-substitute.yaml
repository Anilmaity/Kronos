preconditions:
- A named correlated asset is being watched (ES/NQ/YM; gold vs gold-euro/gold-pound; EU/GU
  vs DXY).
- A correlated asset is being charted alongside.
- An existing directional model.
- A correlated instrument is being watched alongside the traded instrument.
- A candidate swing point or reversal day exists on the traded instrument.
- A correlated asset is being watched alongside the traded one.
detection_rules:
- This asset fails to take out the relevant high/low; the correlated asset does take it out.
- 'Treat the level as manipulated: use the opposing candles that made the failure swing as
  the series to close through.'
- Once closed over, the extreme is protected exactly as if the sweep had occurred here.
- 'Target variant: a target is treated as reached when the correlated asset takes it out.'
- Identify the level one asset takes and the other does not -- that divergence is the SMT.
- 'Continuation case: accept an opposing candle / order block as valid without its own sweep
  or fair value gap tag, provided SMT is present.'
- 'Swing-point case: when the anticipated low is not reached but SMT forms, stop requiring
  the low to be taken and look for the close through the opposing candles instead.'
- Still require the closure through the series -- SMT waives the sweep, not the confirmation.
- At the candidate extreme, compare the traded instrument against the correlated instrument
  at the same time.
- SMT is present when one makes the new extreme (or reaches the point of interest) and the
  other does not.
- With SMT present, a day that sweeps the previous day's extreme and closes back may be treated
  as a candle 2 closure / swing point even if it is not at a point of interest.
- In a Thursday Counter, an SMT off the previous day's high or low, combined with a small
  wick, permits trading the reversal day itself rather than waiting for the Friday continuation.
- 'Default: the low (or high) must be swept for the continuation structure to be valid.'
- 'Exception: if an SMT exists at that low - the correlated asset made the corresponding structure
  and this one did not - treat the low as protected.'
- Under the exception, mark the up-close candles as the breaker once price closes through
  them and place the stop on the unswept low.
invalidation:
- The correlated asset that swept fails to reverse.
- Both assets take the level -- there is no divergence and the ordinary sweep requirement
  applies.
- Not stated. The videos give no condition under which an observed SMT is discarded; in one
  Consolidation Reversal example an SMT appears on a low that is briefly taken out, and the
  trade still works, so SMT is not used as an invalidation signal.
- Price trading below the low that was treated as protected.
measurable:
- hit rate of SMT-substituted protected swings vs swept ones
- how often the SMT-hit-target rule would have closed a trade early
- share of continuation entries admitted only via the SMT waiver
- hit rate of SMT-waived entries vs ordinary swept entries
- frequency of SMT at confirmed weekly extremes versus at failed candidates
- outcome of reversal-day entries taken with SMT versus continuation-day entries taken without
- how often the SMT-substituted swing point (not at a point of interest) holds
- outcome of SMT-substituted continuations vs genuinely swept ones
- frequency of the substitution being available per session
