execution:
  bias: Direction of the displacement.
  entry: PD array inside the discount (long) / premium (short) of the leg, ideally in the
    OTE.
  stop: Below the low that anchors the leg or below the entry PD array.
  targets:
  - The high the leg reached
  - The next liquidity beyond it
