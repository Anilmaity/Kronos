  quote: we do want to have that in a discount of the displacement range
ambiguities:
- '''Aggressive price action moves over structure'' - aggressive is undefined, so which legs
  qualify is a judgement call.'
- The trailing of the high anchor has no stop condition; the leg is re-anchored 'as it continues
  higher' by eye.
- Whether the structural break must CLOSE beyond the swing is not stated.
