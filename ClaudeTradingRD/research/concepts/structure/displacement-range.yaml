id: displacement-range
name: Displacement Range
definition: 'Explicitly distinguished from the dealing range and defined as the aggressive
  price-action move that goes OVER STRUCTURE. Its anchors are stated precisely: the low that
  STARTED the move and that broke the opposing structure, up to the high the move reaches
  - and the high anchor is TRAILED upward as the move extends. The range is used for premium/discount
  refinement and for the OTE: after a displacement leg he wants a retracement into the discount
  of that leg (mirrored for shorts) before continuing. Confluence is when the retracement
  is in the discount of BOTH the displacement range and the wider dealing range, ideally with
  a PD array sitting there.'
category: structure
status: specified
aliases:
- displacement leg
- the displacement range
preconditions:
- A structural break has occurred (an opposing swing has been broken with an aggressive move).
detection_rules:
- Identify the aggressive move that broke structure.
- Anchor the fib at the low that STARTED that move (the one that broke the structure) and
  at the high it reaches.
- Trail the high anchor upward as the move extends; mirror for bearish.
- For longs, look only below the 0.5 of the displacement range; for shorts only above it.
- 'Best case: the level is in the discount of the displacement range AND the discount of the
  dealing range AND is a PD array (order block / fair value gap).'
- If price never retraces into that half before continuing, the setup is skipped - he shows
  one such rejection explicitly.
invalidation:
- Price continues away without ever retracing past the 0.5 of the leg (no entry).
- A new displacement leg supersedes the old one.
measurable:
- retracement-depth distribution of displacement legs (how often 0.5 / 0.62 / 0.79 is reached)
- hit rate when displacement-range discount and dealing-range discount agree vs when only
  one does
