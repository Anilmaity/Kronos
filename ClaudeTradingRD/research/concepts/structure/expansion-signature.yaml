ambiguities:
- '''Shallow'' is never quantified. No percentage-of-leg, ATR multiple or fib level is given
  for the maximum counter-trend depth that still counts as expansion.'
- '''One-sided trending move'' has no bar-count or net-displacement threshold.'
- The '3 days of expansion' stand-aside is stated as 'generally', and one example counts two
  large days as sufficient - so the count itself is soft.
- The guest reading of this concept (t_talks_02, GxTradez) is compatible but adds an upper-half-EQ
  mechanisation that TTrades does not state here.
- '''Aggressive'' and ''very shallow'' are both used inside the definition and neither is
  quantified.'
- '''Small range'' and ''large range'' are relative terms with no reference period.'
- '''Important level'' is given only as ''generally a fair value up'' (captions: ''gap'').'
- '''Small wick'' and ''shallow retracement'' are never given numeric thresholds; the upper-half-EQ
  rule is the only partial mechanisation offered.'
