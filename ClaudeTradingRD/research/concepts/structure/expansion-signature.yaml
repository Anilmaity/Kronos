id: expansion-signature
name: Expansion Signature
definition: 'PRIMARY-SOURCE READING (this unit): expansion is a one-sided trending move whose
  signature is very shallow moves against the trend. Expansion is expected after a consolidation
  or after a retracement - the market cycles large range, small range, large range. Inside
  an expansion you do not wait for a deep retracement into discount; you look for the opposing
  candles (down-close candles in a bull leg, up-close candles in a bear leg) to support price,
  and you take protected swings as they form. Three days of expansion, or expansion into an
  already-hit objective, is the stated point to stop seeking continuation.'
variants:
  definition:
  - 'A 39-second Short gives a complete three-part statement of expansion: what it is, when
    to expect it, and how to interact with it. It is a one-sided aggressive move with very
    shallow retracements, if any at all. It is expected to follow a consolidation or a retracement,
    on the stated ground that small ranges lead to large ranges and large ranges lead to small
    ranges. To participate, wait for price to retrace into an important level (generally a
    fair value gap), require a close over the series of down-closed candles, and only then
    is there an invalidation to place a stop against and a trade to take.

    '
  - 'The set of observable characteristics that identify price as being inside an expansion
    phase, and therefore tradeable. The candle carries a small wick; its body is made up of
    lower-timeframe expansion; opposing candles support price toward the internal or external
    range liquidity objective; lows are rejected and highs are displaced through; and the
    retracements on the way to the objective are shallow.

    '
category: structure
status: contested
aliases:
- one-sided trending move
- large range
- trading within an expansion candle
preconditions:
- An objective / draw on liquidity is open in the direction of the move.
- An objective (internal or external range liquidity) has been identified.
detection_rules:
- 'The move is one-sided: a sequence of same-direction candles making a large range.'
- Counter-trend moves within it are shallow - price does not retrace into a discount of the
  leg to continue.
- The candle carries a small wick and a large body (see small-wick-expansion-rule).
- The prior phase was a consolidation or a retracement (small range).
- 'Continuation entries are taken at opposing candles: price reaches a PD array, then closes
  through the series of opposing candles into it, forming a new protected swing.'
- 'Stand-aside rule: after three days of expansion, or after expansion into an objective,
  do not seek a further continuation - a new phase of price is due.'
- Expansion = a one-sided move whose counter-trend retracements are very shallow or absent.
- Expect expansion after a consolidation or a retracement (small range -> large range -> small
  range).
- Do not enter into the expansion itself; wait for a retracement into an important level,
  generally a fair value gap.
- Require a close over the series of down-closed candles at that level to create the invalidation.
- Take the entry only once that protected low exists.
- Working candle has a small wick relative to its body.
- Lower-timeframe delivery inside the candle is itself expansion, forming the body.
- Opposing candles hold and support continuation toward the objective.
- Prior lows are rejected; prior highs are displaced through (bullish case).
- Retracements toward the objective are shallow, not deep.
invalidation:
- A deep retracement rather than a shallow one.
- Expansion met with expansion in the opposite direction (that is a reversal).
- A deep rather than shallow retracement.
- No close over the opposing candles at the level.
- A deep retracement occurs on the way to the objective.
- The candle prints a large opposing wick.
measurable:
- distribution of counter-trend retracement depth inside legs labelled expansion
- forward return after the 3rd consecutive expansion day vs after the 1st
- wick-to-body ratio distribution of candles called expansion candles
- retracement depth distribution within moves classified as expansion
- frequency of expansion following consolidation vs following retracement
- wick-to-body ratio distribution of candles classified as expansion
- maximum adverse retracement depth within expansion legs
