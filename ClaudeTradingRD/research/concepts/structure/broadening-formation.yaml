ambiguities:
- 'EVOLUTION, NOT CONTRADICTION: this earlier recording is framed as ''Strat + ICT part 1''
  and defines the formation as one high taking out another. The later Tjk9bXERZy0 reframes
  it as constant range expansion, adds the outside-bar higher-timeframe identity, the two
  drawing methods, four pairings, and the Seek & Destroy session-nesting layer - none of which
  appear here. Both preserved.'
- '''Range bound'' is the entry trigger and is never bounded.'
- The formations nest; no rule selects the operative one.
- Auto-caption renders 'broadening formation' as 'broading formation' / 'broad information'
  throughout.
- Broadening formations nest inside broadening formations at every scale; no rule selects
  which one is operative.
- Whether to use bodies or wicks for the initial range is stated as optional ('I can use the
  bodies or the Wicks').
- '''Fail to break out'' is again the unquantified displacement judgement.'
- Which bar to anchor the formation to is chosen by eye; no rule selects the starting bar.
- '''Stuck inside'' has no quantitative definition (how many bars, how much of the range).'
- The auto-captions render 'broadening formation' as 'broad information', 'Browning formation',
  'brown information' and 'routing formation', and 'the tri(angle)' as 'the try' / 'the tribe'
  / 'the trial' throughout - the concept is unmistakable from the drawn examples but no phrasing
  here is reliable.
- '''Took'' the range high/low is not resolved into wick-through versus close-beyond.'
- No minimum number of alternations is given before the structure counts as broadening.
- 'TRANSCRIPT ARTIFACT: the auto-captions render ''broadening'' as ''broading'' and ''groin''
  in places.'
- How many broadening legs are required before expansion is expected is not stated.
