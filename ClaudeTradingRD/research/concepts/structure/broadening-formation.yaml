id: broadening-formation
name: Broadening Formation
variants:
  name:
  - Broadening Formation (as a higher-timeframe outside bar)
  definition:
  - 'A pattern in which price is constantly expanding: starting from a range, price takes
    one side, fails to break out, trades back through the range and takes the other side,
    and repeats — ending with a larger range than it started with. On a higher timeframe the
    same structure resolves into an OUTSIDE BAR, because that candle took both the range high
    and the range low.'
  - 'In TheSTRAT a broadening formation is NOT a chart pattern to be recognised by eye - it
    is the drawn representation of a higher-timeframe OUTSIDE BAR. When a run of candles has
    collectively taken out both the high and the low of the bars to their left, those bars
    would be a single 3 (outside bar) if compressed onto a higher timeframe, and the guest
    draws that fact as an expanding wedge by connecting successive highs and successive lows.
    He says explicitly that you draw it because your broker will not show you it - the timeframe
    on which it would be one candle may be arbitrary (his example: ''some wonky time frame
    like a two and a half day chart''). The formation is redrawn (widened) every time a new
    extreme prints, and a NEW formation is started whenever price gets stuck inside the current
    one.'
  - 'SHORTS EVIDENCE for both the fractal equivalence and the drawing procedure. The equivalence
    is stated flatly: a broadening formation on a higher timeframe will be an OUTSIDE BAR,
    because that candle took both the range high and the range low - so a daily candle that
    takes both the previous day high and the previous day low IS a broadening formation one
    timeframe down. The drawing procedure is given as the method most people succeed with:
    draw buyside and sellside liquidity; when one side of the range is taken, connect and
    EXTEND those lines out; repeat as each side is taken in turn.'
  - 'A price structure in which a range is repeatedly extended: mark the range high and low,
    price takes out one side making a new wider range, falls back inside, then broadens again
    on the other side. He describes it equivalently as successive liquidity sweeps, and says
    it generally occurs during consolidation and precedes expansion away from the structure.

    '
definition: 'EARLIER RECORDING, and the FIRST HALF OF A TWO-PART ''STRAT + ICT'' SERIES -
  a framing that does not survive into the later re-recording, which reframes the same pattern
  as ICT Seek & Destroy. The definition given here is minimal and mechanical: a broadening
  formation is simply ONE HIGH TAKING OUT ANOTHER HIGH (and, mirrored, one low taking out
  another low), with the lines drawn between the taking high and the taken high. The trigger
  to start looking for one is a RANGE-BOUND market, on the reasoning that a consolidation
  must eventually expand. The directional read is the same as the later version - a failed
  side implies rotation to the other side - and the trade is then a lower-timeframe break
  of structure with a fair value gap in the discount of the displacement range.'
category: structure
status: contested
aliases:
- broadening information
- broad informations
- megaphone pattern
- the try
- the tri
- compound three
- compound outside bar
- broadening range
preconditions:
- Price has become range-bound after a move.
- A range or consolidation exists.
- A reference candle (or bar group) whose high and low have both since been exceeded.
- A range with a marked high and low exists.
- A defined range with a marked high and low exists.
detection_rules:
- Wait for a range-bound stretch; only then look for the formation.
- Mark a high and a low bounding the range.
- When a later high takes out that high, draw the upper broadening line between them; same
  for lows.
- Extend the lines as further extremes are taken.
- When one side is run and fails, expect rotation to the other side of the range.
- 'Trade it on a lower timeframe: wait for a break of structure in the new direction, take
  a fair value gap that sits in the DISCOUNT of that displacement range, stop beyond the extreme.'
- First partial at the opposing short-term liquidity.
- Mark buyside and sellside liquidity on both sides of the initial range.
- When one side is taken, extend that line out.
- When price trades back through and takes the other side, extend that line to the new extreme.
- Repeat; the two diverging lines are the broadening formation.
- 'Alternative construction: from a given high and low, look left and connect the highs/lows
  each of them took out.'
- 'Higher-timeframe equivalent: a candle that takes both the previous range high and range
  low — an outside bar.'
- 'Directional read: if price fails to break out of one side, expect it to trade back through
  to the other side.'
- Find a bar whose high has since been exceeded AND whose low has since been exceeded by the
  bars to its right - those bars are a compound 3 relative to it.
- Draw the upper boundary through the successive higher highs and the lower boundary through
  the successive lower lows.
- Redraw (extend) the boundary the moment a new high or new low prints, because you now have
  more information.
- When price fails to take either boundary and gets stuck inside, terminate that formation
  and begin a new one from the stuck range.
- Failing one side of the formation and reversing back in means the other side is the objective.
- Once price is outside the formation and stays outside, expect expansion toward the next
  pivot target.
- When one side is taken, connect the relevant points and extend the line out.
- Repeat as price alternates sides; the two diverging lines are the formation.
- 'HTF equivalence: an outside bar (took both the previous candle''s high and low) IS the
  broadening formation on the timeframe below.'
- 'Daily application: previous day high AND previous day low both taken -> broadening formation.'
- 'Directional read: failure to break out of one side implies a trade back through to the
  other side.'
- Price trades beyond the range extreme, establishing a wider range.
- Price returns inside the range.
- Price then trades beyond the opposite extreme, widening the range again.
invalidation:
- The run of the side is followed by continuation rather than failure.
- A genuine breakout — the broken side becomes support/resistance and price continues away.
- Price gets stuck inside without taking either side - the formation stops being tradeable
  and a new, smaller one starts.
- Price expands away from the structure and does not return inside.
measurable:
- share of range-bound stretches that produce a broadening formation
- hit rate of the rotation-to-the-other-side read after a failed run
- frequency of outside-bar days on the daily
- rotation completion rate after a failed breakout of one side
- hit rate of the opposite boundary after a failed boundary + reversal
- how often a formation is re-drawn before it resolves
- return of trades taken while price is stuck inside vs outside
- frequency of consecutive outside bars on the daily
- share of broadening-range sides that fail to break out and rotate back through
- frequency of broadening sequences preceding directional expansion
