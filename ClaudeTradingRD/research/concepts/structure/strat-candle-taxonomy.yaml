id: strat-candle-taxonomy
name: TheSTRAT Candle Taxonomy (1 / 2 / 3)
definition: 'TheSTRAT (Rob Smith''s method, presented here by the guest) classifies every
  candle by what it did to the PREVIOUS candle''s high and low, and asserts there are exactly
  three possibilities. A 1 is an inside bar: it took neither the previous high nor the previous
  low, and is by definition a consolidation. A 2 takes exactly one side - a 2-up takes the
  previous high only, a 2-down takes the previous low only - and is by definition directional/trending.
  A 3 is an outside bar: it takes BOTH the previous high and the previous low; the guest describes
  it as ''a candle that went 2 and failed'', typically failing near the beginning of the candle,
  which he maps onto ICT manipulation.'
category: structure
status: specified
aliases:
- ones twos and threes
- inside bar
- two up / two down
- outside bar
preconditions:
- A completed previous candle on the same timeframe, with a defined high and low.
detection_rules:
- '1 (inside bar): high <= prev.high AND low >= prev.low.'
- '2-up: high > prev.high AND low >= prev.low.'
- '2-down: low < prev.low AND high <= prev.high.'
- '3 (outside bar): high > prev.high AND low < prev.low.'
- A 2 frequently opens as a 1 and then 'triggers' to a 2 intrabar; a gap can open it directly
  as a 2.
- From a 2, the only further state change available within the same candle is a 3.
invalidation:
- The classification is fixed once the candle closes; it is never re-labelled.
measurable:
- frequency of 1 / 2 / 3 per timeframe per month
- forward return of a 2 vs a 1 on the same timeframe
- how often a 3 forms its failure in the first third of the candle (the guest's 'near the
  beginning' claim)
