ambiguities:
- 'Equal highs / equal lows are never addressed: whether high == prev.high counts as taking
  it is not stated.'
- '''Near the beginning of that candle'' (where a 3 does its failing) is given as a tendency,
  never as a threshold.'
- The guest maps a 3 onto ICT 'manipulation' in passing; he does not claim they are the same
  object.
