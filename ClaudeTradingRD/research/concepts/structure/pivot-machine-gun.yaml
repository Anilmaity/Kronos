id: pivot-machine-gun
name: Pivot Machine Gun (five or more consecutive same-direction 2s)
definition: 'A named condition from the guest''s team (attributed to his partner Sarah): five
  or more consecutive candles that are all 2s in the same direction, each taking the previous
  candle''s extreme. The stack of pivots this leaves behind is read as a record of who bought
  (or sold) all the way up, so when direction reverses and price starts taking those pivots
  back out, those participants exit and add supply - which removes liquidity and accelerates
  the move back through the previous range.'
category: structure
status: specified
aliases:
- machine gun
- stacked pivots
preconditions:
- A sequence of same-direction 2s on a single timeframe.
detection_rules:
- Count consecutive candles that are 2-up (or all 2-down) on the same timeframe.
- Five or more in a row qualifies as a pivot machine gun (his partner's stated rule).
- Each such candle's extreme is a pivot target for the eventual move back the other way.
- Once the direction flips and price begins taking those pivots out, expect acceleration rather
  than support.
invalidation:
- A 1 or a 3 interrupting the sequence resets the count.
measurable:
- distribution of consecutive same-direction 2 run lengths
- speed / range of the retrace through a >=5 pivot stack vs a shorter one
sources:
