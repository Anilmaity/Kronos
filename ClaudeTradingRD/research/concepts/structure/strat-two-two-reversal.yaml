ambiguities:
- The STRAT numeric candle classification (1 = inside bar, 2 = directional, 3 = outside bar)
  is never stated on air in this unit, so the pattern is only identifiable descriptively.
- '''Fails'' is not defined for the middle candle of the 1-2-2.'
- 'SPEAKER ATTRIBUTION: the transcript carries no speaker labels. This answer is assigned
  to the host because he is driving the chart, answering the chat, and the guest in that stream
  does not trade TheSTRAT - but the assignment is an inference, not a certainty.'
