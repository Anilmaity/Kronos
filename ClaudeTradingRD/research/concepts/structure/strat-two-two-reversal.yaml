id: strat-two-two-reversal
name: STRAT 1-2-2 / 2-2 Reversal, Only With A Higher-Timeframe Reason
definition: 'Asked which STRAT pattern combines best with ICT, the host names the 1-2-2 reversal
  and immediately reduces it to something the corpus already carries - a consolidation, then
  a directional candle one way that fails, then a directional candle back the other way, which
  he says is what a broadening formation is anyway. The practical form given is a 2-2 reversal
  occurring after a liquidity run: run the structure, get the 2-2 reversal, trade it toward
  the opposing highs. He attaches a hard condition - never take a STRAT entry on its own,
  there must be a higher-timeframe reason, ''like almost every strategy''. His backtesting
  suggestion states the same shape in candle terms: after a liquidity run, look for hammers
  off lows and shooters off highs, ideally at the edge of a broadening formation.'
category: structure
status: underspecified
aliases:
- one two two reversal
- two two reversal
- hammers and shooters
preconditions:
- A prior high or low has been run (liquidity taken).
detection_rules:
- Require a liquidity run first - a prior high or low taken.
- '1-2-2: a consolidation, then a directional candle that fails, then a directional candle
  the other way.'
- '2-2 reversal: a directional candle in one direction immediately followed by one in the
  other.'
- 'Equivalent candle form: a hammer off a low or a shooter off a high, ideally at the edge
  of a broadening formation.'
- Never take the pattern on its own - a higher-timeframe reason is required.
invalidation:
- The reversal candle's extreme is taken out in the original direction.
measurable:
- hit rate of 2-2 reversals with vs without a preceding liquidity run
- hit rate at broadening-formation edges vs mid-range
sources:
