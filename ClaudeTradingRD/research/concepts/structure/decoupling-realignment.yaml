id: decoupling-realignment
name: Decoupled Correlated Indices Must Come Back Into Alignment
definition: 'Asked why he says NQ and ES ''have to come back in line'', he rejects the framing:
  it is not that one must return to the other, it is that correlated markets cannot all go
  different directions, so one is ''lying'' and must reverse, which releases the other to
  continue. Worked example (morning session): NQ higher, YM lower, ES in between; YM formed
  a small reversal, which let NQ finish its highs; then NQ reversed off the highs, which allowed
  YM to continue trending lower.'
variants:
  definition:
  - 'When correlated indices decouple - one strongly directional while the others are flat
    or opposite - the divergence is read as one of them ''lying''. The expectation is that
    alignment is restored, and the tradeable question is which asset does the restoring: either
    the laggard catches up or the leader gives back. In the worked example YM was sharply
    bullish while NQ and ES were flat; the next session YM was the asset that came back, and
    its resolution target was the previous day''s low.'
category: structure
status: contested
preconditions:
- NQ, ES, YM moving in different directions intraday.
- Two or more correlated indices (ES, NQ, YM) charted together.
- A visible divergence in daily direction or percent change between them.
detection_rules:
- Identify the triad divergence (one up, one down).
- 'Two resolutions only: the weak one reverses and the strong one continues, or the strong
  one reverses and the weak one continues.'
- A reversal in one asset is read as permission for the other's continuation, in sequence.
- 'Identify the decoupled pair: one index strongly directional, the other(s) flat or opposite
  on the day.'
- 'State the two ways alignment can be restored: the laggard expands to catch up, or the leader
  retraces.'
- Once the realigning asset is identified, its target is the nearest daily level - the previous
  day low / high.
- The realigning asset is also read as the weakest (or strongest) of the set for asset selection.
invalidation:
- n/a
- The divergence widens further rather than closing.
measurable:
- after a triad divergence, frequency that a reversal in one is followed by continuation in
  the other
- frequency with which a decoupled index closes the divergence within N sessions
- which side (leader or laggard) does the realigning
sources:
