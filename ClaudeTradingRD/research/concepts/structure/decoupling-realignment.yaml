  quote: Which one is lying? Because they can't all go different directions
- video_id: xraklBJHW5k
  title: New York Open Live Q&A
  quote: something has to come back into alignment
ambiguities:
- His own words here contradict the library entry's name/quote ('something has to come back
  into alignment' from xraklBJHW5k); he frames it as correlation not alignment - status set
  contested on that wording.
- In the example both resolutions happened in sequence, so the rule does not pick in advance
  which asset reverses.
- No threshold defines 'decoupled' - the example used one index down ~0.63% while the other
  two were roughly flat on the day, but no percentage rule is given.
- No rule decides in advance which of the two assets does the realigning; in the example he
  inferred it after the fact and admitted on stream he mis-framed the trade.
- No time horizon is given for the realignment.
