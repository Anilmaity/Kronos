id: small-wick-supports-expansion
name: Small Wick Supports Expansion
definition: 'Gold example: after a sweep of last Friday''s low and SMT off the daily low,
  the daily is a small-wick reversal, so he expects expansion to the previous day high, noting
  there is enough daily range left and the correlated assets have not taken it yet.'
variants:
  definition:
  - 'Wick size is used as the primary filter for whether a candle is tradeable. A candle whose
    opposing wick is small - price did not trade far from its open before expanding - supports
    expansion and can be traded. A candle with a large opposing wick does not support expansion.
    The distinction produces two named candle types: a "reversal into expansion candle" (small
    wick, tradeable) and a "reversal candle" (large wick, not tradeable on the 4-hour; on
    the daily it is traded only with reduced targets).

    '
category: structure
status: contested
aliases:
- wick size matters
- reversal into expansion candle vs reversal candle
preconditions:
- A candle has closed at or from a key level.
detection_rules:
- Small-wick daily reversal plus remaining daily range -> target previous day high (bullish).
- Measure the opposing wick relative to the candle body / range.
- Small opposing wick -> the candle supports expansion and may be traded.
- Large opposing wick -> the candle does not support expansion; on the 4-hour, wait for the
  next candle open instead.
- On the daily only, a large-wick reversal candle may still be traded with adjusted targets.
invalidation:
- Not applicable - this is a classification filter.
measurable:
- forward expansion distance conditioned on wick-to-range ratio buckets
- win rate of entries inside small-wick vs large-wick candles
sources:
