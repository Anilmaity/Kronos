preconditions:
- A daily candle has closed and is a candidate reversal for a weekly profile.
- A candle has closed on the working timeframe and is a candidate reversal.
- A completed higher-timeframe candle that is a candidate closure for the intended direction.
- A stated directional bias for the following period.
detection_rules:
- 'Bullish candidate: require the sequence open, low, high, close. Reject open, high, low,
  close - that is an expansion candle.'
- 'Bearish candidate: the mirror - reject a candle that opened, made its low first and then
  its high.'
- Prefer a candidate that also forms a protected swing and that sits at a point of interest.
- If the candle is a candle 2 closure on both the bullish and the bearish side, take only
  the side that carries an hourly change in the state of delivery, and additionally wait intraday
  for price to open, make its extreme, and form a new continuation before entering.
- If the candle is only 'reversal looking' and is not a candle 2 closure, do not trade it
  - let the next daily candle close and use that closure plus the hourly CISD as the confirmation
  instead.
- On a candle 2 closure with a large wick, mark 0.5 of the wick as the level price should
  reach and react from.
- 'Shape test: the candle has a large wick and a small body. That is the reversal candle.'
- 'Complement: a small wick with a large body is a directional / expansion candle, not a reversal
  candle.'
- 'Discriminator narrated on the lower timeframe: price opens, makes a large move to its extreme,
  then trades back and closes - the large open-to-extreme leg is what makes it a reversal
  rather than a directional candle.'
- The size of that open-to-extreme leg is judged by the time and the range it consumed.
- 'Consequence: after a reversal candle, do not expect expansion out of it (see large-wick-target-adjustment
  for what to target instead).'
- 'Bearish ideal: the candle closes into its lows. Grade the closure by where in the range
  it sits, not only by its sign.'
- A weak close in the intended direction additionally places opposing candles and a protected
  extreme, so a shallow retracement can be anticipated on the next candle.
- A close that fails the grade does not cancel the bias - it raises the lower-timeframe confirmation
  requirement before any entry.
- A close late in the session against the intended direction is called out specifically as
  degrading the next day's continuation.
- If the candle fails to close beyond the level entirely, treat it as a consolidation instead
  and switch to waiting for the range extreme to be taken.
invalidation:
- The candidate is an opposing expansion candle - do not call the reversal, let another day
  play out.
- 'The additional intraday confirmation fails: price does not respect the area it was required
  to respect.'
- On a monthly-scale candle 2, 50% of the candle stops being respected.
- The candle's open-to-extreme leg is small - it is a directional candle and the reversal
  read does not apply.
- The protected extreme implied by an ideal closure is taken out.
- The additional lower-timeframe confirmation demanded by a degraded closure never appears
  - no trade.
measurable:
- hit rate of open-low-high-close candle 2 closures versus open-high-low-close candles as
  weekly-extreme triggers
- frequency of two-sided candle 2 days and their outcome once filtered by which side carries
  the hourly CISD
- how often the 0.5-of-wick level is reached and reacted from on a large-wick candle 2
- outcome difference when the candle 2 closure also forms a protected swing versus when it
  does not
- wick-to-body ratio on candles he annotates as reversal candles vs directional candles
- forward expansion rate after a large-wick / small-body candle vs after a small-wick / large-body
  candle
- next-period follow-through split by where in the range the closure sits (deciles)
- win rate of entries after an ideal closure vs after a degraded closure with extra confirmation
- how often a degraded closure produces the extra confirmation at all
