id: reversal-candle-quality
name: Candle 2 Closure Quality (reversal candle vs expansion candle)
definition: 'A set of quality tests the speaker applies to a daily candle 2 closure before
  he will trade away from it. The primary test is the candle''s internal sequence: a bullish
  reversal candle should be open-low-high-close, whereas an open-high-low-close candle is
  an expansion candle and is explicitly rejected as a reversal even when it closes in the
  right place. Secondary markers of an ideal candle 2 closure are that it also forms a protected
  swing, and that it sits at a point of interest. Two degraded cases are named and handled:
  a candle that is merely ''reversal looking'' without being a candle 2 closure is not tradeable
  on its own and requires waiting for the next day''s closure; and a candle that is simultaneously
  a bullish and a bearish candle 2 closure is low quality, resolved by taking only the side
  that carries an hourly change in the state of delivery and by demanding additional intraday
  confirmation.

  '
variants:
  definition:
  - 'This unit supplies the shape definition the library previously flagged as missing: a
    reversal candle has a LARGE WICK and a SMALL BODY. He then narrates what that looks like
    a timeframe down - price opens, makes a run in one direction, then trades back and closes
    - and states the discriminator against a directional (expansion) candle: the reversal
    candle made a large move from its open to its extreme, consuming a lot of time and a lot
    of range, and therefore he is not expecting price to expand out of it. This is a shape
    test on the closed candle, complementary to (and stated independently of) the open-low-high-close
    path test recorded in the library from the weekly-profile series.

    '
  - 'The quality grade this unit applies to a higher-timeframe closure, and - unusually -
    what is done with a failing grade. The ideal bearish daily candle closes weakly, into
    its lows; he draws what the candle would have had to look like and says that had it closed
    there, two opposing candles would have been in place, a shallow retracement could be anticipated
    and a protected high would exist. The actual candle closes bullishly and late in the day,
    and he names the consequence rather than abandoning the idea: the setup is now less than
    ideal for a bearish continuation the next day, so if the bearish view is kept, more confirmation
    is required on the lower timeframes before getting short. Quality here is therefore a
    dial on the confirmation requirement, not a binary gate. A second quality input in the
    same walkthrough runs the other way - the candle opened and made its high first, which
    supports the bearish read - so the grade is assembled from several partly conflicting
    signals.

    '
category: structure
status: contested
