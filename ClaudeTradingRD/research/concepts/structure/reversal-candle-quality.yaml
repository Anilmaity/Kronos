ambiguities:
- '''Candle 2 closure'' itself is assumed knowledge from the TTrades Fractal Model playlists;
  its sweep-and-close-back definition is never restated anywhere in this unit, so this entry
  describes quality filters on a term this unit does not define.'
- '''Reversal looking candle'' is treated as categorically different from a candle 2 closure
  and is acted on, but is never defined.'
- The open-low-high-close test is a statement about the intracandle path, which is not recoverable
  from daily OHLC alone - it needs lower-timeframe data or an explicit rule the videos do
  not give.
- '''Somewhat of a bearish expansion candle'' is used to describe a candle 2 closure that
  is accepted anyway with extra hourly confirmation, so the OLHC test is a preference rather
  than a hard filter.'
- 'Wick size thresholds are relative and unquantified: ''larger wick'' triggers the 0.5-of-wick
  marking, and ''small wick'' versus ''large wick'' carry opposite meanings in the Thursday
  Counter video.'
- Status is underspecified because every test in it is comparative or visual rather than numeric.
- '''Large'' and ''small'' are still unquantified - no wick-to-body ratio is given.'
- The Short does not restate the open-low-high-close path test the library holds from the
  weekly-profile series; whether the shape test and the path test are two views of one rule
  or two independent filters is not stated.
- Only the bullish-reversal illustration (run lower, trade higher, close) is narrated; the
  bearish mirror is implied.
- The Short does not say whether the reversal candle must sit at a level or a point of interest,
  a condition every long-form treatment attaches. Do not assume it from the long-form videos
  - this clip omits it.
- Sourced from an ASR (whisper-small) transcript, not YouTube captions; wording may be imprecise.
- '''Weaker'' and ''into the lows'' are not quantified - no fraction of the range is given
  for what counts as a weak close.'
- '''More confirmation on the lower time frames'' is the operative consequence of a degraded
  grade and is never specified: no list of what would satisfy it, and no timeframe.'
- The grade combines a closure signal and a candle-shape signal that point opposite ways in
  this example, with no stated weighting.
