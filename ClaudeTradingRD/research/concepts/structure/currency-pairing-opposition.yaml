ambiguities:
- Strength ranking is done visually from a watchlist; no metric or lookback is specified.
- The correlation groups are given as memorised knowledge without justification.
- '''Clearly strong'' and ''clearly weak'' are eyeballed off the futures chart; no ranking
  measure is given.'
- The transcript renders the GBP futures symbol as '6v1' (i.e. 6B1!).
- This aligns with the channel's own currency-pairing doctrine but is stated independently
  by the guest.
- The five strength categories are icons on a slide with no derivation -- how a currency future
  is graded is never stated.
- The ranking is done off daily candle appearance in the walkthroughs, with no lookback window.
