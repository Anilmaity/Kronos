id: currency-pairing-opposition
name: Pair a Strong Currency Against a Weak One, Never Against a Consolidating One
variants:
  name:
  - Pair A Weak Currency Future Against A Strong One
  definition:
  - 'Rauf''s method for choosing which FX pair or cross to trade: chart the INDIVIDUAL currency
    futures (6E for euro, 6B for sterling, and so on) rather than the pair, rank them for
    strength and weakness, and then match a weak one against a strong one. That combination
    is where a low-resistance liquidity run forms. He applies it live: sterling futures have
    been selling off and are in a deeper discount than the euro, so he will not touch the
    pound and will trade EURUSD instead; and when scanning crosses he rejects the ones whose
    component currencies are merely consolidating.'
  - 'The arithmetic behind pair selection, taught literally as fractions. A forex pair is
    numerator/denominator; raising the numerator or lowering the denominator makes the pair
    bullish, and doing both makes it strongly bullish. The actionable content is the avoidance
    list: pairing strong with strong, or weak with weak, moves both sides of the fraction
    the same way and leaves you with a CONSOLIDATION, not a trend. Pairing anything with a
    consolidating currency gives a trend, but a weak one. The target state is the strongest
    currency against the weakest.'
definition: 'In FX he does all the analysis on the dollar and then pairs it with the counter
  currency that is moving hardest in the opposite direction, because expansion comes from
  pairing opposite directions. Pairing a bullish currency with one that is merely consolidating
  (his example: GBP/JPY when JPY is ranging) is rejected in favour of pairing against a directional
  counterpart (GBP/USD). For SMT he uses memorised correlation groups: GBP with EUR; NZD with
  AUD; JPY, CAD and CHF each treated alone; USD-based pairs use the dollar index as the SMT
  reference.

  '
category: structure
status: contested
aliases:
- comparing currencies
- why euro not pound
- SMT currency groups
- individual currency futures
- low resistance liquidity run pairing
- the fraction rule
- numerator denominator
preconditions:
- A directional read on the dollar exists.
- Individual currency futures charts available (6E, 6B, 6A, 6C, 6N, etc.).
- Currency futures charts for the majors, each classified as strong bullish / bullish / consolidating
  / bearish / strong bearish.
detection_rules:
- Establish the dollar direction from the daily chart.
- Rank the counter currencies by strength and weakness.
- For a bearish dollar, trade the strongest counter currency against it; for a bullish dollar,
  trade the weakest.
- Reject pairs where one leg is consolidating.
- For SMT, compare within the groups GBP-EUR and NZD-AUD; treat JPY, CAD and CHF individually
  and use the dollar index for USD pairs.
- Chart the individual currency futures rather than the cross.
- 'Rank them: which are clearly strong, which are clearly weak, which are consolidating.'
- Trade the weak one against the strong one - that is where the low-resistance liquidity run
  forms.
- Do not trade a cross where neither leg is clearly strong or weak (both consolidating).
- Reject the weakest-of-all leg if it is already in deep discount and prefer the cleaner one.
- 'Avoid: strong + strong, or weak + weak -> the pair consolidates.'
- 'Acceptable but weak: trending currency + consolidating currency -> a trend, but not a strong
  one.'
- 'Target: strongest currency as one leg, weakest as the other -> strong trend.'
- Numerator up + denominator down = strong bullish pair; numerator down + denominator up =
  strong bearish pair.
- When all currencies trend the same way and no opposing leg exists, pair against a consolidating
  one and accept the weaker trend.
invalidation:
- The dollar loses direction, in which case he stays away from FX.
- No currency future shows clear relative strength or weakness - no cross is taken.
- The relative-strength ranking changes -- the pair choice must be redone.
measurable:
- realised range of strong-versus-weak pairings compared with strong-versus-consolidating
  pairings
- realised trend persistence of strong-vs-weak crosses vs consolidating-leg crosses
- run distance to the next external level per pairing class
- realised daily range of pairs selected by this rule vs pairs excluded by it
- frequency of the all-trending-same-way case
