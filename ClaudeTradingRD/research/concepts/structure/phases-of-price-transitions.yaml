ambiguities:
- No threshold separates a retracement from a consolidation at the moment of transition -
  the distinction is made retrospectively.
- '''Expansion met with expansion'' gives no size or speed requirement for the opposing leg.'
- Phase classification depends on the signature definitions, which are partly visual (wick
  size, 'shallow' retracement).
- The framework is credited to the MMXM trader; it is not original to this speaker.
