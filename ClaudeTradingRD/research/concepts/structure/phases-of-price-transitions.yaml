id: phases-of-price-transitions
name: Phases Of Price Delivery - Legal Transitions
definition: 'SHORTS EVIDENCE, delivered as an explicit flowchart with expansion as the fixed
  entry point. Everything begins with expansion; from expansion price can go to a retracement,
  to a consolidation, or straight into an opposing expansion. Expansion -> retracement is
  a CONTINUATION signature. Expansion -> consolidation is AMBIGUOUS and resolves only on what
  the range does: a manipulation of one side is a continuation, a breakout is the other. Expansion
  met with expansion in the OPPOSITE direction is a REVERSAL. The cycle then restarts at expansion.
  The bias-alignment use is shown in a second Short: a framed reversal that contradicts the
  continuation signature is discarded because it is not aligned with the bias.'
variants:
  definition:
  - 'Price delivery is modelled as four phases - consolidation, expansion, retracement, reversal
    - with a closed set of legal transitions. Consolidation can only be followed by expansion.
    Expansion can be followed by retracement, reversal or consolidation. Consolidation can
    never be followed directly by a reversal or by a retracement. Every phase starts and ends
    with expansion. The practical consequence is that the current phase partly determines
    the next: if price expanded and is now consolidating, it must expand again.

    '
category: structure
status: contested
aliases:
- what price can and cannot do
- phases of price
preconditions:
- An expansion leg has printed.
- The current phase on the working timeframe has been classified using its signature.
detection_rules:
- Start from expansion - it is the entry point of the cycle.
- expansion -> retracement := continuation signature; expect the move to continue in the same
  direction.
- expansion -> consolidation := undecided; resolve on whether the range is manipulated (continuation)
  or broken out of.
- expansion -> opposing expansion := reversal.
- After a reversal, restart the cycle at expansion.
- Discard a framed setup whose phase reading contradicts the standing bias.
- 'consolidation -> expansion : legal (and the only legal successor).'
- 'expansion -> retracement | reversal | consolidation : legal.'
- 'consolidation -> reversal : illegal.'
- 'consolidation -> retracement : illegal.'
- A phase sequence always begins and ends with expansion.
invalidation:
- An observed transition from consolidation directly into a reversal would falsify the rule.
measurable:
- empirical transition matrix between the four phases per timeframe
- resolution split of the expansion->consolidation branch (manipulation versus breakout)
- empirical transition matrix between classified phases per timeframe
- frequency of the illegal transitions actually occurring
