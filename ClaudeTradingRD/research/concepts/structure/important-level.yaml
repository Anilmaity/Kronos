id: important-level
name: Important Level / Higher Timeframe PD Array
definition: 'The mandatory context filter for entry patterns in this corpus. An order block,
  breaker or CISD only counts if the candles that form it traded into a pre-identified level
  from a higher timeframe. The speaker is unusually forceful about this: the same candle geometry
  occurring at a random chart location does not qualify as an order block, and he demonstrates
  a losing trade caused by exactly that omission before re-framing the same market from the
  hourly chart and winning.

  '
category: structure
status: underspecified
aliases:
- higher time frame PD array
- point of interest
- HTF level
preconditions:
- A higher timeframe than the execution timeframe has been analysed first.
detection_rules:
- 'For continuation entries the acceptable levels are enumerated exactly: (a) a previous order
  block, (b) a fair value gap, (c) a sweep of a swing low/high.'
- For reversal entries the level is described only as a 'higher timeframe PD array or important
  level'; examples used include an hourly fair value gap, a daily fair value gap, a weekly
  fair value gap, a monthly fair value gap, previous month high, and equal highs/lows.
- 'Test: the candle series forming the entry pattern must have traded INTO the level (touched
  or entered the zone) before the validating close.'
- If no such level exists, reject the pattern.
invalidation:
- The pattern is void without a level, regardless of the candle sequence.
measurable:
- hit rate of order-block entries WITH an HTF level vs WITHOUT (the video's own claim, directly
  testable)
- which level types produce the highest reaction rate
sources:
- video_id: DMUiDBnTYc8
  title: Order Blocks Simplified - ICT Concepts
  quote: the most important part on this slide is waiting for an important level
- video_id: CHIK5oBRKiw
  title: Change In State Of Delivery [CISD] - Orderblock Formation - ICT Concepts
- video_id: bbWPoajy2MY
  title: Mitigation Blocks Simplified - ICT Concepts
ambiguities:
- The list of qualifying levels is closed for continuation entries but explicitly open for
  reversal entries — the single biggest source of discretion in the entry models.
- No rule states WHICH higher timeframe qualifies as 'higher' relative to the execution timeframe
  (examples pair 1H with 5m, 1D with 1H, 1W with 4H).
- '''Traded into'' is not defined as touching the edge, entering by a fraction, or reaching
  the CE.'
