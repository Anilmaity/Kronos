id: relevant-swing-separation
name: Relevant Swings Require Separation
definition: 'Which of several nearby swings counts as the level to trade away from. He compares
  the same structure across two instruments live: on NASDAQ the two lows are 400 points apart,
  which he calls good separation and the more preferred structure; on ES the equivalent lows
  sit close together, which he calls less ideal. Asked why a particular low was marked and
  not one further left, he answers that it is the most relevant low because it has enough
  separation from the next one that one could hold while the other is taken. A high that sits
  right next to another high is dismissed as just a failure swing rather than the relevant
  swing.

  '
variants:
  definition:
  - 'Two Shorts run the separation test as a live filter and add a dynamic that the library
    did not carry: relevance MIGRATES. A swing whose neighbour sits too close is rejected
    on the stated ground that he could not trust himself to trade away from it; only the outer,
    well-separated swing is the relevant one. But once price reaches a swing he had considered
    relevant and fails to reverse off it, that swing loses its status and the next one out
    becomes the relevant high or low. The same test is used in a third Short as the discretionary
    step that removes a mechanically valid but too-close swing point from the chart.

    '
  - 'A drill Short on marking relevant highs and lows. Equal highs / failure swings mark the
    relevant high. For lows, a low qualifies as relevant not by being a failure swing but
    by its SEPARATION from the previous low: with enough separation, price can be expected
    to trade into the area and a reversal there can be trusted, because it is so far away
    from the earlier low. The counter-example is given explicitly - a low sitting close to
    the previous low is not trusted, because there is not enough valid separation to trade
    away from it while leaving the earlier low untaken.'
  - 'A swing high or low is only a relevant level to trade away from if it is meaningfully
    separated from neighbouring swings. When two highs (or two lows) sit close together with
    no separation, there is nothing relevant to trade away from and he loses interest in the
    setup. Equal or near-equal highs left without being swept are read as consolidation rather
    than as a level.

    '
category: structure
status: contested
aliases:
- good separation
- the most relevant low
- no separation between highs
- relevant level
preconditions:
- Two or more same-side swings are candidates for the level being traded away from or toward.
- A chart with prior swing highs and lows to be marked as relevant or not.
- Candidate swing highs or lows have been identified.
detection_rules:
- Compare the candidate swing with the nearest same-side swing.
- If they sit close together, the structure is less ideal and the pair is not a relevant level.
- If they are well separated - 400 points on NASDAQ is the worked example - the outer one
  is the relevant swing.
- 'Separation test stated functionally: one level could hold while price goes to the other.'
- A high or low immediately adjacent to another is classified as a failure swing, not the
  relevant swing.
- For each candidate swing, compare it with the nearest same-side swing.
- Too close together -> not relevant; do not plan to trade away from it.
- Well separated -> relevant; this is the level to trade away from or into.
- If price reaches a relevant swing and does NOT reverse off it, promote the next swing out
  to relevant.
- Track relevant highs and lows forward as new ones form.
- Remove mechanically valid swing points that sit too close to an adjacent swing.
- Equal highs / failure swings mark the relevant high.
- A low is relevant when it has sufficient separation from the previous low.
- With sufficient separation, a reversal formed at that low can be trusted.
- 'A low close to the previous low is rejected: not enough valid separation to trust trading
  away from it without the earlier low being taken.'
- Compare the candidate swing to the nearest same-side swing.
- If the two are close together with no separation, the level is not relevant.
- If the level was reached but not swept (equal highs or lows left), read consolidation and
  require a sweep before framing.
invalidation:
- A sweep of the cluster collapses it into a single relevant swing.
- Price trades through the relevant swing without reacting, which reassigns relevance outward.
- Price takes the earlier low that the untrusted level was meant to leave alone.
- A sweep of the cluster creates a single relevant swing.
measurable:
- follow-through when trading away from well-separated versus tightly-clustered swings
- separation distance normalised by ADR at the moment of the decision
- reaction rate at swings classified relevant vs rejected as too close
- how often relevance migrates outward within the same session
- distribution of separation distances he accepts versus rejects
- reversal hold rate as a function of separation from the prior low
- distance between adjacent same-side swings versus subsequent follow-through when traded
  away from
