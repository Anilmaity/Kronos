ambiguities:
- 400 points on NASDAQ is an instance, not a threshold - it is never normalised by ADR, timeframe
  or instrument, and no minimum is given.
- Separation is judged by eye with a measuring tool on the chart.
- Nothing is said about separation in time (how many candles apart), only in price.
- Separation remains judged visually - neither Short gives a distance, an ATR fraction, or
  a bar count.
- '''Doesn''t reverse off of this'' has no tolerance: how much reaction counts as a reversal
  before relevance migrates is not said.'
- The test is applied on whatever timeframe is on screen, which is never named.
- Separation is the whole rule and it is never quantified - not in points, not in ATR, not
  as a fraction of the range. The Short is a visual drill.
- No time-separation criterion is given either (how many candles apart).
- He calls the rejected low "technically a failure swing", so failure-swing status alone does
  not make a level relevant - but no precedence rule between the two tests is given.
- Separation is judged purely visually; no minimum distance in points, ATR or candles is given.
- He says a dedicated video on relevant highs and lows is scheduled, implying the definition
  is incomplete in this unit.
