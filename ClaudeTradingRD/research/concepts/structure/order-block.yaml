id: order-block
name: Order Block (the opposing candle in the move that swept liquidity)
variants:
  name:
  - Opposing Candle / Order Block
  - Order Block
  - Order Blocks As Support For A Fair Value Gap Entry, Not As The Trade
  definition:
  - 'The consecutive series of same-direction close candles that produced a swing extreme,
    treated as a tradeable zone once price closes back over (or under) it. In this unit the
    speaker''s working term is "opposing candle": at a low, the series of down-close candles
    that made the low; at a high, the series of up-close candles that made the high. The series
    becomes actionable at the moment of the close-through - that same close is the change
    in the state of delivery - and thereafter the zone is used two ways: as the level that
    must be respected on a retest (he marks 0.5 of the opposing candle and wants that half
    respected), and as a "continuation order block" from which a continuation entry is taken.
    A daily opposing candle can be projected forward and combined with the daily candle''s
    half level to build the T-spot.

    '
  - 'Two mutually consistent formulations are given in this unit. Structural (Orderblocks
    Simplified): a bearish order block requires a sweep of a high followed by a break of structure
    down; the order block is then the up-close candle or series of up-close candles that took
    that liquidity immediately before the move down. Mirror for bullish: a sweep of sell-side,
    a break of structure up, then the single or series of down-close candles before the move
    up. Candle-level (Propulsion Blocks review): the order block is a single or series of
    up-close candles into an important level which price then displaces through and closes
    BELOW the opening price of that single or series, and that close is what validates it;
    mirror for bullish. The level itself may be taken as the opening price, the wick, or the
    wick-to-open, and he explicitly tells the viewer to experiment and pick one.'
  - This unit adds a disqualifier rather than a definition. Looking left at a cluster of opposing
    candles he refuses to treat them as an order block because they sit inside a consolidation,
    and instead uses the HIGH OF THE RANGE as the point of interest, looking there for a sweep
    or an SMT. The order block therefore requires the candles to have produced a structural
    extreme, not merely to be the right colour inside a range.
  - 'EARLIEST RECORDING''S CONTRIBUTION IS THE ZONE BOUNDS, which the later canon leaves to
    the trader. Marking up a daily chart he states that on the daily he includes THE WICK
    TO THE OPEN of the block, and gives the reason: that is the most sensitive part. On the
    4-hour, in the same video, he marks THE BODY TO THE WICK of the series of up-close candles.
    So two different bounds are used at two different timeframes within one markup, both wider
    than a single opening-price line.'
  - 'The only PD array he says he actually trades from. An order block is formed by the series
    of opposing candles that price validated before delivering away, and its timeframe is
    derived from the higher timeframe level being worked - a daily level produces an hourly
    order block. He does not rest limit orders inside blocks; he waits for price to react
    and validate a new block, then enters at market on the confirming close.

    '
  - 'The single or series of opposing-close candles that traded into an important level immediately
    before price displaced and closed through their opening price. A bearish order block is
    the up-close candle(s) into an important level whose opening price is subsequently closed
    below; a bullish order block is the down-close candle(s) whose opening price is subsequently
    closed over. The level is marked at the OPENING PRICE of the (first) candle in the series,
    not the candle''s extreme. The validating close is the change in state of delivery. A
    sweep of liquidity before the close is preferred and the speaker always waits for one,
    but is stated not to be strictly required. The presence of an important level IS required
    — the same candle pattern at a random location is explicitly not an order block.

    '
  - HolyAngelBruv demotes the order block. His primary points of interest are liquidity (equal
    highs, equal lows, old highs, old lows) and fair value gaps; he says he would rather take
    a fair value gap trade that is SUPPORTED by an order block than take the order block itself,
    and that he only uses order blocks to narrow his fair value gap entries. His argument
    against trading them directly is that without a narrative they are unreliable - shorting
    a random order block will probably not work, whereas order blocks on the correct side
    of the market-maker curve are more likely to. For drawing them he uses the open, or the
    open and the wick, but normally just the open, and he says openly that he has held back
    from publishing a video on them because the choice of which candle to use is still subjective
    to him and changes with the timeframe.
  category:
  - entry
definition: 'His self-described favourite reversal model. Starting from an important level
  (a PD array, or resting buyside/sellside liquidity), price makes a short-term swing and
  then raids it. The order block is the opposing candle — or series of opposing candles —
  inside the move that swept that swing INTO the level: the up-close candle(s) for a bearish
  block, the down-close candle(s) for a bullish one. It is not validated until price closes
  back through it, and the level he then trades from is the block''s OPENING PRICE.'
category: structure
status: contested
