preconditions:
- An important level exists (higher-timeframe PD array, or resting buyside/sellside liquidity).
- A short-term swing high/low has formed near that level.
- A swing extreme produced by a run of same-direction close candles.
- Price has reached an important level (a fair value gap, a prior high/low, a PD array).
- Liquidity has been swept at that level (a high taken for a bearish block, a low for a bullish
  one).
- A candidate run of opposing-close candles has been identified.
- A higher timeframe level or narrative is already in place - he will not go looking for order
  blocks without one.
- The candles forming the block satisfy the opposing-candle validity test (they must have
  a wick / make a relevant extreme).
- Price has reached an important level / higher timeframe PD array (see important-level).
- 'Preferred: buyside or sellside liquidity has been swept at that level.'
- A directional narrative (curve side) and a fair value gap as the primary point of interest.
detection_rules:
- Price raids the short-term high (bearish case) or low (bullish case) into the important
  level.
- Identify the up-close candle, or series of up-close candles, inside that sweeping move (down-close
  candle(s) for the bullish case).
- Wait for price to CLOSE below that up-close candle (or above that down-close candle) — the
  close validates the block.
- Mark the block's opening price; that is the level expected to support price away from it.
- Wicks may trade into the block; the bodies must keep respecting it.
- 'Bullish: identify the consecutive down-close candles that made the low; the zone becomes
  valid once price closes back over their high.'
- 'Bearish: identify the consecutive up-close candles that made the high; the zone becomes
  valid once price closes back below their low.'
- Mark 0.5 of the opposing candle range; require that half to be respected on the retest.
- A zone formed in the direction of the prevailing move and used for re-entry is a continuation
  order block.
- '0.5 of the opposing candle doubles as a management level, not only a retest filter: price
  is not expected to trade back above it, so the stop can be moved there.'
- A single retracement into a higher-timeframe level can produce two stacked sets of opposing
  candles, each protecting its own extreme.
- 'Bearish: identify a swept swing high, then a break of structure downward.'
- Bearish block := the single or series of UP-close candles on the move that swept that high,
  immediately before the break down.
- 'Bullish: identify a swept swing low, then a break of structure upward; block := the single
  or series of DOWN-close candles on that move.'
- 'Alternative validation used in the propulsion-block video: the block is valid once price
  closes beyond the OPENING PRICE of that single or series of candles.'
- Prefer the largest full-bodied candle of the move that swept the level, not an adjacent
  small candle.
- Level selection is user-chosen among {opening price, the wick, wick-to-open, mean threshold};
  he tells the viewer to experiment.
- In a trend, a run of down-close candles inside an up move (or up-close candles inside a
  down move) may also be used as a block without a fresh sweep.
- Reject a candidate order block whose candles sit inside a consolidation - the fact that
  they are opposing-close candles is not sufficient.
- In that case use the range high (or range low) as the point of interest instead.
- At that range extreme, look for a sweep or an SMT rather than a clean order-block reaction.
- A valid order block, once respected, can then be paired with a fair value gap to form what
  he calls a propulsion block.
- 'Daily block: bound the zone from the WICK to the OPEN of the block candle - the stated
  ''most sensitive part''.'
- '4-Hour block: bound the zone from the BODY to the WICK of the series of up-close candles.'
- The block is a series of same-direction closes, not necessarily a single candle.
- Entry inside the zone is combined with a lower-timeframe setup rather than taken blind.
- 'Choose the order block timeframe one step below the higher timeframe level in use: a daily
  level means an hourly order block.'
- Use the whole series of opposing candles, not a single candle.
- A block that has already been mitigated (tapped once) remains valid as long as the drawn
  liquidity / objective being traded toward has NOT yet been taken.
- Once the objective has been reached, a re-tap of the same block is no longer a valid entry
  - this is the specific mistake he names as where people get stopped out.
- For continuation entries, wait for price to react at the level and validate a NEW order
  block; enter on the close of that candle at market.
- 'Bearish: find the last contiguous run of up-close candles (close > open) that traded into
  the important level and made the local high.'
- ob_level := open of the FIRST candle of that run.
- 'Validation: a subsequent candle closes below ob_level (with displacement).'
- 'Bullish: mirror — last run of down-close candles into the level; ob_level := open of the
  first; validation is a close above ob_level.'
- 'Zone refinement: mean_threshold := midpoint of (body_low, body_high) of the run.'
- 'Rejection rule: if the candle run never traded into an important level, it is NOT an order
  block even if its opening price is later closed through.'
- 'Continuation variant: the important level may be (a) a previous order block, (b) a fair
  value gap, or (c) a swept swing low/high.'
- Select the trade on liquidity plus a fair value gap, not on an order block.
- Use an order block only to refine the entry price inside that fair value gap.
- Draw the order block from the open, or the open plus the wick; default to the open.
- In a downtrend, the up-close candles (bearish order blocks) are what should resist price.
- Do not take an order block that is not on the correct side of the market maker curve.
invalidation:
- Bodies closing through the block's opening price / beyond its mean threshold.
- No close back through the opposing candle — the block is never validated.
- Price closes back through the opposing candle in the original direction.
- The protected swing created at the extreme beneath the zone is taken out.
- Price closing beyond the mean threshold of the block against the intended direction.
- The break of structure never printing (a sweep alone does not validate a block).
- Price trades through the block without a reaction.
- The drawn liquidity / objective has already been taken - the block is spent.
- Price closes through the block against the intended direction.
- The candles do not have open-high-low-close shape (wickless, no relevant extreme) - not
  an order block at all.
- Closes beyond the mean threshold are undesirable ('I don't want to see any closes below
  the mean threshold').
- Absence of an important level invalidates the formation entirely.
- No narrative supports the order block's direction.
measurable:
- hit rate of order blocks validated at a HTF level vs those without one
- frequency of body violation of the opening price before target
- retest rate of opposing candles after the close-through
- proportion of retests that hold above 0.5 of the zone
- R achieved from continuation order block entries vs entries at the close-through itself
- reaction rate at the opening price vs the wick vs the mean threshold, same sample
- how often the break-of-structure requirement disqualifies a candidate block that a candle-only
  rule would accept
- hit rate of blocks formed in a trend without a fresh liquidity sweep
- reaction rate of order blocks inside consolidations vs at structural extremes
- reaction rate at the wick-to-open zone vs the opening price alone, by timeframe
- fill rate of limit orders inside order blocks vs the close-of-candle market entry
- hit rate of re-tapped blocks before vs after the objective was reached
- performance by order-block timeframe relative to the HTF level timeframe
- hit rate of a 2R trade on the first retest of ob_level, split by whether an important level
  was present
- how often price returns to ob_level at all after validation
- fill rate and hit rate of mean-threshold entries vs opening-price entries
- frequency of closes beyond the mean threshold in trades that ultimately worked
- win rate of FVG entries with vs without an aligned order block
- difference in entry fill and adverse excursion between open-only and open-plus-wick drawing
