ambiguities:
- Whether the validating close must also displace (leave an FVG) is stated in E89d1HArbgM
  ('close and displacement') but only as 'closes below' in 7p9MBFk8EEM.
- '''Important level'' is enumerated by instance (daily/weekly FVG, previous month high, daily
  swing low) but never ranked or bounded.'
- When a SERIES of opposing candles is used, whether the opening price is the first candle's
  open or the highest/lowest is not stated.
- Sourced from an ASR (whisper-small) transcript, not YouTube captions; wording may be imprecise.
- In video Nlw-PZhoViQ two separate levels are pointed at on screen - one that would form
  the opposing candle and one that would form the change in the state of delivery - which
  implies they are not always the same level, but the distinction is only visual and is not
  stated.
- The speaker uses opposing candle, order block and continuation order block in the same walkthroughs
  without distinguishing them; they are recorded here as one concept because they are constructed
  identically in these transcripts, but that identity is an inference.
- The zone boundaries are not stated - whether it spans the bodies or the wicks of the series
  is never said.
- No maximum number of candles in the series is given.
- Whether a fair value gap inside the zone is required, or merely common, is not stated.
- The auto-captioner renders 'break of structure' as 'breaker structure' and once as 'brachet
  structure'; it is read as break of structure throughout.
- '''Break of structure'' is never given a swing-confirmation rule here - which swing must
  be closed through, and whether a wick through counts, is not stated.'
- 'The two validations are not reconciled: the structural version requires a break of structure,
  the candle version requires only a close beyond the block''s opening price.'
- Choice among opening price / wick / wick-to-open is explicitly delegated to the trader,
  so the level is not uniquely determined by the source.
- '''Important level'' is enumerated by example (fair value gap, prior high/low) but not defined
  or ranked.'
- '''Just in a consolidation'' is judged by eye; no test is given for when a run of candles
  counts as consolidation rather than structure.'
- '''Propulsion block'' is named once in passing and never defined in this unit.'
- This video does not restate which level of the block is used (open of the first candle,
  the series extreme, or the mean threshold).
- The two bounds are used in the same video at different timeframes and the difference is
  never explained - it may be a timeframe rule or may be incidental.
- '''Wick to the open'' is ambiguous about WHICH wick when the block is a series of candles.'
- Neither the sweep precondition nor the break-of-structure precondition from the later canon
  is mentioned in this markup; blocks are simply pointed at on the chart.
- '''Drawn liquidity'' / ''objective'' is the pivot of the mitigation rule but is never defined
  mechanically - it is whatever he had marked at the time.'
- The one-step-down timeframe relationship is given for daily-to-hourly only; the mapping
  for 4H, weekly or intraday levels is not enumerated.
- How many times a block may be tapped before the objective is reached is not stated.
- '''Displacement'' accompanying the validating close is required by wording but never quantified.'
- Whether the candle series must be strictly contiguous (does one opposite-close candle break
  it?) is not stated.
- The order block's ZONE boundaries are undefined — only the opening price (a line) and the
  mean threshold (bodies) are given; whether the wick extreme belongs to the block is only
  addressed by contrast with breaker blocks, which DO include wicks.
- '''Important level'' is enumerated for continuation entries but left open (''higher timeframe
  PD array'') for reversal entries.'
- 'No expiry rule: how many touches an order block survives, or when it is dead, is not stated.'
- Which candle qualifies as the order block is explicitly unresolved by the speaker himself
  and changes with the chart timeframe - he demonstrates the same structure resolving to different
  candles on the 5-minute and the 30-minute.
- '''Supported by'' is not defined - overlapping, adjacent, or containing?'
- No rule states when the order block refinement should be abandoned in favour of the raw
  gap.
