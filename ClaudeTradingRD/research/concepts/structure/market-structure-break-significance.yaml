id: market-structure-break-significance
name: Market Structure Break vs Market Structure Shift (a distinction the host rejects)
definition: 'AM Trades draws a distinction that most of the terminology in this corpus collapses.
  A market structure *shift* is the ordinary case - the classic structure formation, a 30-minute
  close above a high after that high was taken, an intraday event. A market structure *break*
  is reserved for something more significant: the taking of an intermediate-term swing point,
  that is, a swing that had itself been formed by a retracement rebalancing a fair value gap.
  He labels these MSB on his charts and uses the distinction directionally - while bearish
  he wants the intermediate-term low broken while the intermediate-term high stays unviolated.
  The host disagrees on air in the same stream, saying the terms are all basically the same
  with different words, and repeats that position in the Trade For Opportunity stream where
  the only requirement he adds is displacement plus a close.'
category: structure
status: specified
aliases:
- MSB
- MSS
preconditions:
- Advanced market structure has been labelled - short-term, intermediate-term and long-term
  swings identified.
detection_rules:
- MSS := a close beyond a swing high/low on the working timeframe after that level was taken
  - ordinary, intraday.
- MSB := a close beyond an intermediate-term swing point, i.e. one formed by a retracement
  into a fair value gap.
- 'Bearish: the MSB sought is a break of an intermediate-term low; the intermediate-term high
  must stay unviolated. Mirror for bullish.'
invalidation:
- The intermediate-term swing on the opposing side is violated first.
measurable:
- continuation distance after an MSB (intermediate-term swing taken) vs after an ordinary
  MSS
- false-signal rate of each on the same instrument and timeframe
sources:
