ambiguities:
- The host rejects the distinction outright in the same recording, so this unit contains both
  readings from one stream; that is a guest-versus-host difference, not a channel self-contradiction.
- AM Trades does not say whether the MSB additionally requires displacement, which is the
  host's only stated criterion.
- No timeframe is attached to the MSB - only the MSS example is timeframed (30-minute).
