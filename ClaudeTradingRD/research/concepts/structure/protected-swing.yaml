id: protected-swing
name: Protected Swing (the invalidation level)
variants:
  name:
  - Protected Swing
  definition:
  - 'The unit''s most-repeated mechanical construct and the source of every stop in the model.
    A protected swing requires TWO things: (1) price must reach an IMPORTANT LEVEL -- which
    he defines as sweeping out a low/high OR reaching into a fair value gap -- and (2) price
    must then close through the series of same-direction candles that made that extreme. Only
    then is the extreme ''protected'' and tradeable away from. An extreme that never touched
    an important level is explicitly NOT a protected swing, however good the close looks --
    he refuses several such candidates on camera.'
  - 'A swing extreme that has been validated by a subsequent close and can therefore be used
    as the invalidation for a position. It is created when price reaches into a fair value
    gap (or trades to a low) and then closes back over it - the closure through protects the
    low beneath, which is then expected to hold while price travels toward the draw. Protected
    swings serve three distinct jobs in these walkthroughs: they are the stop-loss reference
    at entry; they are the qualifier that makes a candle 2 closure "ideal"; and they are the
    trailing reference during management, where each new swept low that is closed back over
    becomes a new protected swing and the stop is moved to it. The absence of a usable protected
    swing is an explicit reason to refuse a trade - if the only protected low sits too far
    away for the target, the trade is not taken and a new low is awaited.

    '
  - 'Asked what the protected swing replaced, he answers that it is his deliberate simplification
    of ICT''s advanced market structure (short-term / intermediate-term point labelling),
    which he found too confusing to code. His replacement is stated as a two-step mechanical
    test: price must sweep out a low (or reach into a gap), and then produce a change in the
    state of delivery — at that moment the low is a protected swing, without waiting for a
    further swing to form the way the advanced-market-structure labelling requires. He also
    gives the print timing that matters for backtesting: the protected swing is valid on the
    closure through, but it is drawn on the *open of the next higher-timeframe candle*, one
    second in, so a replay that looks delayed is not actually delayed.

    '
  - 'Two viewer questions in this unit pin down properties of the protected swing that the
    lesson videos leave open. First, duration: asked how long a protected high or low stays
    protected, he says every protected swing in a sequence stays protected until the opposing
    extreme - the high the sequence is trading toward - is taken out. Once that high is taken,
    the protection lapses, and the pattern he then expects is that price runs back through
    a former protected swing and forms a continuation there, often around the equilibrium.
    Second, quality: a low is not a protected swing merely because price closed over it. He
    rejects a candidate because of how long it took to form - by the time price took out the
    high above it, the structure read as a consolidation range rather than a protected swing.

    '
  - 'A swing point that a subsequent continuation closure has confirmed. Once a protected
    swing exists the stop is moved behind it, and the expectation is that it will not be traded
    through before the target is reached. After the target is reached, the first protected
    swing is frequently run out, and that run-out is a preferred re-entry location.

    '
  - 'This unit supplies both the entry-side and the structure-side account of the same object.
    On the entry side: after a sweep of a low and a close back over the candles that made
    it, he places the stop on that new low because it is now protected; and on the daily,
    a sweep of the previous day low that closes back inside is described as forming a protected
    low that he anticipates will hold while the trend continues. On the structure side, the
    market structure video identifies which low that is in trend terms: it is the low that
    made the new high, before price came back and broke it - the pivot whose break ends the
    trend.'
  - 'Two live refinements. First, the mechanical formation rule stated aloud: once price closes
    over the level, that swing is protected - the close is what protects it, and until the
    close happens the low is not protected. Second, a quality filter: a swing whose sweep
    is very shallow, barely forming a sweep and close to equal highs, is hard to trust even
    when the indicator marks it mechanically; to trade away from a swing he wants to see at
    least some sort of reach. He also uses a protected swing as the thing to trail a stop
    to, and treats a swing as no longer protected once the previous day''s low that anchored
    it has been taken.'
  - 'This unit supplies both the verbal test and the coded one. Verbally: a swing is protected
    when price hits a point of interest and then closes through the series of candles into
    that point of interest - in one example the series is a single candle. Mechanically, as
    coded: the protected swing forms on the closure through, and is printed at the open of
    the next candle, drawn as a dot plus a line. It does not repaint - a protected swing that
    is later taken out is not deleted, it turns gray and stays on the chart so that a failure
    can be reviewed afterwards, and a new protected swing forms in its place. A swing that
    forms without interacting with a point of interest (a fair value gap) is not a protected
    swing at all.'
  - 'A Short states the sequencing rule that the entry waits on: after a daily sweep and closure
    back in, the existing protected high is marked, and then he explicitly LETS A NEW PROTECTED
    SWING FORM before looking for the entry. The new one forms when price reaches into a point
    of interest (a fair value gap), leaves a series - or a single - up-close candle into it,
    and closes through. Only then does he sell, with the stop on the protected swing high,
    looking for 2R and then the first standard deviation projection. He states the expectation
    that the new protected swing remains intact if the trend is going to continue.'
  - 'A swing high or low that has been swept and then closed back through, so that the extreme
    is now defended by the closure. Once protected, 50% of the swing should be respected on
    any pullback, and price trading beyond the protected extreme invalidates the idea. It
    is the object he trades away from, and having one already formed is the precondition for
    a pre-open positional entry.

    '
definition: 'A protected swing is a high or low that is expected to hold while the trend continues;
  it is the model''s invalidation level and, per this unit, the thing entries are actually
  built on. There are three constructions, all of which are ''point of interest, then closure
  through the series of opposing candles that made the extreme'': (1) a short-term low/high
  is swept, then price closes through the series of opposing candles that made it; (2) the
  sweep is absent but a correlated asset swept instead - SMT substitutes, and the opposing
  candles that made the failure swing are used; (3) no sweep at all, but price reaches into
  a fair value gap, and the opposing candles that made the extreme inside it are closed through.
  Where neither a fair value gap nor a low to be swept exists, 0.5 of the opposing candle
  is used as the point of interest.'
category: structure
status: contested
aliases:
- protected high
- protected low
- new continuation
- invalidation
- new protected swing
- it is now protected
