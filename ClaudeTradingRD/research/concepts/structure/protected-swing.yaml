ambiguities:
- '''The series of opposing candles that made the extreme'' is judged by eye; in several examples
  he chooses a different candle from the one the mechanical reading would pick, justifying
  it as ''that is the swing high that created this swing low''.'
- Whether the close must be a body close through the OPEN of the first opposing candle or
  through its high/low is never stated.
- The 0.5-of-the-opposing-candle fallback is introduced as 'a quick lesson' in one video and
  not carried into the definition elsewhere.
- 'The important-level requirement has one documented waiver: ''even if it didn''t have a
  fair value gap, I''m expecting this low to hold'' -- he then uses the CISD level instead.
  When the waiver applies is not stated.'
- '''Ignore those small candles'' when defining the series is explicitly discretionary and
  unquantified.'
- Whether the close must be through the series' opening price or through its extreme is stated
  as opening price in some passes and simply 'over that level' in others.
- Sourced from an ASR (whisper-small) transcript, not YouTube captions; wording may be imprecise.
- In video Nlw-PZhoViQ the two ways a protected swing can form are enumerated as the operator's
  only two options for keeping a bias alive, but no preference or probability is attached
  to either branch.
- Whether the close over the fair value gap must be a full body close, and whether the gap
  must be fully or partially filled first, is not stated.
- Stops are placed below the bodies in one scalp and below the swing low elsewhere; no rule
  distinguishes the two cases.
- Trailing to every new protected swing stopped the scalp out on a move that subsequently
  resolved in his favour, and no rule is given for when not to trail.
- Whether the sweep and the gap-entry are true alternatives or whether one is preferred is
  not stated.
- The CISD that confirms the protected swing is the same unbounded 'series of opposing-close
  candles' test — the series length is never defined.
- In the m8xcjkOuBHU walkthrough he adds a refinement step (a lower-timeframe low below the
  50% level 'that needs to get swept out') without saying when refinement is required versus
  optional.
- He also says he is 'not a huge fan of trying to trade protected swings that form a higher
  time frame gap', which implies a quality filter on protected swings that is never spelled
  out.
- '''Took how long to form'' is the disqualifier but no candle count or time threshold is
  given.'
- The run-back-then-continuation pattern is said to happen 'a lot of times' and 'kind of advanced',
  with the EQ location given as a tendency, not a rule.
- Whether protection lapses for all swings in the sequence at once, or only for those below
  the taken extreme, is not stated.
- The post-target run-out re-entry is described as frequent but given no frequency, timeframe
  or invalidation; he says he deliberately avoids teaching it live.
- Whether a protected swing survives across timeframes (e.g. an M1 break of an M15 protected
  swing) is not stated.
- The entry-side and structure-side accounts are never explicitly identified with each other;
  this unit is the closest the corpus comes and it is still the reader joining them.
- Whether the close back over must be a body close is not stated.
- No rule for how many protected swings may be stacked before the original is discarded.
- '''Some sort of reach'' is the filter and is never quantified - no minimum sweep depth in
  points, ticks or fraction of range.'
- His own indicator marks the shallow case as a protected swing, so the filter is discretionary
  on top of the mechanical definition; he states this openly.
- Whether the closure must be a body close through the whole series or only through its extreme
  is not stated.
- '''Series of candles'' has no maximum length; one example is a single candle.'
- On stocks he says the protected-swing display gets messy and he would turn it off, without
  giving a rule for when it is unreliable.
- The Short does not say how long to wait for the new protected swing, or what to do if none
  forms.
- '"Closed through" is not specified as a body close or a wick.'
- He notes his indicator marks the protected swing automatically, so the manual rule is only
  demonstrated, not fully specified.
- '''Separation'' - the minimum distance between the swept level and the new swing - is never
  quantified; he rejected a live setup on this basis without giving a threshold.'
- '''Stop on the bodies'' does not specify which bodies.'
- Whether the retracement into the fair value gap is mandatory or merely typical is not stated.
