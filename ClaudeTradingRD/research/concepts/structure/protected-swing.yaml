- protected swing
- dot and line
- protected swing point
preconditions:
- A directional read exists; protected swings are tracked in the direction of trend.
- 'An identified important level: a swing high/low to be swept, or a fair value gap.'
- A swing low (or high) formed by price reaching into a fair value gap or sweeping a level.
- A low (or high) that has swept liquidity or reached into a gap.
- A swing low (or high) with a close over (under) it.
- A swing point formed by a sweep of a genuine (not failure) swing.
- A continuation closure printed after it.
- A swing extreme that price has swept or traded into.
- A swing high or low that has traded into a point of interest / fair value gap.
- A daily sweep of the highs with a closure back inside (bearish case).
- The existing protected high has been identified as the series of candles that made that
  high.
- A swing high or low exists and has been swept.
- There is separation between the swept level and the newly formed swing - a swing that forms
  at equal lows with the swept level is not tradeable away from.
detection_rules:
- 'Identify a point of interest: a swept short-term high/low, OR a fair value gap price has
  reached into, OR (fallback) 0.5 of the opposing candle.'
- Find the extreme formed at that point of interest.
- Find the series of opposing candles that made that extreme (may be a single candle).
- Require a CLOSE through that series' level. Until that close, the swing is not protected.
- 'Once closed through, the extreme is protected: it must hold for the trend to continue.'
- 'SMT substitution: if this asset did not sweep but the correlated asset did, use the opposing
  candles that made the failure swing.'
- Track protected swings forward - each new one supersedes the last as the invalidation.
- Price must sweep a low/high or trade into a fair value gap. If it does neither, no protected
  swing can form.
- Identify the series of down-close (bullish case) or up-close (bearish case) candles that
  reached that level.
- Require a close through the opening price of that series.
- On that close, the extreme becomes the protected swing and the invalidation level.
- If price makes a NEW extreme before closing through, abandon the old series and track the
  new one.
- When the lower-timeframe structure is messy, ignore the small candles and take the whole
  move as the series.
- SMT against a correlated asset can substitute for the sweep requirement.
- 'Bullish: price trades into a fair value gap or sweeps a low, then closes back over that
  level - the low beneath is now protected.'
- 'Bearish: price trades into a fair value gap or sweeps a high, then closes back below -
  the high above is now protected.'
- Each subsequent qualifying event creates a new, tighter protected swing that supersedes
  the previous one for trailing purposes.
- A candle 2 closure that also forms a protected swing is called ideal.
- 'The test is applied negatively as well: zoom in on the candidate level and ask whether
  price actually closed through it - if it did not, the level is not a protected swing and
  there is no invalidation available.'
- 'With no protected swing available there are exactly two ways one can form: price retraces
  up into the higher-timeframe level (a fair value gap) and trades back through, creating
  opposing candles and protecting the highs in place; or price first runs out the highs and
  forms a new protected high there.'
- One retracement into a level can create two sets of opposing candles and therefore two protected
  extremes at once.
- When a newly formed protected swing is taken out and price stops respecting the opposing
  candles, the trend is over.
- Require the extreme to have swept out a prior low/high OR to have reached into a fair value
  gap.
- Require a change in the state of delivery after that extreme.
- The extreme is then a protected swing — no additional swing formation is required.
- Once price continues, a new protected swing forms and the previous one is superseded.
- 'Timing: valid on the closure through, printed at the open of the following higher-timeframe
  candle.'
- Each protected swing in a sequence remains protected until the opposing extreme it is trading
  toward is taken out.
- Once that opposing extreme is taken, treat the protection as lapsed and expect price to
  run back through the former protected swing and form a continuation, frequently near the
  equilibrium.
- 'Reject a candidate protected swing that took a long time to form relative to the move:
  if price consumed many candles between forming it and taking the opposing extreme, read
  it as a consolidation range instead.'
- A protected swing formed on a lower timeframe before the open of the higher-timeframe candle
  is what produces a candle 3 that opens with no wick.
- Identify the swing that price swept before the continuation closure.
- After the closure, mark that swing as protected and move the stop behind it.
- A protected swing should hold until the target is reached.
- The swing is protected once price has swept it and then closed back over the series of candles
  that made it.
- The stop goes on that protected extreme; it is expected to hold while price travels to the
  objective.
- In structural terms the protected low is the low that made the new high - the pivot whose
  break is what shifts the trend.
- 'Daily instance: price trades back into a fair value gap while sweeping the previous day
  low, closes back inside, and that forms the protected low for the following day.'
- A swing becomes protected when price closes over (or under) the level.
- Before that close, the swing is not protected and is not tradeable as an invalidation.
- Filter out swings whose sweep is negligible - near-equal highs with barely any reach.
- A protected swing ceases to count once the level that anchored it has been taken out.
- Price reaches a point of interest.
- Price closes through the series of candles that traded into it (the series may be a single
  candle).
- The swing behind that closure is now protected; it is marked at the open of the following
  candle.
- A swing with no interaction with a point of interest does not qualify.
- Once taken out, the protected swing is greyed rather than removed, and a new one forms -
  successive protected swings are the trailing reference.
- 'Identify the current protected swing: the series of candles that made the high (it can
  be a single candle).'
- Do not enter on it - let a NEW protected swing form first.
- New protected swing forms when price reaches into a point of interest (fair value gap),
  prints the series or single up-close candle into it, and closes through it.
- Enter there; stop on the protected swing high; target 2R, then the first standard deviation
  projection.
- Expect the new protected swing to remain intact for the trend to continue.
- Price sweeps out a high (bearish case) and then closes below it - the swept high is now
  protected.
- That level becomes the point of interest; 50% of it should be respected on the pullback.
- Price retraces into the fair value gap created by the displacement, then closes below the
  protected swing again - that close is the entry.
- For a pre-open positional entry the protected swing must already exist before 09:30, with
  all timeframes aligned.
invalidation:
- Price trades through the protected extreme - the trend read is over.
- A protected swing that is 'instantly invalidated' after forming signals consolidation or
  reversal rather than trend.
- Price trades back through the protected swing -- the trend read is over.
- Price trades back through the protected swing - the invalidation is hit and the idea is
  dead.
- Price trades through the protected swing — this is the stated invalidation of the idea,
  not a level to give room to.
- Price trades beyond the protected swing.
- Price trades back through the protected swing before the target is reached - the sequence
  is broken.
- The swing being used is a failure swing (a minor high/low that did not sweep liquidity)
  - it does not qualify as protected.
- The protected extreme is traded through - which is simultaneously the market structure shift.
- Price trades through the protected extreme - the swing is failed (greyed), not erased.
- Price trades through the new protected swing.
- Price trades beyond the protected extreme.
- The 50% level is not respected on the pullback.
- The swing formed at equal lows/highs with no separation from the swept level - there is
  nothing to trade away from even if the sweep technically occurred.
measurable:
- survival rate of protected swings by construction type (sweep / SMT / fair value gap)
- share of protected swings invalidated within N bars of forming
- R distribution of entries taken at a fresh protected swing vs at the prior one
- protected swings formed per session per timeframe
- violation rate of protected swings
- R distribution of stops placed at the swing vs at the body
- hold rate of protected swings until the draw is reached
- distance in R from entry to the protected swing across a sample
- frequency with which trailing to each new protected swing exits before the final objective
- frequency with which a protected swing is violated before target
- R difference between stops at the protected swing and stops beyond it
- count of protected swings formed per higher-timeframe candle
- hold rate of protected swings, measured until the opposing extreme is taken
- frequency of the run-back-through-then-continuation pattern after protection lapses, and
  how often it lands within x% of the EQ
- difference in hold rate between fast-forming and slow-forming protected swings
- Rate at which protected swings hold until target.
- Frequency and expectancy of the post-target protected-swing run-out re-entry.
- hold rate of protected swings until the stated objective
- agreement rate between 'the low that made the new high' and the low the stop was actually
  placed on
- sweep depth distribution of protected swings that held vs those that failed
- how many mechanically-marked swings the reach filter removes
- hold rate of protected swings until the target is reached
- number of protected swings formed per higher-timeframe candle
- failure rate by instrument (he notes stocks produce messy protected swings)
- hold rate of the new protected swing through to 2R
- R difference between entering at the first protected swing and waiting for the new one
- hit rate of the 50% level holding after a protected swing forms
- outcome difference between protected swings with and without separation from the swept level
- 2R hit rate from the close-below entry
