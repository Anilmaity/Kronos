ambiguities:
- The three-way classifier is only as decidable as its inputs; consolidation is the only one
  of the three with a crisp test (price internal to a high and a low).
- The breakout branch - continuation without a sweep - is mentioned in the consolidation and
  expansion videos but no condition is given for when a breakout is trusted over a sweep.
- Here a retracement is listed alongside reversal as the non-consolidation outcome, whereas
  the library entry counts a retracement as a continuation signature too; the Short does not
  say what a retracement at target 1 would mean.
- '''Failure swing'' is defined by contrast with manipulation (no sweep) rather than positively.'
- '''Deep'' vs ''shallow'' retracement is not quantified.'
