id: continuation-signature
name: Continuation Signatures (Consolidation And Retracement)
definition: 'PRIMARY-SOURCE READING (this unit): after an expansion, exactly two shapes mean
  continuation rather than reversal - a consolidation, or a retracement. Either one is the
  ''small range'' between two ''large ranges''. Their trade instructions differ: a consolidation
  requires a manipulation of one side of the range first (bullish: the low is run out); a
  retracement requires a slow shallow move into a PD array and a protected swing to form.
  The third possibility - expansion met with expansion - is the reversal signature instead.
  This gives a three-way decision procedure that is run after every expansion leg and re-run
  on every new candle close.'
variants:
  definition:
  - 'Applied at a target: after price expands lower and hits its first target (a previous
    low), he asks whether the reaction is a retracement, a reversal, or a consolidation. In
    the example it is a consolidation, which he calls a continuation signature, and price
    continues lower to the second target. Used here as the hold-or-exit decision between sequential
    targets.'
  - 'Two signatures indicate that price will continue through a level rather than reverse
    from it. Consolidation continuation: price expands into the objective and consolidates;
    the continuation is confirmed when price engages the consolidation high, prints opposing
    candles, and closes back through it - a failure to manipulate. Retracement continuation:
    price expands to the objective and pulls back deeply, leaving failure swings with no manipulation
    and no displacement back into the range, moving slowly and choppily. Seeing failure swings
    on the opposing side of an internal-range tag is read as a signal to continue internal-to-external.
    The higher-timeframe signature of consolidation is an inside bar; of retracement, three
    consecutive candles or one large candle into an objective.

    '
category: structure
status: contested
aliases:
- large range to small range back to large range
- fail to manipulate the consolidation high
- failure swings
preconditions:
- An expansion leg has just completed and an objective is still open.
- Price has expanded into and hit a first target, with a further target beyond it.
- Price has expanded into a relevant level or objective.
detection_rules:
- 'After an expansion, classify the next price action as one of three: consolidation, retracement,
  or expansion-met-with-expansion.'
- 'Consolidation -> continuation: wait for the manipulation of the side opposite the intended
  direction, then trade away from it.'
- 'Retracement -> continuation: wait for the slow shallow move into a fair value gap, then
  the closure through the opposing candles.'
- Expansion met with expansion -> reversal, not continuation.
- If the current candle does not decide, let another candle close before acting.
- A breakout signature (closing over the previous high) also continues, without requiring
  the sweep of the range low.
- After the first target is hit, classify the reaction as retracement, reversal or consolidation.
- Consolidation at the first target = continuation signature; expect the next target to be
  reached.
- 'Consolidation continuation: price engages the consolidation high, prints opposing candles,
  and closes back through the high without holding above it.'
- 'Retracement continuation: deep pullback leaving failure swings - stacked highs close together
  with no sweep - and no displacement back into the range.'
- 'HTF consolidation signature: an inside bar (current candle takes neither the previous candle''s
  high nor its low).'
- 'HTF retracement signature: three consecutive candles, or one large displacement candle,
  into the objective.'
- Failure swings on the opposing side of an internal-range tag imply continuation, not reversal.
invalidation:
- Price displaces aggressively back into the range instead of consolidating or retracing.
- A reversal at the first target (not defined mechanically in this Short).
- The consolidation high is successfully manipulated (swept and held) - reversal becomes possible
  instead.
measurable:
- empirical continuation rate given each of the three post-expansion labels
- how often the ambiguous case resolves on the very next close
- probability of reaching target 2 after a consolidation at target 1 vs after a retracement
- continuation rate after a failed manipulation of the consolidation high
- continuation rate after an inside bar at a level
