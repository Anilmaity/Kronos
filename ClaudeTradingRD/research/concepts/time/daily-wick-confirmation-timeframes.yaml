ambiguities:
- Session boundaries are never given as clock times in this unit - Asia / London / New York
  are used without hours, and no timezone is named in these two videos.
- '''I don''t trust an hourly closure this early'' is a judgement, applied inconsistently:
  an hourly closure is refused in Asia and London but accepted in New York.'
- Whether the 4-hour closure and the hourly CISD are alternatives or should both be present
  is stated as 'either' in the framework and as 'both checked off' in the worked example.
- Session boundaries are not given as clock times in this video.
- The New York rule is stated as a tendency ('a lot of times'), not a threshold.
- The Asia / London / New York boundaries themselves are not given in clock time anywhere
  in this unit, so the session lookup is not fully decidable from the corpus.
- '''Relevant key level'' is required for the 1-hour closure variant but is not enumerated
  here.'
- It is not stated whether the 4-hour closure variant also needs to be a candle 2 closure,
  or only the 1-hour one ('more so for the H1').
- Whether the two methods are alternatives or whether one is preferred is not stated; he says
  'mainly change in the state delivery on the hourly' in the Asia example.
