id: ten-am-candle-alignment
name: 10:00 a.m. — Four Timeframes Open At Once
variants:
  name:
  - 10:00 And 14:00 Are 4-Hour Candle Opens
  definition:
  - 'Live use: because the 4-hour candle containing the 9:30 open had already made a large
    range, he declined to trade until the 10:00 4-hour candle opened, then looked for 10:00
    to sweep the 9:00 hourly low, respect its EQ area and form the low.'
  - '10:00 New York opens a new 4-hour candle (and sometimes carries news); 14:00 opens the
    next one. Combined with the 18:00 daily open he uses and the 06:00 4-hour candle he narrates
    in the same video, the implied grid is 18:00 / 22:00 / 02:00 / 06:00 / 10:00 / 14:00 New
    York. He uses these opens to frame the 4-hour power of three and to time retracements:
    a retracement inside a directional 4-hour sequence is expected on the flip of a new 4-hour
    candle.'
  - When the 9:30 open gives no clear read (conflicting daily profile vs lower-timeframe structure,
    or the 4H candle already expanded), he defers to the 10:00 a.m. candle and lets it form
    before framing anything.
  - 'This unit restates the 10:00 deadline as a stand-aside rule: if the 9:30 move does not
    continue the session is chopped and he waits for 10:00 for it to sort itself out; he also
    says he would rather wait for a new 4-hour open (10:00) given the forming structure.'
definition: '10:00 a.m. is treated as a hard structural boundary in the New York morning because
  a new 4-hour, hourly, 30-minute and 15-minute candle all open simultaneously at that moment.
  He uses this three ways in the same session: as the point after which a fresh phase of price
  (continuation or reversal) can legitimately begin; as a time-based exit, because every expansion
  candle he is riding ends there; and as a deadline on the opening idea — if the 9:30 move
  has not reached its objective by 10:00 the day is read as consolidation and the idea is
  dropped rather than chased. The same boundary also decides which timeframe pair is usable
  before it: the hourly does not close until 10:00, so pre-10:00 execution has to fall back
  to the 30-minute and 3-minute.

  '
category: time
status: contested
aliases:
