ambiguities:
- The timezone is never stated in the same breath as 10:00; it is fixed only by a separate
  remark elsewhere in the unit that the indicator time filter runs 8 to 11 EST.
- Whether the 10:00 exit is unconditional or only applies when the target has been reached
  is not stated — both are used in different examples.
- Whether a position may be re-entered on the new 10:00 candle after a 10:00 exit is not addressed.
- The 18:00/22:00/02:00 members of the grid are inferred from the 06:00 and 10:00/14:00 candles
  he narrates plus his 18:00 daily open; he never lists the six boundaries explicitly.
- He does NOT say in this video that any other timeframe (1H / 30m / 15m) opens simultaneously
  at 10:00 — that claim is not supported by this source.
- The grid is index-specific; he warns the 4-hour candles change on forex.
