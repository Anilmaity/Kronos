preconditions:
- A New York morning session with an idea framed at or before the 9:30 open.
detection_rules:
- At 10:00 a.m. a new 4-hour, hourly, 30-minute and 15-minute candle open together.
- Treat 10:00 as the earliest point at which a new phase of price (continuation or reversal)
  may start.
- Treat 10:00 as a time-based exit for any position riding a 4H/1H/30m expansion candle.
- If the objective of the 9:30-10:00 move has not been reached by 10:00, classify the day
  as further consolidation and stand aside.
- Before 10:00 the hourly has not closed, so use the 30-minute plus 3-minute pair; from 10:00
  the 15-minute plus 5-minute pair becomes usable.
- If the 4-hour candle in progress at the open is already expanded, wait for the 10:00 4-hour
  open.
- At 10:00 mark the 9:00 hourly low and watch for a sweep and reaction.
- Mark 10:00 and 14:00 New York as 4-hour candle opens.
- Frame the 4-hour open-high-low-close / power of three from those opens (bullish 4H = open,
  low, high, close).
- Expect a retracement at the flip of a new 4-hour candle when the prior 4-hour expanded.
- The 06:00 candle is used the same way in his examples, confirming an 18/22/02/06/10/14 grid.
- If no clear setup exists at the New York open, do nothing until 10:00 a.m. and re-read on
  the new 4H candle.
- If the 09:30 move gets no continuation, stand aside until 10:00.
invalidation:
- Not applicable — this is a clock fact, not a setup.
measurable:
- share of daily range covered between 9:30 and 10:00 versus after 10:00
- outcome of holding a 9:30 entry past 10:00 versus exiting at 10:00
- hit rate of the opening idea when the objective is unmet at 10:00
- share of 4-hour extremes formed within the first hour of the 4H open
