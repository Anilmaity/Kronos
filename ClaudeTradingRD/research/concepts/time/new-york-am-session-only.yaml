id: new-york-am-session-only
name: He Trades The New York A.M. Session
definition: The clearest session statement available in this unit, given as practice rather
  than as a rule, and it bounds his participation at both ends without giving a clock. On
  the top-down markup he moves the chart forward to the New York a.m. session 'as that is
  what I trade', ends the walkthrough at the afternoon because he does not trade the afternoon
  session, and in the reversal/pullback video he stops the markup on reaching the overnight
  session, which he does not mess with. The reference points he does use around the session
  are RTH open and, in the seek-and-destroy video, the New York session open following London.
  NO KILL ZONE IS EVER NAMED - the phrase does not occur once in the twenty videos of this
  unit - and no clock hours are attached to any session anywhere in it.
category: time
status: underspecified
detection_rules:
- 'Participation window: the New York a.m. session.'
- 'Excluded: the afternoon session; the overnight session.'
- The RTH open is used as the reference the pre-open behaviour is judged against.
- 'Preceding sessions are used for context, not participation: Asia''s range and London''s
  take of it feed the New York a.m. expectation.'
measurable:
- distribution of his demonstrated entry times
- R by session
sources:
- video_id: wDXTIDbIMwU
  title: Top Down Analysis - ICT Concepts
  quote: move us to New York am session as that is what I trade
- video_id: wDXTIDbIMwU
  title: Top Down Analysis - ICT Concepts
  quote: I do not trade the afternoon session
- video_id: FdRKBTz0Fps
  title: Reversal or Pullback? Using Market Structure To Determine Trend - ICT Concepts
  quote: then we reached the overnight session which i don't really mess with
ambiguities:
- NO HOURS ARE GIVEN for any session in this unit. 'New York a.m.', 'afternoon', 'overnight',
  'London', 'Asia' and 'RTH open' are all used without clock times or a timezone.
- '''Kill zone'' does not appear anywhere in this unit, so this unit cannot settle the corpus''s
  biggest blocking term.'
- 'CONTRADICTED WITHIN THE UNIT: the standard-deviation video walks a trade set up specifically
  for a ''bullish PM session'', wanting a retracement during lunch and an entry as the PM
  session starts. So the afternoon exclusion is not absolute.'
- Whether the exclusions are hard rules or just where the videos happen to stop is not stated.
