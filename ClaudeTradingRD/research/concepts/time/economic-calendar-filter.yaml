id: economic-calendar-filter
name: Economic Calendar Filter (three-tier news avoidance)
variants:
  name:
  - Economic Calendar Filter
  - The Economic Calendar As The Week's Roadmap (accumulation / manipulation / distribution)
  definition:
  - 'EARLIER RECORDINGS. Two uses, one soft and one hard. Soft: as part of the morning routine,
    open ForexFactory, find the high-impact release, and mark that time (8:30) on the chart
    so the manipulation leg can be anticipated. Hard, and stronger than anything the later
    corpus states: in the CPI trade review he walks the week''s calendar and declines Monday,
    Tuesday and Wednesday because they carry no news at all, waiting for Thursday - the week''s
    first RED FOLDER day - and placing his interest specifically POST 8:30. The 8:30 boundary
    is also referred to as the point at which ''the news embargo lifts'', a phrase used to
    separate pre-release from post-release price action.'
  - 'Rauf opens the stream with the claim that the economic calendar is where most of your
    trades will be formed, because it is the roadmap that creates the weekly range. He then
    maps the week onto the AMD phases from the calendar: a Monday with no USD news is accumulation
    for the weekly range, Thursday is where he expects distribution, and the question the
    calendar leaves open is WHERE the manipulation occurs - which is why he waits for external
    range liquidity to be taken before acting. He explicitly criticises using red-folder events
    on their own as a directional expectation, and says he prefers to look at candle closes
    instead of at the red-folder event itself. He also discounts 03:00 euro news because he
    trades New York.'
definition: 'A fully mechanical news filter. Filter forexfactory.com''s calendar to the currency
  of the instrument traded and to the red-folder (high-impact) events only. Then sub-tier
  those red-folder events into high, medium and low impact and apply fixed rules — credited
  to AM Trades: HIGH impact, avoid the day prior, avoid the release, watch after; MEDIUM impact,
  no need to avoid the day prior but avoid the SESSION prior, avoid the release, watch after;
  LOW impact, no restrictions. Layered on top is his own standing rule: skip Mondays, and
  avoid trading before the first high-impact event of the week.'
category: time
status: contested
aliases:
- how to use the economic calendar
- news filter
- red folder news day
- the news embargo lifts
- the calendar creates the weekly range
preconditions:
- The instrument's driving currency is known (US dollar for NQ/ES; both currencies for a cross
  such as AUDCAD).
- Access to an economic calendar with impact colour-coding.
- A week's economic calendar for the traded currency.
detection_rules:
- On forexfactory.com open the calendar and filter to the instrument's currency.
- Filter to the red folder / high impact only; drop medium and low.
- Sub-tier the remaining events into high / medium / low impact (FOMC and NFP are high; CPI
  is high; PPI is medium in his example).
- 'High impact: no trading the day prior, none through the release, watch after.'
- 'Medium impact: trading allowed the day prior, but not in the session prior, none through
  the release, watch after.'
- 'Low impact: no restriction.'
- 'Standing rules: skip Monday; do not trade before the week''s first high-impact event.'
- 'NFP week: focus on Friday post-release; also watch Tuesday and Wednesday; avoid Thursday
  as the day prior.'
- The output is a list of tradeable days computed at the START of the week.
- Before the session, read the calendar and locate the high-impact (red folder) releases.
- Mark the release time (8:30 in every example) on the chart.
- Days with no red-folder news are of lower interest; in the CPI example three consecutive
  no-news days are skipped.
- Interest begins AFTER 8:30 on a red-folder day; the release itself is expected to produce
  the manipulation leg.
- Pre-8:30 price action is treated as a separate regime ('before the news embargo lifts').
- Map the week's red-folder events before analysing charts.
- A day with no relevant news early in the week is read as accumulation.
- 'Expect distribution in the back half of the week (his example: Thursday).'
- Do not assume direction from a news event - wait for external range liquidity to be taken
  to locate the manipulation.
- Prefer reading candle closes over reading the event itself.
- Ignore news for currencies outside the traded session (03:00 euro news for a New York trader).
invalidation:
- None stated — it is a hard calendar filter applied before any chart work.
- Not applicable - a calendar entry either exists for the day or it does not.
- No external range liquidity is taken - the manipulation has not been located and the week
  is not framed.
measurable:
- number of tradeable days per week produced by the filter
- performance on filtered-out days vs kept days
- win rate and range size on red-folder days vs no-news days
- share of days where the 8:30 release forms the session's manipulation extreme
- day-of-week distribution of the weekly high and low relative to the first red-folder event
- hit rate of 'Thursday caps the weekly range'
