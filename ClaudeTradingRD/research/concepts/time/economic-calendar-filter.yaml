ambiguities:
- The sub-tiering of red-folder events into high/medium/low is shown as a slide list, not
  a rule — CPI/FOMC/NFP are high and PPI is medium in his examples, but no general assignment
  procedure is given.
- '''Avoid the session prior'' assumes a session grid that is not defined in this video.'
- '''Watch after'' is not an entry permission; he pairs it with the weekly profile before
  trading.'
- Whether the Monday skip yields to a Monday high-impact release is not addressed.
- EARLIER RECORDINGS. The no-news-day skip is demonstrated once in a trade review, not stated
  as a standing rule; the later corpus treats the calendar as an avoidance filter rather than
  a participation requirement. Both readings kept - this one is notably more aggressive.
- No timezone is attached to 8:30 in any of these videos.
- '''Red folder'' is ForexFactory''s own colour coding; no impact tiering beyond red is given.'
- The Monday-accumulation / Thursday-distribution mapping is asserted for the specific week
  under analysis and never generalised into a rule.
- '''Realistically trading starts on a Thursday and Friday'' is said once and then contradicted
  later in the same stream when he says he does sometimes favour trading Mondays.'
- Which external range (daily, weekly, monthly) must be taken for the manipulation is not
  fixed.
