id: ny-am-time-level-cascade
name: New York AM Time-Level Cascade (8:30 / 9:30 / 10:00)
definition: 'A compressed if-then chain that assigns the manipulation and the expansion to
  specific New York morning clock levels. He names 8:30 and 9:30 as the two most important
  time levels when entering the New York session WITH a bias, and then branches on whether
  London has already set the day''s extreme. If London has set it, the day is a continuation
  and the only question is which level makes the opposing run: if 8:30 makes the opposing
  run, 9:30 expands; if 8:30 fails to make it, 9:30 makes the opposing run and 10:00 expands.
  If London has NOT set the day''s extreme, the same two levels are candidates to set it:
  8:30 makes the low of day and 9:30 expands, or 8:30 fails and 9:30 makes the manipulation,
  with expansion at 9:30 itself or deferred to 10:00. In every branch the pattern is identical
  - one level manipulates, the next one expands - and the cascade only ever shifts one slot
  later when a level fails to deliver its manipulation.

  '
category: time
status: underspecified
aliases:
- 8:30 and 9:30 are the most important time levels
- NY AM opposing-run cascade
- which time level expands
preconditions:
- A directional bias is already held coming into the New York session (the rule is stated
  only for the with-a-bias case).
- 'The London session''s outcome is known: whether it did or did not set the day''s high or
  low.'
detection_rules:
- 'Bullish worked case. Step 1: ask whether London set the low of day.'
- If London DID set the low of day, treat New York as a continuation and go to step 2.
- 'Step 2: does 8:30 make an opposing run? If yes, expect 9:30 to expand.'
- If 8:30 does NOT make an opposing run, expect 9:30 to make the opposing run and 10:00 to
  expand.
- 'If London did NOT set the low of day, look for 8:30 or 9:30 to set it: if 8:30 makes the
  low of day, 9:30 can expand; if 8:30 fails, 9:30 makes the manipulation and either expands
  or defers the expansion to 10:00.'
- Bearish case is stated as the mirror (the source works the bullish example explicitly).
invalidation:
- Not stated. The source gives no rule for abandoning the day when neither 8:30, 9:30 nor
  10:00 produces the expansion.
measurable:
- frequency of each branch (London-set vs 8:30-set vs 9:30-set extreme)
- conditional probability that 9:30 expands given an 8:30 opposing run, versus the unconditional
  9:30 expansion rate
- share of the day's range delivered in the predicted expansion slot vs the other two
- how often the cascade slips a second time (both 8:30 and 9:30 fail, 10:00 does not expand)
