ambiguities:
- NO TIMEZONE IS SPOKEN. The times are bare clock numbers; Eastern is the corpus-wide convention
  but is not stated in either Short.
- '''Opposing run'' is the gate at every branch and is not defined or bounded here - no minimum
  range, no duration, no requirement that it sweep a level.'
- '''London has set the low of day'' is not decidable in real time; it is a hindsight statement
  used as a live precondition, and no confirmation test (e.g. an hourly CISD) is attached
  to it in this Short.'
- No tolerance window is given around any time - whether 8:33 still counts as '8:30' is not
  stated, nor whether the level means the candle open or the whole 8:30-9:00 period.
- Only the bullish direction is worked; the bearish mirror is assumed, not shown.
- The companion 9:30 Short adds that the lower-timeframe change in the state of delivery may
  be a closure right at the 9:30 open OR an opposing run then a close over it, which makes
  'opposing run at 9:30' and 'expansion at 9:30' possible in the same candle. The two Shorts
  are not reconciled.
