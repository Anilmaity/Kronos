ambiguities:
- '''Eastern Standard time'' is said literally; whether he means EST year-round or the New
  York local clock (EST/EDT) is not addressed anywhere in this unit.'
- He says 'EST' literally, not 'EDT' or 'New York time'. Whether he means the fixed UTC-5
  offset or the observed US Eastern clock (which is EDT for most of the trading year) is not
  addressed anywhere in the corpus. The 9:30 = cash-open anchor implies the observed Eastern
  clock, i.e. America/New_York with DST.
- He trades CME futures on Ninja Trader with CME data; whether his platform clock is exchange
  time (CT) shifted to display ET is never stated.
- He says 'New York local time', which is the TradingView setting name and follows daylight
  saving; the corpus elsewhere says 'Eastern Standard Time'. The two differ by an hour for
  part of the year and the discrepancy is never addressed.
