id: est-timezone-anchor
name: Session Clock Is Eastern Standard Time
variants:
  name:
  - Session Clock Is EST (New York Time)
  definition:
  - 'Every clock time used in this corpus - 8:30, 9:15, 9:30, 9:45, 10:00, 10:30, 11:00 -
    is New York time. The speaker states the timezone once, explicitly, while telling a viewer
    where to scrub back to in the stream recording: ''Go to 954 EST on the video.'' The anchor
    is corroborated structurally: he explains that 9:30 matters because that is when SPY /
    the normal (US cash) market opens, which is 9:30 New York time.'
  - 'Corroboration from the platform settings themselves: walking through his TradingView
    chart configuration he states the chart is always in New York local time. Every bare clock
    time elsewhere in this unit (18:00, midnight, 08:30, 09:30, the 08:30-to-12 trading window)
    is therefore read on that clock.'
definition: 'All time levels he marks are stated in Eastern Standard Time. He also states
  that the time OPENINGS themselves differ by asset class: on forex the 4-hour candles change
  and there is effectively no 09:30 open.'
category: time
status: contested
aliases:
- EST
- New York time
- New York local time
- chart timezone
preconditions:
- A charting platform with a configurable timezone.
detection_rules:
- Set the chart timezone to Eastern Standard Time before marking any time level.
- Re-derive the 4-hour boundaries when switching asset class; do not carry the index grid
  onto forex.
- Drop the 09:30 level entirely on forex.
- Interpret every bare clock time in this corpus as America/New_York.
- 9:30 is the US cash equity open (SPY / NYSE), which fixes the clock to New York.
- The stream itself starts at 9:15 a.m., fifteen minutes before that open.
- Set the chart timezone to New York local time before marking any time level.
- Interpret every bare clock time in this unit as America/New_York.
invalidation:
- Not applicable - a chart setting.
measurable:
- misalignment of the 4-hour grid when a non-EST chart timezone is used
- re-running any session-window backtest under America/New_York vs UTC and comparing trade
  counts
- level-timing differences introduced by charting on any other timezone
