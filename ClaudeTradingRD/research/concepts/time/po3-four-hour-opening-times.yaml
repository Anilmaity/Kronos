id: po3-four-hour-opening-times
name: 4-Hour Power of Three Openings (futures vs forex grids)
variants:
  name:
  - 4-Hour Power of Three Openings
  definition:
  - 'SHORTS EVIDENCE naming two concrete 4-hour opening times and the if-then that links them.
    The 6 a.m. 4-hour candle is where the higher-timeframe wick forms; if 6 a.m. forms the
    REVERSAL, then the 10:00 a.m. 4-hour candle is looked at to CONTINUE - that being the
    candle 3 continuation, or the continuation expansion candle. Execution is dropped onto
    the paired hourly and 5-minute fractal model, waiting for the T-spot: price opens, makes
    its wick inside the zone, then trades away.'
  - 'The intraday working unit is the 4-hour candle, each of which is treated as a complete
    Power of Three (open = accumulation, wick = manipulation, body = distribution, close =
    opposite wick). Index futures produce four 4H candles per day, opening at 02:00, 06:00,
    10:00 and 14:00 New York time. Forex produces only three usable 4H candles, opening at
    01:00, 05:00 and 09:00 New York time, because the PM period is the London close and delivers
    only small moves.

    '
definition: 'The 4-hour power-of-three is anchored to a fixed grid of candle opens, and this
  video states that the grid DIFFERS between futures and forex -- an hour apart. The futures
  candles referenced in the walkthroughs are 02:00, 06:00, 10:00 and 14:00 (New York time),
  implying the 18/22/02/06/10/14 grid. The forex candles referenced are 17:00, 21:00, 01:00
  and 09:00, implying a 17/21/01/05/09/13 grid. He introduces the forex example by saying
  the timings are different from futures, so the divergence is deliberate, not a transcript
  artifact. Operationally: a 02:00 (London) reversal implies the 06:00 candle continues, and
  the 10:00 candle continues conditional on 06:00 closing strongly.'
category: time
status: contested
aliases:
- 4-hour grid
- 6am 10am candle
- four hour candle openings
- the 2am 6am 10am 2pm candles
preconditions:
- A daily bias and a 4-hour candle 2 / candle 3 read.
- A previous day extreme has been swept and expansion has printed a reversal.
- Instrument class is known (index futures vs forex), because the opening clock differs.
detection_rules:
- 'Futures 4-hour opens used in this unit: 02:00, 06:00, 10:00, 14:00 New York (with 18:00
  and 22:00 completing the grid).'
- 'Forex 4-hour opens used in this unit: 17:00, 21:00, 01:00, 09:00 New York (with 05:00 and
  13:00 completing the grid).'
- A 02:00 reversal (London) implies 06:00 as the continuation candle.
- 10:00 is treated as conditional on 06:00 closing strongly.
- Only trade the third expansion candle in the sequence if the drawn liquidity has not yet
  been met.
- At the close of an expansion candle (e.g. 14:00) do not fight it -- wait for the close and
  then for a reversal candle to form.
- Read the 4-hour candle that opened at 6 a.m. - is it a reversal (large opposing wick)?
- If 6 a.m. formed the reversal, expect the 10:00 a.m. 4-hour candle to be the continuation.
- That 10:00 a.m. candle is the candle 3 / continuation expansion candle.
- Execute on the paired hourly and 5-minute fractal model, in the T-spot.
- Stop on the opposing candle or on the fair value gap; target 2R or the negative one standard
  deviation.
- 'Index futures: a new 4H PO3 begins at 02:00, 06:00, 10:00, 14:00 New York.'
- 'Forex: a new 4H PO3 begins at 01:00, 05:00, 09:00 New York.'
- All stated times are New York time.
invalidation:
- The higher-timeframe target is reached inside the earlier candle -- the later candle in
  the sequence is no longer sought.
- Not applicable - this is a clock definition, not a setup.
measurable:
- expansion of the 06:00 and 10:00 candles conditioned on a 02:00 reversal
- whether the forex grid or the futures grid better fits realised 4-hour swings on FX pairs
- share of 6 a.m. reversal candles followed by a 10 a.m. continuation candle
- 2R hit rate of T-spot entries inside the 10 a.m. candle
- distribution of high-of-day / low-of-day formation across the four 4H opens
- average range of the 14:00 forex candle vs the other three (tests the 'forex has only three'
  claim)
