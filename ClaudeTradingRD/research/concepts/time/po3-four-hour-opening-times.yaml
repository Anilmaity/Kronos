ambiguities:
- The exact grids are shown on-screen as slides and only partially spoken; the futures set
  02/06/10/14 and the forex set 17/21/01/09 are the values actually verbalised, and 18/22
  and 05/13 are completed by inference.
- The timezone is not named in this video; New York is assumed from the rest of the corpus.
- No explanation is given for WHY the forex grid should be offset by an hour from the futures
  grid.
- '''Strong closure'' on the 06:00 candle is unquantified.'
- The timezone of '6 a.m.' and '10:00 a.m.' is not stated in the Short (the library elsewhere
  anchors the session clock to EST, but this clip does not say so).
- Only two of the six 4-hour opens are named; the rest of the grid is not given here.
- It is not stated whether this is the futures grid or the forex grid.
- Whether these are exchange-session-adjusted opens or fixed wall-clock opens is not stated.
- Daylight-saving handling is never mentioned.
- GxTradez lists only 2am/6am/10am for futures and does not discuss forex; the 14:00 candle
  and the forex clock come from DexterLab alone.
