ambiguities:
- NO TIMEZONE IS STATED for 'midnight' anywhere in this unit - the same gap the later corpus
  has.
- How far below the midnight open price must trade is not stated.
- Whether the condition is a wick through or a close through is not stated.
- Auto-caption renders 'buy day' as 'by day'.
- 'PROVENANCE: this is the EARLIER Education - ICT recording. The later, canonical material
  (ttfm-minimal-toolkit, entry-time-window) lists the midnight open among the tools he NO
  LONGER uses, and the existing entry under this id comes from the updated playlist''s Twitter-model
  video. Both readings are kept; this one is the older.'
- No timezone is spoken in the transcript body - only the video title carries (EST).
- No rule is given for when the midnight open and when the 08:30 open governs; both are used,
  and 'either' is enough for the plain filter while 'both' defines the deep case.
- '''Failing to close above/below'' is applied to intraday candles whose timeframe is never
  named.'
- The chart is index futures throughout; the 08:30 level is a US-data-release open and no
  equivalent is offered for other asset classes.
- The time zone of 'midnight' is not stated in this video (the rest of the corpus uses New
  York time).
- No rule distinguishes when to use the midnight open and when to use the daily open - both
  are shown, the swap is unexplained.
- Whether the filter applies to the entry price only or also to the stop and target is not
  addressed.
- The Short shows the short-above-midnight side only; the long-below mirror is not stated
  here.
- No stop is given anywhere in the clip.
- The transcript renders "reached above previous day high" as "wretched above previous day
  high" - an auto-caption artifact, not a term.
- It is not said whether the midnight-open filter is a hard gate or a preference.
- Time zone is not stated in this video; the levels are named as 'midnight' and '8 30' with
  no exchange or zone.
- Whether the test is on the wick or the body being below both opens is not stated.
- The rule is asserted as ICT's teaching and given no evidence.
- No rule for the case where price is above one open and below the other.
