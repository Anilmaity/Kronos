id: midnight-open-directional-filter
name: Midnight Open As A Directional Filter
variants:
  name:
  - Only Short Above The Midnight Open, Only Long Below It
  definition:
  - 'EARLIER RECORDING, and the channel''s dedicated video on the two levels. Two opening
    prices are marked - the midnight open and the 08:30 open - and they are used three ways.
    (1) As a directional filter expressed in premium/discount language: below either level
    is a discount and is where longs are looked for; above either is a premium and is where
    shorts are looked for. (2) As pivots: in choppy conditions price bounces around the level,
    and failing to close beyond it is read as a signal for continuation the other way. (3)
    As targets: after an aggressive sell-off or breakout away from them, the same two levels
    become the objective for the move back. The stated purpose behind all three is capturing
    the daily range - the manipulation leg of a buy day normally sits below these levels and
    of a sell day above them.'
  - 'A hard directional gate on entry price used inside the Twitter model: shorts may only
    be taken above the midnight open, longs only below it. The level is drawn automatically
    by the ICT Killzones & Pivots indicator with everything switched off except the midnight
    opening price. In the final example he substitutes the DAILY open for the midnight open
    and takes a short above that instead, without giving a rule for when the substitution
    applies.'
  - 'A Short works the filter inside a three-timeframe stack and makes the target explicit.
    Daily: price has reached above the previous day high. Hourly: identify a bullish fair
    value gap below. 15-minute: look to SHORT ABOVE THE MIDNIGHT OPEN, targeting that hourly
    fair value gap. The trigger shown is an SMT plus a market structure shift, after which
    any retracement is sold above the midnight open. He closes by stating the stack is fractal:
    the same daily / hourly / 15-minute triple can be shifted up to weekly / 4-hour / hourly,
    or down.'
  - '$niper''s two-line reading of the midnight and 08:30 opening prices, which he attributes
    to ICT. Price trading below BOTH the midnight opening price and the 08:30 opening price
    is in deep discount: he will not look for sells there, only buys at or above those levels.
    Price trading above both is in deep premium: he anticipates a retracement down into discount.
    He frames the purpose as a risk-to-reward device - it stops you selling the bottom.

    '
definition: 'EARLIER RECORDING. The midnight opening price is marked during preparation and
  used as a directional precondition: on a day he expects to be bullish he wants to see price
  trade BELOW the midnight open before looking to get long - he calls that the classic buy
  day. In the same unit it is also used passively as a reference the market respects (in the
  Twitter-model examples, price retests midnight and no bodies close below it before expanding),
  and as a timing marker for where the hourly point of interest should form.'
category: time
status: contested
aliases:
- midnight opening price
- classic buy day
- midnight open
- 8:30 open
- 830 open
- line in the sand
- above midnight open
- daily open filter
- deep discount
- deep premium
- midnight and 8:30 opening price
preconditions:
- A directional expectation for the day already exists.
- The midnight opening price is drawn on the chart.
- The midnight (00:00) and 08:30 opening prices are marked on the intraday chart.
- A daily directional read (buy day / sell day) exists.
- The midnight (00:00) opening price is marked on the chart.
- Price has reached above the previous day high (bearish case).
- An opposing higher-timeframe fair value gap exists as the target.
- The midnight opening price and the 08:30 opening price are plotted (he uses an indicator
  for this).
detection_rules:
- Mark the midnight opening price.
- 'Bullish day: require a move BELOW the midnight open before taking a long (''classic buy
  day''). Bearish mirrors.'
- Watch whether bodies close through the level - bodies respecting it while wicks pierce it
  is treated as confirmation.
- The hourly point of interest is expected to form around the midnight open or just before
  New York.
- 'Mark two levels: midnight_open (00:00 open) and eight_thirty_open (08:30 open).'
- Longs are looked for below either level; shorts above either level.
- On a sell day the manipulation / opposing run normally prints ABOVE these levels; on a buy
  day BELOW them.
- 'Pivot use: price failing to close back above a level after trading below it signals continued
  downside (mirror for upside).'
- 'Target use: after an aggressive move away from the levels, they become the objective for
  the return move.'
- Look for the lower-timeframe setup, and for PD arrays, in the area beyond these levels rather
  than at the levels themselves.
- Compute midnight_open := the opening price of the 00:00 candle.
- Short entries are permitted only at prices above midnight_open.
- Long entries are permitted only at prices below midnight_open.
- A stated variant substitutes the daily open for the midnight open.
- 'Daily: price reaches above the previous day high.'
- 'Hourly: identify the bullish fair value gap that will be the target.'
- '15-minute: sell only ABOVE the midnight open.'
- 'Trigger: an SMT plus a market structure shift; then sell any retracement above the midnight
  open.'
- 'Target: the hourly fair value gap.'
- The whole triple is fractal - shift it up to weekly / 4-hour / hourly or down to lower timeframes.
- 'If price is below the midnight open AND below the 08:30 open, classify as deep discount:
  no sells; look for buys at or above those two levels.'
- 'If price is above the midnight open AND above the 08:30 open, classify as deep premium:
  anticipate a retracement into discount.'
- Both levels must agree - the classification is stated on the pair, not on either alone.
invalidation:
- Price never trades back through the midnight open.
- Price closing back through the level after failing to displace away from it reverses the
  read.
- Price never offering an entry on the permitted side of the level - the setup is skipped.
- Price holds above and trades away from the midnight open without reaching the fair value
  gap.
- Not stated as a separate condition; the classification simply flips when price crosses back
  through the two opens.
measurable:
- share of bullish days on which price trades below the midnight open before the low of day
- hit rate of longs taken with vs without the below-midnight-open condition satisfied
- share of days whose high (sell days) or low (buy days) forms beyond the midnight / 08:30
  open
- hit rate of the two opens as return targets after a day's aggressive move away from them
- expectancy of entries taken on the permitted side of the level versus the other side
- share of otherwise valid signals filtered out by the midnight-open condition
- expectancy of filtered vs unfiltered signals on the same sample
- difference in outcome between the midnight-open and daily-open variants
- fill rate of the opposing hourly FVG after a PDH run
- hit rate of shorts taken above versus below the midnight open on the same signal
- expectancy of the same entry model with and without the both-opens filter applied
- how often price closes the day back through the two opens after being classified deep
