ambiguities:
- Whether the Friday candle 2 closure must additionally carry an hourly change in the state
  of delivery, as every other candle 2 closure in the series does, is not stated for this
  case.
- The Intraweek Reversal example specifies the Friday candle 2 closure is 'in a point of interest';
  whether that is required or incidental is unclear, since the Thursday Counter example instead
  pairs the Friday closure with an SMT.
- No stop or target convention is given for the Monday trade itself.
- The rule is stated as personal practice ('the only time I will trade a Monday'), so it is
  a filter on his participation rather than a claim about Monday's behaviour.
- '''Reversal day'' is used here without the candle-2-closure qualifier applied to it in the
  weekly-profile series, where Monday is candle 3 of a Friday candle 2 closure.'
