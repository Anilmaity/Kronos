id: monday-trade-rule
name: The Monday Rule (when Monday is tradeable)
definition: 'A single decidable filter on trading the first day of the week. The speaker states
  that the only time he will trade a Monday is when the previous Friday formed a reversal
  or a candle 2 closure, which makes Monday the candle 3 of that sequence. Absent a Friday
  reversal, Monday is not traded - it is instead left to print, because in the weekly profile
  framework Monday''s job is either to make the weekly extreme (classic expansion) or to run
  opposite the bias and form the weekly wick. The rule is stated in the Intraweek Reversal
  video in answer to a common question and is applied again as the opening move of the first
  Thursday Counter example.

  '
variants:
  definition:
  - 'Restated verbatim under a viewer question about skipping Mondays entirely: the only time
    he looks to trade a Monday is when Friday produced a reversal day. He also declines to
    anticipate over the weekend on instruments that gap - oil is named - preferring to let
    the gap resolve into a marked level first.'
category: time
status: contested
aliases:
- do you trade Mondays
- Monday as candle 3
preconditions:
- The previous week's Friday has closed.
- The previous Friday closed as a reversal day.
detection_rules:
- Check whether Friday closed as a reversal or a candle 2 closure, ideally at a point of interest.
- If yes, Monday is candle 3 of that sequence and is tradeable as a continuation of Friday's
  reversal.
- If no, do not trade Monday; let it print and use it to classify the week's profile.
- Monday is tradeable only if Friday formed a reversal.
- Otherwise skip Monday and let its range form.
- Do not carry weekend anticipation into gap-prone instruments.
invalidation:
- Friday was not a reversal / candle 2 closure - Monday is simply not taken.
- 'Not stated: no rule is given for abandoning the Monday trade once Monday opens against
  it.'
measurable:
- frequency of Fridays that close as a candle 2 closure / reversal
- hit rate of Monday continuing in the direction of a prior-Friday reversal, versus the unconditional
  Monday continuation rate
- how often a Monday traded under this rule also turns out to be the week's extreme day
- expectancy of Monday trades with and without a Friday reversal
sources:
