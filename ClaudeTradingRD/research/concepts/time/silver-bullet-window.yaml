  title: ICT Killzones & Indicator Settings
ambiguities:
- He mentions a possible PM-session version but does not give its window.
- The window coincides exactly with the 10:00 4-hour open he teaches elsewhere; he does not
  say whether that is the reason.
- Only ONE Silver Bullet window is named here; whether other windows exist is not addressed,
  and the topic is explicitly delegated to ICT's channel.
- No entry, stop or target rules are given — the video covers only how to draw the window
  on the chart.
- Whether the window applies to forex, indices, or both is not stated.
