id: silver-bullet-window
name: Silver Bullet Window (10:00-11:00 AM)
variants:
  name:
  - Silver Bullet Window
  definition:
  - 'A one-hour window inside a killzone, in New York time, during which the speaker looks
    for price to draw to a liquidity pool. The only window actually named and demonstrated
    in this video is 10:00-11:00 New York time, marked either with vertical timestamp lines
    or by repurposing the indicator''s "New York lunch" session box. He explicitly defers
    the detail to ICT''s own channel.

    '
definition: 'The AM-session Silver Bullet window is 10:00 to 11:00 New York. He states the
  constraint twice and enforces it mechanically in the backtest: the only time he will take
  an entry is if the setup appears between 10 and 11, and an order still unfilled at 11:00
  is cancelled.'
category: time
status: contested
aliases:
- am session Silver Bullet window
- Silver Bullet
- the one hour window
preconditions:
- Chart on New York time.
- An identified draw on liquidity.
detection_rules:
- Mark 10:00 and 11:00 New York with vertical lines.
- Entries must be filled inside that window.
- Cancel any unfilled order at 11:00.
- No qualifying sweep/entry by 11:00 = no trade.
- silver_bullet_window := 10:00-11:00 New York time (the only window stated in this unit).
- Inside the window, look for a setup delivering price to an already-identified liquidity
  pool.
invalidation:
- Not stated.
measurable:
- share of qualifying setups that fill before 11:00
- frequency with which a liquidity pool is reached during 10:00-11:00 NY
- share of daily range delivered inside the window
sources:
- video_id: o0v4KQxZbpU
  title: ICT Silver Bullet Strategy - No Daily Bias | With Backtest!
  quote: 'I''m going to be focusing on the 10 to 11: a.m. time window'
- video_id: o0v4KQxZbpU
