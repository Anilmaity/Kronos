ambiguities:
- Whether to enter before or only after 08:30 on Friday is implied ('use the release as a
  driver') but not stated as a time gate.
- The transcript renders NFP as 'NSP' in places.
- '''Post release'' is not bounded — how long after 08:30 the avoidance lifts is not stated.'
- A week carrying both FOMC and NFP (his first example) collapses to two tradeable days; whether
  that is the general consequence is not stated as a rule.
- The 'specific and convincing signature' permitting a Tuesday/Wednesday trade is illustrated
  once (ES ran previous week/day high and closed below the up-close candle, with NQ SMT) but
  never generalised.
- No stop rule is given for the Friday trade.
- Whether the protocol changes when NFP falls outside the first Friday is not addressed.
