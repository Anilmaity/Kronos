id: quarter-month-close-expectation-cap
name: Expect Less From Price In The Closing Week Of A Month Or Quarter
definition: 'Rauf applies a calendar dampener: when the week under analysis is both the last
  week of the month and the last week of the quarter, he says you cannot expect too much from
  the market and he would not expect much from price. His concrete adjustment is not to abandon
  the direction but to shorten the ambition - he still expects the monthly draw (a high taken)
  but then expects price to close back into the fair value gap that caps the monthly candle,
  rather than running a full expansion.'
category: time
status: specified
aliases:
- end of quarter week
- monthly candle close week
preconditions:
- The current week contains a month end and/or a quarter end.
detection_rules:
- Check whether the week is the closing week of a month, a quarter, or both.
- If so, keep the directional read but reduce the expected range.
- Expect the draw to be tagged and then price to close back into the range / fair value gap
  that caps the higher-timeframe candle.
measurable:
- realised weekly range in month-end and quarter-end weeks vs other weeks
- how often the higher-timeframe draw is tagged and then reversed into within such a week
sources:
- video_id: qFtfD09Vv3E
  title: Live with Day Trading Rauf - Preparing for a New Week
  quote: it is a end of the quarter week and we are closing the monthly candle
- video_id: qFtfD09Vv3E
  title: Live with Day Trading Rauf - Preparing for a New Week
  quote: I wouldn't expect too much from Price
ambiguities:
- '''Not too much'' is never quantified - no ATR fraction or point figure.'
- It is not stated whether month-end alone triggers the same dampener as month-end plus quarter-end.
