ambiguities:
- No timezone label is ever spoken in these four streams. The clock is pinned only indirectly
  - 09:30 is stated to be the New York stock market open, which is 09:30 New York time by
  definition, and 10:00 is stated to open a new 4-hour candle. Both are inferences from what
  he says, not statements he makes.
- No tolerance window around any time (is 09:33 still "9:30"?).
- The 08:30 reversal / 09:30 continuation pairing is referred back to a separate time video
  that is not in this unit.
- He says he does not trade past about 11:00 but gives no rule, only a habit.
- The Short slides between 8 and 8:30 in one sentence ("as 8 or 8:30 has already reversed")
  without saying whether the hourly candle 2 closure must be the 08:00 candle specifically.
- No timezone is stated in the clip - EST is assumed from the rest of the corpus, not from
  here.
- '"Candle to closure" is the auto-caption rendering of "candle 2 closure" throughout.'
- No target is given for the anticipated 09:30 expansion in this clip, only the entry and
  the stop.
- No timezone is stated anywhere in the unit.
- The videos repeatedly refer back to a separate 'important time levels' video that is not
  in this unit, so the list here may be partial.
- No tolerance window is given around any of the times (is 08:33 still '8:30'?).
- The claim that 10:00 completes the day's extreme is asserted via the 4-hour OHLC but the
  mechanism is not explained here.
- '''Respected'' for midnight open is not quantified (wick touch vs close).'
