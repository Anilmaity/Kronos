id: new-york-intraday-time-levels
name: New York Intraday Time Levels (8:30 / 9:30 / 9:45 / 10:00)
variants:
  name:
  - New York Intraday Time Levels (8:30 / 9:30 / 10:00, Midnight Open)
  definition:
  - 'A Short names the specific sequence he wants when trading the New York open, and it is
    anchored at 08:00, not 08:30: he looks for an 8:00 a.m. reversal, i.e. a candle 2 closure
    on the HOURLY chart at 08:00. That lets him anticipate the 9-to-10 a.m. hourly candle
    - or the 09:30 open - to expand, on the reasoning that 8 or 8:30 has already done the
    reversing. Execution is on the lower timeframe: the 8 a.m. hourly candle forms the reversal,
    a lower-timeframe change in the state of delivery prints, and a continuation forms PRIOR
    to the 09:30 open, which is the entry, with the stop on that low. A second Short shows
    the 08:30 counterpart live: 08:30 makes the opposing run against the anticipated daily
    order flow (the Judas swing) into the order block.'
  - 'The clock times inside the New York a.m. session at which the daily profiles are expected
    to resolve. 08:30 is where the manipulation or opposing run occurs and where the order
    block is built; 09:30 is where the continuation begins; 10:00 is repeatedly cited as where
    the day''s high or low completes, attributed to the 4-hour open-high-low-close. Midnight
    opening price is used both as an intraday support/resistance reference and as a partial-profit
    level.

    '
definition: 'The clock structure of his trading morning, stated repeatedly and with numbers.
  09:30 is the open he waits for, and when asked why that time matters at all he answers that
  it is when the New York stock market opens - the only causal anchor for the clock given
  anywhere in this unit. The volatility he needs comes in the 09:30-10:00 window; he says
  the move he wants normally happens in the first fifteen minutes and that 09:30-09:45 runs
  out the targets. 09:45 is named as an area where he can take profit, and 10:00 as the final
  take-profit and the point after which he stops caring. He also notes an 08:30 reversal followed
  by a 09:30 continuation as a sequence he has covered in his time video.

  '
category: time
status: contested
aliases:
- the opening move
- 9:30 to 10:00
- important time levels
- 8:30 manipulation 9:30 continuation
preconditions:
- Instrument is an index future (he says the same times do not drive currencies).
- Intent to trade the New York open.
- A daily directional read already in place (second Short).
- The New York a.m. session (08:30-12:00) and midnight opening price are marked.
detection_rules:
- 09:30 - the equity open; wait for it when the pre-open structure is ambiguous, and let it
  resolve direction.
- 09:30-10:00 - the volatility window; the move is expected to complete inside it, often within
  the first fifteen minutes.
- 09:45 - first take-profit area for an opening-move trade.
- 10:00 - final take-profit / time-based exit; after it he treats the day as over.
- 08:30 reversal into a 09:30 continuation is a recognised sequence.
- On the HOURLY chart, look for a candle 2 closure on the 08:00 candle - the "8:00 a.m. reversal".
- Given that reversal, anticipate the 9-to-10 a.m. hourly candle, or the 09:30 open, to expand.
- 'Drop to the lower timeframe: require a change in the state of delivery after the 8 a.m.
  reversal.'
- Require a continuation to form BEFORE the 09:30 open; enter there with the stop on that
  low.
- 'Complementary case: 08:30 makes an opposing run against the anticipated daily order flow
  - the Judas swing - and the candles it prints into the level become the order block.'
- '08:30: expect the manipulation / opposing run. Its extreme is the stop reference and the
  candles it prints form the order block.'
- '09:30 (New York open): expect the continuation in the profile''s direction. New York open
  itself can be the order block level.'
- '10:00: the day''s high or low frequently completes here; he attributes this to the 4-hour
  OHLC.'
- 'Midnight opening price: used as intraday support/resistance and as a partials level; in
  one example the down-close series forming the CISD coincided with it.'
invalidation:
- Not stated - these are windows in which events cluster, not signals.
- No candle 2 closure prints on the 08:00 hourly candle - the sequence he is looking for is
  absent.
- Not stated. These are expectations about where events cluster, not signals with an invalidation.
measurable:
- distribution of the day's extreme timestamp across 09:30 / 09:45 / 10:00
- share of the day's realised range delivered inside 09:30-10:00
- give-up in R from exiting at 10:00 versus holding
- expansion rate of the 09:00-10:00 hourly candle conditional on an 08:00 hourly C2 closure
- hit rate of entries taken pre-09:30 with the stop on the pre-open continuation low
- distribution of the daily high/low timestamp across 08:30 / 09:30 / 10:00
- how often the 08:30 move is counter to the eventual daily direction
- how often midnight opening price is respected as support/resistance during the a.m. session
