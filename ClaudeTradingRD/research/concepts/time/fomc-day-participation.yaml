id: fomc-day-participation
name: Trading On An FOMC / High-Impact Day
definition: 'Two incompatible policies are stated in the same stream. The host''s: he will
  trade before FOMC only if something is clean, but usually not; on the day in question he
  says he has no interest in trading FOMC and would rather wait for the following day, and
  he pre-frames the session as likely to consolidate because of the scheduled news. The opposing
  policy stated in the same conversation is to show up and run the same process every day
  and take the setup if one appears, on the argument that days scratched off in advance often
  turn out in hindsight to have carried clean setups.'
category: time
status: contested
preconditions:
- A scheduled high-impact release or speech during the session.
detection_rules:
- 'Reading A (host): trade before the release only if the setup is clean; default is to stand
  down and expect consolidation until the release, then look to the next day.'
- 'Reading B (stated by the guest in the same stream): run the normal process every day and
  take a setup if one qualifies.'
- Both readings agree that a speech landing on the open (a scheduled speaker at 9:30) is a
  bad combination with an opening-drive idea.
invalidation:
- Not applicable - a participation policy.
measurable:
- expectancy on scheduled-event days vs all days
- share of event days that produce a qualifying setup at all
sources:
- video_id: tDiwwMRWF2k
  title: New York Open Live Q&A with NickDoesFutures
  quote: If something's clean. But usually not.
- video_id: sdZkE-naNiY
  title: TTrades Indicator Updates - Walkthrough and Q&A
  quote: This is not a good closure for gold
ambiguities:
- The auto-transcript's speaker markers are unreliable here; reading B is assigned to the
  guest on context (it follows his own commentary) but the attribution is not certain.
- The second source quote is only weakly related - it is the host declining to frame a day
  whose closure gives him nothing, which is the same posture applied to a different cause.
  No FOMC statement occurs in the indicator video.
- No rule is given for how long after a release trading may resume.
