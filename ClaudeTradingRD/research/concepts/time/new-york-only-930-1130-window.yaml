id: new-york-only-930-1130-window
name: Trade Only New York, 9:30 to 11:30
definition: 'The guest''s fixed trading window: New York only, 9:30 to 11:30, with the stated
  rationale that limiting the amount of time he trades raises the probability of not making
  mistakes. He attributes most mistakes to being at the screen too long - skipping meals,
  not leaving the chair - and enforces the cutoff structurally by scheduling meetings at 11:30
  and other commitments at 12:00 so that he has to leave. He will occasionally look in on
  an Asia session but risks nothing significant there.'
category: time
status: specified
aliases:
- I just trade from 9:30 to 11:30
preconditions:
- None.
detection_rules:
- Only take trades between 9:30 and 11:30 in the New York session.
- Outside that window, do not risk anything significant.
- Schedule a hard commitment at the end of the window to force disengagement.
invalidation:
- Not applicable - a session policy.
measurable:
- P&L inside 9:30-11:30 vs outside it
- error / rule-break rate per hour of screen time
