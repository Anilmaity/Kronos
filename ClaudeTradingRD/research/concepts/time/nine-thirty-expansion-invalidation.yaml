id: nine-thirty-expansion-invalidation
name: The 9:30 Expansion Idea And When It Dies
definition: 'The single idea he carries into a New York open: the 9:30 open should push price
  directly into the marked target, in this session the previous day low on the indices. The
  idea is framed before the open and has one kill condition - if price instead comes back
  and takes out the high that framed the move, invalidating the protected swing, the idea
  is over for him and the session is reclassified as chop. He is explicit that the target
  can still be reached later (after the scheduled event) but that he no longer has an interest
  once the opening drive has failed.'
category: time
status: specified
aliases:
- 9:30 breakout to previous day low
- opening drive
preconditions:
- A target marked before the open (previous day low/high).
- A protected swing framing the intended direction.
detection_rules:
- Expect the move into the target to begin at the 9:30 open.
- If price returns and takes out the protected swing's high (bearish case), the opening-drive
  idea is invalidated.
- After that invalidation the session is treated as chop and no re-entry is sought.
- Reaching the target later in the day does not retroactively make the idea tradeable.
invalidation:
- The protected swing that framed the move is taken out.
measurable:
- share of sessions where the 9:30 drive reaches the previous day extreme
- outcome of continuing to trade the idea after the framing swing is taken out
sources:
- video_id: tDiwwMRWF2k
  title: New York Open Live Q&A with NickDoesFutures
  quote: I want to see 9:30 just push us into that low
ambiguities:
- No time zone is stated for 9:30 in this video (EST is stated only in the indicator video).
- No time limit is given for how long after 9:30 the drive may begin.
- Whether the same rule applies on days without a scheduled high-impact event is not addressed
  - this session had FOMC in the afternoon.
