id: macros-are-htf-opens
name: Macros Are Just Higher-Timeframe Candle Opens
variants:
  name:
  - Day's Quarter Theory Is Just Power Of Three On Session Opens (and is not used)
  definition:
  - The derivation of his intraday clock, given in full on stream. Entering around 9:31 leaves
    you inside a 15-minute, 30-minute, hourly and 4-hour candle that are all still forming.
    9:45 matters because a new 15-minute candle opens there. 10:00 matters because a new 30-minute,
    a new hourly and a new 4-hour candle all open simultaneously - which is why 10:00 is the
    point at which direction can change, with 9:45 the lesser alternative. He will not enter
    at 9:50, near the end of a 15-minute candle; he waits for the next candle open.
  - 'Asked whether he applies Day''s Quarter Theory, TTrades says he does not, and gives his
    reduction of it in the same breath: it is basically power of three based on sessions,
    or on the opens of different timeframes. The claim is that the theory adds a vocabulary
    rather than a mechanism already absent from the power-of-three read he already runs.'
definition: 'He rejects the ICT concept of intraday macro windows entirely. What people call
  a macro (for example 9:50 to 10:10) is, in his account, nothing more than the opening of
  new higher-timeframe candles at 10:00 (4-hour, 1-hour, 30-minute). Entering inside a mid-candle
  time window contradicts his own method, which requires letting the new candle open and form
  its wick before trading the body. He states he will never make a macro video except as a
  troll, and he likewise does not use kill zones, the midnight open, or the new day opening
  gap.

  '
category: time
status: contested
aliases:
- macros are not real
- 9:50 to 10:10 macro
- DQT
- quarterly theory
preconditions:
- An intraday time-window concept is being considered.
detection_rules:
- Identify what higher-timeframe candle opens at the start of the claimed macro window.
- Treat the behaviour as a function of that candle open, and wait for the candle to form its
  wick before trading.
- 9:45 = a new 15-minute candle opens.
- 10:00 = a new 30-minute, hourly and 4-hour candle all open together.
- Treat these as the points at which price can change direction, 10:00 being the stronger
  of the two.
- Do not enter late inside a forming candle; wait for the next candle open.
- All times are New York time (see est-timezone-anchor).
- Do not run Day's Quarter Theory as a separate framework.
- Where a quarter-theory level is quoted, treat it as a session open or a higher-timeframe
  candle open and read power of three from it.
measurable:
- comparison of volatility around HTF candle opens versus around claimed macro windows that
  do not coincide with one
- frequency of intraday direction change at 9:45 and 10:00 vs other quarter-hours
- agreement rate between quarter-theory levels and higher-timeframe candle opens
