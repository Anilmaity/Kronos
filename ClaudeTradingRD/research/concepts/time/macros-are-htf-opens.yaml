ambiguities:
- He concedes there are certain scenarios where a mid-candle window can work but declines
  to describe them.
- This directly contradicts mainstream ICT teaching, which treats macros as independent time
  windows; the corpus position is a rejection, not a reconciliation.
- The 4-hour candle opening at 10:00 implies a 4-hour series anchored at 02:00/06:00/10:00/14:00/18:00/22:00
  New York time; he never states the anchor explicitly.
- 8:30 is mentioned as one of the times price expands with volatility but is not derived from
  a candle open in the way 9:45 and 10:00 are.
- He does not walk the reduction; it is asserted in one sentence.
- The same video records him also rejecting MACD, central bank dealing ranges, COT, and analysis
  of ICT's logo proportions, without argument in each case.
