id: fomc-nfp-cpi-only
name: Only Three Releases Are Tracked; Never Trade After FOMC
variants:
  name:
  - FOMC, NFP, CPI Only
  definition:
  - 'Restated with a CPI reading that is unambiguous in this transcript: only FOMC, CPI and
    NFP matter (PMI and the 10 a.m. data are ignored). New boundary: these are the only releases
    he will not trade through or hold an intraday position through; he will trade the day
    before, but not the session immediately before the release.'
  - The entire economic calendar is reduced to three releases. Everything else - the red and
    orange impact colouring on calendar sites - is ignored. On FOMC day he holds no expectation
    for the release, does not trade after it, and waits for the next day. He also does not
    use fundamental analysis intraday.
  - Distinguishes the FOMC minutes from the FOMC rate decision. The minutes (released at 2
    p.m. that day) do not bring volatility and are ignored; only the actual FOMC (federal
    funds rate, statement, economic projections) does. With no USD 8:30 news and only crude
    inventories and minutes on the calendar, he cared about no news that day.
  - 'Restated: he does not trade through CPI, FOMC or NFP, and expects markets to stay rangebound
    before the FOMC release.'
  - 'Stated as his only news rule: he avoids the day of CPI, NFP and FOMC (and days where
    they coincide). He does not care much about the day before FOMC and thinks it can have
    fine moves, and he denies ever saying to avoid the session before PPI.'
  - He states plainly that he does not trade through NFP, CPI or FOMC. This spelling confirms
    that the library's 'API' reading was CPI, and adds that no position is held across any
    of the three releases, not just FOMC.
definition: 'Restated as ''don''t trade right before'' FOMC, NFP or CPI, and otherwise no
  news matters; orange folder news is ignored. New secondary list: crude oil inventories (normally
  10:30) matter only when trading oil; bond auctions ''sometimes''; and a Fed chair speech.

  '
category: time
status: contested
preconditions:
- A CPI, NFP or FOMC release is scheduled.
- One of NFP, CPI, FOMC is scheduled.
detection_rules:
- Do not enter shortly before an FOMC, NFP or CPI release.
- Ignore orange-folder (medium) news.
- If trading crude oil, also treat the 10:30 crude oil inventories release as a news event.
- Bond auctions and Fed chair speeches are optional secondary events.
- Track only FOMC, CPI and NFP; ignore PMI and other releases.
- Do not hold an intraday position through FOMC, CPI or NFP.
- Do not open a trade in the session immediately before one of these releases.
- Trading on the day before the release is allowed.
- Filter the economic calendar to the three named releases; ignore all other impact tiering.
- Do not take a trade after the FOMC release; resume the next session.
- Expect a low-quality, range-bound session on FOMC day before the release.
- No fundamental or rate-expectation input feeds the intraday model.
- FOMC minutes are not treated as an FOMC event.
- No position held through CPI / FOMC / NFP.
- Expect a range-bound session before FOMC.
- Skip trading entirely on the day of a CPI, NFP or FOMC release.
- The day before FOMC is tradeable.
- PPI is not a filter.
- Hold no open position across an NFP, CPI or FOMC release.
invalidation:
- Not applicable - a calendar filter.
- n/a
measurable:
- crude-oil intraday entries taken before vs after the 10:30 inventories release
- expectancy of signals taken after an FOMC release vs all other sessions
- how many sessions per year the filter removes
- expectancy on CPI/NFP/FOMC days vs other days
- expectancy on the day before FOMC vs other days
- equity curve with vs without trades open across the three releases
