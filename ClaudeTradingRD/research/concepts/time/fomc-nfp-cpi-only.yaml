ambiguities:
- Caption 'trading red older days' = red folder days.
- '''Right before'' is not quantified (minutes vs the session before); conflicts with other
  units that avoid the whole release day.'
- '''when Fed speaker. Not Powell anymore'' - the chair is meant; name not given.'
- '"Session before" is not mapped to clock times (e.g. whether London is the session before
  an 8:30 CPI).'
- He is holding a multi-day swing in this stream; whether swing positions are also flattened
  before these releases is not stated - "hold something intraday" suggests only intraday positions
  are excluded.
- Confirms that the earlier "API, FOMC, NFP" caption in this concept was CPI.
- The auto-captioner renders the three releases as 'API, FOMC, NFP'. FOMC and NFP are unambiguous;
  'API' is almost certainly CPI mis-transcribed (there is no plausible reason for the American
  Petroleum Institute crude stocks report to sit alongside FOMC and NFP for an index trader).
  It is recorded here as spoken rather than corrected.
- '''After FOMC'' is not bounded - no rule says whether the rest of that day or a fixed number
  of hours is excluded.'
- Nothing is said about trading before the release on FOMC day beyond low expectations.
- Conflicts with the library's 'do not trade after the FOMC release' (implies trading before
  it) and with pre-event-avoidance-rule (avoid days before); this stream says avoid the whole
  release day.
- '''Through'' is not bounded - whether he also stays flat for a window before/after is not
  said here.'
