ambiguities:
- PARTIAL ANSWER TO THE LIBRARY'S 'SESSION HOURS' GAP. 8:30 and 9:30 are given as the New
  York morning session's start and its next marker, but NO END TIME is stated and NO TIMEZONE
  is named in any video in this unit. The library's existing entry (from MPeeE55rNOw) gives
  full windows; this unit is consistent with its INDICES New York AM 08:30-11:00 but does
  not independently establish it.
- '''Which kill zones you enter in'' is framed as a per-trader choice, so the gate is configurable
  rather than fixed.'
- No hours at all are given for Asia, London or London close in this unit.
- Trader T's hours are on a broker server clock whose offset he says varies by MT4 build,
  so the times are not portable as spoken; both window ends are given as 'roughly' and the
  second window's start is stated as 12:30 in one place and 13:00 in another.
- His Eastern conversion implies a fixed 5-hour offset, which will drift across daylight-saving
  changes; this is not addressed.
- Ben names no clock times at all - 'the PM session' is left to the listener.
- $niper's AM preference is explicitly conditional on the current month's price action being
  poor, not a standing rule.
- None of the three states his window in a single agreed timezone, so the three cannot be
  compared directly from the transcripts alone.
- Daylight saving is handled by a UI instruction ('make TradingView show New York time') rather
  than a stated UTC-offset convention — a backtest must decide this itself.
- London Close (10:00-12:00) is listed for forex only; whether it applies to indices is not
  said.
- Why New York AM starts at 07:00 for forex and 08:30 for indices is not explained.
- '''Volatility is higher'' is asserted, never measured.'
- The killzone filter is applied in examples but only stated as a rule in the OTE video, in
  passing.
