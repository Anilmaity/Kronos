id: killzones
name: Killzones (Trading Sessions)
definition: 'EARLIER RECORDINGS. Two things this unit adds to the library''s killzone entry.
  First, the kill zone is stated as a REQUIRED CONFIGURATION CHOICE of any entry model - deciding
  which kill zones you enter in comes second only to deciding the execution timeframe, and
  models are hunted only inside them; his own choice is stated as the New York open. Second,
  the only explicit clock reading in the unit: the New York morning session is described as
  starting at 8:30 and then running into 9:30, with 8:30 also identified as the moment ''the
  news embargo lifts'' that separates London price action from New York''s.'
variants:
  definition:
  - 'Three guests in this unit gate execution on kill zones, and each names a different window
    - so the set is a comparison, not a consensus. Trader T is the only one who gives clock
    bounds: on his simulator''s server clock he trades roughly 07:00-10:30 and 12:30/13:00-15:00,
    and he cross-references that clock against a live chart to anchor it (on his build 08:00
    server = London open = 03:00 Eastern, and he deliberately starts an hour earlier at 07:00
    = 02:00 Eastern). He stops executing around 15:40 and treats 16:00 as outside his time
    entirely. Ben trades only in kill zones and explicitly prefers the PM session, because
    that is where he has the most data, where the daily draw is clearest to him, and where
    trading back inside the range suits him. $niper checks that his entries fall inside kill-zone
    times as part of confirming a smart money reversal, and says he currently prefers the
    AM session to the PM.

    '
  - 'Specific time windows during the trading day in which volatility is higher, making them
    the preferred windows for catching larger ranges. All times are New York time (EST). The
    windows differ between forex and index instruments in the New York portion. The speaker
    states that generally high-probability moves occur during killzones, and uses them both
    as a filter (an OTE tap outside a killzone is ignored) and as the structural map for the
    AMD day profile.

    '
