preconditions:
- Chart timezone configured (not stated in these videos).
- A session indicator is on the chart; Trader T's requires the platform clock to be verified
  against a live chart first.
- Chart timezone set so that it displays as New York time.
detection_rules:
- Choose the execution timeframe first, then choose which kill zone(s) the model is hunted
  in.
- Search for the entry model only inside the chosen kill zone.
- 'New York morning session: 8:30 start, running into 9:30.'
- 8:30 is the news-embargo boundary; price action before it (London) is treated as a different
  regime.
- 'His own stated choice: 1-minute / 15-second execution during the New York open.'
- 'Trader T: execute only inside 07:00-10:30 and 12:30/13:00-15:00 on the verified server
  clock; stop by about 15:40.'
- 'Trader T: the offset depends on which MT4 build the simulator runs on, so the mapping must
  be re-derived per platform, not assumed.'
- 'Trader T: record which kill zone each journalled trade fell in.'
- 'Ben: trade only in kill zones; his preferred window is the PM session, and he accepts missing
  AM moves rather than forcing them.'
- '$niper: treat the kill-zone window as part of the confirmation - an entry outside the kill
  zone is not taken.'
- None of the three trades outside a session window; the disagreement is only about WHICH
  window.
- 'FOREX: Asia 20:00-00:00; London 02:00-05:00; New York AM 07:00-10:00; London Close 10:00-12:00
  (all New York time).'
- 'INDICES: Asia 20:00-00:00; London 02:00-05:00; New York AM 08:30-11:00; New York PM 13:30-16:00.'
- Mark each session's high and low (killzone pivots) as liquidity.
- 'Day profile heuristic observed: Asia accumulates, London manipulates, New York distributes.'
- 'Filter usage: a setup that triggers outside a killzone is not taken — he skips it explicitly
  for that reason.'
invalidation:
- Not applicable - a time window either contains the bar or it does not.
- The window closes - Trader T abandons setups that mature after his cut-off even when they
  look valid.
- Not applicable — a time window either contains the bar or it does not.
measurable:
- hit rate of the same entry model inside vs outside the chosen kill zone
- share of the day's range formed between 8:30 and 9:30
- expectancy by hour of day for the same setup, which is the direct test of the three competing
  windows
- trade count and expectancy of Trader T's first window versus his second
- how many valid setups each cut-off discards
- share of the daily range formed inside each session (the video asserts New York AM dominates)
- realised volatility per session window vs the rest of the day
- hit-rate difference for the same entry model taken inside vs outside a killzone
