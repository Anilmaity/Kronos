ambiguities:
- '''High resistance'' is never quantified.'
- In a previous unit the same guest allowed a Tuesday exception on a 'really specific and
  convincing signature'; here the exception is narrowed to Monday engaging a HTF PD array.
  The two statements are compatible but not identical.
- The host's concurrence is softer ('I usually don't even trade Mondays') than the guest's
  absolute.
- It is framed as 'the general rule I use for myself' — a personal policy, not a claim about
  edge.
- Elsewhere in the corpus he states Monday IS tradeable when the prior Friday formed a reversal;
  this video does not reconcile the two.
- The library entry for this id was first built from a guest; this is TTrades stating the
  same rule in his own voice.
- No reason is given here; the reasons in the rest of the corpus (smallest range day, no news,
  no weekly-profile data yet) are absent from this video.
- It is stated as personal habit, not as an edge claim.
- Elsewhere in the corpus Monday IS tradeable when the prior Friday formed a reversal; this
  video does not acknowledge the exception.
- The supporting statistic is phrased as 'the smallest Range Day by under 25 percent of the
  average', which is ambiguous between 25 percent smaller than average and under 25 percent
  of the average. No instrument, period or source is given.
- The rule is stated for indices futures; no claim is made about other markets.
- No treatment of holiday-shortened weeks where Monday is closed.
