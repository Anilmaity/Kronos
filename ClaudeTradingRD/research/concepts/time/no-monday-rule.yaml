id: no-monday-rule
name: Never Trade Monday
variants:
  name:
  - Skip Mondays
  definition:
  - 'A standing personal rule stated alongside the news filter: he avoids trading before the
    week''s first high-impact news event AND skips Mondays. His stated reason in the worked
    example is that Monday is generally the accumulation for the weekly profile.'
  - 'Stated in his own voice as an established habit rather than argued: he does not journal
    Mondays because he never trades them, and journals Tuesday through Friday only. No justification
    is offered in this video - it is presented as settled practice.'
  - 'A categorical exclusion of Monday from the trading week, justified on three grounds:
    Monday is on average the smallest-range day; Monday carries no scheduled news; and on
    Monday there is no weekly-profile data yet formed to reference, so trading it means predicting
    from nothing. Monday''s range is instead used as an input to classify the rest of the
    week.

    '
definition: 'AM Trades states the rule absolutely and the host concurs on air, so this is
  a genuine point of agreement between them in this episode. AM gives three reasons: Monday
  is usually high-resistance accumulation; there is never high-impact news on a Monday, so
  volatility does not enter until Tuesday at the earliest; and if you rely on weekly profiles
  you have no data for the week yet when Monday opens. Monday''s role is to BE the data -
  what Monday does is the input that lets you anticipate the profile for the rest of the week.
  His only stated exception is that Tuesday can offer a trade if Monday engaged a higher-timeframe
  PD array, which he says does not always happen.'
category: time
status: contested
aliases:
- I never trade Mondays
- Monday is data
- skipping Mondays
- I do not trade Mondays
preconditions:
- None - unconditional.
- None. The rule is unconditional.
detection_rules:
- Do not take trades on Monday.
- Record Monday's range and whether it engaged a higher-timeframe PD array.
- If Monday engaged a higher-timeframe PD array, Tuesday becomes a candidate trading day.
- If it did not, wait for the first high-impact news driver of the week.
- It is Monday -> no trade.
- The week's first high-impact event has not yet released -> no trade.
- It is Monday -> no trade, and no journal entry.
- Journal entries exist for Tuesday, Wednesday, Thursday and Friday.
- If the day is Monday, take no trade regardless of setup quality.
- At Monday's close, record what Monday did (consolidated / manipulated / expanded) and use
  it to anticipate Tuesday and the weekly profile.
- 'Worked application: if Monday manipulates, expect expansion on Tuesday in the opposite
  direction.'
invalidation:
- None stated.
- None - stated as indisputable.
measurable:
- Monday range vs the other four days, per instrument
- hit rate of Tuesday setups conditioned on Monday engaging a HTF PD array
- Monday P&L vs the rest of the week
- Monday P&L that would have accrued from setups meeting all other criteria
- Monday's realised range versus the weekly average range, per instrument
- P&L that would have accrued from Monday setups that met all other criteria
- conditional distribution of Tuesday's outcome given Monday's classification
