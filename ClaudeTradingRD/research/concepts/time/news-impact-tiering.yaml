id: news-impact-tiering
name: Red-Folder-Only News Filter (weekly profile input)
variants:
  name:
  - High / Medium / Low Impact News Tiering
  definition:
  - 'A three-tier reclassification of red-folder USD economic events by the range they are
    held to affect. High impact means the event shapes the WEEKLY range. Medium impact means
    it shapes the DAILY range. Low impact means it supplies intraday energy only. The tier
    drives which days may be traded and whether a position may be held through the release.

    '
definition: 'For building the weekly profile, AM Trades filters the economic calendar down
  to RED FOLDER events only - he explicitly filters out yellow and orange folder news on forexcalendar.com
  and does not consider it for weekly manipulation. Within red folder he concentrates on the
  08:30 releases, with FOMC at 14:30 named as the odd one out. Because he trades indices,
  USD is the currency he filters on. This is the FIRST order of operations for a week: find
  the first high-impact driver, because accumulation and the engineering of liquidity happen
  before it, manipulation happens at or just prior to it, and expansion follows manipulation.'
category: time
status: contested
aliases:
- red folder
- high impact only
- red folder tiering
- high impact news events
preconditions:
- A week's economic calendar filtered to the traded instrument's currency.
- An economic calendar filtered to red-folder events for the traded currency (USD for indices).
detection_rules:
- Filter the calendar to red folder only for the relevant currency (USD for indices).
- Identify the FIRST red-folder driver of the week.
- Expect accumulation / high-resistance price action before it.
- Expect manipulation at or just prior to that first driver.
- Expect expansion after the manipulation - expansion always follows manipulation.
- Treat 08:30 as the standard release time; FOMC at 14:30 is the exception.
- 'High impact - exactly three events: CPI; the FOMC press conference (14:30 ET Wednesday,
  distinct from the 14:00 statement and from FOMC minutes or other Powell appearances); non-farm
  payroll (usually the first Friday of the month).'
- Medium impact - GDP, PCE, PPI; usually released 08:30 ET.
- Low impact - everything else, including 10:00 ET events and unemployment claims.
- Do not use a single news event to predict the weekly high or low; a release can enter as
  expansion, as manipulation, or fall flat and consolidate.
invalidation:
- No manipulation forms at the driver - the profile is not confirmed.
- Not applicable - this is a classification, not a setup.
measurable:
- distribution of the weekly high/low relative to the first red-folder event of the week
- how often expansion follows manipulation within the same week
- average daily range on days carrying each tier versus the trailing average
- how often the weekly high or low is set on a high-impact-event day
- distribution of expansion versus manipulation versus consolidation outcomes per event type
sources:
- video_id: wGYde-h84cs
  title: Live Q&A with AM Trades - Weekly Profile
  quote: I only focus on red folder
- video_id: wGYde-h84cs
