  quote: always following manipulation we look for expansion
- video_id: QmGJFxfSHxM
  title: AM Trades | Blending The Economic Calendar, Daily Chart, & Weekly Profiles
ambiguities:
- 'This is a simplification relative to the same guest''s three-tier (high / medium / low)
  framing recorded from another video: here everything non-red is simply filtered out. Both
  statements are his; the tiering is finer, the red-folder filter is what he says he actually
  does.'
- '''The first high impact news driver'' - if two land on the same day, no rule chooses.'
- The tiering is asserted from experience; no data or study is cited.
- Events not named (retail sales, ISM, JOLTS, Fed minutes) fall into low impact by exclusion,
  which is never stated as a rule.
- The tiering is given for USD/indices only; he says the ideas transfer to forex but does
  not restate the tiers.
