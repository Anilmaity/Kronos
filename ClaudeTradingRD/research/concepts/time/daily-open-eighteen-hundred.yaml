id: daily-open-eighteen-hundred
name: The Daily Open He Uses
variants:
  name:
  - The Daily Open He Uses Is 18:00, Not The Midnight Or True Day Open
  definition:
  - 'Asked to choose between the midnight open and 18:00 he answers that he always uses 18:00.
    Asked about the True Day Open he says he just uses the daily open - the normal CME or
    whatever the data feed''s open is - and gives the reason: he is trading the actual daily
    candle, so he sees no reason to take his opening price from a different timeframe. The
    weekly open is treated the same way: literally the Sunday open, marked out with nothing
    fancy around it.'
definition: 'TWO INCOMPATIBLE ANSWERS EXIST IN THE CORPUS AND BOTH ARE RECORDED. Later canon
  (asked directly in a Q&A, and the reading the library should default to): the daily opening
  price is 18:00 - the open of the actual daily candle on the data feed - and he says he always
  uses it rather than the midnight or True Day open. EARLIER RECORDING (this unit, YXoNowXQirM):
  in the dedicated open-high-low-close lesson he says outright that he is using the MIDNIGHT
  opening price as the open for the daily candle, and builds the whole worked example on it.
  This is a change of practice over time, not a contradiction to average away.'
category: time
status: contested
aliases:
- 1,800
- true day open
preconditions:
- A futures data feed whose daily candle opens at the session open.
detection_rules:
- 'Later canon: daily_open := the open of the daily candle on the CME / data-feed session
  (18:00 New York).'
- 'Earlier recording: daily_open := the midnight opening price, drawn on the intraday chart
  and used as the reference the day''s candles must respect.'
- In both readings the level is used the same way - as the position-taking reference for the
  open-high-low-close shape.
- Daily opening price = the open of the actual daily candle on the CME/data-feed session,
  which he states as 18:00.
- Weekly opening price = the Sunday open of the weekly candle.
- Do not substitute a True Day Open or a separately derived opening level.
invalidation:
- Not applicable - a level definition.
measurable:
- respect rate of the 18:00 open vs the midnight open as intraday support/resistance
sources:
- video_id: YXoNowXQirM
  title: Open High Low Close (OHLC / OLHC) - ICT Concepts
  quote: using midnight opening price as the open for this daily candle
- video_id: YXoNowXQirM
  title: Open High Low Close (OHLC / OLHC) - ICT Concepts
  quote: that opening price is supporting the candles and nothing is closing below it
- video_id: sdZkE-naNiY
  title: TTrades Indicator Updates - Walkthrough and Q&A
  quote: I always use 1,800
ambiguities:
- This draft supplies only the EARLIER reading; the 18:00 reading comes from other units and
  remains the canonical one.
- He never says why he switched, and never addresses the two levels together in either recording.
- Timezone for 'midnight' is not stated in this video.
- 'Reading A (this unit): the opening price is the 18:00 session open of the daily candle;
  True Day Open is rejected.'
- 'Reading B (elsewhere in the library, concept new-york-intraday-time-levels): the midnight
  opening price is used as intraday support/resistance and as a partials level. Both readings
  are his, so the two are recorded rather than reconciled - the conflicting videos are outside
  this unit and were not read, so no quote is offered for reading B.'
- He says '1,800' without a time zone in this sentence; EST is stated elsewhere in the same
  video for the indicator's clock.
- Whether 18:00 is a level to trade from or only the candle's origin is not stated.
