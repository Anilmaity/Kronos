ambiguities:
- The 8-11 EST figure is quoted while demonstrating an indicator setting, not stated as a
  trading rule; whether he personally trades to 11:00 is not said.
- EST is named once and never restated; whether he means EST proper or US Eastern clock time
  including daylight saving is not addressed anywhere in the corpus.
- The '8 to 9' alternative window is mentioned in passing without saying which instrument
  or which day it applies to.
- '''Formed a wick'' as the gating condition is not quantified here (no wick-to-body ratio).'
- No timezone is stated anywhere in this unit. The named levels (1800, 6, 10, 1400) are self-consistent
  with 4-hour candles anchored at an 18:00 session open, but that anchoring is an inference,
  not something he says.
- The auto-caption renders the level list as '1800 6 10 1400 0 8'; the trailing '0 8' is undecoded
  - it may be 0800 or a mis-transcribed 08:30 and is not read here.
- The 06:00-10:00 preference sits alongside the 08:00-10:30 window recorded from other units;
  they overlap but are not the same statement, and he never reconciles them.
- He gives no reason for preferring the 06:00 candle beyond it being where his continuations
  set up.
- The rejection of kill zones sits alongside a session-by-session timeframe map in the same
  stream, and heavy use of 09:30 / 09:45 / 10:00, so time is clearly not irrelevant to him
  - only the kill-zone framing is rejected.
- '"Already expanded" is not quantified.'
- The 11:00 cut-off and the no-afternoon-session habit are described as personal routine,
  with no rule attached.
- Whether 08:00 means 08:00 EST is not stated explicitly, though the New York context implies
  it.
- The 4-hour candle boundaries other than 10:00 a.m. are not enumerated in these streams.
- He says he does not care about 10:00 a.m. news specifically, but the 10:00 a.m. candle boundary
  matters - the two are easy to conflate.
- What the 5/15/30-minute checkpoints must show to end the wait is not stated.
- The timezone is not stated on air in this unit; EST is assumed from the rest of the corpus.
- '''When I find the best moves to occur'' is asserted with no measurement, and is bundled
  with a scheduling reason.'
- The end of the window is given inconsistently across the two streams - 'to around 11' in
  one and '8 to 10:30' (with 'sometimes 10:30' hedged around '10ish') in the other. Both are
  approximations rather than rules.
- London is not traded at all because he is asleep, but he says a London reversal should be
  held into New York rather than closed - so the window governs entries, not exits.
- Asia is only traded when he is after a whole daily range.
- No end time for his own New York window is given in this unit (the 9:30-11:30 window in
  the same stream is the guest's, not his).
- The time zone for 9:30 is not stated in the live Q&A; EST is stated only for the indicator's
  clock in the other video.
- No timezone is spoken in this video; the corpus elsewhere fixes bare clock times to New
  York, and the TradingView video in this same unit shows the chart set to New York local
  time.
- 12 is stated as the outer bound here; other units in the corpus give 10:00, 10:30 or 11:00
  as the practical cut-off. This is the widest of them.
- The window is stated for index futures; nothing is said about other asset classes.
- '''Kill zone'' is never named in this unit, so this window is not presented as one.'
