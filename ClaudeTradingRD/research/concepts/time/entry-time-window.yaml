id: entry-time-window
name: Entry Time Window (and rejection of kill zones)
variants:
  name:
  - Entry Time Window
  - Trade Only 08:30 To 11:00 (the host's own window, stated in this unit)
  definition:
  - 'This unit supplies the 4-hour boundaries the other streams left unenumerated, and names
    the window he actually prefers. Asked whether he only trades after 10:00 a.m. he says
    no - he prefers to trade the 6:00 to 10:00 a.m. 4-hour candle, or inside that range, and
    10:00 is simply what he falls back to when the 6-10 candle gives him nothing. In the London-reversal
    review he says the same thing structurally: with London having reversed, 6:00 to 10:00
    a.m. is where price is expected to continue, and the 15-minute entry is taken inside it
    prior to the NYSE open. Pointing a viewer at his own time-levels lesson he enumerates
    the levels the video covers as 1800, 6, 10 and 1400, the question having named 9:30, midnight
    and 1800. Kill zones are rejected again in two of the four streams - he uses higher-timeframe
    candle boundaries instead - and he never looks at the New York p.m. session.

    '
  - 'Asked twice whether he uses kill zones, he says no and gives the replacement: he trades
    within the higher-timeframe candles, not within named session windows. The argument he
    draws on screen is that a 5-minute trade is always inside an hourly candle, inside a 4-hour
    candle, inside a daily candle - so the question that matters is whether those candles
    have already expanded and whether they align toward the same target, not which session
    block the clock sits in. If the higher-timeframe candle has already expanded he sees no
    reason to care about the session. In practice his own window is bounded by habit rather
    than rule: he looks when he wakes up, trades it if it is obvious, otherwise waits for
    the open, and does not trade past about 11:00 or in the afternoon session.

    '
  - 'Time matters to him only through higher timeframe candle boundaries, not through named
    session windows. The majority of his entries come between 8:00 a.m. and about 10:30, and
    after 11:00 he loses interest in the day. The one clock time he uses actively is 10:00
    a.m., because it opens a new 4-hour candle - which is what he waits for when the current
    4-hour candle does not support his direction. He explicitly does not use kill zones, does
    not mark session highs and lows, and does not use macros.

    '
  - 'Two time statements: some of his favourite trades are 6:00-8:00 a.m. New York - the 15-minute
    positioning before the open; and for someone who can only trade an hour or two, 9:00-11:00
    is where most of the New York open volatility is.'
  - 'A no-direction protocol for the New York open. When there is no clear direction off the
    open he waits in steps - five, fifteen, then thirty minutes after 9:30 - before deciding,
    and says that waiting is a key thing because those first candles usually help. Separately,
    on a day where expansion is anticipated, a 15-minute candle that prints as a reversal
    candle off the open is not traded; he would rather wait for the 10:00 candle. If the day
    stays rangebound, 9:30 often just generates volatility to one side and then holds the
    range.

    '
  - 'Asked directly whether he only trades between 08:30 and 11:00, the host answers yes,
    and gives two reasons - it fits his schedule, and it is when he finds the best moves to
    occur. His pre-session routine sits inside that window: on the 15-minute or hourly, mark
    where 08:30 is, look left, mark the obvious resting highs and lows, then wait for one
    to be run before dropping to a lower timeframe. Alex''s Options adds a compatible timing
    read from the guest side in a different video: after a Judas swing off the open the reversal
    is expected in the morning, around 10:00, sometimes a little earlier or later, and an
    afternoon reversal after the lunch consolidation is tradeable but is normally skipped.'
  - 'The window said aloud in these streams: he trades the New York morning, from 8:00 a.m.,
    and the move he is trying to capture runs from 8:00 to about 10:00-10:30, with 11:00 given
    once as the outer bound. He streams from 9:15, ten to fifteen minutes before the open,
    and forms the whole day''s idea in that window. Asked whether one could trade only 8-11
    a.m. and then close the charts for the rest of the day, he says that is what he does.
    Outside the window he does not care what price does; if he is not in a position he simply
    waits for the daily candle to close. Kill zones are explicitly not used - higher-timeframe
    candle opens replace them. Times are New York time (see est-timezone-anchor).'
  - This unit adds a plain session preference and a hard pre-open rule. Asked which session
    is best for trading gold he answers that he prefers New York for most things. In the live
    session he states there is nothing to anticipate pre-open and that he has to wait for
    9:30 for anything at all; on the days he does not get a read he defers to watching what
    Asia and London do and then decides in New York. The indicator carries a session filter
    that can enforce this by hiding every setup outside the chosen session.
  - 'The tightest one-line statement of his trading window found in this unit, said while
    explaining why he only marks up the lower timeframes for part of the day: he only looks
    to take trades between 08:30 and 12, that is the session he is trading, and he does not
    care much for price action outside it. The 5-minute markup in the worked example runs
    from before 08:30 (a low-risk sell not taken), through the 08:30 release, to the 09:30
    open.'
  - 'In the London model video he again rejects kill zones: entry time (19:00, 22:00, 01:00,
    02:00 are named) does not matter; all that matters is that the higher-timeframe candles
    have formed their wicks. The London model is also usable in Asia and New York.

    '
  - 'Kill zones rejected again in this stream. Replacement: trade once the higher-timeframe
    wick has formed - the daily wick and also an intraday H4/H1 wick - with a spot for invalidation.
    The 9:30 equity/ETF open is acknowledged only as why volatility clusters there.'
  - 'Restated: his trade window is roughly the first two hours of New York - from when he
    finishes his morning routine (sometimes 8, a little after) until about 11. He does not
    trade London because he is asleep.'
definition: 'The window he actually trades in the New York morning is 9:30 to 10:00, which
  he calls the opening drive movement and says is where the clean move happens on most days;
  he also names 8 to 9 as an alternative. The wider band he considers at all is given numerically
  and with a timezone for the only time in this unit: his indicator''s setup time filter is
  set to show setups between 8 and 11 EST. Kill zones are explicitly rejected as the organising
  principle — when asked why he does not care about the kill zone he answers that he is trading
  higher timeframe candles, so the only thing that matters is being inside a higher-timeframe
  candle that has formed its wick, not which named session block the clock is in.

  '
