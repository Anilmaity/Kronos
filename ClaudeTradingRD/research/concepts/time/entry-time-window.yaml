preconditions:
- A bias and a level to trade away from already exist before the window opens.
- US index futures / New York session context.
- A setup is being considered at some point in the day.
- No clear directional read on the asset at 9:30.
- An index futures session with a New York cash open.
- None.
- Instrument is a US index future (ES / NQ in the examples).
detection_rules:
- 'Primary window: 9:30 to 10:00 (the opening drive); secondary window named is 8 to 9.'
- Setups outside 8 to 11 EST are filtered out (the stated indicator time-filter setting).
- Do not require the entry to fall inside a named kill zone.
- Require instead that price be inside a higher-timeframe candle which has already formed
  its wick.
- The pre-open bias is posted at 8:30 a.m. in his own routine; the stream itself starts around
  9:10-9:15.
- 'Preferred window: inside the 06:00-10:00 4-hour candle, with the 15-minute entry taken
  before the 09:30 NYSE open.'
- If the 06:00-10:00 candle offers nothing, wait for the 10:00 candle open and re-assess.
- Prefer continuations that expand at 09:30 or 10:00; a continuation sought after that expansion
  is not wanted.
- The time levels he teaches are 1800, 6, 10 and 1400 (plus 9:30 and midnight as raised by
  the question).
- Do not filter by kill zones; the question is which higher-timeframe candle you are inside.
- The New York p.m. session is never used.
- Do not filter entries by kill zone or named session block.
- Ask instead which higher-timeframe candles the entry sits inside, whether they have already
  expanded, and whether they align toward the same target.
- If the containing higher-timeframe candle has already expanded, the setup is uninteresting
  regardless of the time.
- If a setup is obvious on waking, take it; otherwise wait for the open.
- Most entries fall between 08:00 and roughly 10:30; interest drops off after 11:00.
- 10:00 a.m. opens a new 4-hour candle - wait for it when the current 4-hour candle is against
  the intended direction.
- Do not filter by kill zones; the relevant question is which higher timeframe candle you
  are trading inside.
- Do not mark session highs and lows as levels - a London high with no drawn objective at
  it is given as having no relevance.
- First-presented fair value gap is not used; the 9:30 open is used instead if something of
  that kind is wanted.
- Macros are not used - he characterises a macro as just a section of an open-high-low-close.
- Pre-open 06:00-08:00 15-minute setups are acceptable (see positional-entry-before-open).
- 'Limited-time traders: 09:00-11:00 New York.'
- At 9:30 with no direction, take no trade; re-check at 9:35, 9:45 and 10:00.
- On an anticipated expansion day, if the opening 15m candle is a reversal candle, skip it
  and wait for 10:00.
- Trade only between 08:30 and 11:00.
- Before the session, mark 08:30 on the chart and mark the obvious resting highs and lows
  to its left, on the 15-minute or hourly.
- Wait for one of those levels to be run before dropping to a lower timeframe for a setup.
- Trading window opens at 8:00 New York time.
- The intended move runs to roughly 10:00-10:30; 11:00 is the outer bound given.
- Bias and framing are done in the 9:15-9:30 pre-open.
- After the window, take no new entries; runners may be left on.
- No kill-zone windows are used - see macros-not-used.
- Default session is New York, for most instruments including gold.
- Do not act pre-open; wait for 9:30.
- When the daily closure gives no bias, watch Asia and London for information and decide in
  the New York session.
- The session filter can enforce the window mechanically.
- Trades are only taken between 08:30 and 12.
- Lower-timeframe (15-minute, 5-minute) chart work is confined to that window; price action
  outside it is not analysed.
- The 08:30 and 09:30 opening prices bound the part of the session that is marked up.
- Gate entries on higher-timeframe wick formation, not on a kill-zone clock window.
- Only take entries between roughly 08:00 and 11:00 New York time.
invalidation:
- The higher-timeframe candle has not yet formed a wick — no entry regardless of the clock.
- Not applicable - a filter.
- n/a - a filter-rejection.
- Not applicable - this is a filter, not a setup.
- Not applicable - a session filter.
- Not applicable - a session policy.
- Not applicable - a time filter.
measurable:
- range covered 9:30-10:00 versus the rest of the session
- win rate of entries inside 8-11 EST versus outside
- difference in outcome between kill-zone-filtered and wick-formed-filtered entry sets
- entry timestamp distribution and expectancy by hour
- expectancy of pre-09:30 15-minute continuation entries vs post-10:00 entries
- expectancy of entries grouped by containing-candle expansion state versus grouped by kill
  zone
- entry timestamp distribution and P&L by hour of day
- outcome of entries after 11:00 vs before
- whether kill-zone filtering would have improved or degraded the same trade set
- Directional accuracy of the 9:30-9:35, 9:30-9:45 and 9:30-10:00 moves on no-bias days.
- expectancy by hour of day against the 08:30-11:00 window
- share of the day's setups that occur inside the window
- distribution of entry times for profitable trades inside vs outside 8:00-11:00
- how many signals fall outside the window
- expectancy by session on the same instrument
- share of days where the pre-open read survives the open
- share of the corpus's setups that occur inside 08:30-12
- expectancy of entries inside the window versus outside it
