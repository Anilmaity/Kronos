timeframes:
  htf:
  - 1D
  ltf:
  - 1H
  - 15m
  fractal: false
execution:
  bias: Direction of the daily candle-2 reversal.
  entry: At or near the protected swing before or around the next daily open.
  stop: Just beyond the protected swing.
  targets:
  - Expansion of the following daily candle (candle 3)
