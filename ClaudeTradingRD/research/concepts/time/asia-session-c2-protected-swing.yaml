id: asia-session-c2-protected-swing
name: 'The Only Asia-Session Condition: Daily C2 Plus a Protected Swing Before the Open'
definition: 'He normally does not trade the Asian session and does not use lower timeframes
  during it. The single stated exception: a candle-2 closure on the daily, with a reversal
  formed inside that candle-2 and a protected swing established before the open of the next
  daily candle. In that case he can anticipate that the protected low (or high) holds inside
  the next candle and take a positional entry with the stop just beyond it.

  '
category: time
status: specified
aliases:
- do you trade Asia
- positional entry in Asia
preconditions:
- The daily candle has closed as a candle 2 (reversal).
- Inside that candle a reversal formed and a protected swing exists prior to the next daily
  open.
detection_rules:
- Identify a daily candle-2 closure.
- Identify a protected swing inside it that formed before the next daily candle opens.
- Anticipate that the protected extreme holds inside the next daily candle.
- Position with the stop just beyond the protected swing; this is a positional entry, not
  a lower-timeframe scalp.
invalidation:
- The protected swing is taken out during the Asian session.
- No protected swing exists before the next candle open, in which case wait for a continuation
  later.
measurable:
- hold rate of protected swings formed inside a daily C2 during the following Asian session
sources:
- video_id: egV_gABTQks
  title: (CPI) New York Open Live Q&A
- video_id: 0AYGNc9czYc
  title: New York Open Live Q&A
ambiguities:
- He says he has a video on this setup but does not name it, and gives no additional filters.
- Whether the protected swing must sit inside a fair value gap is not stated.
related:
