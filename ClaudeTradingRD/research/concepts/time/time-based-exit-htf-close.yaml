ambiguities:
- 10:00 being a 4-hour boundary implies a 4-hour grid at 02:00 / 06:00 / 10:00 / 14:00 / 18:00
  / 22:00, but he never says so and never names the timezone.
- Whether the rule generalises off indices (he uses higher timeframes on currencies) is not
  stated.
- '"Behaving as an expansion candle" is judged live, with no threshold.'
- '''Small wick'' is not quantified here (see small-wick-expansion-rule elsewhere in the corpus).'
- No rule chooses between the price target and the time exit when both are available; on the
  live example he simply listed all three as acceptable.
- Whether the clock exit overrides an unmet level target, or only applies once the level is
  reached, is not stated.
- Only the 10:00 boundary is worked through; the equivalent for an afternoon or overnight
  position is not given.
- The trailing fallback references his trailing-stop video and is not spelled out here.
- He hesitates between 9:45 and 10:00 as the relevant boundary in one passage.
- No definition is given for classifying a candle as an expansion candle in real time, only
  after the close.
- No timezone is stated; the New York index-futures context implies US Eastern but he never
  says it.
- Whether the exit is taken at the boundary unconditionally or only when the target has not
  been reached is not stated.
- The 30-minute is named as one of the three candles ending at 10:00, which is true of every
  even hour - so the specific significance of 10:00 rests on the 4-hour boundary.
