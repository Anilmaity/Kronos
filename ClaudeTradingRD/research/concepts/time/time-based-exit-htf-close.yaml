id: time-based-exit-htf-close
name: Time-Based Exit at the Higher-Timeframe Candle Close
definition: 'The exit rule he applies to an opening-move trade: hold it to the close of the
  higher-timeframe expansion candle it is running inside. On indices that boundary is 10:00,
  and he gives the reason explicitly - 10:00 is simultaneously the end of a 4-hour expansion,
  a 1-hour expansion and a 30-minute expansion, and a new 4-hour candle opens there. Because
  expansion candles close into their extreme, the position is held to that boundary and taken
  off. Once 10:00 has passed he says a new phase of price can start and he no longer cares
  what price does.

  '
variants:
  definition:
  - 'The reasoning behind exiting on the clock rather than at a price. An expansion candle
    has a small wick and a large body, so a bearish expansion candle - once its wick is formed
    - generally closes near the low of the candle, and a bullish one near the high. That means
    holding to the end of the candle produces an exit near its extreme. So the exits are the
    candle closes: 9:45 for a 15-minute expansion candle and 10:00 for the 30-minute / hourly
    / 4-hour. He listed three exits on one live move - the price target, 9:45 and 10:00 -
    and called them all good exits. Time-based exits are grouped with trailing stops and average
    daily range as the ways to take profit when the target is an all-time high with no level
    above it.'
  - 'He names two kinds of target and treats them as equally binding: one on the chart (a
    level) and one on the clock. The clock target is the close of the higher-timeframe expansion
    candles being ridden — in the New York morning he enumerates the 4-hour, the hourly and
    the 30-minute and notes all of them end at 10:00, which is therefore the exit. The general
    form he states for choosing the next objective once a level target is gone is the same
    list: where the correlated asset is hitting a target, the average daily range, or the
    time-based exit; failing those, drop to a lower timeframe and trail.

    '
  - 'Because an expansion candle closes at or near its extreme, a position taken inside an
    expansion candle can be held to the end of that candle period and exited there. On indices
    he uses the 10:00 a.m. boundary because that is where new higher-timeframe candles (4-hour,
    1-hour, 30-minute) open; a 6:00-10:00 4-hour expansion candle is expected to complete
    its move before 10:00.

    '
  - 'He runs a live quiz on it: given that price is expanding lower off the 9:30 open, when
    can the move be expected to end? The answer is 10:00 a.m., and the reason is that three
    higher-timeframe candles expire together there - the 4-hour, the 1-hour and the 30-minute
    all end an expansion at 10:00. Occasionally the flip comes at 9:45 instead because a 15-minute
    expansion ends there, but he says it is usually the higher-timeframe candles that matter.
    He restates it mid-stream as the time-based exit for the position he is discussing: look
    for 10:00 a.m. to end the move.

    '
  category:
  - risk
