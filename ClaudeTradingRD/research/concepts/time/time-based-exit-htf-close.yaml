preconditions:
- The position is running inside a candle that is behaving as an expansion candle.
- The candle being held is an expansion candle (small wick, large body).
- Its wick has already formed.
- A position taken inside a higher-timeframe expansion candle.
- The position is held inside a candle that is behaving as an expansion candle.
- An intraday expansion driven off the 9:30 New York open.
detection_rules:
- Identify the higher-timeframe candle the trade sits inside and the clock time of its close.
- If it is an expansion candle, hold to that close - on indices, 10:00, where the 4-hour,
  1-hour and 30-minute candles all close together.
- Take profit at the target if it is reached before the boundary; the target takes precedence.
- After the boundary, treat the day as finished rather than re-entering into the new candle.
- Identify which timeframe's expansion candle the move belongs to.
- 'Hold until that candle''s close: 9:45 for a 15-minute candle, 10:00 for the 30-minute /
  hourly / 4-hour.'
- Expect the close to sit near the candle's extreme in the traded direction.
- If the higher-timeframe candle is also expanding, the move can be held past the lower-timeframe
  close to the higher one.
- Identify which higher-timeframe candles the position is riding.
- Exit at the close of those candles (in the morning session, the 10:00 simultaneous close).
- If a level target is still open, use whichever of level, correlated-asset target, ADR or
  clock comes first.
- If none is available, drop a timeframe and trail rather than holding open-ended.
- Identify the higher-timeframe candle the trade is running inside and its close time.
- If that candle is an expansion candle (closing into its extreme), hold to the close of the
  period.
- For a move framed inside the 06:00-10:00 4-hour candle, expect completion before the 10:00
  open.
- A 9:30-driven expansion is expected to terminate at 10:00, where the 4-hour, 1-hour and
  30-minute candles all close.
- It can instead terminate at 9:45, when a 15-minute expansion ends - the less common case.
- Prefer the higher-timeframe boundary (10:00) over the 15-minute one when choosing an exit.
- The same boundary that ends the move opens the next 4-hour candle, so it is both an exit
  and the earliest re-entry point for a new phase of price.
invalidation:
- The candle stops expanding and reverses before the boundary.
- The candle is not an expansion candle - the close-near-the-extreme assumption fails.
- Not applicable — this is an exit rule.
- The candle stops behaving as an expansion candle and reverses.
- The target level is reached before the period ends, in which case the target takes precedence.
- Price continues to expand through the boundary, in which case the new higher-timeframe candle
  is carrying the move.
measurable:
- distance from the 10:00 exit price to the candle extreme
- P&L difference between exiting at the boundary and holding into the next candle
- distance from candle close to candle extreme, for candles classified as expansion
- P&L of exiting at the candle close vs at the price target
- give-back between the 10:00 close and the session close on held positions
- R of clock exits versus level exits on the same trades
- distance from the exit price to the candle extreme when holding expansion candles to their
  close
- share of expansion candles closing within the top or bottom quartile of their range
- distribution of the intraday extreme's timestamp on days with a 9:30 drive
- P&L of exiting at 10:00 vs holding, on 9:30-driven expansions
- how often 9:45 rather than 10:00 marks the turn
