id: timeframe-continuity
name: Timeframe Continuity (TheSTRAT)
definition: 'Timeframe continuity is reading multiple timeframes purely by candle colour (up-close
  vs down-close relative to that timeframe''s open) and requiring them to agree. For day trading
  the guest uses month / week / day; he adds the quarter and year for positioning. His stated
  ideal is that every timeframe is OUT of a 1 (not an inside bar) before taking a trade, because
  a timeframe sitting inside is ''by definition consolidating'' and its participants are not
  in control. The mechanism he gives is participation: roughly 70% of traded volume is algorithmic,
  an algorithm must be told what to trade, how, and WHEN, so every new timeframe open introduces
  a new participant group - which is why a new monthly or quarterly open flipping colour is
  the event to watch. When volatility rises you drop to lower timeframes for continuity.'
category: time
status: specified
aliases:
- full timeframe continuity
- FTFC
- twos on all time frames
preconditions:
- Each timeframe's current candle is classified 1/2/3 and coloured by its open.
detection_rules:
- 'For a long: month, week and day are all green (trading above their own opens) and none
  of them is a 1.'
- 'For a short: month, week and day are all red and none of them is a 1.'
- A timeframe printing a 1 (inside bar) means those participants are not in control - that
  timeframe does not vote.
- A new higher-timeframe open that flips colour (e.g. last month red, this month green) is
  the signal that a new participant group has taken over.
- When volatility increases, move the continuity read down a timeframe.
- Trade the lower timeframes with the explicit aim of TRIGGERING a 2 on the next timeframe
  up.
invalidation:
- A reversal signal on a lower timeframe that changes a higher timeframe's colour negates
  the continuity read.
- A higher timeframe going inside (a 1) removes it from the stack.
measurable:
- outcome of 2s taken with 3-timeframe continuity vs 2 vs 1
- outcome of trades taken while any timeframe is a 1
- frequency of a monthly-open colour flip and forward return over the rest of the month
