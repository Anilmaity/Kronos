ambiguities:
- The 70% algorithmic figure is asserted with no source, market or period.
- '''Colour'' is by open, but whether it is measured live intrabar or only at close is never
  stated - and it must be live for the method to work.'
- Which timeframe set to use is given as month/week/day for day trading and 'go lower when
  volatility increases', with no volatility threshold.
- The claim that the market 'has to' trade in the direction of the most 2s is a definitional
  claim about labels, presented as a market claim.
