ambiguities:
- The captioner renders 18:00 as '1,00' and '18800'; the daily-open reading is fixed by the
  surrounding sentence ('for the 18800 and0 that will be the daily candle') and by the 4-hour
  grid implied by 10:00/14:00.
- He says Eastern STANDARD time, not 'New York time' — whether he re-anchors across daylight
  saving is not addressed.
- The forex caveat is stated but the replacement 4-hour grid for forex is never given.
- Nothing in this video mentions a 30-minute or 15-minute candle also opening at 10:00; only
  the 4-hour is named here.
- The auto-captions render 18:00 as "18,800" and "188" in this unit too; the daily-open reading
  is fixed only by the surrounding sentence and by the 4-hour grid implied by 10:00 and 14:00.
- '"Judith swing" is the caption rendering of "Judas swing".'
- No timezone is stated in either Short.
- How far above the midnight open still counts as a "deep" premium is not bounded.
- 09:30 is listed for the Judas-swing / order-block use but is given no OHLC-framing role,
  unlike the other five levels.
