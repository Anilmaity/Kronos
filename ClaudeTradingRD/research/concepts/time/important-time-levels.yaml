id: important-time-levels
name: Important Time Levels (18:00, midnight, 08:30, 09:30, 10:00, 14:00 EST)
definition: 'Six clock levels he uses daily, all in Eastern Standard Time, each with a stated
  reason: 18:00 is the new daily candle open; midnight is the midnight open; 08:30 is when
  the news embargo lifts / high-impact news; 09:30 is the New York Stock Exchange open; 10:00
  is a new 4-hour candle and sometimes news; 14:00 is a new 4-hour candle. They are used in
  three distinct ways: 18:00 and midnight frame the DAILY candle''s open-high-low-close, 10:00
  and 14:00 frame the 4-HOUR candle''s; midnight and 08:30 additionally act as support/resistance
  and as premium/discount markers; and midnight, 08:30 and 09:30 are where he looks for a
  Judas swing / order-block formation. He states the caveat that these openings shift by asset
  class — the 4-hour candles change on forex and there is no 09:30.'
variants:
  definition:
  - 'Two Shorts restate the function split of the clock levels, independently of the long-form
    video the library already holds, and the two accounts agree. 18:00 and midnight are used
    with the DAILY candle''s open-high-low-close; 10:00 and 14:00 with the 4-HOUR candle''s
    (open, low, high, close when bullish - i.e. accumulation, manipulation below the opening
    price, distribution). 08:30 and midnight additionally serve as premium/discount markers
    and as support and resistance: bearish and above both = a deep premium, and vice versa.
    Midnight, 08:30 and 09:30 are the three levels at which he looks for a Judas swing or
    an order block: the opposing run at that time, once closed over, is the order block, and
    he then does not expect its low to be taken as price continues.'
category: time
status: contested
aliases:
- important time levels
- the times I use every single day
preconditions:
- Chart timezone set to New York / Eastern Standard Time.
- Instrument is an index future (the 09:30 level does not apply to forex).
- A directional bias for the day.
detection_rules:
- Mark 18:00 (daily open), 00:00 (midnight open), 08:30, 09:30, 10:00 and 14:00 New York.
- Use 18:00 and midnight with the DAILY candle's open-high-low-close (bullish day = open,
  low, high, close).
- Use 10:00 and 14:00 with the 4-HOUR candle's open-high-low-close / power of three.
- 'Use midnight and 08:30 as support/resistance and as premium/discount markers: bearish and
  above both = a deep premium; bullish and below both = a deep discount.'
- Look for a Judas swing / opposing run forming an order block specifically at midnight, 08:30
  and 09:30.
- A retracement inside a bearish 4-hour sequence is expected at the next 4-hour open (10:00,
  or 14:00 for the following leg).
- On forex, drop 09:30 and re-derive the 4-hour grid for that asset class.
- Use 18:00 and midnight with the DAILY candle open-high-low-close.
- 'Use 10:00 and 14:00 with the 4-HOUR candle open-high-low-close / power of three (bullish:
  open, low, high, close = accumulation, manipulation below the opening price, distribution).'
- 'Use 08:30 and midnight as premium/discount markers and as support and resistance: bearish
  and above both levels = a deep premium; bullish and below both = the mirror.'
- Look for the Judas swing / order block at midnight, 08:30 and 09:30 specifically.
- 'Bullish case: the opposing run at that time, once closed over, is the order block; do not
  expect its low to be taken as price continues higher.'
- 'Live case: price using the midnight open as support/resistance and failing to close below
  it is read as price working back toward the order block.'
invalidation:
- Price closing decisively through midnight open / 08:30 open flips them from support to resistance
  (he uses them both ways within one example).
- Price closes decisively through the midnight open being used as support/resistance.
measurable:
- frequency of the day's high or low forming within N minutes of each level
- hit rate of the midnight-open and 08:30-open support/resistance reactions
- frequency of an opposing run at each of midnight / 08:30 / 09:30
- hold rate of the order block formed by that opposing run
