preconditions:
- A higher-timeframe candle closure to be confirmed.
- The trader has chosen an execution timeframe.
- A bias timeframe pair and an execution timeframe pair are chosen before the session.
- A chosen scalping or swing horizon, which fixes which triad is used.
- A higher-timeframe structural direction has been established.
- Price has reached into the higher-timeframe point of interest.
detection_rules:
- 'Pair table: monthly->daily, weekly->daily, daily->1H, 4H->15m, 1H->5m, 30m->3m, 15m->1m.'
- Confirm a closure on the structure timeframe with a change in the state of delivery on its
  paired entry timeframe.
- Stack three levels where possible (bias / swing point / entry) and require all three to
  point the same way -- 'this is when expansion can occur'.
- If the paired timeframe is messy, move up one timeframe instead of forcing the pairing.
- Refining further down is optional -- he sometimes takes the entry on the structure timeframe
  itself.
- 'Session-dependent variant early in the day: in Asia use only the hourly or 30-minute; in
  London the hourly, 30-minute or 15-minute; in New York drop lower because the reversal is
  quick.'
- 1m / 15s execution -> 15m, 1H, 4H are the point-of-interest timeframes.
- 5m and lower execution -> 1D, 4H, 1H supply the draw on liquidity.
- 1H execution -> weekly and monthly supply the draw.
- Only drop to the execution timeframe once price has reached a level on the paired higher
  timeframe.
- Pick the ladder by the entry timeframe you intend to use.
- 30-second entry -> 5-minute stop raid -> 1-hour or 15-minute draw.
- 1-minute entry -> 15-minute stop raid -> 4-hour or 1-hour draw.
- 5-minute entry -> 1-hour stop raid -> daily or 4-hour draw.
- The stop raid must be in the OPPOSITE direction of the draw.
- The whole ladder can be shifted up wholesale (monthly/daily/hourly, weekly/4H/15m) without
  changing the logic.
- 'Default: 1D + 1H for bias, 4H + 15m for entry.'
- 'Pairs may be shifted as a unit: 1H + 5m is equivalent to 30m + 3m.'
- Before 10:00 a.m. use 30m + 3m (the hourly has not closed); from 10:00 use 15m + 5m.
- Execute on whichever timeframe the setup actually appears on.
- If entries are repeatedly stopped out and then run to target, move the pair up one or two
  timeframes.
- 'Scalp triad: 1H for context/bias, 15m for the swing point, 1m for entry.'
- 'Swing triad (stated as equivalent): 1D for bias, 4H candle closure, 15m for entry.'
- The context candle must support expansion - in the scalp example, an hourly candle with
  a small wick reversing off the previous hour.
- The middle timeframe carries the candle 2 closure and candle 3 continuation.
- The lowest timeframe supplies only the fill and the stop, never the bias.
- 'A third pairing is named: 30-minute swing point with 3-minute entry, called the fractal
  30 minute and three minute setup.'
- The pairing is chosen by whether the current timeframe can still supply a swing point -
  if the higher timeframe is already forming its wick and no swing formation is expected there,
  drop one timeframe.
- On reaching the HTF point of interest, wait for the LTF to align in the same direction.
- Require the LTF setup direction to match the HTF structure direction - alignment is the
  trigger.
- 'Worked pairs in this unit: 1H context / 5m entry, and 30m context / 3m entry.'
- Once aligned, the conditions are set for expansion - enter, stop on the swing, target 2R.
invalidation:
- The timeframes stop agreeing -- the expansion premise is gone.
- Not applicable - this is a configuration rule, not a chart pattern.
- Not applicable — this is a selection rule.
- The context candle does not support expansion (large wick, no reversal off the prior candle)
  - the triad is not in play.
- The lower timeframe never aligns - no trade.
measurable:
- expansion conditioned on 1 / 2 / 3 aligned timeframes
- frequency of the 'messy, move up one' override
- share of executed trades that began at a level from the paired timeframe
- number of hours per day spent watching the execution chart under this rule vs continuous
  watching
- realised R and trade duration by ladder
- signal frequency by ladder
- stop-out rate by execution timeframe on the same signal
- R by pair (1D/1H/4H/15m versus 1H/5m versus 30m/3m)
- share of setups only visible below 15m and their outcome
- performance of the 1H/15m/1m triad vs the 1D/4H/15m triad on the same instrument
- how often the context candle qualifies as expansion-supporting per session
- average R by triad
- share of HTF POI taps that produce an aligned LTF setup
- 2R hit rate by pairing (1H/5m versus 30m/3m)
