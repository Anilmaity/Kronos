ambiguities:
- '''Messy'' is the trigger for the override and is entirely visual.'
- The pairing is roughly 1:4 to 1:12 in ratio terms but he never states a ratio, only the
  table; the 30m->3m pair (1:10) and the daily->1H pair (1:24) do not fit one rule.
- Whether an entry taken directly on the structure timeframe still requires its own lower-timeframe
  CISD is not addressed.
- The two pairings he gives for himself are not identical (1m/15s -> 15m/1H/4H in one video;
  5m and lower -> 1D/4H/1H in the other), so the ladder overlaps rather than tiles cleanly.
- No rule says how many of the three higher timeframes must agree.
- EARLIER RECORDING - the later corpus states the pairing in fractal-model terms instead.
- 'The draw rung admits two timeframes (''a hour or 15-minute'', ''four hour or one hour'',
  ''daily or four hour'') with the fallback rule stated only once: use the lower one if the
  higher has no draw.'
- The ratios are not constant (1H:5m:30s is 120:10:1; 4H:15m:1m is 240:15:1), so no single
  multiplier defines the ladder.
- 'The 1-minute chart is treated inconsistently in this unit: in TjUolMJNCMY he says flatly
  he does not really use the one minute, while in G1IIdQ3RAkY and Je7cd9HJUBE he analyses
  and endorses 1-minute entries (''I really don''t really like using the one minute, but it
  is what it is'').'
- No rule is given for which pair to use outside the New York open — the London answer is
  simply '4 hour or 15 minute model'.
- '''Whatever timeframe the setup appears on'' has no tie-breaker when a setup appears on
  two.'
- Sourced from an ASR (whisper-small) transcript, not YouTube captions; wording may be imprecise.
- Video Nlw-PZhoViQ works daily to hourly to 30m to 15m to 3m and treats 30m/3m, 30m alone
  and 15m alone as alternative ways to take the same idea, so the triad is a family of pairings
  rather than a fixed set.
- Only two triads are named. Whether intermediate pairings are permitted, and by what ratio
  the three slots should relate, is not stated.
- In video UBTl7za9obc the entry work runs daily/weekly to hourly to 5m to 3m to 1m, which
  does not map cleanly onto a three-slot triad; the pairing is a scalping statement and the
  top-down procedure is looser in practice.
- Small wick on the context candle is not quantified.
- The 30m/3m pair is demonstrated but never stated as a rule - it is inferred from the chart
  used.
- No time limit is given for how long to wait for alignment before abandoning the level.
