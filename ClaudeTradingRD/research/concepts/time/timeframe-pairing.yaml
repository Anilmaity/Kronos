id: timeframe-pairing
name: Timeframe Pairing (context / swing point / entry)
variants:
  name:
  - Timeframe Pairing (entry timeframe fixes the analysis timeframes)
  - Timeframe Pairing (draw / stop raid / entry)
  definition:
  - 'EARLIER RECORDING, and the most explicit numeric statement of the pairing in this unit.
    The higher timeframes are not absolute - they are RELATIVE to the timeframe you execute
    on. Three concrete pairs are given: executing on 1-minute and 15-second -> watch 15-minute,
    1-hour and 4-hour for points of interest; executing on 5-minute and lower -> daily, 4-hour
    and 1-hour supply the draw; executing on the 1-hour -> look up to the weekly and monthly.
    The purpose of fixing the pair is attention management: you only drop to the execution
    timeframe when price reaches one of the higher-timeframe levels, because you do not want
    to be searching all the time.'
  - 'Three explicit, complete ladders in which each rung has a job: the DRAW timeframe supplies
    the objective, the middle timeframe supplies the stop raid, and the lowest supplies the
    entry. Stated ladders: (1H or 15m draw / 5m raid / 30s entry); (4H or 1H draw / 15m raid
    / 1m entry); (daily or 4H draw / 1H raid / 5m entry). For the internal/external model
    he names daily / hourly / 5-minute as his own preference, because it aligns with the formation
    of the daily candle. He also demonstrates shifting the whole ladder up (monthly / daily
    / hourly; weekly / 4-hour / 15-minute) for traders who cannot watch intraday.'
  - 'Across all four streams he is asked what timeframes to use and gives the same answer
    with one clock-driven exception. The recommended default for anyone starting out is daily
    plus hourly for bias and 4-hour plus 15-minute for entry — he says this repeatedly and
    adds that most people go to too low a timeframe and get chopped up. The pairs are stated
    as ratios that can be shifted wholesale: hourly-and-5-minute can be replaced by 30-minute-and-3-minute.
    The exception is time-based: before 10:00 the hourly candle has not closed, so trading
    the open requires the 30-minute plus 3-minute pair; from 10:00 the 15-minute plus 5-minute
    pair becomes available. Asked which timeframe he executes on, he answers whichever one
    the setup appears on — hourly, 15-minute or 5-minute — and says the timeframe itself does
    not matter, citing a silver trade held around three weeks off the daily.

    '
  - 'A three-slot timeframe triad in which each slot has a fixed job: one timeframe supplies
    context and bias via a candle that supports expansion; the next supplies the swing point
    (the candle 2 / candle 3 structure); the lowest supplies the entry. For scalping the stated
    triad is hourly for context, 15-minute for the swing point, 1-minute for entry, which
    he calls the 15-minute and 1-minute fractal model. He then states its fractal equivalence
    explicitly: this is the same structure as using a daily for bias, a 4-hour candle closure,
    and a 15-minute entry. The triad is what makes the rest of the model scale-free - the
    same candle 2 / CISD / protected swing logic is run at whichever three levels are selected.

    '
  - 'SHORTS EVIDENCE for the alignment requirement inside a pair, stated as a directional
    condition rather than a table. The rule given is that the lower-timeframe setup must MATCH
    the higher-timeframe structure in direction: a 5-minute bearish setup that aligns with
    the hourly bearish structure is what produces expansion conditions. Two concrete pairs
    are worked in this unit - hourly context with 5-minute entry, and 30-minute context with
    3-minute entry - and in both the instruction on reaching the higher-timeframe point of
    interest is to WAIT for the lower timeframe to align before entering.'
definition: 'A fixed two-level pairing between a structure timeframe and its entry timeframe,
  applied recursively to build three-level stacks. The pairs used explicitly across this unit
  are: monthly->daily, weekly->daily, daily->1H, 4H->15m, 1H->5m, 30m->3m, and 15m->1m. Full
  stacks named in the unit: daily/1H/5m (the playbook), daily/4H/15m (his stated favourite),
  1H/15m/1m (scalping), weekly/daily/1H and monthly/weekly/4H (swing), monthly/daily/1H. He
  adds an override that matters: if the paired timeframe is messy, move UP one timeframe rather
  than force it, and he also allows skipping the entry timeframe and taking the entry on the
  structure timeframe directly.'
category: time
status: contested
aliases:
- aligned time frame
- time frame alignment
- higher time frames are relative to the time frames you are entering on
