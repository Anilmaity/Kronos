id: macros-not-used
name: Macros Rejected
definition: 'Stated flatly and repeatedly in these streams: macros are fake. His argument
  is mechanical rather than dismissive - a macro is an arbitrary window drawn around the open
  of a new higher-timeframe candle, so the candle open is the real object and the window around
  it is invented. He lists macros alongside ''time distortion'', reaper gaps and similar as
  shiny names that do not help a trader learn basics and swing points. Kill zones are rejected
  on the same grounds - he cares about higher-timeframe candles instead.'
variants:
  definition:
  - 'He does not trade macros and states that he does not think they are a real thing. His
    reading is that a macro is simply a certain section of an open-high-low-close, and that
    traders reach for macros because they lack an understanding of OHLC. This is a direct
    rejection of a standard ICT time tool, recorded here for completeness rather than as a
    positive technique.

    '
category: time
status: contested
aliases:
- macro times
- ICT macros
detection_rules:
- Do not implement macro windows.
- Where a macro would be drawn, use the higher-timeframe candle open it surrounds.
- Same for kill zones - replace with candle opens.
- No macro time windows are marked or used.
- The intraday delivery a macro would describe is instead read as open-high-low-close on a
  smaller timeframe.
measurable:
- overlap between macro windows and higher-timeframe candle opens on the same session
- whether macro-window filtering adds anything on top of an OHLC-shape model on the same trade
  set
sources:
- video_id: yNgx9OAefuI
  title: New York Open Live Q&A
  quote: Macros are fake. That's my opinion. Not real.
- video_id: NESSCPMzWR0
  title: New York Open Live Q&A
  quote: I just care about higher time frame candles
- video_id: r7yW6ou1LDs
  title: TTrades Sunday Session - Live Q&A
  quote: all a macro is is a certain section of an open high low close
- video_id: u8bnmaih_hA
  title: TTrades Sunday Session - Live Q&A
ambiguities:
- He labels this an opinion, not a finding, and offers no data against macros.
- He does use specific clock times (9:30, 9:45, 10:00) - the rejection is of the window around
  them, not of the times themselves.
- CONTESTED against mainstream ICT, which treats macros as discrete algorithmic windows. He
  offers a reductive explanation but no evidence or test.
- He gives no account of why the specific macro clock times would arise from OHLC delivery.
