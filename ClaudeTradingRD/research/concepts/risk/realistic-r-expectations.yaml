ambiguities:
- The 63R figure is one student's result on one instrument over four months, presented on
  screen; it is not a backtest and no drawdown, sample-selection or survivorship information
  is given.
- It is not stated whether the 48 trades include or exclude break-even exits.
- Whether the 2R target is his own standing target or only the remediation prescription is
  not made explicit.
- Neither figure comes with a sample size, instrument set or period; both are self-reported
  in a live Q&A.
- Trader T's figure blends simulated (replay) results with live prop-account results.
- Ben declines on air to give his rate of return when asked to substantiate the presentation,
  pointing at his public timeline instead - so the mid-60s figure is unaudited by his own
  framing.
- Neither says whether the rate is per trade or per trade idea (scaled entries counted once
  or several times).
- The 30-80% range is reported second-hand from viewers, not measured; the ~50% figure is
  an impression, not a statistic he has published.
- The 34% break-even figure is stated for a 2R target without stating commissions or slippage
  assumptions.
- He does not say what he personally achieves, and refuses to publish trade results on stream.
- Sample size for evaluating the win rate is never specified.
- He also references 3R to 5R targets on specific examples without reconciling them with the
  2R default.
- The 51% and 34% figures ignore commission and slippage; he does not adjust for them.
- He gives no target win rate for his own model, only that C3-with-IC is its highest.
