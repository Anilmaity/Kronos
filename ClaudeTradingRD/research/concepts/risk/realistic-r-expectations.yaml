preconditions:
- A single model applied consistently to one instrument.
- A fixed R target is in use, so the rate is comparable across trades.
- A model traded consistently enough to produce a sample.
- A defined entry with a defined stop, so R is computable.
detection_rules:
- 'Benchmark: 4-hour / 15-minute model, gold, four months, 48 trades, 63% win rate, average
  RR 1.93, +63R.'
- At a fixed 1R target the required win rate is above 50%.
- 'Fixed-outcome variant: take 2R or -1R and do not manage the position in between.'
- Report the rate together with the R multiple it was earned at - Trader T's 58-65 percent
  is specifically on a 2R target.
- 'Expect month-to-month dispersion: he reports months of 20-25 percent return and months
  of 2-3 percent from the same system.'
- 'Ben''s accounting rule: a break-even trade is neither a win nor a loss, so win rate over-states
  how often the target is actually reached; strike rate is the stricter measure.'
- Do not benchmark against 80-90 percent rates - Trader T states he knows nobody who sustains
  that.
- Expect roughly 50% win rate at 1:2 R for the fractal model; the reported spread is 30-80%.
- At a 2R target the break-even win rate is about 34%.
- Interfering with the trade (early break-even) pushes the required win rate to about 50%.
- Treat runs of 5-7 consecutive losses as within normal variance; do not re-estimate the win
  rate from a handful of trades.
- Set the default target at 2R.
- 'Evaluate the model over a sample: above 50% win rate at 2R is acceptable performance.'
- Treat any claimed win rate near 100% as implausible.
- Accept that a mechanical model will miss valid moves; do not widen rules to catch them.
- 1:1 risk-to-reward requires a 51% win rate to break even.
- 2R requires 34%.
- Target band for this model is 2R to 4R.
- Expect the win rate to fall as the R target rises.
- Judge a win rate only over a large sample - single trades and short streaks say nothing.
invalidation:
- Not applicable.
- Not applicable — this is a calibration statement.
measurable:
- trade count per month per instrument under the same model
- realised win rate and average RR against the 63% / 1.93 benchmark
- difference in expectancy between fixed-2R exits and discretionary management
- strike rate at a fixed 2R over a stated sample, split by month, to reproduce the 45-80 percent
  dispersion
- the gap between win rate and strike rate once break-evens are separated out (Ben's distinction)
- monthly return distribution rather than an average
- realised win rate at a fixed 2R target versus the 34% break-even line
- win-rate delta between trades held to target and trades moved to break-even
- longest realised losing run versus the 5-7 expectation
- win rate at a fixed 2R target over a sample
- trades per week
- realised win rate at each R target vs the break-even threshold
- sample size needed before the observed win rate stabilises
