preconditions:
- A daily chart with recent expansion candles to eyeball.
- A daily chart of the instrument with at least the current month visible.
- Several recent daily candles visible for comparison.
- A daily chart with several recent expansion candles.
detection_rules:
- Eyeball the typical recent daily high-to-low range for the instrument (NQ example - 300-400
  points is normal).
- Measure how much of it the current day has already covered.
- If a whole average daily range is already covered, treat further continuation as low-value
  and require a nearby objective to stay involved.
- Do not compute it as an indicator.
- Read the ranges of the recent expansion days only; ignore quiet and consolidation days.
- 'Take the band those expansion ranges occupy as today''s expectation (his examples: gold
  100-170 points, NQ 400-500, ES 38-75).'
- Compare today's range so far against that band.
- If the band is already covered, do not seek a further continuation - wait for the next daily
  candle.
- 'Do not use an ADR indicator: it averages in the non-expansion ranges.'
- Where no point of interest exists to the left, use the range band as the objective instead.
- Read the last few daily candles and take a representative range figure by eye.
- Project that figure from the session open to place the day's target.
- If the range is already covered, do not enter - the candle has already made its range.
- 'Recent reference figures spoken aloud: NQ ~600 points, gold ~80, silver ~2.4.'
- Read the range of the last several daily candles and take a rough band as the expected day
  range.
- Compare the current day's range so far against that band.
- If the day has already covered the band, do not expect meaningful further expansion; stop
  seeking continuations.
- Reject a target that would require the instrument to cover much more than the band in the
  remaining session.
- Scan the recent daily expansion candles and take their typical high-to-low range.
- Measure the distance from the current price/extreme to the intended target.
- If the target lies inside the expected range, keep it; if materially beyond, downgrade or
  drop it.
- Allow a larger range on scheduled high-volatility days.
invalidation:
- n/a - a filter.
- An anomalous outsized day, which he treats as rare and not to be anticipated.
- Not applicable — this is a filter.
measurable:
- hit rate of targets lying inside versus beyond the remaining eyeballed range
- comparison of his eyeballed figure against ATR(n) on the same instrument
- distribution of daily ranges split into expansion vs non-expansion days
- expectancy of entries taken after the expansion-day band was already covered
- difference between a standard ADR(n) and the expansion-only mean
- difference between an eyeballed range and a computed N-day ATR on the same instrument
- hit rate of targets placed at the eyeballed range distance
- distribution of daily ranges versus the eyeballed band
- outcome of continuation entries taken after the band was already covered
- hit rate of targets rejected on ADR grounds
- Hit rate of targets inside vs outside the eyeballed range.
- Comparison of the eyeballed figure against a computed ATR(n) to see which better predicts
  target attainment.
