ambiguities:
- No lookback length, no averaging method, no session basis (RTH vs full session) - he explicitly
  says he does not use an indicator.
- The 300-400 point figure is NQ-specific and given in passing; no figures for ES, YM, gold
  or currencies.
- '"Already made a whole average daily range" is not turned into a hard no-trade rule; it
  downgrades rather than blocks.'
- No lookback length is given. He scrolls 'lately' in one stream and 'this month' in another.
- No rule separates an expansion day from a normal day when reading the chart - it is eyeballed.
- Whether the band is the mean, the max, or the modal range is never stated; he quotes a range
  of values, not a number.
- The quoted point values are instrument- and period-specific and should not be treated as
  constants.
- No lookback, no averaging method, no ATR - the figure is explicitly a judgement from the
  last few candles, so two traders will not derive the same number.
- The instrument figures are point values on that date and are not scale-invariant; they cannot
  be reused as constants.
- Whether the range is measured high-to-low or open-to-target is not stated; the worked examples
  project from the open.
- No lookback period, no averaging method and no ATR setting are given — he explicitly guesses.
- No threshold is given for 'already expanded enough'; in one session 300 of 500-600 is treated
  as enough context to refuse a further target, in another 500 points is.
- Whether the band is measured high-to-low or close-to-close is not stated.
- No lookback length, no averaging method, and no rule for whether the range is measured from
  the day open, the day extreme, or the current price.
- The event-day uplift is acknowledged but unquantified.
