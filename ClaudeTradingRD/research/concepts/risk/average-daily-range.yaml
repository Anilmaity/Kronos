id: average-daily-range
name: Average Daily Range (eyeballed) as target filter
definition: 'He confirms directly that he uses average daily range rather than an ATR indicator,
  that he suspects the two are the same thing, and that he does not compute it - he looks
  at the chart. Its use in these streams is as a stop-looking filter: once the day has already
  covered a whole average daily range, the remaining opportunity is small and he only stays
  interested because a nearby higher low is still reachable. On NQ he calls a 300-400 point
  day "fine for an average daily range", the only number attached to the idea in this unit,
  and elsewhere calls a 350-point NQ move "basically a daily range last week".

  '
variants:
  definition:
  - 'Asked three separate times how he finds ADR, he gives the same manual procedure and explicitly
    rejects the indicator: an ADR indicator averages all previous ranges, including the quiet
    ones, whereas he only looks at the expansion candles. The method is to scroll the daily
    chart of the instrument, read off the ranges of the recent expansion days, and take that
    band as the expectation for today. Worked live: gold''s recent expansion candles were
    110-170 points, so at 150-170 the daily range is "capped"; in another stream gold''s largest
    candle of the month was 250 while the typical expansion day was 100-130, so 150 was already
    beyond normal expectation; NQ was quoted at 400-500 points and ES at 38-75. Once the day
    has covered that band he stands aside and waits for the next daily candle rather than
    seeking a further continuation - and where no POI exists (all-time highs) the range band
    becomes the objective in its place.

    '
  - 'The daily range is eyeballed off the last few daily candles, never computed. He states
    outright that he does not use ATR mechanically and just looks at the daily chart to ask
    how far price can go. Concrete numbers said aloud: on NASDAQ (NQ) the recent daily candles
    ran about 600 points each, so ~600 was called a good range and used to place the day''s
    target - one prior day was noted as an unusual 1,000; another session was sized at 400-500.
    Gold was given an assumed ~80-point range and silver ~2.4. When the range is already covered
    he will not enter.'
  - 'He confirms ADR is a real input and then confirms it is eyeballed rather than computed:
    he looks at the recent daily candles, reads off their sizes ("the larger range size, you
    know, 120. This one did 60. These ones are like probably 80") and guesses a band — 80
    to 100 — then compares the day''s range so far against it. Once the day is at or near
    that band he stops expecting further expansion and stops looking for continuation entries.
    The same reasoning is used to reject targets: on a day already 300 points into a 500-600
    point typical range he declines to project previous day low, and on the index sessions
    a 500-point range is called reason enough not to expect another 600. He says it is a fractal
    concept and that average true range can be used, but does not use a lookback or a setting
    himself.

    '
  - 'A rough expected daily range obtained by eye from recent expansion candles on the daily
    chart (his worked example: roughly 700 points on YM). Its use is as a target filter: an
    intended objective is only realistic if it sits inside that expected range measured from
    the day''s open/extreme. High-volatility scheduled events (e.g. FOMC) permit a larger
    range.

    '
