ambiguities:
- '''Trustworthy'' is illustrated (SMT present vs equal highs alone) but not defined as a
  test; SMT is the only substitute named in this unit.'
- It is not stated whether an SMT is strictly required or is simply the example he reaches
  for; elsewhere he calls SMT a confluence, not a framework.
- The R threshold that makes a setup worth taking is given only as the 2R / 1.7R illustration
  in one example.
