id: idea-vs-executable-setup
name: An Idea Is Not A Setup (no trustworthy invalidation, no trade)
definition: 'He spends an entire stream correctly bearish and takes nothing, and states why:
  a directional anticipation is not a tradeable setup. What converts one into the other is
  a place to put the stop that he trusts. In the worked case the continuation exists and the
  bias is right, but the swing high it would risk against is a pair of near-equal highs with
  no SMT against the correlated assets, so there is no opposing candle he trusts as an invalidation
  and therefore no trade. He generalises it in a second stream: without an SMT (or an equivalent)
  he cannot trade away from a level at all. A related answer makes the same point from the
  other side - to have an invalidation you must first have a model; on a day where no model
  has printed on the daily chart there is nothing to be invalidated.

  '
category: risk
status: specified
aliases:
- difference between an idea and having the setup
- I don't have a good invalidation
preconditions:
- A directional bias exists for the day.
detection_rules:
- Before entering, locate the specific level the stop will sit beyond.
- 'That level must be trustworthy: an opposing candle / swing produced by a sweep with an
  SMT against the correlated assets, not a set of near-equal highs or lows on their own.'
- If no such level exists, the day yields an idea but not a setup - do not trade it.
- If no model has printed on the daily chart, there is nothing to invalidate; the concept
  of an invalidation trade does not apply that day.
invalidation:
- Not applicable - this is a pre-trade gate.
measurable:
- proportion of correct daily biases that produced no executable setup
- stop-out rate of entries whose invalidation was equal highs / lows without SMT
sources:
- video_id: N3Ml-r0X30o
  title: New York Open Live Q&A
