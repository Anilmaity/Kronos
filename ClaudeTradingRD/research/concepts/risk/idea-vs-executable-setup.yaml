execution:
  bias: Unchanged; the gate only decides whether the bias is executable.
  entry: Only once an invalidation level exists that permits the intended R multiple.
  stop: Beyond the trusted opposing candle.
  targets:
  - stated as 2R, or 1.7R to the nearest low, in the worked example
