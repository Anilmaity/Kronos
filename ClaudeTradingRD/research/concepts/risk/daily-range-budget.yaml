id: daily-range-budget
name: Daily Range Budget (Eyeballed, Not ADR)
definition: 'Before taking an entry he estimates the expected daily range by looking at the
  last several daily candles (his example on NQ: 658, 740 and 540 points, so roughly 500 to
  600 expected) and asks how much of that budget the current day has already produced. Once
  the bulk of the expected range has been produced, further entries in that direction become
  unappealing even if the idea is otherwise valid. He explicitly declines to use an average-daily-range
  indicator.

  '
variants:
  definition:
  - 'Applied on gold in the London model: a 4-hour candle 2 with ''a little bit of a wick''
    is still traded because the daily range of recent expansion candles is around 100 points
    and the day is only halfway through it, so ''we still have a lot of range left''. The
    wick is judged against the remaining daily range, not in isolation.

    '
  - 'Adds a volatility input: he checks the VIX (or just the daily chart) to set range expectations.
    With the VIX at the low of a big range he holds lower expectations for the day''s range.
    He also notes that the day''s move had already made most of a daily range and that recent
    days were smaller-range, so further expansion was not expected.'
  - 'The ''rope'' analogy for daily range (e.g. ~500 points on NQ). The amount of range the
    overnight sessions have already used governs what New York can deliver: if Asia forms
    the low and London expands, little is expected in New York; if the overnight uses no range
    and New York reverses, New York is expected to use the remaining range. Applied live:
    NQ had already expanded to the daily level, so he did not expect much more range.'
category: risk
status: contested
aliases:
- daily range created
- how much range is left
preconditions:
- The current day has a measurable high-to-low range so far.
detection_rules:
- Measure the high-to-low range of the last several daily candles.
- Treat the typical value as the expected range for today.
- Measure today's range so far and compute the remainder.
- Near the top of the expected range, reject new entries in the same direction.
- Estimate the daily range of recent expansion candles (gold example ~100 points).
- If roughly half or more remains, a moderate 4-hour wick does not disqualify the trade.
- When the VIX is at the low of its recent range, lower the expected daily range.
- Estimate typical daily range (eyeballed, e.g. ~500 pts NQ).
- At the NY open, measure the range already produced by Asia and London.
- If overnight already produced the low/high and most of the range, lower NY expansion expectations
  / skip continuation entries.
- If overnight produced little range and NY reverses, expect NY to deliver the remaining range.
invalidation:
- An unusually large day where the range materially exceeds the recent norm.
measurable:
- trade outcome bucketed by percentage of expected daily range already consumed at entry
- outcome by fraction of expected daily range remaining at entry
