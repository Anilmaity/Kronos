ambiguities:
- No lookback length or statistic (mean, median, percentile) is specified.
- The bulk of the range is not defined as a percentage.
- Halfway is the only threshold implied; the 100-point figure is one example on gold futures.
- No VIX level or lookback is given; 'low of this range' is read by eye.
- No threshold for 'used all the rope' is given.
- Anomaly days (e.g. 1,400-point days) are acknowledged as exceptions.
