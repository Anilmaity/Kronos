id: stuck-inside-no-trade
name: Stuck Inside (chop shop) - Stand Aside And Redraw
definition: When price fails to take out either boundary of the current broadening formation
  and trades back and forth inside it, the guest calls it a chop shop and says explicitly
  that this is what he does not want to trade. Two consequences follow. First, standing aside
  is the rule, because inside the formation there is no momentum and the outcome is decided
  purely by which side is momentarily more aggressive. Second, the stuck price action is itself
  the seed of a NEW, larger broadening formation - each time it fails to resolve, the try
  is redrawn wider - so the correct response is to wait for the formations to get big enough
  that taking a side actually reaches real liquidity.
category: risk
status: specified
aliases:
- chop shop
- getting stuck
- corrective activity
preconditions:
- A drawn broadening formation / previous range.
detection_rules:
- 'Price has taken neither the high nor the low of the formation and is trading within it:
  no trade.'
- Bars that are all contained by the formation are treated as one compound inside bar on a
  higher timeframe.
- When this happens, start a new broadening formation from the stuck range and expect it to
  widen.
- A timeframe going inside (a 1) is the same condition expressed as a candle - those participants
  are not in control.
- Resume trading only once one side of the formation is taken and price stays outside.
invalidation:
- A boundary is taken and held - the formation resolves and normal signals apply again.
measurable:
- P&L of signals taken inside vs outside a drawn formation
- how many redraw cycles a formation typically goes through before resolving
sources:
