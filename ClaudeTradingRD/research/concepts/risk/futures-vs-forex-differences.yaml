ambiguities:
- '''No broker manipulation'' is asserted, not evidenced.'
- The no-slippage claim is hedged with 'generally' and is made for the S&P; nothing is said
  about thin instruments or news releases.
- The euro-future overlay is described as having 'similar movement' to EURUSD with no correlation
  figure.
- Tax treatment is named as different but not described.
