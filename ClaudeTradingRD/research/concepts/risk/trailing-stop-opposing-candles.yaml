  title: TTrades Sunday Session - Live Q&A
ambiguities:
- Sourced from an ASR (whisper-small) transcript, not YouTube captions; wording may be imprecise.
- The R multiple this move is made to achieve is mistranscribed by the ASR (it renders as
  'to R' / 'two R' inconsistently); the reading that he is reaching for 2R comes from context
  and from the same target being described as 2R elsewhere in the unit, not from a clean rendering
  here.
- Whether the stop sits exactly at the half level or slightly beyond it is not stated.
- Moving a stop closer to raise the ratio is the same manoeuvre this unit's rr-gated-entry-refinement
  warns against on the target side; the asymmetry (targets are sacrosanct, stops are movable)
  is used but never argued for.
- Whether the half level is measured across the bodies or the wicks of the opposing-candle
  series is not stated anywhere in this unit.
- He describes the method and then says it is 'a little bit too tight of a trail' without
  offering a replacement rule.
- Elsewhere he says he only manages a position after 2R, which is a different rule; the two
  are not reconciled.
- Whether the stop goes exactly at the opposing candle extreme or beyond it is not stated.
