id: trailing-stop-opposing-candles
name: Trailing By Opposing Candles
definition: 'This unit supplies the level the library''s existing entry leaves open - where
  exactly the stop goes relative to the opposing candle - and supplies a reason for moving
  it that is not protection but arithmetic. Having entered on the 30-minute with the stop
  above the swing high, the target does not give the multiple he wants, so he moves the stop
  down to 50% of the opposing candle. The justification is a directional claim, not a risk-management
  one: he does not anticipate price trading back above the half of that candle, so the tighter
  stop is treated as structurally sound rather than as a compromise. The half level of the
  opposing candle is therefore doing double duty in this unit - it is the retest filter on
  the way in, and the stop level on the way through.

  '
variants:
  definition:
  - 'A mechanical trailing method demonstrated on a New York reversal: each time price closes
    below a newly formed opposing candle, that candle''s high becomes the level that should
    not be hit, and the stop trails to it. He walks it through live and then partly disowns
    it - on the example shown it would have stopped him out before the target was reached.
    He notes the trade-off explicitly: it is too tight, but it also saves you from sitting
    through the chop.

    '
category: risk
status: contested
aliases:
- move my stop there
- 50% of this opposing candle
- 0.5 of the opposing candle as the stop
- trailing stop
- trail to the new opposing candle
preconditions:
- An open position entered against a protected swing, with the stop at that swing.
- An identified opposing candle between entry and the swing.
- A fixed target that the current stop distance does not reach at the required multiple.
- A position is open in a confirmed directional move.
- Opposing candles are being formed and violated as price delivers.
detection_rules:
- Mark 0.5 of the opposing candle.
- Move the stop to that half level rather than leaving it at the swing extreme, when the swing-extreme
  stop does not give the required ratio to the fixed target.
- 'The justification required is directional: price is not expected to trade back above (bearish)
  or below (bullish) the half of that candle.'
- Prefer moving the stop over moving the target - the target stays where the structure put
  it.
- After each close beyond a new opposing candle, treat that candle's extreme as the current
  invalidation.
- Until a new opposing candle forms, the previous one remains the operative level - do not
  trail to intermediate highs.
- Trail the stop to the current operative opposing candle extreme.
invalidation:
- Price trades back through 0.5 of the opposing candle - the directional premise that justified
  the tighter stop has failed.
- Price hitting the trailed level - position closed.
measurable:
- stop-out rate at 0.5 of the opposing candle vs at its extreme, same trades
- how often price that violates the half level still reaches the target
- R actually realised under each stop placement across a sample
- how often this trail exits before the intended target
- average R captured with this trail vs a fixed stop to the same target
sources:
