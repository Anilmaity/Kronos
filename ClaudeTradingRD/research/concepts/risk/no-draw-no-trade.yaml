id: no-draw-no-trade
name: No Monthly Draw And No Weekly Expansion Read, No Trade
variants:
  name:
  - No Directional Draw, No Trade
  definition:
  - 'If the daily draw on liquidity is neither clearly higher nor clearly lower, the situation
    is treated as 50/50 and any trade taken from it is by definition low probability. The
    prescribed action is to take no trade, allow the market to play out, and re-run the analysis
    once a direction is established. The same doctrine appears in this unit as refusing to
    trade when the daily bias shows indecision and as returning bias to neutral once a higher-timeframe
    objective is reached.

    '
definition: 'Rauf states the gate twice: if you do not have a clear draw on the monthly and
  you do not have a clear idea of which way the weekly candle is going to expand, there is
  no point trading. His positive framing is that the weekly range IS the market - knowing
  which way the weekly candle expands lets you overlay the economic calendar and frame every
  setup for the week. He grounds it on the claim that a candle can only print two shapes (open-low-high-close
  or open-high-low-close), so the whole question reduces to which of the two the week is printing.'
category: risk
status: contested
aliases:
- know where the weekly candle will expand
- 50/50 scenario
- wait for more market information
preconditions:
- Higher-timeframe analysis has been attempted.
detection_rules:
- Identify a clear draw on liquidity on the monthly chart (an untaken high/low or an unfilled
  fair value gap).
- Form a directional expectation for the weekly candle's expansion.
- If either is missing, take no trades on that instrument.
- Where present, overlay the economic calendar to place the manipulation within the week.
- There is no clearly higher or clearly lower daily draw on liquidity -> do not trade.
- Higher-timeframe objective has already been reached -> bias is neutral, do not trade.
- Price is caught between two opposing higher-timeframe PD arrays with no close through either
  -> do not trade.
invalidation:
- The monthly draw is taken or the weekly expansion completes - re-derive.
- A daily close establishes direction through one of the framing arrays.
measurable:
- proportion of weeks with a classifiable monthly draw
- P&L of weeks traded with vs without a clear weekly expansion read
- win rate of trades taken on days classified as no-clear-draw vs clear-draw
- count of sessions skipped per month under this rule
