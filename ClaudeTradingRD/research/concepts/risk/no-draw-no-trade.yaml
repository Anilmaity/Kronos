ambiguities:
- '''Clear'' is not defined for either the monthly draw or the weekly expansion read.'
- The two-shapes claim ignores doji / inside weeks entirely.
- The transcript garbles 'cap the weekly range' as 'cut'/'cup' the weekly range in several
  places.
- '''Clearly higher or lower'' is not given a mechanical test in Gene''s talk; Jokerszn supplies
  one (daily close through a framing PD array) and Nick another (a daily close above/below
  the opposing weekly FVG).'
