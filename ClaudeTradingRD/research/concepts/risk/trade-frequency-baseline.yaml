ambiguities:
- The one-to-two-a-week figure is given for his own trading across his whole watchlist (indices
  plus gold plus occasional oil/dollar), not per instrument.
- It is not stated whether the six-to-eight-a-year swing setups are per instrument or across
  the whole watchlist.
- The link between low frequency and his best-ever win rate is asserted, not evidenced, and
  he declines on air to give a rate of return.
- He is three years into trading and about five months into this methodology at the time of
  recording, so the 'entire trading career' comparison is short.
- No rule states what makes a week's second setup the last one - the frequency is an observed
  average, not a cap.
- This sits directly against the host's own two-to-three-trades-a-day figure in another video
  of this unit; different speakers, different eras.
