id: trade-frequency-baseline
name: Expected Trade Frequency (one to two a week)
definition: 'The stated live cadence of the model: normally one to two trades a week, occasionally
  three or four, and not every day. The daily-chart swing setups he sizes up for come around
  roughly six to eight times a year. Frequency is explicitly a function of the timeframe traded
  - lower timeframe means more setups and correspondingly smaller risk per setup; higher timeframe
  means fewer setups and more risk on each.'
variants:
  definition:
  - 'Ben''s frequency claim, notable because it is paired with an outcome claim: he averages
    about one to two trades a week EVEN THOUGH he executes on the 1-minute and 2-minute, and
    says that doing so has produced the most consistency and the highest win rate of his entire
    trading career. The supporting doctrine is permission to miss: you do not need to catch
    every swing, you do not need to trade every session, and traders go days or weeks without
    a trade. He accepts missing AM moves outright when the setup he wants does not appear
    or he needs more data.

    '
category: risk
status: contested
aliases:
- one to two trades a week
- you don't need to trade every session
preconditions:
- A defined setup with the discipline to skip everything else.
detection_rules:
- 'Intraday model on the stated instruments: expect one to two signals per week, up to three
  or four.'
- 'Daily-chart swing setups: expect six to eight per year.'
- There is no minimum - 'one trade a day max' is a cap, not a quota, and many days produce
  nothing.
- Risk per trade scales inversely with setup frequency for the timeframe being traded.
- 'Target frequency: one to two trades per week, regardless of how low the execution timeframe
  is.'
- Low execution timeframe is for R and precision, not for frequency - the two are decoupled.
- Missing a session or a whole day is expected behaviour, not a failure.
invalidation:
- Not applicable.
measurable:
- signals per week produced by a candidate detector vs the one-to-two baseline
- signals per year on the daily timeframe vs the six-to-eight baseline
- trades per week against win rate for the same trader - his implicit claim is that they move
  in opposite directions
- expectancy of the marginal trade beyond the second in a week
