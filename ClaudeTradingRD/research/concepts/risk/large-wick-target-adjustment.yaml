ambiguities:
- '''Larger wick'' is not quantified - the threshold that separates it from a shallow run
  is the same unresolved judgement recorded in wick-size-test.'
- '''Session lows'' is used without defining which session or its hours.'
- Which daily open is meant (the 18:00 open the corpus elsewhere prefers, or midnight, or
  the exchange open) is not stated in either Short.
- No rule is given for choosing between the daily open and the session lows when both are
  available and at different distances.
- The permission to keep going past the adjusted target ('it's not that price can't trade
  lower') has no management rule attached - whether to hold runners is not stated.
- '''Large'' is not quantified (the blocking term - see small-wick-expansion-rule).'
- No rule chooses between the daily-open target and the current-high-of-day target.
- '''Average daily range'' is invoked as the small-wick target with no lookback period stated
  here.'
- Which 'daily open' is meant (18:00, midnight, 09:30) is not stated in this unit.
- '''Session lows'' is used without naming the sessions in the candle 2 video; Asia and London
  are named only in passing.'
- The large/small threshold is the same unquantified classification the whole model rests
  on.
