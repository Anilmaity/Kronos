id: large-wick-target-adjustment
name: Large Wick - Adjust Targets, Do Not Expect Expansion
definition: 'Two Shorts state the target substitution explicitly and name the substitute levels.
  When the candle being traded away from carries a LARGER wick (a large opposing run rather
  than a shallow one), the expectation of a full expansion through the opposite extreme is
  dropped and the targets move in to the opening price - specifically the daily open and the
  session lows / the targets clustered around the opening price. He states the reasoning as
  a refusal to be greedy: the trade is still taken, but a wick that does not support expansion
  does not justify a massive move as the objective. He is explicit that price CAN still travel
  further (one example names a fair value gap around the EQ of the range as reachable); the
  rule is about where expectation is set, not about a hard ceiling.

  '
variants:
  definition:
  - 'SHORTS EVIDENCE. When the candle in play has a large wick, the trade is not abandoned
    - the targets are cut. Two named fallbacks are given: look back towards the DAILY OPEN,
    or target the CURRENT HIGH OF DAY (the extreme already made). The alternative to cutting
    targets is to skip the candle entirely and trade the following day for a continuation.
    The stated reason is a range budget: daily candles only have so much range, so a large
    opposing wick has already spent it. Conversely, a small-wick daily candle earns the full
    target - the body may be traded out to the average daily range.'
  - 'The explicit target-side counterpart to the wick-size filter. A reversal candle with
    a large wick can still be traded -- he says so directly -- but the target set must be
    swapped, because most of the period''s range has already been spent forming the wick.
    With a small wick (reversal-to-expansion candle) he targets previous candles'' extremes
    and standard deviation projections. With a large wick he targets, instead: the DAILY OPEN
    (or the higher-timeframe open when used fractally), the SESSION LOWS/HIGHS, and the CURRENT
    candle''s low/high. He also gives the disqualifier: if the overnight session highs/lows
    have ALREADY been taken, there is no low-resistance liquidity left and the R is not there.'
category: risk
status: contested
aliases:
- adjust your targets
- trading a larger wick
preconditions:
- A reversal is being framed away from a candle whose opposing run is large (see wick-size-test).
- A daily bias exists.
- The current daily candle has printed a large opposing wick.
- A reversal candle whose wick against the intended direction is large.
detection_rules:
- 'Classify the opposing run: shallow run, or large opposing run?'
- 'If large: do not target a full expansion through the far side of the range.'
- 'Substitute targets: the opening price - concretely the daily open, plus the session lows
  / the levels clustered around that opening price.'
- 'The shallow-run branch is the alternative: a shallow run above the previous day high supports
  a reversal traded back toward equilibrium.'
- Price travelling beyond the adjusted target is allowed and does not invalidate the read;
  the rule sets expectation, not a ceiling.
- If the daily candle has a large wick, do not expect expansion.
- 'Target 1: back towards the daily open.'
- 'Target 2: the current high (or low) of day.'
- 'Alternative: skip this candle and trade the following day for a continuation.'
- If instead the wick is small, target the average daily range with the body of the candle.
- Classify the wick as large (a large opposing run, close near the open).
- 'Replace expansion targets with: the daily open (or higher-timeframe open), the session
  lows/highs, and the current candle''s low/high.'
- Do not target previous candles' extremes or the deeper standard deviation projections on
  a large-wick candle.
- 'Disqualifier: if the session highs/lows have already been taken out, there are no failure
  swings left as targets -- the R does not work and the setup is skipped.'
- 'Preferred alternative to trading a large-wick candle at all: let the reversal day trade,
  then look for the continuation day and check whether IT has a small wick.'
invalidation:
- The candle turns out to carry a small wick after all - the ordinary expansion targets apply.
- In the worked example the day simply closed as a reversal candle and the further move never
  came, which is the cost the rule is designed to avoid paying.
- The reduced target set is reached -- expectations end there; further movement is a bonus,
  not a plan.
measurable:
- hit rate of the daily-open target on large-wick days vs the hit rate of the far-extreme
  target on the same days
- give-up in R from using the daily open instead of the range extreme
- how often price continues past the daily open to the range EQ on large-wick days
- hit rate of 'daily open' and 'current high of day' targets after large-wick days
- realised range of large-wick days versus small-wick days
- hit rate of the daily open as a target on large-wick days
- range covered after a large-wick candle vs a small-wick candle
- how often session extremes are already taken at decision time
