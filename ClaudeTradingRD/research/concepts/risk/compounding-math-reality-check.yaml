id: compounding-math-reality-check
name: The One-Percent-A-Day Compounding Table (why account-doubling challenges fail)
definition: 'A numeric argument against the $1,000-to-$1,000,000 account challenges circulating
  on social media. Doubling ten times assumes a 100% return on every trade repeated ten times
  consecutively, and breaks on two practical constraints: position sizing (nobody commits
  100% of a $16,000 account to reach $32,000, or 100% of $64,000 to reach $128,000) and fill
  capacity, which differs between futures, options and stock. The guest then runs the compounding
  arithmetic as a reductio at an ''ambitious one percent per day'': 232 days to $10,000, 463
  days to $100,000, 695 days to $1,000,000, 926 days to $10,000,000 and just under 1,160 days
  to $100,000,000 - if that were achievable, everyone''s account would already be that size.
  The realistic frame he substitutes is roughly 250 trading days a year, so $10 a day is $2,500
  a year, $100 a day is $25,000 a year, and just under $500 a day is about six figures a year.
  Reported 10k-50k-dollar days are to be treated as unverified, since results are trivially
  photoshopped, paper-traded, or cherry-picked from many accounts.'
category: risk
status: specified
aliases:
- thousand dollar account challenge
- base hits will pay the bills
preconditions:
- A stated return-per-period target being evaluated.
detection_rules:
- 'Compounding at 1% per day: 232 days to $10k, 463 to $100k, 695 to $1M, 926 to $10M, ~1,160
  to $100M.'
- Assume ~250 trading days per year when converting an average daily figure into an annual
  one.
- Reject any account-doubling plan that requires committing the whole balance to a single
  trade.
- Treat published daily-P&L screenshots as unverified evidence.
invalidation:
- Not applicable - an arithmetic argument.
measurable:
- realised daily return distribution against the 1%/day assumption
- maximum position size achievable at the trader's account size given instrument fill capacity
