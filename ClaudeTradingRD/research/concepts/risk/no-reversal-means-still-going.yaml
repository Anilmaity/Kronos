id: no-reversal-means-still-going
name: If It Does Not Reverse Against You, It Is Still Going
definition: 'The guest''s core trade-management doctrine: a position is exited not on a target
  being reached but on a REVERSAL SIGNAL appearing against it. Absence of an opposing actionable
  signal is itself the reason to stay in. He contrasts this with ICT explicitly - ICT ''focuses
  a lot on trading the range'', whereas TheSTRAT is ''trying to create winning positions and
  hold them as long as possible''. Because a signal that triggers a higher timeframe hands
  you that whole timeframe''s duration to work with, triggering the month means you have the
  rest of the month to hold.'
category: risk
status: specified
aliases:
- hold until a reversal against you
preconditions:
- An open position taken on a STRAT actionable signal with timeframe continuity.
detection_rules:
- Hold while no opposing 2 (a '2-2 against you') prints on the timeframe the trade was framed
  on.
- A 2-2 against the position is the cue to lighten / partial, not necessarily to exit fully,
  if the higher timeframe is still in force.
- A 3 against the position is given time before acting, because a 3 is itself a broadening
  formation and may resolve back your way.
- If a lower-timeframe signal triggers the next timeframe up, extend the intended hold to
  that timeframe's duration.
- Move stops up promptly - 'you don't want to let green go red'.
invalidation:
- An opposing 2 on the framing timeframe that is not immediately recovered.
measurable:
- average hold time and R of exits on opposing-2 vs fixed targets
- how often a 3 against the position resolves back in the original direction
