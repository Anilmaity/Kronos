id: stop-loss-placement
name: Stop Loss Placement (Swing vs Body)
variants:
  name:
  - Stop Loss Placement (Swing vs Zone)
  - Stop Loss Placement
  - Stops Belong Behind Long-Term And Intermediate-Term Swings, Never Short-Term Ones
  - Stop At The Short-Term Swing, Or At The Candle That Made The Gap
  definition:
  - 'THE DEDICATED EARLIER LESSON, and it is explicitly offered as a template to experiment
    with rather than a rule. Two placements only, and he switches between them by risk tolerance
    for the particular play: (1) the high (short) or low (long) of the CANDLE THAT MADE the
    fair value gap / order block being entered, and (2) the short-term high or low above/below
    it. Where a lower low sits nearby that has a chance of being run, he prefers the safer,
    wider of the two. The choice is explicitly a function of what else sits above the level
    - imbalances and other things overhead push him to the wider stop.'
  - 'A Short devoted to the question gives the cleanest binary in the unit. The stop always
    goes on a protected low, but there are two ways to express it. The FULL INVALIDATION places
    it on the very low of the protected swing: safest, but 2R is further away. The BODY INVALIDATION
    places it on the bodies of the opposing candles that form the protected swing: a smaller
    stop and a quicker 2R, at the explicit cost that price can stop you out without having
    invalidated the idea. He states the cost is something you have to accept if you choose
    the body version, and gives no rule for choosing between them.

    '
  - 'Across the entry videos there are exactly two candidate stop locations: the swing high/low
    that defines the setup, or the far end of the PD array being entered (order block low,
    breaker low). The trade-off is stated explicitly: the zone stop gives better risk-to-reward
    but can be wicked out while the trade is still structurally valid; the swing stop is safer
    but pushes fixed-R targets further away. The speaker''s own stated preference is to keep
    the stop at the swing and instead move the ENTRY closer to invalidation (via the mean
    threshold or an overlapping fair value gap) rather than moving the invalidation closer
    to the entry.

    '
  - 'Two guests give compatible, decidable stop rules. Ben''s is a selection rule between
    candidate swings: the stop goes on the swing low that has NOT just been raided - if the
    nearer swing was taken out by the very move that created the entry, it is unusable, so
    the stop goes behind it. He also discusses the choice between an aggressive and a conservative
    swing high on the same setup: the conservative one is less likely to be raided, but the
    aggressive one is still valid because it is where the move originated, and a large wick
    beyond it is read as a deviation from the range (liquidity grabbed and returned) rather
    than as structure. Finessee_Fx''s rule is array-based: the stop always goes beyond the
    order block, because a violated order block means order flow no longer respects that direction,
    so the stop and the bias flip together.

    '
  - 'Asked how many points above the protected swing the stop should sit, he answers that
    there is no buffer: the stop goes at the protected swing itself, because if that level
    is taken out that is the invalidation of the idea, and adding room (his example: "24 points
    extra") would only be paying to be wrong more slowly. The one stated exception is the
    advanced entry where the CISD level is too far away for the risk-to-reward to work: there
    the stop may be moved to 50% of the swing being entered from — explicitly *below* that
    half level, never at it.

    '
  - 'Rauf says he does not read market structure for direction, but he does use it for one
    thing: stop placement. He finds the best stops form at intermediate-term and long-term
    highs and lows, and that placing stops above long-term highs (or below long-term lows)
    is much safer. Short-term highs and lows he considers much riskier as stop locations.'
  - Asked about stop placement, the host gives a short list of two locations and one selection
    criterion. The stop goes at the short-term low below the entry (or the short-term high
    above it, for a short), or alternatively at the extreme of the candle that created the
    fair value gap being entered. Which of the two is used depends on whether an order block
    sits between them that price is likely to run into. He notes he has made a dedicated video
    on the subject rather than expanding further on air.
definition: 'The stop is the protected swing -- that is the whole answer, and it is why the
  protected swing definition is a prerequisite for this topic. When the protected-swing stop
  does not produce the required risk-to-reward, he permits ONE documented modification: move
  the stop to the BODY extreme of the opposing-candle series (the mean threshold / 50% logic),
  with the explicitly acknowledged cost that price will sometimes sweep the wick, stop him
  out, and then reach the target. He also gives the alternative to widening: instead of moving
  the stop, take a limit entry or wait for a retest so the entry price improves the R.'
