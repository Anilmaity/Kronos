ambiguities:
- '''A little bit more room than normal'' for oil is not quantified.'
- No rule says when to prefer the body stop over the retest entry -- both are offered for
  the same problem.
- 'EVOLUTION: the later canon frames placement around the PROTECTED SWING and the order block
  mean threshold. Neither term appears here; the vocabulary is ''the candle that made the
  fair value gap'' and ''the short-term high''. Same geometry, earlier names.'
- '''Depending on my risk tolerance for that certain play'' is explicitly discretionary.'
- No buffer beyond the extreme (ticks, points, ATR) is specified.
- The video is framed as 'a template for you to work on... and to experiment with', so it
  is not presented as a fixed rule at all.
- No rule is given for WHEN to choose body over full invalidation - it is presented as a trader's
  trade-off only.
- '''The bodies of these opposing candles'' does not say whether the reference is the highest/lowest
  body of the series or the nearest one.'
- No buffer beyond the chosen level is mentioned.
- 'The two videos give opposite emphases: the order block video prefers the swing stop as
  a principle, the breaker video calls it user discretion and shows the zone stop outperforming.
  Neither is presented as overriding — this is genuine unresolved discretion, not a contradiction
  of fact.'
- No buffer is specified beyond the swing or zone (ticks, points, ATR).
- No rule for moving to breakeven, partials, or trailing, other than one mention of leaving
  runners.
- '''Just been raided'' is not bounded in time or in candle count.'
- Ben does not resolve the aggressive-versus-conservative swing choice with a rule; he presents
  both as valid and leaves it to the trader.
- Neither speaker states a buffer beyond the swing or the block.
- Finessee_Fx's 'violated' is not defined as a wick or a body event.
- How far below the 50% level the exception stop should sit is not quantified.
- Whether the no-buffer rule survives on instruments with wider spreads or on forex is never
  addressed; all examples are futures.
- He states separately that he prefers to enter at market rather than with limits, but does
  not say whether the stop is placed as a resting order or managed.
- The short/intermediate/long labelling is assumed from ICT and not defined here.
- No rule reconciles a long-term stop with a risk-to-reward floor when the long-term swing
  is far away.
- No buffer is specified beyond the swing - ticks, points or a percentage of the range are
  not mentioned.
- '''Likely to run into'' is judged by eye; no rule ranks the two candidate order blocks.'
