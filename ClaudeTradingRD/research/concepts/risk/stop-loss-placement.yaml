preconditions:
- A protected swing exists (important level reached, then closed through).
- An entry pattern (order block, breaker, CISD, OTE) with an identified swing extreme and
  zone.
- An entry has been located at an array or after a structure shift.
- A protected swing exists on the timeframe being traded.
- Swing points labelled short-term / intermediate-term / long-term.
- An entry at a fair value gap or point of interest with a short-term swing behind it.
detection_rules:
- 'Default: stop beyond the protected swing.'
- If R is insufficient, place the stop at the body extreme of the opposing-candle series instead,
  accepting sweep risk.
- 'Alternative to widening: improve entry via a limit at the level or a retest, keeping the
  swing stop.'
- For instruments that habitually sweep (he names oil), deliberately allow extra room beyond
  the normal stop.
- Where no point of interest exists inside the range, use 0.5 of the opposing-candle series
  (the T-spot) as the level the stop sits beyond.
- This placement logic is specific to a model built on changes in the state of delivery and
  order blocks; users of other PD arrays must define their own invalidation.
- 'Option A: stop beyond the extreme of the single candle that created the fair value gap
  or order block being entered.'
- 'Option B: stop beyond the short-term high (short) or short-term low (long) that contains
  it.'
- Choose between them by risk tolerance for the play and by what sits beyond the level (imbalances
  above/below push toward Option B).
- Where a nearby lower low has a chance of being run, take the wider placement - 'safer to
  risk there'.
- The stop always sits on a protected low (bullish case) or protected high.
- 'Full invalidation: stop at the extreme of the protected swing.'
- 'Body invalidation: stop at the bodies of the opposing candles that make the protected swing.'
- Body invalidation reduces stop size and brings 2R closer; full invalidation protects against
  being stopped without invalidation.
- stop_swing := beyond the swing high/low that the setup swept or formed.
- stop_zone := beyond the far edge of the order block / breaker being entered.
- 'Preference stated in the order block video: use stop_swing and improve R:R by moving the
  entry (mean threshold, fair value gap edge).'
- The breaker video leaves the choice to the user and demonstrates one case where stop_swing
  would have missed the target and then been hit, and another where stop_zone produced a much
  better R:R.
- In the CISD entry model the stop is specifically the manipulation extreme.
- Minimum acceptable risk-to-reward across the unit is 2R; entries are refined until that
  is met.
- 'Ben: do not place the stop on a swing that has just been raided by the move producing the
  entry - use the next one behind it.'
- 'Ben: the swing where the move ORIGINATED is a valid stop reference even when a more conservative
  swing exists further away; the trade-off is raid probability against stop size.'
- 'Ben: a large wick beyond a swing is treated as a deviation from the range - liquidity grabbed
  and returned - and not as a reason to move the stop out.'
- 'Finessee_Fx: the stop is always beyond the order block used for entry, never inside it.'
- 'Finessee_Fx: violation of that order block is simultaneously the stop-out and the signal
  to change the directional bias.'
- 'Default: place the stop at the protected swing with no additional buffer.'
- Treat a trade through the protected swing as invalidation, not as noise to be absorbed.
- 'Exception (advanced entry off a candle 2 / candle 3 closure): the stop may be placed relative
  to 50% of the swing, positioned below that level rather than on it.'
- If the stop cannot be placed in a location that makes the target's risk-to-reward work,
  do not take the trade — refine or move up a timeframe.
- Place the stop beyond a long-term high or low where available.
- Intermediate-term highs and lows are the acceptable second choice.
- Do not place the stop beyond a short-term high or low.
- Place the stop at the short-term low below the entry (short-term high above it for a short).
- 'Alternative: the extreme of the candle that created the fair value gap being entered.'
- Choose between them by whether an order block sits between entry and stop that price is
  likely to run into.
invalidation:
- Price trades through the protected swing -- the trade idea, not just the trade, is over.
- Price trades beyond the chosen level.
- n/a
- Not applicable.
- Not applicable — this is a placement rule.
- Price closes beyond the chosen level.
measurable:
- stop-out rate at swing stops vs body stops
- frequency of the sweep-then-target sequence that body stops expose
- R improvement from retest entries vs market entries
- stop-out rate of the candle stop vs the short-term-swing stop on the same entries
- R difference between the two placements
- frequency of stop-outs at the body level that would not have hit the full-invalidation level
- realised R distribution under each stop convention on the same trade set
- share of winning trades whose adverse excursion would have hit stop_zone but not stop_swing
- expectancy of the same signal set under each stop rule
- stop-out rate on raided versus un-raided swing references for the same entries
- R difference between the aggressive and conservative swing choice on the same setup
- how often a violated order block is followed by a genuine trend change, which is what Finessee_Fx's
  bias flip assumes
- rate of stop-outs that would have been avoided by a buffer, versus the R cost of that buffer
- R distribution of protected-swing stops versus 50%-of-swing stops
- stop-out rate by swing class
- average adverse excursion beyond short-term vs intermediate-term swings
- stop-out rate at the short-term swing vs at the gap-forming candle for the same entries
- share of stop-outs that occurred at an intervening order block
