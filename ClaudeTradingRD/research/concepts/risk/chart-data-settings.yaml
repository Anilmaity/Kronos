preconditions:
- A continuous futures chart with a contract roll in the visible history.
- Trading continuous futures contracts.
- A futures chart with a choice of session template, roll adjustment and contract size.
detection_rules:
- 'Back-adjust / adjust for contract changes: ON.'
- 'Settlement: OFF.'
- 'Electronic trading (full session): ON.'
- 'Chart timezone: New York local time.'
- With back-adjust off, rollovers appear as stitched-together segments with visible breaks.
- Toggling settlement changes daily candles enough to change the daily bias on some days.
- Real-time data requires a paid feed subscription; without it the series is delayed about
  15 minutes.
- 'Back-adjust: ON.'
- A large unexplained daily gap indicates back-adjustment is off and a contract rollover occurred.
- Use the full-session (ETH) series, not RTH — overnight price action is an input to the model.
- Back-adjust on contract rollover so the roll leaves no artificial gap.
- When micro and mini contracts disagree on a level (e.g. a high taken on MES but not ES),
  read the mini.
- 'Data source: CME feed (via Ninja Trader); charts on the mini contracts.'
- Turn back-adjustment on for continuous futures charts.
- Cross-check a disputed high or low against the cash index and the tracking ETF; the futures
  chart should not show a level taken that the index and ETF have not taken.
- Settlement-price handling on the platform must be correct or its charts are not used.
invalidation:
- Not applicable - data configuration.
- n/a
- Not applicable — this is a data configuration.
- Not applicable - a data setting.
measurable:
- count of daily candles whose classification changes between settlement on and off over a
  year
- count of level breaks that disagree between adjusted and unadjusted series
- Difference in detected C2 closures and level hits between back-adjusted and raw continuous
  series.
- Difference in daily close classification with settlement on vs off.
- difference in detected sweeps and gaps between RTH and ETH series
- count of level disagreements between micro and mini series per month
- effect of back-adjustment on levels that survive a roll
- level differences between a settlement-on and settlement-off series at the daily open
- count of level breaks that disagree between adjusted and unadjusted futures series
