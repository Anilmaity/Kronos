id: chart-data-settings
name: Chart Data Settings (back-adjust on, settlement off)
definition: 'The same two futures data settings, demonstrated on screen in this unit with
  the reason for each. Back-adjust (adjusting for contract changes) is ON: with it off, the
  rollover shows as a visible break where the two contracts are simply stitched together;
  with it on the series is combined and made more fluid. Settlement is OFF: he shows the daily
  candles changing materially when it is toggled and points to specific days that would have
  changed his bias, and says it gives him cleaner candles. The TradingView tutorial in the
  same unit repeats the trio as a settings checklist - electronic trading on, adjust for contract
  changes on, settlement off - and adds that the chart is always in New York local time, with
  a solid background, no grid lines, and a real-time data subscription (without which the
  feed is delayed about 15 minutes).'
variants:
  definition:
  - 'Two futures data settings he insists on, both of which change the candles the model reads.
    Back-adjustment is ON, which removes the contract-rollover gap by aligning the new contract
    to the previous day''s close. Settlement is OFF, because he wants the actual close rather
    than the settlement close - he notes daily candles look materially different with settlement
    on. He also warns that quoted price levels will differ between traders who have these
    settings configured differently.

    '
  - 'Three data-feed decisions are stated in this unit, all of which change what a detector
    sees. First, he does not use the RTH (regular-trading-hours) chart: his analysis is built
    on what the overnight session does, so RTH-only data would remove a core component of
    the strategy — the full 24-hour session chart is the working chart. Second, back-adjustment
    on contract rollover is explained in his own words: when one contract rolls to the next
    the two prices differ, and back-adjust shifts the earlier series so there is no gap at
    the roll. Third, when the micros and the minis disagree he trades and reads the minis;
    he notes the divergence between MES/MNQ and ES/NQ highs can produce a different idea,
    and says he focuses on the minis.

    '
  - 'Confirmed again in live Q&A: settlement is turned off, and back-adjust is turned on.
    Data comes from CME via Ninja Trader, at a cost he puts at roughly $4 a month for the
    CME feed. All charting is done on the mini contracts rather than the micros, and on futures
    rather than CFDs, so that the price series is the exact exchange data.'
  - This unit supplies the reason for back-adjusting, not just the setting. Without back-adjustment
    the futures contract can show a prior high as already taken while the index and the ETF
    have not taken it - he checks QQQ and NDX on screen to show both still below. He wants
    the futures chart to agree with the index and the ETF, so he always turns back-adjustment
    on. Separately in the indicator stream he declines to support a platform on the grounds
    that its settlement price has not been fixed.
