ambiguities:
- One sentence in the futures video reads 'I have found that settlement works best for my
  strategy' immediately after he says he has settlement turned OFF; the on-screen demonstration
  and the TradingView video both show it off, so the sentence is treated as a misspeak or
  caption error rather than a second reading.
- The back-adjustment method (difference vs ratio) is still not stated - only that it combines
  the contracts without a gap.
- The exact data-feed product and price are shown on screen but not spoken, so they are not
  recorded.
- The specific back-adjustment method (difference vs ratio) is not stated beyond 'aligns with
  the previous day's close'.
- Settlement-price display is not mentioned in this unit; that half of the concept comes from
  elsewhere in the corpus.
- He says he does not remember or care about roll dates, so no roll-date rule is given for
  a backtest.
- The micros-versus-minis preference is stated as personal focus, not as a rule, and no guidance
  is given for a trader whose account size forces micros.
- The auto-captioner renders back-adjust as 'Bjust' ('I personally have Bjust turned on');
  it is read here as back-adjust, matching the same setting recorded elsewhere in the corpus.
- The roll rule that back-adjustment is applied to is not stated.
- The auto-transcript's speaker markers are unreliable across this passage; the reasoning
  is attributed to the host because he is the one navigating to QQQ and NDX on the shared
  screen.
- '''B adjust'' is the auto-caption rendering of back-adjust.'
