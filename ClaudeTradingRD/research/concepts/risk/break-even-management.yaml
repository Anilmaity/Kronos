ambiguities:
- 'CONTESTED WITHIN THIS UNIT: the anti-break-even argument (CPI trade review) and the pro-break-even
  practice (15-second scalp) are both his, in the same playlist. The only stated discriminator
  is that the second is a scalp; no timeframe or R threshold separates the two regimes.'
- '''One scalping'' is the auto-caption''s rendering of ''when scalping''.'
- No rule says when partials themselves should be taken relative to break-even.
- Trader T's rule reads as break-even AT the 2R target, which is also his exit - the transcript
  does not resolve whether the stop moves at some fraction of 2R or whether he is describing
  a partial-and-runner structure.
- He gives no sample or period for the claim that this was backtested.
- Ben does not state the size ratio between his tranches, so the blended break-even price
  is undefined.
- Neither says what happens to the break-even stop if the setup's structure changes afterwards.
- '''Expanded meaningfully'' before the return-to-entry rule applies is not quantified.'
- He notes trailing stops and pyramiding as topics he has deliberately withheld ('it would
  help a few people but hurt the masses'), so the full management scheme is not in this unit.
- Whether the stop is physically moved to entry or the 50% level is just a mental invalidation
  is not stated.
- '''Right here'' is a chart point; the boundary between the two cases is given only as the
  expansion EQ.'
- Which lows count as the trigger is shown on the chart, not stated.
