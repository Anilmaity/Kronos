id: break-even-management
name: Break-Even Management
variants:
  name:
  - Break-Even and Stop Migration Rules
  definition:
  - 'Two guests give conditional break-even rules rather than blanket ones. Trader T''s is
    the more mechanical and is the only rule in this unit he explicitly says he backtested:
    when SMT is present he goes to the 5-minute chart for the entry and moves the stop to
    break even at 2R - i.e. the presence of a divergence changes the management, not just
    the confidence. Ben''s is driven by scaling: because he adds to positions, the first tranche
    is moved to break even (or the stop trailed to where the second tranche''s stop sits,
    typically above his first entry) once the second entry is on. Both treat break-even as
    an event triggered by something observable, not as a reflex after a fixed number of points.

    '
  - 'Two stated management rules. (1) Once a continuation closure creates a protected swing,
    the stop is moved behind that swing. (2) After price has expanded away from entry, a return
    to the entry price is itself evidence the move has failed - go to break-even; the same
    applies on reaching the range low/high of a consolidation, where the position is either
    about to fail or must break through.

    '
  - 'Swing-trade variant: holding a daily short, he states that if the day closes well (a
    candle 2 / candle 3 continuation), price should not come back above 50% of that candle;
    because his entry sits above that 50% level, he is effectively at break-even risk and
    stops caring about the outcome.'
  - Break-even is conditioned on WHERE the entry sits relative to the new protected swing
    / expansion. If the entry was taken down in the reversal (below the EQ of the new expansion
    leg), a return of price to the entry means the expansion phase is over, so break-even
    is acceptable. If the entry was a continuation entry right at the new protected swing
    area, a retest of it is still a valid trade, so going break-even there makes no sense.
  - 'Reviewing a viewer''s 8:30 gold short: if short off a protected swing targeting 2R, go
    break even once price runs down into the intermediate lows, or at least trail - do not
    let it reverse on you after it has swept a low.'
definition: 'THE TWO POSITIONS ARE BOTH IN THIS UNIT AND THEY DISAGREE, split by trade type.
  In the CPI trade review (a 2R intraday position) he argues explicitly AGAINST moving the
  stop to break-even: the trade is not invalidated at break-even, it is invalidated at the
  intermediate-term high, and he shows the exact drawdown that would have stopped a break-even
  trader out immediately before the target was hit. In the 15-second scalp example he does
  the opposite - takes the first partial and moves the stop to break-even, qualifying it as
  what he does WHEN SCALPING - and is then stopped out at break-even on the trade shown. The
  reconciling principle he states is that risk is accepted at the structural invalidation
  level, not at the entry price.'
category: risk
status: contested
aliases:
- move your stops to break even
- not invalidated at break even
- break even at 2R when SMT is present
- trail to the second entry
- move to break even
- stop to protected swing
preconditions:
- A position is open with a structural invalidation level identified.
- 'Trader T: SMT is present on the setup.'
- 'Ben: a second tranche has been added to the position.'
- An open position with a defined structural stop.
- Open position with an interim liquidity pool (lows) between entry and target.
detection_rules:
- Identify the structural invalidation (the intermediate-term high / the protected extreme).
- 'Swing / intraday positions: leave the stop at the structural invalidation; do NOT move
  it to break-even on favourable movement.'
- 'Scalps: take the first partial, then move the stop to break-even.'
- 'The test he applies: ask where the trade is actually invalidated, not where it is currently
  comfortable.'
- 'Trader T: if SMT is present, take the entry on the 5-minute and set the stop to break even
  once 2R is reached.'
- Trader T states this specific pairing as backtested, while noting it will differ by situation.
- 'Ben: once a second entry is on, move the first position''s stop to break even, or trail
  it to where the second position''s stop sits.'
- 'Ben: consequently a break-even exit is neither a win nor a loss in his statistics (see
  realistic-r-expectations).'
- On the continuation closure, relocate the stop behind the newly protected swing.
- If price has expanded meaningfully and then returns to the entry price, move to break-even.
- On arrival at a consolidation boundary that must be broken, move to break-even.
- After a favourable daily closure, mark 50% of the closed candle.
- If the entry lies beyond that 50% level (above it for a short), the trade can be treated
  as break-even protected.
- After a new protected swing and expansion, mark the EQ of the expansion leg.
- 'Entry below that EQ (in the reversal): moving the stop to break-even is acceptable - price
  returning there would invalidate the expansion.'
- 'Entry at/near the protected swing level itself: do not move to break-even; a return there
  is still valid.'
- Expect price to hold above the expansion EQ if it is going to continue.
- Move the stop to break even (or start trailing) once price reaches the intermediate lows
  on the way to target.
invalidation:
- Price reaches the structural invalidation level.
- Not applicable.
- n/a
measurable:
- P&L difference between break-even management and structural stops over a sample of the same
  setups
- frequency of trades that touch break-even before reaching the target
- whether the scalp/non-scalp split survives testing
- expectancy with and without the SMT-conditioned break-even move, on the same trade list
- how often the break-even stop is hit and price then reaches the original target anyway
- the cost of Ben's scale-in break-even rule versus holding the full first tranche
- R lost to premature break-even stops vs R saved.
- Frequency of a return-to-entry after expansion resolving as reversal vs continuation.
- stop-outs avoided vs profit forgone by entry-location-conditioned break-even
- R distribution with BE-at-interim-liquidity vs fixed stop
