id: less-trades-more-capital
name: Fewer Trades, More Capital
definition: 'Both futures-side speakers in this unit report that profitability improved as
  trade frequency fell, and both convert this into an explicit frequency budget: zero to three
  trades per week, with the week ended after two winners. The stated mechanism is that a low
  budget forces selection - if only a handful of trades are available, only A+ setups get
  taken - and that time spent watching charts increases the probability of taking a poor setup.
  Both are careful to frame the number as personal rather than universal.

  '
category: risk
status: specified
aliases:
- the goal is not more trades
- 0 to 3 trades a week
preconditions:
- A defined model with enumerated A+ conditions already exists.
detection_rules:
- Cap trades at 0-3 per week.
- After two winning trades in a week, stop trading for that week.
- If the pre-marked point of interest is not tagged, no trade is taken that session.
invalidation:
- Not applicable - this is a risk/process rule.
measurable:
- trades per week vs weekly P&L over a sample
- expectancy of trades 1-3 in a week vs trades 4+
sources:
- video_id: G44VpidBD_U
  title: NickDoesFutures | Unicorn Model & Experiences With ICT
  quote: the goal is not more trades it's more Capital with less trades
- video_id: nncJGt6j19Q
  title: Gene | Align Yourself For High Probability Trades
ambiguities:
- Both speakers explicitly say the frequency that worked for them may not transfer; the number
  is doctrine, not an edge claim.
- Neither states a per-trade risk percentage.
