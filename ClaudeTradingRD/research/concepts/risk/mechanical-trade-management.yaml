id: mechanical-trade-management
name: Mechanical Management - Validation Or Invalidation Only
definition: 'Asked whether a strict take profit and stop loss beats going break even, TTrades
  says traders early on should run a strict take profit and stop loss and not manage the position,
  because management adds extra decisions, thoughts and stress and beginners "mess up the
  management". His evidence is one viewer scenario: with no management at all, taking only
  +2R or -1R, the viewer would have been up an extra 6R. Managing the position is something
  to work on later.

  '
variants:
  definition:
  - 'A management doctrine in which the only two outcomes permitted after entry are the stop
    and the target. Entry, stop and take-profit are all set as resting limit orders at the
    moment of entry and are never adjusted. Break-even moves, trailing stops and partial profit-taking
    are all refused, on the stated grounds that they convert a correct idea into a break-even
    outcome. Other speakers in this unit manage actively, so this is recorded as contested.

    '
  - 'TTrades'' own position: early traders should use a strict take profit and stop-loss and
    not manage, because management adds decisions and stress. He cites a tweet: a viewer who
    over-managed would have been up an extra 6R by only taking 2R or -1R. Management can come
    later. He teaches 2R because it helps people with stats, though he holds higher R himself.'
  - 'TTrades'' own statement scoped to overnight / Asia entries: he enters, goes to bed, and
    lets the stop or take-profit resolve it; he does not like to over-manage positions, especially
    overnight.'
category: risk
status: contested
aliases:
- no break even
- no trailing
- fixed 2R
- strict take profit and stop-loss
preconditions:
- A trader early in development whose entry, stop and target are set at entry.
- A model whose entry, stop and target are all defined before entry.
detection_rules:
- 'Beginner default: the trade ends only at the fixed take profit (+2R in the scenario) or
  the stop (-1R).'
- No break-even move or other management between entry and those two outcomes.
- Position management is deferred to a later stage of development.
- 'Ash''s rule: set a limit entry at the beginning of the breaker, a limit stop on the other
  side of the breaker, and a limit take-profit at 2R. Then do nothing.'
- 'Ash''s rule: do not move to break even, do not trail, do not trim - the position either
  validates or invalidates.'
- 'Ash''s supporting case: he shows a trade that pulled back close to entry and would have
  stopped a trailed position at break even, then ran to 2R.'
- 'AP''s contrary practice: he exits at the shallow levels, then looks for continuation re-entries
  once de-risked, and explicitly says trailing and managing positions matter.'
- 'DTR''s contrary practice: he takes the nearest ''low hanging fruit'' target for 2 to 2.5R
  but notes he could have trimmed and trailed for more, and describes a four-hour trade held
  through drawdown with a second tag-in.'
- 'Beginner default: fixed 2R target / -1R stop, no management.'
- 'Overnight entries: no break-even, trailing or manual exit; SL or TP only.'
invalidation:
- Not applicable - a management doctrine.
- Not applicable - this is a management doctrine.
measurable:
- expectancy of the same entries held to fixed +2R / -1R vs managed with a break-even move
- expectancy of the same entry set managed three ways - fixed 2R, break-even-then-run, and
  trail
- proportion of trades that would have been stopped at break even before reaching 2R
- R lost to trimming versus R gained by avoiding full stop-outs
