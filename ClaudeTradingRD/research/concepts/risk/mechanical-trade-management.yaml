ambiguities:
- Contested across three speakers with no shared test - the disagreement is doctrinal, and
  none of them cites data.
- Ash gives no exception for a 2R target sitting beyond an obvious obstacle.
- AP and DTR describe management by feel without stating trailing rules, so their side of
  the conflict cannot be backtested as specified.
- Restricted to 'early on'; his own management rules are not given.
- In the same video he notes a new continuation 'we could potentially trail' - so the no-management
  rule is scoped to overnight, not universal.
