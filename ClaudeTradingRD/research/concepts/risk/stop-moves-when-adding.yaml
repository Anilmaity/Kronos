id: stop-moves-when-adding
name: If You Add To A Position, The Stop Moves
definition: 'Ben scales into positions, and states the consequence as a rule rather than a
  choice: once a second tranche is on, the first tranche''s stop is moved - either to break
  even, or trailed up to where the second tranche''s stop sits, which is typically above his
  first entry. He raises it while explaining why his win rate and his strike rate differ:
  the rule manufactures break-even exits, and break-evens are neither wins nor losses in his
  accounting.

  '
variants:
  definition:
  - 'The guest''s rule on scaling in: adding to a position without moving the stop means carrying
    more risk than was originally put on, which is against his plan, so any add is accompanied
    by a stop move.'
category: risk
status: contested
aliases:
- scaling in
- first position to break even
preconditions:
- A first tranche is open and in profit enough for a second entry to be placed behind it.
- An open position and a decision to add to it.
detection_rules:
- On adding a second tranche, move the first tranche's stop to break even, or trail it to
  the second tranche's stop level.
- The second tranche's stop is typically above the first entry, so the trailed stop is at
  worst break even and often better.
- Count the resulting break-even exits separately from wins and losses.
- On any add, move the stop so that total open risk does not exceed the risk taken at initial
  entry.
- Adding without moving the stop is a plan violation, not a discretionary choice.
invalidation:
- Not applicable.
- Not applicable - a risk policy.
measurable:
- frequency of break-even exits produced by the rule
- expectancy of the scaled position versus a single full-size entry on the same signals
- maximum open risk per trade vs initial risk on adds
sources:
- video_id: yRmKkR4CojU
  title: Fractalizing Entries -Q&A with Ben - ICT Concepts
  quote: if i'm scaling into a position my first position is coming to break even
- video_id: tDiwwMRWF2k
  title: New York Open Live Q&A with NickDoesFutures
  quote: if I add to my position, yeah, I'm moving my stop loss
ambiguities:
- The size ratio between tranches is never given, so the blended entry and the true break-even
  price are undefined.
- What triggers the second entry is not stated in this passage - only what happens to the
  stop once it exists.
- He describes himself as 'relatively aggressive with my stop after', which is looser than
  the two options he then names.
- Where the stop is moved to is not specified - only that it moves.
- No rule is given for when adding is warranted in the first place.
