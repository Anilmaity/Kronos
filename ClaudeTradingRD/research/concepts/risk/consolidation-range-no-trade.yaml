id: consolidation-range-no-trade
name: No Interest While Consolidating
definition: 'Once an instrument is classified as consolidating, he stops looking at it entirely
  until one side of the range is taken - explicitly for as long as that takes, up to months.
  The reason given is that the energy spent trading inside the range is the same energy that
  gets people chopped up and then absent for the eventual move. This applies at the instrument
  level, not to individual setups.

  '
variants:
  definition:
  - Applied live to gold across both videos of this unit. Gold is in a consolidation, so it
    is not watched that day at all - he says he will simply not trade it and that viewers
    may do as they like. The generalisation he states is a preference for a trending market
    over a consolidating one. The disqualifying signature named here is small days with small
    bodies; the re-entry condition is that the range boundary be taken (in the gold case,
    the range high) before it becomes interesting again.
category: risk
status: contested
aliases:
- stand aside in a range
- wait for one side of the range
preconditions:
- The phase after an expansion has been classified as consolidation (price failed to close
  over the series of opposing candles and fell back inside the range).
- The instrument is inside a defined range.
detection_rules:
- Mark the range high and low. Those are the only levels that matter.
- Take no position, and form no opinion on direction, until one side is taken.
- The same applies when the daily chart is simply not obvious - a non-obvious daily generally
  means consolidation, and dropping to a lower timeframe makes it worse.
- Bitcoin and gold are both used as worked examples of instruments he simply stopped watching.
- An instrument printing small days and small bodies inside a range is not traded and not
  monitored.
- It becomes interesting again only once the range boundary is taken out.
- Prefer a trending instrument over a consolidating one when choosing what to watch.
invalidation:
- One side of the range is taken - the instrument becomes tradeable again.
- The range extreme is taken and a new phase of price begins.
measurable:
- proportion of calendar days per instrument classified as consolidation
- P&L of trades taken inside consolidation ranges vs outside them
- duration distribution of consolidation ranges
- P&L of trades taken inside identified consolidations vs outside them
- expansion range after the boundary is taken
