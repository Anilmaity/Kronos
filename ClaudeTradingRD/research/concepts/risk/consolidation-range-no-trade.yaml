ambiguities:
- Sits in tension with range-edge-trading, where he does describe trading range edges back
  into the range. He does not state when a range is worth trading the edges of and when it
  should simply be ignored.
- '''One side of the range is taken'' - whether a wick counts or a close is required is not
  stated.'
- '''Small days, small bodies'' is not quantified.'
- The range itself is drawn by eye; no rule defines its boundaries.
