id: options-expiry-3x-rule
name: Options Expiry = 3x The Expected Time To Target
definition: 'Asked for advice for someone starting with options, he names the failure mode
  - buying short-dated options and losing to theta decay - and gives one numeric rule against
  it. Estimate how long the idea should take to reach its target, then buy expiry at three
  times that horizon: a week becomes three weeks or a month, a month becomes three, four or
  five months. He uses options for swing exposure rather than intraday (QQQ options for swings,
  QQQM shares for the longer-term hold because of lower fees).

  '
category: risk
status: specified
aliases:
- 3x the time
- theta decay
preconditions:
- A directional idea with an estimated time-to-target.
detection_rules:
- Estimate the time for price to reach the target.
- Select an expiry at least three times that estimate.
- Do not buy short-dated options against a multi-week idea.
invalidation:
- Not applicable - a sizing / instrument rule.
measurable:
- realised time-to-target distribution vs the 3x expiry assumption
- P&L attribution split between direction and time decay
sources:
- video_id: eIPM-D8RrSQ
  title: New York Open Live Q&A
  quote: I usually buy three weeks out or a month out
ambiguities:
- No method is given for estimating the time-to-target in the first place.
- Nothing is said about strike selection, delta or position sizing.
