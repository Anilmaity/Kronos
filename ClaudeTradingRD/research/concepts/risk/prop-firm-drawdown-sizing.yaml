preconditions:
- The account is a prop / evaluation account with a maximum drawdown much smaller than its
  nominal balance.
- An account with a defined maximum drawdown.
- A stop distance implied by the setup (protected swing) before size is chosen.
- An evaluation account with a stated drawdown and profit target.
- A prop account with a stated maximum drawdown.
detection_rules:
- Size from the DRAWDOWN, not from the nominal balance - the drawdown is the real account.
- 'Funded account: 0.5 percent of nominal per trade (Trader T), chosen because 1 percent leaves
  only about ten losing trades of headroom.'
- 'Challenge / evaluation: risk may be raised to about 1 percent to pass, and he does push
  it when the account is only slightly in profit late in the period.'
- Do not push risk once already above the extension threshold (he cites 5 percent) - the extension
  makes the gamble unnecessary.
- 'Expected return on a funded account at 0.5 percent risk: about 3-7 percent per month.'
- Express risk per trade as a percentage of the account drawdown, not of equity.
- 'Aggressive (optimising for speed over cost): ~20% of drawdown, up to 50%.'
- 'Middle: ~7-10% of drawdown; expect ~10 trades to blow up, ~5-10 winners to pass.'
- 'Conservative (optimising for cost over speed): ~5% of drawdown or below.'
- 'Sanity check the conservative end: sizing should absorb ~10 consecutive losers without
  breaching drawdown.'
- 'On a live account: fix the dollar risk first, then compute contract size from the stop
  distance.'
- effective_capital := max_drawdown, NOT the nominal account size.
- required_return := profit_target / max_drawdown (his example is roughly 150%).
- Compare offers on required_return and on total cost = evaluation fee + activation fee.
- If several failed attempts are likely, weight the evaluation fee more heavily than the activation
  fee.
- effective_capital := max_drawdown (NOT the nominal account size).
- risk_per_trade := 7% to 10% of effective_capital during an evaluation.
- 'Sanity check: consecutive_losses_to_failure = effective_capital / risk_per_trade, target
  10-15.'
- 'Worked example: a $25k account with $1,500 drawdown; risking 1% of $25,000 = ~1.7% of the
  drawdown, and six or seven losses blow it.'
- After funding, reduce risk below the evaluation level.
invalidation:
- Not applicable.
- Not applicable — this is a sizing policy.
- Any sizing or comparison derived from the nominal account balance.
- Any sizing derived from the nominal account balance rather than the drawdown.
measurable:
- risk per trade expressed as a fraction of the DRAWDOWN rather than of the balance
- probability of ruin at 0.5 percent versus 1 percent of nominal given the firm's drawdown
  cap and the measured win rate
- pass rate of challenges run at 1 percent versus 0.5 percent
- probability of breaching drawdown at each tier given a measured win rate and R
- expected cost and expected time to pass at each tier
- realised maximum consecutive-loss run versus the 10-loser assumption
- expected total cost to reach a payout at each firm given a measured win rate and R
- probability of achieving required_return before breaching max_drawdown
- simulated probability of hitting the drawdown limit at 7% vs 10% vs 1%-of-nominal, given
  a strategy's win rate and R
- expected number of trades to pass an evaluation at each risk level
