id: prop-firm-drawdown-sizing
name: Prop Firm Sizing Off The Drawdown
definition: 'The one place in this unit where TTrades states a risk principle in his own words,
  and the guest had just stated its arithmetic counterpart. Trader T''s version: on a prop
  account you only have the drawdown to play with, so hitting the profit target is effectively
  doubling the money you actually control. TTrades'' version, offered immediately after and
  in his own framing: a 25,000 dollar account with a 1,500 dollar drawdown is treated by most
  people as a 25,000 dollar account when in reality it is a 1,500 dollar account. Trader T''s
  implementation follows from it - he risks 0.5 percent per trade on funded accounts (having
  previously used 1 percent and found it too aggressive when only 10 percent of the balance
  is available), averages roughly 3-7 percent a month on them, and deliberately pushes risk
  up to about 1 percent during a challenge to get it passed. He was funded with 400k at FTMO
  plus 300k at a second firm, about 700k total.

  '
variants:
  definition:
  - 'The only place in this unit where risk per trade is given as a number. He frames evaluation
    sizing as a money-versus-time trade-off and gives three tiers as a percentage of the account''s
    *drawdown* (not of equity): aggressive, where you do not mind spending money to pass fast,
    is roughly 20% and may go to 50%; the middle ground is about 7-10% (he first says "five
    to seven" then corrects to "maybe seven to 10"); conservative is about 5% or below. Worked
    on his own example of a $1,500 drawdown account, that is roughly $750 aggressive, $150
    middle, $75 conservative. The stated design constraint behind the conservative end is
    that sizing should survive about 10 losers in a row without hitting the drawdown, and
    the middle tier is described as taking about 10 trades to blow up and about 5-10 winners
    to pass. Separately, on a live account the sizing procedure is stated generically: decide
    the dollars you are willing to risk, then derive contract size from your stop distance.

    '
  - 'The same principle stated from the purchasing side rather than the sizing side: the headline
    account size is not what you are buying. A ''50k'' evaluation whose drawdown is a couple
    of thousand dollars is really an account of that couple of thousand, and the number that
    actually matters when comparing offers is the drawdown-to-profit-target ratio - a $3,000
    profit target against roughly $2,000 of drawdown means the trader must make about 150%
    on the capital genuinely at risk. He applies the same lens to cost, totalling evaluation
    fee plus activation fee per firm and noting that a cheaper evaluation is the better buy
    for anyone likely to fail several attempts.'
  - 'On a funded/evaluation account the nominal account size is not the capital at risk —
    the drawdown allowance is. Sizing off the headline number therefore massively understates
    real risk (1% of a $25,000 account is roughly 1.7% of a $1,500 drawdown). The rule given
    is to compute risk as a percentage of the DRAWDOWN amount, targeting 7-10% per trade,
    which leaves roughly 10-15 consecutive losses of runway. Once funded, risk is reduced
    further to build a cushion. The same logic with different numbers applies to forex prop
    firms.

    '
category: risk
status: contested
