ambiguities:
- The 25,000 / 1,500 framing is TTrades' own statement; the '10 percent to play with' arithmetic
  immediately preceding it is Trader T's. They converge on air, but the transcript has no
  speaker labels, so the exact turn boundary is inferred from context - TTrades introduces
  the point with 'I was just gonna say to go along with accounts'.
- Raising risk during a challenge is stated as personal practice and is in tension with the
  same speaker's own drawdown-is-the-account logic; the tension is not addressed.
- The percentages are of nominal balance, not of drawdown, so the sizing rule and the framing
  principle are stated in different units.
- The second firm is named only in garbled caption form ('my 4x1'), so only the FTMO 400k
  figure is reliably attributable.
- The tiers are drawn on a whiteboard-style curve as illustration, not stated as prescriptions;
  he says explicitly 'it's not oh you need to risk this amount'.
- He self-corrects the middle tier mid-sentence (five-to-seven then seven-to-ten), so the
  middle band is soft.
- The 10-losers-in-a-row constraint is asserted, not derived from a stated win rate.
- No equivalent percentage is ever given for a personal (non-prop) account.
- The dollar figures are garbled by the auto-captioner ('$2,000 000 draw down', 'it's really
  a $22,000 account'); the ratio argument survives but the exact drawdown figure for the 50k
  tier is not reliably recoverable from the transcript. The $3,000 profit target and the 150%
  figure are stated clearly.
- The firm-by-firm fee table is on screen only; the spoken figures ($95, ~$177, $49 + $149
  ~ $200) are partial and date-specific.
- No risk-per-trade percentage is given in this video - that comes from other units under
  this id.
- The post-funding risk reduction is not quantified.
- Trailing versus static drawdown (a major difference between prop firms) is not addressed.
- Daily loss limits, which usually bind before the total drawdown, are not mentioned.
- The 7-10% band is asserted from the losses-in-a-row arithmetic only; no expectancy or ruin-probability
  calculation is shown.
