preconditions:
- The trader has a known tendency toward tilt, revenge trading or oversizing.
- A trader with a repeating behavioural failure (tilt, revenge trading, oversizing, over-managing).
- A trader with a recurring blow-up pattern, or simply as a default discipline.
- None stated.
- A diagnosed pattern of revenge trading or of being unable to stop after a loss.
- None.
detection_rules:
- Cap the session at one trade.
- If impulsive re-entry is the problem, raise the entry timeframe so that each setup takes
  about an hour to resolve.
- When the day's opportunity has been taken or has passed, stop looking rather than searching
  for a replacement.
- Hard cap of one trade per day, regardless of what else appears.
- 'Fixed outcomes: exit at 2R or -1R; do not manage the position in between.'
- Size to the drawdown, not to the profit target.
- Follow the model's rules without discretion.
- Run it for a month before judging it.
- At most one trade per session; after it closes, stop for the day regardless of result.
- It is a ceiling, not a minimum - a day with no qualifying setup produces no trade.
- Pair it with a fixed position size across trades.
- Pair it with a pre-set maximum daily loss.
- Cap at one trade per trading day.
- 'Expected weekly worst case: five losses.'
- At 2R per winner, two and a half winners recover a five-loss week.
- 'His own baseline frequency: zero to four trades per week.'
- 'Related process fix for over-trading on the lower timeframe: do not open the lower timeframe
  until an HTF reason exists.'
- 'Stated target frequency in this unit: two to three trades per day.'
- He identifies the 15-second execution timeframe as the specific cause of taking far more
  than that.
- No daily loss cap is stated by him here (the two-loss cap in this unit comes from the guests,
  not from him).
- Hard cap of one trade per day.
- Apply it together with a corrected position size, not instead of one.
- 'Treat inability to keep the cap as the decision point: change the behaviour or stop trading.'
- Cap participation at one trade per day.
invalidation:
- n/a - a discipline rule.
- Not applicable - a behavioural constraint.
- Not applicable - this is a frequency policy, not a setup.
- Not applicable — this is a hard limit.
- Not applicable - a risk policy.
measurable:
- expectancy of trade 1 versus trade 2+ per session
- change in impulsive-entry frequency after moving from 1-minute to 15-minute entries
- trades per day distribution before and after the cap
- expectancy of the first trade of the day vs subsequent trades
- drawdown depth with and without the cap
- how many trades a detector would take per day vs the cap
- expectancy of the first signal of the day vs later signals
- 'loss-day clustering: proportion of monthly drawdown attributable to single days with more
  than one trade'
- expectancy per trade at 1 trade/day vs unrestricted
- trade count per day by execution timeframe - the empirical form of his own 15-second observation
- expectancy of trades 1-3 of the day versus trades 4+
- P&L of the first trade of each day versus all subsequent trades
- frequency of cap breaches and their aggregate R
- P&L per day capped at one trade vs uncapped, same signal set
