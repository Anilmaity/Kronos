id: max-one-trade-per-day
name: One Trade Per Day Cap
definition: 'Asked why the cap is one trade per day rather than two, he gives the reasoning
  rather than a new rule: most people who struggle with tilt, revenge trading or oversizing
  will break every rule they have if given a second trade, and every trade taken is another
  exposure to the market and to your own weaknesses - two trades are two opportunities to
  go on tilt. He pairs it with a related fix he has used on students: move them from 1-minute
  entries to 15-minute entries, because a 15-minute setup takes an hour to resolve and by
  then they are no longer in the state that produced the next impulsive trade. His own behaviour
  in these streams matches it - once the day''s move is taken or missed he stops looking,
  and he does not sit at the screen hunting for a second setup.

  '
variants:
  definition:
  - 'He prescribes the same four-line plan to two different struggling viewers in two different
    streams, and calls it by name in his mentorship. The diagnosis is fixed: the root causes
    are tilt, oversizing, revenge trading, over-managing and not following the model. The
    prescription is mechanical rather than motivational - limit to one trade a day, take 2R
    or -1R with no management in between, size properly, follow the model. His argument is
    structural: you cannot revenge trade if you are only allowed one trade. He cites a mentorship
    student twenty days into following it as evidence. His own frequency is consistent with
    the cap - one to two ideas a day, a couple of trades a week at most, and not a trade every
    day.

    '
  - 'Prescribed repeatedly as the structural fix for tilt, revenge trading and blown accounts:
    cap exposure at one trade per day, because a trader who blows up after his first loss
    cannot do so if there is no second trade. He rejects the counter-proposal of a two-trade
    cap on the grounds that it just doubles the chance to blow up. The cap is a maximum, explicitly
    not a quota - most days produce no trade at all. It is paired with a constant position
    size and, separately, with a hard daily max loss.'
  - 'His standard prescription when a trader reports good weeks ruined by one bad week. His
    diagnosis is that the problem is almost always a single tilt day rather than a bad week,
    and a hard cap of one trade per day bounds both. The arithmetic he gives: one trade a
    day means at most five losses in a week, which two and a half 2R winners cover. His own
    normal frequency is separately stated as zero to four trades a week.

    '
  - 'TTrades'' own trade-frequency statement in this 2022 stream, recorded because it conflicts
    with the one-trade-per-day / one-to-two-per-week doctrine the channel states elsewhere.
    Asked how many trades he takes a day, he answers two to three, and volunteers that on
    the 15-second chart he sometimes overtrades badly (''I get over overkill... and I''ll
    take like a lot''). He is a year into trading at the time of this recording. No cap, no
    session limit and no gating condition is attached to the number.

    '
  - 'Prescribed here not as a general policy but as the specific remedy for a trader who says
    he cannot end the day after a loss and must trade back to green. The cap is stated flatly
    — one trade a day max — and he attaches a consequence: if you cannot follow a rule this
    simple you either need to change or you need to quit, because you will not make it. It
    is paired in the same breath with correcting position size, because the underlying failure
    (revenge trading) is described as normally travelling with overleveraging.

    '
  - 'Asked how to control overtrading, the answer given in this unit is a hard cap: limit
    yourself to one trade a day. Stated flatly with no conditions attached.'
