ambiguities:
- The cap is justified psychologically, never with expectancy data.
- It is prescribed for people who struggle with tilt; whether he holds himself to exactly
  one is never stated, though he describes being done after one move.
- No rule for a day where the single trade is stopped out early.
- The cap is prescribed as a remediation for a diagnosed behavioural problem, not stated as
  a rule of the model itself.
- Whether the one trade is per instrument or per day across all instruments is not stated.
- '''Size properly'' is left undefined in this unit beyond being derived from the drawdown.'
- '''Day'' is not defined against the futures session boundary - whether the overnight session
  belongs to the previous or next day is not addressed.'
- Whether a swing position already open counts against the cap is not stated; in practice
  he holds swings while declining intraday trades for a different reason (see hedge-not-double-exposure).
- The cap is offered as advice to viewers; he does not state that he personally applies a
  one-per-day cap, only that his frequency is 0-4 per week.
- Whether scaling out or re-entering the same idea counts as a second trade is not addressed.
- This is an early (August 2022) statement made about a year into his own trading; it is recorded
  as spoken and is not reconciled here with the channel's later, much lower frequency doctrine.
- '''Two to three'' is stated as an intention (''I''m trying to take''), not as an enforced
  cap.'
- Whether the count is per instrument or across all instruments is not stated.
- Whether the cap is meant permanently or only until the behaviour is corrected is not stated.
- He himself takes more than one idea per session in these streams, so the cap is clearly
  remedial rather than universal.
- Scaling into or out of a single idea is not addressed by the cap.
- Whether the cap counts a stopped-out trade as the day's trade is not addressed.
- Stated as advice to a viewer struggling with overtrading, not as his own standing rule;
  his own stated frequency in the same stream is roughly one to two trades a week.
