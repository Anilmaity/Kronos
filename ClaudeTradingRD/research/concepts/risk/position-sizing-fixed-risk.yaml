ambiguities:
- Four percent of the drawdown is conceded to be more than would normally be risked, and is
  justified only by a thirty-day deadline.
- Commissions and slippage are excluded from every figure.
- The $145 deviation shows the regime is manually enforced rather than platform-enforced.
- The account was an evaluation, so the reported outcome is not a live-funded result.
- $300 is used as the worked example, not stated as his risk-per-trade policy; no percentage
  of account is given anywhere in the clip.
- The rounding is acknowledged ("we can't get any closer to 300 there") but no rule says whether
  to round up or down.
- This is a TradingView / NinjaTrader tooling demonstration; nothing in it says the sizing
  rule applies to any other venue.
- Neither speaker says whether the percentage is of starting balance, current balance or current
  equity.
- Both guests explicitly refuse to give the audience a number to use ('I'm not an advisor'),
  so 1 percent is stated as personal practice, not as a recommendation.
- Trader T uses a different, lower number for funded accounts - see prop-firm-drawdown-sizing
  - so 1 percent is not his universal figure.
- No percentage-of-account figure is given by either speaker; both explicitly decline to prescribe
  one.
- No rule caps the position size when the chart stop is very tight.
- The percentage of account to risk on a normal (non-prop) account is never stated; examples
  use 1% without endorsing it.
- Commissions, spread and slippage are excluded from every calculation.
- No guidance on concurrent correlated positions or total portfolio heat.
- The auto-transcript garbles several figures ($11,000 for $1,000, '2.81 7' / '2.18' for 2.817
  contracts, '17%' for 1.7%); the arithmetic is reconstructable but the raw numbers are unreliable.
