ambiguities:
- '''How much range is left'' is judged by eye against the average daily range; no calculation
  is given.'
- '''High RR'' - the point at which aggressive trailing becomes appropriate - is not quantified
  (examples show 4-5R already banked).'
- Whether to move to break-even when no protected swing appears there is not addressed.
- 'EVOLUTION: the later canon requires the trail target to be a PROTECTED SWING - a point
  of interest engaged and then closed through - and forbids trailing to an opposing candle
  that never reached a point of interest. This earlier version has no point-of-interest requirement
  at all; any short-term high after a structure break qualifies.'
- The first-partial precondition is stated here and does not appear in the later canon.
- '''Break structure'' is not given a displacement requirement in this video, unlike in the
  market-structure-shift lesson.'
- How large a gap between stop and new extreme justifies partials instead is not stated.
- '''Momentum slowing'' is the trigger for tightening and is purely visual.'
- He allows using a swing that is 'not technically protected' when nothing else is available
  on the timeframe, which weakens the rule.
- How tight the near-target trail should be is given only as an example (the one-minute bar).
- He says whether to break even depends on the framework of the trade without enumerating
  frameworks.
- Whether the stop goes exactly to entry or behind the new swing is not distinguished here
  - he says break even.
