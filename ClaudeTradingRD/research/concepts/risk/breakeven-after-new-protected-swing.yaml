preconditions:
- An open position taken on a valid model.
- A position is open.
- A first partial has been taken.
- Structure has broken in the trade's direction.
- An open position with at least one new protected swing formed since entry.
- A position is open with the original stop beyond the entry protected swing.
- An open position and an original invalidation level.
detection_rules:
- 'A trail target must be a protected swing: point of interest engaged, then closed through.'
- Do not trail to an opposing candle that never reached a point of interest.
- Do not trail above/below 50% of the current higher-timeframe candle's range - the next candle's
  wick is expected there.
- Break-even is permitted when a new protected swing forms at the entry price.
- 'Trail only when meaningful range remains: early entry, distant draw on liquidity, ADR not
  yet spent.'
- Do not trail when the target is about 2R at the ADR, or when no protected swing exists between
  price and the target - take profit at the objective.
- Get more aggressive with trailing only once already at high R.
- A newly formed protected swing that is instantly invalidated is a warning of consolidation
  or reversal, not necessarily of trade failure.
- Do not move the stop until structure breaks in the trade's direction.
- On the break, move the stop to the entry price or to the short-term high/low that is now
  protected by the break.
- Each further structure break creates a new short-term extreme; trail to it.
- Where the drop between the current stop and the new extreme is very large, take partials
  instead of only trailing.
- Tighter trailing is permitted on the 1-minute, but the same gate applies - require a shift
  in structure before every move.
- Where the last structure was never broken, use the short-term high once price starts to
  shift structure against the position.
- Move the stop only when a new protected swing has formed.
- 'Coarse trail: daily swing points.'
- 'Tighter trail: drop a timeframe and use the protected swings there.'
- Tighten when momentum is visibly slowing, not on a fixed R.
- Wait until a new protected swing forms in the trade direction.
- Move the stop to that new swing or to break-even, not before.
- As the target level approaches, trail to the prior lower-timeframe bar.
- If the reversal being traded returns to the reversal point, treat it as invalid and go to
  break-even.
- Wait for a sweep plus a candle 2 closure plus a formed continuation on the execution timeframe.
- That structure is the new invalidation; move to break even against it.
- Do not move the stop merely because price has travelled.
- If the protected swing is later invalidated, stand down rather than re-entering.
invalidation:
- Price returns through the new protected swing.
- The new protected swing is taken out.
measurable:
- realised R with protected-swing trailing vs fixed take-profit, bucketed by ADR already spent
  at entry
- frequency of being stopped out by the following candle's wick when trailing past the 50%
  level
- realised R with structure-gated trailing vs a fixed stop
- count of stop moves per trade
- give-back per trade under structural trailing vs a fixed break-even move
- how often price returns to the trailed protected swing
- difference in realised R between moving to break-even at 1R and moving only after a new
  protected swing
- frequency of break-even stop-outs followed by the target being reached
- break-even stop-out rate when moved on a new protected swing vs on distance
