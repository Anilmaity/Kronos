id: breakeven-after-new-protected-swing
name: Move the Stop Only After a New Protected Swing Forms
definition: 'The complete trailing rule: stops can ONLY be trailed to new protected swings.
  A down-close candle that price merely moved away from is not a protected swing and is not
  a valid trail target - the swing must have engaged a point of interest and then been closed
  through. Break-even is the same rule applied earlier: when a new protected swing happens
  to sit at the entry price, the stop may go there. Two constraints bound it. First, do not
  trail too high inside the current higher-timeframe candle - candle 4 is expected to respect
  50% of candle 3''s range, so a stop above that gets swept by the next candle''s normal wick.
  Second, whether to trail at all is a function of remaining range: trail when entry was early
  in the range with a distant draw on liquidity; do not trail when entering halfway through
  the daily range with 2R sitting at the ADR - take profit at the objective instead.'
variants:
  definition:
  - 'The earliest statement of the trailing rule, in pre-''protected swing'' vocabulary. Two
    conditions gate every stop move and they are both required: he has taken his FIRST PARTIAL,
    and STRUCTURE HAS BROKEN. Only then does the stop move - to the entry price or to the
    short-term high (short) / low (long) that the break has just protected. The procedure
    then repeats: each subsequent structure break creates a new short-term extreme and the
    stop is trailed to it. He explicitly permits doing this on the 1-minute for a tighter
    trail, with the same gate - a shift in structure must occur before the stop moves.'
  - 'Trailing is anchored to structure, not to profit. As price forms each new protected swing,
    the stop can be moved to it - the same marked levels are described as being either entries
    or trail points. For a coarse trail he uses daily swings; when he wants to tighten up
    because momentum is visibly slowing, he drops to a lower timeframe and trails to the new
    protected swing there, on the reasoning that price ideally should not return to it. He
    also reframes the pullback for a nervous trader: a pullback is not a threat, it is the
    thing that creates the next level to trail to.'
  - 'Stops are only moved once price has created a new protected swing in the trade direction;
    the stop can then be moved to that swing or to break-even, because price should not return
    through it. Moving to break-even earlier than that is identified as the common error that
    gets traders retested out of trades that then work. As price approaches the target he
    trails tightly (for example to the prior one-minute bar) rather than giving back a large
    open profit for a small extra move.

    '
  - 'Worked live. After the entry, price sweeps a low, prints a candle 2 closure and forms
    a continuation on the 1-minute; that continuation creates a new invalidation level, and
    at that point - and only at that point - the position can be moved to break even. The
    converse is stated in the same session as the exit trigger for the idea: when price comes
    back and invalidates the protected swing, he is no longer interested because the session
    becomes choppy.'
category: risk
status: contested
