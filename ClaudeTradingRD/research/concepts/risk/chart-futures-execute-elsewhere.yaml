ambiguities:
- No adjustment is described for the price offset between ES and SPX, or between NQ and QQQ.
- '''Large caps'' is not bounded by market cap, volume or spread.'
- Minis and micros are described as genuinely different traded assets that 'track' but do
  not always share the same price or structure; no rule is given for what to do when their
  structures disagree.
- Which contract-roll / continuation convention the futures series uses is only addressed
  by the separate chart-data-settings note (settlement off, back-adjust on).
