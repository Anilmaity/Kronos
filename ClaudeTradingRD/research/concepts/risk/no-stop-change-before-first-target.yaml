ambiguities:
- '''First target'' is never defined mechanically in this video.'
- The scale-out fraction at the first target is not given.
- He explicitly says there is no right or wrong way and everyone differs, which weakens it
  from a rule to a personal policy; the host offers a trailing method in the same recording.
