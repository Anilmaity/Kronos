id: loss-and-gain-limit-rules
name: Pre-Set Loss AND Gain Limits (euphoria is worse than fear)
definition: 'A stop-trading rule set that must contain a daily loss limit, a weekly loss limit
  and an N-consecutive-losses limit - and, unusually for this corpus, the same limits applied
  to the winning side. The reason given for the gain-side limit is that euphoria is more dangerous
  than fear: fear at least triggers self-protection, whereas after a run of wins the trader
  feels the market is solved, puts on size that is too large, and is then humbled. The numbers
  themselves are deliberately not supplied; the guest''s position, quoting Van Tharp, is that
  the existence and enforcement of the rules is what matters, and that rules are either absent,
  unfollowed, or in need of modification - and the only way to know which is to have them
  and apply them. Stepping away for a day or a week is the prescribed reset.'
category: risk
status: underspecified
aliases:
- daily loss limit
- weekly loss limit
- knowing when to walk away
preconditions:
- A written trading plan exists, so the limits have somewhere to live.
detection_rules:
- Define in writing a daily loss limit, a weekly loss limit and a maximum number of consecutive
  losses.
- Define equivalent limits on the winning side and stop trading when they are hit.
- Treat a winning streak as a size-inflation risk, not a licence to size up.
- On hitting a limit, step away for a day or a week to let the emotion settle.
invalidation:
- Not applicable - behavioural rule.
measurable:
- P&L of sessions continued past the Nth loss vs sessions stopped at it
- average position size on the trade following a three-win streak vs baseline
