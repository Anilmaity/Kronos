id: low-hanging-fruit-target
name: Low Hanging Fruit Targets (nearest session level, 2 to 2.5R)
definition: 'A deliberately modest target policy: take the nearest obvious session level rather
  than the furthest plausible objective. The stated justification is the funded-trader context
  - the job is to collect 2 to 2.5R consistently, not to maximise any single trade.

  '
category: risk
status: specified
aliases:
- low hanging fruit
- grab your two R
preconditions:
- An entry has been taken.
- Session levels are marked.
detection_rules:
- Identify the nearest session level in the trade's direction - Asia high or low, London high
  or low, the New York session open, or the previous day high or low.
- Set the target there, aiming for roughly 2 to 2.5R.
- Cross-check the target against the remaining average daily range before committing to it.
- Trimming and trailing for more is acknowledged as possible but is not the default.
invalidation:
- The nearest session level does not offer roughly 2R - one example accepted a slightly closer
  level anyway, another skipped to a further one.
measurable:
- realised R distribution using nearest-level targets versus further targets on the same entries
- how often the nearest level is reached versus the next one out
sources:
- video_id: 07lOxv39LdY
  title: DTR | C2U - Blending The Fractal Model & Unicorn Model - No Daily Bias
ambiguities:
- Because no stop rule is given anywhere in the video, the R multiples quoted cannot be reconstructed.
- The choice between a slightly-under-2R nearest level and the next level out is made case
  by case with no rule.
- Conflicts in spirit with Ash Trades' fixed 2R and with AP's hold-for-a-new-extreme in expanding
  markets - see mechanical-trade-management.
related:
