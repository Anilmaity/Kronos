id: house-money-capital-structure
name: Capped-Downside Deposit and Getting The Initial Out
definition: 'A capital-structure rule rather than a trade rule. The guest funds a personal
  account only with an amount he is willing to lose in full, and explicitly treats that deposit
  as the total capped downside of the venture (the broker supplies leverage; he does not add
  capital to defend a losing account). Once the account has grown, he withdraws the original
  deposit. Everything remaining in the account is then framed as house money, which he says
  permits materially larger position sizes without emotional interference - not different
  trades, the same model at larger size. If the account is lost, the plan is to reload with
  the same initial amount.

  '
category: risk
status: specified
aliases:
- house money
- get your initial out
- capped downside
preconditions:
- Trading personal capital rather than prop-firm capital.
- An amount of money the trader can genuinely afford to lose entirely.
detection_rules:
- Deposit only an amount whose total loss is acceptable; treat it as the maximum loss for
  the account.
- Do not top the account up to defend a drawdown.
- Once the account balance has grown, withdraw an amount equal to the original deposit.
- After the initial is withdrawn, size up on the remaining balance.
invalidation:
- Not applicable - this is a capital rule, not a setup.
measurable:
- time (or R multiples) required to reach a balance permitting withdrawal of the initial
- post-withdrawal position size vs pre-withdrawal position size
- frequency of full account loss and reload across a sample of accounts
sources:
- video_id: 1wKfc2gN4xg
  title: Trader Kane | The Mind Behind a Multi-Million Dollar Day Trader
ambiguities:
- No multiple of the deposit is given as the trigger for withdrawing the initial - only that
  the account has grown.
- How much larger the post-withdrawal size may be is not quantified, and it is not reconciled
  with the 1%-2% scaling matrix he describes for prop accounts.
- He acknowledges the framing is psychological rather than an accounting fact; the entry records
  it as stated, not as endorsed.
