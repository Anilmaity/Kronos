ambiguities:
- '''Very big'' / ''large range'' expansion days are never quantified, so the two-large-days
  trigger is not decidable from a chart.'
- '''Closes strong'' / ''closes well'', which keeps a further continuation on the table, is
  unquantified everywhere it appears in the series.'
- '''Average daily range'' is used as an expansion stop-point with no lookback period or calculation.'
- The rule is stated as a personal preference to 'avoid' rather than a hard prohibition; in
  one Classic Expansion example he offers 'either avoid price or seek a further continuation
  lower' for the same week.
- 'Status is underspecified: the day-count trigger is decidable but the size and close-quality
  triggers are not.'
- '''Multiple fair value gaps'' is not bounded - no maximum span for the aggregated gap is
  given.'
- The V-shape requirement inherits its own missing geometric test.
- '''Expansion day'' is not defined by a size threshold - it is read from daily closures.'
- Whether the three-day count resets on a single non-expansion day or requires a confirmed
  new phase is not stated.
- The leg-counting variant (three and four) and the day-counting variant (three days) are
  described separately and their relationship is not spelled out.
- Sourced from an ASR (whisper-small) transcript, not YouTube captions; wording may be imprecise.
- This is a different trigger from the expansion-day / leg counting readings recorded elsewhere
  under this id; the shared element is only the phrase 'avoid price' and the stand-aside action.
  Whether the speaker regards them as one rule is not stated.
- No rule tells you how wide the avoided area is, only that it is around the contested level.
- There is no stated cost side - nothing about how often standing aside on a conflict forfeits
  a good trade.
