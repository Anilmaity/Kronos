id: expansion-exhaustion-avoid-price
name: Avoid Price (expansion exhaustion)
variants:
  name:
  - Do Not Trade After Three Days Of Expansion
  definition:
  - 'The Shorts state the avoid-price rule with an explicit trigger and an explicit refusal
    to rationalise. After a reversal with multiple candles of expansion, the continuation
    he wants is a sweep of the previous low (with or without SMT) followed by an inversion.
    Where several fair value gaps are stacked he treats them as one large gap that must be
    closed through in its entirety. When price fails to close through and fails to produce
    a clean V-shape reversal, he avoids the area - and states that even if the move subsequently
    works, he is not interested, because a run higher out of a consolidation is usually just
    the consolidation highs being taken before price goes lower.

    '
  - 'After three consecutive days of expansion he stops taking trades in that direction, because
    that is where a new phase of price delivery begins and further entries are chasing. The
    same logic is applied to leg counting on any timeframe: he does not enter after the fourth
    leg of a move, and his model deliberately looks only at the third and fourth candles of
    a sequence so that it does not carry a trader into a new phase.

    '
  - 'A second, distinct trigger for the same stand-aside action, and the one this unit actually
    demonstrates. It is not exhaustion but self-contradiction: price arrives somewhere that
    two of his own conditions point in opposite directions. Inside a consolidation he wants
    the range high taken out before price runs the lows, so the manipulation is required.
    But that same high is a swing he does not want taken if the day is to continue lower.
    Both conditions attach to one price, so he states plainly that this is an area where he
    will avoid price because he has conflicting ideas, and he sits out until the conflict
    resolves itself - which it does, by price breaking down out of the range without ever
    taking the high. The rule generalises cleanly: the trigger to stand aside is not a count
    of days or legs but the detection that two active requirements target the same level in
    opposite senses.

    '
  category:
  - time
definition: 'A stand-aside rule applied to the tail end of an expansion week. Once the week
  has delivered its expansion, the speaker stops looking for a further continuation day and
  says he wants to avoid price, on the reasoning that a new phase of price is likely to begin.
  Three triggers are stated across the series: three days of expansion have already occurred;
  two very large expansion days have occurred, making a third hard to anticipate; or the higher-timeframe
  objectives have already been reached. Conversely, the expansion is run until the average
  daily range is covered or the higher-timeframe objective is met, so an open objective is
  what keeps a further continuation day on the table.

  '
category: risk
status: contested
aliases:
- avoid price
- a new phase of price
- expansion exhaustion
- three days of expansion
- chasing price
- conflicting ideas
- an area where I will avoid price
preconditions:
- A confirmed weekly extreme with at least one continuation day already delivered.
- A directional move with countable expansion days or legs.
- Two active conditions from the working read that both reference the same price level.
detection_rules:
- Count the consecutive expansion days since the confirmed weekly extreme.
- Stand aside once three days have expanded.
- Stand aside once two very large expansion days have occurred, rather than anticipating a
  third.
- Stand aside once the higher-timeframe objective has been reached, regardless of the day
  count.
- Conversely, a further continuation day is permitted only when the previous day closed strong
  AND a higher-timeframe objective is still open.
- Require a sweep of the previous extreme (or an SMT) followed by an inversion for the continuation.
- Where several fair value gaps stack, treat them as one large gap; the closure must clear
  all of them.
- No clean close through and no V-shape reversal -> avoid price in that area.
- Do not re-enter on the grounds that the move later worked; a run out of the consolidation
  is read as a sweep of its highs.
- Count consecutive expansion days. At three, stop taking new entries in that direction.
- Count legs of the move; do not enter after the fourth leg - his model targets candle three
  and candle four positions.
- After three expansion days, expect a new phase of price (retracement, reversal or consolidation)
  rather than more expansion.
- 'The corollary on the daily: after two days of expansion he is ''more so interested in waiting
  to see a new phase'' rather than adding a third entry.'
- Enumerate the conditions currently attached to the level - what you want to see happen there,
  and what you do not want to see happen there.
- If a required manipulation and a swing that must hold are the same level, declare the ideas
  conflicting.
- Avoid price for as long as the conflict stands - take no entry in that area in either direction.
- Resume only when price resolves the conflict on its own (here, by leaving the range without
  touching the contested level).
invalidation:
- A new confirmed swing point forms, restarting the sequence - the speaker's remedy in the
  Intraweek Reversal video is to wait for that new swing point rather than to keep taking
  continuations.
- A clean close through the stacked gap with a V-shape reversal, which reinstates the setup.
- A new phase of price printing resets the count.
- The conflict resolves - one of the two conditions is settled by price - and normal handling
  resumes.
measurable:
- distribution of consecutive daily expansion days per week
- expectancy of the 4th consecutive continuation day versus the 2nd and 3rd
- expectancy of a continuation day taken after the higher-timeframe objective was already
  hit
- frequency with which a week's range is complete by Thursday's close
- outcome of moves out of structures classified avoid-price
- how often the run out of such a consolidation reverses
- distribution of consecutive expansion-day run lengths per instrument
- win rate of entries taken on day 1, 2, 3 and 4+ of an expansion run
- frequency of conflicting-level situations per session
- outcome of trades taken into a contested level vs those deferred until it resolved
- how often the conflict resolves by price avoiding the level entirely
