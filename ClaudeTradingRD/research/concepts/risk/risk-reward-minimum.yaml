id: risk-reward-minimum
name: Minimum Risk-To-Reward
variants:
  name:
  - Minimum R and Position Management
  - Minimum R and the Break-Even Win Rate
  - Minimum Risk-To-Reward (2R)
  definition:
  - '2R is the default target across this entire unit - it appears in essentially every worked
    trade, with the stop on the protected swing / model invalidation. Where the geometry does
    not offer 2R, the stated fix is to MOVE THE ENTRY (down to a fair value gap, or wait for
    a retest) or to use the BODIES rather than the wick for the stop - never to widen the
    target or take a worse trade. Runners are the exception: once the short-term target is
    banked, a portion is held toward the higher-timeframe objective, which is where the outsized
    R comes from.'
  - 'A 2R minimum on every trade, stated as a system requirement rather than a preference,
    and for the first time in the corpus with the arithmetic attached: at 2R, a win rate above
    34% is break-even or profitable. Everything else in the entry machinery is downstream
    of this -- refining the entry to a lower timeframe, moving the stop to the bodies, waiting
    for a retest instead of entering at market, and skipping a setup entirely are all presented
    as ways to satisfy the 2R constraint. The complementary rule for getting more than 2R
    is to combine a lower-timeframe invalidation with a higher-timeframe target.'
  - 'Two guests give the same target doctrine from opposite directions. Trader T uses a fixed
    2R on every trade and defends it psychologically rather than statistically: the worse
    outcome is not missing an extension past 2R, it is watching price reach 2R and then come
    back and take you out when you could have banked it. He pads the target to about 2.2R
    so the spread does not stop him short of the fill. Ben refuses to go as low as 1:1 and
    gives the arithmetic: a 1:1 system forces break-even at a 50 percent win rate, so a sub-50
    percent trader cannot be profitable on it at all. His own comfort band is taking profit
    around 2R to 2.5R with 3R to 3.5R as the sweet spot, and his stated method for settling
    the question is empirical - run 20, 25 or 50 trades at 1R, 1.5R and 2R and see what your
    own data says.

    '
  - 'A small set of stated risk constraints: a 2R minimum on entries, no management of a position
    until 2R has been reached, and a win-rate/R relationship - a 50% win rate is not viable
    at 1R but is viable at 1.5R and at 2R. When there is no strong higher timeframe bias he
    takes most of the position off earlier, at 1.5R to 2R at the first failure swing, and
    either flattens or leaves a runner at break-even.

    '
  - Asked directly what his risk to reward is, TTrades answers that it depends on the target
    but that he thinks he does 2R minimum. This is stated as a floor, not a fixed target -
    the target itself comes from structure.
definition: 'He states a personal floor of 2R in two separate videos and a 1:2 minimum in
  a third, and lets it drive both target selection and entry refinement: he rejects a 1.19R
  entry and moves it up to about 2R, and he declines a fixed 1:1 in favour of structural targets.
  In the internal/external model 2R is the fixed target rather than a floor. Break-even is
  moved at 3R in the silver-bullet backtest.'
category: risk
status: contested
aliases:
- minimum R
- at least two R
- 2R
- look for two R
- 2R minimum
- 34% break-even
- fixed 2R
- 2.2R for the spread
- why not 1:1
