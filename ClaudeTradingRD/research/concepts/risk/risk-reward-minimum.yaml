ambiguities:
- 2R appears as a floor (6zTz7WMdMWg), a fixed target (mwmWNCTEYtY) and a preference (AdmnWLjf8rY)
  — the three uses are not reconciled.
- The Son's-model 1:1 he teaches is explicitly ICT's, and he says he personally would not
  trade it; both are presented in the same video.
- '''Partial then runners'' is shown repeatedly but never given a size or a rule.'
- 2R is universal in the examples but never stated as a rule; it is a revealed default.
- The runner size is never specified.
- '''Manipulate your entry or your stop loss in some way'' is explicitly discretionary.'
- Whether 2R is measured to the first target or the final one is not fixed; both are used
  in examples.
- The 34% figure ignores costs and partials; no commission/slippage assumption is stated.
- Moving the stop to the bodies changes R by changing the denominator, which he acknowledges
  as 'manipulating the risk-to-reward' without bounding how far it may go.
- Trader T's 2R is not derived from anything - it is stated as a personal preference that
  removes a decision.
- Ben gives a band (2R-3.5R) rather than a rule, and does not say what selects a value inside
  it on a given trade.
- Neither speaker reconciles a fixed R target with an obstacle (an opposing PD array) sitting
  between entry and target.
- Ben's 20-50 trade sample is far too small to separate these multiples statistically, and
  he does not say so.
- '''Manage after 2R'' and the trailing-by-opposing-candles demonstration (which would exit
  well before 2R) are not reconciled.'
- '''Most of my position'' at the partial is not given as a percentage.'
- Per-trade risk percentage is never stated in these streams.
- '''I think'' - stated with hedging, not as a hard rule.'
- Whether the 2R is measured to the first target or the final target is not stated.
