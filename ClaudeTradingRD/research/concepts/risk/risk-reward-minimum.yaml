preconditions:
- A valid model with a defined invalidation.
- A defined stop (protected swing) and a defined target (drawn liquidity or projection).
- A stop distance is fixed, so R is well defined before entry.
- An entry with a defined stop, so R is computable.
- A trade with a defined stop and a structural target.
detection_rules:
- Compute R to the intended structural target before entering.
- Below ~2R, refine the entry downward (deeper into the FVG, to the consequent encroachment,
  to the mean threshold) rather than take the trade.
- If refinement cannot reach 2R and the target is fixed, skip.
- Where a fixed target is used (internal/external model), it is 2R.
- Move the stop to break-even at 3R (stated for the silver-bullet backtest).
- Stop on the protected swing / the model's invalidation; measure R to the nearest previous
  candle extreme.
- If 2R is not available, adjust the ENTRY (retest, or deeper into the fair value gap) or
  use the bodies rather than the wick for the stop.
- If neither works, do not take the trade at that location.
- Partial at the short-term target; hold a runner to the higher-timeframe target.
- A target slightly beyond the nearest level may be extended 'a little' to make 2R work.
- Compute R from the protected-swing stop to the nearest logical target. If < 2R, the setup
  does not qualify as-is.
- 'Remedies, in the order he uses them: refine the entry to a lower timeframe; move the stop
  to the body extreme; wait for a retest / place a limit; raise the target to a higher-timeframe
  objective.'
- If none of those produce 2R, skip the trade.
- For maximum R, pair a lower-timeframe invalidation with a higher-timeframe target (demonstrated
  at 4R, 5.63R, 8R).
- Do not seek entries after the objective has already been hit -- a new phase of price is
  due.
- 'Trader T: take profit at a fixed 2R; set the order at about 2.2R so the spread does not
  prevent the fill.'
- 'Trader T: if 2R is further than the structure allows, tighten the ENTRY (move the limit)
  rather than shorten the target.'
- 'Ben: reject 1:1 - it requires better than a 50 percent win rate merely to break even.'
- 'Ben: take profit around 2R-2.5R, with 3R-3.5R preferred, and let part of the position run.'
- 'Ben''s procedure for choosing your own multiple: log 20-50 trades at each of 1R, 1.5R and
  2R and read the result off your own data rather than adopting someone else''s number.'
- Require at least 2R to the intended target before taking the entry; if the stop is too wide
  for 2R, do not take it (this is the pre-open case).
- Do not manage the position until 2R is reached.
- With no strong higher timeframe bias, take most of the position off at 1.5R-2R at the first
  failure swing rather than holding for the deeper target.
- A 50% win rate is insufficient at 1R and sufficient at 1.5R or 2R.
- Risk is known from the entry price whether the entry is a limit or a market fill, so position
  size is derivable either way.
- Reject a setup whose structural target is less than 2R from the stop.
- Where the target is further, take the target rather than a fixed 2R.
invalidation:
- Refining the entry raises R but lowers fill probability — he explicitly trades that off
  rather than always maximising R.
- The target is taken out before entry -- the R calculation is void.
- Not applicable.
measurable:
- fill rate vs realised R at each refinement level
- outcome of trades taken below the 2R floor
- distribution of achievable R at model formation
- how often the entry-adjustment rule converts a sub-2R setup into a 2R setup, and its hit
  rate
- 'realised average R and win rate over a large sample (his 5-trade demo: 80%, 2.79R)'
- share of setups rejected on the R constraint alone
- expectancy at 1R, 1.5R, 2R, 2.5R and 3R on the same entry list - exactly the experiment
  Ben prescribes
- how often price reaches 2R and then returns to the stop (Trader T's stated fear, made testable)
- fill-rate difference between a 2.0R and a 2.2R target once spread is modelled
- realised R distribution and its win rate, compared against the 1.5R breakeven threshold
- outcome of scaling at 1.5R-2R vs holding to the deeper target on weak-bias days
- distribution of planned R per taken setup
- rejection rate of setups on the 2R floor
