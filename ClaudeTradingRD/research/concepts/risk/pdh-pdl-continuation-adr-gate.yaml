ambiguities:
- '''Most of the daily range'' is never given as a percentage; examples range from ~78% to
  ~100% used as ''no continuation'' and ~50% as ''continuation valid''.'
- ADR lookback length not stated (slide uses 3 days and says use more).
- 'Whether range used is measured from the day''s open or from the day''s extreme: examples
  measure from the extreme (high for bearish days).'
- '''Understand the phases of price and what a failure to manipulate or a breakout signature
  looks like'' is required but not defined here.'
- A target 'beyond reach' of ADR is still accepted in one bearish slide example - no tolerance
  stated.
