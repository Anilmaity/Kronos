ambiguities:
- $niper says 'a session or a day I guess' - whether the counter resets between the AM and
  PM sessions is left open.
- Neither speaker says whether a break-even trade counts toward the cap.
- $niper attributes his AM preference partly to the month being August, so it is a conditional
  preference rather than a rule.
- Trader T states the cap in the psychological register ('obviously I'm just reading the market
  wrong'), not as a tested threshold.
- '''Under 1 percent'' is not reconciled with prop-firm drawdown limits even though he trades
  prop accounts.'
- It is not stated whether the weekly cap resets on Sunday or on the first trading day.
- The 34 percent break-even figure is stated for a 1:2 payoff and ignores costs.
