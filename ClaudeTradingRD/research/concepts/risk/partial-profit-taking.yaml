id: partial-profit-taking
name: Partial Profit Taking (contested)
variants:
  name:
  - Partial Profit Taking
  definition:
  - 'EARLIER RECORDINGS. Exits are a ladder anchored to LIQUIDITY rather than to R multiples:
    the first partial at the nearest opposing liquidity (equal lows/highs or a small order
    block), the second at the next pool beyond it, and a third or final position held to the
    day''s opposing extreme or to the close. In the morning-routine video the same ladder
    is stated as first partial / second partial / third partial / hold to close. The scalp
    variant pairs the first partial with moving the stop to break-even.'
  - '$niper''s fixed scale-out policy inside the market maker model. He states flatly that
    you should always be taking partials. The first take-profit is at approximately 2:1, placed
    at the nearest structural low to the left on the buy side of the curve; the stop is then
    moved to break even, and roughly 20 percent of the position is left on for the final target.
    In the sell model the stop is pulled down to sit where the second-distribution-leg entry
    is, so that a second entry taken there is already covered by a locked-in first position.
    His worked example is a 3.36:1 trade.

    '
  - 'He reframes a partial as a change to the system''s required win rate rather than as secured
    profit. Taking half off at 1R on a 2R trade leaves +0.5R on the first half and +1R on
    the second, so a full loss is still -1R while the win is 1.5R: the trade looks like a
    2R trade but is not, and the break-even win rate rises from ~34% to roughly 43%. Same
    argument for exiting the whole position early at 1R, which moves the requirement from
    34% to 50%. His stated policy is to take partials only when doing so still meets the model''s
    requirement.'
definition: 'Two directly opposed positions on scaling out of an intraday position appear
  in this corpus and are recorded here together rather than averaged. Reading A (TTrades,
  in both Chart Lessons trade reviews): partial at approximately 2R, take further partials
  at each intermediate structural target, and hold a runner for the final objective with the
  stop trailed to each new protected swing. In this reading the risk-to-reward calculation
  that gates the entry is explicitly framed around being able to partial at or before the
  short-term targets, so partials are structural to the entry decision, not an afterthought.
  Reading B (guest trader in t_talks_03): intraday partials are a mistake - they steal from
  the future trade, and taking them means either you have a draw and should hold to it or
  you do not have a trade at all; he concedes partials are logical on swing trades to avoid
  round-tripping a large move. Both traders are describing intraday index-futures trading.

  '
category: risk
status: contested
aliases:
- took off at 2R
- partials
- scaling out
- trailing the runner
- first partial
- second partial
- first partial at 2:1
- leave 20 percent on the table
preconditions:
- An open position with a defined final target and at least one intermediate structural level
  between entry and target.
- A position is open and the liquidity pools between entry and the draw are marked.
- A position is open from the post-structure-break entry with a defined 1R distance.
- A structural low (buy side of the curve) exists that coincides with roughly 2:1.
detection_rules:
- Reading A - partial at approximately 2R; partial again at each intermediate high or low
  as it is taken; hold the remainder for the final objective.
- Reading A - trail the stop to each new protected swing (a swept extreme that is then closed
  back over).
- Reading A - if a limit at the final target does not fill, exit manually rather than surrender
  the position for a tick or two.
- Reading B - take no intraday partials; exit in full at the anticipated draw.
- Reading B - partials are permitted on swing trades to avoid round-tripping.
- Mark the liquidity pools between entry and the draw before entering.
- First partial at the nearest opposing pool.
- Second partial at the next pool.
- Third / final position to the day's opposing extreme or held to the close.
- 'Scalp variant: first partial, then move the stop to break-even.'
- Place the first partial at the nearest low to the left on the buy side of the curve, chosen
  so it lines up with about 2:1.
- After that partial is filled, move the stop to break even.
- In the sell model, pull the stop down to the price of the second-distribution-leg entry
  rather than to entry.
- Leave about 20 percent of the position running for the final take-profit at the opposing
  liquidity.
- Compute the realised R of a partialled trade, not its nominal target R.
- Half off at 1R on a 2R trade yields +1.5R on a winner against -1R on a loser.
- Recompute the break-even win rate on the realised R before deciding the partial is free.
- Only take the partial when the model still calls for it.
invalidation:
- Reading A - a consolidation that breaks and then pushes back through is read as a reversal
  and is the cue to be flat.
- Reading B - the absence of a definable draw means there was no trade to be in.
- The stop is hit before the first pool.
- Price returns to entry after the partial - the runner is closed at break even.
measurable:
- expectancy of partial-at-2R-plus-runner vs single full exit at the draw, on the same trade
  sequence
- how often the trailed runner exits before the final objective is reached
- average R surrendered by partialling vs average R surrendered by round-tripping
- how often each rung of the ladder is reached
- expectancy of the liquidity-anchored ladder vs a fixed-R ladder
- expectancy of the scale-out policy versus a flat exit at the same first target
- how often the residual 20 percent reaches the final objective after the 2:1 partial
- how often the break-even stop is hit before the final objective
- backtested expectancy with and without a 1R partial on the same signal set
- realised average R vs nominal target R
