ambiguities:
- The two readings are from different speakers (host vs interview guest) and neither addresses
  the other, so this is a corpus-level conflict rather than a stated debate.
- Reading A never states 2R as a rule; it is inferred from repeated behaviour in both trade
  reviews.
- Reading B does not define where a trade stops being intraday and becomes a swing, which
  is exactly where he permits partials.
- In both Reading A examples the trailed runner produced no additional profit over the take-profit
  level - in one case it was trailed out at the identical price - which is evidence against
  the runner leg but is not treated as such in the videos.
- EARLIER RECORDINGS. No position fractions are ever given - 'first partial' never says what
  percentage comes off.
- The ladder is anchored to liquidity, so the number of rungs varies with the chart.
- The scalp break-even pairing conflicts with the CPI review's explicit refusal to move to
  break-even (see break-even-management).
- The partial size taken at 2:1 is not given - only the residual ('leave like 20 on the table')
  is quantified.
- The 2:1 level and 'the low to the left' are treated as the same place in the worked example,
  with no rule for what to do when they do not coincide.
- Whether the break-even stop moves again after the second entry is not stated.
- This is the opposite of the never-break-even, never-trail doctrine other guests in the corpus
  hold - two different traders, not channel self-inconsistency.
- The 43% figure for a 1.5R system is explicitly hedged on stream ('I don't have the stats
  known for that, but... probably something like').
- '''Still meets my requirement for a model'' is the gate for taking a partial and is never
  defined.'
