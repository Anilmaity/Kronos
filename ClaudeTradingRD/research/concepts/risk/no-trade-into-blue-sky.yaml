id: no-trade-into-blue-sky
name: Do Not Trade Into Clear Blue Skies (nothing to stop out)
definition: 'The guest rejects the common breakout premise. His argument is mechanical rather
  than sentimental: the move he wants is one that comes back THROUGH a previous range, because
  that is what stops participants out and supplies the fuel. Trading into all-time highs (''clear
  blue skies'') means there is no previous range overhead and therefore nobody to stop out.
  He generalises this to why broadening formations form at all - trends recruit one-sided
  positioning, and once everyone is short the only thing left to do is stop them out, so the
  first buyers off a low are the shorts covering.'
variants:
  definition:
  - 'TTrades'' own contrary view to the guest''s rule: asked how to trade all-time highs,
    he says it is exactly the same as trading two weeks earlier and that viewers overthink
    all-time highs. (In the same stream he declines longs, but for daily-profile reasons,
    not because of the ATH.)'
category: risk
status: contested
aliases:
- all-time highs have no previous range
- coming back through previous range
preconditions:
- A directional move approaching, or already beyond, prior structure.
detection_rules:
- Prefer setups where the objective is inside or through a previously traded range.
- Deprioritise setups whose objective is virgin price (all-time highs / lows with no prior
  range).
- After an extended one-sided trend, expect the reversal leg to be driven by the trend followers
  being stopped out.
measurable:
- outcome of continuation trades into virgin price vs into prior range
- speed of the first leg off an extreme after a >=5 pivot machine gun
sources:
