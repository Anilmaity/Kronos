ambiguities:
- Stated as a preference and a mechanism, never as a hard filter with a threshold.
- The positioning claim (everyone is short at the lows) is asserted, not evidenced.
- The library entry is a guest's rule; this is the channel owner disagreeing, so status set
  contested.
