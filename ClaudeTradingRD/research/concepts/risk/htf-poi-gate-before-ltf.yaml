ambiguities:
- '''Reached'' the point of interest is not defined as near edge, midpoint or full fill.'
- No cap on how many points of interest may be marked in this unit (the guest version caps
  at one or two).
- How the daily bias itself is formed is only sketched (obvious market structure shifts, DXY,
  bonds, clear displacement).
- A session bias is offered as an acceptable substitute for a daily bias, but is not defined.
