id: entry-timeframe-elevation
name: Entry Timeframe Elevation (root-cause fix for stop-outs)
definition: 'Two statements in this stream. A standing personal rule: before the 9:30 open
  he trades only the 15-minute or higher, to avoid pre-open chop; after the open any timeframe
  is allowed. And the standard diagnosis for a viewer who blew an account shorting NQ across
  15m/1m/5m/15s charts: get off the 1-minute, use higher timeframes; dropping down is driven
  by fear of missing the move, and the higher timeframe does not cause a missed move, only
  fewer stop-outs.

  '
variants:
  definition:
  - 'The standard answer given to the most repeated viewer complaint - ''my bias is right
    but I get stopped out and then it goes to target''. The diagnosis is that the entry timeframe
    is too low, and the fix is to move the entry up one timeframe. He is explicit that the
    alternative fix - simply widening the stop - is wrong, because it destroys the risk-to-reward
    and forces a position-size change; the problem is the timing of the entry, not the stop
    distance. Worked concretely: a trader pairing H1 with M5 entries should enter on M15 instead.'
  - 'The single fix he gives twice in one stream, and quizzes the chat on: if you are repeatedly
    stopped out and the market then does exactly what you expected, the problem is the entry
    timeframe, not the read. Traders sit on the 1-minute or 3-minute, get stopped by structure
    that is invisible there, and would have placed the stop correctly one or two timeframes
    up. The illustration he gives is a continuation entry taken inside what is actually a
    higher-timeframe fair value gap — from the higher timeframe it is obvious you should wait
    for price to reach the gap and put the stop below it. He couples this with the observation
    that he does not go below the 15-minute pre-open for exactly this reason.

    '
  - 'A diagnostic rule he applies twice to viewer problems. If entries feel rushed and stressful,
    or if the directional bias is right but the stop is repeatedly swept before price runs
    to target, the root cause is an entry timeframe that is too low relative to the trader''s
    grasp of the higher-timeframe opening context. The remedy is to move the entry timeframe
    up one step: M1/M3 to M5, M5 to M15, M15 to H1.

    '
  - 'Restated: if you see direction but keep getting stopped out before the move, move up
    one timeframe for entries (5-minute to 15-minute). If the problem is not entering at all,
    base the trade on an invalidation and take it.'
  - 'Restated: in choppy conditions he does not drop to a lower timeframe, because that is
    how losses are forced after missing the trend.'
category: psychology
status: contested
aliases:
- move up a time frame or two
- go up a timeframe
- stop getting swept
- move up one time frame
preconditions:
- A repeated pattern of being stopped out on trades whose direction was correct.
- A recurring pattern of correct bias with premature stop-outs, or of entry stress.
detection_rules:
- 'Before 09:30 New York: entry timeframe floor = 15-minute.'
- 'After 09:30: no timeframe floor.'
- 'Repeated chop-outs on 1-minute: move execution up (15-minute in the NQ example).'
- 'Symptom: bias correct, stopped out, target subsequently reached.'
- 'Fix: raise the execution timeframe by one step within the timeframe-pairing ladder (e.g.
  H1/M5 becomes H1/M15).'
- Do not widen the stop beyond its mechanical level to compensate.
- The same fix is given for 'too early on entries' found when auditing losses.
- 'Diagnose: the stop is taken and the target is then reached without you.'
- Raise the execution timeframe by one or two steps (1m/3m → 3m/5m → 15m).
- Check whether the entry sits inside a higher-timeframe array (e.g. an unfilled higher-timeframe
  fair value gap); if so, wait for price to reach that array and place the stop beyond it.
- Keep the bias timeframes unchanged — only the execution pair moves.
- Identify the current entry timeframe.
- If stop-outs precede the intended move, or entries feel rushed, elevate one timeframe step.
- Separately note that the model itself is timeframe-agnostic - only a daily framework and
  a wick to trade away from are required.
- Repeated stop-outs on 5m entries -> execute on 15m.
- When price is choppy, do not refine entries to lower timeframes.
invalidation:
- Not applicable — this is a corrective procedure.
- n/a
measurable:
- stop-out rate of pre-09:30 entries on 15m vs 5m/1m
- stop-out rate and expectancy of the same signal executed on two adjacent timeframes
- stop-out rate of the same signal executed at 1m/3m versus 5m/15m
- share of stop-outs whose stop sat inside a higher-timeframe array
- MAE and stop-out rate by entry timeframe on the same signal set.
