ambiguities:
- How far to keep elevating if the problem persists is not addressed.
- The ladder of legal timeframe pairs is referenced ('my time frame alignment video') but
  not enumerated in these streams beyond H4/M15, D/H1 and H1/M5.
- How far up to move is 'one or two' with no rule for choosing.
- The trade-off against risk-to-reward (a higher timeframe means a wider stop) is not discussed.
- It is not stated whether this is a permanent change or a temporary correction.
- No test is given for when elevation has gone too far (the trade becoming untradeable on
  risk).
