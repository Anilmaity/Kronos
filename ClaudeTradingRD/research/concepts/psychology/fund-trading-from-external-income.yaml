id: fund-trading-from-external-income
name: Fund Trading From Surplus Income, Never From Committed Money
definition: 'A precondition placed before any market participation. The day job must cover
  all bills plus savings; trading capital must come from additional work on top of that. The
  argument offered is causal rather than moral - money you need produces fear-driven execution
  (trailing to break even, taking half R, cutting winners), which prevents the trader from
  ever observing the probabilities the model depends on.

  '
category: psychology
status: specified
aliases:
- work more
- it takes money to make money
preconditions:
- The trader has, or can obtain, income beyond bills and savings.
detection_rules:
- Confirm bills and savings are covered by the primary income before any capital is risked.
- Fund the trading account (or prop challenge) only from surplus earned specifically for that
  purpose.
- If that surplus is not available, do not force participation - accept a slower path rather
  than trading rent money.
- 'Test for the failure mode: if the first moment a position is profitable produces an urge
  to trail to break even or take half R, the capital is wrongly sourced.'
invalidation:
- Not applicable.
measurable:
- proportion of trades exited before either stop or target, as a proxy for fear-driven management
- average realised R versus the model's designed R
- account replenishment source recorded per funding event
sources:
- video_id: zXtJSSkiNmo
  title: Ash Trades | The Journey To Profitability & The Unicorn Model
ambiguities:
- The claim that improperly-sourced capital causes the specific management errors is stated
  from personal experience and observation, not measured.
- He acknowledges the option may not exist in all countries and gives no alternative protocol
  beyond 'understand the psychology that comes with that'.
