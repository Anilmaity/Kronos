id: bias-confirmation-tradeoff
name: Bias / Confirmation Trade-off
definition: 'An explicit, stated inverse relationship between how strong the higher-timeframe
  bias is and how much lower-timeframe confirmation he demands. With a strong higher-timeframe
  bias (a clean higher-timeframe continuation) he will take a LOWER-timeframe REVERSAL entry.
  With a weak bias (e.g. the higher-timeframe candle 2 already expanded, or he is trading
  a higher-timeframe candle 2 rather than a candle 3) he DEMANDS a lower-timeframe continuation,
  and may demand SMT plus a V-shape on top. He also gives the practical reason the trade-off
  is not free: waiting for the continuation sometimes leaves no room for a stop and no target
  left, so the setup is simply missed.'
variants:
  definition:
  - 'The amount of lower-timeframe confirmation demanded before entry is inversely proportional
    to the strength of the higher-timeframe bias. With a strong bias, little confirmation
    is needed; with a weak bias, a specific confirming closure must print or no trade is taken
    - even if the directional idea subsequently proves correct.

    '
category: psychology
status: contested
aliases:
- strong bias, aggressive entry
- strong bias needs less confirmation
preconditions:
- A higher-timeframe model exists and its quality has been assessed.
- A higher-timeframe bias has been formed and its strength assessed.
detection_rules:
- Strong HTF bias (HTF continuation day, clean reversal candle, drawn liquidity open) -> a
  lower-timeframe reversal entry is permitted.
- Weak HTF bias (HTF candle 2 already expanded, consolidation, or trading the HTF candle 2
  itself) -> require a lower-timeframe continuation, and optionally SMT and a V-shaped reversal.
- If the continuation entry leaves no room for a stop or the target sits at the entry, take
  the reversal or skip.
- 'Preferred default when in doubt: trade a higher-timeframe continuation with a lower-timeframe
  continuation.'
- 'Grade bias strength (his own test: how confident the daily chart read is, developed by
  screen time).'
- If bias is strong, act on the setup with minimal lower-timeframe confirmation.
- If bias is weak, define in advance the specific closure required; if it does not print,
  do not trade.
invalidation:
- The higher-timeframe read that justified the aggression is itself invalidated.
- n/a - this is a sizing/gating rule rather than a pattern.
measurable:
- hit rate of LTF-reversal entries under strong vs weak HTF bias
- count of setups skipped because the continuation offered no stop or no target
- Expectancy split by pre-declared bias-strength grade.
- Proportion of weak-bias days where the required confirmation never printed.
sources:
- video_id: qdQYhePcvGE
  title: TTrades Fractal Model - Trading Candle 3
  quote: if you have a strong bias, you can trade those lower time frame reversals
- video_id: 9BY-MQRNy-Y
  title: TTrades Swing Trading Model - Simple Strategy
- video_id: Qv6Ux_Z8VrA
  title: New York Open Live Q&A
  quote: The more my bias increases, right? The less confirmation I need.
ambiguities:
- '''Strong bias'' is never scored; the classification is entirely discretionary and he says
  so.'
- The extra confirmations demanded on a weak bias (SMT, V-shape) are listed as options, not
  as a required set.
- Bias strength is self-assessed by feel ('once you watch the daily chart enough you'll get
  a feeling'); no scale or criteria are given.
