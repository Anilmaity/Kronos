id: single-pd-array-mastery
name: Pick One PD Array, Plus Highs And Lows
definition: 'His diagnosis of why people fail with ICT: not a lack of knowledge or understanding,
  but an inability to filter the concepts down to one. The prescription is a selection procedure
  and a constraint. Selection: ask which PD array is easiest for YOU to see on the chart,
  which makes the most sense to you, and how much confirmation you need. Constraint: use that
  single PD array in combination with highs and lows - liquidity is mandatory alongside whatever
  array is chosen - and stop jumping to new things after a rough patch. He states his own
  answer plainly: highs, lows, and opposing candles / the change in the state of delivery,
  and nothing else.'
variants:
  definition:
  - 'A Short built as a deliberate demonstration of over-marking. He walks a 3-minute chart
    and points out, in sequence, the turtle soup, the inversion, the change in the state of
    delivery, a breaker block and several fair value gaps - all genuinely present - and then
    asks whether marking them helps or merely clutters the chart. His answer is that he does
    not need any of it: the sweep of the previous high plus the closure through the series
    of candles that made it is enough to anticipate a continuation, and from there he only
    watches the opposing candles.

    '
  - 'Ben''s answer to whether order blocks or fair value gaps carry more weight, and the operating
    principle behind it. He does not rank the arrays; he says the array you should use is
    the one your own eye reads most reliably, and that you do not need to use everything in
    ICT''s arsenal. He is candid that order blocks are his own weak point - he struggles to
    see them and skips one in the live example because it is not clean enough for him - while
    breaker blocks and balanced price ranges jump off the page. The corollary he states twice
    is procedural rather than aesthetic: pick the array, then study what price actually does
    at it, and let journalled data rather than someone else''s preference decide whether you
    keep using it.

    '
category: psychology
status: contested
aliases:
- choosing a PD array
- focus on less and master that
- don't get married to a pd array
- use what you see best
preconditions:
- The trader already understands the individual PD arrays.
- The trader has a way of logging outcomes by array type.
detection_rules:
- 'Enumerate the candidate PD arrays: fair value gap, inversion, breaker block, order block,
  change in the state of delivery, OTE / Fibonacci.'
- 'Select exactly one, using three questions: which is easiest to see, which makes the most
  sense, how much confirmation is wanted.'
- Pair it with highs and lows / liquidity - this is stated as mandatory, not optional.
- Ignore the remaining arrays even when they are visible on the chart.
- Do not switch arrays after a losing stretch.
- 'Test of a good model: entry, stop and data collection are repeatable because they are always
  derived the same way.'
- Mark the sweep of the previous relevant high or low.
- Mark the closure through the series of candles that made that extreme.
- That pair alone licenses anticipating a continuation.
- Track opposing candles for the entries; do not add further PD arrays to the chart.
- Choose the PD array you identify most reliably; you do not need to use all of them.
- Do not adopt an array because another trader uses it.
- Study what price does at your chosen array specifically, and keep the array only if the
  logged data supports it.
- 'Ben''s own selection: breakers and balanced price ranges in, order blocks out.'
- The same principle applies to labelling schemes he has not adopted - he reads price without
  short-term / intermediate-term / long-term structure labels because he found enough consistency
  without them, and will only adopt them if his own performance changes.
invalidation:
- Not applicable - this is a process rule, not a chart pattern.
- Not applicable - this is a tooling policy, not a setup.
- Not applicable.
measurable:
- variance of entry-location definition across a trade sample (the thing he says single-array
  focus fixes)
- journal completeness / comparability before and after restricting to one array
- number of distinct markups per chart versus realised expectancy
- decision latency with a minimal versus a fully marked chart
- expectancy by PD array type for a single trader, which is the decision procedure he prescribes
- 'identification consistency: how often the same trader marks the same array on the same
  chart'
