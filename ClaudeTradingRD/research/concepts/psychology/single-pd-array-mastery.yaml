ambiguities:
- The selection criteria are subjective by design ('which is easiest for you to see'), so
  the rule cannot be applied mechanically.
- How much confirmation to require maps onto the order-of-reversal ladder but he does not
  make that mapping explicit.
- No guidance is given on when, if ever, a chosen array should be abandoned.
- The Short does not say which single PD array a beginner should pick, only that one is enough.
- It is stated as a personal preference ('for me, I don't need all of that'), not as a rule
  for others.
- '''Clean enough'' is the actual rejection test he applies to an order block on air, and
  it is purely visual.'
- No sample size is given for the point at which logged data should settle the choice.
- The advice sits in tension with his own use of a ladder of several PD array types as targets
  - the selection rule applies to entries, not to targets, but he never says so explicitly.
