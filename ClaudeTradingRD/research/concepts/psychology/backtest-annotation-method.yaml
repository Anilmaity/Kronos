id: backtest-annotation-method
name: Backtesting By Marking, Replaying And Annotating
definition: 'The study protocol AM Trades gives when asked how to backtest an unfamiliar instrument
  and how to learn how price delivers. Open a 15-minute chart, go back to a chosen day, mark
  out what you see, and then observe what happens when price returns to those areas; when
  price does return, drop to lower timeframes and study the reaction there. Annotate - write
  down what you see, take screenshots. The stated purpose is belief rather than statistics:
  you have to apply it to an actual chart to believe it, and because no two price sequences
  are identical, the exercise is training the eye on slightly different scenarios rather than
  matching what was in a video. Soft4FX is named as the tool for real-time replay, and hindsight
  study is explicitly endorsed - ''there''s no shame in going back into your charts''.'
category: psychology
status: specified
aliases:
- soft4fx
- hindsight study
preconditions:
- Historical chart data and, optionally, a replay tool.
detection_rules:
- Pick a historical day; mark points of interest on the 15-minute before advancing.
- Advance and observe what happens when price returns to each marked area.
- When price returns to an area, drop to lower timeframes and study the reaction there.
- Write down and screenshot the annotation for each observation.
invalidation:
- Not applicable - a study protocol.
measurable:
- number of annotated observations per concept before it is traded live
- hit rate of the marked areas across the studied sample
sources:
- video_id: CrUfTskOveo
  title: Stream Q & A with AM Trades  - ICT concepts
  quote: back testing is gonna be super important
ambiguities:
- No sample size, scoring method or record format is prescribed.
- Whether the replay must be blind (bar by bar) or may be done in hindsight is stated both
  ways in the same answer.
