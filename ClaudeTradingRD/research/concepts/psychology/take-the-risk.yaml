id: take-the-risk
name: Take the Risk (time passes regardless)
definition: 'Motivational, not a trading rule. Time passes no matter what you do; the only
  variable is what you do with it. Never taking risk means repeating the same thing; if you
  never take the risk you never change your circumstances. The risk need not be trading (a
  business works).

  '
