id: missed-move-no-chase
name: Missed Move / No-Chase Rule
definition: 'Once the expansion has occurred, the trade is gone and must be treated as gone.
  Entering after the move, or above/below the level that was the objective, is classified
  as a chase. The named failure loop is: a clean expansion is missed, the trader waits, tries
  to join late, gets chopped out, and then the next clean expansion happens without them.
  The stated remedy is to accept the miss and wait for the next C2 closure.

  '
variants:
  definition:
  - 'The top-down video gives the constructive half of this rule. Having missed the first
    5-minute entry he asks whether it is already too late, and answers that it is not - because
    the objective he framed the trade toward has not been reached yet. The remedy is explicit
    and is not a late market entry: go back out to the structure timeframe and wait for a
    NEW setup there (a retrace into the order block, a sweep and a closure), then drop back
    down. He supports the judgement structurally by noting that a fresh opposing candle has
    formed and should hold price up while it trends to the highs.'
category: psychology
status: contested
aliases:
- you missed it
- don't chase
- don't trade after expansion
- let's say I miss this trade
preconditions:
- An expansion leg has already delivered toward its objective.
- An entry was missed while the framed objective is still unreached.
detection_rules:
- If price is already beyond the range high/low that framed the trade, do not enter in that
  direction.
- If the daily/4H candle has already produced its typical range, do not initiate in its direction.
- If a target has already been taken, do not enter toward it.
- 'Test whether the trade is gone: has the objective the trade was framed toward already been
  reached? If not, it is not too late.'
- Do not enter late at market; return to the structure timeframe and wait for a new setup
  - a retrace into the order block, a sweep, and a closure.
- 'Supporting structural check: a newly formed opposing candle is expected to hold price while
  the move continues to the objective.'
- If the objective HAS been reached, there is no continuation to seek (see the exhaustion
  rules elsewhere in the corpus).
invalidation:
- A new phase of price forms with a new swing and a new continuation - a fresh setup, not
  a chase.
- The objective is reached - the idea is finished, not re-entered.
measurable:
- Expectancy of entries taken beyond the framing range boundary vs inside it.
- outcome of second and third entries taken after a missed first entry, conditional on the
  objective being unreached
