ambiguities:
- The boundary between 'a new phase of price' (tradeable) and 'a chase' (not) is judgemental;
  the only stated marker is a new swing plus a new continuation.
- '''Objective not yet reached'' is the only stated gate; distance remaining relative to the
  average daily range is not considered here, though other units make that a filter.'
- No cap is given on how many re-entries a single idea may generate - the same example produces
  at least three.
