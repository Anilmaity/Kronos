ambiguities:
- Adds nothing beyond the existing entry; same wording as m8xcjkOuBHU, apparently a clip of
  it.
- No sample size is named as sufficient; 'n to approach infinity' is rhetorical.
- This coexists with his own no-trade filters (avoid consolidation, avoid post-expansion)
  — when a setup 'meets the model' but he declines it on context, the classification of that
  skip is not addressed.
