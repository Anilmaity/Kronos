id: loss-is-not-a-bad-trade
name: A Loss Is Not A Bad Trade (data collection framing)
definition: 'Short cut from the same Q&A answer already in the library: a bad trade is not
  following rules; a rule-following loss is just the strategy; n must approach infinity before
  the distribution means anything; three losses in a row does not make the win rate zero;
  fear of losses causes undertrading; view each qualifying setup as data collection.

  '
variants:
  definition:
  - 'His answer to a viewer who described undertrading because he was "only taking bad trades":
    a loss does not equal a bad trade — a bad trade is one that did not follow the rules.
    A trade that met the model and lost is simply the model being followed. He then makes
    the statistical version of the point: you need n to approach infinity before the distribution
    of outcomes means anything, three losses in a row does not make the win rate zero, and
    until enough trades are collected the sample is just random dots. The prescription is
    to stop scoring individual trades as win or lose and to treat each qualifying setup as
    a data point that must be collected.

    '
category: psychology
status: contested
aliases:
- a bad trade is not following rules
- n approaching infinity
preconditions:
- A defined model with rules that can be checked after the fact.
detection_rules:
- If the setup meets the model, take it, to collect the data point.
- Classify each trade as rule-following or rule-breaking, not as good or bad by outcome.
- A rule-following loss is not a defect and requires no model change.
- Do not re-estimate win rate from a handful of trades — expect runs of losses within a normal
  distribution.
- If the setup meets the model, take it, in order to collect the data point.
invalidation:
- Not applicable — this is a classification rule.
measurable:
- share of trades that were rule-breaking versus rule-following, and the R of each set
- sample size at which the running win rate stabilises
