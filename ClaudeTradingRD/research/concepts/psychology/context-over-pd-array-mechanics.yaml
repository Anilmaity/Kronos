id: context-over-pd-array-mechanics
name: PD Arrays Fail On Context, Not On Mechanics
definition: 'A process claim about why traders struggle with order blocks and other PD arrays.
  The array itself is trivially defined - an order block is just an opposing closed candle
  - so studying the array in more depth cannot fix a poor hit rate. What must be learned instead
  is WHEN to apply it: PD arrays work when the market is expanding, and the same array applied
  in the wrong phase produces the appearance of a broken tool.

  '
category: psychology
status: specified
aliases:
- knowing when to apply it
preconditions:
- A trader is attributing losses to the PD array rather than to the context in which it was
  used.
detection_rules:
- Before evaluating any lower-timeframe price signature, establish the weekly narrative, the
  daily phase of price delivery and the economic calendar.
- Only apply PD-array entries when on side with a move that is expanding, not inside consolidation.
- If PD arrays are failing repeatedly, treat that as evidence the context filter is wrong,
  not the array definition.
invalidation:
- Not applicable - this is a process rule, not a setup.
measurable:
- hit rate of an identical order-block entry rule split by daily phase (expansion versus consolidation
  versus retracement)
- average drawdown endured per trade in each phase
- proportion of profit-target hits in each phase
sources:
- video_id: QmGJFxfSHxM
  title: AM Trades | Blending The Economic Calendar, Daily Chart, & Weekly Profiles
  quote: an order block is just an opposing closed candle
ambiguities:
- The claim is stated as experience, not measured - no split-by-context statistics are shown.
- The definition of the expansion context that makes arrays 'work perfectly' is the same unquantified
  'large range' used elsewhere in the video.
