id: indicator-quiz-template-drill
name: Indicator Quiz-Template Drill (mark up, then check against the indicator)
definition: 'A practice drill for learning the fractal model with his indicator, described
  as how his brother learned. Save two TradingView indicator templates: ''all'' (indicator
  fully on) and ''quiz'' (all elements turned off). On the quiz template, hand-mark candle
  2 closures, the CISD, the EQ and the other model elements; then switch to ''all'' and check
  whether the marks match the indicator. He calls this reverse engineering.'
category: psychology
status: specified
aliases:
