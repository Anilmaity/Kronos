id: no-plan-no-trade
name: No Plan Equals No Trade
definition: 'A pre-trade checklist stated as a hard gate. Before entry the trader must be
  able to answer: why am I getting in, why am I getting out, where is the stop, how much am
  I risking per trade, and how will the trade be managed (scale out or not, trail the stop
  or not, managed off the chart or off a dollar amount). An additional inversion is required
  - ask ''why shouldn''t I get in'', explicitly because the setup looking perfect is not evidence.
  Absent those answers, the position is not taken. The argument given for why traders skip
  this is that entering without a plan is an implicit claim to know what the market will do.'
category: psychology
status: specified
aliases:
- proper planning prevents poor performance
- why shouldn't I get in
preconditions:
- A candidate setup identified.
detection_rules:
- 'Record before entry: reason for entry, reason for exit, stop location, risk amount, and
  the management plan.'
- Ask the inverse question - what is the reason not to take this trade - before entering.
- If any element is unanswered, do not take the trade.
- Review the trade afterwards against the written plan.
invalidation:
- Not applicable - process gate.
measurable:
- expectancy of planned vs unplanned trades in the same journal
- share of losing trades that were taken without a recorded plan
sources:
- video_id: kG8BuEPVppo
  title: Psychology & Best Practices with STRATalorian
  quote: no plan equals no trade
- video_id: kG8BuEPVppo
  title: Psychology & Best Practices with STRATalorian
  quote: if you review your trades then you can improve as a Trader
ambiguities:
- No plan template or storage format is prescribed.
- '''How will you manage the trade'' is left open (scale, trail, chart-based or dollar-based
  are listed as options with no selection rule).'
