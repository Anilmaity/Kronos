ambiguities:
- This Short re-cuts uW55Tuk-ngY, which the library already cites with the same closing line.
  It adds no new rule.
- The Short does not say which timeframe's closure governs.
- It is offered as a common diagnosis ("I could be wrong", "most of the time"), with no evidence
  attached.
- Speaker attribution by turn-taking (Nick is the one entering).
- The intracandle CISD (ic-cisd) is an explicit exception in his own model - it fires inside
  a higher-timeframe candle - so 'wait for the closure' means the closure of the timeframe
  the rule is written on, not of every timeframe.
- He also says elsewhere to reverse engineer before ever backtesting, but does not define
  what reverse engineering means procedurally.
