id: wait-for-closure-discipline
name: Backtest-to-Live Gap Comes From Acting Before the Candle Closes
definition: 'Asked why trading only feels good in backtesting, he gives two causes. In a backtest
  you let the candles close: you skip ahead until the close and then take the trade. You also
  leave the trade alone and skip forward to see whether the stop or the TP is hit. Live, traders
  make decisions on active candles before they close and actively manage trades by moving
  the stop, and both break the strategy. His remedy, hedged as his usual diagnosis, is to
  stop messing with your trades and wait for your closures.

  '
variants:
  definition:
  - 'Repeated live at Nick when he entered on the 15-second before the 5-minute candle closed:
    wait for the five-minute closure; only once the 5-minute closes does a valid model exist.'
  - 'His stated single most common diagnosis for a trader who backtests well and loses live:
    in the backtest every candle is already closed, so the rules are applied to closed candles;
    live, the trader acts on a still-forming candle and anticipates a closure that never happens.
    The corrective is to wait for the actual closure in live trading, exactly as the backtest
    did.'
  - 'Restated with a second cause: besides acting on unclosed candles, live traders actively
    manage trades (moving the stop) whereas in backtests they skip forward to stop or target.
    Remedy: stop interfering with trades and wait for closures.'
category: psychology
status: contested
preconditions:
- n/a
detection_rules:
- Evaluate entries on closed candles only, as the backtest did.
- After entry, do not move the stop or intervene before the stop or target is hit.
- No entry on the execution timeframe until the paired higher-timeframe candle has closed.
- Every rule in the model is evaluated on a closed candle of the relevant timeframe.
- A still-forming candle produces no signal, however it currently looks.
- The same closure discipline must hold in backtest and live, or the two are not measuring
  the same system.
- Evaluate rules on closed candles only.
- Do not move the stop or intervene between entry and stop/target, mirroring the backtest.
invalidation:
- n/a
measurable:
- win rate of pre-close vs post-close entries
- difference in signal count and expectancy between a closed-bar detector and one allowed
  to fire intrabar
