id: prop-account-over-demo
name: Learn On A Cheap Prop Account, Not A Demo
definition: 'His answer to when to move from demo to live: he never demo traded and is not
  a fan of demo, because the hard part of trading is the emotional side, which demo lacks.
  Once the model is understood, buy a cheap prop-firm account (his example: about $60) to
  experience real emotional attachment with capped risk, instead of risking a personal account
  (his example: $1,500) to learn the same lessons. His brother blew a prop account by revenge
  trading without a stop and learned the lesson at capped cost.'
category: psychology
status: specified
detection_rules:
- After learning the model, replace demo practice with a low-cost prop evaluation as the first
  live-emotion environment.
- Treat the evaluation fee as the maximum cost of a learning mistake.
