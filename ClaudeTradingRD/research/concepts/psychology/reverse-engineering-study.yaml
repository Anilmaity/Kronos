id: reverse-engineering-study
name: Reverse Engineering (hindsight study, not backtesting)
definition: 'His prescribed next step after the free course, and how he built his own model
  (about two years). Distinguished from backtesting: backtesting as people do it is replaying
  candle by candle and guessing; reverse engineering is looking at completed price in hindsight,
  finding where you could have got on side of an expansion, which timeframes showed a reversal
  then continuation, whether it gave enough risk-to-reward, and where the draw on liquidity
  was - collecting ''signatures in price''.'
category: psychology
status: underspecified
detection_rules:
- Go to a completed expansion in hindsight (no replay, no guessing).
- Ask how you could have got on side; check all timeframes for a reversal then continuation.
- Check R:R and the draw on liquidity; record the signature.
