id: wait-for-candle-close
name: Wait For Candle Close
variants:
  name:
  - Wait For The Candle To Close (no intracandle decisions)
  definition:
  - 'The stated reason his live behaviour looks passive: the whole model is built on closures,
    so no decision can be made until the candle closes. He uses this to diagnose the common
    complaint that backtesting feels smooth while live trading feels frantic — in a backtest
    you are mechanically stepping candle by candle and only ever seeing closes, while live
    you are watching the same candle oscillate and predicting where it will close. His fix
    is to stop predicting the close and, if that is hard, to move up to the 15-minute where
    there are fewer fluctuations and there is visibly nothing to do until the bar completes.

    '
  - 'Restated while reading a 1-minute range low live in the breakouts video: be patient and
    let candles close; do not decide before the closure.

    '
definition: 'Entering a short into a 3-minute fair value gap while the current 3-minute candle
  is bullish: either wait for that candle to turn into a reversal and trade the following
  one, or let it close higher and wait for the next candle to react. The next candle''s wick
  decides it - a small wick then trading lower can expand; too high a wick makes expansion
  less likely.

  '
category: psychology
status: contested
aliases:
- bullish candle, be patient for the next one
- let it close
- based off the closures
preconditions:
- A model whose triggers (candle 2 / candle 3 closure, CISD) are defined on closes.
detection_rules:
- If the current execution-timeframe candle is against the idea, do not enter until it closes.
- After a close against the idea, require the next candle to react (small wick, trade in the
  idea's direction).
- If the next candle makes a large wick against the idea, downgrade the expansion expectation.
- Evaluate the model only on completed bars; take no action from an unclosed bar's current
  print.
- Do not infer the close of a bar in progress — the same bar can close bullish, bearish or
  as a doji within seconds.
- If intracandle watching causes forced entries, move the execution timeframe up (e.g. to
  15-minute) so the wait is explicit.
- 'Treat the live sequence as identical to the backtest sequence: one decision per closed
  bar.'
- Evaluate reversal vs breakout only on closed candles.
invalidation:
- Not applicable — this is an execution discipline.
measurable:
- Expansion rate of the next 3m candle by wick size after a counter-direction 3m close.
- outcome of bar-close-only entries versus intrabar entries on the same signal set
- count of entries taken before bar close and their R
