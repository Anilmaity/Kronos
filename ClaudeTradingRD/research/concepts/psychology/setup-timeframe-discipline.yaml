id: setup-timeframe-discipline
name: Watch Only The Timeframe Your Setup Lives On
definition: A monthly bearish view is irrelevant to a 3-minute trade held 15-30 minutes; higher-timeframe
  opinion matters only when the entry timeframe is itself high (e.g. 4-hour).
variants:
  definition:
  - 'If the setup and the stop were derived from a daily chart, the trader has no business
    watching the five-minute chart during the trade. The failure mode is spelled out: three
    to eight lower-timeframe candles running against the position trigger panic selling even
    though price is nowhere near the stop defined on the setup timeframe, and the trade then
    reverses and runs in the intended direction without the trader. The rule is stated as
    part of a broader simplification argument - fifteen indicators produce analysis paralysis,
    and since most indicators are derived from price, volume and time, a trader can always
    assemble a set that confirms a pre-formed thesis.'
category: psychology
status: contested
aliases:
- understand your time frame
preconditions:
- A setup whose entry, stop and target were defined on a specific timeframe.
detection_rules:
- Ignore higher-timeframe opinions beyond the holding horizon of the entry timeframe; a 3-minute
  trade held under an hour does not consult the monthly.
- Identify the timeframe on which the setup and the stop were defined.
- Do not monitor timeframes below it while the position is open.
- Treat an adverse run of several lower-timeframe candles as irrelevant while the setup-timeframe
  stop is untouched.
invalidation:
- Not applicable - behavioural rule.
measurable:
- rate of manual exits before the stop, split by whether a lower timeframe was being watched
- difference between realised exit and the planned stop/target on those trades
sources:
- video_id: 4rNC3QXxC20
  title: New York Open Live Q&A
  quote: If you're trading a three minute time frame, why are you caring?
- video_id: 4rNC3QXxC20
  title: New York Open Live Q&A
  quote: If you're trading a 4 hour as an entry, sure
- video_id: kG8BuEPVppo
  title: Psychology & Best Practices with STRATalorian
  quote: trading a daily setup you have no business watching the five minute chart
ambiguities:
- No rule is given for legitimate lower-timeframe use, such as scaling out or managing an
  exit.
- The rule is stated for a daily setup only; how far below the setup timeframe is 'too low'
  for an intraday setup is not addressed.
