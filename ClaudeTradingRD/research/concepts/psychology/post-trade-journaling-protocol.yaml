id: post-trade-journaling-protocol
name: Post-Trade And Post-Session Journaling Protocol
variants:
  name:
  - Review Every Trade, And Journal What Is Happening Outside Trading
  definition:
  - 'Every trade is reviewed after the fact, winners included, and the review is against the
    plan written before entry. The guest offers this as the one guarantee he is willing to
    make - that reviewing trades produces improvement - and frames refusal to review as refusal
    to accept responsibility for the outcome. The journal must also carry non-trading context:
    what is going on in the trader''s life and career, on the argument that trading will not
    solve non-trading problems and that unresolved emotion surfaces in execution. The governing
    metaphor is aviation: the journal is the flight path, a small deviation caught early is
    cheaply corrected, and a long stretch flown in the wrong direction takes time to undo.'
  - 'After every trade: post a chart markup, then record how you felt before the trade, during
    the trade (hand on the mouse, staring at the screen) and after it. The "after" entry is
    written later in the day rather than immediately, on the reasoning that if a loss still
    registers twelve hours later that is the thing worth working on. Then record what was
    done well (limits set properly, stop and target placed properly, runners held) and what
    was done badly (taking full profit at 1R, breaking the risk protocol). A post-session
    note is written every session whether or not a trade was taken. Two diagnostics are attached
    to in-trade anxiety: either the position is oversized, or the entry technique has not
    been back-tested enough to have muscle memory.

    '
definition: 'Two guests give near-identical journaling protocols, with one distinctive addition
  each. $niper logs pair, date, position, win / break-even / loss, session, confluence, FEELINGS
  DURING THE TRADE, R multiple and the chart - and argues the emotional column is the point,
  because it lets you compare the confluences present on a confident trade against those on
  a skeptical one. Ben logs every trade with before-and-after screenshots, instrument, time,
  direction and the entry mechanics (which side of liquidity was taken, the structure shift,
  whether the fair value gap was in premium or discount), and says the purpose is to find
  anomalies inside your own trading and to build the recognition that lets you hold a winner.

  '
category: psychology
status: contested
aliases:
- trade journal template
- before and after screenshots
- your trade journal is your flight path
- what is measured can be improved upon
- how to journal a trade
preconditions:
- A trade has been taken (Ben extends the protocol to demo trades).
- A written pre-trade plan exists to review against.
- A trading session has completed (traded or not).
detection_rules:
- '$niper''s columns: pair, date, position, win/break-even/loss, session, confluence, feelings
  during the trade, R, chart screenshot.'
- '$niper''s rule: record the emotional state (confident / skeptical / nervous) alongside
  the confluences that produced it, and compare across trades.'
- 'Ben''s columns: before and after screenshots, instrument, time, direction, entry mechanics
  - sell-side or buy-side taken, market structure shift, fair value gap created in premium
  or discount, OTE.'
- 'Ben''s rule: journal demo trades too, before going live.'
- 'Ben''s stated purpose: dissect it, make it systematic, and look for anomalies inside your
  own trading.'
- Review every trade taken, winners included, against the plan written before entry.
- Record what is happening outside trading - life, career, state of mind - in the same journal.
- 'Use the review to classify the cause of a losing run: the trader, the system, trade management,
  market conditions or the broker.'
- If not currently in a fit state of mind, do not trade at all that session.
- Post a chart markup for every trade taken.
- Record feelings before, during and after; write the 'after' entry later in the day.
- Record what was done well and what was done badly, referencing the model's own rules.
- Write a post-session note every session, including no-trade sessions.
- If in-trade anxiety was present, check for oversizing first and insufficient back-testing
  second.
invalidation:
- Not applicable.
- Not applicable - process rule.
measurable:
- correlation between the logged emotional state and trade outcome
- outcome grouped by logged entry mechanic, which is the anomaly search Ben describes
- journal completion rate against trades taken
- expectancy of trades taken on days flagged as poor state of mind vs the rest
- journal completion rate
- correlation between logged anxiety and position size / realised R
