ambiguities:
- Neither gives a review cadence - when the log is read back, or against what benchmark.
- $niper's emotional scale is informal (confident / skeptical / nervous) with no fixed vocabulary.
- Ben admits he did not journal for a long time and frames the protocol as a correction, not
  as something he has measured.
- $niper's template is credited to another trader on Twitter, unnamed in the video.
- No template, cadence or storage format is prescribed.
- This conflicts with the mature-stage policy recorded elsewhere in the corpus of journalling
  only losers and emotional trades; the two are different traders' policies, not one speaker
  contradicting himself.
- No template or storage format is specified.
- The anxiety-to-cause mapping (oversizing or under-testing) is offered as personal observation,
  not evidence.
