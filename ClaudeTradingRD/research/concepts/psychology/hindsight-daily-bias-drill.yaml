id: hindsight-daily-bias-drill
name: The Hindsight Daily-Candle Drill
definition: 'His prescribed practice routine for anyone who says they struggle with market
  direction: go to the daily chart and, day by day, ask whether you could reasonably have
  anticipated what the next daily candle would do. He says the easiest form of the drill is
  to look only for candle 2 and candle 3 closures and then to call the following day, repeated
  over and over until the read is automatic — that repetition is where bias comes from. The
  wider sequence he gives for building confidence in the model is hindsight testing first,
  then forward testing; backtesting is framed as a tool for learning the model, not for validating
  it, and he says he no longer backtests because he already knows his model.

  '
category: psychology
status: specified
aliases:
- hindsight test on the daily chart
- anticipate the next daily candle
preconditions:
- A chart with daily history and the ability to step forward one candle at a time.
detection_rules:
- Step the daily chart forward one candle at a time.
- For each day, mark whether it produced a candle 2 or candle 3 closure.
- Call the following day's direction from that closure before revealing it.
- Repeat until the call is automatic; then move to forward testing.
invalidation:
- Not applicable — this is a study method.
measurable:
- hit rate of next-day direction calls from C2/C3 closures over a replay sample
- improvement in that hit rate with repetition
sources:
- video_id: m8xcjkOuBHU
  title: New York Open Live Q&A
  quote: hindsight test on the daily chart. Practice only trying to understand the next daily
    candle.
- video_id: Je7cd9HJUBE
  title: New York Open Live Q&A
  quote: back testing is to learn the model in my opinion
ambiguities:
- No sample size or pass criterion is given for the drill.
- The stance that backtesting is only for learning the model conflicts with using a backtest
  to measure edge; he never claims to have measured his own.
- The drill covers direction only; it says nothing about how to practise execution.
