id: overtrading-gate
name: Higher-Timeframe Reason As Overtrading Gate
definition: 'Step one of the model, stated as the cure for overtrading: no entry without a
  higher-timeframe bias or reason. He estimates that in a typical overtrader''s journal only
  about 2 in 10 trades would have one. The corollary stated repeatedly across all four streams
  is that on most days only one instrument and one idea are legible, and the correct response
  to an illegible chart is to take nothing and leave the desk.

  '
category: psychology
status: specified
aliases:
- step one get a bias
- how to stop overtrading
preconditions:
- A trade is being considered.
detection_rules:
- Before entry, state the higher-timeframe reason (bias, objective, framework).
- If no reason can be stated, do not enter.
- 'Audit: in the journal, tag each trade with its higher-timeframe reason; untagged trades
  are overtrades.'
- Per day, expect at most one A+ idea across the watchlist; take it or take nothing.
invalidation:
- n/a
measurable:
- Proportion of journalled trades carrying a stated HTF reason.
- Expectancy split by reason-present vs reason-absent.
