ambiguities:
- No minimum sample size is given before a category can be called a loser.
- He does not address the case where removing the losing category also removes most of the
  frequency.
- '"Two months of logged data" is accepted as enough to start the exercise, without comment.'
- The diagnoses are made from one-line viewer messages and he says explicitly he is guessing;
  the mapping from symptom to cause is not evidence-based.
- '''Stop going to break-even'' is stated flatly here, which contradicts the break-even and
  stop-migration rules taught elsewhere in the corpus (move the stop only after a new protected
  swing forms).'
- '''Correct position size'' is quantified only through the prop-drawdown tiers given in the
  same stream.'
- The list of root causes is presented as exhaustive in practice but is not claimed to be.
- Correct sizing is never quantified anywhere in this unit.
