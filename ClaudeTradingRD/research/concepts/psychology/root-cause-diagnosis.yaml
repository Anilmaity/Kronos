id: root-cause-diagnosis
name: Root-Cause Diagnosis for Repeated Account Failure
variants:
  name:
  - Root-Cause Diagnosis
  definition:
  - 'Short restatement of the standing answer to a viewer who has followed for two years without
    success: he cannot know the individual''s problem, so the trader must find the root cause
    that prevents progress - usually tilt, oversizing, revenge trading or not following a
    model - and then either change it or quit; anything else wastes the trader''s own time.'
  - 'The organising frame of the longest teaching block in this unit. Rather than answering
    "what should I do", he insists the trader identify the root cause of the failure and then
    either change or quit — anything else is wasting time. In the m8xcjkOuBHU stream he then
    works through viewer problems live and gives a fixed fix for each: stopped out then the
    market goes → move up a timeframe or two; can''t stop after a loss / revenge trading →
    one trade a day max; breached account "because of market situations" → take accountability,
    limit trades and size correctly; two months without passing → probably fear and too-small
    size, so winners and losers mean nothing; "I''ve learned so many strategies" → you have
    knowledge and no strategy; hit break-even then the trade runs → stop going to break-even;
    can''t hold to full take-profit → fear, so set a 2R exit and do nothing; struggles with
    direction → the hindsight daily-candle drill. Asked whether a struggling trader should
    switch strategy, the answer is no: the strategy is almost never the problem.

    '
  - 'For traders who repeatedly blow accounts or fail payout phases, he refuses generic advice
    and requires identification of the root cause first, from a short list: tilt or overtrading,
    absence of a system, or oversizing. Each cause maps to a specific fix: a hard limit of
    one trade per day for tilt and overtrading, learning a model (any model) for absence of
    a system, and correct sizing for oversizing. He frames the outcome as binary: make a change
    or quit, because repeating the cycle wastes years.

    '
  - 'Live answers to ''I can''t handle a loss'': change or quit. Changing means take the loss,
    feel it, and do not do anything dumb after it; anyone who sugarcoats that is not helping.
    On psychology in general he requires the specific problem first because ''psychology''
    is a blanket term; greed is usually holding trades too long, so take trades at the target.'
  - 'To a viewer stuck after three years he asks which it is: a strategy issue (no strategy),
    tilt/revenge trading, or a personal issue of not following what is needed - before giving
    advice. Prescription: one free strategy, follow it, ignore social media.'
  - 'His answer to revenge trading / tilt: quit trading or make a change - repeating the same
    behaviour expecting a different result wastes money and time. Paired with rejecting a
    victim mentality.'
  - 'Restated to a viewer who blew five accounts: identify whether tilt, revenge trading,
    oversizing or trading without a model caused it; the answer is binary - change or quit.'
definition: 'His standing answer to "I keep losing with your model". The instruction is diagnostic,
  not additive: work out what your losing trades have in common and what your best trades
  look like, then stop taking the losing category - his worked illustration being a trader
  who keeps trading the reversal and losing, whose fix is to stop trading the reversal. Asked
  how to improve a 40% win rate, he refuses the framing of adding winners and says the work
  is removing losers, since dropping a couple of losing categories moves the win rate a long
  way on its own. He also refuses to let evaluation-account failure be treated as a model
  problem when the person has no model - stop buying evaluations and go learn one first.

  '
category: psychology
status: contested
aliases:
- remove the losing trades
- change or quit
- find the root cause
- why do I keep blowing accounts
- make change or quit
preconditions:
- A logged trade history exists.
- A trader has been failing to progress over an extended period (two years in the question).
- A repeated, identifiable failure pattern across accounts or sessions.
- A repeated pattern of account failure or failed payouts exists.
detection_rules:
- Group the losing trades and find what they have in common.
- Identify what the best trades look like.
- Stop taking the losing category rather than adding new setups or filters.
- If there is no defined model at all, stop trading evaluations until there is one.
- Name the root cause first; the default candidates are tilt, oversizing, revenge trading,
  not following a model.
- 'Outcome is binary: make a change that addresses the cause, or quit.'
- Name the root cause before choosing a fix; the listed defaults are tilt, oversizing, revenge
  trading and not following a model.
- Stopped out then price runs to target → raise the execution timeframe by one or two.
- Cannot stop after a loss → hard cap of one trade per day.
- Blaming market conditions → treat as forcing trades; limit trade count and correct position
  size.
- Long-run failure to pass with tiny outcomes → size is too small for winners to matter.
- Many concepts, no results → there is no strategy; adopt one and follow it.
- Trades hit break-even then run → stop moving to break-even.
- Cannot hold to target → place a fixed ~2R exit and do not manage.
- Do not switch strategy as a response to underperformance.
- 'Classify the cause: tilt/overtrading, no system, or oversizing.'
- 'Tilt or overtrading: impose a maximum of one trade per day (or a max-loss limit).'
- 'No system: adopt and follow a defined model.'
- 'Oversizing: reduce size to a correct level.'
- If the rule is then broken, the problem is rule-breaking, not the market.
- Classify the failure as strategy (none/inconsistent), tilt/revenge trading, or personal
  non-compliance before prescribing a fix.
- Diagnose blown accounts against tilt, revenge trading, oversizing, no model.
invalidation:
- n/a
- Not applicable.
- Not applicable — this is a diagnostic procedure.
measurable:
- win rate before and after removing the identified losing category
- share of losses concentrated in one setup type
- recurrence rate of a named failure after its prescribed fix
- R difference before and after each single fix (timeframe raise, one-trade cap, no-break-even)
- trade count per day and loss per day before and after imposing the limit
