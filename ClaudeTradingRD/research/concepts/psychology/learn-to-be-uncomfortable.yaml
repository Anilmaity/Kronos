id: learn-to-be-uncomfortable
name: Learn To Be Uncomfortable (do not trail out of give-back fear)
definition: 'Answering "how to fix early exit / do you trail stop loss", he locates the problem
  not in being stopped out but in a trade that moves toward TP and then comes back against
  you. Fast stop-trailing to remove that discomfort only lets the fear remain. The trader
  controls entry price, stop loss and take profit, and has zero control over what happens
  between them; the fix is to place the trade and learn to be uncomfortable rather than adjust
  over the fear.

  '
category: psychology
status: specified
aliases:
- how to fix early exit
- fear of giveback
preconditions:
- Trader exits early or trails rapidly after a trade moves into profit.
detection_rules:
- Set entry, stop and target; do not tighten the stop as a response to fear of give-back.
