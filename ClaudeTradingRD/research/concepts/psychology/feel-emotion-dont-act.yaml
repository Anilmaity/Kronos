id: feel-emotion-dont-act
name: Feel the Emotion, Do Not Act On It
definition: 'Blowing several accounts in a day is a management issue - tilt and sizing - not
  a strategy issue. The way to overcome psychological issues: when you are about to revenge
  trade or size up to win a loss back, don''t. He diagnoses unprofitability as either no strategy
  or discipline/psychology, and uses a video-game analogy: after a loss you respawn, you do
  not quit to the main menu and rebuild your whole loadout.'
variants:
  definition:
  - 'He rejects the common instruction to feel no emotions while trading as impossible, and
    relocates the discipline to the gap between feeling and acting. The change a trader must
    make is to feel the emotion and not act on it; a small realised loss taken while stepping
    away (his live example: a viewer who felt tilt, closed the trade and moved to paper at
    minus one hundred dollars) is a success because it preserves the ability to trade the
    next day.

    '
category: psychology
status: contested
aliases:
- you cannot be a robot
- tilt management
preconditions:
- n/a
- The trader notices an emotional impulse during or after a trade.
detection_rules:
- After a loss, do not increase size or immediately re-enter to recover it.
- Do not change the strategy after a single loss.
- Identify the impulse (revenge entry, size increase, forcing a trade in unclear conditions).
- Do not act on it; close down or move to simulation instead.
- Judge the session by whether the impulse was acted on, not by the profit and loss.
invalidation:
- n/a
measurable:
- n/a (untestable)
- count of impulse events and how many were acted on per week
