id: pattern-trading-error
name: Pattern Trading (the error he corrects)
variants:
  name:
  - Pattern Trading Error
  definition:
  - 'Two live restatements. A fair value gap forming does not make his bias bearish - he does
    not pattern-trade. And asked whether an intra-candle change in state of delivery is better
    with no bias, he answers that with no bias you should not take entries at all; dropping
    to lower timeframes until a bias appears just gets you chopped up - go to the higher timeframes
    or stay out.

    '
  - 'The failure mode he names most often: seeing a clean lower timeframe formation and acting
    on it with no higher timeframe context. He demonstrates it live - a structurally valid
    V-shape reversal with a change in state of delivery that he refuses because there is no
    model and no bias behind it, and which then fails. The prescribed fix is mechanical rather
    than motivational: do not open the lower timeframe until you have a higher timeframe reason
    to be there.

    '
  - 'The top-down video opens with the error worked as a chart, not as an argument. A textbook
    bullish order block forms - price takes out a low and closes through the series (or single)
    candle that made it - and the retest is taken with the stop on the low. The stop is run.
    He says he sees many people doing this and wondering why it happens, and gives the diagnosis:
    the higher-timeframe analysis was not considered. On the higher timeframe a high had just
    been swept and a bearish engulfing candle had closed below the low, so the next candle
    was expected to continue lower. The correction is stated as a counterfactual - if he were
    not trading it like a pattern, he would look only for bearish setups inside that bearish
    expansion candle, which puts him in the mirror-image bearish order block at the same place.'
  - 'Viewer-requested definition: pattern trading is following some pattern and trading it
    every time no matter what, never doing higher-timeframe analysis. He rejects the idea
    of reducing the market to a single always-traded pattern - discretion and higher-timeframe
    analysis are required, otherwise people would just run bots.'
  - 'Viewer: sometimes C3 delivers to the C1 extreme, sometimes it reverses after engaging
    the C2 extreme - what confluence avoids pattern trading? His answer: only higher-timeframe
    bias. Aligning the model with the HTF bias removes the expectation that C3 will react
    like that.'
  - 'Example: a clean 4H bullish candle-2 closure is rejected because the framework is a consolidation
    range whose high is being run; citing an OB or a closure without that logic is pattern
    trading.'
  - Asked whether his indicator's patterns can be traded on their own 'at least 90% of the
    time', he answers no - you have to align with something; taking the printed patterns alone
    will not work.
  - 'Restated: the protocol for entering without a bias is to have a bias first; otherwise
    it is pattern trading.'
definition: 'The single most repeated correction in these four streams. A viewer describes
  checking for a higher-timeframe fair value gap plus a candle 3 closure and is told that
  is just pattern trading - you cannot pick a fair value gap at random, see a closure and
  call it a setup; you still need an idea of what you want price to do. He accepts that a
  live formation is technically a continuation and still refuses it because there is no higher-timeframe
  bias behind it, and states the general form: being right about direction is not a reason
  to trade. He generalises it to the entry model itself - the entry pattern matters far less
  than the higher-timeframe framework, and he offers to show that the same trade could have
  been framed as an inversion fair value gap instead with no difference.

  '
category: psychology
status: contested
aliases:
- I don't pattern trade stuff
