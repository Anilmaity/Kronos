id: pattern-trading-error
name: Pattern Trading (the error he corrects)
definition: 'The single most repeated correction in these four streams. A viewer describes
  checking for a higher-timeframe fair value gap plus a candle 3 closure and is told that
  is just pattern trading - you cannot pick a fair value gap at random, see a closure and
  call it a setup; you still need an idea of what you want price to do. He accepts that a
  live formation is technically a continuation and still refuses it because there is no higher-timeframe
  bias behind it, and states the general form: being right about direction is not a reason
  to trade. He generalises it to the entry model itself - the entry pattern matters far less
  than the higher-timeframe framework, and he offers to show that the same trade could have
  been framed as an inversion fair value gap instead with no difference.

  '
variants:
  definition:
  - 'The failure mode he names most often: seeing a clean lower timeframe formation and acting
    on it with no higher timeframe context. He demonstrates it live - a structurally valid
    V-shape reversal with a change in state of delivery that he refuses because there is no
    model and no bias behind it, and which then fails. The prescribed fix is mechanical rather
    than motivational: do not open the lower timeframe until you have a higher timeframe reason
    to be there.

    '
  - 'The top-down video opens with the error worked as a chart, not as an argument. A textbook
    bullish order block forms - price takes out a low and closes through the series (or single)
    candle that made it - and the retest is taken with the stop on the low. The stop is run.
    He says he sees many people doing this and wondering why it happens, and gives the diagnosis:
    the higher-timeframe analysis was not considered. On the higher timeframe a high had just
    been swept and a bearish engulfing candle had closed below the low, so the next candle
    was expected to continue lower. The correction is stated as a counterfactual - if he were
    not trading it like a pattern, he would look only for bearish setups inside that bearish
    expansion candle, which puts him in the mirror-image bearish order block at the same place.'
category: psychology
status: contested
aliases:
- I don't pattern trade stuff
- no framework, no trade
- pattern trading
- no context trading
- going to the lower timeframe too early
- trade it like a pattern
preconditions:
- A recognisable pattern (fair value gap, candle closure, continuation) is present on the
  chart.
- A lower timeframe formation exists that would look tradeable in isolation.
- A valid-looking lower-timeframe pattern exists.
detection_rules:
- Before taking any pattern, require a higher-timeframe framework and a stated expectation
  for what price should do.
- A candle closure at a fair value gap chosen without that context is pattern trading; skip
  it.
- Being directionally right without a framework is not a reason to enter.
- Do not swap entry models looking for an edge - the framework, not the entry pattern, is
  what carries it.
- 'Before dropping timeframes, require a higher timeframe reason: a candle two / candle three
  closure aligned with the 4-hour, or another framework element.'
- If the higher timeframe gives nothing, stay on the 4-hour or hourly and wait for the next
  candle boundary (e.g. 10:00 a.m.).
- A formation with correct structure but no model behind it is not a trade - he counts 'there's
  no model' as a sufficient veto even when the CISD is present.
- When the daily is not obvious, going lower makes it worse, because a non-obvious daily generally
  means consolidation.
- Before taking any lower-timeframe pattern, read the higher-timeframe candle it sits inside.
- Inside a higher-timeframe bearish expansion candle, only bearish setups are permitted; the
  bullish pattern at the same location is refused even though it is structurally valid.
- 'The named symptom of the error: the stop is placed on the low that the pattern says should
  hold, and price runs straight through it.'
- The correction is directional filtering, not a different entry pattern - the same order-block
  mechanics are then applied to the opposing side.
invalidation:
- No higher-timeframe framework - no trade, regardless of how clean the pattern looks.
- Not applicable - this is a process rule.
- Not applicable - this is a discipline.
measurable:
- expectancy of setups taken with versus without a stated HTF framework
- number of no-trade days attributable to the framework gate
- P&L split by whether an HTF framework element was recorded before the entry
- count of LTF formations per day that pass structure but fail the context test
- stop-out rate of patterns taken with vs against the containing higher-timeframe candle's
  direction
