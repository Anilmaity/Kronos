ambiguities:
- '"Framework" is used interchangeably with bias, context and daily profile across the four
  streams and is never defined as a checklist.'
- The gate is applied by feel in real time - on the same charts he says a trade "could" be
  taken and that he simply does not want it, which is not a decidable rule.
- '''Higher timeframe reason'' is enumerated by example (candle two/three closure aligned
  with the 4-hour) rather than defined as a checklist.'
- He also says the structure of the rejected setup was good, so the rule is about permission
  to look rather than about the pattern's quality.
- '''Bearish expansion candle'' as the containing context is asserted from a bearish engulfing
  closure below a low; no threshold separates it from an ordinary down candle.'
- The rule is demonstrated on one PDF diagram; how far the directional veto extends in time
  (the whole higher-timeframe candle? until the next closure?) is not stated.
- '''hard time frame'' is the caption''s rendering of ''higher time frame''.'
- Tension with his own mechanical, coded indicator is not addressed.
- Same stream tolerates no-bias scalps on a 'reaction game' day; see no-bias-reaction-day.
