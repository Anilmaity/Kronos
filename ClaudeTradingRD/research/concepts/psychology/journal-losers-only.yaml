id: journal-losers-only
name: Journal Losers And Emotional Trades Only
variants:
  name:
  - Journal Losers And Emotional Trades Only (mature-stage policy)
  definition:
  - 'A stage-dependent journaling policy. Early in a trading journey the guest journaled everything,
    and says the sole purpose was to find consistency across repetitions and to establish
    that an edge existed at all; he states that not journaling early is self-sabotage. Once
    the repetitions are done and the model''s winners behave as expected, he stops journaling
    winners on the grounds that they carry no information to act on, and journals only two
    categories: losing trades, reviewed for what could have been done differently to reach
    break-even or avoid the trade, and trades taken for emotional reasons - revenge trades,
    or entries taken on gut feeling with no valid reason. The most common loser-review finding
    he names is having entered on too low a timeframe when moving up a timeframe would have
    shown he was buying or selling into the wrong end of an expansive move.

    '
definition: 'Trader T''s asymmetric journaling policy, stated twice while backtesting live.
  He logs every losing trade obsessively - with screenshots of the 4-hour, 1-hour, 5-minute
  and 1-minute charts, the pair, the reason for entry, the kill zone, the R and the time -
  and treats winners as optional, because the winners do not tell him anything he can act
  on. His stated payoff is pattern avoidance rather than confidence: he shows a live case
  where a previously logged loss (a setup taken after the lows had already been swept) is
  what keeps him out of an identical setup later in the same session.

  '
category: psychology
status: contested
aliases:
- log all the losers
- winners are less important
- I don't journal my winners
- journaling the losers
preconditions:
- A completed trade.
- 'For the mature policy: enough repetitions with one model that winners are recognisably
  routine.'
detection_rules:
- Log every loss. Logging a win is optional.
- For a loss, capture the 4-hour, 1-hour, 5-minute and 1-minute charts, the pair, the entry
  reason, the kill zone the trade fell in, the R and the time of day.
- Read the log back before taking a similar setup - the explicit purpose is to recognise and
  skip repeats of setups that previously failed.
- 'The journal template should be personal: different traders run different criteria, so the
  fields should match your own strategy.'
- 'Early stage: journal every trade.'
- 'Mature stage: journal a trade if it lost, or if it was entered emotionally (revenge, gut
  feeling, no valid reason).'
- For each logged loser, ask what could have been done differently to produce a break-even
  or a no-trade.
- Check specifically whether the entry timeframe was too low relative to the higher-timeframe
  context.
invalidation:
- Not applicable.
- Not applicable - this is a process rule.
measurable:
- recurrence rate of the same logged failure pattern before and after it is logged
- expectancy of setups that match a previously logged loss
- frequency of each loss cause across a journal sample
- share of losses attributable to entering on too low a timeframe
- count of emotionally-flagged trades per month as a tilt proxy
sources:
- video_id: wCtxmWe4KNc
  title: Back Testing Live Session With Trader T
  quote: my winners are not as important to log for me
- video_id: wCtxmWe4KNc
  title: Back Testing Live Session With Trader T
  quote: I think attacking the losses are way more important than the wins
- video_id: 1wKfc2gN4xg
  title: Trader Kane | The Mind Behind a Multi-Million Dollar Day Trader
ambiguities:
- Logging only losses means the base rate for the same pattern in winning trades is never
  recorded, so the avoidance decision is made on one half of the sample - he does not address
  this.
- The auto-captioner renders his word as 'attacking the losses'; from context the intended
  word is 'tracking'.
- The other guest in this unit who discusses journaling (Ben) logs everything with before-and-after
  screenshots, which is the opposite policy - two traders, not channel self-inconsistency.
- No review cadence is given.
- The boundary between the two stages is described qualitatively, as having done the repetitions,
  with no trade count or duration.
- Skipping winners forfeits the ability to measure whether winners are being managed optimally;
  the guest does not address this trade-off.
- This conflicts in emphasis with material elsewhere in the corpus that treats journaling
  as a continuous full-sample discipline; only this video is cited here.
