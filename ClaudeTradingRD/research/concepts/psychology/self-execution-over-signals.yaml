id: self-execution-over-signals
name: Execute Your Own Trades - No Signals, No Copying
definition: 'He refuses to give signals or show live entries in streams: he explains the bias
  and logic and the viewer must find and execute the entry. Stated reasons: liability for
  others'' trades, and that a trader who copies a streamer will not develop; if the explained
  logic cannot be turned into an entry by the viewer, he doubts they will make it.'
category: psychology
status: specified
detection_rules:
- 'Untestable behavioural rule: entries are the trader''s own decision from the stated logic.'
