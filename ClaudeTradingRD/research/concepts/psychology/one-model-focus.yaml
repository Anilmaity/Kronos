id: one-model-focus
name: One Model, One Concept, One Time (less is more)
definition: 'A deliberate reduction of the decision surface. Choose the single concept you
  can actually identify on a chart, pair it with a single time of day that fits your life,
  and refuse every other pattern. The stated reason is that each additional concept adds a
  decision, decisions are made under time pressure while price moves, and the harder problem
  - controlling your own execution - is already difficult enough without them.

  '
category: psychology
status: specified
aliases:
- less is more
- quality over quantity
- remove the shiny objects
preconditions:
- Enough screen time to know which concept the trader can reliably recognise in real time.
detection_rules:
- Select one entry concept, chosen by what you can identify rather than by what is claimed
  to be best.
- Select one time window that fits your daily life, and show up to it every day.
- If the model is present, take it. If it is not present, take nothing and stop looking.
- Do not add a second concept as a fallback when the first fails - the named failure pattern
  is cascading from breaker to order block to mean threshold to OTE to rejection block until
  nothing is legible.
- Remove sources of new concepts, including muting the educator you learned from, if they
  pull focus.
invalidation:
- Not applicable.
measurable:
- number of distinct setup types taken per month (should be one)
- hit rate and expectancy of the single model versus the mixed set it replaced
- count of days with zero trades - expected to be high
sources:
- video_id: zXtJSSkiNmo
  title: Ash Trades | The Journey To Profitability & The Unicorn Model
  quote: the key for me is less is more
ambiguities:
- No criterion is given for deciding that the chosen concept is the wrong one, as distinct
  from a normal losing streak - which the neighbouring rule forbids reacting to.
- The claim that repetition builds the recognition is asserted from five years of showing
  up to one open, not measured.
