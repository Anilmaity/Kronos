id: one-model-focus
name: One Model, One Concept, One Time (less is more)
definition: 'How to avoid watching charts for hours: define your model and what you are looking
  for, define when you look for it (he trades New York morning, sometimes swings Asia, never
  the PM session), watch only if a setup exists and otherwise stop paying attention. Also:
  no signals, because copying a streamer builds no skill.'
variants:
  definition:
  - After four years of study you do not need new information; apply it and stop making avoidable
    mistakes. He names the cycle loss -> oversize -> tilt -> blown account -> study more instead
    of fixing sizing. He will not add quarterly SMT or anything else; his model is based on
    swing points, which every reversal must form, so he does not fear alpha decay.
  - 'TTrades'' own version: to avoid watching charts all day, define the model, what you are
    looking for, and when you look for it; watch the charts only if the setup is present,
    otherwise stop paying attention.'
  - 'A deliberate reduction of the decision surface. Choose the single concept you can actually
    identify on a chart, pair it with a single time of day that fits your life, and refuse
    every other pattern. The stated reason is that each additional concept adds a decision,
    decisions are made under time pressure while price moves, and the harder problem - controlling
    your own execution - is already difficult enough without them.

    '
category: psychology
status: contested
aliases:
- stop trying to learn more
- define your setup
- less is more
- quality over quantity
- remove the shiny objects
preconditions:
- A defined model and a defined time window.
- Enough screen time to know which concept the trader can reliably recognise in real time.
detection_rules:
- Before the session, fix the model, the setup sought and the session window; outside that
  window, or with no setup forming, do not watch charts.
- After a loss-oversize-tilt cycle, fix sizing and behaviour rather than adding new concepts
  to the model.
- Define setup and look-time in advance.
- Setup present -> watch; absent -> stop watching.
- Select one entry concept, chosen by what you can identify rather than by what is claimed
  to be best.
- Select one time window that fits your daily life, and show up to it every day.
- If the model is present, take it. If it is not present, take nothing and stop looking.
- Do not add a second concept as a fallback when the first fails - the named failure pattern
  is cascading from breaker to order block to mean threshold to OTE to rejection block until
  nothing is legible.
- Remove sources of new concepts, including muting the educator you learned from, if they
  pull focus.
invalidation:
- Not applicable.
measurable:
- number of distinct setup types taken per month (should be one)
- hit rate and expectancy of the single model versus the mixed set it replaced
- count of days with zero trades - expected to be high
