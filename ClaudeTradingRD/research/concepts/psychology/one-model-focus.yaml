ambiguities:
- Adds host voice to a guest-sourced entry; no new mechanics.
- No criterion is given for deciding that the chosen concept is the wrong one, as distinct
  from a normal losing streak - which the neighbouring rule forbids reacting to.
- The claim that repetition builds the recognition is asserted from five years of showing
  up to one open, not measured.
